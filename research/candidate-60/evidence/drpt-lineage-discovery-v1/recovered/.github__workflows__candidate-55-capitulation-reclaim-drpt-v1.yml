name: candidate-55-capitulation-reclaim-drpt-v1

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-capitulation-reclaim-drpt-v1.yml"
      - "research/candidate-55/strategy_capitulation_reclaim_drpt.py"
      - "research/candidate-55/strategy_inventory_release_absorption.py"
      - "research/candidate-05/positioning_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-capitulation-reclaim-drpt-v1
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fresh-drpt-2024-03-04_2024-03-10
            start: "2024-03-04"
            end: "2024-03-10"
            calendar_days: 7
          - label: fresh-drpt-2024-12-02_2024-12-08
            start: "2024-12-02"
            end: "2024-12-08"
            calendar_days: 7
          - label: fresh-drpt-2025-05-12_2025-05-18
            start: "2025-05-12"
            end: "2025-05-18"
            calendar_days: 7
          - label: fresh-drpt-2026-01-12_2026-01-18
            start: "2026-01-12"
            end: "2026-01-18"
            calendar_days: 7
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 1

      - name: Materialize reused execution shell, router types and DRPT state owner
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_microauction.py research/candidate-51/router.py
          cp research/candidate-55/strategy_inventory_release_absorption.py research/candidate-51/strategy_inventory_release_absorption.py
          cp research/candidate-55/strategy_capitulation_reclaim_drpt.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor, compile and unit-check causal aggregation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-05 research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from types import SimpleNamespace
          from strategy import _complete_15m_candles, _atr15

          rows = []
          minute = 60 * 1_000_000_000
          for index in range(30):
              base = 100.0 + index * 0.1
              rows.append(SimpleNamespace(
                  ts_event=index * minute,
                  open=base,
                  high=base + 0.2,
                  low=base - 0.2,
                  close=base + 0.1,
                  volume=1.0,
              ))
          candles = _complete_15m_candles(rows)
          assert len(candles) == 2
          assert candles[0].ts_event == 14 * minute
          assert candles[1].ts_event == 29 * minute
          assert _atr15(candles, 1) > 0.0
          print("DRPT completed-candle contract pass")
          PY

      - name: Freeze policy, periods and falsification before results
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          strategy = base["strategy"]
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              strategy.pop(key, None)
          strategy.update({
              "cooldown_minutes": 0,
              "max_hold_minutes": 360,
              "drpt_bucket_minutes": 15,
              "drpt_extreme_lookback_bars": 24,
              "drpt_atr_period": 14,
              "drpt_body_atr_min": 0.75,
              "drpt_range_atr_min": 1.25,
              "drpt_close_location_max": 0.35,
              "drpt_volume_burst_min": 1.25,
              "drpt_entry_buffer_atr": 0.50,
              "drpt_stop_buffer_atr": 0.15,
              "drpt_arm_ttl_minutes": 180,
              "drpt_target_net_r": 2.50,
              "drpt_peak_activation_r": 1.25,
              "drpt_peak_retrace_r": 0.75,
              "drpt_time_in_loss_minutes": 90,
          })
          work = Path(".work/candidate-55-capitulation-reclaim-drpt-v1")
          work.mkdir(parents=True, exist_ok=True)
          config_path = work / "frozen-config.json"
          config_path.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
          manifest = {
              "candidate": "candidate-55-capitulation-reclaim-drpt-v1",
              "label": os.environ["LABEL"],
              "interval": [os.environ["START"], os.environ["END"]],
              "calendar_days": int(os.environ["CALENDAR_DAYS"]),
              "evidence_role": "fresh-to-drpt-v1-not-global-holdout",
              "period_selected_before_result": True,
              "external_source": {
                  "repository": "grinay/geektrade-strategies",
                  "commit": "855641d4667c6dd6bac2815690b15cd9d4991a6b",
                  "strategy": "dump-reversal-peak-trail-v2",
                  "reused": [
                      "arm after capitulation",
                      "update leg extreme",
                      "buffered stop-entry/reclaim",
                      "expiry",
                      "peak retrace",
                      "time in loss"
                  ]
              },
              "prediction": {
                  "mechanism": "price invalidation of the active liquidation leg must remove the immediate-stop anatomy seen in adaptive-response v2",
                  "expected_trade_anatomy": "fewer knife-catch losses, winners can persist toward 2.5R modeled net objective",
                  "falsification": "non-positive fresh expectancy, repeated rapid stops, or density materially below one completed trade per calendar day"
              },
              "engine": "NautilusTrader BacktestNode",
              "universe": ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"],
              "one_global_entry_or_position": True,
              "current_nav_planned_loss_fraction": 0.03,
              "strategy_sha256": hashlib.sha256(Path("research/candidate-51/strategy.py").read_bytes()).hexdigest(),
              "router_sha256": hashlib.sha256(Path("research/candidate-51/router.py").read_bytes()).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
          }
          (work / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run one continuous Nautilus account
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set +e
          output="artifacts/candidate-55/capitulation-reclaim-drpt-v1-${LABEL}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/candidate-55-capitulation-reclaim-drpt-v1/frozen-config.json \
            --start "$START" --end "$END" \
            --cache ".cache/candidate-55-capitulation-reclaim-drpt-v1-${LABEL}" \
            --output "$output" \
            --workspace ".work/candidate-55-capitulation-reclaim-drpt-v1-${LABEL}"
          code="$?"
          echo "$code" > .work/candidate-55-capitulation-reclaim-drpt-v1/exit-code.txt
          exit 0

      - name: Write compact causal summary
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          label = os.environ["LABEL"]
          days = int(os.environ["CALENDAR_DAYS"])
          root = Path("artifacts/candidate-55") / f"capitulation-reclaim-drpt-v1-{label}"
          root.mkdir(parents=True, exist_ok=True)
          metrics_path = root / "metrics.json"
          diagnostics_path = root / "strategy_diagnostics.json"
          closed_path = root / "closed_scenarios.json"
          exit_path = Path(".work/candidate-55-capitulation-reclaim-drpt-v1/exit-code.txt")
          summary = {
              "candidate": "candidate-55-capitulation-reclaim-drpt-v1",
              "label": label,
              "calendar_days": days,
              "evidence_role": "fresh-to-drpt-v1-not-global-holdout",
              "exit_code": int(exit_path.read_text()) if exit_path.is_file() else None,
              "produced": metrics_path.is_file() and diagnostics_path.is_file(),
          }
          if summary["produced"]:
              metrics = json.loads(metrics_path.read_text())
              diagnostics = json.loads(diagnostics_path.read_text())
              closed = json.loads(closed_path.read_text()) if closed_path.is_file() else []
              summary.update(
                  metrics=metrics,
                  trades_per_calendar_day=float(metrics.get("trades") or 0) / days,
                  closed_scenarios=closed,
                  causal_anatomy={
                      key: diagnostics.get(key)
                      for key in (
                          "capitulation_long_events",
                          "capitulation_short_events",
                          "arm_extensions",
                          "arm_expirations",
                          "reclaim_candidates",
                          "reclaim_competitions",
                          "reclaim_entries",
                          "geometry_rejections",
                          "peak_retrace_activations",
                          "peak_retrace_exits",
                          "time_in_loss_exits",
                          "arm_events_by_symbol",
                          "reclaim_entries_by_symbol",
                          "selected_symbols"
                      )
                  },
                  execution={
                      key: diagnostics.get(key)
                      for key in (
                          "entry_submissions",
                          "order_rejections",
                          "entry_expirations",
                          "global_position_violations",
                          "max_open_positions_observed",
                          "max_simultaneous_entry_intents"
                      )
                  },
              )
          (root / "DRPT_SUMMARY.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-capitulation-reclaim-drpt-v1-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-55/capitulation-reclaim-drpt-v1-${{ matrix.label }}/**
            .work/candidate-55-capitulation-reclaim-drpt-v1/manifest.json
            .work/candidate-55-capitulation-reclaim-drpt-v1/exit-code.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact run completion
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          code="$(cat .work/candidate-55-capitulation-reclaim-drpt-v1/exit-code.txt)"
          test "$code" -eq 0
          root="artifacts/candidate-55/capitulation-reclaim-drpt-v1-${LABEL}"
          test -s "$root/metrics.json"
          test -s "$root/strategy_diagnostics.json"
