[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-ict-4-live"
version = "0.1.0"
description = "Shared NautilusTrader research foundation for independent SMC/ICT candidates"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nautilus_trader==1.230.0",
]

[project.scripts]
smc4 = "smc_ict_4.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["smc_ict_4*"]

[tool.uv]
package = true
