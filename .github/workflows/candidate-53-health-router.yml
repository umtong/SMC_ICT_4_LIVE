name: candidate-53-counterfactual-health-matrix

on:
  push:
    branches: ["research/candidate-53"]
    paths:
      - "research/candidate-53/health_strategy.py"
      - "research/candidate-53/health_launch.py"
      - "research/candidate-53/test_health.py"
      - ".github/workflows/candidate-53-health-router.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-53
          fetch-depth: 0

      - name: Materialize frozen Candidate 47 execution family
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/candidate-47:refs/remotes/origin/research/candidate-47
          rm -rf .deps/c47
          mkdir -p .deps
          git worktree add --detach .deps/c47 refs/remotes/origin/research/candidate-47
          cp research/candidate-53/health_strategy.py .deps/c47/research/candidate-47/candidate53_health_strategy.py
          cp research/candidate-53/health_launch.py .deps/c47/research/candidate-47/candidate53_health_launch.py

      - name: Verify runtime and causal health contracts
        shell: bash
        env:
          PYTHONPATH: research/candidate-53:.deps/c47/research/candidate-47:.deps/c47/research/candidate-16:.deps/c47/research/candidate-05
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            .deps/c47/research/candidate-47/candidate53_health_strategy.py \
            .deps/c47/research/candidate-47/candidate53_health_launch.py \
            research/candidate-53/test_health.py
          python - <<'PY'
          import inspect
          import test_health
          tests = [(name, fn) for name, fn in inspect.getmembers(test_health, inspect.isfunction) if name.startswith('test_')]
          assert tests
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'executed {len(tests)} Candidate 53 health contracts')
          PY

  weekly-diagnostic:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "2026-02-09_2026-02-15", start: "2026-02-09", end: "2026-02-15"}
          - {label: "2026-03-02_2026-03-08", start: "2026-03-02", end: "2026-03-08"}
          - {label: "2026-03-23_2026-03-29", start: "2026-03-23", end: "2026-03-29"}
          - {label: "2026-04-13_2026-04-19", start: "2026-04-13", end: "2026-04-19"}
          - {label: "2026-05-25_2026-05-31", start: "2026-05-25", end: "2026-05-31"}
          - {label: "2026-06-22_2026-06-28", start: "2026-06-22", end: "2026-06-28"}
          - {label: "2026-07-01_2026-07-07", start: "2026-07-01", end: "2026-07-07"}
          - {label: "2026-07-15_2026-07-21", start: "2026-07-15", end: "2026-07-21"}
          - {label: "2026-07-22_2026-07-28", start: "2026-07-22", end: "2026-07-28"}
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: .deps/c47/research/candidate-47:.deps/c47/research/candidate-16:.deps/c47/research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-53-health/${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-53
          fetch-depth: 0

      - name: Materialize frozen Candidate 47 execution family
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/candidate-47:refs/remotes/origin/research/candidate-47
          rm -rf .deps/c47
          mkdir -p .deps
          git worktree add --detach .deps/c47 refs/remotes/origin/research/candidate-47
          cp research/candidate-53/health_strategy.py .deps/c47/research/candidate-47/candidate53_health_strategy.py
          cp research/candidate-53/health_launch.py .deps/c47/research/candidate-47/candidate53_health_launch.py

      - name: Run one four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python .deps/c47/research/candidate-47/candidate53_health_launch.py \
            --config .deps/c47/research/candidate-47/ichifan_structural_config.json \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --cache ".cache/candidate-53-health/${{ matrix.label }}" \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Print result and verify account invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          m = json.loads((root / 'metrics.json').read_text())
          d = m['strategy_diagnostics']
          result = {k: m.get(k) for k in (
              'ending_nav','total_return','geometric_daily_growth','max_drawdown',
              'trades','wins','losses','win_rate','profit_factor','expectancy_usdt',
              'active_days','gate_pass'
          )}
          result.update({
              'virtual_signals': d.get('candidate53_virtual_probe_signals', 0),
              'virtual_resolutions': d.get('candidate53_virtual_probe_resolutions', 0),
              'virtual_positive': d.get('candidate53_virtual_probe_positive', 0),
              'virtual_negative': d.get('candidate53_virtual_probe_negative', 0),
              'health_checks': d.get('candidate53_health_entry_checks', 0),
              'health_on_entries': d.get('candidate53_health_on_entries', 0),
              'health_unknown_entries': d.get('candidate53_health_unknown_entries', 0),
              'health_off_rejections': d.get('candidate53_health_off_rejections', 0),
              'health_last_state': d.get('candidate53_health_last_state'),
              'health_last_score': d.get('candidate53_health_last_score'),
              'health_last_sample_count': d.get('candidate53_health_last_sample_count'),
          })
          print(json.dumps(result, indent=2, sort_keys=True))
          assert m['engine'] == 'NautilusTrader BacktestNode'
          assert m['single_continuous_account'] is True
          assert m['single_strategy_process'] is True
          assert m['global_entry_or_position_limit'] == 1
          assert m['gate_checks']['risk_fraction_exactly_three_percent'] is True
          assert m['gate_checks']['no_global_position_violation'] is True
          assert m['gate_checks']['nautilus_positions_match'] is True
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-53-health-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-53-health/${{ matrix.label }}/metrics.json
            artifacts/candidate-53-health/${{ matrix.label }}/strategy_diagnostics.json
            artifacts/candidate-53-health/${{ matrix.label }}/closed_scenarios.json
            artifacts/candidate-53-health/${{ matrix.label }}/scenario_events.jsonl
            artifacts/candidate-53-health/${{ matrix.label }}/candidate53_virtual_probes.json
            artifacts/candidate-53-health/${{ matrix.label }}/console.log
          if-no-files-found: warn
          retention-days: 30
