name: candidate-easychart-re1-continuation-fast-alpha

on:
  push:
    branches: ["ML_a"]
    paths:
      - ".github/workflows/candidate-easychart-re1-continuation-fast-alpha.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-continuation-fast-alpha
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  july-rich-episode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - policy: target_refresh
            runner: run_mtf_backtest_re1_continuation_target_refresh.py
          - policy: first_return
            runner: run_mtf_backtest_re1_continuation_first_return.py
          - policy: ob_or_fvg
            runner: run_mtf_backtest_re1_continuation_footprint.py
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-continuation-fast/${{ matrix.policy }}
      OUT: artifacts/candidate-easychart-re1-continuation-fast/${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile selected alpha path
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_continuation_target_refresh.py \
            research/candidate-easychart_re1/easychart_re1_continuation_first_return.py \
            research/candidate-easychart_re1/easychart_re1_continuation_footprint.py \
            research/candidate-easychart_re1/${{ matrix.runner }}
      - name: Run four-symbol continuous account on continuation-rich days
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/${{ matrix.runner }} \
            --start 2026-07-01 \
            --end 2026-07-03 \
            --warmup-days 7 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0
      - name: Print trade-level alpha result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path("${{ env.OUT }}")
          metrics_path = root / "metrics.json"
          trades_path = root / "trade_audit.csv"
          events_path = root / "scenario_events.jsonl"
          result = {"policy": "${{ matrix.policy }}"}
          if metrics_path.exists():
              result["metrics"] = json.loads(metrics_path.read_text())
          trades = pd.read_csv(trades_path) if trades_path.exists() else pd.DataFrame()
          if not trades.empty:
              result["trades"] = trades[[
                  column for column in (
                      "symbol", "side", "family", "planned_gross_rr",
                      "actual_net_r", "duration_ns", "exit_role", "ts_opened",
                  ) if column in trades
              ]].to_dict("records")
          counts = {}
          if events_path.exists():
              for line in events_path.read_text().splitlines():
                  event = json.loads(line)
                  kind = str(event.get("scenario_kind", ""))
                  if "local_continuation" in kind or "fvg_fallback" in kind:
                      counts[kind] = counts.get(kind, 0) + 1
          result["continuation_event_counts"] = counts
          print("FAST_ALPHA_RESULT=" + json.dumps(result, sort_keys=True))
          PY
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-continuation-fast-${{ matrix.policy }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-continuation-fast/${{ matrix.policy }}/**
          if-no-files-found: warn
          retention-days: 30
