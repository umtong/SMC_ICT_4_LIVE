name: candidate-03-native-equity-order-probe

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-equity-order-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare PositionClosed callback NAV with final native NAV
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
          out=artifacts/candidate-03/equity-order-probe
          rm -rf "$out" && mkdir -p "$out" && chmod -R 0777 artifacts
          docker pull "$IMAGE"

          cat > "$out/probe_strategy.py" <<'PY'
          from __future__ import annotations

          import json
          from decimal import Decimal
          from pathlib import Path

          from nautilus_trader.config import StrategyConfig
          from nautilus_trader.model.data import QuoteTick
          from nautilus_trader.model.enums import OrderSide, TimeInForce
          from nautilus_trader.model.events import OrderFilled, PositionClosed
          from nautilus_trader.model.identifiers import InstrumentId
          from nautilus_trader.trading.strategy import Strategy


          class ProbeConfig(StrategyConfig, frozen=True):
              instrument_id: InstrumentId
              output: str


          class Probe(Strategy):
              def __init__(self, config: ProbeConfig) -> None:
                  super().__init__(config)
                  self.instrument = None
                  self.entry_id = None
                  self.quotes = 0
                  self.closed = False
                  self.records = {}

              def scalar_equity(self) -> float:
                  values = self.portfolio.equity(self.instrument.venue)
                  money = values[self.instrument.quote_currency]
                  return float(money)

              def account_total(self) -> float:
                  account = self.portfolio.account(self.instrument.venue)
                  return float(account.balance_total(self.instrument.quote_currency))

              def on_start(self) -> None:
                  self.instrument = self.cache.instrument(self.config.instrument_id)
                  self.records["before_entry_equity"] = self.scalar_equity()
                  self.records["before_entry_account"] = self.account_total()
                  self.subscribe_quote_ticks(self.config.instrument_id)

              def on_quote_tick(self, tick: QuoteTick) -> None:
                  self.quotes += 1
                  if self.entry_id is None:
                      order = self.order_factory.market(
                          instrument_id=self.config.instrument_id,
                          order_side=OrderSide.BUY,
                          quantity=self.instrument.make_qty(Decimal("1")),
                          time_in_force=TimeInForce.GTC,
                      )
                      self.entry_id = order.client_order_id
                      self.submit_order(order)
                      return
                  if self.quotes >= 5 and not self.closed and not self.portfolio.is_flat(self.config.instrument_id):
                      self.closed = True
                      self.close_all_positions(self.config.instrument_id, reduce_only=True)

              def on_order_filled(self, event: OrderFilled) -> None:
                  if event.client_order_id == self.entry_id:
                      self.records["inside_entry_fill_equity"] = self.scalar_equity()
                      self.records["inside_entry_fill_account"] = self.account_total()

              def on_position_closed(self, event: PositionClosed) -> None:
                  self.records["inside_position_closed_equity"] = self.scalar_equity()
                  self.records["inside_position_closed_account"] = self.account_total()
                  self.records["event_realized_pnl"] = str(event.realized_pnl)
                  self.records["event_realized_return"] = float(event.realized_return)

              def on_stop(self) -> None:
                  self.records["on_stop_equity"] = self.scalar_equity()
                  self.records["on_stop_account"] = self.account_total()
                  Path(self.config.output).write_text(
                      json.dumps(self.records, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
          PY

          cat > "$out/run_probe.py" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from decimal import Decimal
          from pathlib import Path

          from nautilus_trader.backtest.node import BacktestDataConfig
          from nautilus_trader.backtest.node import BacktestEngineConfig
          from nautilus_trader.backtest.node import BacktestNode
          from nautilus_trader.backtest.node import BacktestRunConfig
          from nautilus_trader.backtest.node import BacktestVenueConfig
          from nautilus_trader.config import ImportableStrategyConfig
          from nautilus_trader.model.data import QuoteTick
          from nautilus_trader.model.identifiers import InstrumentId, Symbol, Venue
          from nautilus_trader.model.instruments import CryptoPerpetual
          from nautilus_trader.model.objects import Currency, Money, Price, Quantity
          from nautilus_trader.persistence.catalog import ParquetDataCatalog

          root = Path("/workspace/artifacts/candidate-03/equity-order-probe")
          sys.path.insert(0, str(root))
          usdt = Currency.from_str("USDT")
          inst = CryptoPerpetual(
              instrument_id=InstrumentId.from_str("BTCUSDT-PERP.BINANCE"),
              raw_symbol=Symbol("BTCUSDT"),
              base_currency=Currency.from_str("BTC"),
              quote_currency=usdt,
              settlement_currency=usdt,
              is_inverse=False,
              price_precision=1,
              size_precision=3,
              price_increment=Price.from_str("0.1"),
              size_increment=Quantity.from_str("0.001"),
              ts_event=0,
              ts_init=0,
              multiplier=Quantity.from_int(1),
              lot_size=Quantity.from_str("0.001"),
              min_quantity=Quantity.from_str("0.001"),
              min_notional=Money.from_str("5 USDT"),
              margin_init=Decimal("0"),
              margin_maint=Decimal("0.004"),
              maker_fee=Decimal("0.0002"),
              taker_fee=Decimal("0.0005"),
          )
          base = 1_700_000_000_000_000_000
          mids = (40_000.0, 40_010.0, 40_020.0, 40_030.0, 40_040.0, 40_050.0, 40_060.0)
          quotes = [
              QuoteTick(
                  instrument_id=inst.id,
                  bid_price=inst.make_price(mid - 0.5),
                  ask_price=inst.make_price(mid + 0.5),
                  bid_size=inst.make_qty(Decimal("2")),
                  ask_size=inst.make_qty(Decimal("2")),
                  ts_event=base + index * 1_000_000_000,
                  ts_init=base + index * 1_000_000_000,
              )
              for index, mid in enumerate(mids)
          ]
          catalog_path = root / "catalog"
          catalog = ParquetDataCatalog(str(catalog_path))
          catalog.write_data([inst]); catalog.write_data(quotes)
          strategy_output = root / "strategy.json"
          strategy = ImportableStrategyConfig(
              strategy_path="probe_strategy:Probe",
              config_path="probe_strategy:ProbeConfig",
              config={"instrument_id": inst.id, "output": str(strategy_output)},
          )
          run_config = BacktestRunConfig(
              engine=BacktestEngineConfig(strategies=[strategy], run_analysis=True),
              data=[BacktestDataConfig(catalog_path=str(catalog_path), data_cls=QuoteTick, instrument_id=inst.id)],
              venues=[BacktestVenueConfig(
                  name="BINANCE", oms_type="NETTING", account_type="MARGIN", base_currency="USDT",
                  starting_balances=["100_000 USDT"], default_leverage=1.0,
                  book_type="L1_MBP", reject_stop_orders=False, use_position_ids=False,
                  use_reduce_only=True, bar_execution=False, trade_execution=False,
                  liquidity_consumption=True,
              )],
              raise_exception=True,
              dispose_on_completion=False,
          )
          node = BacktestNode(configs=[run_config])
          native = node.run()[0]
          engine = node.get_engine(run_config.id)
          portfolio = engine.kernel.portfolio
          account = portfolio.account(Venue("BINANCE"))
          payload = json.loads(strategy_output.read_text(encoding="utf-8"))
          payload["after_run_equity"] = float(portfolio.equity(Venue("BINANCE"))[usdt])
          payload["after_run_account"] = float(account.balance_total(usdt))
          payload["native_orders"] = native.total_orders
          payload["native_positions"] = native.total_positions
          (root / "result.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          node.dispose()
          PY

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=/workspace/$out python $out/run_probe.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-03-equity-order-${{ github.sha }}
          path: artifacts/candidate-03/equity-order-probe/result.json
          if-no-files-found: error
          retention-days: 3
