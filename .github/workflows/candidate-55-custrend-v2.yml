name: candidate-55-custrend-v2

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-custrend-v2.yml"
      - "research/candidate-55/strategy_custrend_buffer.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-55-custrend-v2
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 0
      - name: Materialize repaired completed solution
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router_zaratustra_v13.py
          cp research/candidate-55/router_custrend.py research/candidate-51/router_custrend.py
          cp research/candidate-55/router_custrend_fixed.py research/candidate-51/router.py
          cp research/candidate-55/strategy_mbe2.py research/candidate-51/strategy_mbe2.py
          cp research/candidate-55/strategy_custrend.py research/candidate-51/strategy_custrend.py
          cp research/candidate-55/strategy_custrend_buffer.py research/candidate-51/strategy.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from strategy import Candidate35Config, Candidate35Strategy
          assert Candidate35Strategy.__name__ == "Candidate35Strategy"
          print("CusTrend 20,000-minute buffer materialized")
          PY
      - name: Run corrected forward tournament
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_custrend_tournament.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-custrend-v2-${{ github.sha }}
          path: artifacts/candidate-55/custrend-v1-*
          if-no-files-found: warn
