name: candidate-05-v46-stateful-91d-direct

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v46-stateful-91d-direct.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v46-stateful-91d-direct
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  stateful-91d:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v40_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v46-stateful-91d-direct
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and unchanged v46 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v45_external_active_inventory_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_breakaway_state_logic.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_basis_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_reset_logic.py' -v

      - name: Probe required Binance archive coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python - <<'PY'
          from datetime import date, timedelta
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          start = date.fromisoformat("2024-02-28")
          end = date.fromisoformat("2024-05-30")
          base = "https://data.binance.vision/data/futures/um/daily"
          endpoints = {
              "klines": lambda d: f"{base}/klines/BTCUSDT/1m/BTCUSDT-1m-{d}.zip",
              "aggTrades": lambda d: f"{base}/aggTrades/BTCUSDT/BTCUSDT-aggTrades-{d}.zip",
              "bookDepth": lambda d: f"{base}/bookDepth/BTCUSDT/BTCUSDT-bookDepth-{d}.zip",
              "metrics": lambda d: f"{base}/metrics/BTCUSDT/BTCUSDT-metrics-{d}.zip",
              "premiumIndexKlines": lambda d: f"{base}/premiumIndexKlines/BTCUSDT/1m/BTCUSDT-1m-{d}.zip",
          }
          rows = []
          missing = {name: [] for name in endpoints}
          day = start
          while day <= end:
              stamp = day.isoformat()
              row = {"day": stamp}
              for name, make_url in endpoints.items():
                  request = urllib.request.Request(make_url(stamp), method="HEAD")
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status = int(response.status)
                  except urllib.error.HTTPError as exc:
                      status = int(exc.code)
                  except Exception as exc:
                      status = f"ERROR:{type(exc).__name__}:{exc}"
                  row[name] = status
                  if status != 200:
                      missing[name].append(stamp)
              rows.append(row)
              day += timedelta(days=1)
          result = {
              "schema": "candidate-05-binance-coverage-v1",
              "start": start.isoformat(),
              "end": end.isoformat(),
              "rows": rows,
              "missing": missing,
              "all_required_available": all(not values for values in missing.values()),
          }
          root = Path(os.environ["ROOT"])
          (root / "coverage.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"complete={'true' if result['all_required_available'] else 'false'}\n")
          print(json.dumps({
              "start": result["start"],
              "end": result["end"],
              "all_required_available": result["all_required_available"],
              "missing_counts": {key: len(value) for key, value in missing.items()},
              "first_missing": {key: (value[0] if value else None) for key, value in missing.items()},
              "last_missing": {key: (value[-1] if value else None) for key, value in missing.items()},
          }, indent=2, sort_keys=True))
          PY

      - name: Run one uninterrupted 91-day BTC path through NautilusTrader
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-05/v40_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-05-30 \
            --cache .cache/candidate-05-v46-stateful-91d-direct \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify authoritative NautilusTrader evidence
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/metrics.json"
          for file in run.json data_manifest.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
            test -s "$ROOT/$file"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v46-stateful-91d-direct-${{ github.sha }}
          path: artifacts/candidate-05-v46-stateful-91d-direct/**
          if-no-files-found: warn
          retention-days: 90
