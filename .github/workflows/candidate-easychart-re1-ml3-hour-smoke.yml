name: candidate-easychart-re1-ml3-hour-smoke

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/candidate-easychart-re1-ml3-hour-smoke.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-ml3-hour-smoke
  cancel-in-progress: true

permissions: {contents: read, packages: read}

jobs:
  hour-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-ml3/hour-smoke
      OUT: artifacts/candidate-easychart-re1-ml3/hour-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Traverse every account timeframe in Nautilus
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_ml3_base.py \
            --start 2025-08-10 \
            --end 2025-08-10 \
            --warmup-days 1 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2
      - name: Preserve runtime trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-ml3-hour-smoke-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-ml3/hour-smoke/**
          if-no-files-found: warn
          retention-days: 30
