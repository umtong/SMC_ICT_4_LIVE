name: candidate-08-opening-type-router-bootstrap-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-opening-type-router-bootstrap-v1"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-opening-type-router-bootstrap-v1
  cancel-in-progress: true

jobs:
  bootstrap-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      ARCHIVE: research/candidate-08/opening_type_router_bundle.tgz
      MARKER: research/candidate-08/.run-opening-type-router-bootstrap-v1
      OUTPUT_DIR: research/candidate-08/evidence/opening-type-state-router-v1
      FIRST_DIR: research/candidate-08/evidence/opening-type-state-router-v1/first
      SCREEN_DIR: research/candidate-08/evidence/opening-type-state-router-v1/screen
      CACHE_DIR: .cache/candidate-08-opening-type-state-router-v1
      CONFIG: research/candidate-08/config_opening_type_state_router_btc_v1.json
      PATTERN_CONFIG: research/candidate-08/config_range_fvg.json
      LOG: research/candidate-08/evidence/opening-type-state-router-v1/workflow.log
      STATUS: research/candidate-08/evidence/opening-type-state-router-v1/exit_status.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore checksum-verified market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/candidate-08-opening-type-state-router-v1
          key: candidate-08-opening-type-state-router-v1-${{ hashFiles('research/candidate-08/opening_type_router_bundle.tgz') }}
          restore-keys: |
            candidate-08-opening-type-state-router-v1-
            candidate-08-opening-drive-acceptance-v1-
            candidate-08-session-value-migration-v1-
            candidate-08-flow-response-auction-

      - name: Extract, test, and run frozen evaluation
        id: research
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$OUTPUT_DIR" /tmp/opening-type-router
          mkdir -p "$OUTPUT_DIR" "$CACHE_DIR" /tmp/opening-type-router
          set +e
          (
            set -euo pipefail
            tar -xzf "$ARCHIVE" -C /tmp/opening-type-router
            install -m 0644 /tmp/opening-type-router/opening_type_state_router_signals_v1.py research/candidate-08/
            install -m 0644 /tmp/opening-type-router/test_opening_type_state_router_signals_v1.py research/candidate-08/
            install -m 0644 /tmp/opening-type-router/run_opening_type_state_router_nautilus_v1.py research/candidate-08/
            install -m 0644 /tmp/opening-type-router/config_opening_type_state_router_btc_v1.json research/candidate-08/
            install -m 0644 /tmp/opening-type-router/OPENING_TYPE_STATE_ROUTER_V1_PREREGISTRATION.md research/candidate-08/
            install -m 0644 /tmp/opening-type-router/candidate-08-opening-type-state-router-v1.yml .github/workflows/candidate-08-opening-type-state-router-v1.yml

            smc4 doctor
            python -m compileall -q \
              research/candidate-08/opening_type_state_router_signals_v1.py \
              research/candidate-08/test_opening_type_state_router_signals_v1.py \
              research/candidate-08/run_opening_type_state_router_nautilus_v1.py
            python research/candidate-08/test_opening_type_state_router_signals_v1.py -v

            set +e
            python research/candidate-08/run_opening_type_state_router_nautilus_v1.py \
              --suite first --config "$CONFIG" --pattern-config "$PATTERN_CONFIG" \
              --output "$FIRST_DIR" --data-cache "$CACHE_DIR"
            first_status=$?
            set -e
            printf '%s\n' "$first_status" > "$OUTPUT_DIR/first_command_status.txt"

            python - <<'PY'
          import json, os
          from pathlib import Path
          first = Path(os.environ['FIRST_DIR'])
          suite = first / 'suite_metrics.json'
          metrics = first / 'screen-01' / 'metrics.json'
          gate = False
          if suite.exists():
              payload = json.loads(suite.read_text())
              gate = bool(payload.get('window_results', [{}])[0].get('first_window_gate_passed', False))
          elif metrics.exists():
              payload = json.loads(metrics.read_text())
              gate = bool(payload.get('first_window_gate_passed', False))
          Path(os.environ['OUTPUT_DIR']).joinpath('promote_screen.txt').write_text('1\n' if gate else '0\n')
          print(json.dumps({'first_window_gate_passed': gate}, indent=2))
          PY

            screen_status=0
            if [[ "$first_status" == "0" && "$(cat "$OUTPUT_DIR/promote_screen.txt")" == "1" ]]; then
              set +e
              python research/candidate-08/run_opening_type_state_router_nautilus_v1.py \
                --suite screen --config "$CONFIG" --pattern-config "$PATTERN_CONFIG" \
                --output "$SCREEN_DIR" --reuse-first-dir "$FIRST_DIR" \
                --data-cache "$CACHE_DIR"
              screen_status=$?
              set -e
            fi
            printf '%s\n' "$screen_status" > "$OUTPUT_DIR/screen_command_status.txt"

            python - <<'PY'
          import json, os
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          first_dir = Path(os.environ['FIRST_DIR'])
          screen_dir = Path(os.environ['SCREEN_DIR'])

          def read(path):
              return json.loads(path.read_text()) if path.exists() else None

          def implementation_clean(metrics):
              checks = dict(metrics.get('first_window_gate_checks', {}))
              if checks:
                  return (
                      int(metrics.get('execution_failures', 0)) == 0
                      and bool(checks.get('entry_causality', False))
                      and bool(checks.get('fill_adjusted_risk_budget_respected', False))
                      and bool(checks.get('planned_risk_budget_respected', False))
                      and bool(checks.get('realized_loss_budget_respected', False))
                      and bool(checks.get('funding_cost_state_is_causal_and_complete', False))
                      and bool(checks.get('no_residual_exposure', False))
                      and bool(checks.get('no_unexpected_or_liquidation_closes', False))
                  )
              contract = dict(metrics.get('contract_checks', {}))
              return (
                  int(metrics.get('execution_failures', 0)) == 0
                  and int(contract.get('entry_fill_before_signal_count', 0)) == 0
                  and int(contract.get('fill_adjusted_loss_over_budget_count', 0)) == 0
                  and int(contract.get('planned_loss_over_budget_count', 0)) == 0
                  and int(contract.get('realized_loss_over_budget_count', 0)) == 0
                  and int(contract.get('missing_funding_cost_state_count', 0)) == 0
                  and int(metrics.get('unexpected_or_liquidation_closes', 0)) == 0
                  and int(metrics.get('open_orders_after_run', 0)) == 0
                  and int(metrics.get('open_positions_after_run', 0)) == 0
              )

          def compact(metrics):
              return {
                  'window': metrics.get('window'),
                  'signals': int(metrics.get('detector', {}).get('signals', 0)),
                  'closed_trades': int(metrics.get('position_metrics', {}).get('closed_trades', 0)),
                  'wins': int(metrics.get('position_metrics', {}).get('wins', 0)),
                  'win_rate': float(metrics.get('position_metrics', {}).get('win_rate', 0.0)),
                  'total_return': float(metrics.get('total_return', 0.0)),
                  'daily_geometric_growth': float(metrics.get('daily_geometric_growth', 0.0)),
                  'maximum_drawdown': float(metrics.get('maximum_realized_equity_drawdown', 0.0)),
                  'implementation_clean': implementation_clean(metrics),
                  'gate_passed': bool(metrics.get('first_window_gate_passed', False)),
              }

          first_suite = read(first_dir / 'suite_metrics.json')
          first_metrics = read(first_dir / 'screen-01' / 'metrics.json')
          first_status = int((output / 'first_command_status.txt').read_text().strip())
          screen_status = int((output / 'screen_command_status.txt').read_text().strip())
          screen_suite = read(screen_dir / 'suite_metrics.json')
          screen_metrics = [read(path) for path in sorted(screen_dir.glob('screen-*/metrics.json'))]
          screen_metrics = [item for item in screen_metrics if item is not None]

          if first_metrics is None:
              classification = 'IMPLEMENTATION_FAILURE_NO_FIRST_METRICS'
              next_action = 'FIX_IMPLEMENTATION_ONLY_AND_RERUN_IDENTICAL_FROZEN_WEEK'
              first_compact = None
              diagnostics = {}
          else:
              first_compact = compact(first_metrics)
              manifest = read(first_dir / 'screen-01' / 'data_manifest.json') or {}
              diagnostics = manifest.get('assets', {}).get('BTCUSDT', {}).get('detector_diagnostics', {})
              if not first_compact['implementation_clean'] or first_status != 0:
                  classification = 'IMPLEMENTATION_OR_EXECUTION_CONTRACT_FAILURE_FIRST_WEEK'
                  next_action = 'FIX_IMPLEMENTATION_ONLY_AND_RERUN_IDENTICAL_FROZEN_WEEK'
              elif not first_compact['gate_passed']:
                  if first_compact['signals'] == 0:
                      classification = 'CLEAN_LOGIC_FAILURE_NO_TRADEABLE_OPENING_TYPES'
                  elif first_compact['closed_trades'] < 3:
                      classification = 'CLEAN_LOGIC_FAILURE_INSUFFICIENT_OPENING_TYPE_FREQUENCY'
                  elif first_compact['total_return'] <= 0.0:
                      classification = 'CLEAN_LOGIC_FAILURE_OPENING_TYPE_EDGE_NEGATIVE'
                  else:
                      classification = 'FIRST_GATE_FAILED_OTHER_CLEAN_CONTRACT'
                  next_action = 'DECOMPOSE_INITIATIVE_AND_RESPONSIVE_FAMILY_ONCE_THEN_REJECT_OR_REBUILD'
              elif screen_suite is not None and bool(screen_suite.get('suite_gate_passed', False)) and bool(screen_suite.get('goal_met', False)):
                  classification = 'PROMOTE_TO_LONGER_BTC_EVALUATION'
                  next_action = 'RUN_FROZEN_LONGER_BTC_EVALUATION'
              elif screen_suite is not None:
                  classification = 'MULTIWEEK_GENERALIZATION_OR_GROWTH_FAILURE'
                  next_action = 'REJECT_OR_REBUILD_FROM_DOMINANT_FAMILY_FAILURE'
              else:
                  classification = 'SCREEN_RUN_INCOMPLETE_WITH_REPRODUCIBLE_FIRST_WINDOW'
                  next_action = 'FIX_RUNNER_OR_EVIDENCE_ONLY_AND_RESUME_FROZEN_SCREEN'

          decision = {
              'candidate': 'candidate-08-opening-type-state-router-btc-nautilus-v1',
              'classification': classification,
              'first_window': first_compact,
              'first_suite_summary': first_suite,
              'screen_windows': [compact(item) for item in screen_metrics],
              'screen_suite_summary': screen_suite,
              'first_command_status': first_status,
              'screen_command_status': screen_status,
              'detector_diagnostics': diagnostics,
              'next_action': next_action,
              'scenario_families': [
                  'OPENING_TYPE_INITIATIVE_CONTINUATION',
                  'OPENING_TYPE_RESPONSIVE_REVERSAL',
              ],
              'ten_second_alpha_inputs': False,
              'goal_verified': bool(
                  screen_suite is not None
                  and screen_suite.get('suite_gate_passed', False)
                  and screen_suite.get('goal_met', False)
              ),
          }
          (output / 'decision.json').write_text(json.dumps(decision, indent=2, sort_keys=True) + '\n')
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

            if [[ "$first_status" != "0" || "$screen_status" != "0" ]]; then
              exit 1
            fi
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$STATUS"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit implementation and evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER" "$ARCHIVE" .github/workflows/candidate-08-opening-type-router-bootstrap-v1.yml
          git add -A -- \
            research/candidate-08/opening_type_state_router_signals_v1.py \
            research/candidate-08/test_opening_type_state_router_signals_v1.py \
            research/candidate-08/run_opening_type_state_router_nautilus_v1.py \
            research/candidate-08/config_opening_type_state_router_btc_v1.json \
            research/candidate-08/OPENING_TYPE_STATE_ROUTER_V1_PREREGISTRATION.md \
            .github/workflows/candidate-08-opening-type-state-router-v1.yml \
            "$OUTPUT_DIR" "$MARKER" "$ARCHIVE" \
            .github/workflows/candidate-08-opening-type-router-bootstrap-v1.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: implement and validate opening type state router V1 [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce reproducible execution
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
