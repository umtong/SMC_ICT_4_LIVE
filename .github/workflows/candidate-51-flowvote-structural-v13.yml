name: candidate-51-flowvote-structural-v13

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-flowvote-structural-v13.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-51-flowvote-structural-v13
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
      - name: Materialize structural flow-vote policy
        run: |
          cp research/candidate-51/router_flowvote_structural.py research/candidate-51/router.py
          cp research/candidate-51/strategy_flowvote_structural.py research/candidate-51/strategy.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51
      - name: Predeclare four structural variants
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          base = json.loads(Path("research/candidate-51/config.json").read_text())
          variants = {
              "source_l30_h180": (.12, .15, 30, 180),
              "source_l60_h360": (.12, .15, 60, 360),
              "strict_l30_h180": (.20, .20, 30, 180),
              "strict_l60_h360": (.20, .20, 60, 360),
          }
          work = Path(".work/flowvote-v13")
          work.mkdir(parents=True, exist_ok=True)
          for name, (imbalance, delta, lookback, hold) in variants.items():
              config = copy.deepcopy(base)
              for key in ("sma_offset_low", "sma_offset_high", "sma_stop_min_fraction",
                          "sma_stop_max_fraction", "sma_stop_atr_buffer"):
                  config["strategy"].pop(key, None)
              config["strategy"].update({
                  "cooldown_minutes": 0,
                  "max_hold_minutes": hold,
                  "funding_flatten_minute": 60,
                  "funding_blackout_before_minutes": -1,
                  "funding_blackout_after_minutes": -1,
                  "feature_max_age_seconds": 65.0,
                  "flowvote_bucket_minutes": 1,
                  "flowvote_ema_period": 50,
                  "flowvote_atr_period": 14,
                  "flowvote_imbalance_threshold": imbalance,
                  "flowvote_delta_threshold": delta,
                  "flowvote_min_volume_ratio": 1.20,
                  "flowvote_min_votes": 3,
                  "flowvote_min_efficiency": 0.0,
                  "flowvote_stop_atr_multiple": 1.5,
                  "flowvote_min_stop_fraction": 0.003,
                  "flowvote_target_r": 2.0,
                  "flowvote_structural_lookback_minutes": lookback,
                  "flowvote_structural_atr_buffer": 0.50,
                  "flowvote_remote_target_r": 10.0
              })
              (work / f"{name}.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          (work / "variants.json").write_text(json.dumps(variants, indent=2, sort_keys=True) + "\n")
          PY
      - name: Run development tournament
        run: |
          for variant in source_l30_h180 source_l60_h360 strict_l30_h180 strict_l60_h360; do
            PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
              --config ".work/flowvote-v13/${variant}.json" \
              --start 2026-03-23 --end 2026-03-29 \
              --cache .cache/candidate-51-flowvote-v13 \
              --output "artifacts/candidate-51/flowvote-v13-${variant}-development" \
              --workspace ".work/flowvote-v13-${variant}"
          done
      - name: Select cost-after survivor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          comparison = {}
          for name in ("source_l30_h180", "source_l60_h360", "strict_l30_h180", "strict_l60_h360"):
              root = Path(f"artifacts/candidate-51/flowvote-v13-{name}-development")
              metrics = json.loads((root / "metrics.json").read_text())
              diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
              comparison[name] = {
                  **{key: metrics.get(key) for key in (
                      "ending_nav", "total_return", "geometric_daily_growth", "max_drawdown",
                      "trades", "wins", "losses", "win_rate", "profit_factor",
                      "expectancy_usdt", "largest_winner_share")},
                  "source_edges": diagnostics.get("flowvote_source_edges"),
                  "opposite_vote_exits": diagnostics.get("flowvote_opposite_vote_exits"),
                  "selected_symbols": diagnostics.get("selected_symbols"),
                  "global_position_violations": diagnostics.get("global_position_violations"),
                  "order_rejections": diagnostics.get("order_rejections")
              }
          eligible = [name for name, row in comparison.items()
              if int(row.get("trades") or 0) >= 3
              and float(row.get("expectancy_usdt") or 0.0) > 0.0
              and float(row.get("geometric_daily_growth") or 0.0) > 0.0
              and int(row.get("global_position_violations") or 0) == 0
              and int(row.get("order_rejections") or 0) == 0]
          eligible.sort(key=lambda name: (
              -float(comparison[name].get("geometric_daily_growth") or 0.0),
              -float(comparison[name].get("expectancy_usdt") or 0.0),
              -int(comparison[name].get("trades") or 0), name))
          selected = eligible[0] if eligible else ""
          report = {"comparison": comparison, "eligible": eligible,
                    "selected": selected or None,
                    "status": "TEST_UNTOUCHED" if selected else "REJECT"}
          Path("artifacts/candidate-51/flowvote-v13-development-comparison.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n")
          Path(".work/flowvote-v13/selected.txt").write_text(selected + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Run untouched week when eligible
        run: |
          selected="$(tr -d '\r\n' < .work/flowvote-v13/selected.txt)"
          if [[ -z "$selected" ]]; then exit 0; fi
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config ".work/flowvote-v13/${selected}.json" \
            --start 2025-12-01 --end 2025-12-07 \
            --cache .cache/candidate-51-flowvote-v13 \
            --output artifacts/candidate-51/flowvote-v13-selected-holdout \
            --workspace .work/flowvote-v13-holdout
      - name: Assess holdout and conditionally run 30 days
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          variant = Path(".work/flowvote-v13/selected.txt").read_text().strip()
          root = Path("artifacts/candidate-51/flowvote-v13-selected-holdout")
          result = {"variant": variant or None, "produced": False, "component_pass": False}
          if variant and (root / "metrics.json").is_file():
              metrics = json.loads((root / "metrics.json").read_text())
              diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
              checks = {
                  "at_least_three_trades": int(metrics.get("trades") or 0) >= 3,
                  "positive_growth": float(metrics.get("geometric_daily_growth") or 0.0) > 0.0,
                  "positive_expectancy": float(metrics.get("expectancy_usdt") or 0.0) > 0.0,
                  "one_position": int(diagnostics.get("global_position_violations") or 0) == 0,
                  "no_rejections": int(diagnostics.get("order_rejections") or 0) == 0
              }
              result = {"variant": variant, "produced": True,
                  **{key: metrics.get(key) for key in (
                      "ending_nav", "total_return", "geometric_daily_growth", "max_drawdown",
                      "trades", "wins", "losses", "win_rate", "profit_factor", "expectancy_usdt")},
                  "checks": checks, "component_pass": all(checks.values())}
          Path("artifacts/candidate-51/flowvote-v13-holdout-assessment.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n")
          Path(".work/flowvote-v13/promote.txt").write_text(
              result.get("variant", "") + "\n" if result.get("component_pass") else "")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          selected="$(tr -d '\r\n' < .work/flowvote-v13/promote.txt)"
          if [[ -z "$selected" ]]; then exit 0; fi
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config ".work/flowvote-v13/${selected}.json" \
            --start 2025-07-01 --end 2025-07-30 \
            --cache .cache/candidate-51-flowvote-v13 \
            --output artifacts/candidate-51/flowvote-v13-selected-continuous-30d \
            --workspace .work/flowvote-v13-continuous
      - name: Write final assessment
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-51/flowvote-v13-selected-continuous-30d")
          result = {"produced": False, "project_gate_pass": False}
          if (root / "metrics.json").is_file():
              metrics = json.loads((root / "metrics.json").read_text())
              diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
              checks = {
                  "daily_geometric_growth_at_least_1pct": float(metrics.get("geometric_daily_growth") or 0.0) >= 0.01,
                  "trades_at_least_calendar_days": int(metrics.get("trades") or 0) >= 30,
                  "positive_expectancy": float(metrics.get("expectancy_usdt") or 0.0) > 0.0,
                  "one_position": int(diagnostics.get("global_position_violations") or 0) == 0,
                  "no_rejections": int(diagnostics.get("order_rejections") or 0) == 0
              }
              result = {"produced": True,
                  **{key: metrics.get(key) for key in (
                      "ending_nav", "total_return", "geometric_daily_growth", "max_drawdown",
                      "trades", "wins", "losses", "win_rate", "profit_factor", "expectancy_usdt")},
                  "checks": checks, "project_gate_pass": all(checks.values())}
          Path("artifacts/candidate-51/flowvote-v13-continuous-assessment.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-flowvote-structural-v13
          path: artifacts/candidate-51/flowvote-v13-*
          if-no-files-found: warn
          retention-days: 30
