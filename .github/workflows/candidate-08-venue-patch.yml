name: candidate-08-venue-patch

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.patch-venue"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align legacy engine venue arguments with pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/run.py")
          source = path.read_text(encoding="utf-8")
          lines = [
              '        liquidation_enabled=bool(config["venue"]["liquidation_enabled"]),\n',
              '        liquidation_trigger_ratio=float(config["venue"]["liquidation_trigger_ratio"]),\n',
          ]
          for line in lines:
              if source.count(line) != 1:
                  raise SystemExit(f"expected one line to remove: {line!r}; found {source.count(line)}")
              source = source.replace(line, "")
          path.write_text(source, encoding="utf-8")
          PY
          rm research/candidate-08/.patch-venue
          python -m compileall -q research/candidate-08/run.py
          ! grep -q 'liquidation_enabled=' research/candidate-08/run.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-08/run.py research/candidate-08/.patch-venue
          git commit -m "candidate-08: align venue arguments with pinned legacy engine"
          git push origin HEAD:research/candidate-08
