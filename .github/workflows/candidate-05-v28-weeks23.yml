name: candidate-05-v28-weeks23

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v28-weeks23.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  remaining-frozen-weeks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed research environment
        run: |
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v

      - name: Run frozen BTC weeks 2 and 3 directly through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/candidate-05-v28
          mkdir -p "$root/week-2" "$root/week-3"

          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-01-13 \
            --build-end 2024-01-21 \
            --evaluation-start 2024-01-15 \
            --evaluation-end 2024-01-21 \
            --cache .cache/candidate-05-v28/week-2 \
            --output "$root/week-2" | tee "$root/week-2/console.json"

          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-09-06 \
            --build-end 2023-09-14 \
            --evaluation-start 2023-09-08 \
            --evaluation-end 2023-09-14 \
            --cache .cache/candidate-05-v28/week-3 \
            --output "$root/week-3" | tee "$root/week-3/console.json"

      - name: Verify evidence
        if: always()
        shell: bash
        run: |
          for root in artifacts/candidate-05-v28/week-{2,3}; do
            if test -f "$root/metrics.json"; then
              python -m json.tool "$root/metrics.json"
              for file in run.json data_manifest.json orders.csv positions.csv account.csv equity.csv scenario_events.jsonl strategy_diagnostics.json; do
                test -s "$root/$file"
              done
            fi
            if test -f "$root/errors.log"; then cat "$root/errors.log"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v28-weeks23-${{ github.sha }}
          path: artifacts/candidate-05-v28/**
          if-no-files-found: warn
          retention-days: 90
