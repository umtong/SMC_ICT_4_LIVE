name: candidate-01-event-time-fix

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-event-time-fix.yml"
      - "research/candidate-01/fix_event_time_precision.py"

permissions:
  contents: write
  packages: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve sparse nanosecond event identifiers
        run: |
          set -euo pipefail
          python3 research/candidate-01/fix_event_time_precision.py
          python3 -m compileall -q \
            research/candidate-01/cross_venue_diagnostics.py \
            research/candidate-01/flow_regime_diagnostics.py
      - name: Persist exact precision repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-01/cross_venue_diagnostics.py \
            research/candidate-01/flow_regime_diagnostics.py
          git commit -m "fix(candidate-01): preserve sparse nanosecond event IDs"
          git push origin HEAD:research/candidate-01
