name: research-structural-auction-control-v1-pr

on:
  pull_request:
    branches: ["research_skilled_auction_control"]
    paths:
      - "research/candidate-structural-auction-control-v1/**"
      - ".github/workflows/research-structural-auction-control-v1-pr.yml"
  workflow_dispatch:

concurrency:
  group: research-structural-auction-control-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: dev-february-2025, start: 2025-02-01, end: 2025-02-10}
          - {period: eval-july-2026, start: 2026-07-15, end: 2026-07-31}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-structural-auction-control-v1:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/structural-auction-control-v1/${{ matrix.period }}
      OUT: artifacts/structural-auction-control-v1/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile structural state policy
        run: |
          python -m py_compile \
            research/candidate-structural-auction-control-v1/structural_auction_control_v1.py \
            research/candidate-structural-auction-control-v1/run_backtest.py
      - name: Run one continuous four-market Nautilus account
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-structural-auction-control-v1/run_backtest.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2
      - name: Preserve trades, non-trades, event traces, and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-auction-control-v1-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/structural-auction-control-v1/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
