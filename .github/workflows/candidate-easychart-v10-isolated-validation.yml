name: candidate-easychart-v10-isolated-untouched-validation

on:
  push:
    branches: ["research/candidate-easychart"]
    paths: [".github/workflows/candidate-easychart-v10-isolated-validation.yml"]
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v10-isolated-untouched-validation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  untouched-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v10-isolated-validation
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          exec > >(tee "$ROOT/verification.log") 2>&1
          smc4 doctor
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v
      - name: Run exact isolated-router leaders on untouched windows
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/screen.log") 2>&1
          common=(--warmup-days 5 --cache "$CACHE" --signal-minutes 5 --accepted-break-widths 1.0 --cost-profile role --disable-fakeout --cross-state isolated)
          leader="PRIOR_DAY_NY,FUNDING_16_00,FUNDING_08_16,LONDON_NY"
          funding="FUNDING_16_00,FUNDING_08_16"
          for period in 2024-03-01:2024-06-30 2025-01-01:2025-04-30; do
            IFS=: read -r start end <<<"$period"
            tag=$(echo "$start-$end" | tr -d '-')
            python research/candidate-easychart/screen_v10.py "${common[@]}" --families "$leader" --start "$start" --end "$end" --output "$ROOT/leader-$tag"
            python research/candidate-easychart/screen_v10.py "${common[@]}" --families "$funding" --start "$start" --end "$end" --output "$ROOT/funding-$tag"
          done
          variants=(leader-20240301-20240630 funding-20240301-20240630 leader-20250101-20250430 funding-20250101-20250430)
          python research/candidate-easychart/compare_v10.py --root "$ROOT" --variants "${variants[@]}"
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/comparison.json" >/dev/null
          for variant in leader-20240301-20240630 funding-20240301-20240630 leader-20250101-20250430 funding-20250101-20250430; do
            test -s "$ROOT/$variant/metrics.json"
            test -e "$ROOT/$variant/trades.csv"
            test -e "$ROOT/$variant/equity.csv"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v10-isolated-validation-${{ github.sha }}
          path: artifacts/candidate-easychart-v10-isolated-validation/**
          if-no-files-found: warn
          retention-days: 90
