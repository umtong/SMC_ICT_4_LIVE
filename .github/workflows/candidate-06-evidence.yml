name: Candidate 06 Evidence

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - "research/candidate-06/**"
      - ".github/workflows/candidate-06-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-week:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify prebuilt research environment
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(actual)
          PY

      - name: Verify causal state machine
        run: python research/candidate-06/test_logic.py

      - name: Run frozen first BTC week in NautilusTrader
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf artifacts/candidate-06/first-week
          python research/candidate-06/run_validation.py \
            --output artifacts/candidate-06/first-week \
            --week-index 0
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render reproducible result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/candidate-06/first-week")
          root.mkdir(parents=True, exist_ok=True)
          metrics_path = root / "metrics.json"
          errors_path = root / "errors.log"
          lines = [
              "# Candidate 06 first frozen BTC week",
              "",
              "Generated by the pinned NautilusTrader workflow from committed candidate code.",
              "",
          ]
          if metrics_path.exists():
              metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
              keys = [
                  "week_start_utc", "week_end_utc_exclusive", "bars",
                  "starting_nav", "ending_nav", "net_pnl_after_cost",
                  "total_nav_return", "geometric_daily_nav_growth",
                  "trades", "trades_per_day", "wins", "losses", "win_rate",
                  "profit_factor", "mean_r_after_cost", "max_drawdown_nav",
                  "largest_positive_trade_share", "gate_passed",
              ]
              lines.extend(["## Primary metrics", "", "| metric | value |", "|---|---:|"])
              for key in keys:
                  lines.append(f"| `{key}` | `{metrics.get(key)}` |")
              lines.extend(["", "## Gate failures", ""])
              failures = metrics.get("gate_failures", [])
              lines.extend([f"- `{value}`" for value in failures] or ["- none"])
              for title, key in [
                  ("Scenario breakdown", "scenario_breakdown"),
                  ("Direction breakdown", "direction_breakdown"),
                  ("Outcomes", "outcome_counts"),
                  ("Diagnostics", "diagnostics"),
                  ("Execution assumptions", "execution_assumptions"),
              ]:
                  lines.extend(["", f"## {title}", "", "```json", json.dumps(metrics.get(key, {}), indent=2, sort_keys=True), "```"])
          else:
              lines.extend(["## Status", "", "No `metrics.json` was produced; this is an implementation/runtime failure, not a strategy result.", ""])
          if errors_path.exists():
              text = errors_path.read_text(encoding="utf-8", errors="replace")
              lines.extend(["", "## Error log", "", "```text", text[-20000:], "```"])
          (root / "SUMMARY.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          printf '%s\n' '${{ steps.validation.outputs.exit_code }}' > artifacts/candidate-06/first-week/validation_exit_code.txt

      - name: Commit validation evidence to candidate branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/first-week
          if ! git diff --cached --quiet; then
            git commit -m "Record candidate-06 first-week evidence [skip ci]"
            git push origin HEAD:research/candidate-06
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-first-week
          path: artifacts/candidate-06/first-week
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce implementation and performance result
        if: always()
        shell: bash
        run: |
          code='${{ steps.validation.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "validation step did not report an exit code" >&2
            exit 1
          fi
          exit "$code"
