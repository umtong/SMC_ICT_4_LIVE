name: candidate-12-i8-w7-frozen-confirmation

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i8-w7-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  w7-frozen-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    env:
      SYMBOL: BTCUSDT
      WEEK: W7
      OUTPUT: artifacts/candidate-12/BTCUSDT-W7
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt environment
        run: smc4 doctor

      - name: Compile unchanged candidate
        run: python -m compileall -q research/candidate-12

      - name: Candidate unit tests
        run: python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run frozen untouched W7 through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          python - <<'PY' | tee "$OUTPUT.console.json"
          from pathlib import Path
          import json
          import sys

          root = Path("research/candidate-12").resolve()
          sys.path.insert(0, str(root))
          from run import run

          metrics = run(
              root / "config.json",
              "BTCUSDT",
              "W7",
              Path("artifacts/candidate-12/BTCUSDT-W7").resolve(),
          )
          print(json.dumps(metrics, indent=2, sort_keys=True, default=str))
          PY

      - name: Surface W7 decision evidence
        if: always()
        shell: bash
        run: |
          if [[ -f "$OUTPUT/metrics.json" ]]; then
            echo '=== CANDIDATE_12_I8_W7_METRICS_BEGIN ==='
            cat "$OUTPUT/metrics.json"
            echo '=== CANDIDATE_12_I8_W7_METRICS_END ==='
          fi
          if [[ -f "$OUTPUT/run.json" ]]; then
            echo '=== CANDIDATE_12_I8_W7_RUN_BEGIN ==='
            cat "$OUTPUT/run.json"
            echo '=== CANDIDATE_12_I8_W7_RUN_END ==='
          fi

      - name: Preserve reproducible W7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I8-BTCUSDT-W7-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: warn
