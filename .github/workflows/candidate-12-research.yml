name: candidate-12-i21-cross-market-transfer-screen

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i21-transfer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  transfer-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Verify unchanged I19 strategy
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(git hash-object research/candidate-12/logic.py)" = "848b278d492249cee867f4c8978a1e62086b6d45"
          test "$(git hash-object research/candidate-12/test_logic.py)" = "c145bdfcb9576a6675dc354e4ae5f40bb266e5b6"
          test "$(git hash-object research/candidate-12/config.json)" = "160557c044e7fc315fc802bfe7f1c3f974b53374"
          test "$(git hash-object research/candidate-12/strategy_adapter.py)" = "c8f1a2c30fc598bda1b03adaafde3b4a55f50018"
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run W1 transfer gate, then W12 only for lossless positive symbols
        shell: bash
        run: |
          set -euo pipefail
          ROOT=artifacts/candidate-12/I21-transfer
          mkdir -p "$ROOT"
          for SYMBOL in ETHUSDT SOLUSDT XRPUSDT; do
            W1="$ROOT/${SYMBOL}-W1"
            mkdir -p "$W1"
            python research/candidate-12/run.py \
              --symbol "$SYMBOL" --week W1 --output "$W1" | tee "$W1.console.json"
            SYMBOL="$SYMBOL" ROOT="$ROOT" python - <<'PY'
          from pathlib import Path
          import json, os
          symbol = os.environ["SYMBOL"]
          root = Path(os.environ["ROOT"])
          m = json.loads((root / f"{symbol}-W1" / "metrics.json").read_text())
          valid = (
              m["closed_trades"] >= 1
              and m["losses"] == 0
              and float(m["final_nav"]) > float(m["starting_nav"])
              and m["risk_budget_passed"]
              and m["global_slot_passed"]
              and m["event_log_valid"]
              and not m["engine_errors"]
              and not m["liquidation_detected"]
          )
          (root / f"{symbol}.continue").write_text("1" if valid else "0")
          print(json.dumps({"symbol": symbol, "continue_to_w12": valid, "metrics": m}, indent=2))
          PY
            if [[ "$(cat "$ROOT/${SYMBOL}.continue")" == "1" ]]; then
              W12="$ROOT/${SYMBOL}-W12"
              mkdir -p "$W12"
              python research/candidate-12/run.py \
                --symbol "$SYMBOL" --week W12 --output "$W12" | tee "$W12.console.json"
            fi
          done

      - name: Summarize transfer evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/candidate-12/I21-transfer")
          result = {"schema": "candidate-12-i21-transfer-v1", "symbols": {}}
          for symbol in ("ETHUSDT", "SOLUSDT", "XRPUSDT"):
              item = {"W1": json.loads((root / f"{symbol}-W1" / "metrics.json").read_text())}
              p = root / f"{symbol}-W12" / "metrics.json"
              if p.exists():
                  item["W12"] = json.loads(p.read_text())
              result["symbols"][symbol] = item
          (root / "summary.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Preserve transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I21-cross-market-transfer-${{ github.sha }}
          path: artifacts/candidate-12/I21-transfer
          if-no-files-found: warn
