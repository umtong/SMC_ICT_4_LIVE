name: candidate-12-materialize-i10

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i10.patch"
      - ".github/workflows/candidate-12-research.yml"

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I10 source atomically
        shell: bash
        run: |
          set -euo pipefail
          PATCH=research/candidate-12/update-i10.patch
          echo "c8c50c8bbb5cf6a162c9826fa5c2d00baf386f478e443d27ded5efe37ca3b997  $PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          python -m compileall -q research/candidate-12
          git rm "$PATCH" .github/workflows/candidate-12-research.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-12
          git commit -m "candidate-12: install I10 connected reacceptance source"
          git push origin HEAD:research/candidate-12
