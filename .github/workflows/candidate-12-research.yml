name: candidate-12-i12-authoritative-regression

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/**"
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i12-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  authoritative-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout I12 candidate
        uses: actions/checkout@v4

      - name: Verify prebuilt environment
        run: smc4 doctor

      - name: Verify reviewed I12 source set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/candidate-12/logic.py)" = "7c36cf3447e9e523aec17c37f3b90ffcea072651"
          test "$(git hash-object research/candidate-12/test_logic.py)" = "0381cce31db117427d7e19894ba2a70f03054fed"
          test "$(git hash-object research/candidate-12/config.json)" = "c55c409c3363a60592a81fc8cca04bd0bf982bfc"
          test "$(git hash-object research/candidate-12/strategy_adapter.py)" = "54befadc68a604e2b446b29193f67c86865a0cc0"
          test "$(git hash-object research/candidate-12/run.py)" = "d24065c0a056ef694572d489c9318af15153b17e"
          test "$(git hash-object research/candidate-12/metrics.py)" = "04ca505a2c6c761581ea80d0f25a7161ba5b2db1"

      - name: Compile candidate
        run: python -m compileall -q research/candidate-12

      - name: Run 26 causal unit tests
        run: python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run W1 W2 W5 W6 W10 W11 through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          for WEEK in W1 W2 W5 W6 W10 W11; do
            OUTPUT="artifacts/candidate-12/BTCUSDT-${WEEK}"
            mkdir -p "$OUTPUT"
            python research/candidate-12/run.py \
              --symbol BTCUSDT \
              --week "$WEEK" \
              --output "$OUTPUT" | tee "$OUTPUT.console.json"
          done

      - name: Enforce I12 NAV and causal regression gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path
          import json

          root = Path("artifacts/candidate-12")
          weeks = ("W1", "W2", "W5", "W6", "W10", "W11")
          metrics = {
              week: json.loads(
                  (root / f"BTCUSDT-{week}" / "metrics.json").read_text(encoding="utf-8")
              )
              for week in weeks
          }
          candidate = "candidate-12-confirmed-extension-session-auction-router"
          for week, item in metrics.items():
              assert item["candidate"] == candidate, (week, item)
              assert item["week_id"] == week, item
              assert item["risk_budget_passed"] is True, (week, item)
              assert item["global_slot_passed"] is True, (week, item)
              assert item["event_log_valid"] is True, (week, item)
              assert item["engine_errors"] == [], (week, item)
              assert item["liquidation_detected"] is False, (week, item)

          expected_winners = {"W1": 6, "W5": 5, "W6": 5, "W10": 1}
          for week, count in expected_winners.items():
              item = metrics[week]
              assert item["closed_trades"] == count, (week, item)
              assert item["wins"] == count and item["losses"] == 0, (week, item)
              assert Decimal(str(item["final_nav"])) > Decimal(str(item["starting_nav"])), item

          w2 = metrics["W2"]
          assert w2["losses"] == 0, w2
          assert Decimal(str(w2["final_nav"])) == Decimal(str(w2["starting_nav"])), w2

          w10_plans = json.loads(
              (root / "BTCUSDT-W10" / "submitted_plans.json").read_text(encoding="utf-8")
          )["plans"]
          assert len([
              plan for plan in w10_plans
              if plan["scenario"] == "LONDON_LOW_ACCEPTANCE_REACCELERATION"
          ]) == 1, w10_plans

          w11 = metrics["W11"]
          assert w11["submitted_plans"] == 0, w11
          assert w11["closed_trades"] == 0, w11
          assert Decimal(str(w11["final_nav"])) == Decimal(str(w11["starting_nav"])), w11
          assert w11["success_claim"] is False, w11
          assert (
              w11.get("skip_reasons", {}).get(
                  "LOW_ACCEPTANCE_PULLBACK_BEFORE_POST_CONFIRMATION_EXTENSION", 0
              ) >= 1
          ), w11

          summary = {
              week: {
                  "closed_trades": item["closed_trades"],
                  "wins": item["wins"],
                  "losses": item["losses"],
                  "submitted_plans": item["submitted_plans"],
                  "final_nav": item["final_nav"],
                  "net_return": item["net_return"],
                  "daily_geometric_growth": item["daily_geometric_growth"],
                  "closed_trade_max_drawdown": item["closed_trade_max_drawdown"],
                  "scenario_plan_counts": item.get("scenario_plan_counts", {}),
                  "skip_reasons": item.get("skip_reasons", {}),
              }
              for week, item in metrics.items()
          }
          (root / "I12-authoritative-regression.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Surface I12 evidence
        if: always()
        shell: bash
        run: |
          for WEEK in W1 W2 W5 W6 W10 W11; do
            METRICS="artifacts/candidate-12/BTCUSDT-${WEEK}/metrics.json"
            if [[ -f "$METRICS" ]]; then
              echo "=== I12_${WEEK}_METRICS_BEGIN ==="
              cat "$METRICS"
              echo "=== I12_${WEEK}_METRICS_END ==="
            fi
          done

      - name: Preserve reproducible I12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I12-authoritative-${{ github.sha }}
          path: artifacts/candidate-12
          if-no-files-found: warn
