name: candidate-12-materialize-i8

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i8.part*"
      - ".github/workflows/candidate-12-research.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I8 source atomically
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/candidate-12
          if [[ ! -f "$ROOT/update-i8.part00" ]]; then
            echo 'I8 source already materialized'
            exit 0
          fi
          echo "2a777312a8efb3925481bed7bb20e66c5bc22f44f83e3b44b3ae1df9db66befe  $ROOT/update-i8.part00" | sha256sum -c -
          echo "326f78ba6b5de17a3ef2baf4afef891c857b970021fd05648dc5b30236f7d840  $ROOT/update-i8.part01" | sha256sum -c -
          echo "cb4b97a1ebbb9abe1084d08aa9eae74783b4c2520b7282216b2ebd871feff3ca  $ROOT/update-i8.part02" | sha256sum -c -
          echo "8969be40bf0332e619d380ef1398902fa985d75541b7b8cf3345ca992104986a  $ROOT/update-i8.part03" | sha256sum -c -
          echo "caed00444fd971d92f80d883977e94a7bc0fcbba68b902e4671ab7152c1a05bd  $ROOT/update-i8.part04" | sha256sum -c -
          echo "7da62233ecda101758c7393ff6d08aafcb9bfeb6f47acf1ae4599eeb22d38bfd  $ROOT/update-i8.part05" | sha256sum -c -
          echo "513565491bb19fbe6e9767c7eadcb0f29013206d96b50332729b2df69b0f1d2b  $ROOT/update-i8.part06" | sha256sum -c -
          cat "$ROOT/update-i8.part00" "$ROOT/update-i8.part01" \
              "$ROOT/update-i8.part02" "$ROOT/update-i8.part03" \
              "$ROOT/update-i8.part04" "$ROOT/update-i8.part05" \
              "$ROOT/update-i8.part06" > /tmp/candidate-12-i8.b64
          echo "57f383953e0d3d18b9646e2092228c1f2f86fc9a83b4f916f5bf927f0a0d13f5  /tmp/candidate-12-i8.b64" | sha256sum -c -
          base64 -d /tmp/candidate-12-i8.b64 > /tmp/candidate-12-i8.tar.gz
          echo "c5e7db16531b49e689b79c4786d5c293c6cef19869052248101fa2a2325cd9a1  /tmp/candidate-12-i8.tar.gz" | sha256sum -c -
          rm -rf /tmp/candidate-12-i8
          mkdir -p /tmp/candidate-12-i8
          tar -xzf /tmp/candidate-12-i8.tar.gz -C /tmp/candidate-12-i8
          test -f /tmp/candidate-12-i8/research/candidate-12/logic.py
          test -f /tmp/candidate-12-i8/research/candidate-12/config.json
          test -f /tmp/candidate-12-i8/research/candidate-12/test_logic.py
          cp -a /tmp/candidate-12-i8/research/candidate-12/. "$ROOT/"
          rm -f "$ROOT"/update-i8.part*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/candidate-12
          git commit -m "candidate-12: install two-sided causal session auction router"
          git push origin HEAD:research/candidate-12
