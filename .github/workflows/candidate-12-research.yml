name: candidate-12-materialize-i5

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i5.part*"
      - ".github/workflows/candidate-12-research.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I5 source atomically
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/candidate-12
          if [[ ! -f "$ROOT/update-i5.part00" ]]; then
            echo 'I5 source already materialized'
            exit 0
          fi
          echo "172da70419eb79ef6ef6e44708109c1b7a98e11a3944e6a030b2aafa5453469d  $ROOT/update-i5.part00" | sha256sum -c -
          echo "0672dd9598a28e36b1221602bb8bf1536a957e7fb4faf8653eef71d76c45af19  $ROOT/update-i5.part01" | sha256sum -c -
          echo "6d4b907ab9f9ebbd826e20db9653a190c079608ac26456f5019b2cb2dec2cf21  $ROOT/update-i5.part02" | sha256sum -c -
          echo "a0ba9451ff09bb1b53993b43d30a5d89f40abc68c43c9630f3b6b05a010c51f3  $ROOT/update-i5.part03" | sha256sum -c -
          echo "cc3d82badb63b8898179770a0bed8b17f2b62ca3b80b0d9c1c5df304d58ce2c5  $ROOT/update-i5.part04" | sha256sum -c -
          cat "$ROOT/update-i5.part00" "$ROOT/update-i5.part01" \
              "$ROOT/update-i5.part02" "$ROOT/update-i5.part03" \
              "$ROOT/update-i5.part04" > /tmp/candidate-12-i5.b64
          echo "e288e26fd22c406dad1e9342eba5985e5267677d432b2de368401d58c4c29ca7  /tmp/candidate-12-i5.b64" | sha256sum -c -
          base64 -d /tmp/candidate-12-i5.b64 > /tmp/candidate-12-i5.tar.gz
          echo "9539b7cc67859da431a15691f9d9a22df35e880146cfe0d61687bd85e276d52f  /tmp/candidate-12-i5.tar.gz" | sha256sum -c -
          rm -rf /tmp/candidate-12-i5
          mkdir -p /tmp/candidate-12-i5
          tar -xzf /tmp/candidate-12-i5.tar.gz -C /tmp/candidate-12-i5
          test -f /tmp/candidate-12-i5/research/candidate-12/logic.py
          test -f /tmp/candidate-12-i5/research/candidate-12/strategy_adapter.py
          test -f /tmp/candidate-12-i5/research/candidate-12/config.json
          test -f /tmp/candidate-12-i5/research/candidate-12/test_logic.py
          cp -a /tmp/candidate-12-i5/research/candidate-12/. "$ROOT/"
          rm -f "$ROOT"/update-i5.part*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/candidate-12
          git commit -m "candidate-12: install completed-range auction source"
          git push origin HEAD:research/candidate-12
