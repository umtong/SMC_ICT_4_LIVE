name: candidate-12-i20-opening-balance-diagnostic

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-research.yml"
      - "research/candidate-12/diagnose_i20.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i20-opening-balance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen I19 baseline
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(git hash-object research/candidate-12/logic.py)" = "848b278d492249cee867f4c8978a1e62086b6d45"
          test "$(git hash-object research/candidate-12/test_logic.py)" = "c145bdfcb9576a6675dc354e4ae5f40bb266e5b6"
          test "$(git hash-object research/candidate-12/config.json)" = "160557c044e7fc315fc802bfe7f1c3f974b53374"
          test "$(git hash-object research/candidate-12/strategy_adapter.py)" = "c8f1a2c30fc598bda1b03adaafde3b4a55f50018"
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Reproduce I19 W1 and W12 baseline
        shell: bash
        run: |
          set -euo pipefail
          for W in W1 W12; do
            O="artifacts/candidate-12/BTCUSDT-${W}"
            mkdir -p "$O"
            python research/candidate-12/run.py --symbol BTCUSDT --week "$W" --output "$O" | tee "$O.console.json"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/candidate-12")
          w1 = json.loads((root / "BTCUSDT-W1" / "metrics.json").read_text())
          w12 = json.loads((root / "BTCUSDT-W12" / "metrics.json").read_text())
          assert w1["closed_trades"] == 6 and w1["wins"] == 6 and w1["losses"] == 0, w1
          assert w1["project_target_gate_passed"] is True, w1
          assert w12["closed_trades"] == 4 and w12["wins"] == 4 and w12["losses"] == 0, w12
          for item in (w1, w12):
              assert item["risk_budget_passed"] and item["global_slot_passed"], item
              assert item["event_log_valid"] and not item["engine_errors"], item
              assert not item["liquidation_detected"], item
          PY

      - name: Repair diagnostic direction mapping and expose raw geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("research/candidate-12/diagnose_i20.py")
          s = p.read_text(encoding="utf-8")
          old = '''        confirmation: dict[str, Any],
              ) -> None:
                  decision = five_all.iloc[idx]
                  direction = "SHORT" if side == "HIGH" else "LONG"
          '''
          new = '''        confirmation: dict[str, Any],
                  direction_override: str | None = None,
              ) -> None:
                  decision = five_all.iloc[idx]
                  direction = direction_override or ("SHORT" if side == "HIGH" else "LONG")
          '''
          # Keep indentation exact to the checked-in source rather than relying
          # on a fuzzy patch.
          old = old.replace("              )", "    )").replace("                  decision", "        decision").replace("                  direction", "        direction")
          new = new.replace("                  direction_override", "        direction_override").replace("              )", "    )").replace("                  decision", "        decision").replace("                  direction", "        direction")
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''            "confirmation": confirmation,
                      "overlaps_current_position": overlaps(decision.name, occupied),
                      "geometry": geometry,
          '''
          new = '''            "confirmation": confirmation,
                      "decision_open": float(decision.open),
                      "decision_high": float(decision.high),
                      "decision_low": float(decision.low),
                      "decision_close": float(decision.close),
                      "decision_atr": float(decision.atr),
                      "raw_stop": stop_raw,
                      "raw_target": target_raw,
                      "overlaps_current_position": overlaps(decision.name, occupied),
                      "geometry": geometry,
          '''
          old = old.replace("                      ", "            ")
          new = new.replace("                      ", "            ")
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          high = '''                    route="IB_TRUE_ACCEPTANCE_PULLBACK_BULLISH_FVG",
                              side=side,
          '''.replace("                              ", "                    ")
          high_new = '''                    route="IB_TRUE_ACCEPTANCE_PULLBACK_BULLISH_FVG",
                              side=side,
                              direction_override="LONG",
          '''.replace("                              ", "                    ")
          low = '''                    route="IB_TRUE_ACCEPTANCE_PULLBACK_BEARISH_FVG",
                              side=side,
          '''.replace("                              ", "                    ")
          low_new = '''                    route="IB_TRUE_ACCEPTANCE_PULLBACK_BEARISH_FVG",
                              side=side,
                              direction_override="SHORT",
          '''.replace("                              ", "                    ")
          assert s.count(high) == 1 and s.count(low) == 1
          s = s.replace(high, high_new, 1).replace(low, low_new, 1)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile research/candidate-12/diagnose_i20.py

      - name: Screen opening-balance value failure and acceptance
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-12/diagnose_i20.py \
            --weeks W1 W12 \
            --data-dir /tmp/candidate-12-i20-data \
            --baseline-root artifacts/candidate-12 \
            --output artifacts/candidate-12/I20-opening-balance-diagnostic.json
          cat artifacts/candidate-12/I20-opening-balance-diagnostic.json

      - name: Preserve reproducible diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I20-opening-balance-diagnostic-${{ github.sha }}
          path: artifacts/candidate-12
          if-no-files-found: warn
