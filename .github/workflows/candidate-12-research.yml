name: candidate-12-i11-regression-and-exposed-implementation

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/**"
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i11-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  regression-and-implementation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout I11 candidate
        uses: actions/checkout@v4

      - name: Verify prebuilt environment
        run: smc4 doctor

      - name: Verify reviewed I11 source
        shell: bash
        run: |
          set -euo pipefail
          echo "2583d83f7d5605354892311c24d32c111dc7c1450719866d9fc9c43d07156575  research/candidate-12/logic.py" | sha256sum -c -
          echo "8e7a111a5e20db965e9fdafa67118e4dffd407677708d3ccdde4f333264c3f0b  research/candidate-12/test_logic.py" | sha256sum -c -
          echo "a75747a9be29dfe55b22cb5f78769ac0f89e595f7f1bf284ff5d76b0c6555187  research/candidate-12/config.json" | sha256sum -c -

      - name: Compile candidate
        run: python -m compileall -q research/candidate-12

      - name: Run 25 causal unit tests
        run: python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run exposed regression weeks through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          for WEEK in W1 W2 W4 W5 W6 W8 W9 W10; do
            OUTPUT="artifacts/candidate-12/BTCUSDT-${WEEK}"
            mkdir -p "$OUTPUT"
            python research/candidate-12/run.py \
              --symbol BTCUSDT \
              --week "$WEEK" \
              --output "$OUTPUT" | tee "$OUTPUT.console.json"
          done

      - name: Enforce causal regression and W10 implementation gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path
          import json

          root = Path("artifacts/candidate-12")
          weeks = ("W1", "W2", "W4", "W5", "W6", "W8", "W9", "W10")
          metrics = {
              week: json.loads(
                  (root / f"BTCUSDT-{week}" / "metrics.json").read_text(encoding="utf-8")
              )
              for week in weeks
          }
          candidate = "candidate-12-local-reacceleration-session-auction-router"
          for week, item in metrics.items():
              assert item["candidate"] == candidate, (week, item)
              assert item["week_id"] == week, item
              assert item["risk_budget_passed"] is True, (week, item)
              assert item["global_slot_passed"] is True, (week, item)
              assert item["event_log_valid"] is True, (week, item)
              assert item["engine_errors"] == [], (week, item)
              assert item["liquidation_detected"] is False, (week, item)

          expected_winners = {"W1": 6, "W5": 5, "W6": 5}
          for week, count in expected_winners.items():
              item = metrics[week]
              assert item["closed_trades"] == count, (week, item)
              assert item["wins"] == count and item["losses"] == 0, (week, item)
              assert Decimal(str(item["final_nav"])) > Decimal(str(item["starting_nav"])), item

          for week in ("W2", "W4", "W8", "W9"):
              item = metrics[week]
              assert item["losses"] == 0, (week, item)
              assert Decimal(str(item["final_nav"])) >= Decimal(str(item["starting_nav"])), item

          w5_plans = json.loads(
              (root / "BTCUSDT-W5" / "submitted_plans.json").read_text(encoding="utf-8")
          )["plans"]
          assert any(
              plan["scenario"] == "ASIA_LOW_ACCEPTANCE_REACCELERATION"
              for plan in w5_plans
          ), w5_plans

          w10 = metrics["W10"]
          w10_plans = json.loads(
              (root / "BTCUSDT-W10" / "submitted_plans.json").read_text(encoding="utf-8")
          )["plans"]
          local_w10 = [
              plan for plan in w10_plans
              if plan["scenario"] == "LONDON_LOW_ACCEPTANCE_REACCELERATION"
          ]
          assert len(local_w10) == 1, w10_plans
          assert w10["closed_trades"] == 1, w10
          assert w10["wins"] == 1 and w10["losses"] == 0, w10
          assert Decimal(str(w10["final_nav"])) > Decimal(str(w10["starting_nav"])), w10

          summary = {
              week: {
                  "closed_trades": item["closed_trades"],
                  "wins": item["wins"],
                  "losses": item["losses"],
                  "final_nav": item["final_nav"],
                  "net_return": item["net_return"],
                  "daily_geometric_growth": item["daily_geometric_growth"],
                  "closed_trade_max_drawdown": item["closed_trade_max_drawdown"],
                  "submitted_plans": item["submitted_plans"],
                  "scenario_plan_counts": item.get("scenario_plan_counts", {}),
                  "skip_reasons": item.get("skip_reasons", {}),
              }
              for week, item in metrics.items()
          }
          output = root / "I11-exposed-regression.json"
          output.write_text(json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Surface I11 metrics
        if: always()
        shell: bash
        run: |
          for WEEK in W1 W2 W4 W5 W6 W8 W9 W10; do
            METRICS="artifacts/candidate-12/BTCUSDT-${WEEK}/metrics.json"
            if [[ -f "$METRICS" ]]; then
              echo "=== I11_${WEEK}_METRICS_BEGIN ==="
              cat "$METRICS"
              echo "=== I11_${WEEK}_METRICS_END ==="
            fi
          done

      - name: Preserve reproducible I11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I11-regression-implementation-${{ github.sha }}
          path: artifacts/candidate-12
          if-no-files-found: warn
