name: candidate-12-i9-w8-frozen-confirmation

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/config.json"
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i9-w8-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  w8-frozen-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    env:
      SYMBOL: BTCUSDT
      WEEK: W8
      OUTPUT: artifacts/candidate-12/BTCUSDT-W8
    steps:
      - name: Checkout frozen I9 candidate
        uses: actions/checkout@v4

      - name: Verify prebuilt environment
        run: smc4 doctor

      - name: Compile unchanged candidate
        run: python -m compileall -q research/candidate-12

      - name: Candidate causal unit tests
        run: python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run frozen untouched W8 through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          python - <<'PY' | tee "$OUTPUT.console.json"
          from pathlib import Path
          import json
          import sys

          root = Path("research/candidate-12").resolve()
          sys.path.insert(0, str(root))
          from run import run

          output = Path("artifacts/candidate-12/BTCUSDT-W8").resolve()
          metrics = run(root / "config.json", "BTCUSDT", "W8", output)
          assert metrics["candidate"] == "candidate-12-causal-executable-session-auction-router", metrics
          assert metrics["week_id"] == "W8", metrics
          assert metrics["risk_budget_passed"] is True, metrics
          assert metrics["global_slot_passed"] is True, metrics
          assert metrics["event_log_valid"] is True, metrics
          assert metrics["engine_errors"] == [], metrics
          assert metrics["liquidation_detected"] is False, metrics
          print(json.dumps(metrics, indent=2, sort_keys=True, default=str))
          PY

      - name: Surface performance-blind W8 evidence
        if: always()
        shell: bash
        run: |
          test ! -f "$OUTPUT/metrics.json" || cat "$OUTPUT/metrics.json"
          test ! -f "$OUTPUT/run.json" || cat "$OUTPUT/run.json"

      - name: Preserve reproducible W8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I9-BTCUSDT-W8-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: warn
