name: candidate-12-i15-w1-then-w12

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i15-w1-w12
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout I15 candidate
        uses: actions/checkout@v4

      - name: Verify environment and frozen source
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(git hash-object research/candidate-12/logic.py)" = "98a08024fa50d81f776cea44b08aaacaf0ee9f94"
          test "$(git hash-object research/candidate-12/test_logic.py)" = "91fed429173b49796bcdc5f3f4a25d2a23a87ac2"
          test "$(git hash-object research/candidate-12/config.json)" = "7879ccc27c3bce8293694772c8c3d76e9d2b2ebd"
          python - <<'PY'
          from pathlib import Path
          import json
          c = json.loads(Path("research/candidate-12/config.json").read_text())
          assert c["schema_version"] == 16, c
          assert c["candidate"] == "candidate-12-deep-acceptance-failure-router", c
          assert c["selection"]["weeks"]["W12"] == {
              "start": "2025-12-24",
              "end_exclusive": "2025-12-31",
          }, c
          PY
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Run W1 design gate
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=artifacts/candidate-12/BTCUSDT-W1
          mkdir -p "$OUTPUT"
          python research/candidate-12/run.py --symbol BTCUSDT --week W1 --output "$OUTPUT" | tee "$OUTPUT.console.json"
          python - <<'PY'
          from pathlib import Path
          import json
          m = json.loads(Path("artifacts/candidate-12/BTCUSDT-W1/metrics.json").read_text())
          assert m["closed_trades"] == 6, m
          assert m["wins"] == 6 and m["losses"] == 0, m
          assert m["project_target_gate_passed"] is True, m
          assert m["risk_budget_passed"] and m["global_slot_passed"], m
          assert m["event_log_valid"] and not m["engine_errors"], m
          assert not m["liquidation_detected"], m
          PY

      - name: Run W12 diagnosis only after W1 passes
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=artifacts/candidate-12/BTCUSDT-W12
          mkdir -p "$OUTPUT"
          python research/candidate-12/run.py --symbol BTCUSDT --week W12 --output "$OUTPUT" | tee "$OUTPUT.console.json"
          python - <<'PY'
          from decimal import Decimal
          from pathlib import Path
          import json
          root = Path("artifacts/candidate-12/BTCUSDT-W12")
          m = json.loads((root / "metrics.json").read_text())
          assert m["candidate"] == "candidate-12-deep-acceptance-failure-router", m
          assert m["week_id"] == "W12", m
          assert m["evaluation_start"] == "2025-12-24", m
          assert m["evaluation_end_exclusive"] == "2025-12-31", m
          assert m["risk_budget_passed"] and m["global_slot_passed"], m
          assert m["event_log_valid"] and not m["engine_errors"], m
          assert not m["liquidation_detected"], m
          assert Decimal(str(m["starting_nav"])) > 0, m
          assert Decimal(str(m["final_nav"])) > 0, m
          print(json.dumps(m, indent=2, sort_keys=True))
          PY

      - name: Surface W1 and W12 evidence
        if: always()
        shell: bash
        run: |
          for WEEK in W1 W12; do
            FILE="artifacts/candidate-12/BTCUSDT-${WEEK}/metrics.json"
            if [[ -f "$FILE" ]]; then
              echo "=== I15_${WEEK}_METRICS_BEGIN ==="
              cat "$FILE"
              echo "=== I15_${WEEK}_METRICS_END ==="
            fi
          done

      - name: Preserve reproducible I15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I15-W1-W12-${{ github.sha }}
          path: artifacts/candidate-12
          if-no-files-found: warn
