name: candidate-12-materialize-i7

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i7.part*"
      - ".github/workflows/candidate-12-research.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I7 source atomically
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/candidate-12
          if [[ ! -f "$ROOT/update-i7.part00" ]]; then
            echo 'I7 source already materialized'
            exit 0
          fi
          echo "2cb821daf4fb571f36960bf2b111606a68d8588633c2ac6bb51eaac1b96314b2  $ROOT/update-i7.part00" | sha256sum -c -
          echo "74a7e0b7af760cb3cf0a8fe2a2da0c0b7e14a9369361487d9b25a49bd73a894c  $ROOT/update-i7.part01" | sha256sum -c -
          echo "d1074761464178b9c26e12578505e050dc956f9eaab10e5d798c943b3e871294  $ROOT/update-i7.part02" | sha256sum -c -
          echo "8ef30a32dad7686143bed35957987a81a41c929bfba2c7e2fca51d5b1ec9504e  $ROOT/update-i7.part03" | sha256sum -c -
          echo "aa430567101a02c55e4bddc035b740b4f6c03e2c999ee4c09f485d56f985668a  $ROOT/update-i7.part04" | sha256sum -c -
          echo "240c75148fa012895322562fed393f0ee77971816bc0c42f024c8e890cb1c99f  $ROOT/update-i7.part05" | sha256sum -c -
          cat "$ROOT/update-i7.part00" "$ROOT/update-i7.part01" \
              "$ROOT/update-i7.part02" "$ROOT/update-i7.part03" \
              "$ROOT/update-i7.part04" "$ROOT/update-i7.part05" > /tmp/candidate-12-i7.b64
          echo "474650fa23b8f20c3e7baa9c7d091849cf37d7437477b30d7d5fd4521deb5c0c  /tmp/candidate-12-i7.b64" | sha256sum -c -
          base64 -d /tmp/candidate-12-i7.b64 > /tmp/candidate-12-i7.tar.gz
          echo "a703a36f5d7c205adb7b85e9e10237d9e990bdb5671fdfab7219dc70ecb843ac  /tmp/candidate-12-i7.tar.gz" | sha256sum -c -
          rm -rf /tmp/candidate-12-i7
          mkdir -p /tmp/candidate-12-i7
          tar -xzf /tmp/candidate-12-i7.tar.gz -C /tmp/candidate-12-i7
          test -f /tmp/candidate-12-i7/research/candidate-12/logic.py
          test -f /tmp/candidate-12-i7/research/candidate-12/strategy_adapter.py
          test -f /tmp/candidate-12-i7/research/candidate-12/config.json
          test -f /tmp/candidate-12-i7/research/candidate-12/test_logic.py
          cp -a /tmp/candidate-12-i7/research/candidate-12/. "$ROOT/"
          rm -f "$ROOT"/update-i7.part*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/candidate-12
          git commit -m "candidate-12: install causal session auction router"
          git push origin HEAD:research/candidate-12
