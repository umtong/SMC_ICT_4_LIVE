name: candidate-12-i23-cross-market-delivery-diagnostic

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-research.yml"
      - "research/candidate-12/diagnose_i23_crossmarket.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-12-i23-cross-market-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Verify unchanged I19 strategy and diagnostic
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(git hash-object research/candidate-12/logic.py)" = "848b278d492249cee867f4c8978a1e62086b6d45"
          test "$(git hash-object research/candidate-12/test_logic.py)" = "c145bdfcb9576a6675dc354e4ae5f40bb266e5b6"
          test "$(git hash-object research/candidate-12/config.json)" = "160557c044e7fc315fc802bfe7f1c3f974b53374"
          test "$(git hash-object research/candidate-12/strategy_adapter.py)" = "c8f1a2c30fc598bda1b03adaafde3b4a55f50018"
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

      - name: Reproduce I19 W1 and W12 baseline
        shell: bash
        run: |
          set -euo pipefail
          for W in W1 W12; do
            O="artifacts/candidate-12/BTCUSDT-${W}"
            mkdir -p "$O"
            python research/candidate-12/run.py --symbol BTCUSDT --week "$W" --output "$O" | tee "$O.console.json"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/candidate-12")
          expected = {"W1": 6, "W12": 4}
          for week, count in expected.items():
              item = json.loads((root / f"BTCUSDT-{week}" / "metrics.json").read_text())
              assert item["closed_trades"] == count, (week, item)
              assert item["wins"] == count and item["losses"] == 0, (week, item)
              assert item["risk_budget_passed"] and item["global_slot_passed"], item
              assert item["event_log_valid"] and not item["engine_errors"], item
              assert not item["liquidation_detected"], item
          PY

      - name: Screen cross-market delivery states
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-12/diagnose_i23_crossmarket.py \
            --weeks W1 W12 \
            --data-dir /tmp/candidate-12-i23-data \
            --baseline-root artifacts/candidate-12 \
            --output artifacts/candidate-12/I23-cross-market-delivery.json
          cat artifacts/candidate-12/I23-cross-market-delivery.json

      - name: Preserve reproducible diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-12-I23-cross-market-delivery-${{ github.sha }}
          path: artifacts/candidate-12
          if-no-files-found: warn
