name: candidate-01-nautilus-tick-contract

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-nautilus-tick-contract.yml"
      - "research/candidate-01/nautilus_tick_contract_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute and smoke-test the pinned TradeTick API
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-01-nautilus-tick-contract
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q research/candidate-01/nautilus_tick_contract_probe.py
              python research/candidate-01/nautilus_tick_contract_probe.py \
                | tee artifacts/candidate-01-nautilus-tick-contract/contract.txt
              grep -q "engine tick smoke OK 3" \
                artifacts/candidate-01-nautilus-tick-contract/contract.txt
              grep -q "Strategy subscribe_trade_ticks True" \
                artifacts/candidate-01-nautilus-tick-contract/contract.txt
            '
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-nautilus-tick-contract-${{ github.sha }}
          path: artifacts/candidate-01-nautilus-tick-contract
          if-no-files-found: error
          retention-days: 30
