name: research-candidate-ml-easychart-b-round1

on:
  workflow_dispatch:
  push:
    branches: ["research_candidate_ML_easychart_b"]
    paths:
      - ".github/workflows/research-candidate-ml-easychart-b-round1.yml"
      - "research/candidate-ml-easychart-b/**"

concurrency:
  group: research-candidate-ml-easychart-b-round1
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

env:
  CANDIDATE: research/candidate-ml-easychart-b
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python -m py_compile \
            "$CANDIDATE/easychart_b.py" \
            "$CANDIDATE/harvest_capped.py"
          python -m pytest -q "$CANDIDATE/test_easychart_b.py"

  harvest:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {period: f1-2023-mar, start: 2023-03-11, end: 2023-03-18}
          - {period: f1-2024-jun, start: 2024-06-12, end: 2024-06-19}
          - {period: f1-2025-apr, start: 2025-04-10, end: 2025-04-17}
          - {period: f1-2026-jul, start: 2026-07-10, end: 2026-07-17}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: source/research/candidate-1k-auction-system:source/research/candidate-auction-episode-system:source/research/candidate-liquidity-auction-v6:source/research/candidate-liquidity-auction-v5:source/research/candidate-coherent-auction-system-v4:source/research/candidate-coherent-auction-system-v3:source/research/candidate-coherent-liquidity-policy-v2:source/research/candidate-coherent-liquidity-policy-v1:source/research/candidate-hierarchical-liquidity-bpr-v2:source/research/candidate-hierarchical-liquidity-bpr-v1:source/research/candidate-liquidity-displacement-v1:source/research/candidate-auction-dislocation-confluence-v1:source/research/candidate-derivatives-dislocation-v1:source/research/candidate-auction-episode-policy:source/research/candidate-auction-event-v2:source/research/candidate-direct-auction-policy:source/research/candidate-easychart_re1:source/research/candidate-easychart-v5:source/research/candidate-easychart-v3
      CACHE: .cache/candidate-ml-easychart-b/round1/${{ matrix.period }}
      OUT: artifacts/candidate-ml-easychart-b/round1/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1664920c3fb71ae1586e32b77082b465e8aab16b
          path: source
      - run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python "$CANDIDATE/harvest_capped.py" \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-b-r1-${{ matrix.period }}
          path: artifacts/candidate-ml-easychart-b/round1/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  route-and-publish:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      ROOT: artifacts/candidate-ml-easychart-b/round1/downloaded
      RESULT: artifacts/candidate-ml-easychart-b/round1/result
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: easychart-b-r1-*
          path: artifacts/candidate-ml-easychart-b/round1/downloaded
          merge-multiple: false
      - run: |
          set -euo pipefail
          rm -rf "$RESULT"
          python "$CANDIDATE/easychart_b.py" \
            --root "$ROOT" \
            --period-bounds "$CANDIDATE/fresh_round1_periods.json" \
            --output "$RESULT"
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-b-round1-integrated-result
          path: artifacts/candidate-ml-easychart-b/round1/result/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - run: |
          set -euo pipefail
          DEST=research_results/candidate_ml_easychart_b/round1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$RESULT/summary.json" "$DEST/"
          cp "$RESULT/closed_trades.csv" "$DEST/"
          cp "$RESULT/selected_orders.csv" "$DEST/"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "results(easychart-b): publish round1 integrated account [skip ci]"
            git push origin HEAD:research_candidate_ML_easychart_b
          fi
