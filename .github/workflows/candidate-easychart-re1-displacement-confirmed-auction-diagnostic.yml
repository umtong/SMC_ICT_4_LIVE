name: candidate-easychart-re1-displacement-confirmed-auction-diagnostic

on:
  push:
    branches: ["ML_a"]
    paths:
      - ".github/workflows/candidate-easychart-re1-displacement-confirmed-auction-diagnostic.yml"
      - "research/candidate-easychart_re1/.displacement_confirmed_auction_dispatch_marker"
      - "research/candidate-easychart_re1/easychart_re1_displacement_confirmed_auction.py"
      - "research/candidate-easychart_re1/easychart_re1_delivery_confirmed_auction.py"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_displacement_confirmed_auction.py"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_delivery_confirmed_auction.py"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py"
      - "research/candidate-easychart-v5/mtf_backtest_support_v5.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-displacement-confirmed-auction-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile displacement-confirmed policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_displacement_confirmed_auction.py \
            research/candidate-easychart_re1/easychart_re1_delivery_confirmed_auction.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_displacement_confirmed_auction.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_delivery_confirmed_auction.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py \
            research/candidate-easychart-v5/mtf_backtest_support_v5.py
      - name: Verify body-dominant candle and higher-frame contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from domain import Candle, Side
          from easychart_re1_displacement_confirmed_auction import (
              BODY_DOMINANT_DELIVERY_RULE,
              DISPLACEMENT_CONFIRMED_AUCTION_RULE,
              EasyChartRE1DisplacementConfirmedAuctionBundle,
          )

          bundle = EasyChartRE1DisplacementConfirmedAuctionBundle("BTCUSDT", 0.1, 1.0)
          strong = Candle(
              ts_close_ns=300_000_000_000,
              open=100.0,
              high=102.0,
              low=99.8,
              close=101.8,
              volume=1.0,
          )
          weak = Candle(
              ts_close_ns=600_000_000_000,
              open=100.0,
              high=102.0,
              low=99.0,
              close=100.2,
              volume=1.0,
          )
          assert bundle._body_dominant(strong)
          assert not bundle._body_dominant(weak)

          bars = {
              60: Candle(
                  ts_close_ns=3_600_000_000_000,
                  open=100.0,
                  high=102.0,
                  low=99.0,
                  close=101.0,
                  volume=1.0,
              ),
              15: Candle(
                  ts_close_ns=3_600_000_000_000,
                  open=101.0,
                  high=103.0,
                  low=100.5,
                  close=102.0,
                  volume=1.0,
              ),
              5: strong,
          }
          for timeframe in (60, 15, 5):
              bundle.on_bar(timeframe, bars[timeframe])
          assert bundle._frames_align(Side.LONG, (60, 15, 5))
          assert bundle._body_dominant(bundle._last_completed[5])
          assert "BODY" in BODY_DOMINANT_DELIVERY_RULE
          assert "60M_15M" in DISPLACEMENT_CONFIRMED_AUCTION_RULE
          print({
              "scenario_engine": type(bundle).__name__,
              "strong_body_dominant": bundle._body_dominant(strong),
              "weak_body_dominant": bundle._body_dominant(weak),
              "higher_delivery_side": Side.LONG.name,
              "rules": (
                  BODY_DOMINANT_DELIVERY_RULE,
                  DISPLACEMENT_CONFIRMED_AUCTION_RULE,
              ),
          })
          PY

  matched-diagnostic:
    needs: contract-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: fresh-february-2024
            start: 2024-02-15
            end: 2024-02-17
          - period: fresh-september-2024
            start: 2024-09-15
            end: 2024-09-17
          - period: fresh-march-2025
            start: 2025-03-15
            end: 2025-03-17
          - period: fresh-december-2025
            start: 2025-12-05
            end: 2025-12-07
          - period: fresh-april-2026
            start: 2026-04-15
            end: 2026-04-17
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-displacement-confirmed-auction/${{ matrix.period }}
      ROOT_OUT: artifacts/candidate-easychart-re1-displacement-confirmed-auction/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Run full skilled opportunity baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$ROOT_OUT/baseline"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT_OUT/baseline" \
            --fee-profile usd_m_vip0
      - name: Run higher-delivery-only candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/delivery_confirmed"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_delivery_confirmed_auction.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT_OUT/delivery_confirmed" \
            --fee-profile usd_m_vip0
      - name: Run body-dominant displacement candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/displacement_confirmed"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_displacement_confirmed_auction.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT_OUT/displacement_confirmed" \
            --fee-profile usd_m_vip0
      - name: Print matched continuous-account comparison
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("${{ env.ROOT_OUT }}")
          result = {
              "period": "${{ matrix.period }}",
              "start": "${{ matrix.start }}",
              "end": "${{ matrix.end }}",
          }
          keys = (
              "candidate", "calendar_days", "closed_positions",
              "independent_completed_trades", "independent_trades_per_day",
              "final_nav", "ending_nav", "total_return", "max_drawdown",
              "max_drawdown_pct", "liquidations", "trade_windows",
          )
          for name in (
              "baseline",
              "delivery_confirmed",
              "displacement_confirmed",
          ):
              path = root / name / "metrics.json"
              if not path.exists():
                  result[name] = {"status": "MISSING_METRICS"}
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              result[name] = {key: data.get(key) for key in keys if key in data}
              result[name]["all_metric_keys"] = sorted(data)
          print("MATCHED_RESULT=" + json.dumps(result, sort_keys=True))
          PY
      - name: Preserve account, trades and displacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-displacement-confirmed-auction-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-displacement-confirmed-auction/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
