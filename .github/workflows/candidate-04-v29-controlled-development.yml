name: candidate-04-v29-controlled-development

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v29-controlled-development.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact completed-data observations
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v27-cross-*
          path: sources
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31105658664
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact V28 engine evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v28-cross-development-4a3e0bc7042cb360d270c6857829f9f9c2226128
          path: original_v28
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31107841643
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fixed runtime and controlled contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/failed_external_break_retest_extreme_tail_compiler.py \
            research/candidate-04/balanced_session_material_inventory_compiler.py \
            research/candidate-04/rich_signal_compiler_v28_extreme_break.py \
            research/candidate-04/rich_signal_compiler_v28_material_balanced_oi.py \
            research/candidate-04/rich_signal_compiler_v29.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_v28_inventory_and_extreme_refinements.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_rich_signal_compiler_v29.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Compile and execute two one-variable controls and V29
        shell: bash
        run: |
          set -euo pipefail
          names=(low_activity normal_basis stress_a year_end autumn may_2024)
          build_starts=(2023-08-02 2023-12-16 2024-08-05 2024-12-25 2025-10-18 2024-05-25)
          build_ends=(2023-08-10 2023-12-24 2024-08-13 2025-01-02 2025-10-26 2024-06-02)
          eval_starts=(2023-08-04 2023-12-18 2024-08-07 2024-12-27 2025-10-20 2024-05-27)
          eval_ends=(2023-08-10 2023-12-24 2024-08-13 2025-01-02 2025-10-26 2024-06-02)
          variants=(extreme_break material_oi v29)
          compilers=(
            research/candidate-04/rich_signal_compiler_v28_extreme_break.py
            research/candidate-04/rich_signal_compiler_v28_material_balanced_oi.py
            research/candidate-04/rich_signal_compiler_v29.py
          )

          for i in "${!names[@]}"; do
            name="${names[$i]}"
            export C04_BUILD_START="${build_starts[$i]}"
            export C04_BUILD_END="${build_ends[$i]}"
            source="$(find sources -mindepth 1 -maxdepth 1 -type d -name "candidate-04-v27-cross-${name}-*" | head -n1)"
            test -n "$source"
            test -s "$source/source/rich/data_manifest.json"
            original="original_v28/$name"
            test -s "$original/nautilus/metrics.json"
            root="artifacts/candidate-04-v29-controlled/$name"
            mkdir -p "$root/original_v28"
            cp "$original/nautilus/metrics.json" "$root/original_v28/metrics.json"
            cp "$original/summary.json" "$root/original_v28/summary.json" 2>/dev/null || true

            for j in "${!variants[@]}"; do
              variant="${variants[$j]}"
              compiler="${compilers[$j]}"
              python "$compiler" \
                --base-config research/candidate-04/inventory_transfer_config.json \
                --impact-config research/candidate-04/impact_exhaustion_config.json \
                --router-config research/candidate-04/auction_activity_router_config.json \
                --rich-dir "$source/source/rich" \
                --kline-dir ".cache/candidate-04-v29-controlled/$name/raw" \
                --evaluation-start "${eval_starts[$i]}" \
                --evaluation-end "${eval_ends[$i]}" \
                --output "$root/$variant/signals" \
                --download-klines \
                > "$root/${variant}_compiler_console.json"
              test -s "$root/$variant/signals/signals.json"
              test -s "$root/$variant/signals/summary.json"

              C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/$variant/signals/signals.json" \
              python research/candidate-04/nt_backtest_v22_rich_router.py \
                --config research/candidate-04/nt_liquidity_config.json \
                --build-start "$C04_BUILD_START" \
                --build-end "$C04_BUILD_END" \
                --evaluation-start "${eval_starts[$i]}" \
                --evaluation-end "${eval_ends[$i]}" \
                --cache ".cache/candidate-04-v29-controlled/$name/raw" \
                --output "$root/$variant/nautilus" \
                > "$root/$variant/nautilus_console.json"
              test -s "$root/$variant/nautilus/metrics.json"
              test -e "$root/$variant/nautilus/positions.csv"
              test -s "$root/$variant/nautilus/strategy_events.json"
            done
          done

      - name: Verify risk and aggregate controlled results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v29-controlled")
          names = ["low_activity", "normal_basis", "stress_a", "year_end", "autumn", "may_2024"]
          variants = ["original_v28", "extreme_break", "material_oi", "v29"]
          weeks = {}

          def load_variant(week, variant):
              base = root / week / variant
              metrics = json.loads((base / "metrics.json").read_text()) if variant == "original_v28" else json.loads((base / "nautilus/metrics.json").read_text())
              if variant == "original_v28":
                  return {
                      "trades": metrics.get("trades"),
                      "wins": metrics.get("wins"),
                      "win_rate": metrics.get("win_rate"),
                      "total_return": metrics.get("total_return"),
                      "geometric_daily_growth": metrics.get("geometric_daily_growth"),
                      "active_days": metrics.get("active_days"),
                      "max_drawdown": metrics.get("max_drawdown"),
                      "largest_winner_share": metrics.get("largest_winner_share"),
                      "scenario_metrics": metrics.get("scenario_metrics"),
                  }
              signals = json.loads((base / "signals/summary.json").read_text())
              events = json.loads((base / "nautilus/strategy_events.json").read_text())
              try:
                  positions = pd.read_csv(base / "nautilus/positions.csv")
              except EmptyDataError:
                  positions = pd.DataFrame()
              entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
              if len(entries) != len(positions.index):
                  raise SystemExit(f"{week}/{variant}: entry-position mismatch")
              losses = []
              for position, entry in zip(positions.to_dict("records"), entries):
                  pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
                  if pnl < 0.0:
                      losses.append(abs(pnl) / float(entry["details"]["equity"]))
              maximum = max(losses, default=0.0)
              if maximum > 0.0301:
                  raise SystemExit(f"{week}/{variant}: realized loss exceeded 3% NAV")
              return {
                  "signals": signals.get("written_signals"),
                  "route_counts": signals.get("route_counts"),
                  "trades": metrics.get("trades"),
                  "wins": metrics.get("wins"),
                  "win_rate": metrics.get("win_rate"),
                  "total_return": metrics.get("total_return"),
                  "geometric_daily_growth": metrics.get("geometric_daily_growth"),
                  "active_days": metrics.get("active_days"),
                  "max_drawdown": metrics.get("max_drawdown"),
                  "largest_winner_share": metrics.get("largest_winner_share"),
                  "gate_checks": metrics.get("gate_checks"),
                  "gate_pass": metrics.get("gate_pass"),
                  "scenario_metrics": metrics.get("scenario_metrics"),
                  "maximum_realized_loss_fraction": maximum,
              }

          for name in names:
              weeks[name] = {variant: load_variant(name, variant) for variant in variants}
              (root / name / "comparison.json").write_text(
                  json.dumps(weeks[name], indent=2, sort_keys=True) + "\n"
              )

          aggregate = {}
          for variant in variants:
              values = [float(weeks[name][variant]["total_return"]) for name in names]
              compounded = math.prod(1.0 + value for value in values) - 1.0
              trades = sum(int(weeks[name][variant]["trades"]) for name in names)
              wins = sum(int(weeks[name][variant]["wins"]) for name in names)
              daily = (1.0 + compounded) ** (1.0 / 42.0) - 1.0
              aggregate[variant] = {
                  "calendar_days": 42,
                  "all_weeks_positive": all(value > 0.0 for value in values),
                  "compounded_return": compounded,
                  "geometric_daily_growth": daily,
                  "trades": trades,
                  "wins": wins,
                  "win_rate": wins / trades if trades else 0.0,
                  "development_target_reached": all(value > 0.0 for value in values) and daily >= 0.01,
              }

          result = {
              "candidate": "candidate-04-v29-controlled-development",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "one_variable_controls": {
                  "extreme_break": "q95 to q99 parent-impact boundary only",
                  "material_oi": "OI > 0 to shifted positive-step median only",
              },
              "combined": "V29 applies both independent state corrections",
              "weeks": weeks,
              "aggregate": aggregate,
              "final_validation_completed": False,
          }
          (root / "aggregate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v29-controlled-development-${{ github.sha }}
          path: artifacts/candidate-04-v29-controlled
          if-no-files-found: error
          retention-days: 90
