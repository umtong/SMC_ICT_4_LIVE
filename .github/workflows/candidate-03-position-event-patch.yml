name: candidate-03-position-closed-contract-patch

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-position-event-patch.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Align PositionClosed access with NautilusTrader 1.230
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('research/candidate-03/nt_lvcfr_strategy.py')
          text = path.read_text(encoding='utf-8')
          old = '''        timestamp_ns = int(event.ts_closed)\n        equity_after = self._equity()\n        equity_before = active.equity_before\n        pnl = equity_after - equity_before\n        leg = {\n            \"scenario_id\": active.signal[\"scenario_id\"],\n            \"kind\": active.kind,\n            \"direction\": \"LONG\" if active.direction > 0 else \"SHORT\",\n            \"entry_time_ns\": active.entry_time_ns,\n            \"exit_time_ns\": timestamp_ns,\n            \"entry_price\": active.entry_avg,\n            \"exit_price\": float(event.avg_px_close),\n            \"quantity\": float(event.peak_qty),\n            \"planned_loss\": active.planned_loss,\n            \"native_equity_before\": equity_before,\n            \"native_equity_after\": equity_after,\n            \"native_account_pnl\": pnl,\n            \"net_r\": pnl / active.planned_loss if active.planned_loss > 0 else 0.0,\n            \"realized_pnl_event\": str(event.realized_pnl),\n            \"realized_return_event\": float(event.realized_return),\n            \"duration_ns\": int(event.duration_ns),\n            \"exit_reason\": self.exit_reason or \"UNKNOWN\",\n            \"protection_active\": active.protection_active,\n            \"mfe_net_r\": active.mfe_net_r,\n        }\n'''
          new = '''        timestamp_ns = int(event.ts_closed) if event.ts_closed is not None else int(event.ts_event)\n        exit_price = float(event.avg_px_close) if event.avg_px_close is not None else float(event.last_px)\n        equity_after = self._equity()\n        equity_before = active.equity_before\n        pnl = equity_after - equity_before\n        leg = {\n            \"scenario_id\": active.signal[\"scenario_id\"],\n            \"kind\": active.kind,\n            \"direction\": \"LONG\" if active.direction > 0 else \"SHORT\",\n            \"entry_time_ns\": active.entry_time_ns,\n            \"exit_time_ns\": timestamp_ns,\n            \"entry_price\": active.entry_avg,\n            \"exit_price\": exit_price,\n            \"quantity\": float(event.peak_quantity),\n            \"planned_loss\": active.planned_loss,\n            \"native_equity_before\": equity_before,\n            \"native_equity_after\": equity_after,\n            \"native_account_pnl\": pnl,\n            \"net_r\": pnl / active.planned_loss if active.planned_loss > 0 else 0.0,\n            \"realized_pnl_event\": str(event.realized_pnl),\n            \"realized_return_event\": float(event.realized_return),\n            \"duration_ns\": int(event.duration),\n            \"exit_reason\": self.exit_reason or \"UNKNOWN\",\n            \"protection_active\": active.protection_active,\n            \"mfe_net_r\": active.mfe_net_r,\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'PositionClosed leg target count={text.count(old)}')
          text = text.replace(old, new)
          old = '''            reference_price=float(event.avg_px_close),\n'''
          new = '''            reference_price=exit_price,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'PositionClosed emit target count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('research/candidate-03/test_nt_lvcfr.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''class ConfigTests(unittest.TestCase):\n'''
          replacement = '''class PositionEventContractTests(unittest.TestCase):\n    def test_strategy_uses_nautilus_1230_position_closed_fields(self) -> None:\n        source = Path(__file__).with_name("nt_lvcfr_strategy.py").read_text(encoding="utf-8")\n        self.assertIn("event.peak_quantity", source)\n        self.assertIn("event.duration", source)\n        self.assertNotIn("event.peak_qty", source)\n        self.assertNotIn("event.duration_ns", source)\n        self.assertIn("event.ts_closed is not None", source)\n        self.assertIn("event.avg_px_close is not None", source)\n\n\nclass ConfigTests(unittest.TestCase):\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'test marker count={tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement), encoding='utf-8')
          PY

          IMAGE=ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" bash -c '
            smc4 doctor &&
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
              python research/candidate-03/test_nt_lvcfr.py &&
            PYTHONPYCACHEPREFIX=/tmp/candidate-03-pycache \
              python -m compileall -q research/candidate-03 src/smc_ict_4
          '

          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add research/candidate-03/nt_lvcfr_strategy.py research/candidate-03/test_nt_lvcfr.py
          git commit -m "candidate-03: align native position close event fields"
          git push origin HEAD:research/candidate-03
