name: candidate-57-ichi-v2-5m-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-ichi-v2-5m-v1.yml"
      - "research/candidate-57/ICHI_V2_5M_V1_FREEZE.md"
      - "research/candidate-57/router_ichi_v2_5m.py"
      - "research/candidate-57/router_ichi_v2_runtime.py"
      - "research/candidate-57/strategy_ichi_v2_5m.py"
      - "research/candidate-57/ichi_v2_5m_campaign.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-ichi-v2-5m-v1
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble public ichiV2 on reused project execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/ICHI_V2_5M_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_ichi_v2_5m.py research/candidate-51/router_ichi_v2_impl.py
          cp research/candidate-57/router_ichi_v2_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_ichi_v2_5m.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_ichi_v2_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/ichi_v2_5m_campaign.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove causal source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from router import RouteConfig, _heikin_ashi, _signal_at, _source_arrays
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_picasso import Candidate35Strategy as PublicExecutionShell

          assert issubclass(Candidate35Strategy, PublicExecutionShell)
          fields = set(Candidate35Config.__struct_fields__)
          required = {
              "ichi_trigger_mode",
              "ichi_side_mode",
              "ichi_profile",
              "ichi_shift_inputs_one_candle",
              "ichi_fan_shift_value",
              "ichi_min_fan_magnitude_gain",
              "ichi_ignore_roi_if_entry_signal",
              "ichi_exit_indicator",
          }
          assert required.issubset(fields), required - fields
          route_source = inspect.getsource(_source_arrays)
          assert "chikou" not in route_source.lower()
          assert "ichi_displacement) - 1" in route_source
          signal_source = inspect.getsource(_signal_at)
          for token in (
              "fan > 1.0",
              "fan_gain >= gain_threshold",
              "fan < 1.0",
              "fan_gain <= 1.0 / gain_threshold",
          ):
              assert token in signal_source, token
          management = inspect.getsource(Candidate35Strategy._manage_open_position)
          assert "_source_entry_signal_active" in management
          assert "_ExecutionShell._manage_open_position" in management
          assert "PUBLIC_ICHI_SOURCE_SIGNAL_EXIT" in management
          assert callable(_heikin_ashi) and callable(RouteConfig)
          print("causal ichiV2 source, management and one-slot shell contracts verified")
          PY

      - name: Run conditional source tournament with trade ledgers
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-ichi-v2-5m-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/ichi_v2_5m_campaign.py \
            2>&1 | tee .work/candidate-57-ichi-v2-5m-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_ichi_v2_impl.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/ichi-v2-5m-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist public ichiV2 evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete tournament artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-ichi-v2-5m-v1
          path: |
            research/candidate-57/evidence/ichi-v2-5m-v1
            .work/candidate-57-ichi-v2-5m-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "ichiV2 tournament failed mechanically; status=$status"
            exit "${status:-1}"
          fi
