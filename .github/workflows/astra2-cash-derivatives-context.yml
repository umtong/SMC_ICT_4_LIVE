name: Astra2 cash and derivatives context
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths: [.github/workflows/astra2-cash-derivatives-context.yml]
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reuse previously implemented observation sources
        run: |
          python - <<'PY'
          import sys
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          sys.path.insert(0,'research/candidate-ml-easychart-astra2')
          import download_inputs as source
          source.MONTHS=('2025-09','2025-10','2025-12')
          with ThreadPoolExecutor(max_workers=8) as pool:
              records=list(pool.map(source.download,source.jobs(Path('missing_extended'),True)))
          errors=[r for r in records if 'error' in r]
          if errors: raise RuntimeError(errors)
          print(len(records),'earlier observation archives available')
          PY
          tar -czf missing-extended.tar.gz missing_extended
      - uses: actions/upload-artifact@v4
        with:
          name: astra2-missing-extended
          path: missing-extended.tar.gz
          compression-level: 0
          retention-days: 7
