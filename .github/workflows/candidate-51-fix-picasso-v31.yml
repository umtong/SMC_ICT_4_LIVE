name: candidate-51-fix-picasso-v31

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-fix-picasso-v31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0
      - name: Patch msgspec Struct field introspection and pending-exit guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/candidate-51-picasso-repair-v31.yml')
          text = workflow.read_text()
          old = 'fields = Candidate35Config.__dataclass_fields__'
          new = 'fields = set(Candidate35Config.__struct_fields__)'
          if old not in text and new not in text:
              raise RuntimeError('Picasso workflow field introspection marker not found')
          workflow.write_text(text.replace(old, new))

          strategy = Path('research/candidate-51/strategy_picasso_repair.py')
          text = strategy.read_text()
          old = '''    def _manage_open_position(self, ts_event: int) -> None:\n        self._update_path_anatomy()\n'''
          new = '''    def _manage_open_position(self, ts_event: int) -> None:\n        if self._repair_exit_pending:\n            return\n        self._update_path_anatomy()\n'''
          if old not in text and new not in text:
              raise RuntimeError('Picasso pending-exit guard marker not found')
          strategy.write_text(text.replace(old, new))
          PY
          git config user.name "candidate-51-research-bot"
          git config user.email "candidate-51-research-bot@users.noreply.github.com"
          git add .github/workflows/candidate-51-picasso-repair-v31.yml research/candidate-51/strategy_picasso_repair.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate51: fix Picasso workflow implementation path"
          git pull --rebase origin research/candidate-51
          git push origin HEAD:research/candidate-51
