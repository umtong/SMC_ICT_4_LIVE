name: candidate-05-authoritative-state-v3

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/evidence/final_evidence_audit.json"
      - "research/candidate-05/evidence/end_to_end_research_v2.json"
      - "research/candidate-05/authoritative_state_v3.py"
      - "research/candidate-05/tests/test_authoritative_state_v3.py"
      - ".github/workflows/candidate-05-authoritative-state-v3.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-authoritative-state-v3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and resolve final authoritative state
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest \
            research/candidate-05/tests/test_authoritative_state_v2.py \
            research/candidate-05/tests/test_authoritative_state_v3.py -v
          PYTHONPATH=research/candidate-05 python \
            research/candidate-05/authoritative_state_v3.py \
            --evidence-root research/candidate-05/evidence \
            --json research/candidate-05/evidence/authoritative_state_v3.json \
            --markdown research/candidate-05/evidence/authoritative_state_v3.md
          test -s research/candidate-05/evidence/authoritative_state_v3.json
          test -s research/candidate-05/evidence/authoritative_state_v3.md

      - name: Persist conflict-resistant final authority without a loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-05/evidence/authoritative_state_v3.json \
            research/candidate-05/evidence/authoritative_state_v3.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-05: refresh audited authoritative state v3"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin research/candidate-05
            if git push origin HEAD:research/candidate-05; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
