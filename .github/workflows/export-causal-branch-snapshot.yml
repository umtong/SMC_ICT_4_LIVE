name: Export causal branch snapshot

on:
  push:
    branches: ["research_causal_liquidity_route_system"]
    paths:
      - ".github/workflows/export-causal-branch-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_causal_liquidity_route_system
      - name: Record run id
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-causal-export
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-causal-export
          git commit -m "Record causal export run $GITHUB_RUN_ID" || true
          git push origin HEAD:research_causal_liquidity_route_system
      - name: Collect research source and results
        run: |
          set -euo pipefail
          mkdir -p snapshot
          cp -a research/candidate-causal-liquidity-route-system snapshot/
          if [ -d research_results/causal_liquidity_route_system ]; then
            cp -a research_results/causal_liquidity_route_system snapshot/
          fi
          find snapshot -type f -printf '%P\n' | sort > snapshot/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: causal-liquidity-route-snapshot
          path: snapshot/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
