name: Candidate 09 final controlled evaluator

on:
  push:
    branches:
      - research/candidate-09
    paths:
      - .github/workflows/candidate-09-final-controller.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-09-final-controller
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore frozen contract and run controlled evaluation
        shell: bash
        env:
          SMC4_DATA_ROOT: .cache/candidate-09
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/final-controller"
          beacon="$root/beacon"
          rm -rf "$out" "$diag" "$beacon"
          mkdir -p "$out" "$diag" "$beacon"

          cat > "$root/config.json" <<'JSON'
          {
            "candidate": "candidate-09",
            "version": "0.1.0",
            "hypothesis": "A liquidity breach has no directional meaning until post-breach absorption/reclaim or depletion/acceptance is observed.",
            "instrument": "BTCUSDT",
            "venue": "BINANCE_UM_FUTURES",
            "bar_interval": "1m",
            "fixed_gate_weeks_utc": [
              {"name": "week-a", "start": "2022-02-07", "days": 7},
              {"name": "week-b", "start": "2023-06-12", "days": 7},
              {"name": "week-c", "start": "2024-10-14", "days": 7}
            ],
            "risk": {
              "risk_fraction": 0.03,
              "starting_nav_usdt": 100000.0,
              "composite_taker_cost_per_fill": 0.00075,
              "description": "5 bp taker fee plus 2 bp slippage/impact and 0.5 bp funding reserve per fill-equivalent"
            },
            "structure": {
              "pivot_left_bars": 5,
              "pivot_right_bars": 5,
              "atr_period": 20,
              "volume_period": 60,
              "minimum_pivot_prominence_atr": 0.45,
              "maximum_active_pools_per_side": 24
            },
            "breach": {
              "minimum_breach_atr": 0.06,
              "reclaim_buffer_atr": 0.02,
              "acceptance_buffer_atr": 0.10,
              "acceptance_closes": 2,
              "timeout_bars": 9,
              "retest_timeout_bars": 6,
              "retest_tolerance_atr": 0.12,
              "stop_buffer_atr": 0.10
            },
            "flow": {
              "directional_imbalance": 0.12,
              "opposite_confirmation": -0.02,
              "minimum_volume_ratio": 0.85,
              "minimum_displacement_atr": 0.30,
              "absorption_max_progress_atr": 0.12,
              "absorption_min_wick_atr": 0.20
            },
            "trade": {
              "minimum_net_reward_to_risk": 1.10,
              "maximum_holding_minutes": 240,
              "flat_before_utc_midnight_minutes": 5,
              "cooldown_bars": 5
            },
            "gate": {
              "minimum_trades_per_week": 5,
              "minimum_pooled_daily_geometric_return": 0.01,
              "maximum_single_trade_profit_share": 0.35,
              "require_all_weeks_positive": true
            },
            "long_evaluation": {
              "run_only_after_gate": true,
              "start": "2022-01-01",
              "end_exclusive": "2025-01-01",
              "success_daily_geometric_return": 0.01
            }
          }
          JSON

          python - <<'PY'
          from pathlib import Path
          p = Path('research/candidate-09/run.py')
          s = p.read_text()
          s = s.replace(
              'from nautilus_trader.backtest.engine import BacktestEngine, BacktestEngineConfig\nfrom nautilus_trader.config import LoggingConfig\n',
              'from nautilus_trader.backtest.engine import BacktestEngine\nfrom nautilus_trader.config import BacktestEngineConfig, LoggingConfig\n',
          )
          s = s.replace(
              '    flow_map = {bar.ts_ns: bar for bar in bars}\n',
              '    flow_map = {int(nautilus_bar.ts_init): flow_bar for nautilus_bar, flow_bar in zip(nautilus_bars, bars)}\n',
          )
          p.write_text(s)
          PY
          rm -f "$root/.resource_probe" "$root/.resource_probe_2" "$root/.known_blob"

          sync_code=99
          doctor_code=99
          tests_code=99
          gate_code=99

          uv sync --frozen --all-groups > "$diag/sync.log" 2>&1
          sync_code=$?
          if [[ "$sync_code" == 0 ]]; then
            uv run smc4 doctor > "$diag/doctor.log" 2>&1
            doctor_code=$?
          else
            printf 'not run because sync failed\n' > "$diag/doctor.log"
          fi
          if [[ "$doctor_code" == 0 ]]; then
            uv run python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1
            tests_code=$?
          else
            printf 'not run because doctor failed\n' > "$diag/tests.log"
          fi
          if [[ "$tests_code" == 0 ]]; then
            uv run python "$root/run.py" gate \
              --auto-long \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" > "$diag/gate.log" 2>&1
            gate_code=$?
          else
            printf 'not run because tests failed\n' > "$diag/gate.log"
          fi

          SYNC_CODE="$sync_code" DOCTOR_CODE="$doctor_code" TESTS_CODE="$tests_code" GATE_CODE="$gate_code" python - <<'PY'
          from __future__ import annotations
          import json, math, os, re
          from pathlib import Path

          root = Path('research/candidate-09')
          out = root / 'evidence/latest'
          diag = root / 'diagnostics/final-controller'
          beacon = root / 'beacon'
          codes = {
              'sync': int(os.environ['SYNC_CODE']),
              'doctor': int(os.environ['DOCTOR_CODE']),
              'tests': int(os.environ['TESTS_CODE']),
              'gate': int(os.environ['GATE_CODE']),
          }
          first_failure = next((name for name, code in codes.items() if code != 0), None)

          def emit(name: str, value: str | None = None) -> None:
              safe = re.sub(r'[^A-Za-z0-9_.=-]+', '_', name)[:220]
              text = value if value is not None else safe
              (beacon / safe).write_text(text + '\n')

          def emit_int(name: str, value: int | None, width: int = 56) -> None:
              if value is None:
                  emit(f'{name}_NONE', f'{name}=NONE')
                  return
              emit(f'{name}_SIGN_{"NEG" if value < 0 else "NONNEG"}', f'{name}_SIGN={"NEG" if value < 0 else "NONNEG"}')
              magnitude = abs(int(value))
              for bit in range(width):
                  if magnitude & (1 << bit):
                      emit(f'{name}_BIT_{bit:02d}', f'{name}_BIT_{bit:02d}=1')

          def emit_scaled(name: str, value, scale: int = 1_000_000) -> None:
              if value is None:
                  emit_int(name, None)
              else:
                  emit_int(name, round(float(value) * scale))

          emit('CONTROLLER_COMPLETED')
          for stage, code in codes.items():
              emit(f'STAGE_{stage.upper()}_EXIT_{code}', f'{stage}={code}')
          if first_failure:
              emit(f'FIRST_FAILURE_{first_failure.upper()}', first_failure)

          summary_path = out / 'summary.json'
          summary = None
          if summary_path.exists():
              try:
                  summary = json.loads(summary_path.read_text())
              except Exception as exc:
                  emit('SUMMARY_PARSE_ERROR', repr(exc))
          if summary is None:
              status = 'IMPLEMENTATION_ERROR'
              fallback = {
                  'candidate': 'candidate-09',
                  'status': status,
                  'first_failure': first_failure,
                  'codes': codes,
              }
              summary_path.write_text(json.dumps(fallback, indent=2, sort_keys=True) + '\n')
              (out / 'REPORT.md').write_text(
                  '# Candidate 09 final controlled evaluator\n\n'
                  f'**IMPLEMENTATION_ERROR** at `{first_failure}`. '
                  'The fixed weeks and strategy thresholds were not reinterpreted.\n'
              )
              summary = fallback
          status = str(summary.get('status', 'UNKNOWN'))
          emit(f'STATUS_{status}', status)

          gate = summary.get('gate') or {}
          pooled = gate.get('pooled') or {}
          if gate.get('passed') is True:
              emit('GATE_PASSED')
          elif gate.get('passed') is False:
              emit('GATE_FAILED')
          emit_scaled('GATE_DAILY_GEO_PPM', pooled.get('daily_geometric_return'))
          emit_scaled('GATE_NAV_MULTIPLE_PPM', pooled.get('nav_multiple'))
          emit_int('GATE_TRADES', pooled.get('trades'))
          emit_scaled('GATE_MAX_DRAWDOWN_PPM', pooled.get('maximum_segment_drawdown'))
          emit_scaled('GATE_MAX_SINGLE_PROFIT_SHARE_PPM', pooled.get('maximum_single_trade_profit_share'))

          diagnosis = summary.get('diagnosis') or {}
          if diagnosis.get('classification'):
              emit(f'DIAGNOSIS_{diagnosis["classification"]}', str(diagnosis['classification']))
          if diagnosis.get('largest_influence'):
              emit(f'INFLUENCE_{diagnosis["largest_influence"]}', str(diagnosis['largest_influence']))

          for index, outcome in enumerate(summary.get('baseline_weeks') or []):
              label = re.sub(r'[^A-Za-z0-9]+', '_', str(outcome.get('segment', f'week_{index}'))).upper()
              emit_scaled(f'{label}_RETURN_PPM', outcome.get('total_return'))
              emit_scaled(f'{label}_DAILY_GEO_PPM', outcome.get('daily_geometric_return'))
              emit_int(f'{label}_TRADES', outcome.get('trades'))
              emit_scaled(f'{label}_WIN_RATE_PPM', outcome.get('win_rate'))
              emit_scaled(f'{label}_MAX_DRAWDOWN_PPM', outcome.get('max_drawdown'))
              emit_int(f'{label}_REVERSAL_TRADES', outcome.get('reversal_trades'))
              emit_int(f'{label}_CONTINUATION_TRADES', outcome.get('continuation_trades'))
              emit(f'{label}_IMPLEMENTATION_{outcome.get("implementation_status", "UNKNOWN")}')

          for variant, metrics in (summary.get('ablations') or {}).items():
              label = re.sub(r'[^A-Za-z0-9]+', '_', variant).upper()
              emit_scaled(f'ABLATION_{label}_DAILY_GEO_PPM', metrics.get('daily_geometric_return'))
              emit_scaled(f'ABLATION_{label}_NAV_MULTIPLE_PPM', metrics.get('nav_multiple'))
              emit_int(f'ABLATION_{label}_TRADES', metrics.get('trades'))

          long_eval = summary.get('long_evaluation')
          if long_eval:
              emit('LONG_PRESENT')
              emit(f'LONG_STATUS_{long_eval.get("status", "UNKNOWN")}')
              outcome = long_eval.get('outcome') or {}
              emit_scaled('LONG_DAILY_GEO_PPM', outcome.get('daily_geometric_return'))
              emit_scaled('LONG_TOTAL_RETURN_PPM', outcome.get('total_return'))
              emit_int('LONG_TRADES', outcome.get('trades'))
              emit_scaled('LONG_MAX_DRAWDOWN_PPM', outcome.get('max_drawdown'))

          if first_failure:
              log = diag / f'{first_failure}.log'
              text = log.read_text(errors='replace') if log.exists() else ''
              classes = re.findall(r'(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):', text)
              if classes:
                  emit(f'EXCEPTION_CLASS_{classes[-1]}', classes[-1])
              for token in (
                  'BacktestEngineConfig', 'TestInstrumentProvider', 'BarDataWrangler',
                  'add_venue', 'add_data', 'add_strategy', 'engine.run',
                  'no causal flow observation', 'unexpected keyword',
                  'missing required positional', 'instrument not found',
                  'ts_init', 'accounting_error', 'KeyError',
              ):
                  if token.lower() in text.lower():
                      emit(f'LOG_TERM_{token}', token)

          diagnostic = {
              'codes': codes,
              'first_failure': first_failure,
              'status': status,
              'summary_exists': summary_path.exists(),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
          }
          (diag / 'diagnostic.json').write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + '\n')
          for log in diag.glob('*.log'):
              lines = log.read_text(errors='replace').splitlines()
              log.write_text('\n'.join(lines[-400:]) + ('\n' if lines else ''))
          PY

      - name: Commit exact implementation and evidence result
        if: always()
        shell: bash
        run: |
          git config user.name "candidate-09-research-bot"
          git config user.email "candidate-09-research-bot@users.noreply.github.com"
          git add -A research/candidate-09
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/candidate-09/evidence/latest/summary.json')
          print(json.loads(p.read_text()).get('status','UNKNOWN') if p.exists() else 'NO_SUMMARY')
          PY
          )
          git commit -m "candidate-09: final controlled result ${status} [candidate-09 evidence]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
