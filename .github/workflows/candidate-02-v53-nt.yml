name: candidate-02-v53-nautilustrader-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v53_nt_*.py"
      - "research/candidate-02/v53_nt_*.json"
      - ".github/workflows/candidate-02-v53-nt.yml"

permissions:
  contents: read
  actions: read

jobs:
  first-week-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - name: Checkout locked candidate branch
        uses: actions/checkout@v4

      - name: Download immutable v48 feature and raw-price artifact
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v53-first-week
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Verify prebuilt NautilusTrader runtime only
        run: smc4 doctor

      - name: Verify locked v53 source
        run: |
          python -m py_compile \
            research/candidate-02/v53_nt_core.py \
            research/candidate-02/v53_nt_strategy.py \
            research/candidate-02/v53_nt_backtest.py
          python -m json.tool research/candidate-02/v53_nt_config.json >/dev/null
          python -m json.tool research/candidate-02/v53_nt_lock.json >/dev/null

      - name: Run first BTC week through NautilusTrader
        id: screen
        shell: bash
        run: |
          mkdir -p artifacts/candidate-02-v53-nt-first-week
          set +e
          python research/candidate-02/v53_nt_backtest.py \
            --config research/candidate-02/v53_nt_config.json \
            --input-root inputs/v53-first-week \
            --output artifacts/candidate-02-v53-nt-first-week \
            | tee artifacts-v53-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v53-nt-first-week/validation_exit_code.txt
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi

      - name: Publish first-week decision
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/candidate-02-v53-nt-first-week/metrics.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/candidate-02-v53-nt-first-week/metrics.json").read_text())
          print("# Candidate-02 v53 NautilusTrader first BTC week")
          print(f"- Decision: **{m['decision']}**")
          print(f"- Trades: **{m['trades']}** ({m['trades_per_day']:.3f}/day)")
          print(f"- Win rate: **{m['win_rate']:.2%}**")
          print(f"- Cost-after PF: **{m['profit_factor_after_cost']:.3f}**")
          print(f"- Cost-after geometric daily growth: **{m['geometric_daily_growth_after_cost']:.3%}**")
          print(f"- Mark-to-market drawdown: **{m['maximum_mark_to_market_drawdown']:.2%}**")
          print(f"- Risk fraction: **{m['risk_fraction']:.2%}**")
          print(f"- NautilusTrader account source of truth: **{m['execution_model']['account_source_of_truth']}**")
          PY
          else
            echo "v53 did not produce metrics.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v53-nt-first-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v53-nt-first-week
            artifacts-v53-console.log
          if-no-files-found: warn
          retention-days: 30
