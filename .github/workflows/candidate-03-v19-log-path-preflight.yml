name: candidate-03-v19-log-path-preflight

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v19-log-path-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-03-v19-log-path-preflight
  cancel-in-progress: false

jobs:
  patch-test-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: research/candidate-03
          fetch-depth: 0

      - name: Apply controlled log-path correction and refreeze source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import re
          from pathlib import Path

          source_path = Path('research/candidate-03/derive_nt_lvcfr_v19_signals.py')
          source = source_path.read_text(encoding='utf-8')
          replacements = [
              (
                  'self.path_bp += abs(price / self.last_price - 1.0) * 10_000.0',
                  'self.path_bp += abs(math.log(price / self.last_price)) * 10_000.0',
              ),
              (
                  'direction * (block.last_price / block.first_price - 1.0) * 10_000.0',
                  'direction * math.log(block.last_price / block.first_price) * 10_000.0',
              ),
              (
                  'path += abs(current.first_price / previous.last_price - 1.0) * 10_000.0',
                  'path += abs(math.log(current.first_price / previous.last_price)) * 10_000.0',
              ),
              (
                  'direction * (last / first - 1.0) * 10_000.0',
                  'direction * math.log(last / first) * 10_000.0',
              ),
          ]
          changed = source
          for old, new in replacements:
              if old not in changed and new not in changed:
                  raise RuntimeError(f'missing controlled target: {old}')
              changed = changed.replace(old, new)
          compile(changed, str(source_path), 'exec')
          source_path.write_text(changed, encoding='utf-8')

          payload = source_path.read_bytes()
          blob_sha = hashlib.sha1(
              f'blob {len(payload)}\0'.encode() + payload,
              usedforsecurity=False,
          ).hexdigest()
          runner_path = Path('research/candidate-03/run_v19_staged_container.py')
          runner = runner_path.read_text(encoding='utf-8')
          pattern = (
              r'("research/candidate-03/derive_nt_lvcfr_v19_signals\.py": )'
              r'"[0-9a-f]{40}"'
          )
          updated, count = re.subn(pattern, rf'\1"{blob_sha}"', runner, count=1)
          if count != 1:
              raise RuntimeError('unable to refreeze corrected V19 detector hash')
          runner_path.write_text(updated, encoding='utf-8')
          print({'detector_blob_sha': blob_sha})
          PY
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/research/candidate-03"
          python3 research/candidate-03/test_nt_lvcfr_v19.py
          git diff --check
          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add \
            research/candidate-03/derive_nt_lvcfr_v19_signals.py \
            research/candidate-03/run_v19_staged_container.py
          if ! git diff --cached --quiet; then
            git commit -m "candidate-03: unify V19 price path in log space"
            git pull --rebase origin research/candidate-03
            git push origin HEAD:research/candidate-03
          fi

      - name: Derive corrected first-week causal schedule
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/research/candidate-03"
          prepared="$RUNNER_TEMP/candidate-03-v19-log-path/prepared"
          output="$RUNNER_TEMP/candidate-03-v19-log-path/output"
          rm -rf "$prepared" "$output"
          mkdir -p "$prepared" "$output"
          python3 research/candidate-03/prepare_nt_lvcfr_v19.py \
            --week-start 2024-01-08 \
            --output "$prepared" \
            --config research/candidate-03/nt_lvcfr_v19_config.json \
            2>&1 | tee "$output/preparation.log"
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          python3 research/candidate-03/derive_nt_lvcfr_v19_signals.py \
            --prepared-root "$prepared" \
            --output-manifest "$output/v19_signal_manifest.json" \
            2>&1 | tee "$output/derivation.log"
          cp "$prepared/signals.json" "$output/signals.json"
          cp "$prepared/data_manifest.json" "$output/data_manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'candidate-03-v19-log-path/output'
          manifest = json.loads((output / 'v19_signal_manifest.json').read_text())
          signals = json.loads((output / 'signals.json').read_text())
          summary = {
              'candidate': manifest['candidate'],
              'week_start': '2024-01-08',
              'engine_status': 'causal_opportunity_preflight_only_no_backtest',
              'implementation_fix': 'log_return_progress_and_path_length',
              'derived_signal_count': len(signals),
              'minimum_required_episodes': 8,
              'opportunity_gate_reachable': len(signals) >= 8,
              'state_counts': manifest['state_counts'],
              'inventory_regime_counts': manifest['inventory_regime_counts'],
              'routing_counts': manifest['routing_counts'],
              'threshold_policy': manifest['threshold_policy'],
              'performance_metrics_calculated': False,
          }
          (output / 'preflight_summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit corrected causal evidence before gating
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/candidate-03-v19-log-path/output"
          dst=research/candidate-03/results/v19-preflight-development-2
          rm -rf "$dst"
          mkdir -p "$dst"
          cp "$src"/* "$dst"/
          git add "$dst"
          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git commit -m "candidate-03: record corrected V19 causal preflight"
          git pull --rebase origin research/candidate-03
          git push origin HEAD:research/candidate-03
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path(
              'research/candidate-03/results/v19-preflight-development-2/preflight_summary.json'
          ).read_text())
          if not summary['opportunity_gate_reachable']:
              raise SystemExit('corrected V19 opportunity gate is unreachable')
          PY
