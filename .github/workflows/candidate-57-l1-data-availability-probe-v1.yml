name: candidate-57-l1-data-availability-probe-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/candidate-57
    paths:
      - .github/workflows/candidate-57-l1-data-availability-probe-v1.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
      - name: Probe candidate historical L1 sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import gzip
          import io
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          urls = []
          # Binance Vision alternatives for the originally frozen Apr-08..14 SOL test.
          for dtype in ("bookTicker", "bookDepth"):
              urls.append((f"binance_daily_{dtype}", f"https://data.binance.vision/data/futures/um/daily/{dtype}/SOLUSDT/SOLUSDT-{dtype}-2024-04-08.zip.CHECKSUM"))
              urls.append((f"binance_monthly_{dtype}", f"https://data.binance.vision/data/futures/um/monthly/{dtype}/SOLUSDT/SOLUSDT-{dtype}-2024-04.zip.CHECKSUM"))
          # Tardis free first-of-month datasets: independent sample-day evidence.
          for month in range(1, 13):
              day = f"2024/{month:02d}/01"
              for dtype in ("quotes", "trades", "derivative_ticker"):
                  urls.append((f"tardis_{dtype}_2024_{month:02d}", f"https://datasets.tardis.dev/v1/binance-futures/{dtype}/{day}/SOLUSDT.csv.gz"))

          def probe(name: str, url: str) -> dict:
              out = {"name": name, "url": url}
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "candidate-57-research"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      out.update({
                          "head_status": int(getattr(r, "status", 200)),
                          "content_length": r.headers.get("Content-Length"),
                          "content_type": r.headers.get("Content-Type"),
                          "etag": r.headers.get("ETag"),
                          "last_modified": r.headers.get("Last-Modified"),
                      })
              except Exception as exc:
                  out["head_error"] = f"{type(exc).__name__}: {exc}"
              # Read only a small prefix. Tardis gzip may not yield a full line from
              # a byte range, so this is availability/schema evidence, not trading data.
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "candidate-57-research", "Range": "bytes=0-262143"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw = r.read(262144)
                      out["get_status"] = int(getattr(r, "status", 200))
                      out["prefix_bytes"] = len(raw)
                      out["accept_ranges"] = r.headers.get("Accept-Ranges")
                      if url.endswith(".CHECKSUM"):
                          out["prefix_text"] = raw[:500].decode("utf-8", errors="replace")
                      elif url.endswith(".gz"):
                          try:
                              with gzip.GzipFile(fileobj=io.BytesIO(raw)) as z:
                                  out["gzip_prefix_text"] = z.read(4096).decode("utf-8", errors="replace")
                          except Exception as zexc:
                              out["gzip_prefix_error"] = f"{type(zexc).__name__}: {zexc}"
              except Exception as exc:
                  out["get_error"] = f"{type(exc).__name__}: {exc}"
              return out

          rows = [probe(name, url) for name, url in urls]
          payload = {"study": "Candidate-57 historical L1 data availability probe", "rows": rows}
          Path("artifacts/c57-l1-data-probe").mkdir(parents=True, exist_ok=True)
          Path("artifacts/c57-l1-data-probe/result.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-57-l1-data-availability-probe-${{ github.sha }}
          path: artifacts/c57-l1-data-probe/**
          retention-days: 30
