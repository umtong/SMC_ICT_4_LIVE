name: candidate-53-crypto-htf-ltf-ifvg-fast-development

on:
  push:
    branches: ["research/candidate-53"]
    paths:
      - "research/candidate-53/crypto_htf_ltf_ifvg_study.py"
      - "research/candidate-53/crypto_htf_ltf_ifvg_study_fast.py"
      - ".github/workflows/candidate-53-crypto-htf-ltf-ifvg-fast.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-53-crypto-ifvg-fast-2025
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-53, fetch-depth: 0}

      - name: Reuse verified Binance monthly loader
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git fetch origin research/candidate-16-v13-volatility-squeeze-release:refs/remotes/origin/c16-v13
          rm -rf .deps/c16 && mkdir -p .deps
          git worktree add --detach .deps/c16 refs/remotes/origin/c16-v13
          git config --global --add safe.directory "$(pwd)/.deps/c16"
          PYTHONPATH=.deps/c16/research/candidate-16 python -m py_compile \
            research/candidate-53/crypto_htf_ltf_ifvg_study.py \
            research/candidate-53/crypto_htf_ltf_ifvg_study_fast.py \
            .deps/c16/research/candidate-16/v9_liquidation_event_study.py

      - name: Run frozen 2025 causal development study
        shell: bash
        env: {PYTHONPATH: .deps/c16/research/candidate-16}
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-53/crypto_htf_ltf_ifvg_study_fast.py \
            --year 2025 --cache .cache/candidate-53-crypto-ifvg \
            --output "$ROOT" 2>&1 | tee "$ROOT/console.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-53-crypto-ifvg-fast-2025-${{ github.sha }}
          path: artifacts/candidate-53-crypto-ifvg-fast-2025/**
          if-no-files-found: warn
          retention-days: 30
