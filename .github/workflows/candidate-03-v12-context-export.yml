name: candidate-03-v12-context-export

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-v12-context-export.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore immutable third-week research inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Package source and causal context inputs
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          tar -czf candidate-03-v12-context.tar.gz \
            research/candidate-03 \
            "$prepared/raw/futures_kline" \
            "$prepared/raw/spot_kline" \
            "$prepared/raw/open_interest" \
            "$prepared/signals.json" \
            "$prepared/data_manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v12-context-${{ github.sha }}
          path: candidate-03-v12-context.tar.gz
          if-no-files-found: error
          retention-days: 3
