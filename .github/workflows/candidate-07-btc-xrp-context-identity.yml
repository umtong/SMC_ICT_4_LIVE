name: candidate-07-btc-xrp-context-identity

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - ".github/workflows/candidate-07-btc-xrp-context-identity.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-btc-xrp-context-identity
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  compare-event-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      FROZEN_SOURCE: 89e03f9314eab9a456c3fe1cb0d08b2a1190dba6
    steps:
      - name: Checkout exact W1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE }}

      - name: Verify frozen source and foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_SOURCE}"
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-context-pyc \
            /opt/smc4/.venv/bin/python -m compileall -q research/candidate-07
          /opt/smc4/.venv/bin/python -m unittest discover \
            -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified research cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-btc-xrp-context-identity-v1
          restore-keys: |
            candidate-07-btc-xrp-multiclock-portfolio-week1-v1
            candidate-07-cross-symbol-multiclock-week1-v1
            candidate-07-cross-symbol-15s-
            candidate-07-multiclock-ensemble-week1-v1

      - name: Replay identical W1 with one-day event context
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/python \
            research/candidate-07/run_btc_xrp_multiclock_portfolio.py \
            --config research/candidate-07/config.json \
            --stage week-1-context-1d \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --event-warmup-days 1 \
            --source-commit "${FROZEN_SOURCE}" \
            --output artifacts/candidate-07/context-identity/one-day \
            --data-root .research-data/candidate-07

      - name: Replay identical W1 with three-day event context
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/python \
            research/candidate-07/run_btc_xrp_multiclock_portfolio.py \
            --config research/candidate-07/config.json \
            --stage week-1-context-3d \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --event-warmup-days 3 \
            --source-commit "${FROZEN_SOURCE}" \
            --output artifacts/candidate-07/context-identity/three-day \
            --data-root .research-data/candidate-07

      - name: Compare causal signal and trade identity
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('artifacts/candidate-07/context-identity')
          left = root / 'one-day'
          right = root / 'three-day'
          symbols = ('BTCUSDT', 'XRPUSDT')
          by_symbol = {}
          identical = True
          for symbol in symbols:
              columns = [
                  'scenario_id', 'instrument_id', 'direction',
                  'entry_reference', 'stop_price', 'target_price',
                  'expected_rr', 'source_pool_id',
                  'observed_time_ns', 'delivery_time_ns',
              ]
              one = pd.read_csv(left / symbol / 'signals.csv')[columns]
              three = pd.read_csv(right / symbol / 'signals.csv')[columns]
              one_records = one.to_dict(orient='records')
              three_records = three.to_dict(orient='records')
              same = one_records == three_records
              identical = identical and same
              one_ids = {str(value) for value in one['scenario_id'].tolist()}
              three_ids = {str(value) for value in three['scenario_id'].tolist()}
              by_symbol[symbol] = {
                  'identical': same,
                  'one_day_signals': len(one.index),
                  'three_day_signals': len(three.index),
                  'only_one_day': sorted(one_ids - three_ids),
                  'only_three_day': sorted(three_ids - one_ids),
              }

          one_trades = pd.read_csv(left / 'trades.csv')
          three_trades = pd.read_csv(right / 'trades.csv')
          trade_columns = [
              'scenario_id', 'instrument_id', 'direction',
              'opened_ns', 'closed_ns', 'net_pnl', 'net_return_on_nav',
          ]
          trade_identity = (
              one_trades[trade_columns].to_dict(orient='records')
              == three_trades[trade_columns].to_dict(orient='records')
          )
          identical = identical and trade_identity
          payload = {
              'frozen_source': '89e03f9314eab9a456c3fe1cb0d08b2a1190dba6',
              'scored_period': {
                  'start': '2025-12-22',
                  'end_exclusive': '2025-12-29',
              },
              'one_day_event_warmup': 1,
              'three_day_event_warmup': 3,
              'by_symbol': by_symbol,
              'trade_identity': trade_identity,
              'identical': identical,
              'interpretation': (
                  'BOUNDED_CONTEXT_IDENTITY_PASSED'
                  if identical
                  else 'EVENT_CONTEXT_CHANGES_SCORED_WEEK'
              ),
          }
          (root / 'context_identity.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not identical:
              raise SystemExit('EVENT_CONTEXT_IDENTITY_FAILED')
          PY

      - name: Preserve complete context-identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-btc-xrp-context-identity-${{ env.FROZEN_SOURCE }}
          path: artifacts/candidate-07/context-identity
          retention-days: 14
          if-no-files-found: error
