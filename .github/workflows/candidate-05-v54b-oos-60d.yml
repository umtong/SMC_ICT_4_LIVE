name: candidate-05-v54b-oos-60d

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v54b-oos-60d.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v54b-oos-60d
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  untouched-60d:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v54b_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v54b-oos-60d
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and frozen v54b contract
        env:
          PYTHONPATH: research/candidate-05
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v54b_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v

      - name: Run untouched continuous BTC path through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v54b_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-03-30 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-04-01 \
            --evaluation-end 2024-05-30 \
            --cache .cache/candidate-05-v54b-oos-60d \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Classify only the pre-frozen incremental branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())

          def number(value):
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          records = [
              item for item in closed
              if item.get("branch") == "FAILED_INVENTORY_ACCEPTANCE_CONTINUATION"
          ]
          pnls = [number(item.get("realized_pnl")) for item in records]
          pnls = [value for value in pnls if value is not None and math.isfinite(value)]
          branch = {
              "trades": len(pnls),
              "wins": sum(value > 0.0 for value in pnls),
              "losses": sum(value < 0.0 for value in pnls),
              "net_pnl_usdt": sum(pnls),
              "pnls_usdt": pnls,
              "watches": diagnostics.get("failed_inventory_acceptance_watches", 0),
              "confirmations": diagnostics.get("failed_inventory_acceptance_confirmations", 0),
              "first_retests": diagnostics.get("failed_inventory_acceptance_first_retests", 0),
              "submissions": diagnostics.get("failed_inventory_acceptance_submissions", 0),
          }
          integrity = (
              int(metrics.get("liquidations", 0)) == 0
              and int(metrics.get("order_rejections", 0)) == 0
              and int(metrics.get("order_denials", 0)) == 0
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          positive = integrity and branch["trades"] > 0 and branch["net_pnl_usdt"] > 0.0
          result = {
              "schema": "candidate-05-v54b-oos-60d-v1",
              "classification": (
                  "V54B_UNTOUCHED_INCREMENTAL_ALPHA_CONFIRMED"
                  if positive
                  else "V54B_UNTOUCHED_INCREMENTAL_ALPHA_NOT_CONFIRMED"
              ),
              "integrity_pass": integrity,
              "evaluation_role": "UNTOUCHED_AFTER_V54B_RULE_FREEZE",
              "candidate_metrics": metrics,
              "incremental_branch": branch,
          }
          (root / "v54b_oos_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/metrics.json"
          python -m json.tool "$ROOT/v54b_oos_decision.json"
          for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
            test -s "$ROOT/$file"
          done
          grep -q 'bookDepth_missing_404' "$ROOT/raw_evidence.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v54b-oos-60d-${{ github.sha }}
          path: artifacts/candidate-05-v54b-oos-60d/**
          if-no-files-found: warn
          retention-days: 90
