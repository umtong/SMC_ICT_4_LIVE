name: candidate-easychart-re1-direction-response-short-expansion

on:
  push:
    branches: ["ML_a"]
    paths:
      - ".github/workflows/candidate-easychart-re1-direction-response-short-expansion.yml"
      - "research/candidate-easychart_re1/easychart_re1_direction_response_system.py"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_direction_response_system.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-direction-response-short-expansion
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  matched-continuous-account:
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: unseen-oct-2024
            start: 2024-10-01
            end: 2024-10-07
          - period: unseen-may-2025
            start: 2025-05-01
            end: 2025-05-07
          - period: live-2025
            start: 2025-08-10
            end: 2025-08-16
          - period: unseen-may-2026
            start: 2026-05-01
            end: 2026-05-07
          - period: july-2026
            start: 2026-07-01
            end: 2026-07-07
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-direction-response/${{ matrix.period }}
      ROOT_OUT: artifacts/candidate-easychart-re1-direction-response/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile both complete systems
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_body_aligned_system.py \
            research/candidate-easychart_re1/easychart_re1_direction_response_system.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_body_aligned_system.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_direction_response_system.py
      - name: Run three-body alignment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$ROOT_OUT/three_body"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_body_aligned_system.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" \
            --output "$ROOT_OUT/three_body" --fee-profile usd_m_vip0
      - name: Run 60m-direction 5m-response alignment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/direction_response"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_direction_response_system.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" \
            --output "$ROOT_OUT/direction_response" --fee-profile usd_m_vip0
      - name: Print actual matched economics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          root=Path("${{ env.ROOT_OUT }}"); result={"period":"${{ matrix.period }}"}
          for name in ("three_body","direction_response"):
              mp=root/name/"metrics.json"; tp=root/name/"trade_audit.csv"
              if not mp.exists(): result[name]={"status":"MISSING"}; continue
              m=json.loads(mp.read_text()); t=pd.read_csv(tp) if tp.exists() else pd.DataFrame()
              r=t["actual_net_r"] if "actual_net_r" in t else pd.Series(dtype=float)
              rr=t["planned_gross_rr"] if "planned_gross_rr" in t else pd.Series(dtype=float)
              hold=t["duration_ns"]/60_000_000_000 if "duration_ns" in t else pd.Series(dtype=float)
              result[name]={
                  "trades":int(len(t)),"win_rate":None if r.empty else float((r>0).mean()),
                  "sum_net_r":float(r.sum()),"mean_planned_rr":None if rr.empty else float(rr.mean()),
                  "median_hold_minutes":None if hold.empty else float(hold.median()),
                  "trades_per_day":m.get("independent_trades_per_day"),
                  "final_nav":m.get("final_nav"),"total_return":m.get("total_return")}
          print("DIRECTION_RESPONSE_RESULT="+json.dumps(result,sort_keys=True))
          PY
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-direction-response-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-direction-response/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
