name: candidate-01-v42-pairwise-rotation-week

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v42-pairwise-rotation-week.yml"
      - "research/candidate-01/pairwise_rotation_v42.py"
      - "tests/test_candidate_01_v42.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  frozen-exact-two-vs-at-least-two:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v42
          key: candidate-01-v42-2024-06-03-${{ runner.os }}-v1
      - name: Run primary and breadth control
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q research/candidate-01/pairwise_rotation_v42.py tests/test_candidate_01_v42.py
              python -m unittest discover -s tests -p "test_candidate_01_v42.py" -v
              rm -rf artifacts/candidate-01-v42-week1
              python research/candidate-01/pairwise_rotation_v42.py --week 2024-06-03 --variant primary --cache .cache/candidate-01-v42 --output artifacts/candidate-01-v42-week1/primary --workers 4 > artifacts/candidate-01-v42-primary.log
              python research/candidate-01/pairwise_rotation_v42.py --week 2024-06-03 --variant control --cache .cache/candidate-01-v42 --output artifacts/candidate-01-v42-week1/control --workers 4 > artifacts/candidate-01-v42-control.log
            '
      - name: Freeze first-week decision
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/candidate-01-v42-week1")
          pp = root / "primary/pairwise_rotation_v42_summary.json"
          cp = root / "control/pairwise_rotation_v42_summary.json"
          verdict = {
              "candidate": "v42 exactly-two-peer capital rotation",
              "frozen_week": "2024-06-03/2024-06-10 UTC",
              "frozen_random_seed": 4201,
              "advance": False,
              "reason": "incomplete authoritative evidence",
          }
          if pp.is_file() and cp.is_file():
              primary = json.loads(pp.read_text())
              control = json.loads(cp.read_text())
              pm = primary["metrics"]
              cm = control["metrics"]
              gates = {
                  "operational_contract_passed": all((
                      primary.get("joint_evaluation_minute_gaps") == 0,
                      control.get("joint_evaluation_minute_gaps") == 0,
                      bool(pm.get("ended_flat")), bool(cm.get("ended_flat")),
                      int(pm.get("one_global_entry_gate_violations", 0) or 0) == 0,
                      int(cm.get("one_global_entry_gate_violations", 0) or 0) == 0,
                      int(pm.get("protective_order_failures", 0) or 0) == 0,
                      int(cm.get("protective_order_failures", 0) or 0) == 0,
                      int(pm.get("liquidation_marker_rows", 0) or 0) == 0,
                      int(cm.get("liquidation_marker_rows", 0) or 0) == 0,
                  )),
                  "minimum_seven_closed_trades_met": int(pm.get("closed_positions", 0) or 0) >= 7,
                  "geometric_daily_one_percent_met": float(pm.get("geometric_mean_daily_return", 0.0) or 0.0) >= 0.01,
                  "minimum_seventy_five_percent_win_rate_met": pm.get("win_rate") is not None and float(pm["win_rate"]) >= 0.75,
                  "minimum_profit_factor_1_5_met": pm.get("profit_factor") is not None and float(pm["profit_factor"]) >= 1.5,
                  "pairwise_outperformed_breadth_control": float(pm.get("total_return", 0.0) or 0.0) > float(cm.get("total_return", 0.0) or 0.0),
                  "recoverable_drawdown_met": float(pm.get("max_drawdown", 0.0) or 0.0) > -0.20,
              }
              verdict = {
                  "candidate": "v42 exactly-two-peer capital rotation",
                  "frozen_week": "2024-06-03/2024-06-10 UTC",
                  "frozen_random_seed": 4201,
                  "primary_selected_plans": primary["selected_plan_count"],
                  "control_selected_plans": control["selected_plan_count"],
                  "primary_metrics": pm,
                  "control_metrics": cm,
                  "gates": gates,
                  "advance": all(gates.values()),
                  "reason": "all frozen gates passed" if all(gates.values()) else "first-week logical or opportunity gate failed",
              }
          root.mkdir(parents=True, exist_ok=True)
          (root / "candidate_v42_verdict.json").write_text(json.dumps(verdict, indent=2, sort_keys=True) + "\n")
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v42-week1-${{ github.sha }}
          path: |
            artifacts/candidate-01-v42-week1
            artifacts/candidate-01-v42-primary.log
            artifacts/candidate-01-v42-control.log
          if-no-files-found: error
          retention-days: 30
