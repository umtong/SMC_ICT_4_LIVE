name: candidate-08-bootstrap

on:
  push:
    branches: ["research/candidate-08"]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize candidate source without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          cat research/candidate-08/.bootstrap/part-* | base64 -d > /tmp/candidate08.tar.gz
          tar -xzf /tmp/candidate08.tar.gz -C .
          rm -rf research/candidate-08/.bootstrap
          rm -f .github/workflows/candidate-08.yml
          python -m compileall -q research/candidate-08
          python research/candidate-08/test_logic.py -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "candidate-08: implement liquidity sweep bifurcation"
          git push origin HEAD:research/candidate-08
