name: research-candidate-ml-k-v3-fresh1-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: research-candidate-ml-k-v3-fresh1-pr-${{ github.run_id }}
  cancel-in-progress: false

env:
  EPISODE: research/candidate-liquidity-episode-policy-v1
  ROUTER: research/candidate-ml-k-control-transfer-v3/control_transfer_router_v3.py
  TEST: research/candidate-ml-k-control-transfer-v3/test_control_transfer_router_v3.py
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 1
      - run: |
          set -euo pipefail
          uv pip install --python /opt/smc4/.venv/bin/python \
            -r "$EPISODE/runtime-requirements.txt" pytest
          python -m py_compile "$ROUTER"
          PYTHONPATH="$(dirname "$ROUTER"):research/candidate-ml-k-control-transfer-v2" \
            python -m pytest -q "$TEST"
          python "$EPISODE/reproduce.py" verify \
            --output /tmp/mlk-v3-fresh1-verify
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('research/candidate-ml-k-control-transfer-v3/fresh1_windows.json').read_text())
          source = Path('research/candidate-ml-k-control-transfer-v3/control_transfer_router_v3.py')
          blob = hashlib.sha1(b'blob ' + str(source.stat().st_size).encode() + b'\0' + source.read_bytes()).hexdigest()
          assert blob == manifest['policy_source_blob_sha']
          assert manifest['selection_uses_fresh_outcomes'] is False
          PY

  harvest:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        window:
          - {period: fresh1-2024-may, start: '2024-05-12', end: '2024-05-15'}
          - {period: fresh1-2024-nov, start: '2024-11-10', end: '2024-11-13'}
          - {period: fresh1-2025-feb, start: '2025-02-02', end: '2025-02-05'}
          - {period: fresh1-2025-nov, start: '2025-11-02', end: '2025-11-05'}
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    env:
      PERIOD: ${{ matrix.window.period }}
      START: ${{ matrix.window.start }}
      END: ${{ matrix.window.end }}
      SYMBOL: ${{ matrix.symbol }}
      CACHE: .cache/candidate_ml_k/control_transfer_v3/fresh1/${{ matrix.window.period }}/${{ matrix.symbol }}
      OUT: artifacts/candidate_ml_k/control_transfer_v3/fresh1/${{ matrix.window.period }}/${{ matrix.symbol }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 1
      - run: |
          set -euo pipefail
          uv pip install --python /opt/smc4/.venv/bin/python \
            -r "$EPISODE/runtime-requirements.txt"
          python "$EPISODE/reproduce.py" harvest \
            --start "$START" --end "$END" --warmup-days 45 \
            --period "$PERIOD" --symbols "$SYMBOL" \
            --cache "$CACHE" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mlk-v3-fresh1-${{ matrix.window.period }}-${{ matrix.symbol }}
          path: artifacts/candidate_ml_k/control_transfer_v3/fresh1/${{ matrix.window.period }}/${{ matrix.symbol }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  route:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    env:
      DOWNLOADED: artifacts/candidate_ml_k/control_transfer_v3/fresh1/downloaded
      ROOT: artifacts/candidate_ml_k/control_transfer_v3/fresh1/all_periods
      RESULT: artifacts/candidate_ml_k/control_transfer_v3/fresh1/result
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: mlk-v3-fresh1-*
          path: artifacts/candidate_ml_k/control_transfer_v3/fresh1/downloaded
      - run: |
          set -euo pipefail
          uv pip install --python /opt/smc4/.venv/bin/python \
            -r "$EPISODE/runtime-requirements.txt"
          mkdir -p "$ROOT" "$RESULT"
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          downloaded = Path('artifacts/candidate_ml_k/control_transfer_v3/fresh1/downloaded')
          root = Path('artifacts/candidate_ml_k/control_transfer_v3/fresh1/all_periods')
          prefix = 'mlk-v3-fresh1-'
          grouped, harvest = {}, {}
          for directory in sorted(p for p in downloaded.iterdir() if p.is_dir()):
              tail = directory.name.removeprefix(prefix)
              period, symbol = tail.rsplit('-', 1)
              files = [p for p in directory.rglob('departure_actions.csv.gz') if p.name == 'departure_actions.csv.gz']
              if len(files) != 1:
                  raise RuntimeError(f'{directory}: {files}')
              frame = pd.read_csv(files[0], low_memory=False)
              if set(frame.symbol.astype(str)) != {symbol}:
                  raise RuntimeError(f'{directory}: symbol mismatch')
              grouped.setdefault(period, []).append(frame)
              harvest[f'{period}:{symbol}'] = {
                  'rows': int(len(frame)),
                  'states': int(frame.state_id.nunique()),
                  'episodes': int(frame.episode_id.nunique()),
                  'outcomes': frame.outcome.astype(str).value_counts().sort_index().to_dict(),
              }
          expected = {'fresh1-2024-may', 'fresh1-2024-nov', 'fresh1-2025-feb', 'fresh1-2025-nov'}
          if set(grouped) != expected:
              raise RuntimeError(f'period mismatch: {set(grouped)}')
          for period, frames in grouped.items():
              if len(frames) != 4:
                  raise RuntimeError(f'{period}: {len(frames)} symbol frames')
              combined = pd.concat(frames, ignore_index=True, sort=False)
              if set(combined.symbol.astype(str)) != {'BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'}:
                  raise RuntimeError(f'{period}: incomplete universe')
              out = root / period
              out.mkdir(parents=True, exist_ok=True)
              combined.to_csv(out / 'departure_actions.csv.gz', index=False, compression='gzip')
          (root / 'harvest_summary.json').write_text(json.dumps(harvest, indent=2, sort_keys=True) + '\n')
          PY
          python "$ROUTER" --root "$ROOT" --output "$RESULT"
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import json
          result = Path('artifacts/candidate_ml_k/control_transfer_v3/fresh1/result')
          root = Path('artifacts/candidate_ml_k/control_transfer_v3/fresh1/all_periods')
          manifest = json.loads(Path('research/candidate-ml-k-control-transfer-v3/fresh1_windows.json').read_text())
          summary = json.loads((result / 'summary.json').read_text())
          days = sum((date.fromisoformat(w['end']) - date.fromisoformat(w['start'])).days for w in manifest['windows'])
          overall = summary['overall_continuous_account']
          direct = {
              'policy': summary['policy'],
              'selection_uses_fresh_outcomes': False,
              'source_sha': '${{ github.event.pull_request.head.sha }}',
              'policy_source_blob_sha': manifest['policy_source_blob_sha'],
              'calendar_days': days,
              'completed_trades_per_calendar_day': overall['closed_trades'] / days if days else 0.0,
              'overall_continuous_account': overall,
              'by_period_standalone': summary.get('by_period_standalone', {}),
              'by_scenario_family': summary.get('by_scenario_family', {}),
              'by_symbol': summary.get('by_symbol', {}),
              'harvest': json.loads((root / 'harvest_summary.json').read_text()),
          }
          (result / 'direct_result.json').write_text(json.dumps(direct, indent=2, sort_keys=True, default=str) + '\n')
          (result / 'source_sha.txt').write_text('${{ github.event.pull_request.head.sha }}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlk-v3-fresh1-result-${{ github.event.pull_request.head.sha }}
          path: artifacts/candidate_ml_k/control_transfer_v3/fresh1/result/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
