name: candidate-16-v13-external-volatility-squeeze-study

on:
  push:
    branches: ["research/candidate-16-v13-volatility-squeeze-release"]
    paths:
      - "research/candidate-16/v13_volatility_squeeze_release_study.py"
      - "research/candidate-16/v13_volatility_squeeze_release_study_v2.py"
      - "research/candidate-16/tests/test_v13_volatility_squeeze_release_study.py"
      - ".github/workflows/candidate-16-v13-squeeze-study.yml"
  workflow_dispatch:

concurrency:
  group: candidate-16-v13-external-volatility-squeeze-study
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  development-and-conditional-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-16
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-16-v13-volatility-squeeze-study
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and externally fixed squeeze contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-16/v9_liquidation_event_study.py \
            research/candidate-16/v10_open_drive_study.py \
            research/candidate-16/v13_volatility_squeeze_release_study.py \
            research/candidate-16/v13_volatility_squeeze_release_study_v2.py
          python -m unittest discover \
            -s research/candidate-16/tests \
            -p 'test_v13_volatility_squeeze_release_study.py' -v

      - name: Run checksum-verified 2023 development and conditional 2024 holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-16/v13_volatility_squeeze_release_study_v2.py \
            --cache .cache/candidate-16-v13-squeeze \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify frozen decision and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          study = json.loads((root / "study.json").read_text())
          if study.get("role") != "mechanism and geometry study; no fills, account, portfolio, or NAV claim":
              raise SystemExit("study role drifted")
          policy = study.get("external_policy", {})
          if policy.get("family") != "Bollinger Band / Keltner Channel volatility squeeze":
              raise SystemExit("external squeeze identity drifted")
          if policy.get("bollinger") != {"period": 20, "standard_deviations": 2.0}:
              raise SystemExit("Bollinger contract drifted")
          if policy.get("keltner") != {"period": 20, "atr_multiplier": 1.5}:
              raise SystemExit("Keltner contract drifted")
          if int(policy.get("minimum_squeeze_bars", 0)) != 6:
              raise SystemExit("minimum squeeze duration drifted")
          if abs(float(policy.get("breakout_volume_multiplier", 0.0)) - 1.5) > 1e-12:
              raise SystemExit("release volume contract drifted")
          if set(study.get("data", {}).get("symbols", [])) != {"BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"}:
              raise SystemExit("symbol set drifted")
          if study.get("data", {}).get("years") != [2023, 2024]:
              raise SystemExit("development/holdout years drifted")
          scenario = study.get("scenario_contract", {})
          if not scenario.get("no_order_during_squeeze") or not scenario.get("no_order_on_release") or not scenario.get("no_order_on_pullback"):
              raise SystemExit("state evidence was reused as entry")
          if not scenario.get("first_channel_touch_is_final"):
              raise SystemExit("first pullback finality drifted")
          if abs(float(scenario.get("round_trip_cost_rate", -1.0)) - 0.002) > 1e-12:
              raise SystemExit("cost screen drifted")
          if float(scenario.get("minimum_target_net_r", -1.0)) != 1.0:
              raise SystemExit("measured target geometry drifted")
          attribution = study.get("time_block_attribution", {})
          if attribution.get("role") != "robustness attribution only" or attribution.get("economic_logic_changed"):
              raise SystemExit("time-block attribution changed economics")
          development = study.get("development", {})
          holdout = study.get("holdout", {})
          if not development.get("passed") and holdout.get("opened"):
              raise SystemExit("holdout was opened after development failed")
          if not all(int(value) >= 200000 for value in study.get("signal_rows", {}).values()):
              raise SystemExit("five-minute signal panels incomplete")
          print(json.dumps({
              "decision": study["decision"],
              "promote": study["promote"],
              "raw_complete_candidates": study["raw_complete_candidates"],
              "global_cluster_representatives": study["global_cluster_representatives"],
              "development": development,
              "holdout": holdout,
              "global_slot_conflicts_skipped": study["global_slot_conflicts_skipped"],
          }, indent=2, sort_keys=True))
          PY
          test -e "$ROOT/development_trades.csv"
          if python - <<'PY'
          import json,os
          from pathlib import Path
          study=json.loads((Path(os.environ['ROOT'])/'study.json').read_text())
          raise SystemExit(0 if study['holdout']['opened'] else 1)
          PY
          then
            test -e "$ROOT/holdout_trades.csv"
          else
            test ! -e "$ROOT/holdout_trades.csv"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-16-v13-volatility-squeeze-${{ github.sha }}
          path: artifacts/candidate-16-v13-volatility-squeeze-study/**
          if-no-files-found: warn
          retention-days: 90
