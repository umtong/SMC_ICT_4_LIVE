name: Candidate 11 V3 Actions smoke

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - ".github/workflows/candidate-11-v3-smoke.yml"
      - "research/candidate-11/v3_source_bundle.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/candidate-11
      - name: Verify staged source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s research/candidate-11/v3_source_bundle.zip
          echo "3ded43814daf5cc9b152e9bfe476e1edfc35133f48dfe69dd0e2c72f707ea38e  research/candidate-11/v3_source_bundle.zip" | sha256sum --check --strict
