name: candidate-02-v95-stage-funnel-r3

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: candidate-02-v95-stage-funnel-r3
  cancel-in-progress: false

jobs:
  diagnose-locked-v95:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-02
          fetch-depth: 0

      - name: Verify fixed engine and prospectively locked payload
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(sha256sum research/candidate-02/v95_mature_swing_breakout_core.py | cut -d' ' -f1)" = "a31b09027333317a04ce65dc3ac5475011746f8ba6942babd923422ad793fdb1"
          expected="$(cat research/candidate-02/v95_payload_sha256.txt)"
          actual="$(cat research/candidate-02/v95_mature_swing_breakout_core.py research/candidate-02/v95_nt_backtest.py research/candidate-02/v95_base_config.json research/candidate-02/v95_mature_swing_breakout_lock.json research/candidate-02/v95_design.md | sha256sum | cut -d' ' -f1)"
          test "$expected" = "b381ce0130b7bb8af394fdb828fed1cd1d42df2ca0b235484a27871d839468d3"
          test "$actual" = "$expected"
          python -m py_compile research/candidate-02/v95_mature_swing_breakout_core.py research/candidate-02/v95_nt_backtest.py research/candidate-02/v95_stage_funnel.py

      - name: Materialize immutable runner
        shell: bash
        run: |
          set -euo pipefail
          cat .candidate-02-v95-runner/payload.part* | base64 --decode > /tmp/v95_first_week_runner.sh
          test "$(sha256sum /tmp/v95_first_week_runner.sh | cut -d' ' -f1)" = "725db7f6347910f675fdf34a71d1ea34b628854dd574c2b213182c37e698525d"
          chmod +x /tmp/v95_first_week_runner.sh
          bash -n /tmp/v95_first_week_runner.sh

      - name: Recreate identical locked NautilusTrader result
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash /tmp/v95_first_week_runner.sh 2>&1 | tee artifacts-v95-funnel-production-replay.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts-v95-funnel-production-replay-exit-code.txt
          case "$status" in 0|1|2) ;; *) exit "$status" ;; esac
          test -f artifacts-v95-first-week-decision.json
          python - <<'PY'
          import json
          status = json.load(open('artifacts-v95-first-week-decision.json'))['status']
          allowed = {'FIRST_WEEK_REJECT', 'FIRST_WEEK_REJECT_OR_PRECOMMITTED_ABLATION'}
          if status not in allowed:
              raise SystemExit(f'unexpected v95 decision status: {status}')
          print(status)
          PY

      - name: Count every causal transition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-02-v95-stage-funnel
          python research/candidate-02/v95_stage_funnel.py --config research/candidate-02/v95_base_config.json --input-root inputs/v95-first-week --output artifacts/candidate-02-v95-stage-funnel/central.json | tee artifacts-v95-stage-funnel-central.log
          python - <<'PY'
          import copy, json
          from pathlib import Path
          cfg = copy.deepcopy(json.loads(Path('research/candidate-02/v95_base_config.json').read_text()))
          cfg['candidate'] = 'candidate-02-v95-remove-prior-defense-memory'
          cfg['scenario']['require_defense_memory'] = False
          Path('/tmp/v95-no-defense.json').write_text(json.dumps(cfg, indent=2, sort_keys=True) + '\n')
          PY
          python research/candidate-02/v95_stage_funnel.py --config /tmp/v95-no-defense.json --input-root inputs/v95-first-week --output artifacts/candidate-02-v95-stage-funnel/remove-defense.json | tee artifacts-v95-stage-funnel-remove-defense.log
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('artifacts/candidate-02-v95-stage-funnel/central.json').read_text())
          a = json.loads(Path('artifacts/candidate-02-v95-stage-funnel/remove-defense.json').read_text())
          summary = {
              'candidate': 'candidate-02-v95-mature-defended-swing-common-accepted-breakout',
              'evaluation_start_utc': '2025-10-06T00:00:00Z',
              'evaluation_end_utc': '2025-10-13T00:00:00Z',
              'diagnostic_only': True,
              'custom_backtest_engine': False,
              'production_engine': 'NautilusTrader 1.230.0',
              'central': {'production_signal_count': c['production_signal_count'], 'qualification': c['qualification'], 'scenario': c['scenario']},
              'remove_defense': {'production_signal_count': a['production_signal_count'], 'qualification': a['qualification'], 'scenario': a['scenario']},
          }
          Path('artifacts/candidate-02-v95-stage-funnel/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v95-stage-funnel-r3-${{ github.sha }}
          path: |
            artifacts/candidate-02-v95-stage-funnel
            artifacts-v95-stage-funnel-*.log
            artifacts-v95-funnel-production-replay*.txt
            artifacts-v95-funnel-production-replay*.log
            artifacts-v95-first-week-decision.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
