name: candidate-02-v103-endogenous-flow-clock-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: candidate-02-v103-endogenous-flow-clock-first-week
  cancel-in-progress: false

jobs:
  v103-first-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-02
          fetch-depth: 0

      - name: Verify v103 prospective lock and fixed NautilusTrader environment
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v103_endogenous_flow_clock_core.py \
            research/candidate-02/v103_nt_backtest.py \
            research/candidate-02/v103_first_week_driver.py
          test "$(git hash-object research/candidate-02/v103_endogenous_flow_clock_core.py)" = "ece6aa6bb7bd3e8667f52b4d2669607c4c6fab0e"
          test "$(git hash-object research/candidate-02/v103_base_config.json)" = "c64d2fdbf50d1d08eba2b6ab2ed8a6c3e6d38959"

      - name: Run prospectively locked BTC first week in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-02/v103_first_week_driver.py 2>&1 | tee artifacts-v103-first-week-driver.log
          test -f artifacts-v103-first-week-decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts-v103-first-week-decision.json').read_text())
          assert d['candidate_family'] == 'candidate-02-v103-endogenous-turnover-clock-order-flow-regimes'
          assert d['baseline']['performance_engine'] == 'NautilusTrader 1.230.0'
          assert d['baseline']['custom_backtest_engine'] is False
          assert float(d['baseline']['risk_fraction']) == 0.03
          print(json.dumps({
              'status': d['status'],
              'next_week_allowed': d['next_week_allowed'],
              'ablation_passes_weekly_gate': d.get('ablation_passes_weekly_gate'),
          }, indent=2, sort_keys=True))
          PY

      - name: Build compact evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compact-v103
          cp -f artifacts-v103-*.json compact-v103/ 2>/dev/null || true
          cp -f artifacts-v103-*.log compact-v103/ 2>/dev/null || true
          for d in artifacts/candidate-02-v103-*; do
            test -d "$d" || continue
            out="compact-v103/$(basename "$d")"
            mkdir -p "$out"
            for f in metrics.json trades.jsonl signals.jsonl signals_schedule.json risk_sizing.jsonl account.csv fills.csv orders.csv positions.csv validation_exit_code.txt; do
              test -f "$d/$f" && cp "$d/$f" "$out/$f"
            done
          done
          find compact-v103 -type f -maxdepth 3 -print | sort

      - name: Upload compact v103 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v103-first-week-${{ github.sha }}
          path: compact-v103
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
