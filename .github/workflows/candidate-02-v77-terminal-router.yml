name: candidate-02-v103-nautilustrader-branch-runner

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"
      - "research/candidate-02/v103_*.py"
      - "research/candidate-02/v103_*.json"
      - "research/candidate-02/v103_*.md"

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: candidate-02-v103-nautilustrader-branch-runner
  cancel-in-progress: false

jobs:
  first-week-endogenous-flow-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-02
          fetch-depth: 0

      - name: Verify unchanged prospectively locked v103 branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/candidate-02"
          test -f research/candidate-02/v103_endogenous_flow_clock_lock.json
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('research/candidate-02/v103_endogenous_flow_clock_lock.json').read_text())
          assert lock['status'] == 'LOCKED_BEFORE_FIRST_WEEK_COLLECTION'
          assert lock['first_week']['raw_data_status_at_lock'] == 'NOT_COLLECTED_FOR_V103'
          assert lock['first_week']['start_utc'] == '2025-11-17T00:00:00Z'
          assert float(lock['risk_fraction']) == 0.03
          assert lock['custom_backtest_engine'] is False
          PY

      - name: Run unchanged locked v103 first BTC week through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-02/v103_first_week_driver.py

      - name: Preserve direct data and NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v103-first-week-branch-${{ github.sha }}
          path: |
            artifacts/candidate-02-v103-*
            artifacts-v103-*.log
            artifacts-v103-baseline-decision.json
            artifacts-v103-first-week-decision.json
            artifacts-v103-variant-manifest.json
            inputs/v103-first-week/artifacts
            inputs/v103-first-week/candidate-02-v48-first-week
            inputs/v103-first-week/.cache/candidate-02/v103-first-week/binance_1m
            inputs/v103-first-week/direct
            inputs/v103-first-week/spot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
