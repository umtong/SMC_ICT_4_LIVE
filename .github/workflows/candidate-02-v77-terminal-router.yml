name: candidate-02-v104-external-liquidity-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: candidate-02-v104-external-liquidity-first-week
  cancel-in-progress: false

jobs:
  v104-first-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact locked v104 source before features or performance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile research/candidate-02/v104_runtime_materialize.py
          python research/candidate-02/v104_runtime_materialize.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-02/v104_external_liquidity_core.py \
            research/candidate-02/v104_first_week_driver.py \
            research/candidate-02/v104_external_liquidity_lock.json \
            research/candidate-02/tests/test_v104_causality.py \
            research/candidate-02/tests/test_v104_activation_adapter.py
          git commit -m "research(candidate-02): materialize locked v104 source"
          git push origin HEAD:research/candidate-02
          echo "V104_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact prospective v104 source and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V104_SOURCE_SHA"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v104_external_liquidity_core.py \
            research/candidate-02/v104_nt_strategy.py \
            research/candidate-02/v104_nt_backtest.py \
            research/candidate-02/v104_first_week_driver.py \
            research/candidate-02/tests/run_v104_tests.py \
            research/candidate-02/tests/test_v104_schedule_contract.py \
            research/candidate-02/v104_acceptance_diagnostics.py
          python research/candidate-02/tests/run_v104_tests.py

      - name: Run prospectively locked BTC first week in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-02/v104_first_week_driver.py 2>&1 | tee artifacts-v104-first-week-driver.log
          test -f artifacts-v104-first-week-decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path('artifacts-v104-first-week-decision.json').read_text())
          metrics = decision['baseline']['metrics']
          assert decision['candidate_family'] == 'candidate-02-v104-external-liquidity-common-acceptance-retest'
          assert metrics['engine'] == 'NautilusTrader 1.230.0'
          assert metrics['custom_backtest_engine'] is False
          assert float(metrics['risk_fraction']) == 0.03
          assert decision['long_evaluation_allowed'] is False
          print(json.dumps({
              'status': decision['status'],
              'next_week_allowed': decision['next_week_allowed'],
              'baseline_target_met': metrics['target_met'],
              'baseline_trades': metrics['trades'],
              'baseline_daily_growth': metrics['geometric_daily_growth_after_cost'],
          }, indent=2, sort_keys=True))
          PY

      - name: Diagnose accepted-event displacement bottleneck
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-02/v104_acceptance_diagnostics.py \
            --config research/candidate-02/v104_base_config.json \
            --input-root inputs/v104-first-week \
            --output artifacts-v104-acceptance-diagnostics.json
          test -s artifacts-v104-acceptance-diagnostics.json

      - name: Build compact reproducible evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v104
          mkdir -p compact-v104
          cp -f artifacts-v104-*.json compact-v104/ 2>/dev/null || true
          cp -f artifacts-v104-*.log compact-v104/ 2>/dev/null || true
          for directory in artifacts/candidate-02-v104-*; do
            test -d "$directory" || continue
            output="compact-v104/$(basename "$directory")"
            mkdir -p "$output"
            for file in \
              metrics.json signal_build_diagnostics.json scenario_attribution.json \
              trade_diagnostics.jsonl trades.jsonl signals.jsonl signals_schedule.json \
              risk_sizing.jsonl account.csv fills.csv orders.csv positions.csv \
              validation_exit_code.txt; do
              test -f "$directory/$file" && cp "$directory/$file" "$output/$file"
            done
          done
          find inputs/v104-first-week -type f \
            \( -name '*manifest*.json' -o -name 'STATUS_*' \) \
            -exec cp --parents '{}' compact-v104/ \; 2>/dev/null || true
          find compact-v104 -type f -maxdepth 8 -print | sort

      - name: Commit compact v104 evidence if branch is unchanged
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" != "$V104_SOURCE_SHA"; then
            echo "Branch moved; evidence remains in the workflow artifact only."
            exit 0
          fi
          destination="research/candidate-02/results/v104_first_week/$V104_SOURCE_SHA"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a compact-v104/. "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research(candidate-02): record locked v104 first-week evidence"
          git push origin HEAD:research/candidate-02

      - name: Upload complete v104 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v104-first-week-${{ github.sha }}
          path: |
            compact-v104
            artifacts/candidate-02-v104-*
            artifacts-v104-*.json
            artifacts-v104-*.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
