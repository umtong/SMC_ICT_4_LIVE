name: candidate-02-current-research-source-export

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"

permissions:
  contents: read

concurrency:
  group: candidate-02-current-research-source-export
  cancel-in-progress: false

jobs:
  export-current-research-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-02
          fetch-depth: 0

      - name: Build deterministic source-only archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          tar --sort=name --mtime='UTC 2026-08-07' --owner=0 --group=0 --numeric-owner \
            -czf export/candidate-02-current-research-source.tar.gz \
            research/candidate-02 \
            .candidate-02-v75 \
            .candidate-02-v89 \
            .github/workflows/candidate-02-v53-nt.yml \
            .github/workflows/candidate-02-v77-terminal-router.yml
          sha256sum export/candidate-02-current-research-source.tar.gz \
            > export/candidate-02-current-research-source.sha256
          git rev-parse HEAD > export/branch-head.txt

      - name: Upload current research source
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-current-research-source-${{ github.sha }}
          path: export
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
