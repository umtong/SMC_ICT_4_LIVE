name: candidate-02-v103-slim-evidence-extractor

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-terminal-router.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-02-v103-slim-evidence-extractor
  cancel-in-progress: false

jobs:
  extract-small-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download immutable successful v103 evidence bundle
        uses: actions/download-artifact@v8
        with:
          name: candidate-02-v103-first-week-branch-ed1c1ec068d3b593eb7e810e834c6468d9ec74e4
          path: /tmp/v103-full
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31141672951

      - name: Extract only human-auditable small evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/v103-slim"
          cd /tmp/v103-full
          find . -type f \
            \( -name '*.json' -o -name '*.jsonl' -o -name '*.csv' -o -name '*.log' -o -name 'STATUS*' -o -name '*.txt' \) \
            -print0 | tar --null --files-from=- -cf - | tar -C "$GITHUB_WORKSPACE/v103-slim" -xf -
          find "$GITHUB_WORKSPACE/v103-slim" -type f -printf '%s\t%p\n' | sort -n > "$GITHUB_WORKSPACE/v103-slim/FILE_INVENTORY.tsv"
          du -sh "$GITHUB_WORKSPACE/v103-slim"
          tail -n 80 "$GITHUB_WORKSPACE/v103-slim/FILE_INVENTORY.tsv"

      - name: Upload lightweight v103 diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v103-slim-evidence-ed1c1ec
          path: v103-slim
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
