name: candidate-10-v65-breakout-resolution-screen

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v65_*.py
      - research/candidate-10/test_c10_v65_breakout_resolution.py
      - .github/workflows/candidate-10-v65-screen.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v65-screen-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  periods:
    strategy:
      fail-fast: false
      matrix:
        include:
          - period_id: EARLY_2026_ALL_RESOLVED
            start: "2026-01-05"
            end_exclusive: "2026-01-19"
            variant: all-resolved-episodes
            evidence_class: implementation_and_loss_rate_diagnostic
            timeout: 120
          - period_id: H1_2026_RESOLVED_CROSS_MARKET
            start: "2026-01-05"
            end_exclusive: "2026-07-01"
            variant: resolved-cross-market
            evidence_class: previously_inspected_continuous_development
            timeout: 300
          - period_id: JULY_2026_RESOLVED_CROSS_MARKET
            start: "2026-07-01"
            end_exclusive: "2026-08-01"
            variant: resolved-cross-market
            evidence_class: previously_inspected_continuous_development
            timeout: 180
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run isolated v65 variant
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v65/${{ matrix.period_id }}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v65:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              BASE="/workspace/artifacts/candidate-10-v65/${{ matrix.period_id }}"
              rm -rf /tmp/candidate11-v65
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v65
              for file in \
                c10_v27_overlay.py c10_v27_patch.py \
                c10_v63_flow_continuation.py \
                c10_v64_overlay.py c10_v64_intraday_delivery.py \
                c10_v64_patch.py \
                c10_v65_breakout_resolution.py c10_v65_patch.py c10_v65_run.py \
                test_c10_v27_overlay.py \
                test_c10_v64_intraday_delivery.py \
                test_c10_v65_breakout_resolution.py; do
                cp "/workspace/research/candidate-10/${file}" /tmp/candidate11-v65/
              done
              smc4 doctor
              python /tmp/candidate11-v65/c10_v65_patch.py \
                /tmp/candidate11-v65/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v65/c10_v27_overlay.py \
                /tmp/candidate11-v65/c10_v27_patch.py \
                /tmp/candidate11-v65/c10_v63_flow_continuation.py \
                /tmp/candidate11-v65/c10_v64_overlay.py \
                /tmp/candidate11-v65/c10_v64_intraday_delivery.py \
                /tmp/candidate11-v65/c10_v64_patch.py \
                /tmp/candidate11-v65/c10_v65_breakout_resolution.py \
                /tmp/candidate11-v65/c10_v65_patch.py \
                /tmp/candidate11-v65/c10_v65_run.py \
                /tmp/candidate11-v65/run_leadership_scdam.py
              python -m unittest -v \
                test_c10_v27_overlay \
                test_c10_v64_intraday_delivery \
                test_c10_v65_breakout_resolution
              python /tmp/candidate11-v65/c10_v65_run.py \
                --candidate11-dir /tmp/candidate11-v65 \
                --start "${{ matrix.start }}" \
                --end-exclusive "${{ matrix.end_exclusive }}" \
                --variant "${{ matrix.variant }}" \
                --evidence-class "${{ matrix.evidence_class }}" \
                --output "${BASE}/${{ matrix.variant }}"
              rm -rf "${BASE}/${{ matrix.variant }}/data"
            '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v65-${{ matrix.period_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v65/${{ matrix.period_id }}
          if-no-files-found: warn
          retention-days: 14
