name: Astra control-transfer research
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths:
      - .github/workflows/astra-control-research.yml
      - research/candidate-ml-easychart-astra1/control_request.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: astra1-control-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_easychart_astra1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            bundle/market
            astra_control_cache
          key: astra1-control-v2-${{ github.run_id }}
          restore-keys: astra1-control-v2-
      - name: Reuse pinned Nautilus foundation
        run: python -m pip install 'nautilus_trader==1.230.0' 'numpy==2.3.5' 'pandas==2.3.3' 'scikit-learn==1.7.2' 'lightgbm==4.6.0'
      - name: Learn and execute the committed decision policy
        run: python research/candidate-ml-easychart-astra1/run_control_v3.py
      - name: Preserve actual experiment outputs on the research branch
        if: always()
        run: |
          git config user.name 'Astra research'
          git config user.email 'research@users.noreply.github.com'
          for p in research_results/astra1_control_v*; do
            if [ -d "$p" ]; then git add -f "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record executed control-transfer experiment $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin research_candidate_ML_easychart_astra1
            git push origin HEAD:research_candidate_ML_easychart_astra1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-control-results
          path: research_results/astra1_control_v3
          retention-days: 14
