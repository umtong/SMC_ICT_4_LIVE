name: Astra control-transfer research
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths:
      - .github/workflows/astra-control-research.yml
      - research/candidate-ml-easychart-astra1/control_request.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: astra1-control-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_easychart_astra1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            bundle/market
            astra_control_cache
          key: astra1-control-v2-${{ github.run_id }}
          restore-keys: astra1-control-v2-
      - name: Reuse pinned Nautilus foundation
        run: python -m pip install 'nautilus_trader==1.230.0' 'numpy==2.3.5' 'pandas==2.3.3' 'scikit-learn==1.7.2'
      - name: Normalize trade participation without encoding the symbol
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/candidate-ml-easychart-astra1/control_v2.py')
          text=p.read_text()
          text=text.replace("participation=b.quote/max(b.trades,1)/max(entry,1e-12)","participation=(b.volume/max(b.trades,1))/max(self.current_volume/max(np.mean([x.trades for x in self.history[-60:]]),1),1e-12)")
          p.write_text(text)
          PY
      - name: Learn and execute the committed decision policy
        run: python research/candidate-ml-easychart-astra1/run_control_v2.py
      - name: Preserve actual experiment outputs on the research branch
        if: always()
        run: |
          git config user.name 'Astra research'
          git config user.email 'research@users.noreply.github.com'
          git add research/candidate-ml-easychart-astra1/control_v2.py
          if [ -d research_results/astra1_control_v2 ]; then
            git add -f research_results/astra1_control_v2
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record executed control-transfer experiment $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin research_candidate_ML_easychart_astra1
            git push origin HEAD:research_candidate_ML_easychart_astra1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-control-results
          path: research_results/astra1_control_v2
          retention-days: 14
