name: candidate-21-fresh-risk-v2-development

on:
  push:
    branches: ["research/candidate-21"]
    paths:
      - "research/candidate-21/candidate21_fresh_initiative_strategy_v2.py"
      - "research/candidate-21/tests/test_fresh_initiative_risk_v2.py"
      - ".github/workflows/candidate-21-fresh-risk-v2-development.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-21-fresh-risk-v2-development
  cancel-in-progress: true

jobs:
  risk-efficient-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-21:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-21-fresh-risk-v2
    steps:
      - uses: actions/checkout@v4

      - name: Verify unchanged alpha and modeled-fill risk contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          smc4 doctor
          python -m compileall -q research/candidate-21
          python -m unittest discover -s research/candidate-21/tests -p 'test_fresh_initiative_router.py' -v
          python -m unittest discover -s research/candidate-21/tests -p 'test_fresh_initiative_risk_v2.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_global_entry_slot_v4.py' -v

      - name: Inject risk-efficient policy into audited shared wrapper
        shell: bash
        run: |
          cat > research/candidate-05/strategy_v36_cross_asset_repricing_gate.py <<'PY'
          from typing import Any
          from candidate21_fresh_initiative_strategy_v2 import RiskEfficientFreshInitiativeMixin
          from strategy_v26 import ScenarioValidEntryStrategy

          REVERSAL_BRANCH_PREFIX = "TAIL_FLOW_"

          def symbol_from_instrument(value: Any) -> str:
              text = str(value)
              if "-PERP" not in text:
                  raise ValueError(f"unexpected project instrument id: {text}")
              return text.split("-PERP", 1)[0]

          SystemicRepricingGateMixin = RiskEfficientFreshInitiativeMixin

          class SystemicRepricingGateStrategy(
              RiskEfficientFreshInitiativeMixin,
              ScenarioValidEntryStrategy,
          ):
              pass

          CandidateStrategy = SystemicRepricingGateStrategy
          StrategyClass = SystemicRepricingGateStrategy
          CrossAssetRepricingGateStrategy = SystemicRepricingGateStrategy
          PY
          mkdir -p "$ROOT/evidence"
          cat > "$ROOT/evidence/winner.json" <<'JSON'
          {
            "classification": "VALIDATED_BTC_WINNER_RESOLVED",
            "winner": "strategy_v36_cross_asset_repricing_gate:SystemicRepricingGateStrategy",
            "experiment_role": "CANDIDATE21_FRESH_RISK_V2_DEVELOPMENT"
          }
          JSON

      - name: Run the same four-asset development account
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-05/shared_account_backtest_v2.py \
            --winner-evidence "$ROOT/evidence/winner.json" \
            --build-start 2025-09-19 \
            --build-end 2025-09-28 \
            --evaluation-start 2025-09-22 \
            --evaluation-end 2025-09-28 \
            --cache .cache/candidate-21-fresh-risk-v2/week-1 \
            --output "$ROOT/week-1" \
            2>&1 | tee "$ROOT/console.log"

      - name: Print compact result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          run = root / "week-1"
          result = {"completed": (run / "metrics.json").exists()}
          if (run / "metrics.json").exists():
              metrics = json.loads((run / "metrics.json").read_text())
              result["metrics"] = {
                  key: metrics.get(key)
                  for key in (
                      "starting_nav", "ending_nav", "total_return",
                      "geometric_daily_growth", "trades", "wins", "losses",
                      "win_rate", "profit_factor", "expectancy_usdt",
                      "max_drawdown", "largest_winner_share", "liquidations",
                      "integrity_pass", "planned_risk_invariant_pass",
                      "global_entry_invariant_pass", "symbol_metrics",
                  )
              }
          if (run / "positions.csv").exists():
              result["positions_csv"] = (run / "positions.csv").read_text()
          (root / "assessment.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-21-fresh-risk-v2-${{ github.sha }}
          path: artifacts/candidate-21-fresh-risk-v2/**
          if-no-files-found: warn
          retention-days: 90
