name: research-candidate-4t-short-v4

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_4t]
    paths:
      - '.github/workflows/research-candidate-4t-short-v4.yml'
      - '.dispatch-candidate-4t-short-v4'

permissions:
  actions: read
  contents: write

concurrency:
  group: research-candidate-4t-short-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-window-route:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_4t
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade 'numpy>=2.0' 'pandas>=2.2'
      - name: Download immutable candidate 1k exact-route action universes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download 32592363635 --repo "$GITHUB_REPOSITORY" --dir downloaded
      - name: Separate declared development and fresh artifacts
        run: |
          set -euo pipefail
          mkdir -p collected/development collected/fresh
          count=0
          for directory in downloaded/*; do
            [ -d "$directory" ] || continue
            name="$(basename "$directory")"
            case "$name" in
              *fresh*) cp -a "$directory" "collected/fresh/$name"; count=$((count+1)) ;;
              *dev*) cp -a "$directory" "collected/development/$name"; count=$((count+1)) ;;
            esac
          done
          test "$count" -eq 4
          test "$(find collected/development -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 3
          test "$(find collected/fresh -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
      - name: Run counterfactual sequential auction-ownership policy
        run: |
          set -euo pipefail
          python research/candidate-4t-synthesis/candidate_4t_selected.py \
            --development-root collected/development \
            --fresh-root collected/fresh \
            --output candidate_4t_result
          printf '%s\n' "$GITHUB_SHA" > candidate_4t_result/source_sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > candidate_4t_result/workflow_run_id.txt
          printf '%s\n' '32592363635' > candidate_4t_result/action_universe_run_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-short-v4-result-${{ github.sha }}
          path: candidate_4t_result
          retention-days: 30
      - name: Record exact-window result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target=research_results/candidate_4t/short_diagnostic_v4
          rm -rf "$target"
          mkdir -p "$target"
          cp candidate_4t_result/RESULT.md "$target/"
          cp candidate_4t_result/summary.json "$target/"
          cp candidate_4t_result/source_sha.txt "$target/"
          cp candidate_4t_result/workflow_run_id.txt "$target/"
          cp candidate_4t_result/action_universe_run_id.txt "$target/"
          for file in development_orders.csv development_trades.csv development_replacements.csv fresh_orders.csv fresh_trades.csv fresh_replacements.csv; do
            [ ! -f "candidate_4t_result/$file" ] || cp "candidate_4t_result/$file" "$target/"
          done
          git add "$target"
          git commit -m "Record candidate 4t short v4 diagnostic ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git push origin HEAD:research_candidate_4t
