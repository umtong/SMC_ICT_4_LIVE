name: candidate-01-v25-funding-window-weeks

on:
  workflow_run:
    workflows: ["candidate-01-v24-absorption-weeks"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  RUNNER_PATH: research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py
  GATE_PATH: research/candidate-01/candidate_01_v25_gate.py

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'research/candidate-01'
    runs-on: ubuntu-24.04
    outputs:
      run_v25: ${{ steps.decision.outputs.run_v25 }}
    steps:
      - name: Manual dispatch directly authorizes the frozen first-week gate
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "run_v25=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: candidate-01-v24-week1-*
          path: .v24-decision
          merge-multiple: true
      - name: Run v25 only after an operational v24 first-week stop
        id: decision
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_v25=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "run_v25=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          paths = list(Path('.v24-decision').rglob('week_gate.json'))
          if len(paths) != 1:
              raise SystemExit(f'expected one v24 week1 gate, found {paths}')
          gate = json.loads(paths[0].read_text())
          run = bool(gate['operational_gate']) and not bool(gate['advance'])
          print(f"run_v25={'true' if run else 'false'}")
          PY

  week1:
    needs: decide
    if: needs.decide.outputs.run_v25 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate-output.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v25-week1
          key: candidate-01-v25-BTCUSDT-2023-05-28-2023-06-13-${{ runner.os }}-v1
      - name: Run first frozen funding-window MSS week through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py \
                research/candidate-01/candidate_01_v25_gate.py
              rm -rf artifacts/candidate-01-v25-week1
              python research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py \
                --week 2023-06-05 \
                --rule funding-window-mss \
                --cache .cache/candidate-01-v25-week1 \
                --output artifacts/candidate-01-v25-week1 \
                --workers 4
            '
      - name: Verify and strictly classify week 1
        run: |
          python3 "$GATE_PATH" \
            --root artifacts/candidate-01-v25-week1 \
            --week 2023-06-05
      - name: Export week 1 gate
        id: gate-output
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path("artifacts/candidate-01-v25-week1/week_gate.json").read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v25-week1-${{ github.sha }}
          path: artifacts/candidate-01-v25-week1
          if-no-files-found: error
          retention-days: 30

  week1-control:
    needs: week1
    if: needs.week1.outputs.advance != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v25-week1-control
          key: candidate-01-v25-control-BTCUSDT-2023-05-28-2023-06-13-${{ runner.os }}-v1
      - name: Run failed-auction control on identical funding windows
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v25-week1-control
              python research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py \
                --week 2023-06-05 \
                --rule failed-auction-control \
                --cache .cache/candidate-01-v25-week1-control \
                --output artifacts/candidate-01-v25-week1-control \
                --workers 4
            '
      - name: Verify and classify week 1 control
        run: |
          python3 "$GATE_PATH" \
            --root artifacts/candidate-01-v25-week1-control \
            --week 2023-06-05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v25-week1-control-${{ github.sha }}
          path: artifacts/candidate-01-v25-week1-control
          if-no-files-found: error
          retention-days: 30

  week2:
    needs: week1
    if: needs.week1.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate-output.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v25-week2
          key: candidate-01-v25-BTCUSDT-2025-02-02-2025-02-18-${{ runner.os }}-v1
      - name: Run second frozen funding-window MSS week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v25-week2
              python research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py \
                --week 2025-02-10 \
                --rule funding-window-mss \
                --cache .cache/candidate-01-v25-week2 \
                --output artifacts/candidate-01-v25-week2 \
                --workers 4
            '
      - name: Verify and strictly classify week 2
        run: |
          python3 "$GATE_PATH" \
            --root artifacts/candidate-01-v25-week2 \
            --week 2025-02-10
      - name: Export week 2 gate
        id: gate-output
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path("artifacts/candidate-01-v25-week2/week_gate.json").read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v25-week2-${{ github.sha }}
          path: artifacts/candidate-01-v25-week2
          if-no-files-found: error
          retention-days: 30

  week3:
    needs: week2
    if: needs.week2.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v25-week3
          key: candidate-01-v25-BTCUSDT-2021-09-05-2021-09-21-${{ runner.os }}-v1
      - name: Run third frozen funding-window MSS week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v25-week3
              python research/candidate-01/funding_window_failed_auction_v25_nautilus_week.py \
                --week 2021-09-13 \
                --rule funding-window-mss \
                --cache .cache/candidate-01-v25-week3 \
                --output artifacts/candidate-01-v25-week3 \
                --workers 4
            '
      - name: Verify and strictly classify week 3
        run: |
          python3 "$GATE_PATH" \
            --root artifacts/candidate-01-v25-week3 \
            --week 2021-09-13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v25-week3-${{ github.sha }}
          path: artifacts/candidate-01-v25-week3
          if-no-files-found: error
          retention-days: 30
