name: candidate-47-structural-recorder-matrix

on:
  push:
    branches: ["research/candidate-47"]
    paths:
      - ".github/workflows/candidate-47-structural-recorder-matrix.yml"
  workflow_dispatch:

concurrency:
  group: candidate-47-structural-recorder-matrix
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  record:
    name: ${{ matrix.period.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        period:
          - label: 2026-02-09_2026-02-15
            start: "2026-02-09"
            end: "2026-02-15"
          - label: 2026-03-02_2026-03-08
            start: "2026-03-02"
            end: "2026-03-08"
          - label: 2026-03-23_2026-03-29
            start: "2026-03-23"
            end: "2026-03-29"
          - label: 2026-04-13_2026-04-19
            start: "2026-04-13"
            end: "2026-04-19"
          - label: 2026-05-25_2026-05-31
            start: "2026-05-25"
            end: "2026-05-31"
          - label: 2026-06-22_2026-06-28
            start: "2026-06-22"
            end: "2026-06-28"
          - label: 2026-07-01_2026-07-07
            start: "2026-07-01"
            end: "2026-07-07"
          - label: 2026-07-15_2026-07-21
            start: "2026-07-15"
            end: "2026-07-21"
          - label: 2026-07-22_2026-07-28
            start: "2026-07-22"
            end: "2026-07-28"
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-structural-recorder-matrix/${{ matrix.period.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify environment and frozen recorder ownership
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-47/kline_only_inputs.py \
            research/candidate-47/ichifan_structural_recorder_strategy.py \
            research/candidate-47/ichifan_structural_recorder_launch.py
          python - <<'PY'
          from pathlib import Path
          import ichifan_structural_recorder_strategy as strategy
          root = Path("research/candidate-47").resolve()
          assert Path(strategy.__file__).resolve() == root / "ichifan_structural_recorder_strategy.py"
          assert strategy.Candidate35Strategy is strategy.Candidate47IchiFanStructuralRecorderStrategy
          PY

      - name: Replay frozen policy and record causal follow-through
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-47/ichifan_structural_recorder_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start "${{ matrix.period.start }}" \
            --end "${{ matrix.period.end }}" \
            --cache ".cache/candidate-47-recorder-${{ matrix.period.label }}" \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Preserve recorder evidence and verify invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = metrics["strategy_diagnostics"]
          snapshots = json.loads((root / "followthrough_snapshots.json").read_text())
          summary = {
              "evidence_class": "development-followthrough-recorder",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "evaluation_start": metrics["evaluation_start"],
              "evaluation_end": metrics["evaluation_end"],
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "profit_factor": metrics["profit_factor"],
              "snapshot_count": len(snapshots),
              "snapshot_ages": sorted({item["age_minutes"] for item in snapshots}),
              "structural_submissions": diagnostics.get(
                  "ichifan_structural_stop_submissions", 0
              ),
              "snapshot_failures": diagnostics.get(
                  "followthrough_snapshot_failures", 0
              ),
              "order_rejections": diagnostics.get("order_rejections", 0),
              "global_position_violations": diagnostics.get(
                  "global_position_violations", 0
              ),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert metrics["engine"] == "NautilusTrader BacktestNode"
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          assert diagnostics.get("order_rejections", 0) == 0
          assert diagnostics.get("global_position_violations", 0) == 0
          assert diagnostics.get("ichifan_structural_stop_failures", 0) == 0
          assert diagnostics.get("followthrough_snapshot_failures", 0) == 0
          assert diagnostics.get("ichifan_structural_stop_submissions", 0) == metrics["trades"]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-structural-recorder-${{ matrix.period.label }}-${{ github.sha }}
          path: artifacts/candidate-47-structural-recorder-matrix/${{ matrix.period.label }}/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
