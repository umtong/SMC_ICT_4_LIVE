name: candidate-easychart-re1-source-snapshot

on:
  push:
    branches:
      - research/candidate-easychart_re1
    paths:
      - research/candidate-easychart_re1/.source_snapshot_dispatch_marker

permissions:
  contents: write

env:
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-easychart_re1
          fetch-depth: 0
      - name: Archive repository source
        run: |
          tar --exclude=.git --exclude='*.zip' -czf /tmp/candidate-easychart-re1-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-source-${{ github.sha }}
          path: /tmp/candidate-easychart-re1-source.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Record snapshot run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-easychart_re1
            git reset --hard origin/research/candidate-easychart_re1
            printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
              > research/candidate-easychart_re1/.latest-source-snapshot-run
            git add research/candidate-easychart_re1/.latest-source-snapshot-run
            git commit -m "Record RE1 source snapshot $GITHUB_RUN_ID" || exit 0
            if git push origin HEAD:research/candidate-easychart_re1; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
