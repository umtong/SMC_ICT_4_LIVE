name: candidate-easychart-re1-source-snapshot

on:
  push:
    branches:
      - research/candidate-easychart_re1
    paths:
      - research/candidate-easychart_re1/.source_snapshot_dispatch_marker

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository source
        run: |
          tar --exclude=.git --exclude='*.zip' -czf /tmp/candidate-easychart-re1-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-source-${{ github.sha }}
          path: /tmp/candidate-easychart-re1-source.tar.gz
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
