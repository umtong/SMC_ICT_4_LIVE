name: Research liquidity opportunity second untouched windows

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v3"]
    paths:
      - ".github/workflows/research-liquidity-opportunity-holdout-2.yml"
      - "research/candidate-liquidity-auction-v3/.dispatch-opportunity-holdout-2"

concurrency:
  group: research-liquidity-opportunity-holdout-2
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v3
      - name: Record second untouched-window run
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-liquidity-opportunity-holdout-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-liquidity-opportunity-holdout-2
          git commit -m "Record second untouched opportunity run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_liquidity_auction_v3

  export:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {period: holdout2-2022-mar, start: 2022-03-01, end: 2022-03-08}
          - {period: holdout2-2022-jun, start: 2022-06-01, end: 2022-06-08}
          - {period: holdout2-2022-sep, start: 2022-09-01, end: 2022-09-08}
          - {period: holdout2-2022-dec, start: 2022-12-01, end: 2022-12-08}
          - {period: holdout2-2023-mar, start: 2023-03-01, end: 2023-03-08}
          - {period: holdout2-2023-jun, start: 2023-06-01, end: 2023-06-08}
          - {period: holdout2-2023-sep, start: 2023-09-01, end: 2023-09-08}
          - {period: holdout2-2023-dec, start: 2023-12-01, end: 2023-12-08}
          - {period: holdout2-2024-mar, start: 2024-03-01, end: 2024-03-08}
          - {period: holdout2-2024-jun, start: 2024-06-01, end: 2024-06-08}
          - {period: holdout2-2024-sep, start: 2024-09-01, end: 2024-09-08}
          - {period: holdout2-2024-dec, start: 2024-12-01, end: 2024-12-08}
          - {period: holdout2-2025-mar, start: 2025-03-01, end: 2025-03-08}
          - {period: holdout2-2025-jun, start: 2025-06-01, end: 2025-06-08}
          - {period: holdout2-2025-sep, start: 2025-09-01, end: 2025-09-08}
          - {period: holdout2-2025-dec, start: 2025-12-01, end: 2025-12-08}
          - {period: holdout2-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {period: holdout2-2026-jun, start: 2026-06-01, end: 2026-06-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Export second untouched exact one-minute price and aggressor flow
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance-cache "holdout2/${{ matrix.period }}"
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --before-days 3 \
            --after-days 2 \
            --cache /tmp/binance-cache \
            --output "holdout2/${{ matrix.period }}"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-opportunity-${{ matrix.period }}
          path: holdout2/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
