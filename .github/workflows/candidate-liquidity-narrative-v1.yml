name: candidate-liquidity-narrative-v1

on:
  workflow_dispatch:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - "research/candidate-liquidity-narrative-v1/**"
      - "!research/candidate-liquidity-narrative-v1/.latest-run"
      - ".github/workflows/candidate-liquidity-narrative-v1.yml"

concurrency:
  group: candidate-liquidity-narrative-v1
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record run identity without retriggering
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"run_id":%s,"run_attempt":%s,"head_sha":"%s","created_at":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > research/candidate-liquidity-narrative-v1/.latest-run
          git add research/candidate-liquidity-narrative-v1/.latest-run
          git commit -m "Record liquidity narrative run $GITHUB_RUN_ID" || true
          git push origin HEAD:research_ML_thinking

  core-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-narrative-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile coherent market-narrative policy
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-liquidity-narrative-v1/liquidity_narrative.py \
            research/candidate-liquidity-narrative-v1/run_research.py
          python - <<'PY'
          from liquidity_narrative import POLICY, ANCHOR_TIMEFRAMES
          assert "LOWER_SCALE_EXTERNAL_POOLS_INSIDE_THE_ROUTE_ARE_LOW_RESISTANCE" in POLICY
          assert 60 in ANCHOR_TIMEFRAMES and 15 not in ANCHOR_TIMEFRAMES
          print(POLICY)
          PY

  harvest:
    needs: core-check
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-narrative-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-liquidity-narrative-v1/${{ matrix.period }}
      OUT: artifacts/candidate-liquidity-narrative-v1/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - name: Run causal liquidity narrative research
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-narrative-v1/run_research.py \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - name: Verify policy-owned actions and account chronology
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          out = Path(os.environ["OUT"])
          actions = pd.read_csv(out / "liquidity_narrative_actions.csv")
          account = pd.read_csv(out / "continuous_account_trades.csv")
          if actions.empty:
              raise RuntimeError("liquidity narrative produced no executable actions")
          if actions.action_id.duplicated().any():
              raise RuntimeError("duplicate causal action identity")
          if not (pd.to_numeric(actions.source_timeframe_minutes) >= 60).all():
              raise RuntimeError("lower-scale event acquired direction ownership")
          if not account.empty:
              ordered = account.sort_values("emission_time_ns")
              prior_exit = pd.to_numeric(ordered.resolution_time_ns).shift(1)
              current_signal = pd.to_numeric(ordered.emission_time_ns)
              if not (current_signal.iloc[1:].to_numpy() >= prior_exit.iloc[1:].to_numpy()).all():
                  raise RuntimeError("continuous account accepted a signal while busy")
          print({"actions": len(actions), "account_trades": len(account)})
          PY
      - name: Preserve action universe and continuous account
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-narrative-v1-${{ matrix.period }}
          path: artifacts/candidate-liquidity-narrative-v1/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
