name: candidate-04-v37-complete-excursion-stop-fix

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v37-complete-excursion-stop-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Preserve the complete causal continuation excursion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(
              "research/candidate-04/volume_clock_impact_residual_compiler.py"
          )
          text = path.read_text()
          old = '''        stop = structural_stop(
            data,
            pullback.start_index,
            resume.end_index,
            shock.side,
            impact_parameters,
        )
'''
          new = '''        stop = structural_stop(
            data,
            shock.start_index,
            resume.end_index,
            shock.side,
            impact_parameters,
        )
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("V37 continuation stop marker not found")
          path.write_text(text)
          PY
          python -m py_compile \
            research/candidate-04/volume_clock_impact_residual_compiler.py \
            research/candidate-04/tests/test_volume_clock_impact_residual_compiler.py

      - name: Commit controlled stop correction with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-04-research-bot"
          git config user.email "candidate-04-research-bot@users.noreply.github.com"
          git add research/candidate-04/volume_clock_impact_residual_compiler.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix V37 complete continuation excursion stop"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-04 && \
               git push origin HEAD:research/candidate-04; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
