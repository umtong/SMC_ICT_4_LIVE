name: research-candidate-4t-v5-medium

on:
  push:
    branches: [research_candidate_4t]
    paths:
      - '.github/workflows/research-candidate-4t-v5-medium.yml'
      - '.dispatch-candidate-4t-v5-medium'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: research-candidate-4t-v5-medium
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {role: dev, period: dev-2021-jan, start: 2021-01-15, end: 2021-01-29}
          - {role: dev, period: dev-2021-may, start: 2021-05-10, end: 2021-05-24}
          - {role: dev, period: dev-2022-jun, start: 2022-06-08, end: 2022-06-22}
          - {role: dev, period: dev-2022-nov, start: 2022-11-01, end: 2022-11-15}
          - {role: dev, period: dev-2023-feb, start: 2023-02-01, end: 2023-02-15}
          - {role: dev, period: dev-2024-mar, start: 2024-03-01, end: 2024-03-15}
          - {role: dev, period: dev-2024-aug, start: 2024-08-01, end: 2024-08-15}
          - {role: dev, period: dev-2025-aug, start: 2025-08-01, end: 2025-08-15}
          - {role: fresh, period: fresh-2026-may, start: 2026-05-01, end: 2026-05-22}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-4t-sequential-control-v1:research/candidate-2c-synthesis:research/candidate-1k-auction-system:research/candidate-auction-episode-system:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: '1'
      CACHE: .cache/candidate-4t-medium/${{ matrix.period }}
      OUT: artifacts/candidate-4t-medium/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_4t
      - name: Harvest immutable causal actions
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-4t-sequential-control-v1/candidate_4t_harvest.py \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-medium-${{ matrix.role }}-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-4t-medium/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30

  route:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_4t
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'pandas>=2.2,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-4t-medium-dev-*
          path: inputs/development
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-4t-medium-fresh-*
          path: inputs/fresh
      - name: Route leakage-safe competing hypotheses
        env:
          PYTHONPATH: research/candidate-4t-sequential-control-v5:research/candidate-4t-sequential-control-v4:research/candidate-4t-sequential-control-v3:research/candidate-4t-sequential-control-v1
        run: |
          set -euo pipefail
          python research/candidate-4t-sequential-control-v3/self_check_v3.py
          python research/candidate-4t-sequential-control-v4/self_check_v4.py
          python research/candidate-4t-sequential-control-v5/self_check_v5.py
          rm -rf result
          python research/candidate-4t-sequential-control-v5/candidate_4t_policy_v5.py \
            --development-root inputs/development \
            --fresh-root inputs/fresh \
            --output result
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-v5-medium-result-${{ github.sha }}
          path: result/**
          if-no-files-found: error
          retention-days: 30
      - name: Commit medium evidence
        run: |
          set -euo pipefail
          destination=research_results/candidate_4t/medium_v5
          rm -rf "$destination"
          mkdir -p "$destination"
          cp result/RESULT.md result/summary.json result/model_manifest.json "$destination/"
          for file in \
            development_orders.csv development_trades.csv development_replacements.csv \
            development_loss_clinic.csv development_missed_opportunity_clinic.csv \
            fresh_orders.csv fresh_trades.csv fresh_replacements.csv \
            fresh_loss_clinic.csv fresh_missed_opportunity_clinic.csv; do
            [[ ! -f "result/$file" ]] || cp "result/$file" "$destination/$file"
          done
          printf '%s\n' "source_commit=${GITHUB_SHA}" "source_run=${GITHUB_RUN_ID}" > "$destination/source.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Record Candidate 4t v5 medium evidence ${GITHUB_RUN_ID}"
            git push origin HEAD:research_candidate_4t
          fi
