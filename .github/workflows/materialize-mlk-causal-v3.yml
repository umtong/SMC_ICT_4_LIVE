name: Materialize MLK causal alpha v3

on:
  push:
    branches:
      - research_candidate_ML_easychart_c
    paths:
      - .github/workflows/materialize-mlk-causal-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_easychart_c
          fetch-depth: 0

      - name: Reconstruct and extract causal v3 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research_candidate_ML_k_causal_alpha_v3
          : > /tmp/mlk-v3.b64
          for part in 00 01 02; do
            git show "origin/research_candidate_ML_k_causal_alpha_v3:.bootstrap_v3/part-${part}" >> /tmp/mlk-v3.b64
          done
          base64 -d /tmp/mlk-v3.b64 > /tmp/mlk-v3.tar.xz
          xz -t /tmp/mlk-v3.tar.xz
          tar -xJf /tmp/mlk-v3.tar.xz -C .

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-mlk-causal-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Materialize MLK causal alpha v3 source" || exit 0
          git push origin HEAD:research_candidate_ML_easychart_c
