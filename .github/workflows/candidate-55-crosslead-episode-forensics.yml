name: candidate-55-crosslead-episode-forensics

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-crosslead-episode-forensics.yml"
      - "research/candidate-55/crosslead_episode_forensics.py"
      - "research/candidate-51/router_crosslead.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-crosslead-episode-forensics
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and verify environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python -m compileall -q research/candidate-55/crosslead_episode_forensics.py
      - name: Audit all independent leader shocks and rejected opportunities
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python \
            research/candidate-55/crosslead_episode_forensics.py \
            --start 2025-04-01 --end 2025-04-30 \
            --cache .cache/candidate-55-crosslead-forensics \
            --output artifacts/candidate-55/crosslead-episode-forensics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-crosslead-episode-forensics-${{ github.sha }}
          path: artifacts/candidate-55/crosslead-episode-forensics
          if-no-files-found: warn
          retention-days: 30
