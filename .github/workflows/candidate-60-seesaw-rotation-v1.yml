name: candidate-60-seesaw-rotation-v1

on:
  push:
    branches: ["research/candidate-60"]
    paths:
      - ".github/workflows/candidate-60-seesaw-rotation-v1.yml"
      - "research/candidate-60/SEESAW_ROTATION_V1_FREEZE.md"
      - "research/candidate-60/seesaw_rotation_diagnostic_v1e.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-60-seesaw-rotation-v1
  cancel-in-progress: true

jobs:
  confirmed-capital-rotation-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-60
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reassemble and verify frozen diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-60/SEESAW_ROTATION_V1_FREEZE.md
          cp research/candidate-60/seesaw_rotation_diagnostic_v1e.b64 \
            .work-seesaw.b64
          test "$(wc -c < .work-seesaw.b64)" = "9048"
          test "$(sha256sum .work-seesaw.b64 | awk '{print $1}')" = \
            "4787ef6aecdfd8dbe193a7b5ba2589034dd8e8c56466c142e34e91ea69af7afa"
          base64 -d .work-seesaw.b64 > .work-seesaw.py.gz
          test "$(sha256sum .work-seesaw.py.gz | awk '{print $1}')" = \
            "334cf9b6a8ce1afcd215acedd15006688773ebd90d32b5c9e3962709a1df0973"
          gzip -dc .work-seesaw.py.gz \
            > research/candidate-60/seesaw_rotation_diagnostic.py
          test "$(sha256sum research/candidate-60/seesaw_rotation_diagnostic.py | awk '{print $1}')" = \
            "91637aa996db7182a29ac846e7dbde144aa627b3f4dc450e2f75e2e35a116ca4"
          python -m py_compile research/candidate-60/seesaw_rotation_diagnostic.py

      - name: Install locked environment and prove causal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run python - <<'PY'
          import importlib.util
          import inspect
          from pathlib import Path
          import sys

          path = Path("research/candidate-60/seesaw_rotation_diagnostic.py")
          spec = importlib.util.spec_from_file_location("c60_seesaw", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          blocks = inspect.getsource(module.block_frame)
          assert '.abs().shift(1).rolling' in blocks
          events = inspect.getsource(module.build_events)
          assert 'confirm_ts = parent_ts + pd.Timedelta(minutes=PARENT_MINUTES)' in events
          assert 'entry_ts = confirm_ts + pd.Timedelta(minutes=CONFIRM_MINUTES)' in events
          assert 'int(leader_confirm["price_direction"]) != leader_direction' in events
          assert 'int(confirm["price_direction"]) != -leader_direction' in events
          assert 'int(confirm["flow_direction"]) != -leader_direction' in events
          assert 'direction = -leader_direction' in events
          assert module.PRIMARY_HORIZON == 15
          assert module.ROUND_TRIP_COST_BPS == 20.0
          main_source = inspect.getsource(module.main)
          assert main_source.index('development, development_events = run_stage(DEVELOPMENT)') < main_source.index('if decision["eligible"]:') < main_source.index('run_stage(POLICY_FRESH)')
          print("prior-only leader, separate peer initiative, next-open, one-slot and untouched-data contracts verified")
          PY

      - name: Run development and conditional policy-fresh diagnostic
        id: diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-60-seesaw-rotation-v1-console
          set -o pipefail
          uv run python research/candidate-60/seesaw_rotation_diagnostic.py \
            2>&1 | tee .work/candidate-60-seesaw-rotation-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact mechanism evidence and remove rejected upload paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .work-seesaw.b64 \
            .work-seesaw.py.gz \
            research/candidate-60/seesaw_rotation_diagnostic.py
          git rm -f --ignore-unmatch \
            research/candidate-60/seesaw_rotation_diagnostic_v1c.b64.part00 \
            research/candidate-60/seesaw_rotation_diagnostic_v1c.b64.part01 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part00 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part01 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part02 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part03 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part04 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part05 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part06 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part07 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part08 \
            research/candidate-60/seesaw_rotation_diagnostic_v1d.b64.part09
          git config user.name "candidate-60-research-bot"
          git config user.email "candidate-60-research-bot@users.noreply.github.com"
          out=research/candidate-60/evidence/seesaw-rotation-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
          fi
          if ! git diff --cached --quiet; then
            git commit --no-gpg-sign -m \
              "candidate60: persist confirmed seesaw-rotation evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin research/candidate-60
              git rebase origin/research/candidate-60
              if git push origin HEAD:research/candidate-60; then
                break
              fi
              sleep 2
            done
          fi

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-60-seesaw-rotation-v1
          path: |
            research/candidate-60/evidence/seesaw-rotation-v1
            .work/candidate-60-seesaw-rotation-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce diagnostic validity
        if: always()
        shell: bash
        run: |
          status="${{ steps.diagnostic.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "seesaw rotation diagnostic failed; status=$status"
            exit "${status:-1}"
          fi
