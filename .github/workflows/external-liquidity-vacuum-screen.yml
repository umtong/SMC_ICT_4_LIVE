name: external-liquidity-vacuum-screen

on:
  push:
    branches: ["research/external-leverage-flow-router"]
    paths:
      - "research/external-leverage-flow-router/liquidity_vacuum_screen.py"
      - "research/external-leverage-flow-router/spot_participation_contract.py"
      - "research/external-leverage-flow-router/cross_asset_transfer_screen_fixed.py"
      - ".github/workflows/external-liquidity-vacuum-screen.yml"
  workflow_dispatch:

concurrency:
  group: external-liquidity-vacuum-screen
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  fixed-vacuum-screen:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/external-leverage-flow-router:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/external-liquidity-vacuum-screen
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and fixed contract
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile research/external-leverage-flow-router/liquidity_vacuum_screen.py
          python - <<'PY'
          import liquidity_vacuum_screen as screen
          assert screen.SYMBOLS == ('BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT')
          assert screen.BALANCE_BARS == 60
          assert screen.PARENT_COOLDOWN_BARS == 60
          assert screen.ROUND_TRIP_HURDLE_BPS == 20.0
          assert screen.MIN_NET_RR == 1.0
          print('liquidity-vacuum contract verified')
          PY

      - name: Run fixed two-week development screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$ROOT/${{ matrix.symbol }}"
          mkdir -p "$OUT"
          python research/external-leverage-flow-router/liquidity_vacuum_screen.py \
            --symbol "${{ matrix.symbol }}" \
            --start 2023-06-01 \
            --end 2023-06-14 \
            --cache ".cache/external-liquidity-vacuum/${{ matrix.symbol }}" \
            --output "$OUT" \
            2>&1 | tee "$OUT/console.log"

      - name: Verify evidence
        if: always()
        shell: bash
        run: |
          OUT="$ROOT/${{ matrix.symbol }}"
          if test -e "$OUT/liquidity_vacuum_screen.json"; then
            python -m json.tool "$OUT/liquidity_vacuum_screen.json" >/dev/null
            test -e "$OUT/liquidity_vacuum_events.csv"
            test -e "$OUT/feature_contract/raw_evidence.json"
            python - <<PY
          import json
          from pathlib import Path
          report = json.loads(Path('$OUT/liquidity_vacuum_screen.json').read_text())
          assert report['symbol'] == '${{ matrix.symbol }}'
          assert report['development_period'] == ['2023-06-01', '2023-06-14']
          assert report['round_trip_hurdle_bps'] == 20.0
          print(json.dumps(report, indent=2))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-liquidity-vacuum-${{ matrix.symbol }}-${{ github.sha }}
          path: |
            artifacts/external-liquidity-vacuum-screen/${{ matrix.symbol }}/liquidity_vacuum_screen.json
            artifacts/external-liquidity-vacuum-screen/${{ matrix.symbol }}/liquidity_vacuum_events.csv
            artifacts/external-liquidity-vacuum-screen/${{ matrix.symbol }}/feature_contract/raw_evidence.json
            artifacts/external-liquidity-vacuum-screen/${{ matrix.symbol }}/console.log
          if-no-files-found: warn
          retention-days: 90
