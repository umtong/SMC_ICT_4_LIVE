name: candidate-10-v50-internal-dealing-range

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v50_*.py
      - research/candidate-10/test_c10_v50_internal_range.py
      - .github/workflows/candidate-10-v50-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v50-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  development-weeks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - period_id: DEV_2026_A
            start: "2026-01-05"
            end_exclusive: "2026-01-12"
          - period_id: DEV_2026_B
            start: "2026-02-09"
            end_exclusive: "2026-02-16"
          - period_id: DEV_2026_C
            start: "2026-03-16"
            end_exclusive: "2026-03-23"
          - period_id: DEV_2026_D
            start: "2026-04-20"
            end_exclusive: "2026-04-27"
          - period_id: DEV_2026_E
            start: "2026-05-25"
            end_exclusive: "2026-06-01"
          - period_id: DEV_2026_F
            start: "2026-06-29"
            end_exclusive: "2026-07-06"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run internal-range exact comparison
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v50/${{ matrix.period_id }}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v50:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v50
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v50
              cp /workspace/research/candidate-10/c10_v*.py /tmp/candidate11-v50/
              cp /workspace/research/candidate-10/test_c10_v*.py /tmp/candidate11-v50/
              smc4 doctor
              python /tmp/candidate11-v50/c10_v50_patch.py \
                /tmp/candidate11-v50/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v50/c10_v*.py \
                /tmp/candidate11-v50/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v50 \
                -p "test_c10_v*.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v50/${{ matrix.period_id }}"
              python /tmp/candidate11-v50/c10_v50_run.py \
                --candidate11-dir /tmp/candidate11-v50 \
                --start "${{ matrix.start }}" \
                --end-exclusive "${{ matrix.end_exclusive }}" \
                --variant source-ranges-transfer-state \
                --evidence-class previously_inspected_temporal_development \
                --output "${BASE}/source-ranges-transfer-state"

              for variant in \
                internal-ranges-event-leader \
                internal-ranges-transfer-state; do
                mkdir -p "${BASE}/${variant}/data"
                cp -al "${BASE}/source-ranges-transfer-state/data/." \
                  "${BASE}/${variant}/data/"
                python /tmp/candidate11-v50/c10_v50_run.py \
                  --candidate11-dir /tmp/candidate11-v50 \
                  --start "${{ matrix.start }}" \
                  --end-exclusive "${{ matrix.end_exclusive }}" \
                  --variant "${variant}" \
                  --evidence-class previously_inspected_temporal_development \
                  --output "${BASE}/${variant}"
              done
            '

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v50-${{ matrix.period_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v50/${{ matrix.period_id }}
          if-no-files-found: warn
          retention-days: 14

  untouched-continuous-july:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run untouched July continuous account
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v50/UNTOUCHED_CONTINUOUS_2026_07"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v50:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v50
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v50
              cp /workspace/research/candidate-10/c10_v*.py /tmp/candidate11-v50/
              cp /workspace/research/candidate-10/test_c10_v*.py /tmp/candidate11-v50/
              smc4 doctor
              python /tmp/candidate11-v50/c10_v50_patch.py \
                /tmp/candidate11-v50/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v50/c10_v*.py \
                /tmp/candidate11-v50/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v50 \
                -p "test_c10_v*.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v50/UNTOUCHED_CONTINUOUS_2026_07"
              python /tmp/candidate11-v50/c10_v50_run.py \
                --candidate11-dir /tmp/candidate11-v50 \
                --start "2026-07-06" \
                --end-exclusive "2026-08-01" \
                --variant source-ranges-transfer-state \
                --evidence-class untouched_continuous_temporal_holdout \
                --output "${BASE}/source-ranges-transfer-state"

              for variant in \
                internal-ranges-event-leader \
                internal-ranges-transfer-state; do
                mkdir -p "${BASE}/${variant}/data"
                cp -al "${BASE}/source-ranges-transfer-state/data/." \
                  "${BASE}/${variant}/data/"
                python /tmp/candidate11-v50/c10_v50_run.py \
                  --candidate11-dir /tmp/candidate11-v50 \
                  --start "2026-07-06" \
                  --end-exclusive "2026-08-01" \
                  --variant "${variant}" \
                  --evidence-class untouched_continuous_temporal_holdout \
                  --output "${BASE}/${variant}"
              done
            '

      - name: Upload untouched continuous evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v50-UNTOUCHED_CONTINUOUS_2026_07-${{ github.sha }}
          path: artifacts/candidate-10-v50/UNTOUCHED_CONTINUOUS_2026_07
          if-no-files-found: warn
          retention-days: 14
