name: candidate-03-install-native-gtc-market-execution

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-tif-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace one-level FOK capacity test with native market execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          strategy_path = Path('research/candidate-03/nt_lvcfr_strategy.py')
          strategy = strategy_path.read_text(encoding='utf-8')
          old = '''            time_in_force=TimeInForce.FOK,\n'''
          new = '''            # A Binance market order is not a one-level all-or-none order.\n            # On L1 data NautilusTrader fills displayed top liquidity first and\n            # completes a GTC market remainder one tick through the book. The\n            # separately applied 1.5 bp impact remains the conservative fill cost.\n            time_in_force=TimeInForce.GTC,\n'''
          if strategy.count(old) != 1:
              raise SystemExit(f'entry TIF target count={strategy.count(old)}')
          strategy = strategy.replace(old, new)
          old = '''                # Defensive only: FOK entries should never partially fill. If a\n                # venue model reports a partial before cancellation, retain the\n                # native position and manage it rather than orphaning exposure.\n'''
          new = '''                # Defensive only: a venue can cancel a market remainder after\n                # partial execution. Retain and manage the native position rather\n                # than orphaning already filled exposure.\n'''
          if strategy.count(old) != 1:
              raise SystemExit(f'partial-fill comment target count={strategy.count(old)}')
          strategy_path.write_text(strategy.replace(old, new), encoding='utf-8')

          test_path = Path('research/candidate-03/test_nt_lvcfr.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''class PositionEventContractTests(unittest.TestCase):\n'''
          replacement = '''class EntryExecutionContractTests(unittest.TestCase):\n    def test_native_market_entry_is_gtc_not_one_level_fok(self) -> None:\n        source = Path(__file__).with_name("nt_lvcfr_strategy.py").read_text(encoding="utf-8")\n        self.assertIn("time_in_force=TimeInForce.GTC", source)\n        self.assertNotIn("time_in_force=TimeInForce.FOK", source)\n\n\nclass PositionEventContractTests(unittest.TestCase):\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'execution test marker count={tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement), encoding='utf-8')

          readme_path = Path('research/candidate-03/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = '''모델 점수, 방향, 종목, 최근 손익에 따른 위험배수나 별도 명목한도는 없다. 신규 진입은 FOK 한 건만 제출하며, 미체결 신규 진입 주문과 보유 포지션을 동시에 유지하지 않는다. 청산 주문은 reduce-only다.\n'''
          new = '''모델 점수, 방향, 종목, 최근 손익에 따른 위험배수나 별도 명목한도는 없다. 신규 진입은 native GTC 시장가 한 건만 제출하며, NautilusTrader가 표시 top 수량을 먼저 체결하고 L1 잔량은 한 틱 불리하게 전량 체결한다. 진입 처리 중에는 다른 신규 진입을 제출하지 않으며, 청산 주문은 reduce-only다.\n'''
          if readme.count(old) != 1:
              raise SystemExit(f'README entry target count={readme.count(old)}')
          readme = readme.replace(old, new)
          old = '''- top-of-book 공백이 매우 짧아 FOK 수량이 체결되지 않을 때. 이는 성과가 아니라 용량 실패로 기록한다.\n'''
          new = '''- 실제 다단계 호가 깊이와 NautilusTrader L1 시장가 잔량의 한 틱 체결 가정이 크게 다를 때. 이는 별도 깊이 데이터 검증 전 알려진 체결 근사다.\n'''
          if readme.count(old) != 1:
              raise SystemExit(f'README FOK failure target count={readme.count(old)}')
          readme = readme.replace(old, new)
          old = '''- Binance top-of-book만으로 다단계 호가 시장충격을 충분히 표현하지 못할 때. 1.5bp impact와 FOK top-size 제약으로 보수적으로 다룬다.\n'''
          new = '''- Binance top-of-book만으로 다단계 호가 시장충격을 충분히 표현하지 못할 때. 원본 bid/ask에 1.5bp impact를 선반영하고 NautilusTrader의 L1 잔량 한 틱 체결을 추가하지만 실제 깊이와 차이가 날 수 있다.\n'''
          if readme.count(old) != 1:
              raise SystemExit(f'README impact target count={readme.count(old)}')
          readme_path.write_text(readme.replace(old, new), encoding='utf-8')
          PY

          IMAGE=ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONPYCACHEPREFIX=/tmp/candidate-03-pycache \
                python -m compileall -q research/candidate-03 src/smc_ict_4
            '

          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add research/candidate-03/nt_lvcfr_strategy.py research/candidate-03/test_nt_lvcfr.py research/candidate-03/README.md
          git commit -m "candidate-03: use native GTC market execution"
          git push origin HEAD:research/candidate-03
