name: candidate-08-opening-type-first-pullback-direct-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-opening-type-first-pullback-direct-v2"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-opening-type-first-pullback-direct-v2
  cancel-in-progress: true

jobs:
  first-week:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      MARKER: research/candidate-08/.run-opening-type-first-pullback-direct-v2
      OUTPUT: research/candidate-08/evidence/opening-type-first-pullback-v2-direct-first
      CACHE: .cache/candidate-08-opening-type-first-pullback-v2
      CONFIG: research/candidate-08/config_opening_type_first_pullback_multiasset_v2.json
      PATTERN: research/candidate-08/config_range_fvg.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-08-opening-type-first-pullback-v2
          key: candidate-08-opening-type-first-pullback-v2-${{ hashFiles('research/candidate-08/config_opening_type_first_pullback_multiasset_v2.json') }}
          restore-keys: |
            candidate-08-opening-type-first-pullback-v2-
            candidate-08-opening-type-state-router-v1-
            candidate-08-aggtrade-acceptance-

      - name: Test and replay identical frozen first week
        id: research
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT" "$CACHE"
          set +e
          (
            set -euo pipefail
            smc4 doctor
            python -m compileall -q \
              research/candidate-08/opening_type_first_pullback_signals_v2.py \
              research/candidate-08/test_opening_type_first_pullback_signals_v2.py \
              research/candidate-08/run_opening_type_first_pullback_nautilus_v2.py
            python research/candidate-08/test_opening_type_first_pullback_signals_v2.py -v
            python research/candidate-08/run_opening_type_first_pullback_nautilus_v2.py \
              --suite first --config "$CONFIG" --pattern-config "$PATTERN" \
              --output "$OUTPUT" --data-cache "$CACHE"
          ) 2>&1 | tee "$OUTPUT/workflow.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUTPUT/exit_status.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER"
          git add -A -- "$OUTPUT" "$MARKER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: record opening-type first-pullback V2 direct evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1

      - name: Enforce reproducible execution
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
