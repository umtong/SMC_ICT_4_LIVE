name: Candidate 15 V43 positive-route integration

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v43-positive-route-integration.json"
      - "research/candidate-15/diagnose_v43_positive_route_integration.py"
      - ".github/workflows/candidate-15-v43-positive-route-integration.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v43-positive-route-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen integration contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile research/candidate-15/diagnose_v43_positive_route_integration.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path(
              'research/candidate-15/protocol-v43-positive-route-integration.json'
          ).read_text())
          assert p['schema'] == 'candidate-15-v43-positive-route-integration-v1'
          assert p['fixed_selection']['minimum_development_route_trades'] == 5
          assert p['fixed_selection']['minimum_stability_route_trades'] == 5
          assert p['fixed_selection']['episode_bucket_minutes'] == 30
          assert p['fixed_selection']['global_position_limit'] == 1
          assert p['advance_gate']['minimum_independent_source_routes'] == 2
          assert p['advance_gate']['minimum_confirmation_trades_per_day'] == 0.5
          PY

      - name: Run evidence-locked route integration
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-15/diagnose_v43_positive_route_integration.py \
            --protocol research/candidate-15/protocol-v43-positive-route-integration.json \
            --output research/candidate-15/v43/positive_route_integration/results

      - name: Verify route lock, causal deduplication and one global slot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path('research/candidate-15/v43/positive_route_integration/results')
          summary = json.loads((root / 'summary.json').read_text())
          if summary['classification'] == 'V43_SKIPPED_EXISTING_NAUTILUS_ADVANCE':
              assert summary['existing_advance_versions']
              raise SystemExit(0)
          for route in summary['selected_route_records']:
              assert route['development_trades'] >= 5
              assert route['stability_trades'] >= 5
              assert route['development_mean_net_bps'] > 0.0
              assert route['stability_mean_net_bps'] > 0.0
              assert route['route_score_bps'] == min(
                  route['development_mean_net_bps'],
                  route['stability_mean_net_bps'],
              )
          def read(path):
              try:
                  return pd.read_csv(path)
              except EmptyDataError:
                  return pd.DataFrame()
          episode = read(root / 'episode_deduplicated_proposals.csv')
          if len(episode.index):
              assert not episode.duplicated(['symbol', 'episode_bucket']).any()
          selected = read(root / 'selected_integrated_trades.csv')
          if len(selected.index) > 1:
              opened = pd.to_datetime(selected['entry_ts'], utc=True)
              closed = pd.to_datetime(selected['exit_ts'], utc=True)
              assert (
                  opened.iloc[1:].reset_index(drop=True)
                  >= closed.iloc[:-1].reset_index(drop=True)
              ).all()
          PY

      - name: Persist compact integration evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v43/positive_route_integration/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V43_POSITIVE_ROUTE_INTEGRATION_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v43-bot
          git config user.email candidate-15-v43-bot@users.noreply.github.com
          git add \
            research/candidate-15/V43_POSITIVE_ROUTE_INTEGRATION_RESULT.md \
            research/candidate-15/v43/positive_route_integration/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v43: persist positive-route integration [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v43-positive-route-integration-${{ github.run_id }}
          path: |
            research/candidate-15/V43_POSITIVE_ROUTE_INTEGRATION_RESULT.md
            research/candidate-15/v43/positive_route_integration/results
          if-no-files-found: warn
          retention-days: 30
