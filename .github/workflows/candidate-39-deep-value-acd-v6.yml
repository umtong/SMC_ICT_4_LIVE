name: candidate-39-v6-deep-value-acd-development

on:
  push:
    branches: [research/candidate-39]
    paths:
      - ".github/workflows/candidate-39-deep-value-acd-v6.yml"
      - "research/candidate-39/router_v6.py"
      - "research/candidate-39/strategy_v6.py"
      - "research/candidate-39/run_v6.py"
      - "research/candidate-39/test_router_v6.py"
      - "research/candidate-39/router_v5.py"
      - "research/candidate-39/strategy_v5.py"
      - "research/candidate-39/router_v4*.py"
      - "research/candidate-39/strategy_v4.py"
      - "research/candidate-39/router.py"
      - "research/candidate-39/strategy.py"
      - "research/candidate-39/config.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: candidate-39-v6-${{ github.sha }}
  cancel-in-progress: false

jobs:
  seven-day-development-falsification:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: research/candidate-39:research/candidate-35:research/candidate-29:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/c39-v6-development-2026-07-08_2026-07-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-verified raw-data cache
        uses: actions/cache@v4
        with:
          path: .cache/c39-v2-development
          key: candidate39-binance-2026-07-08_2026-07-14-v1

      - name: Verify V6 causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-39
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          path = Path("research/candidate-39/test_router_v6.py")
          spec = importlib.util.spec_from_file_location("candidate39_v6_contract", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          count = 0
          for name in sorted(vars(module)):
              test = getattr(module, name)
              if name.startswith("test_") and callable(test):
                  test()
                  count += 1
          assert count >= 8, count
          print(f"candidate39 V6 causal contracts passed: {count}")
          import strategy_v6
          assert strategy_v6.Candidate35Strategy is strategy_v6.Candidate39V6Strategy
          assert strategy_v6.Candidate39Strategy is strategy_v6.Candidate39V6Strategy
          PY

      - name: Replay one four-asset continuous Nautilus account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-39/run_v6.py \
            --config research/candidate-39/config.json \
            --start 2026-07-08 --end 2026-07-14 \
            --cache .cache/c39-v2-development \
            --workspace .cache/c39-v6-development-work \
            --output "$ROOT" 2>&1 | tee "$ROOT/console.log"

      - name: Verify integrity and expose exact V6 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from collections import defaultdict
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          for name in ("metrics.json", "run.json", "data_manifest.json", "strategy_diagnostics.json"):
              assert (root / name).is_file(), name
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          manifest = json.loads((root / "data_manifest.json").read_text())
          assert metrics["candidate"] == "candidate-39-deep-value-acd-router-v6"
          assert metrics["non_scalping"] is True
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["calendar_days"] == 7
          assert set(metrics["state_families"]) == {
              "DEEP_VALUE_SPONSORED_PULLBACK",
              "LIQUIDATION_FAILURE_REACCEPTANCE",
              "ACD_A_ESTABLISHMENT_RETEST",
              "ACD_C_FAILED_A_REVERSAL",
          }
          assert diagnostics.get("max_open_positions_observed", 0) <= 1
          assert diagnostics.get("max_simultaneous_entry_intents", 0) <= 1
          assert diagnostics.get("global_position_violations", 0) == 0
          assert diagnostics.get("entry_submissions", 0) == diagnostics.get("limit_entry_submissions", 0)
          assert diagnostics.get("order_rejections", 0) == 0
          assert diagnostics.get("emergency_flattens", 0) == 0
          assert manifest["continuous_account"] is True
          assert manifest["account_restarts"] == 0
          assert manifest["strategy_restarts"] == 0
          assert all(record["mode"] == "direct-checksum-verified-binance" for record in metrics["input_records"].values())
          headline = {key: metrics.get(key) for key in (
              "evaluation_start", "evaluation_end", "ending_nav", "total_return",
              "geometric_daily_growth", "max_drawdown", "trades", "wins", "losses",
              "win_rate", "profit_factor", "expectancy_usdt", "active_days", "gate_pass",
              "position_counts_by_symbol",
          )}
          print("C39V6_METRICS_JSON=" + json.dumps(headline, sort_keys=True, allow_nan=False))
          print("C39V6_GATE_CHECKS_JSON=" + json.dumps(metrics["gate_checks"], sort_keys=True))
          print("C39V6_ROUTER_AUDIT_JSON=" + json.dumps(diagnostics.get("v6_router_audit", {}), sort_keys=True))
          print("C39V6_FAMILY_COUNTS_JSON=" + json.dumps(diagnostics.get("v6_family_counts", {}), sort_keys=True))
          print("C39V6_FAMILY_ENTRIES_JSON=" + json.dumps(diagnostics.get("v6_family_entries", {}), sort_keys=True))
          diag_keys = (
              "complete_universe_minutes", "quarter_hour_decisions", "unresolved_episodes",
              "entry_submissions", "entry_expirations", "cost_space_rejections",
              "non_passive_entry_rejections", "order_rejections", "emergency_flattens",
              "v6_completed_15m_decisions", "v6_feature_stale_episodes",
              "v6_operational_horizon_rejections", "v6_pending_stop_invalidations",
              "v6_pending_state_invalidations", "v6_no_setup_episodes",
              "v6_global_ambiguity_rejections", "v6_consumed_episode_suppressions",
          )
          print("C39V6_DIAGNOSTICS_JSON=" + json.dumps({key: diagnostics.get(key) for key in diag_keys}, sort_keys=True))
          family = defaultdict(lambda: {"trades": 0, "wins": 0, "pnl": 0.0})
          closed = root / "closed_scenarios.json"
          if closed.is_file():
              for item in json.loads(closed.read_text()):
                  state = str(item.get("state", "UNKNOWN"))
                  pnl = float(str(item.get("realized_pnl", "0")).split()[0].replace(",", ""))
                  family[state]["trades"] += 1
                  family[state]["wins"] += int(pnl > 0.0)
                  family[state]["pnl"] += pnl
          print("C39V6_FAMILY_RESULTS_JSON=" + json.dumps(family, sort_keys=True))
          PY

      - name: Upload V6 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate39-v6-development-${{ github.sha }}
          path: artifacts/c39-v6-development-2026-07-08_2026-07-14/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
