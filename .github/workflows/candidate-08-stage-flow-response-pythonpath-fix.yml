name: candidate-08-stage-flow-response-pythonpath-fix

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-stage-flow-response-pythonpath-fix"

permissions:
  contents: write

jobs:
  stage-pythonpath-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage the exact active workflow with candidate module path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/candidate-08/.workflow-staging
          python -c 'from pathlib import Path; source=Path(".github/workflows/candidate-08-auction-router-nautilus-v4.yml"); s=source.read_text(encoding="utf-8"); old="      FLOW_RESPONSE_AUCTION_FAMILY_MODE: both\n"; new=old+"      PYTHONPATH: research/candidate-08\n"; assert s.count(old)==1 and "      PYTHONPATH: research/candidate-08\n" not in s; Path("research/candidate-08/.workflow-staging/candidate-08-auction-router-nautilus-v4.yml").write_text(s.replace(old,new),encoding="utf-8")'
          grep -q '^      PYTHONPATH: research/candidate-08$' research/candidate-08/.workflow-staging/candidate-08-auction-router-nautilus-v4.yml
          rm -f research/candidate-08/.run-stage-flow-response-pythonpath-fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/candidate-08/.workflow-staging/candidate-08-auction-router-nautilus-v4.yml research/candidate-08/.run-stage-flow-response-pythonpath-fix
          git commit -m "candidate-08: stage flow-response Python path fix [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
