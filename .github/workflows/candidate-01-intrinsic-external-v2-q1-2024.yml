name: candidate-01-intrinsic-external-v2-q1-2024

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-intrinsic-external-v2-q1-2024.yml"
      - "research/candidate-01/intrinsic_external_liquidity_v2_daily_period.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_week.py"
      - "research/candidate-01/adaptive_aggtrade_clock.py"
      - "research/candidate-01/directional_change_failed_sweep_week.py"
      - "research/candidate-01/impact_regime_probe.py"
      - "research/candidate-01/aggtrade_data.py"
      - "research/candidate-01/aggtrade_clock.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
      - "tests/test_candidate_01_adaptive_clock.py"
      - "tests/test_candidate_01_directional_change.py"
      - "tests/test_candidate_01_intrinsic_external_v2.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frozen 2024 Q1 BTC long gate
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/aggtrade_data.py \
                research/candidate-01/aggtrade_clock.py \
                research/candidate-01/adaptive_aggtrade_clock.py \
                research/candidate-01/impact_regime_probe.py \
                research/candidate-01/directional_change_failed_sweep_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_daily_period.py
              python -m unittest discover -s tests -p "test_candidate_01_adaptive_clock.py" -v
              python -m unittest discover -s tests -p "test_candidate_01_directional_change.py" -v
              python -m unittest discover -s tests -p "test_candidate_01_intrinsic_external_v2.py" -v
              rm -rf artifacts/candidate-01-intrinsic-external-v2-q1-2024
              python research/candidate-01/intrinsic_external_liquidity_v2_daily_period.py \
                --start 2024-01-01 \
                --end 2024-04-01 \
                --cache .cache/candidate-01-intrinsic-external-v2-q1-2024 \
                --output artifacts/candidate-01-intrinsic-external-v2-q1-2024 \
                --workers 8
            '
      - name: Print Q1 long-gate evidence
        run: cat artifacts/candidate-01-intrinsic-external-v2-q1-2024/intrinsic_external_liquidity_v2_daily_period_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-intrinsic-external-v2-q1-2024-${{ github.sha }}
          path: artifacts/candidate-01-intrinsic-external-v2-q1-2024
          if-no-files-found: error
          retention-days: 30
