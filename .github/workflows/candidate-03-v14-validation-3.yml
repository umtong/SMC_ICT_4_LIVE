name: candidate-03-v14-frozen-validation-3

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/V14_FREEZE.json"
      - ".github/workflows/candidate-03-v14-validation-3.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v14_config.json

jobs:
  frozen-validation-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen V14 source identity and runtime
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [research/candidate-03/nt_lvcfr_strategy.py]=e4d00ae0c6fa1d24198c846bccb247baacdc0456
            [research/candidate-03/nt_lvcfr_v14_config.json]=2b70e8a8233b6d3ae5de33ac6f670a770bff23d7
            [research/candidate-03/derive_nt_lvcfr_v14_signals.py]=fc573dd4925dd9c517bc7948e775f23179df7f3c
            [research/candidate-03/test_nt_lvcfr_v14.py]=9153edd405b6d7eddafdcf3b110cdf77685385d9
            [research/candidate-03/derive_nt_lvcfr_v7_signals.py]=b76b4e3cffec4c40eb8c9fdcdaad577881b61ba8
            [research/candidate-03/derive_nt_lvcfr_v5_signals.py]=44274661af78a8b38bcc2605b168b20e690ca953
            [research/candidate-03/derive_nt_lvcfr_v4_signals.py]=3b18d8ed841c255c020e5948a838a3e1a3dc0e04
            [research/candidate-03/derive_nt_lvcfr_v2_signals.py]=fd049c05cd1097f52ee9ddb28dadd4beb5639b52
            [research/candidate-03/run_nt_lvcfr.py]=74bb02f1b69ee31ce32ddfa47497bdd9770ac00b
            [research/candidate-03/nt_lvcfr_trade_proxy.py]=37f34bf4cb86911e631d43b3aa28df4c7a7aff37
            [research/candidate-03/nt_lvcfr_data.py]=f096b6dfd3944f559983010c03cd61622ee8c977
            [research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py]=68267662f5730238b8115ff1928b5a303e585acb
          )
          for path in "${!expected[@]}"; do
            actual=$(git hash-object "$path")
            test "$actual" = "${expected[$path]}" || {
              echo "frozen source mismatch: $path expected=${expected[$path]} actual=$actual" >&2
              exit 1
            }
          done
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_trade_proxy.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v14.py
            '

      - name: Restore immutable third-week execution inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Third frozen BTC week — 2022-05-16
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          out=artifacts/candidate-03/nt-lvcfr-v14/validation-3
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v14_signals.py \
              --prepared-root $prepared --output-manifest $out/v14_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/candidate-03/nt-lvcfr-v14/validation-3/v14_signal_manifest.json').read_text())
          expected = {
              'source_signal_count': 19,
              'v11_signal_count': 7,
              'fallback_signal_count': 5,
              'derived_signal_count': 12,
          }
          if any(manifest.get(key) != value for key, value in expected.items()):
              raise SystemExit(f'V14 third-week routing regression: {manifest}')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py \
              --prepared-root $prepared --config $CONFIG" \
            2>&1 | tee "$out/catalog_rebuild.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2022-05-16 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Preserve frozen third-week evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v14-validation-3-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v14/validation-3/**/*.json
            artifacts/candidate-03/nt-lvcfr-v14/validation-3/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v14/validation-3/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v14/validation-3/**/*.log
          if-no-files-found: warn
          retention-days: 30
