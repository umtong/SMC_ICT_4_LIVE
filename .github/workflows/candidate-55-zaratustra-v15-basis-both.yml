name: candidate-55-zaratustra-v15-basis-both

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-zaratustra-v15-basis-both.yml"
      - "research/candidate-55/router_zaratustra.py"
      - "research/candidate-55/router_zaratustra_v13.py"
      - "research/candidate-55/router_zaratustra_v15.py"
      - "research/candidate-55/strategy_zaratustra.py"
      - "research/candidate-55/strategy_zaratustra_v15.py"
      - "research/candidate-55/strategy_zaratustra_v15_basis_both.py"
      - "research/candidate-55/run_zaratustra_v15_repair.py"
      - "research/candidate-55/run_zaratustra_v15_basis_both.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-zaratustra-v15-basis-both
  cancel-in-progress: true

jobs:
  integrated-basis-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55

      - name: Materialize integrated V15 basis router
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router_zaratustra_v13.py
          cp research/candidate-55/router_zaratustra_v15.py research/candidate-51/router.py
          cp research/candidate-55/strategy_zaratustra.py research/candidate-51/strategy_zaratustra.py
          cp research/candidate-55/strategy_zaratustra_v15.py research/candidate-51/strategy_zaratustra_v15.py
          cp research/candidate-55/strategy_zaratustra_v15_basis_both.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and prove two-sided causal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from pathlib import Path
          import tempfile
          import pandas as pd

          from strategy import _PremiumFeatureStore

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "features.csv.gz"
              pd.DataFrame(
                  {
                      "observed_time_ns": [60_000_000_000, 120_000_000_000],
                      "feature_ready": [True, True],
                      "premium_change_5m": [-0.00004, 0.00006],
                  }
              ).to_csv(path, index=False, compression="gzip")
              store = _PremiumFeatureStore(path)
              first = store.observation(60_000_000_000, 65.0)
              assert first.ready and first.premium_change_5m == -0.00004
              causal = store.observation(119_000_000_000, 65.0)
              assert causal.observed_time_ns == 60_000_000_000
              second = store.observation(120_000_000_000, 65.0)
              assert second.ready and second.premium_change_5m == 0.00006
          print("Integrated V15 basis router uses causal complete-minute data")
          PY

      - name: Run integrated one-slot tournament
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_zaratustra_v15_basis_both.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-zaratustra-v15-basis-both-${{ github.sha }}
          path: |
            artifacts/candidate-55/zaratustra-v15-basis-both-*
          if-no-files-found: warn
          retention-days: 30
