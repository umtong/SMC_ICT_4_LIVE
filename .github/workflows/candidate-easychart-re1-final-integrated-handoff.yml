name: candidate-easychart-re1-final-integrated-handoff

on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths:
      - "research/candidate-easychart_re1/.final_integrated_handoff_dispatch_marker"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-final-integrated-handoff
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: research/candidate-easychart_re1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-easychart_re1
          fetch-depth: 0

      - name: Wait for v6 diagnostics and medium evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .final-evidence-v6
          mkdir -p .final-evidence-v6/diagnostic .final-evidence-v6/medium
          for spec in \
            "candidate-easychart-re1-auction-router-v6-diagnostic.yml:diagnostic" \
            "candidate-easychart-re1-auction-router-v6-medium.yml:medium"; do
            workflow="${spec%%:*}"
            destination="${spec##*:}"
            run_id=""
            for attempt in $(seq 1 180); do
              row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$BRANCH" --limit 1 --json databaseId,status,conclusion --jq '.[0] // {}')"
              run_id="$(python -c 'import json,sys; print(json.load(sys.stdin).get("databaseId", ""))' <<<"$row")"
              status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<<"$row")"
              conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))' <<<"$row")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "$workflow completed with $conclusion" >&2
                  exit 1
                fi
                break
              fi
              sleep 30
            done
            [[ -n "$run_id" ]] || { echo "No run found for $workflow" >&2; exit 1; }
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir ".final-evidence-v6/$destination"
          done

      - name: Build v6 evidence and select the final integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, math, re
          from pathlib import Path
          from datetime import datetime, timezone
          import pandas as pd

          evidence_dir=Path('research/candidate-easychart_re1/evidence')
          evidence_dir.mkdir(parents=True,exist_ok=True)
          period_days={'may-2024-guard':14,'february-2025-short':10,'live-examples-2025-short':11,'november-2025-guard':14,'february-2026-guard':14,'medium-2024-autumn':91}
          def norm(x):return re.sub(r'[^a-z0-9]+','_',str(x).lower()).strip('_')
          def flatten(o,p=''):
              r={}
              if isinstance(o,dict):
                  for k,v in o.items():r.update(flatten(v,f'{p}.{k}' if p else str(k)))
              elif isinstance(o,list):
                  for i,v in enumerate(o):r.update(flatten(v,f'{p}[{i}]'))
              else:r[p]=o
              return r
          def metric(flat,needles):
              hits=[]
              for k,v in flat.items():
                  if isinstance(v,bool) or not isinstance(v,(int,float)):continue
                  for n in needles:
                      if norm(n) in norm(k):hits.append((len(norm(k)),float(v)));break
              return min(hits,default=(0,None))[1]
          def pick(df,names,numeric=False):
              hits=[]
              for c in df.columns:
                  nc=norm(c)
                  for n in names:
                      nn=norm(n)
                      if nc==nn or nn in nc:
                          if numeric and pd.to_numeric(df[c],errors='coerce').notna().sum()==0:continue
                          hits.append((0 if nc==nn else 1,len(nc),c));break
              return min(hits,default=(9,999,None))[2]
          def parse_time(s):
              if pd.api.types.is_numeric_dtype(s):
                  x=pd.to_numeric(s,errors='coerce');med=x.dropna().abs().median()
                  unit='ns' if med and med>1e17 else 'ms' if med and med>1e11 else 's'
                  return pd.to_datetime(x,unit=unit,utc=True,errors='coerce')
              return pd.to_datetime(s,utc=True,errors='coerce')
          def summarize(root,candidate):
              rows=[]
              for mpath in root.rglob('metrics.json'):
                  metrics=json.loads(mpath.read_text())
                  flat=flatten(metrics); text=str(mpath).lower()
                  period=next((p for p in period_days if p in text),None);days=period_days.get(period)
                  audits=list(mpath.parent.rglob('trade_audit.csv'))
                  df=pd.read_csv(audits[0]) if audits else pd.DataFrame();n=len(df)
                  reported=metric(flat,['completed_trades','closed_trades','trade_count','total_trades'])
                  if n==0 and reported is not None:n=int(reported)
                  rr=pick(df,['gross_rr','planned_rr','plan_rr','reward_risk'],True) if len(df) else None
                  rcol=pick(df,['realized_r','net_r','r_multiple','pnl_r','result_r'],True) if len(df) else None
                  pnl=pick(df,['net_pnl','realized_pnl','pnl'],True) if len(df) else None
                  outcome=pick(df,['outcome','exit_reason','result']) if len(df) else None
                  ent=pick(df,['entry_time_ns','entry_time','entry_ts']) if len(df) else None
                  ext=pick(df,['exit_time_ns','exit_time','exit_ts']) if len(df) else None
                  work=pd.DataFrame(index=df.index)
                  if rr:work['planned_rr']=pd.to_numeric(df[rr],errors='coerce')
                  if rcol:work['r']=pd.to_numeric(df[rcol],errors='coerce')
                  if pnl:work['pnl']=pd.to_numeric(df[pnl],errors='coerce')
                  if outcome:
                      o=df[outcome].astype(str).str.upper();work['win']=o.str.contains('TP|TARGET|WIN|PROFIT')
                      unknown=~o.str.contains('TP|TARGET|WIN|PROFIT|SL|STOP|LOSS')
                      if 'r' in work:work.loc[unknown,'win']=work.loc[unknown,'r']>0
                      elif 'pnl' in work:work.loc[unknown,'win']=work.loc[unknown,'pnl']>0
                  elif 'r' in work:work['win']=work.r>0
                  elif 'pnl' in work:work['win']=work.pnl>0
                  if ent and ext:work['hold_minutes']=(parse_time(df[ext])-parse_time(df[ent])).dt.total_seconds()/60
                  wr=float(work.win.mean()) if 'win' in work and len(work) else metric(flat,['win_rate','winning_percentage'])
                  if wr is not None and 1<wr<=100:wr/=100
                  avg_r=float(work.r.mean()) if 'r' in work and work.r.notna().any() else metric(flat,['expectancy_r','average_r','mean_r'])
                  total_r=float(work.r.sum()) if 'r' in work and work.r.notna().any() else metric(flat,['total_r','sum_r'])
                  avg_rr=float(work.planned_rr.mean()) if 'planned_rr' in work and work.planned_rr.notna().any() else metric(flat,['average_gross_rr','average_planned_rr','avg_gross_rr'])
                  med_rr=float(work.planned_rr.median()) if 'planned_rr' in work and work.planned_rr.notna().any() else None
                  med_hold=float(work.hold_minutes.median()) if 'hold_minutes' in work and work.hold_minutes.notna().any() else metric(flat,['median_hold_minutes','median_holding_minutes'])
                  initial=metric(flat,['initial_nav','starting_balance','initial_balance','starting_equity'])
                  final=metric(flat,['final_nav','ending_balance','final_balance','ending_equity'])
                  ret=(final/initial-1) if final and initial and initial>0 else metric(flat,['net_return','total_return'])
                  if ret is not None and 1<ret<=100:ret/=100
                  dd=metric(flat,['max_drawdown','maximum_drawdown'])
                  if dd is not None and 1<dd<=100:dd/=100
                  rows.append({'period':period,'days':days,'trades':n,'trades_per_day':n/days if days else None,'win_rate':wr,'average_r':avg_r,'total_r':total_r,'average_planned_rr':avg_rr,'median_planned_rr':med_rr,'median_hold_minutes':med_hold,'initial_nav':initial,'final_nav':final,'net_return':ret,'max_drawdown':dd,'trade_audit_rows':len(df),'reported_trade_count':reported})
              frame=pd.DataFrame(rows)
              medium=frame[frame.period=='medium-2024-autumn'];diag=frame[frame.period!='medium-2024-autumn']
              strict=promotion=diagnostic=False;weighted=None;positive=0;block=[]
              if len(medium)==1:
                  m=medium.iloc[0]
                  strict=bool((m.trades_per_day or 0)>=1 and (m.win_rate or 0)>=0.70 and (m.average_r is None or m.average_r>0) and (m.net_return is None or m.net_return>0) and (m.median_planned_rr is None or 1<=m.median_planned_rr<=2.5) and (m.median_hold_minutes is None or 20<=m.median_hold_minutes<=360) and (m.max_drawdown is None or m.max_drawdown<0.30))
                  promotion=bool((m.trades_per_day or 0)>=0.75 and (m.win_rate or 0)>=0.65 and (m.average_r is None or m.average_r>0) and (m.net_return is None or m.net_return>0) and (m.max_drawdown is None or m.max_drawdown<0.35))
                  if (m.trades_per_day or 0)<1:block.append('MEDIUM_FREQUENCY_BELOW_ONE_PER_DAY')
                  if (m.win_rate or 0)<0.70:block.append('MEDIUM_WIN_RATE_BELOW_70_PERCENT')
                  if m.average_r is not None and m.average_r<=0:block.append('MEDIUM_NONPOSITIVE_EXPECTANCY_R')
                  if m.net_return is not None and m.net_return<=0:block.append('MEDIUM_NONPOSITIVE_NAV_RETURN')
              else:block.append('MEDIUM_EVIDENCE_MISSING_OR_DUPLICATE')
              if len(diag):
                  weighted=(diag.win_rate.fillna(0)*diag.trades.fillna(0)).sum()/max(diag.trades.fillna(0).sum(),1)
                  positive=int(((diag.total_r.fillna(0)>0)|(diag.net_return.fillna(0)>0)).sum())
                  diagnostic=bool(weighted>=0.65 and positive>=max(1,len(diag)-1))
                  if not diagnostic:block.append('DIAGNOSTIC_REGIME_ROBUSTNESS_NOT_ESTABLISHED')
              else:block.append('DIAGNOSTIC_EVIDENCE_MISSING')
              ready=bool(strict and diagnostic)
              mrow=medium.iloc[0].to_dict() if len(medium)==1 else {}
              score=(4 if ready else 0)+(2 if promotion else 0)+(1 if diagnostic else 0)+(mrow.get('win_rate') or 0)+(mrow.get('average_r') or 0)+0.25*min(mrow.get('trades_per_day') or 0,2)
              return {'candidate':candidate,'periods':frame.to_dict('records'),'diagnostic_weighted_win_rate':weighted,'diagnostic_positive_periods':positive,'diagnostic_robust':diagnostic,'medium_promotion_profile':promotion,'strict_target_profile':strict,'ready_for_long_continuous_and_paper':ready,'blockers':[] if ready else block,'selection_score':score}

          v6=summarize(Path('.final-evidence-v6'),'candidate-easychart_re1_auction_router_v6')
          (evidence_dir/'auction_router_v6_evidence.json').write_text(json.dumps(v6,indent=2,ensure_ascii=False,default=str)+'\n')
          v5_path=evidence_dir/'auction_router_v5_evidence.json'
          v5=json.loads(v5_path.read_text()) if v5_path.exists() else {'candidate':'candidate-easychart_re1_auction_router_v5','ready_for_long_continuous_and_paper':False,'medium_promotion_profile':False,'diagnostic_robust':False,'selection_score':-999,'blockers':['V5_EVIDENCE_MISSING']}
          if 'selection_score' not in v5:
              medium=next((x for x in v5.get('periods',[]) if x.get('period')=='medium-2024-autumn'),{})
              v5['selection_score']=(4 if v5.get('ready_for_long_continuous_and_paper') else 0)+(2 if v5.get('medium_promotion_profile') else 0)+(1 if v5.get('diagnostic_robust') else 0)+(medium.get('win_rate') or 0)+(medium.get('average_r') or 0)+0.25*min(medium.get('trades_per_day') or 0,2)
          selected=max((v5,v6),key=lambda x:(bool(x.get('ready_for_long_continuous_and_paper')),bool(x.get('medium_promotion_profile')),bool(x.get('diagnostic_robust')),float(x.get('selection_score') or -999)))
          final={'generated_at':datetime.now(timezone.utc).isoformat(),'candidates':[v5,v6],'selected_candidate':selected.get('candidate'),'selected_ready':bool(selected.get('ready_for_long_continuous_and_paper')),'selected_medium_promotion':bool(selected.get('medium_promotion_profile')),'selected_diagnostic_robust':bool(selected.get('diagnostic_robust')),'selected_blockers':selected.get('blockers',[]),'selection_basis':'STRICT_READY_THEN_MEDIUM_PROMOTION_THEN_DIAGNOSTIC_ROBUSTNESS_THEN_TRADE_LEVEL_SCORE'}
          (evidence_dir/'final_integrated_selection.json').write_text(json.dumps(final,indent=2,ensure_ascii=False,default=str)+'\n')
          lines=['# Final integrated EasyChart RE1 selection','',f"Selected: `{final['selected_candidate']}`",f"Ready for long continuous and paper: **{final['selected_ready']}**",'', '## v5',json.dumps(v5,indent=2,ensure_ascii=False,default=str),'','## v6',json.dumps(v6,indent=2,ensure_ascii=False,default=str)]
          (evidence_dir/'FINAL_INTEGRATED_SELECTION.md').write_text('\n'.join(lines)+'\n')
          if final['selected_ready']:
              (evidence_dir/'FINAL_INTEGRATED_READY').write_text(final['selected_candidate']+'\n')
          else:
              (evidence_dir/'FINAL_INTEGRATED_NOT_READY').write_text('\n'.join(final['selected_blockers'])+'\n')
          PY

      - name: Create selected bot and handoff only when the final evidence is ready
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('research/candidate-easychart_re1')
          evidence=json.loads((root/'evidence/final_integrated_selection.json').read_text())
          if not evidence.get('selected_ready'):
              raise SystemExit(0)
          selected=evidence['selected_candidate']
          if selected.endswith('_v6'):
              module='easychart_re1_auction_router_v6';bundle='EasyChartRE1AuctionRouterV6Bundle';strategy='EasyChartRE1PersistentVetoStrategy';runner='run_mtf_backtest_re1_auction_router_v6'
          else:
              module='easychart_re1_auction_router_v5';bundle='EasyChartRE1AuctionRouterV5Bundle';strategy='EasyChartRE1LocalAuctionStrategy';runner='run_mtf_backtest_re1_auction_router_v5'
          (root/'easychart_re1_bot.py').write_text(f'''\"\"\"Evidence-selected EasyChart RE1 production candidate.\"\"\"\nfrom {module} import {bundle}, {strategy}\nEasyChartRE1BotBundle={bundle}\nEasyChartRE1BotStrategy={strategy}\nMultiScaleScenarioBundle=EasyChartRE1BotBundle\nStrategyClass=EasyChartRE1BotStrategy\n''')
          (root/'run_mtf_backtest_re1_bot.py').write_text(f'''#!/usr/bin/env python3\n\"\"\"Run the evidence-selected EasyChart RE1 bot.\"\"\"\nimport runpy\nif __name__ == \"__main__\":\n    runpy.run_module(\"{runner}\",run_name=\"__main__\")\n''')
          handoff={'selected_candidate':selected,'strategy_module':'easychart_re1_bot','bundle_class':'EasyChartRE1BotBundle','strategy_class':'EasyChartRE1BotStrategy','runner':'run_mtf_backtest_re1_bot.py','symbols':['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'],'account':'ONE_CONTINUOUS_ACCOUNT_ONE_GLOBAL_POSITION','risk_fraction':0.03,'minimum_gross_rr':1.0,'partials':False,'pyramiding':False,'evidence':'evidence/final_integrated_selection.json'}
          (root/'paper_shadow_handoff.json').write_text(json.dumps(handoff,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit final evidence and optional ready bot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-easychart_re1/evidence
          git add research/candidate-easychart_re1/easychart_re1_bot.py research/candidate-easychart_re1/run_mtf_backtest_re1_bot.py research/candidate-easychart_re1/paper_shadow_handoff.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish final integrated EasyChart evidence selection"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
