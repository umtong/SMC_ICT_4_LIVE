name: candidate-57-jump-management-v2
on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-jump-management-v2.yml"
      - "research/candidate-57/candidate57_jump_management_v2_bundle.tar.gz.b64.part*"
      - "research/candidate-57/JUMP_MANAGEMENT_V2_FREEZE.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-57-jump-management-v2
  cancel-in-progress: true
jobs:
  evaluate:
    name: evaluate-${{ matrix.variant.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant:
          - {name: impulse_control, confirmation: 0, protection: none, activation: 999.0, floor: 0.0, gap: 999.0}
          - {name: impulse_be_0p5, confirmation: 0, protection: be_0p5, activation: 0.5, floor: 0.0, gap: 999.0}
          - {name: impulse_lock_1p0_0p25, confirmation: 0, protection: lock_1p0_0p25, activation: 1.0, floor: 0.25, gap: 999.0}
          - {name: impulse_trail_1p0_gap0p75, confirmation: 0, protection: trail_1p0_gap0p75, activation: 1.0, floor: 0.25, gap: 0.75}
          - {name: confirm5_be_0p5, confirmation: 15, protection: be_0p5, activation: 0.5, floor: 0.0, gap: 999.0}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-57, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Materialize policy
        run: |
          cat research/candidate-57/candidate57_jump_management_v2_bundle.tar.gz.b64.part* | base64 -d > /tmp/c57.tgz
          tar -xzf /tmp/c57.tgz -C research/candidate-57
          cp research/candidate-57/router_jump_management.py research/candidate-51/router.py
          cp research/candidate-57/strategy_jump_management.py research/candidate-51/strategy.py
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-57
      - name: Run mechanism variant
        run: |
          uv run python research/candidate-57/run_jump_management_variant.py \
            --variant '${{ matrix.variant.name }}' \
            --confirmation '${{ matrix.variant.confirmation }}' \
            --protection '${{ matrix.variant.protection }}' \
            --activation '${{ matrix.variant.activation }}' \
            --floor '${{ matrix.variant.floor }}' \
            --gap '${{ matrix.variant.gap }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-57-jump-management-v2-${{ matrix.variant.name }}
          path: artifacts/candidate-57/jump-management-v2-${{ matrix.variant.name }}/**
          if-no-files-found: warn
          retention-days: 30
  synthesize:
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-57, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: candidate-57-jump-management-v2-*, path: downloaded}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Decompose mechanisms
        run: |
          cat research/candidate-57/candidate57_jump_management_v2_bundle.tar.gz.b64.part* | base64 -d > /tmp/c57.tgz
          tar -xzf /tmp/c57.tgz -C research/candidate-57
          python research/candidate-57/analyze_jump_management_results.py --root downloaded --out research/candidate-57/evidence/jump-management-v2
      - name: Persist evidence
        run: |
          git config user.name candidate-57-research-bot
          git config user.email candidate-57-research-bot@users.noreply.github.com
          git add research/candidate-57/evidence/jump-management-v2
          git diff --cached --quiet && exit 0
          git commit -m "candidate57: decompose jump giveback management"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-57
            git rebase origin/research/candidate-57
            git push origin HEAD:research/candidate-57 && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-57-jump-management-v2-synthesis
          path: research/candidate-57/evidence/jump-management-v2/**
          if-no-files-found: error
