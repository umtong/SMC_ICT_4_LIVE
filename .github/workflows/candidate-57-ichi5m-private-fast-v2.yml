name: candidate-57-ichi5m-private-fast-v2
on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-ichi5m-private-fast-v2.yml"
      - "research/candidate-57/strategy_ichi5m_private_fast_v2.py"
      - "research/candidate-57/ichi5m_private_recon_fast_v2_campaign.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-57-ichi5m-private-fast-v2
  cancel-in-progress: true
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble finite-history source reconstruction
        run: |
          set -euo pipefail
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_ichi5m_private_recon_v1.py research/candidate-51/router_ichi5m_private_impl.py
          cp research/candidate-57/router_ichi5m_private_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_ichi5m_private_recon_v1.py research/candidate-51/strategy_ichi5m_private_base.py
          cp research/candidate-57/strategy_ichi5m_private_fast_v2.py research/candidate-51/strategy.py
          python -m compileall -q research/candidate-51 research/candidate-57/ichi5m_private_recon_v1_campaign.py research/candidate-57/ichi5m_private_recon_fast_v2_campaign.py research/candidate-57/trade_ledger_forensics.py
      - name: Install and doctor
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from strategy import Candidate35Config, Candidate35Strategy
          assert Candidate35Config
          strategy = Candidate35Strategy.__dict__['__init__']
          assert strategy
          print("private ichi5m finite-history execution assembled")
          PY
      - name: Run tournament
        id: campaign
        run: |
          set +e
          PYTHONPATH=research/candidate-51:research/candidate-57 uv run python research/candidate-57/ichi5m_private_recon_fast_v2_campaign.py
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit evidence
        if: always()
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_ichi5m_private_impl.py research/candidate-51/strategy_ichi5m_private_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/ichi5m-private-fast-v2
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist fast private ichi5m evidence"
              git pull --rebase origin research/candidate-57
              git push origin HEAD:research/candidate-57
            fi
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-ichi5m-private-fast-v2
          path: research/candidate-57/evidence/ichi5m-private-fast-v2
          retention-days: 14
      - name: Enforce mechanics
        if: always()
        run: test "${{ steps.campaign.outputs.status }}" = "0"
