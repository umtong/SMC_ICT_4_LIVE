name: candidate-01-v19-materialize-limit-adapter

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v19-materialize-limit-adapter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - name: Materialize the authoritative limit-entry TradeTick adapter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = """"""
          target = Path("research/candidate-01/nautilus_tick_limit_plan_backtest.py")
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 -m py_compile research/candidate-01/nautilus_tick_limit_plan_backtest.py
      - name: Commit the generated adapter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/nautilus_tick_limit_plan_backtest.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(candidate-01): add Nautilus resting-entry adapter"
          git push origin HEAD:research/candidate-01
