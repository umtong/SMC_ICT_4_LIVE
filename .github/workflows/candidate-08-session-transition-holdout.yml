name: candidate-08-structural-session-holdout

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-session-transition-holdout"

permissions:
  contents: write
  packages: read

jobs:
  probe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore official archive cache
        uses: actions/cache@v4
        with:
          path: /tmp/candidate-08-session-holdout-data
          key: candidate-08-session-holdout-binance-v1

      - name: Run predeclared 12-week structural holdout
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/session_transition_probe.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from dataclasses import dataclass\n",
              "from dataclasses import asdict, dataclass\n",
          )
          source = source.replace('"definition": spec.__dict__,', '"definition": asdict(spec),')
          source = source.replace(
              "outcomes = [str(event[key]) for event in events]\n",
              "outcomes = [str(event[key]) for event in events if key in event]\n",
          )
          source = source.replace(
              '[float(event[f"fixed_{multiple:.1f}r_cost_after_rr"]) for event in events]',
              '[float(event[f"fixed_{multiple:.1f}r_cost_after_rr"]) for event in events if key in event]',
          )
          path.write_text(source, encoding="utf-8")
          PY
          python -m compileall -q research/candidate-08/session_transition_probe.py
          rm -rf research/candidate-08/evidence/session-transition-holdout
          mkdir -p research/candidate-08/evidence/session-transition-holdout
          python research/candidate-08/session_transition_probe.py \
            --output research/candidate-08/evidence/session-transition-holdout \
            --data-cache /tmp/candidate-08-session-holdout-data \
            2>&1 | tee research/candidate-08/evidence/session-transition-holdout/runner.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("research/candidate-08/evidence/session-transition-holdout/workflow.json").write_text(
              json.dumps({
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "head_sha": os.environ.get("GITHUB_SHA"),
                  "diagnostic_only": True,
                  "predeclared_holdout": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm research/candidate-08/.run-session-transition-holdout
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add \
            research/candidate-08/session_transition_probe.py \
            research/candidate-08/session_holdout_config.json \
            research/candidate-08/evidence/session-transition-holdout \
            research/candidate-08/.run-session-transition-holdout
          git -C "$GITHUB_WORKSPACE" commit -m "candidate-08: record structural session holdout"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:research/candidate-08

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-08-session-transition-holdout-${{ github.sha }}
          path: research/candidate-08/evidence/session-transition-holdout
          retention-days: 30
