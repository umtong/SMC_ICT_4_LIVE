name: candidate-05-loop-results-refresh2

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-loop-results-refresh2.yml"

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-05
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python research/candidate-05/collect_loop_results.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch research/candidate-05 \
            --scratch /tmp/candidate-05-loop-artifacts \
            --report-dir research/candidate-05/loop_results
      - run: |
          set -euo pipefail
          if git diff --quiet -- research/candidate-05/loop_results; then exit 0; fi
          git config user.name candidate-05-loop-bot
          git config user.email candidate-05-loop-bot@users.noreply.github.com
          git add research/candidate-05/loop_results
          git commit -m "candidate-05: refresh completed loop evidence"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:research/candidate-05; then exit 0; fi
            git pull --rebase origin research/candidate-05
            sleep $((attempt*2))
          done
          exit 1
