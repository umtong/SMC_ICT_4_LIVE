name: candidate-10-finalize-research-v3

on:
  workflow_run:
    workflows:
      - candidate-10-v51-fast-transfer-role
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: candidate-10-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'research/candidate-10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-10
          fetch-depth: 0
      - name: Collect latest final-lineage artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts
          mkdir -p final-artifacts
          for workflow in \
            candidate-10-v49-research.yml \
            candidate-10-v50-research.yml \
            candidate-10-v51-fast.yml; do
            run_id="$(gh run list --workflow "${workflow}" \
              --branch research/candidate-10 --status completed --limit 10 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              mkdir -p "final-artifacts/${workflow%.yml}"
              gh run download "${run_id}" -D "final-artifacts/${workflow%.yml}" || true
              printf '%s\n' "${run_id}" > "final-artifacts/${workflow%.yml}/run_id.txt"
            fi
          done
      - name: Build strict final verdict
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          rows=[]
          for p in Path('final-artifacts').rglob('metrics.json'):
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              def f(v):
                  try: return float(v)
                  except Exception: return None
              trades=int(d.get('closed_trades') or 0); wins=int(d.get('wins') or 0)
              r={
                'path':str(p),'candidate':str(d.get('candidate_generation') or d.get('candidate') or 'unknown'),
                'variant':str(d.get('variant') or p.parent.name),
                'start':d.get('period_start') or d.get('evaluation_start') or d.get('week_start'),
                'end':d.get('period_end_exclusive') or d.get('evaluation_end_exclusive'),
                'evaluation_days':int(d.get('evaluation_days') or 0),
                'trades':trades,'wins':wins,'losses':int(d.get('losses') or 0),
                'win_rate':wins/trades if trades else 0.0,
                'payoff_ratio':f(d.get('impact_adjusted_payoff_ratio',d.get('payoff_ratio'))),
                'nav':f(d.get('impact_adjusted_ending_nav',d.get('final_nav'))),
                'daily_geometric_growth':f(d.get('impact_adjusted_geometric_daily_growth',d.get('daily_geometric_growth'))),
                'max_drawdown':f(d.get('impact_adjusted_intraday_max_drawdown',d.get('max_drawdown'))),
                'errors':len(d.get('errors',[]) or []),
                'global_overlap_count':int(d.get('global_overlap_count') or 0),
                'liquidation_detected':bool(d.get('liquidation_detected',False)),
                'evidence_class':d.get('evidence_class'),
              }
              r['continuous']=r['evaluation_days']>=90 or 'continuous' in str(r['evidence_class']).lower() or 'CONTINUOUS' in str(p).upper() or 'H1_2026' in str(p).upper()
              r['target_pass']=bool(r['continuous'] and r['trades']>=30 and r['win_rate']>=.90 and r['payoff_ratio'] is not None and r['payoff_ratio']>=1.2 and r['daily_geometric_growth'] is not None and r['daily_geometric_growth']>=.01 and r['max_drawdown'] is not None and r['max_drawdown']<=.20 and r['errors']==0 and r['global_overlap_count']==0 and not r['liquidation_detected'])
              rows.append(r)
          rows.sort(key=lambda r:(r['candidate'],str(r['start']),r['variant'],r['path']))
          cont=[r for r in rows if r['continuous']]; passing=[r for r in cont if r['target_pass']]
          def key(r): return (r['target_pass'],r['daily_geometric_growth'] if r['daily_geometric_growth'] is not None else -999,r['win_rate'],r['trades'],-(r['max_drawdown'] if r['max_drawdown'] is not None else 999))
          best=max(cont,key=key,default=None); verdict='TARGET_ACHIEVED' if passing else 'TARGET_NOT_ACHIEVED'
          payload={'schema':'candidate-10-final-research-verdict-v3','generated_at_utc':datetime.now(timezone.utc).isoformat(),'branch':'research/candidate-10','verdict':verdict,'success_claim':bool(passing),'decision_contract':{'continuous_days_min':90,'closed_trades_min':30,'win_rate_min':.90,'payoff_ratio_min':1.2,'daily_geometric_growth_min':.01,'max_drawdown_max':.20,'errors_required':0,'global_overlap_required':0,'liquidation_required':False},'best_continuous_row':best,'target_passing_rows':passing,'rows':rows}
          Path('research/candidate-10/final_research_metrics.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          def pct(v): return 'n/a' if v is None else f'{100*v:.4f}%'
          def num(v): return 'n/a' if v is None else f'{v:.6f}'
          lines=['# Candidate 10 — Final autonomous research verdict','',f'Verdict: **{verdict}**','',
          'Generated from the latest completed v49, v50 and parallel v51 artifacts under one predeclared contract.','',
          '## Success contract','',
          '- at least 90 continuous days and 30 closed trades;','- cost-after win rate >= 90%;','- cost-after payoff ratio >= 1.20;','- cost-after geometric daily growth >= 1%;','- maximum drawdown <= 20%;','- zero implementation errors, liquidations and global-slot overlaps.','']
          if best:
              lines += ['## Best completed continuous result','',f"- candidate: `{best['candidate']}`",f"- variant: `{best['variant']}`",f"- period: `{best['start']}` to `{best['end']}`",f"- trades: {best['trades']} ({best['wins']} wins / {best['losses']} losses)",f"- win rate: {pct(best['win_rate'])}",f"- payoff ratio: {num(best['payoff_ratio'])}",f"- cost-after NAV: {num(best['nav'])}",f"- geometric daily growth: {pct(best['daily_geometric_growth'])}",f"- maximum drawdown: {pct(best['max_drawdown'])}",f"- implementation errors: {best['errors']}",f"- target pass: {best['target_pass']}",'']
          else: lines += ['## Continuous evidence','','No completed continuous artifact was available.','']
          lines += ['## Continuous variants','', '| Candidate | Variant | Days | Trades | W/L | Win rate | Payoff | Daily geom | NAV | Max DD | Pass |','|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|']
          for r in cont: lines.append(f"| {r['candidate']} | {r['variant']} | {r['evaluation_days']} | {r['trades']} | {r['wins']}/{r['losses']} | {pct(r['win_rate'])} | {num(r['payoff_ratio'])} | {pct(r['daily_geometric_growth'])} | {num(r['nav'])} | {pct(r['max_drawdown'])} | {r['target_pass']} |")
          lines += ['','## Final conclusion','']
          lines += ['Only a passing frozen continuous row is approved as the completed candidate.'] if passing else ['No frozen continuous variant satisfies the project target. Controlled wins, sparse perfect records, zero-trade preservation and loss reduction are not promoted as success.','The source-equilibrium, independent-external-draw and transfer-role lineages are not approved for live trading.']
          lines += ['','Machine-readable evidence: `final_research_metrics.json`.','']
          Path('research/candidate-10/FINAL_RESEARCH_RESULT.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit final verdict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-10/FINAL_RESEARCH_RESULT.md research/candidate-10/final_research_metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-10: finalize parallel v49-v51 verdict"
          git push origin HEAD:research/candidate-10
