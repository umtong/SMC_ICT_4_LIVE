name: candidate-57-jump-side-policy-fresh-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-jump-side-policy-fresh-v1.yml"
      - "research/candidate-57/JUMP_SIDE_POLICY_FRESH_V1_FREEZE.md"
      - "research/candidate-57/jump_side_policy_fresh_v1.py"
      - "research/candidate-57/jump_state_arbitration_router.py"
      - "research/candidate-57/jump_state_arbitration_forensic_strategy.py"
      - "research/candidate-57/jump_taker_alignment_fresh_campaign.py"
      - "research/candidate-57/download_binance_metrics_sidecar.py"
      - "research/candidate-57/jump_episode_forensic_strategy.py"
      - "research/candidate-57/jump_episode_forensic_analyze.py"
      - "research/candidate-57/forensic_sources/jump_transient_v3/**"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-jump-side-policy-fresh-v1
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble source jump and frozen side-policy router
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/JUMP_SIDE_POLICY_FRESH_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/router_jump_transient.py research/candidate-51/router_jump_base.py
          cp research/candidate-57/jump_state_arbitration_router.py research/candidate-51/router.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/strategy_jump_transient.py research/candidate-51/strategy_jump_transient.py
          cp research/candidate-57/jump_episode_forensic_strategy.py research/candidate-51/strategy_jump_audit_base.py
          cp research/candidate-57/jump_state_arbitration_forensic_strategy.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_audit_base.py \
            research/candidate-57/jump_side_policy_fresh_v1.py

      - name: Install locked environment and prove frozen factor contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          import os
          import router

          for mode in ("both", "short_only", "long_only"):
              os.environ["C57_JUMP_SIDE_MODE"] = mode
              assert router.side_mode() == mode
          try:
              os.environ["C57_JUMP_SIDE_MODE"] = "best_side_after_result"
              router.side_mode()
          except ValueError:
              pass
          else:
              raise AssertionError("unfrozen side mode accepted")

          os.environ["C57_JUMP_ARBITRATION_MODE"] = "taker_conditional"
          assert router.arbitration_mode() == "taker_conditional"
          conditional = inspect.getsource(router._effective_arbitration)
          assert "aligned_peers >= 3" in conditional
          assert 'return "source_max_z"' in conditional
          assert 'return "least_qualifying_z"' in conditional
          route_source = inspect.getsource(router.route_universe)
          assert "JUMP_SIDE_REJECTED" in route_source
          assert "_side_allowed" in route_source
          print("causal side and peer-taker routing contracts verified")
          PY

      - name: Run four frozen cells on untouched July interval
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-jump-side-policy-fresh-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51 \
            uv run python research/candidate-57/jump_side_policy_fresh_v1.py \
            2>&1 | tee .work/candidate-57-jump-side-policy-fresh-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact fresh evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            research/candidate-51/launch.py \
            research/candidate-51/router.py \
            research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_audit_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/jump-side-policy-fresh-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate57: persist fresh jump side-policy evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete factor-map artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-jump-side-policy-fresh-v1
          path: |
            research/candidate-57/evidence/jump-side-policy-fresh-v1
            .work/candidate-57-jump-side-policy-fresh-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and end-flat validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "fresh side-policy campaign failed; status=$status"
            exit "${status:-1}"
          fi
