name: Astra displayed liquidity context
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths: [.github/workflows/astra-depth-context.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read public displayed-depth archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,urllib.request,calendar,zipfile,io,json,time
          root=Path('depth_context');root.mkdir()
          jobs=[]
          for month in ['2024-03','2024-08','2025-02','2025-08']:
              y,m=map(int,month.split('-'))
              for day in range(1,calendar.monthrange(y,m)[1]+1):
                  date=f'{y:04d}-{m:02d}-{day:02d}'
                  for symbol in ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT']:
                      name=f'{symbol}-bookDepth-{date}.zip'
                      jobs.append((f'https://data.binance.vision/data/futures/um/daily/bookDepth/{symbol}/{name}',root/symbol/name))
          def get(job):
              url,path=job;path.parent.mkdir(exist_ok=True)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=45) as r: data=r.read()
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          first=z.read(z.namelist()[0]).splitlines()[:5]
                      path.write_bytes(data)
                      return {'file':str(path),'bytes':len(data),'sample':[x.decode() for x in first] if '-01.zip' in str(path) else []}
                  except Exception as e:
                      if attempt==2:return {'file':str(path),'error':str(e)}
                      time.sleep(attempt+1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: result=list(ex.map(get,jobs))
          (root/'observed_files.json').write_text(json.dumps(result,indent=2))
          print(json.dumps([r for r in result if r.get('sample') or 'error' in r],indent=2))
          print('downloaded',sum('error' not in r for r in result),'of',len(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-displayed-depth
          path: depth_context/
          retention-days: 7
