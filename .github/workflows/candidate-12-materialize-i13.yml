name: candidate-12-materialize-i13

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i13.patch"
      - ".github/workflows/candidate-12-materialize-i13.yml"

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i13
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I13 source and regression gate atomically
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor

          python - <<'PY'
          from pathlib import Path
          import json

          logic_path = Path("research/candidate-12/logic.py")
          logic = logic_path.read_text(encoding="utf-8")
          plan_anchor = (
              "            prior_peak = state.acceptance_peak or source.high\n"
              "            plan = self._costed_plan(\n"
          )
          assert logic.count(plan_anchor) == 1, logic.count(plan_anchor)
          market_block = '''            prior_peak = state.acceptance_peak or source.high

            # Fresh reacceleration is already a completed confirmation event.
            # Enter at that close when the close itself still preserves the
            # configured costed structural R. Otherwise retain the protected
            # one-bar FVG limit. Both branches use the existing min_net_r.
            market_plan = self._costed_plan(
                scenario_id=sid,
                scenario=(
                    ScenarioKind.ASIA_HIGH_ACCEPTANCE
                    if source.label is SessionLabel.ASIA
                    else ScenarioKind.LONDON_HIGH_ACCEPTANCE
                ),
                direction=Direction.LONG,
                entry_order=EntryOrder.MARKET,
                observed_ts_ns=bar.ts_ns,
                bar=bar,
                atr=atr,
                entry_raw=bar.close,
                stop_raw=fresh.lower - self.config.fvg_stop_buffer_atr * atr,
                target_raw=prior_peak,
                expire_ts_ns=None,
                details={
                    "source": source.label.value,
                    "route": "FVG_BREACH_HELD_BOUNDARY_THEN_FRESH_REACCELERATION_MARKET",
                    "session_high": source.high,
                    "session_low": source.low,
                    "session_width": source.width,
                    "fvg_lower": fresh.lower,
                    "fvg_upper": fresh.upper,
                    "fvg_formed_ts_ns": fresh.formed_ts_ns,
                    "initial_pullback_low": state.acceptance_pullback_low,
                    "prior_acceptance_peak": prior_peak,
                    "decision_close": bar.close,
                    "execution_semantics": (
                        "COMPLETED_FRESH_REACCELERATION_CLOSE_RETAINED_COSTED_R"
                    ),
                    "target_semantics": "PRIOR_ACCEPTANCE_EXPANSION_HIGH",
                },
            )
            if market_plan is not None:
                state.high_plan_emitted = True
                state.trade_plan_emitted = True
                return self._emit_plan(market_plan, allow_entry)

            plan = self._costed_plan(
'''
          logic = logic.replace(plan_anchor, market_block, 1)
          detail_anchor = '''                    "initial_pullback_low": state.acceptance_pullback_low,
                    "prior_acceptance_peak": prior_peak,
                    "target_semantics": "PRIOR_ACCEPTANCE_EXPANSION_HIGH",
'''
          assert logic.count(detail_anchor) == 1, logic.count(detail_anchor)
          detail_replacement = '''                    "initial_pullback_low": state.acceptance_pullback_low,
                    "prior_acceptance_peak": prior_peak,
                    "decision_close": bar.close,
                    "execution_semantics": (
                        "MARKET_CLOSE_FAILED_COSTED_R_THEN_ONE_BAR_PROTECTED_LIMIT"
                    ),
                    "target_semantics": "PRIOR_ACCEPTANCE_EXPANSION_HIGH",
'''
          logic = logic.replace(detail_anchor, detail_replacement, 1)
          logic = logic.replace(
              '"""Causal completed-session auction router for Candidate 12 I12.',
              '"""Causal completed-session auction router for Candidate 12 I13.',
              1,
          )
          logic_path.write_text(logic, encoding="utf-8")

          tests_path = Path("research/candidate-12/test_logic.py")
          tests = tests_path.read_text(encoding="utf-8")
          start_marker = (
              "    def test_fvg_lower_edge_breach_waits_for_fresh_reacceleration_limit"
              "(self) -> None:\n"
          )
          end_marker = "    def test_opposite_boundaries_have_independent_causal_lifecycles"
          assert tests.count(start_marker) == 1, tests.count(start_marker)
          start = tests.index(start_marker)
          end = tests.index(end_marker, start)
          limit_test = tests[start:end]
          limit_test = limit_test.replace(
              start_marker,
              "    def test_fresh_reacceleration_falls_back_to_limit_when_market_r_is_insufficient(\n"
              "        self,\n"
              "    ) -> None:\n",
              1,
          )
          old_engine = '        engine = CausalLiquidityAuctionEngine(config(), "X")\n'
          assert limit_test.count(old_engine) == 1, limit_test.count(old_engine)
          limit_test = limit_test.replace(
              old_engine,
              '        engine = CausalLiquidityAuctionEngine(config(min_net_r=3.0), "X")\n',
              1,
          )
          market_test = '''    def test_fresh_reacceleration_uses_market_when_close_retains_costed_r(
        self,
    ) -> None:
        y, m, d = self.DAY
        engine = CausalLiquidityAuctionEngine(config(min_net_r=1.0), "X")
        self.seed_asia(engine)
        engine._on_five(bar(ts(y, m, d, 6, 5), 103, 104, 102, 103), True)
        engine._on_five(bar(ts(y, m, d, 6, 10), 103, 112, 103, 110), True)
        engine._on_five(bar(ts(y, m, d, 6, 15), 110, 115, 105.5, 110), True)
        self.assertIsNone(
            engine._on_five(bar(ts(y, m, d, 6, 20), 108, 108.2, 103.5, 105.2), True)
        )
        engine._on_five(bar(ts(y, m, d, 6, 25), 105.2, 106, 104.8, 105.5), True)
        engine._on_five(bar(ts(y, m, d, 6, 30), 105.5, 109, 105.4, 108.5), True)
        plan = engine._on_five(
            bar(ts(y, m, d, 6, 35), 108.5, 110, 106.5, 109),
            True,
        )
        self.assertIsNotNone(plan)
        assert plan is not None
        self.assertEqual(plan.entry_order, EntryOrder.MARKET)
        self.assertEqual(
            plan.details["route"],
            "FVG_BREACH_HELD_BOUNDARY_THEN_FRESH_REACCELERATION_MARKET",
        )
        self.assertAlmostEqual(plan.expected_entry, 109.0)
        self.assertAlmostEqual(plan.target_price, 115.0)
        self.assertGreaterEqual(plan.net_r, 1.0)

'''
          tests = tests[:start] + limit_test + market_test + tests[end:]
          tests_path.write_text(tests, encoding="utf-8")

          config_path = Path("research/candidate-12/config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          assert config["schema_version"] == 12, config["schema_version"]
          assert config["candidate"] == "candidate-12-confirmed-extension-session-auction-router"
          config["schema_version"] = 13
          config["candidate"] = "candidate-12-state-priced-reacceleration-router"
          config["selection"]["selection_rule"] = (
              "W1-W11 are exposed design, implementation, and diagnosis evidence. I13 repairs "
              "the W2 high-acceptance execution miss without opening new data or adding a fitted "
              "parameter. After an initial bullish FVG is breached while the completed session "
              "high remains accepted, a fresh bullish FVG is a completed reacceleration "
              "confirmation. The engine enters at the completed close only when that close still "
              "passes the existing costed min_net_r gate to the frozen prior acceptance peak; "
              "otherwise it preserves the one-bar protected FVG limit. Sell-side failed-pullback "
              "routes do not receive a market fallback because their edge is the pullback price "
              "itself. I13 must convert the exposed W2 high-acceptance setup into a Nautilus market "
              "trade, preserve the W5 protected-limit winner, and re-pass all prior causal, cost, "
              "risk, slot, event-log, and liquidation invariants before any untouched week is opened."
          )
          config["selection"]["implementation_week"] = "W2"
          config["selection"]["diagnosis_week"] = "W2"
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

          cat > .github/workflows/candidate-12-research.yml <<'RESEARCH_YAML'
          name: candidate-12-i13-state-priced-reacceleration-regression

          on:
            push:
              branches: ["research/candidate-12"]
              paths:
                - "research/candidate-12/**"
                - ".github/workflows/candidate-12-research.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: candidate-12-i13-authoritative
            cancel-in-progress: false

          jobs:
            authoritative-regression:
              runs-on: ubuntu-24.04
              timeout-minutes: 60
              container:
                image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
                options: --user root
              steps:
                - name: Checkout I13 candidate
                  uses: actions/checkout@v4

                - name: Verify prebuilt environment
                  run: smc4 doctor

                - name: Verify frozen I13 identity
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    from pathlib import Path
                    import json
                    config = json.loads(Path("research/candidate-12/config.json").read_text())
                    assert config["schema_version"] == 13, config
                    assert config["candidate"] == "candidate-12-state-priced-reacceleration-router", config
                    assert config["selection"]["implementation_week"] == "W2", config
                    assert not Path("research/candidate-12/update-i13.patch").exists()
                    PY

                - name: Compile and run 27 causal tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    python -m compileall -q research/candidate-12
                    python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v

                - name: Run W1 design gate through NautilusTrader
                  shell: bash
                  run: |
                    set -euo pipefail
                    OUTPUT=artifacts/candidate-12/BTCUSDT-W1
                    mkdir -p "$OUTPUT"
                    python research/candidate-12/run.py --symbol BTCUSDT --week W1 --output "$OUTPUT" | tee "$OUTPUT.console.json"
                    python - <<'PY'
                    from pathlib import Path
                    import json
                    m = json.loads(Path("artifacts/candidate-12/BTCUSDT-W1/metrics.json").read_text())
                    assert m["closed_trades"] == 6, m
                    assert m["wins"] == 6 and m["losses"] == 0, m
                    assert m["project_target_gate_passed"] is True, m
                    assert m["risk_budget_passed"] and m["global_slot_passed"], m
                    assert m["event_log_valid"] and not m["engine_errors"], m
                    assert not m["liquidation_detected"], m
                    PY

                - name: Run W2 execution gate through NautilusTrader
                  shell: bash
                  run: |
                    set -euo pipefail
                    OUTPUT=artifacts/candidate-12/BTCUSDT-W2
                    mkdir -p "$OUTPUT"
                    python research/candidate-12/run.py --symbol BTCUSDT --week W2 --output "$OUTPUT" | tee "$OUTPUT.console.json"
                    python - <<'PY'
                    from decimal import Decimal
                    from pathlib import Path
                    import json
                    root = Path("artifacts/candidate-12/BTCUSDT-W2")
                    m = json.loads((root / "metrics.json").read_text())
                    plans = json.loads((root / "submitted_plans.json").read_text())["plans"]
                    market = [
                        p for p in plans
                        if p["details"].get("route")
                        == "FVG_BREACH_HELD_BOUNDARY_THEN_FRESH_REACCELERATION_MARKET"
                    ]
                    assert len(market) == 1, plans
                    p = market[0]
                    assert p["scenario"] == "LONDON_HIGH_ACCEPTANCE", p
                    assert p["entry_order_type"] == "MARKET", p
                    assert p["observed_ts_ns"] == 1695663900000000000, p
                    assert p["net_r"] >= 0.65, p
                    assert m["closed_trades"] >= 1, m
                    assert m["wins"] == m["closed_trades"] and m["losses"] == 0, m
                    assert Decimal(str(m["final_nav"])) > Decimal(str(m["starting_nav"])), m
                    assert m["risk_budget_passed"] and m["global_slot_passed"], m
                    assert m["event_log_valid"] and not m["engine_errors"], m
                    assert not m["liquidation_detected"], m
                    PY

                - name: Run W5 protected-limit regression through NautilusTrader
                  shell: bash
                  run: |
                    set -euo pipefail
                    OUTPUT=artifacts/candidate-12/BTCUSDT-W5
                    mkdir -p "$OUTPUT"
                    python research/candidate-12/run.py --symbol BTCUSDT --week W5 --output "$OUTPUT" | tee "$OUTPUT.console.json"
                    python - <<'PY'
                    from pathlib import Path
                    import json
                    root = Path("artifacts/candidate-12/BTCUSDT-W5")
                    m = json.loads((root / "metrics.json").read_text())
                    plans = json.loads((root / "submitted_plans.json").read_text())["plans"]
                    target = [p for p in plans if p["observed_ts_ns"] == 1716222600000000000]
                    assert len(target) == 1, plans
                    p = target[0]
                    assert p["details"].get("route") == "FVG_BREACH_HELD_BOUNDARY_THEN_FRESH_REACCELERATION_LIMIT", p
                    assert p["entry_order_type"] == "LIMIT_GTD_PROTECTED", p
                    assert m["closed_trades"] == 5, m
                    assert m["wins"] == 5 and m["losses"] == 0, m
                    assert m["project_target_gate_passed"] is True, m
                    assert m["risk_budget_passed"] and m["global_slot_passed"], m
                    assert m["event_log_valid"] and not m["engine_errors"], m
                    assert not m["liquidation_detected"], m
                    PY

                - name: Run remaining exposed regression weeks
                  shell: bash
                  run: |
                    set -euo pipefail
                    for WEEK in W6 W10 W11; do
                      OUTPUT="artifacts/candidate-12/BTCUSDT-${WEEK}"
                      mkdir -p "$OUTPUT"
                      python research/candidate-12/run.py --symbol BTCUSDT --week "$WEEK" --output "$OUTPUT" | tee "$OUTPUT.console.json"
                    done

                - name: Enforce remaining NAV and causal invariants
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    from decimal import Decimal
                    from pathlib import Path
                    import json
                    root = Path("artifacts/candidate-12")
                    expected = {"W6": 5, "W10": 1, "W11": 0}
                    summary = {}
                    for week, trades in expected.items():
                        m = json.loads((root / f"BTCUSDT-{week}" / "metrics.json").read_text())
                        assert m["candidate"] == "candidate-12-state-priced-reacceleration-router", (week, m)
                        assert m["closed_trades"] == trades, (week, m)
                        assert m["losses"] == 0, (week, m)
                        if trades:
                            assert m["wins"] == trades, (week, m)
                            assert Decimal(str(m["final_nav"])) > Decimal(str(m["starting_nav"])), m
                        else:
                            assert Decimal(str(m["final_nav"])) == Decimal(str(m["starting_nav"])), m
                        assert m["risk_budget_passed"] and m["global_slot_passed"], m
                        assert m["event_log_valid"] and not m["engine_errors"], m
                        assert not m["liquidation_detected"], m
                        summary[week] = {
                            "closed_trades": m["closed_trades"],
                            "wins": m["wins"],
                            "losses": m["losses"],
                            "final_nav": m["final_nav"],
                            "daily_geometric_growth": m["daily_geometric_growth"],
                            "scenario_plan_counts": m.get("scenario_plan_counts", {}),
                        }
                    (root / "I13-authoritative-regression.json").write_text(
                        json.dumps(summary, indent=2, sort_keys=True) + "\n"
                    )
                    print(json.dumps(summary, indent=2, sort_keys=True))
                    PY

                - name: Surface I13 evidence
                  if: always()
                  shell: bash
                  run: |
                    for WEEK in W1 W2 W5 W6 W10 W11; do
                      FILE="artifacts/candidate-12/BTCUSDT-${WEEK}/metrics.json"
                      if [[ -f "$FILE" ]]; then
                        echo "=== I13_${WEEK}_METRICS_BEGIN ==="
                        cat "$FILE"
                        echo "=== I13_${WEEK}_METRICS_END ==="
                      fi
                    done

                - name: Preserve reproducible I13 evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: candidate-12-I13-authoritative
                    path: artifacts/candidate-12
                    if-no-files-found: warn
          RESEARCH_YAML

          git rm research/candidate-12/update-i13.patch .github/workflows/candidate-12-materialize-i13.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-12/logic.py research/candidate-12/test_logic.py research/candidate-12/config.json .github/workflows/candidate-12-research.yml
          git commit -m "candidate-12: install I13 state-priced reacceleration routing"
          git push origin HEAD:research/candidate-12
