name: candidate-12-materialize-i13

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/materialize_i13.py"
      - ".github/workflows/candidate-12-materialize-i13.yml"

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i13
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I13 strategy source only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python research/candidate-12/materialize_i13.py
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v
          git checkout -- .github/workflows/candidate-12-research.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/candidate-12/logic.py \
            research/candidate-12/test_logic.py \
            research/candidate-12/config.json
          git commit -m "candidate-12: install I13 state-priced reacceleration routing"
          git push origin HEAD:research/candidate-12
