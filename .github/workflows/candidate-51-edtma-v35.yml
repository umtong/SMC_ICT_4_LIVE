name: candidate-51-edtma-v35

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-edtma-v35.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-51-edtma-v35
  cancel-in-progress: true

jobs:
  interval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - interval: spring_2025_03
            data_start: 2025-02-01
            start: 2025-03-01
            end: 2025-03-14
          - interval: autumn_2025_09
            data_start: 2025-08-01
            start: 2025-09-01
            end: 2025-09-14
          - interval: winter_2026_01
            data_start: 2025-12-01
            start: 2026-01-01
            end: 2026-01-14
          - interval: summer_2026_06
            data_start: 2026-05-01
            start: 2026-06-01
            end: 2026-06-14
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Materialize and verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_edtma.py research/candidate-51/router.py
          cp research/candidate-51/strategy_edtma.py research/candidate-51/strategy.py
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from router import BarObservation, FeatureObservation, RouteConfig, classify_symbol
          from strategy import Candidate35Config

          fields = set(Candidate35Config.__struct_fields__)
          assert {
              "edtma_episode_mode", "edtma_exit_mode", "edtma_stop_mode",
              "edtma_long_ema_period", "edtma_short_ema_period",
          } <= fields

          def bars(direction: int):
              result = []
              for hour in range(300):
                  # Curvature avoids a degenerate TEMA == DEMA final point while
                  # remaining a clean causal trend path.
                  level = 100.0 * ((1.0025 if direction > 0 else 0.9975) ** hour)
                  for minute in range(60):
                      drift = direction * level * 0.00002 * minute
                      close = level + drift
                      open_ = close - direction * level * 0.00001
                      high = max(open_, close) + level * 0.0001
                      low = min(open_, close) - level * 0.0001
                      volume = 1000.0 + hour * 5.0 + minute * 0.02
                      ts = (hour * 60 + minute + 1) * 60_000_000_000 - 1
                      result.append(BarObservation(ts, open_, high, low, close, volume))
              return result

          config = RouteConfig(edtma_episode_mode="condition_reentry")
          rising = bars(1)
          falling = bars(-1)
          long = classify_symbol(
              "BTCUSDT", rising,
              FeatureObservation(rising[-1].ts_event, ready=True), config,
          )
          short = classify_symbol(
              "BTCUSDT", falling,
              FeatureObservation(falling[-1].ts_event, ready=True), config,
          )
          assert long.actionable and long.side == 1, long
          assert short.actionable and short.side == -1, short
          assert long.stop_reference < long.entry_reference < long.objective_reference
          assert short.objective_reference < short.entry_reference < short.stop_reference
          print("EDTMA reachability and geometry verified")
          PY
          python research/candidate-51/edtma_v35_prepare.py \
            --output .work/candidate-51-edtma-v35

      - name: Run every mechanism on this separated account
        shell: bash
        run: |
          set +e
          work=.work/candidate-51-edtma-v35
          root=artifacts/candidate-51/edtma-v35/${{ matrix.interval }}
          mkdir -p "$root" "$work/status"
          while IFS= read -r variant; do
            [[ -z "$variant" ]] && continue
            PYTHONPATH=research/candidate-51 uv run python \
              research/candidate-51/launch_kline_only_warmup.py \
              --config "$work/$variant.json" \
              --data-start "${{ matrix.data_start }}" \
              --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
              --cache ".cache/candidate-51-edtma-v35/${{ matrix.interval }}" \
              --output "$root/$variant" \
              --workspace "$work/ws-${{ matrix.interval }}-$variant"
            echo $? > "$work/status/${{ matrix.interval }}-$variant.txt"
          done < "$work/variants.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-edtma-v35-${{ matrix.interval }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/edtma-v35/${{ matrix.interval }}/**/metrics.json
            artifacts/candidate-51/edtma-v35/${{ matrix.interval }}/**/strategy_diagnostics.json
            artifacts/candidate-51/edtma-v35/${{ matrix.interval }}/**/closed_scenarios.json
            artifacts/candidate-51/edtma-v35/${{ matrix.interval }}/**/equity.csv
            .work/candidate-51-edtma-v35/status/*.txt

  aggregate:
    if: always()
    needs: interval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-51-edtma-v35-*
          path: downloaded
          merge-multiple: true
      - name: Normalize and audit mechanism anatomy
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/candidate-51/edtma-v35
          mkdir -p "$root"
          find downloaded -type f | while read -r file; do
            case "$file" in
              *artifacts/candidate-51/edtma-v35/*)
                relative="${file#*artifacts/candidate-51/edtma-v35/}"
                mkdir -p "$root/$(dirname "$relative")"
                cp "$file" "$root/$relative"
                ;;
            esac
          done
          python research/candidate-51/edtma_v35_prepare.py --output .work/candidate-51-edtma-v35
          cp .work/candidate-51-edtma-v35/MANIFEST.json "$root/MANIFEST.json"
          python research/candidate-51/edtma_anatomy_audit.py \
            --root "$root" --manifest "$root/MANIFEST.json" \
            --output-json "$root/ANATOMY.json" --output-md "$root/ANATOMY.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-edtma-v35-anatomy
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/edtma-v35/ANATOMY.json
            artifacts/candidate-51/edtma-v35/ANATOMY.md
            artifacts/candidate-51/edtma-v35/MANIFEST.json
      - name: Commit compact anatomy evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/edtma-v35
          destination=research/candidate-51/evidence/edtma-v35
          test -s "$source/ANATOMY.json"
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/MANIFEST.json" "$destination/MANIFEST.json"
          git config user.name "candidate-51-research-bot"
          git config user.email "candidate-51-research-bot@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate51: record EDTMA mechanism anatomy"
          git pull --rebase origin research/candidate-51
          git push origin HEAD:research/candidate-51
