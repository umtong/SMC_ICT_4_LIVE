name: candidate-08-session-value-migration-source-fix

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-session-value-migration-source-fix"

permissions:
  contents: write

jobs:
  exact-causal-flow-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the retest immediately after the second accepted M15 close
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/session_value_migration_signals_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '''                diagnostics["SECOND_M15_CLOSE_AND_SESSION_VWAP_MIGRATED"] += 1
                continue

            direction = attempt.direction
'''
          new = '''                diagnostics["SECOND_M15_CLOSE_AND_SESSION_VWAP_MIGRATED"] += 1

            direction = attempt.direction
'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected one causal-flow replacement, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm -f research/candidate-08/.run-session-value-migration-source-fix
          rm -f .github/workflows/candidate-08-session-value-migration-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            research/candidate-08/session_value_migration_signals_v1.py \
            research/candidate-08/.run-session-value-migration-source-fix \
            .github/workflows/candidate-08-session-value-migration-source-fix.yml
          git commit -m "candidate-08: make value retest scan immediately causal [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
