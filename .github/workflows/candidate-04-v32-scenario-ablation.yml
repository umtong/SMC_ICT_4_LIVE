name: candidate-04-v32-scenario-ablation

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v32-scenario-ablation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: without_continuation
            remove: INFORMED_FLOW_REGIME_PULLBACK_RESUMPTION
          - name: without_reversal
            remove: EXTERNAL_LIQUIDITY_ABSORBED_FLOW_REVERSAL
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_BUILD_START: "2023-08-02"
      C04_BUILD_END: "2023-08-10"
      C04_EVALUATION_START: "2023-08-04"
      C04_EVALUATION_END: "2023-08-10"
      ABLATION_NAME: ${{ matrix.name }}
      REMOVE_SCENARIO: ${{ matrix.remove }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact failed V32 evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v32-week1-206947b501df60dd3058cf54715f04050ba1a6c1
          path: artifacts/candidate-04-v32-ablation/${{ matrix.name }}/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31116650293
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove exactly one scenario
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          root="artifacts/candidate-04-v32-ablation/$ABLATION_NAME"
          python research/candidate-04/ablate_compiled_scenario.py \
            --input-signals "$root/source/signals/signals.json" \
            --input-summary "$root/source/signals/summary.json" \
            --remove "$REMOVE_SCENARIO" \
            --candidate "candidate-04-v32-$ABLATION_NAME" \
            --output "$root/signals" \
            | tee "$root/ablation_console.json"
          test -s "$root/signals/signals.json"
          test -s "$root/signals/summary.json"

      - name: Replay unchanged retained intents through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v32-ablation/$ABLATION_NAME"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v32-ablation/$ABLATION_NAME/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk and summarize controlled ablation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v32-ablation") / os.environ["ABLATION_NAME"]
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [e for e in events if e.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit("entry-position mismatch")
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV contract")
          original = json.loads((root / "source/summary.json").read_text())
          summary = {
              "candidate": "candidate-04-v32-order-flow-impact-regime",
              "ablation": os.environ["ABLATION_NAME"],
              "removed_scenario": os.environ["REMOVE_SCENARIO"],
              "changed_variables": 1,
              "engine": metrics.get("engine"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "max_drawdown": metrics.get("max_drawdown"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
              "original": {
                  "trades": original.get("trades"),
                  "wins": original.get("wins"),
                  "total_return": original.get("total_return"),
                  "geometric_daily_growth": original.get("geometric_daily_growth"),
              },
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v32-ablation-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-04-v32-ablation/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90
