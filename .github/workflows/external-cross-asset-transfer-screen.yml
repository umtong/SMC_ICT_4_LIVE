name: external-cross-asset-transfer-screen

on:
  push:
    branches: ["research/external-leverage-flow-router"]
    paths:
      - "research/external-leverage-flow-router/cross_asset_transfer_screen.py"
      - ".github/workflows/external-cross-asset-transfer-screen.yml"
  workflow_dispatch:

concurrency:
  group: external-cross-asset-transfer-screen
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  fixed-event-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/external-leverage-flow-router:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/external-cross-asset-transfer-screen
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and fixed screen
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile research/external-leverage-flow-router/cross_asset_transfer_screen.py
          python - <<'PY'
          import cross_asset_transfer_screen as screen
          assert screen.SYMBOLS == ('BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT')
          assert screen.HORIZONS == (1, 3, 5, 15, 30, 60)
          assert screen.ROUND_TRIP_HURDLE_BPS == 20.0
          assert screen.PARENT_COOLDOWN_MINUTES == 60
          print('fixed cross-asset screen contract verified')
          PY

      - name: Run predeclared 2023 three-month development screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/external-leverage-flow-router/cross_asset_transfer_screen.py \
            --start 2023-06-01 \
            --end 2023-08-31 \
            --cache .cache/external-cross-asset-transfer \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify causal evidence
        if: always()
        shell: bash
        run: |
          if test -e "$ROOT/cross_asset_screen.json"; then
            python -m json.tool "$ROOT/cross_asset_screen.json" >/dev/null
            python -m json.tool "$ROOT/raw_evidence.json" >/dev/null
            test -e "$ROOT/cross_asset_events.csv"
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/external-cross-asset-transfer-screen/cross_asset_screen.json').read_text())
          assert report['development_period'] == ['2023-06-01', '2023-08-31']
          assert report['entry_timing'] == 'strictly later next-minute open'
          assert report['round_trip_hurdle_bps'] == 20.0
          assert report['independent_btc_parent_events'] > 0
          print(json.dumps({
              'independent_btc_parent_events': report['independent_btc_parent_events'],
              'promising_fixed_cells': report['promising_fixed_cells'],
          }, indent=2))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-cross-asset-transfer-screen-${{ github.sha }}
          path: artifacts/external-cross-asset-transfer-screen/**
          if-no-files-found: warn
          retention-days: 90
