name: candidate-02-v33-first-week-aggtrades

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-agg/**"
      - ".github/workflows/candidate-02-agg-first.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect locked v33 first BTC aggTrade week only
        run: python .candidate-02-agg/collect_first_week.py
      - name: Upload immutable first-week aggTrades and manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v33-first-week-${{ github.sha }}
          path: |
            .cache/candidate-02/v33-first-week-aggtrades
            artifacts/candidate-02-v33-first-week/manifest.json
          retention-days: 30
