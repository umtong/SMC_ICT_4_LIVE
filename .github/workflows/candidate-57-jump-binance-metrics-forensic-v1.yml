name: candidate-57-jump-binance-metrics-forensic-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-jump-binance-metrics-forensic-v1.yml"
      - "research/candidate-57/jump_binance_metrics_forensic.py"
      - "research/candidate-57/evidence/jump-all-candidate-forensic-v1/episode_rows.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-jump-binance-metrics-forensic-v1
  cancel-in-progress: true

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked environment and verify causal source contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          python -m compileall -q research/candidate-57/jump_binance_metrics_forensic.py
          python - <<'PY'
          from pathlib import Path
          text = Path("research/candidate-57/jump_binance_metrics_forensic.py").read_text()
          assert "nearest_at_or_before" in text
          assert "post_outcome_only" in text
          assert "data.binance.vision/data/futures/um/daily/metrics" in text
          print("Binance metrics causal/as-of contract verified")
          PY

      - name: Download public metrics and attach them to audited boundaries
        id: forensic
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-jump-binance-metrics-forensic-v1
          set -o pipefail
          uv run python research/candidate-57/jump_binance_metrics_forensic.py \
            2>&1 | tee .work/candidate-57-jump-binance-metrics-forensic-v1/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact external-state evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/jump-binance-metrics-forensic-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist Binance metrics jump-state forensic"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload external-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-jump-binance-metrics-forensic-v1-evidence
          path: |
            research/candidate-57/evidence/jump-binance-metrics-forensic-v1
            .work/candidate-57-jump-binance-metrics-forensic-v1
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce data-forensic process integrity
        if: always()
        shell: bash
        run: |
          status="${{ steps.forensic.outputs.status }}"
          if [[ -z "$status" ]]; then
            echo "forensic status missing"
            exit 1
          fi
          if [[ "$status" != "0" ]]; then
            echo "metrics forensic failed with status $status; evidence/log retained"
            exit "$status"
          fi
