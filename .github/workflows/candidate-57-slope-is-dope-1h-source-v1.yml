name: candidate-57-slope-is-dope-1h-source-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-slope-is-dope-1h-source-v1.yml"
      - "research/candidate-57/SLOPE_IS_DOPE_1H_SOURCE_V1_FREEZE.md"
      - "research/candidate-57/router_slope_is_dope_1h.py"
      - "research/candidate-57/router_slope_is_dope_runtime.py"
      - "research/candidate-57/strategy_slope_is_dope_1h.py"
      - "research/candidate-57/slope_is_dope_1h_source_campaign.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-slope-is-dope-1h-source-v1
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble public trend source on reused project execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/SLOPE_IS_DOPE_1H_SOURCE_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_slope_is_dope_1h.py \
            research/candidate-51/router_slope_is_dope_impl.py
          cp research/candidate-57/router_slope_is_dope_runtime.py \
            research/candidate-51/router.py
          cp research/candidate-57/strategy_slope_is_dope_1h.py \
            research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_slope_is_dope_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/slope_is_dope_1h_source_campaign.py

      - name: Install locked environment and prove source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from router import RouteConfig, _aggregate_complete, _sma
          from router_slope_is_dope_impl import _flags_at
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_picasso import Candidate35Strategy as PublicExecutionShell

          assert issubclass(Candidate35Strategy, PublicExecutionShell)
          fields = set(Candidate35Config.__struct_fields__)
          required = {
              "slope_trigger_mode",
              "slope_side_mode",
              "slope_adx_long",
              "slope_adx_short",
              "slope_market_ma_period",
              "slope_fast_ma_period",
              "slope_slow_ma_period",
              "slope_source_effective_leverage",
              "slope_source_stoploss",
              "slope_trailing_only_offset_is_reached",
              "slope_roi_t3_minutes",
          }
          assert required.issubset(fields), required - fields
          assert callable(_aggregate_complete) and callable(_sma)
          flag_source = inspect.getsource(_flags_at)
          for token in (
              "slow_slope > 0.0",
              "fast_slope > 0.0",
              "rsi[index]) > 55.0",
              "slow_slope < 0.0",
              "fast_slope < 0.0",
              "rsi[index]) < 55.0",
          ):
              assert token in flag_source, token
          exit_source = inspect.getsource(Candidate35Strategy._source_exit_signal)
          assert "prior_low_long" in exit_source
          assert "prior_low_short" in exit_source
          assert "close > prior_low_short" in exit_source
          manage_source = inspect.getsource(Candidate35Strategy._manage_open_position)
          assert "slope_trailing_only_offset_is_reached" in manage_source
          assert "roi_profit_ratio / leverage" in manage_source
          print("public slope, literal exit, ROI and trailing contracts verified")
          PY

      - name: Run conditional public-source tournament
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-slope-is-dope-1h-source-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51 \
            uv run python research/candidate-57/slope_is_dope_1h_source_campaign.py \
            2>&1 | tee .work/candidate-57-slope-is-dope-1h-source-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            research/candidate-51/launch.py \
            research/candidate-51/router.py \
            research/candidate-51/strategy.py
          rm -f research/candidate-51/router_slope_is_dope_impl.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/slope-is-dope-1h-source-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate57: persist public Slope-is-Dope source evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete tournament artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-slope-is-dope-1h-source-v1
          path: |
            research/candidate-57/evidence/slope-is-dope-1h-source-v1
            .work/candidate-57-slope-is-dope-1h-source-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "Slope-is-Dope source tournament failed mechanically; status=$status"
            exit "${status:-1}"
          fi
