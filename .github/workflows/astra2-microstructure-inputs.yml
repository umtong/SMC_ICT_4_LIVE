name: Astra2 executed-flow observations
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/microstructure_inputs.py
      - .github/workflows/astra2-microstructure-inputs.yml
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        start: ['2024-08-03', '2025-08-10', '2025-11-17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pandas==2.3.3 numba==0.65.1 pyarrow==25.0.1
      - name: Observe traded price progression and aggressive flow
        run: |
          python research/candidate-ml-easychart-astra2/microstructure_inputs.py --start ${{ matrix.start }} --days 7 --workers 2
          tar -czf micro-${{ matrix.start }}.tar.gz micro_market
      - uses: actions/upload-artifact@v4
        with:
          name: astra2-micro-${{ matrix.start }}
          path: micro-${{ matrix.start }}.tar.gz
          compression-level: 0
          retention-days: 30
