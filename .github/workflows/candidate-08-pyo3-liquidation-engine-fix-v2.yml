name: candidate-08-pyo3-liquidation-engine-fix-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-pyo3-liquidation-engine-fix-v2"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-pyo3-liquidation-engine-fix-v2
  cancel-in-progress: false

jobs:
  patch-and-smoke:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the current legacy engine surface by function boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-08/run_aggtrade_acceptance_nautilus.py")
          source = path.read_text(encoding="utf-8")

          replacements = (
              ("from nautilus_trader.analysis.reporter import ReportProvider\n", ""),
              ("from nautilus_trader.backtest.engine import BacktestEngine\n", ""),
              (
                  "from nautilus_trader.config import BacktestEngineConfig, LoggingConfig\n",
                  "from nautilus_trader.core import nautilus_pyo3\n",
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"engine import contract mismatch: {old!r}")
              source = source.replace(old, new)

          start = source.index("def _create_engine(\n")
          end = source.index("\ndef _ten_second_bar_type(", start)
          new_function = '''def _create_engine(
              config: Mapping[str, Any],
              instruments: Mapping[str, CryptoPerpetual],
          ) -> Any:
              latency = config["cost_assumptions"]["latency_ms"]
              # NautilusTrader 1.230.0 exposes a legacy Cython engine and a Rust/PyO3 engine.
              # Only the PyO3 surface exposes native margin liquidation in this pinned build.
              engine = nautilus_pyo3.BacktestEngine(
                  nautilus_pyo3.BacktestEngineConfig(run_analysis=True)
              )
              engine.add_venue(
                  venue=VENUE,
                  oms_type=OmsType.HEDGING,
                  account_type=AccountType.MARGIN,
                  starting_balances=[Money(float(config["starting_nav_usdt"]), USDT)],
                  base_currency=USDT,
                  default_leverage=Decimal(str(config["venue"]["default_leverage"])),
                  fill_model=OneTickSlippageFillModel(
                      prob_fill_on_limit=1.0,
                      prob_slippage=float(
                          config["cost_assumptions"]["one_tick_slippage_probability"]
                      ),
                      random_seed=int(config["random_seed"]),
                  ),
                  fee_model=MakerTakerFeeModel(),
                  latency_model=LatencyModel(
                      base_latency_nanos=int(latency["base"] * 1_000_000),
                      insert_latency_nanos=int(latency["insert"] * 1_000_000),
                      update_latency_nanos=int(latency["update"] * 1_000_000),
                      cancel_latency_nanos=int(latency["cancel"] * 1_000_000),
                  ),
                  reject_stop_orders=False,
                  support_contingent_orders=True,
                  use_position_ids=True,
                  use_reduce_only=True,
                  bar_execution=True,
                  bar_adaptive_high_low_ordering=bool(
                      config["venue"]["bar_adaptive_high_low_ordering"]
                  ),
                  liquidation_enabled=bool(config["venue"]["liquidation_enabled"]),
                  liquidation_trigger_ratio=float(config["venue"]["liquidation_trigger_ratio"]),
                  liquidation_cancel_open_orders=bool(
                      config["venue"]["liquidation_cancel_open_orders"]
                  ),
              )
              for instrument in instruments.values():
                  engine.add_instrument(instrument)
              return engine
          '''
          source = source[:start] + new_function + source[end:]

          old_reports = '''        cached_orders = engine.cache.orders()
                  cached_positions = engine.cache.positions()
                  orders = ReportProvider.generate_orders_report(cached_orders)
                  fills = ReportProvider.generate_fills_report(cached_orders)
                  positions = ReportProvider.generate_positions_report(cached_positions)
                  account_report = ReportProvider.generate_account_report(account)
          '''
          new_reports = '''        orders = engine.generate_orders_report()
                  fills = engine.generate_fills_report()
                  positions = engine.generate_positions_report()
                  account_report = engine.generate_account_report(venue=VENUE)
          '''
          if source.count(old_reports) != 1:
              raise SystemExit("report-generation contract mismatch")
          source = source.replace(old_reports, new_reports)

          old_mark = '"mark_price": "completed one-minute mark-price close stamped before the exact funding boundary; used by NautilusTrader funding settlement and liquidation",'
          new_mark = '"mark_price": "completed one-minute mark-price close stamped before the exact funding boundary; used by native NautilusTrader PyO3 funding settlement and liquidation",'
          if source.count(old_mark) != 1:
              raise SystemExit("mark-price manifest contract mismatch")
          source = source.replace(old_mark, new_mark)

          if "BacktestEngine(" in source.replace("nautilus_pyo3.BacktestEngine(", ""):
              raise SystemExit("legacy BacktestEngine construction remains")
          if "ReportProvider" in source:
              raise SystemExit("legacy ReportProvider path remains")
          path.write_text(source, encoding="utf-8")
          PY

          smc4 doctor
          python -m compileall -q research/candidate-08/run_aggtrade_acceptance_nautilus.py
          python research/candidate-08/test_aggtrade_orderflow.py -v
          python research/candidate-08/test_aggtrade_acceptance.py -v
          python research/candidate-08/test_aggtrade_acceptance_pure.py -v
          python research/candidate-08/test_aggtrade_acceptance_nautilus.py -v

      - name: Smoke one shared account through the native engine
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-08 python - <<'PY'
          from decimal import Decimal
          import json
          from pathlib import Path
          import pandas as pd

          from aggtrade_acceptance_strategy import (
              AggTradeAcceptanceStrategy,
              AggTradeAcceptanceStrategyConfig,
          )
          from run_aggtrade_acceptance_nautilus import (
              _bars_from_ten_second_frame,
              _build_instrument,
              _create_engine,
              _ten_second_bar_type,
          )

          config = json.loads(
              Path("research/candidate-08/config_aggtrade_acceptance_nautilus.json").read_text()
          )
          fee_rate = float(config["effective_fee_rate_per_fill"])
          instruments = {
              symbol: _build_instrument(symbol, values, fee_rate)
              for symbol, values in config["assets"].items()
          }
          bar_types = {
              symbol: _ten_second_bar_type(instrument)
              for symbol, instrument in instruments.items()
          }
          timestamp = pd.Timestamp("2024-04-08T00:00:10Z")
          frame = pd.DataFrame(
              {
                  "open": [100.0],
                  "high": [100.1],
                  "low": [99.9],
                  "close": [100.0],
                  "volume": [1.0],
              },
              index=[timestamp],
          )
          bars = [
              bar
              for symbol, instrument in instruments.items()
              for bar in _bars_from_ten_second_frame(
                  frame,
                  bar_type=bar_types[symbol],
                  instrument=instrument,
              )
          ]
          strategy = AggTradeAcceptanceStrategy(
              AggTradeAcceptanceStrategyConfig(
                  trading_start_ns=int(timestamp.as_unit("ns").value),
                  trading_end_ns=int(
                      (timestamp + pd.Timedelta(minutes=1)).as_unit("ns").value
                  ),
                  risk_fraction=Decimal("0.03"),
                  effective_fee_rate=Decimal("0.0006"),
                  minimum_net_reward_risk=Decimal("1.2"),
                  maximum_hold_minutes=240,
                  funding_avoidance_minutes=5,
              ),
              instrument_ids=tuple(item.id for item in instruments.values()),
              bar_types=tuple(bar_types.values()),
              signals_by_time_ns={},
              funding_observations_by_instrument={
                  str(item.id): () for item in instruments.values()
              },
          )
          engine = _create_engine(config, instruments)
          try:
              engine.add_data(bars)
              engine.add_strategy(strategy)
              engine.run()
              venues = engine.list_venues()
              assert len(venues) == 1
              assert engine.generate_orders_report().empty
              assert engine.generate_fills_report().empty
              assert engine.generate_positions_report().empty
              account = engine.cache.account_for_venue(venues[0])
              assert account is not None
              assert not engine.generate_account_report(venue=venues[0]).empty
          finally:
              engine.dispose()
          print("PYO3_SHARED_ACCOUNT_NATIVE_LIQUIDATION_SMOKE_OK")
          PY

      - name: Commit only the verified implementation correction
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f research/candidate-08/.run-pyo3-liquidation-engine-fix-v2
          git add -A -- \
            research/candidate-08/run_aggtrade_acceptance_nautilus.py \
            research/candidate-08/.run-pyo3-liquidation-engine-fix-v2
          git commit -m "candidate-08: use verified native PyO3 liquidation engine [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1
