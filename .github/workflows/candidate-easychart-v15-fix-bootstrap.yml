name: candidate-easychart-v15-fix-bootstrap

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - "research/candidate-easychart/.v15_fix_payload/**"
      - ".github/workflows/candidate-easychart-v15-fix-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-easychart-v15-fix-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize semantic-routing and structural-invalidation fixes
        shell: bash
        run: |
          set -euo pipefail
          payload_dir="research/candidate-easychart/.v15_fix_payload"
          cat "$payload_dir"/part* > /tmp/easychart-v15-fix.b64
          test "$(sha256sum /tmp/easychart-v15-fix.b64 | cut -d' ' -f1)" = "b67a0fbb51f76a1866eb99ffd3dec146b5428b960ab1c8e86874a1e30f312985"
          base64 -d /tmp/easychart-v15-fix.b64 > /tmp/easychart-v15-fix.tar.gz
          test "$(sha256sum /tmp/easychart-v15-fix.tar.gz | cut -d' ' -f1)" = "b1485a148b37e00fc92f149f886a4ac4a0ca097825489458c201ff166b8d583a"
          mkdir -p /tmp/easychart-v15-fix
          tar -xzf /tmp/easychart-v15-fix.tar.gz -C /tmp/easychart-v15-fix
          cp /tmp/easychart-v15-fix/research/candidate-easychart/market_v15.py research/candidate-easychart/
          cp /tmp/easychart-v15-fix/research/candidate-easychart/screen_v15.py research/candidate-easychart/
          cp /tmp/easychart-v15-fix/research/candidate-easychart/tests/test_market_v15.py research/candidate-easychart/tests/
          cp /tmp/easychart-v15-fix/research/candidate-easychart/tests/test_screen_v15.py research/candidate-easychart/tests/
          python -m py_compile \
            research/candidate-easychart/market_v15.py \
            research/candidate-easychart/screen_v15.py \
            research/candidate-easychart/tests/test_market_v15.py \
            research/candidate-easychart/tests/test_screen_v15.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/candidate-easychart/market_v15.py \
            research/candidate-easychart/screen_v15.py \
            research/candidate-easychart/tests/test_market_v15.py \
            research/candidate-easychart/tests/test_screen_v15.py
          if git diff --cached --quiet; then
            echo "v15 semantic fixes already materialized"
            exit 0
          fi
          git commit -m "candidate-easychart: fix semantic routing and structural invalidation v15"
          git push origin HEAD:research/candidate-easychart
