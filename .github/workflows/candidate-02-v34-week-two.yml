name: candidate-02-v34-week-two

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-v34/collect_week_two.py"
      - ".github/workflows/candidate-02-v34-week-two.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect locked v34 second BTC week
        run: python .candidate-02-v34/collect_week_two.py
      - name: Upload immutable v34 week-two data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v34-week-two-${{ github.sha }}
          path: |
            .cache/candidate-02/v34-week-two
            artifacts/candidate-02-v34-week-two/manifest.json
          retention-days: 14
