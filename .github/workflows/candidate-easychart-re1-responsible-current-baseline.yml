name: candidate-easychart-re1-responsible-current-baseline
on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths: ["research/candidate-easychart_re1/.responsible_current_baseline_dispatch_marker"]
  workflow_dispatch:
concurrency: {group: candidate-easychart-re1-responsible-current-baseline, cancel-in-progress: true}
permissions: {contents: read, packages: read}
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: may-2024-guard, start: 2024-05-01, end: 2024-05-14}
          - {period: february-2025-short, start: 2025-02-01, end: 2025-02-10}
          - {period: live-examples-2025-short, start: 2025-08-10, end: 2025-08-20}
          - {period: february-2026-guard, start: 2026-02-01, end: 2026-02-14}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/candidate-easychart-re1-responsible-current/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-responsible-current/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile baseline
        run: python -m py_compile research/candidate-easychart_re1/easychart_re1_flow_ob_responsibility.py research/candidate-easychart_re1/run_mtf_backtest_re1_flow_ob_responsibility.py
      - name: Construction smoke
        run: |
          python - <<'PY'
          from easychart_re1_flow_ob_responsibility import EasyChartRE1ResponsibleFlowOBBundle
          bundle = EasyChartRE1ResponsibleFlowOBBundle("BTCUSDT", 0.1)
          assert bundle.micro.entry_owner_diagnostics["current_bar_visual_footprint"] == "FUTURE_FIRST_RETURN_OWNS_ENTRY"
          assert bundle.flow_decision_ob.entry_owner_diagnostics["current_bar_visual_footprint"] == "FUTURE_FIRST_RETURN_OWNS_ENTRY"
          PY
      - name: Run four-symbol continuous account
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_flow_ob_responsibility.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --warmup-days 14 --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$OUT" --fee-profile usd_m_vip0
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-responsible-current-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-responsible-current/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
