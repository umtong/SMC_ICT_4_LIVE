name: candidate-01-v7-first-minute-controls

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v7-first-minute-controls.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hierarchical
            runner: v4
            rule: none
          - label: local
            runner: v5
            rule: none
          - label: outer-aligned
            runner: v6
            rule: outer-aligned
          - label: outer-flow-takeover
            runner: v6
            rule: outer-flow-takeover
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v7-first-minute
          key: candidate-01-v7-first-minute-BTCUSDT-2023-06-14-26-${{ runner.os }}-v1
      - name: Run the frozen first BTC week through NautilusTrader
        env:
          LABEL: ${{ matrix.label }}
          RUNNER_KIND: ${{ matrix.runner }}
          RULE: ${{ matrix.rule }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -e LABEL="$LABEL" \
            -e RUNNER_KIND="$RUNNER_KIND" \
            -e RULE="$RULE" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m unittest discover -s tests -p "test_candidate_01_authoritative_nautilus.py" -v
              OUT="artifacts/candidate-01-v7-${LABEL}-first"
              rm -rf "$OUT"
              if [ "$RUNNER_KIND" = v4 ]; then
                python research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py \
                  --week 2023-06-19 \
                  --cache .cache/candidate-01-v7-first-minute \
                  --output "$OUT" \
                  --workers 4
              elif [ "$RUNNER_KIND" = v5 ]; then
                python research/candidate-01/intrinsic_local_liquidity_v5_nautilus_week.py \
                  --week 2023-06-19 \
                  --cache .cache/candidate-01-v7-first-minute \
                  --output "$OUT" \
                  --workers 4
              else
                python research/candidate-01/intrinsic_state_control_v6_nautilus_week.py \
                  --week 2023-06-19 \
                  --rule "$RULE" \
                  --cache .cache/candidate-01-v7-first-minute \
                  --output "$OUT" \
                  --workers 4
              fi
            '
      - name: Verify and print the authoritative gate
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          label = os.environ["LABEL"]
          root = Path(f"artifacts/candidate-01-v7-{label}-first")
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          assert metrics["execution_engine"] == "NautilusTrader"
          assert metrics["custom_fill_simulator"] is False
          assert metrics["custom_pnl_or_nav_ledger"] is False
          assert "first strictly later completed one-minute" in metrics["entry_semantics"]
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          gate = {
              "label": label,
              "trades": metrics["closed_positions"],
              "win_rate": metrics["win_rate"],
              "total_return": metrics["total_return"],
              "geometric_daily": metrics["geometric_mean_daily_return"],
              "profit_factor": metrics["profit_factor"],
              "max_drawdown": metrics["max_drawdown"],
              "target_met": metrics["target_met"],
              "rejection_counts": metrics["rejection_counts"],
          }
          (root / "first_week_gate.json").write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v7-${{ matrix.label }}-first-${{ github.sha }}
          path: artifacts/candidate-01-v7-${{ matrix.label }}-first
          if-no-files-found: error
          retention-days: 30
