name: candidate-55-zaratustra-v15-repair

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-zaratustra-v15-repair.yml"
      - "research/candidate-55/router_zaratustra.py"
      - "research/candidate-55/router_zaratustra_v13.py"
      - "research/candidate-55/router_zaratustra_v15.py"
      - "research/candidate-55/router_zaratustra_v15_short.py"
      - "research/candidate-55/strategy_zaratustra.py"
      - "research/candidate-55/strategy_zaratustra_v15.py"
      - "research/candidate-55/strategy_zaratustra_v15_short.py"
      - "research/candidate-55/strategy_zaratustra_v15_repair.py"
      - "research/candidate-55/run_zaratustra_v15_repair.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-zaratustra-v15-repair
  cancel-in-progress: true

jobs:
  diagnose-and-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55

      - name: Materialize V15 short repair
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router_zaratustra_v13.py
          cp research/candidate-55/router_zaratustra_v15.py research/candidate-51/router_zaratustra_v15.py
          cp research/candidate-55/router_zaratustra_v15_short.py research/candidate-51/router.py
          cp research/candidate-55/strategy_zaratustra.py research/candidate-51/strategy_zaratustra.py
          cp research/candidate-55/strategy_zaratustra_v15.py research/candidate-51/strategy_zaratustra_v15.py
          cp research/candidate-55/strategy_zaratustra_v15_short.py research/candidate-51/strategy_zaratustra_v15_short.py
          cp research/candidate-55/strategy_zaratustra_v15_repair.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and prove causal repair contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from pathlib import Path
          import tempfile
          import pandas as pd

          from strategy import _RepairFeatureStore

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "features.csv.gz"
              pd.DataFrame(
                  {
                      "observed_time_ns": [60_000_000_000, 120_000_000_000],
                      "feature_ready": [True, True],
                      "flow_3m": [-0.25, 0.40],
                      "ret_60s_bps": [-2.0, 3.0],
                  }
              ).to_csv(path, index=False, compression="gzip")
              store = _RepairFeatureStore(path)
              first = store.observation(60_000_000_000, 65.0)
              assert first.ready and first.flow_3m == -0.25
              causal = store.observation(119_000_000_000, 65.0)
              assert causal.observed_time_ns == 60_000_000_000
              assert causal.flow_3m == -0.25
              second = store.observation(120_000_000_000, 65.0)
              assert second.ready and second.flow_3m == 0.40
          print("V15 repair feature store is causal and complete-minute only")
          PY

      - name: Run short-first loss-engine tournament
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_zaratustra_v15_repair.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-zaratustra-v15-repair-${{ github.sha }}
          path: |
            artifacts/candidate-55/zaratustra-v15-repair-*
          if-no-files-found: warn
          retention-days: 30
