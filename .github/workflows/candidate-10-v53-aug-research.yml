name: candidate-10-v53-funded-runner-router-aug

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - .github/workflows/candidate-10-v53-aug-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  untouched-aug:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run untouched August router ablation
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v53-aug/UNTOUCHED_2026_08_01_TO_07"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v53-aug:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v53-aug
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v53-aug
              cp /workspace/research/candidate-10/c10_v*.py /tmp/candidate11-v53-aug/
              cp /workspace/research/candidate-10/test_c10_v*.py /tmp/candidate11-v53-aug/
              smc4 doctor
              python /tmp/candidate11-v53-aug/c10_v52_patch.py \
                /tmp/candidate11-v53-aug/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v53-aug/c10_v*.py \
                /tmp/candidate11-v53-aug/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v53-aug \
                -p "test_c10_v*.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v53-aug/UNTOUCHED_2026_08_01_TO_07"
              python /tmp/candidate11-v53-aug/c10_v53_run.py \
                --candidate11-dir /tmp/candidate11-v53-aug \
                --start "2026-08-01" \
                --end-exclusive "2026-08-07" \
                --variant leadership-gate-funded-runner \
                --evidence-class untouched_temporal_holdout_fixed_before_download \
                --output "${BASE}/leadership-gate-funded-runner"

              for variant in \
                event-rank-one-funded-runner \
                transfer-state-funded-runner; do
                mkdir -p "${BASE}/${variant}/data"
                cp -al "${BASE}/leadership-gate-funded-runner/data/." \
                  "${BASE}/${variant}/data/"
                python /tmp/candidate11-v53-aug/c10_v53_run.py \
                  --candidate11-dir /tmp/candidate11-v53-aug \
                  --start "2026-08-01" \
                  --end-exclusive "2026-08-07" \
                  --variant "${variant}" \
                  --evidence-class untouched_temporal_holdout_fixed_before_download \
                  --output "${BASE}/${variant}"
              done
            '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v53-aug-UNTOUCHED_2026_08_01_TO_07-${{ github.sha }}
          path: artifacts/candidate-10-v53-aug/UNTOUCHED_2026_08_01_TO_07
          if-no-files-found: warn
          retention-days: 14
