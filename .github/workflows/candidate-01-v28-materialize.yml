name: candidate-01-v28-materialize

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v28-materialize.yml"
      - ".candidate01-bootstrap/v28/apply_resumption_ordering_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
          fetch-depth: 0
      - name: Apply and validate corrected v28 ordering
        run: |
          set -euo pipefail
          python3 .candidate01-bootstrap/v28/apply_resumption_ordering_fix.py
          python3 -m py_compile \
            research/candidate-01/impact_elasticity_resumption_v28_nautilus_week.py \
            research/candidate-01/candidate_01_v28_gate.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          source = Path(
              "research/candidate-01/impact_elasticity_resumption_v28_nautilus_week.py",
          ).read_text(encoding="utf-8")
          assert "prior_pullback_high = float(setup.pullback_high)" in source
          assert "and resumption_break" in source
          json.loads(
              Path("research/candidate-01/candidate_01_v28_protocol.json").read_text(
                  encoding="utf-8",
              ),
          )
          PY
      - name: Commit corrected v28 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/impact_elasticity_resumption_v28_nautilus_week.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(candidate-01): compare v28 against prior pullback extreme"
          git push origin HEAD:research/candidate-01
