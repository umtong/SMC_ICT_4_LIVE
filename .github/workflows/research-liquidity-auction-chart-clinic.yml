name: Research liquidity auction chart clinic

on:
  workflow_dispatch:
  push:
    branches:
      - research_liquidity_auction_v3
    paths:
      - "research/candidate-liquidity-auction-v3/**"
      - ".github/workflows/research-liquidity-auction-chart-clinic.yml"

permissions:
  contents: write
  packages: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v3
      - name: Record run identity without retriggering
        shell: bash
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"run_attempt":%s,"head_sha":"%s","created_at":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .latest-liquidity-auction-chart-clinic
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-liquidity-auction-chart-clinic
          git commit -m "Record liquidity-auction chart clinic run ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:research_liquidity_auction_v3

  export:
    name: export-${{ matrix.period }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - period: dev-2023-feb
            start: "2023-02-01"
            end: "2023-02-08"
          - period: dev-2024-feb
            start: "2024-02-01"
            end: "2024-02-08"
          - period: dev-2024-aug
            start: "2024-08-01"
            end: "2024-08-08"
          - period: dev-2025-feb
            start: "2025-02-01"
            end: "2025-02-08"
          - period: dev-2025-aug
            start: "2025-08-01"
            end: "2025-08-08"
          - period: eval-2026-feb
            start: "2026-02-01"
            end: "2026-02-08"
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Export exact price-volume universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance-cache "clinic/${{ matrix.period }}"
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --cache /tmp/binance-cache \
            --output "clinic/${{ matrix.period }}"

      - name: Upload chart-clinic universe
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-chart-clinic-${{ matrix.period }}
          path: clinic/${{ matrix.period }}
          if-no-files-found: error
          retention-days: 14
