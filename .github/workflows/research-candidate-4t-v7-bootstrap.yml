name: research-candidate-4t-v7-bootstrap

on:
  push:
    branches: [research_candidate_4t]
    paths:
      - '.github/workflows/research-candidate-4t-v7-bootstrap.yml'
      - 'research/candidate-4t-sequential-control-v7/**'
      - '.dispatch-candidate-4t-v7-bootstrap'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: research-candidate-4t-v7-bootstrap
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'pandas>=2.2,<3'
      - name: Download the already successful Candidate 1k immutable-action harvests
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32592363635
          pattern: candidate-1k-*
          path: recovered
      - name: Separate development and untouched fresh actions
        run: |
          set -euo pipefail
          rm -rf inputs
          mkdir -p inputs/development inputs/fresh
          shopt -s nullglob
          for directory in recovered/*; do
            name=$(basename "$directory")
            if [[ "$name" == *fresh* ]]; then
              cp -a "$directory" "inputs/fresh/$name"
            elif [[ "$name" == *dev* ]]; then
              cp -a "$directory" "inputs/development/$name"
            fi
          done
          test -n "$(find inputs/development -type f -name '*.csv' -print -quit)"
          test -n "$(find inputs/fresh -type f -name '*.csv' -print -quit)"
      - name: Verify and route v7
        env:
          PYTHONPATH: research/candidate-4t-sequential-control-v7:research/candidate-4t-sequential-control-v6:research/candidate-4t-sequential-control-v5:research/candidate-4t-sequential-control-v4:research/candidate-4t-sequential-control-v3:research/candidate-4t-sequential-control-v1
        run: |
          set -euo pipefail
          python research/candidate-4t-sequential-control-v3/self_check_v3.py
          python research/candidate-4t-sequential-control-v4/self_check_v4.py
          python research/candidate-4t-sequential-control-v5/self_check_v5.py
          python research/candidate-4t-sequential-control-v6/self_check_v6.py
          python research/candidate-4t-sequential-control-v7/self_check_v7.py
          rm -rf result
          python research/candidate-4t-sequential-control-v7/candidate_4t_policy_v7.py \
            --development-root inputs/development \
            --fresh-root inputs/fresh \
            --output result
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-v7-bootstrap-${{ github.sha }}
          path: result/**
          if-no-files-found: error
          retention-days: 30
      - name: Commit quick causal diagnostic
        run: |
          set -euo pipefail
          destination=research_results/candidate_4t/bootstrap_v7
          rm -rf "$destination"
          mkdir -p "$destination"
          cp result/RESULT.md result/summary.json result/model_manifest.json "$destination/"
          for file in \
            development_orders.csv development_trades.csv development_replacements.csv \
            development_loss_clinic.csv development_missed_opportunity_clinic.csv \
            fresh_orders.csv fresh_trades.csv fresh_replacements.csv \
            fresh_loss_clinic.csv fresh_missed_opportunity_clinic.csv; do
            [[ ! -f "result/$file" ]] || cp "result/$file" "$destination/$file"
          done
          printf '%s\n' "source_commit=${GITHUB_SHA}" "source_run=${GITHUB_RUN_ID}" "harvest_run=32592363635" > "$destination/source.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Record Candidate 4t v7 bootstrap ${GITHUB_RUN_ID}"
            git push origin HEAD:research_candidate_4t
          fi
