name: candidate-08-day-liquidity-delivery-first-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-day-liquidity-delivery-first-v1"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-day-liquidity-delivery-first-v1
  cancel-in-progress: true

jobs:
  first-btc-week:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      MARKER: research/candidate-08/.run-day-liquidity-delivery-first-v1
      OUTPUT_DIR: research/candidate-08/evidence/day-liquidity-delivery-first-v1
      LOG: research/candidate-08/evidence/day-liquidity-delivery-first-v1/workflow.log
      STATUS: research/candidate-08/evidence/day-liquidity-delivery-first-v1/exit_status.txt
      CACHE_DIR: .cache/candidate-08-day-liquidity-delivery
      CONFIG: research/candidate-08/config_day_liquidity_delivery_btc_v1.json
      PATTERN_CONFIG: research/candidate-08/config_range_fvg.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified kline, aggTrade, funding, and mark-price cache
        uses: actions/cache@v4
        with:
          path: .cache/candidate-08-day-liquidity-delivery
          key: candidate-08-day-liquidity-delivery-v1-${{ hashFiles('research/candidate-08/config_day_liquidity_delivery_btc_v1.json') }}
          restore-keys: |
            candidate-08-day-liquidity-delivery-v1-

      - name: Run causal contracts and frozen BTC week
        id: research
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR" "$CACHE_DIR"
          set +e
          (
            set -euo pipefail
            smc4 doctor
            python -m compileall -q \
              research/candidate-08/day_liquidity_delivery_context_v1.py \
              research/candidate-08/day_liquidity_delivery_htf_v1.py \
              research/candidate-08/day_liquidity_delivery_routes_v1.py \
              research/candidate-08/day_liquidity_delivery_signals_v1.py \
              research/candidate-08/run_day_liquidity_delivery_nautilus_v1.py
            python research/candidate-08/test_day_liquidity_delivery_signals_v1.py -v
            python research/candidate-08/run_day_liquidity_delivery_nautilus_v1.py \
              --suite first \
              --config "$CONFIG" \
              --pattern-config "$PATTERN_CONFIG" \
              --output "$OUTPUT_DIR" \
              --data-cache "$CACHE_DIR"
            python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          summary = json.loads((output / "suite_metrics.json").read_text())
          result = summary["window_results"][0]
          window_name = result["window"]["name"] if isinstance(result.get("window"), dict) else "screen-01"
          window_dir = output / window_name
          manifest = json.loads((window_dir / "data_manifest.json").read_text())
          diagnostics = manifest["assets"]["BTCUSDT"]["detector_diagnostics"]
          rejections_payload = json.loads((window_dir / "detector_rejections.json").read_text())
          rejection_reasons = Counter(
              str(item.get("reason"))
              for item in rejections_payload.get("by_symbol", {}).get("BTCUSDT", [])
          )
          closed = int(result.get("position_metrics", {}).get("closed_trades", 0))
          signals = int(result.get("detector", {}).get("signals", 0))
          gate = bool(result.get("first_window_gate_passed", False))
          if gate:
              classification = "PROMOTE_TO_TWO_ADDITIONAL_FROZEN_BTC_WEEKS"
          elif signals == 0:
              classification = "CLEAN_LOGIC_FAILURE_NO_TRADEABLE_DAY_DELIVERY"
          elif closed == 0:
              classification = "CLEAN_LOGIC_OR_COST_FAILURE_SIGNALS_NOT_EXECUTED"
          else:
              classification = "CLEAN_LOGIC_FAILURE_COST_AFTER_NAV"
          decision = {
              "candidate": summary.get("candidate"),
              "window": window_name,
              "classification": classification,
              "signals": signals,
              "closed_trades": closed,
              "wins": int(result.get("position_metrics", {}).get("wins", 0)),
              "positive_trade_share": result.get("position_metrics", {}).get("positive_trade_share", 0.0),
              "total_return": result.get("total_return"),
              "daily_geometric_growth": result.get("daily_geometric_growth"),
              "maximum_drawdown": result.get("maximum_realized_equity_drawdown"),
              "first_window_gate_passed": gate,
              "detector_diagnostics": diagnostics,
              "top_rejection_reasons": dict(rejection_reasons.most_common(20)),
              "next_action": (
                  "RUN_FROZEN_SCREEN_UNCHANGED"
                  if gate
                  else "ONE_CAUSAL_ABLATION_ONLY_AFTER_DOMINANT_FAILURE_CAUSE_IS_IDENTIFIED"
              ),
          }
          (output / "decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$STATUS"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit implementation and evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER"
          git add -A -- \
            research/candidate-08/day_liquidity_delivery_context_v1.py \
            research/candidate-08/day_liquidity_delivery_htf_v1.py \
            research/candidate-08/day_liquidity_delivery_routes_v1.py \
            research/candidate-08/day_liquidity_delivery_signals_v1.py \
            research/candidate-08/test_day_liquidity_delivery_signals_v1.py \
            research/candidate-08/run_day_liquidity_delivery_nautilus_v1.py \
            research/candidate-08/config_day_liquidity_delivery_btc_v1.json \
            "$OUTPUT_DIR" "$MARKER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: record day liquidity delivery first-window evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce reproducible execution
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
