name: candidate-01-v26-auction-resolver-weeks

on:
  workflow_run:
    workflows: ["candidate-01-v25-funding-window-weeks"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  RUNNER_PATH: research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py
  GATE_PATH: research/candidate-01/candidate_01_v26_gate.py

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'research/candidate-01'
    runs-on: ubuntu-24.04
    outputs:
      run_v26: ${{ steps.decision.outputs.run_v26 }}
    steps:
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: candidate-01-v25-week1-*
          path: .v25-decision
          merge-multiple: true
      - id: decision
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_v26=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "run_v26=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          paths = list(Path('.v25-decision').rglob('week_gate.json'))
          if len(paths) != 1:
              raise SystemExit(f'expected one v25 primary gate, found {paths}')
          gate = json.loads(paths[0].read_text())
          run = bool(gate['operational_gate']) and not bool(gate['advance'])
          print(f"run_v26={'true' if run else 'false'}")
          PY

  week1:
    needs: decide
    if: needs.decide.outputs.run_v26 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate-output.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v26-week1
          key: candidate-01-v26-BTCUSDT-2024-02-04-2024-02-20-${{ runner.os }}-v1
      - name: Run first frozen two-sided resolver week through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py \
                research/candidate-01/candidate_01_v26_gate.py
              rm -rf artifacts/candidate-01-v26-week1
              python research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py \
                --week 2024-02-12 \
                --rule two-sided-resolver \
                --cache .cache/candidate-01-v26-week1 \
                --output artifacts/candidate-01-v26-week1 \
                --workers 4
            '
      - name: Verify and strictly classify week 1
        run: |
          python3 "$GATE_PATH" --root artifacts/candidate-01-v26-week1 --week 2024-02-12
      - id: gate-output
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path("artifacts/candidate-01-v26-week1/week_gate.json").read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v26-week1-${{ github.sha }}
          path: artifacts/candidate-01-v26-week1
          if-no-files-found: error
          retention-days: 30

  week1-controls:
    needs: week1
    if: needs.week1.outputs.advance != 'true'
    strategy:
      fail-fast: false
      matrix:
        rule: [failure-only, acceptance-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v26-${{ matrix.rule }}
          key: candidate-01-v26-${{ matrix.rule }}-BTCUSDT-2024-02-04-2024-02-20-${{ runner.os }}-v1
      - name: Run response control on identical event stream
        run: |
          set -euo pipefail
          output="artifacts/candidate-01-v26-${{ matrix.rule }}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              rm -rf artifacts/candidate-01-v26-${{ matrix.rule }}
              python research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py \
                --week 2024-02-12 \
                --rule ${{ matrix.rule }} \
                --cache .cache/candidate-01-v26-${{ matrix.rule }} \
                --output artifacts/candidate-01-v26-${{ matrix.rule }} \
                --workers 4
            '
      - name: Verify response control
        run: |
          python3 "$GATE_PATH" \
            --root artifacts/candidate-01-v26-${{ matrix.rule }} \
            --week 2024-02-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v26-${{ matrix.rule }}-${{ github.sha }}
          path: artifacts/candidate-01-v26-${{ matrix.rule }}
          if-no-files-found: error
          retention-days: 30

  week2:
    needs: week1
    if: needs.week1.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate-output.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v26-week2
          key: candidate-01-v26-BTCUSDT-2022-01-09-2022-01-25-${{ runner.os }}-v1
      - name: Run second frozen two-sided resolver week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$RESEARCH_IMAGE" bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v26-week2
              python research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py \
                --week 2022-01-17 --rule two-sided-resolver \
                --cache .cache/candidate-01-v26-week2 \
                --output artifacts/candidate-01-v26-week2 --workers 4
            '
      - run: python3 "$GATE_PATH" --root artifacts/candidate-01-v26-week2 --week 2022-01-17
      - id: gate-output
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate=json.loads(Path('artifacts/candidate-01-v26-week2/week_gate.json').read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v26-week2-${{ github.sha }}
          path: artifacts/candidate-01-v26-week2
          if-no-files-found: error
          retention-days: 30

  week3:
    needs: week2
    if: needs.week2.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v26-week3
          key: candidate-01-v26-BTCUSDT-2025-06-08-2025-06-24-${{ runner.os }}-v1
      - name: Run third frozen two-sided resolver week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$RESEARCH_IMAGE" bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v26-week3
              python research/candidate-01/funding_window_auction_resolver_v26_nautilus_week.py \
                --week 2025-06-16 --rule two-sided-resolver \
                --cache .cache/candidate-01-v26-week3 \
                --output artifacts/candidate-01-v26-week3 --workers 4
            '
      - run: python3 "$GATE_PATH" --root artifacts/candidate-01-v26-week3 --week 2025-06-16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v26-week3-${{ github.sha }}
          path: artifacts/candidate-01-v26-week3
          if-no-files-found: error
          retention-days: 30
