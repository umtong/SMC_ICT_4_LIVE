name: candidate-02-v91-confirmation-minute-ablation

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v91_immediate_entry_ablation_*.py"
      - "research/candidate-02/v91_confirmation_ablation_lock.json"
      - ".github/workflows/candidate-02-v91-confirmation-ablation.yml"

permissions:
  contents: read
  actions: read

jobs:
  single-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Download immutable v91 first-week source evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v91-first-week-c8f9d149375bc62cdf7eb298ccbbf8d57f784909
          path: inputs/v91-ablation-source
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31099381943"

      - name: Verify fixed runtime and exact single-variable ablation
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v91_cross_market_fair_value_core.py \
            research/candidate-02/v91_immediate_entry_ablation_core.py \
            research/candidate-02/v91_immediate_entry_ablation_backtest.py
          python -m json.tool research/candidate-02/v91_confirmation_ablation_lock.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v91_confirmation_ablation_lock.json').read_text())
          assert lock['status']=='LOCKED_SINGLE_ABLATION_ON_REVEALED_V91_FIRST_WEEK'
          assert lock['single_ablation']['removed_core_variable']=='confirmation_minute'
          assert lock['single_ablation']['single_ablation_only'] is True
          assert lock['performance_engine']=='NautilusTrader 1.230.0'
          assert lock['custom_backtest_engine'] is False
          assert float(lock['risk_fraction'])==0.03
          for path in sorted(Path('research/candidate-02').glob('v91_*_config.json')):
              cfg=json.loads(path.read_text())
              assert cfg['validation']['first_week_start']=='2025-12-15'
              assert float(cfg['risk']['risk_fraction'])==0.03
              assert cfg['risk']['maximum_notional_cap'] is None
              assert cfg['risk']['score_risk_multiplier'] is None
          PY

      - name: Materialize immutable source matrix and raw bars
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v91-confirmation-ablation
          mkdir -p inputs/v91-confirmation-ablation/candidate-02-v48-first-week
          mkdir -p inputs/v91-confirmation-ablation/.cache/candidate-02/v91-confirmation-ablation/binance_1m
          feature=$(find inputs/v91-ablation-source -name v48_features.npz -type f | sort | head -n1)
          columns=$(find inputs/v91-ablation-source -name columns.json -type f | sort | head -n1)
          raw=$(find inputs/v91-ablation-source -type d -name binance_1m | while read p; do [[ $(find "$p" -name 'BTCUSDT-1m-*.zip' | wc -l) -eq 10 ]] && echo "$p"; done | head -n1)
          test -n "$feature"
          test -n "$columns"
          test -n "$raw"
          cp "$feature" inputs/v91-confirmation-ablation/candidate-02-v48-first-week/v48_features.npz
          cp "$columns" inputs/v91-confirmation-ablation/candidate-02-v48-first-week/columns.json
          find "$raw" -name 'BTCUSDT-1m-*.zip' -type f -exec cp '{}' inputs/v91-confirmation-ablation/.cache/candidate-02/v91-confirmation-ablation/binance_1m/ \;
          test "$(find inputs/v91-confirmation-ablation/.cache/candidate-02/v91-confirmation-ablation/binance_1m -name '*.zip' | wc -l)" -eq 10

      - name: Add official completed-minute futures OHLC only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from v53_nt_core import load_feature_matrix, load_raw_one_minute

          root=Path('inputs/v91-confirmation-ablation/candidate-02-v48-first-week')
          npz=root/'v48_features.npz'
          columns_path=root/'columns.json'
          features=load_feature_matrix(npz,columns_path)
          raw=load_raw_one_minute(Path('inputs/v91-confirmation-ablation/.cache/candidate-02/v91-confirmation-ablation/binance_1m'))
          for name in ('open','high','low'):
              if name in features.columns:
                  raise RuntimeError(f'controlled patch expected {name} to be absent')
          data=features.join(raw[['open','high','low']],how='left')
          critical=['open','high','low','close','spot_open','spot_high','spot_low','spot_close']
          if data[critical].isna().any().any():
              raise RuntimeError({name:int(data[name].isna().sum()) for name in critical})
          columns=[str(name) for name in data.columns]
          values=data.to_numpy(dtype=np.float64,copy=True)
          timestamps_ns=data.index.asi8.astype(np.int64,copy=True)
          temporary=npz.with_suffix('.tmp.npz')
          np.savez_compressed(temporary,timestamps_ns=timestamps_ns,values=values)
          temporary.replace(npz)
          columns_path.write_text(json.dumps(columns,indent=2),encoding='utf-8')
          PY

      - name: Verify full causal coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from v53_nt_core import load_feature_matrix
          lock=json.loads(Path('research/candidate-02/v91_confirmation_ablation_lock.json').read_text())
          features=load_feature_matrix(
              Path('inputs/v91-confirmation-ablation/candidate-02-v48-first-week/v48_features.npz'),
              Path('inputs/v91-confirmation-ablation/candidate-02-v48-first-week/columns.json'))
          start=pd.Timestamp(lock['revealed_week']['start_utc'])
          end=pd.Timestamp(lock['revealed_week']['end_utc'])
          evaluation=features.loc[(features.index>=start)&(features.index<end)]
          required={
              'open','high','low','close',
              'aggressive_total_quote_1m','aggressive_signed_quote_1m',
              'spot_open','spot_high','spot_low','spot_close',
              'spot_aggressive_total_quote_1m','spot_aggressive_signed_quote_1m',
              'perp_spot_log_basis','perp_spot_basis_change_1m',
          }
          missing=sorted(required-set(features.columns))
          if missing: raise RuntimeError(missing)
          if len(evaluation)<7*24*60*0.995: raise RuntimeError(len(evaluation))
          if features.index.min()>start-pd.Timedelta(days=2)+pd.Timedelta(minutes=2): raise RuntimeError('missing warmup')
          if features.index.max()<end: raise RuntimeError('features end early')
          PY

      - name: Run every unchanged configuration in a fresh NautilusTrader process
        shell: bash
        run: |
          set -euo pipefail
          labels=(portfolio1 portfolio2 portfolio3 spotled2 overshoot2)
          configs=(v91_portfolio_1m_config.json v91_portfolio_2m_config.json v91_portfolio_3m_config.json v91_spot_led_2m_config.json v91_perp_overshoot_2m_config.json)
          for i in "${!labels[@]}"; do
            label="${labels[$i]}"; config="${configs[$i]}"
            output="artifacts/candidate-02-v91-confirmation-ablation-${label}"; mkdir -p "$output"
            set +e
            python research/candidate-02/v91_immediate_entry_ablation_backtest.py \
              --config "research/candidate-02/${config}" \
              --input-root inputs/v91-confirmation-ablation \
              --output "$output" \
              | tee "artifacts-v91-confirmation-ablation-${label}.log"
            status=${PIPESTATUS[0]}; set -e
            echo "$status" > "$output/validation_exit_code.txt"
            if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi
          done

      - name: Publish ablation decision
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          labels=('portfolio1','portfolio2','portfolio3','spotled2','overshoot2')
          rows={}
          print('# Candidate-02 v91 single confirmation-minute ablation')
          print('| Variant | Decision | Signals | Trades/day | Win | PF | Growth/day | MDD |')
          print('|---|---:|---:|---:|---:|---:|---:|---:|')
          def passed(m):
              return (
                  m.get('trades_per_day',0)>=0.75
                  and m.get('win_rate',0)>=0.50
                  and m.get('profit_factor_after_cost',0)>=1.50
                  and m.get('geometric_daily_growth_after_cost',-1)>=0.01
                  and abs(m.get('maximum_mark_to_market_drawdown',-1))<=0.25
                  and m.get('engine','').startswith('NautilusTrader')
                  and m.get('custom_backtest_engine') is False
                  and abs(m.get('risk_fraction',0)-0.03)<=1e-12
              )
          for label in labels:
              path=Path(f'artifacts/candidate-02-v91-confirmation-ablation-{label}/metrics.json')
              if not path.exists():
                  rows[label]={'status':'IMPLEMENTATION_ERROR'}
                  print(f'| {label} | implementation error | - | - | - | - | - | - |')
                  continue
              m=json.loads(path.read_text())
              rows[label]={'passes_all':passed(m),'metrics':m}
              print(f"| {label} | {'PASS' if passed(m) else 'REJECT'} | {m['scheduled_signals']} | {m['trades_per_day']:.3f} | {m['win_rate']:.2%} | {m['profit_factor_after_cost']:.3f} | {m['geometric_daily_growth_after_cost']:.3%} | {m['maximum_mark_to_market_drawdown']:.2%} |")
          central=rows.get('portfolio2',{}).get('passes_all') is True
          adjacent=any(rows.get(key,{}).get('passes_all') is True for key in ('portfolio1','portfolio3'))
          decision={
              'status':'STRUCTURAL_PATH_PRESENT_REQUIRES_NEW_BLIND_CANDIDATE' if central and adjacent else 'NO_STRUCTURAL_PATH_DISCARD_V91',
              'single_ablation':'remove_confirmation_minute',
              'diagnostic_only':True,
              'rows':rows,
              'risk_fraction':0.03,
              'performance_engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
          }
          Path('artifacts-v91-confirmation-ablation-decision.json').write_text(json.dumps(decision,indent=2,sort_keys=True))
          PY

      - name: Preserve NautilusTrader ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v91-confirmation-ablation-${{ github.sha }}
          path: |
            artifacts/candidate-02-v91-confirmation-ablation-*
            artifacts-v91-confirmation-ablation-*.log
            artifacts-v91-confirmation-ablation-decision.json
          if-no-files-found: warn
          retention-days: 30
