name: candidate-easychart-v5-target-ablation

on:
  push:
    branches: ["research/candidate-easychart-v5-target-ablation"]
    paths:
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v5-target-ablation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v5-target-ablation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  integrated-target-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-v5-target-ablation
      ROOT: artifacts/candidate-easychart-v5-target-ablation
    steps:
      - uses: actions/checkout@v4

      - name: Environment and causal semantic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v

      - name: Scale-matched and nearest-any objective accounts
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/run.log") 2>&1
          for POLICY in scale_matched nearest_any; do
            mkdir -p "$ROOT/$POLICY"
            python research/candidate-easychart-v5/run_mtf_backtest_v5_target_ablation.py \
              --start 2024-02-01 \
              --end 2024-02-14 \
              --warmup-days 30 \
              --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
              --cache "$CACHE" \
              --output "$ROOT/$POLICY" \
              --target-policy "$POLICY"
          done

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("artifacts/candidate-easychart-v5-target-ablation")
          fields = (
              "final_nav",
              "total_return",
              "daily_geometric_growth",
              "closed_positions",
              "independent_trades_per_day",
              "plans",
              "submitted_plans",
              "plans_skipped_global_slot",
              "risk_budget_breaches",
              "emergency_protective_exits",
          )
          comparison = {}
          for policy in ("scale_matched", "nearest_any"):
              metrics = json.loads((root / policy / "metrics.json").read_text(encoding="utf-8"))
              comparison[policy] = {field: metrics.get(field) for field in fields}
          (root / "comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(comparison, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v5-target-ablation-${{ github.sha }}
          path: artifacts/candidate-easychart-v5-target-ablation/**
          if-no-files-found: warn
          retention-days: 90
