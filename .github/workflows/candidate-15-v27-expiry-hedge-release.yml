name: Candidate 15 V27 daily expiry hedge-release diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v27-expiry-hedge-release.json"
      - "research/candidate-15/diagnose_v27_expiry_hedge_release.py"
      - ".github/workflows/candidate-15-v27-expiry-hedge-release.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v27-expiry-hedge-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen expiry contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-15/diagnose_v17_open_interest.py \
            research/candidate-15/run_v17_open_interest.py \
            research/candidate-15/diagnose_v23_quarter_hour_10s.py \
            research/candidate-15/diagnose_v27_expiry_hedge_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(
              Path('research/candidate-15/protocol-v27-expiry-hedge-release.json').read_text()
          )
          assert protocol['schema'] == 'candidate-15-v27-expiry-hedge-release-v1'
          assert protocol['evaluation']['global_position_limit'] == 1
          assert protocol['fixed_rules']['expiry_time_utc'] == '08:00'
          assert protocol['fixed_rules']['confirmation_minutes'] == 15
          assert protocol['fixed_rules']['minimum_net_structural_r'] == 1.25
          assert protocol['fixed_rules']['same_bar_stop_and_target_policy'] == 'STOP_FIRST_CONSERVATIVE'
          assert protocol['fixed_rules']['execution_round_trip_cost_bps'] == 16.0
          assert protocol['fixed_rules']['funding_and_unmodeled_impact_reserve_bps'] == 4.0
          PY

      - name: Run daily expiry hedge-release mechanism diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/src"
          python research/candidate-15/diagnose_v27_expiry_hedge_release.py \
            --protocol research/candidate-15/protocol-v27-expiry-hedge-release.json \
            --output research/candidate-15/v27/expiry_hedge_release/results

      - name: Verify entry clock and one-trade expiry arbitration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          def read_optional(path: Path) -> pd.DataFrame:
              if not path.is_file() or path.stat().st_size == 0:
                  return pd.DataFrame()
              try:
                  return pd.read_csv(path)
              except EmptyDataError:
                  return pd.DataFrame()

          root = Path('research/candidate-15/v27/expiry_hedge_release/results')
          candidates = read_optional(root / 'all_executable_candidates.csv')
          if len(candidates.index):
              expiry = pd.to_datetime(candidates['expiry_ts'], utc=True)
              entry = pd.to_datetime(candidates['entry_ts'], utc=True)
              assert ((entry - expiry) == pd.Timedelta(minutes=15)).all()
              assert candidates['net_structural_r'].ge(1.25).all()
          selected = read_optional(root / 'selected_trades.csv')
          if len(selected.index):
              assert not selected['expiry_ts'].duplicated().any()
              opened = pd.to_datetime(selected['entry_ts'], utc=True)
              closed = pd.to_datetime(selected['exit_ts'], utc=True)
              assert (
                  opened.iloc[1:].reset_index(drop=True)
                  >= closed.iloc[:-1].reset_index(drop=True)
              ).all()
          PY

      - name: Remove downloaded market archives
        if: always()
        shell: bash
        run: rm -rf research/candidate-15/v27/expiry_hedge_release/results/data

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v27/expiry_hedge_release/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V27_EXPIRY_HEDGE_RELEASE_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v27-bot
          git config user.email candidate-15-v27-bot@users.noreply.github.com
          git add \
            research/candidate-15/V27_EXPIRY_HEDGE_RELEASE_RESULT.md \
            research/candidate-15/v27/expiry_hedge_release/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v27: persist expiry hedge-release evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v27-expiry-hedge-release-${{ github.run_id }}
          path: |
            research/candidate-15/V27_EXPIRY_HEDGE_RELEASE_RESULT.md
            research/candidate-15/v27/expiry_hedge_release/results
          if-no-files-found: warn
          retention-days: 30
