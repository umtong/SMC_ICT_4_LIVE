name: candidate-51-ichiv21-focused-v49

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-ichiv21-focused-v49.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-51-ichiv21-focused-v49
  cancel-in-progress: true

jobs:
  interval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {interval: autumn_2024_10, data_start: 2024-09-25, start: 2024-10-01, end: 2024-10-07}
          - {interval: winter_2025_01, data_start: 2024-12-26, start: 2025-01-01, end: 2025-01-07}
          - {interval: spring_2025_05, data_start: 2025-04-25, start: 2025-05-01, end: 2025-05-07}
          - {interval: winter_2026_02, data_start: 2026-01-26, start: 2026-02-01, end: 2026-02-07}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-51, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install and materialize focused ichiV2_1 system
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_ichiv21.py research/candidate-51/router.py
          cp research/candidate-51/strategy_ichiv21.py research/candidate-51/strategy.py
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51
          python research/candidate-51/ichiv21_focused_prepare.py \
            --output .work/candidate-51-ichiv21-focused-v49
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import json
          from pathlib import Path
          from strategy import Candidate35Config

          fields = set(Candidate35Config.__struct_fields__)
          assert {
              "ichiv21_episode_mode", "ichiv21_direction_mode",
              "ichiv21_alignment_mode", "ichiv21_stop_mode",
              "ichiv21_management_mode",
          } <= fields
          root = Path(".work/candidate-51-ichiv21-focused-v49")
          expected = {
              "source_exit": ("source", "source"),
              "roi_only": ("source", "no_signal"),
              "roi_progress": ("source", "roi_progress"),
              "structural_roi_only": ("signal_extreme_ema120_atr", "no_signal"),
          }
          for name, values in expected.items():
              cfg = json.loads((root / f"{name}.json").read_text())["strategy"]
              assert cfg["ichiv21_bucket_minutes"] == 5
              assert cfg["ichiv21_direction_mode"] == "long_only"
              assert cfg["ichiv21_alignment_mode"] == "all8"
              assert (cfg["ichiv21_stop_mode"], cfg["ichiv21_management_mode"]) == values
          print("Focused ichiV2_1 ROI/exit configurations verified")
          PY
      - name: Run focused mechanisms on this independent account
        shell: bash
        run: |
          set +e
          work=.work/candidate-51-ichiv21-focused-v49
          root=artifacts/candidate-51/ichiv21-focused-v49/${{ matrix.interval }}
          mkdir -p "$root" "$work/status"
          while IFS= read -r variant; do
            [[ -z "$variant" ]] && continue
            PYTHONPATH=research/candidate-51 uv run python \
              research/candidate-51/launch_kline_only_warmup.py \
              --config "$work/$variant.json" \
              --data-start "${{ matrix.data_start }}" \
              --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
              --cache ".cache/candidate-51-ichiv21-focused-v49/${{ matrix.interval }}" \
              --output "$root/$variant" \
              --workspace "$work/ws-${{ matrix.interval }}-$variant"
            echo $? > "$work/status/${{ matrix.interval }}-$variant.txt"
          done < "$work/variants.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-ichiv21-focused-v49-${{ matrix.interval }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/ichiv21-focused-v49/${{ matrix.interval }}/**/metrics.json
            artifacts/candidate-51/ichiv21-focused-v49/${{ matrix.interval }}/**/strategy_diagnostics.json
            artifacts/candidate-51/ichiv21-focused-v49/${{ matrix.interval }}/**/closed_scenarios.json
            artifacts/candidate-51/ichiv21-focused-v49/${{ matrix.interval }}/**/equity.csv
            .work/candidate-51-ichiv21-focused-v49/status/*.txt

  aggregate:
    if: always()
    needs: interval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-51, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-51-ichiv21-focused-v49-*
          path: downloaded
      - name: Build focused ichiV2_1 anatomy
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/candidate-51/ichiv21-focused-v49
          mkdir -p "$root"
          find downloaded -type f | while read -r file; do
            case "$file" in
              *artifacts/candidate-51/ichiv21-focused-v49/*)
                relative="${file#*artifacts/candidate-51/ichiv21-focused-v49/}"
                mkdir -p "$root/$(dirname "$relative")"
                cp "$file" "$root/$relative"
                ;;
            esac
          done
          python research/candidate-51/ichiv21_focused_prepare.py \
            --output .work/candidate-51-ichiv21-focused-v49
          cp .work/candidate-51-ichiv21-focused-v49/MANIFEST.json "$root/MANIFEST.json"
          python research/candidate-51/ichiv21_anatomy_audit.py \
            --root "$root" --manifest "$root/MANIFEST.json" \
            --output-json "$root/ANATOMY.json" --output-md "$root/ANATOMY.md"
          test -s "$root/ANATOMY.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-ichiv21-focused-v49-anatomy
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/ichiv21-focused-v49/ANATOMY.*
      - name: Commit compact mechanism evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/ichiv21-focused-v49
          destination=research/candidate-51/evidence/ichiv21-focused-v49
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/MANIFEST.json" "$destination/MANIFEST.json"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add "$destination"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate51: record focused ichiV2_1 ROI anatomy"
          git pull --rebase origin research/candidate-51
          git push origin HEAD:research/candidate-51
