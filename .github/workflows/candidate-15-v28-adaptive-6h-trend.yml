name: Candidate 15 V28 adaptive six-hour trend diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v28-adaptive-6h-trend.json"
      - "research/candidate-15/diagnose_v28_adaptive_6h_trend.py"
      - ".github/workflows/candidate-15-v28-adaptive-6h-trend.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v28-adaptive-6h-trend-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen trend contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile research/candidate-15/diagnose_v28_adaptive_6h_trend.py
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(
              Path('research/candidate-15/protocol-v28-adaptive-6h-trend.json').read_text()
          )
          assert protocol['schema'] == 'candidate-15-v28-adaptive-6h-trend-v1'
          assert protocol['evaluation']['global_position_limit'] == 1
          assert protocol['fixed_rules']['signal_interval_minutes'] == 360
          assert protocol['fixed_rules']['confirmation_minutes'] == 15
          assert protocol['fixed_rules']['maximum_hold_minutes'] == 1440
          assert protocol['fixed_rules']['same_bar_stop_policy'] == 'STOP_FIRST_CONSERVATIVE'
          assert protocol['fixed_rules']['execution_round_trip_cost_bps'] == 16.0
          assert protocol['fixed_rules']['funding_and_unmodeled_impact_reserve_bps'] == 4.0
          PY

      - name: Run adaptive six-hour trend mechanism
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/src"
          python research/candidate-15/diagnose_v28_adaptive_6h_trend.py \
            --protocol research/candidate-15/protocol-v28-adaptive-6h-trend.json \
            --output research/candidate-15/v28/adaptive_6h_trend/results

      - name: Verify causal entry, stop, and global arbitration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          def read_optional(path: Path) -> pd.DataFrame:
              if not path.is_file() or path.stat().st_size == 0:
                  return pd.DataFrame()
              try:
                  return pd.read_csv(path)
              except EmptyDataError:
                  return pd.DataFrame()

          root = Path('research/candidate-15/v28/adaptive_6h_trend/results')
          candidates = read_optional(root / 'all_executable_candidates.csv')
          if len(candidates.index):
              signal = pd.to_datetime(candidates['signal_ts'], utc=True)
              entry = pd.to_datetime(candidates['entry_ts'], utc=True)
              assert ((entry - signal) == pd.Timedelta(minutes=15)).all()
              direction = candidates['direction_value'].astype(float)
              assert (direction * (
                  candidates['entry_price'].astype(float)
                  - candidates['initial_stop'].astype(float)
              ) > 0.0).all()
          selected = read_optional(root / 'selected_trades.csv')
          if len(selected.index):
              opened = pd.to_datetime(selected['entry_ts'], utc=True)
              closed = pd.to_datetime(selected['exit_ts'], utc=True)
              assert (
                  opened.iloc[1:].reset_index(drop=True)
                  >= closed.iloc[:-1].reset_index(drop=True)
              ).all()
              assert selected['holding_minutes'].le(1440.0).all()
          PY

      - name: Remove downloaded market archives
        if: always()
        shell: bash
        run: rm -rf research/candidate-15/v28/adaptive_6h_trend/results/data

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v28/adaptive_6h_trend/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V28_ADAPTIVE_6H_TREND_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v28-bot
          git config user.email candidate-15-v28-bot@users.noreply.github.com
          git add \
            research/candidate-15/V28_ADAPTIVE_6H_TREND_RESULT.md \
            research/candidate-15/v28/adaptive_6h_trend/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v28: persist adaptive six-hour trend evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v28-adaptive-6h-trend-${{ github.run_id }}
          path: |
            research/candidate-15/V28_ADAPTIVE_6H_TREND_RESULT.md
            research/candidate-15/v28/adaptive_6h_trend/results
          if-no-files-found: warn
          retention-days: 30
