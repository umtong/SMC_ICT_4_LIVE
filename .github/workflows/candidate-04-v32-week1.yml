name: candidate-04-v32-week1

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v32-week1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_BUILD_START: "2023-08-02"
      C04_BUILD_END: "2023-08-10"
      C04_EVALUATION_START: "2023-08-04"
      C04_EVALUATION_END: "2023-08-10"
      C04_MATRIX_NAME: "low_activity"
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact completed-data observations
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v27-cross-low_activity-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
          path: artifacts/candidate-04-v32-week1/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31105658664
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runtime and V32 causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          root="artifacts/candidate-04-v32-week1"
          test -s "$root/source/source/rich/data_manifest.json"
          python -m compileall -q \
            research/candidate-04/order_flow_impact_regime_compiler.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_order_flow_impact_regime_compiler.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Compile V32 completed-data intents without execution or PnL
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v32-week1"
          python research/candidate-04/order_flow_impact_regime_compiler.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$root/source/source/rich" \
            --kline-dir ".cache/candidate-04-v32-week1/raw" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --output "$root/signals" \
            --download-klines \
            | tee "$root/signal_compiler_console.json"
          test -s "$root/signals/signals.json"
          test -s "$root/signals/summary.json"

      - name: Execute V32 exclusively through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v32-week1"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v32-week1/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk and diagnose V32 week 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v32-week1")
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          signal_summary = json.loads((root / "signals/summary.json").read_text())
          signals = json.loads((root / "signals/signals.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry-position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV contract")

          scenarios = Counter(str(row.get("scenario")) for row in signals)
          summary = {
              "candidate": "candidate-04-v32-order-flow-impact-regime",
              "stage": "development_week_1",
              "selection": {
                  "method": "sha256(candidate commit + stage) modulo seven pre-existing exact observation weeks",
                  "selected_week": "low_activity",
              },
              "evaluation_start": "2023-08-04",
              "evaluation_end": "2023-08-10",
              "engine": metrics.get("engine"),
              "signals": signal_summary.get("written_signals"),
              "signal_scenarios": dict(scenarios),
              "route_counts": signal_summary.get("route_counts"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "gate_checks": metrics.get("gate_checks"),
              "gate_pass": metrics.get("gate_pass"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
              "screening_assessment": {
                  "frequency_promising": int(metrics.get("trades") or 0) >= 7,
                  "growth_promising": float(metrics.get("geometric_daily_growth") or 0.0) >= 0.01,
                  "positive_after_costs": float(metrics.get("total_return") or 0.0) > 0.0,
              },
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v32-week1-${{ github.sha }}
          path: artifacts/candidate-04-v32-week1
          if-no-files-found: error
          retention-days: 90

# Controlled rerun after correcting only the strict 15-minute OI test fixtures.
