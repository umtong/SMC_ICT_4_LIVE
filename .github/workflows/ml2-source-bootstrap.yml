name: ML2 source bootstrap

on:
  push:
    branches: ["research_ML2"]
    paths:
      - ".ml2-bootstrap/**"
      - ".github/workflows/ml2-source-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: ml2-source-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install audited ML2 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ml2-bootstrap/payload.part* | base64 -d > /tmp/ml2_payload.tar.gz
          echo "9d6105702633dcdf81164cc72b26c66e4729813da7c8e19b8a511a261e75c5a6  /tmp/ml2_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ml2_payload.tar.gz -C .
          rm -rf .ml2-bootstrap .github/workflows/ml2-source-bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: install causal EasyChart ML2 implementation"
          git push
