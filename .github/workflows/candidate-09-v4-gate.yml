name: Candidate 09 v4 post-acceptance resolution gate

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v4-gate.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v4-gate
  cancel-in-progress: false

jobs:
  activate-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Archive v3 and activate structurally distinct v4
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09
          archive="$root/archive/v3"
          mkdir -p "$archive/evidence"
          if [[ ! -f "$archive/README.md" ]]; then
            cp "$root/state_engine.py" "$archive/state_engine.py"
            cp "$root/config.json" "$archive/config.json"
            for name in summary.json REPORT.md outcomes.csv trades.csv fills.csv events.jsonl run.json data_manifest.json; do
              [[ -f "$root/evidence/latest/$name" ]] && cp "$root/evidence/latest/$name" "$archive/evidence/$name"
            done
            cat > "$archive/README.md" <<'EOF'
          # Candidate 09 v3 — discarded complete candidate

          Reproducible final v3 result commit: `03dec84c4764ea6a9f22840585c735588d57f899`.

          V3 tested a continuation-only interpretation of accepted multi-horizon auction breaches. It used completed 60m/240m/1440m extremes, directional approach pressure, outside acceptance, and the first defended retest. Nautilus execution and accounting were clean on the unchanged three BTC weeks, but the economic hypothesis failed decisively:

          - pooled daily geometric return: **-1.153545%**
          - pooled NAV multiple: **0.783760x**
          - baseline trades: **8**, wins: **0**, losses: **8**
          - week returns: **-14.1258%, -5.9093%, -2.9996%**
          - all three one-variable ablations remained negative

          Removing acceptance worsened daily growth to **-1.439760%**. Removing flow produced **-0.909373%**. Entering without the defended-retest confirmation produced **-0.534598%**. Therefore acceptance and retest reduced damage, but the first accepted retest did not establish continuation. Every baseline trade stopped, generally soon after entry.

          Failure interpretation: the apparent outside acceptance/first retest was often an inducement or unstable auction, not persistent directional repricing. V4 does not tune the stop or loosen the gate. It waits for either (a) retest plus renewed re-expansion before continuation, or (b) loss of the accepted level with opposite displacement, interpreted as trapped-breakout reversal.
          EOF
          fi

          cat "$root/bootstrap/v4-engine.part"* | base64 -d | gzip -dc > "$root/state_engine_v4.py"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = "5b7c5873efae27b0c395f57b541449247f6b6596725daff28a43fb0588923171"
          actual = sha256(Path("research/candidate-09/state_engine_v4.py").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"v4 engine bootstrap hash mismatch: {actual}")
          PY
          cp "$root/state_engine_v4.py" "$root/state_engine.py"
          cp "$root/config_v4.json" "$root/config.json"
          mkdir -p "$root/tests_v4"
          base64 -d "$root/bootstrap/v4-test.gz.b64" | gzip -dc > "$root/tests_v4/test_state_engine.py"
          sed -i 's/from state_engine_v4 import/from state_engine import/' "$root/tests_v4/test_state_engine.py"
          cp "$root/tests_v4/test_state_engine.py" "$root/tests/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path
          path = Path('research/candidate-09/run.py')
          text = path.read_text(encoding='utf-8')
          if 'no-reexpansion-confirmation' not in text:
              if 'no-retest-confirmation' not in text:
                  raise SystemExit('expected v3 ablation name not found')
              text = text.replace('no-retest-confirmation', 'no-reexpansion-confirmation', 1)
          text = text.replace(
              'The structurally frozen v2 baseline and three',
              'The structurally frozen v4 baseline and three',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, v4 tests, and unchanged frozen-week gate
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v4-gate"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"
          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate --config "$root/config.json" --cache "$SMC4_DATA_ROOT" --output "$out" > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi
          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('research/candidate-09'); diag=root/'diagnostics/v4-gate'; out=root/'evidence/latest'
          codes={k.lower():int(os.environ[k]) for k in ('DOCTOR','COMPILE','TESTS','GATE')}
          failure=next((k for k,v in codes.items() if v),None)
          (diag/'diagnostic.json').write_text(json.dumps({
              'candidate_generation':'v4-post-acceptance-dual-resolution',
              'classification':'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes':codes,'first_failure':failure,
              'fixed_weeks_preserved':True,'parameter_search_performed':False,
              'structural_change':'accepted breach resolves only by trapped-breakout failure or defended-retest re-expansion',
              'run_id':os.environ.get('GITHUB_RUN_ID'),'trigger_sha':os.environ.get('GITHUB_SHA')
          },indent=2,sort_keys=True)+'\n')
          if not (out/'summary.json').exists():
              (out/'summary.json').write_text(json.dumps({'candidate':'candidate-09-v4','status':'IMPLEMENTATION_ERROR','first_failure':failure,'codes':codes},indent=2,sort_keys=True)+'\n')
          for p in diag.glob('*.log'):
              lines=p.read_text(errors='replace').splitlines(); p.write_text('\n'.join(lines[-1400:])+('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v4 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v4-gate-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v4-gate
            research/candidate-09/archive/v3
            research/candidate-09/config.json
            research/candidate-09/state_engine.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
          if-no-files-found: error
          retention-days: 30

      - name: Commit v4 source, archive, and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v4: frozen gate result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
