name: Astra3 liquidity-response research
on:
  push:
    branches: [research_candidate_ML_easychart_astra3]
    paths:
      - research/candidate-ml-easychart-astra3/**
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: astra3-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply requested source edit
        run: |
          if [ -f research/candidate-ml-easychart-astra3/edit.py ]; then
            python research/candidate-ml-easychart-astra3/edit.py
          fi
      - uses: actions/download-artifact@v4
        with:
          name: astra-inputs
          run-id: 33909899122
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: astra2-extended-market
          run-id: 33913126904
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: astra2-micro-*
          merge-multiple: true
          run-id: 33916611253
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@v4
        with:
          path: astra3_cache
          key: astra3-plans-${{ hashFiles('research/candidate-ml-easychart-astra3/*policy.py') }}
      - name: Run source-led decision research
        run: |
          tar -xzf astra-inputs.tar.gz
          tar -xzf astra2-extended-market.tar.gz
          for archive in micro-*.tar.gz; do tar -xzf "$archive"; done
          python -m pip install --no-index --find-links bundle/wheels nautilus_trader==1.230.0 numpy==2.3.5 pandas==2.3.3
          python -m pip install scikit-learn==1.7.2 lightgbm==4.6.0
          python -m compileall -q research/candidate-ml-easychart-astra3
          mkdir -p research_results/candidate_ml_easychart_astra3
          set -o pipefail
          python -u research/candidate-ml-easychart-astra3/research.py 2>&1 | tee research_results/candidate_ml_easychart_astra3/console.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: astra3_cache
          key: astra3-plans-${{ hashFiles('research/candidate-ml-easychart-astra3/*policy.py') }}
      - name: Preserve actual source and experiment results
        if: always()
        run: |
          git config user.name 'astra3-research'
          git config user.email 'astra3-research@users.noreply.github.com'
          git add -A research/candidate-ml-easychart-astra3
          git add -f research_results/candidate_ml_easychart_astra3
          if ! git diff --cached --quiet; then
            git commit -m "Astra3 source and actual experiment results for ${{ github.sha }} [skip ci]"
            git pull --rebase origin research_candidate_ML_easychart_astra3
            git push origin HEAD:research_candidate_ML_easychart_astra3
          fi
