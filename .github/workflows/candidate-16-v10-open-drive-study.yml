name: candidate-16-v10-external-open-drive-study

on:
  push:
    branches: ["research/candidate-16-v10-open-drive-auction"]
    paths:
      - "research/candidate-16/v10_open_drive_study.py"
      - "research/candidate-16/v10_open_drive_study_v2.py"
      - "research/candidate-16/tests/test_v10_open_drive_study.py"
      - ".github/workflows/candidate-16-v10-open-drive-study.yml"
  workflow_dispatch:

concurrency:
  group: candidate-16-v10-external-open-drive-study
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  development-and-conditional-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-16
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-16-v10-open-drive-study
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and focused policy contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-16/v9_liquidation_event_study.py \
            research/candidate-16/v10_open_drive_study.py \
            research/candidate-16/v10_open_drive_study_v2.py
          python -m unittest discover \
            -s research/candidate-16/tests \
            -p 'test_v10_open_drive_study.py' -v
          python - <<'PY'
          from v10_open_drive_study_v2 import safe_enforce_one_global_slot
          selected, conflicts = safe_enforce_one_global_slot([], {})
          if selected or conflicts:
              raise SystemExit("empty global slot sentinel failed")
          PY

      - name: Run checksum-verified 2023 development and conditional 2024 holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-16/v10_open_drive_study_v2.py \
            --cache .cache/candidate-16-v10-open-drive \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify frozen decision and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/study.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          study = json.loads((root / "study.json").read_text())
          if study.get("role") != "mechanism and geometry study; no fills, account, portfolio, or NAV claim":
              raise SystemExit("study role drifted")
          if set(study.get("data", {}).get("symbols", [])) != {"BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"}:
              raise SystemExit("symbol set drifted")
          if study.get("data", {}).get("years") != [2023, 2024]:
              raise SystemExit("development/holdout years drifted")
          geometry = study.get("cost_and_geometry", {})
          if abs(float(geometry.get("round_trip_cost_rate", -1.0)) - 0.002) > 1e-12:
              raise SystemExit("cost screen drifted")
          if float(geometry.get("minimum_target_net_r", -1.0)) != 1.0:
              raise SystemExit("target geometry drifted")
          if int(geometry.get("global_entry_or_position_slot", 99)) != 1:
              raise SystemExit("global slot contract drifted")
          sentinel = study.get("empty_global_slot_sentinel", {})
          if sentinel.get("representation") != "None until first accepted candidate" or sentinel.get("economic_logic_changed"):
              raise SystemExit("empty-slot sentinel contract failed")
          development = study.get("development", {})
          holdout = study.get("holdout", {})
          if not development.get("passed") and holdout.get("opened"):
              raise SystemExit("holdout was opened after development failed")
          print(json.dumps({
              "decision": study["decision"],
              "promote": study["promote"],
              "funnel": study["funnel"],
              "development": development,
              "holdout": holdout,
              "global_slot_conflicts_skipped": study["global_slot_conflicts_skipped"],
          }, indent=2, sort_keys=True))
          PY
          test -e "$ROOT/development_trades.csv"
          if python - <<'PY'
          import json,os
          from pathlib import Path
          study=json.loads((Path(os.environ['ROOT'])/'study.json').read_text())
          raise SystemExit(0 if study['holdout']['opened'] else 1)
          PY
          then
            test -e "$ROOT/holdout_trades.csv"
          else
            test ! -e "$ROOT/holdout_trades.csv"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-16-v10-open-drive-study-${{ github.sha }}
          path: artifacts/candidate-16-v10-open-drive-study/**
          if-no-files-found: warn
          retention-days: 90
