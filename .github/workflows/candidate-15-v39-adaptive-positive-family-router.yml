name: Candidate 15 V39 adaptive positive-family router

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v39-adaptive-positive-family-router.json"
      - "research/candidate-15/diagnose_v39_adaptive_positive_family_router.py"
      - ".github/workflows/candidate-15-v39-adaptive-positive-family-router.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v39-adaptive-positive-family-router-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment, source streams and causal contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile research/candidate-15/diagnose_v39_adaptive_positive_family_router.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path(
              'research/candidate-15/protocol-v39-adaptive-positive-family-router.json'
          ).read_text())
          assert p['schema'] == 'candidate-15-v39-adaptive-positive-family-router-v1'
          assert p['causal_router']['global_position_limit'] == 1
          assert p['causal_router']['OI_POSITION_BUILDUP']['short_lookback_days'] == 90
          assert p['causal_router']['OI_POSITION_BUILDUP']['long_lookback_days'] == 180
          assert p['causal_router']['OI_POSITION_BUILDUP']['minimum_matured_events_short'] == 20
          assert p['causal_router']['OI_POSITION_BUILDUP']['minimum_matured_events_long'] == 40
          assert p['precondition']['run_only_when_any_advance_to_nautilus_is_false'] is True
          PY

      - name: Run adaptive family router
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-15/diagnose_v39_adaptive_positive_family_router.py \
            --protocol research/candidate-15/protocol-v39-adaptive-positive-family-router.json \
            --output research/candidate-15/v39/adaptive_positive_family_router/results

      - name: Verify causal activation and global chronology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path('research/candidate-15/v39/adaptive_positive_family_router/results')
          summary = json.loads((root / 'summary.json').read_text())
          if summary['classification'] == 'V39_SKIPPED_EXISTING_NAUTILUS_ADVANCE':
              assert summary['existing_advance_versions']
              raise SystemExit(0)
          def read(path):
              try:
                  return pd.read_csv(path)
              except EmptyDataError:
                  return pd.DataFrame()
          active = read(root / 'active_oi_proposals.csv')
          if len(active.index):
              assert (active['short_history_events'].astype(int) >= 20).all()
              assert (active['long_history_events'].astype(int) >= 40).all()
              assert (active['short_history_mean_net_bps'].astype(float) >= 0.0).all()
              assert (active['long_history_mean_net_bps'].astype(float) >= 0.0).all()
              assert (active['short_history_win_rate'].astype(float) >= 0.5).all()
          selected = read(root / 'selected_integrated_trades.csv')
          if len(selected.index) > 1:
              opened = pd.to_datetime(selected['entry_ts'], utc=True)
              closed = pd.to_datetime(selected['exit_ts'], utc=True)
              assert (
                  opened.iloc[1:].reset_index(drop=True)
                  >= closed.iloc[:-1].reset_index(drop=True)
              ).all()
              assert not selected.duplicated(['family', 'symbol', 'entry_ts']).any()
          PY

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v39/adaptive_positive_family_router/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V39_ADAPTIVE_POSITIVE_FAMILY_ROUTER_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v39-bot
          git config user.email candidate-15-v39-bot@users.noreply.github.com
          git add \
            research/candidate-15/V39_ADAPTIVE_POSITIVE_FAMILY_ROUTER_RESULT.md \
            research/candidate-15/v39/adaptive_positive_family_router/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v39: persist adaptive family-router result [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v39-adaptive-positive-family-router-${{ github.run_id }}
          path: |
            research/candidate-15/V39_ADAPTIVE_POSITIVE_FAMILY_ROUTER_RESULT.md
            research/candidate-15/v39/adaptive_positive_family_router/results
          if-no-files-found: warn
          retention-days: 30
