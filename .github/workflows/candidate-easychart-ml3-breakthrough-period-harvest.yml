name: candidate-easychart-ml3-breakthrough-period-harvest

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/candidate-easychart-ml3-breakthrough-period-harvest.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  locate-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish run locator
        run: |
          set -euo pipefail
          mkdir -p research/_run_locators
          printf '%s\n' '${{ github.run_id }}' > research/_run_locators/ML3_PERIOD_HARVEST_RUN_ID
          printf '%s\n' '${{ github.sha }}' > research/_run_locators/ML3_PERIOD_HARVEST_SHA
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_run_locators/ML3_PERIOD_HARVEST_RUN_ID research/_run_locators/ML3_PERIOD_HARVEST_SHA
          git commit -m "chore(research): publish ML3 period-harvest locator [skip ci]"
          git push origin HEAD:research_ML3

  harvest:
    needs: locate-run
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2024-03
            start: 2024-02-26
            end: 2024-03-01
          - label: 2024-08
            start: 2024-08-02
            end: 2024-08-06
          - label: 2024-11
            start: 2024-11-04
            end: 2024-11-08
          - label: 2025-03
            start: 2025-02-25
            end: 2025-03-01
          - label: 2025-05
            start: 2025-05-12
            end: 2025-05-16
          - label: 2025-11
            start: 2025-11-10
            end: 2025-11-14
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_ml3_breakthrough:research/candidate-easychart_ml3v3:research/candidate-easychart_ml3v2:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-ml3-breakthrough/period-${{ matrix.label }}
      OUT: artifacts/candidate-easychart-ml3-breakthrough/period-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Harvest complete intrinsic-auction plans and paths
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_ml3_breakthrough/run_mtf_backtest_breakthrough_shadow.py \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/shadow.log"
          python research/candidate-easychart_ml3v2/harvest_ml1.py \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/harvest.log"
          python research/candidate-easychart_ml3v3/build_ml3v3_dataset.py --run-output "$OUT" \
            2>&1 | tee "$OUT/build_dataset.log"
          python research/candidate-easychart_ml3_breakthrough/summarize_intrinsic_run.py --run-output "$OUT" \
            2>&1 | tee "$OUT/summary.log"
          test -s "$OUT/intrinsic_run_summary.json"
          test -s "$OUT/ml3v3_dataset.csv"
      - name: Preserve period evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml3-period-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/candidate-easychart-ml3-breakthrough/period-${{ matrix.label }}/
          if-no-files-found: warn
          retention-days: 14
