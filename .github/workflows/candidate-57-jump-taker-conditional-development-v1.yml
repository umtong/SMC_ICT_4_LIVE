name: candidate-57-jump-taker-conditional-development-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-jump-taker-conditional-development-v1.yml"
      - "research/candidate-57/jump_taker_conditional_development_v1.py"
      - "research/candidate-57/jump_state_arbitration_router.py"
      - "research/candidate-57/jump_state_arbitration_forensic_strategy.py"
      - "research/candidate-57/jump_taker_alignment_fresh_campaign.py"
      - "research/candidate-57/download_binance_metrics_sidecar.py"
      - "research/candidate-57/jump_episode_forensic_strategy.py"
      - "research/candidate-57/jump_episode_forensic_analyze.py"
      - "research/candidate-57/forensic_sources/jump_transient_v3/**"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-jump-taker-conditional-development-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble source jump and state-conditional arbitration
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/router_jump_transient.py research/candidate-51/router_jump_base.py
          cp research/candidate-57/jump_state_arbitration_router.py research/candidate-51/router.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/strategy_jump_transient.py research/candidate-51/strategy_jump_transient.py
          cp research/candidate-57/jump_episode_forensic_strategy.py research/candidate-51/strategy_jump_audit_base.py
          cp research/candidate-57/jump_state_arbitration_forensic_strategy.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_audit_base.py \
            research/candidate-57/jump_taker_conditional_development_v1.py

      - name: Install locked environment and prove conditional state contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          import os
          import router

          os.environ["C57_JUMP_ARBITRATION_MODE"] = "taker_conditional"
          assert router.arbitration_mode() == "taker_conditional"
          source = inspect.getsource(router._effective_arbitration)
          assert "aligned_peers >= 3" in source
          assert 'return "source_max_z"' in source
          assert 'return "least_qualifying_z"' in source
          print("peer-taker conditional arbitration contract verified")
          PY

      - name: Replay conditional policy on consumed factorial interval
        id: replay
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-jump-taker-conditional-development-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51 \
            uv run python research/candidate-57/jump_taker_conditional_development_v1.py \
            2>&1 | tee .work/candidate-57-jump-taker-conditional-development-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact development evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            research/candidate-51/launch.py \
            research/candidate-51/router.py \
            research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_audit_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/jump-taker-conditional-development-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate57: persist taker-conditional jump development replay"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload development replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-jump-taker-conditional-development-v1
          path: |
            research/candidate-57/evidence/jump-taker-conditional-development-v1
            .work/candidate-57-jump-taker-conditional-development-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics only
        if: always()
        shell: bash
        run: |
          status="${{ steps.replay.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "conditional development replay failed; status=$status"
            exit "${status:-1}"
          fi
