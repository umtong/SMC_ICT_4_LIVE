name: candidate-05-v47-direct-rerun

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v47-direct-rerun.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v47-direct-rerun
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  development-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: research/candidate-05
      ROOT: artifacts/candidate-05-v47-direct-rerun
    steps:
      - uses: actions/checkout@v4

      - name: Verify repaired route and evidence idempotency
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover -s research/candidate-05/tests -p 'test_shared_account_v47_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v47_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_order_failure_idempotency_contract.py' -v

      - name: Run frozen v47 in one shared Nautilus account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/evidence"
          cat > "$ROOT/evidence/v47.json" <<'JSON'
          {
            "classification": "VALIDATED_BTC_WINNER_RESOLVED",
            "winner": "strategy_v47_relative_value:RelativeValueDislocationStrategy",
            "experiment_role": "FROZEN_RELATIVE_VALUE_DEVELOPMENT_SCREEN"
          }
          JSON
          python research/candidate-05/shared_account_backtest_v47.py \
            --winner-evidence "$ROOT/evidence/v47.json" \
            --build-start 2024-02-28 \
            --build-end 2024-03-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-03-30 \
            --cache .cache/candidate-05-v47-direct-rerun \
            --output "$ROOT/development" \
            | tee "$ROOT/console.json"

      - name: Attribute v47 incremental branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s "$ROOT/development/metrics.json"; then
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["ROOT"]) / "development"
          metrics = json.loads((root / "metrics.json").read_text())
          scenario_ids = set()
          for path in root.rglob("scenario_events.jsonl"):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if (event.get("details") or {}).get("branch") == "RELATIVE_VALUE_REJECTION":
                      scenario_ids.add(str(event.get("scenario_id")))
          pnls = []
          for path in root.rglob("closed_scenarios.json"):
              for item in json.loads(path.read_text()):
                  if str(item.get("scenario_id")) not in scenario_ids:
                      continue
                  try:
                      pnls.append(float(str(item.get("realized_pnl")).split()[0].replace(",", "")))
                  except Exception:
                      pass
          integrity = (
              bool(metrics.get("integrity_pass"))
              and int(metrics.get("liquidations", 0)) == 0
              and int(metrics.get("order_rejections", 0)) == 0
              and int(metrics.get("order_denials", 0)) == 0
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          branch = {
              "trades": len(pnls),
              "wins": sum(value > 0.0 for value in pnls),
              "net_pnl_usdt": sum(pnls),
              "pnls_usdt": pnls,
              "scenario_ids": sorted(scenario_ids),
          }
          promote = (
              integrity
              and branch["trades"] >= 3
              and branch["net_pnl_usdt"] > 0.0
              and float(metrics.get("total_return", -1.0)) > 0.0
          )
          result = {
              "schema": "candidate-05-v47-direct-rerun-v1",
              "classification": "V47_PROMOTE_UNTOUCHED" if promote else "V47_DISCARD_DEVELOPMENT",
              "promote": promote,
              "integrity_pass": integrity,
              "metrics": metrics,
              "incremental_branch": branch,
          }
          (Path(os.environ["ROOT"]) / "v47_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v47-direct-rerun-${{ github.sha }}
          path: artifacts/candidate-05-v47-direct-rerun/**
          if-no-files-found: warn
          retention-days: 90
