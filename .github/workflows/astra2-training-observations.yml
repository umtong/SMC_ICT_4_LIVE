name: Astra2 earlier training observations
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths: [.github/workflows/astra2-training-observations.yml]
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ['2024', '2025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reuse archive downloader for pre-evaluation training history
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, sys
          from pathlib import Path
          sys.path.insert(0,'research/candidate-ml-easychart-astra2')
          import download_inputs as source
          year=os.environ['YEAR']
          months=([1,2,4,5,6,7,9,10,11,12] if year=='2024' else [1,3,4,5,6,7])
          source.MONTHS=tuple(f'{year}-{m:02d}' for m in months)
          root=Path('training_market')
          jobs=list(source.jobs(root,False))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(source.download,jobs))
          root.mkdir(exist_ok=True)
          (root/'archives.json').write_text(json.dumps(results,indent=2)+'\n')
          errors=[r for r in results if 'error' in r]
          print(f'{len(results)-len(errors)}/{len(results)} downloaded')
          for r in errors: print(r['url'],r['error'])
          if errors: raise RuntimeError('Missing training archives; never silently substitute observations')
          PY
          tar -czf training-${{ matrix.year }}.tar.gz training_market
      - uses: actions/upload-artifact@v4
        with:
          name: astra2-training-${{ matrix.year }}
          path: training-${{ matrix.year }}.tar.gz
          compression-level: 0
          retention-days: 30
