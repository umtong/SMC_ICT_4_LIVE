name: candidate-09-lrae-research

on:
  push:
    branches:
      - research/candidate-09
    paths:
      - "research/candidate-09/**"
      - ".github/workflows/candidate-09.yml"
      - "src/smc_ict_4/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  frozen-btc-weeks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Apply controlled multi-engine logging fix
        id: logging_fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-09/backtest.py")
          source = path.read_text(encoding="utf-8")
          old = 'logging=LoggingConfig(log_level=str(config.get("nautilus_log_level", "ERROR"))),'
          new = 'logging=LoggingConfig(bypass_logging=True),'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          if ! git diff --quiet -- research/candidate-09/backtest.py; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/candidate-09/backtest.py
            git commit -m "fix(candidate-09): bypass repeated engine logger initialization"
            git push origin HEAD:research/candidate-09
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify pinned NautilusTrader environment
        if: steps.logging_fix.outputs.applied != 'true'
        run: smc4 doctor

      - name: Compile candidate
        if: steps.logging_fix.outputs.applied != 'true'
        run: python -m compileall -q research/candidate-09

      - name: Candidate causal and risk tests
        if: steps.logging_fix.outputs.applied != 'true'
        run: python -m unittest discover -s research/candidate-09/tests -p 'test_*.py' -v

      - name: Verify adapter contracts
        if: steps.logging_fix.outputs.applied != 'true'
        run: |
          grep -F '"duration_ns": _as_int_ns(event.duration_ns),' research/candidate-09/strategy.py
          ! grep -F '"duration_ns": _as_int_ns(event.duration),' research/candidate-09/strategy.py
          grep -F 'logging=LoggingConfig(bypass_logging=True),' research/candidate-09/backtest.py

      - name: Run frozen three-week protocol and one-variable ablation
        if: steps.logging_fix.outputs.applied != 'true'
        run: |
          python research/candidate-09/run_research.py \
            --config research/candidate-09/config.json \
            --output artifacts/candidate-09

      - name: Show decision
        if: always() && steps.logging_fix.outputs.applied != 'true'
        run: |
          test -f artifacts/candidate-09/SUMMARY.md && cat artifacts/candidate-09/SUMMARY.md || true
          test -f artifacts/candidate-09/decision.json && cat artifacts/candidate-09/decision.json || true

      - name: Preserve complete reproducible evidence
        if: always() && steps.logging_fix.outputs.applied != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-evidence-${{ github.sha }}
          path: artifacts/candidate-09
          if-no-files-found: error
          retention-days: 30
