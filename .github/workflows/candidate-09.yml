name: candidate-09-v0.1-lrae-archived

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  frozen-btc-weeks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - run: smc4 doctor
      - run: python -m compileall -q research/candidate-09
      - run: python -m unittest discover -s research/candidate-09/tests -p 'test_*.py' -v
      - run: |
          python research/candidate-09/run_research.py \
            --config research/candidate-09/config.json \
            --output artifacts/candidate-09
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v0.1-evidence-${{ github.sha }}
          path: artifacts/candidate-09
          if-no-files-found: error
          retention-days: 30
