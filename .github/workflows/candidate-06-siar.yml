name: Candidate 06 Surprise-Impact Acceptance Relay

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-siar.yml"
      - "research/candidate-06/siar_payload.part-*"
      - "research/candidate-06/surprise_impact_core.py"
      - "research/candidate-06/surprise_impact_hierarchical_engine.py"
      - "research/candidate-06/register_surprise_impact_engine.py"
      - "research/candidate-06/test_surprise_impact_core.py"
      - "research/candidate-06/test_surprise_impact_hierarchical_engine.py"
      - "research/candidate-06/run_surprise_impact_matrix.py"
      - "research/candidate-06/SIAR_RESEARCH_LEDGER.md"
      - "research/candidate-06/nautilus_strategy.py"
      - "src/smc_ict_4/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-surprise-impact-acceptance
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  siar-campaign:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and verify reviewed SIAR source payload
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat research/candidate-06/siar_payload.part-* > /tmp/siar_payload.b64
          base64 -d /tmp/siar_payload.b64 > /tmp/siar_payload.tar.gz
          printf '%s  %s\n' 'f94cc97ec84d896d68269ebf1cbc32c2fde5138d16ea199bf3f366708a614aa1' '/tmp/siar_payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/siar_payload.tar.gz

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Register SIAR in existing strategy selector
        run: |
          set -euo pipefail
          python research/candidate-06/register_surprise_impact_engine.py
          grep -q 'SURPRISE_IMPACT_HIERARCHICAL' research/candidate-06/nautilus_strategy.py

      - name: Verify SIAR causality and unchanged parent contracts
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_surprise_impact_core.py
          python research/candidate-06/test_surprise_impact_hierarchical_engine.py
          python research/candidate-06/test_adaptive_fresh_core.py
          python research/candidate-06/test_adaptive_fresh_hierarchical_engine.py
          python research/candidate-06/test_hierarchical_flow_factor_engine.py
          python research/candidate-06/test_hierarchical_multi_liquidity_engine.py
          python research/candidate-06/test_excursion_diagnostics.py

      - name: Run SIAR first-week matrix and unchanged sealed weeks through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/siar-first-week
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_surprise_impact_matrix.py \
            --output artifacts/candidate-06/siar-first-week \
            > artifacts/candidate-06-siar.stdout \
            2> artifacts/candidate-06-siar.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-06/siar-first-week
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > artifacts/candidate-06/siar-first-week/workflow_exit_code.txt
          if [ ! -f artifacts/candidate-06/siar-first-week/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-06/siar-first-week")
          payload = {
              "all_three_weeks_passed": False,
              "long_evaluation_authorized": False,
              "selected": None,
              "terminal_status": "IMPLEMENTATION_OR_RUNTIME_FAILURE_BEFORE_SUMMARY",
          }
          (root / "summary.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
          cp artifacts/candidate-06-siar.stdout artifacts/candidate-06/siar-first-week/workflow_stdout.txt 2>/dev/null || true
          cp artifacts/candidate-06-siar.stderr artifacts/candidate-06/siar-first-week/workflow_stderr.txt 2>/dev/null || true

      - name: Commit reproducible SIAR source and evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          for path in \
            research/candidate-06/surprise_impact_core.py \
            research/candidate-06/surprise_impact_hierarchical_engine.py \
            research/candidate-06/register_surprise_impact_engine.py \
            research/candidate-06/test_surprise_impact_core.py \
            research/candidate-06/test_surprise_impact_hierarchical_engine.py \
            research/candidate-06/run_surprise_impact_matrix.py \
            research/candidate-06/SIAR_RESEARCH_LEDGER.md \
            research/candidate-06/nautilus_strategy.py; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          git add -f artifacts/candidate-06/siar-first-week
          if [ -f research/candidate-06/config.siar.locked.json ]; then
            git add -f research/candidate-06/config.siar.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 SIAR evidence [candidate-06 evidence]"
          git push origin HEAD:research/candidate-06

      - name: Upload SIAR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-siar-${{ github.sha }}
          path: artifacts/candidate-06/siar-first-week
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce staged decision
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
