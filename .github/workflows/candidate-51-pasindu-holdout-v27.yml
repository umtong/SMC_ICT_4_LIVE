name: candidate-51-pasindu-holdout-v27

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-pasindu-holdout-v27.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-51-pasindu-holdout-v27
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1

      - name: Materialize frozen Pasindu flip-only policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_pasindu_supertrend_diagnostic_v25.py research/candidate-51/router.py
          cp research/candidate-51/strategy_pasindu_supertrend.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51

      - name: Freeze untouched holdout configuration
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=json.loads(Path('research/candidate-51/config.json').read_text())
          for key in ('sma_offset_low','sma_offset_high','sma_stop_min_fraction','sma_stop_max_fraction','sma_stop_atr_buffer'):
              base['strategy'].pop(key,None)
          frozen={
              'feature_max_age_seconds':65.0,'cooldown_minutes':0,
              'max_hold_minutes':525600,'funding_flatten_minute':60,
              'funding_blackout_before_minutes':-1,'funding_blackout_after_minutes':-1,
              'pasindu_mode':'flip_only','pasindu_supertrend_period':8,
              'pasindu_supertrend_multiplier':2.0,'pasindu_adx_period':14,
              'pasindu_adx_min':18.0,'pasindu_confidence_min':45.0,
              'pasindu_established_4h_bars':3,'pasindu_continuation_lookback_1h':8,
              'pasindu_trail_activate_atr':2.0,'pasindu_trail_distance_atr':2.5,
          }
          base['strategy'].update(frozen)
          work=Path('.work/candidate-51-pasindu-holdout-v27'); work.mkdir(parents=True,exist_ok=True)
          (work/'config.json').write_text(json.dumps(base,indent=2,sort_keys=True)+'\n')
          manifest={
              'candidate':'pasindu-live-effective-supertrend8x2-flip-only',
              'policy_frozen_from_development_commit':'54165db1380731060fc3397cce4008f3e1049918',
              'development_evaluation':['2025-01-01','2025-03-31'],
              'untouched_holdout_evaluation':['2025-04-01','2025-06-30'],
              'warmup_start':'2025-03-01','external_source':'PasinduUpendra/Binance-Futures-Trading',
              'engine':'NautilusTrader BacktestNode','risk_fraction':0.03,
              'global_position_limit':1,'frozen_parameters':frozen,
              'router_sha256':hashlib.sha256(Path('research/candidate-51/router.py').read_bytes()).hexdigest(),
              'strategy_sha256':hashlib.sha256(Path('research/candidate-51/strategy.py').read_bytes()).hexdigest(),
          }
          (work/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Run untouched ninety-one-day continuous holdout
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/candidate-51/pasindu-holdout-v27
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch_kline_only_warmup.py \
            --config .work/candidate-51-pasindu-holdout-v27/config.json \
            --data-start 2025-03-01 --start 2025-04-01 --end 2025-06-30 \
            --cache .cache/candidate-51-pasindu-holdout-v27 \
            --output artifacts/candidate-51/pasindu-holdout-v27/run \
            --workspace .work/candidate-51-pasindu-holdout-v27/run
          echo $? > .work/candidate-51-pasindu-holdout-v27/exit.txt
          exit 0

      - name: Classify holdout
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('artifacts/candidate-51/pasindu-holdout-v27/run')
          out=Path('artifacts/candidate-51/pasindu-holdout-v27/VERDICT.json')
          required=[root/'metrics.json',root/'strategy_diagnostics.json',root/'closed_scenarios.json']
          if not all(p.is_file() for p in required):
              result={'classification':'IMPLEMENTATION_BLOCKED','exit_code':int(Path('.work/candidate-51-pasindu-holdout-v27/exit.txt').read_text())}
          else:
              m=json.loads(required[0].read_text()); d=json.loads(required[1].read_text()); scenarios=json.loads(required[2].read_text())
              def num(x):
                  z=re.search(r'[-+]?\d+(?:\.\d+)?',str(x).replace('_','').replace(',',''))
                  return float(z.group()) if z else 0.0
              valid=[x for x in scenarios if bool(x.get('actual_fill_risk_valid'))]
              pnls=[num(x.get('realized_pnl')) for x in valid]
              gp=sum(x for x in pnls if x>0); gl=-sum(x for x in pnls if x<0)
              clean=(int(d.get('order_rejections') or 0)==0 and int(d.get('global_position_violations') or 0)==0 and int(d.get('max_open_positions_observed') or 0)<=1 and int(d.get('fill_beyond_bracket_invalidations') or 0)==0)
              positive=clean and int(m.get('trades') or 0)>=15 and float(m.get('expectancy_usdt') or 0)>0 and float(m.get('geometric_daily_growth') or 0)>0 and float(m.get('profit_factor') or 0)>1 and float(m.get('max_drawdown') or 1)<=0.25 and sum(pnls)>0
              result={
                  'classification':'UNTOUCHED_POSITIVE' if positive else ('IMPLEMENTATION_OR_FILL_CONTAMINATED' if not clean else 'UNTOUCHED_NEGATIVE_OR_WEAK'),
                  'metrics':{k:m.get(k) for k in ('trades','ending_nav','total_return','geometric_daily_growth','profit_factor','expectancy_usdt','win_rate','max_drawdown','gate_pass','rolling_windows')},
                  'valid_fill_only':{'trades':len(pnls),'wins':sum(x>0 for x in pnls),'losses':sum(x<0 for x in pnls),'sum_realized_pnl_usdt':sum(pnls),'expectancy_usdt':sum(pnls)/len(pnls) if pnls else 0.0,'profit_factor':gp/gl if gl else None},
                  'diagnostics':{k:d.get(k) for k in ('entry_submissions','fill_invalidations','fill_risk_budget_invalidations','order_rejections','global_position_violations','max_open_positions_observed','pasindu_source_candidates','pasindu_management_exits','selected_symbols','unresolved_reason_counts')},
              }
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-51-pasindu-holdout-v27-${{ github.sha }}
          path: |
            artifacts/candidate-51/pasindu-holdout-v27
            .work/candidate-51-pasindu-holdout-v27/manifest.json
            .work/candidate-51-pasindu-holdout-v27/exit.txt
          if-no-files-found: warn
          retention-days: 30
