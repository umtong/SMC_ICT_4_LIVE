name: Candidate 11 positioning-aware regional router

on:
  push:
    branches: ["research/candidate-11"]
    paths:
      - "research/candidate-11/positioning_regional_router_v1/**"
      - ".github/workflows/candidate-11-positioning-regional-router-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-11-positioning-regional-router-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CAND: research/candidate-11/positioning_regional_router_v1
      REGIONAL: research/candidate-11/regional_spot_perp_router_v1
      SPOT: research/candidate-11/spot_perp_session_router_v1
      VENDOR: vendor/candidate16
      CACHE: .cache/candidate-11-positioning-regional-router-v1
      OUT: artifacts/candidate-11-positioning-regional-router-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: af82ebc64e05aeaf2704eeb3af0709cdbf4c77c2
          path: vendor/candidate16
          fetch-depth: 1

      - name: Verify runtime and information-role separation
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python research/candidate-11/liquidity_state_router_v1/patch_features_v4.py "$VENDOR/research/candidate-16/features_v4.py"
          python research/candidate-11/session_auction_l1_router_v1/patch_vendor.py "$VENDOR"
          python -m compileall -q "$CAND" "$REGIONAL" "$SPOT" "$VENDOR/research/candidate-05" "$VENDOR/research/candidate-16"
          grep -F 'new_risk_price_discovery' "$CAND/positioning_strategy.py"
          grep -F 'forced_position_closure' "$CAND/positioning_strategy.py"
          grep -F 'verified Candidate 05 positioning contract drifted' "$CAND/positioning_features.py"

      - name: Run 42-day continuous development account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/DEVELOPMENT"
          export PYTHONPATH="$GITHUB_WORKSPACE/$CAND:$GITHUB_WORKSPACE/$REGIONAL:$GITHUB_WORKSPACE/$SPOT:$GITHUB_WORKSPACE/$VENDOR/research/candidate-16:$GITHUB_WORKSPACE/$VENDOR/research/candidate-05:$GITHUB_WORKSPACE/$VENDOR/src"
          python "$CAND/candidate.py" \
            --config "$VENDOR/research/candidate-16/config_v4.json" \
            --build-start 2023-09-15 \
            --build-end 2023-10-29 \
            --evaluation-start 2023-09-18 \
            --evaluation-end 2023-10-29 \
            --cache "$CACHE/development" \
            --output "$OUT/DEVELOPMENT" \
            --validation-mode DEVELOPMENT \
            2>&1 | tee "$OUT/DEVELOPMENT/console.log"

      - name: Apply absolute development gate
        id: development
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ["OUT"])/"DEVELOPMENT"
          frame=pd.read_csv(root/"features.csv.gz")
          ready=frame["positioning_feature_ready"].fillna(False).astype(bool)
          if int(ready.sum()) <= 0:
              raise SystemExit("positioning information did not reach the strategy clock")
          print({"positioning_ready_rows": int(ready.sum())})
          PY
          python "$SPOT/audit_account.py" \
            --root "$OUT/DEVELOPMENT" \
            --output "$OUT/DEVELOPMENT_AUDIT.json" \
            --schema candidate-11-positioning-regional-development-v1 \
            --minimum-trades 20
          gate="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["gate_passed"]).lower())' "$OUT/DEVELOPMENT_AUDIT.json")"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Run source-frozen fresh account only after development success
        if: steps.development.outputs.gate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/FRESH"
          export PYTHONPATH="$GITHUB_WORKSPACE/$CAND:$GITHUB_WORKSPACE/$REGIONAL:$GITHUB_WORKSPACE/$SPOT:$GITHUB_WORKSPACE/$VENDOR/research/candidate-16:$GITHUB_WORKSPACE/$VENDOR/research/candidate-05:$GITHUB_WORKSPACE/$VENDOR/src"
          python "$CAND/candidate.py" \
            --config "$VENDOR/research/candidate-16/config_v4.json" \
            --build-start 2024-01-26 \
            --build-end 2024-02-25 \
            --evaluation-start 2024-01-29 \
            --evaluation-end 2024-02-25 \
            --cache "$CACHE/fresh" \
            --output "$OUT/FRESH" \
            --validation-mode FRESH_VALIDATION \
            2>&1 | tee "$OUT/FRESH/console.log"

      - name: Apply absolute fresh gate
        if: steps.development.outputs.gate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python "$SPOT/audit_account.py" \
            --root "$OUT/FRESH" \
            --output "$OUT/FRESH_AUDIT.json" \
            --schema candidate-11-positioning-regional-fresh-v1 \
            --minimum-trades 12

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-11-positioning-regional-router-v1-${{ github.sha }}
          path: artifacts/candidate-11-positioning-regional-router-v1/**
          if-no-files-found: warn
          retention-days: 90
