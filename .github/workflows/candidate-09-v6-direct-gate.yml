name: Candidate 09 v6 direct-source gate

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v6-direct-gate.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v6-direct-gate
  cancel-in-progress: false

jobs:
  activate-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Verify and activate direct v6 modules without transport reconstruction
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09

          echo "a09d18e827cdefd4f56404ce6b261c3510b36679424f2fcbbb47262959a64f08  $root/state_engine_v6_model.py" | sha256sum -c -
          echo "5e4e93caed2b79eb76aef6412dac8c0d976870c5e72bedcc0438f1a351e2d35e  $root/state_engine_v6_logic.py" | sha256sum -c -
          echo "dd24dc3e1fb3b1b12b635b2bab06626ffb590dbb23931e4648a2134857f2671e  $root/state_engine_v6_direct.py" | sha256sum -c -
          echo "5d28e8604c68faafed7765e4e846f1a52dbe168efb2786fe772dcedddc8f39af  $root/tests_v6_direct/test_state_engine.py" | sha256sum -c -
          echo "8a5a63d0409b4dd187795c08ba02ebcb25dc744c3db1c334400ab0c9ebd74a65  $root/config_v6.json" | sha256sum -c -

          cp "$root/state_engine_v6_direct.py" "$root/state_engine.py"
          cp "$root/config_v6.json" "$root/config.json"
          cp "$root/tests_v6_direct/test_state_engine.py" "$root/tests/test_state_engine.py"
          sed -i 's/from state_engine_v6_direct import (/from state_engine import (/' "$root/tests/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path

          path = Path('research/candidate-09/run.py')
          text = path.read_text(encoding='utf-8')
          old = '''ABLATIONS = (\n    "baseline",\n    "no-5m",\n    "with-240m",\n    "midpoint-target",\n)\n'''
          new = '''ABLATIONS = (\n    "baseline",\n    "no-regime",\n    "no-failure-retest",\n    "opposite-edge-target",\n)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('neither v5 nor v6 ablation contract is present')
              text = text.replace(old, new, 1)
          text = text.replace(
              'The structurally frozen v5 baseline and three',
              'The structurally frozen v6 baseline and three',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, contracts, identical frozen weeks, and gated long evaluation
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v6-direct-gate"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"

          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate \
              --config "$root/config.json" \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" \
              --auto-long > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi

          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('research/candidate-09')
          diag = root / 'diagnostics/v6-direct-gate'
          out = root / 'evidence/latest'
          codes = {key.lower(): int(os.environ[key]) for key in ('DOCTOR', 'COMPILE', 'TESTS', 'GATE')}
          failure = next((name for name, value in codes.items() if value != 0), None)
          payload = {
              'candidate_generation': 'v6-regime-aligned-failure-retest',
              'classification': 'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes': codes,
              'first_failure': failure,
              'fixed_weeks_preserved': True,
              'strategy_parameters_preserved': True,
              'parameter_search_performed': False,
              'controlled_change': 'replace corrupted transport bootstrap with direct semantically identical v6 modules',
              'source_sha256': {
                  'model': 'a09d18e827cdefd4f56404ce6b261c3510b36679424f2fcbbb47262959a64f08',
                  'logic': '5e4e93caed2b79eb76aef6412dac8c0d976870c5e72bedcc0438f1a351e2d35e',
                  'public_api': 'dd24dc3e1fb3b1b12b635b2bab06626ffb590dbb23931e4648a2134857f2671e',
                  'config': '8a5a63d0409b4dd187795c08ba02ebcb25dc744c3db1c334400ab0c9ebd74a65',
                  'tests': '5d28e8604c68faafed7765e4e846f1a52dbe168efb2786fe772dcedddc8f39af',
              },
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
          }
          (diag / 'diagnostic.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          if not (out / 'summary.json').exists():
              (out / 'summary.json').write_text(json.dumps({
                  'candidate': 'candidate-09-v6',
                  'status': 'IMPLEMENTATION_ERROR',
                  'first_failure': failure,
                  'codes': codes,
              }, indent=2, sort_keys=True) + '\n')
          for path in diag.glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              path.write_text('\n'.join(lines[-2200:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v6-direct-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v6-direct-gate
            research/candidate-09/archive/v5
            research/candidate-09/config.json
            research/candidate-09/config_v6.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v6_model.py
            research/candidate-09/state_engine_v6_logic.py
            research/candidate-09/state_engine_v6_direct.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
            research/candidate-09/tests_v6_direct
          if-no-files-found: error
          retention-days: 30

      - name: Commit direct v6 source and exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v6: direct frozen result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
