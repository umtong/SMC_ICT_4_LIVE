name: candidate-53-monthly-bookticker-probe
on:
  push:
    branches: [research/candidate-53]
    paths:
      - 'research/candidate-53/probe_monthly_bookticker.py'
      - '.github/workflows/candidate-53-monthly-bookticker-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe monthly archives
        run: python research/candidate-53/probe_monthly_bookticker.py | tee monthly_bookticker_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-53-monthly-bookticker-probe-${{ github.sha }}
          path: monthly_bookticker_probe.json
