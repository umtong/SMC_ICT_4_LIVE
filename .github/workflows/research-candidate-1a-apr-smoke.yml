name: Candidate 1a April cross-asset smoke

on:
  workflow_dispatch:
  push:
    branches: ["research_candidate_1a"]
    paths: [".github/workflows/research-candidate-1a-apr-smoke.yml"]

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-1a:research/candidate-auction-episode-system:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_1a
      - run: |
          set -euo pipefail
          python research/candidate-1a/control_transfer_harvest.py \
            --start 2026-04-01 --end 2026-04-02 --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache .cache/candidate-1a-apr-smoke \
            --output artifacts/candidate-1a-apr-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-1a-apr-smoke
          path: artifacts/candidate-1a-apr-smoke/**
          if-no-files-found: error
          retention-days: 7
      - run: |
          set -euo pipefail
          DEST=research_results/candidate_1a/control_transfer_apr_smoke
          mkdir -p "$DEST"
          cp artifacts/candidate-1a-apr-smoke/summary.json "$DEST/summary.json"
          cat > "$DEST/status.json" <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "head_sha": "${{ github.sha }}",
            "status": "COMPLETED",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record candidate 1a April cross-asset smoke [skip ci]"
          git push origin HEAD:research_candidate_1a
