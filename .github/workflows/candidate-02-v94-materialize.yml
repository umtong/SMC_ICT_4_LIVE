name: candidate-02-v94-materialize

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-v94/payload.part*"
      - ".github/workflows/candidate-02-v94-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract exact prospective v94 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .candidate-02-v94/payload.part* | base64 -d > /tmp/v94payload.tar.gz
          echo '1aae197712e13a8bf2b2665f674e3738784995b17e80b01f262116c713ac8f26  /tmp/v94payload.tar.gz' | sha256sum -c -
          rm -rf /tmp/v94extract && mkdir -p /tmp/v94extract
          tar -xzf /tmp/v94payload.tar.gz -C /tmp/v94extract
          test -f /tmp/v94extract/research/candidate-02/v94_multilevel_common_breakout_core.py
          test -f /tmp/v94extract/research/candidate-02/v94_nt_backtest.py
          test -f /tmp/v94extract/research/candidate-02/v94_base_config.json
          test -f /tmp/v94extract/research/candidate-02/v94_multilevel_common_breakout_lock.json
          python -m py_compile /tmp/v94extract/research/candidate-02/v94_multilevel_common_breakout_core.py /tmp/v94extract/research/candidate-02/v94_nt_backtest.py
          python -m json.tool /tmp/v94extract/research/candidate-02/v94_base_config.json >/dev/null
          python -m json.tool /tmp/v94extract/research/candidate-02/v94_multilevel_common_breakout_lock.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v94extract/research/candidate-02')
          lock=json.loads((root/'v94_multilevel_common_breakout_lock.json').read_text())
          cfg=json.loads((root/'v94_base_config.json').read_text())
          assert lock['status']=='LOCKED_BEFORE_FIRST_WEEK_COLLECTION'
          assert lock['first_week']['start_utc']=='2025-11-03T00:00:00Z'
          assert lock['first_week']['raw_data_status_at_lock']=='NOT_COLLECTED_FOR_V94'
          assert float(lock['risk_fraction'])==0.03
          assert lock['custom_backtest_engine'] is False
          assert cfg['validation']['first_week_start']=='2025-11-03'
          assert float(cfg['risk']['risk_fraction'])==0.03
          assert cfg['risk']['maximum_notional_cap'] is None
          assert cfg['risk']['score_risk_multiplier'] is None
          PY
      - name: Commit readable non-workflow v94 sources atomically
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v94extract/research/candidate-02/v94_* research/candidate-02/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/candidate-02/v94_*
          git diff --cached --quiet && exit 0
          git commit -m 'research(candidate-02): materialize prospective v94 sources'
          git push origin HEAD:research/candidate-02
