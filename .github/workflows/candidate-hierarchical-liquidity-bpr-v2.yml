name: candidate-hierarchical-liquidity-bpr-v2

on:
  workflow_dispatch:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - "research/candidate-hierarchical-liquidity-bpr-v2/**"
      - "!research/candidate-hierarchical-liquidity-bpr-v2/.latest-run"
      - ".github/workflows/candidate-hierarchical-liquidity-bpr-v2.yml"

concurrency:
  group: candidate-hierarchical-liquidity-bpr-v2
  cancel-in-progress: true
permissions:
  contents: write
  packages: read
defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > research/candidate-hierarchical-liquidity-bpr-v2/.latest-run
          git add research/candidate-hierarchical-liquidity-bpr-v2/.latest-run; git commit -m "Record hierarchical BPR v2 run $GITHUB_RUN_ID" || true; git push origin HEAD:research_ML_thinking

  core-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python -m py_compile research/candidate-hierarchical-liquidity-bpr-v2/hierarchical_liquidity_bpr_v2.py research/candidate-hierarchical-liquidity-bpr-v2/run_research.py
          python - <<'PY'
          from hierarchical_liquidity_bpr_v2 import POLICY,TARGET_PIVOT_SPANS,MINIMUM_SOURCE_TIMEFRAME
          assert 5 in TARGET_PIVOT_SPANS and MINIMUM_SOURCE_TIMEFRAME==15
          assert 'FIRST_UNCONSUMED_OPPOSING_STRUCTURE' in POLICY
          print(POLICY)
          PY

  harvest:
    needs: core-check
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-hierarchical-liquidity-bpr-v2/${{ matrix.period }}
      OUT: artifacts/candidate-hierarchical-liquidity-bpr-v2/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - name: Harvest nearest-obstacle full-exit actions
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-hierarchical-liquidity-bpr-v2/run_research.py --start "$START" --end "$END" --warmup-days 45 --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$OUT"
      - name: Verify no obstacle skipping and executable geometry
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          frame=pd.read_csv(Path(os.environ['OUT'])/'hierarchical_v2_actions.csv')
          if frame.empty: raise RuntimeError('empty v2 action universe')
          if frame.action_id.duplicated().any() or frame.episode_id.duplicated().any(): raise RuntimeError('duplicate causal identity')
          if not frame.target_policy.eq('FIRST_UNCONSUMED_OPPOSING_STRUCTURE').all(): raise RuntimeError('wrong target policy')
          filled=frame[frame.fill_state.astype(str).str.startswith('FILLED')]
          if not (pd.to_numeric(filled.fill_time_ns)>pd.to_numeric(filled.emission_time_ns)).all(): raise RuntimeError('noncausal entry')
          geometry=((frame.side=='LONG')&(frame.stop<frame.entry)&(frame.target>frame.entry))|((frame.side=='SHORT')&(frame.stop>frame.entry)&(frame.target<frame.entry))
          if not geometry.all() or not (pd.to_numeric(frame.gross_rr)>=1.0).all(): raise RuntimeError('invalid geometry')
          print(frame.groupby(['setup_kind','source_timeframe_minutes','objective_timeframe_minutes']).outcome.value_counts())
          PY
      - name: Preserve v2 action universe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-liquidity-bpr-v2-${{ matrix.period }}
          path: artifacts/candidate-hierarchical-liquidity-bpr-v2/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
