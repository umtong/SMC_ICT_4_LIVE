name: candidate-55-custrend-v1

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-custrend-v1.yml"
      - "research/candidate-55/run_custrend_tournament.py"
      - "research/candidate-55/router_custrend.py"
      - "research/candidate-55/router_custrend_fixed.py"
      - "research/candidate-55/strategy_custrend.py"
      - "research/candidate-55/router_zaratustra.py"
      - "research/candidate-55/router_zaratustra_v13.py"
      - "research/candidate-55/strategy_mbe2.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-55-custrend-v1
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 0

      - name: Materialize reused Nautilus shell and exact source policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router_zaratustra_v13.py
          cp research/candidate-55/router_custrend.py research/candidate-51/router_custrend.py
          cp research/candidate-55/router_custrend_fixed.py research/candidate-51/router.py
          cp research/candidate-55/strategy_mbe2.py research/candidate-51/strategy_mbe2.py
          cp research/candidate-55/strategy_custrend.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and prove source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from router import (
              BarObservation,
              _decode_mode,
              _parabolic_sar,
              _rolling_shifted,
              _talib_ema,
              _trend_flag,
          )
          from strategy import Candidate35Strategy

          assert _decode_mode("level_both") == ("level", "both")
          assert _decode_mode("edge_short") == ("edge", "short")
          shifted = _rolling_shifted([1.0, 2.0, 3.0, 100.0], 3)
          assert math.isnan(shifted[2])
          assert abs(shifted[3] - 2.0) < 1e-12, shifted
          ema = _talib_ema([float(i) for i in range(1, 20)], 5)
          assert math.isnan(ema[3]) and math.isfinite(ema[4])

          minute = 60_000_000_000
          bullish_previous = BarObservation(
              ts_event=minute, open=100.0, high=103.0, low=99.0,
              close=102.0, volume=1.0,
          )
          bullish_current = BarObservation(
              ts_event=2 * minute, open=102.5, high=108.0, low=101.0,
              close=107.0, volume=1.0,
          )
          bearish_previous = BarObservation(
              ts_event=3 * minute, open=108.0, high=109.0, low=105.0,
              close=106.0, volume=1.0,
          )
          bearish_current = BarObservation(
              ts_event=4 * minute, open=105.0, high=106.0, low=99.0,
              close=100.0, volume=1.0,
          )
          assert _trend_flag(bullish_previous, bullish_current) == 1
          assert _trend_flag(bearish_previous, bearish_current) == -1

          bars = [
              BarObservation(
                  ts_event=index * minute,
                  open=100.0 + 0.1 * index,
                  high=100.4 + 0.1 * index,
                  low=99.8 + 0.1 * index,
                  close=100.2 + 0.1 * index,
                  volume=1.0,
              )
              for index in range(80)
          ]
          psar = _parabolic_sar(bars)
          assert math.isfinite(psar[-1])
          assert Candidate35Strategy.__name__ == "Candidate35Strategy"
          print("CusTrend shifted-volume, pattern, EMA, PSAR and execution contracts verified")
          PY

      - name: Run forward completed-solution tournament
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_custrend_tournament.py

      - name: Persist evidence on candidate branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="research/candidate-55/evidence/v6-custrend"
          if [[ ! -f "$evidence/RESULT.json" ]]; then
            echo "No complete CusTrend tournament result to persist" >&2
            exit 1
          fi
          git config user.name "candidate-55-research-bot"
          git config user.email "candidate-55-research-bot@users.noreply.github.com"
          git add "$evidence"
          git commit -m "candidate55: persist forward CusTrend tournament evidence"
          git restore research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_zaratustra.py \
            research/candidate-51/router_zaratustra_v13.py \
            research/candidate-51/router_custrend.py \
            research/candidate-51/strategy_mbe2.py
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-55 && git push origin HEAD:research/candidate-55; then
              pushed=1
              break
            fi
            sleep $((attempt * 4))
          done
          [[ "$pushed" -eq 1 ]]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-custrend-v1-${{ github.sha }}
          path: artifacts/candidate-55/custrend-v1-*
          if-no-files-found: warn
