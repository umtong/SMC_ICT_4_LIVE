name: candidate-04-v35-unopened-and-long

on:
  workflow_run:
    workflows: ["candidate-04-v35-survivor-followup"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  unopened:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      pass: ${{ steps.evaluate.outputs.pass }}
      route: ${{ steps.freeze.outputs.route }}
      source_commit: ${{ steps.freeze.outputs.source_commit }}
      long_build_start: ${{ steps.evaluate.outputs.long_build_start }}
      long_start: ${{ steps.evaluate.outputs.long_start }}
      long_end: ${{ steps.evaluate.outputs.long_end }}
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      FOLLOWUP_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Restore frozen V35 path decision
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: candidate-04-v35-survivor-followup-*
          path: followup
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Freeze source and select unseen windows before data access
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-04-v35-unopened
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          from datetime import date, timedelta
          from pathlib import Path

          paths = list(Path("followup").rglob("research_decision.json"))
          if not paths:
              fallback = Path("research/candidate-04/evidence-v35-survivor-followup.json")
              if fallback.exists():
                  paths = [fallback]
          if not paths:
              print("should_run=false")
              print("route=none")
              print("source_commit=")
              raise SystemExit(0)
          decision = json.loads(paths[0].read_text())
          if not decision.get("three_week_pass"):
              print("should_run=false")
              print("route=none")
              print(f"source_commit={decision.get('source_commit') or ''}")
              raise SystemExit(0)
          route = decision.get("surviving_mechanism") or decision.get("route") or "full"
          source_commit = decision.get("source_commit") or "${{ github.event.workflow_run.head_sha }}"

          corpus = ""
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  corpus += path.read_text(errors="ignore")
              except OSError:
                  pass

          seed = f"{source_commit}:candidate-04-v35:{route}:unopened"
          candidates = []
          cursor = date(2023, 1, 2)
          last = date(2025, 12, 1)
          while cursor <= last:
              week_end = cursor + timedelta(days=6)
              build_start = cursor - timedelta(days=2)
              if str(cursor) not in corpus and str(week_end) not in corpus:
                  rank = hashlib.sha256(f"{seed}:{cursor}".encode()).hexdigest()
                  candidates.append((rank, build_start, cursor, week_end))
              cursor += timedelta(days=7)
          candidates.sort()
          if len(candidates) < 3:
              raise SystemExit("fewer than three repository-unseen weeks")
          weeks = [
              {
                  "build_start": str(item[1]),
                  "evaluation_start": str(item[2]),
                  "evaluation_end": str(item[3]),
              }
              for item in candidates[:3]
          ]

          long_candidates = []
          cursor = date(2023, 2, 1)
          while cursor <= date(2025, 8, 1):
              block_end = cursor + timedelta(days=90)
              overlaps = any(
                  date.fromisoformat(week["evaluation_start"]) <= block_end
                  and date.fromisoformat(week["evaluation_end"]) >= cursor
                  for week in weeks
              )
              unseen_boundary = str(cursor) not in corpus and str(block_end) not in corpus
              if not overlaps and unseen_boundary:
                  rank = hashlib.sha256(f"{seed}:long:{cursor}".encode()).hexdigest()
                  long_candidates.append((rank, cursor - timedelta(days=2), cursor, block_end))
              cursor += timedelta(days=31)
          long_candidates.sort()
          if not long_candidates:
              raise SystemExit("no disjoint repository-unseen 91-day block")

          selection = {
              "candidate": f"candidate-04-v35-{route}",
              "route": route,
              "source_commit": source_commit,
              "selection_time": "before_market_data_access",
              "selection_method": "sha256 rank over repository-unseen windows",
              "weeks": weeks,
              "long_evaluation": {
                  "build_start": str(long_candidates[0][1]),
                  "evaluation_start": str(long_candidates[0][2]),
                  "evaluation_end": str(long_candidates[0][3]),
              },
          }
          Path("artifacts/candidate-04-v35-unopened/selection.json").write_text(
              json.dumps(selection, indent=2, sort_keys=True) + "\n"
          )
          print("should_run=true")
          print(f"route={route}")
          print(f"source_commit={source_commit}")
          PY

      - name: Verify candidate source was not modified after freeze
        if: steps.freeze.outputs.should_run == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.freeze.outputs.source_commit }}
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git diff --exit-code "$SOURCE_COMMIT" -- \
            research/candidate-04/event_time_flow_run_compiler.py \
            research/candidate-04/nt_exact_causal_target_risk_sizing.py \
            research/candidate-04/nt_backtest_v31_exact_causal_target.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/inventory_transfer_config.json \
            research/candidate-04/impact_exhaustion_config.json \
            research/candidate-04/auction_activity_router_config.json \
            research/candidate-04/nt_liquidity_config.json
          smc4 doctor

      - name: Evaluate three selected BTC weeks sequentially
        if: steps.freeze.outputs.should_run == 'true'
        id: evaluate
        shell: bash
        env:
          ROUTE: ${{ steps.freeze.outputs.route }}
          SOURCE_COMMIT: ${{ steps.freeze.outputs.source_commit }}
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v35-unopened"
          failed=""
          for index in 0 1 2; do
            export C04_BUILD_START="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["weeks"][int(sys.argv[2])]["build_start"])' "$root/selection.json" "$index")"
            export C04_EVALUATION_START="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["weeks"][int(sys.argv[2])]["evaluation_start"])' "$root/selection.json" "$index")"
            export C04_EVALUATION_END="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["weeks"][int(sys.argv[2])]["evaluation_end"])' "$root/selection.json" "$index")"
            export C04_BUILD_END="$C04_EVALUATION_END"
            week="$root/week_$((index + 1))"
            mkdir -p "$week"

            python research/candidate-04/rich_features_v2.py \
              --start "$C04_BUILD_START" \
              --end "$C04_BUILD_END" \
              --cache ".cache/candidate-04-v35-unopened/$index/rich" \
              --output "$week/rich"
            python research/candidate-04/event_time_flow_run_compiler.py \
              --base-config research/candidate-04/inventory_transfer_config.json \
              --impact-config research/candidate-04/impact_exhaustion_config.json \
              --router-config research/candidate-04/auction_activity_router_config.json \
              --rich-dir "$week/rich" \
              --kline-dir ".cache/candidate-04-v35-unopened/$index/raw" \
              --evaluation-start "$C04_EVALUATION_START" \
              --evaluation-end "$C04_EVALUATION_END" \
              --output "$week/all_signals" \
              --download-klines \
              > "$week/compiler_console.json"
            export V35_UNOPENED_WEEK="$week"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["V35_UNOPENED_WEEK"])
          rows = json.loads((root / "all_signals/signals.json").read_text())
          route = os.environ["ROUTE"]
          if route == "reversal":
              keep = {"EVENT_TIME_EXTERNAL_LIQUIDITY_ABSORPTION_REVERSAL"}
          elif route == "continuation":
              keep = {"EVENT_TIME_INFORMED_FLOW_PULLBACK_CONTINUATION"}
          else:
              keep = {
                  "EVENT_TIME_EXTERNAL_LIQUIDITY_ABSORPTION_REVERSAL",
                  "EVENT_TIME_INFORMED_FLOW_PULLBACK_CONTINUATION",
              }
          selected = [row for row in rows if row["scenario"] in keep]
          path = root / "signals"
          path.mkdir(parents=True, exist_ok=True)
          (path / "signals.json").write_text(json.dumps(selected, indent=2, sort_keys=True) + "\n")
          (path / "summary.json").write_text(json.dumps({
              "written_signals": len(selected),
              "route_counts": {"frozen_route": route},
          }, indent=2, sort_keys=True) + "\n")
          PY
            C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$week/signals/signals.json" \
            python research/candidate-04/nt_backtest_v31_exact_causal_target.py \
              --config research/candidate-04/nt_liquidity_config.json \
              --build-start "$C04_BUILD_START" \
              --build-end "$C04_BUILD_END" \
              --evaluation-start "$C04_EVALUATION_START" \
              --evaluation-end "$C04_EVALUATION_END" \
              --cache ".cache/candidate-04-v35-unopened/$index/raw" \
              --output "$week/nautilus" \
              > "$week/nautilus_console.json"
            python research/candidate-04/summarize_candidate_week.py \
              --root "$week" \
              --candidate "candidate-04-v35-${ROUTE}" \
              --stage "unopened_week_$((index + 1))" \
              --output "$week/summary.json"
            passed="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["candidate_pass"]).lower())' "$week/summary.json")"
            if [[ "$passed" != "true" ]]; then
              failed="week_$((index + 1))"
              break
            fi
          done

          export V35_UNOPENED_FAILED="$failed"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/candidate-04-v35-unopened")
          selection = json.loads((root / "selection.json").read_text())
          weeks = {path.parent.name: json.loads(path.read_text()) for path in root.glob("week_*/summary.json")}
          passed = len(weeks) == 3 and all(item["candidate_pass"] for item in weeks.values())
          evidence = {
              "candidate": selection["candidate"],
              "route": selection["route"],
              "source_commit": selection["source_commit"],
              "selection": selection,
              "weeks": weeks,
              "three_unopened_weeks_pass": passed,
              "failed_week": os.environ["V35_UNOPENED_FAILED"] or None,
              "candidate_modified_after_selection": False,
              "decision": "progress_to_long_evaluation" if passed else "reject_after_unopened_week_failure",
          }
          (root / "research_decision.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          Path("research/candidate-04/evidence-v35-unopened.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          pass="$(python -c 'import json; print(str(json.load(open("artifacts/candidate-04-v35-unopened/research_decision.json"))["three_unopened_weeks_pass"]).lower())')"
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "long_build_start=$(python -c 'import json; print(json.load(open("artifacts/candidate-04-v35-unopened/selection.json"))["long_evaluation"]["build_start"])')" >> "$GITHUB_OUTPUT"
          echo "long_start=$(python -c 'import json; print(json.load(open("artifacts/candidate-04-v35-unopened/selection.json"))["long_evaluation"]["evaluation_start"])')" >> "$GITHUB_OUTPUT"
          echo "long_end=$(python -c 'import json; print(json.load(open("artifacts/candidate-04-v35-unopened/selection.json"))["long_evaluation"]["evaluation_end"])')" >> "$GITHUB_OUTPUT"

      - name: Record unopened stage not permitted
        if: steps.freeze.outputs.should_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          value = {"candidate": "candidate-04-v35", "stage": "unopened", "executed": False, "reason": "development_path_not_frozen"}
          Path("research/candidate-04/evidence-v35-unopened.json").write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v35-unopened-${{ github.sha }}
          path: artifacts/candidate-04-v35-unopened
          if-no-files-found: warn
          retention-days: 90

      - name: Commit unopened evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-04-research-bot"
          git config user.email "candidate-04-research-bot@users.noreply.github.com"
          git add research/candidate-04/evidence-v35-unopened.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record V35 unopened-week evidence"
          git push origin HEAD:research/candidate-04

  long_evaluation:
    needs: unopened
    if: needs.unopened.outputs.pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      ROUTE: ${{ needs.unopened.outputs.route }}
      SOURCE_COMMIT: ${{ needs.unopened.outputs.source_commit }}
      C04_BUILD_START: ${{ needs.unopened.outputs.long_build_start }}
      C04_EVALUATION_START: ${{ needs.unopened.outputs.long_start }}
      C04_EVALUATION_END: ${{ needs.unopened.outputs.long_end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Verify frozen code and run 91-day BTC evaluation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_COMMIT" -- \
            research/candidate-04/event_time_flow_run_compiler.py \
            research/candidate-04/nt_exact_causal_target_risk_sizing.py \
            research/candidate-04/nt_backtest_v31_exact_causal_target.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/inventory_transfer_config.json \
            research/candidate-04/impact_exhaustion_config.json \
            research/candidate-04/auction_activity_router_config.json \
            research/candidate-04/nt_liquidity_config.json
          export C04_BUILD_END="$C04_EVALUATION_END"
          root="artifacts/candidate-04-v35-long"
          mkdir -p "$root"
          smc4 doctor
          python research/candidate-04/rich_features_v2.py \
            --start "$C04_BUILD_START" \
            --end "$C04_BUILD_END" \
            --cache ".cache/candidate-04-v35-long/rich" \
            --output "$root/rich"
          python research/candidate-04/event_time_flow_run_compiler.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$root/rich" \
            --kline-dir ".cache/candidate-04-v35-long/raw" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --output "$root/all_signals" \
            --download-klines \
            > "$root/compiler_console.json"
          export V35_LONG_ROOT="$root"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["V35_LONG_ROOT"])
          rows = json.loads((root / "all_signals/signals.json").read_text())
          route = os.environ["ROUTE"]
          if route == "reversal":
              keep = {"EVENT_TIME_EXTERNAL_LIQUIDITY_ABSORPTION_REVERSAL"}
          elif route == "continuation":
              keep = {"EVENT_TIME_INFORMED_FLOW_PULLBACK_CONTINUATION"}
          else:
              keep = {
                  "EVENT_TIME_EXTERNAL_LIQUIDITY_ABSORPTION_REVERSAL",
                  "EVENT_TIME_INFORMED_FLOW_PULLBACK_CONTINUATION",
              }
          selected = [row for row in rows if row["scenario"] in keep]
          path = root / "signals"
          path.mkdir(parents=True, exist_ok=True)
          (path / "signals.json").write_text(json.dumps(selected, indent=2, sort_keys=True) + "\n")
          (path / "summary.json").write_text(json.dumps({"written_signals": len(selected), "route_counts": {"frozen_route": route}}, indent=2, sort_keys=True) + "\n")
          PY
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v31_exact_causal_target.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v35-long/raw" \
            --output "$root/nautilus" \
            > "$root/nautilus_console.json"
          python research/candidate-04/summarize_candidate_week.py \
            --root "$root" \
            --candidate "candidate-04-v35-${ROUTE}" \
            --stage long_91_day_evaluation \
            --min-trades 90 \
            --min-active-days 45 \
            --min-win-rate 0.55 \
            --min-geometric-daily 0.01 \
            --output "$root/summary.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/candidate-04-v35-long")
          summary = json.loads((root / "summary.json").read_text())
          evidence = {
              "candidate": summary["candidate"],
              "route": os.environ["ROUTE"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "evaluation_start": os.environ["C04_EVALUATION_START"],
              "evaluation_end": os.environ["C04_EVALUATION_END"],
              "final_validation_completed": True,
              "project_target_reached": summary["candidate_pass"],
              "candidate_modified_after_unopened_weeks": False,
              "summary": summary,
          }
          (root / "final_decision.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          Path("research/candidate-04/evidence-v35-long.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v35-long-${{ github.sha }}
          path: artifacts/candidate-04-v35-long
          if-no-files-found: error
          retention-days: 90

      - name: Commit long-evaluation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-04-research-bot"
          git config user.email "candidate-04-research-bot@users.noreply.github.com"
          git add research/candidate-04/evidence-v35-long.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record V35 long evaluation"
          git push origin HEAD:research/candidate-04