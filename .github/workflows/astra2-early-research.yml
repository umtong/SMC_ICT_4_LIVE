name: Astra2 early control research
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/early_transfer.py
      - .github/workflows/astra2-early-research.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra2-early-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: market_research
          key: astra2-early-market-v1
          restore-keys: |
            astra2-response-market-
            astra2-origins-market-
      - name: Three native-account observations
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.3.5 pandas==2.3.3 nautilus_trader==1.230.0
          python -u research/candidate-ml-easychart-astra2/response_experiment.py --policy early --start 2024-08-03 --end 2024-08-10
          python -u research/candidate-ml-easychart-astra2/response_experiment.py --policy early --start 2025-08-10 --end 2025-08-17
          python -u research/candidate-ml-easychart-astra2/response_experiment.py --policy early --start 2025-11-17 --end 2025-11-24
      - name: Persist observations
        if: always()
        run: |
          git config user.name 'astra2-research'
          git config user.email 'astra2-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra2/early_native
          if ! git diff --cached --quiet; then
            git commit -m "Astra2: early-control observations for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra2
            git push origin HEAD:research_candidate_ML_easychart_astra2
          fi
