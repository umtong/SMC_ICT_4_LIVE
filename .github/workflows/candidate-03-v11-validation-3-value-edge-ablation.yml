name: candidate-03-v11-validation-3-value-edge-ablation

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/ablate_nt_lvcfr_v11_value_edge.py"
      - ".github/workflows/candidate-03-v11-validation-3-value-edge-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v11_config.json

jobs:
  controlled-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen V11 execution path and ablation script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/candidate-03/nt_lvcfr_strategy.py)" = e4d00ae0c6fa1d24198c846bccb247baacdc0456
          test "$(git hash-object research/candidate-03/nt_lvcfr_v11_config.json)" = e406fa38d021fec51b7f56ebf32927c69d0ec6d8
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONPYCACHEPREFIX=/tmp/candidate03-v11-ablation \
                python -m py_compile \
                  research/candidate-03/ablate_nt_lvcfr_v11_value_edge.py \
                  research/candidate-03/derive_nt_lvcfr_v7_signals.py \
                  research/candidate-03/nt_lvcfr_strategy.py \
                  research/candidate-03/run_nt_lvcfr.py
            '

      - name: Restore immutable third-week execution inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Remove only VALUE_EDGE_CONTINUATION and replay same week
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          out=artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/validation-3
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v7_signals.py \
              --prepared-root $prepared --output-manifest $out/v11_signal_manifest.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/ablate_nt_lvcfr_v11_value_edge.py \
              --prepared-root $prepared --output-manifest $out/ablation_manifest.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py \
              --prepared-root $prepared --config $CONFIG" \
            2>&1 | tee "$out/catalog_rebuild.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2022-05-16 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          set +e
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"
          gate_status=${PIPESTATUS[0]}
          set -e
          echo "gate_status=$gate_status" > "$out/gate_status.txt"

      - name: Preserve controlled ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v11-validation-3-value-edge-ablation-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/**/*.json
            artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/**/*.log
            artifacts/candidate-03/nt-lvcfr-v11-value-edge-ablation/**/*.txt
          if-no-files-found: error
          retention-days: 30
