name: candidate-47-fix-structural-dispatch

on:
  push:
    branches: ["research/candidate-47"]
    paths:
      - ".github/workflows/candidate-47-fix-structural-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-47
          fetch-depth: 0
      - name: Restore policy polymorphism and price-only input contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          strategy = Path("research/candidate-47/ichifan_strategy.py")
          text = strategy.read_text()
          old = "        super()._submit_decision(decision, ts_event)\n"
          new = "        self._submit_decision(decision, ts_event)\n"
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new)
              strategy.write_text(text)
          elif count == 0 and new in text:
              pass
          else:
              raise RuntimeError(f"unexpected submit dispatch occurrences: {count}")

          launcher = Path("research/candidate-47/ichifan_structural_launch.py")
          text = launcher.read_text()
          if "CANDIDATE47_PRICE_ONLY_INPUTS" not in text:
              text = text.replace(
                  "import importlib.util\nfrom pathlib import Path",
                  "import importlib.util\nimport os\nfrom pathlib import Path",
              )
              marker = 'HERE = Path(__file__).resolve().parent\n'
              text = text.replace(
                  marker,
                  marker + 'os.environ["CANDIDATE47_PRICE_ONLY_INPUTS"] = "1"\n',
                  1,
              )
              launcher.write_text(text)
          PY

          git add research/candidate-47/ichifan_strategy.py research/candidate-47/ichifan_structural_launch.py
          if git diff --cached --quiet; then
            echo "Dispatch already corrected."
            exit 0
          fi
          git config user.name "candidate-47-research-bot"
          git config user.email "candidate-47-research-bot@users.noreply.github.com"
          git commit -m "candidate47: route signals through owned risk policy"
          git push origin HEAD:research/candidate-47
