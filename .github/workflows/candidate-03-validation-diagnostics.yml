name: candidate-03-validation-diagnostics

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-validation-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-validation-1-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download checksum-verified untouched validation-1 events
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades --symbol BTCUSDT
          --start-date 2022-07-17 --end-date 2022-07-24
          --output .research-data/candidate-03/far-v2/validation-1-raw --no-extract
      - name: Preserve raw diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-far-v2-validation-1-raw-${{ github.sha }}
          path: .research-data/candidate-03/far-v2/validation-1-raw
          if-no-files-found: error
          retention-days: 3
