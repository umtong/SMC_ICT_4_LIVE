name: candidate-easychart-v16-accepted-only

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - ".github/workflows/candidate-easychart-v16-accepted-only.yml"
      - "research/candidate-easychart/market_v15.py"
      - "research/candidate-easychart/screen_v15.py"
      - "research/candidate-easychart/simulator_v15.py"
      - "research/candidate-easychart/trade_semantic_audit.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v16-accepted-only
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  accepted-break-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v16-accepted-only
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4

      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          exec > >(tee "$ROOT/verification.log") 2>&1
          smc4 doctor
          python -m compileall -q research/candidate-easychart
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v

      - name: Run accepted-break option without failed-break implementations
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/screen.log") 2>&1
          families="ASIA_LONDON,ASIA_NY,LONDON_NY,PRIOR_DAY_LONDON,PRIOR_DAY_NY,FUNDING_00_08,FUNDING_08_16,FUNDING_16_00"
          common=(
            --warmup-days 35
            --cache "$CACHE"
            --families "$families"
            --signal-minutes 5
            --response-minutes 15
            --target-minutes 5
            --target-dc-atr 1.0
            --continuation-cap-widths 10.0
            --cost-profile role
            --disable-immediate
            --disable-wm
            --disable-predictive
          )
          while IFS=: read -r name start end; do
            python research/candidate-easychart/screen_v15.py \
              --start "$start" --end "$end" \
              --output "$ROOT/$name" "${common[@]}"
          done <<'EOF'
          known-dev-2024-02-19:2024-02-19:2024-02-25
          known-diag-2025-07-07:2025-07-07:2025-07-13
          known-diag-2026-02-02:2026-02-02:2026-02-08
          predeclared-2024-09:2024-09-02:2024-09-29
          predeclared-2025-11:2025-11-03:2025-11-30
          predeclared-2026-06:2026-06-01:2026-06-28
          EOF

      - name: Audit every recorded trade under both one-minute OHLC paths
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/semantic-audit.log") 2>&1
          while IFS=: read -r name start end; do
            python research/candidate-easychart/trade_semantic_audit.py \
              --run-dir "$ROOT/$name" \
              --start "$start" --end "$end" \
              --cache "$CACHE" \
              --output "$ROOT/$name/semantic-audit"
          done <<'EOF'
          known-dev-2024-02-19:2024-02-19:2024-02-25
          known-diag-2025-07-07:2025-07-07:2025-07-13
          known-diag-2026-02-02:2026-02-02:2026-02-08
          predeclared-2024-09:2024-09-02:2024-09-29
          predeclared-2025-11:2025-11-03:2025-11-30
          predeclared-2026-06:2026-06-01:2026-06-28
          EOF

      - name: Build evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("artifacts/candidate-easychart-v16-accepted-only")
          names = [
              "known-dev-2024-02-19",
              "known-diag-2025-07-07",
              "known-diag-2026-02-02",
              "predeclared-2024-09",
              "predeclared-2025-11",
              "predeclared-2026-06",
          ]
          rows = []
          for name in names:
              metrics = json.loads((root / name / "metrics.json").read_text())
              audit = json.loads((root / name / "semantic-audit" / "audit_summary.json").read_text())
              rows.append({
                  "window": name,
                  "evaluation_start": metrics["evaluation_start"],
                  "evaluation_end": metrics["evaluation_end"],
                  "calendar_days": metrics["calendar_days"],
                  "trades": metrics["trades"],
                  "ending_nav": metrics["ending_nav"],
                  "geometric_daily_growth": metrics["geometric_daily_growth"],
                  "profit_factor": metrics["profit_factor"],
                  "max_drawdown": metrics["max_drawdown"],
                  "raw_setups_generated": metrics["raw_setups_generated"],
                  "merged_setups": metrics["merged_setups"],
                  "auction_routed_setups": metrics["auction_routed_setups"],
                  "setups_generated": metrics["setups_generated"],
                  "target_gate_passed": metrics["target_gate"]["passed"],
                  "robust_replay_matches": audit["recorded_trade_replay_matches"],
                  "path_ambiguous_recorded_trades": audit["path_ambiguous_recorded_trades"],
                  "unexplained_missing_trades": audit["unexplained_missing_trades"],
              })
          predeclared = [row for row in rows if row["window"].startswith("predeclared-")]
          summary = {
              "candidate": "candidate-easychart-v16-accepted-only",
              "engine_status": "FAST_DIAGNOSTIC_NOT_AUTHORITATIVE",
              "policy_change": "isolate source-supported accepted-break first-retest option; disable unresolved failed-break translations",
              "windows": rows,
              "predeclared_all_positive_growth": all(row["geometric_daily_growth"] > 0 for row in predeclared),
              "predeclared_all_meet_target": all(row["target_gate_passed"] for row in predeclared),
              "all_recorded_trades_robust_under_one_minute_paths": all(
                  row["robust_replay_matches"] == row["trades"]
                  and row["path_ambiguous_recorded_trades"] == 0
                  for row in rows
              ),
          }
          (root / "cross_window_summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Verify evidence artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/cross_window_summary.json" >/dev/null
          for name in \
            known-dev-2024-02-19 \
            known-diag-2025-07-07 \
            known-diag-2026-02-02 \
            predeclared-2024-09 \
            predeclared-2025-11 \
            predeclared-2026-06; do
            test -s "$ROOT/$name/metrics.json"
            test -s "$ROOT/$name/run.json"
            test -e "$ROOT/$name/raw_setups.csv"
            test -e "$ROOT/$name/setups.csv"
            test -e "$ROOT/$name/trades.csv"
            test -e "$ROOT/$name/equity.csv"
            test -s "$ROOT/$name/semantic-audit/audit_summary.json"
            test -e "$ROOT/$name/semantic-audit/trade_path_audit.csv"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v16-accepted-only-${{ github.sha }}
          path: artifacts/candidate-easychart-v16-accepted-only/**
          if-no-files-found: warn
          retention-days: 90
