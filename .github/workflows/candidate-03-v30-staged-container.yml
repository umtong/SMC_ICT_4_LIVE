name: candidate-03-candidate15-aggregate-recovery

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v30-staged-container.yml"
      - "research/candidate-03/compare_candidate15_far_execution.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: "31211433447"
  RESULT_REL: research/candidate-03/results/candidate15-far-execution-development

concurrency:
  group: candidate-03-candidate15-aggregate-recovery
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current candidate branch
        uses: actions/checkout@v4
        with:
          ref: research/candidate-03
          fetch-depth: 0
          path: orchestrator
      - name: Download the 32 successful native evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: candidate15-*
          path: downloaded
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare and persist execution variants
        shell: bash
        run: |
          set -euo pipefail
          root="orchestrator/$RESULT_REL"
          rm -rf "$root"
          mkdir -p "$root"
          for variant in SWEEP_MARKET PASSIVE_RETEST; do
            for week in H01 H02 H03 H04 H05 H06 H07 H08 H09 H10 H11 H12 H13 H14 H15 H16; do
              src="downloaded/candidate15-$variant-$week"
              test -d "$src"
              mkdir -p "$root/$variant/$week"
              cp -a "$src/." "$root/$variant/$week/"
            done
          done
          python orchestrator/research/candidate-03/compare_candidate15_far_execution.py \
            --root "$root" \
            --baseline orchestrator/research/candidate-03/results/candidate14-frozen-holdout/aggregate.json \
            --output "$root/comparison.json"
          git -C orchestrator config user.name candidate-03-development-bot
          git -C orchestrator config user.email candidate-03-development-bot@users.noreply.github.com
          git -C orchestrator add "$RESULT_REL"
          git -C orchestrator commit -m "candidate-03: record Candidate 15 FAR execution development [skip ci]"
          git -C orchestrator fetch origin research/candidate-03
          git -C orchestrator rebase origin/research/candidate-03
          git -C orchestrator push origin HEAD:research/candidate-03
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-far-execution-comparison-${{ github.run_id }}
          path: |
            orchestrator/research/candidate-03/results/candidate15-far-execution-development/comparison.json
            orchestrator/research/candidate-03/results/candidate15-far-execution-development/RESULT.md
          if-no-files-found: warn
          retention-days: 30
