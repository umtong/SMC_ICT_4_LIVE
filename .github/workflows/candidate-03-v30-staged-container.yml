name: candidate-03-candidate16-recovery

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v30-staged-container.yml"
      - "research/candidate-03/patch_candidate16_deep_reentry_call.py"
      - "research/candidate-03/candidate16_failed_far.py"
      - "research/candidate-03/aggregate_candidate16_failed_far.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

env:
  FROZEN_SOURCE_COMMIT: dfb180490b141fdafd5b5ac0b52d3dd0b842550d
  SOURCE_RUN_ID: "31213913751"
  RESULT_REL: research/candidate-03/results/candidate16-failed-far-development

concurrency:
  group: candidate-03-candidate16-recovery
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: orchestrator}
      - uses: actions/checkout@v4
        with: {ref: "${{ env.FROZEN_SOURCE_COMMIT }}", path: frozen-source}
      - name: Verify corrected Candidate 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          cp orchestrator/research/candidate-03/candidate16_failed_far.py frozen-source/research/candidate-14/
          cp orchestrator/research/candidate-03/test_candidate16_failed_far.py frozen-source/research/candidate-14/
          python orchestrator/research/candidate-03/patch_candidate16_deep_reentry_call.py frozen-source/research/candidate-14/candidate16_failed_far.py
          python orchestrator/research/candidate-03/patch_candidate14_event_ids.py frozen-source/research/candidate-14/logic.py
          python orchestrator/research/candidate-03/patch_candidate15_far_execution.py frozen-source/research/candidate-14/semantic_logic.py SWEEP_MARKET
          python orchestrator/research/candidate-03/patch_candidate16_runner_install.py frozen-source/research/candidate-14/run_leadership_scdam.py
          python orchestrator/research/candidate-03/patch_candidate16_native_exit_reason.py frozen-source/research/candidate-14/run_leadership_scdam_base.py
          grep -q 'deep_reentry(state, bar, atr' frozen-source/research/candidate-14/candidate16_failed_far.py
          ! grep -q 'deep_reentry(self, state, bar, atr' frozen-source/research/candidate-14/candidate16_failed_far.py
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen-source/research/candidate-14:$GITHUB_WORKSPACE/frozen-source/src"
          python -m py_compile frozen-source/research/candidate-14/*.py
          python -m unittest discover -s frozen-source/research/candidate-14 -p 'test_*.py' -v

  evaluate_failed:
    needs: static
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        week: [H03, H07, H11]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: orchestrator}
      - uses: actions/checkout@v4
        with: {ref: "${{ env.FROZEN_SOURCE_COMMIT }}", path: frozen-source}
      - name: Install corrected Candidate 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          cp orchestrator/research/candidate-03/candidate16_failed_far.py frozen-source/research/candidate-14/
          python orchestrator/research/candidate-03/patch_candidate16_deep_reentry_call.py frozen-source/research/candidate-14/candidate16_failed_far.py
          python orchestrator/research/candidate-03/patch_candidate14_event_ids.py frozen-source/research/candidate-14/logic.py
          python orchestrator/research/candidate-03/patch_candidate15_far_execution.py frozen-source/research/candidate-14/semantic_logic.py SWEEP_MARKET
          python orchestrator/research/candidate-03/patch_candidate16_runner_install.py frozen-source/research/candidate-14/run_leadership_scdam.py
          python orchestrator/research/candidate-03/patch_candidate16_native_exit_reason.py frozen-source/research/candidate-14/run_leadership_scdam_base.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("orchestrator/research/candidate-03/candidate14_frozen_holdout_protocol.json").read_text())
          p["schema"]="candidate-16-failed-far-continuation-development-v2"
          p["candidate"]="candidate-16-failed-far-acceptance-continuation"
          p["validation_mode"]="development_replay"
          p["selection"]["seed"]=202608081616
          p["claim_rules"]=[
              "Development replay only; success_claim is false.",
              "This rerun changes only the accidental extra deep_reentry function argument.",
              "The state starts only after a fully-closing native STOP_MARKET fill.",
              "All alpha conditions, costs, exact 3% NAV loss budget and global slot remain unchanged.",
          ]
          Path("frozen-source/research/candidate-14/protocol.json").write_text(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY
      - name: Rerun failed Candidate 16 week
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence/${{ matrix.week }}"
          bash frozen-source/research/candidate-14/run_week.sh "${{ matrix.week }}" "$out"
          rm -rf "$out/data"
          for f in metrics.json summary.json audit.json source_lock.json effective_config.json submitted_plans.json order_lifecycle.json scenario_events.jsonl positions.csv account.csv; do test -s "$out/$f"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate16-fixed-${{ matrix.week }}
          path: evidence/${{ matrix.week }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  aggregate:
    if: ${{ always() && needs.static.result == 'success' && needs.evaluate_failed.result == 'success' }}
    needs: [static, evaluate_failed]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-03, fetch-depth: 0, path: orchestrator}
      - name: Download 13 completed source-run weeks
        uses: actions/download-artifact@v4
        with:
          pattern: candidate16-H*
          path: source-evidence
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download three corrected weeks
        uses: actions/download-artifact@v4
        with:
          pattern: candidate16-fixed-H*
          path: fixed-evidence
      - name: Merge, attribute and persist Candidate 16 evidence
        shell: bash
        run: |
          set -euo pipefail
          root="orchestrator/$RESULT_REL"
          rm -rf "$root"; mkdir -p "$root"
          for week in H01 H02 H04 H05 H06 H08 H09 H10 H12 H13 H14 H15 H16; do
            src="source-evidence/candidate16-$week"; test -d "$src"
            mkdir -p "$root/$week"; cp -a "$src/." "$root/$week/"
          done
          for week in H03 H07 H11; do
            src="fixed-evidence/candidate16-fixed-$week"; test -d "$src"
            mkdir -p "$root/$week"; cp -a "$src/." "$root/$week/"
          done
          python orchestrator/research/candidate-03/aggregate_candidate16_failed_far.py \
            --root "$root" \
            --baseline orchestrator/research/candidate-03/results/candidate14-frozen-holdout/aggregate.json \
            --candidate15 orchestrator/research/candidate-03/results/candidate15-far-execution-development/comparison.json \
            --output "$root/aggregate.json"
          git -C orchestrator config user.name candidate-03-development-bot
          git -C orchestrator config user.email candidate-03-development-bot@users.noreply.github.com
          git -C orchestrator add "$RESULT_REL"
          git -C orchestrator commit -m "candidate-03: record corrected Candidate 16 development [skip ci]"
          git -C orchestrator fetch origin research/candidate-03
          git -C orchestrator rebase origin/research/candidate-03
          git -C orchestrator push origin HEAD:research/candidate-03
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate16-corrected-aggregate-${{ github.run_id }}
          path: |
            orchestrator/research/candidate-03/results/candidate16-failed-far-development/aggregate.json
            orchestrator/research/candidate-03/results/candidate16-failed-far-development/RESULT.md
          if-no-files-found: warn
          retention-days: 30
