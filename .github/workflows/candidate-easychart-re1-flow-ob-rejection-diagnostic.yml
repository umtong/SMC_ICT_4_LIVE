name: candidate-easychart-re1-flow-ob-rejection-diagnostic

on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths:
      - "research/candidate-easychart_re1/.flow_ob_rejection_dispatch_marker"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-flow-ob-rejection-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: flow-ob-rejection
            runner: run_mtf_backtest_re1_flow_ob_rejection.py
            period: february-2025-short
            start: 2025-02-01
            end: 2025-02-10
          - candidate: flow-ob
            runner: run_mtf_backtest_re1_flow_ob.py
            period: february-2025-short
            start: 2025-02-01
            end: 2025-02-10
          - candidate: flow-ob-rejection
            runner: run_mtf_backtest_re1_flow_ob_rejection.py
            period: live-examples-2025-short
            start: 2025-08-10
            end: 2025-08-20
          - candidate: flow-ob
            runner: run_mtf_backtest_re1_flow_ob.py
            period: live-examples-2025-short
            start: 2025-08-10
            end: 2025-08-20
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-flow-ob-rejection/${{ matrix.candidate }}/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-flow-ob-rejection/${{ matrix.candidate }}/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile flow-OB mechanism candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/data_re1_flow.py \
            research/candidate-easychart_re1/mtf_data_re1_flow.py \
            research/candidate-easychart_re1/easychart_re1_flow.py \
            research/candidate-easychart_re1/easychart_re1_auction_flow.py \
            research/candidate-easychart_re1/easychart_re1_flow_focused.py \
            research/candidate-easychart_re1/easychart_re1_flow_phase.py \
            research/candidate-easychart_re1/easychart_re1_flow_ob.py \
            research/candidate-easychart_re1/easychart_re1_flow_ob_rejection.py \
            research/candidate-easychart_re1/execution_re1_flow.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_flow_ob.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_flow_ob_rejection.py

      - name: Liquidity-event responsibility smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from contracts_v5 import ScenarioPath
          from easychart_re1_flow_ob_rejection import (
              EasyChartRE1PhaseFlowOBRejectionBundle,
              FLOW_OB_LIQUIDITY_EVENT_RULE,
          )
          bundle = EasyChartRE1PhaseFlowOBRejectionBundle("BTCUSDT", 0.1, 1.0)
          policy = bundle.diagnostics["flow_validated_decision_ob_liquidity_event"]
          assert policy["executable_path"] == ScenarioPath.REJECTION.value
          assert policy["suppressed_path"] == ScenarioPath.BOUNCE.value
          assert policy["rule_provenance"] == FLOW_OB_LIQUIDITY_EVENT_RULE
          PY

      - name: Run four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python "research/candidate-easychart_re1/${{ matrix.runner }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-flow-ob-rejection-${{ matrix.candidate }}-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-flow-ob-rejection/${{ matrix.candidate }}/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
