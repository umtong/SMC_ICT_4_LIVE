name: candidate-08-fix-flow-response-v3-tests

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-fix-flow-response-v3-tests"

permissions:
  contents: write

jobs:
  fix-v3-test-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align wrapper tests with V3 and the complete-horizon evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; import base64; p=Path("research/candidate-08/test_aggtrade_flow_response_auction_runner.py"); s=p.read_text(encoding="utf-8"); old_import="from aggtrade_flow_response_auction_signals_v2 import ("; assert s.count(old_import)==1; s=s.replace(old_import, "from aggtrade_flow_response_auction_signals_v3 import ("); old=base64.b64decode("").decode(); new=base64.b64decode("").decode(); assert s.count(old)==1; p.write_text(s.replace(old,new), encoding="utf-8")'
          python -m py_compile research/candidate-08/test_aggtrade_flow_response_auction_runner.py
          rm -f research/candidate-08/.run-fix-flow-response-v3-tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/candidate-08/test_aggtrade_flow_response_auction_runner.py research/candidate-08/.run-fix-flow-response-v3-tests
          git commit -m "candidate-08: align flow-response wrapper tests with V3 [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
