name: Candidate 06 AFHR Holdout Ablation

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-afhr-ablation.yml"
      - "research/candidate-06/run_afhr_holdout_ablation.py"
      - "research/candidate-06/adaptive_fresh_core.py"
      - "research/candidate-06/adaptive_fresh_hierarchical_engine.py"
      - "research/candidate-06/run_adaptive_fresh_matrix.py"
      - "research/candidate-06/nautilus_strategy.py"
      - "src/smc_ict_4/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-afhr-holdout-ablation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  week-2-ablation:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed research environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_adaptive_fresh_core.py
          python research/candidate-06/test_adaptive_fresh_hierarchical_engine.py
          python research/candidate-06/test_hierarchical_multi_liquidity_engine.py

      - name: Run unchanged week-2 one-variable ablation through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/afhr-holdout-ablation
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_afhr_holdout_ablation.py \
            --output artifacts/candidate-06/afhr-holdout-ablation \
            > artifacts/candidate-06-afhr-ablation.stdout \
            2> artifacts/candidate-06-afhr-ablation.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-06/afhr-holdout-ablation
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > artifacts/candidate-06/afhr-holdout-ablation/workflow_exit_code.txt
          cp artifacts/candidate-06-afhr-ablation.stdout artifacts/candidate-06/afhr-holdout-ablation/workflow_stdout.txt 2>/dev/null || true
          cp artifacts/candidate-06-afhr-ablation.stderr artifacts/candidate-06/afhr-holdout-ablation/workflow_stderr.txt 2>/dev/null || true

      - name: Commit reproducible ablation evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add research/candidate-06/run_afhr_holdout_ablation.py
          git add -f artifacts/candidate-06/afhr-holdout-ablation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 AFHR holdout ablation [candidate-06 evidence]"
          git push origin HEAD:research/candidate-06

      - name: Upload ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-afhr-holdout-ablation-${{ github.sha }}
          path: artifacts/candidate-06/afhr-holdout-ablation
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce implementation completion only
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
