name: candidate-02-v103-nautilustrader-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v103-first.yml"

permissions:
  contents: read
  actions: read

jobs:
  first-week-endogenous-flow-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed runtime and prospective v103 lock
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v103_endogenous_flow_clock_core.py \
            research/candidate-02/v103_nt_backtest.py \
            .candidate-02-v89/collect_spot.py \
            .candidate-02-v89/augment_cross_market.py
          python -m json.tool research/candidate-02/v103_endogenous_flow_clock_lock.json >/dev/null
          python -m json.tool research/candidate-02/v103_base_config.json >/dev/null
          test "$(git hash-object research/candidate-02/v103_endogenous_flow_clock_core.py)" = "ece6aa6bb7bd3e8667f52b4d2669607c4c6fab0e"
          test "$(git hash-object research/candidate-02/v103_base_config.json)" = "c64d2fdbf50d1d08eba2b6ab2ed8a6c3e6d38959"
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v103_endogenous_flow_clock_lock.json').read_text())
          cfg=json.loads(Path('research/candidate-02/v103_base_config.json').read_text())
          assert lock['status']=='LOCKED_BEFORE_FIRST_WEEK_COLLECTION'
          assert lock['first_week']['start_utc']=='2025-11-17T00:00:00Z'
          assert lock['first_week']['end_utc']=='2025-11-24T00:00:00Z'
          assert lock['first_week']['raw_data_status_at_lock']=='NOT_COLLECTED_FOR_V103'
          assert lock['performance_engine']=='NautilusTrader 1.230.0'
          assert lock['custom_backtest_engine'] is False
          assert float(lock['risk_fraction'])==0.03
          assert int(lock['global_pending_entry_plus_position_limit'])==1
          assert cfg['validation']['first_week_start']=='2025-11-17'
          assert int(cfg['validation']['selection_seed'])==20260807103
          assert float(cfg['risk']['risk_fraction'])==0.03
          assert cfg['risk']['maximum_notional_cap'] is None
          assert cfg['risk']['score_risk_multiplier'] is None
          assert float(cfg['scenario']['packet_turnover_units'])==8.0
          assert cfg['scenario']['mode']=='PORTFOLIO'
          PY

      - name: Materialize exact futures direct-data tools for locked week
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v103-futures-tools inputs/v103-first-week
          cp -a .candidate-02-v75 /tmp/v103-futures-tools
          python - <<'PY'
          from datetime import date
          import json,re
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v103_endogenous_flow_clock_lock.json').read_text())
          start=date.fromisoformat(lock['first_week']['start_utc'][:10])
          constructor=re.compile(r'EVALUATION_START\s*=\s*date\(\s*\d{4}\s*,\s*\d{1,2}\s*,\s*\d{1,2}\s*\)')
          count=0
          for path in Path('/tmp/v103-futures-tools').rglob('*'):
              if not path.is_file() or path.suffix not in {'.py','.json','.md'}:
                  continue
              text=path.read_text(encoding='utf-8',errors='strict')
              text=text.replace('inputs/v75-first-week','inputs/v103-first-week')
              text=text.replace('candidate-02-v75-first-week','candidate-02-v103-first-week')
              text=text.replace('v75-first-week','v103-first-week')
              text=text.replace(
                  'candidate-02-v75-quarter-hour-algorithmic-opening-auction',
                  'candidate-02-v103-endogenous-turnover-clock-order-flow-regimes')
              if path.name.startswith('collect') and path.suffix=='.py':
                  text,n=constructor.subn(
                      f'EVALUATION_START = date({start.year}, {start.month}, {start.day})',
                      text)
                  count+=n
              path.write_text(text,encoding='utf-8')
          if count!=1:
              raise RuntimeError(f'expected one evaluation-date constructor, found {count}')
          collector=next(Path('/tmp/v103-futures-tools').glob('collect*.py'))
          expected=f'EVALUATION_START = date({start.year}, {start.month}, {start.day})'
          materialized=collector.read_text(encoding='utf-8')
          if expected not in materialized or 'inputs/v103-first-week' not in materialized:
              raise RuntimeError('locked v103 week was not materialized')
          PY
          python -m py_compile /tmp/v103-futures-tools/collect_first_week.py /tmp/v103-futures-tools/build_features.py

      - name: Collect locked futures direct data and build completed-minute features
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/v103-futures-tools/collect_first_week.py
          python /tmp/v103-futures-tools/build_features.py
          test -f inputs/v103-first-week/candidate-02-v48-first-week/v48_features.npz
          test -f inputs/v103-first-week/candidate-02-v48-first-week/columns.json
          test "$(find inputs/v103-first-week/direct/aggTrades -name '*.zip' | wc -l)" -eq 10
          test "$(find inputs/v103-first-week/direct/bookDepth -name '*.zip' | wc -l)" -eq 10
          test "$(find inputs/v103-first-week/.cache/candidate-02/v103-first-week/binance_1m -name '*.zip' | wc -l)" -eq 10

      - name: Collect locked spot data and augment cross-market matrix
        shell: bash
        run: |
          set -euo pipefail
          cp .candidate-02-v89/collect_spot.py /tmp/v103_collect_spot.py
          cp .candidate-02-v89/augment_cross_market.py /tmp/v103_augment_cross_market.py
          python - <<'PY'
          from pathlib import Path
          replacements={
              'research/candidate-02/v89_cross_market_impact_lock.json':'research/candidate-02/v103_endogenous_flow_clock_lock.json',
              'inputs/v89-first-week':'inputs/v103-first-week',
              'candidate-02-v89-first-week':'candidate-02-v103-first-week',
              'v89 first-week':'v103 first-week',
              'for v89':'for v103',
          }
          for name in ('/tmp/v103_collect_spot.py','/tmp/v103_augment_cross_market.py'):
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              for old,new in replacements.items():
                  text=text.replace(old,new)
              path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile /tmp/v103_collect_spot.py /tmp/v103_augment_cross_market.py
          python /tmp/v103_collect_spot.py
          python /tmp/v103_augment_cross_market.py

      - name: Verify full causal v103 coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from v53_nt_core import load_feature_matrix, load_raw_one_minute
          lock=json.loads(Path('research/candidate-02/v103_endogenous_flow_clock_lock.json').read_text())
          start=pd.Timestamp(lock['first_week']['start_utc'])
          end=pd.Timestamp(lock['first_week']['end_utc'])
          features=load_feature_matrix(
              Path('inputs/v103-first-week/candidate-02-v48-first-week/v48_features.npz'),
              Path('inputs/v103-first-week/candidate-02-v48-first-week/columns.json'))
          raw=load_raw_one_minute(
              Path('inputs/v103-first-week/.cache/candidate-02/v103-first-week/binance_1m'))
          required={
              'close','aggressive_signed_quote_1m','aggressive_total_quote_1m',
              'ask_depth_1pct_end','bid_depth_1pct_end',
              'spot_open','spot_close',
              'spot_aggressive_signed_quote_1m','spot_aggressive_total_quote_1m',
              'perp_spot_log_basis','vpin_50',
          }
          missing=sorted(required-set(features.columns))
          if missing: raise RuntimeError(f'missing v103 features: {missing}')
          evaluation=features.loc[(features.index>=start)&(features.index<end)]
          raw_eval=raw.loc[(raw.index>=start)&(raw.index<end)]
          if len(evaluation)<7*24*60*.995:
              raise RuntimeError(f'feature coverage {len(evaluation)}')
          if len(raw_eval)<7*24*60*.995:
              raise RuntimeError(f'raw coverage {len(raw_eval)}')
          if features.index.min()>start-pd.Timedelta(days=2)+pd.Timedelta(minutes=2):
              raise RuntimeError('missing warmup')
          if features.index.max()<end:
              raise RuntimeError('features end early')
          print(json.dumps({
              'feature_first_utc':features.index.min().isoformat(),
              'feature_last_utc':features.index.max().isoformat(),
              'evaluation_rows':len(evaluation),
              'raw_evaluation_rows':len(raw_eval),
              'forward_feature_columns_used':False,
          }))
          PY

      - name: Materialize exact locked variant matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v103-configs
          python - <<'PY'
          import copy,json
          from pathlib import Path
          base=json.loads(Path('research/candidate-02/v103_base_config.json').read_text())
          variants={
              'u6':{'packet_turnover_units':6.0,'mode':'PORTFOLIO'},
              'u8':{'packet_turnover_units':8.0,'mode':'PORTFOLIO'},
              'u10':{'packet_turnover_units':10.0,'mode':'PORTFOLIO'},
              'retained8':{'packet_turnover_units':8.0,'mode':'RETAINED_DISCOVERY'},
              'absorbed8':{'packet_turnover_units':8.0,'mode':'ABSORBED_EXHAUSTION'},
          }
          for label,override in variants.items():
              cfg=copy.deepcopy(base)
              cfg['candidate']=f'candidate-02-v103-{label}'
              cfg['scenario'].update(override)
              (Path('/tmp/v103-configs')/f'{label}.json').write_text(
                  json.dumps(cfg,indent=2,sort_keys=True))
          Path('artifacts-v103-variant-manifest.json').write_text(json.dumps({
              'base':'research/candidate-02/v103_base_config.json',
              'variants':variants,
          },indent=2,sort_keys=True))
          PY
          for file in /tmp/v103-configs/*.json; do python -m json.tool "$file" >/dev/null; done

      - name: Run every prelocked baseline in fresh NautilusTrader processes
        shell: bash
        run: |
          set -euo pipefail
          labels=(u6 u8 u10 retained8 absorbed8)
          for label in "${labels[@]}"; do
            output="artifacts/candidate-02-v103-${label}"
            mkdir -p "$output"
            set +e
            python research/candidate-02/v103_nt_backtest.py \
              --config "/tmp/v103-configs/${label}.json" \
              --input-root inputs/v103-first-week \
              --output "$output" \
              | tee "artifacts-v103-${label}.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$output/validation_exit_code.txt"
            if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi
          done

      - name: Publish baseline decision
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          labels=('u6','u8','u10','retained8','absorbed8')
          rows={}
          def passed(m):
              return (
                  m.get('trades_per_day',0)>=.75
                  and m.get('win_rate',0)>=.5
                  and m.get('profit_factor_after_cost',0)>=1.5
                  and m.get('geometric_daily_growth_after_cost',-1)>=.01
                  and abs(m.get('maximum_mark_to_market_drawdown',-1))<=.25
                  and m.get('engine','').startswith('NautilusTrader')
                  and m.get('custom_backtest_engine') is False
                  and abs(m.get('risk_fraction',0)-.03)<=1e-12
              )
          print('# Candidate-02 v103 endogenous turnover clock')
          print('| Variant | Signals | Trades/day | Win | PF | Growth/day | MDD |')
          print('|---|---:|---:|---:|---:|---:|---:|')
          for label in labels:
              path=Path(f'artifacts/candidate-02-v103-{label}/metrics.json')
              if not path.exists():
                  rows[label]={'status':'IMPLEMENTATION_ERROR'}
                  print(f'| {label} | - | - | - | - | - | - |')
                  continue
              m=json.loads(path.read_text()); rows[label]=m
              print(f"| {label} | {m['scheduled_signals']} | {m['trades_per_day']:.3f} | {m['win_rate']:.2%} | {m['profit_factor_after_cost']:.3f} | {m['geometric_daily_growth_after_cost']:.3%} | {m['maximum_mark_to_market_drawdown']:.2%} |")
          central_pass=passed(rows.get('u8',{}))
          adjacent_pass=any(passed(rows.get(x,{})) for x in ('u6','u10'))
          component_checks={}
          for label in ('retained8','absorbed8'):
              m=rows.get(label,{})
              trades=int(m.get('trades',0)) if isinstance(m,dict) else 0
              component_checks[label]={
                  'trades':trades,
                  'nonnegative_if_active':trades<2 or (
                      m.get('profit_factor_after_cost',0)>=1.0
                      and m.get('geometric_daily_growth_after_cost',-1)>=0.0
                  ),
              }
          component_sane=all(v['nonnegative_if_active'] for v in component_checks.values())
          promotion=central_pass and adjacent_pass and component_sane
          decision={
              'status':'FIRST_WEEK_PROMOTION_ELIGIBLE' if promotion else 'FIRST_WEEK_REJECT_RUN_SINGLE_ABLATION',
              'central_pass':central_pass,
              'adjacent_pass':adjacent_pass,
              'component_sane':component_sane,
              'component_checks':component_checks,
              'rows':rows,
              'risk_fraction':.03,
              'performance_engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
          }
          Path('artifacts-v103-baseline-decision.json').write_text(
              json.dumps(decision,indent=2,sort_keys=True))
          PY

      - name: Run one predeclared core ablation after baseline rejection
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          print(json.load(open('artifacts-v103-baseline-decision.json'))['status'])
          PY
          )"
          if [[ "$status" == "FIRST_WEEK_PROMOTION_ELIGIBLE" ]]; then
            echo "Baseline promoted; ablation not executed."
            exit 0
          fi
          python - <<'PY'
          import copy,json
          from pathlib import Path
          base=json.loads(Path('research/candidate-02/v103_base_config.json').read_text())
          cfg=copy.deepcopy(base)
          cfg['candidate']='candidate-02-v103-u8-no-depth-refill-ceiling'
          cfg['scenario']['maximum_front_depth_refill']=1000.0
          Path('/tmp/v103-configs/u8_ablation.json').write_text(
              json.dumps(cfg,indent=2,sort_keys=True))
          PY
          output="artifacts/candidate-02-v103-u8-ablation"
          mkdir -p "$output"
          set +e
          python research/candidate-02/v103_nt_backtest.py \
            --config /tmp/v103-configs/u8_ablation.json \
            --input-root inputs/v103-first-week \
            --output "$output" \
            | tee artifacts-v103-u8-ablation.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "$output/validation_exit_code.txt"
          if [[ "$code" != "0" && "$code" != "2" ]]; then exit "$code"; fi

      - name: Publish final first-week decision
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          baseline=json.loads(Path('artifacts-v103-baseline-decision.json').read_text())
          ablation_path=Path('artifacts/candidate-02-v103-u8-ablation/metrics.json')
          ablation=json.loads(ablation_path.read_text()) if ablation_path.exists() else None
          decision={
              'candidate_family':'candidate-02-v103-endogenous-turnover-clock-order-flow-regimes',
              'baseline':baseline,
              'single_ablation':{
                  'removed_variable':'maximum_front_depth_refill',
                  'metrics':ablation,
              } if ablation is not None else None,
              'status':baseline['status'],
              'next_week_allowed':baseline['status']=='FIRST_WEEK_PROMOTION_ELIGIBLE',
              'long_evaluation_allowed':False,
          }
          if ablation is not None:
              passes=(
                  ablation.get('trades_per_day',0)>=.75
                  and ablation.get('win_rate',0)>=.5
                  and ablation.get('profit_factor_after_cost',0)>=1.5
                  and ablation.get('geometric_daily_growth_after_cost',-1)>=.01
                  and abs(ablation.get('maximum_mark_to_market_drawdown',-1))<=.25
              )
              decision['ablation_passes_weekly_gate']=passes
              if baseline['status']!='FIRST_WEEK_PROMOTION_ELIGIBLE':
                  decision['status']='FIRST_WEEK_REJECT_AFTER_SINGLE_ABLATION'
          Path('artifacts-v103-first-week-decision.json').write_text(
              json.dumps(decision,indent=2,sort_keys=True))
          print('## Final decision')
          print('```json')
          print(json.dumps(decision,indent=2,sort_keys=True))
          print('```')
          PY

      - name: Preserve direct data, manifests and NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v103-first-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v103-*
            artifacts-v103-*.log
            artifacts-v103-baseline-decision.json
            artifacts-v103-first-week-decision.json
            artifacts-v103-variant-manifest.json
            inputs/v103-first-week/artifacts
            inputs/v103-first-week/candidate-02-v48-first-week
            inputs/v103-first-week/.cache/candidate-02/v103-first-week/binance_1m
            inputs/v103-first-week/direct
            inputs/v103-first-week/spot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
