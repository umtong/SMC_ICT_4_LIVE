name: Astra2 adaptive response research
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/adaptive_impact.py
      - .github/workflows/astra2-adaptive-response.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra2-adaptive-response
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: market_research
          key: astra2-adaptive-market-v1
          restore-keys: |
            astra2-impact-market-
            astra2-context-market-
            astra2-decision-market-
      - name: Relearn from earlier completed episodes and execute later decisions
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.3.5 pandas==2.3.3 nautilus_trader==1.230.0 scikit-learn==1.7.2 statsmodels==0.14.5 joblib matplotlib
          python -u research/candidate-ml-easychart-astra2/adaptive_impact.py
      - name: Persist observed policies and accounts
        if: always()
        run: |
          git config user.name 'astra2-research'
          git config user.email 'astra2-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra2/adaptive_response_models research_results/candidate_ml_easychart_astra2/adaptive_impact_hgb research_results/candidate_ml_easychart_astra2/adaptive_impact_offset
          if ! git diff --cached --quiet; then
            git commit -m "Astra2: adaptive-response observations for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra2
            git push origin HEAD:research_candidate_ML_easychart_astra2
          fi
