name: candidate-02-v142-dual-auction-family

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v142_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v142-dual-auction-family, cancel-in-progress: false}

jobs:
  v142-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify fixed engine and causal dual-route resolver
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v107_regime_rotation_core.py \
            research/candidate-02/v142_dual_auction_core.py \
            research/candidate-02/v142_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v107_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v107_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['risk']['score_risk_multiplier'] is None
          PY

      - name: Download immutable week-one matrix and bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v142-week1
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v142-week2
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v142-week2-source
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize fixed inputs and adjacent measured-move family
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v142-week2/.cache
          mkdir -p inputs/v142-week2/.cache/candidate-02/v142-week2/binance_1m
          find inputs/v142-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v142-week2/.cache/candidate-02/v142-week2/binance_1m/ \;
          test "$(find inputs/v142-week2/.cache/candidate-02/v142-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v142-config
          python - <<'PY'
          import json
          from pathlib import Path
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v107_{week}_config.json').read_text())
              for extension in (0.75,1.00,1.25):
                  obj=json.loads(json.dumps(base))
                  scenario=obj['scenario']
                  scenario['volatility_quantile']=0.55
                  scenario['target_extension']=0.0
                  scenario['minimum_cost_after_rr']=0.65
                  scenario['maximum_cost_after_rr']=4.0
                  scenario['maximum_holding_minutes']=60
                  scenario['decision_window_minutes']=15
                  scenario['activation_delay_minutes']=1
                  scenario['resolution_stop_buffer_atr']=0.15
                  scenario['continuation_extension']=extension
                  tag=int(round(extension*100))
                  obj['candidate']=f'candidate-02-v142-dual-e{tag}'
                  Path(f'/tmp/v142-config/{week}-e{tag}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader development screens
        shell: bash
        run: |
          set -euo pipefail
          for extension in 75 100 125; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v142/e${extension}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v142_nt_backtest.py \
                --config "/tmp/v142-config/${week}-e${extension}.json" \
                --input-root "inputs/v142-${week}" \
                --output "$out" \
                | tee "artifacts-v142-e${extension}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          keys=('trades','trades_per_day','win_rate','profit_factor_after_cost',
                'geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown',
                'target_met')
          out={
              'candidate':'candidate-02-v142-dual-auction-rotation-continuation',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'decision_window_minutes':15,
              'activation_delay_minutes':1,
              'variants':{},
          }
          for extension in (75,100,125):
              out['variants'][str(extension)]={
                  week:json.loads(Path(
                      f'artifacts/candidate-02-v142/e{extension}/{week}/metrics.json'
                  ).read_text())
                  for week in ('week1','week2')
              }
          passes={
              key:all(metric['target_met'] for metric in weeks.values())
              for key,weeks in out['variants'].items()
          }
          out['variant_both_week_pass']=passes
          out['plateau_pass']=passes['100'] and (passes['75'] or passes['125'])
          out['status']='READY_FOR_PROSPECTIVE_WEEK' if out['plateau_pass'] else 'DEVELOPMENT_REJECT'
          Path('artifacts-v142-family-decision.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'status':out['status'],
              'passes':passes,
              'metrics':{
                  variant:{week:{key:metric.get(key) for key in keys}
                           for week,metric in weeks.items()}
                  for variant,weeks in out['variants'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact causal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v142
          mkdir compact-v142
          cp -f artifacts-v142-*.json compact-v142/ 2>/dev/null || true
          cp -f artifacts-v142-*.log compact-v142/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v142 compact-v142/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v142-family-decision.json; then
            destination="research/candidate-02/results/v142_family/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v142/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v142 dual-auction evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "candidate-02-v142-family-${{ github.sha }}"
          path: compact-v142
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
