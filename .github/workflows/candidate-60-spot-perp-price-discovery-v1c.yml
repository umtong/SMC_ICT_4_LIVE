name: candidate-60-spot-perp-price-discovery-v1c

on:
  push:
    branches: ["research/candidate-60"]
    paths:
      - ".github/workflows/candidate-60-spot-perp-price-discovery-v1c.yml"
      - "research/candidate-60/SPOT_PERP_PRICE_DISCOVERY_V1_FREEZE.md"
      - "research/candidate-60/spot_perp_price_discovery_diagnostic_v1c.b64.part*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-60-spot-perp-price-discovery-v1c
  cancel-in-progress: true

jobs:
  same-asset-price-discovery-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-60
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reassemble and verify frozen diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-60/SPOT_PERP_PRICE_DISCOVERY_V1_FREEZE.md
          cat research/candidate-60/spot_perp_price_discovery_diagnostic_v1c.b64.part* \
            > .work-spot-perp.b64
          test "$(wc -c < .work-spot-perp.b64)" = "9004"
          test "$(sha256sum .work-spot-perp.b64 | awk '{print $1}')" = \
            "66d37d8d2673912760a69817834aa1ecc438d49fce3a35375a5554fff029aad5"
          base64 -d .work-spot-perp.b64 > .work-spot-perp.py.gz
          test "$(sha256sum .work-spot-perp.py.gz | awk '{print $1}')" = \
            "78afbd8b513aaaf610b5c3d943143bc63e0da3a29635ae744d343bfae963debd"
          gzip -dc .work-spot-perp.py.gz \
            > research/candidate-60/spot_perp_price_discovery_diagnostic.py
          test "$(sha256sum research/candidate-60/spot_perp_price_discovery_diagnostic.py | awk '{print $1}')" = \
            "8add43be828673c528f19f3577da579860978ae71cc537a86010a21b9aba8de7"
          python -m py_compile \
            research/candidate-60/spot_perp_price_discovery_diagnostic.py

      - name: Install locked environment and prove causal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run python - <<'PY'
          import importlib.util
          import inspect
          from pathlib import Path
          import sys

          path = Path("research/candidate-60/spot_perp_price_discovery_diagnostic.py")
          spec = importlib.util.spec_from_file_location("c60_spot_perp", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          source = inspect.getsource(module.event_rows)
          assert 'spot_flow_direction.eq(spot_direction)' in source
          assert 'frame["spot_ret_bps"].abs().gt(frame["perp_ret_bps"].abs())' in source
          assert 'perp_flow_direction.eq(perp_direction)' in source
          assert 'spot_direction.ne(perp_direction)' in source
          assert 'spot_flow_direction.ne(perp_direction)' in source
          assert module.PRIMARY_HORIZON == 30
          assert module.ROUND_TRIP_COST_BPS == 20.0
          main_source = inspect.getsource(module.main)
          assert main_source.index('development_data, development_raw = load_all') < main_source.index('if eligible:') < main_source.index('fresh_data, fresh_raw = load_all')
          print("spot/perp dominance, causal next-open, cost and untouched-data contracts verified")
          PY

      - name: Run development and conditional fresh diagnostic
        id: diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-60-spot-perp-price-discovery-v1c-console
          set -o pipefail
          uv run python research/candidate-60/spot_perp_price_discovery_diagnostic.py \
            2>&1 | tee \
            .work/candidate-60-spot-perp-price-discovery-v1c-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact price-discovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .work-spot-perp.b64 \
            .work-spot-perp.py.gz \
            research/candidate-60/spot_perp_price_discovery_diagnostic.py
          git config user.name "candidate-60-research-bot"
          git config user.email "candidate-60-research-bot@users.noreply.github.com"
          out=research/candidate-60/evidence/spot-perp-price-discovery-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate60: persist spot-perp price-discovery evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-60
                git rebase origin/research/candidate-60
                if git push origin HEAD:research/candidate-60; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-60-spot-perp-price-discovery-v1c
          path: |
            research/candidate-60/evidence/spot-perp-price-discovery-v1
            .work/candidate-60-spot-perp-price-discovery-v1c-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce diagnostic validity
        if: always()
        shell: bash
        run: |
          status="${{ steps.diagnostic.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "spot-perp diagnostic failed; status=$status"
            exit "${status:-1}"
          fi
