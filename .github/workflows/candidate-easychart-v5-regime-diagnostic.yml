name: candidate-easychart-v5-regime-diagnostic

on:
  push:
    branches: ["research/candidate-easychart-v5-regime-diagnostic"]
    paths:
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v5-regime-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v5-regime-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  untouched-micro-bearish-regime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-v5-regime-diagnostic
      ROOT: artifacts/candidate-easychart-v5-regime-diagnostic
    steps:
      - uses: actions/checkout@v4

      - name: Environment and causal semantic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v

      - name: Untouched August 2024 micro-only continuous account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/august-2024-micro"
          exec > >(tee "$ROOT/run.log") 2>&1
          python research/candidate-easychart-v5/run_mtf_backtest_v5_ablation.py \
            --start 2024-08-01 \
            --end 2024-08-14 \
            --warmup-days 30 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT/august-2024-micro" \
            --scale micro
          cp research/candidate-easychart-v5/REGIME_DIAGNOSTIC_RESERVATION.json "$ROOT/"

      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v5-regime-diagnostic-${{ github.sha }}
          path: artifacts/candidate-easychart-v5-regime-diagnostic/**
          if-no-files-found: warn
          retention-days: 90
