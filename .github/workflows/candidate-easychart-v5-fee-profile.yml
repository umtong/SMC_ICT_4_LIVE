name: candidate-easychart-v5-fee-profile

on:
  push:
    branches: ["research/candidate-easychart-v5-fee-profile"]
    paths:
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v5-fee-profile.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v5-fee-profile
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  cost-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-v5-fee-profile
      ROOT: artifacts/candidate-easychart-v5-fee-profile
    steps:
      - uses: actions/checkout@v4

      - name: Environment and fee contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v

      - name: Legacy and USD-M regular-tier cost profiles
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/run.log") 2>&1
          for PERIOD_SPEC in \
            "february 2024-02-01 2024-02-14" \
            "august 2024-08-01 2024-08-14"; do
            set -- $PERIOD_SPEC
            PERIOD="$1"
            START="$2"
            END="$3"
            for PROFILE in legacy_7_5bps usd_m_vip0; do
              OUT="$ROOT/$PERIOD/$PROFILE"
              mkdir -p "$OUT"
              python research/candidate-easychart-v5/run_mtf_backtest_v5_fee_profile.py \
                --start "$START" \
                --end "$END" \
                --warmup-days 30 \
                --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
                --cache "$CACHE" \
                --output "$OUT" \
                --fee-profile "$PROFILE"
            done
          done

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("artifacts/candidate-easychart-v5-fee-profile")
          fields = (
              "final_nav",
              "total_return",
              "daily_geometric_growth",
              "closed_positions",
              "independent_trades_per_day",
              "plans",
              "submitted_plans",
              "risk_budget_breaches",
              "emergency_protective_exits",
              "maker_fee_rate",
              "taker_fee_rate",
          )
          comparison = {}
          for period in ("february", "august"):
              comparison[period] = {}
              for profile in ("legacy_7_5bps", "usd_m_vip0"):
                  metrics = json.loads(
                      (root / period / profile / "metrics.json").read_text(encoding="utf-8"),
                  )
                  comparison[period][profile] = {
                      field: metrics.get(field) for field in fields
                  }
          (root / "comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(comparison, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v5-fee-profile-${{ github.sha }}
          path: artifacts/candidate-easychart-v5-fee-profile/**
          if-no-files-found: warn
          retention-days: 90
