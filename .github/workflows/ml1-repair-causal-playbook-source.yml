name: ml1-repair-causal-playbook-source

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-repair-causal-playbook-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0
      - name: Restore UTF-8 Python source and keep untouched objectives
        run: |
          path='research/candidate-easychart_ml1/causal_playbook_v1.py'
          python - <<'PY'
          from pathlib import Path
          import gzip
          path = Path('research/candidate-easychart_ml1/causal_playbook_v1.py')
          raw = path.read_bytes()
          if raw[:2] == b'\x1f\x8b':
              text = gzip.decompress(raw).decode('utf-8')
          else:
              text = raw.decode('utf-8')
          old = '''            hit = np.flatnonzero(touched)\n            if not len(hit):\n                continue\n            first_touch = start_index + int(hit[0])\n'''
          new = '''            hit = np.flatnonzero(touched)\n            # A confirmed pool is known even when the sample later ends before a touch.\n            # Removing it using future non-arrival leaks information and erases valid targets.\n            first_touch = start_index + int(hit[0]) if len(hit) else len(frame)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          if 'first_touch = start_index + int(hit[0]) if len(hit) else len(frame)' not in text:
              raise SystemExit('causal untouched-pool fix missing')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ml1): keep confirmed untouched liquidity objectives causal'
            git pull --rebase origin research_ML1
            git push origin HEAD:research_ML1
          fi
