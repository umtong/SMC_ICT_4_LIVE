name: ml1-repair-causal-playbook-source

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-repair-causal-playbook-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0
      - name: Install audited UTF-8 causal playbook source
        env:
          SOURCE_GZIP_BASE64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, os
          path = Path('research/candidate-easychart_ml1/causal_playbook_v1.py')
          source = gzip.decompress(base64.b64decode(os.environ['SOURCE_GZIP_BASE64']))
          source.decode('utf-8')
          path.write_bytes(source)
          PY
          python -m py_compile research/candidate-easychart_ml1/causal_playbook_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/candidate-easychart_ml1/causal_playbook_v1.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ml1): align causal plan timing and complete outcome horizons'
            git pull --rebase origin research_ML1
            git push origin HEAD:research_ML1
          fi
