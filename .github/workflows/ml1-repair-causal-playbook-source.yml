name: ml1-repair-causal-playbook-source

on:
  push:
    branches: ["research_ML1"]
    paths:
      - "research/candidate-easychart_ml1/.causal_playbook_repair_dispatch"
      - ".github/workflows/ml1-repair-causal-playbook-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0
      - name: Correct information timing and outcome horizon
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/candidate-easychart_ml1/causal_playbook_v1.py')
          text = path.read_text(encoding='utf-8')

          old = '''from data_re1_flow import load_range_flow  # type: ignore  # noqa: E402
          try:
              from mechanism_data_v2 import (  # type: ignore  # noqa: E402
                  attach_derivatives_context,
                  load_metrics_range,
                  load_premium_range,
              )
          except Exception:  # pragma: no cover - local smoke fallback
              attach_derivatives_context = None
              load_metrics_range = None
              load_premium_range = None
          '''.replace('          ', '')
          new = '''from data_re1_flow import load_range_flow  # type: ignore  # noqa: E402
          from mechanism_data_v2 import (  # type: ignore  # noqa: E402
              attach_derivatives_context,
              load_metrics_range,
              load_premium_range,
          )
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('import block not found')
          text = text.replace(old, new, 1)

          old = '''    warmup = start - timedelta(days=WARMUP_DAYS)
              frame = load_range_flow(symbol, warmup, end, cache / "bars")
              if attach_derivatives_context is not None:
                  try:
                      metrics = load_metrics_range(symbol, warmup, end, cache / "derivatives")
                      premium = load_premium_range(symbol, warmup, end, cache / "derivatives")
                      frame = attach_derivatives_context(frame, metrics, premium)
                  except Exception as exc:
                      print(f"[{symbol}] derivative context unavailable: {exc}", flush=True)
          '''.replace('              ', '')
          new = '''    warmup = start - timedelta(days=WARMUP_DAYS)
              # Decisions stop at end; one later day is loaded only so frozen plans receive
              # their complete intraday outcome horizon instead of sample-boundary timeouts.
              data_end = end + timedelta(days=1)
              frame = load_range_flow(symbol, warmup, data_end, cache / "bars")
              metrics = load_metrics_range(symbol, warmup, data_end, cache / "derivatives")
              premium = load_premium_range(symbol, warmup, data_end, cache / "derivatives")
              frame = attach_derivatives_context(frame, metrics, premium)
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('load block not found')
          text = text.replace(old, new, 1)

          start = text.index('def _response_zone(')
          end = text.index('\n\ndef _find_mss_response(', start)
          replacement = '''def _response_zone(
              frame: pd.DataFrame,
              event_index: int,
              displacement_index: int,
              side: int,
              tick: float,
              end_index: int,
          ) -> tuple[float, float, str, int] | None:
              """First actionable FVG or the causal displacement's last opposite OB.

              A three-candle FVG is knowable only after the candle following the
              displacement closes. OB body geometry is available at displacement close.
              """
              confirm_index = displacement_index + 1
              if displacement_index >= 1 and confirm_index <= end_index:
                  if side > 0:
                      lower = float(frame.iloc[displacement_index - 1]["high"])
                      upper = float(frame.iloc[confirm_index]["low"])
                  else:
                      lower = float(frame.iloc[confirm_index]["high"])
                      upper = float(frame.iloc[displacement_index - 1]["low"])
                  if upper - lower >= tick:
                      return lower, upper, "FVG", confirm_index
              for index in range(
                  displacement_index - 1,
                  max(event_index - 1, displacement_index - 5),
                  -1,
              ):
                  row = frame.iloc[index]
                  bearish = float(row["close"]) < float(row["open"])
                  if (side > 0 and bearish) or (side < 0 and not bearish):
                      lower = min(float(row["open"]), float(row["close"]))
                      upper = max(float(row["open"]), float(row["close"]))
                      if upper - lower >= tick:
                          return lower, upper, "OB_BODY", displacement_index
              return None
          '''.replace('          ', '')
          text = text[:start] + replacement + text[end:]

          old = '''    zone = _response_zone(frame, event_index, response_index, side, tick)
              if zone is None:
                  return None
              lower, upper, zone_kind = zone
              entry = 0.5 * (lower + upper)
              response_close = float(frame.iloc[response_index]["close"])
          '''.replace('              ', '')
          new = '''    zone = _response_zone(frame, event_index, response_index, side, tick, end_index)
              if zone is None:
                  return None
              lower, upper, zone_kind, decision_index = zone
              entry = 0.5 * (lower + upper)
              response_close = float(frame.iloc[response_index]["close"])
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('reversal zone block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''        pools, side, entry, invalidation, response_index,
                      pd.Timestamp(frame.iloc[response_index]["time"]), tick,
              '''.replace('              ', ''),
              '''        pools, side, entry, invalidation, decision_index,
                      pd.Timestamp(frame.iloc[decision_index]["time"]), tick,
              '''.replace('              ', ''),
              1,
          )
          text = text.replace('expiry = min(end_index, response_index + 18)', 'expiry = min(end_index, decision_index + 18)', 1)
          text = text.replace('order_time = pd.Timestamp(frame.iloc[response_index]["time"])', 'order_time = pd.Timestamp(frame.iloc[decision_index]["time"])', 1)
          text = text.replace('response_index=response_index,\n        response_time=order_time,', 'response_index=decision_index,\n        response_time=order_time,', 1)

          old = '''    pools = (
              _confirmed_pools(symbol, frame, 5)
              + _confirmed_pools(symbol, frame, 15)
          )
          '''.replace('          ', '')
          new = '''    pools = (
              _confirmed_pools(symbol, frame, 5)
              + _confirmed_pools(symbol, frame, 15)
              + _confirmed_pools(symbol, frame, 60)
          )
          '''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
          elif '+ _confirmed_pools(symbol, frame, 60)' not in text:
              raise SystemExit('pool timeframe block not found')

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile research/candidate-easychart_ml1/causal_playbook_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/candidate-easychart_ml1/causal_playbook_v1.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ml1): align causal plan timing and complete outcome horizons'
            git pull --rebase origin research_ML1
            git push origin HEAD:research_ML1
          fi
