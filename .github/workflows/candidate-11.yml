name: Candidate 11 Nautilus validation

on:
  push:
    branches: [research/candidate-11]
    paths:
      - "research/candidate-11/**"
      - ".github/workflows/candidate-11.yml"
  workflow_dispatch:
    inputs:
      week:
        description: Frozen evaluation week
        required: true
        default: W1
        type: choice
        options: [W1, W2, W3]

permissions:
  contents: write

concurrency:
  group: candidate-11-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist the tested Nautilus bar adapter in the runner branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-11/run.py")
          source = path.read_text(encoding="utf-8")

          logic_import = "from logic import BarObs, CausalAuctionEngine, Direction, LogicConfig, RiskSizer\n"
          adapter_import = "from bar_adapter import build_bars\n"
          if adapter_import not in source:
              if logic_import not in source:
                  raise SystemExit("candidate logic import anchor not found")
              source = source.replace(logic_import, logic_import + adapter_import)

          source = source.replace(
              "    from nautilus_trader.persistence.wranglers import BarDataWrangler\n",
              "",
          )

          old_block = """    wrangle_columns = [\"open\", \"high\", \"low\", \"close\", \"volume\"]
    wrangle_matrix = frame[wrangle_columns].to_numpy(dtype=\"float64\", copy=True)
    wrangle_matrix.setflags(write=True)
    wrangle_frame = pd.DataFrame(
        wrangle_matrix,
        index=frame.index.copy(),
        columns=wrangle_columns,
        copy=False,
    )
    wrangle_frame.values.setflags(write=True)
    bars = BarDataWrangler(bar_type, instrument).process(wrangle_frame)
"""
          legacy_block = """    wrangle_frame = frame[[\"open\", \"high\", \"low\", \"close\", \"volume\"]].copy()
    bars = BarDataWrangler(bar_type, instrument).process(wrangle_frame)
"""
          direct_block = "    bars = build_bars(frame, bar_type, instrument)\n"
          if old_block in source:
              source = source.replace(old_block, direct_block)
          elif legacy_block in source:
              source = source.replace(legacy_block, direct_block)
          elif direct_block not in source:
              raise SystemExit("Nautilus bar construction anchor not found")

          path.write_text(source, encoding="utf-8")
          PY
          if ! git diff --quiet -- research/candidate-11/run.py; then
            git config user.name "candidate-11-bot"
            git config user.email "candidate-11-bot@users.noreply.github.com"
            git add research/candidate-11/run.py
            git commit -m "candidate-11: use tested direct Nautilus bar adapter"
            git push origin HEAD:research/candidate-11
          fi

      - name: Verify prebuilt research environment
        run: smc4 doctor

      - name: Compile and test candidate logic
        run: |
          python -m py_compile \
            research/candidate-11/bar_adapter.py \
            research/candidate-11/logic.py \
            research/candidate-11/run.py
          python -m unittest discover -s research/candidate-11 -p 'test_*.py' -v

      - name: Run frozen week through NautilusTrader
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=W1; fi
          rm -rf "research/candidate-11/results/$WEEK"
          python research/candidate-11/run.py \
            --week "$WEEK" \
            --output "research/candidate-11/results/$WEEK"

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-11-${{ github.run_id }}
          path: research/candidate-11/results/
          if-no-files-found: warn
          retention-days: 30
