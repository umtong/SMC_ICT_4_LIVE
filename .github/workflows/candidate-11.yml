name: Candidate 11 Nautilus validation

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/**"
      - ".github/workflows/candidate-11.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/candidate-11/**"
      - ".github/workflows/candidate-11.yml"
  workflow_dispatch:
    inputs:
      week:
        description: Frozen evaluation week
        required: true
        default: W1
        type: choice
        options:
          - W1
          - W2
          - W3

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Persist tested Nautilus bar adapter wiring
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-11/run.py")
          source = path.read_text(encoding="utf-8")
          logic_import = "from logic import BarObs, CausalAuctionEngine, Direction, LogicConfig, RiskSizer\n"
          adapter_import = "from bar_adapter import build_bars\n"
          if adapter_import not in source:
              if logic_import not in source:
                  raise SystemExit("candidate logic import anchor not found")
              source = source.replace(logic_import, logic_import + adapter_import, 1)

          source = source.replace(
              "    from nautilus_trader.persistence.wranglers import BarDataWrangler\n",
              "",
              1,
          )
          start = '    wrangle_columns = ["open", "high", "low", "close", "volume"]\n'
          end = '    flows = frame["taker_buy_volume"].astype(float).tolist()\n'
          if start in source:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              source = source[:start_index] + "    bars = build_bars(frame, bar_type, instrument)\n" + source[end_index:]
          elif "    bars = build_bars(frame, bar_type, instrument)\n" not in source:
              raise SystemExit("Nautilus bar construction anchor not found")

          path.write_text(source, encoding="utf-8")
          PY
          if ! git diff --quiet -- research/candidate-11/run.py; then
            git config user.name "candidate-11-bot"
            git config user.email "candidate-11-bot@users.noreply.github.com"
            git add research/candidate-11/run.py
            git commit -m "candidate-11: wire tested Nautilus bar adapter"
            git push origin HEAD:research/candidate-11
          fi

      - name: Verify prebuilt research environment
        shell: bash
        run: smc4 doctor

      - name: Compile and test candidate invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-11/bar_adapter.py \
            research/candidate-11/logic.py \
            research/candidate-11/run.py
          python -m unittest discover -s research/candidate-11 -p 'test_*.py' -v

      - name: Run frozen week through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=W1; fi
          rm -rf "research/candidate-11/results/$WEEK"
          python research/candidate-11/run.py \
            --week "$WEEK" \
            --output "research/candidate-11/results/$WEEK"
          test -s "research/candidate-11/results/$WEEK/run.json"
          test -s "research/candidate-11/results/$WEEK/metrics.json"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=W1; fi
          METRICS="research/candidate-11/results/$WEEK/metrics.json"
          if [ -s "$METRICS" ]; then
            python - "$METRICS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          metrics = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## Candidate 11 frozen-week result")
          for key in (
              "week_id",
              "daily_geometric_growth",
              "closed_trades",
              "win_rate",
              "payoff_ratio",
              "closed_trade_max_drawdown",
              "promising_gate_passed",
              "complete_gate_passed",
              "success_claim",
          ):
              print(f"- **{key}**: `{metrics.get(key)}`")
          PY
          else
            echo "## Candidate 11 run produced no metrics" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-11-${{ github.run_id }}
          path: research/candidate-11/results/
          if-no-files-found: warn
          retention-days: 30
