name: Candidate 11 SCDAM validation

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/**"
      - ".github/workflows/candidate-11.yml"
  pull_request:
    branches:
      - main
      - research/candidate-11
    paths:
      - "research/candidate-11/**"
      - ".github/workflows/candidate-11.yml"
  workflow_dispatch:
    inputs:
      week:
        description: Frozen evaluation week
        required: true
        default: W1
        type: choice
        options: [W1, W2, W3]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Materialize verified SCDAM source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python research/candidate-11/materialize_scdam.py
          python research/candidate-11/apply_boundary_consumption.py
          chmod +x research/candidate-11/ci_validate.sh
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$(git status --porcelain -- research/candidate-11)" ]; then
            git config user.name "candidate-11-bot"
            git config user.email "candidate-11-bot@users.noreply.github.com"
            git add -A research/candidate-11
            git commit -m "candidate-11: materialize consumed-liquidity variant [skip ci]"
            git push origin HEAD:research/candidate-11
          fi

      - name: Run causal contracts and frozen NautilusTrader interval
        shell: bash
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week }}
        run: |
          WEEK="$REQUESTED_WEEK"
          if [ -z "$WEEK" ]; then WEEK=W1; fi
          bash research/candidate-11/ci_validate.sh "$WEEK"

      - name: Publish metrics summary
        if: always()
        shell: bash
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week }}
        run: |
          WEEK="$REQUESTED_WEEK"
          if [ -z "$WEEK" ]; then WEEK=W1; fi
          METRICS="research/candidate-11/results/$WEEK/metrics.json"
          if [ -s "$METRICS" ]; then
            python - "$METRICS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path
          metrics = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## Candidate 11 SCDAM")
          for key in (
              "week_id", "daily_geometric_growth", "closed_trades", "win_rate",
              "payoff_ratio", "closed_trade_max_drawdown", "submitted_plans",
              "liquidation_detected", "promising_gate_passed",
              "complete_gate_passed", "success_claim",
          ):
              print(f"- **{key}**: `{metrics.get(key)}`")
          PY
          else
            echo "## Candidate 11 produced no metrics" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full evidence and tested source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-11-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/candidate-11/results/
            research/candidate-11/*.py
            research/candidate-11/*.json
            research/candidate-11/*.md
            research/candidate-11/*.sh
          if-no-files-found: warn
          retention-days: 30
