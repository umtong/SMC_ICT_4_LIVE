name: candidate-03-v18-sparse-staged-container

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v18-sparse-staged-container.yml"
      - "research/candidate-03/run_v18_sparse_staged_container.py"
      - "research/candidate-03/prepare_nt_lvcfr_v18_sparse.py"
      - "research/candidate-03/test_prepare_nt_lvcfr_v18_sparse.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-03-v18-preflight-standalone
  cancel-in-progress: false

jobs:
  staged-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run sparse writable V18 controller from exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          token = os.environ['GITHUB_TOKEN']
          path = 'research/candidate-03/run_v18_sparse_staged_container.py'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/{path}?ref={commit}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'candidate-03-v18-sparse-staged-container',
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.loads(response.read().decode())
          target = Path('/tmp/run_v18_sparse_staged_container.py')
          target.write_bytes(base64.b64decode(payload['content']))
          PY
          python /tmp/run_v18_sparse_staged_container.py
