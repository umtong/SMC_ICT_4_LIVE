name: Candidate 09 v14 fixed pooled gate and long evaluation

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v14-fixed.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v14-fixed-account-exhaustion
  cancel-in-progress: true

jobs:
  activate-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/research/candidate-09:${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09
      V14_RUNNER_REVISION: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Activate, test, and evaluate frozen v14 with complete evidence
        shell: bash
        run: bash research/candidate-09/run_v14_fixed_ci.sh

      - name: Preserve exact v14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v14-fixed-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v14-fixed-gate-long
            research/candidate-09/archive/v13
            research/candidate-09/config.json
            research/candidate-09/config_v14.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v10_direct.py
            research/candidate-09/state_engine_v13_direct.py
            research/candidate-09/state_engine_v14_direct.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/apply_v14_run_patch.py
            research/candidate-09/apply_v14_evidence_fix.py
            research/candidate-09/apply_v14_account_exhaustion_fix.py
            research/candidate-09/run_v14_fixed_ci.sh
            research/candidate-09/tests
            research/candidate-09/tests_v14
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact fixed v14 evidence without generated-source conflicts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          root="$repo/research/candidate-09"
          tmp=$(mktemp -d)
          mkdir -p "$tmp/evidence-latest" "$tmp/v14-fixed-gate-long"
          [[ -d "$root/evidence/latest" ]] && cp -a "$root/evidence/latest/." "$tmp/evidence-latest/"
          [[ -d "$root/diagnostics/v14-fixed-gate-long" ]] && cp -a "$root/diagnostics/v14-fixed-gate-long/." "$tmp/v14-fixed-gate-long/"

          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" fetch origin "$GITHUB_REF_NAME"
          git -C "$repo" reset --hard "origin/$GITHUB_REF_NAME"
          git -C "$repo" clean -fd research/candidate-09

          rm -rf "$root/evidence/latest" "$root/diagnostics/v14-fixed-gate-long"
          mkdir -p "$root/evidence/latest" "$root/diagnostics/v14-fixed-gate-long"
          cp -a "$tmp/evidence-latest/." "$root/evidence/latest/"
          cp -a "$tmp/v14-fixed-gate-long/." "$root/diagnostics/v14-fixed-gate-long/"

          git -C "$repo" add \
            research/candidate-09/evidence/latest \
            research/candidate-09/diagnostics/v14-fixed-gate-long
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v14: complete long result ${status}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
