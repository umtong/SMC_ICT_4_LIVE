name: candidate-08-data-buffer-patch

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.patch-data-bars"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace pandas writable-memoryview handoff with direct Nautilus Bars
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/data.py")
          source = path.read_text(encoding="utf-8")
          old_import = "from nautilus_trader.persistence.wranglers import BarDataWrangler\n"
          new_import = "from nautilus_trader.model.data import Bar\nfrom nautilus_trader.model.objects import Price, Quantity\n"
          old_block = '''    wrangler_frame = frame[["open", "high", "low", "close", "volume"]].astype(float)\n    bars = BarDataWrangler(bar_type, instrument).process(wrangler_frame)\n'''
          new_block = '''    # Build official Nautilus ``Bar`` objects directly. Pandas 3 copy-on-write can\n    # expose ``DataFrame.values`` as read-only, while the pinned Cython wrangler\n    # requests a writable memoryview. Direct construction preserves the exact same\n    # Nautilus data type and timestamp semantics without a compatibility-dependent\n    # pandas buffer hand-off.\n    values = frame[["open", "high", "low", "close", "volume"]].to_numpy(\n        dtype="float64",\n        copy=True,\n    )\n    timestamps_ns = frame.index.asi8\n    bars = [\n        Bar(\n            bar_type=bar_type,\n            open=Price(float(row[0]), instrument.price_precision),\n            high=Price(float(row[1]), instrument.price_precision),\n            low=Price(float(row[2]), instrument.price_precision),\n            close=Price(float(row[3]), instrument.price_precision),\n            volume=Quantity(float(row[4]), instrument.size_precision),\n            ts_event=int(timestamp_ns),\n            ts_init=int(timestamp_ns),\n        )\n        for row, timestamp_ns in zip(values, timestamps_ns, strict=True)\n    ]\n'''
          if source.count(old_import) != 1:
              raise SystemExit(f"expected one wrangler import, found {source.count(old_import)}")
          if source.count(old_block) != 1:
              raise SystemExit(f"expected one wrangler block, found {source.count(old_block)}")
          source = source.replace(old_import, new_import).replace(old_block, new_block)
          path.write_text(source, encoding="utf-8")
          PY
          rm research/candidate-08/.patch-data-bars
          python -m compileall -q research/candidate-08/data.py
          grep -nE 'model.data import Bar|timestamps_ns' research/candidate-08/data.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-08/data.py research/candidate-08/.patch-data-bars
          git commit -m "candidate-08: construct Nautilus bars from owned arrays"
          git push origin HEAD:research/candidate-08
