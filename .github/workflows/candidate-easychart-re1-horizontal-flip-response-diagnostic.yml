name: candidate-easychart-re1-horizontal-flip-response-diagnostic

on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths:
      - "research/candidate-easychart_re1/.horizontal_flip_response_dispatch_marker"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-horizontal-flip-response-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: february-2025-short, start: 2025-02-01, end: 2025-02-10}
          - {period: live-examples-2025-short, start: 2025-08-10, end: 2025-08-20}
          - {period: february-2026-guard, start: 2026-02-01, end: 2026-02-14}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-horizontal-flip-response/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-horizontal-flip-response/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile candidate
        run: |
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_local_auction_continuation.py \
            research/candidate-easychart_re1/easychart_re1_local_auction_continuation_v2.py \
            research/candidate-easychart_re1/easychart_re1_horizontal_flip_response.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_horizontal_flip_response.py
      - name: Construction smoke
        run: |
          python - <<'PY'
          from easychart_re1_horizontal_flip_response import EasyChartRE1HorizontalFlipResponseBundle
          bundle = EasyChartRE1HorizontalFlipResponseBundle("BTCUSDT", 0.1)
          assert bundle.horizontal_flip_response.micro_objectives.pivot_spans == (6,)
          assert bundle.local_continuation.micro_objectives.pivot_spans == (6,)
          PY
      - name: Run four-symbol continuous account
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_horizontal_flip_response.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-horizontal-flip-response-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-horizontal-flip-response/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
