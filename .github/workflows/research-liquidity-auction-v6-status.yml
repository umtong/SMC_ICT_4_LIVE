name: Mirror liquidity auction v6 workflow status

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v6"]
    paths:
      - ".github/workflows/research-liquidity-auction-v6-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v6
      - name: Read latest research runs
        run: |
          set -euo pipefail
          mkdir -p research_results/liquidity_auction_v6/workflow_status
          python - <<'PY'
          import json, os, subprocess
          workflows = {
              "clean": "research-liquidity-auction-v6-clean.yml",
              "economic": "research-liquidity-auction-v6-economic.yml",
              "economic_medium": "research-liquidity-auction-v6-economic-medium.yml",
              "fixed": "research-liquidity-auction-v6-sequential-fixed.yml",
              "rich": "research-liquidity-auction-v6-rich-diagnostic.yml",
          }
          output = {}
          for name, workflow in workflows.items():
              command = [
                  "gh", "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{workflow}/runs",
                  "-f", "branch=research_liquidity_auction_v6", "-f", "per_page=1",
              ]
              try:
                  data = json.loads(subprocess.check_output(command, text=True))
                  runs = data.get("workflow_runs", [])
                  if not runs:
                      output[name] = {"status": "NO_RUN"}
                      continue
                  run = runs[0]
                  output[name] = {
                      "id": run["id"], "status": run["status"],
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                      "created_at": run.get("created_at"),
                      "updated_at": run.get("updated_at"),
                  }
                  if run.get("conclusion") == "failure":
                      try:
                          jobs = json.loads(subprocess.check_output([
                              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/jobs"
                          ], text=True)).get("jobs", [])
                          output[name]["failed_jobs"] = [
                              {"id": job["id"], "name": job["name"]}
                              for job in jobs if job.get("conclusion") == "failure"
                          ]
                      except Exception as error:
                          output[name]["jobs_error"] = repr(error)
              except Exception as error:
                  output[name] = {"status": "QUERY_ERROR", "error": repr(error)}
          path = "research_results/liquidity_auction_v6/workflow_status/status.json"
          with open(path, "w") as file:
              json.dump(output, file, indent=2)
              file.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/liquidity_auction_v6/workflow_status/status.json
          git commit -m "Record latest v6 research workflow status" || exit 0
          git push origin HEAD:research_liquidity_auction_v6
