name: candidate-03-source-export

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-source-export.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package current candidate source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf candidate-03-current-source.tar.gz \
            research/candidate-03 \
            .github/workflows/candidate-03.yml \
            src/smc_ict_4 \
            PROJECT_PRINCIPLES.md \
            docs
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-03-current-source-${{ github.sha }}
          path: candidate-03-current-source.tar.gz
          if-no-files-found: error
          retention-days: 3

# Export marker: current candidate source snapshot.
