name: candidate-01-directional-change-feature-export

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-directional-change-feature-export.yml"
      - "research/candidate-01/export_directional_change_features.py"
      - "research/candidate-01/directional_change_failed_sweep_week.py"
      - "research/candidate-01/aggtrade_data.py"
      - "research/candidate-01/aggtrade_clock.py"
      - "research/candidate-01/impact_regime_probe.py"
      - "research/candidate-01/data.py"
      - "tests/test_candidate_01_directional_change.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: week-1
            week: "2023-06-19"
          - label: week-2
            week: "2022-08-01"
          - label: week-3
            week: "2025-11-10"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-dc-feature-${{ matrix.label }}
          key: candidate-01-dc-feature-BTCUSDT-${{ matrix.week }}-${{ runner.os }}-v1
      - name: Export one frozen BTC week of causal event features
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/aggtrade_data.py \
                research/candidate-01/aggtrade_clock.py \
                research/candidate-01/impact_regime_probe.py \
                research/candidate-01/directional_change_failed_sweep_week.py \
                research/candidate-01/export_directional_change_features.py
              python -m unittest discover -s tests -p "test_candidate_01_directional_change.py" -v
              rm -rf artifacts/candidate-01-dc-feature-${{ matrix.label }}
              python research/candidate-01/export_directional_change_features.py \
                --week ${{ matrix.week }} \
                --cache .cache/candidate-01-dc-feature-${{ matrix.label }} \
                --output artifacts/candidate-01-dc-feature-${{ matrix.label }} \
                --workers 4
            '
      - name: Print feature manifest
        run: cat artifacts/candidate-01-dc-feature-${{ matrix.label }}/directional_change_feature_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-dc-feature-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/candidate-01-dc-feature-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
