name: candidate-47-structural-continuous-recorder

on:
  push:
    branches: ["research/candidate-47"]
    paths:
      - ".github/workflows/candidate-47-structural-continuous-recorder.yml"
  workflow_dispatch:

concurrency:
  group: candidate-47-structural-continuous-recorder
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-structural-recorder-equivalence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify environment and recorder ownership
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-47/kline_only_inputs.py \
            research/candidate-47/ichifan_structural_recorder_strategy.py \
            research/candidate-47/ichifan_structural_recorder_launch.py
          python - <<'PY'
          from pathlib import Path
          import ichifan_structural_recorder_strategy as strategy
          root = Path("research/candidate-47").resolve()
          assert Path(strategy.__file__).resolve() == root / "ichifan_structural_recorder_strategy.py"
          assert strategy.Candidate35Strategy is strategy.Candidate47IchiFanStructuralRecorderStrategy
          PY

      - name: Replay known development week with recorder only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-47/ichifan_structural_recorder_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start 2026-07-01 \
            --end 2026-07-07 \
            --cache .cache/candidate-47-structural-recorder-equivalence \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Prove kline-only recorder does not change trading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = metrics["strategy_diagnostics"]
          snapshots = json.loads((root / "followthrough_snapshots.json").read_text())
          endpoints = {
              symbol: record.get("evidence_endpoints", {})
              for symbol, record in metrics["input_records"].items()
          }
          summary = {
              "candidate": metrics["candidate"],
              "trading_policy": metrics["trading_policy"],
              "input_mode": metrics["input_mode"],
              "evaluation_start": metrics["evaluation_start"],
              "evaluation_end": metrics["evaluation_end"],
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "profit_factor": metrics["profit_factor"],
              "snapshots": len(snapshots),
              "snapshot_ages": sorted({item["age_minutes"] for item in snapshots}),
              "input_endpoints": endpoints,
              "gate_checks": metrics["gate_checks"],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          # Exact frozen structural result from the previously verified full-input
          # replay.  A recorder or input adapter mismatch must fail closed.
          assert metrics["trades"] == 9
          assert metrics["wins"] == 4
          assert metrics["losses"] == 5
          assert abs(metrics["ending_nav"] - 103299.18521032) <= 1e-6
          assert abs(metrics["total_return"] - 0.03299185210319999) <= 1e-12
          assert abs(metrics["max_drawdown"] - 0.04590609844197957) <= 1e-12
          assert diagnostics.get("ichifan_structural_stop_submissions", 0) == 9
          assert not bool(diagnostics.get("followthrough_recorder_changes_trading_policy", 0))
          assert diagnostics.get("followthrough_snapshot_failures", 0) == 0
          assert len(snapshots) > 0
          assert all(item["age_minutes"] in {5, 10, 15, 30, 60} for item in snapshots)
          assert all(endpoint == {"klines": 7} for endpoint in endpoints.values())
          assert metrics["engine"] == "NautilusTrader BacktestNode"
          assert metrics["single_continuous_account"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-structural-recorder-equivalence-${{ github.sha }}
          path: artifacts/candidate-47-structural-recorder-equivalence/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  continuous-2026:
    needs: equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-structural-continuous-2026-01-01_2026-07-31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify pinned environment
        run: smc4 doctor

      - name: Run one 212-day four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-47/ichifan_structural_recorder_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start 2026-01-01 \
            --end 2026-07-31 \
            --cache .cache/candidate-47-structural-continuous-2026 \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Preserve continuous evidence and verify invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = metrics["strategy_diagnostics"]
          snapshots = json.loads((root / "followthrough_snapshots.json").read_text())
          summary = {
              "evidence_class": "development-continuous-2026",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "candidate": metrics["candidate"],
              "trading_policy": metrics["trading_policy"],
              "input_mode": metrics["input_mode"],
              "evaluation_start": metrics["evaluation_start"],
              "evaluation_end": metrics["evaluation_end"],
              "calendar_days": metrics["calendar_days"],
              "active_days": metrics["active_days"],
              "starting_nav": metrics["starting_nav"],
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "trades_per_calendar_day": metrics["trades"] / metrics["calendar_days"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "win_rate": metrics["win_rate"],
              "profit_factor": metrics["profit_factor"],
              "expectancy_usdt": metrics["expectancy_usdt"],
              "largest_winner_share": metrics["largest_winner_share"],
              "position_counts_by_symbol": metrics.get("position_counts_by_symbol", {}),
              "snapshot_count": len(snapshots),
              "snapshot_ages": sorted({item["age_minutes"] for item in snapshots}),
              "structural_submissions": diagnostics.get("ichifan_structural_stop_submissions", 0),
              "structural_failures": diagnostics.get("ichifan_structural_stop_failures", 0),
              "order_rejections": diagnostics.get("order_rejections", 0),
              "global_position_violations": diagnostics.get("global_position_violations", 0),
              "rolling_windows": metrics.get("rolling_windows", {}),
              "gate_checks": metrics["gate_checks"],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert metrics["calendar_days"] == 212
          assert metrics["engine"] == "NautilusTrader BacktestNode"
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          assert diagnostics.get("order_rejections", 0) == 0
          assert diagnostics.get("global_position_violations", 0) == 0
          assert diagnostics.get("ichifan_structural_stop_failures", 0) == 0
          assert diagnostics.get("followthrough_snapshot_failures", 0) == 0
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-structural-continuous-2026-${{ github.sha }}
          path: artifacts/candidate-47-structural-continuous-2026-01-01_2026-07-31/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
