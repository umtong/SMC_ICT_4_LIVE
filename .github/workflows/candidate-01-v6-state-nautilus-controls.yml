name: candidate-01-v6-state-nautilus-controls

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v6-state-nautilus-controls.yml"
      - "research/candidate-01/intrinsic_state_control_v6_nautilus_week.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        rule: [outer-aligned, outer-flow-takeover]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v5-local-nautilus
          key: candidate-01-v5-local-nautilus-BTCUSDT-2023-06-14-26-${{ runner.os }}-v1
      - name: Run one market-state control through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/nautilus_plan_backtest.py \
                research/candidate-01/intrinsic_state_control_v6_nautilus_week.py
              python -m unittest discover -s tests -p "test_candidate_01_authoritative_nautilus.py" -v
              rm -rf artifacts/candidate-01-v6-${{ matrix.rule }}-first
              python research/candidate-01/intrinsic_state_control_v6_nautilus_week.py \
                --week 2023-06-19 \
                --rule ${{ matrix.rule }} \
                --cache .cache/candidate-01-v5-local-nautilus \
                --output artifacts/candidate-01-v6-${{ matrix.rule }}-first \
                --workers 4
            '
      - name: Verify and print the first-week gate
        run: |
          set -euo pipefail
          RULE='${{ matrix.rule }}' python3 - <<'PY'
          import json, os
          from pathlib import Path
          rule = os.environ["RULE"]
          root = Path(f"artifacts/candidate-01-v6-{rule}-first")
          summary = json.loads((root / "intrinsic_state_control_v6_summary.json").read_text())
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          assert summary["rule"] == rule
          assert summary["authoritative_backtest"] is True
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["custom_fill_simulator"] is False
          assert summary["custom_pnl_or_nav_ledger"] is False
          assert summary["risk_fraction"] == 0.03
          assert metrics["execution_engine"] == "NautilusTrader"
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          gate = {
              "rule": rule,
              "signals": summary["evaluation_retest_signals"],
              "routed_plans": summary["routed_plans"],
              "trades": metrics["closed_positions"],
              "win_rate": metrics["win_rate"],
              "total_return": metrics["total_return"],
              "geometric_daily": metrics["geometric_mean_daily_return"],
              "profit_factor": metrics["profit_factor"],
              "max_drawdown": metrics["max_drawdown"],
              "target_met": metrics["target_met"],
          }
          (root / "first_week_gate.json").write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v6-${{ matrix.rule }}-first-${{ github.sha }}
          path: artifacts/candidate-01-v6-${{ matrix.rule }}-first
          if-no-files-found: error
          retention-days: 30
