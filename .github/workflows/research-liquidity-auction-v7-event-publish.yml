name: Publish liquidity auction v7 event-time result

on:
  workflow_run:
    workflows: ["Research liquidity auction v7 event time"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v7
      - uses: actions/download-artifact@v4
        with:
          name: liquidity-auction-v7-event-time-result
          path: /tmp/result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          rm -rf research_results/liquidity_auction_v7/event_time
          mkdir -p research_results/liquidity_auction_v7/event_time
          cp /tmp/result/summary.json research_results/liquidity_auction_v7/event_time/summary.json
          cp /tmp/result/RESULT.md research_results/liquidity_auction_v7/event_time/RESULT.md
          cp /tmp/result/development_oof_trades.csv research_results/liquidity_auction_v7/event_time/development_oof_trades.csv
          cp /tmp/result/fresh_trades.csv research_results/liquidity_auction_v7/event_time/calibration_trades.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/liquidity_auction_v7/event_time
          git commit -m "Record v7 event-time result" || exit 0
          git push origin HEAD:research_liquidity_auction_v7
