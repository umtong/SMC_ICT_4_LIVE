name: candidate-05-v43-btc-30d-continuous

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v26-30d-continuous.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v43-btc-30d-continuous
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  continuous-30d:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v40_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed research environment and v43 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v

      - name: Run continuous 30-day BTC evaluation through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/candidate-05-v43-btc-30d
          mkdir -p "$root"
          python research/candidate-05/v40_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-03-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-03-30 \
            --cache .cache/candidate-05-v43-btc-30d \
            --output "$root" \
            2>&1 | tee "$root/console.log"

      - name: Build research screen summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=artifacts/candidate-05-v43-btc-30d
          if test -f "$root/metrics.json"; then
            python -m json.tool "$root/metrics.json"
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-05-v43-btc-30d")
          metrics = json.loads((root / "metrics.json").read_text())
          checks = {
              "positive_nav": metrics.get("ending_nav", 0.0) > 0.0,
              "no_liquidation": metrics.get("liquidations", 0) == 0,
              "no_order_rejections": metrics.get("order_rejections", 0) == 0,
              "no_order_denials": metrics.get("order_denials", 0) == 0,
              "single_entry_intent": metrics.get("max_simultaneous_entry_intents", 0) <= 1,
              "single_position": metrics.get("max_open_positions_observed", 0) <= 1,
          }
          summary = {
              "classification": "V43_BTC_30D_GOAL_REACHED" if (
                  metrics.get("geometric_daily_growth", -1.0) >= 0.01
                  and all(checks.values())
              ) else "V43_BTC_30D_NOT_YET_GOAL",
              "checks": checks,
              "metrics": metrics,
          }
          (root / "research_screen_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
            for file in run.json data_manifest.json orders.csv positions.csv account.csv equity.csv scenario_events.jsonl strategy_diagnostics.json research_screen_summary.json; do
              test -s "$root/$file"
            done
          fi
          if test -f "$root/errors.log"; then cat "$root/errors.log"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v43-btc-30d-${{ github.sha }}
          path: artifacts/candidate-05-v43-btc-30d/**
          if-no-files-found: warn
          retention-days: 90
