name: Candidate 15 V37 opening-drive VWAP retest

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v37-opening-drive-vwap-retest.json"
      - "research/candidate-15/diagnose_v37_opening_drive_vwap_retest.py"
      - ".github/workflows/candidate-15-v37-opening-drive-vwap-retest.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v37-opening-drive-vwap-retest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen VWAP contract
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-15/diagnose_v28_adaptive_6h_trend.py \
            research/candidate-15/diagnose_v37_opening_drive_vwap_retest.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path(
              'research/candidate-15/protocol-v37-opening-drive-vwap-retest.json'
          ).read_text())
          assert p['schema'] == 'candidate-15-v37-opening-drive-vwap-retest-v1'
          assert p['evaluation']['global_position_limit'] == 1
          assert p['fixed_rules']['opening_drive_hours'] == 4
          assert p['fixed_rules']['interaction_bar_minutes'] == 15
          assert p['fixed_rules']['confirmation_minutes'] == 15
          assert p['fixed_rules']['same_bar_target_stop_policy'] == 'STOP_FIRST_CONSERVATIVE'
          assert p['fixed_rules']['execution_round_trip_cost_bps'] == 16.0
          assert p['fixed_rules']['funding_and_unmodeled_impact_reserve_bps'] == 4.0
          PY

      - name: Run opening-drive VWAP retest mechanism
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/src"
          python research/candidate-15/diagnose_v37_opening_drive_vwap_retest.py \
            --protocol research/candidate-15/protocol-v37-opening-drive-vwap-retest.json \
            --output research/candidate-15/v37/opening_drive_vwap_retest/results

      - name: Verify causal timing, geometry and global chronology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          def read(path):
              try:
                  return pd.read_csv(path)
              except EmptyDataError:
                  return pd.DataFrame()

          root = Path('research/candidate-15/v37/opening_drive_vwap_retest/results')
          candidates = read(root / 'all_executable_candidates.csv')
          if len(candidates.index):
              interaction = pd.to_datetime(candidates['interaction_ts'], utc=True)
              entry = pd.to_datetime(candidates['entry_ts'], utc=True)
              exit_ts = pd.to_datetime(candidates['exit_ts'], utc=True)
              day = pd.to_datetime(candidates['day_start'], utc=True)
              assert ((entry - interaction) == pd.Timedelta(minutes=15)).all()
              assert (exit_ts <= day + pd.Timedelta(days=1)).all()
              direction = candidates['direction_value'].astype(float)
              assert (direction * (candidates['entry_price'].astype(float) - candidates['initial_stop'].astype(float)) > 0.0).all()
              assert (direction * (candidates['target_price'].astype(float) - candidates['entry_price'].astype(float)) > 0.0).all()
          selected = read(root / 'selected_trades.csv')
          if len(selected.index) > 1:
              opened = pd.to_datetime(selected['entry_ts'], utc=True)
              closed = pd.to_datetime(selected['exit_ts'], utc=True)
              assert (opened.iloc[1:].reset_index(drop=True) >= closed.iloc[:-1].reset_index(drop=True)).all()
          PY

      - name: Remove downloaded market archives
        if: always()
        shell: bash
        run: rm -rf research/candidate-15/v37/opening_drive_vwap_retest/results/data

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v37/opening_drive_vwap_retest/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V37_OPENING_DRIVE_VWAP_RETEST_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v37-bot
          git config user.email candidate-15-v37-bot@users.noreply.github.com
          git add research/candidate-15/V37_OPENING_DRIVE_VWAP_RETEST_RESULT.md research/candidate-15/v37/opening_drive_vwap_retest/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v37: persist opening-drive VWAP result [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v37-opening-drive-vwap-retest-${{ github.run_id }}
          path: |
            research/candidate-15/V37_OPENING_DRIVE_VWAP_RETEST_RESULT.md
            research/candidate-15/v37/opening_drive_vwap_retest/results
          if-no-files-found: warn
          retention-days: 30
