name: Publish liquidity auction v8 aggregate-depth panel

on:
  workflow_run:
    workflows: ["Research liquidity auction v8 aggregate-depth control"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v8
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v8-bookdepth-*
          path: /tmp/v8-bookdepth
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge feature panel
        run: |
          set -euo pipefail
          mkdir -p research_results/liquidity_auction_v8/bookdepth
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('/tmp/v8-bookdepth')
          frames = []
          metadata = []
          for path in sorted(root.rglob('bookdepth_features.csv.gz')):
              frame = pd.read_csv(path)
              artifact = path.parent.name
              frame['artifact'] = artifact
              frames.append(frame)
              meta_path = path.with_name('metadata.json')
              if meta_path.exists():
                  metadata.append(json.loads(meta_path.read_text()))
          if not frames:
              raise SystemExit('no feature files found')
          panel = pd.concat(frames, ignore_index=True)
          panel.to_csv('research_results/liquidity_auction_v8/bookdepth/panel.csv.gz', index=False, compression='gzip')
          summary = {
              'source_run_id': int('${{ github.event.workflow_run.id }}'),
              'source_sha': '${{ github.event.workflow_run.head_sha }}',
              'rows': int(len(panel)),
              'symbols': sorted(panel.symbol.dropna().unique().tolist()),
              'artifacts': int(len(frames)),
              'metadata': metadata,
          }
          Path('research_results/liquidity_auction_v8/bookdepth/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v8-bookdepth-panel
          path: research_results/liquidity_auction_v8/bookdepth/**
          if-no-files-found: error
          retention-days: 30
      - name: Commit compact evidence pointer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/liquidity_auction_v8/bookdepth/summary.json
          git commit -m "Record v8 aggregate-depth panel metadata" || exit 0
          git push origin HEAD:research_liquidity_auction_v8
