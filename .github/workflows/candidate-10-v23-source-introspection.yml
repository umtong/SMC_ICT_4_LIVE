name: candidate-10-v23-source-introspection

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - .github/workflows/candidate-10-v23-source-introspection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Materialize hash-verified v21 base source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/candidate-10-v23-source
          mkdir -p artifacts/candidate-10-v23-source/source
          python research/candidate-10/v21_source_manifest.py \
            --parts-dir research/candidate-10/v21_source_parts \
            --destination artifacts/candidate-10-v23-source/source \
            --provenance artifacts/candidate-10-v23-source/provenance.json

      - name: Upload verified source for v23 implementation review
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v23-verified-base-${{ github.sha }}
          path: artifacts/candidate-10-v23-source
          if-no-files-found: error
          retention-days: 1
