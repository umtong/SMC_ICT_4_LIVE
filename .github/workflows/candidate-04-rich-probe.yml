name: candidate-04-rich-data-probe

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-rich-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe official Binance auxiliary archives
        shell: bash
        run: |
          set -u
          rm -rf artifacts/candidate-04-rich-probe
          mkdir -p artifacts/candidate-04-rich-probe
          base="https://data.binance.vision/data/futures/um/daily"
          for spec in \
            "aggTrades/BTCUSDT/BTCUSDT-aggTrades-2024-08-08.zip" \
            "bookDepth/BTCUSDT/BTCUSDT-bookDepth-2024-08-08.zip" \
            "metrics/BTCUSDT/BTCUSDT-metrics-2024-08-08.zip" \
            "liquidationSnapshot/BTCUSDT/BTCUSDT-liquidationSnapshot-2024-08-08.zip" \
            "markPriceKlines/BTCUSDT/1m/BTCUSDT-1m-2024-08-08.zip" \
            "indexPriceKlines/BTCUSDT/1m/BTCUSDT-1m-2024-08-08.zip" \
            "premiumIndexKlines/BTCUSDT/1m/BTCUSDT-1m-2024-08-08.zip"; do
            name="$(echo "$spec" | tr '/' '_')"
            code="$(curl -L --retry 3 --connect-timeout 20 -sS -w '%{http_code}' -o "artifacts/candidate-04-rich-probe/$name" "$base/$spec" || true)"
            if [[ "$code" != "200" ]]; then
              rm -f "artifacts/candidate-04-rich-probe/$name"
            fi
            printf '%s %s\n' "$code" "$spec" | tee -a artifacts/candidate-04-rich-probe/status.txt
          done
          find artifacts/candidate-04-rich-probe -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee artifacts/candidate-04-rich-probe/sizes.txt
          for zip in artifacts/candidate-04-rich-probe/*.zip; do
            [[ -e "$zip" ]] || continue
            echo "=== $zip ==="
            unzip -l "$zip" | head -10
            unzip -p "$zip" | head -3 || true
          done > artifacts/candidate-04-rich-probe/listings.txt
      - name: Preserve probe
        uses: actions/upload-artifact@v4
        with:
          name: candidate-04-rich-probe-${{ github.sha }}
          path: artifacts/candidate-04-rich-probe
          if-no-files-found: error
          retention-days: 7
