name: candidate-03-install-oneshot-mixed-loader

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-funding-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use BacktestNode one-shot mixed catalog loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('research/candidate-03/run_nt_lvcfr.py')
          text = path.read_text(encoding='utf-8')
          old = '''        chunk_size=1_000_000,\n'''
          new = '''        # NT 1.230 streaming uses a Rust-only DataBackendSession which\n        # misclassifies legacy FundingRateUpdate as custom data. One-shot\n        # BacktestNode instead dispatches QuoteTick to the Rust query and\n        # FundingRateUpdate to its registered PyArrow codec, sorts the mixed\n        # stream, and still executes the same native BacktestEngine.\n        chunk_size=None,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one chunk_size target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('research/candidate-03/test_nt_lvcfr.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''class ConfigTests(unittest.TestCase):\n'''
          replacement = '''class ConfigTests(unittest.TestCase):\n    def test_backtest_node_uses_funding_compatible_oneshot_loader(self) -> None:\n        source = Path(__file__).with_name("run_nt_lvcfr.py").read_text(encoding="utf-8")\n        self.assertIn("chunk_size=None", source)\n        self.assertNotIn("chunk_size=1_000_000", source)\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one ConfigTests marker, found {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement), encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:research/candidate-03 \
            python research/candidate-03/test_nt_lvcfr.py
          PYTHONPYCACHEPREFIX=/tmp/candidate-03-pycache \
            python -m compileall -q research/candidate-03 src/smc_ict_4

          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add research/candidate-03/run_nt_lvcfr.py research/candidate-03/test_nt_lvcfr.py
          git commit -m "candidate-03: use funding-compatible BacktestNode loader"
          git push origin HEAD:research/candidate-03
