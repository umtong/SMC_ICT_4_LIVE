name: candidate-03-backtest-node-source-probe

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-funding-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract installed BacktestNode source and signatures
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
          out=artifacts/candidate-03/node-probe
          mkdir -p "$out" && chmod -R 0777 artifacts
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" bash -c '
            python - <<"PY"
          import inspect
          import pathlib
          import shutil
          import traceback
          import nautilus_trader.backtest.node as node_module
          import nautilus_trader.backtest.config as config_module
          from nautilus_trader.backtest.engine import BacktestEngine
          from nautilus_trader.backtest.node import BacktestDataConfig, BacktestNode

          out = pathlib.Path("/workspace/artifacts/candidate-03/node-probe")
          lines = []
          def emit(value=""):
              text = str(value)
              lines.append(text)
              print(text)

          for module in (node_module, config_module):
              path = pathlib.Path(module.__file__)
              emit("MODULE " + module.__name__ + " " + str(path))
              if path.exists() and path.suffix in {".py", ".pyx", ".pxd"}:
                  shutil.copy2(path, out / path.name)

          for target in (BacktestDataConfig, BacktestNode, BacktestEngine):
              emit("TARGET " + repr(target))
              try:
                  emit("SIGNATURE " + str(inspect.signature(target)))
              except Exception as exc:
                  emit("SIGNATURE_ERROR " + type(exc).__name__ + ": " + str(exc))
              emit("ATTRS " + repr([name for name in dir(target) if any(token in name.lower() for token in ("build", "run", "engine", "data", "catalog", "load", "add", "config"))]))
              try:
                  emit(inspect.getsource(target))
              except Exception as exc:
                  emit("SOURCE_ERROR " + type(exc).__name__ + ": " + str(exc))

          for name in ("build", "run", "get_engine", "_create_engine", "_load_data", "_run", "_run_streaming", "_run_oneshot"):
              target = getattr(BacktestNode, name, None)
              if target is None:
                  continue
              emit("METHOD " + name)
              try:
                  emit(inspect.getsource(target))
              except Exception as exc:
                  emit("SOURCE_ERROR " + type(exc).__name__ + ": " + str(exc))

          for name in ("add_data", "run", "get_result"):
              target = getattr(BacktestEngine, name, None)
              emit("ENGINE_METHOD " + name + " " + repr(target))
              try:
                  emit("SIG " + str(inspect.signature(target)))
              except Exception as exc:
                  emit("SIG_ERROR " + type(exc).__name__ + ": " + str(exc))

          emit("BacktestDataConfig fields=" + repr(getattr(BacktestDataConfig, "__struct_fields__", None)))
          emit("BacktestDataConfig annotations=" + repr(getattr(BacktestDataConfig, "__annotations__", None)))
          emit("BacktestDataConfig defaults=" + repr(getattr(BacktestDataConfig, "__struct_defaults__", None)))
          (out / "probe.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-03-node-source-${{ github.sha }}
          path: artifacts/candidate-03/node-probe
          if-no-files-found: error
          retention-days: 3
