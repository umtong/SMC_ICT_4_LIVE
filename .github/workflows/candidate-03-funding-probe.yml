name: candidate-03-oneshot-funding-query-probe

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-funding-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare legacy catalog query modes for funding
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
          out=artifacts/candidate-03/query-probe
          mkdir -p "$out" && chmod -R 0777 artifacts
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" bash -c '
            python - <<"PY"
          import inspect
          import pathlib
          import tempfile
          import traceback
          from decimal import Decimal
          from nautilus_trader.model.data import FundingRateUpdate
          from nautilus_trader.model.identifiers import InstrumentId
          from nautilus_trader.persistence.catalog import ParquetDataCatalog

          out = pathlib.Path("/workspace/artifacts/candidate-03/query-probe")
          lines = []
          def emit(value=""):
              text = str(value)
              lines.append(text)
              print(text)

          temp = tempfile.mkdtemp(prefix="nt-query-probe-")
          catalog = ParquetDataCatalog(temp)
          instrument_id = InstrumentId.from_str("BTCUSDT-PERP.BINANCE")
          item = FundingRateUpdate(instrument_id, Decimal("0.0001"), 1, 1, interval=480, next_funding_ns=2)
          catalog.write_data([item])

          for flag in (False, True):
              try:
                  result = catalog.query(
                      data_cls=FundingRateUpdate,
                      identifiers=[instrument_id],
                      optimize_file_loading=flag,
                  )
                  emit("query optimize_file_loading=" + str(flag) + " SUCCESS " + repr(result))
              except Exception as exc:
                  emit("query optimize_file_loading=" + str(flag) + " FAILED " + type(exc).__name__ + ": " + str(exc))
                  emit(traceback.format_exc())

          for name in ("query", "query_rust", "_query_subclasses"):
              target = getattr(ParquetDataCatalog, name, None)
              emit("--- SOURCE " + name + " ---")
              try:
                  emit(inspect.getsource(target))
              except Exception as exc:
                  emit("SOURCE_ERROR " + type(exc).__name__ + ": " + str(exc))

          parquet_path = pathlib.Path(inspect.getfile(ParquetDataCatalog))
          emit("PARQUET_PATH " + str(parquet_path))
          if parquet_path.exists():
              (out / "parquet.py").write_text(parquet_path.read_text(encoding="utf-8"), encoding="utf-8")
          (out / "probe.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-03-query-probe-${{ github.sha }}
          path: artifacts/candidate-03/query-probe
          if-no-files-found: error
          retention-days: 3
