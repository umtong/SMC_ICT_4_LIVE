name: candidate-easychart-re1-ml-a-executable-diagnostic

on:
  push:
    branches: ["ML_a"]
    paths:
      - ".github/workflows/candidate-easychart-re1-ml-a-executable-diagnostic.yml"
      - "research/candidate-easychart_re1/.ml_a_executable_dispatch_marker"
      - "research/candidate-easychart_re1/completed_h4_from_hourly.py"
      - "research/candidate-easychart_re1/easychart_re1_skilled_continuation.py"
      - "research/candidate-easychart_re1/execution_re1_ml_a.py"
      - "research/candidate-easychart_re1/ml_a_plan_scorer.py"
      - "research/candidate-easychart_re1/models/ml_a_geometry_rank_v1.json"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_ml_a.py"
      - "research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-ml-a-executable-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile executable policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/completed_h4_from_hourly.py \
            research/candidate-easychart_re1/easychart_re1_skilled_continuation.py \
            research/candidate-easychart_re1/ml_a_plan_scorer.py \
            research/candidate-easychart_re1/execution_re1_ml_a.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_ml_a.py
      - name: Construct scenario stream, H4 aggregation and frozen model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from completed_h4_from_hourly import (
              COMPLETED_H4_FROM_HOURLY_RULE,
              HOUR_NS,
              CompletedH4FromHourly,
          )
          from domain import Candle
          from easychart_re1_skilled_continuation import (
              EasyChartRE1SkilledContinuationBundle,
              LOCAL_AUCTION_SKILLED_ROUTER_RULE,
          )
          from ml_a_plan_scorer import PortableLogisticPlanScorer

          aggregator = CompletedH4FromHourly("BTCUSDT")
          bars = [
              Candle(
                  ts_close_ns=index * HOUR_NS,
                  open=100.0 + index,
                  high=101.0 + index,
                  low=99.0 + index,
                  close=100.5 + index,
                  volume=10.0 * index,
              )
              for index in range(1, 5)
          ]
          assert [aggregator.update(item) for item in bars[:3]] == [None, None, None]
          h4 = aggregator.update(bars[3])
          assert h4 is not None
          assert h4.ts_close_ns == 4 * HOUR_NS
          assert h4.open == 101.0
          assert h4.high == 105.0
          assert h4.low == 100.0
          assert h4.close == 104.5
          assert h4.volume == 100.0
          assert aggregator.diagnostics["counts"]["completed_h4_emitted"] == 1

          bundle = EasyChartRE1SkilledContinuationBundle("BTCUSDT", 0.1, 1.0)
          scorer = PortableLogisticPlanScorer.load(
              Path("research/candidate-easychart_re1/models/ml_a_geometry_rank_v1.json")
          )
          assert bundle.detectors is bundle.base.detectors
          assert bundle.plans == []
          assert scorer.numeric
          assert "H4" in LOCAL_AUCTION_SKILLED_ROUTER_RULE
          assert "FOUR_CONTIGUOUS_COMPLETED_HOURLY" in COMPLETED_H4_FROM_HOURLY_RULE
          print({
              "scenario_engine": type(bundle).__name__,
              "model_numeric_features": len(scorer.numeric),
              "router_rule": LOCAL_AUCTION_SKILLED_ROUTER_RULE,
              "h4_rule": COMPLETED_H4_FROM_HOURLY_RULE,
              "h4_smoke": {
                  "open": h4.open,
                  "high": h4.high,
                  "low": h4.low,
                  "close": h4.close,
                  "volume": h4.volume,
              },
          })
          PY

  matched-diagnostic:
    needs: contract-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: may-2024
            start: 2024-05-01
            end: 2024-05-03
          - period: august-2025
            start: 2025-08-10
            end: 2025-08-12
          - period: february-2026
            start: 2026-02-01
            end: 2026-02-03
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-ml-a/${{ matrix.period }}
      ROOT_OUT: artifacts/candidate-easychart-re1-ml-a/${{ matrix.period }}
      ML_A_POLICY: rank
      ML_A_MODEL_PATH: research/candidate-easychart_re1/models/ml_a_geometry_rank_v1.json
    steps:
      - uses: actions/checkout@v4
      - name: Run matched deterministic baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$ROOT_OUT/baseline"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_skilled_continuation.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT_OUT/baseline" \
            --fee-profile usd_m_vip0
      - name: Run ML rank-only arbitration on identical plan stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/ml_rank"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_ml_a.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT_OUT/ml_rank" \
            --fee-profile usd_m_vip0
      - name: Print matched economic comparison
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("${{ env.ROOT_OUT }}")
          result = {"period": "${{ matrix.period }}"}
          for name in ("baseline", "ml_rank"):
              path = root / name / "metrics.json"
              if not path.exists():
                  result[name] = {"status": "MISSING_METRICS"}
                  continue
              data = json.loads(path.read_text())
              keys = (
                  "candidate", "start", "end", "calendar_days", "completed_trades",
                  "independent_completed_trades", "win_rate", "profit_factor",
                  "expectancy_r", "average_net_r", "total_return", "ending_balance",
                  "ending_nav", "max_drawdown", "max_drawdown_pct", "gross_rr_mean",
                  "mean_gross_rr", "fees", "funding", "liquidations",
              )
              result[name] = {key: data.get(key) for key in keys if key in data}
              result[name]["all_metric_keys"] = sorted(data)
          print("MATCHED_RESULT=" + json.dumps(result, sort_keys=True))
          PY
      - name: Preserve actual account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-ml-a-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-ml-a/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
