name: candidate-51-squeeze-clock-v56

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-squeeze-clock-v56.yml"
      - "research/candidate-51/squeeze_clock_anatomy.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-51-squeeze-clock-v56
  cancel-in-progress: true

jobs:
  anatomy:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
        period:
          - {label: source_bull_2021_02, start: 2021-02-01, end: 2021-02-14, split: source_history}
          - {label: source_crash_2021_05, start: 2021-05-10, end: 2021-05-23, split: source_history}
          - {label: source_riskoff_2022_01, start: 2022-01-10, end: 2022-01-23, split: source_history}
          - {label: source_cascade_2022_06, start: 2022-06-06, end: 2022-06-19, split: source_history}
          - {label: source_ftx_2022_11, start: 2022-11-01, end: 2022-11-14, split: source_history}
          - {label: source_recovery_2023_03, start: 2023-03-06, end: 2023-03-19, split: source_history}
          - {label: source_expansion_2023_10, start: 2023-10-16, end: 2023-10-29, split: source_history}
          - {label: source_bull_2024_03, start: 2024-03-04, end: 2024-03-17, split: source_history}
          - {label: source_shock_2024_08, start: 2024-08-01, end: 2024-08-14, split: source_history}
          - {label: source_2025_02, start: 2025-02-01, end: 2025-02-14, split: source_history}
          - {label: source_cascade_2025_10, start: 2025-10-01, end: 2025-10-14, split: source_history}
          - {label: postpub_2026_04, start: 2026-04-01, end: 2026-04-14, split: post_publication}
          - {label: postpub_2026_07, start: 2026-07-15, end: 2026-07-28, split: post_publication}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-51, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install verified research environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
      - name: Measure source-clock leakage and causal first-leg geometry
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/candidate-51/squeeze-clock-v56/${{ matrix.period.label }}/${{ matrix.symbol }}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/squeeze_clock_anatomy.py run \
            --symbol "${{ matrix.symbol }}" --start "${{ matrix.period.start }}" --end "${{ matrix.period.end }}" \
            --period-label "${{ matrix.period.label }}" --split "${{ matrix.period.split }}" \
            --warmup-days 10 --forward-days 8 \
            --cache ".cache/candidate-51-squeeze-clock-v56/${{ matrix.symbol }}" --output "$output"
          test -s "$output/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-squeeze-clock-v56-${{ matrix.period.label }}-${{ matrix.symbol }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/squeeze-clock-v56/${{ matrix.period.label }}/${{ matrix.symbol }}/result.json

  aggregate:
    if: always()
    needs: anatomy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-51, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-51-squeeze-clock-v56-*
          path: downloaded
      - name: Aggregate paired clock evidence
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded -name result.json -type f | wc -l | tr -d ' ')"
          test "$count" -eq 52
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          output=artifacts/candidate-51/squeeze-clock-v56
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/squeeze_clock_anatomy.py aggregate \
            --results-root downloaded --output "$output"
          test -s "$output/ANATOMY.json"
          test -s "$output/ANATOMY.md"
          test -s "$output/SUMMARY.csv"
          test -s "$output/EVENTS.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-squeeze-clock-v56-anatomy
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/squeeze-clock-v56/ANATOMY.json
            artifacts/candidate-51/squeeze-clock-v56/ANATOMY.md
            artifacts/candidate-51/squeeze-clock-v56/SUMMARY.csv
            artifacts/candidate-51/squeeze-clock-v56/EVENTS.csv
      - name: Commit compact causal clock evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/squeeze-clock-v56
          destination=research/candidate-51/evidence/squeeze-clock-v56
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/SUMMARY.csv" "$destination/SUMMARY.csv"
          cp "$source/EVENTS.csv" "$destination/EVENTS.csv"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add research/candidate-51/squeeze_clock_anatomy.py "$destination"
          git commit -m "candidate51: record squeeze causal clock anatomy"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-51 && git push origin HEAD:research/candidate-51; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
