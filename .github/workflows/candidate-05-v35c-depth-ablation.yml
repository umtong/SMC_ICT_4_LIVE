name: candidate-05-v35c-depth-ablation

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/sequential_retest_ablation_logic.py"
      - "research/candidate-05/strategy_v35c_retest_depth_ablation.py"
      - "research/candidate-05/tests/test_sequential_retest_ablation_logic.py"
      - ".github/workflows/candidate-05-v35c-depth-ablation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v35c-depth-ablation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  controlled-btc-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v35c-depth-ablation
    steps:
      - uses: actions/checkout@v4
      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover -s research/candidate-05/tests -p 'test_*.py' -v
      - name: Run exact-control ablation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/controlled_candidate_research.py \
            --name v35c_retest_depth_ablation \
            --strategy-module strategy_v35c_retest_depth_ablation \
            --strategy-class SequentialRetestDepthAblationStrategy \
            --branch SEQUENTIAL_FLOW_REGIME_RELEASE \
            --output "$ROOT/runs" \
            --cache .cache/candidate-05-v35c-depth-ablation \
            --summary "$ROOT/v35c_summary.json" \
            2>&1 | tee "$ROOT/console.log"
      - name: Print evidence
        if: always()
        run: |
          if test -f "$ROOT/v35c_summary.json"; then python -m json.tool "$ROOT/v35c_summary.json"; fi
          if test -f "$ROOT/console.log"; then tail -n 500 "$ROOT/console.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v35c-depth-ablation-${{ github.sha }}
          path: artifacts/candidate-05-v35c-depth-ablation/**
          if-no-files-found: error
          retention-days: 90
