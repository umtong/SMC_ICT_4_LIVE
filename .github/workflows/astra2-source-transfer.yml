name: Astra2 source transfer
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths: [research/candidate-ml-easychart-astra2/source-transfer.b64]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_easychart_astra2
      - name: Materialize exact researched UTF-8 source files
        run: |
          python - <<'PY'
          import base64, io, tarfile
          from pathlib import Path, PurePosixPath
          root=Path('research/candidate-ml-easychart-astra2')
          transfer=root/'source-transfer.b64'
          data=base64.b64decode(transfer.read_text(),validate=False)
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              for member in archive.getmembers():
                  path=PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts or str(path).startswith('.'):
                      raise ValueError('Only relative ordinary research files may be transferred')
                  if member.size>30000000: raise ValueError('Unexpectedly large research member')
              archive.extractall(root,filter='data')
          transfer.unlink()
          PY
          python -m compileall -q research/candidate-ml-easychart-astra2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/candidate-ml-easychart-astra2
          git commit -m 'Astra2: persist researched source and directly observed results'
          git push origin HEAD:research_candidate_ML_easychart_astra2
