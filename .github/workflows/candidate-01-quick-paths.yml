name: candidate-01-quick-paths

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-quick-paths.yml"
      - "research/candidate-01/diagnose_forward_paths.py"
      - "research/candidate-01/core.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01
          key: candidate-01-binance-vision-${{ runner.os }}
      - name: Measure every causal plan on all frozen quick weeks
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              root=artifacts/candidate-01-quick-paths
              rm -rf "$root"
              python research/candidate-01/diagnose_forward_paths.py \
                --start 2023-06-19 --end 2023-06-26 \
                --output "$root/discovery"
              python research/candidate-01/diagnose_forward_paths.py \
                --start 2022-08-01 --end 2022-08-08 \
                --output "$root/confirmation-1"
              python research/candidate-01/diagnose_forward_paths.py \
                --start 2025-11-10 --end 2025-11-17 \
                --output "$root/confirmation-2"
              python - <<"PY"
              import json
              from pathlib import Path
              import pandas as pd
              root = Path("artifacts/candidate-01-quick-paths")
              frames = []
              for label in ("discovery", "confirmation-1", "confirmation-2"):
                  frame = pd.read_csv(root / label / "forward_paths.csv")
                  frame.insert(0, "segment", label)
                  frames.append(frame)
              combined = pd.concat(frames, ignore_index=True)
              combined.to_csv(root / "combined_forward_paths.csv", index=False)
              summary = {
                  "plans": int(len(combined)),
                  "by_segment": combined.groupby("segment").size().astype(int).to_dict(),
                  "by_response": combined.groupby("response").size().astype(int).to_dict(),
              }
              (root / "combined_summary.json").write_text(
                  json.dumps(summary, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(summary, indent=2, sort_keys=True))
              PY
            '
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-quick-paths-${{ github.sha }}
          path: artifacts/candidate-01-quick-paths
          if-no-files-found: error
          retention-days: 30
