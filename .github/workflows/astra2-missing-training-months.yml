name: Astra2 missing training months
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths: [.github/workflows/astra2-missing-training-months.yml]
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reuse the existing public archive downloader
        run: |
          python - <<'PY'
          import sys
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          sys.path.insert(0,'research/candidate-ml-easychart-astra2')
          from download_inputs import download, SYMBOLS, BASE
          jobs=[]
          for symbol in SYMBOLS:
              for month in ['2025-09','2025-10','2025-12']:
                  for kind in ['klines','markPriceKlines','fundingRate']:
                      name=f'{symbol}-fundingRate-{month}.zip' if kind=='fundingRate' else f'{symbol}-1m-{month}.zip'
                      interval='' if kind=='fundingRate' else '/1m'
                      jobs.append((f'{BASE}/futures/um/monthly/{kind}/{symbol}{interval}/{name}',Path('missing_market')/kind/symbol/name))
          with ThreadPoolExecutor(max_workers=8) as pool:
              records=list(pool.map(download,jobs))
          errors=[r for r in records if 'error' in r]
          if errors: raise RuntimeError(errors)
          print(len(records),'archives available')
          PY
          tar -czf missing-market.tar.gz missing_market
      - uses: actions/upload-artifact@v4
        with:
          name: astra2-missing-months
          path: missing-market.tar.gz
          compression-level: 0
          retention-days: 7
