name: candidate-01-intrinsic-external-daily-w3-feature-export

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-intrinsic-external-daily-w3-feature-export.yml"
      - "research/candidate-01/export_intrinsic_external_daily_features.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_week.py"
      - "research/candidate-01/adaptive_aggtrade_clock.py"
      - "research/candidate-01/directional_change_failed_sweep_week.py"
      - "research/candidate-01/impact_regime_probe.py"
      - "research/candidate-01/aggtrade_data.py"
      - "research/candidate-01/aggtrade_clock.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-intrinsic-external-v2-daily-week-3
          key: candidate-01-intrinsic-external-v2-daily-BTCUSDT-2025-11-05-2025-11-10-${{ runner.os }}-v1
      - name: Export the frozen third BTC week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/aggtrade_data.py \
                research/candidate-01/aggtrade_clock.py \
                research/candidate-01/adaptive_aggtrade_clock.py \
                research/candidate-01/impact_regime_probe.py \
                research/candidate-01/directional_change_failed_sweep_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py \
                research/candidate-01/export_intrinsic_external_daily_features.py
              rm -rf artifacts/candidate-01-intrinsic-external-daily-w3-export
              python research/candidate-01/export_intrinsic_external_daily_features.py \
                --week 2025-11-10 \
                --cache .cache/candidate-01-intrinsic-external-v2-daily-week-3 \
                --output artifacts/candidate-01-intrinsic-external-daily-w3-export \
                --workers 4
            '
      - name: Print export manifest
        run: cat artifacts/candidate-01-intrinsic-external-daily-w3-export/feature_export_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-intrinsic-external-daily-w3-export-${{ github.sha }}
          path: artifacts/candidate-01-intrinsic-external-daily-w3-export
          if-no-files-found: error
          retention-days: 30
