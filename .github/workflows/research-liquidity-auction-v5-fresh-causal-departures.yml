name: Research liquidity auction v5 fresh causal departures

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v5"]
    paths:
      - ".github/workflows/research-liquidity-auction-v5-fresh-causal-departures.yml"

concurrency:
  group: research-liquidity-auction-v5-fresh-causal-departures
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v5
      - name: Record fresh causal run
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > research/candidate-liquidity-auction-v5/.latest-fresh-causal-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-liquidity-auction-v5/.latest-fresh-causal-run
          git commit -m "Record v5 fresh causal run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_liquidity_auction_v5

  harvest:
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {period: fresh-2022-jan, start: 2022-01-01, end: 2022-01-08}
          - {period: fresh-2022-apr, start: 2022-04-01, end: 2022-04-08}
          - {period: fresh-2022-jul, start: 2022-07-01, end: 2022-07-08}
          - {period: fresh-2022-oct, start: 2022-10-01, end: 2022-10-08}
          - {period: fresh-2026-jan, start: 2026-01-01, end: 2026-01-08}
          - {period: fresh-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {period: fresh-2026-apr, start: 2026-04-01, end: 2026-04-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/v5-fresh-departure/${{ matrix.period }}
      OUT: artifacts/v5-fresh-departure/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v5
      - name: Harvest every strict causal departure
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-auction-v5/departure_first_return_harvest_fixed.py \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - name: Preserve exact chart path
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" --start "$START" --end "$END" \
            --cache "$CACHE" --output "$OUT/chart"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidity-auction-v5-fresh-departure-${{ matrix.period }}
          path: artifacts/v5-fresh-departure/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
