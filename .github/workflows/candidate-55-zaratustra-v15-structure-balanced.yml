name: candidate-55-zaratustra-v15-structure-balanced

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-zaratustra-v15-structure-balanced.yml"
      - "research/candidate-55/router_zaratustra_v15_structure_balanced.py"
      - "research/candidate-55/run_zaratustra_v15_structure_balanced.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-zaratustra-v15-structure-balanced
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55

      - name: Materialize source engine and balanced structural plateau
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router_zaratustra_v13.py
          cp research/candidate-55/router_zaratustra_v15.py research/candidate-51/router_zaratustra_v15.py
          cp research/candidate-55/router_zaratustra_v15_short.py research/candidate-51/router_zaratustra_v15_short.py
          cp research/candidate-55/router_zaratustra_v15_structure.py research/candidate-51/router_zaratustra_v15_structure.py
          cp research/candidate-55/router_zaratustra_v15_structure_balanced.py research/candidate-51/router.py
          cp research/candidate-55/strategy_zaratustra.py research/candidate-51/strategy_zaratustra.py
          cp research/candidate-55/strategy_zaratustra_v15.py research/candidate-51/strategy_zaratustra_v15.py
          cp research/candidate-55/strategy_zaratustra_v15_structure.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and prove balanced plateau contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from router import (
              BB_MIN_IMPULSE_ATR,
              DI_LOCAL_PULLBACK_MIN_RETURN,
              bb_clean_synchronized_expansion,
              di_pullback_resumption,
          )

          assert DI_LOCAL_PULLBACK_MIN_RETURN == -0.002
          assert BB_MIN_IMPULSE_ATR == 1.2
          assert di_pullback_resumption(-0.0019, -0.01)
          assert not di_pullback_resumption(-0.0021, -0.01)
          assert bb_clean_synchronized_expansion(-0.0036, 0.003, 3)
          assert not bb_clean_synchronized_expansion(-0.0033, 0.003, 3)
          print("Candidate 55 balanced structural plateau contracts verified")
          PY

      - name: Run untouched short-window comparison
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_zaratustra_v15_structure_balanced.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-v15-structure-balanced-${{ github.sha }}
          path: |
            artifacts/candidate-55/v15-structure-balanced
            .work/candidate-55-v15-structure-balanced/manifest.json
          if-no-files-found: warn
          retention-days: 30
