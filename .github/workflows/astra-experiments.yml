name: Astra experiments
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths:
      - research/candidate-ml-easychart-astra1/**
      - .github/workflows/astra-experiments.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: astra-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: astra-inputs
          run-id: 33909899122
          github-token: ${{ github.token }}
      - name: Reuse inputs and run experiment
        run: |
          tar -xzf astra-inputs.tar.gz
          python -m pip install --no-index --find-links bundle/wheels nautilus_trader==1.230.0 numpy==2.3.5 pandas==2.3.3
          mkdir -p research_results/candidate_ml_easychart_astra1
          python research/candidate-ml-easychart-astra1/inspect_reuse.py > research_results/candidate_ml_easychart_astra1/reuse_console.txt
          if [ -f research/candidate-ml-easychart-astra1/experiment.py ]; then
            python research/candidate-ml-easychart-astra1/experiment.py
          fi
      - name: Commit actual experiment output
        if: always()
        run: |
          git config user.name 'astra-research'
          git config user.email 'astra-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra1
          if ! git diff --cached --quiet; then
            git commit -m "Astra experiment observations for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra1
            git push origin HEAD:research_candidate_ML_easychart_astra1
          fi
