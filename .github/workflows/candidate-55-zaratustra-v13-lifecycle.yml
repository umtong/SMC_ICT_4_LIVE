name: candidate-55-zaratustra-v13-lifecycle

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-zaratustra-v13-lifecycle.yml"
      - "research/candidate-55/router_zaratustra.py"
      - "research/candidate-55/router_zaratustra_v13.py"
      - "research/candidate-55/strategy_zaratustra.py"
      - "research/candidate-55/strategy_zaratustra_v13.py"
      - "research/candidate-55/strategy_zaratustra_v13_state.py"
      - "research/candidate-55/strategy_zaratustra_v13_lifecycle.py"
      - "research/candidate-55/run_zaratustra_v15_repair.py"
      - "research/candidate-55/run_zaratustra_v13_lifecycle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-zaratustra-v13-lifecycle
  cancel-in-progress: true

jobs:
  diagnose-state-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55

      - name: Materialize V13 lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-55/router_zaratustra.py research/candidate-51/router_zaratustra.py
          cp research/candidate-55/router_zaratustra_v13.py research/candidate-51/router.py
          cp research/candidate-55/strategy_zaratustra.py research/candidate-51/strategy_zaratustra.py
          cp research/candidate-55/strategy_zaratustra_v13.py research/candidate-51/strategy_zaratustra_v13.py
          cp research/candidate-55/strategy_zaratustra_v13_state.py research/candidate-51/strategy_zaratustra_v13_state.py
          cp research/candidate-55/strategy_zaratustra_v13_lifecycle.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and prove lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from router import BarObservation
          from strategy_zaratustra_v13_state import _di_components

          minute = 60_000_000_000
          bars = tuple(
              BarObservation(
                  ts_event=index * minute,
                  open=200.0 - 0.1 * index,
                  high=200.2 - 0.1 * index,
                  low=199.7 - 0.1 * index,
                  close=199.8 - 0.1 * index,
                  volume=1.0,
              )
              for index in range(500)
          )
          components, values = _di_components(
              bars, timeframe=15, period=14, side=-1
          )
          assert components is not None, values
          assert values["state_ts"] <= bars[-1].ts_event
          print("V13 lifecycle uses only completed causal 15m states", components)
          PY

      - name: Run short-first lifecycle tournament
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python research/candidate-55/run_zaratustra_v13_lifecycle.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-zaratustra-v13-lifecycle-${{ github.sha }}
          path: |
            artifacts/candidate-55/zaratustra-v13-lifecycle-*
          if-no-files-found: warn
          retention-days: 30
