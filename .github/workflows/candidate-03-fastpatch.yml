name: candidate-03-causal-quote-compression

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-fastpatch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install causal one-second execution envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          data_path = Path('research/candidate-03/nt_lvcfr_data.py')
          text = data_path.read_text(encoding='utf-8')

          old = '''@dataclass(frozen=True, slots=True)\nclass SourceFile:\n    kind: str\n    source_url: str\n    local_path: str\n    sha256: str\n    size_bytes: int\n\n\ndef sha256_file'''
          new = '''@dataclass(frozen=True, slots=True)\nclass SourceFile:\n    kind: str\n    source_url: str\n    local_path: str\n    sha256: str\n    size_bytes: int\n\n\nBookTickerRecord = tuple[int, float, float, float, float, int, int]\n\n\ndef select_second_extrema(rows: Sequence[BookTickerRecord]) -> list[BookTickerRecord]:\n    \"\"\"Return an original-time execution envelope for one observed second.\n\n    First and last quotes plus bid/ask price extrema are retained in original\n    event order. No value or timestamp is shifted earlier, while redundant\n    top-size churn that cannot change a stop or target decision is removed.\n    \"\"\"\n    if not rows:\n        return []\n    indices = {0, len(rows) - 1}\n    for field in (1, 3):\n        indices.add(min(range(len(rows)), key=lambda index: (rows[index][field], index)))\n        indices.add(max(range(len(rows)), key=lambda index: (rows[index][field], -index)))\n    return [rows[index] for index in sorted(indices)]\n\n\ndef sha256_file'''
          if text.count(old) != 1:
              raise SystemExit(f'SourceFile insertion target count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    batch: list[QuoteTick] = []\n    outside_last: tuple[int, float, float, float, float, int, int] | None = None\n    outside_minute = -1\n\n    def append_quote(values: tuple[int, float, float, float, float, int, int]) -> None:\n'''
          new = '''    batch: list[QuoteTick] = []\n    outside_last: BookTickerRecord | None = None\n    outside_minute = -1\n    inside_second = -1\n    inside_bucket: list[BookTickerRecord] = []\n\n    def append_quote(values: BookTickerRecord) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'quote state target count={text.count(old)}')
          text = text.replace(old, new)

          old = '''        retained += 1\n\n    for path in sorted(book_ticker_paths, key=lambda item: item.name):\n'''
          new = '''        retained += 1\n\n    def flush_inside_bucket() -> None:\n        nonlocal inside_second\n        if not inside_bucket:\n            return\n        for retained_row in select_second_extrema(inside_bucket):\n            append_quote(retained_row)\n        inside_bucket.clear()\n        inside_second = -1\n\n    for path in sorted(book_ticker_paths, key=lambda item: item.name):\n'''
          if text.count(old) != 1:
              raise SystemExit(f'flush insertion target count={text.count(old)}')
          text = text.replace(old, new)

          old = '''                if inside:\n                    if outside_last is not None:\n                        append_quote(outside_last)\n                        outside_last = None\n                    append_quote(values)\n                else:\n                    minute = observed_ns // NS_PER_MINUTE\n                    if outside_last is not None and minute != outside_minute:\n                        append_quote(outside_last)\n                    outside_last = values\n                    outside_minute = minute\n        finally:\n            archive.close()\n    if outside_last is not None:\n        append_quote(outside_last)\n'''
          new = '''                if inside:\n                    if outside_last is not None:\n                        append_quote(outside_last)\n                        outside_last = None\n                    second = observed_ns // NS_PER_SECOND\n                    if inside_bucket and second != inside_second:\n                        flush_inside_bucket()\n                    if not inside_bucket:\n                        inside_second = second\n                    inside_bucket.append(values)\n                else:\n                    flush_inside_bucket()\n                    minute = observed_ns // NS_PER_MINUTE\n                    if outside_last is not None and minute != outside_minute:\n                        append_quote(outside_last)\n                    outside_last = values\n                    outside_minute = minute\n        finally:\n            archive.close()\n    flush_inside_bucket()\n    if outside_last is not None:\n        append_quote(outside_last)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'window handling target count={text.count(old)}')
          text = text.replace(old, new)

          old = '''        \"full_resolution_windows\": windows,\n        \"impact_bps_each_fill\": config.slippage_impact_bps,\n'''
          new = '''        \"execution_windows\": windows,\n        \"inside_window_quote_retention\": \"original-time first/last and bid/ask extrema per observed second\",\n        \"outside_window_quote_retention\": \"last quote per observed minute\",\n        \"impact_bps_each_fill\": config.slippage_impact_bps,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'manifest target count={text.count(old)}')
          text = text.replace(old, new)
          data_path.write_text(text, encoding='utf-8')

          test_path = Path('research/candidate-03/test_nt_lvcfr.py')
          tests = test_path.read_text(encoding='utf-8')
          old = 'from nt_lvcfr_data import CandidateConfig, MinuteFact, NS_PER_MINUTE, detect_signals, merge_windows\n'
          new = 'from nt_lvcfr_data import CandidateConfig, MinuteFact, NS_PER_MINUTE, detect_signals, merge_windows, select_second_extrema\n'
          if tests.count(old) != 1:
              raise SystemExit(f'test import target count={tests.count(old)}')
          tests = tests.replace(old, new)
          marker = '''\n\nif __name__ == \"__main__\":\n    unittest.main(verbosity=2)\n'''
          addition = '''\n\nclass QuoteCompressionTests(unittest.TestCase):\n    def test_original_time_second_envelope_preserves_price_extrema(self) -> None:\n        rows = [\n            (1, 100.0, 1.0, 101.0, 1.0, 1, 1),\n            (2, 100.0, 2.0, 101.0, 2.0, 2, 2),\n            (3, 99.0, 3.0, 101.0, 3.0, 3, 3),\n            (4, 101.0, 4.0, 102.0, 4.0, 4, 4),\n            (5, 100.0, 5.0, 100.0, 5.0, 5, 5),\n        ]\n        selected = select_second_extrema(rows)\n        self.assertEqual([row[0] for row in selected], [1, 3, 4, 5])\n        self.assertEqual(selected, sorted(selected, key=lambda row: row[6]))\n\n\nif __name__ == \"__main__\":\n    unittest.main(verbosity=2)\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'test marker count={tests.count(marker)}')
          test_path.write_text(tests.replace(marker, addition), encoding='utf-8')

          readme_path = Path('research/candidate-03/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = '''- signal이 존재할 수 있는 보유 구간은 원본 bookTicker 해상도를 유지한다.\n- 그 외 구간은 분당 마지막 quote만 남겨 BacktestNode 반복을 빠르게 한다. 포지션이 열릴 수 있는 구간의 주문·손절·목표 판단은 축약하지 않는다.\n'''
          new = '''- signal이 존재할 수 있는 보유 구간은 원래 시각을 유지한 초당 첫·마지막 quote와 bid/ask 가격 극값을 보존한다. stop·target을 건드릴 수 있는 초내 가격 극값과 진입 가능한 첫 quote는 제거하지 않는다.\n- 그 외 구간은 분당 마지막 quote만 남긴다. 이 압축은 주문·체결·NAV를 계산하지 않으며, 동일 NautilusTrader BacktestNode 반복 시간을 줄이기 위한 데이터 표현이다.\n'''
          if readme.count(old) != 1:
              raise SystemExit(f'README target count={readme.count(old)}')
          readme_path.write_text(readme.replace(old, new), encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:research/candidate-03 \
            python research/candidate-03/test_nt_lvcfr.py
          PYTHONPYCACHEPREFIX=/tmp/candidate-03-pycache \
            python -m compileall -q research/candidate-03 src/smc_ict_4

          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add research/candidate-03/nt_lvcfr_data.py research/candidate-03/test_nt_lvcfr.py research/candidate-03/README.md
          git commit -m "candidate-03: accelerate causal quote catalog"
          git push origin HEAD:research/candidate-03
