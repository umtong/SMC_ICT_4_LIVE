name: candidate-10-v28-resolved-auction

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v28_*.py
      - research/candidate-10/test_c10_v28_overlay.py
      - .github/workflows/candidate-10-v28-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v28-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  weeks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - week_id: CONTROL_V27A
            week_start: "2023-11-02"
            evidence_class: controlled_failure_cause
          - week_id: CONTROL_V27B
            week_start: "2023-03-16"
            evidence_class: controlled_failure_cause
          - week_id: CONTROL_V27C
            week_start: "2025-01-02"
            evidence_class: controlled_failure_cause
          - week_id: HOLDOUT_V28A
            week_start: "2023-08-22"
            evidence_class: untouched_holdout
          - week_id: HOLDOUT_V28B
            week_start: "2025-01-25"
            evidence_class: untouched_holdout
          - week_id: HOLDOUT_V28C
            week_start: "2024-04-13"
            evidence_class: untouched_holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run full and exact resolution ablation
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="artifacts/candidate-10-v28/${{ matrix.week_id }}"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v28:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v28
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v28
              cp /workspace/research/candidate-10/c10_v27_overlay.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/c10_v27_patch.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/c10_v28_overlay.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/c10_v28_patch.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/c10_v28_run.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/test_c10_v27_overlay.py /tmp/candidate11-v28/
              cp /workspace/research/candidate-10/test_c10_v28_overlay.py /tmp/candidate11-v28/
              smc4 doctor
              python /tmp/candidate11-v28/c10_v28_patch.py \
                /tmp/candidate11-v28/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v28/c10_v27_overlay.py \
                /tmp/candidate11-v28/c10_v27_patch.py \
                /tmp/candidate11-v28/c10_v28_overlay.py \
                /tmp/candidate11-v28/c10_v28_patch.py \
                /tmp/candidate11-v28/c10_v28_run.py \
                /tmp/candidate11-v28/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v28 \
                -p "test_c10_v2*_overlay.py" \
                -v
              python /tmp/candidate11-v28/c10_v28_run.py \
                --candidate11-dir /tmp/candidate11-v28 \
                --week-start "${{ matrix.week_start }}" \
                --variant full-resolved-auction \
                --output "/workspace/artifacts/candidate-10-v28/${{ matrix.week_id }}/full-resolved-auction"
              python /tmp/candidate11-v28/c10_v28_run.py \
                --candidate11-dir /tmp/candidate11-v28 \
                --week-start "${{ matrix.week_start }}" \
                --variant ablation-original-leadership \
                --output "/workspace/artifacts/candidate-10-v28/${{ matrix.week_id }}/ablation-original-leadership"
              python - <<"PY"
              import json
              from pathlib import Path
              root = Path("/workspace/artifacts/candidate-10-v28/${{ matrix.week_id }}")
              summary = {
                  "week_id": "${{ matrix.week_id }}",
                  "week_start": "${{ matrix.week_start }}",
                  "evidence_class": "${{ matrix.evidence_class }}",
                  "full": json.loads((root / "full-resolved-auction" / "metrics.json").read_text()),
                  "ablation": json.loads((root / "ablation-original-leadership" / "metrics.json").read_text()),
                  "success_claim": False,
              }
              (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n")
              PY
            '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v28-${{ matrix.week_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v28/${{ matrix.week_id }}
          if-no-files-found: warn
          retention-days: 14
