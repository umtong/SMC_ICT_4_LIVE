name: Candidate 06 CIRB Family Contract Final Rerun

on:
  push:
    branches: [research/candidate-06]
    paths:
      - ".github/workflows/candidate-06-cirb-family-contract-final.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-cirb-family-contract-final
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  correct-and-run:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix family grouping and update deterministic fixture contract
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          source = Path("research/candidate-06/cirb_execution_resolution.py")
          lines = source.read_text(encoding="utf-8").splitlines()
          rev = next(i for i, line in enumerate(lines) if line.strip().startswith('reversal = expected_family == "CIRB_D_R"'))
          lines[rev] = '                reversal = expected_family == "CIRB_D_R" and (('
          if_rev = next(i for i in range(rev + 1, len(lines)) if lines[i].strip() == "if reversal:")
          closing = if_rev - 1
          if lines[closing].strip() == ")":
              lines[closing] = lines[closing] + ")"
          elif lines[closing].strip() != "))":
              raise SystemExit("REVERSAL_GROUP_CLOSING_NOT_FOUND")
          source.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test = Path("research/candidate-06/test_cirb_execution_resolution.py")
          text = test.read_text(encoding="utf-8")
          old = '''        baseline_entry={
                      "reference_price": 101.0,
                      "scenario_id": "baseline:ENTRY",
                  },
          '''
          new = '''        baseline_entry={
                      "reason_code": (
                          "TRAPPED_COUNTER_INVENTORY_CONTINUATION_ENTRY_ARMED"
                          if branch == "COUNTER_INVENTORY"
                          else "CROWD_DISCHARGE_REVERSAL_ENTRY_ARMED"
                      ),
                      "reference_price": 101.0,
                      "scenario_id": "baseline:ENTRY",
                  },
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "TRAPPED_COUNTER_INVENTORY_CONTINUATION_ENTRY_ARMED" not in text:
              raise SystemExit("TEST_FIXTURE_CONTEXT_MISSING")
          test.write_text(text, encoding="utf-8")
          PY
          python -m py_compile research/candidate-06/cirb_execution_resolution.py \
            research/candidate-06/test_cirb_execution_resolution.py

      - uses: actions/cache@v4
        with:
          path: .research-data/candidate-06
          key: candidate-06-cirb-5s-${{ runner.os }}-v1
          restore-keys: |
            candidate-06-cirb-5s-
            candidate-06-

      - name: Verify all unchanged causal and Nautilus contracts
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          assert version("nautilus_trader") == "1.230.0"
          PY
          python research/candidate-06/test_cirb_execution_resolution.py
          python research/candidate-06/test_crowding_inventory_response_engine.py
          python research/candidate-06/test_signal_submission_timing_contract.py
          python - <<'PY'
          import inspect
          from cirb_execution_resolution import build_child_plans
          source=inspect.getsource(build_child_plans)
          assert 'expected_family == "CIRB_D_R" and ((' in source
          assert 'expected_family == "CIRB_D_C"' in source
          assert 'expected_family != "CIRB_T_C"' in source
          assert 'parent for parent in parents if parent.baseline_entry is not None' in source
          assert '"partial_minute_aggregation": True' in source
          print("CIRB_FAMILY_AND_PARTIAL_MINUTE_CONTRACTS=PASS")
          PY

      - name: Run fresh authoritative W2-first matrix
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/cirb-execution-resolution
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts/candidate-06
          python research/candidate-06/run_cirb_execution_resolution_matrix.py \
            --output artifacts/candidate-06/cirb-execution-resolution \
            > artifacts/candidate-06-cirb-execution-resolution.stdout \
            2> artifacts/candidate-06-cirb-execution-resolution.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit source tests and fresh evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          root=artifacts/candidate-06/cirb-execution-resolution
          mkdir -p "$root"
          code='${{ steps.lab.outputs.exit_code }}'; if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > "$root/workflow_exit_code.txt"
          cp artifacts/candidate-06-cirb-execution-resolution.stdout "$root/workflow_stdout.txt" 2>/dev/null || :
          cp artifacts/candidate-06-cirb-execution-resolution.stderr "$root/workflow_stderr.txt" 2>/dev/null || :
          touch "$root/workflow_stdout.txt" "$root/workflow_stderr.txt"
          if [ ! -s "$root/summary.json" ]; then
            printf '%s\n' '{"long_evaluation_authorized":false,"selected":null,"terminal_status":"IMPLEMENTATION_FAILURE_BEFORE_W2"}' > "$root/summary.json"
            printf '# CIRB partial-minute run\n\nImplementation failure before W2.\n' > "$root/SUMMARY.md"
          fi
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add research/candidate-06/cirb_execution_resolution.py \
                  research/candidate-06/test_cirb_execution_resolution.py
          git add -u "$root" || true
          git add -f "$root/summary.json" "$root/SUMMARY.md" "$root/workflow_exit_code.txt" \
            "$root/workflow_stdout.txt" "$root/workflow_stderr.txt"
          find "$root" -type f \( -name 'metrics.json' -o -name 'parent_audit.json' \
            -o -name 'child_plans.json' -o -name 'run.json' -o -name '*data_quality.json' \
            -o -name 'futures_metrics_quality.json' -o -name 'errors.log' \) \
            -print0 | xargs -0 -r git add -f
          if ! git diff --cached --quiet; then
            git commit -m "Complete candidate-06 CIRB family-frozen 5S test [candidate-06 evidence]"
            git push origin HEAD:research/candidate-06
          fi

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-cirb-family-final-${{ github.sha }}
          path: artifacts/candidate-06/cirb-execution-resolution
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce research verdict
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'; if [ -z "$code" ]; then code=1; fi
          exit "$code"
