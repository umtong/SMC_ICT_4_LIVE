name: Research liquidity opportunity untouched windows

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v3"]
    paths:
      - ".github/workflows/research-liquidity-opportunity-holdout.yml"
      - "research/candidate-liquidity-auction-v3/.dispatch-opportunity-holdout"

concurrency:
  group: research-liquidity-opportunity-holdout
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v3
      - name: Record untouched-window run
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-liquidity-opportunity-holdout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-liquidity-opportunity-holdout
          git commit -m "Record untouched opportunity run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_liquidity_auction_v3

  export:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {period: holdout-2022-jan, start: 2022-01-01, end: 2022-01-08}
          - {period: holdout-2022-apr, start: 2022-04-01, end: 2022-04-08}
          - {period: holdout-2022-jul, start: 2022-07-01, end: 2022-07-08}
          - {period: holdout-2022-oct, start: 2022-10-01, end: 2022-10-08}
          - {period: holdout-2023-jan, start: 2023-01-01, end: 2023-01-08}
          - {period: holdout-2023-apr, start: 2023-04-01, end: 2023-04-08}
          - {period: holdout-2023-jul, start: 2023-07-01, end: 2023-07-08}
          - {period: holdout-2023-oct, start: 2023-10-01, end: 2023-10-08}
          - {period: holdout-2024-jan, start: 2024-01-01, end: 2024-01-08}
          - {period: holdout-2024-apr, start: 2024-04-01, end: 2024-04-08}
          - {period: holdout-2024-jul, start: 2024-07-01, end: 2024-07-08}
          - {period: holdout-2024-oct, start: 2024-10-01, end: 2024-10-08}
          - {period: holdout-2025-jan, start: 2025-01-01, end: 2025-01-08}
          - {period: holdout-2025-apr, start: 2025-04-01, end: 2025-04-08}
          - {period: holdout-2025-jul, start: 2025-07-01, end: 2025-07-08}
          - {period: holdout-2025-oct, start: 2025-10-01, end: 2025-10-08}
          - {period: holdout-2026-jan, start: 2026-01-01, end: 2026-01-08}
          - {period: holdout-2026-apr, start: 2026-04-01, end: 2026-04-08}
          - {period: holdout-2026-jul, start: 2026-07-01, end: 2026-07-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Export untouched exact one-minute price and aggressor flow
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance-cache "holdout/${{ matrix.period }}"
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --before-days 3 \
            --after-days 2 \
            --cache /tmp/binance-cache \
            --output "holdout/${{ matrix.period }}"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-opportunity-${{ matrix.period }}
          path: holdout/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
