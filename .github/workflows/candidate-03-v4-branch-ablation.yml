name: candidate-03-v4-value-edge-branch-ablation

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-v4-branch-ablation.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v4_config.json

jobs:
  ablate-value-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned NautilusTrader path
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c 'smc4 doctor && PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 python research/candidate-03/test_nt_lvcfr_v4.py'

      - name: Restore first-week catalog
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: First week without VALUE_EDGE_CONTINUATION
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          out=artifacts/candidate-03/nt-lvcfr-v4-ablation/development-1
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v4_signals.py --prepared-root $prepared --output-manifest $out/full_manifest.json"
          PREPARED="$prepared" OUT="$out" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['PREPARED']) / 'signals.json'
          signals = json.loads(path.read_text(encoding='utf-8'))
          kept = [item for item in signals if item.get('scenario_kind') != 'VALUE_EDGE_CONTINUATION']
          path.write_text(json.dumps(kept, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'ablation': 'REMOVE_VALUE_EDGE_CONTINUATION',
              'full_signal_count': len(signals),
              'kept_signal_count': len(kept),
              'kept_states': {},
          }
          for item in kept:
              key = item.get('scenario_kind', 'UNKNOWN')
              summary['kept_states'][key] = summary['kept_states'].get(key, 0) + 1
          (Path(os.environ['OUT']) / 'ablation_schedule.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start 2024-01-08 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"

      - name: Restore second-week catalog
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Second week without VALUE_EDGE_CONTINUATION
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          out=artifacts/candidate-03/nt-lvcfr-v4-ablation/development-2
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v4_signals.py --prepared-root $prepared --output-manifest $out/full_manifest.json"
          PREPARED="$prepared" OUT="$out" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['PREPARED']) / 'signals.json'
          signals = json.loads(path.read_text(encoding='utf-8'))
          kept = [item for item in signals if item.get('scenario_kind') != 'VALUE_EDGE_CONTINUATION']
          path.write_text(json.dumps(kept, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'ablation': 'REMOVE_VALUE_EDGE_CONTINUATION',
              'full_signal_count': len(signals),
              'kept_signal_count': len(kept),
              'kept_states': {},
          }
          for item in kept:
              key = item.get('scenario_kind', 'UNKNOWN')
              summary['kept_states'][key] = summary['kept_states'].get(key, 0) + 1
          (Path(os.environ['OUT']) / 'ablation_schedule.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start 2025-06-23 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"

      - name: Preserve controlled branch ablation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v4-value-edge-ablation-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v4-ablation/**/*.json
            artifacts/candidate-03/nt-lvcfr-v4-ablation/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v4-ablation/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v4-ablation/**/*.log
          if-no-files-found: error
          retention-days: 30
