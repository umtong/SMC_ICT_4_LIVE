name: candidate-05-v56-spot-pullback-watch

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v56-spot-pullback-watch.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v56-spot-pullback-watch
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: v56-development-30d
            runner: research/candidate-05/v56_active/candidate.py
            pythonpath: research/candidate-05/v56_active:research/candidate-05
            build_start: "2024-02-28"
            evaluation_start: "2024-03-01"
            evaluation_end: "2024-03-30"
            spot_expected: "true"
          - label: v46-untouched-aug-sep-control
            runner: research/candidate-05/v40_active/candidate.py
            pythonpath: research/candidate-05/v40_active:research/candidate-05
            build_start: "2024-07-30"
            evaluation_start: "2024-08-01"
            evaluation_end: "2024-09-29"
            spot_expected: "false"
          - label: v56-untouched-aug-sep-60d
            runner: research/candidate-05/v56_active/candidate.py
            pythonpath: research/candidate-05/v56_active:research/candidate-05
            build_start: "2024-07-30"
            evaluation_start: "2024-08-01"
            evaluation_end: "2024-09-29"
            spot_expected: "true"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v56/${{ matrix.label }}
      CACHE: .cache/candidate-05-v56/${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and frozen causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_pullback_watch_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v55_spot_led_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v56_spot_pullback_watch_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v

      - name: Run continuous BTC account through NautilusTrader
        shell: bash
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python "${{ matrix.runner }}" stage \
            --config research/candidate-05/config.json \
            --build-start "${{ matrix.build_start }}" \
            --build-end "${{ matrix.evaluation_end }}" \
            --evaluation-start "${{ matrix.evaluation_start }}" \
            --evaluation-end "${{ matrix.evaluation_end }}" \
            --cache "$CACHE" \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Attribute the bounded spot-led scenario family
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          SPOT_EXPECTED: ${{ matrix.spot_expected }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())

          def number(value):
              if value is None:
                  return None
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          branch_name = "SPOT_LED_PRICE_DISCOVERY_PULLBACK"
          records = [item for item in closed if item.get("branch") == branch_name]
          pnls = [number(item.get("realized_pnl")) for item in records]
          pnls = [value for value in pnls if value is not None and math.isfinite(value)]
          branch = {
              "branch": branch_name,
              "trades": len(pnls),
              "wins": sum(value > 0.0 for value in pnls),
              "losses": sum(value < 0.0 for value in pnls),
              "net_pnl_usdt": sum(pnls),
              "pnls_usdt": pnls,
              "contexts": diagnostics.get("spot_led_contexts", 0),
              "acceptances": diagnostics.get("spot_led_context_acceptances", 0),
              "first_pullbacks": diagnostics.get("spot_led_context_first_pullbacks", 0),
              "watches": diagnostics.get("spot_pullback_watches", 0),
              "watch_observations": diagnostics.get("spot_pullback_watch_observations", 0),
              "watch_confirmations": diagnostics.get("spot_pullback_watch_confirmations", 0),
              "watch_expiries": diagnostics.get("spot_pullback_watch_expiries", 0),
              "feature_gaps": diagnostics.get("spot_pullback_watch_feature_gaps", 0),
              "slot_conflicts": diagnostics.get("spot_led_pullback_slot_conflicts", 0),
              "no_live_target": diagnostics.get("spot_led_pullback_no_live_target", 0),
              "geometry_rejections": diagnostics.get("spot_led_pullback_geometry_rejections", 0),
              "submissions": diagnostics.get("spot_led_pullback_submissions", 0),
          }
          integrity = (
              int(metrics.get("liquidations") or 0) == 0
              and int(metrics.get("order_rejections") or 0) == 0
              and int(metrics.get("order_denials") or 0) == 0
              and float(metrics.get("min_equity") or 0.0) > 0.0
          )
          result = {
              "schema": "candidate-05-v56-spot-pullback-watch-v1",
              "label": os.environ["LABEL"],
              "spot_expected": os.environ["SPOT_EXPECTED"] == "true",
              "integrity_pass": integrity,
              "candidate_metrics": metrics,
              "incremental_branch": branch,
              "classification": (
                  "V56_POSITIVE_INCREMENTAL_ALPHA"
                  if integrity and branch["trades"] > 0 and branch["net_pnl_usdt"] > 0.0
                  else "V56_OCCURRED_WITHOUT_POSITIVE_INCREMENT"
                  if branch["trades"] > 0
                  else "V56_NO_EXECUTED_OCCURRENCE"
              ),
          }
          (root / "v56_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/metrics.json"
          python -m json.tool "$ROOT/v56_decision.json"
          for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
            test -s "$ROOT/$file"
          done
          if test "${{ matrix.spot_expected }}" = true; then
            grep -q 'spot_aggTrades' "$ROOT/raw_evidence.json"
            grep -q 'spot_klines' "$ROOT/raw_evidence.json"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v56-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/candidate-05-v56/${{ matrix.label }}/**
          if-no-files-found: warn
          retention-days: 90
