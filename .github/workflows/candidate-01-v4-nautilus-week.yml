name: candidate-01-v4-nautilus-week

on:
  workflow_dispatch:
    inputs:
      week:
        description: UTC Monday/start date (YYYY-MM-DD)
        required: true
        default: "2023-06-19"
      label:
        description: Artifact label
        required: true
        default: "week-1"

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v4-nautilus-week
          key: candidate-01-v4-nautilus-BTCUSDT-${{ inputs.week }}-${{ runner.os }}-v1
      - name: Run authoritative NautilusTrader weekly gate
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/nautilus_plan_backtest.py \
                research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py
              python -m unittest discover -s tests -p "test_candidate_01_authoritative_nautilus.py" -v
              rm -rf artifacts/candidate-01-v4-nautilus-${{ inputs.label }}
              python research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py \
                --week "${{ inputs.week }}" \
                --cache .cache/candidate-01-v4-nautilus-week \
                --output artifacts/candidate-01-v4-nautilus-${{ inputs.label }} \
                --workers 4
            '
      - name: Verify engine ownership
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-01-v4-nautilus-${{ inputs.label }}")
          summary = json.loads((root / "intrinsic_external_liquidity_v4_nautilus_week_summary.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          assert summary["authoritative_backtest"] is True
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["custom_fill_simulator"] is False
          assert summary["custom_pnl_or_nav_ledger"] is False
          assert summary["risk_fraction"] == 0.03
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          for name in ("orders.csv", "positions.csv", "account.csv", "daily_nav.csv", "nautilus_metrics.json"):
              assert (root / name).exists(), name
          print(json.dumps(summary["metrics"], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v4-nautilus-${{ inputs.label }}-${{ github.sha }}
          path: artifacts/candidate-01-v4-nautilus-${{ inputs.label }}
          if-no-files-found: error
          retention-days: 30
