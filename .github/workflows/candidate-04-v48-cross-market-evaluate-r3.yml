name: candidate-04-v48-cross-market-evaluate-r3

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v48-cross-market-evaluate-r3.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      SOURCE_FEATURE_RUN: 31161557908
      BUILD_START: 2025-07-19
      BUILD_END: 2025-07-27
      EVALUATION_START: 2025-07-21
      EVALUATION_END: 2025-07-27
      ROOT: artifacts/candidate-04-v48-cross-market-r3
      EVIDENCE: research/candidate-04/evidence-v48-cross-market-information-transfer.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v48-rich-*-31161557908
          path: restored-rich
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31161557908
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Verify symbol isolation, causal sequence and one-account contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/cross_market_information_transfer_compiler.py \
            research/candidate-04/cross_market_information_transfer_compiler_v2.py \
            research/candidate-04/nt_multi_asset_rich_backtest_v44.py
          python -m unittest discover -s research/candidate-04/tests -p 'test_cross_market_information_transfer_compiler.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_cross_market_information_transfer_compiler_v2.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_conditional_adverse_fill_risk_sizing.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_causal_risk_sizing.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_multi_asset_risk_evidence.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_trusted_execution_factory.py' -v

      - name: Compile the identical cross-market state
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/rich" "$ROOT/config" "$ROOT/all_signals" "$ROOT/signals"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = json.loads(Path("research/candidate-04/inventory_transfer_config.json").read_text())
          root = Path(os.environ["ROOT"]) / "config"
          for symbol in ("BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"):
              value = dict(base); value["symbol"] = symbol
              (root / f"{symbol}.json").write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
          for symbol in BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            source="$(find restored-rich -type f -path "*${symbol}*/rich/data_manifest.json" -printf '%h\n' | head -n1)"
            test -n "$source"
            ln -s "$(realpath "$source")" "$ROOT/rich/$symbol"
          done
          export C04_BUILD_START="$BUILD_START" C04_BUILD_END="$BUILD_END"
          export C04_EVALUATION_START="$EVALUATION_START" C04_EVALUATION_END="$EVALUATION_END"
          python research/candidate-04/cross_market_information_transfer_compiler_v2.py \
            --rich-root "$ROOT/rich" \
            --config-root "$ROOT/config" \
            --kline-root .cache/candidate-04-v48-r3/compiler-klines \
            --evaluation-start "$EVALUATION_START" \
            --evaluation-end "$EVALUATION_END" \
            --output "$ROOT/all_signals" \
            > "$ROOT/compiler.log"
          test -s "$ROOT/all_signals/summary.json"

      - name: Attach causal targets and run one NautilusTrader account
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT/signals/BTCUSDT"
          cp "$ROOT/all_signals/BTCUSDT/signals.json" "$ROOT/signals/BTCUSDT/signals.json"
          cp "$ROOT/all_signals/BTCUSDT/summary.json" "$ROOT/signals/BTCUSDT/summary.json"
          export C04_BUILD_START="$BUILD_START" C04_BUILD_END="$BUILD_END"
          export C04_EVALUATION_START="$EVALUATION_START" C04_EVALUATION_END="$EVALUATION_END"
          for symbol in ETHUSDT SOLUSDT XRPUSDT; do
            python research/candidate-04/causal_target_registry_enricher.py \
              --signals "$ROOT/all_signals/$symbol/signals.json" \
              --base-config "$ROOT/config/$symbol.json" \
              --rich-dir "$ROOT/rich/$symbol" \
              --kline-dir ".cache/candidate-04-v48-r3/compiler-klines/$symbol" \
              --build-start "$BUILD_START" --build-end "$BUILD_END" \
              --output-dir "$ROOT/signals/$symbol" --download-klines \
              --cost-rate 0.00075 --minimum-net-r 1.20 \
              > "$ROOT/target-${symbol}.log"
          done
          python research/candidate-04/nt_multi_asset_rich_backtest_v44.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --signals-root "$ROOT/signals" \
            --build-start "$BUILD_START" --build-end "$BUILD_END" \
            --evaluation-start "$EVALUATION_START" --evaluation-end "$EVALUATION_END" \
            --cache .cache/candidate-04-v48-r3/nautilus \
            --output "$ROOT/nautilus" \
            --min-trades 3 --min-active-days 2 --min-win-rate 0.50 --min-geometric-daily 0.0 \
            > "$ROOT/nautilus.log"
          test -s "$ROOT/nautilus/metrics.json"
          test -s "$ROOT/nautilus/risk_evidence.json"

      - name: Record V48 diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          read=lambda p: json.loads(p.read_text()) if p.exists() else None
          compiler=read(root/"all_signals/summary.json")
          metrics=read(root/"nautilus/metrics.json")
          risk=read(root/"nautilus/risk_evidence.json")
          targets={}
          for symbol in ("ETHUSDT","SOLUSDT","XRPUSDT"):
              value=read(root/"signals"/symbol/"summary.json")
              if value is not None: targets[symbol]=value
          implementation=bool(compiler and metrics and risk and metrics.get("global_entry_pass") and metrics.get("risk_pass") and risk.get("risk_pass"))
          trades=int((metrics or {}).get("trades") or 0); active=int((metrics or {}).get("active_days") or 0)
          ret=float((metrics or {}).get("total_return") or 0); wr=float((metrics or {}).get("win_rate") or 0)
          potential=bool(implementation and ret>0 and trades>=3 and active>=2 and wr>=0.50)
          decision=("implementation_failure_repair_and_rerun_identical_week" if not implementation else "retain_v48_and_open_second_predeclared_four_asset_week" if potential else "diagnose_v48_state_bottleneck_then_one_variable_ablation" if trades==0 else "run_one_core_variable_ablation_on_identical_week_before_discard")
          evidence={
              "candidate":"candidate-04-v48-cross-market-information-transfer",
              "engine":"NautilusTrader 1.230.0 BacktestNode",
              "source_feature_workflow_run":int(os.environ["SOURCE_FEATURE_RUN"]),
              "evaluation":{"build_start":os.environ["BUILD_START"],"build_end":os.environ["BUILD_END"],"evaluation_start":os.environ["EVALUATION_START"],"evaluation_end":os.environ["EVALUATION_END"]},
              "market_cause":"BTC information event, follower underreaction, independent follower inventory and structure confirmation",
              "compiler":compiler,"target_summaries":targets,"nautilus_metrics":metrics,"risk_evidence":risk,
              "implementation_pass":implementation,"positive_first_week_potential":potential,"decision":decision,
              "project_target_reached":False,"final_validation_completed":False,"performance_recalculated_outside_nautilus":False
          }
          Path(os.environ["EVIDENCE"]).write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          (root/"decision.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v48-cross-market-r3-${{ github.run_id }}
          path: |
            artifacts/candidate-04-v48-cross-market-r3
            research/candidate-04/evidence-v48-cross-market-information-transfer.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name candidate-04-research-bot
          git config user.email candidate-04-research-bot@users.noreply.github.com
          git add "$EVIDENCE" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record repaired V48 cross-market evaluation"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-04 && git push origin HEAD:research/candidate-04; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((attempt*3))
          done
          exit 1
