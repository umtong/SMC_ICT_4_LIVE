name: candidate-04-v29-week1-external-failed-discovery-ablation

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v29-week1-external-failed-discovery-ablation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_BUILD_START: "2025-03-22"
      C04_BUILD_END: "2025-03-30"
      C04_EVALUATION_START: "2025-03-24"
      C04_EVALUATION_END: "2025-03-30"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b37d576c1ca054754db5da816e148b4b2e2ec41

      - name: Restore exact failed untouched-week evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v29-untouched-week-1-04774b3ca7536bf8fad6e9671027d6826ece6ed2
          path: artifacts/candidate-04-v29-week1-ablation/original
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31110828251
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify one-scenario ablation contract
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/ablate_compiled_scenario.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          test -s artifacts/candidate-04-v29-week1-ablation/original/signals/signals.json
          test -s artifacts/candidate-04-v29-week1-ablation/original/signals/summary.json
          test -s artifacts/candidate-04-v29-week1-ablation/original/summary.json

      - name: Remove only external failed-discovery reversal
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v29-week1-ablation"
          python research/candidate-04/ablate_compiled_scenario.py \
            --input-signals "$root/original/signals/signals.json" \
            --input-summary "$root/original/signals/summary.json" \
            --remove EXTERNAL_POOL_FAILED_DISCOVERY_REVERSAL \
            --candidate candidate-04-v29-no-external-failed-discovery \
            --output "$root/ablated/signals"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-04-v29-week1-ablation")
          original = json.loads((root / "original/signals/signals.json").read_text())
          ablated = json.loads((root / "ablated/signals/signals.json").read_text())
          if len(original) - len(ablated) != 1:
              raise SystemExit("expected exactly one removed signal")
          if any(row["scenario"] == "EXTERNAL_POOL_FAILED_DISCOVERY_REVERSAL" for row in ablated):
              raise SystemExit("removed scenario survived ablation")
          print(json.dumps({"original": len(original), "ablated": len(ablated)}, sort_keys=True))
          PY

      - name: Replay unchanged remaining intents through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v29-week1-ablation"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/ablated/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v29-week1-ablation/raw" \
            --output "$root/ablated/nautilus" \
            | tee "$root/ablated/nautilus_console.json"
          test -s "$root/ablated/nautilus/metrics.json"
          test -e "$root/ablated/nautilus/positions.csv"
          test -s "$root/ablated/nautilus/strategy_events.json"

      - name: Compare original and controlled ablation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v29-week1-ablation")
          original = json.loads((root / "original/summary.json").read_text())
          metrics = json.loads((root / "ablated/nautilus/metrics.json").read_text())
          events = json.loads((root / "ablated/nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "ablated/nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit("entry-position mismatch")
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV")
          summary = {
              "candidate": "candidate-04-v29-no-external-failed-discovery",
              "stage": "untouched_week_1_logic_ablation",
              "changed_variables": 1,
              "removed_scenario": "EXTERNAL_POOL_FAILED_DISCOVERY_REVERSAL",
              "original": {
                  "trades": original["trades"],
                  "wins": original["wins"],
                  "total_return": original["total_return"],
                  "geometric_daily_growth": original["geometric_daily_growth"],
              },
              "ablated": {
                  "trades": metrics.get("trades"),
                  "wins": metrics.get("wins"),
                  "win_rate": metrics.get("win_rate"),
                  "total_return": metrics.get("total_return"),
                  "geometric_daily_growth": metrics.get("geometric_daily_growth"),
                  "active_days": metrics.get("active_days"),
                  "max_drawdown": metrics.get("max_drawdown"),
                  "scenario_metrics": metrics.get("scenario_metrics"),
                  "maximum_realized_loss_fraction": maximum,
              },
              "structural_path_exists": bool(metrics.get("total_return", 0.0) > 0.0),
              "engine": "NautilusTrader BacktestNode",
          }
          (root / "comparison.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v29-week1-external-failed-discovery-ablation-${{ github.sha }}
          path: artifacts/candidate-04-v29-week1-ablation
          if-no-files-found: error
          retention-days: 90
