name: candidate-07-initiative-flow-transition

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/diagnose_initiative_flow_transition.py"
      - "research/candidate-07/diagnose_initiative_flow_transition_v2.py"
      - "research/candidate-07/tests/test_initiative_flow_transition_v2.py"
      - ".github/workflows/candidate-07-initiative-flow-transition.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify foundation and focused contracts
        run: |
          set -eu
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-flow-transfer-pyc \
            python -m compileall -q research/candidate-07
          python -m unittest \
            research/candidate-07/tests/test_initiative_flow_transition_v2.py -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-btcusdt-2024-through-2026h1-v1
          restore-keys: |
            candidate-07-btcusdt-three-weeks-v3
            candidate-07-btcusdt-three-weeks-v2
            candidate-07-btcusdt-three-weeks-v1

      - name: Reproduce frozen initiative-auction evidence
        run: >-
          python research/candidate-07/staged_initiative_auction.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --output artifacts/candidate-07-initiative-flow/source
          --data-root .research-data/candidate-07
          --max-weeks 3

      - name: Diagnose variable-horizon flow transfer
        run: |
          set -eu
          ROOT=artifacts/candidate-07-initiative-flow
          python research/candidate-07/diagnose_initiative_flow_transition_v2.py \
            --config research/candidate-07/config.json \
            --stage week-1 --start 2025-12-22 --end 2025-12-29 \
            --run-root "$ROOT/source/week-1" \
            --output "$ROOT/diagnostic/week-1" \
            --data-root .research-data/candidate-07
          python research/candidate-07/diagnose_initiative_flow_transition_v2.py \
            --config research/candidate-07/config.json \
            --stage week-2 --start 2025-01-27 --end 2025-02-03 \
            --run-root "$ROOT/source/week-2" \
            --output "$ROOT/diagnostic/week-2" \
            --data-root .research-data/candidate-07
          python research/candidate-07/diagnose_initiative_flow_transition_v2.py \
            --config research/candidate-07/config.json \
            --stage week-3 --start 2024-06-24 --end 2024-07-01 \
            --run-root "$ROOT/source/week-3" \
            --output "$ROOT/diagnostic/week-3" \
            --data-root .research-data/candidate-07

      - name: Build cross-stage immutable diagnostic
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from math import prod
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/candidate-07-initiative-flow")
          frames = []
          for stage in ("week-1", "week-2", "week-3"):
              path = root / "diagnostic" / stage / "initiative_flow_features.csv"
              frame = pd.read_csv(path)
              frame["stage"] = stage
              frames.append(frame)
          all_rows = pd.concat(frames, ignore_index=True)
          all_rows.to_csv(root / "initiative_flow_features_all.csv", index=False)

          rules = (
              "source_attack_flow_present",
              "confirmation_flow_sign_flip",
              "persistent_confirmation_transfer",
              "entry_minute_confirms_transfer",
          )
          output = {
              "source_commit": "${{ github.sha }}",
              "candidate": "candidate-07-initiative-flow-transition-v2",
              "rules": {},
              "stages": {},
          }
          for stage, frame in all_rows.groupby("stage", sort=True):
              output["stages"][stage] = {
                  "absorption_trades": int(len(frame.index)),
                  "wins": int(frame["win"].astype(bool).sum()),
                  "losses": int((~frame["win"].astype(bool)).sum()),
                  "confirmation_horizons": sorted(
                      int(value) for value in frame["confirmation_bars"].unique()
                  ),
              }
          for rule in rules:
              selected = all_rows[all_rows[rule].astype(bool)].copy()
              returns = selected["net_return_on_nav"].astype(float).tolist()
              output["rules"][rule] = {
                  "selected": int(len(selected.index)),
                  "wins": int(selected["win"].astype(bool).sum()),
                  "losses": int((~selected["win"].astype(bool)).sum()),
                  "win_rate": (
                      float(selected["win"].astype(bool).mean())
                      if len(selected.index)
                      else 0.0
                  ),
                  "diagnostic_compounded_recorded_returns": (
                      prod(1.0 + value for value in returns) - 1.0
                      if returns
                      else 0.0
                  ),
                  "by_stage": {
                      stage: {
                          "selected": int(len(part.index)),
                          "wins": int(part["win"].astype(bool).sum()),
                          "losses": int((~part["win"].astype(bool)).sum()),
                      }
                      for stage, part in selected.groupby("stage", sort=True)
                  },
                  "by_direction": {
                      direction: {
                          "selected": int(len(part.index)),
                          "wins": int(part["win"].astype(bool).sum()),
                          "losses": int((~part["win"].astype(bool)).sum()),
                      }
                      for direction, part in selected.groupby("direction", sort=True)
                  },
              }
          destination = root / "combined_flow_transfer_diagnostic.json"
          destination.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(destination.read_text(encoding="utf-8"))
          PY

      - name: Print immutable result
        if: always()
        run: |
          find artifacts/candidate-07-initiative-flow -name initiative_flow_summary.json \
            -print -exec cat {} \;
          test -f artifacts/candidate-07-initiative-flow/combined_flow_transfer_diagnostic.json
          cat artifacts/candidate-07-initiative-flow/combined_flow_transfer_diagnostic.json

      - name: Preserve complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-initiative-flow-transition-${{ github.sha }}
          path: artifacts/candidate-07-initiative-flow
          retention-days: 14
          if-no-files-found: error
