name: bootstrap-direct-auction-policy

on:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - ".github/workflows/bootstrap-direct-auction-policy.yml"
      - ".bootstrap/direct_policy_sources.b64.part*"

concurrency:
  group: bootstrap-direct-auction-policy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML_thinking
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize direct causal state-action research
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/direct_policy_sources.b64.part* | base64 --decode > /tmp/direct_policy_sources.tgz
          echo "828b5f14d11daf4d7951d4723e63e0e1884214446a9950f88f6824c82c8e501d  /tmp/direct_policy_sources.tgz" | sha256sum --check --strict
          target="research/candidate-direct-auction-policy"
          rm -rf "$target"
          mkdir -p "$target"
          tar -xzf /tmp/direct_policy_sources.tgz -C "$target"
          python -m py_compile \
            "$target/direct_state_action_harvest.py" \
            "$target/run_direct_state_action_harvest.py" \
            "$target/self_check_direct_policy.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git rm -f .bootstrap/direct_policy_sources.b64.part* .github/workflows/bootstrap-direct-auction-policy.yml
          git commit -m "Build direct causal state-action research"
          git push origin HEAD:research_ML_thinking
