name: candidate-08-funding-boundary-jitter-fix-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-funding-boundary-jitter-fix-v1"

permissions:
  contents: write
  packages: read

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize only verified sub-second funding-boundary jitter
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          source_path = Path("research/candidate-08/aggtrade_acceptance_funding.py")
          source = source_path.read_text(encoding="utf-8")
          constant_anchor = '''REQUIRED_COLUMNS = {
              "calc_time",
              "funding_interval_hours",
              "last_funding_rate",
          }
          '''
          constant_replacement = constant_anchor + '''
          # Official Binance funding archives occasionally stamp an intended settlement boundary
          # a few milliseconds late. This is data timestamp jitter, not a missing settlement.
          # Canonicalization is allowed only inside one second; material off-boundary rows fail.
          MAX_FUNDING_BOUNDARY_JITTER_NS = 1_000_000_000
          '''
          if source.count(constant_anchor) != 1:
              raise SystemExit("funding constant anchor mismatch")
          source = source.replace(constant_anchor, constant_replacement)

          start = source.index("    data = data.sort_index()\n")
          end = source.index("    data = data.loc[(data.index >= start) & (data.index < end)].copy()\n", start)
          new = '''    raw_timestamps = data.index
              canonical_timestamps: list[int] = []
              boundary_jitter_ns: list[int] = []
              boundary_failures = 0
              for timestamp, interval_minutes in zip(
                  raw_timestamps,
                  data["funding_interval_minutes"],
                  strict=True,
              ):
                  raw_ns = int(timestamp.as_unit("ns").value)
                  interval_ns = int(interval_minutes) * 60_000_000_000
                  remainder = raw_ns % interval_ns
                  if remainder <= interval_ns // 2:
                      canonical_ns = raw_ns - remainder
                      jitter_ns = remainder
                  else:
                      canonical_ns = raw_ns + (interval_ns - remainder)
                      jitter_ns = interval_ns - remainder
                  if jitter_ns > MAX_FUNDING_BOUNDARY_JITTER_NS:
                      boundary_failures += 1
                  canonical_timestamps.append(canonical_ns)
                  boundary_jitter_ns.append(jitter_ns)
              if boundary_failures:
                  raise FundingDataError(
                      "funding calc_time did not land within the verified settlement-boundary "
                      f"jitter tolerance: {boundary_failures} rows"
                  )
              data.index = pd.to_datetime(canonical_timestamps, unit="ns", utc=True)
              data.index.name = "funding_time"
              data = data.sort_index()
              duplicate_rows = int(data.index.duplicated(keep=False).sum())
              if duplicate_rows:
                  conflicting = False
                  for _, group in data.loc[data.index.duplicated(keep=False)].groupby(level=0):
                      if (
                          group["funding_rate"].nunique(dropna=False) > 1
                          or group["funding_interval_minutes"].nunique(dropna=False) > 1
                      ):
                          conflicting = True
                          break
                  if conflicting:
                      raise FundingDataError("conflicting duplicate funding timestamp rows")
                  data = data.loc[~data.index.duplicated(keep="last")].copy()

              for timestamp, interval_minutes in zip(
                  data.index,
                  data["funding_interval_minutes"],
                  strict=True,
              ):
                  timestamp_ns = int(timestamp.as_unit("ns").value)
                  interval_ns = int(interval_minutes) * 60_000_000_000
                  if timestamp_ns % interval_ns != 0:
                      raise FundingDataError("canonical funding timestamp was not on its boundary")

          '''
          source = source[:start] + new + source[end:]
          quality_anchor = (
              '        "internal_gap_count": gap_count,\n'
              '        "max_gap_minutes": float(deltas.max()) if deltas.notna().any() else 0.0,\n'
          )
          quality_replacement = (
              '        "internal_gap_count": gap_count,\n'
              '        "max_gap_minutes": float(deltas.max()) if deltas.notna().any() else 0.0,\n'
              '        "max_boundary_jitter_milliseconds": max(boundary_jitter_ns, default=0) / 1_000_000.0,\n'
          )
          if source.count(quality_anchor) != 1:
              raise SystemExit("funding quality anchor mismatch")
          source = source.replace(quality_anchor, quality_replacement)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("research/candidate-08/test_aggtrade_acceptance_pure.py")
          tests = test_path.read_text(encoding="utf-8")
          test_anchor = "    def test_off_boundary_or_conflicting_duplicate_funding_is_rejected(self) -> None:\n"
          test_method = '''    def test_millisecond_funding_boundary_jitter_is_canonicalized(self) -> None:
                  start = pd.Timestamp("2024-04-08T00:00:00Z").to_pydatetime()
                  end = pd.Timestamp("2024-04-09T00:00:00Z").to_pydatetime()
                  frame = pd.DataFrame(
                      {
                          "calc_time": [
                              self._calc_ms("2024-04-08T00:00:00Z") + 1,
                              self._calc_ms("2024-04-08T08:00:00Z") + 6,
                          ],
                          "funding_interval_hours": [8, 8],
                          "last_funding_rate": [0.0001, -0.00005],
                      }
                  )
                  normalized, quality = _normalize_funding_frame(frame, start=start, end=end)
                  self.assertEqual(
                      list(normalized.index),
                      [pd.Timestamp("2024-04-08T00:00:00Z"), pd.Timestamp("2024-04-08T08:00:00Z")],
                  )
                  self.assertEqual(quality["internal_gap_count"], 0)
                  self.assertAlmostEqual(quality["max_boundary_jitter_milliseconds"], 6.0)

          '''
          if tests.count(test_anchor) != 1:
              raise SystemExit("funding test anchor mismatch")
          tests = tests.replace(test_anchor, test_method + test_anchor)
          test_path.write_text(tests, encoding="utf-8")
          PY
          smc4 doctor
          python -m compileall -q \
            research/candidate-08/aggtrade_acceptance_funding.py \
            research/candidate-08/test_aggtrade_acceptance_pure.py
          python research/candidate-08/test_aggtrade_acceptance_pure.py -v
          python research/candidate-08/test_aggtrade_acceptance_nautilus.py -v
      - name: Commit controlled implementation correction
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f research/candidate-08/.run-funding-boundary-jitter-fix-v1
          git add -A -- \
            research/candidate-08/aggtrade_acceptance_funding.py \
            research/candidate-08/test_aggtrade_acceptance_pure.py \
            research/candidate-08/.run-funding-boundary-jitter-fix-v1
          git commit -m "candidate-08: canonicalize verified funding boundary jitter [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
