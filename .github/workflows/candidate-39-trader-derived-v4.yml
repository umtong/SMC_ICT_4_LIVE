name: candidate-39-v4-trader-derived-development

on:
  push:
    branches:
      - research/candidate-39
    paths:
      - ".github/workflows/candidate-39-trader-derived-v4.yml"
      - "research/candidate-39/TRADER_METHOD_LEDGER.md"
      - "research/candidate-39/router_v4.py"
      - "research/candidate-39/router_v4_core.py"
      - "research/candidate-39/router_v4_families.py"
      - "research/candidate-39/strategy_v4.py"
      - "research/candidate-39/run_v4.py"
      - "research/candidate-39/test_router_v4.py"
      - "research/candidate-39/router.py"
      - "research/candidate-39/strategy.py"
      - "research/candidate-39/config.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: candidate-39-v4-trader-derived-${{ github.sha }}
  cancel-in-progress: false

jobs:
  development-falsification-seven-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONPATH: research/candidate-39:research/candidate-35:research/candidate-29:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/c39-v4-development-2026-07-08_2026-07-14
    steps:
      - uses: actions/checkout@v4

      - name: Restore checksum-verified raw-data cache
        uses: actions/cache@v4
        with:
          path: .cache/c39-v2-development
          key: candidate39-binance-2026-07-08_2026-07-14-v1

      - name: Verify environment and V4 causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-39
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys

          path = Path("research/candidate-39/test_router_v4.py")
          spec = importlib.util.spec_from_file_location("candidate39_v4_contract", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"cannot load {path}")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          count = 0
          for test_name in sorted(vars(module)):
              test = getattr(module, test_name)
              if test_name.startswith("test_") and callable(test):
                  test()
                  count += 1
          assert count >= 8, count
          print(f"candidate39 V4 causal contracts passed: {count}")

          import strategy_v4
          assert strategy_v4.Candidate35Strategy is strategy_v4.Candidate39V4Strategy
          assert strategy_v4.Candidate39Strategy is strategy_v4.Candidate39V4Strategy
          PY

      - name: Replay one four-asset continuous Nautilus account on development data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-39/run_v4.py \
            --config research/candidate-39/config.json \
            --start 2026-07-08 \
            --end 2026-07-14 \
            --cache .cache/c39-v2-development \
            --workspace .cache/c39-v4-development-work \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify and expose exact V4 development evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ROOT/metrics.json"
          test -f "$ROOT/run.json"
          test -f "$ROOT/data_manifest.json"
          test -f "$ROOT/strategy_diagnostics.json"
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          manifest = json.loads((root / "data_manifest.json").read_text())

          assert metrics["candidate"] == "candidate-39-trader-derived-auction-router-v4"
          assert metrics["evidence_status"] == "DEVELOPMENT_REPLAY_AFTER_DOMESTIC_INTERNATIONAL_TRADER_METHOD_MINING"
          assert metrics["non_scalping"] is True
          assert metrics["price_only_decision_boundary"] is True
          assert metrics["universe"] == ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["calendar_days"] == 7
          assert metrics["intended_holding_horizon_minutes"] == [30, 240]
          assert set(metrics["state_families"]) == {
              "FIRST_PULLBACK_CONTINUATION",
              "FAILED_LEVEL_REACCEPTANCE",
          }
          assert metrics["same_causal_episode_reentry_allowed"] is False
          assert diagnostics.get("max_open_positions_observed", 0) <= 1
          assert diagnostics.get("max_simultaneous_entry_intents", 0) <= 1
          assert diagnostics.get("global_position_violations", 0) == 0
          assert diagnostics.get("entry_submissions", 0) == diagnostics.get("limit_entry_submissions", 0)
          for key in (
              "v4_completed_15m_decisions",
              "v4_first_pullback_candidates",
              "v4_failed_level_candidates",
              "v4_first_pullback_entries",
              "v4_failed_level_entries",
              "v4_consumed_episode_suppressions",
          ):
              assert key in diagnostics, key
          assert manifest["continuous_account"] is True
          assert manifest["account_restarts"] == 0
          assert manifest["strategy_restarts"] == 0
          assert all(
              record["mode"] == "direct-checksum-verified-binance"
              for record in metrics["input_records"].values()
          )

          headline = {key: metrics.get(key) for key in (
              "evaluation_start", "evaluation_end", "ending_nav", "total_return",
              "geometric_daily_growth", "max_drawdown", "trades", "wins",
              "losses", "win_rate", "profit_factor", "expectancy_usdt",
              "active_days", "gate_pass", "position_counts_by_symbol",
          )}
          print("C39V4_METRICS_JSON=" + json.dumps(headline, sort_keys=True, allow_nan=False))
          print("C39V4_GATE_CHECKS_JSON=" + json.dumps(metrics["gate_checks"], sort_keys=True))
          diagnostic_keys = (
              "complete_universe_minutes", "quarter_hour_decisions",
              "unresolved_episodes", "entry_submissions", "limit_entry_submissions",
              "entry_expirations", "cost_space_rejections",
              "non_passive_entry_rejections", "order_rejections", "emergency_flattens",
              "max_open_positions_observed", "max_simultaneous_entry_intents",
              "global_position_violations", "v4_completed_15m_decisions",
              "v4_warmup_rejections", "v4_clock_mismatch_rejections",
              "v4_no_setup_episodes", "v4_global_ambiguity_rejections",
              "v4_consumed_episode_suppressions", "v4_first_pullback_candidates",
              "v4_failed_level_candidates", "v4_first_pullback_entries",
              "v4_failed_level_entries", "v4_identity_rebindings",
          )
          diagnostic_headline = {key: diagnostics.get(key) for key in diagnostic_keys}
          diagnostic_headline["route_counts"] = diagnostics.get("route_counts", {})
          diagnostic_headline["v4_family_counts"] = diagnostics.get("v4_family_counts", {})
          print("C39V4_DIAGNOSTICS_JSON=" + json.dumps(diagnostic_headline, sort_keys=True))

          events_path = root / "scenario_events.jsonl"
          if events_path.is_file():
              event_types = Counter()
              states = Counter()
              for line in events_path.read_text().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  event_types[str(item.get("event_type", "UNKNOWN"))] += 1
                  details = item.get("details") or {}
                  state = details.get("state") or details.get("scenario_state")
                  if state:
                      states[str(state)] += 1
              print("C39V4_EVENT_TYPES_JSON=" + json.dumps(event_types, sort_keys=True))
              print("C39V4_STATES_JSON=" + json.dumps(states, sort_keys=True))
          PY

      - name: Upload auditable V4 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate39-v4-development-${{ github.sha }}
          path: artifacts/c39-v4-development-2026-07-08_2026-07-14/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
