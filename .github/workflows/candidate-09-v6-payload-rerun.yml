name: Candidate 09 v6 decoded-payload rerun

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v6-payload-rerun.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v6-payload-rerun
  cancel-in-progress: false

jobs:
  reconstruct-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Reconstruct and verify the identical frozen v6 candidate
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09

          echo "1e26e4dd60088319a121aa1dadb8ef1c1d67f9587a2a14210b04623fb85e98ea  $root/state_engine_v5.py" | sha256sum -c -
          echo "8a5a63d0409b4dd187795c08ba02ebcb25dc744c3db1c334400ab0c9ebd74a65  $root/config_v6.json" | sha256sum -c -

          cat "$root/bootstrap/v6-delta.part"{00,01,02,03,04,05,06,07} | tr -d '\r\n\t ' > /tmp/v6-delta.gz.b64
          base64 -d /tmp/v6-delta.gz.b64 | gzip -dc > /tmp/v5-to-v6.patch
          echo "863faeef3e94b4dfcb24d19fe592be2a17811cf17749f8a5f4708ec8e4437a91  /tmp/v5-to-v6.patch" | sha256sum -c -

          cp "$root/state_engine_v5.py" "$root/state_engine.py"
          (cd "$root" && patch -p0 < /tmp/v5-to-v6.patch)
          echo "2a14f8d70e9115a7d2eb09df50263d48034020b45dd1f47ae37029ca43516170  $root/state_engine.py" | sha256sum -c -
          cp "$root/state_engine.py" "$root/state_engine_v6.py"
          cp "$root/config_v6.json" "$root/config.json"

          cat "$root/bootstrap/v6-testsmall.part"{00,01,02,03,04,05} | tr -d '\r\n\t ' > /tmp/v6-tests.gz.b64
          base64 -d /tmp/v6-tests.gz.b64 | gzip -dc > /tmp/test_state_engine_v6.py
          echo "4f4caadf7694ef56740d61af4b11c94b327132cb4fdc99e250644c40559b497e  /tmp/test_state_engine_v6.py" | sha256sum -c -

          mkdir -p "$root/tests_v6" "$root/tests"
          cp /tmp/test_state_engine_v6.py "$root/tests_v6/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path

          root = Path('research/candidate-09')
          source = (root / 'tests_v6/test_state_engine.py').read_text(encoding='utf-8')
          source = source.replace('from state_engine_v6 import', 'from state_engine import')
          source = source.replace(
              'payload = json.loads((Path(__file__).with_name("config_v6.json")).read_text())',
              'payload = json.loads((Path(__file__).resolve().parents[1] / "config.json").read_text())',
          )
          (root / 'tests_v6/test_state_engine.py').write_text(source, encoding='utf-8')
          (root / 'tests/test_state_engine.py').write_text(source, encoding='utf-8')

          run_path = root / 'run.py'
          text = run_path.read_text(encoding='utf-8')
          old = '''ABLATIONS = (\n    "baseline",\n    "no-5m",\n    "with-240m",\n    "midpoint-target",\n)\n'''
          new = '''ABLATIONS = (\n    "baseline",\n    "no-regime",\n    "no-failure-retest",\n    "opposite-edge-target",\n)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('neither v5 nor v6 ablation contract is present')
              text = text.replace(old, new, 1)
          text = text.replace(
              'The structurally frozen v5 baseline and three',
              'The structurally frozen v6 baseline and three',
          )
          run_path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, contracts, and identical frozen-week gate
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v6-payload-rerun"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"

          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate \
              --config "$root/config.json" \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi

          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('research/candidate-09')
          diag = root / 'diagnostics/v6-payload-rerun'
          out = root / 'evidence/latest'
          codes = {key.lower(): int(os.environ[key]) for key in ('DOCTOR', 'COMPILE', 'TESTS', 'GATE')}
          failure = next((name for name, value in codes.items() if value != 0), None)
          (diag / 'diagnostic.json').write_text(json.dumps({
              'candidate_generation': 'v6-regime-aligned-failure-retest',
              'classification': 'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes': codes,
              'first_failure': failure,
              'fixed_weeks_preserved': True,
              'strategy_parameters_preserved': True,
              'parameter_search_performed': False,
              'controlled_change': 'verify decoded patch, final engine, and decoded tests instead of transport-text hash',
              'engine_sha256': '2a14f8d70e9115a7d2eb09df50263d48034020b45dd1f47ae37029ca43516170',
              'config_sha256': '8a5a63d0409b4dd187795c08ba02ebcb25dc744c3db1c334400ab0c9ebd74a65',
              'patch_sha256': '863faeef3e94b4dfcb24d19fe592be2a17811cf17749f8a5f4708ec8e4437a91',
              'test_sha256': '4f4caadf7694ef56740d61af4b11c94b327132cb4fdc99e250644c40559b497e',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
          }, indent=2, sort_keys=True) + '\n')
          if not (out / 'summary.json').exists():
              (out / 'summary.json').write_text(json.dumps({
                  'candidate': 'candidate-09-v6',
                  'status': 'IMPLEMENTATION_ERROR',
                  'first_failure': failure,
                  'codes': codes,
              }, indent=2, sort_keys=True) + '\n')
          for path in diag.glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              path.write_text('\n'.join(lines[-1800:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v6-payload-rerun-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v6-payload-rerun
            research/candidate-09/archive/v5
            research/candidate-09/config.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v6.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
          if-no-files-found: error
          retention-days: 30

      - name: Commit unchanged v6 source and exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v6: decoded-payload result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
