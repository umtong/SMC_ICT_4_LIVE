name: candidate-easychart-v3-impulse-target-screen

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - "research/candidate-easychart/*_v3.py"
      - "research/candidate-easychart/tests/test_*v3.py"
      - ".github/workflows/candidate-easychart-v3.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v3-impulse-target-screen
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  development-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v3-development
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          exec > >(tee "$ROOT/verification.log") 2>&1
          smc4 doctor
          python -m compileall -q research/candidate-easychart
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v

      - name: Run entry-time impulse-target matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          exec > >(tee "$ROOT/screen.log") 2>&1
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -n 120 "$ROOT/screen.log" > "$ROOT/failure-tail.log"; message=$(tail -n 1 "$ROOT/screen.log" | sed "s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g"); echo "::error title=candidate-easychart v3 failed::$message"; fi; exit "$status"' EXIT
          common=(
            --start 2024-02-01
            --end 2024-02-28
            --warmup-days 35
            --context-minutes 240
            --cache "$CACHE"
          )
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --require-htf-alignment --cost-profile role --output "$ROOT/sweep-ob-4h-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --break-ob --require-htf-alignment --cost-profile role --output "$ROOT/break-ob-4h-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --break-ob --require-htf-alignment --cost-profile role --output "$ROOT/both-ob-4h-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --cost-profile role --output "$ROOT/sweep-ob-nohtf-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --break-ob --cost-profile role --output "$ROOT/break-ob-nohtf-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --direct-break --require-htf-alignment --cost-profile role --output "$ROOT/direct-break-4h-role"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --direct-sweep --require-htf-alignment --cost-profile role --output "$ROOT/direct-sweep-4h-role"
          # Source-mentioned stronger engulfing body.
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --require-htf-alignment --min-body-ratio 2.0 --cost-profile role --output "$ROOT/sweep-ob-ratio2-4h-role"
          # Mechanism-based quality control: reject doji-denominator and exhaustive impulse bodies.
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --require-htf-alignment --min-previous-body-atr 0.10 --max-current-body-atr 1.50 --cost-profile role --output "$ROOT/sweep-ob-normalized-4h-role"
          # Execution-cost sensitivity; no alpha rule changes.
          python research/candidate-easychart/screen_v3.py "${common[@]}" --sweep-ob --require-htf-alignment --cost-profile taker --output "$ROOT/sweep-ob-4h-taker"
          python research/candidate-easychart/screen_v3.py "${common[@]}" --break-ob --require-htf-alignment --cost-profile taker --output "$ROOT/break-ob-4h-taker"
          variants=(
            sweep-ob-4h-role break-ob-4h-role both-ob-4h-role
            sweep-ob-nohtf-role break-ob-nohtf-role
            direct-break-4h-role direct-sweep-4h-role
            sweep-ob-ratio2-4h-role sweep-ob-normalized-4h-role
            sweep-ob-4h-taker break-ob-4h-taker
          )
          python research/candidate-easychart/compare_v3.py --root "$ROOT" --variants "${variants[@]}"

      - name: Verify evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/comparison.json" >/dev/null
          variants=(
            sweep-ob-4h-role break-ob-4h-role both-ob-4h-role
            sweep-ob-nohtf-role break-ob-nohtf-role
            direct-break-4h-role direct-sweep-4h-role
            sweep-ob-ratio2-4h-role sweep-ob-normalized-4h-role
            sweep-ob-4h-taker break-ob-4h-taker
          )
          for variant in "${variants[@]}"; do
            test -s "$ROOT/$variant/metrics.json"
            test -s "$ROOT/$variant/run.json"
            test -e "$ROOT/$variant/setups.csv"
            test -e "$ROOT/$variant/trades.csv"
            test -e "$ROOT/$variant/equity.csv"
            test -e "$ROOT/$variant/scenario_events.jsonl"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v3-development-${{ github.sha }}
          path: artifacts/candidate-easychart-v3-development/**
          if-no-files-found: warn
          retention-days: 90
