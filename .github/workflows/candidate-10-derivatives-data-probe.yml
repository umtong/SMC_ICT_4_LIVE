name: candidate-10-derivatives-data-probe

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - tools/candidate10_derivatives_data_probe.py
      - .github/workflows/candidate-10-derivatives-data-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-10-derivatives-data-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe official derivatives archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-10-derivatives-data-probe
          chmod -R a+rwx artifacts
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              smc4 doctor
              python tools/candidate10_derivatives_data_probe.py
            '

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-derivatives-data-probe-${{ github.sha }}
          path: artifacts/candidate-10-derivatives-data-probe
          if-no-files-found: warn
          retention-days: 14
