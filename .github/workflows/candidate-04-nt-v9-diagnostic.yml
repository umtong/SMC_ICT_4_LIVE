name: candidate-04-nt-v9-diagnostic

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-nt-v9-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4

      - name: Verify NautilusTrader runtime and diagnostic-only annotations
        run: |
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/nt_liquidity_strategy.py \
            research/candidate-04/nt_auction_excess_strategy.py \
            research/candidate-04/nt_auction_failure_strategy.py \
            research/candidate-04/nt_backtest.py \
            research/candidate-04/nt_backtest_v9_diagnostic.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_liquidity_strategy.py' -v

      - name: Replay the unchanged first random BTC week in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/candidate-04-nt-v9-diagnostic/week1"
          mkdir -p "$out"
          python research/candidate-04/nt_backtest_v9_diagnostic.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start 2023-10-01 \
            --build-end 2023-10-09 \
            --evaluation-start 2023-10-03 \
            --evaluation-end 2023-10-09 \
            --cache .cache/candidate-04-nt-v9-diagnostic/raw \
            --output "$out" \
            | tee "$out/console.json"
          test -s "$out/metrics.json"
          test -s "$out/run.json"
          test -s "$out/orders.csv"
          test -s "$out/positions.csv"
          test -s "$out/strategy_events.json"

      - name: Print unchanged result
        if: always()
        run: |
          path="artifacts/candidate-04-nt-v9-diagnostic/week1/metrics.json"
          if test -f "$path"; then
            python -m json.tool "$path"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-nt-v9-diagnostic-${{ github.sha }}
          path: artifacts/candidate-04-nt-v9-diagnostic/week1
          if-no-files-found: warn
          retention-days: 90
