name: Candidate 15 V10 atomic source materialization

on:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/v10patch.tar.xz"
      - ".github/workflows/candidate-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-15-v10-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and atomically materialize V10 source
        shell: bash
        run: |
          set -euo pipefail
          payload="research/candidate-15/v10patch.tar.xz"
          test -s "$payload"
          echo "f7e0d3b5c05532d4f8b9f8a49facdfcbe561ffd0028c7d954898696f1031f8b7  $payload" | sha256sum -c -
          tar -xJf "$payload"
          git checkout -- .github/workflows/candidate-15.yml
          rm -f "$payload"
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/research/candidate-14:$GITHUB_WORKSPACE/src"
          python -m py_compile \
            research/candidate-15/positive_cost_cover.py \
            research/candidate-15/candidate15_v10_cost_cover_materializer.py \
            research/candidate-15/aggregate_v10.py \
            research/candidate-15/run_leadership_scdam.py
          python -m unittest discover -s research/candidate-15 -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/candidate-15/protocol.json').read_text())
          assert p['schema'] == 'candidate-15-beta-coherent-diffusion-lag-v10'
          assert p['execution_lock']['cost_cover_entry_reference'] == 'NAUTILUS_POSITION_AVG_PX_OPEN'
          assert p['execution_lock']['stop_market_adverse_slippage_ticks'] == 2
          assert p['execution_lock']['minimum_cost_cover_net_ticks'] == 1
          runner = Path('research/candidate-15/run_leadership_scdam.py').read_text()
          assert runner.count('materialize_execution_valid_cost_cover_source(_SOURCE)') == 1
          assert runner.count('from positive_cost_cover import positive_cost_cover_trigger') == 1
          PY
          git config user.name candidate-15-research
          git config user.email candidate-15-research@users.noreply.github.com
          git add -A
          git commit -m "candidate-15: make V10 cost protection execution-valid"
          git fetch origin research/candidate-15
          test "$(git rev-parse origin/research/candidate-15)" = "$GITHUB_SHA"
          git push origin HEAD:research/candidate-15
