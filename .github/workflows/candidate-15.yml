name: Candidate 15 V8 managed residual transfer development

on:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/**"
      - ".github/workflows/candidate-15.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v8-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify frozen environment and V8 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('research/candidate-15/protocol.json').read_text())['base_candidate']['commit'])
          PY
          )"
          git fetch --no-tags origin "$base_commit"
          test "$(git rev-parse "${base_commit}:research/candidate-14")" = "$(git rev-parse "HEAD:research/candidate-14")"
          test "$(git hash-object research/candidate-15/quarter_hour_persistent_initiative.py)" = dcd2cdfe0426b6c68ffba68ad750de7097cab8f6
          test "$(git hash-object research/candidate-15/response_qualified_persistent_initiative.py)" = 19a30eb9a1d12a72ad1106436926f7fe504412f2
          test "$(git hash-object research/candidate-15/candidate15_v6_residual_laggard_materializer.py)" = 15909568d688650d07b14384578d2b8439ac7d0d
          test "$(git hash-object research/candidate-15/bounded_transfer_initiative.py)" = 6dcee0bb0a03ef5214886dc1fa463cf9c8ec891a
          test "$(git hash-object research/candidate-15/candidate15_v7_bounded_transfer_materializer.py)" = 5faf746eb815e4c0f9d96e2e1eff77a1c31b65a0
          test "$(git hash-object research/candidate-15/managed_transfer_initiative.py)" = 7e3e915cfb297264e2d57ff67cadea12b1eb85bf
          test "$(git hash-object research/candidate-15/candidate15_v8_managed_transfer_materializer.py)" = 6f5f8bf561e31f22a54a4994e1bd1b58323fe7a2
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/research/candidate-14:$GITHUB_WORKSPACE/src"
          python -m py_compile research/candidate-15/*.py
          python -m unittest discover -s research/candidate-15 -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/candidate-15/protocol.json').read_text())
          assert p['schema']=='candidate-15-managed-residual-information-transfer-v8'
          assert set(p['selection']['intervals'])=={'E01','E02','E03','E04','E05','E06'}
          assert p['execution_lock']['risk_fraction']==0.03
          assert p['execution_lock']['global_pending_entry_plus_position_limit']==1
          assert set(p['router']['transfer_stages'])=={'PARTIAL_CATCH_UP','PARITY_HANDOFF_RETEST'}
          assert p['router']['management_preserves_external_target'] is True
          import run_leadership_scdam
          s=run_leadership_scdam._SOURCE
          for token,n in {
            'ManagedTransferPersistentQuarterHourRouter(':1,
            'ManagedResidualTransferContinuationEngine(':1,
            'C15_V8_CORE_FAMILY_QUARANTINED':3,
            'C15_V8_NOT_RESIDUAL_RECEIVER':3,
            'TRANSFER_STOP_MODIFICATION_SUBMITTED':1,
            'PROTECTIVE_ORDER_DENIED_FAIL_CLOSED':1,
            'PROTECTIVE_ORDER_REJECTED_FAIL_CLOSED':1,
          }.items(): assert s.count(token)==n,(token,s.count(token))
          PY

  evaluate:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        interval: [E01, E02, E03, E04, E05, E06]
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run ${{ matrix.interval }} through NautilusTrader
        shell: bash
        run: bash research/candidate-15/run_week.sh "${{ matrix.interval }}"
      - name: Diagnose passive-parent first passage
        shell: bash
        run: python research/candidate-15/analyze_pending_invalidation.py "research/candidate-15/results/${{ matrix.interval }}"
      - name: Diagnose prior-only beta transfer geometry
        shell: bash
        run: python research/candidate-15/analyze_beta_transfer.py "research/candidate-15/results/${{ matrix.interval }}"
      - name: Remove downloaded archives
        if: always()
        shell: bash
        run: rm -rf "research/candidate-15/results/${{ matrix.interval }}/data"
      - name: Upload interval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v8-${{ matrix.interval }}
          path: research/candidate-15/results/${{ matrix.interval }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ always() && needs.static.result == 'success' && needs.evaluate.result == 'success' }}
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate15-v8-*
          path: artifacts
      - name: Aggregate and persist V8 evidence
        shell: bash
        run: |
          set -euo pipefail
          intervals=(E01 E02 E03 E04 E05 E06)
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          rm -rf research/candidate-15/results
          for interval in "${intervals[@]}"; do
            mkdir -p "research/candidate-15/results/$interval"
            cp -a "artifacts/candidate15-v8-$interval/." "research/candidate-15/results/$interval/"
            for file in run.json data_manifest.json metrics.json summary.json effective_config.json submitted_plans.json order_lifecycle.json orders.csv positions.csv account.csv; do
              test -s "research/candidate-15/results/$interval/$file"
            done
          done
          python research/candidate-15/aggregate_v8.py
          [[ "$(git ls-remote origin refs/heads/research/candidate-15 | cut -f1)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-bot
          git config user.email candidate-15-bot@users.noreply.github.com
          git add research/candidate-15/aggregate.json research/candidate-15/RESULT.md
          for interval in "${intervals[@]}"; do
            git add "research/candidate-15/results/$interval/"{run.json,data_manifest.json,metrics.json,summary.json,effective_config.json,submitted_plans.json,order_lifecycle.json,orders.csv,positions.csv,account.csv}
          done
          if ! git diff --cached --quiet; then
            git commit -m "candidate-15: record V8 development evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: candidate15-v8-aggregate-${{ github.run_id }}
          path: |
            research/candidate-15/aggregate.json
            research/candidate-15/RESULT.md
          if-no-files-found: warn
          retention-days: 30
