name: Candidate 15 V11 atomic family integration materialization

on:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/v11patch.tar.xz"
      - ".github/workflows/candidate-15.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v11-materialize
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  C13: d5da29f4625340ad8f5652630f3dcb8ec3477add

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize source-locked V11
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          payload="research/candidate-15/v11patch.tar.xz"
          echo "cd1703864b9094c757b5329947502e69bc066db228bb12cf9e2780365abc79e1  $payload" | sha256sum -c -
          tar -xJf "$payload"
          git checkout -- .github/workflows/candidate-15.yml
          rm -f "$payload"
          git fetch --no-tags origin "$C13"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fetch_locked() {
            local src="$1" expected="$2" dst="$3"
            git show "$C13:research/candidate-13/$src" > "$tmp/$src"
            test "$(git hash-object "$tmp/$src")" = "$expected"
            cp "$tmp/$src" "$dst"
          }
          CAND=research/candidate-15
          fetch_locked semantic_market_leadership.py 3c04fa19684897647248cff720a038787dfdfeba "$CAND/c13_semantic_market_leadership_v3.py"
          fetch_locked semantic_market_leadership_v4.py 946d84dee4298839efff4ccd10e97b57ead9325b "$CAND/c13_semantic_market_leadership_v4.py"
          fetch_locked semantic_market_leadership_v16.py 41342d2bbef94ca2a47799a6d20688b87ee49788 "$CAND/c13_semantic_market_leadership_v16.py"
          fetch_locked semantic_logic_v15.py b260b44533d1475bb69a0af012e08b558e04db4f "$CAND/c13_semantic_logic_v15.py"
          sed -i 's/from semantic_market_leadership import (/from c13_semantic_market_leadership_v3 import (/' "$CAND/c13_semantic_market_leadership_v4.py"
          sed -i 's/from semantic_market_leadership import FAR_ROTATION_DISPLACEMENT/from c13_semantic_market_leadership_v3 import FAR_ROTATION_DISPLACEMENT/' "$CAND/c13_semantic_market_leadership_v16.py"
          sed -i 's/from semantic_market_leadership_v4 import (/from c13_semantic_market_leadership_v4 import (/' "$CAND/c13_semantic_market_leadership_v16.py"
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/research/candidate-14:$GITHUB_WORKSPACE/src"
          smc4 doctor
          python -m py_compile \
            "$CAND/c13_semantic_market_leadership_v3.py" \
            "$CAND/c13_semantic_market_leadership_v4.py" \
            "$CAND/c13_semantic_market_leadership_v16.py" \
            "$CAND/c13_semantic_logic_v15.py" \
            "$CAND/candidate15_v11_completed_auction_materializer.py" \
            "$CAND/run_leadership_scdam_v11.py" \
            "$CAND/candidate15_v11_runner.py" \
            "$CAND/aggregate_v11.py"
          python -m unittest discover -s "$CAND" -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/candidate-15/protocol-v11.json').read_text())
          assert p['schema']=='candidate-15-v11-beta-plus-completed-source-auction-router-v1'
          assert p['router']['candidate13_freeze_commit']=='d5da29f4625340ad8f5652630f3dcb8ec3477add'
          assert p['router']['candidate13_missed_retrace_rearm'] is False
          import run_leadership_scdam_v11 as r
          s=r._SOURCE
          for token,n in {
            'completed_source_auction_family(plan)':1,
            'BetaCoherentTransferPersistentQuarterHourRouter(':1,
            'positive_cost_cover_trigger(':1,
            'C15_V11_UNRESOLVED_CORE_FAMILY':3,
          }.items(): assert s.count(token)==n,(token,s.count(token))
          for token in ('REARM_AFTER_MISSED_RETRACE','rearmed_parent','V17_REARM'):
            assert token not in s
          PY
          git config user.name candidate-15-research
          git config user.email candidate-15-research@users.noreply.github.com
          git add -A
          git commit -m "candidate-15: integrate V11 completed-source auction families"
          git fetch origin research/candidate-15
          test "$(git rev-parse origin/research/candidate-15)" = "$GITHUB_SHA"
          git push origin HEAD:research/candidate-15
