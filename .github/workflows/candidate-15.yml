name: Candidate 15 V11 beta plus completed-source auction integration

on:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/**"
      - ".github/workflows/candidate-15.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v11-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify frozen environment and V11 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base_commit="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('research/candidate-15/protocol-v11.json').read_text())['base_candidate']['commit'])
          PY
          )"
          git fetch --no-tags origin "$base_commit"
          test "$(git rev-parse "${base_commit}:research/candidate-14")" = "$(git rev-parse "HEAD:research/candidate-14")"
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/research/candidate-14:$GITHUB_WORKSPACE/src"
          python -m py_compile research/candidate-15/*.py
          python -m unittest discover -s research/candidate-15 -p 'test_*.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/candidate-15/protocol-v11.json').read_text())
          assert p['schema']=='candidate-15-v11-beta-plus-completed-source-auction-router-v1'
          assert set(p['selection']['intervals'])=={'E01','E02','E03','E04','E05','E06'}
          assert p['execution_lock']['risk_fraction']==0.03
          assert p['execution_lock']['global_pending_entry_plus_position_limit']==1
          assert p['router']['candidate13_freeze_commit']=='d5da29f4625340ad8f5652630f3dcb8ec3477add'
          assert p['router']['candidate13_missed_retrace_rearm'] is False
          assert set(p['router']['families'])=={
            'BETA_COHERENT_DIFFUSION_LAG',
            'COMPLETED_SOURCE_FAILED_AUCTION',
            'COMPLETED_SOURCE_ACCEPTED_AUCTION',
            'UNRESOLVED_NO_TRADE',
          }
          import run_leadership_scdam_v11 as r
          s=r._SOURCE
          for token,n in {
            'completed_source_auction_family(plan)':1,
            'BetaCoherentTransferPersistentQuarterHourRouter(':1,
            'positive_cost_cover_trigger(':1,
            'C15_V11_UNRESOLVED_CORE_FAMILY':3,
          }.items(): assert s.count(token)==n,(token,s.count(token))
          for token in ('REARM_AFTER_MISSED_RETRACE','rearmed_parent','V17_REARM'):
            assert token not in s
          PY

  evaluate:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        interval: [E01, E02, E03, E04, E05, E06]
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run ${{ matrix.interval }} through NautilusTrader
        shell: bash
        run: bash research/candidate-15/run_v11_interval.sh "${{ matrix.interval }}"
      - name: Diagnose passive-parent first passage
        shell: bash
        run: python research/candidate-15/analyze_pending_invalidation.py "research/candidate-15/results/${{ matrix.interval }}"
      - name: Remove downloaded archives
        if: always()
        shell: bash
        run: rm -rf "research/candidate-15/results/${{ matrix.interval }}/data"
      - name: Upload interval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v11-${{ matrix.interval }}
          path: research/candidate-15/results/${{ matrix.interval }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ always() && needs.static.result == 'success' && needs.evaluate.result == 'success' }}
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate15-v11-E*
          path: artifacts
      - name: Aggregate and persist V11 evidence
        shell: bash
        run: |
          set -euo pipefail
          intervals=(E01 E02 E03 E04 E05 E06)
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          rm -rf research/candidate-15/results
          for interval in "${intervals[@]}"; do
            mkdir -p "research/candidate-15/results/$interval"
            cp -a "artifacts/candidate15-v11-$interval/." "research/candidate-15/results/$interval/"
            for file in run.json data_manifest.json metrics.json summary.json effective_config.json submitted_plans.json order_lifecycle.json orders.csv positions.csv account.csv scenario_events.jsonl scenario_events.raw.jsonl; do
              test -s "research/candidate-15/results/$interval/$file"
            done
          done
          python research/candidate-15/aggregate_v11.py
          [[ "$(git ls-remote origin refs/heads/research/candidate-15 | cut -f1)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-bot
          git config user.email candidate-15-bot@users.noreply.github.com
          git add research/candidate-15/aggregate.json research/candidate-15/RESULT.md
          for interval in "${intervals[@]}"; do
            git add "research/candidate-15/results/$interval/"{run.json,data_manifest.json,metrics.json,summary.json,effective_config.json,submitted_plans.json,order_lifecycle.json,orders.csv,positions.csv,account.csv,pending_path_diagnostics.json}
          done
          if ! git diff --cached --quiet; then
            git commit -m "candidate-15: record V11 integration evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: candidate15-v11-aggregate-${{ github.run_id }}
          path: |
            research/candidate-15/aggregate.json
            research/candidate-15/RESULT.md
          if-no-files-found: warn
          retention-days: 30
