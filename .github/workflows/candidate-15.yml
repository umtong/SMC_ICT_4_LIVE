name: Candidate 15 V9 atomic source materialization

on:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/v9patch.tar.xz"
      - ".github/workflows/candidate-15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-15-v9-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and atomically materialize V9 source
        shell: bash
        run: |
          set -euo pipefail
          payload="research/candidate-15/v9patch.tar.xz"
          test -s "$payload"
          echo "6c268c0f2fc20dd5781b8b405a5fe5b98e633931dd14bb9e9f327b8623b697e2  $payload" | sha256sum -c -
          tar -xJf "$payload"
          git checkout -- .github/workflows/candidate-15.yml
          rm -f "$payload"
          python -m py_compile \
            research/candidate-15/beta_coherent_transfer.py \
            research/candidate-15/candidate15_v9_beta_transfer_materializer.py \
            research/candidate-15/aggregate_v9.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/candidate-15/protocol.json').read_text())
          assert p['schema'] == 'candidate-15-beta-coherent-diffusion-lag-v9'
          assert set(p['selection']['intervals']) == {'E01','E02','E03','E04','E05','E06'}
          PY
          git config user.name candidate-15-research
          git config user.email candidate-15-research@users.noreply.github.com
          git add -A
          git commit -m "candidate-15: implement V9 beta-coherent diffusion lag"
          git fetch origin research/candidate-15
          test "$(git rev-parse origin/research/candidate-15)" = "$GITHUB_SHA"
          git push origin HEAD:research/candidate-15
