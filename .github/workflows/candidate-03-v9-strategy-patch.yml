name: candidate-03-v9-strategy-patch

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/apply_nt_lvcfr_v9_strategy_patch.py"
      - "research/candidate-03/test_nt_lvcfr_v9.py"
      - "research/candidate-03/nt_lvcfr_v9_config.json"
      - ".github/workflows/candidate-03-v9-strategy-patch.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-03
          fetch-depth: 0

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply one-variable completed-structure protection patch
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-03/apply_nt_lvcfr_v9_strategy_patch.py

      - name: Verify patched strategy in pinned NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_trade_proxy.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v4.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v5.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v6.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v7.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v8.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v9.py &&
              PYTHONPYCACHEPREFIX=/tmp/candidate03-v9-strategy \
                python -m py_compile \
                  research/candidate-03/nt_lvcfr_strategy.py \
                  research/candidate-03/apply_nt_lvcfr_v9_strategy_patch.py
            '

      - name: Commit patched native strategy
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- research/candidate-03/nt_lvcfr_strategy.py; then
            echo "strategy already patched"
            exit 0
          fi
          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add research/candidate-03/nt_lvcfr_strategy.py
          git commit -m "candidate-03: protect V9 positions behind completed structure"
          git push origin HEAD:research/candidate-03
