name: Candidate 06 Failed-Acceptance Trap Resiliency

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-fatr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-06-failed-acceptance-trap-resiliency
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fatr-campaign:
    # Disabled after trade-level decomposition proved a filter-only candidate
    # can reach at most seven trades and two wins versus fixed gates of ten
    # trades and five wins. See FATR_TERMINAL_REPORT.md.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "FATR discarded before campaign because its opportunity-set upper bound cannot pass the frozen gate."
