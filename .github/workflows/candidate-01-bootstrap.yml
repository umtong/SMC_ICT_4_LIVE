name: candidate-01-bootstrap

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".candidate01-bootstrap/**"
      - ".github/workflows/candidate-01-bootstrap.yml"

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout staged payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate pinned research image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize candidate payload
        run: |
          set -euo pipefail
          cat .candidate01-bootstrap/chunk-* | base64 --decode > /tmp/candidate-01.tgz
          tar -xzf /tmp/candidate-01.tgz
          test -f research/candidate-01/core.py
          test -f research/candidate-01/run_research.py
          test -f tests/test_candidate_01.py

      - name: Commit implementation locally before evaluation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/candidate-01 tests/test_candidate_01.py
          git commit -m "research(candidate-01): implement causal liquidity auction"

      - name: Verify pinned runtime and causal invariants
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q src research/candidate-01 tests
              python -m unittest discover -s tests -p "test_candidate_01.py" -v
              python research/candidate-01/seed_protocol.py
            '

      - name: Run first frozen discovery week
        id: discovery
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              set -o pipefail
              mkdir -p artifacts/candidate-01
              python research/candidate-01/run_research.py \
                --suite discovery \
                --output artifacts/candidate-01/discovery \
                2>&1 | tee artifacts/candidate-01/discovery.log
            '

      - name: Record immutable discovery result
        if: always()
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          metrics_path = Path("artifacts/candidate-01/discovery/aggregate_metrics.json")
          implementation_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if metrics_path.exists():
              payload = json.loads(metrics_path.read_text(encoding="utf-8"))
              segment = payload["segments"][0]
              provisional = bool(
                  segment["target_met"]
                  and int(segment["closed_positions"]) >= 5
                  and float(segment["max_drawdown"]) > -0.20
                  and bool(segment["ended_flat"])
                  and int(segment["one_global_entry_gate_violations"]) == 0
                  and int(segment.get("protective_order_failures", 0)) == 0
                  and int(segment.get("liquidation_marker_rows", 0)) == 0
              )
              status = "PASS" if provisional else "FAIL"
              lines = [
                  "# Recorded results",
                  "",
                  f"## Discovery week — {status}",
                  "",
                  f"- implementation commit: `{implementation_sha}`",
                  f"- workflow: {os.environ['WORKFLOW_URL']}",
                  f"- frozen interval: `{segment['evaluation_start_utc']}` to `{segment['evaluation_end_utc']}`",
                  f"- cost-after geometric mean daily NAV growth: `{segment['geometric_mean_daily_return']:.8%}`",
                  f"- total return: `{segment['total_return']:.8%}`",
                  f"- maximum drawdown: `{segment['max_drawdown']:.8%}`",
                  f"- submitted / closed positions: `{segment['submissions']}` / `{segment['closed_positions']}`",
                  f"- ended flat: `{segment['ended_flat']}`",
                  f"- global-entry-gate violations: `{segment['one_global_entry_gate_violations']}`",
                  f"- protective-order failures: `{segment.get('protective_order_failures', 0)}`",
                  f"- liquidation markers: `{segment.get('liquidation_marker_rows', 0)}`",
                  "",
                  "The discovery-week verdict requires at least 1% cost-after geometric daily growth, at least five closed positions, drawdown under 20%, and all execution invariants above. This is **not** the project completion verdict. Confirmation weeks remain unopened unless this discovery gate passes; the full fixed 2024 evaluation and `candidate_success` gate remain mandatory.",
              ]
          else:
              log_path = Path("artifacts/candidate-01/discovery.log")
              log_tail = ""
              if log_path.exists():
                  log_tail = "\n".join(
                      log_path.read_text(encoding="utf-8", errors="replace").splitlines()[-40:]
                  )
              lines = [
                  "# Recorded results",
                  "",
                  "## Discovery week — RUNTIME FAILURE",
                  "",
                  f"- implementation commit: `{implementation_sha}`",
                  f"- workflow: {os.environ['WORKFLOW_URL']}",
                  "",
                  "The pinned NautilusTrader discovery run did not produce `aggregate_metrics.json`. No performance claim is made. The final log tail is preserved below and in the workflow artifact.",
                  "",
                  "```text",
                  log_tail,
                  "```",
              ]
          Path("research/candidate-01/RESULTS.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          git add -- research/candidate-01/RESULTS.md
          if ! git diff --cached --quiet; then
            git commit -m "research(candidate-01): record frozen discovery evidence"
          fi

      - name: Publish candidate branch commits
        if: always()
        run: git push origin HEAD:research/candidate-01

      - name: Preserve discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-01-bootstrap-discovery-${{ github.sha }}
          path: artifacts/candidate-01
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce discovery progression gate
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/candidate-01/discovery/aggregate_metrics.json")
          if not path.exists():
              raise SystemExit("candidate-01 discovery runtime failed")
          payload = json.loads(path.read_text(encoding="utf-8"))
          segment = payload["segments"][0]
          checks = {
              "target_met": bool(segment["target_met"]),
              "at_least_five_closed_positions": int(segment["closed_positions"]) >= 5,
              "drawdown_below_twenty_percent": float(segment["max_drawdown"]) > -0.20,
              "ended_flat": bool(segment["ended_flat"]),
              "global_gate_preserved": int(segment["one_global_entry_gate_violations"]) == 0,
              "no_protective_failures": int(segment.get("protective_order_failures", 0)) == 0,
              "no_liquidation_markers": int(segment.get("liquidation_marker_rows", 0)) == 0,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("discovery gate failed: " + ", ".join(failed))
          PY
