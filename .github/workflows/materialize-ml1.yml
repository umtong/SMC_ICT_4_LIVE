name: materialize-ml1

on:
  push:
    branches:
      - research_ML1
    paths:
      - .github/ml1-bootstrap/**
      - .github/workflows/materialize-ml1.yml

permissions:
  contents: write

concurrency:
  group: materialize-ml1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the ML1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ml1-bootstrap/part* > /tmp/ml1_bundle.tar.gz.b64
          printf '%s  %s\n' \
            'd4c46e0969112a415333937e31129f5d559401cba3a3b73c9745f8f9f1825594' \
            '/tmp/ml1_bundle.tar.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/ml1_bundle.tar.gz.b64 > /tmp/ml1_bundle.tar.gz
          printf '%s  %s\n' \
            '06537373c06f5b5df031cc77b73316fc77c62519338418e46b1eede40a0c2138' \
            '/tmp/ml1_bundle.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/ml1_bundle.tar.gz -C .
          test -f research/candidate-easychart_ml1/run_mtf_backtest_ml1.py
          test -f research/candidate-easychart_ml1/models/bootstrap_shadow.json
          python -m py_compile research/candidate-easychart_ml1/*.py \
            research/candidate-easychart_ml1/tests/*.py

      - name: Commit the materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ml1-bootstrap
          rm -f .github/workflows/materialize-ml1.yml
          git config user.name 'OpenAI Research Automation'
          git config user.email 'research-automation@users.noreply.github.com'
          git add -A
          git commit -m 'research: add causal ML1 meta-selector'
          git push origin "HEAD:${GITHUB_REF_NAME}"
