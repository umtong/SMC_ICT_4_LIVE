name: candidate-57-winner-source-fidelity-v2

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-winner-source-fidelity-v1.yml"
      - "research/candidate-57/winner_source_fidelity_router.py"
      - "research/candidate-57/winner_source_fidelity_strategy.py"
      - "research/candidate-57/winner_source_fidelity_campaign.py"
      - "research/candidate-57/forensic_sources/winner_strategy_external_v17.py"
      - "research/candidate-51/router_external_v17.py"
      - "research/candidate-51/run.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-winner-source-fidelity-v2
  cancel-in-progress: true

jobs:
  anatomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble source-fidelity adapter over reused Nautilus shell
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_external_v17.py research/candidate-51/router_transition.py
          cp research/candidate-57/forensic_sources/winner_strategy_external_v17.py research/candidate-51/strategy_transition.py
          cp research/candidate-57/winner_source_fidelity_router.py research/candidate-51/router.py
          cp research/candidate-57/winner_source_fidelity_strategy.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/router.py \
            research/candidate-51/router_transition.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_transition.py \
            research/candidate-57/winner_source_fidelity_campaign.py

      - name: Install locked environment and verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from router import RouteConfig, _classify_winner_source_true
          from strategy import Candidate35Config, Candidate35Strategy
          assert RouteConfig().winner_bucket_minutes == 15
          assert Candidate35Config.__name__ == "Candidate35Config"
          assert Candidate35Strategy.__name__ == "Candidate35Strategy"
          assert callable(_classify_winner_source_true)
          print("source-fidelity imports and contracts verified")
          PY

      - name: Run source-fidelity anatomy with warmup and runoff
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-winner-source-fidelity-v2-console
          set -o pipefail
          PYTHONPATH=research/candidate-51 \
            uv run python research/candidate-57/winner_source_fidelity_campaign.py \
            2>&1 | tee .work/candidate-57-winner-source-fidelity-v2-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact anatomy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_transition.py research/candidate-51/strategy_transition.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          if [[ -d research/candidate-57/evidence/winner-source-fidelity-v1 ]]; then
            git add -f research/candidate-57/evidence/winner-source-fidelity-v1
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist source-fidelity Winner15m anatomy v2"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload source-fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-winner-source-fidelity-v2-evidence
          path: |
            research/candidate-57/evidence/winner-source-fidelity-v1
            .work/candidate-57-winner-source-fidelity-v2-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce anatomy process integrity
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" ]]; then
            echo "campaign status missing"
            exit 1
          fi
          if [[ "$status" != "0" ]]; then
            echo "source-fidelity campaign failed with status $status; evidence/log retained"
            exit "$status"
          fi
