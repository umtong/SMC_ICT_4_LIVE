name: candidate-02-v78-terminal-router

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v78-terminal-router.yml"
      - "research/candidate-02/v78_first_week_decision.json"
      - "research/candidate-02/v78_week2_decision.json"
      - "research/candidate-02/v78_week3_decision.json"
      - "research/candidate-02/v78_long_lock.json"

permissions:
  contents: write

concurrency:
  group: candidate-02-v78-terminal-router
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Wait for a real terminal transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,time
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('research/candidate-02'); terminal=None; snapshots={}
          def read(name):
              p=root/name
              if not p.exists():return None
              try:return json.loads(p.read_text())
              except Exception as exc:return {'status':'MALFORMED_DECISION_FILE','error':repr(exc)}
          for _ in range(48):
              subprocess.run(['git','fetch','origin','research/candidate-02'],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(['git','reset','--hard','origin/research/candidate-02'],check=True,stdout=subprocess.DEVNULL)
              first=read('v78_first_week_decision.json'); second=read('v78_week2_decision.json'); third=read('v78_week3_decision.json'); long_lock=read('v78_long_lock.json')
              snapshots={'first_week':first,'second_week':second,'third_week':third,'long_lock':long_lock}
              if long_lock and str(long_lock.get('status','')).startswith('LOCKED_BEFORE_LONG'):
                  terminal='THREE_RANDOM_BTC_WEEKS_PASSED_LONG_EVALUATION_LOCKED'
              elif third and str(third.get('status','')).startswith(('REJECTED','IMPLEMENTATION_ERROR')):terminal=str(third['status'])
              elif second and str(second.get('status','')).startswith(('REJECTED','IMPLEMENTATION_ERROR')):terminal=str(second['status'])
              elif first and str(first.get('status','')).startswith(('REJECTED','IMPLEMENTATION_ERROR')):terminal=str(first['status'])
              if terminal:break
              time.sleep(15)
          if terminal is None:terminal='NON_TERMINAL_PIPELINE_TIMEOUT_DO_NOT_CLASSIFY_AS_STRATEGY_FAILURE'
          out={'candidate_family':'candidate-02-v78-quarter-hour-impact-resilience','status':terminal,'recorded_utc':datetime.now(timezone.utc).isoformat(),'performance_engine':'NautilusTrader 1.230.0','custom_backtest_engine':False,'risk_fraction':0.03,'snapshots':snapshots}
          (root/'v78_terminal_status.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit state when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add research/candidate-02/v78_terminal_status.json; if git diff --cached --quiet; then exit 0; fi; git commit -m "research(candidate-02): record v78 terminal state"; git pull --rebase origin research/candidate-02; git push origin HEAD:research/candidate-02
