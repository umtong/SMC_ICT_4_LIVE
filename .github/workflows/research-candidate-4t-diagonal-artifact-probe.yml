name: research-candidate-4t-diagonal-artifact-probe

on:
  push:
    branches: [research_candidate_4t]
    paths:
      - '.github/workflows/research-candidate-4t-diagonal-artifact-probe.yml'
      - 'research/candidate-4t-diagonal-integration/inspect_artifacts.py'
      - '.dispatch-candidate-4t-diagonal-artifact-probe'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: research-candidate-4t-diagonal-artifact-probe
  cancel-in-progress: false

jobs:
  reuse-existing-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3'
      - name: Dispatch the existing diagonal/channel auction research
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/candidate-diagonal-channel-auction-v1.yml/dispatches" \
            -d '{"ref":"research_candidate_4t"}')
          if [[ "$status" != 204 ]]; then
            cat "$response"
            exit 1
          fi
          echo "started=$started" >> "$GITHUB_OUTPUT"
      - name: Wait for the dispatched run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/candidate-diagonal-channel-auction-v1.yml/runs?branch=research_candidate_4t&event=workflow_dispatch&per_page=20"
          run_id=""
          for attempt in $(seq 1 220); do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api")
            run_id=$(printf '%s' "$payload" | jq -r --argjson started "$STARTED" '
              [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $started)][0].id // empty')
            if [[ -n "$run_id" ]]; then
              status=$(printf '%s' "$payload" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')
              conclusion=$(printf '%s' "$payload" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""')
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || exit 1
                break
              fi
            fi
            sleep 60
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.run_id }}
          path: diagonal-artifacts
      - name: Inspect actual output schema
        run: |
          set -euo pipefail
          destination=research_results/candidate_4t/diagonal_artifact_probe
          rm -rf "$destination"
          mkdir -p "$destination"
          python research/candidate-4t-diagonal-integration/inspect_artifacts.py \
            --root diagonal-artifacts \
            --output "$destination/schema.json"
          find diagonal-artifacts -maxdepth 4 -type f -printf '%P\n' | sort > "$destination/files.txt"
          printf '%s\n' \
            "source_commit=${GITHUB_SHA}" \
            "source_run=${GITHUB_RUN_ID}" \
            "diagonal_run=${{ steps.run.outputs.run_id }}" > "$destination/source.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-diagonal-artifact-probe-${{ github.sha }}
          path: research_results/candidate_4t/diagonal_artifact_probe/**
          if-no-files-found: error
          retention-days: 30
      - name: Commit reuse evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research_results/candidate_4t/diagonal_artifact_probe
          if ! git diff --cached --quiet; then
            git commit -m "Record diagonal auction artifact schema ${GITHUB_RUN_ID}"
            git push origin HEAD:research_candidate_4t
          fi
