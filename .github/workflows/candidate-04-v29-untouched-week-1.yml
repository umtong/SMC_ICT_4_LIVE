name: candidate-04-v29-untouched-week-1

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v29-untouched-week-1.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_FROZEN_COMMIT: "6b37d576c1ca054754db5da816e148b4b2e2ec41"
      C04_BUILD_START: "2025-03-22"
      C04_BUILD_END: "2025-03-30"
      C04_EVALUATION_START: "2025-03-24"
      C04_EVALUATION_END: "2025-03-30"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b37d576c1ca054754db5da816e148b4b2e2ec41
          fetch-depth: 1

      - name: Verify exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test "$(git rev-parse HEAD)" = "$C04_FROZEN_COMMIT"
          python -m compileall -q \
            research/candidate-04/rich_features.py \
            research/candidate-04/rich_features_v2.py \
            research/candidate-04/rich_signal_compiler_v29.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_v28_inventory_and_extreme_refinements.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_rich_signal_compiler_v29.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v
          mkdir -p artifacts/candidate-04-v29-untouched-1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              "candidate": "candidate-04-v29-auction-state-mosaic",
              "source_checkout_ref": os.environ["C04_FROZEN_COMMIT"],
              "runtime_image": "ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "source_changes_after_freeze": 0,
          }
          Path("artifacts/candidate-04-v29-untouched-1/source_freeze.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Build untouched completed-data observations
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v29-untouched-1"
          python research/candidate-04/rich_features_v2.py \
            --start "$C04_BUILD_START" \
            --end "$C04_BUILD_END" \
            --cache ".cache/candidate-04-v29-untouched-1/rich" \
            --output "$root/rich"
          expected=$(( ( $(date -d "$C04_BUILD_END" +%s) - $(date -d "$C04_BUILD_START" +%s) ) / 86400 + 1 ))
          test "$(find "$root/rich" -name '*.csv.gz' | wc -l)" -eq "$expected"
          test -s "$root/rich/data_manifest.json"

      - name: Compile frozen V29 intents without execution or PnL
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v29-untouched-1"
          python research/candidate-04/rich_signal_compiler_v29.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$root/rich" \
            --kline-dir ".cache/candidate-04-v29-untouched-1/raw" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --output "$root/signals" \
            --download-klines \
            | tee "$root/signal_compiler_console.json"
          test -s "$root/signals/signals.json"
          test -s "$root/signals/summary.json"

      - name: Execute untouched week exclusively through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v29-untouched-1"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v29-untouched-1/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/equity.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk and apply frozen sequential gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v29-untouched-1")
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          signals = json.loads((root / "signals/summary.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [e for e in events if e.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry/position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum_loss = max(losses, default=0.0)
          risk_pass = maximum_loss <= 0.0301
          candidate_pass = bool(metrics.get("gate_pass")) and risk_pass
          summary = {
              "candidate": "candidate-04-v29-auction-state-mosaic",
              "stage": "untouched_week_1",
              "source_commit": "6b37d576c1ca054754db5da816e148b4b2e2ec41",
              "evaluation_start": "2025-03-24",
              "evaluation_end": "2025-03-30",
              "engine": metrics.get("engine"),
              "signals": signals.get("written_signals"),
              "route_counts": signals.get("route_counts"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "gate_checks": metrics.get("gate_checks"),
              "maximum_realized_loss_fraction": maximum_loss,
              "risk_pass": risk_pass,
              "candidate_pass": candidate_pass,
              "next_stage_allowed": candidate_pass,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          (root / "sequential_gate.json").write_text(
              json.dumps({
                  "candidate_pass": candidate_pass,
                  "next_stage_allowed": candidate_pass,
                  "stage_2_remains_unopened": not candidate_pass,
              }, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not risk_pass:
              raise SystemExit("realized loss exceeded frozen 3% NAV contract")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v29-untouched-week-1-${{ github.sha }}
          path: artifacts/candidate-04-v29-untouched-1
          if-no-files-found: error
          retention-days: 90
