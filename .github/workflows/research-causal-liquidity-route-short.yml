name: Research causal liquidity route system short diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["research_causal_liquidity_route_system"]
    paths:
      - ".github/workflows/research-causal-liquidity-route-short.yml"
      - "research/candidate-causal-liquidity-route-system/**"

concurrency:
  group: research-causal-liquidity-route-short
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {role: dev, period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {role: dev, period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {role: dev, period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {role: dev, period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
          - {role: dev, period: dev-2025-nov, start: 2025-11-01, end: 2025-11-08}
          - {role: dev, period: dev-2026-jan, start: 2026-01-01, end: 2026-01-08}
          - {role: fresh, period: fresh-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {role: fresh, period: fresh-2026-apr, start: 2026-04-01, end: 2026-04-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-causal-liquidity-route-system:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/causal-liquidity-route/${{ matrix.period }}
      OUT: artifacts/causal-liquidity-route/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_causal_liquidity_route_system
      - run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-causal-liquidity-route-system/causal_route_research.py \
            --start "$START" --end "$END" --role "$ROLE" --warmup-days 60 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-liquidity-route-${{ matrix.role }}-${{ matrix.period }}
          path: artifacts/causal-liquidity-route/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30

  aggregate-and-publish:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-causal-liquidity-route-system
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_causal_liquidity_route_system
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-liquidity-route-*
          path: artifacts/causal-liquidity-route/windows
      - run: |
          set -euo pipefail
          mkdir -p artifacts/causal-liquidity-route/result
          python research/candidate-causal-liquidity-route-system/aggregate_short.py \
            --root artifacts/causal-liquidity-route/windows \
            --output artifacts/causal-liquidity-route/result
      - uses: actions/upload-artifact@v4
        with:
          name: causal-liquidity-route-short-result
          path: artifacts/causal-liquidity-route/result/**
          if-no-files-found: error
          retention-days: 30
      - run: |
          set -euo pipefail
          DEST=research_results/causal_liquidity_route_system/short_diagnostic
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp artifacts/causal-liquidity-route/result/summary.json "$DEST/"
          for file in \
            all_global_trades.csv loss_clinic.csv win_clinic.csv no_trade_clinic.csv \
            all_source_event_diagnostics.csv.gz; do
            if [ -f "artifacts/causal-liquidity-route/result/$file" ]; then
              cp "artifacts/causal-liquidity-route/result/$file" "$DEST/$file"
            fi
          done
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Record causal liquidity route short diagnostic [skip ci]"
            git push origin HEAD:research_causal_liquidity_route_system
          fi
