name: ml1-fix-target-fee

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-fix-target-fee.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0

      - name: Use the instrument maker fee for the resting target
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-easychart_ml1/execution_ml1.py")
          text = path.read_text(encoding="utf-8")
          old = '''        entry_fee = float(self.config.estimated_entry_fee_rate)\n        stop_fee = float(self.config.estimated_stop_fee_rate)\n        return estimate_trade_economics(\n'''
          new = '''        entry_fee = float(self.config.estimated_entry_fee_rate)\n        stop_fee = float(self.config.estimated_stop_fee_rate)\n        target_fee = float(getattr(instrument, "maker_fee", entry_fee))\n        return estimate_trade_economics(\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one economics fee block, found {text.count(old)}")
          text = text.replace(old, new)
          old_target = '''            target_fee_rate=entry_fee,\n'''
          new_target = '''            target_fee_rate=target_fee,\n'''
          if text.count(old_target) != 1:
              raise SystemExit(f"expected one target fee assignment, found {text.count(old_target)}")
          text = text.replace(old_target, new_target)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile research/candidate-easychart_ml1/execution_ml1.py

      - name: Commit the repair
        run: |
          git config user.name "umtong"
          git config user.email "dddgjj03@gmail.com"
          git add research/candidate-easychart_ml1/execution_ml1.py
          git diff --cached --check
          git commit -m "fix(ml1): price resting targets at maker fees"
          git push origin HEAD:research_ML1
