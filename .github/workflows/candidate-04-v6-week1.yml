name: candidate-04-v6-week1

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v6-week1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.25"
      - name: Verify frozen candidate
        run: |
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          test "$(cat research/candidate-04/regime_transition_source/*.pyfrag | sha256sum | cut -d' ' -f1)" = "c767f711c2aa90508dfb9ec86dce8ac4f741a4a1c74e7e703d2fa55a59aa8586"
          test "$(sha256sum research/candidate-04/regime_transition_candidate.py | cut -d' ' -f1)" = "9508e596d14a45a5e8676047c4a31db416287d7e3d08fecee2ec29f3c8f91d4f"
          test "$(sha256sum research/candidate-04/regime_transition_config.json | cut -d' ' -f1)" = "dd1d08fa94b0e8550cff64462681dc35b1a4f51b8d3edc0883829664f7ae6bdc"
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover -s research/candidate-04/tests -p 'test_regime_transition_candidate.py' -v
      - name: Build untouched checksummed rich features
        run: |
          uv run python research/candidate-04/rich_features_v2.py \
            --start 2023-03-06 \
            --end 2023-03-14 \
            --cache .cache/candidate-04-v6/week1-rich \
            --output artifacts/candidate-04-v6/week1/rich
      - name: Replay first frozen random BTC week
        run: |
          uv run python research/candidate-04/regime_transition_candidate.py \
            --config research/candidate-04/regime_transition_config.json \
            --rich-dir artifacts/candidate-04-v6/week1/rich \
            --kline-dir .cache/candidate-04-v6/week1-klines \
            --evaluation-start 2023-03-08 \
            --evaluation-end 2023-03-14 \
            --output artifacts/candidate-04-v6/week1/result \
            --download-klines | tee artifacts/candidate-04-v6/week1/console.json
      - name: Record stage gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/candidate-04-v6/week1/result/metrics.json')
          metrics = json.loads(path.read_text())
          Path('artifacts/candidate-04-v6/week1/gate.txt').write_text(
              'PASS\n' if metrics['gate_pass'] else 'FAIL\n',
              encoding='utf-8',
          )
          print(json.dumps(metrics, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v6-week1-${{ github.sha }}
          path: artifacts/candidate-04-v6/week1
          if-no-files-found: warn
          retention-days: 90
