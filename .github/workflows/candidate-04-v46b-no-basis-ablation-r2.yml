name: candidate-04-v46b-no-basis-ablation-r2

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v46b-no-basis-ablation-r2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      ROOT: artifacts/candidate-04-v46b-no-basis-ablation-r2
      EVIDENCE: research/candidate-04/evidence-v46b-no-basis-ablation.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Verify corrected one-variable ablation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m compileall -q research/candidate-04/directional_session_vwap_no_basis_ablation_compiler.py
          python -m unittest discover -s research/candidate-04/tests -p 'test_directional_session_vwap_no_basis_ablation_compiler.py' -v
          python -m unittest discover -s research/candidate-04/tests -p 'test_nt_conditional_adverse_fill_risk_sizing.py' -v

      - uses: actions/download-artifact@v4
        with:
          name: candidate-04-v45b-progressive-untouched-btc-31157625404
          path: restored-v45b
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31157625404
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute same first week and conditionally second
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT"
          run_week() {
            name="$1" build_start="$2" build_end="$3" eval_start="$4" eval_end="$5"
            rich="$(find restored-v45b -type f -path "*${name}/rich/data_manifest.json" -printf '%h\n' | head -n1)"
            test -n "$rich"
            out="$ROOT/$name"
            mkdir -p "$out"
            export C04_BUILD_START="$build_start" C04_BUILD_END="$build_end"
            export C04_EVALUATION_START="$eval_start" C04_EVALUATION_END="$eval_end"
            python research/candidate-04/directional_session_vwap_no_basis_ablation_compiler.py \
              --base-config research/candidate-04/inventory_transfer_config.json \
              --impact-config research/candidate-04/impact_exhaustion_config.json \
              --router-config research/candidate-04/auction_activity_router_config.json \
              --rich-dir "$rich" \
              --kline-dir ".cache/candidate-04-v46b-r2/compiler/$name" \
              --evaluation-start "$eval_start" \
              --evaluation-end "$eval_end" \
              --output "$out/all_signals" \
              --download-klines > "$out/compiler.log"
            python research/candidate-04/causal_target_registry_enricher.py \
              --signals "$out/all_signals/signals.json" \
              --base-config research/candidate-04/inventory_transfer_config.json \
              --rich-dir "$rich" \
              --kline-dir ".cache/candidate-04-v46b-r2/enrich/$name" \
              --build-start "$build_start" --build-end "$build_end" \
              --output-dir "$out/signals" --download-klines \
              --cost-rate 0.00075 --minimum-net-r 1.20 > "$out/enrich.log"
            C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$out/signals/signals.json" \
            python research/candidate-04/nt_backtest_v45_conditional_adverse_fill.py \
              --config research/candidate-04/nt_liquidity_config.json \
              --build-start "$build_start" --build-end "$build_end" \
              --evaluation-start "$eval_start" --evaluation-end "$eval_end" \
              --cache ".cache/candidate-04-v46b-r2/nautilus/$name" \
              --output "$out/nautilus" > "$out/nautilus.log"
            python research/candidate-04/summarize_candidate_week.py \
              --root "$out" --candidate candidate-04-v46b-no-basis-ablation \
              --stage "$name" --min-trades 1 --min-active-days 1 \
              --min-win-rate 0.0 --min-geometric-daily -1.0 \
              --output "$out/summary.json" > "$out/summary.log"
          }
          run_week untouched_1_2025_07 2025-07-19 2025-07-27 2025-07-21 2025-07-27
          positive="$(python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("yes" if x.get("risk_pass") and int(x.get("trades") or 0)>=1 and float(x.get("total_return") or 0)>0 else "no")' "$ROOT/untouched_1_2025_07/summary.json")"
          if [[ "$positive" == yes ]]; then
            run_week untouched_2_2024_09 2024-09-21 2024-09-29 2024-09-23 2024-09-29
          fi

      - name: Record economic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          rows=[]
          for name in ("untouched_1_2025_07","untouched_2_2024_09"):
              p=root/name/"summary.json"; c=root/name/"all_signals/summary.json"
              if p.exists(): rows.append({"week":name,**json.loads(p.read_text()),"compiler_summary":json.loads(c.read_text()) if c.exists() else None})
          returns=[float(x.get("total_return") or 0) for x in rows]
          compounded=math.prod(1+x for x in returns)-1 if rows else 0.0
          trades=sum(int(x.get("trades") or 0) for x in rows); wins=sum(int(x.get("wins") or 0) for x in rows)
          evidence={
              "candidate":"candidate-04-v46b-directional-session-vwap-no-basis",
              "engine":"NautilusTrader 1.230.0 BacktestNode",
              "base_result":"V46 first week zero trades; five first VWAP retests but no completed route",
              "one_variable_ablation":"remove only positive five-minute basis change at reclaim",
              "weeks":rows,"compounded_return":compounded,"trades":trades,"wins":wins,
              "win_rate":wins/trades if trades else 0.0,
              "decision":("retain_v46b_and_open_third_week" if len(rows)==2 and compounded>0 and trades>=4 and wins/trades>=0.5 else "discard_v46_after_single_basis_ablation"),
              "project_target_reached":False,"final_validation_completed":False,
              "performance_recalculated_outside_nautilus":False
          }
          Path(os.environ["EVIDENCE"]).write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          (root/"decision.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v46b-no-basis-ablation-r2-${{ github.run_id }}
          path: |
            artifacts/candidate-04-v46b-no-basis-ablation-r2
            research/candidate-04/evidence-v46b-no-basis-ablation.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name candidate-04-research-bot
          git config user.email candidate-04-research-bot@users.noreply.github.com
          git add "$EVIDENCE" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record corrected V46 basis ablation"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-04 && git push origin HEAD:research/candidate-04; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
