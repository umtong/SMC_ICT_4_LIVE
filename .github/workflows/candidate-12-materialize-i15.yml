name: candidate-12-materialize-i18

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-materialize-i15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i18
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Diagnose I18 unfilled rearm auction
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-12/materialize_i18.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "bar(ts(y, m, d, 6, 45), 109, 109.2, 107.0, 107.2)":
                  "bar(ts(y, m, d, 6, 45), 109, 109.2, 106.4, 107.2)",
              "bar(ts(y, m, d, 6, 50), 107.2, 110.5, 107.1, 110.2)":
                  "bar(ts(y, m, d, 6, 50), 107.2, 109.0, 107.1, 108.8)",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          old_gate = "        self.assertEqual(expired.entry_order, EntryOrder.LIMIT_GTD)\n        self.assertTrue(\n            engine.rearm_unfilled_plan(\n"
          new_gate = "        self.assertEqual(expired.entry_order, EntryOrder.LIMIT_GTD)\n        object.__setattr__(engine.config, \"min_net_r\", 0.65)\n        self.assertTrue(\n            engine.rearm_unfilled_plan(\n"
          assert text.count(old_gate) == 1, text.count(old_gate)
          text = text.replace(old_gate, new_gate, 1)
          start = text.index("    def test_expired_reacceleration_limit_requires_later_mitigation_and_active_hold(\n")
          needle = "        self.assertIsNotNone(plan)\n"
          pos = text.index(needle, start)
          diagnostic = "        self.assertIsNotNone(plan, (dict(engine.skips), [(e.event_type, e.reason_code, e.next_state) for e in engine.events[-8:]], state.high_rearm_watch, state.high_rearm_entry, state.high_rearm_mitigation_low))\n"
          text = text[:pos] + diagnostic + text[pos + len(needle):]
          path.write_text(text, encoding="utf-8")
          PY
          python research/candidate-12/materialize_i18.py
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v
