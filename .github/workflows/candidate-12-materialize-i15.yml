name: candidate-12-materialize-i15

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-materialize-i15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i15
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user root
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install I15 deep acceptance failure route
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("research/candidate-12")
          p = root / "logic.py"
          text = p.read_text(encoding="utf-8")
          assert 'Candidate 12 I14b.' in text

          enum_anchor = '    LONDON_HIGH_ACCEPTANCE = "LONDON_HIGH_ACCEPTANCE"\n'
          assert text.count(enum_anchor) == 1
          text = text.replace(
              enum_anchor,
              enum_anchor
              + '    ASIA_HIGH_ACCEPTANCE_FAILURE = "ASIA_HIGH_ACCEPTANCE_FAILURE"\n'
              + '    LONDON_HIGH_ACCEPTANCE_FAILURE = "LONDON_HIGH_ACCEPTANCE_FAILURE"\n',
              1,
          )

          state_anchor = '''    reacceptance_anchor_fvg: BullFVG | None = None
              reacceptance_done: bool = False

              outside_low_closes: int = 0
          '''
          assert text.count(state_anchor) == 1, text.count(state_anchor)
          text = text.replace(
              state_anchor,
              '''    reacceptance_anchor_fvg: BullFVG | None = None
              reacceptance_done: bool = False
              high_failure_watch: bool = False
              high_failure_fvg: BullFVG | None = None
              high_failure_peak: float | None = None
              high_failure_bar_low: float | None = None
              high_failure_started_index: int | None = None
              high_failure_scenario_id: str | None = None

              outside_low_closes: int = 0
          ''',
              1,
          )

          method_anchor = '''    def _advance_high_acceptance(
              self, state: SourceState, bar: FiveBar, atr: float, allow_entry: bool
          ) -> TradePlan | None:
              source = state.source
              if state.high_plan_emitted:
                  return None
              # A completed close back inside terminates the current acceptance and
          '''
          assert text.count(method_anchor) == 1, text.count(method_anchor)
          failure_logic = '''    def _advance_high_acceptance(
              self, state: SourceState, bar: FiveBar, atr: float, allow_entry: bool
          ) -> TradePlan | None:
              source = state.source
              if state.high_plan_emitted:
                  return None

              # A deep failure is a separate auction only when the original
              # accepted imbalance has been invalidated, no trade was already
              # emitted from the same completed boundary, and bearish
              # displacement breaks the failure leg within the existing reclaim
              # horizon. This prevents repeated entries on one causal episode.
              if state.high_failure_watch:
                  started = state.high_failure_started_index
                  fvg = state.high_failure_fvg
                  failure_peak = state.high_failure_peak
                  failure_low = state.high_failure_bar_low
                  sid = state.high_failure_scenario_id
                  if (
                      started is None
                      or fvg is None
                      or failure_peak is None
                      or failure_low is None
                      or sid is None
                  ):
                      state.high_failure_watch = False
                      self.skips["HIGH_ACCEPTANCE_FAILURE_MISSING_STRUCTURE"] += 1
                  elif self._five_index - started > self.config.reclaim_max_bars:
                      state.high_failure_watch = False
                      self.skips["HIGH_ACCEPTANCE_FAILURE_CONFIRMATION_EXPIRED"] += 1
                  elif bar.close > source.high:
                      state.high_failure_watch = False
                      self.skips["HIGH_ACCEPTANCE_FAILURE_REACCEPTED"] += 1
                  else:
                      confirmed = (
                          bar.close < bar.open
                          and bar.body / atr
                          >= self.config.acceptance_displacement_body_atr
                          and bar.close_location
                          <= self.config.low_acceptance_displacement_max_close_location
                          and bar.close < failure_low
                          and bar.close < fvg.lower
                      )
                      if confirmed:
                          scenario = (
                              ScenarioKind.ASIA_HIGH_ACCEPTANCE_FAILURE
                              if source.label is SessionLabel.ASIA
                              else ScenarioKind.LONDON_HIGH_ACCEPTANCE_FAILURE
                          )
                          stop = failure_peak + self.config.fvg_stop_buffer_atr * atr
                          plan = self._costed_plan(
                              scenario_id=sid,
                              scenario=scenario,
                              direction=Direction.SHORT,
                              entry_order=EntryOrder.MARKET,
                              observed_ts_ns=bar.ts_ns,
                              bar=bar,
                              atr=atr,
                              entry_raw=bar.close,
                              stop_raw=stop,
                              target_raw=source.low,
                              expire_ts_ns=None,
                              details={
                                  "source": source.label.value,
                                  "route": "DEEP_HIGH_ACCEPTANCE_FAILURE_BEARISH_MSS",
                                  "session_high": source.high,
                                  "session_low": source.low,
                                  "session_width": source.width,
                                  "failed_fvg_lower": fvg.lower,
                                  "failed_fvg_upper": fvg.upper,
                                  "failure_peak": failure_peak,
                                  "failure_leg_low": failure_low,
                                  "confirmation_body_atr": bar.body / atr,
                                  "confirmation_close_location": bar.close_location,
                                  "target_semantics": "OPPOSITE_COMPLETED_SESSION_BOUNDARY",
                              },
                          )
                          state.high_failure_watch = False
                          if plan is None:
                              self.skips["HIGH_ACCEPTANCE_FAILURE_COSTED_PLAN_REJECTED"] += 1
                              return None
                          self.scenario_counts[scenario.value] += 1
                          state.high_plan_emitted = True
                          state.trade_plan_emitted = True
                          return self._emit_plan(plan, allow_entry)

              # A completed close back inside terminates the current acceptance and
          '''
          text = text.replace(method_anchor, failure_logic, 1)

          capture_anchor = '''                original_fvg = state.active_fvg
                      reacceptance_eligible = (
          '''
          assert text.count(capture_anchor) == 1, text.count(capture_anchor)
          text = text.replace(
              capture_anchor,
              '''                original_fvg = state.active_fvg
                      failure_peak = max(state.acceptance_peak or source.high, bar.high)
                      failure_scenario_id = (
                          state.acceptance_scenario_id
                          or self._next_scenario_id(source.label, "HIGH-ACCEPTANCE-FAILURE")
                      )
                      reacceptance_eligible = (
          ''',
              1,
          )

          reset_anchor = '''                state.acceptance_pullback_low = None
                      state.acceptance_peak = None
                      if not reacceptance_eligible:
          '''
          assert text.count(reset_anchor) == 1, text.count(reset_anchor)
          text = text.replace(
              reset_anchor,
              '''                state.acceptance_pullback_low = None
                      state.acceptance_peak = None
                      state.high_failure_watch = (
                          original_fvg is not None and not reacceptance_eligible
                      )
                      state.high_failure_fvg = (
                          original_fvg if state.high_failure_watch else None
                      )
                      state.high_failure_peak = (
                          failure_peak if state.high_failure_watch else None
                      )
                      state.high_failure_bar_low = (
                          bar.low if state.high_failure_watch else None
                      )
                      state.high_failure_started_index = (
                          self._five_index if state.high_failure_watch else None
                      )
                      state.high_failure_scenario_id = (
                          failure_scenario_id if state.high_failure_watch else None
                      )
                      if not reacceptance_eligible:
          ''',
              1,
          )

          text = text.replace('Candidate 12 I14b.', 'Candidate 12 I15.', 1)
          p.write_text(text, encoding="utf-8")

          tests_path = root / "test_logic.py"
          tests = tests_path.read_text(encoding="utf-8")
          marker = '    def test_opposite_boundaries_have_independent_causal_lifecycles(self) -> None:\n'
          assert tests.count(marker) == 1
          test = '''    def test_deep_high_acceptance_failure_requires_bearish_mss(self) -> None:
              y, m, d = self.DAY
              engine = CausalLiquidityAuctionEngine(config(max_stop_atr=100.0), "X")
              self.seed_asia(engine)
              self.form_asia_high_acceptance(engine)
              self.assertIsNone(
                  engine._on_five(bar(ts(y, m, d, 6, 20), 108, 108.2, 105.2, 105.7), True)
              )
              # The accepted imbalance is destroyed by a completed close back
              # inside. This arms a failure watch but is not itself an entry.
              self.assertIsNone(
                  engine._on_five(bar(ts(y, m, d, 6, 25), 105.7, 106, 103.5, 103.8), True)
              )
              state = engine._sources[SessionLabel.ASIA]
              self.assertTrue(state.high_failure_watch)
              # Bearish displacement through both the failed FVG and failure-leg
              # low confirms a distinct failed-auction short.
              plan = engine._on_five(
                  bar(ts(y, m, d, 6, 30), 103.8, 104, 97, 98),
                  True,
              )
              self.assertIsNotNone(plan)
              assert plan is not None
              self.assertEqual(plan.scenario, ScenarioKind.ASIA_HIGH_ACCEPTANCE_FAILURE)
              self.assertEqual(plan.direction, Direction.SHORT)
              self.assertEqual(plan.entry_order, EntryOrder.MARKET)
              self.assertEqual(
                  plan.details["route"],
                  "DEEP_HIGH_ACCEPTANCE_FAILURE_BEARISH_MSS",
              )
              self.assertAlmostEqual(plan.target_price, 95.0)

          '''
          tests = tests.replace(marker, test + marker, 1)
          tests_path.write_text(tests, encoding="utf-8")

          cfg_path = root / "config.json"
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          cfg["schema_version"] = 16
          cfg["candidate"] = "candidate-12-deep-acceptance-failure-router"
          cfg["selection"]["selection_rule"] = (
              "W1-W12 are exposed evidence. I15 preserves I14b and adds one distinct "
              "failed-auction route: after an accepted high-side auction closes back "
              "inside and destroys its original FVG, bearish displacement must break "
              "the failure leg within the existing reclaim horizon. Stop is beyond the "
              "failed-auction peak and target is the opposite completed boundary. A "
              "boundary which already emitted a trade cannot emit this route."
          )
          cfg_path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY
          python -m compileall -q research/candidate-12
          python -m unittest discover -s research/candidate-12 -p 'test_*.py' -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-12/logic.py research/candidate-12/test_logic.py research/candidate-12/config.json
          git commit -m "candidate-12: add deep high-acceptance failure route"
          git push origin HEAD:research/candidate-12
