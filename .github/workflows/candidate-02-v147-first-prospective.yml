name: candidate-02-v147-first-prospective

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v147_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v147-first-prospective, cancel-in-progress: false}

jobs:
  v147-prospective:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify engine
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor

      - name: Lock development winner before revealing week
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v147
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path

          specs={
              'v142':{
                  'glob':'research/candidate-02/results/v142_family/*/artifacts-v142-family-decision.json',
                  'central':'100','runner':'research/candidate-02/v142_nt_backtest.py',
                  'scenario':{
                      'volatility_quantile':0.55,'target_extension':0.0,
                      'minimum_cost_after_rr':0.65,'maximum_cost_after_rr':4.0,
                      'maximum_holding_minutes':60,'decision_window_minutes':15,
                      'activation_delay_minutes':1,'resolution_stop_buffer_atr':0.15,
                      'continuation_extension':1.0,
                  },
              },
              'v144':{
                  'glob':'research/candidate-02/results/v144_family/*/artifacts-v144-family-decision.json',
                  'central':'10','runner':'research/candidate-02/v144_nt_backtest.py',
                  'scenario':{
                      'volatility_quantile':0.55,'target_extension':0.0,
                      'minimum_cost_after_rr':0.90,'maximum_cost_after_rr':5.0,
                      'maximum_holding_minutes':60,'decision_window_minutes':15,
                      'retest_window_minutes':10,'activation_delay_minutes':1,
                      'retest_tolerance_atr':0.10,'retest_stop_buffer_atr':0.10,
                      'continuation_extension':1.0,
                  },
              },
              'v145':{
                  'glob':'research/candidate-02/results/v145_family/*/artifacts-v145-family-decision.json',
                  'central':'65','runner':'research/candidate-02/v145_nt_backtest.py',
                  'scenario':{
                      'volatility_quantile':0.55,'target_extension':0.0,
                      'minimum_cost_after_rr':0.65,'maximum_cost_after_rr':4.0,
                      'maximum_holding_minutes':60,'decision_window_minutes':15,
                      'activation_delay_minutes':1,'resolution_stop_buffer_atr':0.15,
                      'continuation_extension':1.0,'trend_lookback_5m':48,
                      'trend_efficiency_quantile':0.65,
                  },
              },
          }
          eligible=[]
          for family,spec in specs.items():
              paths=sorted(Path('.').glob(spec['glob']))
              if not paths:
                  continue
              decision=json.loads(paths[-1].read_text())
              variant=spec['central']
              if not decision.get('plateau_pass'):
                  continue
              if not decision.get('variant_both_week_pass',{}).get(variant):
                  continue
              weeks=decision['variants'][variant]
              min_growth=min(float(metric['geometric_daily_growth_after_cost']) for metric in weeks.values())
              eligible.append((min_growth,family,spec,paths[-1],decision))

          selection={
              'candidate':'candidate-02-v147-first-prospective',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'selection_before_week_reveal':True,
          }
          if not eligible:
              selection.update({'status':'NO_DEVELOPMENT_PLATEAU','has_candidate':False})
              Path('artifacts-v147-selection.json').write_text(json.dumps(selection,indent=2,sort_keys=True)+'\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
                  fh.write('has_candidate=false\n')
              raise SystemExit(0)

          _,family,spec,decision_path,decision=max(eligible,key=lambda item:item[0])
          # Candidate and full configuration are selected before this hash-derived
          # week is calculated.  The two revealed development weeks are excluded.
          mondays=[]
          current=date(2024,10,7)
          while current <= date(2025,2,24):
              if current.isoformat() not in {'2024-12-30','2025-03-03'}:
                  mondays.append(current)
              current += timedelta(days=7)
          index=int(os.environ['GITHUB_SHA'][:16],16) % len(mondays)
          week_start=mondays[index]
          selection.update({
              'status':'LOCKED_BEFORE_REVEAL',
              'has_candidate':True,
              'selected_family':family,
              'selected_variant':spec['central'],
              'selected_runner':spec['runner'],
              'selected_scenario':spec['scenario'],
              'development_decision_path':str(decision_path),
              'development_minimum_week_growth':max(eligible,key=lambda item:item[0])[0],
              'prospective_week_start':week_start.isoformat(),
              'week_selection':'GITHUB_SHA modulo eligible non-development Mondays',
          })
          Path('artifacts-v147-selection.json').write_text(json.dumps(selection,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write('has_candidate=true\n')
              fh.write(f"week_start={week_start.isoformat()}\n")
              fh.write(f"runner={spec['runner']}\n")
              fh.write(f"family={family}\n")
          PY

      - name: Download immutable causal feature matrix
        if: steps.lock.outputs.has_candidate == 'true'
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v147
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Reveal and download only the locked prospective week
        if: steps.lock.outputs.has_candidate == 'true'
        shell: bash
        env:
          WEEK_START: "${{ steps.lock.outputs.week_start }}"
        run: |
          set -euo pipefail
          rm -rf inputs/v147/.cache
          mkdir -p inputs/v147/.cache/candidate-02/v147-prospective/binance_1m
          python - <<'PY'
          import os
          from datetime import date,timedelta
          from pathlib import Path
          start=date.fromisoformat(os.environ['WEEK_START'])-timedelta(days=2)
          out=Path('inputs/v147/.cache/candidate-02/v147-prospective/binance_1m')
          lines=[]
          for offset in range(10):
              day=start+timedelta(days=offset)
              name=f'BTCUSDT-1m-{day.isoformat()}.zip'
              url=f'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1m/{name}'
              lines.append(f"curl --fail --location --retry 5 --retry-delay 2 '{url}' -o '{out/name}'")
          Path('/tmp/v147/download.sh').write_text('set -euo pipefail\n'+'\n'.join(lines)+'\n')
          PY
          bash /tmp/v147/download.sh
          test "$(find inputs/v147/.cache/candidate-02/v147-prospective/binance_1m -name '*.zip' | wc -l)" -eq 10

      - name: Materialize locked candidate configuration
        if: steps.lock.outputs.has_candidate == 'true'
        shell: bash
        env:
          WEEK_START: "${{ steps.lock.outputs.week_start }}"
          FAMILY: "${{ steps.lock.outputs.family }}"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=json.loads(Path('research/candidate-02/v107_week1_config.json').read_text())
          selection=json.loads(Path('artifacts-v147-selection.json').read_text())
          base['candidate']=f"candidate-02-v147-{selection['selected_family']}"
          base['scenario'].update(selection['selected_scenario'])
          base['validation']['first_week_start']=selection['prospective_week_start']
          Path('/tmp/v147/prospective-config.json').write_text(json.dumps(base,indent=2,sort_keys=True)+'\n')
          assert float(base['risk']['risk_fraction'])==0.03
          assert base['risk']['maximum_notional_cap'] is None
          PY

      - name: Run locked first prospective NautilusTrader week
        if: steps.lock.outputs.has_candidate == 'true'
        id: run
        shell: bash
        env:
          RUNNER: "${{ steps.lock.outputs.runner }}"
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-02-v147/prospective
          set +e
          python "$RUNNER" \
            --config /tmp/v147/prospective-config.json \
            --input-root inputs/v147 \
            --output artifacts/candidate-02-v147/prospective \
            | tee artifacts-v147-prospective.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v147/prospective/validation_exit_code.txt
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi

      - name: Finalize prospective decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          selection=json.loads(Path('artifacts-v147-selection.json').read_text())
          out=dict(selection)
          metrics_path=Path('artifacts/candidate-02-v147/prospective/metrics.json')
          if not selection.get('has_candidate'):
              out['status']='NO_DEVELOPMENT_PLATEAU'
              out['prospective_target_met']=False
          elif metrics_path.exists():
              metrics=json.loads(metrics_path.read_text())
              out['prospective_metrics']=metrics
              out['prospective_target_met']=bool(metrics['target_met'])
              out['status']='FIRST_PROSPECTIVE_PASS' if metrics['target_met'] else 'FIRST_PROSPECTIVE_REJECT'
          else:
              out['status']='PROSPECTIVE_EXECUTION_ERROR'
              out['prospective_target_met']=False
          Path('artifacts-v147-prospective-decision.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'status':out['status'],
              'selected_family':out.get('selected_family'),
              'week_start':out.get('prospective_week_start'),
              'metrics':{key:out.get('prospective_metrics',{}).get(key) for key in (
                  'trades','trades_per_day','win_rate','profit_factor_after_cost',
                  'geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown','target_met')},
          },indent=2,sort_keys=True))
          PY

      - name: Commit locked prospective evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v147
          mkdir compact-v147
          cp -f artifacts-v147-*.json compact-v147/ 2>/dev/null || true
          cp -f artifacts-v147-*.log compact-v147/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v147 compact-v147/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v147-prospective-decision.json; then
            destination="research/candidate-02/results/v147_prospective/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v147/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record locked first prospective evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "candidate-02-v147-prospective-${{ github.sha }}", path: compact-v147, if-no-files-found: warn, retention-days: 30, compression-level: 9}
