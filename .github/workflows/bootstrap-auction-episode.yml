name: bootstrap-auction-episode

on:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - ".github/workflows/bootstrap-auction-episode.yml"
      - ".bootstrap/auction_episode_sources.tgz"

concurrency:
  group: bootstrap-auction-episode
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML_thinking
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize causal auction-episode source
        shell: bash
        run: |
          set -euo pipefail
          target="research/candidate-auction-episode-policy"
          rm -rf "$target"
          mkdir -p "$target"
          tar -xzf .bootstrap/auction_episode_sources.tgz -C "$target"
          python -m py_compile \
            "$target/auction_episode_research.py" \
            "$target/run_auction_episode_research.py" \
            "$target/self_check_auction_episode.py"
          PYTHONPATH="$target" python "$target/self_check_auction_episode.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git rm -f .bootstrap/auction_episode_sources.tgz .github/workflows/bootstrap-auction-episode.yml
          git commit -m "Build causal auction-episode action universe"
          git push origin HEAD:research_ML_thinking
