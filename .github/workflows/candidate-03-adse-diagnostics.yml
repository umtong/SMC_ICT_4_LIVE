name: candidate-03-adse-diagnostics

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-adse-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-validation-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download checksum-verified opened validation bundle
        run: >-
          python research/candidate-03/download_lcpt_bundle.py
          --symbol BTCUSDT --week-start 2025-05-05
          --output .research-data/candidate-03/adse/diagnostic-validation-1
      - name: Preserve raw data and frozen source
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-adse-validation-1-raw-${{ github.sha }}
          path: |
            .research-data/candidate-03/adse/diagnostic-validation-1
            research/candidate-03/*.py
            research/candidate-03/*.json
            research/candidate-03/README.md
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
