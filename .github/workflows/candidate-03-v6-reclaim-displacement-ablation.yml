name: candidate-03-v6-reclaim-displacement-ablation

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/ablate_nt_lvcfr_v6_reclaim_displacement.py"
      - ".github/workflows/candidate-03-v6-reclaim-displacement-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v6_config.json

jobs:
  controlled-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify ablation contract in pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c 'smc4 doctor && PYTHONPYCACHEPREFIX=/tmp/candidate03-v6-ablation python -m py_compile research/candidate-03/ablate_nt_lvcfr_v6_reclaim_displacement.py'

      - name: Restore immutable second development week inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Remove only weak reclaim displacement and replay same week
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          out=artifacts/candidate-03/nt-lvcfr-v6-ablation/development-2
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v6_signals.py --prepared-root $prepared --output-manifest $out/v6_signal_manifest.json"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/ablate_nt_lvcfr_v6_reclaim_displacement.py \
              --signals $prepared/signals.json --output-manifest $out/ablation_manifest.json \
              --minimum-opposite-displacement-bp 12.0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/candidate-03/nt-lvcfr-v6-ablation/development-2/ablation_manifest.json').read_text())
          if manifest['removed_signal_count'] != 1 or manifest['kept_signal_count'] != 7:
              raise SystemExit(f'unexpected controlled ablation schedule: {manifest}')
          removed = manifest['removed'][0]
          if abs(removed['opposite_displacement_bp'] - 5.006923332942531) > 1e-9:
              raise SystemExit(f'unexpected removed event: {removed}')
          PY
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py --prepared-root $prepared --config $CONFIG" \
            2>&1 | tee "$out/catalog_rebuild.log"
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start 2025-06-23 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          set +e
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" --config "$CONFIG" \
            | tee "$out/gate.json"
          gate_status=${PIPESTATUS[0]}
          set -e
          printf '{"expected_gate_exit": %s}\n' "$gate_status" > "$out/gate_exit.json"

      - name: Preserve controlled ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v6-reclaim-displacement-ablation-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v6-ablation/**/*.json
            artifacts/candidate-03/nt-lvcfr-v6-ablation/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v6-ablation/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v6-ablation/**/*.log
          if-no-files-found: error
          retention-days: 30
