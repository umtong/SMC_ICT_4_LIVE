name: candidate-53-meta-label-perp-only

on:
  push:
    branches: ["research/candidate-53"]
    paths:
      - "research/candidate-53/event_meta_label_perp_only.py"
      - ".github/workflows/candidate-53-meta-label-perp.yml"
  workflow_dispatch:

concurrency:
  group: candidate-53-meta-label-perp
  cancel-in-progress: true

permissions: {contents: read, packages: read}

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-53-meta-label-perp
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-53, fetch-depth: 0}
      - name: Reuse verified Binance layer
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git fetch origin research/candidate-16-v13-volatility-squeeze-release:refs/remotes/origin/c16-v13
          rm -rf .deps/c16 && mkdir -p .deps
          git worktree add --detach .deps/c16 refs/remotes/origin/c16-v13
          git config --global --add safe.directory "$(pwd)/.deps/c16"
          python -m py_compile research/candidate-53/event_meta_label_study.py research/candidate-53/event_meta_label_perp_only.py
      - name: Run frozen perp-only study
        shell: bash
        env: {PYTHONPATH: "research/candidate-53:.deps/c16/research/candidate-16"}
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-53/event_meta_label_perp_only.py \
            --cache .cache/candidate-53-meta-label-perp \
            --output "$ROOT" 2>&1 | tee "$ROOT/console.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-53-meta-label-perp-${{ github.sha }}
          path: artifacts/candidate-53-meta-label-perp/**
          if-no-files-found: warn
          retention-days: 30
