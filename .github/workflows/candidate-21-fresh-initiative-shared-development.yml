# Candidate 21 fresh-initiative shared development validation.
name: candidate-21-fresh-initiative-shared-development

on:
  push:
    branches: ["research/candidate-21"]
    paths:
      - "research/candidate-21/fresh_initiative_router.py"
      - "research/candidate-21/candidate21_fresh_initiative_strategy.py"
      - "research/candidate-21/tests/test_fresh_initiative_router.py"
      - ".github/workflows/candidate-21-fresh-initiative-shared-development.yml"
  workflow_dispatch:

concurrency:
  group: candidate-21-fresh-initiative-shared-development
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  shared-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-21:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-21-fresh-initiative
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          smc4 doctor
          python -m compileall -q research/candidate-21
          python -m unittest discover -s research/candidate-21/tests -p 'test_fresh_initiative_router.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_global_entry_slot_v4.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_shared_account_strategy_variants.py' -v

      - name: Inject fresh initiative policy into the audited v36 shared wrapper
        shell: bash
        run: |
          cat > research/candidate-05/strategy_v36_cross_asset_repricing_gate.py <<'PY'
          from typing import Any

          from candidate21_fresh_initiative_strategy import FreshInitiativeAcceptanceMixin
          from strategy_v26 import ScenarioValidEntryStrategy

          REVERSAL_BRANCH_PREFIX = "TAIL_FLOW_"

          def symbol_from_instrument(value: Any) -> str:
              text = str(value)
              if "-PERP" not in text:
                  raise ValueError(f"unexpected project instrument id: {text}")
              return text.split("-PERP", 1)[0]

          SystemicRepricingGateMixin = FreshInitiativeAcceptanceMixin

          class SystemicRepricingGateStrategy(
              FreshInitiativeAcceptanceMixin,
              ScenarioValidEntryStrategy,
          ):
              pass

          CandidateStrategy = SystemicRepricingGateStrategy
          StrategyClass = SystemicRepricingGateStrategy
          CrossAssetRepricingGateStrategy = SystemicRepricingGateStrategy
          PY
          python -m compileall -q research/candidate-05/strategy_v36_cross_asset_repricing_gate.py
          mkdir -p "$ROOT/evidence"
          cat > "$ROOT/evidence/winner.json" <<'JSON'
          {
            "classification": "VALIDATED_BTC_WINNER_RESOLVED",
            "winner": "strategy_v36_cross_asset_repricing_gate:SystemicRepricingGateStrategy",
            "experiment_role": "CANDIDATE21_FRESH_INITIATIVE_SHARED_DEVELOPMENT"
          }
          JSON

      - name: Run four assets in one NautilusTrader account
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-05/shared_account_backtest_v2.py \
            --winner-evidence "$ROOT/evidence/winner.json" \
            --build-start 2025-09-19 \
            --build-end 2025-09-28 \
            --evaluation-start 2025-09-22 \
            --evaluation-end 2025-09-28 \
            --cache .cache/candidate-21-fresh-initiative/week-1 \
            --output "$ROOT/week-1" \
            2>&1 | tee "$ROOT/week-1-console.log"

      - name: Attribute opportunity, execution and account evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          week = root / "week-1"
          result = {"completed": (week / "metrics.json").exists(), "symbols": {}}
          if (week / "metrics.json").exists():
              result["metrics"] = json.loads((week / "metrics.json").read_text())
          keys = (
              "candidate21_fresh_state_evaluations",
              "candidate21_fresh_events",
              "candidate21_fresh_no_natural_target",
              "candidate21_fresh_event_geometry_rejected",
              "candidate21_fresh_episodes_armed",
              "candidate21_fresh_confirmations",
              "candidate21_fresh_invalidated",
              "candidate21_fresh_target_consumed",
              "candidate21_fresh_expired",
              "candidate21_fresh_target_source_expired",
              "candidate21_fresh_confirmation_geometry_rejected",
              "candidate21_fresh_submissions",
              "entry_submissions",
              "order_rejections",
              "shared_slot_acquisitions",
              "shared_slot_conflicts",
          )
          for symbol in ("BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"):
              path = week / "symbols" / symbol / "strategy_diagnostics.json"
              if path.exists():
                  data = json.loads(path.read_text())
                  result["symbols"][symbol] = {key: data.get(key, 0) for key in keys}
          result["totals"] = {
              key: sum(int(values.get(key, 0)) for values in result["symbols"].values())
              for key in keys
          }
          if (week / "global_slot_audit.json").exists():
              result["global_slot_audit"] = json.loads((week / "global_slot_audit.json").read_text())
          root.mkdir(parents=True, exist_ok=True)
          (root / "week-1-assessment.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-21-fresh-initiative-${{ github.sha }}
          path: artifacts/candidate-21-fresh-initiative/**
          if-no-files-found: warn
          retention-days: 90
