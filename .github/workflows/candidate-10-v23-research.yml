name: candidate-10-v23-research

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v23_*.py
      - research/candidate-10/c10_live_cost_*.py
      - research/candidate-10/run_v23.py
      - research/candidate-10/test_v23_state.py
      - research/candidate-10/test_c10_live_cost_math.py
      - research/candidate-10/V23_HYPOTHESIS.md
      - .github/workflows/candidate-10-v23-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v23-research-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Materialize verified v21 base source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .candidate10-v23-runtime artifacts/candidate-10-v23
          mkdir -p .candidate10-v23-runtime/source artifacts/candidate-10-v23
          python research/candidate-10/v21_source_manifest.py \
            --parts-dir research/candidate-10/v21_source_parts \
            --destination .candidate10-v23-runtime/source \
            --provenance artifacts/candidate-10-v23/base_source_provenance.json
          chmod -R a+rwx .candidate10-v23-runtime artifacts

      - name: Run exact OI-semantic experiment in pinned NautilusTrader image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate10-v23:/tmp/candidate10-v22:/tmp/candidate10-v21-patch:/tmp/candidate10-v21:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate10-v21 /tmp/candidate10-v21-patch /tmp/candidate10-v22 /tmp/candidate10-v23 /tmp/candidate-10-v23-data
              mkdir -p /tmp/candidate10-v21 /tmp/candidate10-v21-patch /tmp/candidate10-v22 /tmp/candidate10-v23 /workspace/artifacts/candidate-10-v23
              cp -a /workspace/.candidate10-v23-runtime/source/. /tmp/candidate10-v21/
              cp -a /workspace/research/candidate-10/v20_1_patch/. /tmp/candidate10-v21-patch/
              cp /workspace/research/candidate-10/c10_v22_target.py /tmp/candidate10-v22/
              cp /workspace/research/candidate-10/c10_v22_install.py /tmp/candidate10-v22/
              cp /workspace/research/candidate-10/test_v22_target.py /tmp/candidate10-v22/
              cp /workspace/research/candidate-10/c10_live_cost_math.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/c10_live_cost_ledger.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/test_c10_live_cost_math.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/c10_v23_state.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/c10_v23_install.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/test_v23_state.py /tmp/candidate10-v23/
              cp /workspace/research/candidate-10/run_v23.py /tmp/candidate10-v23/
              smc4 doctor
              python -m py_compile /tmp/candidate10-v21/*.py /tmp/candidate10-v21-patch/*.py /tmp/candidate10-v22/*.py /tmp/candidate10-v23/*.py
              python -m unittest discover -s /tmp/candidate10-v21 -p "test_*.py" -v
              python -m unittest discover -s /tmp/candidate10-v21-patch -p "test_*.py" -v
              python -m unittest discover -s /tmp/candidate10-v22 -p "test_*.py" -v
              python -m unittest discover -s /tmp/candidate10-v23 -p "test_*.py" -v
              python /tmp/candidate10-v23/run_v23.py \
                --phase auto \
                --output /workspace/artifacts/candidate-10-v23 \
                --data-root /tmp/candidate-10-v23-data
            '

      - name: Upload reproducible v23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v23-${{ github.sha }}
          path: artifacts/candidate-10-v23
          if-no-files-found: warn
          retention-days: 14
