name: candidate-08-pyo3-model-boundary-diagnostic-v4

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-pyo3-model-boundary-diagnostic-v4"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-pyo3-model-boundary-diagnostic-v4
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      OUT: research/candidate-08/evidence/aggtrade-acceptance-nautilus/pyo3-model-boundary-diagnostic-v4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run complete converted chain with funding rate normalized to wire schema
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$OUT"
          smc4 doctor | tee "$OUT/doctor.txt"
          PYTHONPATH=research/candidate-08 python - <<'PY' | tee "$OUT/diagnostic.log"
          from __future__ import annotations

          from decimal import Decimal
          import json
          from pathlib import Path
          import traceback
          from typing import Any, Callable

          import pandas as pd
          from nautilus_trader.core import nautilus_pyo3 as pyo3

          from aggtrade_acceptance_strategy import (
              AggTradeAcceptanceStrategy,
              AggTradeAcceptanceStrategyConfig,
          )
          from run_aggtrade_acceptance_nautilus import (
              _bars_from_ten_second_frame,
              _build_instrument,
              _funding_updates_from_frame,
              _mark_price_updates_from_frame,
              _ten_second_bar_type,
          )

          OUT = Path("research/candidate-08/evidence/aggtrade-acceptance-nautilus/pyo3-model-boundary-diagnostic-v4")
          CONFIG = json.loads(Path("research/candidate-08/config_aggtrade_acceptance_nautilus.json").read_text())
          result: dict[str, Any] = {
              "engine": "NautilusTrader",
              "version": "1.230.0",
              "classification": "IMPLEMENTATION_BOUNDARY_DIAGNOSTIC_ONLY",
              "attempts": [],
          }

          def typename(value: Any) -> str:
              return f"{type(value).__module__}.{type(value).__qualname__}"

          def attempt(label: str, fn: Callable[[], Any]) -> tuple[bool, Any]:
              record: dict[str, Any] = {"label": label}
              try:
                  value = fn()
                  record.update(ok=True, type=typename(value), repr=repr(value))
                  result["attempts"].append(record)
                  return True, value
              except Exception as exc:
                  record.update(
                      ok=False,
                      error_type=type(exc).__name__,
                      error=str(exc),
                      traceback=traceback.format_exc(),
                  )
                  result["attempts"].append(record)
                  return False, None

          latency = CONFIG["cost_assumptions"]["latency_ms"]
          engine = pyo3.BacktestEngine(
              pyo3.BacktestEngineConfig(run_analysis=True, bypass_logging=True)
          )
          venue = pyo3.Venue.from_str("BINANCE")
          venue_ok, _ = attempt(
              "add native venue costs latency liquidation",
              lambda: engine.add_venue(
                  venue=venue,
                  oms_type=pyo3.OmsType.HEDGING,
                  account_type=pyo3.AccountType.MARGIN,
                  starting_balances=[
                      pyo3.Money.from_str(f"{CONFIG['starting_nav_usdt']} USDT")
                  ],
                  base_currency=pyo3.Currency.from_str("USDT"),
                  default_leverage=Decimal(str(CONFIG["venue"]["default_leverage"])),
                  fill_model=pyo3.OneTickSlippageFillModel(
                      prob_fill_on_limit=1.0,
                      prob_slippage=float(
                          CONFIG["cost_assumptions"]["one_tick_slippage_probability"]
                      ),
                      random_seed=int(CONFIG["random_seed"]),
                  ),
                  fee_model=pyo3.MakerTakerFeeModel(),
                  latency_model=pyo3.StaticLatencyModel(
                      base_latency_nanos=int(latency["base"] * 1_000_000),
                      insert_latency_nanos=int(latency["insert"] * 1_000_000),
                      update_latency_nanos=int(latency["update"] * 1_000_000),
                      cancel_latency_nanos=int(latency["cancel"] * 1_000_000),
                  ),
                  reject_stop_orders=False,
                  support_contingent_orders=True,
                  use_position_ids=True,
                  use_reduce_only=True,
                  bar_execution=True,
                  bar_adaptive_high_low_ordering=bool(
                      CONFIG["venue"]["bar_adaptive_high_low_ordering"]
                  ),
                  liquidation_enabled=bool(CONFIG["venue"]["liquidation_enabled"]),
                  liquidation_trigger_ratio=float(CONFIG["venue"]["liquidation_trigger_ratio"]),
                  liquidation_cancel_open_orders=bool(
                      CONFIG["venue"]["liquidation_cancel_open_orders"]
                  ),
              ),
          )

          fee_rate = float(CONFIG["effective_fee_rate_per_fill"])
          legacy_instruments = {
              symbol: _build_instrument(symbol, values, fee_rate)
              for symbol, values in CONFIG["assets"].items()
          }
          instruments_ok = venue_ok
          for symbol, instrument in legacy_instruments.items():
              ok, converted = attempt(
                  f"convert {symbol} instrument",
                  lambda instrument=instrument: pyo3.CryptoPerpetual.from_dict(
                      instrument.to_dict(instrument)
                  ),
              )
              instruments_ok = instruments_ok and ok
              if ok:
                  ok, _ = attempt(
                      f"add {symbol} instrument",
                      lambda converted=converted: engine.add_instrument(converted),
                  )
                  instruments_ok = instruments_ok and ok

          timestamp = pd.Timestamp("2024-04-08T00:00:10Z")
          centers = {"BTCUSDT": 70000.0, "ETHUSDT": 3500.0, "SOLUSDT": 175.0, "XRPUSDT": 0.6}
          data_items = []
          conversion_ok = instruments_ok
          for symbol, instrument in legacy_instruments.items():
              precision = int(CONFIG["assets"][symbol]["price_precision"])
              center = centers[symbol]
              step = 10 ** (-precision)
              legacy_bar = _bars_from_ten_second_frame(
                  pd.DataFrame(
                      {
                          "open": [center], "high": [center + step],
                          "low": [center - step], "close": [center], "volume": [1.0],
                      },
                      index=[timestamp],
                  ),
                  bar_type=_ten_second_bar_type(instrument),
                  instrument=instrument,
              )[0]
              ok, converted = attempt(f"convert {symbol} bar", legacy_bar.to_pyo3)
              conversion_ok = conversion_ok and ok
              if ok:
                  data_items.append(converted)

              funding = _funding_updates_from_frame(
                  pd.DataFrame(
                      {"funding_rate": [0.0001], "funding_interval_minutes": [480]},
                      index=[pd.Timestamp("2024-04-08T00:00:00Z")],
                  ),
                  instrument=instrument,
              )[0]
              funding_dict = {
                  "type": "FundingRateUpdate",
                  "instrument_id": str(funding.instrument_id),
                  "rate": str(funding.rate),
                  "interval": int(funding.interval),
                  "next_funding_ns": (
                      None if funding.next_funding_ns is None else int(funding.next_funding_ns)
                  ),
                  "ts_event": int(funding.ts_event),
                  "ts_init": int(funding.ts_init),
              }
              ok, converted = attempt(
                  f"convert {symbol} funding from canonical string wire schema",
                  lambda funding_dict=funding_dict: pyo3.FundingRateUpdate.from_dict(funding_dict),
              )
              conversion_ok = conversion_ok and ok
              if ok:
                  data_items.append(converted)

              mark = _mark_price_updates_from_frame(
                  pd.DataFrame(
                      {"mark_price": [center]},
                      index=[pd.Timestamp("2024-04-07T23:59:59.999Z")],
                  ),
                  instrument=instrument,
              )[0]
              ok, converted = attempt(f"convert {symbol} mark", mark.to_pyo3)
              conversion_ok = conversion_ok and ok
              if ok:
                  data_items.append(converted)

          data_ok = conversion_ok
          if data_ok:
              data_ok, _ = attempt("add all converted data", lambda: engine.add_data(data_items))

          strategy = AggTradeAcceptanceStrategy(
              AggTradeAcceptanceStrategyConfig(
                  trading_start_ns=int(timestamp.as_unit("ns").value),
                  trading_end_ns=int((timestamp + pd.Timedelta(minutes=1)).as_unit("ns").value),
                  risk_fraction=Decimal("0.03"),
                  effective_fee_rate=Decimal(str(CONFIG["effective_fee_rate_per_fill"])),
                  minimum_net_reward_risk=Decimal(str(CONFIG["minimum_net_reward_risk"])),
                  maximum_hold_minutes=int(CONFIG["maximum_hold_minutes"]),
                  funding_avoidance_minutes=int(CONFIG["funding_avoidance_minutes"]),
              ),
              instrument_ids=tuple(item.id for item in legacy_instruments.values()),
              bar_types=tuple(_ten_second_bar_type(item) for item in legacy_instruments.values()),
              signals_by_time_ns={},
              funding_observations_by_instrument={
                  str(item.id): () for item in legacy_instruments.values()
              },
          )
          strategy_ok = data_ok
          if strategy_ok:
              strategy_ok, _ = attempt(
                  "add existing Python strategy",
                  lambda: engine.add_strategy(strategy),
              )

          run_ok = strategy_ok
          if run_ok:
              run_ok, _ = attempt("run complete converted engine", engine.run)

          reports_ok = run_ok
          if reports_ok:
              for label, fn in (
                  ("orders", engine.generate_orders_report),
                  ("fills", engine.generate_fills_report),
                  ("positions", engine.generate_positions_report),
                  ("account", lambda: engine.generate_account_report(venue=venue)),
                  ("venues", engine.list_venues),
              ):
                  ok, _ = attempt(f"generate {label}", fn)
                  reports_ok = reports_ok and ok

          attempt("dispose engine", engine.dispose)
          result["chain"] = {
              "native_venue_costs_liquidation": venue_ok,
              "all_instruments_converted_and_added": instruments_ok,
              "all_data_converted_and_added": data_ok,
              "existing_python_strategy_added": strategy_ok,
              "engine_run_completed": run_ok,
              "reports_generated": reports_ok,
          }
          summary = {
              "classification": result["classification"],
              "chain": result["chain"],
              "failures": [
                  {key: item.get(key) for key in ("label", "error_type", "error")}
                  for item in result["attempts"] if not item.get("ok")
              ],
          }
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / "diagnostic.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          (OUT / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit diagnostic evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f research/candidate-08/.run-pyo3-model-boundary-diagnostic-v4
          git add -A -- "$OUT" research/candidate-08/.run-pyo3-model-boundary-diagnostic-v4
          git commit -m "candidate-08: record funding-normalized PyO3 chain diagnostic [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1
