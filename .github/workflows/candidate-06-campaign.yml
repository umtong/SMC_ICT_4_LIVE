name: Candidate 06 Hourly SAC Excursion Diagnostic

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-campaign.yml"
      - "research/candidate-06/**"
      - "src/smc_ict_4/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-first-btc-week
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  first-week-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Verify post-close diagnostic contract
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_excursion_diagnostics.py
          python research/candidate-06/test_entry_confirmation.py
          python research/candidate-06/test_auction_relay_engine.py

      - name: Replay unchanged hourly SAC candidate in NautilusTrader
        id: diagnostic
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/hourly-sac-excursion-diagnostic
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_hourly_excursion_diagnostic.py \
            --output artifacts/candidate-06/hourly-sac-excursion-diagnostic \
            > artifacts/candidate-06-hourly-excursion.stdout 2> artifacts/candidate-06-hourly-excursion.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-06/hourly-sac-excursion-diagnostic
          printf '%s\n' '${{ steps.diagnostic.outputs.exit_code }}' > artifacts/candidate-06/hourly-sac-excursion-diagnostic/workflow_exit_code.txt
          cp artifacts/candidate-06-hourly-excursion.stdout artifacts/candidate-06/hourly-sac-excursion-diagnostic/workflow_stdout.txt 2>/dev/null || true
          cp artifacts/candidate-06-hourly-excursion.stderr artifacts/candidate-06/hourly-sac-excursion-diagnostic/workflow_stderr.txt 2>/dev/null || true

      - name: Commit reproducible diagnostic evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/hourly-sac-excursion-diagnostic
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record candidate-06 hourly excursion evidence [candidate-06 evidence]"
          git push origin HEAD:research/candidate-06

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-hourly-excursion-${{ github.sha }}
          path: artifacts/candidate-06/hourly-sac-excursion-diagnostic
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce diagnostic completion
        if: always()
        run: |
          code='${{ steps.diagnostic.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "hourly excursion diagnostic did not report an exit code" >&2
            exit 1
          fi
          exit "$code"
