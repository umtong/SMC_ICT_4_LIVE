name: candidate-easychart-apply-v16

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - ".github/workflows/candidate-easychart-apply-v16.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-easychart
          fetch-depth: 0
      - name: Reconstruct and apply audited v16 source bundle
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/easychart-v16.tar.gz
          cat research/candidate-easychart/.v16_payload_* | base64 --decode > "$payload"
          echo "8e70549bd722186c6f2491a3ea51a10c72d44cfab7e8615796f4ba2869fdd628  $payload" | sha256sum -c -
          tar -xzf "$payload" -C .
          rm -f research/candidate-easychart/.v16_payload_*
          rm -f .github/workflows/candidate-easychart-apply-v16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "candidate-easychart: correct breakout origin and add structural shelf family"
          git push origin HEAD:research/candidate-easychart
