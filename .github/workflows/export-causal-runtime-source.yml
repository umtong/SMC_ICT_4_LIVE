name: Export causal runtime source

on:
  push:
    branches: ["research_causal_liquidity_route_system"]
    paths:
      - ".github/workflows/export-causal-runtime-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_causal_liquidity_route_system
      - name: Record run id
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-causal-runtime-export
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-causal-runtime-export
          git commit -m "Record causal runtime export $GITHUB_RUN_ID" || true
          git push origin HEAD:research_causal_liquidity_route_system
      - name: Collect runtime source
        run: |
          set -euo pipefail
          mkdir -p snapshot/repo
          rsync -a \
            --exclude='.git/' \
            --exclude='research_results/' \
            --exclude='data/' \
            --exclude='cache/' \
            --exclude='*.zip' \
            --exclude='*.parquet' \
            --exclude='*.csv' \
            --exclude='*.csv.gz' \
            ./ snapshot/repo/
          find snapshot/repo -type f -printf '%P\n' | sort > snapshot/repo/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: causal-runtime-source
          path: snapshot/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
