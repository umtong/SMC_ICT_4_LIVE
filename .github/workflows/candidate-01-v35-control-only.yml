name: candidate-01-v35-control-only

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v35-control-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v35-control-only
          key: candidate-01-v35-control-only-BTCUSDT-2022-11-19-2022-12-05-${{ runner.os }}-v1
      - name: Run frozen v23 MSS ablation on identical week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/positioning_metrics_data_v35.py \
                research/candidate-01/positioning_cycle_filter_v35.py \
                research/candidate-01/positioning_cycle_mss_v35_nautilus_week.py \
                research/candidate-01/candidate_01_v35_gate.py
              rm -rf artifacts/candidate-01-v35-control-only
              python research/candidate-01/positioning_cycle_mss_v35_nautilus_week.py \
                --week 2022-11-28 \
                --rule v23-mss-control \
                --cache .cache/candidate-01-v35-control-only \
                --output artifacts/candidate-01-v35-control-only \
                --workers 4
            '
      - name: Verify and classify frozen control
        run: |
          python3 research/candidate-01/candidate_01_v35_gate.py \
            --root artifacts/candidate-01-v35-control-only \
            --week 2022-11-28
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v35-control-only-${{ github.sha }}
          path: artifacts/candidate-01-v35-control-only
          if-no-files-found: error
          retention-days: 30
