name: candidate-03-nt-lvcfr-v5-migration-reclaim

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/derive_nt_lvcfr_v5_signals.py"
      - "research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py"
      - "research/candidate-03/nt_lvcfr_v5_config.json"
      - "research/candidate-03/test_nt_lvcfr_v5.py"
      - "research/candidate-03/nt_lvcfr_strategy.py"
      - ".github/workflows/candidate-03-v5.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v5_config.json

jobs:
  staged-development-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned NautilusTrader and V5 causal contracts
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_trade_proxy.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v4.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_v5.py &&
              PYTHONPYCACHEPREFIX=/tmp/candidate03-v5 \
                python -m py_compile \
                  research/candidate-03/derive_nt_lvcfr_v5_signals.py \
                  research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py \
                  research/candidate-03/nt_lvcfr_strategy.py \
                  research/candidate-03/run_nt_lvcfr.py
            '

      - name: Restore immutable first development week inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: First development week — 2024-01-08
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          out=artifacts/candidate-03/nt-lvcfr-v5/development-1
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v5_signals.py \
              --prepared-root $prepared --output-manifest $out/v5_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/candidate-03/nt-lvcfr-v5/development-1/v5_signal_manifest.json').read_text())
          expected = {
              'VALUE_EDGE_CONTINUATION': 7,
              'RANGE_MIGRATION_RECLAIM_REVERSAL': 3,
              'EXTERNAL_ACCEPTANCE_CONTINUATION': 0,
              'EXTERNAL_RECLAIM_REVERSAL': 1,
          }
          actual = manifest['state_counts']
          if manifest['derived_signal_count'] != 11 or any(actual[key] != value for key, value in expected.items()):
              raise SystemExit(f'causal first-week V5 state regression: {manifest}')
          PY
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py \
              --prepared-root $prepared --config $CONFIG" \
            2>&1 | tee "$out/catalog_rebuild.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2024-01-08 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Restore immutable second development week inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Second development week — 2025-06-23
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          out=artifacts/candidate-03/nt-lvcfr-v5/development-2
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v5_signals.py \
              --prepared-root $prepared --output-manifest $out/v5_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/candidate-03/nt-lvcfr-v5/development-2/v5_signal_manifest.json').read_text())
          expected = {
              'VALUE_EDGE_CONTINUATION': 1,
              'RANGE_MIGRATION_RECLAIM_REVERSAL': 3,
              'EXTERNAL_ACCEPTANCE_CONTINUATION': 1,
              'EXTERNAL_RECLAIM_REVERSAL': 3,
          }
          actual = manifest['state_counts']
          if manifest['derived_signal_count'] != 8 or any(actual[key] != value for key, value in expected.items()):
              raise SystemExit(f'causal second-week V5 state regression: {manifest}')
          PY
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/rebuild_nt_lvcfr_trade_proxy_catalog.py \
              --prepared-root $prepared --config $CONFIG" \
            2>&1 | tee "$out/catalog_rebuild.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2025-06-23 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Preserve V5 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-nt-lvcfr-v5-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v5/**/*.json
            artifacts/candidate-03/nt-lvcfr-v5/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v5/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v5/**/*.log
          if-no-files-found: warn
          retention-days: 30
