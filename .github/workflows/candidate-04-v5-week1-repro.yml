name: candidate-04-v5-week1-repro

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v5-week1-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.25"
      - name: Verify runtime and causal contracts
        run: |
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          echo "assembled_source=$(cat research/candidate-04/swing_displacement_source/*.pyfrag | sha256sum | cut -d' ' -f1)"
          echo "config=$(sha256sum research/candidate-04/swing_displacement_config.json | cut -d' ' -f1)"
          echo "test=$(sha256sum research/candidate-04/tests/test_swing_displacement_candidate.py | cut -d' ' -f1)"
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_*v2.py' -v
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_swing_displacement_candidate.py' -v
      - name: Build checksummed first-week rich features
        run: |
          uv run python research/candidate-04/rich_features_v2.py \
            --start 2023-12-16 \
            --end 2023-12-24 \
            --cache .cache/candidate-04-v5/reserve1-rich \
            --output artifacts/candidate-04-v5/reserve1/rich
      - name: Replay first random BTC week
        run: |
          uv run python research/candidate-04/swing_displacement_candidate.py \
            --config research/candidate-04/swing_displacement_config.json \
            --rich-dir artifacts/candidate-04-v5/reserve1/rich \
            --kline-dir .cache/candidate-04-v5/reserve1-klines \
            --evaluation-start 2023-12-18 \
            --evaluation-end 2023-12-24 \
            --output artifacts/candidate-04-v5/reserve1/result \
            --download-klines | tee artifacts/candidate-04-v5/reserve1/console.json
      - name: Require exact frozen result
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('artifacts/candidate-04-v5/reserve1/result/metrics.json')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = 'e540e63cb0b59e9e14b077851b9be01bca92bfd94b3d4f7261f9a11c31223e1d'
          metrics = json.loads(path.read_text())
          print(json.dumps(metrics, indent=2, sort_keys=True))
          if digest != expected:
              raise SystemExit(f'metric hash changed: {digest} != {expected}')
          if not metrics['gate_pass']:
              raise SystemExit('first-week gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v5-week1-${{ github.sha }}
          path: artifacts/candidate-04-v5/reserve1
          if-no-files-found: warn
          retention-days: 90
