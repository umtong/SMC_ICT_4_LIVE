name: candidate-03-v29-staged-container

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v29-staged-container.yml"
      - "research/candidate-03/run_v29_staged_container.py"
      - "research/candidate-03/run_v29_staged_container_v2.py"
      - "research/candidate-03/derive_nt_lvcfr_v29_signals.py"
      - "research/candidate-03/patch_v29_post_shock_persistence.py"
      - "research/candidate-03/test_nt_lvcfr_v29.py"
      - "research/candidate-03/test_nt_lvcfr_v29_ablation.py"
      - "research/candidate-03/nt_lvcfr_v29_config.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-03-v29-staged-container
  cancel-in-progress: false

jobs:
  staged-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run V29 post-shock persistence ablation from exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['GITHUB_SHA']
          token=os.environ['GITHUB_TOKEN']
          path='research/candidate-03/run_v29_staged_container_v2.py'
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/{path}?ref={commit}',
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'candidate-03-v29-v2',
              },
          )
          with urllib.request.urlopen(request,timeout=120) as response:
              payload=json.loads(response.read().decode())
          target=Path('/tmp/run_v29_staged_container_v2.py')
          target.write_bytes(base64.b64decode(payload['content']))
          PY
          python /tmp/run_v29_staged_container_v2.py
