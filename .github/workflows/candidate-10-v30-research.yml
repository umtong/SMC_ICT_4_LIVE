name: candidate-10-v30-source-equilibrium

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v30_*.py
      - research/candidate-10/test_c10_v30_overlay.py
      - .github/workflows/candidate-10-v30-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v30-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  weeks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - week_id: CONTROL_NEW_C
            week_start: "2023-04-11"
            evidence_class: controlled_far_losses
          - week_id: CONTROL_HOLDOUT_B
            week_start: "2025-01-25"
            evidence_class: controlled_far_winners
          - week_id: CONTROL_NEW_A
            week_start: "2023-11-26"
            evidence_class: controlled_aac_loss
          - week_id: CONTROL_V27B
            week_start: "2023-03-16"
            evidence_class: controlled_mixed_far
          - week_id: NEW_V30A
            week_start: "2024-12-07"
            evidence_class: untouched_holdout
          - week_id: NEW_V30B
            week_start: "2023-10-20"
            evidence_class: untouched_holdout
          - week_id: NEW_V30C
            week_start: "2025-08-19"
            evidence_class: untouched_holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run v30 factorial variants
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v30/${{ matrix.week_id }}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v30:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v30
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v30
              for file in \
                c10_v27_overlay.py c10_v27_patch.py \
                c10_v28_overlay.py c10_v28_patch.py \
                c10_v29_overlay.py c10_v29_patch.py \
                c10_v30_overlay.py c10_v30_patch.py c10_v30_run.py \
                test_c10_v27_overlay.py test_c10_v28_overlay.py \
                test_c10_v29_overlay.py test_c10_v30_overlay.py; do
                cp "/workspace/research/candidate-10/${file}" /tmp/candidate11-v30/
              done
              smc4 doctor
              python /tmp/candidate11-v30/c10_v30_patch.py \
                /tmp/candidate11-v30/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v30/c10_v27_overlay.py \
                /tmp/candidate11-v30/c10_v27_patch.py \
                /tmp/candidate11-v30/c10_v28_overlay.py \
                /tmp/candidate11-v30/c10_v28_patch.py \
                /tmp/candidate11-v30/c10_v29_overlay.py \
                /tmp/candidate11-v30/c10_v29_patch.py \
                /tmp/candidate11-v30/c10_v30_overlay.py \
                /tmp/candidate11-v30/c10_v30_patch.py \
                /tmp/candidate11-v30/c10_v30_run.py \
                /tmp/candidate11-v30/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v30 \
                -p "test_c10_v*_overlay.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v30/${{ matrix.week_id }}"
              python /tmp/candidate11-v30/c10_v30_run.py \
                --candidate11-dir /tmp/candidate11-v30 \
                --week-start "${{ matrix.week_start }}" \
                --variant baseline-v29 \
                --output "${BASE}/baseline-v29"

              mkdir -p "${BASE}/far-only/data" "${BASE}/far-equilibrium/data"
              cp -al "${BASE}/baseline-v29/data/." "${BASE}/far-only/data/"
              cp -al "${BASE}/baseline-v29/data/." "${BASE}/far-equilibrium/data/"

              python /tmp/candidate11-v30/c10_v30_run.py \
                --candidate11-dir /tmp/candidate11-v30 \
                --week-start "${{ matrix.week_start }}" \
                --variant far-only \
                --output "${BASE}/far-only"
              python /tmp/candidate11-v30/c10_v30_run.py \
                --candidate11-dir /tmp/candidate11-v30 \
                --week-start "${{ matrix.week_start }}" \
                --variant far-equilibrium \
                --output "${BASE}/far-equilibrium"
            '

      - name: Record evidence class
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/candidate-10-v30/${{ matrix.week_id }}
          printf '%s\n' '${{ matrix.evidence_class }}' > \
            artifacts/candidate-10-v30/${{ matrix.week_id }}/evidence_class.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v30-${{ matrix.week_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v30/${{ matrix.week_id }}
          if-no-files-found: warn
          retention-days: 14
