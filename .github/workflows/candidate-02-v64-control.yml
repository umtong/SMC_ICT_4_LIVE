name: candidate-02-v64-nautilustrader-control

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v64_*.py"
      - "research/candidate-02/v64_*.json"
      - ".candidate-02-v63/collect_first_week.py"
      - ".github/workflows/candidate-02-v64-control.yml"

permissions:
  contents: read
  actions: read

jobs:
  development-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - name: Checkout locked control
        uses: actions/checkout@v4

      - name: Download immutable historical feature matrix
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v63-first-week
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Remove unrelated raw bars
        run: rm -rf inputs/v63-first-week/.cache

      - name: Verify runtime and single-control lock
        run: |
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v64_absorbed_pullback_core.py \
            research/candidate-02/v64_nt_backtest.py \
            .candidate-02-v63/collect_first_week.py
          python -m json.tool research/candidate-02/v64_development_config.json >/dev/null
          python -m json.tool research/candidate-02/v64_control_lock.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("research/candidate-02/v64_control_lock.json").read_text())
          cfg = json.loads(Path("research/candidate-02/v64_development_config.json").read_text())
          assert lock["status"] == "LOCKED_SINGLE_LOGICAL_CONTROL_BEFORE_NAUTILUSTRADER_RUN"
          assert lock["custom_backtest_engine"] is False
          assert cfg["validation"]["first_week_start"] == "2025-02-03"
          assert float(cfg["risk"]["risk_fraction"]) == 0.03
          assert cfg["risk"]["maximum_notional_cap"] is None
          assert cfg["risk"]["score_risk_multiplier"] is None
          PY

      - name: Recollect revealed development week without changing outcome logic
        run: python .candidate-02-v63/collect_first_week.py

      - name: Run v64 through NautilusTrader
        shell: bash
        run: |
          mkdir -p artifacts/candidate-02-v64-control
          set +e
          python research/candidate-02/v64_nt_backtest.py \
            --config research/candidate-02/v64_development_config.json \
            --input-root inputs/v63-first-week \
            --output artifacts/candidate-02-v64-control \
            | tee artifacts-v64-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v64-control/validation_exit_code.txt
          if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi

      - name: Publish decision
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/candidate-02-v64-control/metrics.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/candidate-02-v64-control/metrics.json").read_text())
          print("# Candidate-02 v64 controlled development result")
          for key in ("decision","scheduled_signals","trades","trades_per_day","win_rate","profit_factor_after_cost","geometric_daily_growth_after_cost","maximum_mark_to_market_drawdown"):
              print(f"- {key}: **{m[key]}**")
          PY
          fi

      - name: Preserve NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v64-control-${{ github.sha }}
          path: |
            artifacts/candidate-02-v64-control
            artifacts-v64-console.log
            inputs/v63-first-week/artifacts/candidate-02-v63-first-week-data
          if-no-files-found: warn
          retention-days: 30
