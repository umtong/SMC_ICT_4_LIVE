name: candidate-easychart-apply-v22-policy

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - ".github/workflows/candidate-easychart-apply-v22-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-easychart
          fetch-depth: 0
      - name: Apply unified flow and causal arbitration source
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/easychart-v22-policy-source.tar.gz
          curl --fail --location --retry 4 \
            https://filebin.net/easychart-v22-policy-20260813-oai/easychart-v22-policy-source.tar.gz \
            --output "$payload"
          tar -tzf "$payload"
          tar -xzf "$payload" -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-easychart/market_v21_flow_state.py \
            research/candidate-easychart/route_v21_flow_state.py \
            research/candidate-easychart/download_binance_aggtrades.py \
            research/candidate-easychart/replay_routed_setups_v21.py \
            research/candidate-easychart/nautilus_replay_adapter_v21.py \
            research/candidate-easychart/arbitrate_v22_causal_options.py \
            research/candidate-easychart/tests/test_market_v21_flow_state.py \
            research/candidate-easychart/tests/test_nautilus_replay_adapter_v21.py \
            research/candidate-easychart/tests/test_arbitrate_v22_causal_options.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "source already present"
            exit 0
          fi
          git commit -m "candidate-easychart: unify flow state and causal option arbitration"
          git push origin HEAD:research/candidate-easychart
