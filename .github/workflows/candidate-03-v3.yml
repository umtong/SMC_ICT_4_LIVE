name: candidate-03-nt-lvcfr-v3-uniform-proxy

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/nt_lvcfr_trade_proxy.py"
      - "research/candidate-03/prepare_nt_lvcfr_trade_proxy.py"
      - "research/candidate-03/derive_nt_lvcfr_v3_signals.py"
      - "research/candidate-03/nt_lvcfr_v3_config.json"
      - "research/candidate-03/test_nt_lvcfr_trade_proxy.py"
      - ".github/workflows/candidate-03-v3.yml"
      - "research/candidate-03/nt_lvcfr_strategy.py"
      - "research/candidate-03/run_nt_lvcfr.py"
      - "research/candidate-03/gate_nt_lvcfr.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03
  CONFIG: research/candidate-03/nt_lvcfr_v3_config.json

jobs:
  staged-btc-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned runtime and uniform proxy contracts
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr_trade_proxy.py &&
              PYTHONPYCACHEPREFIX=/tmp/nt-lvcfr-v3-pycache \
                python -m py_compile \
                  research/candidate-03/nt_lvcfr_trade_proxy.py \
                  research/candidate-03/prepare_nt_lvcfr_trade_proxy.py \
                  research/candidate-03/derive_nt_lvcfr_v3_signals.py
            '

      - name: Restore first-week uniform execution catalog
        id: restore-first
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Prepare first frozen BTC week from official aggTrades
        if: steps.restore-first.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          mkdir -p "$prepared"
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr_trade_proxy.py \
              --week-start 2024-01-08 --output $prepared --config $CONFIG" \
            2>&1 | tee artifacts/candidate-03/nt-lvcfr-v3/validation-1/preparation.log

      - name: Save first-week uniform execution catalog
        if: steps.restore-first.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Derive frozen V3 scenarios for first week
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-1
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v3_signals.py \
              --prepared-root $prepared --output-manifest $out/v3_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared/signals.json")
          count = len(json.loads(path.read_text(encoding="utf-8")))
          if count < 8:
              raise SystemExit(f"first-week V3 opportunity preflight failed: {count} < 8")
          print({"first_week_v3_signals": count})
          PY

      - name: First frozen BTC week — NautilusTrader V3
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-1
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2024-01-08 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Restore second-week uniform execution catalog
        id: restore-second
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Prepare second frozen BTC week from official aggTrades
        if: steps.restore-second.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          mkdir -p "$prepared"
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr_trade_proxy.py \
              --week-start 2025-06-23 --output $prepared --config $CONFIG" \
            2>&1 | tee artifacts/candidate-03/nt-lvcfr-v3/validation-2/preparation.log

      - name: Save second-week uniform execution catalog
        if: steps.restore-second.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Derive frozen V3 scenarios for second week
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-2
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v3_signals.py \
              --prepared-root $prepared --output-manifest $out/v3_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared/signals.json")
          count = len(json.loads(path.read_text(encoding="utf-8")))
          if count < 8:
              raise SystemExit(f"second-week V3 opportunity preflight failed: {count} < 8")
          print({"second_week_v3_signals": count})
          PY

      - name: Second frozen BTC week — NautilusTrader V3
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-2
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2025-06-23 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Restore third-week uniform execution catalog
        id: restore-third
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Prepare third frozen BTC week from official aggTrades
        if: steps.restore-third.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          mkdir -p "$prepared"
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr_trade_proxy.py \
              --week-start 2022-05-16 --output $prepared --config $CONFIG" \
            2>&1 | tee artifacts/candidate-03/nt-lvcfr-v3/validation-3/preparation.log

      - name: Save third-week uniform execution catalog
        if: steps.restore-third.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}

      - name: Derive frozen V3 scenarios for third week
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-3
          mkdir -p "$out"
          sudo chmod -R a+rwX artifacts
          cp "$prepared/signals.json" "$prepared/signals-v1.json"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/derive_nt_lvcfr_v3_signals.py \
              --prepared-root $prepared --output-manifest $out/v3_signal_manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared/signals.json")
          count = len(json.loads(path.read_text(encoding="utf-8")))
          if count < 8:
              raise SystemExit(f"third-week V3 opportunity preflight failed: {count} < 8")
          print({"third_week_v3_signals": count})
          PY

      - name: Third frozen BTC week — NautilusTrader V3
        shell: bash
        run: |
          set -euo pipefail
          prepared=artifacts/candidate-03/nt-lvcfr-v3/validation-3/prepared
          out=artifacts/candidate-03/nt-lvcfr-v3/validation-3
          sudo chmod -R a+rwX artifacts
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
              --week-start 2022-05-16 --prepared-root $prepared --output $out --config $CONFIG" \
            2>&1 | tee "$out/backtest.log"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config "$CONFIG" | tee "$out/gate.json"

      - name: Preserve staged V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-nt-lvcfr-v3-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr-v3/**/*.json
            artifacts/candidate-03/nt-lvcfr-v3/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr-v3/**/*.csv
            artifacts/candidate-03/nt-lvcfr-v3/**/*.log
          if-no-files-found: warn
          retention-days: 30
