name: candidate-57-trendrider-pullback-long-v1-endflat

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-trendrider-pullback-long-v1-endflat.yml"
      - "research/candidate-57/TRENDRIDER_PULLBACK_LONG_V1_FREEZE.md"
      - "research/candidate-57/router_trendrider_pullback_1h.py"
      - "research/candidate-57/router_trendrider_runtime.py"
      - "research/candidate-57/strategy_trendrider_pullback_1h.py"
      - "research/candidate-57/strategy_trendrider_pullback_runoff_v1.py"
      - "research/candidate-57/trendrider_pullback_long_v1_campaign.py"
      - "research/candidate-57/trendrider_pullback_long_v1_endflat_rerun.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-trendrider-pullback-long-v1-endflat
  cancel-in-progress: true

jobs:
  implementation-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble unchanged policy with end-flat runoff wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/TRENDRIDER_PULLBACK_LONG_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_trendrider_pullback_1h.py research/candidate-51/router_trendrider_impl.py
          cp research/candidate-57/router_trendrider_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_trendrider_pullback_1h.py research/candidate-51/strategy_trendrider_base.py
          cp research/candidate-57/strategy_trendrider_pullback_runoff_v1.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_trendrider_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_trendrider_base.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/trendrider_pullback_long_v1_campaign.py \
            research/candidate-57/trendrider_pullback_long_v1_endflat_rerun.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove implementation-only change
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51:research/candidate-57 uv run python - <<'PY'
          import inspect
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_trendrider_base import Candidate35Strategy as FrozenPolicy

          assert issubclass(Candidate35Strategy, FrozenPolicy)
          config_source = inspect.getsource(Candidate35Config)
          assert "trendrider_signal_end_ns" in config_source
          wrapper = inspect.getsource(Candidate35Strategy._on_complete_universe_minute)
          assert "super()._on_complete_universe_minute" in wrapper
          assert "ts_event) <= cutoff" in wrapper
          assert "_record_equity" in wrapper
          assert "route_universe" not in wrapper
          assert "_submit_decision" not in wrapper
          assert "alpha_policy_changed_for_runoff" in inspect.getsource(Candidate35Strategy.__init__)
          print("implementation-only close runoff contract verified")
          PY

      - name: Rerun both frozen development regimes with close runoff
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-trendrider-pullback-long-v1-endflat-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/trendrider_pullback_long_v1_endflat_rerun.py \
            2>&1 | tee .work/candidate-57-trendrider-pullback-long-v1-endflat-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact causal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_trendrider_impl.py \
            research/candidate-51/strategy_trendrider_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/trendrider-pullback-long-v1-endflat
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist TrendRider end-flat causal evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete implementation rerun
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-trendrider-pullback-long-v1-endflat
          path: |
            research/candidate-57/evidence/trendrider-pullback-long-v1-endflat
            artifacts/candidate-57-trendrider-pullback-long-v1-endflat
            .work/candidate-57-trendrider-pullback-long-v1-endflat-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "TrendRider end-flat rerun failed mechanically; status=$status"
            exit "${status:-1}"
          fi
