name: candidate-easychart-ml3-integrated

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/candidate-easychart-ml3-integrated.yml"
      - "research/candidate-easychart_ml3_breakthrough/integrated_auction.py"
      - "research/candidate-easychart_ml3_breakthrough/execution_integrated.py"
      - "research/candidate-easychart_ml3_breakthrough/run_mtf_backtest_integrated*.py"
      - "research/candidate-easychart_ml3_breakthrough/tests/test_integrated_auction.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-ml3-integrated
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  locate-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish active diagnostic locator
        run: |
          set -euo pipefail
          mkdir -p research/_run_locators
          printf '%s\n' '${{ github.run_id }}' > research/_run_locators/ML3_INTEGRATED_RUN_ID
          printf '%s\n' '${{ github.sha }}' > research/_run_locators/ML3_INTEGRATED_RUN_SHA
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_run_locators/ML3_INTEGRATED_RUN_ID research/_run_locators/ML3_INTEGRATED_RUN_SHA
          git commit -m "chore(research): publish integrated diagnostic locator [skip ci]"
          git push origin HEAD:research_ML3

  diagnose-integrated-policy:
    if: github.actor != 'github-actions[bot]'
    needs: locate-run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_ml3_breakthrough:research/candidate-easychart_ml3v3:research/candidate-easychart_ml3v2:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-ml3-integrated/diagnostic
      OUT: artifacts/candidate-easychart-ml3-integrated/diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Exercise integrated auction contracts
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-easychart_ml3_breakthrough/*.py research/candidate-easychart_ml3_breakthrough/tests/*.py
          python - <<'PY'
          import runpy
          from pathlib import Path
          total = 0
          for path in sorted(Path("research/candidate-easychart_ml3_breakthrough/tests").glob("test_*.py")):
              namespace = runpy.run_path(str(path))
              for name, value in namespace.items():
                  if name.startswith("test_") and callable(value):
                      value()
                      total += 1
          print(f"executed {total} integrated-auction tests")
          if total < 17:
              raise SystemExit("integrated policy test coverage disappeared")
          PY
      - name: Harvest hierarchical price-volume decisions
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_ml3_breakthrough/run_mtf_backtest_integrated_shadow.py \
            --start 2025-08-10 \
            --end 2025-08-14 \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/shadow.log"
          python research/candidate-easychart_ml3v2/harvest_ml1.py \
            --start 2025-08-10 \
            --end 2025-08-14 \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/harvest.log"
          python research/candidate-easychart_ml3v3/build_ml3v3_dataset.py --run-output "$OUT" \
            2>&1 | tee "$OUT/build_dataset.log"
          python research/candidate-easychart_ml3_breakthrough/summarize_intrinsic_run.py --run-output "$OUT" \
            2>&1 | tee "$OUT/summary.log"
          test -s "$OUT/intrinsic_run_summary.json"
          test -s "$OUT/ml3v3_dataset.csv"
          test -s "$OUT/decision_events.csv"
      - name: Preserve integrated trade-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml3-integrated-diagnostic-${{ github.sha }}
          path: artifacts/candidate-easychart-ml3-integrated/diagnostic/
          if-no-files-found: warn
          retention-days: 14
