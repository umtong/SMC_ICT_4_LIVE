name: Candidate 11 relative failed-auction diagnostic

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/relative_failed_auction_v1/bar_adapter.py"
      - "research/candidate-11/relative_failed_auction_v1/global_allocator.py"
      - "research/candidate-11/relative_failed_auction_v1/logic.py"
      - "research/candidate-11/relative_failed_auction_v1/market_leadership.py"
      - "research/candidate-11/relative_failed_auction_v1/session_engine.py"
      - "research/candidate-11/relative_failed_auction_v1/run.py"
      - "research/candidate-11/relative_failed_auction_v1/run_leadership_scdam.py"
      - "research/candidate-11/relative_failed_auction_v1/run_leadership_scdam_base.py"
      - "research/candidate-11/relative_failed_auction_v1/runner_materializer.py"
      - "research/candidate-11/relative_failed_auction_v1/portfolio_materializer.py"
      - "research/candidate-11/relative_failed_auction_v1/semantic_execution.py"
      - "research/candidate-11/relative_failed_auction_v1/semantic_logic.py"
      - "research/candidate-11/relative_failed_auction_v1/semantic_market_leadership.py"
      - "research/candidate-11/relative_failed_auction_v1/session_auction_i7.py"
      - "research/candidate-11/relative_failed_auction_v1/session_auction_bridge.py"
      - "research/candidate-11/relative_failed_auction_v1/session_i7_config.json"
      - "research/candidate-11/relative_failed_auction_v1/evidence_audit.py"
      - "research/candidate-11/relative_failed_auction_v1/base_config.json"
      - "research/candidate-11/relative_failed_auction_v1/candidate14_runner.py"
      - "research/candidate-11/relative_failed_auction_v1/aggregate.py"
      - "research/candidate-11/relative_failed_auction_v1/run_week.sh"
      - "research/candidate-11/relative_failed_auction_v1/protocol.json"
      - "research/candidate-11/relative_failed_auction_v1/test_*.py"
      - ".github/workflows/candidate-11-relative-failed-auction-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-11-rfar-${{ github.sha }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify environment, source lock and RFAR contracts
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CAND="$GITHUB_WORKSPACE/research/candidate-11/relative_failed_auction_v1"
          smc4 doctor
          export PYTHONPATH="$CAND:$GITHUB_WORKSPACE/src"
          python -m py_compile "$CAND"/*.py
          python -m unittest discover -s "$CAND" -p 'test_*.py' -v
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import subprocess

          root = Path("research/candidate-11/relative_failed_auction_v1")
          protocol = json.loads((root / "protocol.json").read_text(encoding="utf-8"))
          assert protocol["validation_mode"] == "diagnostic"
          assert protocol["success_claim"] is False
          assert protocol["diagnostic_lineage"]["claim_ineligible"] is True
          assert protocol["aggregate_gate"]["risk_fraction"] == 0.03
          assert protocol["aggregate_gate"]["global_pending_entry_plus_position_limit"] == 1
          assert tuple(sorted(protocol["selection"]["holdouts"])) == tuple(f"D{i}" for i in range(1, 9))
          mismatches = []
          for name, expected in protocol["locked_source"]["blobs"].items():
              actual = subprocess.check_output(
                  ["git", "hash-object", str(root / name)], text=True
              ).strip()
              if actual != expected:
                  mismatches.append((name, expected, actual))
          if mismatches:
              raise SystemExit(f"RFAR source-lock mismatch: {mismatches}")
          PY

  evaluate:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        interval: [D1, D2, D3, D4, D5, D6, D7, D8]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run frozen RFAR Nautilus diagnostic
        shell: bash
        run: |
          set -euo pipefail
          chmod +x research/candidate-11/relative_failed_auction_v1/run_week.sh
          bash research/candidate-11/relative_failed_auction_v1/run_week.sh "${{ matrix.interval }}"
      - name: Remove downloaded market archives
        if: always()
        shell: bash
        run: |
          rm -rf "research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/data"
      - name: Transport auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate11-rfar-${{ matrix.interval }}
          path: |
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/run.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/data_manifest.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/metrics.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/summary.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/audit.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/audit.md
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/source_lock.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/effective_config.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/scenario_events.jsonl
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/submitted_plans.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/order_lifecycle.json
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/orders.csv
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/positions.csv
            research/candidate-11/relative_failed_auction_v1/results/${{ matrix.interval }}/account.csv
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

  aggregate:
    if: ${{ needs.static.result == 'success' && needs.evaluate.result == 'success' }}
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download diagnostic evidence
        uses: actions/download-artifact@v4
        with:
          pattern: candidate11-rfar-D*
          path: artifacts
      - name: Aggregate and persist on latest unchanged source
        shell: bash
        run: |
          set -euo pipefail
          CAND=research/candidate-11/relative_failed_auction_v1
          rm -rf "$CAND/results"
          mkdir -p "$CAND/results"
          for interval in D1 D2 D3 D4 D5 D6 D7 D8; do
            src="artifacts/candidate11-rfar-$interval"
            test -d "$src"
            mkdir -p "$CAND/results/$interval"
            cp -a "$src/." "$CAND/results/$interval/"
            for file in \
              run.json data_manifest.json metrics.json summary.json audit.json audit.md \
              source_lock.json effective_config.json scenario_events.jsonl \
              submitted_plans.json order_lifecycle.json orders.csv positions.csv account.csv; do
              test -s "$CAND/results/$interval/$file"
            done
          done

          python "$CAND/aggregate.py" \
            --results "$CAND/results" \
            --protocol "$CAND/protocol.json" \
            --output "$CAND/aggregate.json"

          SNAPSHOT=/tmp/candidate11-rfar-evidence
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp -a "$CAND/results" "$SNAPSHOT/"
          cp "$CAND/aggregate.json" "$SNAPSHOT/aggregate.json"
          cp "$CAND/RESULT.md" "$SNAPSHOT/RESULT.md"

          git fetch origin research/candidate-11
          latest_head="$(git rev-parse origin/research/candidate-11)"
          if ! git diff --quiet "$GITHUB_SHA" "$latest_head" -- \
            "$CAND/bar_adapter.py" "$CAND/global_allocator.py" "$CAND/logic.py" \
            "$CAND/market_leadership.py" "$CAND/session_engine.py" "$CAND/run.py" \
            "$CAND/run_leadership_scdam.py" "$CAND/run_leadership_scdam_base.py" \
            "$CAND/runner_materializer.py" "$CAND/portfolio_materializer.py" \
            "$CAND/semantic_execution.py" "$CAND/semantic_logic.py" \
            "$CAND/semantic_market_leadership.py" "$CAND/session_auction_i7.py" \
            "$CAND/session_auction_bridge.py" "$CAND/session_i7_config.json" \
            "$CAND/evidence_audit.py" "$CAND/base_config.json" "$CAND/protocol.json"; then
            echo "RFAR strategy changed during evaluation; refusing stale evidence"
            exit 1
          fi
          git checkout -B research/candidate-11 "$latest_head"
          rm -rf "$CAND/results"
          cp -a "$SNAPSHOT/results" "$CAND/results"
          cp "$SNAPSHOT/aggregate.json" "$CAND/aggregate.json"
          cp "$SNAPSHOT/RESULT.md" "$CAND/RESULT.md"

          git config user.name "candidate-11-bot"
          git config user.email "candidate-11-bot@users.noreply.github.com"
          git add -A "$CAND/results" "$CAND/aggregate.json" "$CAND/RESULT.md"
          if ! git diff --cached --quiet; then
            git commit -m "candidate-11: record RFAR diagnostic evidence [skip ci]"
            git push origin HEAD:research/candidate-11
          fi
