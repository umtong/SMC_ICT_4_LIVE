name: candidate-35-smoke
on:
  push:
    branches: ["research/candidate-35"]
    paths:
      - "research/candidate-35/**"
      - ".github/workflows/candidate-35-smoke.yml"
  workflow_dispatch:
concurrency:
  group: candidate-35-smoke
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-35:research/candidate-29:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/c35-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified raw-data cache
        uses: actions/cache@v4
        with:
          path: .cache/c35-smoke
          key: candidate35-binance-2026-07-01-v1
      - name: Verify environment and pure contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-35
          python -m unittest discover -s research/candidate-35 -p 'test_*.py' -v
      - name: Run one four-asset Nautilus account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-35/launch.py \
            --config research/candidate-35/config.json \
            --start 2026-07-01 \
            --end 2026-07-01 \
            --cache .cache/c35-smoke \
            --workspace .cache/c35-smoke-work \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"
      - name: Verify result contract
        if: always()
        shell: bash
        run: |
          if test -f "$ROOT/metrics.json"; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          x=json.loads((root/'metrics.json').read_text())
          assert x['universe']==['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT']
          assert x['single_continuous_account'] is True
          assert x['single_strategy_process'] is True
          assert x['global_entry_or_position_limit']==1
          assert x['strategy_diagnostics']['max_open_positions_observed'] <= 1
          print(json.dumps({k:x.get(k) for k in ['ending_nav','total_return','geometric_daily_growth','max_drawdown','trades','wins','win_rate','gate_pass','position_counts_by_symbol']},indent=2,sort_keys=True))
          PY
          else
            echo 'metrics.json absent'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate35-smoke-${{ github.sha }}
          path: artifacts/c35-smoke/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
