name: candidate-57-zaratustra-v5-reentry-forensic-v5

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-zaratustra-v5-reentry-forensic-v5.yml"
      - "research/candidate-57/ZARATUSTRA_V5_REENTRY_EPISODE_FORENSIC_V5.md"
      - "research/candidate-57/router_zaratustra_v5.py"
      - "research/candidate-57/router_zaratustra_runtime.py"
      - "research/candidate-57/strategy_zaratustra_v5.py"
      - "research/candidate-57/strategy_zaratustra_v5_lifecycle_forensic_v2.py"
      - "research/candidate-57/strategy_zaratustra_v5_reentry_forensic_v5.py"
      - "research/candidate-57/zaratustra_v5_reentry_forensic_v5.py"
      - "research/candidate-57/trade_ledger_forensics.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-zaratustra-v5-reentry-forensic-v5
  cancel-in-progress: true

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble continuous-episode instrumentation
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/ZARATUSTRA_V5_REENTRY_EPISODE_FORENSIC_V5.md
          test -f research/candidate-57/evidence/zaratustra-v5-source-v1/cases/continuous_30d-source_level_both.json
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_zaratustra_v5.py research/candidate-51/router_zaratustra_impl.py
          cp research/candidate-57/router_zaratustra_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_zaratustra_v5.py research/candidate-51/strategy_zaratustra_source_base.py
          cp research/candidate-57/strategy_zaratustra_v5_lifecycle_forensic_v2.py research/candidate-51/strategy_zaratustra_lifecycle_base.py
          cp research/candidate-57/strategy_zaratustra_v5_reentry_forensic_v5.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_zaratustra_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_zaratustra_source_base.py \
            research/candidate-51/strategy_zaratustra_lifecycle_base.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/zaratustra_v5_reentry_forensic_v5.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove no policy change
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from strategy import Candidate35Strategy
          from strategy_zaratustra_lifecycle_base import Candidate35Strategy as Lifecycle
          assert issubclass(Candidate35Strategy, Lifecycle)
          for source in (
              inspect.getsource(Candidate35Strategy._update_source_episode_clock),
              inspect.getsource(Candidate35Strategy._tag_new_account_entry),
          ):
              for forbidden in ('submit_order', '_submit_decision', 'close_all_positions', 'cancel_all_orders'):
                  assert forbidden not in source, forbidden
          print('continuous episode clock and tags cannot change account actions')
          PY

      - name: Reproduce June account and compare first entries with reentries
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-zara-reentry-forensic-v5-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/zaratustra_v5_reentry_forensic_v5.py \
            2>&1 | tee .work/candidate-57-zara-reentry-forensic-v5-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact forensic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_zaratustra_impl.py \
            research/candidate-51/strategy_zaratustra_source_base.py \
            research/candidate-51/strategy_zaratustra_lifecycle_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/zara-reentry-forensic-v5
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist Zaratustra reentry evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete forensic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-zaratustra-v5-reentry-forensic-v5
          path: |
            research/candidate-57/evidence/zara-reentry-forensic-v5
            .work/candidate-57-zara-reentry-forensic-v5-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce account identity and mechanics
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "Zaratustra reentry forensic failed; status=$status"
            exit "${status:-1}"
          fi
