name: Candidate 15 V23 exact ten-second quarter-hour diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v23-quarter-hour-10s.json"
      - "research/candidate-15/diagnose_v23_quarter_hour_10s.py"
      - ".github/workflows/candidate-15-v23-quarter-hour-10s.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v23-quarter-hour-10s-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile research/candidate-15/diagnose_v23_quarter_hour_10s.py
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(
              Path('research/candidate-15/protocol-v23-quarter-hour-10s.json').read_text()
          )
          assert protocol['schema'] == 'candidate-15-v23-quarter-hour-10s-order-imbalance-v1'
          assert protocol['evaluation']['global_position_limit'] == 1
          assert protocol['fixed_rules']['execution_round_trip_cost_bps'] == 16.0
          assert protocol['fixed_rules']['funding_and_unmodeled_impact_reserve_bps'] == 4.0
          assert protocol['data']['first_second_inclusive'] == 0
          assert protocol['data']['last_second_inclusive'] == 9
          PY

      - name: Run exact ten-second quarter-hour mechanism diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/src"
          python research/candidate-15/diagnose_v23_quarter_hour_10s.py \
            --protocol research/candidate-15/protocol-v23-quarter-hour-10s.json \
            --output research/candidate-15/v23/quarter_hour_10s/results

      - name: Remove downloaded market archives
        if: always()
        shell: bash
        run: rm -rf research/candidate-15/v23/quarter_hour_10s/results/data

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v23/quarter_hour_10s/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V23_QUARTER_HOUR_10S_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v23-bot
          git config user.email candidate-15-v23-bot@users.noreply.github.com
          git add \
            research/candidate-15/V23_QUARTER_HOUR_10S_RESULT.md \
            research/candidate-15/v23/quarter_hour_10s/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v23: persist exact quarter-hour evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v23-quarter-hour-10s-${{ github.run_id }}
          path: |
            research/candidate-15/V23_QUARTER_HOUR_10S_RESULT.md
            research/candidate-15/v23/quarter_hour_10s/results
          if-no-files-found: warn
          retention-days: 30
