name: candidate-easychart-re1-continuation-lifecycle-v3-fast

on:
  push:
    branches: ["ML_a"]
    paths:
      - ".github/workflows/candidate-easychart-re1-continuation-lifecycle-v2-fast.yml"
      - "research/candidate-easychart_re1/easychart_re1_continuation_target_refresh.py"
      - "research/candidate-easychart_re1/easychart_re1_continuation_first_return.py"
      - "research/candidate-easychart_re1/easychart_re1_continuation_footprint.py"
      - "research/candidate-easychart_re1/easychart_re1_continuation_source_return.py"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-continuation-lifecycle-v3-fast
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  corrected-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        policy: [target_refresh, first_return, ob_or_fvg, source_return]
        symbol: [BTCUSDT, SOLUSDT]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-continuation-v3/${{ matrix.policy }}-${{ matrix.symbol }}
      OUT: artifacts/candidate-easychart-re1-continuation-v3/${{ matrix.policy }}-${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - name: Select corrected policy
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.policy }}" in
            target_refresh) runner=run_mtf_backtest_re1_continuation_target_refresh.py ;;
            first_return) runner=run_mtf_backtest_re1_continuation_first_return.py ;;
            ob_or_fvg) runner=run_mtf_backtest_re1_continuation_footprint.py ;;
            source_return) runner=run_mtf_backtest_re1_continuation_source_return.py ;;
            *) exit 2 ;;
          esac
          echo "$runner" > /tmp/runner
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_continuation_target_refresh.py \
            research/candidate-easychart_re1/easychart_re1_continuation_first_return.py \
            research/candidate-easychart_re1/easychart_re1_continuation_footprint.py \
            research/candidate-easychart_re1/easychart_re1_continuation_source_return.py \
            research/candidate-easychart_re1/$runner
      - name: Run corrected continuation lifecycle
        shell: bash
        run: |
          set -euo pipefail
          runner=$(cat /tmp/runner)
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/$runner \
            --start 2026-07-01 \
            --end 2026-07-03 \
            --warmup-days 7 \
            --symbols "${{ matrix.symbol }}" \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0
      - name: Print corrected trade and lifecycle result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path("${{ env.OUT }}")
          result = {"policy": "${{ matrix.policy }}", "symbol": "${{ matrix.symbol }}"}
          metrics_path = root / "metrics.json"
          trades_path = root / "trade_audit.csv"
          events_path = root / "scenario_events.jsonl"
          if metrics_path.exists():
              metrics = json.loads(metrics_path.read_text())
              result["account"] = {
                  key: metrics.get(key)
                  for key in (
                      "calendar_days", "independent_trades_per_day", "final_nav",
                      "total_return", "max_drawdown_pct", "closed_positions",
                  )
              }
          trades = pd.read_csv(trades_path) if trades_path.exists() else pd.DataFrame()
          result["trades"] = trades[[
              column for column in (
                  "symbol", "side", "family", "planned_gross_rr", "actual_net_r",
                  "duration_ns", "exit_role", "ts_opened", "planned_entry",
                  "planned_stop", "planned_target",
              ) if column in trades
          ]].to_dict("records") if not trades.empty else []
          counts = {}
          if events_path.exists():
              for line in events_path.read_text().splitlines():
                  event = json.loads(line)
                  kind = str(event.get("scenario_kind", ""))
                  if "local_continuation" in kind or "fvg_fallback" in kind:
                      counts[kind] = counts.get(kind, 0) + 1
          result["continuation_event_counts"] = counts
          print("CORRECTED_LIFECYCLE_RESULT=" + json.dumps(result, sort_keys=True, default=str))
          PY
      - name: Preserve actual account and scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-continuation-v3-${{ matrix.policy }}-${{ matrix.symbol }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-continuation-v3/${{ matrix.policy }}-${{ matrix.symbol }}/**
          if-no-files-found: warn
          retention-days: 30
