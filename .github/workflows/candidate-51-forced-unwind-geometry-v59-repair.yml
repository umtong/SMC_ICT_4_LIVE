name: candidate-51-forced-unwind-geometry-v59-repair

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-forced-unwind-geometry-v59-repair.yml"
      - "research/candidate-51/forced_unwind_geometry_v59_repair.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: candidate-51-forced-unwind-geometry-v59-repair
  cancel-in-progress: true

jobs:
  zero_periods:
    strategy:
      fail-fast: false
      matrix:
        period:
          - {label: dev_riskoff_2022_01, start: 2022-01-10, end: 2022-01-23, split: development}
          - {label: dev_cascade_2022_06, start: 2022-06-06, end: 2022-06-19, split: development}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1
          sparse-checkout: |
            research/candidate-51
            pyproject.toml
            uv.lock
            src
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Emit explicit zero-opportunity shard
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          python -m py_compile research/candidate-51/forced_unwind_geometry_v59_repair.py
          output="artifacts/candidate-51/forced-unwind-geometry-v59/${{ matrix.period.label }}"
          uv run python research/candidate-51/forced_unwind_geometry_v59_repair.py run \
            --period-label "${{ matrix.period.label }}" --split "${{ matrix.period.split }}" \
            --start "${{ matrix.period.start }}" --end "${{ matrix.period.end }}" \
            --events research/candidate-51/evidence/derivatives-impulse-v57/EVENTS.csv \
            --output "$output"
          test -s "$output/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-forced-unwind-geometry-v59-zero-${{ matrix.period.label }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/forced-unwind-geometry-v59/${{ matrix.period.label }}/result.json

  aggregate:
    needs: zero_periods
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1
          sparse-checkout: |
            research/candidate-51
            pyproject.toml
            uv.lock
            src
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31422094300
          pattern: candidate-51-forced-unwind-geometry-v59-*
          path: downloaded/original
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-51-forced-unwind-geometry-v59-zero-*
          path: downloaded/zero
      - name: Aggregate ten frozen periods
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded -name result.json -type f | wc -l | tr -d ' ')"
          test "$count" -eq 10
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          output=artifacts/candidate-51/forced-unwind-geometry-v59
          uv run python research/candidate-51/forced_unwind_geometry.py aggregate \
            --results-root downloaded --output "$output"
          test -s "$output/GEOMETRY.json"
          test -s "$output/GEOMETRY.md"
          test -s "$output/GEOMETRY.csv"
          test -s "$output/RECORDS.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-forced-unwind-geometry-v59-anatomy-repaired
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/forced-unwind-geometry-v59
      - name: Commit compact geometry evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/forced-unwind-geometry-v59
          destination=research/candidate-51/evidence/forced-unwind-geometry-v59
          mkdir -p "$destination"
          cp "$source/GEOMETRY.json" "$destination/GEOMETRY.json"
          cp "$source/GEOMETRY.md" "$destination/GEOMETRY.md"
          cp "$source/GEOMETRY.csv" "$destination/GEOMETRY.csv"
          cp "$source/RECORDS.csv" "$destination/RECORDS.csv"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add "$destination"
          git commit -m "candidate51: record repaired forced-unwind geometry"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-51 --depth=1
            if git rebase FETCH_HEAD && git push origin HEAD:research/candidate-51; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
