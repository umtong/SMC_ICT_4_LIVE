name: candidate-easychart-re1-counterfactual-harvest-diagnostic
on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths: ["research/candidate-easychart_re1/.counterfactual_harvest_dispatch_marker"]
  workflow_dispatch:
concurrency: {group: candidate-easychart-re1-counterfactual-harvest-diagnostic, cancel-in-progress: true}
permissions: {contents: read, packages: read}
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: february-2025-short, start: 2025-02-01, end: 2025-02-10}
          - {period: live-examples-2025-short, start: 2025-08-10, end: 2025-08-20}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/candidate-easychart-re1-counterfactual-harvest/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-counterfactual-harvest/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile harvest candidate
        run: python -m py_compile research/candidate-easychart_re1/counterfactual_plan_harvest.py research/candidate-easychart_re1/run_mtf_backtest_re1_candidate_harvest.py
      - name: Run broad causal candidate and label all plans
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_candidate_harvest.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --warmup-days 14 --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$OUT" --fee-profile usd_m_vip0
      - name: Verify answer sheet
        run: |
          test -s "$OUT/counterfactual_plans.csv"
          test -s "$OUT/counterfactual_summary.json"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-counterfactual-harvest-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-counterfactual-harvest/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
