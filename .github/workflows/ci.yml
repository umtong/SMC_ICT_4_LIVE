name: foundation-ci

on:
  push:
    branches: [main, "agent/**", "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.25"

      - name: Resolve and install the pinned foundation
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            uv lock
          fi
          uv sync --locked

      - name: Commit the generated lock once
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/bootstrap-research-foundation'
        run: |
          if git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "lock foundation dependencies"
          git push

      - name: Compile
        run: uv run python -m compileall -q src scripts tests

      - name: Unit and integration tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Runtime doctor
        run: uv run smc4 doctor

      - name: NautilusTrader smoke
        run: uv run smc4 smoke --output artifacts/ci-smoke

      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-smoke-${{ github.sha }}
          path: artifacts/ci-smoke
          if-no-files-found: warn
