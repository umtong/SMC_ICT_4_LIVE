name: candidate-02-v46-confirmation

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-v46/collect_confirmation_week.py"
      - ".github/workflows/candidate-02-v46-confirmation.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect locked v46 confirmation data
        run: python .candidate-02-v46/collect_confirmation_week.py
      - name: Upload immutable v46 confirmation data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v46-confirmation-${{ github.sha }}
          path: |
            .cache/candidate-02/v46-confirmation
            artifacts/candidate-02-v46-confirmation
          retention-days: 14
