name: candidate-21-response-development

on:
  workflow_dispatch:
  push:
    branches: ["research/candidate-21"]
    paths:
      - "research/candidate-21/boundary_response_router.py"
      - "research/candidate-21/candidate21_response_strategy.py"
      - "research/candidate-21/candidate21_response_backtest.py"
      - "research/candidate-21/candidate_response.py"
      - "research/candidate-21/latency_aligned_tick_clock.py"
      - "research/candidate-21/tests/test_boundary_response_router.py"
      - "research/candidate-21/tests/test_latency_aligned_tick_clock.py"
      - ".github/workflows/candidate-21-response-development.yml"

concurrency:
  group: candidate-21-response-development
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  response-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-21:research/candidate-16:research/candidate-20:research/candidate-19:research/candidate-18:research/candidate-17:research/candidate-05
    steps:
      - uses: actions/checkout@v4
      - name: Verify response-window contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-21
          python -m unittest discover -s research/candidate-21/tests -p 'test_boundary_response_router.py' -v
          python -m unittest discover -s research/candidate-21/tests -p 'test_latency_aligned_tick_clock.py' -v
          python -m unittest discover -s research/candidate-21/tests -p 'test_*.py' -v
          python -m unittest discover -s research/candidate-18/tests -p 'test_fok_execution_contract.py' -v

  observed-development:
    needs: response-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-21:research/candidate-16:research/candidate-20:research/candidate-19:research/candidate-18:research/candidate-17:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-21/response-dev-2024-07-08
    steps:
      - uses: actions/checkout@v4
      - name: Run same-minute response policy
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          mkdir -p "$ROOT"
          python research/candidate-21/candidate_response.py stage \
            --config research/candidate-21/config.json \
            --build-start "2024-07-05" \
            --build-end "2024-07-14" \
            --evaluation-start "2024-07-08" \
            --evaluation-end "2024-07-14" \
            --cache ".cache/candidate-21/response-dev-2024-07-08" \
            --output "$ROOT" \
            --validation-mode "development-observed-period" \
            2>&1 | tee "$ROOT/console.log"
      - name: Summarize response policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          clock = json.loads((root / "execution_clock.json").read_text())
          if clock.get("selection_offset_ns") != 300_000_000:
              raise SystemExit(clock)
          if clock.get("modeled_order_latency_ns") != 250_000_000:
              raise SystemExit(clock)
          if not clock.get("strictly_increasing") or not clock.get("actual_prices_only"):
              raise SystemExit(clock)
          keys = (
              "candidate21_clock_events_armed",
              "candidate21_response_classified",
              "candidate21_response_acceptance",
              "candidate21_response_failed_auction",
              "candidate21_response_unresolved",
              "candidate21_natural_target_geometry_rejected",
              "candidate21_fok_entries",
              "entry_submissions",
              "order_rejections",
          )
          summary = {
              "metrics": metrics,
              "clock": clock,
              "routing": {key: diagnostics.get(key, 0) for key in keys},
          }
          (root / "candidate21_response_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True, allow_nan=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-21-response-dev-${{ github.sha }}
          path: artifacts/candidate-21/response-dev-2024-07-08/**
          if-no-files-found: warn
          retention-days: 90
