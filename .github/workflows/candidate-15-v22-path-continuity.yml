name: Candidate 15 V22 price-path continuity diagnostic

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-15]
    paths:
      - "research/candidate-15/protocol-v22-path-continuity.json"
      - "research/candidate-15/diagnose_v22_path_continuity.py"
      - ".github/workflows/candidate-15-v22-path-continuity.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-15-v22-path-continuity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1

      - name: Verify environment and frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-15/diagnose_v16_index_basis.py \
            research/candidate-15/diagnose_v17_open_interest.py \
            research/candidate-15/run_v17_open_interest.py \
            research/candidate-15/run_v18_spot_perp.py \
            research/candidate-15/diagnose_v21_cojump.py \
            research/candidate-15/diagnose_v22_path_continuity.py
          PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15" python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(Path('research/candidate-15/protocol-v22-path-continuity.json').read_text())
          assert protocol['schema'] == 'candidate-15-v22-price-path-continuity-v1'
          assert protocol['evaluation']['global_position_limit'] == 1
          assert protocol['fixed_rules']['path_window_bars'] == 12
          assert protocol['fixed_rules']['execution_round_trip_cost_bps'] == 16.0
          assert protocol['data']['latest_daily_dates'][-1] == '2026-08-07'
          PY

      - name: Run gradual-information versus discrete-shock diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-15:$GITHUB_WORKSPACE/src"
          python research/candidate-15/diagnose_v22_path_continuity.py \
            --protocol research/candidate-15/protocol-v22-path-continuity.json \
            --output research/candidate-15/v22/path_continuity/results

      - name: Remove downloaded archives
        if: always()
        shell: bash
        run: rm -rf research/candidate-15/v22/path_continuity/results/data

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result_dir="research/candidate-15/v22/path_continuity/results"
          cp "$result_dir/RESULT.md" research/candidate-15/V22_PATH_CONTINUITY_RESULT.md
          git fetch origin research/candidate-15
          [[ "$(git rev-parse origin/research/candidate-15)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-15-v22-bot
          git config user.email candidate-15-v22-bot@users.noreply.github.com
          git add \
            research/candidate-15/V22_PATH_CONTINUITY_RESULT.md \
            research/candidate-15/v22/path_continuity/results
          if ! git diff --cached --quiet; then
            git commit -m "candidate15 v22: persist path-continuity evidence [skip ci]"
            git push origin HEAD:research/candidate-15
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate15-v22-path-continuity-${{ github.run_id }}
          path: |
            research/candidate-15/V22_PATH_CONTINUITY_RESULT.md
            research/candidate-15/v22/path_continuity/results
          if-no-files-found: warn
          retention-days: 30
