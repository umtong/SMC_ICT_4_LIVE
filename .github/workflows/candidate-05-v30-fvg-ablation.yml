name: candidate-05-v30-fvg-ablation

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/evidence/v29b_implementation_control.json"
      - "research/candidate-05/external_acceptance_retest_logic.py"
      - "research/candidate-05/strategy_v30_external_acceptance_retest.py"
      - "research/candidate-05/tests/test_external_acceptance_retest_logic.py"
      - ".github/workflows/candidate-05-v30-fvg-ablation.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  conditional-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v30-fvg-ablation
    steps:
      - uses: actions/checkout@v4

      - name: Run only after a v29b logical failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" research/candidate-05/evidence
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/candidate-05/evidence/v29b_implementation_control.json")
          if p.exists():
              prior = json.loads(p.read_text(encoding="utf-8"))
          else:
              prior = {"classification": "MISSING_V29B_EVIDENCE"}
          classification = str(prior.get("classification", ""))
          run = classification.startswith("LOGIC_FAILURE")
          Path("/tmp/v30_prior.json").write_text(json.dumps(prior, indent=2) + "\n", encoding="utf-8")
          with Path("/tmp/v30.env").open("w", encoding="utf-8") as f:
              f.write(f"RUN_V30={'true' if run else 'false'}\n")
          print(json.dumps({"prior_classification": classification, "run_v30": run}, indent=2))
          PY
          cat /tmp/v30.env >> "$GITHUB_ENV"

      - name: Verify fixed environment and v30 contracts
        id: verify
        if: env.RUN_V30 == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          {
            smc4 doctor
            python -m compileall -q research/candidate-05
            python -m unittest discover -s research/candidate-05/tests -p 'test_*.py' -v
          } 2>&1 | tee "$ROOT/verification.log"
          status=${PIPESTATUS[0]}
          echo "verification_exit_code=$status" > "$ROOT/verification_status.txt"
          exit "$status"

      - name: Run frozen v26 control on fixed Week 1
        if: env.RUN_V30 == 'true' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > research/candidate-05/strategy.py <<'PY'
          from strategy_base import LiquidityResponseConfig
          from strategy_v26 import ScenarioValidEntryStrategy as LiquidityResponseStrategy
          __all__ = ["LiquidityResponseConfig", "LiquidityResponseStrategy"]
          PY
          out="$ROOT/baseline"; mkdir -p "$out"
          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-07-07 --build-end 2023-07-15 \
            --evaluation-start 2023-07-09 --evaluation-end 2023-07-15 \
            --cache .cache/candidate-05-v30/baseline \
            --output "$out" | tee "$out/console.json"

      - name: Run v30 FVG-removal ablation on the same fixed Week 1
        if: env.RUN_V30 == 'true' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > research/candidate-05/strategy.py <<'PY'
          from strategy_base import LiquidityResponseConfig
          from strategy_v30_external_acceptance_retest import ExternalAcceptanceFirstRetestStrategy as LiquidityResponseStrategy
          __all__ = ["LiquidityResponseConfig", "LiquidityResponseStrategy"]
          PY
          out="$ROOT/v30"; mkdir -p "$out"
          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-07-07 --build-end 2023-07-15 \
            --evaluation-start 2023-07-09 --evaluation-end 2023-07-15 \
            --cache .cache/candidate-05-v30/v30 \
            --output "$out" | tee "$out/console.json"

      - name: Persist v30 implementation-versus-logic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/candidate-05-v30-fvg-ablation")
          prior=json.loads(Path("/tmp/v30_prior.json").read_text(encoding="utf-8"))
          def compact(name):
              p=root/name/"metrics.json"
              if not p.exists(): return {"available":False}
              m=json.loads(p.read_text(encoding="utf-8")); d=m.get("strategy_diagnostics",{})
              checks={
                  "engine_is_nautilus":m.get("engine")=="NautilusTrader BacktestNode",
                  "positive_nav":m.get("ending_nav",0)>0,
                  "no_liquidation":m.get("liquidations",0)==0,
                  "no_order_rejections":d.get("order_rejections",0)==0,
                  "single_entry_intent":d.get("max_simultaneous_entry_intents",0)<=1,
                  "single_position":d.get("max_open_positions_observed",0)<=1,
              }
              return {
                  "available":True,"total_return":m.get("total_return"),
                  "geometric_daily_growth":m.get("geometric_daily_growth"),
                  "max_drawdown":m.get("max_drawdown"),"trades":m.get("trades"),
                  "wins":m.get("wins"),"win_rate":m.get("win_rate"),
                  "profit_factor":m.get("profit_factor"),"active_days":m.get("active_days"),
                  "scenario_metrics":m.get("scenario_metrics",{}),
                  "external_diagnostics":{k:v for k,v in d.items() if k.startswith("external_")},
                  "integrity_checks":checks,"integrity_pass":all(checks.values()),
              }
          baseline=compact("baseline"); candidate=compact("v30")
          branch=candidate.get("scenario_metrics",{}).get("EXTERNAL_ACCEPTANCE_FIRST_RETEST",{"trades":0,"wins":0,"net_pnl":0.0})
          status=(root/"verification_status.txt").read_text(encoding="utf-8").strip() if (root/"verification_status.txt").exists() else "not_run"
          tail=(root/"verification.log").read_text(encoding="utf-8",errors="replace").splitlines()[-140:] if (root/"verification.log").exists() else []
          run=str(prior.get("classification","")).startswith("LOGIC_FAILURE")
          promote=False
          if not run:
              classification="NOT_RUN_PRIOR_WAS_NOT_A_V29B_LOGIC_FAILURE"
          elif status!="verification_exit_code=0":
              classification="IMPLEMENTATION_ERROR_STATIC_OR_CONTRACT"
          elif not baseline.get("available") or not baseline.get("integrity_pass"):
              classification="IMPLEMENTATION_ERROR_BASELINE_CONTROL"
          elif not candidate.get("available") or not candidate.get("integrity_pass"):
              classification="IMPLEMENTATION_ERROR_V30_RUNTIME_OR_EVIDENCE"
          elif int(branch.get("trades",0))==0:
              classification="LOGIC_FAILURE_EXTERNAL_ACCEPTANCE_NO_EXECUTABLE_RETEST"
          elif float(branch.get("net_pnl",0.0))<=0.0:
              classification="LOGIC_FAILURE_EXTERNAL_ACCEPTANCE_RETEST_NONPOSITIVE"
          elif float(candidate["geometric_daily_growth"])<=float(baseline["geometric_daily_growth"]):
              classification="LOGIC_FAILURE_EXTERNAL_ACCEPTANCE_RETEST_DID_NOT_IMPROVE"
          else:
              classification="LOGIC_SCREEN_PASSED_WEEK_1"
              promote=True
          result={
              "schema":"candidate-05-v30-fvg-ablation-v1",
              "source_commit":"${{ github.sha }}","workflow_run_id":"${{ github.run_id }}",
              "prior_v29b_classification":prior.get("classification"),
              "ablation":"remove only the displacement-FVG formation requirement",
              "unchanged":"completed 4h external level, acceptance, first retest, tail flow, depth, stop, real target, costs, 3% risk and Nautilus execution",
              "classification":classification,"promote_to_weeks_2_3":promote,
              "verification_status":status,"verification_log_tail":tail,
              "baseline":baseline,"v30":candidate,"new_branch":branch,
          }
          p=Path("research/candidate-05/evidence/v30_fvg_ablation.json")
          p.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-05/evidence/v30_fvg_ablation.json
          if ! git diff --cached --quiet; then
            git commit -m "candidate-05: record v30 FVG ablation [skip ci]"
            git push origin HEAD:research/candidate-05
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v30-fvg-ablation-${{ github.sha }}
          path: artifacts/candidate-05-v30-fvg-ablation/**
          if-no-files-found: warn
          retention-days: 90
