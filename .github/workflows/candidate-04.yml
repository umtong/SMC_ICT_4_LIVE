name: candidate-04-research

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - "research/candidate-04/**"
      - ".github/workflows/candidate-04.yml"
  workflow_dispatch:
    inputs:
      max_weeks:
        description: "Maximum staged development weeks to run (1-3)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OUTPUT_DIR: artifacts/candidate-04
      DATA_ROOT: .cache/binance-candidate-04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.25"

      - name: Use locked project foundation
        run: |
          uv lock --check
          uv sync --locked

      - name: Verify prebuilt runtime contract
        run: uv run smc4 doctor

      - name: Candidate causal tests
        run: |
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_*.py' -v

      - name: Prefetch frozen development and untouched validation BTC weeks
        run: |
          uv run python - <<'PY'
          import importlib.util
          import json
          from datetime import date
          from pathlib import Path
          import sys

          module_path = Path("research/candidate-04/candidate.py")
          spec = importlib.util.spec_from_file_location("candidate_04_prefetch", module_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          config_path = Path("research/candidate-04/config.json")
          config = module.load_config(config_path)
          windows = [(start, end) for _, start, end in module.load_evaluation_weeks(config_path)]
          validation = json.loads(Path("research/candidate-04/validation-weeks.json").read_text())
          windows.extend(
              (date.fromisoformat(item["start"]), date.fromisoformat(item["end"]))
              for item in validation["weeks"]
          )
          for start, end in windows:
              module.download_binance_week(
                  symbol=config.symbol,
                  interval=config.interval,
                  start=start,
                  end=end,
                  data_root=Path(".cache/binance-candidate-04"),
              )
          PY

      - name: Frozen staged BTC development screening
        env:
          DISPATCH_MAX_WEEKS: ${{ github.event.inputs.max_weeks }}
        run: |
          MAX_WEEKS="${DISPATCH_MAX_WEEKS:-1}"
          mkdir -p "$OUTPUT_DIR"
          uv run python research/candidate-04/candidate.py pipeline \
            --config research/candidate-04/config.json \
            --output "$OUTPUT_DIR" \
            --data-root "$DATA_ROOT" \
            --max-weeks "$MAX_WEEKS" | tee "$OUTPUT_DIR/console.json"

      - name: Print compact evidence
        if: always()
        run: |
          if test -f "$OUTPUT_DIR/pipeline_summary.json"; then
            python -m json.tool "$OUTPUT_DIR/pipeline_summary.json"
          fi

      - name: Preserve candidate evidence and frozen data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-04-${{ github.sha }}
          path: |
            artifacts/candidate-04
            .cache/binance-candidate-04
          if-no-files-found: error
          retention-days: 90
