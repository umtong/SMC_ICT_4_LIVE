name: candidate-47-ichifan-structural-dev-v2

on:
  push:
    branches: ["research/candidate-47"]
    paths: [".github/workflows/candidate-47-ichifan-structural-dev-v2.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  corrected-development-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-ichifan-structural-dev-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-47
      - name: Verify pinned environment and corrected ownership
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-47/ichifan_strategy.py research/candidate-47/ichifan_structural_strategy.py research/candidate-47/ichifan_structural_launch.py
          grep -F 'self._submit_decision(decision, ts_event)' research/candidate-47/ichifan_strategy.py
          python - <<'PY'
          import inspect
          import test_ichifan
          import test_ichifan_structural
          for module in (test_ichifan, test_ichifan_structural):
              tests = [(name, fn) for name, fn in inspect.getmembers(module, inspect.isfunction) if name.startswith("test_")]
              assert tests
              for name, fn in tests:
                  fn()
                  print(f"PASS {module.__name__}.{name}")
          PY
      - name: Run corrected structural-risk account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-47/ichifan_structural_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start 2026-07-01 --end 2026-07-07 \
            --cache .cache/candidate-47-ichifan-structural-dev-v2 \
            --output "$ROOT" --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"
      - name: Verify result and print compact evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          metrics = json.loads((Path(os.environ["ROOT"]) / "metrics.json").read_text())
          d = metrics["strategy_diagnostics"]
          count = int(d.get("ichifan_structural_stop_submissions", 0))
          summary = {
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "win_rate": metrics["win_rate"],
              "profit_factor": metrics["profit_factor"],
              "expectancy_usdt": metrics["expectancy_usdt"],
              "structural_candidates": d.get("ichifan_structural_stop_candidates", 0),
              "structural_submissions": count,
              "structural_failures": d.get("ichifan_structural_stop_failures", 0),
              "mean_stop_fraction": d.get("ichifan_structural_stop_distance_sum", 0.0) / count if count else None,
              "min_stop_fraction": d.get("ichifan_structural_stop_distance_min"),
              "max_stop_fraction": d.get("ichifan_structural_stop_distance_max"),
              "exchange_max_quantity_bounds": d.get("exchange_max_quantity_bounds", 0),
              "gate_checks": metrics["gate_checks"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert count > 0, "owned structural-risk policy was not invoked"
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-ichifan-structural-dev-v2-${{ github.sha }}
          path: artifacts/candidate-47-ichifan-structural-dev-v2/**
          if-no-files-found: warn
          retention-days: 30
