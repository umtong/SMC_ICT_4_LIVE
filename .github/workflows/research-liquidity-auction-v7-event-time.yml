name: Research liquidity auction v7 event time

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v7"]
    paths:
      - ".github/workflows/research-liquidity-auction-v7-event-time.yml"
      - "research/candidate-liquidity-auction-v7/**"

concurrency:
  group: research-liquidity-auction-v7-event-time
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {role: dev, period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {role: dev, period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {role: dev, period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {role: dev, period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
          - {role: cal, period: cal-2026-jan, start: 2026-01-01, end: 2026-01-08}
          - {role: cal, period: cal-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {role: cal, period: cal-2026-apr, start: 2026-04-01, end: 2026-04-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-auction-v7:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/v7-event-time/${{ matrix.period }}
      OUT: artifacts/v7-event-time/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v7
      - run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-auction-v7/event_time_auction_harvest.py \
            --start "$START" --end "$END" --warmup-days 60 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - name: Preserve price-volume path
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" --start "$START" --end "$END" \
            --cache "$CACHE" --output "$OUT/chart"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v7-event-${{ matrix.role }}-${{ matrix.period }}
          path: artifacts/v7-event-time/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30

  route:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-auction-v7:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v7
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v7-event-dev-*
          path: artifacts/v7-event-time/development
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v7-event-cal-*
          path: artifacts/v7-event-time/calibration
      - run: |
          set -euo pipefail
          mkdir -p artifacts/v7-event-time/result
          python research/candidate-liquidity-auction-v7/event_time_router.py \
            --development-root artifacts/v7-event-time/development \
            --fresh-root artifacts/v7-event-time/calibration \
            --output artifacts/v7-event-time/result
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v7-event-time-result
          path: artifacts/v7-event-time/result/**
          if-no-files-found: error
          retention-days: 30
