name: ml1-install-auction-response

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-install-auction-response.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0
      - name: Install mature-liquidity auction response study
        run: |
          mkdir -p research/candidate-easychart_ml1
          echo '' | base64 -d | gzip -dc > research/candidate-easychart_ml1/auction_response_study.py
          printf '%s\n' 'install-v1' > research/candidate-easychart_ml1/.auction_response_dispatch
          python -m py_compile research/candidate-easychart_ml1/auction_response_study.py
      - name: Commit research module
        run: |
          git config user.name "umtong"
          git config user.email "dddgjj03@gmail.com"
          git add research/candidate-easychart_ml1/auction_response_study.py \
                  research/candidate-easychart_ml1/.auction_response_dispatch
          git diff --cached --check
          git commit -m "research(ml1): add mature-liquidity auction response study"
          git push origin HEAD:research_ML1
