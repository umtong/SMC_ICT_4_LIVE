name: Candidate 13 independent frozen holdouts

on:
  push:
    branches:
      - research/candidate-13
    paths:
      - "research/candidate-13/protocol-independent.json"
      - "research/candidate-13/candidate13_runner.py"
      - "research/candidate-13/run_independent_week.sh"
      - "research/candidate-13/bar_adapter.py"
      - "research/candidate-13/global_allocator.py"
      - "research/candidate-13/logic.py"
      - "research/candidate-13/market_leadership.py"
      - "research/candidate-13/session_engine.py"
      - "research/candidate-13/run_leadership_scdam_base.py"
      - "research/candidate-13/run_leadership_scdam.py"
      - "research/candidate-13/runner_materializer.py"
      - "research/candidate-13/semantic_execution.py"
      - "research/candidate-13/semantic_logic.py"
      - "research/candidate-13/semantic_market_leadership.py"
      - "research/candidate-13/semantic_post_gate.py"
      - "research/candidate-13/evidence_audit.py"
      - "research/candidate-13/base_config.json"
      - ".github/workflows/candidate-13-independent.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-13-independent-${{ github.sha }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify environment, frozen source, and semantics
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-13:$GITHUB_WORKSPACE/src"
          python -m py_compile research/candidate-13/*.py
          python -m unittest discover -s research/candidate-13 -p 'test_*.py' -v
          python - <<'PY'
          from pathlib import Path
          from candidate13_runner import load_object, source_lock

          root = Path("research/candidate-13")
          protocol = load_object(root / "protocol-independent.json")
          result = source_lock(protocol)
          assert result["enforced"] is True
          assert result["all_matched"] is True
          print(result["strategy_freeze_commit"])
          PY

  evaluate:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        week: [W15, W16, W17, W18, W19]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run frozen independent NautilusTrader holdout
        shell: bash
        run: |
          set -euo pipefail
          bash research/candidate-13/run_independent_week.sh "${{ matrix.week }}"
      - name: Remove downloaded market archives from evidence payload
        if: always()
        shell: bash
        run: |
          rm -rf "research/candidate-13/independent/results/${{ matrix.week }}/data"
      - name: Upload auditable independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate13-independent-${{ matrix.week }}
          path: |
            research/candidate-13/independent/results/${{ matrix.week }}/run.json
            research/candidate-13/independent/results/${{ matrix.week }}/data_manifest.json
            research/candidate-13/independent/results/${{ matrix.week }}/metrics.json
            research/candidate-13/independent/results/${{ matrix.week }}/summary.json
            research/candidate-13/independent/results/${{ matrix.week }}/audit.json
            research/candidate-13/independent/results/${{ matrix.week }}/audit.md
            research/candidate-13/independent/results/${{ matrix.week }}/source_lock.json
            research/candidate-13/independent/results/${{ matrix.week }}/effective_config.json
            research/candidate-13/independent/results/${{ matrix.week }}/scenario_events.jsonl
            research/candidate-13/independent/results/${{ matrix.week }}/submitted_plans.json
            research/candidate-13/independent/results/${{ matrix.week }}/order_lifecycle.json
            research/candidate-13/independent/results/${{ matrix.week }}/orders.csv
            research/candidate-13/independent/results/${{ matrix.week }}/positions.csv
            research/candidate-13/independent/results/${{ matrix.week }}/account.csv
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download completed independent holdouts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: candidate13-independent-W*
          path: artifacts
      - name: Assemble, aggregate, and persist independent evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/candidate-13
          current_head="$(git rev-parse origin/research/candidate-13)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "stale independent run: $GITHUB_SHA; current branch: $current_head"
            exit 0
          fi

          mkdir -p research/candidate-13/independent/results
          if compgen -G 'artifacts/candidate13-independent-W*' > /dev/null; then
            for dir in artifacts/candidate13-independent-W*; do
              week="${dir##*-}"
              rm -rf "research/candidate-13/independent/results/$week"
              mkdir -p "research/candidate-13/independent/results/$week"
              cp -a "$dir/." "research/candidate-13/independent/results/$week/"
            done
          fi

          python research/candidate-13/aggregate.py \
            --results research/candidate-13/independent/results \
            --protocol research/candidate-13/protocol-independent.json \
            --output research/candidate-13/independent/aggregate.json

          latest_head="$(git ls-remote origin refs/heads/research/candidate-13 | cut -f1)"
          if [[ "$latest_head" != "$GITHUB_SHA" ]]; then
            echo "branch advanced during independent evaluation; evidence remains an artifact only"
            exit 0
          fi

          git config user.name "candidate-13-bot"
          git config user.email "candidate-13-bot@users.noreply.github.com"
          git add research/candidate-13/independent
          if ! git diff --cached --quiet; then
            git commit -m "candidate-13: record independent W15-W19 evidence [skip ci]"
            git push origin HEAD:research/candidate-13
          fi
      - name: Upload independent aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate13-independent-aggregate-${{ github.run_id }}
          path: |
            research/candidate-13/independent/aggregate.json
            research/candidate-13/independent/RESULT.md
          if-no-files-found: warn
          retention-days: 30
