name: candidate-02-v77-nautilustrader-second-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v77-week2.yml"
      - "research/candidate-02/v77_week2_lock.json"

permissions:
  contents: write
  actions: read

jobs:
  second-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gate on immutable second-week lock
        id: gate
        shell: bash
        run: |
          if [[ -f research/candidate-02/v77_week2_lock.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No v77 plateau promotion lock; no second-week data will be collected."
          fi

      - name: Verify fixed runtime and unchanged rule
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v75_quarter_hour_core.py \
            research/candidate-02/v76_metaorder_wave_core.py \
            research/candidate-02/v76_nt_backtest.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v77_week2_lock.json').read_text())
          cfg=Path('research/candidate-02/v77_selected_config.json').read_bytes()
          assert lock['status']=='LOCKED_BEFORE_SECOND_WEEK_COLLECTION'
          assert lock['custom_backtest_engine'] is False
          assert float(lock['risk_fraction'])==0.03
          assert hashlib.sha256(cfg).hexdigest()==lock['selected_config_sha256']
          selected=json.loads(cfg)
          assert float(selected['risk']['risk_fraction'])==0.03
          assert selected['risk']['maximum_notional_cap'] is None
          assert selected['risk']['score_risk_multiplier'] is None
          PY

      - name: Prepare generic v75 direct-data tools for the exact locked week
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v77-week2-tools inputs/v77-week2
          cp -a .candidate-02-v75 /tmp/v77-week2-tools
          python - <<'PY'
          from datetime import date
          import json, re
          from pathlib import Path

          lock=json.loads(Path('research/candidate-02/v77_week2_lock.json').read_text())
          new_start=date.fromisoformat(lock['second_week']['start_utc'][:10])
          date_ctor=re.compile(r'EVALUATION_START\s*=\s*date\(\s*\d{4}\s*,\s*\d{1,2}\s*,\s*\d{1,2}\s*\)')
          collector_count=0
          for path in Path('/tmp/v77-week2-tools').rglob('*'):
              if not path.is_file() or path.suffix not in {'.py','.json','.md'}:
                  continue
              text=path.read_text(encoding='utf-8', errors='strict')
              text=text.replace('inputs/v75-first-week','inputs/v77-week2')
              text=text.replace('candidate-02-v75-first-week','candidate-02-v77-week2')
              text=text.replace('v75-first-week','v77-week2')
              if path.name.startswith('collect') and path.suffix=='.py':
                  replacement=f'EVALUATION_START = date({new_start.year}, {new_start.month}, {new_start.day})'
                  text,count=date_ctor.subn(replacement,text)
                  collector_count+=count
              path.write_text(text,encoding='utf-8')
          if collector_count != 1:
              raise RuntimeError(f'expected one explicit EVALUATION_START constructor, found {collector_count}')
          collector=next(Path('/tmp/v77-week2-tools').glob('collect*.py'))
          materialized=collector.read_text(encoding='utf-8')
          expected=f'EVALUATION_START = date({new_start.year}, {new_start.month}, {new_start.day})'
          if expected not in materialized or 'inputs/v77-week2' not in materialized:
              raise RuntimeError('locked week was not materialized into the direct-data collector')
          print(json.dumps({'locked_week_start':new_start.isoformat(),'collector':str(collector),'date_constructor':expected}))
          PY

      - name: Collect locked direct data and build completed-minute features
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          collect=$(find /tmp/v77-week2-tools -maxdepth 1 -type f -name 'collect*.py' | sort | head -n1)
          build=$(find /tmp/v77-week2-tools -maxdepth 1 -type f -name 'build*.py' | sort | head -n1)
          test -n "$collect"
          test -n "$build"
          python "$collect"
          python "$build"

          test -f inputs/v77-week2/candidate-02-v48-first-week/v48_features.npz
          test -f inputs/v77-week2/candidate-02-v48-first-week/columns.json

          python - <<'PY'
          from datetime import date,timedelta
          import json, urllib.request
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v77_week2_lock.json').read_text())
          start=date.fromisoformat(lock['second_week']['start_utc'][:10])-timedelta(days=2)
          end=date.fromisoformat(lock['second_week']['end_utc'][:10])+timedelta(days=1)
          root=Path('inputs/v77-week2/.cache/candidate-02/v77-week2/binance_1m')
          root.mkdir(parents=True,exist_ok=True)
          d=start
          while d<=end:
              name=f'BTCUSDT-1m-{d.isoformat()}.zip'
              path=root/name
              if not path.exists():
                  url=f'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1m/{name}'
                  with urllib.request.urlopen(url,timeout=60) as response:
                      path.write_bytes(response.read())
              d+=timedelta(days=1)
          print(len(list(root.glob('*.zip'))))
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from v53_nt_core import load_feature_matrix

          lock=json.loads(Path('research/candidate-02/v77_week2_lock.json').read_text())
          start=pd.Timestamp(lock['second_week']['start_utc'])
          end=pd.Timestamp(lock['second_week']['end_utc'])
          features=load_feature_matrix(
              Path('inputs/v77-week2/candidate-02-v48-first-week/v48_features.npz'),
              Path('inputs/v77-week2/candidate-02-v48-first-week/columns.json'),
          )
          evaluation=features.loc[(features.index>=start)&(features.index<end)]
          if len(evaluation) < 7*24*60*0.995:
              raise RuntimeError(f'locked week feature coverage mismatch: {len(evaluation)} rows')
          if features.index.min() > start-pd.Timedelta(days=2)+pd.Timedelta(minutes=2):
              raise RuntimeError('missing locked warmup feature history')
          if features.index.max() < end:
              raise RuntimeError('locked feature matrix ends before evaluation end')
          print(json.dumps({
              'feature_first_utc':features.index.min().isoformat(),
              'feature_last_utc':features.index.max().isoformat(),
              'locked_evaluation_rows':len(evaluation),
          }))
          PY

      - name: Materialize unchanged runtime config
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('research/candidate-02/v77_selected_config.json').read_text())
          lock=json.loads(Path('research/candidate-02/v77_week2_lock.json').read_text())
          cfg['candidate']=str(cfg['candidate'])+'-locked-week2'
          cfg['validation']['first_week_start']=lock['second_week']['start_utc'][:10]
          Path('/tmp/v77_week2_runtime.json').write_text(json.dumps(cfg,indent=2,sort_keys=True))
          PY

      - name: Run locked second week through NautilusTrader
        if: steps.gate.outputs.enabled == 'true'
        id: run
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/candidate-02-v77-week2
          set +e
          python research/candidate-02/v76_nt_backtest.py \
            --config /tmp/v77_week2_runtime.json \
            --input-root inputs/v77-week2 \
            --output artifacts/candidate-02-v77-week2 \
            | tee artifacts-v77-week2-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v77-week2/validation_exit_code.txt
          if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi

      - name: Commit second-week decision and optional third-week lock
        if: steps.gate.outputs.enabled == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import date,timedelta
          import hashlib,json,random,re
          from pathlib import Path
          root=Path('research/candidate-02')
          metrics_path=Path('artifacts/candidate-02-v77-week2/metrics.json')
          lock=json.loads((root/'v77_week2_lock.json').read_text())
          if not metrics_path.exists():
              decision={'status':'IMPLEMENTATION_ERROR','lock':lock}
          else:
              m=json.loads(metrics_path.read_text())
              checks={
                  'trades_per_day':float(m.get('trades_per_day',0))>=0.75,
                  'win_rate':float(m.get('win_rate',0))>=0.50,
                  'profit_factor':float(m.get('profit_factor_after_cost',0))>=1.50,
                  'growth':float(m.get('geometric_daily_growth_after_cost',-1))>=0.01,
                  'drawdown':abs(float(m.get('maximum_mark_to_market_drawdown',-1)))<=0.25,
                  'risk':abs(float(m.get('risk_fraction',0))-0.03)<=1e-12,
                  'engine':str(m.get('engine','')).startswith('NautilusTrader'),
                  'no_custom_engine':m.get('custom_backtest_engine') is False,
              }
              passed=all(checks.values())
              decision={'status':'PASSED_LOCKED_SECOND_WEEK' if passed else 'REJECTED_LOCKED_SECOND_WEEK','checks':checks,'metrics':m,'lock':lock}
              if passed:
                  date_re=re.compile(r'^20\d{2}-\d{2}-\d{2}$')
                  excluded=set()
                  def scan(v,k=''):
                      if isinstance(v,dict):
                          for kk,vv in v.items():scan(vv,str(kk).lower())
                      elif isinstance(v,list):
                          for vv in v:scan(vv,k)
                      elif isinstance(v,str):
                          token=v[:10]
                          if date_re.match(token) and any(x in k for x in ('week','start','window','date')):
                              try:d=date.fromisoformat(token)
                              except ValueError:return
                              if d.weekday()==0:excluded.add(d)
                  for p in root.glob('*.json'):
                      try:scan(json.loads(p.read_text()))
                      except Exception:pass
                  mondays=[]; d=date(2021,1,4); last=date(2026,6,1)
                  while d<=last:
                      if d not in excluded:mondays.append(d)
                      d+=timedelta(days=7)
                  random.Random(2026080678).shuffle(mondays)
                  if not mondays:raise RuntimeError('no unseen third week')
                  third=mondays[0]
                  cfg_bytes=(root/'v77_selected_config.json').read_bytes()
                  third_lock={
                      'status':'LOCKED_BEFORE_THIRD_WEEK_COLLECTION',
                      'candidate_family':lock['candidate_family'],
                      'selected_config_sha256':hashlib.sha256(cfg_bytes).hexdigest(),
                      'third_week':{
                          'symbol':'BTCUSDT','start_utc':third.isoformat()+'T00:00:00Z',
                          'end_utc':(third+timedelta(days=7)).isoformat()+'T00:00:00Z',
                          'selection_seed':2026080678,'raw_data_status_at_lock':'NOT_COLLECTED_FOR_V77'},
                      'risk_fraction':0.03,'custom_backtest_engine':False,
                      'performance_engine':'NautilusTrader 1.230.0'}
                  (root/'v77_week3_lock.json').write_text(json.dumps(third_lock,indent=2,sort_keys=True))
          (root/'v77_week2_decision.json').write_text(json.dumps(decision,indent=2,sort_keys=True))
          PY
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-02/v77_week2_decision.json
          if [[ -f research/candidate-02/v77_week3_lock.json ]]; then git add research/candidate-02/v77_week3_lock.json; fi
          git commit -m "research(candidate-02): record locked v77 second week"
          git push origin HEAD:research/candidate-02

      - name: Preserve second-week data and NautilusTrader evidence
        if: steps.gate.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v77-second-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v77-week2
            artifacts-v77-week2-console.log
            inputs/v77-week2
          if-no-files-found: warn
          retention-days: 30

# execution-trigger: locked-week2-date-materialization-r2
