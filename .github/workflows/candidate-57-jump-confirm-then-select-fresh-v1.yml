name: candidate-57-jump-confirm-then-select-fresh-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-jump-confirm-then-select-fresh-v1.yml"
      - "research/candidate-57/JUMP_CONFIRM_THEN_SELECT_FRESH_V1_FREEZE.md"
      - "research/candidate-57/jump_confirm_then_select_fresh_v1.py"
      - "research/candidate-57/jump_confirm_then_select_development_v1.py"
      - "research/candidate-57/jump_confirm_then_select_strategy.py"
      - "research/candidate-57/jump_delayed_post_state_strategy.py"
      - "research/candidate-57/jump_state_arbitration_router.py"
      - "research/candidate-57/jump_taker_alignment_fresh_campaign.py"
      - "research/candidate-57/download_binance_metrics_sidecar.py"
      - "research/candidate-57/forensic_sources/jump_transient_v3/**"
      - "research/candidate-57/evidence/jump-confirm-then-select-development-v1/comparison.json"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-jump-confirm-then-select-fresh-v1
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble frozen candidate-pool execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/JUMP_CONFIRM_THEN_SELECT_FRESH_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/router_jump_transient.py research/candidate-51/router_jump_base.py
          cp research/candidate-57/jump_state_arbitration_router.py research/candidate-51/router.py
          cp research/candidate-57/forensic_sources/jump_transient_v3/strategy_jump_transient.py research/candidate-51/strategy_jump_transient_base.py
          cp research/candidate-57/jump_delayed_post_state_strategy.py research/candidate-51/strategy_jump_transient.py
          cp research/candidate-57/jump_confirm_then_select_strategy.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_transient_base.py \
            research/candidate-57/jump_confirm_then_select_development_v1.py \
            research/candidate-57/jump_confirm_then_select_fresh_v1.py

      - name: Install locked environment and prove promotion cannot consume data early
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          import research.candidate_57_placeholder  # type: ignore  # never reached
          PY
        continue-on-error: true

      - name: Prove candidate pool and predeclared promotion source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import importlib.util
          import inspect
          import pathlib
          import sys
          from strategy import Candidate35Strategy

          root = pathlib.Path("research/candidate-57")
          path = root / "jump_confirm_then_select_fresh_v1.py"
          spec = importlib.util.spec_from_file_location("c57_fresh_contract", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          promotion_source = inspect.getsource(module.promoted)
          assert "candidate_trades_at_least_3" in promotion_source
          assert "growth_improves_control" in promotion_source
          assert "return_improves_control" in promotion_source
          pool_source = inspect.getsource(Candidate35Strategy._process_pool)
          assert "_submit_decision(selected" in pool_source
          assert "self.pending_jump_pool = {}" in pool_source
          print("candidate pool and conditional untouched promotion verified")
          PY

      - name: Conditionally run untouched comparison
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-jump-confirm-then-select-fresh-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51 \
            uv run python research/candidate-57/jump_confirm_then_select_fresh_v1.py \
            2>&1 | tee .work/candidate-57-jump-confirm-then-select-fresh-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact conditional evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            research/candidate-51/launch.py \
            research/candidate-51/router.py \
            research/candidate-51/strategy.py
          rm -f \
            research/candidate-51/router_jump_base.py \
            research/candidate-51/strategy_jump_transient.py \
            research/candidate-51/strategy_jump_transient_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/jump-confirm-then-select-fresh-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate57: persist conditional confirm-then-select evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete conditional artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-jump-confirm-then-select-fresh-v1
          path: |
            research/candidate-57/evidence/jump-confirm-then-select-fresh-v1
            .work/candidate-57-jump-confirm-then-select-fresh-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "conditional candidate-pool test failed mechanically; status=$status"
            exit "${status:-1}"
          fi
