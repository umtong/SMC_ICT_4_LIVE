name: Candidate 09 nonce oracle evaluator 20260806a

on:
  push:
    branches:
      - research/candidate-09
    paths:
      - .github/workflows/candidate-09-oracle-20260806a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-09-oracle-20260806a
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore frozen contract
        shell: bash
        run: |
          cat > research/candidate-09/config.json <<'JSON'
          {
            "candidate": "candidate-09",
            "version": "0.1.0",
            "hypothesis": "A liquidity breach has no directional meaning until post-breach absorption/reclaim or depletion/acceptance is observed.",
            "instrument": "BTCUSDT",
            "venue": "BINANCE_UM_FUTURES",
            "bar_interval": "1m",
            "fixed_gate_weeks_utc": [
              {"name": "week-a", "start": "2022-02-07", "days": 7},
              {"name": "week-b", "start": "2023-06-12", "days": 7},
              {"name": "week-c", "start": "2024-10-14", "days": 7}
            ],
            "risk": {
              "risk_fraction": 0.03,
              "starting_nav_usdt": 100000.0,
              "composite_taker_cost_per_fill": 0.00075,
              "description": "5 bp taker fee plus 2 bp slippage/impact and 0.5 bp funding reserve per fill-equivalent"
            },
            "structure": {
              "pivot_left_bars": 5,
              "pivot_right_bars": 5,
              "atr_period": 20,
              "volume_period": 60,
              "minimum_pivot_prominence_atr": 0.45,
              "maximum_active_pools_per_side": 24
            },
            "breach": {
              "minimum_breach_atr": 0.06,
              "reclaim_buffer_atr": 0.02,
              "acceptance_buffer_atr": 0.10,
              "acceptance_closes": 2,
              "timeout_bars": 9,
              "retest_timeout_bars": 6,
              "retest_tolerance_atr": 0.12,
              "stop_buffer_atr": 0.10
            },
            "flow": {
              "directional_imbalance": 0.12,
              "opposite_confirmation": -0.02,
              "minimum_volume_ratio": 0.85,
              "minimum_displacement_atr": 0.30,
              "absorption_max_progress_atr": 0.12,
              "absorption_min_wick_atr": 0.20
            },
            "trade": {
              "minimum_net_reward_to_risk": 1.10,
              "maximum_holding_minutes": 240,
              "flat_before_utc_midnight_minutes": 5,
              "cooldown_bars": 5
            },
            "gate": {
              "minimum_trades_per_week": 5,
              "minimum_pooled_daily_geometric_return": 0.01,
              "maximum_single_trade_profit_share": 0.35,
              "require_all_weeks_positive": true
            },
            "long_evaluation": {
              "run_only_after_gate": true,
              "start": "2022-01-01",
              "end_exclusive": "2025-01-01",
              "success_daily_geometric_return": 0.01
            }
          }
          JSON
          python - <<'PY'
          from pathlib import Path
          p = Path('research/candidate-09/run.py')
          s = p.read_text()
          s = s.replace(
              'from nautilus_trader.backtest.engine import BacktestEngine, BacktestEngineConfig\nfrom nautilus_trader.config import LoggingConfig\n',
              'from nautilus_trader.backtest.engine import BacktestEngine\nfrom nautilus_trader.config import BacktestEngineConfig, LoggingConfig\n',
          )
          s = s.replace(
              '    flow_map = {bar.ts_ns: bar for bar in bars}\n',
              '    flow_map = {int(nautilus_bar.ts_init): flow_bar for nautilus_bar, flow_bar in zip(nautilus_bars, bars)}\n',
          )
          p.write_text(s)
          PY
          rm -f research/candidate-09/.resource_probe research/candidate-09/.resource_probe_2 research/candidate-09/.known_blob

      - name: Run doctor, contracts, fixed weeks, ablations, and conditional long evaluation
        shell: bash
        env:
          SMC4_DATA_ROOT: .cache/candidate-09
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/oracle-20260806a"
          oracle="$root/oracle/20260806a"
          rm -rf "$out" "$diag" "$oracle"
          mkdir -p "$out" "$diag" "$oracle"

          sync_code=99
          doctor_code=99
          tests_code=99
          gate_code=99

          uv sync --frozen --all-groups > "$diag/sync.log" 2>&1
          sync_code=$?
          if [[ "$sync_code" == 0 ]]; then
            uv run smc4 doctor > "$diag/doctor.log" 2>&1
            doctor_code=$?
          else
            printf 'not run because sync failed\n' > "$diag/doctor.log"
          fi
          if [[ "$doctor_code" == 0 ]]; then
            uv run python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1
            tests_code=$?
          else
            printf 'not run because doctor failed\n' > "$diag/tests.log"
          fi
          if [[ "$tests_code" == 0 ]]; then
            uv run python "$root/run.py" gate --auto-long \
              --cache "$SMC4_DATA_ROOT" --output "$out" > "$diag/gate.log" 2>&1
            gate_code=$?
          else
            printf 'not run because tests failed\n' > "$diag/gate.log"
          fi

          SYNC_CODE="$sync_code" DOCTOR_CODE="$doctor_code" TESTS_CODE="$tests_code" GATE_CODE="$gate_code" python - <<'PY'
          from __future__ import annotations
          import json, math, os, re
          from pathlib import Path

          NONCE = 'C09O20260806A'
          root = Path('research/candidate-09')
          out = root / 'evidence/latest'
          diag = root / 'diagnostics/oracle-20260806a'
          oracle = root / 'oracle/20260806a'
          codes = {
              'sync': int(os.environ['SYNC_CODE']),
              'doctor': int(os.environ['DOCTOR_CODE']),
              'tests': int(os.environ['TESTS_CODE']),
              'gate': int(os.environ['GATE_CODE']),
          }
          first = next((name for name, code in codes.items() if code != 0), None)

          def safe(text: str) -> str:
              return re.sub(r'[^A-Za-z0-9_.=-]+', '_', str(text))[:220]

          def marker(name: str, value: str | None = None) -> None:
              name = safe(name)
              body = f'{NONCE}_{value if value is not None else name}\n'
              (oracle / name).write_text(body)

          def signed_bits(name: str, value, *, scale: int = 1, width: int = 64) -> None:
              name = safe(name).upper()
              if value is None:
                  marker(f'{name}_NONE', f'{name}_NONE')
                  return
              integer = int(round(float(value) * scale))
              marker(f'{name}_SIGN_{"NEG" if integer < 0 else "NONNEG"}', f'{name}_SIGN_{"NEG" if integer < 0 else "NONNEG"}')
              magnitude = abs(integer)
              for bit in range(width):
                  if magnitude & (1 << bit):
                      marker(f'{name}_BIT_{bit:02d}', f'{name}_BIT_{bit:02d}')

          marker('RUN_COMPLETED', 'RUN_COMPLETED')
          for stage, code in codes.items():
              marker(f'STAGE_{stage.upper()}_EXIT_{code}', f'STAGE_{stage.upper()}_EXIT_{code}')
          if first:
              marker(f'FIRST_FAILURE_{first.upper()}', f'FIRST_FAILURE_{first.upper()}')

          summary_path = out / 'summary.json'
          if summary_path.exists():
              try:
                  summary = json.loads(summary_path.read_text())
              except Exception as exc:
                  summary = {'candidate':'candidate-09','status':'IMPLEMENTATION_ERROR','summary_parse_error':repr(exc)}
          else:
              summary = {'candidate':'candidate-09','status':'IMPLEMENTATION_ERROR','first_failure':first,'codes':codes}
          if not summary_path.exists():
              summary_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
              (out / 'REPORT.md').write_text(
                  '# Candidate 09 oracle evaluation\n\n'
                  f'**IMPLEMENTATION_ERROR** at `{first}`. Fixed weeks and strategy thresholds were unchanged.\n'
              )

          status = str(summary.get('status','UNKNOWN'))
          marker(f'STATUS_{status}', f'STATUS_{status}')
          gate = summary.get('gate') or {}
          pooled = gate.get('pooled') or {}
          if gate.get('passed') is True:
              marker('GATE_PASSED', 'GATE_PASSED')
          elif gate.get('passed') is False:
              marker('GATE_FAILED', 'GATE_FAILED')
          signed_bits('GATE_DAILY_GEO_PPB', pooled.get('daily_geometric_return'), scale=1_000_000_000)
          signed_bits('GATE_NAV_MULTIPLE_PPM', pooled.get('nav_multiple'), scale=1_000_000)
          signed_bits('GATE_TRADES', pooled.get('trades'))
          signed_bits('GATE_MAX_DRAWDOWN_PPB', pooled.get('maximum_segment_drawdown'), scale=1_000_000_000)
          signed_bits('GATE_MAX_SINGLE_PROFIT_SHARE_PPB', pooled.get('maximum_single_trade_profit_share'), scale=1_000_000_000)

          diagnosis = summary.get('diagnosis') or {}
          if diagnosis.get('classification'):
              marker(f'DIAGNOSIS_{diagnosis["classification"]}', f'DIAGNOSIS_{diagnosis["classification"]}')
          if diagnosis.get('largest_influence'):
              marker(f'INFLUENCE_{diagnosis["largest_influence"]}', f'INFLUENCE_{diagnosis["largest_influence"]}')

          for i, outcome in enumerate(summary.get('baseline_weeks') or []):
              label = safe(outcome.get('segment',f'WEEK_{i}')).upper()
              signed_bits(f'{label}_RETURN_PPB', outcome.get('total_return'), scale=1_000_000_000)
              signed_bits(f'{label}_DAILY_GEO_PPB', outcome.get('daily_geometric_return'), scale=1_000_000_000)
              signed_bits(f'{label}_TRADES', outcome.get('trades'))
              signed_bits(f'{label}_WIN_RATE_PPB', outcome.get('win_rate'), scale=1_000_000_000)
              signed_bits(f'{label}_MAX_DRAWDOWN_PPB', outcome.get('max_drawdown'), scale=1_000_000_000)
              signed_bits(f'{label}_REVERSAL_TRADES', outcome.get('reversal_trades'))
              signed_bits(f'{label}_CONTINUATION_TRADES', outcome.get('continuation_trades'))
              marker(f'{label}_IMPLEMENTATION_{outcome.get("implementation_status","UNKNOWN")}', f'{label}_IMPLEMENTATION_{outcome.get("implementation_status","UNKNOWN")}')

          for variant, metrics in (summary.get('ablations') or {}).items():
              label = safe(variant).upper()
              signed_bits(f'ABLATION_{label}_DAILY_GEO_PPB', metrics.get('daily_geometric_return'), scale=1_000_000_000)
              signed_bits(f'ABLATION_{label}_NAV_MULTIPLE_PPM', metrics.get('nav_multiple'), scale=1_000_000)
              signed_bits(f'ABLATION_{label}_TRADES', metrics.get('trades'))

          long_eval = summary.get('long_evaluation')
          if long_eval:
              marker('LONG_PRESENT', 'LONG_PRESENT')
              marker(f'LONG_STATUS_{long_eval.get("status","UNKNOWN")}', f'LONG_STATUS_{long_eval.get("status","UNKNOWN")}')
              outcome = long_eval.get('outcome') or {}
              signed_bits('LONG_DAILY_GEO_PPB', outcome.get('daily_geometric_return'), scale=1_000_000_000)
              signed_bits('LONG_TOTAL_RETURN_PPM', outcome.get('total_return'), scale=1_000_000)
              signed_bits('LONG_TRADES', outcome.get('trades'))
              signed_bits('LONG_MAX_DRAWDOWN_PPB', outcome.get('max_drawdown'), scale=1_000_000_000)

          if first:
              log = diag / f'{first}.log'
              text = log.read_text(errors='replace') if log.exists() else ''
              classes = re.findall(r'(?m)^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):', text)
              if classes:
                  marker(f'EXCEPTION_CLASS_{classes[-1]}', f'EXCEPTION_CLASS_{classes[-1]}')
              for token in ('BacktestEngineConfig','TestInstrumentProvider','BarDataWrangler','add_venue','add_data','add_strategy','engine.run','no causal flow observation','unexpected keyword','missing required positional','instrument not found','ts_init','accounting_error','KeyError'):
                  if token.lower() in text.lower():
                      marker(f'LOG_TERM_{token}', f'LOG_TERM_{token}')

          diagnostic = {'nonce':NONCE,'codes':codes,'first_failure':first,'status':status,'trigger_sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID')}
          (diag / 'diagnostic.json').write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + '\n')
          for log in diag.glob('*.log'):
              lines = log.read_text(errors='replace').splitlines()
              log.write_text('\n'.join(lines[-500:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Commit exact oracle result and evidence
        if: always()
        shell: bash
        run: |
          git config user.name "candidate-09-research-bot"
          git config user.email "candidate-09-research-bot@users.noreply.github.com"
          git add -A research/candidate-09
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/candidate-09/evidence/latest/summary.json')
          print(json.loads(p.read_text()).get('status','UNKNOWN') if p.exists() else 'NO_SUMMARY')
          PY
          )
          git commit -m "candidate-09: nonce oracle 20260806a ${status} [candidate-09 evidence]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
