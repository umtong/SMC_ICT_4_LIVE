name: candidate-47-v1-short

on:
  push:
    branches: ["research/candidate-47"]
    paths:
      - "research/candidate-47/router.py"
      - "research/candidate-47/strategy.py"
      - "research/candidate-47/config.json"
      - "research/candidate-47/launch.py"
      - "research/candidate-39/strategy.py"
      - "research/candidate-35/strategy.py"
      - ".github/workflows/candidate-47-v1-short.yml"
  workflow_dispatch:

concurrency:
  group: candidate-47-v1-short
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  short-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-v1-short
      EVIDENCE: research/candidate-47/evidence/v1-dev-2026-07-01_2026-07-07-metrics.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-47
          fetch-depth: 0

      - name: Verify research environment
        run: smc4 doctor

      - name: Run seven-day four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-47/launch.py \
            --config research/candidate-47/config.json \
            --start 2026-07-01 \
            --end 2026-07-07 \
            --cache .cache/candidate-47-v1-short \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Diagnose opportunity, execution, and account path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = metrics["strategy_diagnostics"]
          decisions = max(int(diagnostics.get("quarter_hour_decisions", 0)), 1)
          unresolved = diagnostics.get("unresolved_reason_counts", {})
          summary = {
              "candidate": metrics["candidate"],
              "evaluation_start": metrics["evaluation_start"],
              "evaluation_end": metrics["evaluation_end"],
              "calendar_days": metrics["calendar_days"],
              "starting_nav": metrics["starting_nav"],
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "win_rate": metrics["win_rate"],
              "expectancy_usdt": metrics["expectancy_usdt"],
              "profit_factor": metrics["profit_factor"],
              "gate_checks": metrics["gate_checks"],
              "route_counts": diagnostics.get("route_counts", {}),
              "selected_symbols": diagnostics.get("selected_symbols", {}),
              "scenario_bindings": diagnostics.get("candidate47_scenario_bindings", 0),
              "entry_submissions": diagnostics.get("entry_submissions", 0),
              "limit_entry_submissions": diagnostics.get("limit_entry_submissions", 0),
              "entry_expirations": diagnostics.get("entry_expirations", 0),
              "cost_space_rejections": diagnostics.get("cost_space_rejections", 0),
              "duplicate_causal_episode_rejections": diagnostics.get("duplicate_causal_episode_rejections", 0),
              "order_rejections": diagnostics.get("order_rejections", 0),
              "global_position_violations": diagnostics.get("global_position_violations", 0),
              "quarter_hour_decisions": diagnostics.get("quarter_hour_decisions", 0),
              "unresolved_reason_counts": unresolved,
              "unresolved_reason_share_per_decision": {
                  key: value / decisions for key, value in sorted(unresolved.items())
              },
              "position_counts_by_symbol": metrics.get("position_counts_by_symbol", {}),
              "daily_returns": metrics.get("daily_returns", {}),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          assert diagnostics.get("global_position_violations", 0) == 0

          evidence = Path(os.environ["EVIDENCE"])
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(json.dumps(metrics, indent=2, sort_keys=True) + "\n")
          PY

      - name: Commit exact compact metrics evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-47-research-bot"
          git config user.email "candidate-47-research-bot@users.noreply.github.com"
          git add "$EVIDENCE"
          if git diff --cached --quiet; then
            echo "Evidence unchanged."
            exit 0
          fi
          git commit -m "candidate47: record v1 seven-day diagnostic"
          git pull --rebase origin research/candidate-47
          git push origin HEAD:research/candidate-47

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-v1-short-${{ github.sha }}
          path: artifacts/candidate-47-v1-short/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
