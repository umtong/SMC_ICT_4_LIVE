name: candidate-10-v43-funded-micro-risk

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v43_*.py
      - research/candidate-10/test_c10_v43_funded_micro.py
      - .github/workflows/candidate-10-v43-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v43-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  weeks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - week_id: CONTROL_FAST_REVERSALS
            week_start: "2022-07-09"
            evidence_class: controlled_risk_transfer
          - week_id: CONTROL_WINNER
            week_start: "2023-04-11"
            evidence_class: controlled_runner_preservation
          - week_id: CONTROL_PIVOT_AVAILABLE
            week_start: "2023-06-27"
            evidence_class: controlled_failure_boundary
          - week_id: CONTROL_IMMEDIATE_FAILURES
            week_start: "2024-10-14"
            evidence_class: controlled_failure_boundary
          - week_id: CONTROL_DENSE_HOLDOUT
            week_start: "2024-03-18"
            evidence_class: controlled_runner_preservation
          - week_id: CONTROL_POSITIVE_HOLDOUT
            week_start: "2025-08-04"
            evidence_class: controlled_risk_transfer
          # Deterministic untouched selection. SHA256 seed text:
          # candidate-10-v43-funded-microstructure-risk-transfer
          - week_id: NEW_V43A
            week_start: "2022-08-15"
            evidence_class: untouched_holdout
          - week_id: NEW_V43B
            week_start: "2024-04-22"
            evidence_class: untouched_holdout
          - week_id: NEW_V43C
            week_start: "2025-09-15"
            evidence_class: untouched_holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run funded micro-risk exact ablation
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v43/${{ matrix.week_id }}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v43:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v43
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v43
              for file in \
                c10_v27_overlay.py c10_v27_patch.py \
                c10_v28_overlay.py c10_v28_patch.py \
                c10_v29_overlay.py c10_v29_patch.py \
                c10_v30_overlay.py c10_v32_overlay.py \
                c10_v33_overlay.py \
                c10_v36_overlay.py c10_v36_state.py c10_v36_patch.py \
                c10_v37_overlay.py c10_v37_state.py c10_v37_patch.py \
                c10_v38_overlay.py c10_v38_state.py c10_v38_patch.py \
                c10_v40_overlay.py c10_v40_state.py c10_v40_patch.py \
                c10_v41_overlay.py c10_v41_patch.py \
                c10_v43_overlay.py c10_v43_state.py \
                c10_v43_patch.py c10_v43_run.py \
                test_c10_v27_overlay.py test_c10_v28_overlay.py \
                test_c10_v29_overlay.py test_c10_v33_overlay.py \
                test_c10_v36_state.py test_c10_v37_protection.py \
                test_c10_v38_micro_pivot.py \
                test_c10_v40_source_detector.py \
                test_c10_v41_entry_timing.py \
                test_c10_v43_funded_micro.py; do
                cp "/workspace/research/candidate-10/${file}" /tmp/candidate11-v43/
              done
              smc4 doctor
              python /tmp/candidate11-v43/c10_v43_patch.py \
                /tmp/candidate11-v43/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v43/c10_v27_overlay.py \
                /tmp/candidate11-v43/c10_v27_patch.py \
                /tmp/candidate11-v43/c10_v28_overlay.py \
                /tmp/candidate11-v43/c10_v28_patch.py \
                /tmp/candidate11-v43/c10_v29_overlay.py \
                /tmp/candidate11-v43/c10_v29_patch.py \
                /tmp/candidate11-v43/c10_v30_overlay.py \
                /tmp/candidate11-v43/c10_v32_overlay.py \
                /tmp/candidate11-v43/c10_v33_overlay.py \
                /tmp/candidate11-v43/c10_v36_overlay.py \
                /tmp/candidate11-v43/c10_v36_state.py \
                /tmp/candidate11-v43/c10_v36_patch.py \
                /tmp/candidate11-v43/c10_v37_overlay.py \
                /tmp/candidate11-v43/c10_v37_state.py \
                /tmp/candidate11-v43/c10_v37_patch.py \
                /tmp/candidate11-v43/c10_v38_overlay.py \
                /tmp/candidate11-v43/c10_v38_state.py \
                /tmp/candidate11-v43/c10_v38_patch.py \
                /tmp/candidate11-v43/c10_v40_overlay.py \
                /tmp/candidate11-v43/c10_v40_state.py \
                /tmp/candidate11-v43/c10_v40_patch.py \
                /tmp/candidate11-v43/c10_v41_overlay.py \
                /tmp/candidate11-v43/c10_v41_patch.py \
                /tmp/candidate11-v43/c10_v43_overlay.py \
                /tmp/candidate11-v43/c10_v43_state.py \
                /tmp/candidate11-v43/c10_v43_patch.py \
                /tmp/candidate11-v43/c10_v43_run.py \
                /tmp/candidate11-v43/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v43 \
                -p "test_c10_v*.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v43/${{ matrix.week_id }}"
              python /tmp/candidate11-v43/c10_v43_run.py \
                --candidate11-dir /tmp/candidate11-v43 \
                --week-start "${{ matrix.week_start }}" \
                --variant near-edge-original-stop \
                --output "${BASE}/near-edge-original-stop"

              mkdir -p "${BASE}/near-edge-funded-micro-reduction/data"
              cp -al "${BASE}/near-edge-original-stop/data/." \
                "${BASE}/near-edge-funded-micro-reduction/data/"
              python /tmp/candidate11-v43/c10_v43_run.py \
                --candidate11-dir /tmp/candidate11-v43 \
                --week-start "${{ matrix.week_start }}" \
                --variant near-edge-funded-micro-reduction \
                --output "${BASE}/near-edge-funded-micro-reduction"
            '

      - name: Record evidence class
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/candidate-10-v43/${{ matrix.week_id }}
          printf '%s\n' '${{ matrix.evidence_class }}' > \
            artifacts/candidate-10-v43/${{ matrix.week_id }}/evidence_class.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v43-${{ matrix.week_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v43/${{ matrix.week_id }}
          if-no-files-found: warn
          retention-days: 14
