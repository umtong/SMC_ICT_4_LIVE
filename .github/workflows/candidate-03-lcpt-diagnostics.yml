name: candidate-03-lcpt-diagnostics

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-lcpt-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-failed-validation-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download checksum-verified opened validation week
        run: >-
          python research/candidate-03/download_lcpt_bundle.py
          --symbol BTCUSDT
          --week-start 2023-04-10
          --output .research-data/candidate-03/lcpt/failed-validation-1
      - name: Preserve raw controlled-diagnosis evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-lcpt-failed-validation-1-raw-${{ github.sha }}
          path: .research-data/candidate-03/lcpt/failed-validation-1
          if-no-files-found: error
          retention-days: 3
