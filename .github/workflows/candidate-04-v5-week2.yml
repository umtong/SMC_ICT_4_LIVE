name: candidate-04-v5-week2

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v5-week2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.25"
      - name: Verify unchanged frozen candidate
        run: |
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          test -s research/candidate-04/evidence-v5-week1.json
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_swing_displacement_candidate.py' -v
      - name: Build untouched reserve-2 rich features
        run: |
          uv run python research/candidate-04/rich_features_v2.py \
            --start 2024-08-05 \
            --end 2024-08-13 \
            --cache .cache/candidate-04-v5/reserve2-rich \
            --output artifacts/candidate-04-v5/reserve2/rich
      - name: Replay second random BTC week
        run: |
          uv run python research/candidate-04/swing_displacement_candidate.py \
            --config research/candidate-04/swing_displacement_config.json \
            --rich-dir artifacts/candidate-04-v5/reserve2/rich \
            --kline-dir .cache/candidate-04-v5/reserve2-klines \
            --evaluation-start 2024-08-07 \
            --evaluation-end 2024-08-13 \
            --output artifacts/candidate-04-v5/reserve2/result \
            --download-klines | tee artifacts/candidate-04-v5/reserve2/console.json
      - name: Record gate without opening week three
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('artifacts/candidate-04-v5/reserve2/result/metrics.json').read_text())
          Path('artifacts/candidate-04-v5/reserve2/gate.txt').write_text(
              'PASS\n' if metrics['gate_pass'] else 'FAIL\n',
              encoding='utf-8',
          )
          print(json.dumps(metrics, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v5-week2-${{ github.sha }}
          path: artifacts/candidate-04-v5/reserve2
          if-no-files-found: warn
          retention-days: 90
