name: Candidate 09 v35 reserved continuous component

on:
  push:
    branches: [research/candidate-09]
    paths:
      - .github/workflows/candidate-09-v35-component-long.yml
      - research/candidate-09/v35_component_long/run_component_long.py
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v35-component-long
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SOURCE_SHA: 91317f522546afd837e330a2bde0f9c05e81b068
      ROOT: research/candidate-09/v35_component_long
      CACHE: .cache/candidate-09-v35-component-long

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ${{ env.CACHE }}
          key: candidate-09-v35-component-long-v1

      - name: Materialize exact frozen V35 component
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "$SOURCE_SHA"
          rm -rf "$ROOT/work" "$ROOT/evidence"
          mkdir -p "$ROOT/work"
          git archive "$SOURCE_SHA" research/candidate-05 research/candidate-16 | tar -x -C "$ROOT/work"
          mv "$ROOT/work/research/candidate-05/features.py" "$ROOT/work/research/candidate-05/features_base.py"
          mv "$ROOT/work/research/candidate-16/strategy.py" "$ROOT/work/research/candidate-16/strategy_v1.py"
          cp research/candidate-09/v33_footprint_acceptance/features.py "$ROOT/work/research/candidate-05/features.py"
          python research/candidate-09/v33_footprint_acceptance/apply_timestamp_bridge.py "$ROOT/work/research/candidate-05/features.py"
          cp research/candidate-09/v33_footprint_acceptance/strategy.py "$ROOT/work/research/candidate-16/strategy_v33.py"
          cp research/candidate-09/v35_completed_auction_footprint/strategy.py "$ROOT/work/research/candidate-16/strategy.py"
          test "$(git hash-object "$ROOT/work/research/candidate-05/features_base.py")" = "6c784148effb4e1632c83eb03071f0050579c179"
          test "$(git hash-object "$ROOT/work/research/candidate-16/strategy_v1.py")" = "3dddd221fbd1a7c3c518bb753c88dcffbbdac361"

      - name: Verify and run one continuous reserved interval
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/$ROOT/work/research/candidate-16:$GITHUB_WORKSPACE/$ROOT/work/research/candidate-05:$GITHUB_WORKSPACE/src"
          smc4 doctor | tee "$ROOT/doctor.txt"
          python -m compileall -q "$ROOT" "$ROOT/work/research/candidate-16" "$ROOT/work/research/candidate-05"
          python research/candidate-09/v33_footprint_acceptance/test_contracts.py
          python research/candidate-09/v35_completed_auction_footprint/test_contracts.py
          mkdir -p "$CACHE"
          python "$ROOT/run_component_long.py" \
            --source "$ROOT/work" \
            --cache "$CACHE" \
            --output "$ROOT/evidence" \
            |& tee "$ROOT/run.txt"
          rm -rf "$ROOT/evidence/catalog"
          rm -f "$ROOT/evidence/features.csv.gz"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v35-component-long-${{ github.run_id }}
          path: |
            research/candidate-09/v35_component_long/evidence
            research/candidate-09/v35_component_long/doctor.txt
            research/candidate-09/v35_component_long/run.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Commit compact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$ROOT/evidence/FINAL_DECISION.json" ]] || exit 0
          tmp=$(mktemp -d); mkdir -p "$tmp/evidence"
          for name in FINAL_DECISION.json metrics.json config.json strategy_diagnostics.json candidate16_contract.json data_manifest.json positions.csv orders.csv account.csv; do
            [[ -f "$ROOT/evidence/$name" ]] && cp "$ROOT/evidence/$name" "$tmp/evidence/$name"
          done
          [[ -f "$ROOT/doctor.txt" ]] && cp "$ROOT/doctor.txt" "$tmp/doctor.txt"
          [[ -f "$ROOT/run.txt" ]] && cp "$ROOT/run.txt" "$tmp/run.txt"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name candidate-09-research-bot
          git config user.email candidate-09-research-bot@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"; git reset --hard "origin/$GITHUB_REF_NAME"
          rm -rf "$ROOT/evidence"; mkdir -p "$ROOT/evidence"; cp -a "$tmp/evidence/." "$ROOT/evidence/"
          [[ -f "$tmp/doctor.txt" ]] && cp "$tmp/doctor.txt" "$ROOT/doctor.txt"
          [[ -f "$tmp/run.txt" ]] && cp "$tmp/run.txt" "$ROOT/run.txt"
          git add "$ROOT/evidence" "$ROOT/doctor.txt" "$ROOT/run.txt"
          git diff --cached --quiet && exit 0
          status=$(python -c "import json;print(json.load(open('$ROOT/evidence/FINAL_DECISION.json'))['status'])")
          git commit -m "candidate-09 v35 component long: ${status}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
