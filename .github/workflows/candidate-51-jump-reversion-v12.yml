name: candidate-51-jump-reversion-v12

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-jump-reversion-v12.yml"
      - "research/candidate-51/router_jump_reversion.py"
      - "research/candidate-51/strategy_jump_reversion.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

concurrency:
  group: candidate-51-jump-reversion-v12
  cancel-in-progress: true

jobs:
  develop:
    name: develop-${{ matrix.variant.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant:
          - {name: h1_z2, timeframe: 60, threshold: 2.0, window: 48}
          - {name: h1_z3, timeframe: 60, threshold: 3.0, window: 48}
          - {name: h2_z2, timeframe: 120, threshold: 2.0, window: 30}
          - {name: h2_z3, timeframe: 120, threshold: 3.0, window: 30}
          - {name: h4_z2, timeframe: 240, threshold: 2.0, window: 18}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
      - name: Materialize academic policy
        run: |
          cp research/candidate-51/router_jump_reversion.py research/candidate-51/router.py
          cp research/candidate-51/strategy_jump_reversion.py research/candidate-51/strategy.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install and verify causal contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from router import causal_jump_zscore
          z, sigma = causal_jump_zscore([0.0] * 10 + [0.10], 10)
          assert math.isnan(z) and sigma == 0.0
          sample = [-0.01, 0.01] * 10 + [0.04]
          z, sigma = causal_jump_zscore(sample, 20)
          assert z > 3.0 and sigma > 0.0
          changed = list(sample)
          changed[-1] = 0.08
          z2, sigma2 = causal_jump_zscore(changed, 20)
          assert sigma2 == sigma and z2 > z
          print("causal prior-return volatility contract verified")
          PY
      - name: Build frozen variant config
        shell: bash
        env:
          VARIANT: ${{ matrix.variant.name }}
          TIMEFRAME: ${{ matrix.variant.timeframe }}
          THRESHOLD: ${{ matrix.variant.threshold }}
          WINDOW: ${{ matrix.variant.window }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("research/candidate-51/config.json").read_text())
          for key in ("sma_offset_low", "sma_offset_high", "sma_stop_min_fraction",
                      "sma_stop_max_fraction", "sma_stop_atr_buffer"):
              config["strategy"].pop(key, None)
          timeframe = int(os.environ["TIMEFRAME"])
          config["strategy"].update({
              "cooldown_minutes": 0,
              "max_hold_minutes": timeframe,
              "funding_flatten_minute": 60,
              "funding_blackout_before_minutes": -1,
              "funding_blackout_after_minutes": -1,
              "jump_timeframe_minutes": timeframe,
              "jump_threshold_sigma": float(os.environ["THRESHOLD"]),
              "jump_volatility_window": int(os.environ["WINDOW"]),
              "jump_min_absolute_return": 0.0,
              "jump_terminal_atr_period": 14,
              "jump_stop_atr_multiple": 1.0,
              "jump_min_stop_fraction": 0.0015,
              "jump_emergency_target_fraction": 0.20,
          })
          Path(".work").mkdir(exist_ok=True)
          Path(".work/config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          PY
      - name: Run 14-day four-symbol Nautilus account
        shell: bash
        env:
          VARIANT: ${{ matrix.variant.name }}
        run: |
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/config.json \
            --start 2026-01-01 --end 2026-01-14 \
            --cache .cache/candidate-51-jump-reversion-v12 \
            --output "artifacts/candidate-51/jump-v12-${VARIANT}-development" \
            --workspace ".work/candidate-51-jump-v12-${VARIANT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jump-v12-development-${{ matrix.variant.name }}
          path: artifacts/candidate-51/jump-v12-${{ matrix.variant.name }}-development/**
          if-no-files-found: warn
          retention-days: 30

  select:
    needs: develop
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.choose.outputs.selected }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jump-v12-development-*
          path: downloaded
      - id: choose
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          comparison = {}
          for artifact in sorted(Path("downloaded").glob("jump-v12-development-*")):
              variant = artifact.name.removeprefix("jump-v12-development-")
              mp, dp = artifact / "metrics.json", artifact / "strategy_diagnostics.json"
              if not mp.is_file() or not dp.is_file():
                  comparison[variant] = {"produced": False}
                  continue
              metrics, diagnostics = json.loads(mp.read_text()), json.loads(dp.read_text())
              comparison[variant] = {"produced": True,
                  **{key: metrics.get(key) for key in (
                      "ending_nav", "total_return", "geometric_daily_growth", "max_drawdown",
                      "trades", "wins", "losses", "win_rate", "profit_factor",
                      "expectancy_usdt", "largest_winner_share")},
                  "source_candidates": diagnostics.get("jump_source_candidates"),
                  "entries": diagnostics.get("entry_submissions"),
                  "selected_symbols": diagnostics.get("selected_symbols"),
                  "unresolved_reason_counts": diagnostics.get("unresolved_reason_counts"),
                  "global_position_violations": diagnostics.get("global_position_violations"),
                  "order_rejections": diagnostics.get("order_rejections")}
          eligible = [variant for variant, row in comparison.items()
              if row.get("produced") and int(row.get("trades") or 0) >= 3
              and float(row.get("expectancy_usdt") or 0.0) > 0.0
              and float(row.get("geometric_daily_growth") or 0.0) > 0.0
              and float(row.get("max_drawdown") or 1.0) <= .20
              and int(row.get("global_position_violations") or 0) == 0
              and int(row.get("order_rejections") or 0) == 0]
          eligible.sort(key=lambda variant: (
              -float(comparison[variant].get("geometric_daily_growth") or 0.0),
              -float(comparison[variant].get("expectancy_usdt") or 0.0),
              -int(comparison[variant].get("trades") or 0), variant))
          selected = eligible[0] if eligible else ""
          result = {"comparison": comparison, "eligible": eligible,
                    "selected": selected or None,
                    "status": "TEST_UNTOUCHED" if selected else "REJECT_OR_REDESIGN"}
          Path("selection.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          Path("selected.txt").write_text(selected + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          selected="$(tr -d '\r\n' < selected.txt)"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jump-v12-selection
          path: |
            selection.json
            selected.txt

  holdout:
    needs: select
    if: needs.select.outputs.selected != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
      - run: |
          cp research/candidate-51/router_jump_reversion.py research/candidate-51/router.py
          cp research/candidate-51/strategy_jump_reversion.py research/candidate-51/strategy.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install and reconstruct selected config
        shell: bash
        env:
          VARIANT: ${{ needs.select.outputs.selected }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          uv run smc4 doctor
          python - <<'PY'
          import json, os
          from pathlib import Path
          specs = {"h1_z2": (60, 2.0, 48), "h1_z3": (60, 3.0, 48),
                   "h2_z2": (120, 2.0, 30), "h2_z3": (120, 3.0, 30),
                   "h4_z2": (240, 2.0, 18)}
          timeframe, threshold, window = specs[os.environ["VARIANT"]]
          config = json.loads(Path("research/candidate-51/config.json").read_text())
          for key in ("sma_offset_low", "sma_offset_high", "sma_stop_min_fraction",
                      "sma_stop_max_fraction", "sma_stop_atr_buffer"):
              config["strategy"].pop(key, None)
          config["strategy"].update({"cooldown_minutes": 0, "max_hold_minutes": timeframe,
              "funding_flatten_minute": 60, "funding_blackout_before_minutes": -1,
              "funding_blackout_after_minutes": -1, "jump_timeframe_minutes": timeframe,
              "jump_threshold_sigma": threshold, "jump_volatility_window": window,
              "jump_min_absolute_return": 0.0, "jump_terminal_atr_period": 14,
              "jump_stop_atr_multiple": 1.0, "jump_min_stop_fraction": .0015,
              "jump_emergency_target_fraction": .20})
          Path(".work").mkdir(exist_ok=True)
          Path(".work/config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          PY
      - name: Run untouched 14-day account
        run: |
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/config.json \
            --start 2025-11-01 --end 2025-11-14 \
            --cache .cache/candidate-51-jump-reversion-v12 \
            --output artifacts/candidate-51/jump-v12-selected-holdout \
            --workspace .work/candidate-51-jump-v12-holdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jump-v12-holdout-${{ needs.select.outputs.selected }}
          path: artifacts/candidate-51/jump-v12-selected-holdout/**
          if-no-files-found: warn
          retention-days: 30

  assess:
    needs: [select, holdout]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.assess.outputs.promote }}
      selected: ${{ needs.select.outputs.selected }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jump-v12-holdout-*
          path: downloaded
      - id: assess
        shell: bash
        env:
          VARIANT: ${{ needs.select.outputs.selected }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          variant = os.environ.get("VARIANT", "")
          matches = list(Path("downloaded").glob("jump-v12-holdout-*/metrics.json"))
          result = {"variant": variant or None, "produced": False, "component_pass": False}
          if variant and matches:
              mp = matches[0]; dp = mp.with_name("strategy_diagnostics.json")
              metrics, diagnostics = json.loads(mp.read_text()), json.loads(dp.read_text())
              checks = {"at_least_three_trades": int(metrics.get("trades") or 0) >= 3,
                  "positive_growth": float(metrics.get("geometric_daily_growth") or 0.0) > 0.0,
                  "positive_expectancy": float(metrics.get("expectancy_usdt") or 0.0) > 0.0,
                  "drawdown_lte_20pct": float(metrics.get("max_drawdown") or 1.0) <= .20,
                  "one_position": int(diagnostics.get("global_position_violations") or 0) == 0,
                  "no_rejections": int(diagnostics.get("order_rejections") or 0) == 0}
              result = {"variant": variant, "produced": True,
                  **{key: metrics.get(key) for key in (
                      "ending_nav", "total_return", "geometric_daily_growth", "max_drawdown",
                      "trades", "wins", "losses", "win_rate", "profit_factor", "expectancy_usdt")},
                  "checks": checks, "component_pass": all(checks.values())}
          Path("assessment.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          promote="$(python - <<'PY'
          import json
          print(str(json.load(open('assessment.json')).get('component_pass', False)).lower())
          PY
          )"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jump-v12-holdout-assessment
          path: assessment.json

  continuous:
    needs: assess
    if: needs.assess.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
      - run: |
          cp research/candidate-51/router_jump_reversion.py research/candidate-51/router.py
          cp research/candidate-51/strategy_jump_reversion.py research/candidate-51/strategy.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install and reconstruct promoted config
        shell: bash
        env:
          VARIANT: ${{ needs.assess.outputs.selected }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          uv run smc4 doctor
          python - <<'PY'
          import json, os
          from pathlib import Path
          specs = {"h1_z2": (60, 2.0, 48), "h1_z3": (60, 3.0, 48),
                   "h2_z2": (120, 2.0, 30), "h2_z3": (120, 3.0, 30),
                   "h4_z2": (240, 2.0, 18)}
          timeframe, threshold, window = specs[os.environ["VARIANT"]]
          config = json.loads(Path("research/candidate-51/config.json").read_text())
          for key in ("sma_offset_low", "sma_offset_high", "sma_stop_min_fraction",
                      "sma_stop_max_fraction", "sma_stop_atr_buffer"):
              config["strategy"].pop(key, None)
          config["strategy"].update({"cooldown_minutes": 0, "max_hold_minutes": timeframe,
              "funding_flatten_minute": 60, "funding_blackout_before_minutes": -1,
              "funding_blackout_after_minutes": -1, "jump_timeframe_minutes": timeframe,
              "jump_threshold_sigma": threshold, "jump_volatility_window": window,
              "jump_min_absolute_return": 0.0, "jump_terminal_atr_period": 14,
              "jump_stop_atr_multiple": 1.0, "jump_min_stop_fraction": .0015,
              "jump_emergency_target_fraction": .20})
          Path(".work").mkdir(exist_ok=True)
          Path(".work/config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          PY
      - name: Run 90-day continuous account
        run: |
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/config.json \
            --start 2025-04-01 --end 2025-06-29 \
            --cache .cache/candidate-51-jump-reversion-v12 \
            --output artifacts/candidate-51/jump-v12-selected-continuous-90d \
            --workspace .work/candidate-51-jump-v12-continuous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jump-v12-continuous-${{ needs.assess.outputs.selected }}
          path: artifacts/candidate-51/jump-v12-selected-continuous-90d/**
          if-no-files-found: warn
          retention-days: 30

  persist:
    needs: [develop, select, holdout, assess, continuous]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: jump-v12-*
          path: downloaded
      - name: Assemble and commit evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          evidence = Path("research/candidate-51/evidence/v12-jump-reversion")
          if evidence.exists(): shutil.rmtree(evidence)
          for name in ("development", "holdout", "continuous"): (evidence / name).mkdir(parents=True)
          manifest = {
              "family": "academic_intraday_jump_reversion",
              "source": {"title": "On the Intraday Behavior of Bitcoin",
                  "author": "Giacomo De Nicola", "doi": "10.5195/LEDGER.2021.213",
                  "sample": ["2015-03", "2018-06"],
                  "rule": "after a large completed return, trade opposite and exit one equal time unit later",
                  "reported_mean_trade_returns_before_fees": {
                      "1h_2sigma": .0015, "1h_3sigma": .0021,
                      "2h_2sigma": .0030, "2h_3sigma": .0049,
                      "2h_4sigma": .0074, "4h_2sigma": .0032},
                  "reported_taker_fee_reference_each_trade": .001},
              "causal_adaptation": "jump sigma estimated only from prior completed returns",
              "development_interval": ["2026-01-01", "2026-01-14"],
              "untouched_interval": ["2025-11-01", "2025-11-14"],
              "conditional_continuous_interval": ["2025-04-01", "2025-06-29"],
              "engine": "NautilusTrader BacktestNode", "risk_fraction": .03,
              "global_position_limit": 1,
          }
          (evidence / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          for artifact in sorted(Path("downloaded").glob("jump-v12-development-*")):
              variant = artifact.name.removeprefix("jump-v12-development-")
              target = evidence / "development" / variant; target.mkdir()
              for source in artifact.iterdir():
                  if source.is_file() and source.name in {"metrics.json", "strategy_diagnostics.json", "run.json", "data_manifest.json", "closed_scenarios.json"}:
                      shutil.copy2(source, target / source.name)
          selection = Path("downloaded/jump-v12-selection/selection.json")
          if selection.is_file(): shutil.copy2(selection, evidence / "development/selection.json")
          assessment = Path("downloaded/jump-v12-holdout-assessment/assessment.json")
          if assessment.is_file(): shutil.copy2(assessment, evidence / "holdout/assessment.json")
          for artifact in Path("downloaded").glob("jump-v12-holdout-*"):
              if artifact.name == "jump-v12-holdout-assessment": continue
              for source in artifact.iterdir():
                  if source.is_file() and source.name in {"metrics.json", "strategy_diagnostics.json", "run.json", "data_manifest.json", "closed_scenarios.json"}:
                      shutil.copy2(source, evidence / "holdout" / source.name)
          continuous_result = {"produced": False, "component_pass": False, "project_gate_pass": False}
          for artifact in Path("downloaded").glob("jump-v12-continuous-*"):
              mp, dp = artifact / "metrics.json", artifact / "strategy_diagnostics.json"
              if not mp.is_file() or not dp.is_file(): continue
              metrics, diagnostics = json.loads(mp.read_text()), json.loads(dp.read_text())
              component = {"positive_growth": float(metrics.get("geometric_daily_growth") or 0.0) > 0.0,
                  "positive_expectancy": float(metrics.get("expectancy_usdt") or 0.0) > 0.0,
                  "drawdown_lte_20pct": float(metrics.get("max_drawdown") or 1.0) <= .20,
                  "one_position": int(diagnostics.get("global_position_violations") or 0) == 0,
                  "no_rejections": int(diagnostics.get("order_rejections") or 0) == 0}
              project = {"daily_geometric_growth_at_least_1pct": float(metrics.get("geometric_daily_growth") or 0.0) >= .01,
                  "trades_at_least_calendar_days": int(metrics.get("trades") or 0) >= 90, **component}
              continuous_result = {"produced": True,
                  **{key: metrics.get(key) for key in ("ending_nav", "total_return", "geometric_daily_growth",
                      "max_drawdown", "trades", "wins", "losses", "win_rate", "profit_factor", "expectancy_usdt")},
                  "component_checks": component, "component_pass": all(component.values()),
                  "project_checks": project, "project_gate_pass": all(project.values())}
              for source in artifact.iterdir():
                  if source.is_file() and source.name in {"metrics.json", "strategy_diagnostics.json", "run.json", "data_manifest.json", "closed_scenarios.json"}:
                      shutil.copy2(source, evidence / "continuous" / source.name)
          (evidence / "continuous/assessment.json").write_text(
              json.dumps(continuous_result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(continuous_result, indent=2, sort_keys=True))
          PY
          git config user.name "candidate-51-research-bot"
          git config user.email "candidate-51-research-bot@users.noreply.github.com"
          git add research/candidate-51/evidence/v12-jump-reversion
          if ! git diff --cached --quiet; then
            git commit -m "candidate51: persist academic jump reversion tournament"
            for attempt in 1 2 3 4; do
              git pull --rebase origin research/candidate-51 && git push origin HEAD:research/candidate-51 && break
              sleep $((attempt * 5))
            done
          fi
