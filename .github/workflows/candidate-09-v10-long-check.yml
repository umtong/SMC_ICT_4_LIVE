name: Candidate 09 v10 frozen long check

on:
  push:
    branches: [research/candidate-09]
    paths:
      - .github/workflows/candidate-09-v10-long-check.yml
      - research/candidate-09/state_engine_v10_direct.py
      - research/candidate-09/config_v10.json
      - research/candidate-09/archive/v4/state_engine.py
      - research/candidate-09/run.py
      - research/candidate-09/data_loader.py
      - research/candidate-09/nautilus_strategy.py

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v10-frozen-long-check
  cancel-in-progress: true

jobs:
  long-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v2
          restore-keys: |
            candidate-09-binance-vision-v1

      - name: Materialize exact v10 logic on the verified common runner
        shell: bash
        run: |
          set -euo pipefail
          src=research/candidate-09
          root=$src/long_checks/v10
          rm -rf "$root"
          mkdir -p "$root/archive/v4" "$root/tests"

          cp "$src/run.py" "$root/run.py"
          cp "$src/data_loader.py" "$root/data_loader.py"
          cp "$src/nautilus_strategy.py" "$root/nautilus_strategy.py"
          cp "$src/state_engine_v10_direct.py" "$root/state_engine.py"
          cp "$src/state_engine_v10_direct.py" "$root/state_engine_v10_direct.py"
          cp "$src/archive/v4/state_engine.py" "$root/archive/v4/state_engine.py"
          cp "$src/config_v10.json" "$root/config.json"
          cp "$src/tests/test_accounting_contract.py" "$root/tests/test_accounting_contract.py"
          cp "$src/tests/test_nautilus_contract.py" "$root/tests/test_nautilus_contract.py"
          cp "$src/tests_v10/test_state_engine.py" "$root/tests/test_state_engine_v10.py"

          # Add only final-validation requirements expected by the current runner.
          # No strategy, signal, cost, risk, or date field is changed.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/candidate-09/long_checks/v10/config.json')
          cfg = json.loads(p.read_text())
          cfg['long_evaluation'].update({
              'minimum_trades_per_calendar_day': 0.5,
              'minimum_active_months': 30,
              'maximum_drawdown': 0.30,
          })
          p.write_text(json.dumps(cfg, indent=2, sort_keys=True) + '\n')
          PY

          test "$(git hash-object "$root/state_engine.py")" = "340952433ea17a4c77dd4f2445b226b8ddcf327a"
          test "$(git hash-object "$root/archive/v4/state_engine.py")" = "2e71695b30b622f048cc63f4e858bb3f19220f64"
          test "$(git hash-object "$root/data_loader.py")" = "c076c7f47874552fb9e1d79878a43206d58f686b"

      - name: Run frozen v10 contracts and three-year NautilusTrader evaluation
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09/long_checks/v10
          export PYTHONPATH="$GITHUB_WORKSPACE/$root:$GITHUB_WORKSPACE/src"
          smc4 doctor | tee "$root/doctor.txt"
          python -m compileall -q "$root"
          python -m unittest "$root/tests/test_accounting_contract.py" "$root/tests/test_state_engine_v10.py" -v |& tee "$root/tests-pure.txt"
          python -m unittest "$root/tests/test_nautilus_contract.py" -v |& tee "$root/tests-nautilus.txt"
          rm -rf "$root/evidence/latest"
          python "$root/run.py" long \
            --config "$root/config.json" \
            --cache "$GITHUB_WORKSPACE/.cache/candidate-09" \
            --output "$root/evidence/latest" |& tee "$root/long.txt"

      - name: Preserve exact source and full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v10-long-${{ github.run_id }}
          path: research/candidate-09/long_checks/v10
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact v10 long evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE"
          root="$repo/research/candidate-09/long_checks/v10"
          tmp=$(mktemp -d)
          mkdir -p "$tmp/evidence"
          for name in summary.json REPORT.md outcomes.csv trades.csv fills.csv run.json data_manifest.json; do
            [[ -f "$root/evidence/latest/$name" ]] && cp "$root/evidence/latest/$name" "$tmp/evidence/$name"
          done
          for name in doctor.txt tests-pure.txt tests-nautilus.txt long.txt; do
            [[ -f "$root/$name" ]] && cp "$root/$name" "$tmp/$name"
          done
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" fetch origin "$GITHUB_REF_NAME"
          git -C "$repo" reset --hard "origin/$GITHUB_REF_NAME"
          out="$repo/research/candidate-09/long_checks/v10-result"
          rm -rf "$out"
          mkdir -p "$out/evidence"
          cp -a "$tmp/evidence/." "$out/evidence/"
          for name in doctor.txt tests-pure.txt tests-nautilus.txt long.txt; do
            [[ -f "$tmp/$name" ]] && cp "$tmp/$name" "$out/$name"
          done
          git -C "$repo" add research/candidate-09/long_checks/v10-result
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json; from pathlib import Path; p=Path('research/candidate-09/long_checks/v10-result/evidence/summary.json'); print(json.loads(p.read_text()).get('status','IMPLEMENTATION_ERROR') if p.exists() else 'IMPLEMENTATION_ERROR')")
          git -C "$repo" commit -m "candidate-09 v10 long check: ${status}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
