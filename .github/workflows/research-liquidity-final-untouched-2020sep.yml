name: Research liquidity final untouched September 2020

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v3"]
    paths:
      - ".github/workflows/research-liquidity-final-untouched-2020sep.yml"
      - "research/candidate-liquidity-auction-v3/.dispatch-final-untouched-2020sep"

concurrency:
  group: research-liquidity-final-untouched-2020sep
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v3
      - name: Record frozen-policy untouched run
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-liquidity-final-untouched-2020sep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-liquidity-final-untouched-2020sep
          git commit -m "Record frozen-policy untouched September 2020 run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_liquidity_auction_v3

  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Export frozen-policy untouched exact one-minute price and aggressor flow
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance-cache final-untouched-2020sep
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period final-untouched-2020sep \
            --start 2020-09-20 \
            --end 2020-09-30 \
            --before-days 3 \
            --after-days 2 \
            --cache /tmp/binance-cache \
            --output final-untouched-2020sep
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-final-untouched-2020sep
          path: final-untouched-2020sep/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
