name: candidate-02-v155-informed-inventory

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v155_trigger.json"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-02-v155-informed-inventory
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  locked-specification-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify common research foundation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          test -s research/candidate-02/informed_inventory_v46_lock.json
          test -s research/candidate-02/v46_confirmation_selection.json
          test -s research/candidate-02/v53_nt_strategy.py
          test -s research/candidate-02/core.py

      - name: Reuse prospectively selected Binance Vision input collector
        shell: bash
        run: |
          set -euo pipefail
          python .candidate-02-v46/collect_confirmation_week.py
          test -s artifacts/candidate-02-v46-confirmation/STATUS_READY_FOR_LOCKED_EVALUATION
          test -s artifacts/candidate-02-v46-confirmation/manifest.json

      - name: Verify causal rule and locked constants
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-02:$GITHUB_WORKSPACE/src"
          python -m py_compile \
            research/candidate-02/v155_informed_inventory_core.py \
            research/candidate-02/v155_nt_backtest.py \
            research/candidate-02/test_v155_informed_inventory.py
          python research/candidate-02/test_v155_informed_inventory.py
          python - <<'PY'
          from pathlib import Path
          import json
          config = json.loads(Path('research/candidate-02/v155_confirmation_config.json').read_text())
          assert str(config['risk']['risk_fraction']) == '0.03'
          assert config['scenario']['observation_bars'] == 6
          assert config['scenario']['atr_history_bars'] == 48
          assert config['scenario']['robust_history_bars'] == 288
          assert config['scenario']['robust_minimum_observations'] == 96
          assert config['scenario']['cost_after_target_r'] == 0.75
          assert config['scenario']['maximum_holding_minutes'] == 300
          assert config['lineage']['parameter_changes_after_replacement_selection'] is False
          print('v155 immutable specification contract: OK')
          PY

      - name: Run locked specification through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-02:$GITHUB_WORKSPACE/src"
          target="research/candidate-02/results/v155_informed_inventory/$GITHUB_SHA"
          rm -rf "$target"
          mkdir -p "$target"
          set +e
          python research/candidate-02/v155_nt_backtest.py \
            --config research/candidate-02/v155_confirmation_config.json \
            --input-root .cache/candidate-02/v46-confirmation \
            --output "$target" \
            2>&1 | tee "$target/console.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$target/runner_exit_code.txt"
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            echo "unexpected V155 runner exit code: $rc"
            exit "$rc"
          fi
          cp artifacts/candidate-02-v46-confirmation/manifest.json "$target/data_manifest.json"
          python - <<'PY'
          from pathlib import Path
          import json, os
          target = Path('research/candidate-02/results/v155_informed_inventory') / os.environ['GITHUB_SHA']
          metrics = json.loads((target / 'metrics.json').read_text())
          assert metrics['engine'] == 'NautilusTrader 1.230.0'
          assert metrics['custom_backtest_engine'] is False
          assert metrics['risk_fraction'] == 0.03
          assert metrics['project_target_met'] is False
          assert metrics['success_claim_allowed'] is False
          assert metrics['data_integrity']['future_information_used'] is False
          assert metrics['execution_model']['global_pending_entry_plus_position_limit'] == 1
          assert metrics['execution_model']['arbitrary_notional_cap'] is None
          print(json.dumps(metrics, indent=2, sort_keys=True))
          PY
          python - <<'PY'
          from pathlib import Path
          import json, os
          target = Path('research/candidate-02/results/v155_informed_inventory') / os.environ['GITHUB_SHA']
          lock = {
              'source_commit': os.environ['GITHUB_SHA'],
              'branch': 'research/candidate-02',
              'engine': 'NautilusTrader 1.230.0',
              'market_rule_path': 'research/candidate-02/informed_inventory_v46_lock.json',
              'selection_path': 'research/candidate-02/v46_confirmation_selection.json',
              'configuration_path': 'research/candidate-02/v155_confirmation_config.json',
              'parameter_search_performed': False,
              'result_can_support_final_success_claim': False,
          }
          (target / 'source_lock.json').write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY

      - name: Commit compact causal evidence
        shell: bash
        run: |
          set -euo pipefail
          target="research/candidate-02/results/v155_informed_inventory/$GITHUB_SHA"
          git fetch origin research/candidate-02
          if [[ "$(git rev-parse origin/research/candidate-02)" != "$GITHUB_SHA" ]]; then
            echo "candidate-02 advanced during V155; refusing to mix evidence revisions"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research(candidate-02): record v155 informed-inventory evidence"
          git push origin HEAD:research/candidate-02
