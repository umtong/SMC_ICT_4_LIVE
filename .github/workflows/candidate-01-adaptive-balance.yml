name: candidate-01-adaptive-balance

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-adaptive-balance.yml"
      - "research/candidate-01/adaptive_balance_diagnostics.py"
      - "research/candidate-01/core.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-adaptive-balance
          key: candidate-01-adaptive-balance-data-${{ runner.os }}
      - name: Repair probe invalidation ordering
        run: python3 research/candidate-01/fix_adaptive_balance_probe.py
      - name: Diagnose causally confirmed adaptive balances
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              python -m compileall -q research/candidate-01/adaptive_balance_diagnostics.py
              rm -rf artifacts/candidate-01-adaptive-balance
              python research/candidate-01/adaptive_balance_diagnostics.py \
                --cache .cache/candidate-01-adaptive-balance \
                --output artifacts/candidate-01-adaptive-balance
            '
      - name: Print summary
        run: cat artifacts/candidate-01-adaptive-balance/adaptive_balance_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-adaptive-balance-${{ github.sha }}
          path: artifacts/candidate-01-adaptive-balance
          if-no-files-found: error
          retention-days: 30
      - name: Persist repaired detector
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/adaptive_balance_diagnostics.py
          git commit -m "fix(candidate-01): invalidate expanding adaptive probes causally"
          git push origin HEAD:research/candidate-01
