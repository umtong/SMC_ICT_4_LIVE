name: candidate-08-opening-source-boolean-fix

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-opening-source-boolean-fix"

permissions:
  contents: write

jobs:
  fix-exact-source-token:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace the one invalid Python boolean and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/opening_initial_balance_failed_auction_signals_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '"ten_second_alpha_inputs": false,'
          new = '"ten_second_alpha_inputs": False,'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected exactly one invalid boolean token, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm -f research/candidate-08/.run-opening-source-boolean-fix
          rm -f .github/workflows/candidate-08-opening-source-boolean-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            research/candidate-08/opening_initial_balance_failed_auction_signals_v1.py \
            research/candidate-08/.run-opening-source-boolean-fix \
            .github/workflows/candidate-08-opening-source-boolean-fix.yml
          git commit -m "candidate-08: correct opening-auction Python boolean [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
