name: candidate-08-quote-resiliency-contracts-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-quote-resiliency-contracts-v2"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-quote-resiliency-contracts-v2
  cancel-in-progress: true

jobs:
  raw-and-completed-causal-contracts:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      MARKER: research/candidate-08/.run-quote-resiliency-contracts-v2
      OUTPUT_DIR: research/candidate-08/evidence/quote-resiliency-contracts-v2
      LOG: research/candidate-08/evidence/quote-resiliency-contracts-v2/contracts.log
      STATUS: research/candidate-08/evidence/quote-resiliency-contracts-v2/exit_status.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned environment and duplicate-time causal contracts
        id: contracts
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$OUTPUT_DIR"
          rm -f "$LOG" "$STATUS"
          set +e
          (
            set -euo pipefail
            smc4 doctor
            python -m compileall -q \
              research/candidate-08/quote_resiliency_features.py \
              research/candidate-08/quote_resiliency_features_v2.py \
              research/candidate-08/quote_resiliency_features_v3.py \
              research/candidate-08/test_quote_resiliency_features.py \
              research/candidate-08/test_quote_resiliency_features_v3.py
            python research/candidate-08/test_quote_resiliency_features.py -v
            python research/candidate-08/test_quote_resiliency_features_v3.py -v
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$STATUS"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit reproducible contract evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER"
          git add -A -- "$OUTPUT_DIR" "$MARKER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: record quote resiliency V2 contract evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce contract status
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.contracts.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
