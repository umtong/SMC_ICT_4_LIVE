name: Research liquidity auction v5 commitment first return

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v5"]
    paths:
      - ".github/workflows/research-liquidity-auction-v5-commitment.yml"
      - "research/candidate-liquidity-auction-v5/commitment_first_return_harvest.py"
      - "research/candidate-liquidity-auction-v5/commitment_first_return_harvest_exec.py"
      - "research/candidate-liquidity-auction-v5/commitment_first_return_router.py"

concurrency:
  group: research-liquidity-auction-v5-commitment
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {role: dev, period: dev-2023-feb, start: 2023-02-01, end: 2023-02-08}
          - {role: dev, period: dev-2023-aug, start: 2023-08-01, end: 2023-08-08}
          - {role: dev, period: dev-2023-nov, start: 2023-11-01, end: 2023-11-08}
          - {role: dev, period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {role: dev, period: dev-2024-may, start: 2024-05-01, end: 2024-05-08}
          - {role: dev, period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {role: dev, period: dev-2024-nov, start: 2024-11-01, end: 2024-11-08}
          - {role: dev, period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {role: dev, period: dev-2025-may, start: 2025-05-01, end: 2025-05-08}
          - {role: dev, period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
          - {role: dev, period: dev-2025-nov, start: 2025-11-01, end: 2025-11-08}
          - {role: cal, period: cal-2026-jan, start: 2026-01-01, end: 2026-01-08}
          - {role: cal, period: cal-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {role: cal, period: cal-2026-apr, start: 2026-04-01, end: 2026-04-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/v5-commitment/${{ matrix.period }}
      OUT: artifacts/v5-commitment/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v5
      - name: Harvest commitment-armed first returns
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-auction-v5/commitment_first_return_harvest_exec.py \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - name: Preserve the exact price-volume path
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" --start "$START" --end "$END" \
            --cache "$CACHE" --output "$OUT/chart"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v5-commit-${{ matrix.role }}-${{ matrix.period }}
          path: artifacts/v5-commitment/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30

  route:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-auction-v5
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v5
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v5-commit-dev-*
          path: artifacts/v5-commitment/development
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v5-commit-cal-*
          path: artifacts/v5-commitment/calibration
      - name: Learn trade, geometry and global selection from armed states
        run: |
          set -euo pipefail
          mkdir -p artifacts/v5-commitment/result
          python research/candidate-liquidity-auction-v5/commitment_first_return_router.py \
            --development-root artifacts/v5-commitment/development \
            --fresh-root artifacts/v5-commitment/calibration \
            --output artifacts/v5-commitment/result
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v5-commitment-result
          path: artifacts/v5-commitment/result/**
          if-no-files-found: error
          retention-days: 30
