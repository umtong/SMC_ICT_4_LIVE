name: candidate-04-v18c-regime-diagnostic

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v18c-regime-diagnostic.yml"
      - "research/candidate-04/nt_backtest_v18c_regime_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      FROZEN_SOURCE_COMMIT: 98fde73e34bfc525d52751cfab11633579c953fd
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen trading source and runtime
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          commit = os.environ["FROZEN_SOURCE_COMMIT"]
          paths = [
              "research/candidate-04/nt_liquidity_strategy.py",
              "research/candidate-04/nt_auction_excess_strategy.py",
              "research/candidate-04/nt_auction_failure_strategy.py",
              "research/candidate-04/nt_low_impact_external_strategy.py",
              "research/candidate-04/nt_low_impact_hybrid_target_strategy.py",
              "research/candidate-04/nt_composite_liquidity_strategy.py",
              "research/candidate-04/nt_causal_risk_sizing.py",
              "research/candidate-04/nt_backtest.py",
              "research/candidate-04/nt_backtest_v18.py",
              "research/candidate-04/nt_liquidity_config.json",
              "research/candidate-04/tests/test_nt_liquidity_strategy.py",
              "research/candidate-04/tests/test_nt_composite_liquidity_strategy.py",
              "research/candidate-04/tests/test_nt_causal_risk_sizing.py",
          ]
          mismatches = []
          for path in paths:
              url = (
                  "https://raw.githubusercontent.com/umtong/SMC_ICT_4_LIVE/"
                  f"{commit}/{quote(path, safe='/')}"
              )
              with urlopen(url, timeout=30) as response:
                  frozen = response.read()
              if Path(path).read_bytes() != frozen:
                  mismatches.append(path)
          if mismatches:
              raise SystemExit(f"frozen source mismatch: {mismatches}")
          print(f"verified {len(paths)} frozen files at {commit}")
          PY
          python -m compileall -q \
            research/candidate-04/nt_backtest_v18c_regime_diagnostic.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_liquidity_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_composite_liquidity_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Replay frozen first BTC week with diagnostic annotations
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/candidate-04-v18c-regime/week1"
          mkdir -p "$out"
          python research/candidate-04/nt_backtest_v18c_regime_diagnostic.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start 2023-10-01 \
            --build-end 2023-10-09 \
            --evaluation-start 2023-10-03 \
            --evaluation-end 2023-10-09 \
            --cache .cache/candidate-04-v18c-regime/week1 \
            --output "$out" \
            | tee "$out/console.json"
          test -s "$out/metrics.json"
          test -s "$out/positions.csv"
          test -s "$out/strategy_events.json"

      - name: Replay frozen second BTC week with diagnostic annotations
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/candidate-04-v18c-regime/week2"
          mkdir -p "$out"
          python research/candidate-04/nt_backtest_v18c_regime_diagnostic.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start 2023-06-24 \
            --build-end 2023-07-02 \
            --evaluation-start 2023-06-26 \
            --evaluation-end 2023-07-02 \
            --cache .cache/candidate-04-v18c-regime/week2 \
            --output "$out" \
            | tee "$out/console.json"
          test -s "$out/metrics.json"
          test -s "$out/positions.csv"
          test -s "$out/strategy_events.json"

      - name: Build regime comparison table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          import pandas as pd

          base = Path("artifacts/candidate-04-v18c-regime")
          rows = []
          for week in ("week1", "week2"):
              root = base / week
              events = json.loads((root / "strategy_events.json").read_text())
              positions = pd.read_csv(root / "positions.csv")
              entries = [
                  event for event in events
                  if event.get("event_type") == "ENTRY_SUBMITTED"
              ]
              if len(entries) != len(positions.index):
                  raise SystemExit(
                      f"{week}: entry/position mismatch "
                      f"entries={len(entries)} positions={len(positions.index)}"
                  )
              for index, (event, position) in enumerate(
                  zip(entries, positions.to_dict("records")), start=1
              ):
                  pnl = float(
                      str(position["realized_pnl"]).split()[0].replace("_", "")
                  )
                  details = event["details"]
                  row = {
                      "week": week,
                      "trade": index,
                      "ts_event": event["ts_event"],
                      "scenario": event.get("scenario"),
                      "liquidity_scale": details.get("liquidity_scale"),
                      "side": position.get("entry"),
                      "realized_pnl": pnl,
                      "win": pnl > 0.0,
                      "avg_px_open": position.get("avg_px_open"),
                      "avg_px_close": position.get("avg_px_close"),
                  }
                  for key, value in details.items():
                      if isinstance(value, (int, float, bool, str)) or value is None:
                          row[key] = value
                  rows.append(row)

          keys = sorted({key for row in rows for key in row})
          with (base / "entry_regime_comparison.csv").open(
              "w", newline="", encoding="utf-8"
          ) as stream:
              writer = csv.DictWriter(stream, fieldnames=keys)
              writer.writeheader()
              writer.writerows(rows)
          (base / "entry_regime_comparison.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True, allow_nan=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(rows, indent=2, sort_keys=True, allow_nan=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v18c-regime-diagnostic-${{ github.sha }}
          path: artifacts/candidate-04-v18c-regime
          if-no-files-found: error
          retention-days: 90
