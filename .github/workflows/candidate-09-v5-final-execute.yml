name: Candidate 09 v5 verified execution

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v5-final-execute.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v5-verified-execution
  cancel-in-progress: false

jobs:
  verify-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Verify transport hashes and activate the frozen v5 candidate
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09

          cat \
            "$root/bootstrap/v5-engine.part00" \
            "$root/bootstrap/v5-engine.part01" \
            "$root/bootstrap/v5-engine.part02" \
            "$root/bootstrap/v5-engine.part03" \
            "$root/bootstrap/v5-engine.part04" \
            "$root/bootstrap/v5-engine.part05" | tr -d '\r\n\t ' > /tmp/v5-engine.gz.b64
          echo "ca0cc58f027762702507d2f7b5beb6e4b86330cb2ad8bd876849d11fa5334978  /tmp/v5-engine.gz.b64" | sha256sum -c -
          base64 -d /tmp/v5-engine.gz.b64 | gzip -dc > "$root/state_engine_v5.py"
          echo "1e26e4dd60088319a121aa1dadb8ef1c1d67f9587a2a14210b04623fb85e98ea  $root/state_engine_v5.py" | sha256sum -c -

          tr -d '\r\n\t ' < "$root/bootstrap/v5-test.gz.b64" > /tmp/v5-test.gz.b64
          echo "e23c1da45770bd59797882139c83382d5bb330ab905d978763cc25c1e42ae316  /tmp/v5-test.gz.b64" | sha256sum -c -
          base64 -d /tmp/v5-test.gz.b64 | gzip -dc > /tmp/test_state_engine_v5.py
          echo "f34c405465d3aaee91e46e5b5fe76f1aea94101ed163b5680a15ed93b4bf1efe  /tmp/test_state_engine_v5.py" | sha256sum -c -

          cp "$root/state_engine_v5.py" "$root/state_engine.py"
          cp "$root/config_v5.json" "$root/config.json"
          mkdir -p "$root/tests_v5" "$root/tests"
          cp /tmp/test_state_engine_v5.py "$root/tests_v5/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path

          root = Path('research/candidate-09')
          source = (root / 'tests_v5/test_state_engine.py').read_text(encoding='utf-8')
          source = source.replace('from state_engine_v5 import', 'from state_engine import')
          source = source.replace(
              'payload = json.loads((Path(__file__).with_name("config_v5.json")).read_text())',
              'payload = json.loads((Path(__file__).resolve().parents[1] / "config.json").read_text())',
          )
          (root / 'tests_v5/test_state_engine.py').write_text(source, encoding='utf-8')
          (root / 'tests/test_state_engine.py').write_text(source, encoding='utf-8')

          run_path = root / 'run.py'
          text = run_path.read_text(encoding='utf-8')
          old = '''ABLATIONS = (\n    "baseline",\n    "no-flow",\n    "no-acceptance-confirmation",\n    "no-reexpansion-confirmation",\n)\n'''
          new = '''ABLATIONS = (\n    "baseline",\n    "no-5m",\n    "with-240m",\n    "midpoint-target",\n)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('neither v4 nor v5 ablation contract is present')
              text = text.replace(old, new, 1)
          text = text.replace(
              'The structurally frozen v4 baseline and three',
              'The structurally frozen v5 baseline and three',
          )
          run_path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, contracts, and identical frozen-week gate
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v5-verified-execution"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"

          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate \
              --config "$root/config.json" \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi

          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('research/candidate-09')
          diag = root / 'diagnostics/v5-verified-execution'
          out = root / 'evidence/latest'
          codes = {key.lower(): int(os.environ[key]) for key in ('DOCTOR', 'COMPILE', 'TESTS', 'GATE')}
          failure = next((name for name, value in codes.items() if value != 0), None)
          (diag / 'diagnostic.json').write_text(json.dumps({
              'candidate_generation': 'v5-accepted-liquidity-trap-rotation',
              'classification': 'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes': codes,
              'first_failure': failure,
              'fixed_weeks_preserved': True,
              'parameter_search_performed': False,
              'engine_sha256': '1e26e4dd60088319a121aa1dadb8ef1c1d67f9587a2a14210b04623fb85e98ea',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
          }, indent=2, sort_keys=True) + '\n')
          if not (out / 'summary.json').exists():
              (out / 'summary.json').write_text(json.dumps({
                  'candidate': 'candidate-09-v5',
                  'status': 'IMPLEMENTATION_ERROR',
                  'first_failure': failure,
                  'codes': codes,
              }, indent=2, sort_keys=True) + '\n')
          for path in diag.glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              path.write_text('\n'.join(lines[-1800:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v5-verified-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v5-verified-execution
            research/candidate-09/config.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v5.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
          if-no-files-found: error
          retention-days: 30

      - name: Commit implementation and exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v5: verified frozen-week result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
