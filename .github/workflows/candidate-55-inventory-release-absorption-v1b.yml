name: candidate-55-inventory-release-absorption-v1b

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-inventory-release-absorption-v1b.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-inventory-release-absorption-v1b
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: development-2026-04-13_2026-04-19
            start: "2026-04-13"
            end: "2026-04-19"
            calendar_days: 7
            untouched: false
          - label: untouched-2025-11-03_2025-11-09
            start: "2025-11-03"
            end: "2025-11-09"
            calendar_days: 7
            untouched: true
          - label: continuous-2025-07-01_2025-07-30
            start: "2025-07-01"
            end: "2025-07-30"
            calendar_days: 30
            untouched: true
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 1

      - name: Materialize reused Nautilus policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_microauction.py research/candidate-51/router.py
          cp research/candidate-55/strategy_inventory_release_absorption.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and verify environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55

      - name: Freeze corrected schema without changing policy
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          UNTOUCHED: ${{ matrix.untouched }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          strategy = base["strategy"]
          # Implementation-only repair after the v1 run failed before engine
          # construction.  These fields belong to the inherited SMA strategy,
          # not to Candidate35Config for this micro-auction specialist.
          removed = []
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              if key in strategy:
                  removed.append(key)
                  strategy.pop(key)
          strategy.update(
              {
                  "microauction_mode": "absorption",
                  "microauction_atr_period": 30,
                  "microauction_balance_lookback": 10,
                  "microauction_stop_buffer_atr": 0.15,
                  "microauction_min_reward_r": 0.0,
                  "absorption_flow_min": 0.25,
                  "absorption_flow_15s_min": 0.15,
                  "absorption_flow_3m_min": 0.05,
                  "absorption_notional_burst_min": 1.50,
                  "absorption_trade_burst_min": 1.20,
                  "absorption_efficiency_max": 0.25,
                  "absorption_strength_min": 0.15,
                  "absorption_alignment_max_bps": 0.50,
                  "absorption_sweep_buffer_atr": 0.05,
                  "absorption_depth_defense_min": 0.00,
                  "absorption_same_depth_growth_min": 0.00,
                  "microauction_exit_on_opposite_state": False,
                  "inventory_context_lookback_minutes": 60,
                  "inventory_target_net_r": 2.0,
                  "feature_max_age_seconds": 65.0,
                  "cooldown_minutes": 0,
                  "max_hold_minutes": 240,
                  "funding_flatten_minute": 60,
                  "funding_blackout_before_minutes": -1,
                  "funding_blackout_after_minutes": -1,
              }
          )
          work = Path(".work/candidate-55-inventory-release-absorption-v1b")
          work.mkdir(parents=True, exist_ok=True)
          config_path = work / "frozen-config.json"
          config_path.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
          manifest = {
              "candidate": "candidate-55-inventory-release-absorption-v1b",
              "label": os.environ["LABEL"],
              "interval": [os.environ["START"], os.environ["END"]],
              "calendar_days": int(os.environ["CALENDAR_DAYS"]),
              "untouched": os.environ["UNTOUCHED"].lower() == "true",
              "policy_changed_from_v1": False,
              "implementation_only_schema_repair": True,
              "removed_inherited_unknown_fields": removed,
              "engine": "NautilusTrader BacktestNode",
              "universe": ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"],
              "global_entry_or_position_limit": 1,
              "risk_fraction_current_nav": 0.03,
              "context": [
                  "side-relative completed 60m return below four-asset mean",
                  "completed 15m open interest change below zero",
                  "completed 5m premium change in reversal direction above zero",
              ],
              "transition": "real-flow absorption, sweep, reclaim and defended depth",
              "episode_owner": "symbol, side, completed 60m price-extreme timestamp",
              "stop": "absorption event extreme plus 0.15 ATR",
              "target": "+2R after fee, slippage and funding reserves",
              "max_hold_minutes": 240,
              "strategy_sha256": hashlib.sha256(
                  Path("research/candidate-51/strategy.py").read_bytes()
              ).hexdigest(),
              "router_sha256": hashlib.sha256(
                  Path("research/candidate-51/router.py").read_bytes()
              ).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
          }
          (work / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import json
          from pathlib import Path
          from strategy import Candidate35Config, Candidate35Strategy

          payload = json.loads(
              Path(".work/candidate-55-inventory-release-absorption-v1b/frozen-config.json").read_text()
          )
          # Decode the exact strategy sub-document before spending data cost.
          Candidate35Config(**payload["strategy"])
          assert Candidate35Strategy is not None
          print("corrected Candidate35Config schema decodes")
          PY

      - name: Run frozen continuous account
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set +e
          output="artifacts/candidate-55/inventory-release-absorption-v1b-${LABEL}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/candidate-55-inventory-release-absorption-v1b/frozen-config.json \
            --start "$START" --end "$END" \
            --cache ".cache/candidate-55-inventory-release-absorption-v1b-${LABEL}" \
            --output "$output" \
            --workspace ".work/candidate-55-inventory-release-absorption-v1b-${LABEL}"
          code="$?"
          echo "$code" > .work/candidate-55-inventory-release-absorption-v1b/exit-code.txt
          exit 0

      - name: Write interval verdict
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          UNTOUCHED: ${{ matrix.untouched }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          label = os.environ["LABEL"]
          days = int(os.environ["CALENDAR_DAYS"])
          untouched = os.environ["UNTOUCHED"].lower() == "true"
          root = Path("artifacts/candidate-55") / f"inventory-release-absorption-v1b-{label}"
          mp = root / "metrics.json"
          dp = root / "strategy_diagnostics.json"
          cp = root / "closed_scenarios.json"
          ep = Path(".work/candidate-55-inventory-release-absorption-v1b/exit-code.txt")
          exit_code = int(ep.read_text().strip()) if ep.is_file() else None

          def number(value):
              if isinstance(value, (int, float)):
                  return float(value)
              if value is None:
                  return None
              match = re.search(
                  r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)",
                  str(value).replace(",", ""),
              )
              return float(match.group(0)) if match else None

          verdict = {
              "candidate": "candidate-55-inventory-release-absorption-v1b",
              "label": label,
              "calendar_days": days,
              "untouched": untouched,
              "exit_code": exit_code,
              "implementation_only_repair": True,
              "policy_changed_from_v1": False,
          }
          if not mp.is_file() or not dp.is_file():
              verdict.update(
                  {
                      "produced": False,
                      "classification": "IMPLEMENTATION_OR_DATA_BLOCKED",
                  }
              )
          else:
              metrics = json.loads(mp.read_text())
              diagnostics = json.loads(dp.read_text())
              closed = json.loads(cp.read_text()) if cp.is_file() else []
              episode_keys = [
                  str(item.get("inventory_episode_key"))
                  for item in closed
                  if item.get("inventory_episode_key")
              ]
              geometry_valid = sum(
                  item.get("actual_fill_geometry_valid") is True
                  for item in closed
              )
              risk_valid = sum(
                  item.get("actual_fill_risk_valid") is True
                  for item in closed
              )
              clean = (
                  int(diagnostics.get("order_rejections") or 0) == 0
                  and int(diagnostics.get("global_position_violations") or 0) == 0
                  and int(diagnostics.get("max_open_positions_observed") or 0) <= 1
                  and len(set(episode_keys)) == len(episode_keys)
                  and geometry_valid == len(closed)
                  and risk_valid == len(closed)
              )
              trades = int(metrics.get("trades") or 0)
              expectancy = float(metrics.get("expectancy_usdt") or 0.0)
              pf_raw = metrics.get("profit_factor")
              pf = float(pf_raw) if pf_raw is not None else None
              if trades == 0:
                  classification = "NO_INDEPENDENT_OPPORTUNITY"
              elif clean and expectancy > 0.0 and (pf is None or pf > 1.0):
                  classification = "COST_AFTER_POSITIVE"
              elif clean:
                  classification = "COST_AFTER_LOGIC_FAILURE"
              else:
                  classification = "EXECUTION_OR_INDEPENDENCE_FAILURE"
              planned_ratios = []
              for item in closed:
                  budget = number(item.get("risk_budget"))
                  planned = number(item.get("actual_planned_account_loss"))
                  if budget and planned is not None:
                      planned_ratios.append(planned / budget)
              verdict.update(
                  {
                      "produced": True,
                      "classification": classification,
                      "clean": clean,
                      "trades_per_calendar_day": trades / days,
                      "metrics": metrics,
                      "opportunity": {
                          key: diagnostics.get(key)
                          for key in (
                              "base_absorption_states",
                              "inventory_context_edges",
                              "inventory_episode_rejections",
                              "inventory_context_not_ready",
                              "inventory_context_rejection_counts",
                              "inventory_selected_episode_keys",
                              "inventory_edge_records",
                              "selected_symbols",
                              "unresolved_reason_counts",
                          )
                      },
                      "execution": {
                          key: diagnostics.get(key)
                          for key in (
                              "entry_submissions",
                              "fill_invalidations",
                              "fill_beyond_bracket_invalidations",
                              "fill_risk_budget_invalidations",
                              "order_rejections",
                              "entry_expirations",
                              "global_position_violations",
                              "max_open_positions_observed",
                              "max_simultaneous_entry_intents",
                          )
                      },
                      "closed_scenarios": len(closed),
                      "unique_episode_keys": len(set(episode_keys)),
                      "actual_fill_geometry_valid": geometry_valid,
                      "actual_fill_risk_valid": risk_valid,
                      "max_actual_planned_loss_over_budget": (
                          max(planned_ratios) if planned_ratios else None
                      ),
                      "project_interval_checks": {
                          "geometric_daily_growth_gte_1pct": float(
                              metrics.get("geometric_daily_growth") or 0.0
                          ) >= 0.01,
                          "trades_gte_calendar_days": trades >= days,
                          "positive_expectancy": expectancy > 0.0,
                          "max_drawdown_lte_20pct": float(
                              metrics.get("max_drawdown") or 1.0
                          ) <= 0.20,
                          "clean_execution_and_independence": clean,
                      },
                  }
              )
          root.mkdir(parents=True, exist_ok=True)
          (root / "V1B_VERDICT.json").write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-inventory-release-absorption-v1b-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-55/inventory-release-absorption-v1b-${{ matrix.label }}/**
            .work/candidate-55-inventory-release-absorption-v1b/manifest.json
            .work/candidate-55-inventory-release-absorption-v1b/exit-code.txt
          if-no-files-found: warn
          retention-days: 90
