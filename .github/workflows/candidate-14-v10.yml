name: Candidate 14 v10 failure-leg leadership diagnostic

on:
  push:
    branches: [research/candidate-14-v10-failure-leg-leadership]
    paths:
      - "research/candidate-14/**"
      - ".github/workflows/candidate-14-v10.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-14-v10-${{ github.sha }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Verify frozen diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-14:$GITHUB_WORKSPACE/src"
          python -m py_compile research/candidate-14/*.py
          python -m unittest discover -s research/candidate-14 -p 'test_*.py' -v
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('research/candidate-14')
          p = json.loads((root/'protocol.json').read_text())
          lock = json.loads((root/'V10_DEVELOPMENT_LOCK.json').read_text())
          assert p['candidate'] == lock['candidate']
          assert p['validation_mode'] == 'diagnostic'
          assert lock['claim_allowed'] is False
          assert p['selection']['evaluation_days'] == 84
          assert p['selection']['holdouts'] == lock['selection']['holdouts']
          assert p['strategy_change_control']['single_change'] == 'confirmed acceptance failure leadership begins at failure observation'
          for name, expected in p['locked_source']['blobs'].items():
              actual = subprocess.check_output(['git','hash-object',str(root/name)], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'locked source drift: {name}: {actual} != {expected}')
          PY

  evaluate:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Run one continuous 84-day Nautilus account
        shell: bash
        run: bash research/candidate-14/run_week.sh L1
      - name: Remove downloaded archives
        if: always()
        run: rm -rf research/candidate-14/results/L1/data
      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate14-v10-L1
          path: |
            research/candidate-14/results/L1/run.json
            research/candidate-14/results/L1/data_manifest.json
            research/candidate-14/results/L1/metrics.json
            research/candidate-14/results/L1/summary.json
            research/candidate-14/results/L1/audit.json
            research/candidate-14/results/L1/audit.md
            research/candidate-14/results/L1/source_lock.json
            research/candidate-14/results/L1/effective_config.json
            research/candidate-14/results/L1/scenario_events.jsonl
            research/candidate-14/results/L1/submitted_plans.json
            research/candidate-14/results/L1/order_lifecycle.json
            research/candidate-14/results/L1/orders.csv
            research/candidate-14/results/L1/positions.csv
            research/candidate-14/results/L1/account.csv
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ needs.static.result == 'success' && needs.evaluate.result == 'success' }}
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: candidate14-v10-L1, path: artifacts/v10}
      - name: Audit, aggregate and persist fresh evidence
        shell: bash
        run: |
          set -euo pipefail
          branch='research/candidate-14-v10-failure-leg-leadership'
          git fetch origin "$branch"
          [[ "$(git rev-parse origin/$branch)" == "$GITHUB_SHA" ]] || exit 0
          rm -rf research/candidate-14/results
          mkdir -p research/candidate-14/results/L1
          cp -a artifacts/v10/. research/candidate-14/results/L1/
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/candidate-14'); f=root/'results/L1'
          p=json.loads((root/'protocol.json').read_text())
          m=json.loads((f/'metrics.json').read_text()); a=json.loads((f/'audit.json').read_text())
          run=json.loads((f/'run.json').read_text()); lock=json.loads((f/'source_lock.json').read_text())
          assert m['candidate']==p['candidate'] and m['validation_mode']=='diagnostic'
          assert run['candidate']==p['candidate'] and lock['candidate']==p['candidate']
          assert m['success_claim'] is False
          for key in ('evidence_complete','metric_recalculation_passed','risk_budget_passed','global_slot_passed','partial_entry_protection_passed','no_liquidation_passed','engine_errors_absent'):
              if a.get(key) is not True: raise SystemExit(f'audit failed: {key}')
          required=set(p['locked_source']['blobs']); actual=set(lock.get('files',{}))
          if not required.issubset(actual): raise SystemExit(f'source-lock omissions: {sorted(required-actual)}')
          PY
          python research/candidate-14/diagnostic_continuous_aggregate.py \
            --result-dir research/candidate-14/results/L1 \
            --protocol research/candidate-14/protocol.json \
            --output research/candidate-14/aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('research/candidate-14/aggregate.json').read_text())
          assert v['validation_mode']=='diagnostic'
          assert v['success_claim'] is False
          assert v['weekly_reset_aggregation'] is False
          PY
          [[ "$(git ls-remote origin refs/heads/$branch | cut -f1)" == "$GITHUB_SHA" ]] || exit 0
          git config user.name candidate-14-v10-bot
          git config user.email candidate-14-v10-bot@users.noreply.github.com
          git add -A research/candidate-14/results research/candidate-14/aggregate.json research/candidate-14/RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'candidate-14 v10: record controlled diagnostic evidence [skip ci]'
            git push origin "HEAD:$branch"
          fi
