name: candidate-07-close-target-ablation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/run_pre_attack_close_safe.py"
      - ".github/workflows/candidate-07-close-ablation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-close-target-ablation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-close-target-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4

      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-pyc \
            /opt/smc4/.venv/bin/python -m compileall -q research/candidate-07
          /opt/smc4/.venv/bin/python -m unittest discover \
            -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore the same checksum-verified W1 cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-pre-attack-value-week1-v1
          restore-keys: |
            candidate-07-aggtrade-event-tournament-week1-v2
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1

      - name: Run the single close-target ablation in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/python research/candidate-07/run_pre_attack_close_safe.py \
            --config research/candidate-07/config.json \
            --stage week-1 \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --event-warmup-days 1 \
            --output artifacts/candidate-07/week-1/pre-attack-close-ablation \
            --data-root .research-data/candidate-07

      - name: Print immutable ablation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('artifacts/candidate-07/week-1/pre-attack-close-ablation')
          metrics = root / 'metrics.json'
          if not metrics.exists():
              raise SystemExit('ABLATION_METRICS_MISSING')
          payload = json.loads(metrics.read_text())
          print(json.dumps({
              'source_commit': '${{ github.sha }}',
              'controlled_change': 'prior complete 15s close replaces VWAP only',
              'metrics': payload,
              'metrics_sha256': hashlib.sha256(metrics.read_bytes()).hexdigest(),
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve complete ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-close-ablation-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1/pre-attack-close-ablation
          retention-days: 14
          if-no-files-found: error
