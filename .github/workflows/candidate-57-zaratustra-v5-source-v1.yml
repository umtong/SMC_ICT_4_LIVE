name: candidate-57-zaratustra-v5-source-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-zaratustra-v5-source-v1.yml"
      - "research/candidate-57/ZARATUSTRA_V5_SOURCE_V1_FREEZE.md"
      - "research/candidate-57/router_zaratustra_v5.py"
      - "research/candidate-57/router_zaratustra_runtime.py"
      - "research/candidate-57/strategy_zaratustra_v5.py"
      - "research/candidate-57/zaratustra_v5_source_campaign.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-zaratustra-v5-source-v1
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble source on reused project execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/ZARATUSTRA_V5_SOURCE_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_zaratustra_v5.py research/candidate-51/router_zaratustra_impl.py
          cp research/candidate-57/router_zaratustra_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_zaratustra_v5.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_zaratustra_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/zaratustra_v5_source_campaign.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove exact source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from router import (
              RouteConfig,
              _directional_indicators,
              _geometry,
              _level,
              _timeframe_snapshot,
          )
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_picasso import Candidate35Strategy as ExecutionShell

          assert issubclass(Candidate35Strategy, ExecutionShell)
          fields = set(Candidate35Config.__struct_fields__)
          required = {
              "zara_trigger_mode",
              "zara_side_mode",
              "zara_risk_mode",
              "zara_rsi_threshold",
              "zara_di_threshold",
              "zara_source_stop_fraction",
          }
          assert required.issubset(fields), required - fields
          level = inspect.getsource(_level)
          for token in (
              '("5m", 5)',
              '("15m", 15)',
              '("30m", 30)',
              "rsi > rsi_threshold",
              "plus_di > di_threshold",
              "close > middle",
              "rsi < rsi_threshold",
              "minus_di > di_threshold",
              "close < middle",
          ):
              assert token in level, token
          geometry = inspect.getsource(_geometry)
          assert '"source_fraction"' in geometry
          assert '"auction_structure"' in geometry
          management = inspect.getsource(Candidate35Strategy._roi_profit_ratio)
          assert "100.0" in management
          assert callable(_directional_indicators)
          assert callable(_timeframe_snapshot)
          assert abs(RouteConfig().zara_source_stop_fraction - 0.0296) < 1e-12
          print("Zaratustra source state, normalized risk and causal execution contracts verified")
          PY

      - name: Run conditional source tournament with complete trade ledgers
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-zaratustra-v5-source-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/zaratustra_v5_source_campaign.py \
            2>&1 | tee .work/candidate-57-zaratustra-v5-source-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_zaratustra_impl.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/zaratustra-v5-source-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist public ZaratustraV5 evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete tournament artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-zaratustra-v5-source-v1
          path: |
            research/candidate-57/evidence/zaratustra-v5-source-v1
            .work/candidate-57-zaratustra-v5-source-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "ZaratustraV5 tournament failed mechanically; status=$status"
            exit "${status:-1}"
          fi
