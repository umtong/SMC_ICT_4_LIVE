name: candidate-08-shared-acceptance-holdout-stage-a-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-shared-acceptance-holdout-stage-a-v1"

permissions:
  contents: write
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      run: ${{ steps.select.outputs.run }}
      runner_kind: ${{ steps.select.outputs.runner_kind }}
      variant: ${{ steps.select.outputs.variant }}
      matrix: ${{ steps.select.outputs.matrix }}
      final_route: ${{ steps.select.outputs.final_route }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for three-week continuation and freeze selected runner
        id: select
        shell: bash
        run: |
          set -euo pipefail
          route_file=research/candidate-08/evidence/shared-acceptance-continuation-v1/final_route.txt
          for attempt in $(seq 1 600); do
            git fetch origin research/candidate-08
            git reset --hard origin/research/candidate-08
            [[ -f "$route_file" ]] && break
            sleep 15
          done
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          route_path = Path("research/candidate-08/evidence/shared-acceptance-continuation-v1/final_route.txt")
          final_route = route_path.read_text().strip() if route_path.exists() else "NO_ROUTE"
          run = final_route in {"SCREEN_GATE_PASSED", "SCREEN_GATE_PASSED_AFTER_ABLATION"}
          runner_kind = "NONE"
          variant = "NONE"
          selected_path = Path("research/candidate-08/evidence/shared-acceptance-continuation-v1/selected_variant.json")
          if run and selected_path.exists():
              selected = json.loads(selected_path.read_text())
              runner_kind = selected["runner_kind"]
              variant = selected["variant"]
              if final_route == "SCREEN_GATE_PASSED_AFTER_ABLATION":
                  if runner_kind == "BASE":
                      runner_kind = "BASE_ABLATION"
                  elif runner_kind == "IMPLEMENTATION":
                      runner_kind = "IMPLEMENTATION_ABLATION"
                  variant = f"{variant}_NO_CONTRACTION"
          holdout = json.loads(Path("research/candidate-08/shared_acceptance_extended_holdout_v1.json").read_text())
          matrix = {"include": holdout["stage_a"]}
          print(f"run={'true' if run else 'false'}")
          print(f"runner_kind={runner_kind}")
          print(f"variant={variant}")
          print(f"final_route={final_route}")
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

  evaluate:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      DATA_CACHE: /tmp/candidate-08-acceptance-${{ matrix.name }}
      WINDOW_OUTPUT: /tmp/candidate-08-holdout-stage-a/${{ matrix.name }}
      RUNNER_KIND: ${{ needs.prepare.outputs.runner_kind }}
      VARIANT: ${{ needs.prepare.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0

      - name: Restore window-specific verified data
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_CACHE }}
          key: candidate-08-holdout-stage-a-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            candidate-08-holdout-${{ matrix.name }}-
            candidate-08-aggtrade-acceptance-

      - name: Run selected variant on frozen holdout week
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$WINDOW_OUTPUT"
          mkdir -p "$WINDOW_OUTPUT"
          set +e
          {
            set -euo pipefail
            smc4 doctor
            python - <<'PY'
            import json
            import os
            from pathlib import Path
            base = json.loads(Path("research/candidate-08/config_aggtrade_acceptance_shared.json").read_text())
            base["candidate"] = f"candidate-08-holdout-{os.environ['VARIANT']}"
            base["suites"]["first"] = [{
                "name": os.environ["WINDOW_NAME"],
                "start": os.environ["WINDOW_START"],
                "end": os.environ["WINDOW_END"],
            }]
            if os.environ["RUNNER_KIND"] in {"BASE_ABLATION", "IMPLEMENTATION_ABLATION"}:
                base["ablation"] = {
                    "removed_variable": "RETEST_ACTIVITY_AND_IMBALANCE_CONTRACTION",
                    "only_ablation": True,
                }
            output = Path(os.environ["WINDOW_OUTPUT"])
            (output / "config.json").write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
            PY
            kind="$RUNNER_KIND"
            impl=research/candidate-08/evidence/shared-acceptance-implementation-v3
            case "$kind" in
              BASE)
                python research/candidate-08/run_shared_acceptance_first_v1.py \
                  --config "$WINDOW_OUTPUT/config.json" --output "$WINDOW_OUTPUT/run" --data-cache "$DATA_CACHE"
                ;;
              BASE_ABLATION)
                python research/candidate-08/run_shared_acceptance_no_contraction_ablation.py \
                  --config "$WINDOW_OUTPUT/config.json" --output "$WINDOW_OUTPUT/run" --data-cache "$DATA_CACHE"
                ;;
              IMPLEMENTATION)
                PYTHONPATH="research/candidate-08:$impl" python "$impl/run_first_v3.py" \
                  --config "$WINDOW_OUTPUT/config.json" --output "$WINDOW_OUTPUT/run" --data-cache "$DATA_CACHE"
                ;;
              IMPLEMENTATION_ABLATION)
                cat > "$WINDOW_OUTPUT/run_impl_ablation.py" <<'PY'
            from __future__ import annotations
            import run_first_v3 as base_runner
            from aggtrade_acceptance_no_contraction_ablation import build_acceptance_signals_no_contraction
            base_runner.build_acceptance_signals = build_acceptance_signals_no_contraction
            if __name__ == "__main__":
                raise SystemExit(base_runner.main())
            PY
                PYTHONPATH="research/candidate-08:$impl:$WINDOW_OUTPUT" python "$WINDOW_OUTPUT/run_impl_ablation.py" \
                  --config "$WINDOW_OUTPUT/config.json" --output "$WINDOW_OUTPUT/run" --data-cache "$DATA_CACHE"
                ;;
              *)
                echo "unsupported runner kind: $kind" >&2
                exit 2
                ;;
            esac
          } 2>&1 | tee "$WINDOW_OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$WINDOW_OUTPUT/runner_exit_status.txt"
          exit 0
        env:
          WINDOW_NAME: ${{ matrix.name }}
          WINDOW_START: ${{ matrix.start }}
          WINDOW_END: ${{ matrix.end }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-holdout-stage-a-${{ matrix.name }}
          path: ${{ env.WINDOW_OUTPUT }}
          retention-days: 30
          if-no-files-found: error

      - name: Preserve verified window data
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_CACHE }}
          key: candidate-08-holdout-stage-a-${{ matrix.name }}-${{ github.sha }}

  aggregate:
    needs: [prepare, evaluate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0

      - name: Download Stage A artifacts
        if: needs.prepare.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-08-holdout-stage-a-*
          path: /tmp/candidate-08-holdout-stage-a-artifacts
          merge-multiple: false

      - name: Aggregate cost-after shared-account holdout evidence
        shell: bash
        env:
          SHOULD_RUN: ${{ needs.prepare.outputs.run }}
          RUNNER_KIND: ${{ needs.prepare.outputs.runner_kind }}
          VARIANT: ${{ needs.prepare.outputs.variant }}
          FINAL_ROUTE: ${{ needs.prepare.outputs.final_route }}
        run: |
          set -euo pipefail
          output=research/candidate-08/evidence/shared-acceptance-holdout-stage-a-v1
          rm -rf "$output"
          mkdir -p "$output/windows"
          if [[ "$SHOULD_RUN" != true ]]; then
            printf '%s\n' "$FINAL_ROUTE" > "$output/upstream_route.txt"
            printf 'NOT_RUN\n' > "$output/route.txt"
            printf '{"reason":"three-week screen did not pass","upstream_route":"%s"}\n' "$FINAL_ROUTE" > "$output/holdout_not_run.json"
          else
            python - <<'PY'
            import json
            from math import exp, log
            from pathlib import Path
            import re
            import shutil
            import pandas as pd

            artifacts = Path("/tmp/candidate-08-holdout-stage-a-artifacts")
            output = Path("research/candidate-08/evidence/shared-acceptance-holdout-stage-a-v1")
            plan = json.loads(Path("research/candidate-08/shared_acceptance_extended_holdout_v1.json").read_text())
            windows = plan["stage_a"]
            metrics = []
            implementation_failures = []
            positive_pnls = []
            traded_assets = set()

            def number(value):
                if isinstance(value, (int, float)):
                    return float(value)
                match = re.search(r"[-+]?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?", str(value).replace(",", ""))
                return float(match.group()) if match else None

            for window in windows:
                name = window["name"]
                source = artifacts / f"candidate-08-holdout-stage-a-{name}"
                destination = output / "windows" / name
                if source.exists():
                    shutil.copytree(source, destination, dirs_exist_ok=True)
                status_path = destination / "runner_exit_status.txt"
                status = int(status_path.read_text().strip()) if status_path.exists() else 999
                metrics_path = destination / "run/metrics.json"
                if status != 0 or not metrics_path.exists():
                    implementation_failures.append({"name": name, "runner_exit_status": status})
                    continue
                item = json.loads(metrics_path.read_text())
                metrics.append(item)
                intents_path = destination / "run/trade_intents.json"
                if intents_path.exists():
                    intents = json.loads(intents_path.read_text()).get("trade_intents", [])
                    traded_assets.update(str(intent.get("symbol")) for intent in intents if intent.get("symbol"))
                positions_path = destination / "run/positions.csv"
                if positions_path.exists():
                    frame = pd.read_csv(positions_path)
                    columns = [c for c in frame.columns if c.lower() in {"realized_pnl", "pnl", "realized_return"}]
                    if columns:
                        for raw in frame[columns[0]].tolist():
                            value = number(raw)
                            if value is not None and value > 0:
                                positive_pnls.append(value)

            if implementation_failures or len(metrics) != len(windows):
                summary = {
                    "candidate": "candidate-08-aggtrade-acceptance-nautilus",
                    "variant": __import__("os").environ["VARIANT"],
                    "runner_kind": __import__("os").environ["RUNNER_KIND"],
                    "stage": "A",
                    "implementation_failures": implementation_failures,
                    "gate_passed": False,
                    "route": "STAGE_A_IMPLEMENTATION_FAILURE",
                }
            else:
                days = sum(float(item["calendar_days"]) for item in metrics)
                log_returns = [log(float(item["nav_multiple"])) for item in metrics]
                combined = exp(sum(log_returns) / days) - 1.0
                positive_weeks = sum(float(item["total_return"]) > 0 for item in metrics)
                closed = [int(item["position_metrics"]["closed_trades"]) for item in metrics]
                wins = sum(int(item["position_metrics"]["wins"]) for item in metrics)
                total_closed = sum(closed)
                positive_trade_share = wins / total_closed if total_closed else 0.0
                positive_logs = [value for value in log_returns if value > 0]
                positive_log_total = sum(positive_logs)
                max_week_share = max(positive_logs) / positive_log_total if positive_log_total else 0.0
                positive_pnl_total = sum(positive_pnls)
                max_trade_share = max(positive_pnls) / positive_pnl_total if positive_pnl_total else 0.0
                checks = {
                    "minimum_positive_weeks": positive_weeks >= 3,
                    "minimum_total_closed_trades": total_closed >= 12,
                    "minimum_weeks_with_at_least_two_trades": sum(value >= 2 for value in closed) >= 3,
                    "minimum_positive_trade_share": positive_trade_share >= 0.45,
                    "minimum_assets_traded": len(traded_assets) >= 3,
                    "maximum_single_positive_week_log_contribution": max_week_share <= 0.50,
                    "maximum_single_positive_trade_pnl_share": max_trade_share <= 0.50,
                    "minimum_combined_daily_geometric_growth": combined >= 0.01,
                    "no_execution_failures": all(int(item["execution_failures"]) == 0 for item in metrics),
                    "no_residual_exposure": all(
                        int(item["open_positions_after_run"]) == 0 and int(item["open_orders_after_run"]) == 0
                        for item in metrics
                    ),
                    "no_unexpected_or_liquidation_closes": all(
                        int(item["unexpected_or_liquidation_closes"]) == 0 for item in metrics
                    ),
                    "complete_multiasset_timestamps": all(
                        int(item["incomplete_multiasset_timestamps"]) == 0 for item in metrics
                    ),
                }
                passed = all(checks.values())
                runner_kind = __import__("os").environ["RUNNER_KIND"]
                if passed:
                    route = "RUN_STAGE_B"
                elif runner_kind in {"BASE", "IMPLEMENTATION"}:
                    route = "STAGE_A_LOGIC_FAILURE_UNABLATED"
                else:
                    route = "DISCARD_ACCEPTANCE_FAMILY"
                summary = {
                    "candidate": "candidate-08-aggtrade-acceptance-nautilus",
                    "variant": __import__("os").environ["VARIANT"],
                    "runner_kind": runner_kind,
                    "stage": "A",
                    "engine": "NautilusTrader",
                    "calendar_days": days,
                    "combined_daily_geometric_growth": combined,
                    "goal_daily_geometric_growth": 0.01,
                    "positive_weeks": positive_weeks,
                    "closed_trades_by_window": closed,
                    "total_closed_trades": total_closed,
                    "positive_trade_share": positive_trade_share,
                    "assets_traded": sorted(traded_assets),
                    "maximum_single_positive_week_log_contribution": max_week_share,
                    "maximum_single_positive_trade_pnl_share": max_trade_share,
                    "gate_checks": checks,
                    "gate_passed": passed,
                    "route": route,
                    "window_results": [
                        {
                            "name": item["window"]["name"],
                            "closed_trades": item["position_metrics"]["closed_trades"],
                            "wins": item["position_metrics"]["wins"],
                            "win_rate": item["position_metrics"]["win_rate"],
                            "total_return": item["total_return"],
                            "daily_geometric_growth": item["daily_geometric_growth"],
                            "maximum_realized_equity_drawdown": item["maximum_realized_equity_drawdown"],
                        }
                        for item in metrics
                    ],
                }
            (output / "suite_metrics.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
            (output / "route.txt").write_text(summary["route"] + "\n")
            print(json.dumps(summary, indent=2, sort_keys=True))
            PY
          fi

      - name: Commit Stage A evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin research/candidate-08
          rm -f research/candidate-08/.run-shared-acceptance-holdout-stage-a-v1
          git add \
            research/candidate-08/evidence/shared-acceptance-holdout-stage-a-v1 \
            research/candidate-08/.run-shared-acceptance-holdout-stage-a-v1
          git commit -m "candidate-08: record four-year Stage A holdout" || true
          git push origin HEAD:research/candidate-08

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-holdout-stage-a-aggregate-${{ github.run_id }}
          path: research/candidate-08/evidence/shared-acceptance-holdout-stage-a-v1
          retention-days: 30
          if-no-files-found: warn
