name: candidate-03-research

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/**"
      - ".github/workflows/candidate-03.yml"
      - "src/smc_ict_4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-btc-week-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Causal and accounting tests
        run: |
          PYTHONPATH=src:research/candidate-03 python research/candidate-03/test_candidate.py
          PYTHONPATH=src:research/candidate-03 python research/candidate-03/test_far.py

      - name: Download first precommitted BTC week
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades --symbol BTCUSDT
          --start-date 2022-03-06 --end-date 2022-03-13
          --output .research-data/candidate-03/far/week-1 --no-extract

      - name: Evaluate first precommitted BTC week
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_far.py
          --data .research-data/candidate-03/far/week-1/BTCUSDT-aggTrades-*.zip
          --week-start 2022-03-07
          --label btc-week-1-2022-03-07-far-v1
          --output artifacts/candidate-03/far/week-1

      - name: Gate first BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/far/week-1/metrics.json
          --minimum-trades 8 --minimum-win-rate 0.45
          --minimum-daily-growth 0.01 --require-target

      - name: Download second precommitted BTC week
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades --symbol BTCUSDT
          --start-date 2025-03-16 --end-date 2025-03-23
          --output .research-data/candidate-03/far/week-2 --no-extract

      - name: Evaluate second precommitted BTC week
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_far.py
          --data .research-data/candidate-03/far/week-2/BTCUSDT-aggTrades-*.zip
          --week-start 2025-03-17
          --label btc-week-2-2025-03-17-far-v1
          --output artifacts/candidate-03/far/week-2

      - name: Gate second BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/far/week-2/metrics.json
          --minimum-trades 8 --minimum-win-rate 0.45
          --minimum-daily-growth 0.01 --require-target

      - name: Download third precommitted BTC week
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades --symbol BTCUSDT
          --start-date 2023-08-27 --end-date 2023-09-03
          --output .research-data/candidate-03/far/week-3 --no-extract

      - name: Evaluate third precommitted BTC week
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_far.py
          --data .research-data/candidate-03/far/week-3/BTCUSDT-aggTrades-*.zip
          --week-start 2023-08-28
          --label btc-week-3-2023-08-28-far-v1
          --output artifacts/candidate-03/far/week-3

      - name: Gate third BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/far/week-3/metrics.json
          --minimum-trades 8 --minimum-win-rate 0.45
          --minimum-daily-growth 0.01 --require-target

      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-far-gates-${{ github.sha }}
          path: |
            artifacts/candidate-03/far
            .research-data/candidate-03/far/**/*.manifest.json
          if-no-files-found: error
