name: candidate-03-nt-lvcfr-v1

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/**"
      - ".github/workflows/candidate-03.yml"
      - "src/smc_ict_4/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03

jobs:
  staged-btc-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned NautilusTrader path and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py &&
              PYTHONPYCACHEPREFIX=/tmp/nt-lvcfr-pycache \
                python -m compileall -q research/candidate-03 src/smc_ict_4
            '

      - name: Restore exact first-week prepared data
        uses: actions/cache@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr/validation-1/prepared
          key: nt-lvcfr-v3-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_config.json') }}

      - name: First frozen BTC week — 2024-01-08
        shell: bash
        run: |
          set -euo pipefail
          week=2024-01-08
          label=validation-1
          out="artifacts/candidate-03/nt-lvcfr/$label"
          mkdir -p "$out/prepared"
          chmod -R 0777 artifacts

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "smc4 doctor && PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr.py --week-start $week --output $out/prepared --require-minimum" \
            2>&1 | tee "$out/preflight.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start $week --output $out" \
            2>&1 | tee "$out/backtest.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config research/candidate-03/nt_lvcfr_config.json \
            | tee "$out/gate.json"

      - name: Restore exact second-week prepared data
        uses: actions/cache@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr/validation-2/prepared
          key: nt-lvcfr-v3-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_config.json') }}

      - name: Second frozen BTC week — 2025-06-23
        shell: bash
        run: |
          set -euo pipefail
          week=2025-06-23
          label=validation-2
          out="artifacts/candidate-03/nt-lvcfr/$label"
          mkdir -p "$out/prepared"
          chmod -R 0777 artifacts

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "smc4 doctor && PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr.py --week-start $week --output $out/prepared --require-minimum" \
            2>&1 | tee "$out/preflight.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start $week --output $out" \
            2>&1 | tee "$out/backtest.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config research/candidate-03/nt_lvcfr_config.json \
            | tee "$out/gate.json"

      - name: Restore exact third-week prepared data
        uses: actions/cache@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr/validation-3/prepared
          key: nt-lvcfr-v3-btc-2022-05-16-${{ hashFiles('research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_config.json') }}

      - name: Third frozen BTC week — 2022-05-16
        shell: bash
        run: |
          set -euo pipefail
          week=2022-05-16
          label=validation-3
          out="artifacts/candidate-03/nt-lvcfr/$label"
          mkdir -p "$out/prepared"
          chmod -R 0777 artifacts

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "smc4 doctor && PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr.py --week-start $week --output $out/prepared --require-minimum" \
            2>&1 | tee "$out/preflight.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py --week-start $week --output $out" \
            2>&1 | tee "$out/backtest.log"

          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            python research/candidate-03/gate_nt_lvcfr.py "$out/metrics.json" \
              --config research/candidate-03/nt_lvcfr_config.json \
            | tee "$out/gate.json"

      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-nt-lvcfr-${{ github.sha }}
          path: |
            artifacts/candidate-03/nt-lvcfr/**/*.json
            artifacts/candidate-03/nt-lvcfr/**/*.jsonl
            artifacts/candidate-03/nt-lvcfr/**/*.csv
            artifacts/candidate-03/nt-lvcfr/**/*.log
          if-no-files-found: warn
          retention-days: 30
