name: candidate-03-lcpt-v1

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/**"
      - ".github/workflows/candidate-03.yml"
      - "src/smc_ict_4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Frozen selection and causal/accounting tests
        run: |
          PYTHONPATH=src:research/candidate-03 \
            python research/candidate-03/test_lcpt.py
          python research/candidate-03/select_lcpt_weeks.py
          python -m compileall -q research/candidate-03 src/smc_ict_4

  validation-week-1:
    needs: causal-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Open first frozen BTC week only
        run: >-
          python research/candidate-03/download_lcpt_bundle.py
          --symbol BTCUSDT
          --week-start 2023-04-10
          --output .research-data/candidate-03/lcpt/validation-1
      - name: Exact aggregate-trade replay
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_lcpt.py
          --futures-agg .research-data/candidate-03/lcpt/validation-1/futures-agg/*.zip
          --spot-agg .research-data/candidate-03/lcpt/validation-1/spot-agg/*.zip
          --metrics .research-data/candidate-03/lcpt/validation-1/metrics/*.zip
          --week-start 2023-04-10
          --label btc-lcpt-validation-1-2023-04-10
          --output artifacts/candidate-03/lcpt/validation-1
      - name: Gate first frozen BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/lcpt/validation-1/metrics.json
          --minimum-trades 8
          --minimum-win-rate 0.45
          --minimum-daily-growth 0.01
          --require-target
      - name: Preserve first validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-lcpt-validation-1-${{ github.sha }}
          path: |
            artifacts/candidate-03/lcpt/validation-1
            .research-data/candidate-03/lcpt/validation-1/*.manifest.json
          if-no-files-found: error

  validation-week-2:
    needs: validation-week-1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Open second frozen BTC week after week 1 passes
        run: >-
          python research/candidate-03/download_lcpt_bundle.py
          --symbol BTCUSDT
          --week-start 2025-02-03
          --output .research-data/candidate-03/lcpt/validation-2
      - name: Exact aggregate-trade replay
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_lcpt.py
          --futures-agg .research-data/candidate-03/lcpt/validation-2/futures-agg/*.zip
          --spot-agg .research-data/candidate-03/lcpt/validation-2/spot-agg/*.zip
          --metrics .research-data/candidate-03/lcpt/validation-2/metrics/*.zip
          --week-start 2025-02-03
          --label btc-lcpt-validation-2-2025-02-03
          --output artifacts/candidate-03/lcpt/validation-2
      - name: Gate second frozen BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/lcpt/validation-2/metrics.json
          --minimum-trades 8
          --minimum-win-rate 0.45
          --minimum-daily-growth 0.01
          --require-target
      - name: Preserve second validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-lcpt-validation-2-${{ github.sha }}
          path: |
            artifacts/candidate-03/lcpt/validation-2
            .research-data/candidate-03/lcpt/validation-2/*.manifest.json
          if-no-files-found: error

  validation-week-3:
    needs: validation-week-2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Open third frozen BTC week after weeks 1 and 2 pass
        run: >-
          python research/candidate-03/download_lcpt_bundle.py
          --symbol BTCUSDT
          --week-start 2025-10-06
          --output .research-data/candidate-03/lcpt/validation-3
      - name: Exact aggregate-trade replay
        run: >-
          PYTHONPATH=src:research/candidate-03
          python research/candidate-03/run_lcpt.py
          --futures-agg .research-data/candidate-03/lcpt/validation-3/futures-agg/*.zip
          --spot-agg .research-data/candidate-03/lcpt/validation-3/spot-agg/*.zip
          --metrics .research-data/candidate-03/lcpt/validation-3/metrics/*.zip
          --week-start 2025-10-06
          --label btc-lcpt-validation-3-2025-10-06
          --output artifacts/candidate-03/lcpt/validation-3
      - name: Gate third frozen BTC week
        run: >-
          python research/candidate-03/gate.py
          artifacts/candidate-03/lcpt/validation-3/metrics.json
          --minimum-trades 8
          --minimum-win-rate 0.45
          --minimum-daily-growth 0.01
          --require-target
      - name: Preserve third validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-lcpt-validation-3-${{ github.sha }}
          path: |
            artifacts/candidate-03/lcpt/validation-3
            .research-data/candidate-03/lcpt/validation-3/*.manifest.json
          if-no-files-found: error
