name: candidate-03-nt-lvcfr-v1-legacy

# Historical V1 reproduction only. Active candidate workflows are versioned
# separately and enforce their own sequential gates. Keeping this workflow on
# every research-file push repeatedly occupied the repository runner with an
# obsolete three-week candidate, delaying controlled NautilusTrader iterations.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03

jobs:
  historical-v1-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned NautilusTrader path and historical contracts
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c '
              smc4 doctor &&
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src:/workspace/research/candidate-03 \
                python research/candidate-03/test_nt_lvcfr.py
            '

      - name: Reproduce historical V1 frozen weeks
        shell: bash
        run: |
          set -euo pipefail
          for week in 2024-01-08 2025-06-23 2022-05-16; do
            out="artifacts/candidate-03/legacy-v1/${week}"
            mkdir -p "$out/prepared"
            sudo chmod -R a+rwX artifacts
            docker run --rm \
              -v "$PWD:/workspace" -w /workspace "$IMAGE" \
              bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/prepare_nt_lvcfr.py \
                --week-start $week --output $out/prepared --require-minimum"
            docker run --rm \
              -v "$PWD:/workspace" -w /workspace "$IMAGE" \
              bash -c "PYTHONPATH=$PYTHONPATH python research/candidate-03/run_nt_lvcfr.py \
                --week-start $week --output $out"
          done

      - name: Preserve historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-legacy-v1-${{ github.sha }}
          path: artifacts/candidate-03/legacy-v1/**
          if-no-files-found: warn
          retention-days: 30
