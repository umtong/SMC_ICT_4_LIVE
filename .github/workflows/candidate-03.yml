name: candidate-03-research

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/**"
      - ".github/workflows/candidate-03.yml"
      - "src/smc_ict_4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-random-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Candidate unit tests
        run: PYTHONPATH=src python research/candidate-03/test_candidate.py
      - name: Download official BTCUSDT one-minute baseline data
        run: python research/candidate-03/download_month.py --month 2022-03 --output .research-data/candidate-03/bars
      - name: Download official BTCUSDT aggregate-trade event data
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades
          --symbol BTCUSDT
          --start-date 2022-03-06
          --end-date 2022-03-13
          --output .research-data/candidate-03/aggTrades
      - name: Run failed one-minute proxy baseline for regression evidence
        run: >-
          PYTHONPATH=src python research/candidate-03/run_research.py
          --data .research-data/candidate-03/bars/BTCUSDT-1m-2022-03.csv
          --week-start 2022-03-07
          --label btc-week-1-2022-03-07-one-minute-proxy
          --output artifacts/candidate-03/iteration-01-one-minute-proxy
      - name: Fail-fast baseline gate
        run: python research/candidate-03/gate.py artifacts/candidate-03/iteration-01-one-minute-proxy/metrics.json
      - name: Preserve evidence and raw event archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-week-1-events-${{ github.sha }}
          path: |
            artifacts/candidate-03/iteration-01-one-minute-proxy
            .research-data/candidate-03/bars/BTCUSDT-1m-2022-03.zip
            .research-data/candidate-03/aggTrades/*.zip
            .research-data/candidate-03/aggTrades/*.manifest.json
          if-no-files-found: error
