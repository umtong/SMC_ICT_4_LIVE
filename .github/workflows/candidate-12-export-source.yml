name: candidate-12-materialize-i9

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - ".github/workflows/candidate-12-export-source.yml"

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Apply reviewed I9 source patch atomically
        shell: bash
        run: |
          set -euo pipefail
          PATCH=research/candidate-12/update-i9.patch
          echo "1033a64695cfb5aea9815776c30733366f0520827d5a5e62b1fa8f462fc7e415  $PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          python -m compileall -q research/candidate-12
          git rm "$PATCH" .github/workflows/candidate-12-export-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-12
          git commit -m "candidate-12: install I9 causal execution guards"
          git push origin HEAD:research/candidate-12
