name: Astra structural context history
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths: [.github/workflows/astra-context-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,urllib.request
          root=pathlib.Path('structural-context');jobs=[]
          for symbol in ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT']:
            for year in range(2021,2027):
              for month in range(1,13):
                if year==2026 and month>7:continue
                name=f'{symbol}-1h-{year}-{month:02d}.zip';path=root/symbol/name
                jobs.append((f'https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/1h/{name}',path))
          def get(job):
            url,path=job;path.parent.mkdir(parents=True,exist_ok=True)
            for i in range(3):
              try:
                with urllib.request.urlopen(url,timeout=60) as r:b=r.read()
                path.write_bytes(b);return dict(url=url,sha256=hashlib.sha256(b).hexdigest(),bytes=len(b))
              except Exception as e:
                if i==2:return dict(url=url,error=str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:r=list(ex.map(get,jobs))
          (root/'inputs.json').write_text(json.dumps(r,indent=2));print('downloads',sum('error' not in x for x in r),'/',len(r))
          for x in r:
            if 'error' in x:print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-structural-context
          path: structural-context
          compression-level: 0
          retention-days: 7
