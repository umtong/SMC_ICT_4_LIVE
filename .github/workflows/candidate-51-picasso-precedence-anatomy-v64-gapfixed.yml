name: candidate-51-picasso-precedence-anatomy-v64-gapfixed

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-picasso-precedence-anatomy-v64-gapfixed.yml"
      - "research/candidate-51/picasso_precedence_anatomy_v64.py"
      - "research/candidate-51/picasso_precedence_anatomy_v64_gapfixed.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-51-picasso-precedence-anatomy-v64-gapfixed
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        period:
          - {label: claim_development_2021_2023, start: 2021-01-02, end: 2023-10-27, split: claim_development}
          - {label: validation_rest_2023, start: 2023-10-28, end: 2023-12-31, split: validation}
          - {label: validation_2024, start: 2024-01-01, end: 2024-12-31, split: validation}
          - {label: validation_2025, start: 2025-01-01, end: 2025-12-31, split: validation}
          - {label: postpub_complete_2026, start: 2026-01-01, end: 2026-07-26, split: post_publication}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verified environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          python -m py_compile \
            research/candidate-51/picasso_precedence_anatomy_v64.py \
            research/candidate-51/picasso_precedence_anatomy_v64_gapfixed.py
      - name: Measure executed and intended Picasso policies
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/candidate-51/picasso-precedence-anatomy-v64-gapfixed/${{ matrix.period.label }}"
          uv run python research/candidate-51/picasso_precedence_anatomy_v64_gapfixed.py run \
            --start "${{ matrix.period.start }}" \
            --end "${{ matrix.period.end }}" \
            --period-label "${{ matrix.period.label }}" \
            --split "${{ matrix.period.split }}" \
            --cache ".cache/candidate-51-picasso-v64-gapfixed/${{ matrix.period.label }}" \
            --output "$output"
          test -s "$output/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-picasso-precedence-anatomy-v64-gapfixed-${{ matrix.period.label }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/picasso-precedence-anatomy-v64-gapfixed/${{ matrix.period.label }}/result.json

  aggregate:
    if: always()
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-51-picasso-precedence-anatomy-v64-gapfixed-*
          path: downloaded
      - name: Aggregate five chronological periods
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded -name result.json -type f | wc -l | tr -d ' ')"
          test "$count" -eq 5
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          output=artifacts/candidate-51/picasso-precedence-anatomy-v64-gapfixed
          uv run python research/candidate-51/picasso_precedence_anatomy_v64_gapfixed.py aggregate \
            --results-root downloaded \
            --output "$output"
          for file in ANATOMY.json ANATOMY.md CANDIDATES.csv SELECTED.csv REJECTED.csv; do
            test -e "$output/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-picasso-precedence-anatomy-v64-gapfixed-anatomy
          retention-days: 30
          if-no-files-found: error
          path: artifacts/candidate-51/picasso-precedence-anatomy-v64-gapfixed/
      - name: Commit compact Picasso anatomy
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/picasso-precedence-anatomy-v64-gapfixed
          destination=research/candidate-51/evidence/picasso-precedence-anatomy-v64-gapfixed
          rm -rf "$destination"
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/CANDIDATES.csv" "$destination/CANDIDATES.csv"
          cp "$source/SELECTED.csv" "$destination/SELECTED.csv"
          cp "$source/REJECTED.csv" "$destination/REJECTED.csv"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add "$destination"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate51: record gap-aware Picasso precedence anatomy"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin research/candidate-51
            if git rebase origin/research/candidate-51 && git push origin HEAD:research/candidate-51; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
