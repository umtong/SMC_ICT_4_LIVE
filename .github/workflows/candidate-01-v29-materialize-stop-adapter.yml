name: candidate-01-v29-materialize-stop-adapter

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v29-materialize-stop-adapter.yml"
      - ".candidate01-bootstrap/v29/materialize_stop_adapter.py"
      - "research/candidate-01/nautilus_tick_limit_plan_backtest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
          fetch-depth: 0
      - name: Generate and validate stop adapter
        run: |
          set -euo pipefail
          python3 .candidate01-bootstrap/v29/materialize_stop_adapter.py
          python3 -m py_compile research/candidate-01/nautilus_tick_stop_plan_backtest.py
      - name: Commit generated adapter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/nautilus_tick_stop_plan_backtest.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research(candidate-01): add authoritative stop-market adapter"
          git push origin HEAD:research/candidate-01
