name: candidate-08-qh-session-liquidity-first-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-qh-session-liquidity-first-v1"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-qh-session-liquidity-first-v1
  cancel-in-progress: true

jobs:
  first-btc-week:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      MARKER: research/candidate-08/.run-qh-session-liquidity-first-v1
      OUTPUT_DIR: research/candidate-08/evidence/qh-session-liquidity-first-v1
      LOG: research/candidate-08/evidence/qh-session-liquidity-first-v1/workflow.log
      STATUS: research/candidate-08/evidence/qh-session-liquidity-first-v1/exit_status.txt
      CACHE_DIR: .cache/candidate-08-quote-resiliency
      CONFIG: research/candidate-08/config_qh_session_liquidity_btc_v1.json
      PATTERN_CONFIG: research/candidate-08/config_range_fvg.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified market-data cache
        uses: actions/cache@v4
        with:
          path: .cache/candidate-08-quote-resiliency
          key: candidate-08-quote-resiliency-data-v1-${{ hashFiles('research/candidate-08/config_quote_resiliency_btc_v1.json') }}
          restore-keys: |
            candidate-08-quote-resiliency-data-v1-

      - name: Run causal contracts and fixed first BTC week
        id: research
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR" "$CACHE_DIR"
          set +e
          (
            set -euo pipefail
            smc4 doctor
            python -m compileall -q \
              research/candidate-08/qh_session_liquidity_signals_v1.py \
              research/candidate-08/run_qh_session_liquidity_nautilus_v1.py
            python research/candidate-08/test_quote_resiliency_features_v3.py -v
            python research/candidate-08/test_quote_resiliency_data.py -v
            python research/candidate-08/test_quote_resiliency_execution_price_contract.py -v
            python research/candidate-08/test_quote_resiliency_native_quotes.py -v
            python research/candidate-08/test_quote_resiliency_native_adapter.py -v
            python - <<'PY'
          import numpy as np
          import pandas as pd

          from qh_session_liquidity_signals_v1 import (
              IntradayLiquidityLevel,
              QuarterHourSessionLiquidityConfig,
              _enrich_minute,
              _select_target,
          )

          config = QuarterHourSessionLiquidityConfig()
          config.validate()
          assert config.target_max_age_minutes == 480
          assert config.maximum_retrace_minutes == 6
          assert config.maximum_reacceleration_minutes == 4

          index = pd.date_range("2024-04-08T00:01:00Z", periods=720, freq="1min")
          price = 100.0 + np.linspace(0.0, 1.0, len(index))
          minute = pd.DataFrame(
              {
                  "open": price - 0.01,
                  "high": price + 0.05,
                  "low": price - 0.05,
                  "close": price,
                  "volume": np.full(len(index), 10.0),
                  "signed_volume": np.full(len(index), 1.0),
                  "trade_count": np.full(len(index), 20.0),
              },
              index=index,
          )
          enriched = _enrich_minute(minute, config)
          first_session_direction = np.sign(
              minute.loc[minute.index <= pd.Timestamp("2024-04-08T04:00:00Z"), "close"].iloc[-1]
              - minute.loc[minute.index <= pd.Timestamp("2024-04-08T04:00:00Z"), "open"].iloc[0]
          )
          current = enriched.loc[pd.Timestamp("2024-04-08T04:15:00Z")]
          assert int(np.sign(float(current["previous_session_direction"]))) == int(first_session_direction)

          observed = pd.Timestamp("2024-04-08T01:00:00Z")
          burst = pd.Timestamp("2024-04-08T02:00:00Z")
          entry = pd.Timestamp("2024-04-08T02:10:00Z")
          target = IntradayLiquidityLevel(
              level_id="causal-high",
              kind="HIGH",
              level=105.0,
              pivot_time_ns=int(pd.Timestamp("2024-04-08T00:45:00Z").value),
              observed_time_ns=int(observed.value),
          )
          selected = _select_target(
              minute,
              (target,),
              direction=1,
              expected_entry=101.0,
              burst_time_ns=int(burst.value),
              entry_time=entry,
              maximum_age_minutes=480,
          )
          assert selected == target

          changed_future = minute.copy()
          changed_future.loc[changed_future.index > entry, "high"] = 1000.0
          assert _select_target(
              changed_future,
              (target,),
              direction=1,
              expected_entry=101.0,
              burst_time_ns=int(burst.value),
              entry_time=entry,
              maximum_age_minutes=480,
          ) == target

          future_level = IntradayLiquidityLevel(
              level_id="future-high",
              kind="HIGH",
              level=106.0,
              pivot_time_ns=int(pd.Timestamp("2024-04-08T02:00:00Z").value),
              observed_time_ns=int(pd.Timestamp("2024-04-08T02:15:00Z").value),
          )
          assert _select_target(
              minute,
              (future_level,),
              direction=1,
              expected_entry=101.0,
              burst_time_ns=int(burst.value),
              entry_time=entry,
              maximum_age_minutes=480,
          ) is None

          consumed = minute.copy()
          consumed.loc[pd.Timestamp("2024-04-08T01:30:00Z"), "high"] = 105.1
          assert _select_target(
              consumed,
              (target,),
              direction=1,
              expected_entry=101.0,
              burst_time_ns=int(burst.value),
              entry_time=entry,
              maximum_age_minutes=480,
          ) is None
          PY
            python research/candidate-08/run_qh_session_liquidity_nautilus_v1.py \
              --suite first \
              --config "$CONFIG" \
              --pattern-config "$PATTERN_CONFIG" \
              --output "$OUTPUT_DIR" \
              --data-cache "$CACHE_DIR"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          summary = json.loads((output / "suite_metrics.json").read_text())
          result = summary["window_results"][0]
          window = output / result["name"]
          metrics = json.loads((window / "metrics.json").read_text())
          manifest = json.loads((window / "data_manifest.json").read_text())
          diagnostics = manifest["assets"]["BTCUSDT"].get("detector_diagnostics", {})
          signals = int(summary.get("signals", 0))
          closed = int(summary.get("closed_trades", result.get("closed_trades", 0)))
          gate = bool(result.get("first_window_gate_passed", False))
          if gate:
              decision = "PROMOTE_TO_TWO_ADDITIONAL_FIXED_WEEKS"
          elif signals < 3 or closed < 3:
              decision = "REJECT_FIXED_SCENARIO_INSUFFICIENT_NATURAL_DAYTRADING_OPPORTUNITY"
          else:
              decision = "REJECT_FIXED_SCENARIO_COST_AFTER_FIRST_WEEK_FAILURE"
          payload = {
              "candidate": summary.get("candidate"),
              "window": result.get("name"),
              "signals": signals,
              "closed_trades": closed,
              "wins": int(summary.get("wins", 0)),
              "positive_trade_share": float(summary.get("positive_trade_share", 0.0)),
              "total_return": result.get("total_return"),
              "daily_geometric_growth": result.get("daily_geometric_growth"),
              "maximum_realized_equity_drawdown": result.get("maximum_realized_equity_drawdown"),
              "first_window_gate_passed": gate,
              "suite_gate_passed": bool(summary.get("suite_gate_passed", False)),
              "execution_failures": int(metrics.get("execution_failures", 0)),
              "unexpected_or_liquidation_closes": int(metrics.get("unexpected_or_liquidation_closes", 0)),
              "open_orders_after_run": int(metrics.get("open_orders_after_run", 0)),
              "open_positions_after_run": int(metrics.get("open_positions_after_run", 0)),
              "logic_funnel": {
                  "bursts": int(diagnostics.get("QH_INTENSE_SESSION_ALIGNED_BURST", 0)),
                  "contracted_retraces": int(diagnostics.get("CONTRACTED_RETRACE", 0)),
                  "separate_reaccelerations": int(diagnostics.get("SEPARATE_REACCELERATION", 0)),
                  "no_intraday_target": int(diagnostics.get("NO_PREBURST_UNCONSUMED_15M_LIQUIDITY_TARGET", 0)),
                  "invalid_target_geometry": int(diagnostics.get("INVALID_COST_AFTER_INTRADAY_TARGET_GEOMETRY", 0)),
                  "insufficient_cost_after_target": int(diagnostics.get("INSUFFICIENT_COST_AFTER_INTRADAY_TARGET", 0)),
                  "signals": int(diagnostics.get("SIGNALS", 0)),
              },
              "decision": decision,
          }
          (output / "decision.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$STATUS"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit source and reproducible evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER"
          git add -A -- \
            research/candidate-08/qh_session_liquidity_signals_v1.py \
            research/candidate-08/run_qh_session_liquidity_nautilus_v1.py \
            research/candidate-08/config_qh_session_liquidity_btc_v1.json \
            "$OUTPUT_DIR" "$MARKER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: record quarter-hour liquidity first-window evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce reproducible execution
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
