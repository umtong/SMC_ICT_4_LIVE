name: Candidate 06 Crowding Inventory-Response Bifurcation

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-cirb.yml"
      - "research/candidate-06/cirb_payload.part-*"
      - "research/candidate-06/crowding_inventory_response_engine.py"
      - "research/candidate-06/crowding_inventory_response_nautilus_runner.py"
      - "research/candidate-06/run_crowding_inventory_response_validation.py"
      - "research/candidate-06/run_crowding_inventory_response_matrix.py"
      - "research/candidate-06/test_crowding_inventory_response_engine.py"
      - "research/candidate-06/CIRB_RESEARCH_BASIS.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-cirb-staged
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  research-and-validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize CIRB implementation
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if compgen -G "research/candidate-06/cirb_payload.part-*" > /dev/null; then
            cat research/candidate-06/cirb_payload.part-* | base64 -d > /tmp/candidate06-cirb.tar.gz
            printf '%s  %s\n' \
              'c0a75c41b8d7fa7f5a46bd0a7393339936c293f4c23564ebbbf3876a1ffc5958' \
              '/tmp/candidate06-cirb.tar.gz' | sha256sum -c -
            tar -xzf /tmp/candidate06-cirb.tar.gz -C research/candidate-06
            rm -f /tmp/candidate06-cirb.tar.gz
          else
            test -s research/candidate-06/crowding_inventory_response_engine.py
            test -s research/candidate-06/crowding_inventory_response_nautilus_runner.py
            test -s research/candidate-06/run_crowding_inventory_response_validation.py
            test -s research/candidate-06/run_crowding_inventory_response_matrix.py
            test -s research/candidate-06/test_crowding_inventory_response_engine.py
            test -s research/candidate-06/CIRB_RESEARCH_BASIS.md
          fi

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Verify CIRB causal and executable contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-06/crowding_inventory_response_engine.py \
            research/candidate-06/crowding_inventory_response_nautilus_runner.py \
            research/candidate-06/run_crowding_inventory_response_validation.py \
            research/candidate-06/run_crowding_inventory_response_matrix.py \
            research/candidate-06/test_crowding_inventory_response_engine.py
          python research/candidate-06/test_open_interest_metrics_data.py
          python research/candidate-06/test_open_interest_deleveraging_engine.py
          python research/candidate-06/test_crowding_inventory_response_engine.py
          python research/candidate-06/test_excursion_diagnostics.py
          python - <<'PY'
          import inspect
          from crowding_inventory_response_nautilus_runner import (
              run_crowding_inventory_response_nautilus_backtest,
          )
          from run_crowding_inventory_response_matrix import _base, VARIANTS

          source = inspect.getsource(run_crowding_inventory_response_nautilus_backtest)
          assert "BacktestEngine" in source
          assert "CrowdingInventoryResponseBifurcationEngine" in source
          config = _base({"logic": {}, "execution": {}, "validation": {}, "gate": {}})
          assert config["logic"]["signal_submission_timing"] == "ON_SIGNAL_CLOSE"
          assert config["logic"]["cirb_counter_rebuild_fraction"] == 0.35
          assert config["logic"]["oidb_drop_quantile"] == 0.85
          assert len(VARIANTS) == 4
          print("CIRB Nautilus-only, prior-only, staged contracts verified")
          PY

      - name: Run CIRB staged BTC campaign through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/cirb-staged
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_crowding_inventory_response_matrix.py \
            --output artifacts/candidate-06/cirb-staged \
            > artifacts/candidate-06-cirb.stdout \
            2> artifacts/candidate-06-cirb.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal CIRB evidence
        if: always()
        run: |
          set -euo pipefail
          root=artifacts/candidate-06/cirb-staged
          mkdir -p "$root"
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > "$root/workflow_exit_code.txt"
          if [ ! -f "$root/summary.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-06/cirb-staged")
          payload = {
              "all_three_weeks_passed": False,
              "long_evaluation_authorized": False,
              "selected": None,
              "terminal_status": "IMPLEMENTATION_OR_DATA_FAILURE_BEFORE_SUMMARY",
          }
          (root / "summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          cp artifacts/candidate-06-cirb.stdout "$root/workflow_stdout.txt" 2>/dev/null || true
          cp artifacts/candidate-06-cirb.stderr "$root/workflow_stderr.txt" 2>/dev/null || true

      - name: Commit CIRB implementation and deterministic evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add \
            research/candidate-06/crowding_inventory_response_engine.py \
            research/candidate-06/crowding_inventory_response_nautilus_runner.py \
            research/candidate-06/run_crowding_inventory_response_validation.py \
            research/candidate-06/run_crowding_inventory_response_matrix.py \
            research/candidate-06/test_crowding_inventory_response_engine.py \
            research/candidate-06/CIRB_RESEARCH_BASIS.md
          git rm -f --ignore-unmatch research/candidate-06/cirb_payload.part-*
          git add -f artifacts/candidate-06/cirb-staged
          if [ -f research/candidate-06/config.cirb.locked.json ]; then
            git add -f research/candidate-06/config.cirb.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 CIRB evidence [candidate-06 evidence]"
          git pull --rebase origin research/candidate-06
          git push origin HEAD:research/candidate-06

      - name: Upload CIRB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-cirb-${{ github.sha }}
          path: artifacts/candidate-06/cirb-staged
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce staged decision
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
