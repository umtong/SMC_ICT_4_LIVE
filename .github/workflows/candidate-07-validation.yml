name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-mark-index-overshoot-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine and data tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-mark-index-overshoot-week1-v1
          restore-keys: |
            candidate-07-cross-market-transfer-week1-v1
            candidate-07-mtf-index-week1-v1
            candidate-07-inventory-pressure-week1-v1
            candidate-07-inventory-handoff-week1-v1
            candidate-07-valuation-week1-v1
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1

      - name: Reproduce int64-safe baseline
        run: >-
          python research/candidate-07/diagnose_mark_index_overshoot_5m_int64.py
          --config research/candidate-07/config.json
          --stage week-1
          --start 2025-12-22
          --end 2025-12-29
          --output artifacts/candidate-07/week-1/mark_index_overshoot_baseline.json
          --data-root .research-data/candidate-07

      - name: Remove contact mark-penetration condition only
        run: >-
          python research/candidate-07/diagnose_mark_index_overshoot_5m_ablation.py
          --config research/candidate-07/config.json
          --stage week-1-ablation
          --start 2025-12-22
          --end 2025-12-29
          --output artifacts/candidate-07/week-1/mark_index_overshoot_ablation.json
          --data-root .research-data/candidate-07

      - name: Build controlled comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/candidate-07/week-1')
          baseline = json.loads((root / 'mark_index_overshoot_baseline.json').read_text())
          ablation = json.loads((root / 'mark_index_overshoot_ablation.json').read_text())
          comparison = {
              'candidate': 'candidate-07',
              'stage': 'week-1-ablation',
              'ablation': 'REMOVE_MARK_PENETRATION_AT_CONTACT',
              'controlled_variables': {
                  'period': baseline['period'],
                  'data_contract': baseline['data_contract'],
                  'logic': baseline['logic'],
                  'changed_variable': 'contact mark-price penetration ratio only',
                  'mark_reclaim_confirmation_retained': True,
                  'orders_or_pnl': False,
              },
              'baseline_summary': baseline['summary'],
              'ablation_summary': ablation['summary'],
          }
          (root / 'mark_index_overshoot_ablation_comparison.json').write_text(
              json.dumps(comparison, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Print controlled comparison
        if: always()
        run: |
          test -f artifacts/candidate-07/week-1/mark_index_overshoot_baseline.json
          test -f artifacts/candidate-07/week-1/mark_index_overshoot_ablation.json
          test -f artifacts/candidate-07/week-1/mark_index_overshoot_ablation_comparison.json
          cat artifacts/candidate-07/week-1/mark_index_overshoot_baseline.json
          cat artifacts/candidate-07/week-1/mark_index_overshoot_ablation.json
          cat artifacts/candidate-07/week-1/mark_index_overshoot_ablation_comparison.json

      - name: Preserve controlled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-mark-index-overshoot-ablation-${{ github.sha }}
          path: artifacts/candidate-07/week-1
          retention-days: 14
          if-no-files-found: error
