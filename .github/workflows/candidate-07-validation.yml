name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-flow-week1-v1
          restore-keys: |
            candidate-07-btcusdt-2024-through-2026h1-v1
            candidate-07-btcusdt-three-weeks-v3
            candidate-07-btcusdt-week1-v1

      - name: NautilusTrader frozen BTC week-1 replay
        run: >-
          python research/candidate-07/staged_cascade.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07
          --max-weeks 1

      - name: Diagnose failed absorption and accepted continuation paths
        if: always()
        run: >-
          python research/candidate-07/diagnose_failed_flow.py
          --config research/candidate-07/config.json
          --stage week-1
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07
          --lookahead-minutes 120

      - name: Enforce strict pool-lifecycle causality
        if: always()
        run: >-
          python research/candidate-07/diagnose_failed_flow_strict.py
          --config research/candidate-07/config.json
          --stage week-1
          --output artifacts/candidate-07

      - name: Diagnose directional external-liquidity acceptance
        if: always()
        run: >-
          python research/candidate-07/diagnose_external_acceptance.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --stage week-1
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07
          --lookahead-bars 24

      - name: Diagnose accepted-pool retest entries
        if: always()
        run: >-
          python research/candidate-07/diagnose_acceptance_retest.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --stage week-1
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07
          --lookahead-bars 24

      - name: Diagnose New York cash-open dealing-range auction
        if: always()
        run: >-
          python research/candidate-07/diagnose_ny_opening_auction.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --stage week-1
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07

      - name: Diagnose London cash-open dealing-range auction
        if: always()
        run: >-
          python research/candidate-07/diagnose_london_opening_auction.py
          --config research/candidate-07/config.json
          --week-plan research/candidate-07/week_plan.json
          --stage week-1
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07

      - name: Print machine-readable result
        if: always()
        run: |
          test -f artifacts/candidate-07/pipeline_summary.json
          cat artifacts/candidate-07/pipeline_summary.json
          cat artifacts/candidate-07/week-1/metrics.json
          cat artifacts/candidate-07/week-1/failed_flow_diagnostic.json
          cat artifacts/candidate-07/week-1/failed_flow_strict.json
          cat artifacts/candidate-07/week-1/external_acceptance_diagnostic.json
          cat artifacts/candidate-07/week-1/acceptance_retest_diagnostic.json
          cat artifacts/candidate-07/week-1/ny_opening_diagnostic.json
          cat artifacts/candidate-07/week-1/london_opening_diagnostic.json

      - name: Preserve complete replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-flow-week1-${{ github.sha }}
          path: artifacts/candidate-07
          retention-days: 14
          if-no-files-found: error
