name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  btc-week-2-path-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine and data tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-positioning-three-weeks-v1
          restore-keys: |
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1
            candidate-07-btcusdt-2024-through-2026h1-v1

      - name: NautilusTrader frozen Week-2 replay
        run: >-
          python research/candidate-07/candidate_cascade.py week
          --config research/candidate-07/config.json
          --stage week-2
          --start 2025-01-27
          --end 2025-02-03
          --output artifacts/candidate-07/week-2
          --data-root .research-data/candidate-07

      - name: Diagnose actual trade excursions
        run: >-
          python research/candidate-07/diagnose_excursions.py
          --config research/candidate-07/config.json
          --output artifacts/candidate-07
          --data-root .research-data/candidate-07

      - name: Print path diagnosis
        if: always()
        run: |
          test -f artifacts/candidate-07/week-2/metrics.json
          test -f artifacts/candidate-07/week-2/excursion_summary.json
          cat artifacts/candidate-07/week-2/metrics.json
          cat artifacts/candidate-07/week-2/excursion_summary.json
          cat artifacts/candidate-07/week-2/trade_excursions.csv

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-week2-path-diagnostic-${{ github.sha }}
          path: artifacts/candidate-07/week-2
          retention-days: 14
          if-no-files-found: error
