name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-nautilus-validation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-event-time-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4

      - name: Verify pinned NautilusTrader foundation and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-pyc \
            /opt/smc4/.venv/bin/python -m compileall -q research/candidate-07
          /opt/smc4/.venv/bin/python -m unittest discover \
            -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-aggtrade-event-tournament-week1-v2
          restore-keys: |
            candidate-07-aggtrade-event-tournament-week1-v1
            candidate-07-aggtrade-resilience-week1-v1
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1

      - name: Run frozen BTC Week-1 structural tournament once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-07/week-1/event-tournament
          /opt/smc4/.venv/bin/python research/candidate-07/run_aggtrade_tournament.py \
            --config research/candidate-07/config.json \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --event-warmup-days 1 \
            --source-commit "${GITHUB_SHA}" \
            --output-dir artifacts/candidate-07/week-1/event-tournament \
            --data-root .research-data/candidate-07

      - name: Print compact immutable result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifacts/candidate-07/week-1/event-tournament')
          summary_path = root / 'tournament_summary.json'
          if not summary_path.exists():
              raise SystemExit('TOURNAMENT_REPORT_MISSING')
          summary = json.loads(summary_path.read_text())
          manifest = root / 'aggtrade_tournament_data_manifest.json'
          variant_digest = {}
          for path in sorted(root.glob('*.json')):
              if path.name == summary_path.name or path.name.endswith('data_manifest.json'):
                  continue
              payload = json.loads(path.read_text())
              variant_digest[path.name] = {
                  'family': payload.get('family'),
                  'variant': payload.get('variant'),
                  'summary': payload.get('summary'),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          print(json.dumps({
              'source_commit': '${{ github.sha }}',
              'tournament': summary,
              'variants': variant_digest,
              'tournament_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest(),
              'data_manifest_sha256': (
                  hashlib.sha256(manifest.read_bytes()).hexdigest()
                  if manifest.exists() else None
              ),
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve complete structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-event-tournament-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1/event-tournament
          retention-days: 14
          if-no-files-found: error
