name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-nautilus-validation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-impact-resilience-1s:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine and data tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-impact-resilience-1s-week1-v2
          restore-keys: |
            candidate-07-impact-resilience-1s-week1-v1
            candidate-07-mark-index-overshoot-week1-v1
            candidate-07-cross-market-transfer-week1-v1
            candidate-07-mtf-index-week1-v1
            candidate-07-inventory-pressure-week1-v1
            candidate-07-inventory-handoff-week1-v1
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1

      - name: Diagnose frozen BTC Week-1 one-second impact resilience
        run: >-
          python research/candidate-07/diagnose_impact_resilience_1s_v2.py
          --config research/candidate-07/config.json
          --stage week-1
          --start 2025-12-22
          --end 2025-12-29
          --micro-warmup-days 3
          --output artifacts/candidate-07/week-1/impact_resilience_1s_v2.json
          --data-root .research-data/candidate-07

      - name: Print compact machine-readable diagnosis
        if: always()
        run: |
          test -f artifacts/candidate-07/week-1/impact_resilience_1s_v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/candidate-07/week-1/impact_resilience_1s_v2.json').read_text())
          print(json.dumps({
              'summary': payload['summary'],
              'cadence_gaps': payload['cadence_gaps'],
              'pool_collision_summary': payload['pool_collision_summary'],
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve complete structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-impact-resilience-1s-v2-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1
          retention-days: 14
          if-no-files-found: error
