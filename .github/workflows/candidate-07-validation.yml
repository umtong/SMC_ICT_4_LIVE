name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-nautilus-validation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-aggtrade-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine and data tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-aggtrade-resilience-week1-v1
          restore-keys: |
            candidate-07-impact-resilience-1s-week1-v2
            candidate-07-mark-index-overshoot-week1-v1
            candidate-07-cross-market-transfer-week1-v1
            candidate-07-mtf-index-week1-v1
            candidate-07-inventory-pressure-week1-v1
            candidate-07-inventory-handoff-week1-v1
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1

      - name: Diagnose frozen BTC Week-1 baseline
        run: >-
          python research/candidate-07/diagnose_aggtrade_resilience_v2.py
          --config research/candidate-07/config.json
          --stage week-1
          --start 2025-12-22
          --end 2025-12-29
          --event-warmup-days 1
          --output artifacts/candidate-07/week-1/aggtrade_resilience_baseline.json
          --data-root .research-data/candidate-07

      - name: Classify baseline without masking implementation errors
        id: classify
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('artifacts/candidate-07/week-1/aggtrade_resilience_baseline.json')
          payload = json.loads(path.read_text())
          diagnostics = payload['loader_diagnostics']
          implementation_clean = (
              diagnostics['out_of_order_rows'] == 0
              and diagnostics['duplicate_agg_trade_ids'] == 0
              and diagnostics['second_rows'] > 0
          )
          print(f"implementation_clean={'true' if implementation_clean else 'false'}")
          passed = bool(payload['summary']['diagnostic_gate']['passed'])
          print(f"baseline_passed={'true' if passed else 'false'}")
          print(f"need_ablation={'true' if implementation_clean and not passed else 'false'}")
          PY

      - name: Remove OI-release gate only
        if: steps.classify.outputs.need_ablation == 'true'
        run: >-
          python research/candidate-07/diagnose_aggtrade_resilience_v2.py
          --config research/candidate-07/config.json
          --stage week-1
          --start 2025-12-22
          --end 2025-12-29
          --event-warmup-days 1
          --ablate-oi-release
          --output artifacts/candidate-07/week-1/aggtrade_resilience_ablation_no_oi.json
          --data-root .research-data/candidate-07

      - name: Print compact machine-readable comparison
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = {}
          for name in ('baseline', 'ablation_no_oi'):
              path = Path(f'artifacts/candidate-07/week-1/aggtrade_resilience_{name}.json')
              if path.exists():
                  payload = json.loads(path.read_text())
                  result[name] = {
                      'variant': payload['variant'],
                      'summary': payload['summary'],
                      'loader_diagnostics': payload['loader_diagnostics'],
                      'preconsumption': payload['preconsumption'],
                      'pool_collision_summary': payload['pool_collision_summary'],
                  }
          if not result:
              raise SystemExit('no candidate report produced')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Preserve complete structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-aggtrade-resilience-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1
          retention-days: 14
          if-no-files-found: error
