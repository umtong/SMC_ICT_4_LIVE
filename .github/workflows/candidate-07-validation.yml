name: candidate-07-nautilus-validation

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/**"
      - ".github/workflows/candidate-07-validation.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-nautilus-validation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  btc-week-1-event-time-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Verify prebuilt NautilusTrader foundation
        run: smc4 doctor

      - name: Compile candidate
        run: python -m compileall -q research/candidate-07

      - name: Causal state-machine and data tests
        run: python -m unittest discover -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified public data cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-aggtrade-event-tournament-week1-v1
          restore-keys: |
            candidate-07-aggtrade-resilience-week1-v1
            candidate-07-impact-resilience-1s-week1-v2
            candidate-07-mark-index-overshoot-week1-v1
            candidate-07-cross-market-transfer-week1-v1
            candidate-07-mtf-index-week1-v1
            candidate-07-inventory-pressure-week1-v1
            candidate-07-inventory-handoff-week1-v1
            candidate-07-positioning-three-weeks-v1
            candidate-07-positioning-week1-v1
            candidate-07-flow-week1-v1

      - name: Run frozen BTC Week-1 structural tournament
        run: >-
          python research/candidate-07/run_aggtrade_tournament.py
          --config research/candidate-07/config.json
          --start 2025-12-22
          --end 2025-12-29
          --event-warmup-days 1
          --source-commit ${{ github.sha }}
          --output-dir artifacts/candidate-07/week-1/event-tournament
          --data-root .research-data/candidate-07

      - name: Print compact machine-readable result
        if: always()
        run: |
          test -f artifacts/candidate-07/week-1/event-tournament/tournament_summary.json
          cat artifacts/candidate-07/week-1/event-tournament/tournament_summary.json

      - name: Preserve complete structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-event-tournament-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1/event-tournament
          retention-days: 14
          if-no-files-found: error
