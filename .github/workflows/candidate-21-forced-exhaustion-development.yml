name: candidate-21-forced-exhaustion-development

on:
  push:
    branches: ["research/candidate-21"]
    paths:
      - "research/candidate-21/forced_exhaustion_router.py"
      - "research/candidate-21/candidate21_forced_exhaustion_strategy.py"
      - "research/candidate-21/candidate21_forced_exhaustion.py"
      - "research/candidate-21/config_forced.json"
      - "research/candidate-21/tests/test_forced_exhaustion_router.py"
      - ".github/workflows/candidate-21-forced-exhaustion-development.yml"
  workflow_dispatch:

concurrency:
  group: candidate-21-forced-exhaustion-development
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  btc-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev-2023-07-09
            build_start: "2023-07-06"
            build_end: "2023-07-18"
            evaluation_start: "2023-07-09"
            evaluation_end: "2023-07-15"
          - name: dev-2023-09-08
            build_start: "2023-09-05"
            build_end: "2023-09-17"
            evaluation_start: "2023-09-08"
            evaluation_end: "2023-09-14"
          - name: dev-2024-01-15
            build_start: "2024-01-12"
            build_end: "2024-01-24"
            evaluation_start: "2024-01-15"
            evaluation_end: "2024-01-21"
    env:
      PYTHONPATH: research/candidate-21:research/candidate-20:research/candidate-19:research/candidate-18:research/candidate-17:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-21-forced/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-21
          python -m unittest discover -s research/candidate-21/tests -p 'test_forced_exhaustion_router.py' -v
          python -m unittest discover -s research/candidate-18/tests -p 'test_fok_execution_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_basis_contract.py' -v

      - name: Run forced-flow exhaustion through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-21/candidate21_forced_exhaustion.py stage \
            --config research/candidate-21/config_forced.json \
            --build-start "${{ matrix.build_start }}" \
            --build-end "${{ matrix.build_end }}" \
            --evaluation-start "${{ matrix.evaluation_start }}" \
            --evaluation-end "${{ matrix.evaluation_end }}" \
            --cache ".cache/candidate-21-forced/${{ matrix.name }}" \
            --output "$ROOT" \
            --validation-mode "development-forced-flow-exhaustion" \
            2>&1 | tee "$ROOT/console.log"

      - name: Summarize scenario and account evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          metrics_path = root / "metrics.json"
          diagnostics_path = root / "strategy_diagnostics.json"
          summary = {"root": str(root), "completed": metrics_path.exists()}
          if metrics_path.exists():
              summary["metrics"] = json.loads(metrics_path.read_text())
          if diagnostics_path.exists():
              diagnostics = json.loads(diagnostics_path.read_text())
              keys = [
                  "candidate21_forced_events_armed",
                  "candidate21_forced_exhaustions",
                  "candidate21_forced_reprices",
                  "candidate21_forced_invalidated",
                  "candidate21_forced_expired",
                  "candidate21_forced_geometry_rejected",
                  "candidate21_forced_fok_entries",
                  "entry_submissions",
                  "order_rejections",
              ]
              summary["routing"] = {key: diagnostics.get(key, 0) for key in keys}
          (root / "candidate21_forced_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True, allow_nan=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-21-forced-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-21-forced/${{ matrix.name }}/**
          if-no-files-found: warn
          retention-days: 90
