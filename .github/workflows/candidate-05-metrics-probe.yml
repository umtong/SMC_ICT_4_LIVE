name: candidate-05-binance-metrics-probe

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-metrics-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed environment and official metrics archives
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          mkdir -p artifacts/candidate-05-metrics-probe/raw
          cd artifacts/candidate-05-metrics-probe/raw
          : > checksum_results.txt
          for day in 07 08 09 10 11 12 13 14 15; do
            file="BTCUSDT-metrics-2023-07-${day}.zip"
            base="https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/${file}"
            curl --fail --location --silent --show-error "$base" --output "$file"
            curl --fail --location --silent --show-error "$base.CHECKSUM" --output "$file.CHECKSUM"
            sha256sum --check "$file.CHECKSUM" | tee -a checksum_results.txt
          done
          cd ..
          python - <<'PY'
          import glob
          import json
          import zipfile
          import pandas as pd

          frames = []
          source_files = sorted(glob.glob("raw/BTCUSDT-metrics-2023-07-*.zip"))
          for path in source_files:
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  if len(names) != 1:
                      raise RuntimeError(f"expected one CSV in {path}, got {names}")
                  with archive.open(names[0]) as stream:
                      frame = pd.read_csv(stream)
              frame["source_archive"] = path
              frames.append(frame)
          full = pd.concat(frames, ignore_index=True)
          full["create_time"] = pd.to_datetime(full["create_time"], utc=True, errors="raise")
          full = full.sort_values("create_time").reset_index(drop=True)
          if full["create_time"].duplicated().any():
              raise RuntimeError("duplicate metrics timestamps")
          deltas = full["create_time"].diff().dropna().dt.total_seconds()
          unexpected = deltas[deltas != 300.0]
          if not unexpected.empty:
              raise RuntimeError(f"non-five-minute metrics gaps: {unexpected.head().tolist()}")
          expected_rows = 9 * 288
          if len(full) != expected_rows:
              raise RuntimeError(f"expected {expected_rows} rows, got {len(full)}")
          full.to_csv("metrics-2023-07-07-through-15.csv.gz", index=False, compression="gzip")
          report = {
              "rows": len(full),
              "source_files": source_files,
              "start": str(full["create_time"].iloc[0]),
              "end": str(full["create_time"].iloc[-1]),
              "interval_seconds": sorted(deltas.unique().tolist()),
              "columns": list(full.columns),
              "dtypes": {str(k): str(v) for k, v in full.dtypes.items()},
              "null_counts": {str(k): int(v) for k, v in full.isna().sum().items()},
              "first": full.head(3).to_dict(orient="records"),
              "last": full.tail(3).to_dict(orient="records"),
          }
          with open("schema_report.json", "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True, default=str)
              stream.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-binance-metrics-probe-${{ github.sha }}
          path: artifacts/candidate-05-metrics-probe
          if-no-files-found: error
          retention-days: 30
