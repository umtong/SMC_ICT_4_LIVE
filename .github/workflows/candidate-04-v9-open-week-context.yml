name: candidate-04-v9-open-week-context

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v9-open-week-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
      - name: Build already-opened week context
        run: |
          uv run python research/candidate-04/rich_features_v2.py \
            --start 2023-08-02 \
            --end 2023-08-10 \
            --cache .cache/candidate-04-context/rich \
            --output artifacts/candidate-04-context/rich
          uv run python - <<'PY'
          import importlib.util
          from datetime import date
          from pathlib import Path
          import sys
          path = Path('research/candidate-04/swing_displacement_candidate.py')
          spec = importlib.util.spec_from_file_location('candidate04_context', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.ensure_klines(
              'BTCUSDT',
              date.fromisoformat('2023-08-04'),
              date.fromisoformat('2023-08-10'),
              Path('artifacts/candidate-04-context/klines'),
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-04-v9-open-week-context-${{ github.sha }}
          path: artifacts/candidate-04-context
          if-no-files-found: error
          retention-days: 30
