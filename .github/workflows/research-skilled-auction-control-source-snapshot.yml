name: Research skilled auction control source snapshot

on:
  push:
    branches: ["research_skilled_auction_control"]
    paths:
      - ".dispatch-skilled-auction-control-source-snapshot"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_skilled_auction_control
      - name: Package relevant source
        run: |
          set -euo pipefail
          tar -czf /tmp/skilled-auction-control-source.tar.gz \
            research/candidate-easychart_re1 \
            research/candidate-easychart-v5 \
            research/candidate-easychart-v3 \
            pyproject.toml uv.lock Dockerfile.research
      - uses: actions/upload-artifact@v4
        with:
          name: skilled-auction-control-source
          path: /tmp/skilled-auction-control-source.tar.gz
          retention-days: 7
      - name: Record run
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .latest-skilled-auction-control-source-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-skilled-auction-control-source-snapshot
          git commit -m "Record skilled auction control source snapshot $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_skilled_auction_control
