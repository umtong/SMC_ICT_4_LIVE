name: candidate-01-leader-lag-paths

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-leader-lag-paths.yml"
      - "research/candidate-01/leader_lag_path_diagnostics.py"
      - "research/candidate-01/leader_lag_release_probe.py"
      - "research/candidate-01/core.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-leader-lag-release
          key: candidate-01-leader-lag-release-data-${{ runner.os }}-v1
      - name: Measure every frozen leader-lag plan with cost
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/leader_lag_release_probe.py \
                research/candidate-01/leader_lag_path_diagnostics.py
              rm -rf artifacts/candidate-01-leader-lag-paths
              python research/candidate-01/leader_lag_path_diagnostics.py \
                --cache .cache/candidate-01-leader-lag-release \
                --output artifacts/candidate-01-leader-lag-paths
            '
      - name: Print path evidence
        run: cat artifacts/candidate-01-leader-lag-paths/leader_lag_path_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-leader-lag-paths-${{ github.sha }}
          path: artifacts/candidate-01-leader-lag-paths
          if-no-files-found: error
          retention-days: 30
