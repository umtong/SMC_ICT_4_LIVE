name: Research ML-first ordered reachability v7

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_first]
    paths:
      - '.github/workflows/research-candidate-ml-first-ordered-reachability-v7.yml'
      - 'research/candidate-ml-first-ordered-reachability-v7/**'

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: research-candidate-ml-first-ordered-reachability-v7
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      v3_run_id: ${{ steps.resolve.outputs.v3_run_id }}
      v6_run_id: ${{ steps.resolve.outputs.v6_run_id }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            v3=$(gh api 'repos/umtong/SMC_ICT_4_LIVE/actions/workflows/research-candidate-ml-first-reachable-scenario-fusion-v3.yml/runs?branch=research_candidate_ML_first&status=success&per_page=1' --jq '.workflow_runs[0].id // empty')
            v6=$(gh api 'repos/umtong/SMC_ICT_4_LIVE/actions/workflows/research-candidate-ml-first-integrated-router-v6.yml/runs?branch=research_candidate_ML_first&status=success&per_page=1' --jq '.workflow_runs[0].id // empty')
            if [ -n "$v3" ] && [ -n "$v6" ]; then
              echo "v3_run_id=$v3" >> "$GITHUB_OUTPUT"
              echo "v6_run_id=$v6" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 90
          done
          echo "Timed out waiting for successful v3 and v6 source runs" >&2
          exit 1

  harvest-third-panel:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {period: u-2024-mar15, start: 2024-03-15, end: 2024-03-22}
          - {period: u-2024-jun15, start: 2024-06-15, end: 2024-06-22}
          - {period: u-2024-sep20, start: 2024-09-20, end: 2024-09-27}
          - {period: u-2024-dec20, start: 2024-12-20, end: 2024-12-27}
          - {period: u-2025-mar20, start: 2025-03-20, end: 2025-03-27}
          - {period: u-2025-jun20, start: 2025-06-20, end: 2025-06-27}
          - {period: u-2025-oct20, start: 2025-10-20, end: 2025-10-27}
          - {period: u-2026-aug01, start: 2026-08-01, end: 2026-08-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: '1'
      CACHE: .cache/ml-first-ordered-reachability-v7/${{ matrix.period }}
      WINDOW_ROOT: artifacts/ml-first-ordered-reachability-v7/windows/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      PERIOD: ${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: research_candidate_4_causal_inventory_transfer
          path: candidate4_runtime
          fetch-depth: 1
      - name: Harvest ordered completion actions
        env:
          PYTHONPATH: candidate4_runtime/research/candidate-causal-liquidity-route-system:candidate4_runtime/research/candidate-liquidity-auction-v6:candidate4_runtime/research/candidate-liquidity-auction-v5:candidate4_runtime/research/candidate-coherent-auction-system-v4:candidate4_runtime/research/candidate-coherent-auction-system-v3:candidate4_runtime/research/candidate-coherent-liquidity-policy-v2:candidate4_runtime/research/candidate-coherent-liquidity-policy-v1:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v2:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v1:candidate4_runtime/research/candidate-liquidity-displacement-v1:candidate4_runtime/research/candidate-auction-dislocation-confluence-v1:candidate4_runtime/research/candidate-derivatives-dislocation-v1:candidate4_runtime/research/candidate-auction-episode-policy:candidate4_runtime/research/candidate-auction-event-v2:candidate4_runtime/research/candidate-direct-auction-policy:candidate4_runtime/research/candidate-easychart_re1:candidate4_runtime/research/candidate-easychart-v5:candidate4_runtime/research/candidate-easychart-v3
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-ml-first-reachable-scenario-fusion-v3/patch_route_fraction.py
          mkdir -p "$CACHE" "$WINDOW_ROOT"
          for spec in f120:0.12 f180:0.18 f250:0.25 f330:0.33 f500:0.50; do
            tag=${spec%%:*}; fraction=${spec##*:}
            git -C candidate4_runtime checkout -- .
            python research/candidate-ml-first-reachable-scenario-fusion-v3/patch_route_fraction.py --root candidate4_runtime --fraction "$fraction"
            out="$WINDOW_ROOT/$tag"
            rm -rf "$out"; mkdir -p "$out"
            python candidate4_runtime/research/candidate-causal-liquidity-route-system/causal_route_research.py \
              --start "$START" --end "$END" --role fresh --warmup-days 60 \
              --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$out"
            python - "$out" "$fraction" "$PERIOD" <<'PY'
          import json, sys
          from pathlib import Path
          out, fraction, period = sys.argv[1:]
          Path(out, 'route_fraction.json').write_text(json.dumps({
              'route_target_fraction': float(fraction), 'period': period, 'role': 'fresh',
              'labeling': 'exact minute path; same-minute target and stop is loss'
          }, indent=2) + '\n')
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-ordered-v7-window-${{ matrix.period }}
          path: artifacts/ml-first-ordered-reachability-v7/windows/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  fit-evaluate-publish:
    needs: [resolve-sources, harvest-third-panel]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: research_candidate_4_causal_inventory_transfer
          path: candidate4_runtime
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-first-reachable-scenario-fusion-v3-*
          path: artifacts/ml-first-ordered-reachability-v7/source-v3
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ needs.resolve-sources.outputs.v3_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-first-integrated-reachable-router-v6-*
          path: artifacts/ml-first-ordered-reachability-v7/source-v6
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ needs.resolve-sources.outputs.v6_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-first-ordered-v7-window-*
          path: artifacts/ml-first-ordered-reachability-v7/downloaded-third-panel
      - name: Stage the third untouched panel
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('artifacts/ml-first-ordered-reachability-v7/downloaded-third-panel')
          stage=Path('artifacts/ml-first-ordered-reachability-v7/staged-third-panel')
          shutil.rmtree(stage, ignore_errors=True)
          for tag in ('f120','f180','f250','f330','f500'):
              matches=sorted(path for path in root.rglob(tag) if path.is_dir())
              if len(matches)!=8:
                  raise SystemExit(f'{tag}: expected 8 windows, found {len(matches)}')
              for source in matches:
                  period=next((part for part in source.parts if part.startswith('u-')), None)
                  if period is None:
                      artifact=next((part for part in source.parts if part.startswith('ml-first-ordered-v7-window-u-')), None)
                      if artifact:
                          period=artifact.removeprefix('ml-first-ordered-v7-window-')
                  if period is None:
                      raise SystemExit(f'cannot infer period from {source}')
                  target=stage/tag/period
                  if target.exists():
                      raise SystemExit(f'duplicate {target}')
                  shutil.copytree(source,target)
          PY
      - name: Build twenty-four-window action table
        env:
          PYTHONPATH: candidate4_runtime/research/candidate-causal-liquidity-route-system
        run: |
          set -euo pipefail
          ROOT=artifacts/ml-first-ordered-reachability-v7
          original=$(find "$ROOT/source-v3" -type d -name aggregates -print -quit)
          second=$(find "$ROOT/source-v6" -type d -name holdout-aggregates -print -quit)
          test -n "$original"; test -n "$second"
          for tag in f120 f180 f250 f330 f500; do
            third="$ROOT/third-aggregates/$tag"
            combined="$ROOT/combined-plans/$tag"
            mkdir -p "$third" "$combined/original-eight" "$combined/second-eight" "$combined/third-eight"
            python candidate4_runtime/research/candidate-causal-liquidity-route-system/aggregate_short.py \
              --root "$ROOT/staged-third-panel/$tag" --output "$third"
            cp "$original/$tag/all_candidate_plans.csv.gz" "$combined/original-eight/all_candidate_plans.csv.gz"
            cp "$second/$tag/all_candidate_plans.csv.gz" "$combined/second-eight/all_candidate_plans.csv.gz"
            cp "$third/all_candidate_plans.csv.gz" "$combined/third-eight/all_candidate_plans.csv.gz"
          done
      - name: Fit ordered reachability on prior sixteen and evaluate third eight
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.2 pandas==2.3.2 scikit-learn==1.9.0 joblib
          python -m py_compile \
            research/candidate-ml-first-reachable-control-v4/reachable_control_policy.py \
            research/candidate-ml-first-ordered-reachability-v7/ordered_reachability_policy.py
          ROOT=artifacts/ml-first-ordered-reachability-v7
          OUT="$ROOT/policy"
          rm -rf "$OUT"; mkdir -p "$OUT"
          python research/candidate-ml-first-ordered-reachability-v7/ordered_reachability_policy.py \
            --root "$ROOT/combined-plans" --output "$OUT"
          git rev-parse HEAD > "$OUT/source_sha.txt"
          printf '%s\n' research_candidate_ML_first > "$OUT/source_branch.txt"
          printf '%s\n' '${{ needs.resolve-sources.outputs.v3_run_id }}' > "$OUT/source_v3_run_id.txt"
          printf '%s\n' '${{ needs.resolve-sources.outputs.v6_run_id }}' > "$OUT/source_v6_run_id.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-ordered-reachability-v7-${{ github.sha }}
          path: |
            artifacts/ml-first-ordered-reachability-v7/policy/**
            artifacts/ml-first-ordered-reachability-v7/third-aggregates/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit ordered policy and third untouched evaluation
        run: |
          set -euo pipefail
          SRC=artifacts/ml-first-ordered-reachability-v7/policy
          DEST=research_results/candidate_ml_first/ordered_reachability_v7/latest
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/"
          cp "$SRC/completed_trades.csv" "$DEST/"
          cp "$SRC/variant_metrics.csv" "$DEST/"
          cp "$SRC/component_catalog.csv" "$DEST/"
          cp "$SRC/period_metrics.csv" "$DEST/"
          cp "$SRC/fill_calibration.csv" "$DEST/"
          cp "$SRC/reach_calibration.csv" "$DEST/"
          cp "$SRC/model_bundle.joblib" "$DEST/"
          cp "$SRC/source_sha.txt" "$DEST/"
          cp "$SRC/source_branch.txt" "$DEST/"
          cp "$SRC/source_v3_run_id.txt" "$DEST/"
          cp "$SRC/source_v6_run_id.txt" "$DEST/"
          digest=$(python - "$DEST/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1])); d=s['development']; f=s['fresh']
          print(f"dev_nav={d['ending_nav_multiplier']:.3f} third_nav={f['ending_nav_multiplier']:.3f} third_n={f['completed_trades']} third_meanR={f['mean_net_r']:.3f} third_mdd={f['maximum_drawdown']:.3f} third_tpd={f['trades_per_day']:.3f} third_pos={f['positive_periods']}")
          PY
          )
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record ordered reachability v7 ${GITHUB_RUN_ID}: ${digest}"
          git pull --rebase origin research_candidate_ML_first
          git push origin HEAD:research_candidate_ML_first
