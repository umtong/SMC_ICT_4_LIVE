name: candidate-01-v4-minute-execution-fix

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v4-minute-execution-fix.yml"
      - "research/candidate-01/patch_nautilus_minute_execution.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the single execution-data fix
        run: |
          set -euo pipefail
          sed -i 's/1-TICK-LAST-EXTERNAL/1-MILLISECOND-LAST-EXTERNAL/g' \
            research/candidate-01/patch_nautilus_minute_execution.py
          python3 research/candidate-01/patch_nautilus_minute_execution.py
          python3 -m compileall -q \
            research/candidate-01/nautilus_plan_backtest.py \
            research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py \
            research/candidate-01/intrinsic_external_liquidity_v4_nautilus_period.py \
            tests/test_candidate_01_authoritative_nautilus.py
      - name: Persist the implementation fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-01/nautilus_plan_backtest.py \
            research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py \
            research/candidate-01/intrinsic_external_liquidity_v4_nautilus_period.py \
            tests/test_candidate_01_authoritative_nautilus.py
          git commit -m "fix(candidate-01): execute signals on Nautilus one-minute bars"
          git push origin HEAD:research/candidate-01
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-intrinsic-external-v2-daily-first
          key: candidate-01-v4-minute-execution-BTCUSDT-2023-06-14-26-${{ runner.os }}-v1
      - name: Run the first BTC week only through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m unittest discover -s tests -p "test_candidate_01_authoritative_nautilus.py" -v
              rm -rf artifacts/candidate-01-v4-nautilus-week-1-minute
              python research/candidate-01/intrinsic_external_liquidity_v4_nautilus_week.py \
                --week 2023-06-19 \
                --cache .cache/candidate-01-intrinsic-external-v2-daily-first \
                --output artifacts/candidate-01-v4-nautilus-week-1-minute \
                --workers 4
            '
      - name: Verify authoritative evidence and print the gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-01-v4-nautilus-week-1-minute")
          summary = json.loads((root / "intrinsic_external_liquidity_v4_nautilus_week_summary.json").read_text())
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          assert summary["authoritative_backtest"] is True
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["custom_fill_simulator"] is False
          assert summary["custom_pnl_or_nav_ledger"] is False
          assert summary["risk_fraction"] == 0.03
          assert "one-minute" in summary["execution_market_data"]
          assert metrics["execution_engine"] == "NautilusTrader"
          assert metrics["custom_fill_simulator"] is False
          assert metrics["custom_pnl_or_nav_ledger"] is False
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          for name in ("orders.csv", "positions.csv", "account.csv", "daily_nav.csv", "trade_plans.csv", "rejections.csv"):
              assert (root / name).exists(), name
          gate = {
              "trades": metrics["closed_positions"],
              "win_rate": metrics["win_rate"],
              "total_return": metrics["total_return"],
              "geometric_daily": metrics["geometric_mean_daily_return"],
              "profit_factor": metrics["profit_factor"],
              "max_drawdown": metrics["max_drawdown"],
              "target_met": metrics["target_met"],
          }
          (root / "first_week_gate.json").write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v4-nautilus-week-1-minute-${{ github.sha }}
          path: artifacts/candidate-01-v4-nautilus-week-1-minute
          if-no-files-found: error
          retention-days: 30
