name: candidate-01-v14-cost-floor-first-week

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v14-cost-floor-first-week.yml"
      - "research/candidate-01/intrinsic_cost_floor_v14_nautilus_week.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v14-cost-floor
          key: candidate-01-v14-cost-floor-BTCUSDT-2023-06-14-27-${{ runner.os }}-v1
      - name: Run the first BTC week through NautilusTrader TradeTicks
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/nautilus_tick_plan_backtest.py \
                research/candidate-01/intrinsic_cost_floor_v14_nautilus_week.py
              python research/candidate-01/nautilus_tick_adapter_smoke.py
              rm -rf artifacts/candidate-01-v14-cost-floor-first
              python research/candidate-01/intrinsic_cost_floor_v14_nautilus_week.py \
                --week 2023-06-19 \
                --cache .cache/candidate-01-v14-cost-floor \
                --output artifacts/candidate-01-v14-cost-floor-first \
                --workers 4
            '
      - name: Verify and print the authoritative first-week gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-01-v14-cost-floor-first")
          summary = json.loads((root / "intrinsic_cost_floor_v14_summary.json").read_text())
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          assert summary["controlled_change"] == "local directional-change threshold 40 bps -> 26 bps"
          assert abs(summary["local_directional_change_bps"] - 26.0) < 1e-9
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["custom_fill_simulator"] is False
          assert summary["custom_pnl_or_nav_ledger"] is False
          assert summary["risk_fraction"] == 0.03
          assert metrics["execution_engine"] == "NautilusTrader"
          assert metrics["trade_execution"] is True
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          gate = {
              "retest_signals": summary["retest_signals"],
              "routed_plans": summary["routed_plans"],
              "selected_trade_ticks": summary["official_execution_trade_ticks"],
              "windows": len(summary["execution_tick_windows"]),
              "trades": metrics["closed_positions"],
              "win_rate": metrics["win_rate"],
              "total_return": metrics["total_return"],
              "geometric_daily": metrics["geometric_mean_daily_return"],
              "profit_factor": metrics["profit_factor"],
              "max_drawdown": metrics["max_drawdown"],
              "target_met": metrics["target_met"],
              "rejection_counts": metrics["rejection_counts"],
              "ended_flat": metrics["ended_flat"],
          }
          (root / "first_week_gate.json").write_text(
              json.dumps(gate, indent=2, sort_keys=True) + "\n",
          )
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v14-cost-floor-first-${{ github.sha }}
          path: artifacts/candidate-01-v14-cost-floor-first
          if-no-files-found: error
          retention-days: 30
