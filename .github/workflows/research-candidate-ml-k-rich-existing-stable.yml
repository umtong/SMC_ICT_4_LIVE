name: research-candidate-ml-k-rich-existing-stable

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_k]
    paths:
      - '.github/workflows/research-candidate-ml-k-rich-existing-stable.yml'

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: research-candidate-ml-k-rich-existing-stable
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SOURCE: artifacts/candidate-ml-k/rich-existing-stable/source
      OUT: artifacts/candidate-ml-k/rich-existing-stable/result
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-ml-k-reachable-control/rich_causal_action_router.py \
            research/candidate-ml-k-reachable-control/stable_mechanism_router.py
      - name: Wait for immediate rich replay result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 90); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow research-candidate-ml-k-rich-existing-replay.yml \
              --branch research_candidate_ML_k --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 20
          done
          test -n "$RUN_ID"
          echo "$RUN_ID" >/tmp/source_run
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          rm -rf "$SOURCE"; mkdir -p "$SOURCE"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'candidate-ml-k-rich-existing-replay-*' --dir "$SOURCE"
          SCORED="$(find "$SOURCE" -name scored_actions.csv.gz | head -1)"
          test -f "$SCORED"
          echo "$SCORED" >/tmp/scored
      - name: Select market mechanisms stable across development dates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          python research/candidate-ml-k-reachable-control/stable_mechanism_router.py \
            --scored "$(cat /tmp/scored)" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-ml-k-rich-existing-stable-${{ github.sha }}
          path: artifacts/candidate-ml-k/rich-existing-stable/result/**
          if-no-files-found: error
          retention-days: 30
      - name: Persist actual stable-mechanism result
        shell: bash
        run: |
          set -euo pipefail
          DEST=research_results/candidate_ml_k/rich_existing_stable
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp "$OUT/summary.json" "$DEST/"
          cp "$OUT/selected_orders.csv" "$DEST/"
          cp "$OUT/closed_trades.csv" "$DEST/"
          cp "$OUT/fresh_closed_trades.csv" "$DEST/"
          cat > "$DEST/run.json" <<EOF
          {"run_id":"${GITHUB_RUN_ID}","source_run":"$(cat /tmp/source_run)","head_sha":"${GITHUB_SHA}","completed_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin research_candidate_ML_k
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Record stable-mechanism rich replay [skip ci]'
            git push origin HEAD:research_candidate_ML_k
          fi
