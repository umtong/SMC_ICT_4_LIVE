name: candidate-01-impact-failure-scales

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-impact-failure-scales.yml"
      - "research/candidate-01/impact_failure_scale_diagnostics.py"
      - "research/candidate-01/impact_failure_candidate.py"
      - "research/candidate-01/impact_regime_probe.py"
      - "research/candidate-01/impact_continuation_diagnostics.py"
      - "research/candidate-01/aggtrade_data.py"
      - "research/candidate-01/aggtrade_clock.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-aggtrades
          key: candidate-01-aggtrades-BTCUSDT-2023-06-18-25-${{ runner.os }}-v1
      - name: Diagnose only the first BTC week at nested fixed market-time scales
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/aggtrade_data.py \
                research/candidate-01/aggtrade_clock.py \
                research/candidate-01/impact_regime_probe.py \
                research/candidate-01/impact_failure_candidate.py \
                research/candidate-01/impact_failure_scale_diagnostics.py
              python -m unittest discover -s tests -p "test_candidate_01_impact_*.py" -v
              rm -rf artifacts/candidate-01-impact-failure-scales
              python research/candidate-01/impact_failure_scale_diagnostics.py \
                --cache .cache/candidate-01-aggtrades \
                --output artifacts/candidate-01-impact-failure-scales \
                --workers 4
            '
      - name: Print scale evidence
        run: cat artifacts/candidate-01-impact-failure-scales/impact_failure_scale_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-impact-failure-scales-${{ github.sha }}
          path: artifacts/candidate-01-impact-failure-scales
          if-no-files-found: error
          retention-days: 30
