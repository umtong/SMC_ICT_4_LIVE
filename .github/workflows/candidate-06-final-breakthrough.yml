name: Candidate 06 Rolling Auction Final Stage

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - "artifacts/candidate-06/breakthrough/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-06-final-breakthrough
  cancel-in-progress: true

jobs:
  final-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify environment and hourly-auction causality
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_auction_relay_engine.py
      - name: Run conditional v0.7 stage
        id: stage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf artifacts/candidate-06/final-breakthrough
          python research/candidate-06/run_final_breakthrough.py \
            --output artifacts/candidate-06/final-breakthrough
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Guarantee evidence
        if: always()
        run: |
          mkdir -p artifacts/candidate-06/final-breakthrough
          printf '%s\n' '${{ steps.stage.outputs.exit_code }}' > artifacts/candidate-06/final-breakthrough/workflow_exit_code.txt
          test -f artifacts/candidate-06/final-breakthrough/RESULT.md || printf '%s\n' '# Candidate 06 v0.7 failed before report generation' > artifacts/candidate-06/final-breakthrough/RESULT.md
      - name: Commit evidence
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/final-breakthrough
          if [ -f research/candidate-06/config.auction.locked.json ]; then git add -f research/candidate-06/config.auction.locked.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 rolling-auction evidence [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin research/candidate-06 && git push origin HEAD:research/candidate-06; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-rolling-auction-final-stage
          path: |
            artifacts/candidate-06/final-breakthrough
            research/candidate-06/config.auction.locked.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce complete result
        if: always()
        run: |
          code='${{ steps.stage.outputs.exit_code }}'
          test -n "$code"
          exit "$code"
