name: candidate-18-v4-managed-protection-development

on:
  push:
    branches: ["research/candidate-18"]
    paths:
      - "research/candidate-18/**"
      - ".github/workflows/candidate-18-v4-development.yml"
  workflow_dispatch:

concurrency:
  group: candidate-18-v4-managed-protection-development
  cancel-in-progress: true
permissions: {contents: read, packages: read}

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: known-2023-12, build_start: "2023-12-22", evaluation_start: "2023-12-25", evaluation_end: "2023-12-31"}
          - {name: viewed-v1-week-1, build_start: "2024-07-05", evaluation_start: "2024-07-08", evaluation_end: "2024-07-14"}
          - {name: viewed-v1-week-2, build_start: "2023-10-13", evaluation_start: "2023-10-16", evaluation_end: "2023-10-22"}
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-18:research/candidate-16:research/candidate-17:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-18-v4-development/${{ matrix.name }}
      CACHE: .cache/candidate-18-v4-development/${{ matrix.name }}
      PERIOD_NAME: ${{ matrix.name }}
      BUILD_START: ${{ matrix.build_start }}
      EVALUATION_START: ${{ matrix.evaluation_start }}
      EVALUATION_END: ${{ matrix.evaluation_end }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment and contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-18 research/candidate-17 research/candidate-16
          python -m unittest discover -s research/candidate-18/tests -p 'test_*.py' -v
          python -m unittest discover -s research/candidate-17/tests -p 'test_*.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_strategy_v2_contract.py' -v
      - name: Run viewed development period
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-18/candidate.py stage \
            --config research/candidate-18/config.json \
            --build-start "$BUILD_START" --build-end "$EVALUATION_END" \
            --evaluation-start "$EVALUATION_START" --evaluation-end "$EVALUATION_END" \
            --cache "$CACHE" --output "$ROOT" \
            --validation-mode "v4-managed-protection-development-$PERIOD_NAME" \
            2>&1 | tee "$ROOT/console.log"
      - name: Verify fill-managed protection and risk
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, math, os, re
          from datetime import datetime
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diag = json.loads((root / "strategy_diagnostics.json").read_text())
          events = [json.loads(x) for x in (root / "scenario_events.jsonl").read_text().splitlines() if x.strip()]
          with (root / "orders.csv").open(newline="", encoding="utf-8") as f: orders = list(csv.DictReader(f))
          with (root / "positions.csv").open(newline="", encoding="utf-8") as f: positions = list(csv.DictReader(f))
          entries = [o for o in orders if "CANDIDATE18_MANAGED_IOC_ENTRY" in str(o.get("tags", ""))]
          stops = [o for o in orders if "CANDIDATE18_MANAGED_STOP" in str(o.get("tags", ""))]
          targets = [o for o in orders if "CANDIDATE18_MANAGED_TARGET" in str(o.get("tags", ""))]
          filled_qty = sum(float(o.get("filled_qty") or 0) for o in entries)
          partials = [o for o in entries if 0 < float(o.get("filled_qty") or 0) < float(o.get("quantity") or 0)]
          submissions = [e for e in events if e.get("event_type") == "ENTRY_SUBMITTED"]
          risks = []
          for e in submissions:
              d=e.get("details",{}); risks.append(float(d["planned_account_loss_at_worst_fill"])/float(d["equity"]))
          def money(x):
              m=re.search(r"[-+]?\d+(?:\.\d+)?",str(x).replace(",","")); return float(m.group()) if m else float("nan")
          by_time={int(e["event_time_ns"]):e for e in submissions}; max_loss=0.0; unmatched=[]
          for p in positions:
              opened=int(datetime.fromisoformat(p["ts_opened"]).timestamp()*1e9)
              candidates=[e for t,e in by_time.items() if 0 <= opened-t <= 120*1e9]
              if not candidates: unmatched.append(p.get("opening_order_id")); continue
              e=min(candidates,key=lambda x: opened-int(x["event_time_ns"])); pnl=money(p.get("realized_pnl"))
              if math.isfinite(pnl) and pnl<0: max_loss=max(max_loss,-pnl/float(e["details"]["equity"]))
          checks={
              "entry_ioc_contract": all(o.get("type")=="LIMIT" and o.get("time_in_force")=="IOC" for o in entries),
              "has_trade": int(metrics.get("trades",0))>0,
              "managed_protection_created": bool(stops) and bool(targets),
              "diagnostic_fill_qty_matches_orders": math.isclose(float(diag.get("candidate18_v4_entry_fill_qty",0)),filled_qty,rel_tol=0,abs_tol=1e-8),
              "stop_capacity_covers_fills": float(diag.get("candidate18_v4_stop_qty_submitted",0))+1e-8 >= filled_qty,
              "target_capacity_covers_fills": float(diag.get("candidate18_v4_target_qty_submitted",0))+1e-8 >= filled_qty,
              "no_protective_rejection": int(diag.get("candidate18_v4_protective_rejections",0))==0,
              "three_percent_planned_risk": max(risks,default=0)<=0.0300000001,
              "realized_loss_contained": max_loss<=0.031,
              "positions_match_signals": not unmatched,
              "no_order_rejections": int(diag.get("order_rejections",0))==0,
              "single_entry_intent": int(diag.get("max_simultaneous_entry_intents",0))<=1,
              "single_position": int(diag.get("max_open_positions_observed",0))<=1,
              "no_liquidation": int(metrics.get("liquidations",0))==0,
              "positive_equity": float(metrics.get("min_equity",0))>0,
          }
          if os.environ["PERIOD_NAME"]=="viewed-v1-week-2": checks["partial_path_exercised"]=bool(partials)
          result={"schema":"candidate-18-v4-development-v1","period":os.environ["PERIOD_NAME"],"integrity_pass":all(checks.values()),"checks":checks,"partial_entry_rows":len(partials),"max_planned_risk_fraction":max(risks,default=0),"max_realized_loss_fraction":max_loss,"metrics":metrics,"diagnostics":diag}
          (root/"v4_development_decision.json").write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True,allow_nan=False))
          if not result["integrity_pass"]: raise SystemExit("v4 integrity failure")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-18-v4-development-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-18-v4-development/${{ matrix.name }}/**
          if-no-files-found: warn
          retention-days: 90
