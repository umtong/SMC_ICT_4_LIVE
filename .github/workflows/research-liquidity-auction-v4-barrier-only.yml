name: Research liquidity auction v4 barrier only

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v4"]
    paths:
      - "research/candidate-liquidity-auction-v4/**"
      - ".github/workflows/research-liquidity-auction-v4-barrier-only.yml"
      - "!research/candidate-liquidity-auction-v4/LATEST_RESULT.json"
      - "!research/candidate-liquidity-auction-v4/.latest-run"

concurrency:
  group: research-liquidity-auction-v4-barrier-only
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v4
      - name: Record run identity
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > research/candidate-liquidity-auction-v4/.latest-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-liquidity-auction-v4/.latest-run
          git commit -m "Record barrier-only research $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin research_liquidity_auction_v4
          git push origin HEAD:research_liquidity_auction_v4

  harvest:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {period: train-2023-feb, start: 2023-02-01, end: 2023-02-08}
          - {period: train-2023-may, start: 2023-05-01, end: 2023-05-08}
          - {period: train-2023-aug, start: 2023-08-01, end: 2023-08-08}
          - {period: train-2023-nov, start: 2023-11-01, end: 2023-11-08}
          - {period: train-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {period: train-2024-may, start: 2024-05-01, end: 2024-05-08}
          - {period: train-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {period: train-2024-nov, start: 2024-11-01, end: 2024-11-08}
          - {period: cal-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {period: cal-2025-may, start: 2025-05-01, end: 2025-05-08}
          - {period: cal-2025-aug, start: 2025-08-01, end: 2025-08-08}
          - {period: cal-2025-nov, start: 2025-11-01, end: 2025-11-08}
          - {period: holdout-2021-mar, start: 2021-03-01, end: 2021-03-08}
          - {period: holdout-2021-jun, start: 2021-06-01, end: 2021-06-08}
          - {period: holdout-2021-sep, start: 2021-09-01, end: 2021-09-08}
          - {period: holdout-2021-dec, start: 2021-12-01, end: 2021-12-08}
          - {period: holdout-2022-mar, start: 2022-03-01, end: 2022-03-08}
          - {period: holdout-2022-jun, start: 2022-06-01, end: 2022-06-08}
          - {period: holdout-2022-sep, start: 2022-09-01, end: 2022-09-08}
          - {period: holdout-2022-dec, start: 2022-12-01, end: 2022-12-08}
          - {period: holdout-2026-jun, start: 2026-06-01, end: 2026-06-08}
          - {period: holdout-2026-jul, start: 2026-07-01, end: 2026-07-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/liquidity-auction-v4/${{ matrix.period }}
      OUT: artifacts/liquidity-auction-v4/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Harvest causal event plans with TP and SL barriers only
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-auction-v4/barrier_action_harvest.py \
            --period "${{ matrix.period }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 3 \
            --label-days 7 \
            --cache "$CACHE" \
            --output "$OUT"
      - name: Preserve exact price-volume path for trade and no-trade inspection
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v3/export_chart_universe.py \
            --period "${{ matrix.period }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --before-days 3 \
            --after-days 7 \
            --cache "$CACHE" \
            --output "$OUT/chart"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v4-${{ matrix.period }}
          path: artifacts/liquidity-auction-v4/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  learn-and-inspect:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v4-*
          path: downloaded
          merge-multiple: false
      - name: Install the existing general ML components used by the research policy
        run: |
          set -euo pipefail
          uv pip install scikit-learn==1.8.0 joblib==1.5.2 matplotlib==3.10.5
      - name: Learn event opportunity and plan geometry, then route one global position
        run: |
          set -euo pipefail
          mkdir -p result clinic
          python research/candidate-liquidity-auction-v4/hierarchical_barrier_router.py \
            --root downloaded \
            --output result
      - name: Render selected losses, wins, open plans, missed trades and correct no-trades
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v4/render_trade_no_trade_clinic.py \
            --root downloaded \
            --result result \
            --output clinic
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v4-barrier-only-research
          path: |
            result/**
            clinic/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Preserve compact result on the research branch
        run: |
          set -euo pipefail
          cp result/summary.json research/candidate-liquidity-auction-v4/LATEST_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-liquidity-auction-v4/LATEST_RESULT.json
          git commit -m "Preserve barrier-only skilled policy result $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin research_liquidity_auction_v4
          git push origin HEAD:research_liquidity_auction_v4
