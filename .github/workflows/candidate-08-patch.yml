name: candidate-08-source-patch

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.patch-imports"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Nautilus 1.230.0 model import patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/run.py")
          source = path.read_text(encoding="utf-8")
          old_import = "from nautilus_trader.execution import MakerTakerFeeModel, OneTickSlippageFillModel, StaticLatencyModel"
          new_import = "from nautilus_trader.backtest.models import LatencyModel, MakerTakerFeeModel, OneTickSlippageFillModel"
          if source.count(old_import) != 1:
              raise SystemExit(f"expected exactly one old import, found {source.count(old_import)}")
          if source.count("latency_model=StaticLatencyModel(") != 1:
              raise SystemExit("expected exactly one StaticLatencyModel constructor")
          source = source.replace(old_import, new_import)
          source = source.replace("latency_model=StaticLatencyModel(", "latency_model=LatencyModel(")
          path.write_text(source, encoding="utf-8")
          PY
          rm research/candidate-08/.patch-imports
          python -m compileall -q research/candidate-08/run.py
          grep -nE 'backtest.models|latency_model=LatencyModel' research/candidate-08/run.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-08/run.py research/candidate-08/.patch-imports
          git commit -m "candidate-08: align execution models with Nautilus 1.230.0"
          git push origin HEAD:research/candidate-08
