name: candidate-04-v27-structural-refinements-rerun2

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v27-structural-refinements-rerun2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4

      - name: Restore all exact V27 cross-development observations
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v27-cross-*
          path: sources
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31105658664
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify controlled implementation fixes
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/failed_external_break_retest_impact_tail_compiler.py \
            research/candidate-04/directional_session_vwap_upper_tail_compiler.py \
            research/candidate-04/rich_signal_compiler_v27_impact_tail.py \
            research/candidate-04/rich_signal_compiler_v27_directional_upper_tail.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_v27_structural_refinements.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Compile and execute both refinements on the identical six weeks
        shell: bash
        run: |
          set -euo pipefail
          names=(low_activity normal_basis stress_a year_end autumn may_2024)
          build_starts=(2023-08-02 2023-12-16 2024-08-05 2024-12-25 2025-10-18 2024-05-25)
          build_ends=(2023-08-10 2023-12-24 2024-08-13 2025-01-02 2025-10-26 2024-06-02)
          eval_starts=(2023-08-04 2023-12-18 2024-08-07 2024-12-27 2025-10-20 2024-05-27)
          eval_ends=(2023-08-10 2023-12-24 2024-08-13 2025-01-02 2025-10-26 2024-06-02)

          for i in "${!names[@]}"; do
            name="${names[$i]}"
            export C04_BUILD_START="${build_starts[$i]}"
            export C04_BUILD_END="${build_ends[$i]}"
            source="$(find sources -mindepth 1 -maxdepth 1 -type d -name "candidate-04-v27-cross-${name}-*" | head -n1)"
            test -n "$source"
            test -s "$source/source/rich/data_manifest.json"
            root="artifacts/candidate-04-v27-refinements-rerun2/$name"
            mkdir -p "$root/original"
            cp "$source/summary.json" "$root/original/summary.json"

            common=(
              --base-config research/candidate-04/inventory_transfer_config.json
              --impact-config research/candidate-04/impact_exhaustion_config.json
              --router-config research/candidate-04/auction_activity_router_config.json
              --rich-dir "$source/source/rich"
              --kline-dir ".cache/candidate-04-v27-refinements-rerun2/$name/raw"
              --evaluation-start "${eval_starts[$i]}"
              --evaluation-end "${eval_ends[$i]}"
              --download-klines
            )
            python research/candidate-04/rich_signal_compiler_v27_impact_tail.py \
              "${common[@]}" --output "$root/impact_tail/signals" \
              > "$root/impact_tail_compiler_console.json"
            python research/candidate-04/rich_signal_compiler_v27_directional_upper_tail.py \
              "${common[@]}" --output "$root/directional_upper/signals" \
              > "$root/directional_upper_compiler_console.json"
            test -s "$root/impact_tail/signals/signals.json"
            test -s "$root/directional_upper/signals/signals.json"

            C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/impact_tail/signals/signals.json" \
            python research/candidate-04/nt_backtest_v22_rich_router.py \
              --config research/candidate-04/nt_liquidity_config.json \
              --build-start "$C04_BUILD_START" \
              --build-end "$C04_BUILD_END" \
              --evaluation-start "${eval_starts[$i]}" \
              --evaluation-end "${eval_ends[$i]}" \
              --cache ".cache/candidate-04-v27-refinements-rerun2/$name/raw" \
              --output "$root/impact_tail/nautilus" \
              > "$root/impact_tail/nautilus_console.json"
            C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/directional_upper/signals/signals.json" \
            python research/candidate-04/nt_backtest_v22_rich_router.py \
              --config research/candidate-04/nt_liquidity_config.json \
              --build-start "$C04_BUILD_START" \
              --build-end "$C04_BUILD_END" \
              --evaluation-start "${eval_starts[$i]}" \
              --evaluation-end "${eval_ends[$i]}" \
              --cache ".cache/candidate-04-v27-refinements-rerun2/$name/raw" \
              --output "$root/directional_upper/nautilus" \
              > "$root/directional_upper/nautilus_console.json"
            test -s "$root/impact_tail/nautilus/metrics.json"
            test -s "$root/directional_upper/nautilus/metrics.json"
          done

      - name: Verify risk and aggregate six-week results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v27-refinements-rerun2")
          names = ["low_activity", "normal_basis", "stress_a", "year_end", "autumn", "may_2024"]

          def load_variant(week, variant):
              base = root / week / variant
              metrics = json.loads((base / "nautilus/metrics.json").read_text())
              signals = json.loads((base / "signals/summary.json").read_text())
              events = json.loads((base / "nautilus/strategy_events.json").read_text())
              try:
                  positions = pd.read_csv(base / "nautilus/positions.csv")
              except EmptyDataError:
                  positions = pd.DataFrame()
              entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
              if len(entries) != len(positions.index):
                  raise SystemExit(f"{week}/{variant}: entry-position mismatch")
              losses = []
              for position, entry in zip(positions.to_dict("records"), entries):
                  pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
                  if pnl < 0.0:
                      losses.append(abs(pnl) / float(entry["details"]["equity"]))
              maximum = max(losses, default=0.0)
              if maximum > 0.0301:
                  raise SystemExit(f"{week}/{variant}: realized loss exceeded 3% NAV")
              return {
                  "signals": signals.get("written_signals"),
                  "route_counts": signals.get("route_counts"),
                  "trades": metrics.get("trades"),
                  "wins": metrics.get("wins"),
                  "win_rate": metrics.get("win_rate"),
                  "total_return": metrics.get("total_return"),
                  "geometric_daily_growth": metrics.get("geometric_daily_growth"),
                  "active_days": metrics.get("active_days"),
                  "max_drawdown": metrics.get("max_drawdown"),
                  "largest_winner_share": metrics.get("largest_winner_share"),
                  "scenario_metrics": metrics.get("scenario_metrics"),
                  "maximum_realized_loss_fraction": maximum,
              }

          comparisons = {}
          for week in names:
              original = json.loads((root / week / "original/summary.json").read_text())
              comparisons[week] = {
                  "original": {
                      "trades": original.get("trades"),
                      "wins": original.get("wins"),
                      "total_return": original.get("total_return"),
                      "geometric_daily_growth": original.get("geometric_daily_growth"),
                  },
                  "impact_tail": load_variant(week, "impact_tail"),
                  "directional_upper": load_variant(week, "directional_upper"),
              }
              (root / week / "comparison.json").write_text(
                  json.dumps(comparisons[week], indent=2, sort_keys=True) + "\n"
              )

          aggregate = {}
          for variant in ("original", "impact_tail", "directional_upper"):
              returns = [float(comparisons[week][variant]["total_return"]) for week in names]
              compounded = math.prod(1.0 + value for value in returns) - 1.0
              trades = sum(int(comparisons[week][variant]["trades"]) for week in names)
              wins = sum(int(comparisons[week][variant]["wins"]) for week in names)
              aggregate[variant] = {
                  "compounded_return": compounded,
                  "calendar_days": 42,
                  "geometric_daily_growth": (1.0 + compounded) ** (1.0 / 42.0) - 1.0,
                  "trades": trades,
                  "wins": wins,
                  "win_rate": wins / trades if trades else 0.0,
                  "all_weeks_positive": all(value > 0.0 for value in returns),
              }
          result = {
              "implementation_fixes": [
                  "captured original parent collect function before V27 module substitution",
                  "exported each unchanged build interval to the warm-up loader"
              ],
              "changed_market_variables": 0,
              "comparisons": comparisons,
              "aggregate": aggregate,
              "engine": "NautilusTrader BacktestNode",
          }
          (root / "aggregate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v27-structural-refinements-rerun2-${{ github.sha }}
          path: artifacts/candidate-04-v27-refinements-rerun2
          if-no-files-found: error
          retention-days: 90
