name: Candidate 09 v10 controlled v4 decomposition gate

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v10-gate.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v10-gate
  cancel-in-progress: false

jobs:
  activate-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Archive v9 and activate exact controlled v4 decomposition
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09
          archive="$root/archive/v9"
          mkdir -p "$archive/evidence"

          cp "$root/config.json" "$archive/config.json"
          cp "$root/config_v9.json" "$archive/config_v9.json"
          cp "$root/state_engine.py" "$archive/state_engine.py"
          cp "$root/state_engine_v9_model.py" "$archive/state_engine_v9_model.py"
          cp "$root/state_engine_v9_logic.py" "$archive/state_engine_v9_logic.py"
          cp "$root/state_engine_v9_direct.py" "$archive/state_engine_v9_direct.py"
          for name in summary.json REPORT.md outcomes.csv trades.csv fills.csv events.jsonl run.json data_manifest.json; do
            [[ -f "$root/evidence/latest/$name" ]] && cp "$root/evidence/latest/$name" "$archive/evidence/$name"
          done

          [[ -f "$root/archive/v4/state_engine.py" ]]
          cp "$root/state_engine_v10_direct.py" "$root/state_engine.py"
          cp "$root/config_v10.json" "$root/config.json"
          cp "$root/tests_v10/test_state_engine.py" "$root/tests/test_state_engine.py"

          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('research/candidate-09/run.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''ABLATIONS = (\n    "baseline",\n    "with-continuation",\n    "with-240m",\n    "no-flow",\n)'''
          text, count = re.subn(r'ABLATIONS = \(\n(?:    "[^"]+",\n)+\)', replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one ablation tuple, changed {count}')
          text = text.replace('candidate-09 v9', 'candidate-09 v10')
          text = text.replace('frozen v9 baseline', 'frozen v10 baseline')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, v10 contracts, identical frozen weeks, and gated long evaluation
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v10-gate"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"

          sha256sum \
            "$root/archive/v4/state_engine.py" \
            "$root/state_engine_v10_direct.py" \
            "$root/config_v10.json" \
            "$root/tests_v10/test_state_engine.py" > "$diag/source_sha256.txt"

          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate \
              --config "$root/config.json" \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" \
              --auto-long > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi

          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('research/candidate-09')
          diag = root / 'diagnostics/v10-gate'
          out = root / 'evidence/latest'
          codes = {key.lower(): int(os.environ[key]) for key in ('DOCTOR', 'COMPILE', 'TESTS', 'GATE')}
          failure = next((name for name, value in codes.items() if value != 0), None)
          payload = {
              'candidate_generation': 'v10-exact-v4-reversal-component-decomposition',
              'classification': 'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes': codes,
              'first_failure': failure,
              'fixed_weeks_preserved': True,
              'v4_logic_and_equilibrium_target_preserved': True,
              'risk_and_cost_contract_preserved': True,
              'parameter_search_performed': False,
              'baseline_controlled_removals': ['continuation entries', '240m source levels'],
              'single_variable_ablations': ['with-continuation', 'with-240m', 'no-flow'],
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
          }
          (diag / 'diagnostic.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          if not (out / 'summary.json').exists():
              (out / 'summary.json').write_text(json.dumps({
                  'candidate': 'candidate-09-v10',
                  'status': 'IMPLEMENTATION_ERROR',
                  'first_failure': failure,
                  'codes': codes,
              }, indent=2, sort_keys=True) + '\n')
          for path in diag.glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              path.write_text('\n'.join(lines[-2200:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v10-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v10-gate
            research/candidate-09/archive/v4
            research/candidate-09/archive/v9
            research/candidate-09/config.json
            research/candidate-09/config_v10.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v10_direct.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
            research/candidate-09/tests_v10
          if-no-files-found: error
          retention-days: 30

      - name: Commit v10 source, v9 archive, and exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v10: controlled v4 component result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
