name: Candidate 13 V12 spot-perpetual causal-state diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/candidate-13
    paths:
      - research/candidate-13/spot_perp_state_diagnostics.py
      - research/candidate-13/protocol-v11-quarter-hour-failed-initiative-development.json
      - .github/workflows/candidate-13-v12-spot-perp-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-research:py313-nautilus-1.230.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify common research environment
        run: smc4 doctor
      - name: Run frozen spot-perpetual state diagnostic
        run: |
          python research/candidate-13/spot_perp_state_diagnostics.py \
            --protocol research/candidate-13/protocol-v11-quarter-hour-failed-initiative-development.json \
            --results-root research/candidate-13/v11/failed_initiative/development/results \
            --data-dir /tmp/candidate13-v12-data \
            --output-json research/candidate-13/v12-spot-perp-diagnostics.json \
            --output-md research/candidate-13/V12_SPOT_PERP_DIAGNOSTICS.md
      - name: Persist commit-scoped diagnostic when branch is unchanged
        env:
          START_SHA: ${{ github.sha }}
        run: |
          git config user.name candidate-13-bot
          git config user.email candidate-13-bot@users.noreply.github.com
          git add \
            research/candidate-13/v12-spot-perp-diagnostics.json \
            research/candidate-13/V12_SPOT_PERP_DIAGNOSTICS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate-13 v12: record spot-perpetual state diagnostic [skip ci]"
          git fetch origin research/candidate-13
          test "$(git rev-parse origin/research/candidate-13)" = "$START_SHA"
          git push origin HEAD:research/candidate-13
