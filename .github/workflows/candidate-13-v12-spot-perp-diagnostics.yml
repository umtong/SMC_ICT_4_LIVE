name: Candidate 13 V12 spot-perpetual causal-state diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/candidate-13
    paths:
      - research/candidate-13/spot_perp_state_diagnostics.py
      - research/candidate-13/spot_perp_state_diagnostics_v2.py
      - research/candidate-13/protocol-v11-quarter-hour-failed-initiative-development.json
      - .github/workflows/candidate-13-v12-spot-perp-diagnostics.yml

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-13-v12-spot-perp-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify common research environment
        run: smc4 doctor
      - name: Run frozen spot-perpetual state diagnostic
        run: |
          set -euo pipefail
          python research/candidate-13/spot_perp_state_diagnostics_v2.py \
            --protocol research/candidate-13/protocol-v11-quarter-hour-failed-initiative-development.json \
            --results-root research/candidate-13/v11/failed_initiative/development/results \
            --data-dir /tmp/candidate13-v12-data \
            --output-json research/candidate-13/v12-spot-perp-diagnostics.json \
            --output-md research/candidate-13/V12_SPOT_PERP_DIAGNOSTICS.md \
            2>&1 | tee research/candidate-13/V12_SPOT_PERP_DIAGNOSTIC_RUN.log
      - name: Persist commit-scoped diagnostic evidence when branch is unchanged
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global user.name candidate-13-bot
          git config --global user.email candidate-13-bot@users.noreply.github.com
          git add \
            research/candidate-13/V12_SPOT_PERP_DIAGNOSTIC_RUN.log \
            research/candidate-13/v12-spot-perp-diagnostics.json \
            research/candidate-13/V12_SPOT_PERP_DIAGNOSTICS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate-13 v12: record spot-perpetual diagnostic evidence [skip ci]"
          git fetch origin research/candidate-13
          test "$(git rev-parse origin/research/candidate-13)" = "$START_SHA"
          git push origin HEAD:research/candidate-13
