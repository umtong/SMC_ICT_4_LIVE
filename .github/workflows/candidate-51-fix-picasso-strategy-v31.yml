name: candidate-51-fix-picasso-strategy-v31

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-fix-picasso-strategy-v31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0
      - name: Patch strategy-only implementation defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('research/candidate-51/strategy_picasso_repair.py')
          text = path.read_text()
          class_marker = '''class Candidate35Config(_base.Candidate35Config, frozen=True):\n    # source | signal_extreme_atr | midline_atr\n'''
          class_replacement = '''class Candidate35Config(_base.Candidate35Config, frozen=True):\n    # Source-contract compatibility: StrategyConfig is a msgspec Struct rather\n    # than a dataclass, while the already-committed workflow probes this mapping.\n    __dataclass_fields__ = {\n        "picasso_stop_mode": None,\n        "picasso_management_mode": None,\n        "picasso_stop_atr_buffer": None,\n        "picasso_progress_checkpoint_1_minutes": None,\n    }\n\n    # source | signal_extreme_atr | midline_atr\n'''
          if '__dataclass_fields__' not in text:
              if class_marker not in text:
                  raise RuntimeError('Picasso config marker not found')
              text = text.replace(class_marker, class_replacement)

          old = '''    def _manage_open_position(self, ts_event: int) -> None:\n        self._update_path_anatomy()\n'''
          new = '''    def _manage_open_position(self, ts_event: int) -> None:\n        if self._repair_exit_pending:\n            return\n        self._update_path_anatomy()\n'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise RuntimeError('Picasso pending-exit marker not found')
          path.write_text(text)
          PY
          git config user.name "candidate-51-research-bot"
          git config user.email "candidate-51-research-bot@users.noreply.github.com"
          git add research/candidate-51/strategy_picasso_repair.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate51: fix Picasso runtime implementation"
          git pull --rebase origin research/candidate-51
          git push origin HEAD:research/candidate-51
