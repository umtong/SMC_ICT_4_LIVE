name: candidate-07-parent-external-multiclock-screen

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/exact_timestamp_context.py"
      - "research/candidate-07/multiclock_ensemble_scenario.py"
      - "research/candidate-07/parent_external_multiclock_scenario.py"
      - "research/candidate-07/run_parent_external_multiclock_screen.py"
      - "research/candidate-07/tests/test_multiclock_ensemble.py"
      - "research/candidate-07/tests/test_parent_external_multiclock.py"
      - ".github/workflows/candidate-07-parent-external-multiclock-screen.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-parent-external-multiclock-screen
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: development-w1
            start: "2025-12-22"
            end: "2025-12-29"
          - label: failed-w2
            start: "2025-07-28"
            end: "2025-08-04"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify foundation and exact parent-external contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-parent-external-pyc \
            /opt/smc4/.venv/bin/python -m compileall -q research/candidate-07
          /opt/smc4/.venv/bin/python -m unittest discover \
            -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified research cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-parent-external-${{ matrix.label }}-exact-v2
          restore-keys: |
            candidate-07-parent-external-${{ matrix.label }}-
            candidate-07-btc-xrp-frozen-validation-v1
            candidate-07-btc-xrp-context-identity-v1
            candidate-07-btc-xrp-multiclock-portfolio-week1-v1
            candidate-07-cross-symbol-multiclock-week1-v1
            candidate-07-cross-symbol-15s-
            candidate-07-multiclock-ensemble-week1-v1

      - name: Run exact BTC and XRP research-period screen in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/python \
            research/candidate-07/run_parent_external_multiclock_screen.py \
            --config research/candidate-07/config.json \
            --screen-stage "${{ matrix.label }}-exact-episode" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --event-warmup-days 3 \
            --source-commit "${GITHUB_SHA}" \
            --output "artifacts/candidate-07/parent-external-exact/${{ matrix.label }}" \
            --data-root .research-data/candidate-07 \
            --symbols BTCUSDT XRPUSDT

      - name: Print immutable exact screen result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifacts/candidate-07/parent-external-exact/${{ matrix.label }}')
          summary = root / 'summary.json'
          if not summary.exists():
              raise SystemExit('PARENT_EXTERNAL_EXACT_SUMMARY_MISSING')
          payload = json.loads(summary.read_text())
          hashes = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.rglob('*'))
              if path.is_file()
          }
          print(json.dumps({
              'source_commit': '${{ github.sha }}',
              'period_label': '${{ matrix.label }}',
              'summary': payload,
              'sha256': hashes,
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve complete exact parent-external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-parent-external-exact-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/candidate-07/parent-external-exact/${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
