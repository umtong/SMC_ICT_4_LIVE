name: candidate-01-v40-funnel-diagnostic

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v40-funnel-diagnostic.yml"
      - "research/candidate-01/diagnose_v40_funnel.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  frozen-funnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v40
          key: candidate-01-v40-2025-01-27-${{ runner.os }}-v1
          fail-on-cache-miss: true
      - name: Count frozen causal funnel only
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q research/candidate-01/diagnose_v40_funnel.py
              python research/candidate-01/diagnose_v40_funnel.py \
                --week 2025-01-27 \
                --cache .cache/candidate-01-v40 \
                --output artifacts/candidate-01-v40-funnel.json \
                --workers 4
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v40-funnel-${{ github.sha }}
          path: artifacts/candidate-01-v40-funnel.json
          if-no-files-found: error
          retention-days: 30
