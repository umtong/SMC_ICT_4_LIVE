name: research-candidate-4t-bootstrap

on:
  push:
    branches: [research_candidate_4t]
    paths:
      - 'research/candidate-4t-sequential-control-v1/**'
      - '.github/workflows/research-candidate-4t-bootstrap.yml'
      - '.dispatch-candidate-4t-bootstrap'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: research-candidate-4t-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_4t
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install transparent policy runtime
        run: python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'pandas>=2.2,<3'

      - name: Decision-policy self check
        env:
          PYTHONPATH: research/candidate-4t-sequential-control-v1
        run: python research/candidate-4t-sequential-control-v1/self_check.py

      - name: Reuse candidate 1k immutable-action artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 32592363635
          pattern: candidate-1k-*
          path: inputs/all
          merge-multiple: false

      - name: Separate development and untouched fresh windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/development inputs/fresh
          shopt -s nullglob
          for directory in inputs/all/*; do
            name="$(basename "$directory")"
            if [[ "$name" == *fresh* ]]; then
              cp -a "$directory" "inputs/fresh/$name"
            elif [[ "$name" == *dev* ]]; then
              cp -a "$directory" "inputs/development/$name"
            fi
          done
          test -n "$(find inputs/development -type f -name '*.csv' -print -quit)"
          test -n "$(find inputs/fresh -type f -name '*.csv' -print -quit)"

      - name: Fit separated ownership/execution models and route one account
        run: |
          set -euo pipefail
          rm -rf candidate_4t_output
          python research/candidate-4t-sequential-control-v1/candidate_4t_policy.py \
            --development-root inputs/development \
            --fresh-root inputs/fresh \
            --output candidate_4t_output

      - name: Publish complete diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-4t-bootstrap-${{ github.sha }}
          path: candidate_4t_output
          if-no-files-found: error
          retention-days: 30

      - name: Commit reproducible result record
        shell: bash
        run: |
          set -euo pipefail
          destination=research_results/candidate_4t/bootstrap
          rm -rf "$destination"
          mkdir -p "$destination"
          for file in \
            RESULT.md summary.json model_manifest.json \
            development_orders.csv development_trades.csv development_replacements.csv \
            development_loss_clinic.csv development_missed_opportunity_clinic.csv \
            fresh_orders.csv fresh_trades.csv fresh_replacements.csv \
            fresh_loss_clinic.csv fresh_missed_opportunity_clinic.csv; do
            if [[ -f "candidate_4t_output/$file" ]]; then
              cp "candidate_4t_output/$file" "$destination/$file"
            fi
          done
          printf '%s\n' "source_commit=${GITHUB_SHA}" "source_run=${GITHUB_RUN_ID}" > "$destination/source.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Record candidate 4t bootstrap diagnostic ${GITHUB_RUN_ID}"
            git push origin HEAD:research_candidate_4t
          fi
