name: ml1-install-auction-transition

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-install-auction-transition.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0
      - name: Install the new auction-transition harvest
        run: |
          mkdir -p research/candidate-easychart_ml1 .github/workflows
          echo '' | base64 -d | gzip -dc > research/candidate-easychart_ml1/auction_transition_study.py
          echo '' | base64 -d | gzip -dc > .github/workflows/ml1-auction-transition-harvest.yml
          printf '%s\n' 'dispatch-v1' > research/candidate-easychart_ml1/.auction_transition_dispatch
          python -m py_compile research/candidate-easychart_ml1/auction_transition_study.py
      - name: Commit research code
        run: |
          git config user.name "umtong"
          git config user.email "dddgjj03@gmail.com"
          git add research/candidate-easychart_ml1/auction_transition_study.py \
                  research/candidate-easychart_ml1/.auction_transition_dispatch \
                  .github/workflows/ml1-auction-transition-harvest.yml
          git diff --cached --check
          git commit -m "research(ml1): harvest causal auction transitions"
          git push origin HEAD:research_ML1
