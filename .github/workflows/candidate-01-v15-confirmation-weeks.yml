name: candidate-01-v15-confirmation-weeks

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - "research/candidate-01/intrinsic_tick_daily_markers_v15_nautilus_week.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  week-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate.outputs.advance }}
      classification: ${{ steps.gate.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v15-week-2
          key: candidate-01-v15-week-2-BTCUSDT-2022-07-27-2022-08-09-${{ runner.os }}-v1
      - name: Run the frozen second BTC week through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/nautilus_plan_backtest.py \
                research/candidate-01/nautilus_tick_plan_backtest.py \
                research/candidate-01/intrinsic_tick_daily_markers_v15_nautilus_week.py
              python research/candidate-01/nautilus_tick_adapter_smoke.py
              rm -rf artifacts/candidate-01-v15-week-2
              python research/candidate-01/intrinsic_tick_daily_markers_v15_nautilus_week.py \
                --week 2022-08-01 \
                --rule full-measured-composite \
                --cache .cache/candidate-01-v15-week-2 \
                --output artifacts/candidate-01-v15-week-2 \
                --workers 4
            '
      - name: Classify the second-week gate
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/candidate-01-v15-week-2")
          summary = json.loads((root / "intrinsic_tick_daily_markers_v15_summary.json").read_text())
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          daily = pd.read_csv(root / "daily_nav.csv")
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["custom_fill_simulator"] is False
          assert summary["custom_pnl_or_nav_ledger"] is False
          assert summary["risk_fraction"] == 0.03
          assert metrics["execution_engine"] == "NautilusTrader"
          assert metrics["trade_execution"] is True
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          assert len(daily) == 7

          trades = int(metrics["closed_positions"])
          geo = float(metrics["geometric_mean_daily_return"])
          total = float(metrics["total_return"])
          win = metrics["win_rate"]
          win = float(win) if win is not None else 0.0
          pf = metrics["profit_factor"]
          pf_value = float(pf) if pf is not None else (999.0 if win == 1.0 and trades else 0.0)
          mdd = float(metrics["max_drawdown"])
          full_pass = (
              trades >= 7 and geo >= 0.01 and total > 0.0
              and win >= 0.40 and pf_value > 1.0 and mdd > -0.20
          )
          near = (
              not full_pass and trades >= 5 and geo >= 0.005 and total > 0.0
              and pf_value >= 1.0 and mdd > -0.15
          )
          classification = "full_pass" if full_pass else "near_target" if near else "stop"
          gate = {
              "classification": classification,
              "advance": full_pass or near,
              "trades": trades,
              "win_rate": win,
              "total_return": total,
              "geometric_daily": geo,
              "profit_factor": pf,
              "max_drawdown": mdd,
              "rejection_counts": metrics["rejection_counts"],
              "ended_flat": metrics["ended_flat"],
          }
          (root / "week_gate.json").write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          with open(Path("/tmp/gate-output"), "w") as stream:
              stream.write(f"advance={'true' if gate['advance'] else 'false'}\n")
              stream.write(f"classification={classification}\n")
          PY
          cat /tmp/gate-output >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v15-week-2-${{ github.sha }}
          path: artifacts/candidate-01-v15-week-2
          if-no-files-found: error
          retention-days: 30

  week-3:
    needs: week-2
    if: needs.week-2.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.gate.outputs.advance }}
      classification: ${{ steps.gate.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v15-week-3
          key: candidate-01-v15-week-3-BTCUSDT-2025-11-05-2025-11-18-${{ runner.os }}-v1
      - name: Run the frozen third BTC week through NautilusTrader
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v15-week-3
              python research/candidate-01/intrinsic_tick_daily_markers_v15_nautilus_week.py \
                --week 2025-11-10 \
                --rule full-measured-composite \
                --cache .cache/candidate-01-v15-week-3 \
                --output artifacts/candidate-01-v15-week-3 \
                --workers 4
            '
      - name: Classify the third-week gate
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/candidate-01-v15-week-3")
          summary = json.loads((root / "intrinsic_tick_daily_markers_v15_summary.json").read_text())
          metrics = json.loads((root / "nautilus_metrics.json").read_text())
          contract = json.loads((root / "execution_contract.json").read_text())
          daily = pd.read_csv(root / "daily_nav.csv")
          assert summary["execution_engine"] == "NautilusTrader"
          assert summary["risk_fraction"] == 0.03
          assert metrics["execution_engine"] == "NautilusTrader"
          assert metrics["trade_execution"] is True
          assert contract["authoritative_performance_engine"] == "NautilusTrader"
          assert len(daily) == 7

          trades = int(metrics["closed_positions"])
          geo = float(metrics["geometric_mean_daily_return"])
          total = float(metrics["total_return"])
          win = metrics["win_rate"]
          win = float(win) if win is not None else 0.0
          pf = metrics["profit_factor"]
          pf_value = float(pf) if pf is not None else (999.0 if win == 1.0 and trades else 0.0)
          mdd = float(metrics["max_drawdown"])
          full_pass = (
              trades >= 7 and geo >= 0.01 and total > 0.0
              and win >= 0.40 and pf_value > 1.0 and mdd > -0.20
          )
          near = (
              not full_pass and trades >= 5 and geo >= 0.005 and total > 0.0
              and pf_value >= 1.0 and mdd > -0.15
          )
          classification = "full_pass" if full_pass else "near_target" if near else "stop"
          gate = {
              "classification": classification,
              "advance": full_pass or near,
              "trades": trades,
              "win_rate": win,
              "total_return": total,
              "geometric_daily": geo,
              "profit_factor": pf,
              "max_drawdown": mdd,
              "rejection_counts": metrics["rejection_counts"],
              "ended_flat": metrics["ended_flat"],
          }
          (root / "week_gate.json").write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          with open(Path("/tmp/gate-output"), "w") as stream:
              stream.write(f"advance={'true' if gate['advance'] else 'false'}\n")
              stream.write(f"classification={classification}\n")
          PY
          cat /tmp/gate-output >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-v15-week-3-${{ github.sha }}
          path: artifacts/candidate-01-v15-week-3
          if-no-files-found: error
          retention-days: 30
