name: candidate-02-v106-failed-auction-two-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v106_trigger.json"

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: candidate-02-v106-failed-auction-two-week
  cancel-in-progress: false

jobs:
  v106-two-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify fixed engine and v106 source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v106_failed_auction_core.py \
            research/candidate-02/v106_nt_backtest.py
          python -m json.tool research/candidate-02/v106_week1_config.json >/dev/null
          python -m json.tool research/candidate-02/v106_week2_config.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v106_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v106_week2_config.json').read_text())
          assert one['scenario'] == two['scenario']
          assert one['costs'] == two['costs']
          assert one['risk'] == two['risk']
          assert float(one['risk']['risk_fraction']) == 0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['scenario']['auction_windows_5m'] == [9,12,15]
          PY

      - name: Download immutable feature matrix and first-week bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v106-week1
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable feature matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v106-week2
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked second-week bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v106-week2-source
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize exact second-week bars
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v106-week2/.cache
          mkdir -p inputs/v106-week2/.cache/candidate-02/v106-week2/binance_1m
          find inputs/v106-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v106-week2/.cache/candidate-02/v106-week2/binance_1m/ \;
          test "$(find inputs/v106-week2/.cache/candidate-02/v106-week2/binance_1m -name '*.zip' | wc -l)" -eq 10

      - name: Run both revealed development weeks in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          for week in week1 week2; do
            mkdir -p "artifacts/candidate-02-v106/$week"
            set +e
            python research/candidate-02/v106_nt_backtest.py \
              --config "research/candidate-02/v106_${week}_config.json" \
              --input-root "inputs/v106-$week" \
              --output "artifacts/candidate-02-v106/$week" \
              | tee "artifacts-v106-${week}.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "artifacts/candidate-02-v106/$week/validation_exit_code.txt"
            if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={'candidate':'candidate-02-v106-rolling-failed-auction-center-rotation','engine':'NautilusTrader 1.230.0','custom_backtest_engine':False,'risk_fraction':0.03,'weeks':{}}
          for label in ('week1','week2'):
              m=json.loads(Path(f'artifacts/candidate-02-v106/{label}/metrics.json').read_text())
              out['weeks'][label]=m
          out['both_development_weeks_pass']=all(m['target_met'] for m in out['weeks'].values())
          out['status']='READY_FOR_PROSPECTIVE_WEEK' if out['both_development_weeks_pass'] else 'DEVELOPMENT_REJECT'
          Path('artifacts-v106-two-week-decision.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:(v if k!='weeks' else {x:{q:y.get(q) for q in ('trades','trades_per_day','win_rate','profit_factor_after_cost','geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown','target_met')} for x,y in v.items()}) for k,v in out.items()},indent=2,sort_keys=True))
          PY

      - name: Commit compact v106 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v106
          mkdir -p compact-v106
          cp -f artifacts-v106-*.json compact-v106/ 2>/dev/null || true
          cp -f artifacts-v106-*.log compact-v106/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v106 compact-v106/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" && test -f artifacts-v106-two-week-decision.json; then
            destination="research/candidate-02/results/v106_two_week/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v106/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v106 two-week evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload v106 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v106-two-week-${{ github.sha }}
          path: compact-v106
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
