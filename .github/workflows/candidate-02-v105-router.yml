name: candidate-02-v111-liquidity-sweep-state-machine

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v111_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v111-liquidity-sweep-state-machine, cancel-in-progress: false}

jobs:
  v111-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify fixed engine and explicit SMC state machine
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v111_liquidity_sweep_core.py \
            research/candidate-02/v111_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v111_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v111_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert one['validation']['first_week_start'] != two['validation']['first_week_start']
          assert float(one['risk']['risk_fraction']) == 0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['risk']['score_risk_multiplier'] is None
          assert one['scenario']['activation_delay_minutes'] == 1
          assert one['scenario']['maximum_holding_minutes'] <= one['validation']['exit_buffer_minutes']
          PY

      - name: Download immutable week-one data
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v111-week1
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable feature matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v111-week2
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v111-week2-source
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize locked inputs and adjacent dealing-range family
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v111-week2/.cache
          mkdir -p inputs/v111-week2/.cache/candidate-02/v111-week2/binance_1m
          find inputs/v111-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v111-week2/.cache/candidate-02/v111-week2/binance_1m/ \;
          test "$(find inputs/v111-week2/.cache/candidate-02/v111-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v111
          python - <<'PY'
          import json
          from pathlib import Path
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v111_{week}_config.json').read_text())
              for horizon in (60,90,120):
                  obj=json.loads(json.dumps(base))
                  obj['scenario']['dealing_range_minutes']=horizon
                  obj['candidate']=f'candidate-02-v111-range-{horizon}'
                  Path(f'/tmp/v111/{week}-r{horizon}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader structural screens
        shell: bash
        run: |
          set -euo pipefail
          for horizon in 60 90 120; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v111/r${horizon}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v111_nt_backtest.py \
                --config "/tmp/v111/${week}-r${horizon}.json" \
                --input-root "inputs/v111-${week}" \
                --output "$out" \
                | tee "artifacts-v111-r${horizon}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              [[ "$status" == 0 || "$status" == 2 ]] || exit "$status"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={
              'candidate':'candidate-02-v111-liquidity-sweep-state-machine',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'event_detector':'prior external dealing-range liquidity sweep',
              'scenario_state_machine':[
                  'RANGE_DEFINED',
                  'EXTERNAL_LIQUIDITY_SWEPT',
                  'DISPLACEMENT_AND_CHOCH',
                  'FVG_FORMED',
                  'FVG_RETRACE_REJECTED',
                  'ENTRY_ARMED',
              ],
              'structural_family':'dealing_range_minutes',
              'variants':{},
          }
          for horizon in (60,90,120):
              out['variants'][str(horizon)]={
                  week:json.loads(
                      Path(f'artifacts/candidate-02-v111/r{horizon}/{week}/metrics.json').read_text()
                  )
                  for week in ('week1','week2')
              }
          passes={
              key:all(metric['target_met'] for metric in weeks.values())
              for key,weeks in out['variants'].items()
          }
          out['variant_both_week_pass']=passes
          out['plateau_pass']=passes['90'] and (passes['60'] or passes['120'])
          out['status']='READY_FOR_PROSPECTIVE_WEEK' if out['plateau_pass'] else 'DEVELOPMENT_REJECT'
          Path('artifacts-v111-family-decision.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'status':out['status'],
              'passes':passes,
              'metrics':{
                  variant:{
                      week:{
                          key:metric.get(key)
                          for key in (
                              'trades',
                              'trades_per_day',
                              'win_rate',
                              'profit_factor_after_cost',
                              'geometric_daily_growth_after_cost',
                              'maximum_mark_to_market_drawdown',
                              'target_met',
                              'smc_ict_scenario_diagnostics',
                          )
                      }
                      for week,metric in weeks.items()
                  }
                  for variant,weeks in out['variants'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact causal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v111
          mkdir compact-v111
          cp -f artifacts-v111-*.json compact-v111/ 2>/dev/null || true
          cp -f artifacts-v111-*.log compact-v111/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v111 compact-v111/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v111-family-decision.json; then
            destination="research/candidate-02/results/v111_family/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v111/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v111 causal state-machine evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "candidate-02-v111-family-${{ github.sha }}"
          path: compact-v111
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
