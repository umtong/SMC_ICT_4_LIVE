name: candidate-02-v115-completed-session-range-sweep

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v115_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v115-session-range-sweep, cancel-in-progress: false}

jobs:
  v115-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify fixed engine and completed-range causality
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v111_liquidity_sweep_core.py \
            research/candidate-02/v113_persistent_pool_router_core.py \
            research/candidate-02/v115_session_range_sweep_core.py \
            research/candidate-02/v115_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v115_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v115_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert one['validation']['first_week_start'] != two['validation']['first_week_start']
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['risk']['score_risk_multiplier'] is None
          assert one['scenario']['asia_end_hour_utc'] < one['scenario']['london_end_hour_utc'] < one['scenario']['active_day_end_hour_utc']
          assert one['scenario']['activation_delay_minutes']==1
          assert one['scenario']['maximum_holding_minutes'] <= one['validation']['exit_buffer_minutes']
          PY

      - name: Download immutable week-one data
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v115-week1
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable feature matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v115-week2
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v115-week2-source
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize locked inputs and independent liquidity sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v115-week2/.cache
          mkdir -p inputs/v115-week2/.cache/candidate-02/v115-week2/binance_1m
          find inputs/v115-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v115-week2/.cache/candidate-02/v115-week2/binance_1m/ \;
          test "$(find inputs/v115-week2/.cache/candidate-02/v115-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v115
          python - <<'PY'
          import json
          from pathlib import Path
          sources={'asia':'ASIA','london':'LONDON','previous_day':'PREVIOUS_DAY'}
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v115_{week}_config.json').read_text())
              for label,source in sources.items():
                  obj=json.loads(json.dumps(base))
                  obj['scenario']['liquidity_source']=source
                  obj['candidate']=f'candidate-02-v115-{label}'
                  Path(f'/tmp/v115/{week}-{label}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader source-isolation screens
        shell: bash
        run: |
          set -euo pipefail
          for source in asia london previous_day; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v115/${source}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v115_nt_backtest.py \
                --config "/tmp/v115/${week}-${source}.json" \
                --input-root "inputs/v115-${week}" \
                --output "$out" \
                | tee "artifacts-v115-${source}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              [[ "$status" == 0 || "$status" == 2 ]] || exit "$status"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={
              'candidate':'candidate-02-v115-completed-session-range-sweep',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'shared_scenario':'completed range -> first boundary sweep/rejection -> displacement/CHoCH/FVG -> retest -> opposite boundary',
              'independent_liquidity_sources':{},
          }
          for source in ('asia','london','previous_day'):
              out['independent_liquidity_sources'][source]={
                  week:json.loads(
                      Path(f'artifacts/candidate-02-v115/{source}/{week}/metrics.json').read_text()
                  )
                  for week in ('week1','week2')
              }
          passes={
              source:all(metric['target_met'] for metric in weeks.values())
              for source,weeks in out['independent_liquidity_sources'].items()
          }
          out['source_both_week_pass']=passes
          advancing=[source for source,passed in passes.items() if passed]
          out['advancing_sources']=advancing
          out['status']='SOURCE_ADVANCES' if advancing else 'SESSION_RANGE_FAMILY_REJECT'
          Path('artifacts-v115-source-decision.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'status':out['status'],
              'advancing_sources':advancing,
              'metrics':{
                  source:{
                      week:{
                          key:metric.get(key)
                          for key in (
                              'trades','trades_per_day','win_rate',
                              'profit_factor_after_cost',
                              'geometric_daily_growth_after_cost',
                              'maximum_mark_to_market_drawdown','target_met',
                              'smc_ict_scenario_diagnostics',
                          )
                      }
                      for week,metric in weeks.items()
                  }
                  for source,weeks in out['independent_liquidity_sources'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v115
          mkdir -p compact-v115
          cp -f artifacts-v115-source-decision.json compact-v115/ 2>/dev/null || true
          for source in asia london previous_day; do
            for week in week1 week2; do
              src="artifacts/candidate-02-v115/${source}/${week}"
              dst="compact-v115/candidate-02-v115/${source}/${week}"
              mkdir -p "$dst"
              cp -f "$src/metrics.json" "$dst/" 2>/dev/null || true
              cp -f "$src/trades.jsonl" "$dst/" 2>/dev/null || true
              cp -f "$src/signals_schedule.json" "$dst/" 2>/dev/null || true
              cp -f "$src/scenario_diagnostics.json" "$dst/" 2>/dev/null || true
              cp -f "$src/validation_exit_code.txt" "$dst/" 2>/dev/null || true
            done
          done
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v115-source-decision.json; then
            destination="research/candidate-02/results/v115_session_sources/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v115/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v115 session-source evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "candidate-02-v115-session-sources-${{ github.sha }}"
          path: compact-v115
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
