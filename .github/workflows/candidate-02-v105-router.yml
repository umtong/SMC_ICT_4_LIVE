name: candidate-02-v114-route-ablation

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v114_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v114-route-ablation, cancel-in-progress: false}

jobs:
  v114-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify fixed engine and one-variable route ablation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v111_liquidity_sweep_core.py \
            research/candidate-02/v113_persistent_pool_router_core.py \
            research/candidate-02/v114_route_ablation_core.py \
            research/candidate-02/v114_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v113_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v113_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert one['scenario']['liquidity_touch_tolerance_atr']==0.15
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['risk']['score_risk_multiplier'] is None
          PY

      - name: Download immutable week-one data
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v114-week1
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable feature matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v114-week2
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v114-week2-source
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize locked inputs and route-only configs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v114-week2/.cache
          mkdir -p inputs/v114-week2/.cache/candidate-02/v114-week2/binance_1m
          find inputs/v114-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v114-week2/.cache/candidate-02/v114-week2/binance_1m/ \;
          test "$(find inputs/v114-week2/.cache/candidate-02/v114-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v114
          python - <<'PY'
          import json
          from pathlib import Path
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v113_{week}_config.json').read_text())
              for mode in ('BOTH','REVERSAL','CONTINUATION'):
                  obj=json.loads(json.dumps(base))
                  obj['scenario']['route_mode']=mode
                  obj['candidate']=f"candidate-02-v114-{mode.lower()}"
                  Path(f'/tmp/v114/{week}-{mode.lower()}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader route-attribution screens
        shell: bash
        run: |
          set -euo pipefail
          for mode in both reversal continuation; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v114/${mode}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v114_nt_backtest.py \
                --config "/tmp/v114/${week}-${mode}.json" \
                --input-root "inputs/v114-${week}" \
                --output "$out" \
                | tee "artifacts-v114-${mode}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              [[ "$status" == 0 || "$status" == 2 ]] || exit "$status"
            done
          done
          python - <<'PY'
          import json, math
          from pathlib import Path
          out={
              'candidate':'candidate-02-v114-route-ablation',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'fixed_detector':'v113 persistent confirmed-swing liquidity pools at 0.15 ATR tolerance',
              'single_variable_changed':'allowed resolved route',
              'modes':{},
          }
          for mode in ('both','reversal','continuation'):
              out['modes'][mode]={
                  week:json.loads(
                      Path(f'artifacts/candidate-02-v114/{mode}/{week}/metrics.json').read_text()
                  )
                  for week in ('week1','week2')
              }
          reference_root=Path('research/candidate-02/results/v113_family/e2219f21973a4b50d26ae0920817b93fa7e6e8da/candidate-02-v113/t15')
          reproduction={}
          for week in ('week1','week2'):
              reference=json.loads((reference_root/week/'metrics.json').read_text())
              actual=out['modes']['both'][week]
              keys=('trades','wins','losses','final_nav_usdt','geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown')
              checks={}
              for key in keys:
                  left=reference[key]; right=actual[key]
                  checks[key]=(left==right if isinstance(left,int) else math.isclose(float(left),float(right),rel_tol=0,abs_tol=1e-9))
              reproduction[week]=checks
              assert all(checks.values()), (week,checks)
          out['v113_central_reproduced']=reproduction
          passes={
              mode:all(metric['target_met'] for metric in weeks.values())
              for mode,weeks in out['modes'].items()
          }
          out['route_both_week_pass']=passes
          advancing=[mode for mode in ('reversal','continuation') if passes[mode]]
          out['advancing_routes']=advancing
          out['status']='ROUTE_ADVANCES' if advancing else 'ROUTE_FAMILY_REJECT'
          Path('artifacts-v114-route-decision.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'status':out['status'],
              'advancing_routes':advancing,
              'reproduced':reproduction,
              'metrics':{
                  mode:{
                      week:{
                          key:metric.get(key)
                          for key in (
                              'trades','trades_per_day','win_rate',
                              'profit_factor_after_cost',
                              'geometric_daily_growth_after_cost',
                              'maximum_mark_to_market_drawdown','target_met',
                              'smc_ict_scenario_diagnostics',
                          )
                      }
                      for week,metric in weeks.items()
                  }
                  for mode,weeks in out['modes'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact route evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v114
          mkdir -p compact-v114
          cp -f artifacts-v114-route-decision.json compact-v114/ 2>/dev/null || true
          for mode in both reversal continuation; do
            for week in week1 week2; do
              source="artifacts/candidate-02-v114/${mode}/${week}"
              destination="compact-v114/candidate-02-v114/${mode}/${week}"
              mkdir -p "$destination"
              cp -f "$source/metrics.json" "$destination/" 2>/dev/null || true
              cp -f "$source/trades.jsonl" "$destination/" 2>/dev/null || true
              cp -f "$source/signals_schedule.json" "$destination/" 2>/dev/null || true
              cp -f "$source/scenario_diagnostics.json" "$destination/" 2>/dev/null || true
              cp -f "$source/validation_exit_code.txt" "$destination/" 2>/dev/null || true
            done
          done
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v114-route-decision.json; then
            destination="research/candidate-02/results/v114_route_ablation/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v114/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v114 route attribution"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "candidate-02-v114-route-ablation-${{ github.sha }}"
          path: compact-v114
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
