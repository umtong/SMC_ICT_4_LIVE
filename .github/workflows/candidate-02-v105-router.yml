name: candidate-02-v108-basis-compression-ablation

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v108_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v108-basis-compression-ablation, cancel-in-progress: false}

jobs:
  v108-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify engine and single-variable ablation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v108_prepare_spot.py \
            research/candidate-02/v108_cross_market_rotation_core.py \
            research/candidate-02/v108_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v107_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v107_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert one['scenario']['volatility_quantile']==0.65
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          PY

      - name: Download immutable week-one futures data
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e, path: inputs/v108-week1, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31036754667"}

      - name: Download immutable matrix for week two
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e, path: inputs/v108-week2, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31036754667"}

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd, path: inputs/v108-week2-source, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31065619489"}

      - name: Materialize futures bars and causally align spot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v108-week2/.cache
          mkdir -p inputs/v108-week2/.cache/candidate-02/v108-week2/binance_1m
          find inputs/v108-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v108-week2/.cache/candidate-02/v108-week2/binance_1m/ \;
          test "$(find inputs/v108-week2/.cache/candidate-02/v108-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          python research/candidate-02/v108_prepare_spot.py --input-root inputs/v108-week1 --start 2025-03-03
          python research/candidate-02/v108_prepare_spot.py --input-root inputs/v108-week2 --start 2024-12-30
          mkdir -p /tmp/v108-ablation-config
          python - <<'PY'
          import json
          from pathlib import Path
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v107_{week}_config.json').read_text())
              for participation in (0.35,0.50,0.65):
                  obj=json.loads(json.dumps(base))
                  obj['scenario']['spot_participation_max']=participation
                  obj['scenario']['require_basis_compression']=False
                  obj['candidate']=f"candidate-02-v108-ablation-p{int(participation*100):02d}"
                  Path(f'/tmp/v108-ablation-config/{week}-p{int(participation*100):02d}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader ablation screens
        shell: bash
        run: |
          set -euo pipefail
          for participation in 35 50 65; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v108-ablation/p${participation}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v108_nt_backtest.py \
                --config "/tmp/v108-ablation-config/${week}-p${participation}.json" \
                --input-root "inputs/v108-${week}" \
                --output "$out" \
                | tee "artifacts-v108-ablation-p${participation}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={
              'candidate':'candidate-02-v108-basis-compression-ablation',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'removed_variable':'basis compression required before entry',
              'variants':{},
          }
          for participation in (35,50,65):
              out['variants'][str(participation)]={
                  week:json.loads(Path(f'artifacts/candidate-02-v108-ablation/p{participation}/{week}/metrics.json').read_text())
                  for week in ('week1','week2')
              }
          passes={key:all(metric['target_met'] for metric in weeks.values()) for key,weeks in out['variants'].items()}
          out['variant_both_week_pass']=passes
          out['plateau_pass']=passes['50'] and (passes['35'] or passes['65'])
          out['status']='ABLATION_STRUCTURAL_ROUTE' if out['plateau_pass'] else 'ABLATION_REJECT'
          Path('artifacts-v108-ablation-decision.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'status':out['status'],
              'passes':passes,
              'metrics':{
                  p:{w:{k:m.get(k) for k in ('trades','trades_per_day','win_rate','profit_factor_after_cost','geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown','target_met')}
                     for w,m in weeks.items()}
                  for p,weeks in out['variants'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact ablation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v108-ablation
          mkdir compact-v108-ablation
          cp -f artifacts-v108-ablation-*.json compact-v108-ablation/ 2>/dev/null || true
          cp -f artifacts-v108-ablation-*.log compact-v108-ablation/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v108-ablation compact-v108-ablation/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" && test -f artifacts-v108-ablation-decision.json; then
            destination="research/candidate-02/results/v108_ablation/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v108-ablation/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v108 ablation evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "candidate-02-v108-ablation-${{ github.sha }}", path: compact-v108-ablation, if-no-files-found: warn, retention-days: 30, compression-level: 9}
