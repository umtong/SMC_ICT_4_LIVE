name: candidate-02-v116-session-acceptance-continuation

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v116_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v116-session-acceptance, cancel-in-progress: false}

jobs:
  v116-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify fixed engine and causal acceptance scenario
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v111_liquidity_sweep_core.py \
            research/candidate-02/v113_persistent_pool_router_core.py \
            research/candidate-02/v115_session_range_sweep_core.py \
            research/candidate-02/v116_session_acceptance_core.py \
            research/candidate-02/v116_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v116_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v116_week2_config.json').read_text())
          assert one['scenario']==two['scenario']
          assert one['costs']==two['costs']
          assert one['risk']==two['risk']
          assert one['validation']['first_week_start'] != two['validation']['first_week_start']
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          assert one['risk']['score_risk_multiplier'] is None
          assert one['scenario']['activation_delay_minutes']==1
          assert one['scenario']['target_timeframe_minutes'] >= 5
          assert one['scenario']['target_pivot_span_bars'] >= 1
          assert one['scenario']['maximum_holding_minutes'] <= one['validation']['exit_buffer_minutes']
          PY

      - name: Download immutable week-one data
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v116-week1
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download immutable feature matrix for week two
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v116-week2
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd
          path: inputs/v116-week2-source
          github-token: "${{ github.token }}"
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31065619489"

      - name: Materialize locked inputs and source-by-acceptance family
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v116-week2/.cache
          mkdir -p inputs/v116-week2/.cache/candidate-02/v116-week2/binance_1m
          find inputs/v116-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v116-week2/.cache/candidate-02/v116-week2/binance_1m/ \;
          test "$(find inputs/v116-week2/.cache/candidate-02/v116-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v116
          python - <<'PY'
          import json
          from pathlib import Path
          sources={'asia':'ASIA','london':'LONDON'}
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v116_{week}_config.json').read_text())
              for label,source in sources.items():
                  for closes in (1,2,3):
                      obj=json.loads(json.dumps(base))
                      obj['scenario']['liquidity_source']=source
                      obj['scenario']['acceptance_closes']=closes
                      obj['candidate']=f'candidate-02-v116-{label}-acceptance-{closes}'
                      Path(f'/tmp/v116/{week}-{label}-a{closes}.json').write_text(
                          json.dumps(obj,indent=2,sort_keys=True)+'\n'
                      )
          PY

      - name: Run twelve NautilusTrader structural screens
        shell: bash
        run: |
          set -euo pipefail
          for source in asia london; do
            for closes in 1 2 3; do
              for week in week1 week2; do
                out="artifacts/candidate-02-v116/${source}/a${closes}/${week}"
                mkdir -p "$out"
                set +e
                python research/candidate-02/v116_nt_backtest.py \
                  --config "/tmp/v116/${week}-${source}-a${closes}.json" \
                  --input-root "inputs/v116-${week}" \
                  --output "$out" \
                  | tee "artifacts-v116-${source}-a${closes}-${week}.log"
                status=${PIPESTATUS[0]}
                set -e
                echo "$status" > "$out/validation_exit_code.txt"
                [[ "$status" == 0 || "$status" == 2 ]] || exit "$status"
              done
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={
              'candidate':'candidate-02-v116-session-acceptance-continuation',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'scenario':'completed boundary break -> outside acceptance -> displacement/BOS/FVG -> outside retest -> pre-observed external liquidity',
              'structural_family':'required consecutive outside closes',
              'sources':{},
          }
          for source in ('asia','london'):
              out['sources'][source]={}
              for closes in (1,2,3):
                  out['sources'][source][str(closes)]={
                      week:json.loads(
                          Path(f'artifacts/candidate-02-v116/{source}/a{closes}/{week}/metrics.json').read_text()
                      )
                      for week in ('week1','week2')
                  }
          both_week_pass={
              source:{
                  closes:all(metric['target_met'] for metric in weeks.values())
                  for closes,weeks in variants.items()
              }
              for source,variants in out['sources'].items()
          }
          out['variant_both_week_pass']=both_week_pass
          plateau={
              source:(variants['2'] and (variants['1'] or variants['3']))
              for source,variants in both_week_pass.items()
          }
          out['source_plateau_pass']=plateau
          advancing=[source for source,passed in plateau.items() if passed]
          out['advancing_sources']=advancing
          out['status']='READY_FOR_PROSPECTIVE_WEEK' if advancing else 'DEVELOPMENT_REJECT'
          Path('artifacts-v116-family-decision.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'status':out['status'],
              'advancing_sources':advancing,
              'plateau':plateau,
              'metrics':{
                  source:{
                      closes:{
                          week:{
                              key:metric.get(key)
                              for key in (
                                  'trades','trades_per_day','win_rate',
                                  'profit_factor_after_cost',
                                  'geometric_daily_growth_after_cost',
                                  'maximum_mark_to_market_drawdown','target_met',
                                  'smc_ict_scenario_diagnostics',
                              )
                          }
                          for week,metric in weeks.items()
                      }
                      for closes,weeks in variants.items()
                  }
                  for source,variants in out['sources'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact causal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v116
          mkdir -p compact-v116
          cp -f artifacts-v116-family-decision.json compact-v116/ 2>/dev/null || true
          for source in asia london; do
            for closes in 1 2 3; do
              for week in week1 week2; do
                src="artifacts/candidate-02-v116/${source}/a${closes}/${week}"
                dst="compact-v116/candidate-02-v116/${source}/a${closes}/${week}"
                mkdir -p "$dst"
                cp -f "$src/metrics.json" "$dst/" 2>/dev/null || true
                cp -f "$src/trades.jsonl" "$dst/" 2>/dev/null || true
                cp -f "$src/signals_schedule.json" "$dst/" 2>/dev/null || true
                cp -f "$src/scenario_diagnostics.json" "$dst/" 2>/dev/null || true
                cp -f "$src/validation_exit_code.txt" "$dst/" 2>/dev/null || true
              done
            done
          done
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v116-family-decision.json; then
            destination="research/candidate-02/results/v116_acceptance_family/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v116/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v116 acceptance evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "candidate-02-v116-acceptance-family-${{ github.sha }}"
          path: compact-v116
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
