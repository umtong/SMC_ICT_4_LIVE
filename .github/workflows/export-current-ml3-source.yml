name: export-current-ml3-source

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/export-current-ml3-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish run locator and pack source
        run: |
          set -euo pipefail
          mkdir -p research/_run_locators
          printf '%s\n' '${{ github.run_id }}' > research/_run_locators/ML3_SOURCE_EXPORT_RUN_ID
          tar --exclude=.git --exclude=.cache --exclude=artifacts -czf /tmp/research-ml3-current.tgz research .github
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_run_locators/ML3_SOURCE_EXPORT_RUN_ID
          git commit -m "chore(research): publish ML3 source export locator [skip ci]"
          git push origin HEAD:research_ML3
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml3-current-${{ github.sha }}
          path: /tmp/research-ml3-current.tgz
          retention-days: 2
          if-no-files-found: error
