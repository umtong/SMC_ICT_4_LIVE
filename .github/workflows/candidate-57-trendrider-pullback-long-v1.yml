name: candidate-57-trendrider-pullback-long-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-trendrider-pullback-long-v1.yml"
      - "research/candidate-57/TRENDRIDER_PULLBACK_LONG_V1_FREEZE.md"
      - "research/candidate-57/router_trendrider_pullback_1h.py"
      - "research/candidate-57/router_trendrider_runtime.py"
      - "research/candidate-57/strategy_trendrider_pullback_1h.py"
      - "research/candidate-57/trendrider_pullback_long_v1_campaign.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-trendrider-pullback-long-v1
  cancel-in-progress: true

jobs:
  two-regime-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble frozen external pullback mechanism
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/TRENDRIDER_PULLBACK_LONG_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_trendrider_pullback_1h.py research/candidate-51/router_trendrider_impl.py
          cp research/candidate-57/router_trendrider_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_trendrider_pullback_1h.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_trendrider_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/trendrider_pullback_long_v1_campaign.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove source-role contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          import router_trendrider_impl as impl
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_picasso import Candidate35Strategy as ExecutionParent

          assert issubclass(Candidate35Strategy, ExecutionParent)
          route_source = inspect.getsource(impl._route_symbol_with_context)
          for token in (
              "trendrider_ema_regime_slow",
              "pullback",
              "plus_di[index]) > float(minus_di[index])",
              "obv[index]) > float(obv_ema[index])",
              "btc_rsi) > 35.0",
              "source_confidence_numeric",
          ):
              assert token in route_source, token
          assert "trend_pullback" in inspect.getsource(impl)
          assert "ema50_bounce" not in route_source
          assert "rsi_bounce" not in route_source
          assert "bb_bounce" not in route_source
          assert "macd_reversal" not in route_source
          config_source = inspect.getsource(Candidate35Config)
          assert "trendrider_history_minutes: int = 16_000" in config_source
          manage_source = inspect.getsource(Candidate35Strategy._manage_open_position)
          for token in (
              "trendrider_early_loss_2h",
              "trendrider_early_loss_4h",
              "trendrider_early_loss_8h",
              "trendrider_early_loss_16h",
              "trendrider_trailing_offset",
          ):
              assert token in manage_source, token
          assert "for threshold" not in route_source
          print("single external branch and frozen lifecycle contract verified")
          PY

      - name: Run intended and contrast development regimes
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-trendrider-pullback-long-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/trendrider_pullback_long_v1_campaign.py \
            2>&1 | tee .work/candidate-57-trendrider-pullback-long-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact causal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_trendrider_impl.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/trendrider-pullback-long-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist TrendRider pullback causal diagnostic"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-trendrider-pullback-long-v1
          path: |
            research/candidate-57/evidence/trendrider-pullback-long-v1
            artifacts/candidate-57-trendrider-pullback-long-v1
            .work/candidate-57-trendrider-pullback-long-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "TrendRider pullback diagnostic failed mechanically; status=$status"
            exit "${status:-1}"
          fi
