name: Astra2 defended-origin research
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/market_io.py
      - research/candidate-ml-easychart-astra2/defended_origin.py
      - research/candidate-ml-easychart-astra2/first_passage.py
      - research/candidate-ml-easychart-astra2/experiment.py
      - research/candidate-ml-easychart-astra2/nautilus_account.py
      - research/candidate-ml-easychart-astra2/learn_response.py
      - .github/workflows/astra2-origin-research.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra2-origin-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: market_research
          key: astra2-origins-market-v1
          restore-keys: astra2-origins-market-
      - name: Run market hypotheses
        run: |
          mkdir -p research_results/candidate_ml_easychart_astra2
          set -o pipefail
          python -m pip install --disable-pip-version-check -q numpy==2.3.5 pandas==2.3.3 scikit-learn==1.7.2 nautilus_trader==1.230.0
          python -u research/candidate-ml-easychart-astra2/experiment.py 2>&1 | tee research_results/candidate_ml_easychart_astra2/console.txt
      - name: Retain actual observations on the research branch
        if: always()
        run: |
          git config user.name 'astra2-research'
          git config user.email 'astra2-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra2
          if ! git diff --cached --quiet; then
            git commit -m "Astra2: observed defended-origin experiments for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra2
            git push origin HEAD:research_candidate_ML_easychart_astra2
          fi
