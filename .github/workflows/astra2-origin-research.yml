name: Astra2 defended-origin research
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/nautilus*.py
      - research/candidate-ml-easychart-astra2/control_transfer.py
      - .github/workflows/astra2-origin-research.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra2-origin-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: market_research
          key: astra2-origins-market-v3
          restore-keys: astra2-origins-market-
      - name: Short native accounts across distinct dates
        run: |
          mkdir -p research_results/candidate_ml_easychart_astra2
          python -m pip install --disable-pip-version-check -q numpy==2.3.5 pandas==2.3.3 nautilus_trader==1.230.0
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee research_results/candidate_ml_easychart_astra2/expanded_console.txt
          import json,sys
          sys.path.insert(0,'research/candidate-ml-easychart-astra2')
          from nautilus_account import run,OUT
          windows=[('2024-08-03','2024-08-10'),('2025-08-10','2025-08-17'),('2025-11-17','2025-11-24'),('2025-02-10','2025-02-17'),('2026-04-13','2026-04-20'),('2026-07-13','2026-07-20')]
          results=[run(a,b) for a,b in windows]
          (OUT/'expanded_native_results.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Retain actual observations
        if: always()
        run: |
          git config user.name 'astra2-research'
          git config user.email 'astra2-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra2
          if ! git diff --cached --quiet; then
            git commit -m "Astra2: expanded short observations for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra2
            git push origin HEAD:research_candidate_ML_easychart_astra2
          fi
