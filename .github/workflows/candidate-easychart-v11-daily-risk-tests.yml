name: candidate-easychart-v11-daily-risk-tests

on:
  push:
    branches: ["research/candidate-easychart-v11-daily-risk"]
    paths:
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v11-daily-risk-tests.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v11-daily-risk-tests
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  daily-risk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Environment and risk-contract tests
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v
