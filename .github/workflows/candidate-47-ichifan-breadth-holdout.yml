name: candidate-47-ichifan-breadth-holdout

on:
  push:
    branches: ["research/candidate-47"]
    paths:
      - ".github/workflows/candidate-47-ichifan-breadth-holdout.yml"
  workflow_dispatch:

concurrency:
  group: candidate-47-ichifan-breadth-holdout
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  evaluate:
    name: ${{ matrix.period.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        period:
          - label: development-2026-07-01_2026-07-07
            start: "2026-07-01"
            end: "2026-07-07"
            evidence_class: development-smoke
          - label: untouched-2026-02-09_2026-02-15
            start: "2026-02-09"
            end: "2026-02-15"
            evidence_class: untouched
          - label: untouched-2026-03-23_2026-03-29
            start: "2026-03-23"
            end: "2026-03-29"
            evidence_class: untouched
          - label: untouched-2026-05-25_2026-05-31
            start: "2026-05-25"
            end: "2026-05-31"
            evidence_class: untouched
          - label: untouched-2026-07-22_2026-07-28
            start: "2026-07-22"
            end: "2026-07-28"
            evidence_class: untouched
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-ichifan-breadth/${{ matrix.period.label }}
      EVIDENCE_CLASS: ${{ matrix.period.evidence_class }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify environment, ownership and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-47/ichifan_breadth_structural_strategy.py \
            research/candidate-47/ichifan_breadth_structural_launch.py \
            research/candidate-47/test_ichifan_breadth_structural.py
          python - <<'PY'
          import inspect
          from pathlib import Path
          import ichifan_breadth_structural_strategy as strategy
          import test_ichifan_breadth_structural as tests_module

          root = Path("research/candidate-47").resolve()
          assert Path(strategy.__file__).resolve() == root / "ichifan_breadth_structural_strategy.py"
          assert strategy.Candidate35Strategy is strategy.Candidate47IchiFanBreadthStructuralStrategy
          tests = [
              (name, fn)
              for name, fn in inspect.getmembers(tests_module, inspect.isfunction)
              if name.startswith("test_")
          ]
          assert tests
          for name, fn in tests:
              fn()
              print(f"PASS {name}")
          print(f"executed {len(tests)} breadth contracts")
          PY

      - name: Run one four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python research/candidate-47/ichifan_breadth_structural_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start "${{ matrix.period.start }}" \
            --end "${{ matrix.period.end }}" \
            --cache ".cache/candidate-47-breadth-${{ matrix.period.label }}" \
            --output "$ROOT" \
            --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"

      - name: Preserve compact evidence and verify invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = metrics["strategy_diagnostics"]
          evaluations = int(diagnostics.get("ichifan_breadth_evaluations", 0))
          confirmed = int(diagnostics.get("ichifan_breadth_confirmed", 0))
          rejected = int(diagnostics.get("ichifan_breadth_rejected", 0))
          invalid = int(diagnostics.get("ichifan_breadth_invalid", 0))
          confirmed_submissions = int(
              diagnostics.get("ichifan_breadth_confirmed_submissions", 0)
          )
          summary = {
              "evidence_class": os.environ["EVIDENCE_CLASS"],
              "source_commit": os.environ.get("GITHUB_SHA"),
              "candidate": metrics["candidate"],
              "evaluation_start": metrics["evaluation_start"],
              "evaluation_end": metrics["evaluation_end"],
              "calendar_days": metrics["calendar_days"],
              "active_days": metrics["active_days"],
              "starting_nav": metrics["starting_nav"],
              "ending_nav": metrics["ending_nav"],
              "total_return": metrics["total_return"],
              "geometric_daily_growth": metrics["geometric_daily_growth"],
              "max_drawdown": metrics["max_drawdown"],
              "trades": metrics["trades"],
              "wins": metrics["wins"],
              "losses": metrics["losses"],
              "win_rate": metrics["win_rate"],
              "profit_factor": metrics["profit_factor"],
              "expectancy_usdt": metrics["expectancy_usdt"],
              "largest_winner_share": metrics["largest_winner_share"],
              "breadth_evaluations": evaluations,
              "breadth_confirmed": confirmed,
              "breadth_rejected": rejected,
              "breadth_invalid": invalid,
              "breadth_confirmed_submissions": confirmed_submissions,
              "breadth_count_distribution": diagnostics.get(
                  "ichifan_breadth_count_distribution", {}
              ),
              "structural_submissions": diagnostics.get(
                  "ichifan_structural_stop_submissions", 0
              ),
              "structural_failures": diagnostics.get(
                  "ichifan_structural_stop_failures", 0
              ),
              "selected_symbols": diagnostics.get("selected_symbols", {}),
              "order_rejections": diagnostics.get("order_rejections", 0),
              "global_position_violations": diagnostics.get(
                  "global_position_violations", 0
              ),
              "gate_checks": metrics["gate_checks"],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert metrics["engine"] == "NautilusTrader BacktestNode"
          assert metrics["single_continuous_account"] is True
          assert metrics["single_strategy_process"] is True
          assert metrics["global_entry_or_position_limit"] == 1
          assert metrics["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert metrics["gate_checks"]["no_global_position_violation"] is True
          assert metrics["gate_checks"]["nautilus_positions_match"] is True
          assert diagnostics.get("order_rejections", 0) == 0
          assert diagnostics.get("global_position_violations", 0) == 0
          assert invalid == 0
          assert evaluations == confirmed + rejected
          assert confirmed_submissions <= confirmed
          assert confirmed_submissions == int(
              diagnostics.get("ichifan_structural_stop_submissions", 0)
          )
          assert int(diagnostics.get("ichifan_structural_stop_failures", 0)) == 0
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-ichifan-breadth-${{ matrix.period.label }}-${{ github.sha }}
          path: artifacts/candidate-47-ichifan-breadth/${{ matrix.period.label }}/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
