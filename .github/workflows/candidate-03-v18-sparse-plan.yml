name: candidate-03-v18-sparse-plan

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v18-sparse-plan.yml"
      - "research/candidate-03/plan_nt_lvcfr_v18_sparse.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-03-v18-sparse-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch source and plan official L1 acquisition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, shutil, tarfile, urllib.request
          from pathlib import Path
          root=Path('/tmp/candidate03-v18-plan'); shutil.rmtree(root,ignore_errors=True); root.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tarball/research/candidate-03",headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'candidate-03-v18-plan'})
          with urllib.request.urlopen(req,timeout=180) as r: payload=r.read()
          extract=root/'extract'; extract.mkdir()
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as a:
            roots={Path(m.name).parts[0] for m in a.getmembers() if Path(m.name).parts}; a.extractall(extract,filter='data')
          shutil.move(str(extract/next(iter(roots))),root/'repo')
          PY
          cd /tmp/candidate03-v18-plan/repo
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/research/candidate-03"
          output=/tmp/candidate03-v18-plan/output
          mkdir -p "$output"
          python3 research/candidate-03/plan_nt_lvcfr_v18_sparse.py \
            --week-start 2024-01-08 --output "$output" \
            --config research/candidate-03/nt_lvcfr_v18_config.json \
            2>&1 | tee "$output/plan.log"

      - name: Commit acquisition plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; branch='research/candidate-03'; src=Path('/tmp/candidate03-v18-plan/output')
          def api(method,path,payload=None):
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'candidate-03-v18-plan','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=180) as r: raw=r.read()
            return json.loads(raw.decode()) if raw else None
          ref=api('GET',f'/git/ref/heads/{branch}'); parent=ref['object']['sha']; pc=api('GET',f'/git/commits/{parent}'); entries=[]
          for f in sorted(p for p in src.iterdir() if p.is_file()):
            b=api('POST','/git/blobs',{'content':base64.b64encode(f.read_bytes()).decode(),'encoding':'base64'}); entries.append({'path':f'research/candidate-03/results/v18-sparse-plan/{f.name}','mode':'100644','type':'blob','sha':b['sha']})
          tree=api('POST','/git/trees',{'base_tree':pc['tree']['sha'],'tree':entries}); c=api('POST','/git/commits',{'message':'candidate-03: record V18 sparse acquisition plan','tree':tree['sha'],'parents':[parent]}); api('PATCH',f'/git/refs/heads/{branch}',{'sha':c['sha'],'force':False}); print(c['sha'])
          PY