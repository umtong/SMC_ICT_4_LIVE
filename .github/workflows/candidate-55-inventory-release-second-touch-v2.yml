name: candidate-55-inventory-release-second-touch-v2

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-inventory-release-second-touch-v2.yml"
      - "research/candidate-55/strategy_inventory_release_second_touch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-inventory-release-second-touch-v2
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: development-2026-04-13_2026-04-19
            start: "2026-04-13"
            end: "2026-04-19"
            calendar_days: 7
            evidence_role: development
          - label: development-2025-11-03_2025-11-09
            start: "2025-11-03"
            end: "2025-11-09"
            calendar_days: 7
            evidence_role: development
          - label: fresh-2024-06-03_2024-06-09
            start: "2024-06-03"
            end: "2024-06-09"
            calendar_days: 7
            evidence_role: untouched
          - label: fresh-2025-03-01_2025-03-30
            start: "2025-03-01"
            end: "2025-03-30"
            calendar_days: 30
            evidence_role: untouched
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 1

      - name: Materialize reused router and second-touch policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_microauction.py research/candidate-51/router.py
          cp research/candidate-55/strategy_inventory_release_second_touch.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from strategy import Candidate35Config, Candidate35Strategy, _cost_after_net_r

          assert Candidate35Config is not None
          assert Candidate35Strategy is not None
          loss, reward, ratio = _cost_after_net_r(
              entry=100.0,
              stop=99.0,
              target=102.0,
              side=1,
              fee_bps_each_side=7.5,
              slippage_bps_each_side=2.5,
              funding_reserve_bps=1.0,
          )
          assert loss > 0.0 and reward > 0.0 and ratio > 1.25
          assert all(math.isfinite(value) for value in (loss, reward, ratio))
          print("second-touch import and cost geometry pass")
          PY

      - name: Freeze result-blind policy
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          strategy = base["strategy"]
          removed = []
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              if key in strategy:
                  removed.append(key)
                  strategy.pop(key)
          strategy.update(
              {
                  "microauction_mode": "absorption",
                  "microauction_atr_period": 30,
                  "microauction_balance_lookback": 10,
                  "microauction_stop_buffer_atr": 0.15,
                  "microauction_min_reward_r": 0.0,
                  "absorption_flow_min": 0.25,
                  "absorption_flow_15s_min": 0.15,
                  "absorption_flow_3m_min": 0.05,
                  "absorption_notional_burst_min": 1.50,
                  "absorption_trade_burst_min": 1.20,
                  "absorption_efficiency_max": 0.25,
                  "absorption_strength_min": 0.15,
                  "absorption_alignment_max_bps": 0.50,
                  "absorption_sweep_buffer_atr": 0.05,
                  "absorption_depth_defense_min": 0.00,
                  "absorption_same_depth_growth_min": 0.00,
                  "microauction_exit_on_opposite_state": False,
                  "inventory_context_lookback_minutes": 60,
                  "inventory_target_net_r": 2.0,
                  "second_touch_ttl_minutes": 10,
                  "second_touch_episode_lookback_minutes": 60,
                  "second_touch_min_directional_depth": 0.0,
                  "second_touch_min_net_r": 1.25,
                  "feature_max_age_seconds": 65.0,
                  "cooldown_minutes": 0,
                  "max_hold_minutes": 240,
                  "funding_flatten_minute": 60,
                  "funding_blackout_before_minutes": -1,
                  "funding_blackout_after_minutes": -1,
              }
          )
          work = Path(".work/candidate-55-inventory-release-second-touch-v2")
          work.mkdir(parents=True, exist_ok=True)
          config_path = work / "frozen-config.json"
          config_path.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
          manifest = {
              "candidate": "candidate-55-inventory-release-second-touch-v2",
              "label": os.environ["LABEL"],
              "interval": [os.environ["START"], os.environ["END"]],
              "calendar_days": int(os.environ["CALENDAR_DAYS"]),
              "evidence_role": os.environ["EVIDENCE_ROLE"],
              "policy_changed_between_intervals": False,
              "engine": "NautilusTrader BacktestNode",
              "universe": ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"],
              "one_global_entry_or_position": True,
              "current_nav_planned_loss_fraction": 0.03,
              "costs_bps": {
                  "fee_each_side": base["all_in_cost_bps_each_side"],
                  "slippage_each_side": base["adverse_slippage_bps_each_side"],
                  "funding_reserve": base["funding_reserve_bps"],
              },
              "causal_scenario": {
                  "context": [
                      "adverse completed 60m relative return versus equal-weight universe",
                      "completed 15m aggregate OI release below zero",
                      "completed 5m premium turn in reversal direction above zero",
                  ],
                  "interaction": (
                      "real aggressor-flow crowding, low efficiency, completed ten-minute "
                      "balance sweep/reclaim and defended depth"
                  ),
                  "transition": (
                      "within the same ten-minute balance horizon, boundary retest, close "
                      "back inside, final-15s flow flip and directional depth at zero-or-better"
                  ),
                  "entry": "next executable market fill after completed response minute",
                  "invalidation": (
                      "episode extreme through confirmation plus frozen 0.15 interaction ATR"
                  ),
                  "objective": "opposite boundary of frozen pre-sweep ten-minute balance",
                  "no_trade": "structural target below 1.25R after all modeled costs",
                  "episode_owner": "symbol, side and completed-hour extreme timestamp",
                  "management": "structural bracket or 240 completed minutes",
              },
              "predicted_change_from_v1": {
                  "must_remove": "most one-to-five-minute false snapshot reversals",
                  "accepted_trade_cost_geometry": "target remains at least 1.25R after costs",
                  "falsification": [
                      "responses retain negative cost-after expectancy",
                      "response trades still fail immediately at the episode stop",
                      "almost no independent responses survive in fresh periods",
                      "actual-fill geometry or risk breaks the frozen contract",
                  ],
              },
              "fresh_period_search_record": {
                  "2024-06-03": "no repository code-search occurrence before implementation",
                  "2025-03-01": "no repository code-search occurrence before implementation",
              },
              "removed_inherited_unknown_fields": removed,
              "strategy_sha256": hashlib.sha256(
                  Path("research/candidate-51/strategy.py").read_bytes()
              ).hexdigest(),
              "router_sha256": hashlib.sha256(
                  Path("research/candidate-51/router.py").read_bytes()
              ).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
          }
          (work / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run one continuous account for interval
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set +e
          output="artifacts/candidate-55/inventory-release-second-touch-v2-${LABEL}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/candidate-55-inventory-release-second-touch-v2/frozen-config.json \
            --start "$START" --end "$END" \
            --cache ".cache/candidate-55-inventory-release-second-touch-v2-${LABEL}" \
            --output "$output" \
            --workspace ".work/candidate-55-inventory-release-second-touch-v2-${LABEL}"
          code="$?"
          echo "$code" > .work/candidate-55-inventory-release-second-touch-v2/exit-code.txt
          exit 0

      - name: Write interval anatomy verdict
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          label = os.environ["LABEL"]
          days = int(os.environ["CALENDAR_DAYS"])
          role = os.environ["EVIDENCE_ROLE"]
          root = Path("artifacts/candidate-55") / f"inventory-release-second-touch-v2-{label}"
          mp = root / "metrics.json"
          dp = root / "strategy_diagnostics.json"
          cp = root / "closed_scenarios.json"
          ep = Path(".work/candidate-55-inventory-release-second-touch-v2/exit-code.txt")

          def number(value):
              if isinstance(value, (int, float)):
                  return float(value)
              if value is None:
                  return None
              match = re.search(
                  r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)",
                  str(value).replace(",", ""),
              )
              return float(match.group(0)) if match else None

          verdict = {
              "candidate": "candidate-55-inventory-release-second-touch-v2",
              "label": label,
              "calendar_days": days,
              "evidence_role": role,
              "policy_changed_after_prior_interval": False,
              "exit_code": int(ep.read_text()) if ep.is_file() else None,
          }
          if not mp.is_file() or not dp.is_file():
              verdict.update(
                  produced=False,
                  classification="IMPLEMENTATION_OR_DATA_BLOCKED",
              )
          else:
              metrics = json.loads(mp.read_text())
              diagnostics = json.loads(dp.read_text())
              closed = json.loads(cp.read_text()) if cp.is_file() else []
              keys = [
                  str(item.get("inventory_episode_key"))
                  for item in closed
                  if item.get("inventory_episode_key")
              ]
              geometry_valid = sum(
                  item.get("actual_fill_geometry_valid") is True for item in closed
              )
              risk_valid = sum(
                  item.get("actual_fill_risk_valid") is True for item in closed
              )
              pnls = [number(item.get("realized_pnl")) for item in closed]
              pnls = [value for value in pnls if value is not None]
              durations = []
              for item in closed:
                  start = int(item.get("episode_ts") or 0)
                  end = int(item.get("closed_ts_event") or item.get("ts_event") or 0)
                  if end >= start > 0:
                      durations.append((end - start) / 60_000_000_000)
              clean = (
                  int(diagnostics.get("order_rejections") or 0) == 0
                  and int(diagnostics.get("global_position_violations") or 0) == 0
                  and int(diagnostics.get("max_open_positions_observed") or 0) <= 1
                  and len(keys) == len(set(keys))
                  and geometry_valid == len(closed)
                  and risk_valid == len(closed)
              )
              trades = int(metrics.get("trades") or 0)
              expectancy = float(metrics.get("expectancy_usdt") or 0.0)
              pf_raw = metrics.get("profit_factor")
              pf = float(pf_raw) if pf_raw is not None else None
              if trades == 0:
                  classification = "NO_INDEPENDENT_RESPONSE_OPPORTUNITY"
              elif clean and expectancy > 0.0 and (pf is None or pf > 1.0):
                  classification = "COST_AFTER_POSITIVE"
              elif clean:
                  classification = "COST_AFTER_LOGIC_FAILURE"
              else:
                  classification = "EXECUTION_OR_INDEPENDENCE_FAILURE"
              verdict.update(
                  produced=True,
                  classification=classification,
                  clean=clean,
                  trades_per_calendar_day=trades / days,
                  metrics=metrics,
                  closed_scenarios=len(closed),
                  unique_episode_keys=len(set(keys)),
                  actual_fill_geometry_valid=geometry_valid,
                  actual_fill_risk_valid=risk_valid,
                  pnl_sign_counts=dict(
                      Counter(
                          "WIN" if value > 0.0 else "LOSS" if value < 0.0 else "FLAT"
                          for value in pnls
                      )
                  ),
                  duration_minutes={
                      "minimum": min(durations) if durations else None,
                      "median": sorted(durations)[len(durations) // 2] if durations else None,
                      "maximum": max(durations) if durations else None,
                  },
                  state_transition={
                      key: diagnostics.get(key)
                      for key in (
                          "base_absorption_states",
                          "second_touch_arms",
                          "second_touch_arm_expirations",
                          "second_touch_target_before_retest",
                          "second_touch_intrabar_ambiguity",
                          "second_touch_reference_touches",
                          "second_touch_close_rejections",
                          "second_touch_flow_rejections",
                          "second_touch_depth_rejections",
                          "second_touch_reward_space_rejections",
                          "second_touch_responses",
                          "second_touch_entries",
                          "second_touch_competing_responses",
                          "second_touch_seen_episode_rejections",
                          "second_touch_used_episode_rejections",
                          "second_touch_arms_cleared_by_global_slot",
                          "second_touch_arm_records",
                          "second_touch_response_records",
                          "second_touch_expiration_records",
                          "second_touch_selected_episode_keys",
                          "inventory_context_rejection_counts",
                          "selected_symbols",
                      )
                  },
                  execution={
                      key: diagnostics.get(key)
                      for key in (
                          "entry_submissions",
                          "fill_invalidations",
                          "fill_beyond_bracket_invalidations",
                          "fill_risk_budget_invalidations",
                          "order_rejections",
                          "entry_expirations",
                          "global_position_violations",
                          "max_open_positions_observed",
                          "max_simultaneous_entry_intents",
                      )
                  },
                  project_interval_checks={
                      "geometric_daily_growth_gte_1pct": float(
                          metrics.get("geometric_daily_growth") or 0.0
                      ) >= 0.01,
                      "trades_gte_calendar_days": trades >= days,
                      "positive_expectancy": expectancy > 0.0,
                      "max_drawdown_lte_20pct": float(
                          metrics.get("max_drawdown") or 1.0
                      ) <= 0.20,
                      "clean_execution_and_independence": clean,
                  },
              )
          root.mkdir(parents=True, exist_ok=True)
          (root / "V2_VERDICT.json").write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-inventory-release-second-touch-v2-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-55/inventory-release-second-touch-v2-${{ matrix.label }}/**
            .work/candidate-55-inventory-release-second-touch-v2/manifest.json
            .work/candidate-55-inventory-release-second-touch-v2/exit-code.txt
          if-no-files-found: warn
          retention-days: 90
