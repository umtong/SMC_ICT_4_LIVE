name: candidate-02-v154-qh-initiative-auction-leg

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v154_run_trigger.json"]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-02-v154-qh-initiative-auction-leg
  cancel-in-progress: false

env:
  C13_SOURCE_COMMIT: f613cadff54c86eeb14bdb402aa17ce43474603b
  C13_ROOT: /tmp/candidate13
  PYTHONUNBUFFERED: "1"

jobs:
  exposed-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reuse pinned Candidate 13 portfolio and execution stack
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          git fetch --no-tags origin research/candidate-13
          git cat-file -e "$C13_SOURCE_COMMIT^{commit}"
          rm -rf "$C13_ROOT"
          mkdir -p "$C13_ROOT"
          git archive "$C13_SOURCE_COMMIT" research/candidate-13 \
            | tar -x -C "$C13_ROOT" --strip-components=2
          cp "$C13_ROOT/quarter_hour_materializer.py" \
             "$C13_ROOT/quarter_hour_materializer_v9.py"
          cp research/candidate-02/v153_qh_auction_leg.py \
             "$C13_ROOT/quarter_hour_common_flow.py"
          cp research/candidate-02/v153_execution_materializer.py \
             "$C13_ROOT/quarter_hour_materializer.py"
          cp research/candidate-02/v153_protocol.json \
             "$C13_ROOT/protocol-v9-quarter-hour-development.json"
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/candidate13/candidate13_v9_runner.py')
          text = path.read_text(encoding='utf-8')
          old = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py',"
          new = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py', 'quarter_hour_materializer_v9.py',"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify causal logic and inherited invariants
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$C13_ROOT:$GITHUB_WORKSPACE/src"
          python -m py_compile \
            "$C13_ROOT/quarter_hour_common_flow.py" \
            "$C13_ROOT/quarter_hour_materializer.py" \
            "$C13_ROOT/quarter_hour_materializer_v9.py" \
            "$C13_ROOT/candidate13_v9_runner.py" \
            "$C13_ROOT/aggregate_v9_development.py" \
            research/candidate-02/v154_qh_state_test.py \
            research/candidate-02/v154_complete_diagnostic.py
          python research/candidate-02/v154_qh_state_test.py
          python - <<'PY'
          from pathlib import Path
          from quarter_hour_materializer import materialize_quarter_hour_source
          base = Path('/tmp/candidate13/run_leadership_scdam_base.py')
          materialized = materialize_quarter_hour_source(base.read_text(encoding='utf-8'))
          compile(materialized, str(base), 'exec')
          assert materialized.count('QuarterHourCommonFlowEngine(logic_config)') == 1
          assert materialized.count('plans.append((qh_plan, qh_candidate))') == 1
          assert 'PROTECTIVE_ORDER_REJECTED_FAIL_CLOSED' in materialized
          assert 'close_all_positions(instrument_id)' in materialized
          print('v154 materialized runner contract: OK')
          PY
          python -m unittest discover -s "$C13_ROOT" -p 'test_*.py' -v

      - name: Run and aggregate all six exposed intervals through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$C13_ROOT:$GITHUB_WORKSPACE/src"
          target="research/candidate-02/results/v154_qh_auction_leg/$GITHUB_SHA"
          rm -rf "$target"
          python research/candidate-02/v154_complete_diagnostic.py \
            --candidate13-root "$C13_ROOT" \
            --results "$target" \
            --protocol research/candidate-02/v153_protocol.json \
            --source-commit "$C13_SOURCE_COMMIT"
          test -s "$target/artifacts-v154-family-decision.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          path = Path('research/candidate-02/results/v154_qh_auction_leg') / os.environ['GITHUB_SHA'] / 'artifacts-v154-family-decision.json'
          result = json.loads(path.read_text(encoding='utf-8'))
          assert result['status'] == 'REJECT_OR_REDESIGN', result
          assert result['project_target_met'] is False, result
          assert result['untouched_data_used'] is False, result
          assert result['completed_intervals'] == 6, result
          assert result['all_causal_audits_passed'] is True, result
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit compact exposed evidence
        shell: bash
        run: |
          set -euo pipefail
          target="research/candidate-02/results/v154_qh_auction_leg/$GITHUB_SHA"
          git fetch origin research/candidate-02
          if [[ "$(git rev-parse origin/research/candidate-02)" != "$GITHUB_SHA" ]]; then
            echo "candidate-02 advanced during V154; refusing to mix evidence with another source revision"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research(candidate-02): record v154 auction-leg rejection evidence"
          git push origin HEAD:research/candidate-02
