name: candidate-02-v153-qh-initiative-auction-leg

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v153_trigger.json"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-02-v153-qh-auction-leg-${{ github.sha }}
  cancel-in-progress: false

env:
  C13_SOURCE_COMMIT: f613cadff54c86eeb14bdb402aa17ce43474603b
  C13_ROOT: /tmp/candidate13
  PYTHONUNBUFFERED: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reuse pinned Candidate 13 execution stack
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          git fetch --no-tags origin research/candidate-13
          git cat-file -e "$C13_SOURCE_COMMIT^{commit}"
          rm -rf "$C13_ROOT"
          mkdir -p "$C13_ROOT"
          git archive "$C13_SOURCE_COMMIT" research/candidate-13 \
            | tar -x -C "$C13_ROOT" --strip-components=2
          cp "$C13_ROOT/quarter_hour_materializer.py" \
             "$C13_ROOT/quarter_hour_materializer_v9.py"
          cp research/candidate-02/v153_qh_auction_leg.py \
             "$C13_ROOT/quarter_hour_common_flow.py"
          cp research/candidate-02/v153_execution_materializer.py \
             "$C13_ROOT/quarter_hour_materializer.py"
          cp research/candidate-02/v153_protocol.json \
             "$C13_ROOT/protocol-v9-quarter-hour-development.json"
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/candidate13/candidate13_v9_runner.py')
          text = path.read_text(encoding='utf-8')
          old = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py',"
          new = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py', 'quarter_hour_materializer_v9.py',"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify causal state machine and materialized runner
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$C13_ROOT:$GITHUB_WORKSPACE/src"
          python -m py_compile \
            "$C13_ROOT/quarter_hour_common_flow.py" \
            "$C13_ROOT/quarter_hour_materializer.py" \
            "$C13_ROOT/quarter_hour_materializer_v9.py" \
            "$C13_ROOT/candidate13_v9_runner.py" \
            "$C13_ROOT/aggregate_v9_development.py"
          python "$C13_ROOT/quarter_hour_common_flow.py"
          python - <<'PY'
          from pathlib import Path
          from quarter_hour_materializer import materialize_quarter_hour_source
          base = Path('/tmp/candidate13/run_leadership_scdam_base.py')
          materialized = materialize_quarter_hour_source(base.read_text(encoding='utf-8'))
          compile(materialized, str(base), 'exec')
          assert materialized.count('QuarterHourCommonFlowEngine(logic_config)') == 1
          assert materialized.count('plans.append((qh_plan, qh_candidate))') == 1
          assert 'PROTECTIVE_ORDER_REJECTED_FAIL_CLOSED' in materialized
          assert 'close_all_positions(instrument_id)' in materialized
          print('v153 materialized runner contract: OK')
          PY
          python -m unittest discover -s "$C13_ROOT" -p 'test_*.py' -v

  evaluate:
    needs: static
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        interval: [E01, E02, E03, E04, E05, E06]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize pinned source and V153 overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin research/candidate-13
          git cat-file -e "$C13_SOURCE_COMMIT^{commit}"
          rm -rf "$C13_ROOT"
          mkdir -p "$C13_ROOT"
          git archive "$C13_SOURCE_COMMIT" research/candidate-13 \
            | tar -x -C "$C13_ROOT" --strip-components=2
          cp "$C13_ROOT/quarter_hour_materializer.py" \
             "$C13_ROOT/quarter_hour_materializer_v9.py"
          cp research/candidate-02/v153_qh_auction_leg.py \
             "$C13_ROOT/quarter_hour_common_flow.py"
          cp research/candidate-02/v153_execution_materializer.py \
             "$C13_ROOT/quarter_hour_materializer.py"
          cp research/candidate-02/v153_protocol.json \
             "$C13_ROOT/protocol-v9-quarter-hour-development.json"
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/candidate13/candidate13_v9_runner.py')
          text = path.read_text(encoding='utf-8')
          old = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py',"
          new = "'quarter_hour_common_flow.py', 'quarter_hour_materializer.py', 'quarter_hour_materializer_v9.py',"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run NautilusTrader exposed development interval
        shell: bash
        env:
          INTERVAL: ${{ matrix.interval }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$C13_ROOT:$GITHUB_WORKSPACE/src"
          output="research/candidate-02/results/v153_qh_auction_leg/$GITHUB_SHA/$INTERVAL"
          mkdir -p "$output"
          python "$C13_ROOT/candidate13_v9_runner.py" run "$INTERVAL" "$output" \
            | tee "$output/console.log"

      - name: Enforce V153 causal-plan invariants
        shell: bash
        env:
          INTERVAL: ${{ matrix.interval }}
        run: |
          set -euo pipefail
          output="research/candidate-02/results/v153_qh_auction_leg/$GITHUB_SHA/$INTERVAL"
          OUTPUT="$output" C13_SOURCE_COMMIT="$C13_SOURCE_COMMIT" python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import os

          root = Path(os.environ['OUTPUT'])
          payload = json.loads((root / 'submitted_plans.json').read_text(encoding='utf-8'))
          plans = payload.get('plans', [])
          module = 'QH_INITIATIVE_COMPLETED_AUCTION_LEG'
          qh = [plan for plan in plans if plan.get('module') == module]
          violations = []
          episodes = set()
          semantic = (
              'COMMON_FLOW_INITIATIVE',
              'OUTSIDE_DELIVERY',
              'POST_INITIATIVE_FVG',
              'FVG_RETRACE_HELD_OUTSIDE',
              'FRESH_REACCELERATION_FVG',
              'ENTRY_ARMED',
          )
          for index, plan in enumerate(qh):
              details = plan.get('details', {})
              episode = details.get('independent_episode_key')
              if not episode or episode in episodes:
                  violations.append(f'plan[{index}] duplicate or absent independent episode')
              episodes.add(episode)
              observed = int(plan['observed_ts_ns'])
              initiative_end = int(details.get('initiative_end_ts_ns', observed))
              retrace = int(details.get('fvg_retrace_ts_ns', observed))
              fresh = int(details.get('fresh_reacceleration_fvg_ts_ns', observed + 1))
              if not initiative_end < retrace < fresh <= observed:
                  violations.append(f'plan[{index}] noncausal state chronology')
              if details.get('entry_model') != 'PASSIVE_FRESH_REACCELERATION_FVG_MIDPOINT':
                  violations.append(f'plan[{index}] wrong entry model')
              if details.get('route') != 'COMMON_FLOW_THEN_COMPLETED_AUCTION_LEG':
                  violations.append(f'plan[{index}] wrong route')
              sequence = tuple(details.get('state_sequence', ()))
              if not sequence or sequence[0] != semantic[0] or sequence[-2:] != semantic[-2:]:
                  violations.append(f'plan[{index}] incomplete state sequence: {sequence}')
          lifecycle = json.loads((root / 'order_lifecycle.json').read_text(encoding='utf-8')).get('events', [])
          fail_closed = sum(
              event.get('type') == 'PROTECTIVE_ORDER_REJECTED_FAIL_CLOSED'
              for event in lifecycle
          )
          audit = {
              'schema': 'candidate-02-v153-causal-audit-v1',
              'interval': os.environ.get('INTERVAL'),
              'pinned_candidate13_commit': os.environ['C13_SOURCE_COMMIT'],
              'qh_submitted_plans': len(qh),
              'independent_qh_episodes': len(episodes),
              'protective_rejections_fail_closed': fail_closed,
              'future_information_used': False,
              'initiative_can_emit_entry': False,
              'violations': violations,
              'passed': not violations,
              'plan_modules': dict(Counter(plan.get('module', 'SCDAM_CORE') for plan in plans)),
          }
          (root / 'v153_causal_audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          if violations:
              raise SystemExit('\n'.join(violations))
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Remove downloaded market archives
        if: always()
        shell: bash
        env:
          INTERVAL: ${{ matrix.interval }}
        run: |
          rm -rf "research/candidate-02/results/v153_qh_auction_leg/$GITHUB_SHA/$INTERVAL/data"

      - name: Upload auditable interval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate02-v153-${{ matrix.interval }}
          path: research/candidate-02/results/v153_qh_auction_leg/${{ github.sha }}/${{ matrix.interval }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: ${{ needs.static.result == 'success' && needs.evaluate.result == 'success' }}
    needs: [static, evaluate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download fresh interval evidence
        uses: actions/download-artifact@v4
        with:
          pattern: candidate02-v153-E*
          path: artifacts

      - name: Aggregate exposed development evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin research/candidate-13
          git cat-file -e "$C13_SOURCE_COMMIT^{commit}"
          rm -rf "$C13_ROOT"
          mkdir -p "$C13_ROOT"
          git archive "$C13_SOURCE_COMMIT" research/candidate-13 \
            | tar -x -C "$C13_ROOT" --strip-components=2
          target="research/candidate-02/results/v153_qh_auction_leg/$GITHUB_SHA"
          rm -rf "$target"
          mkdir -p "$target"
          for interval in E01 E02 E03 E04 E05 E06; do
            src="artifacts/candidate02-v153-$interval"
            test -d "$src"
            mkdir -p "$target/$interval"
            cp -a "$src/." "$target/$interval/"
            test -s "$target/$interval/audit.json"
            test -s "$target/$interval/metrics.json"
            test -s "$target/$interval/v153_causal_audit.json"
          done
          python "$C13_ROOT/aggregate_v9_development.py" \
            --results "$target" \
            --protocol research/candidate-02/v153_protocol.json \
            --output "$target/artifacts-v153-family-decision.json"
          TARGET="$target" C13_SOURCE_COMMIT="$C13_SOURCE_COMMIT" python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import os

          root = Path(os.environ['TARGET'])
          path = root / 'artifacts-v153-family-decision.json'
          obj = json.loads(path.read_text(encoding='utf-8'))
          funnel = Counter()
          fail_closed = 0
          qh_plans = 0
          causal_pass = True
          for interval in ('E01', 'E02', 'E03', 'E04', 'E05', 'E06'):
              metrics = json.loads((root / interval / 'metrics.json').read_text(encoding='utf-8'))
              funnel.update(metrics.get('skip_reasons', {}))
              causal = json.loads((root / interval / 'v153_causal_audit.json').read_text(encoding='utf-8'))
              qh_plans += int(causal.get('qh_submitted_plans', 0))
              fail_closed += int(causal.get('protective_rejections_fail_closed', 0))
              causal_pass = causal_pass and causal.get('passed') is True
          classification = obj.get('classification', 'REJECT_OR_REDESIGN')
          advance = classification == 'ADVANCE_TO_BROADER_EXPOSED_SCREEN' and causal_pass
          obj.update({
              'engine': 'NautilusTrader 1.230.0',
              'custom_backtest_engine': False,
              'risk_fraction': 0.03,
              'global_pending_entry_plus_position_limit': 1,
              'arbitrary_notional_cap': None,
              'score_risk_multiplier': None,
              'lineage': {
                  'candidate13_source_commit': os.environ['C13_SOURCE_COMMIT'],
                  'candidate02_trigger_commit': os.environ.get('GITHUB_SHA'),
                  'alpha_change': 'quarter-hour initiative is context only; trade requires a separate completed follower auction leg',
                  'execution_change': 'fail-close a denied or rejected protective child after parent fill',
              },
              'qh_submitted_plans': qh_plans,
              'protective_rejections_fail_closed': fail_closed,
              'all_causal_audits_passed': causal_pass,
              'aggregated_state_funnel': dict(funnel.most_common()),
              'status': 'ADVANCE_TO_BROADER_EXPOSED_SCREEN' if advance else 'REJECT_OR_REDESIGN',
              'project_target_met': False,
              'next_action': (
                  'run the unchanged V153 source on a broader exposed screen before any untouched validation'
                  if advance
                  else 'diagnose the dominant state-transition or geometry failure before redesign; do not tune thresholds'
              ),
          })
          path.write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(obj, indent=2, sort_keys=True))
          PY

      - name: Commit compact evidence when branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          target="research/candidate-02/results/v153_qh_auction_leg/$GITHUB_SHA"
          git fetch origin research/candidate-02
          if [[ "$(git rev-parse origin/research/candidate-02)" != "$GITHUB_SHA" ]]; then
            echo "candidate-02 advanced during V153; evidence remains in this run artifact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research(candidate-02): record v153 auction-leg evidence"
          git push origin HEAD:research/candidate-02

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate02-v153-qh-auction-leg-${{ github.sha }}
          path: research/candidate-02/results/v153_qh_auction_leg/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
