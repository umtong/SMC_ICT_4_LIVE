name: candidate-05-v41-week3-generalization

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v39-positioning-reset.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v41-week3-generalization
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  frozen-week3:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v40_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v41-week3
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed environment and strategy contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v

      - name: Run the third preselected BTC week through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v40_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-09-06 \
            --build-end 2023-09-14 \
            --evaluation-start 2023-09-08 \
            --evaluation-end 2023-09-14 \
            --cache .cache/candidate-05-v41-week3 \
            --output "$ROOT" \
            2>&1 | tee "$ROOT-console.log"

      - name: Verify and print authoritative evidence
        if: always()
        shell: bash
        run: |
          if test -f "$ROOT/metrics.json"; then
            python -m json.tool "$ROOT/metrics.json"
            test -s "$ROOT/run.json"
            test -s "$ROOT/data_manifest.json"
            test -s "$ROOT/orders.csv"
            test -s "$ROOT/positions.csv"
            test -s "$ROOT/account.csv"
            test -s "$ROOT/equity.csv"
            test -s "$ROOT/scenario_events.jsonl"
            test -s "$ROOT/strategy_diagnostics.json"
          fi
          if test -f "$ROOT/errors.log"; then cat "$ROOT/errors.log"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v41-week3-${{ github.sha }}
          path: |
            artifacts/candidate-05-v41-week3/**
            artifacts/candidate-05-v41-week3-console.log
          if-no-files-found: warn
          retention-days: 90
