name: candidate-05-v43-weeks12-preservation

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v39-positioning-reset.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v43-weeks12-preservation
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  frozen-weeks12:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v40_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v43-weeks12
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed environment and strategy contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v

      - name: Run first and second frozen BTC weeks through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/week-1" "$ROOT/week-2"
          python research/candidate-05/v40_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-07-07 \
            --build-end 2023-07-15 \
            --evaluation-start 2023-07-09 \
            --evaluation-end 2023-07-15 \
            --cache .cache/candidate-05-v43-weeks12 \
            --output "$ROOT/week-1" \
            2>&1 | tee "$ROOT/week-1-console.log"
          python research/candidate-05/v40_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-01-13 \
            --build-end 2024-01-21 \
            --evaluation-start 2024-01-15 \
            --evaluation-end 2024-01-21 \
            --cache .cache/candidate-05-v43-weeks12 \
            --output "$ROOT/week-2" \
            2>&1 | tee "$ROOT/week-2-console.log"

      - name: Verify and print authoritative evidence
        if: always()
        shell: bash
        run: |
          for stage in "$ROOT"/week-*; do
            test -d "$stage" || continue
            if test -f "$stage/metrics.json"; then
              python -m json.tool "$stage/metrics.json"
              test -s "$stage/run.json"
              test -s "$stage/data_manifest.json"
              test -s "$stage/orders.csv"
              test -s "$stage/positions.csv"
              test -s "$stage/account.csv"
              test -s "$stage/equity.csv"
              test -s "$stage/scenario_events.jsonl"
              test -s "$stage/strategy_diagnostics.json"
            fi
            if test -f "$stage/errors.log"; then cat "$stage/errors.log"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v43-weeks12-${{ github.sha }}
          path: |
            artifacts/candidate-05-v43-weeks12/**
          if-no-files-found: warn
          retention-days: 90
