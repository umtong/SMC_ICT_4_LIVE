name: candidate-easychart-v2-nautilus-research

on:
  push:
    branches: ["research/candidate-easychart-v2"]
    paths:
      - "research/candidate-easychart-v2/**"
      - ".github/workflows/candidate-easychart-v2.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v2-nautilus-research
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  short-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-v2
      ROOT: artifacts/candidate-easychart-v2
    steps:
      - uses: actions/checkout@v4

      - name: Environment and causal domain tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v2
          python -m unittest discover -s research/candidate-easychart-v2/tests -p 'test_*.py' -v

      - name: Source-faithful four-symbol MTF short diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/mtf"
          exec > >(tee "$ROOT/run.log") 2>&1
          python research/candidate-easychart-v2/run_mtf_backtest.py \
            --start 2024-02-01 \
            --end 2024-02-14 \
            --warmup-days 30 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$ROOT/mtf"

      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v2-${{ github.sha }}
          path: artifacts/candidate-easychart-v2/**
          if-no-files-found: warn
          retention-days: 90
