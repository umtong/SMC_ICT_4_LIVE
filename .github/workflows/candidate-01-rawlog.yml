name: candidate-01-rawlog

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".diagnostics/candidate-01-run-v3"

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make liquidation-marker diagnostics type-safe
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-01/nautilus_backtest.py")
          source = path.read_text(encoding="utf-8")
          old = '        row_text = frame.astype(str).agg(" ".join, axis=1).str.upper()\n'
          new = (
              '        row_text = frame.apply(\n'
              '            lambda row: " ".join(str(value) for value in row.tolist()),\n'
              '            axis=1,\n'
              '        ).str.upper()\n'
          )
          if old not in source:
              raise SystemExit("expected liquidation-marker aggregation line was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/candidate-01/nautilus_backtest.py
          git commit -m "fix(candidate-01): make report marker scan type-safe"

      - name: Run exact frozen discovery week
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/candidate-01
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              python -m compileall -q src research/candidate-01 tests
              python -m unittest discover -s tests -p "test_candidate_01.py" -v
              set -o pipefail
              python research/candidate-01/run_research.py \
                --suite discovery \
                --output artifacts/candidate-01/discovery \
                2>&1 | tee artifacts/candidate-01/discovery.log
            '

      - name: Commit raw log and compact evidence
        if: always()
        run: |
          set -euo pipefail
          test -f artifacts/candidate-01/discovery.log
          mkdir -p research/candidate-01/evidence/discovery
          cp artifacts/candidate-01/discovery.log research/candidate-01/evidence/discovery/discovery.log
          if [ -f artifacts/candidate-01/discovery/aggregate_metrics.json ]; then
            cp artifacts/candidate-01/discovery/aggregate_metrics.json research/candidate-01/evidence/discovery/aggregate_metrics.json
          fi
          if [ -f artifacts/candidate-01/discovery/run.json ]; then
            cp artifacts/candidate-01/discovery/run.json research/candidate-01/evidence/discovery/suite_run.json
          fi
          if [ -d artifacts/candidate-01/discovery/discovery ]; then
            for file in metrics.json run.json data_manifest.json trade_plans.csv daily_nav.csv positions.csv orders.csv account.csv scenario_events.jsonl execution_events.jsonl; do
              if [ -f "artifacts/candidate-01/discovery/discovery/$file" ]; then
                cp "artifacts/candidate-01/discovery/discovery/$file" "research/candidate-01/evidence/discovery/$file"
              fi
            done
          fi
          git add -- research/candidate-01/evidence/discovery
          if ! git diff --cached --quiet; then
            git commit -m "research(candidate-01): record first executable discovery evidence"
          fi
          git push origin HEAD:research/candidate-01
