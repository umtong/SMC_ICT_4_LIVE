name: candidate-08-auction-router-nautilus-v3

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-auction-router-nautilus-v3"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-auction-router-nautilus-v3
  cancel-in-progress: true

jobs:
  staged-validation:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      MARKER: research/candidate-08/.run-auction-router-nautilus-v3
      ROOT: research/candidate-08/evidence/auction-router-nautilus-v1
      FIRST_OUTPUT: research/candidate-08/evidence/auction-router-nautilus-v1/first-v2
      SCREEN_OUTPUT: research/candidate-08/evidence/auction-router-nautilus-v1/screen-v1
      CACHE: /tmp/candidate-08-aggtrade-acceptance-data
      CONFIG: research/candidate-08/config_auction_router_nautilus_v1.json
      PATTERN: research/candidate-08/config_range_fvg.json
      AUCTION_ROUTER_FAMILY_MODE: both
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned environment and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m compileall -q \
            research/candidate-08/aggtrade_acceptance_funding.py \
            research/candidate-08/aggtrade_acceptance_mark_price.py \
            research/candidate-08/aggtrade_acceptance_signals.py \
            research/candidate-08/aggtrade_auction_router_signals.py \
            research/candidate-08/aggtrade_auction_router_signals_v2.py \
            research/candidate-08/aggtrade_acceptance_strategy.py \
            research/candidate-08/aggtrade_acceptance_evaluation.py \
            research/candidate-08/auction_family_ablation_decision.py \
            research/candidate-08/run_aggtrade_acceptance_nautilus.py \
            research/candidate-08/run_aggtrade_auction_router_nautilus.py \
            research/candidate-08/run_aggtrade_auction_router_nautilus_v2.py \
            research/candidate-08/test_aggtrade_auction_runner.py \
            research/candidate-08/test_aggtrade_auction_runner_v2.py \
            research/candidate-08/test_aggtrade_auction_router_v2.py \
            research/candidate-08/test_auction_family_ablation_decision.py
          python research/candidate-08/test_aggtrade_orderflow.py -v
          python research/candidate-08/test_aggtrade_acceptance.py -v
          python research/candidate-08/test_aggtrade_acceptance_pure.py -v
          python research/candidate-08/test_aggtrade_acceptance_nautilus.py -v
          python research/candidate-08/test_aggtrade_auction_router.py -v
          python research/candidate-08/test_aggtrade_auction_router_v2.py -v
          python research/candidate-08/test_aggtrade_auction_runner.py -v
          python research/candidate-08/test_aggtrade_auction_runner_v2.py -v
          python research/candidate-08/test_auction_family_ablation_decision.py -v
          python - <<'PY'
          from pathlib import Path

          detector = Path("research/candidate-08/aggtrade_auction_router_signals.py").read_text()
          refinement = Path("research/candidate-08/aggtrade_auction_router_signals_v2.py").read_text()
          wrapper = Path("research/candidate-08/run_aggtrade_auction_router_nautilus.py").read_text()
          v2_runner = Path("research/candidate-08/run_aggtrade_auction_router_nautilus_v2.py").read_text()
          selector = Path("research/candidate-08/auction_family_ablation_decision.py").read_text()
          workflow = Path(".github/workflows/candidate-08-auction-router-nautilus-v3.yml").read_text()
          config = Path("research/candidate-08/config_auction_router_nautilus_v1.json").read_text()

          assert "INITIATIVE_ACCEPTANCE_CONTINUATION" in detector
          assert "FAILED_AUCTION_REVERSAL" in detector
          assert "displacement_depth < reserve" in detector
          assert "require_contraction=False" in detector
          assert "FAILED_AUCTION_FULL_OBSERVED_SWEEP_THROUGH_CONFIRMATION_V2" in refinement
          assert "_observed_sweep_through_confirmation" in refinement
          assert "UPDATED_SWEEP_INSUFFICIENT_COST_AFTER_EXTERNAL_TARGET" in refinement
          assert "_normalize_intent_scenario_families" in wrapper
          assert 'summary["by_scenario_family"]' in wrapper
          assert "runner.build_auction_router_signals = build_auction_router_signals" in v2_runner
          assert "summary[\"implementation_revision\"] = IMPLEMENTATION_REVISION" in v2_runner
          assert "ONE_POSITIVE_AND_ONE_NEGATIVE_FAMILY" in selector
          assert "BOTH_FAMILIES_ECONOMICALLY_NEGATIVE" in selector
          assert 'AUCTION_ROUTER_FAMILY_MODE: both' in workflow
          assert 'runs-on: ubuntu-26.04' in workflow
          assert 'cancel-in-progress: true' in workflow
          assert 'rm -rf "$FIRST_OUTPUT"' in workflow
          assert 'rm -rf "$SCREEN_OUTPUT"' in workflow
          assert "Generalize scenario reporting" not in workflow
          assert '"risk_fraction": 0.03' in config
          assert '"default_leverage": 125' in config
          PY

      - name: Restore checksum-verified official-data cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE }}
          key: candidate-08-auction-router-v1-${{ hashFiles('research/candidate-08/config_auction_router_nautilus_v1.json') }}
          restore-keys: |
            candidate-08-auction-router-v1-
            candidate-08-aggtrade-acceptance-v5-
            candidate-08-aggtrade-acceptance-

      - name: Run fixed first NautilusTrader week
        id: first
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$FIRST_OUTPUT"
          mkdir -p "$FIRST_OUTPUT"
          cat > "$FIRST_OUTPUT/request.json" <<'JSON'
          {
            "suite": "first",
            "ablation": "none",
            "auction_family_mode": "both",
            "implementation_revision": "failed-auction-full-observed-sweep-v2",
            "output_name": "first-v2",
            "promotable": true,
            "scenario_contract": "auction-router-v1"
          }
          JSON
          set +e
          python research/candidate-08/run_aggtrade_auction_router_nautilus_v2.py \
            --suite first \
            --ablation none \
            --config "$CONFIG" \
            --pattern-config "$PATTERN" \
            --output "$FIRST_OUTPUT" \
            --data-cache "$CACHE" \
            2>&1 | tee "$FIRST_OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$FIRST_OUTPUT/runner_exit_status.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            printf 'passed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ["FIRST_OUTPUT"]) / "suite_metrics.json").read_text())
          print(f"passed={'true' if bool(summary.get('suite_gate_passed')) else 'false'}")
          PY

      - name: Run the two remaining fixed weeks only after first-week promotion
        id: screen
        if: ${{ steps.first.outputs.status == '0' && steps.first.outputs.passed == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$SCREEN_OUTPUT"
          mkdir -p "$SCREEN_OUTPUT"
          cat > "$SCREEN_OUTPUT/request.json" <<'JSON'
          {
            "suite": "screen",
            "ablation": "none",
            "auction_family_mode": "both",
            "implementation_revision": "failed-auction-full-observed-sweep-v2",
            "output_name": "screen-v1",
            "promotable": true,
            "scenario_contract": "auction-router-v1",
            "first_week_reused": "first-v2"
          }
          JSON
          set +e
          python research/candidate-08/run_aggtrade_auction_router_nautilus_v2.py \
            --suite screen \
            --ablation none \
            --config "$CONFIG" \
            --pattern-config "$PATTERN" \
            --output "$SCREEN_OUTPUT" \
            --data-cache "$CACHE" \
            --reuse-first-dir "$FIRST_OUTPUT" \
            2>&1 | tee "$SCREEN_OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$SCREEN_OUTPUT/runner_exit_status.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Select exactly one diagnostic family ablation
        id: ablation
        if: ${{ always() && steps.first.outputs.status == '0' }}
        shell: bash
        env:
          FIRST_PASSED: ${{ steps.first.outputs.passed }}
          SCREEN_STATUS: ${{ steps.screen.outputs.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from dataclasses import asdict
          import json
          import os
          from pathlib import Path

          from auction_family_ablation_decision import select_single_family_ablation

          root = Path(os.environ["ROOT"])
          first_path = Path(os.environ["FIRST_OUTPUT"]) / "suite_metrics.json"
          screen_path = Path(os.environ["SCREEN_OUTPUT"]) / "suite_metrics.json"
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          record_path = root / "ablation_decision.json"

          summary_path = None
          if os.environ.get("FIRST_PASSED") != "true" and first_path.exists():
              summary_path = first_path
          elif (
              os.environ.get("FIRST_PASSED") == "true"
              and os.environ.get("SCREEN_STATUS") == "0"
              and screen_path.exists()
          ):
              screen_summary = json.loads(screen_path.read_text(encoding="utf-8"))
              if not bool(screen_summary.get("suite_gate_passed")):
                  summary_path = screen_path

          if summary_path is None:
              payload = {
                  "selected": False,
                  "reason": "NO_VALID_FAILED_BASE_STAGE_FOR_ABLATION",
                  "suite": "",
                  "family_mode": None,
                  "retained_family": None,
                  "removed_family": None,
                  "base_summary_path": None,
              }
          else:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              decision = select_single_family_ablation(summary)
              payload = {
                  **asdict(decision),
                  "base_summary_path": str(summary_path),
              }

          if payload["selected"]:
              output = root / (
                  f"{payload['suite']}-ablation-{payload['family_mode']}-v1"
              )
          else:
              output = None
          payload["output"] = None if output is None else str(output)
          record_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with github_output.open("a", encoding="utf-8") as stream:
              stream.write(f"selected={'true' if payload['selected'] else 'false'}\n")
              stream.write(f"reason={payload['reason']}\n")
              stream.write(f"suite={payload['suite']}\n")
              stream.write(f"family_mode={payload['family_mode'] or ''}\n")
              stream.write(f"retained_family={payload['retained_family'] or ''}\n")
              stream.write(f"removed_family={payload['removed_family'] or ''}\n")
              stream.write(f"output={payload['output'] or ''}\n")
          PY

      - name: Run the selected diagnostic family ablation once
        id: ablation_run
        if: ${{ steps.ablation.outputs.selected == 'true' }}
        shell: bash
        env:
          SUITE: ${{ steps.ablation.outputs.suite }}
          FAMILY_MODE: ${{ steps.ablation.outputs.family_mode }}
          RETAINED_FAMILY: ${{ steps.ablation.outputs.retained_family }}
          REMOVED_FAMILY: ${{ steps.ablation.outputs.removed_family }}
          OUTPUT: ${{ steps.ablation.outputs.output }}
        run: |
          set -o pipefail
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "suite": os.environ["SUITE"],
              "ablation": "none",
              "auction_family_mode": os.environ["FAMILY_MODE"],
              "implementation_revision": "failed-auction-full-observed-sweep-v2",
              "diagnostic_only": True,
              "promotable": False,
              "retained_family": os.environ["RETAINED_FAMILY"],
              "removed_family": os.environ["REMOVED_FAMILY"],
          }
          (Path(os.environ["OUTPUT"]) / "request.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          AUCTION_ROUTER_FAMILY_MODE="$FAMILY_MODE" \
            python research/candidate-08/run_aggtrade_auction_router_nautilus_v2.py \
              --suite "$SUITE" \
              --ablation none \
              --config "$CONFIG" \
              --pattern-config "$PATTERN" \
              --output "$OUTPUT" \
              --data-cache "$CACHE" \
              2>&1 | tee "$OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUTPUT/runner_exit_status.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            printf 'economic_checks_passed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ["OUTPUT"]) / "suite_metrics.json").read_text())
          checks = dict(summary.get("suite_gate_checks", {}))
          excluded = {"base_contract_includes_both_auction_families"}
          economic = all(bool(value) for key, value in checks.items() if key not in excluded)
          print(f"economic_checks_passed={'true' if economic else 'false'}")
          PY

      - name: Record staged decision
        if: ${{ always() }}
        shell: bash
        env:
          FIRST_STATUS: ${{ steps.first.outputs.status }}
          FIRST_PASSED: ${{ steps.first.outputs.passed }}
          SCREEN_STATUS: ${{ steps.screen.outputs.status }}
          ABLATION_SELECTED: ${{ steps.ablation.outputs.selected }}
          ABLATION_REASON: ${{ steps.ablation.outputs.reason }}
          ABLATION_MODE: ${{ steps.ablation.outputs.family_mode }}
          ABLATION_OUTPUT: ${{ steps.ablation.outputs.output }}
          ABLATION_STATUS: ${{ steps.ablation_run.outputs.status }}
          ABLATION_ECONOMIC: ${{ steps.ablation_run.outputs.economic_checks_passed }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          first = root / "first-v2" / "suite_metrics.json"
          screen = root / "screen-v1" / "suite_metrics.json"
          ablation_output = os.environ.get("ABLATION_OUTPUT", "")
          ablation_summary = (
              Path(ablation_output) / "suite_metrics.json"
              if ablation_output
              else None
          )
          decision = {
              "candidate": "candidate-08-auction-router-nautilus-v1",
              "auction_family_mode": "both",
              "implementation_revision": "failed-auction-full-observed-sweep-v2",
              "first_runner_status": os.environ.get("FIRST_STATUS", ""),
              "first_gate_passed": os.environ.get("FIRST_PASSED", "false") == "true",
              "screen_runner_status": os.environ.get("SCREEN_STATUS", ""),
              "screen_executed": screen.exists(),
              "screen_gate_passed": False,
              "ablation_selected": os.environ.get("ABLATION_SELECTED", "false") == "true",
              "ablation_selection_reason": os.environ.get("ABLATION_REASON", ""),
              "ablation_family_mode": os.environ.get("ABLATION_MODE", ""),
              "ablation_runner_status": os.environ.get("ABLATION_STATUS", ""),
              "ablation_economic_checks_passed": (
                  os.environ.get("ABLATION_ECONOMIC", "false") == "true"
              ),
              "decision": "IMPLEMENTATION_FAILURE",
          }
          if first.exists():
              first_summary = json.loads(first.read_text())
              decision["first_summary"] = first_summary
              if not decision["first_gate_passed"]:
                  if decision["ablation_selected"]:
                      if decision["ablation_runner_status"] != "0":
                          decision["decision"] = "DIAGNOSTIC_ABLATION_IMPLEMENTATION_FAILURE"
                      elif decision["ablation_economic_checks_passed"]:
                          decision["decision"] = (
                              "FIRST_WEEK_ABLATION_SUPPORTS_NEW_SINGLE_FAMILY_BASE_REBUILD"
                          )
                      else:
                          decision["decision"] = "FIRST_WEEK_ABLATION_FAILED_DISCARD_ROUTER_V1"
                  else:
                      decision["decision"] = (
                          "FIRST_WEEK_LOGIC_FAILURE_NO_VALID_FAMILY_ABLATION_DISCARD_ROUTER_V1"
                      )
              elif screen.exists():
                  screen_summary = json.loads(screen.read_text())
                  decision["screen_summary"] = screen_summary
                  decision["screen_gate_passed"] = bool(screen_summary.get("suite_gate_passed"))
                  if decision["screen_gate_passed"]:
                      decision["decision"] = "PROMOTE_TO_PREDECLARED_LONG_EVALUATION"
                  elif decision["ablation_selected"]:
                      if decision["ablation_runner_status"] != "0":
                          decision["decision"] = "DIAGNOSTIC_ABLATION_IMPLEMENTATION_FAILURE"
                      elif decision["ablation_economic_checks_passed"]:
                          decision["decision"] = (
                              "THREE_WEEK_ABLATION_SUPPORTS_NEW_SINGLE_FAMILY_BASE_REBUILD"
                          )
                      else:
                          decision["decision"] = "THREE_WEEK_ABLATION_FAILED_DISCARD_ROUTER_V1"
                  else:
                      decision["decision"] = (
                          "THREE_WEEK_LOGIC_FAILURE_NO_VALID_FAMILY_ABLATION_DISCARD_ROUTER_V1"
                      )
              else:
                  decision["decision"] = "FIRST_WEEK_PASSED_BUT_SCREEN_IMPLEMENTATION_FAILED"
          if ablation_summary is not None and ablation_summary.exists():
              decision["ablation_summary"] = json.loads(ablation_summary.read_text())
          (root / "stage_decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save official-data cache
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE }}
          key: candidate-08-auction-router-v1-${{ hashFiles('research/candidate-08/config_auction_router_nautilus_v1.json') }}

      - name: Commit evidence conflict-safely
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER"
          git add -A -- "$ROOT" "$MARKER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: record source-stable auction-router evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce staged runner status
        if: ${{ always() }}
        shell: bash
        env:
          FIRST_STATUS: ${{ steps.first.outputs.status }}
          FIRST_PASSED: ${{ steps.first.outputs.passed }}
          SCREEN_STATUS: ${{ steps.screen.outputs.status }}
          ABLATION_SELECTED: ${{ steps.ablation.outputs.selected }}
          ABLATION_STATUS: ${{ steps.ablation_run.outputs.status }}
        run: |
          [[ -n "$FIRST_STATUS" ]]
          [[ "$FIRST_STATUS" == "0" ]]
          if [[ "$FIRST_PASSED" == "true" ]]; then
            [[ -n "$SCREEN_STATUS" ]]
            [[ "$SCREEN_STATUS" == "0" ]]
          fi
          if [[ "$ABLATION_SELECTED" == "true" ]]; then
            [[ -n "$ABLATION_STATUS" ]]
            [[ "$ABLATION_STATUS" == "0" ]]
          fi
