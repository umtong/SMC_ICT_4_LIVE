name: candidate-08-quarter-hour-sequence-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-qh-sequence-v2"

permissions:
  contents: write
  packages: read

jobs:
  probe:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fixed quarter-hour regime probe
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-08/qh_sequence_probe_v2.py
          rm -rf research/candidate-08/evidence/qh-sequence-v2
          mkdir -p research/candidate-08/evidence/qh-sequence-v2
          python research/candidate-08/qh_sequence_probe_v2.py \
            --output research/candidate-08/evidence/qh-sequence-v2 \
            --data-cache /tmp/candidate-08-qh-sequence-v2-data \
            2>&1 | tee research/candidate-08/evidence/qh-sequence-v2/runner.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("research/candidate-08/evidence/qh-sequence-v2/workflow.json").write_text(
              json.dumps({
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "head_sha": os.environ.get("GITHUB_SHA"),
                  "diagnostic_only": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm research/candidate-08/.run-qh-sequence-v2
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add \
            research/candidate-08/qh_sequence_probe_v2.py \
            research/candidate-08/evidence/qh-sequence-v2 \
            research/candidate-08/.run-qh-sequence-v2
          git -C "$GITHUB_WORKSPACE" commit -m "candidate-08: record quarter-hour regime sequence probe"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:research/candidate-08

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-08-qh-sequence-v2-${{ github.sha }}
          path: research/candidate-08/evidence/qh-sequence-v2
          retention-days: 30
