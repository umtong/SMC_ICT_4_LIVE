name: candidate-easychart-v10-funding-probe

on:
  push:
    branches: ["research/candidate-easychart-v10-funding"]
    paths:
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v10-funding-probe.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v10-funding-probe
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  funding-data-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-v10-funding
      ROOT: artifacts/candidate-easychart-v10-funding-probe
    steps:
      - uses: actions/checkout@v4

      - name: Environment and funding semantic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v

      - name: Checksum-verified live archive contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$ROOT/archive_probe.json"
          from datetime import date
          import json
          from pathlib import Path

          from funding_data_v10 import (
              FUNDING_PROVENANCE,
              align_preceding_marks,
              load_funding_observations,
              load_mark_observations,
          )

          cache = Path(".cache/candidate-easychart-v10-funding")
          funding = load_funding_observations(
              "BTCUSDT",
              date(2024, 2, 1),
              date(2024, 2, 3),
              cache,
          )
          marks = load_mark_observations(
              "BTCUSDT",
              date(2024, 2, 1),
              date(2024, 2, 3),
              cache,
          )
          pairs = align_preceding_marks(funding, marks)
          if not pairs:
              raise SystemExit("funding archive probe returned no settlements")
          output = {
              "symbol": "BTCUSDT",
              "funding_rows": len(funding),
              "mark_rows": len(marks),
              "aligned_rows": len(pairs),
              "first_funding_ns": pairs[0].funding.timestamp_ns,
              "first_interval_minutes": pairs[0].funding.interval_minutes,
              "first_rate": str(pairs[0].funding.rate),
              "first_mark_ns": pairs[0].mark.timestamp_ns,
              "first_mark": str(pairs[0].mark.value),
              "first_mark_age_ns": (
                  pairs[0].funding.timestamp_ns - pairs[0].mark.timestamp_ns
              ),
              "provenance": FUNDING_PROVENANCE,
          }
          print(json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v10-funding-probe-${{ github.sha }}
          path: artifacts/candidate-easychart-v10-funding-probe/**
          if-no-files-found: warn
          retention-days: 90
