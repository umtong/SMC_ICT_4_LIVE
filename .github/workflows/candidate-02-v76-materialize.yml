name: candidate-02-v76-materialize

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-v76/payload.part.*"
      - ".github/workflows/candidate-02-v76-materialize.yml"

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and materialize exact v76 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .candidate-02-v76/payload.part.* > /tmp/v76_payload.b64
          base64 -d /tmp/v76_payload.b64 > /tmp/v76_payload.tar.gz
          echo "6a678e476bbbcfc2e81aa0f663aa1e5e40dfbb0a76cf31ae52baa011954a2812  /tmp/v76_payload.tar.gz" | sha256sum -c -
          tar -tzf /tmp/v76_payload.tar.gz | tee /tmp/v76_members.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/v76_members.txt; then
            echo "unsafe archive member" >&2
            exit 1
          fi
          tar -xzf /tmp/v76_payload.tar.gz -C .
          python -m py_compile \
            research/candidate-02/v76_metaorder_wave_core.py \
            research/candidate-02/v76_nt_backtest.py \
            .candidate-02-v76/collect_revealed_klines.py
          for file in research/candidate-02/v76_*_config.json research/candidate-02/v76_metaorder_wave_family_lock.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Commit readable non-workflow v76 sources atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/candidate-02-v76-first.yml
          git rm .candidate-02-v76/payload.part.* .github/workflows/candidate-02-v76-materialize.yml
          git add \
            research/candidate-02/v76_metaorder_wave_core.py \
            research/candidate-02/v76_nt_backtest.py \
            research/candidate-02/v76_15m_1x_config.json \
            research/candidate-02/v76_30m_1x_config.json \
            research/candidate-02/v76_30m_1p25_config.json \
            research/candidate-02/v76_60m_1x_config.json \
            research/candidate-02/v76_metaorder_wave_family_lock.json \
            .candidate-02-v76/collect_revealed_klines.py
          git commit -m "research(candidate-02): materialize exact v76 metaorder wave"
          git push origin HEAD:research/candidate-02
