name: ml1-fix-funding-reserve

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-fix-funding-reserve.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0

      - name: Remove the fictitious funding debit from every trade
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-easychart-v3/mtf_strategy.py")
          text = path.read_text(encoding="utf-8")
          old = "    estimated_funding_rate: float = 0.00010\n"
          new = "    estimated_funding_rate: float = 0.0\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one funding default, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile research/candidate-easychart-v3/mtf_strategy.py

      - name: Commit the correction
        run: |
          git config user.name "umtong"
          git config user.email "dddgjj03@gmail.com"
          git add research/candidate-easychart-v3/mtf_strategy.py
          git diff --cached --check
          git commit -m "fix(ml1): charge funding only when it actually occurs"
          git push origin HEAD:research_ML1
