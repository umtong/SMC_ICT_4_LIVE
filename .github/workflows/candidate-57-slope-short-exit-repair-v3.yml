name: candidate-57-slope-short-exit-repair-v3

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-slope-short-exit-repair-v3.yml"
      - "research/candidate-57/SLOPE_SHORT_EXIT_REPAIR_V3_FREEZE.md"
      - "research/candidate-57/router_slope_is_dope_1h.py"
      - "research/candidate-57/router_slope_is_dope_runtime.py"
      - "research/candidate-57/strategy_slope_is_dope_1h.py"
      - "research/candidate-57/strategy_slope_short_exit_repair_v3.py"
      - "research/candidate-57/slope_is_dope_1h_source_campaign.py"
      - "research/candidate-57/slope_short_exit_repair_v3_campaign.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-57/evidence/slope-is-dope-1h-roi-fix-v2/cases/**"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-slope-short-exit-repair-v3
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble repaired short exit on reused source execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/SLOPE_SHORT_EXIT_REPAIR_V3_FREEZE.md
          test -f research/candidate-57/evidence/slope-is-dope-1h-roi-fix-v2/cases/development-claim_level_short.json
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_slope_is_dope_1h.py research/candidate-51/router_slope_is_dope_impl.py
          cp research/candidate-57/router_slope_is_dope_runtime.py research/candidate-51/router.py
          cp research/candidate-57/strategy_slope_is_dope_1h.py research/candidate-51/strategy_slope_base.py
          cp research/candidate-57/strategy_slope_short_exit_repair_v3.py research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_slope_is_dope_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-51/strategy_slope_base.py \
            research/candidate-57/slope_is_dope_1h_source_campaign.py \
            research/candidate-57/slope_short_exit_repair_v3_campaign.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove isolated repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_slope_base import Candidate35Strategy as SourceBase

          assert issubclass(Candidate35Strategy, SourceBase)
          assert "slope_short_exit_mode" in set(Candidate35Config.__struct_fields__)
          source = inspect.getsource(Candidate35Strategy._source_exit_signal)
          assert "prior_high_short" in source
          assert "close > prior_high_short" in source
          assert "return super()._source_exit_signal()" in source
          assert "prior_low_short" not in source
          assert Candidate35Strategy._manage_open_position is SourceBase._manage_open_position
          print("short-exit-only structural repair verified")
          PY

      - name: Run structural comparison with trade ledgers
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-slope-short-exit-repair-v3-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/slope_short_exit_repair_v3_campaign.py \
            2>&1 | tee .work/candidate-57-slope-short-exit-repair-v3-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact structural evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_slope_is_dope_impl.py \
            research/candidate-51/strategy_slope_base.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/slope-short-exit-repair-v3
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist Slope short-exit repair evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete structural artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-slope-short-exit-repair-v3
          path: |
            research/candidate-57/evidence/slope-short-exit-repair-v3
            .work/candidate-57-slope-short-exit-repair-v3-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "Slope short-exit repair failed mechanically; status=$status"
            exit "${status:-1}"
          fi
