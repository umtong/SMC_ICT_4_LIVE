name: candidate-05-v55-event-diagnostic

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v55-event-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v55-event-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v55_event_diag_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v55-event-diagnostic
      CACHE: .cache/candidate-05-v55-event-diagnostic

    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and diagnostic isolation
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v55_spot_led_contract.py' -v

      - name: Replay the failed untouched v55 path without changing decisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v55_event_diag_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-05-30 \
            --build-end 2024-07-30 \
            --evaluation-start 2024-06-01 \
            --evaluation-end 2024-07-30 \
            --cache "$CACHE" \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Classify duplicate event and recover branch result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          duplicates = json.loads((root / "event_duplicate_diagnostics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())

          def number(value):
              if value is None:
                  return None
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          records = [
              item for item in closed
              if item.get("branch") == "SPOT_LED_PRICE_DISCOVERY_PULLBACK"
          ]
          pnls = [number(item.get("realized_pnl")) for item in records]
          pnls = [value for value in pnls if value is not None and math.isfinite(value)]
          result = {
              "schema": "candidate-05-v55-event-diagnostic-v1",
              "exact_duplicate_count": len(duplicates),
              "duplicate_events": duplicates,
              "strategy_diagnostic_count": diagnostics.get(
                  "exact_duplicate_research_events_suppressed",
                  0,
              ),
              "candidate_metrics": metrics,
              "incremental_branch": {
                  "trades": len(pnls),
                  "wins": sum(value > 0.0 for value in pnls),
                  "losses": sum(value < 0.0 for value in pnls),
                  "net_pnl_usdt": sum(pnls),
                  "pnls_usdt": pnls,
                  "contexts": diagnostics.get("spot_led_contexts", 0),
                  "acceptances": diagnostics.get("spot_led_context_acceptances", 0),
                  "first_pullbacks": diagnostics.get("spot_led_context_first_pullbacks", 0),
                  "submissions": diagnostics.get("spot_led_pullback_submissions", 0),
              },
          }
          (root / "event_diagnostic_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/metrics.json"
          python -m json.tool "$ROOT/event_duplicate_diagnostics.json"
          python -m json.tool "$ROOT/event_diagnostic_decision.json"
          for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
            test -s "$ROOT/$file"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v55-event-diagnostic-${{ github.sha }}
          path: artifacts/candidate-05-v55-event-diagnostic/**
          if-no-files-found: warn
          retention-days: 90
