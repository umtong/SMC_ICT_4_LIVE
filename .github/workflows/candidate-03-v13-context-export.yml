name: candidate-03-v13-context-export

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-v13-context-export.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore immutable first-week inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Restore immutable second-week inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          key: nt-lvcfr-aggtrade-v1-btc-2025-06-23-${{ hashFiles('research/candidate-03/nt_lvcfr_trade_proxy.py', 'research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_v3_config.json') }}
          fail-on-cache-miss: true

      - name: Package causal state research inputs
        shell: bash
        run: |
          set -euo pipefail
          p1=artifacts/candidate-03/nt-lvcfr-v3/validation-1/prepared
          p2=artifacts/candidate-03/nt-lvcfr-v3/validation-2/prepared
          tar -czf candidate-03-v13-context.tar.gz \
            "$p1/raw/futures_kline" "$p1/raw/spot_kline" "$p1/raw/open_interest" \
            "$p1/signals.json" "$p1/data_manifest.json" \
            "$p2/raw/futures_kline" "$p2/raw/spot_kline" "$p2/raw/open_interest" \
            "$p2/signals.json" "$p2/data_manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-03-v13-context-${{ github.sha }}
          path: candidate-03-v13-context.tar.gz
          if-no-files-found: error
          retention-days: 3
