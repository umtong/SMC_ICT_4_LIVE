name: candidate-51-pasindu-supertrend-v24

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-pasindu-supertrend-v24.yml"
      - "research/candidate-51/router_pasindu_supertrend.py"
      - "research/candidate-51/router_pasindu_supertrend_diagnostic.py"
      - "research/candidate-51/strategy_pasindu_supertrend.py"
      - "research/candidate-51/launch_kline_only_warmup.py"
      - "research/candidate-51/kline_only_inputs.py"
      - "research/candidate-51/event_lifecycle_patch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-51-pasindu-supertrend-v24
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1

      - name: Materialize live-effective policy with refusal diagnostics
        run: |
          cp research/candidate-51/router_pasindu_supertrend_diagnostic.py research/candidate-51/router.py
          cp research/candidate-51/strategy_pasindu_supertrend.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and verify independent source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from router import (
              IndicatorState,
              RouteConfig,
              _confidence,
              _recent_flip,
              _regime_scores,
              _supertrend,
          )
          from router_pasindu_supertrend import BarObservation
          from strategy import _completed_bucket

          HOUR = 3_600_000_000_000
          MINUTE = 60_000_000_000
          config = RouteConfig()
          assert config.pasindu_supertrend_period == 8
          assert config.pasindu_supertrend_multiplier == 2.0
          assert config.pasindu_adx_min == 18.0
          assert config.pasindu_confidence_min == 45.0
          assert config.pasindu_continuation_lookback_1h == 8

          # The actual live-effective indicator must change direction on at
          # least one finite, predeclared reversal path.
          changed = False
          for shock in (0.03, 0.05, 0.08, 0.12, 0.18, 0.25):
              bars = []
              close = 100.0
              for index, change in enumerate([0.002] * 120 + [-shock] * 3):
                  opened = close
                  close = max(0.01, opened * (1.0 + change))
                  pad = max(opened, close) * 0.001
                  bars.append(BarObservation(
                      ts_event=(index + 1) * 4 * HOUR - 1,
                      open=opened,
                      high=max(opened, close) + pad,
                      low=min(opened, close) - pad,
                      close=close,
                      volume=1.0,
                  ))
              _, directions = _supertrend(bars, 8, 2.0)
              clean = [int(value) for value in directions if math.isfinite(value)]
              if any(a != b for a, b in zip(clean, clean[1:])):
                  changed = True
                  break
          assert changed, "live-effective Supertrend8x2 never changed direction"

          # The direct and continuation confidence formulae are tested from a
          # source-shaped state rather than requiring an arbitrary synthetic
          # path to also win the separate regime classifier.
          state = IndicatorState(
              ts_event=1,
              close=100.0,
              atr=2.0,
              adx=30.0,
              ema9=101.0,
              ema21=99.0,
              rsi=50.0,
              supertrend=96.0,
              direction=1,
              bb_width_ratio=1.0,
              atr_ratio=1.0,
              volume_ratio=1.0,
              hurst=0.65,
              regime="trending",
              regime_confidence=80.0,
          )
          direct_confidence = _confidence(state, 1, False)
          continuation_confidence = _confidence(state, 1, True)
          assert direct_confidence >= 45.0
          assert continuation_confidence >= 45.0

          recent = _recent_flip([-1.0, -1.0, 1.0, 1.0], 1, 8)
          assert recent is not None and recent[0] <= 8
          assert _recent_flip([-1.0] * 9, 1, 8) is None

          trending_scores = _regime_scores(30.0, 1.0, 1.0, 1.0, 0.65)
          quiet_scores = _regime_scores(10.0, 0.4, 0.4, 0.4, 0.45)
          assert max(trending_scores, key=trending_scores.get) == "trending"
          assert max(quiet_scores, key=quiet_scores.get) == "quiet"

          entry = 100.0
          stop = entry - 3.0 * state.atr
          target = entry + 6.0 * state.atr
          assert 0.0 < stop < entry < target
          assert abs((target - entry) / (entry - stop) - 2.0) < 1e-12

          minute_bars = []
          for index in range(240):
              opened = 100.0 + index * 0.001
              minute_bars.append(BarObservation(
                  ts_event=(index + 1) * MINUTE - 1,
                  open=opened,
                  high=opened + 0.01,
                  low=opened - 0.01,
                  close=opened + 0.002,
                  volume=2.0,
              ))
          four_hour = _completed_bucket(minute_bars, 240)
          assert four_hour is not None
          assert four_hour.open == minute_bars[0].open
          assert four_hour.close == minute_bars[-1].close
          assert four_hour.volume == 480.0
          print({
              "live_indicator": "ATR8x2",
              "direction_change_reachable": True,
              "direct_confidence": direct_confidence,
              "continuation_confidence": continuation_confidence,
              "recent_flip_contract": True,
              "regime_contract": True,
              "bracket_r": 2.0,
              "cached_4h_aggregation_exact": True,
          })
          PY

      - name: Freeze source-defined policies
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              base["strategy"].pop(key, None)
          frozen = {
              "feature_max_age_seconds": 65.0,
              "cooldown_minutes": 0,
              "max_hold_minutes": 525600,
              "funding_flatten_minute": 60,
              "funding_blackout_before_minutes": -1,
              "funding_blackout_after_minutes": -1,
              "pasindu_supertrend_period": 8,
              "pasindu_supertrend_multiplier": 2.0,
              "pasindu_adx_period": 14,
              "pasindu_adx_min": 18.0,
              "pasindu_confidence_min": 45.0,
              "pasindu_established_4h_bars": 3,
              "pasindu_continuation_lookback_1h": 8,
              "pasindu_trail_activate_atr": 2.0,
              "pasindu_trail_distance_atr": 2.5,
          }
          work = Path(".work/candidate-51-pasindu-v24")
          work.mkdir(parents=True, exist_ok=True)
          for mode in ("flip_only", "reduced_live"):
              config = json.loads(json.dumps(base))
              config["strategy"].update(frozen)
              config["strategy"]["pasindu_mode"] = mode
              (work / f"{mode}.json").write_text(
                  json.dumps(config, indent=2, sort_keys=True) + "\n"
              )
          manifest = {
              "family": "pasindu_live_effective_supertrend8x2",
              "external_source": "PasinduUpendra/Binance-Futures-Trading",
              "external_performance_used_as_evidence": False,
              "source_ambiguity_resolution": {
                  "unused_class_description": "ATR10x3",
                  "actual_orchestrator_wiring": "ATR8x2",
              },
              "development": {
                  "data_start": "2024-12-01",
                  "evaluation_start": "2025-01-01",
                  "evaluation_end": "2025-03-31",
              },
              "policies": {
                  "flip_only": "direct completed 4H flip",
                  "reduced_live": "direct 4H flip then active 1H continuation",
              },
              "engine": "NautilusTrader BacktestNode",
              "continuous_warmup": True,
              "risk_fraction": 0.03,
              "global_position_limit": 1,
              "actual_fill_contract": "actual-fill-v1",
              "router_sha256": hashlib.sha256(
                  Path("research/candidate-51/router.py").read_bytes()
              ).hexdigest(),
              "strategy_sha256": hashlib.sha256(
                  Path("research/candidate-51/strategy.py").read_bytes()
              ).hexdigest(),
              "frozen_parameters": frozen,
          }
          (work / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Run independent ninety-day development accounts
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-51-pasindu-v24/status
          for mode in flip_only reduced_live; do
            PYTHONPATH=research/candidate-51 uv run python \
              research/candidate-51/launch_kline_only_warmup.py \
              --config ".work/candidate-51-pasindu-v24/${mode}.json" \
              --data-start 2024-12-01 \
              --start 2025-01-01 --end 2025-03-31 \
              --cache .cache/candidate-51-pasindu-v24 \
              --output "artifacts/candidate-51/pasindu-v24-${mode}-development" \
              --workspace ".work/candidate-51-pasindu-v24-${mode}-development"
            echo $? > ".work/candidate-51-pasindu-v24/status/${mode}.txt"
          done
          exit 0

      - name: Write implementation versus logic development verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def pnl(text):
              match = re.search(r"[-+]?\d+(?:\.\d+)?", str(text).replace("_", "").replace(",", ""))
              return float(match.group()) if match else 0.0

          rows = {}
          for mode in ("flip_only", "reduced_live"):
              root = Path(
                  f"artifacts/candidate-51/pasindu-v24-{mode}-development"
              )
              mp = root / "metrics.json"
              dp = root / "strategy_diagnostics.json"
              cp = root / "closed_scenarios.json"
              if not mp.is_file() or not dp.is_file() or not cp.is_file():
                  rows[mode] = {
                      "classification": "IMPLEMENTATION_BLOCKED",
                      "produced": False,
                  }
                  continue
              metrics = json.loads(mp.read_text())
              diagnostics = json.loads(dp.read_text())
              scenarios = json.loads(cp.read_text())
              valid = [
                  item for item in scenarios
                  if bool(item.get("actual_fill_risk_valid"))
              ]
              pnls = [pnl(item.get("realized_pnl")) for item in valid]
              gp = sum(value for value in pnls if value > 0.0)
              gl = -sum(value for value in pnls if value < 0.0)
              warm = diagnostics.get("pasindu_four_hour_bars_by_symbol", {})
              warm_ready = bool(warm) and min(int(value) for value in warm.values()) >= 105
              trades = int(metrics.get("trades") or 0)
              positive = (
                  warm_ready
                  and trades >= 20
                  and float(metrics.get("expectancy_usdt") or 0.0) > 0.0
                  and float(metrics.get("geometric_daily_growth") or 0.0) > 0.0
                  and float(metrics.get("max_drawdown") or 1.0) <= 0.25
                  and sum(pnls) > 0.0
                  and int(diagnostics.get("global_position_violations") or 0) == 0
                  and int(diagnostics.get("max_open_positions_observed") or 0) <= 1
              )
              if not warm_ready:
                  classification = "IMPLEMENTATION_WARMUP_INCOMPLETE"
              elif trades == 0:
                  classification = "LOGIC_OPPORTUNITY_FAILURE"
              elif positive:
                  classification = "PROVISIONAL_ALPHA"
              else:
                  classification = "LOGIC_FAILURE"
              rows[mode] = {
                  "classification": classification,
                  "produced": True,
                  "metrics": metrics,
                  "valid_fill_only": {
                      "trades": len(pnls),
                      "wins": sum(value > 0.0 for value in pnls),
                      "losses": sum(value < 0.0 for value in pnls),
                      "sum_realized_pnl_usdt": sum(pnls),
                      "expectancy_usdt": sum(pnls) / len(pnls) if pnls else 0.0,
                      "profit_factor": gp / gl if gl > 0.0 else (None if gp > 0.0 else 0.0),
                  },
                  "diagnostics": {
                      key: diagnostics.get(key)
                      for key in (
                          "pasindu_hourly_decisions",
                          "pasindu_source_candidates",
                          "pasindu_used_episode_rejections",
                          "pasindu_management_exits",
                          "unresolved_reason_counts",
                          "actionable_family_counts",
                          "selected_symbols",
                          "order_rejections",
                          "global_position_violations",
                          "max_open_positions_observed",
                          "fill_invalidations",
                          "fill_beyond_bracket_invalidations",
                          "fill_risk_budget_invalidations",
                          "pasindu_hour_bars_by_symbol",
                          "pasindu_four_hour_bars_by_symbol",
                      )
                  },
              }
          result = {
              "family": "pasindu_live_effective_supertrend8x2",
              "external_performance_used_as_evidence": False,
              "rows": rows,
              "survivors": [
                  mode for mode, row in rows.items()
                  if row.get("classification") == "PROVISIONAL_ALPHA"
              ],
          }
          output = Path(
              "artifacts/candidate-51/pasindu-v24-development-verdict.json"
          )
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-51-pasindu-supertrend-v24
          path: |
            artifacts/candidate-51/pasindu-v24-*/metrics.json
            artifacts/candidate-51/pasindu-v24-*/strategy_diagnostics.json
            artifacts/candidate-51/pasindu-v24-*/positions.csv
            artifacts/candidate-51/pasindu-v24-*/closed_scenarios.json
            artifacts/candidate-51/pasindu-v24-*/events.jsonl
            artifacts/candidate-51/pasindu-v24-*/data_manifest.json
            artifacts/candidate-51/pasindu-v24-*.json
            .work/candidate-51-pasindu-v24/*.json
            .work/candidate-51-pasindu-v24/status/*.txt
          if-no-files-found: warn
          retention-days: 90
