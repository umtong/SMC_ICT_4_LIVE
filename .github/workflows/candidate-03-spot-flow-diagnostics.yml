name: candidate-03-spot-flow-diagnostics

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-spot-flow-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-spot-flow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dev1
            start: 2022-03-06
          - label: dev2
            start: 2025-03-16
          - label: val1
            start: 2022-07-17
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Binance spot aggregate trades
        shell: bash
        run: |
          set -euo pipefail
          out=".research-data/candidate-03/spot/${{ matrix.label }}"
          mkdir -p "$out"
          for offset in $(seq 0 7); do
            day=$(date -u -d "${{ matrix.start }} +${offset} day" +%F)
            file="BTCUSDT-aggTrades-${day}.zip"
            base="https://data.binance.vision/data/spot/daily/aggTrades/BTCUSDT"
            curl --fail --location --retry 5 --retry-all-errors \
              "$base/$file" --output "$out/$file"
            curl --fail --location --retry 5 --retry-all-errors \
              "$base/$file.CHECKSUM" --output "$out/$file.CHECKSUM"
            (cd "$out" && sha256sum --check "$file.CHECKSUM")
          done
      - name: Preserve checksum-verified spot events
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-spot-${{ matrix.label }}-${{ github.sha }}
          path: .research-data/candidate-03/spot/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 3
