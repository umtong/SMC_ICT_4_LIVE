name: candidate-51-squeeze-clock-v56-aggregate-final

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-squeeze-clock-v56-aggregate-final.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1
          sparse-checkout: |
            research/candidate-51
            pyproject.toml
            uv.lock
            src
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31412120225
          pattern: candidate-51-squeeze-clock-v56-*
          path: downloaded
      - name: Aggregate paired clock evidence
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded -name result.json -type f | wc -l | tr -d ' ')"
          test "$count" -ge 51
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          output=artifacts/candidate-51/squeeze-clock-v56
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/squeeze_clock_anatomy.py aggregate \
            --results-root downloaded --output "$output"
          python - "$output" "$count" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); count = int(sys.argv[2])
          payload = json.loads((root / "ANATOMY.json").read_text())
          payload.update(source_shards_expected=52, source_shards_recovered=count, source_shard_completeness=count/52)
          (root / "ANATOMY.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          with (root / "ANATOMY.md").open("a") as handle:
              handle.write(f"\n- recovered source shards: {count}/52.\n")
          PY
          test -s "$output/ANATOMY.json"
          test -s "$output/ANATOMY.md"
          test -s "$output/SUMMARY.csv"
          test -s "$output/EVENTS.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-squeeze-clock-v56-anatomy-final
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/squeeze-clock-v56/ANATOMY.json
            artifacts/candidate-51/squeeze-clock-v56/ANATOMY.md
            artifacts/candidate-51/squeeze-clock-v56/SUMMARY.csv
            artifacts/candidate-51/squeeze-clock-v56/EVENTS.csv
      - name: Commit compact causal clock evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/squeeze-clock-v56
          destination=research/candidate-51/evidence/squeeze-clock-v56
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/SUMMARY.csv" "$destination/SUMMARY.csv"
          cp "$source/EVENTS.csv" "$destination/EVENTS.csv"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add "$destination"
          git commit -m "candidate51: record squeeze causal clock anatomy"
          git fetch origin research/candidate-51 --depth=1
          git rebase FETCH_HEAD
          git push origin HEAD:research/candidate-51
