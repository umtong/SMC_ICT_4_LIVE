name: Candidate 15 source snapshot

on:
  push:
    branches: [research/candidate-15]
    paths:
      - ".github/workflows/candidate-15-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Package research source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf candidate15-source.tgz \
            research/candidate-15 \
            research/candidate-14 \
            src \
            .github/workflows/candidate-15.yml \
            pyproject.toml \
            AGENTS.md \
            PROJECT_PRINCIPLES.md
      - uses: actions/upload-artifact@v4
        with:
          name: candidate15-source-${{ github.sha }}
          path: candidate15-source.tgz
          if-no-files-found: error
          retention-days: 1
