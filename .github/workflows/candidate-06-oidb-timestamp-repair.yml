name: Candidate 06 OIDB Causal Metrics Timestamp Repair

on:
  push:
    branches: [research/candidate-06]
    paths:
      - ".github/workflows/candidate-06-oidb-timestamp-repair.yml"
      - "research/candidate-06/repair_oidb_metric_timestamps.py"
      - "research/candidate-06/test_futures_metrics_timestamp_contract.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  repair-and-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Apply narrow entry-ledger and timestamp repairs
        run: |
          set -euo pipefail
          python research/candidate-06/repair_oidb_entry_namespace.py
          git checkout -- .github/workflows/candidate-06-oidb.yml
          python research/candidate-06/repair_oidb_metric_timestamps.py

      - name: Verify unchanged scenario and repaired data contracts
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_futures_metrics_data.py
          python research/candidate-06/test_futures_metrics_timestamp_contract.py
          python research/candidate-06/test_open_interest_deleveraging_engine.py
          python research/candidate-06/test_oidb_entry_namespace.py
          python research/candidate-06/test_oidb_runner_contract.py
          python research/candidate-06/test_signal_submission_timing_contract.py

      - name: Rerun identical OIDB matrix through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/oidb-first-week
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_open_interest_deleveraging_matrix.py \
            --output artifacts/candidate-06/oidb-first-week \
            > artifacts/candidate-06-oidb-timestamp-repair.stdout \
            2> artifacts/candidate-06-oidb-timestamp-repair.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/candidate-06/oidb-first-week
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > artifacts/candidate-06/oidb-first-week/workflow_exit_code.txt
          cp artifacts/candidate-06-oidb-timestamp-repair.stdout artifacts/candidate-06/oidb-first-week/workflow_stdout.txt 2>/dev/null || true
          cp artifacts/candidate-06-oidb-timestamp-repair.stderr artifacts/candidate-06/oidb-first-week/workflow_stderr.txt 2>/dev/null || true
          if [ ! -f artifacts/candidate-06/oidb-first-week/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-06/oidb-first-week")
          payload = {
              "all_three_weeks_passed": False,
              "long_evaluation_authorized": False,
              "selected": None,
              "terminal_status": "IMPLEMENTATION_OR_DATA_FAILURE_BEFORE_SUMMARY",
          }
          (root / "summary.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
          if [ "$code" -ne 0 ]; then
            echo "--- OIDB TIMESTAMP REPAIR STDERR ---"
            tail -n 240 artifacts/candidate-06-oidb-timestamp-repair.stderr || true
            echo "--- OIDB TERMINAL SUMMARY ---"
            cat artifacts/candidate-06/oidb-first-week/summary.json || true
          fi

      - name: Commit repaired source and reproducible evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add \
            research/candidate-06/futures_metrics_data.py \
            research/candidate-06/open_interest_deleveraging_engine.py \
            research/candidate-06/test_futures_metrics_timestamp_contract.py \
            research/candidate-06/test_oidb_entry_namespace.py
          git add -f artifacts/candidate-06/oidb-first-week
          if [ -f research/candidate-06/config.oidb.locked.json ]; then
            git add -f research/candidate-06/config.oidb.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 OIDB causal-timestamp evidence [candidate-06 evidence]"
          git pull --rebase origin research/candidate-06
          git push origin HEAD:research/candidate-06

      - name: Upload repaired OIDB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-oidb-timestamp-repair-${{ github.sha }}
          path: artifacts/candidate-06/oidb-first-week
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce staged decision
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
