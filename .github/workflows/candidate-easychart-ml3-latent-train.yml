name: candidate-easychart-ml3-latent-train

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/candidate-easychart-ml3-latent-train.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  locate-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish latent training locator
        run: |
          set -euo pipefail
          mkdir -p research/_run_locators
          printf '%s\n' '${{ github.run_id }}' > research/_run_locators/ML3_LATENT_TRAIN_RUN_ID
          printf '%s\n' '${{ github.sha }}' > research/_run_locators/ML3_LATENT_TRAIN_RUN_SHA
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_run_locators/ML3_LATENT_TRAIN_RUN_ID research/_run_locators/ML3_LATENT_TRAIN_RUN_SHA
          git commit -m "chore(research): publish latent training locator [skip ci]"
          git push origin HEAD:research_ML3

  train-and-exercise:
    if: github.actor != 'github-actions[bot]'
    needs: locate-run
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_ml3_breakthrough:research/candidate-easychart_ml3v3:research/candidate-easychart_ml3v2:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      ROOT_OUT: artifacts/candidate-easychart-ml3-latent-training
      CACHE: .cache/candidate-easychart-ml3-latent-training
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for and download latent market-period evidence
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/periods" "$CACHE"
          git fetch origin research_ML3
          for attempt in $(seq 1 90); do
            if git show origin/research_ML3:research/_run_locators/ML3_LATENT_PERIODS_RUN_ID > /tmp/period_run_id 2>/dev/null; then
              break
            fi
            sleep 10
            git fetch origin research_ML3
          done
          test -s /tmp/period_run_id
          RUN_ID=$(tr -d '[:space:]' < /tmp/period_run_id)
          echo "$RUN_ID" > "$ROOT_OUT/period_run_id.txt"
          for attempt in $(seq 1 160); do
            STATUS=$(python - "$RUN_ID" <<'PY'
          import json, os, sys, urllib.request
          request=urllib.request.Request(
              f"https://api.github.com/repos/umtong/SMC_ICT_4_LIVE/actions/runs/{sys.argv[1]}",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(request) as response:
              record=json.load(response)
          print(record.get("status","unknown"), record.get("conclusion"))
          PY
            )
            echo "latent period workflow $STATUS"
            case "$STATUS" in
              completed\ success) break ;;
              completed\ *) echo "latent period workflow failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          python - "$RUN_ID" "$ROOT_OUT/periods" <<'PY'
          import io, json, os, pathlib, sys, urllib.request, zipfile
          run_id=sys.argv[1]
          destination=pathlib.Path(sys.argv[2])
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"}
          request=urllib.request.Request(
              f"https://api.github.com/repos/umtong/SMC_ICT_4_LIVE/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              artifacts=json.load(response).get("artifacts",[])
          selected=[item for item in artifacts if item.get("name","").startswith("ml3-latent-period-")]
          if len(selected) < 8:
              raise SystemExit(f"only {len(selected)} latent period artifacts were found")
          for item in selected:
              request=urllib.request.Request(item["archive_download_url"],headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload=response.read()
              target=destination/item["name"]
              target.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  archive.extractall(target)
          PY

      - name: Train latent period ensemble
        run: |
          set -euo pipefail
          mkdir -p "$ROOT_OUT/model"
          mapfile -t DATASETS < <(find "$ROOT_OUT/periods" -type f -name latent_dataset.csv | sort)
          if [ "${#DATASETS[@]}" -lt 8 ]; then
            echo "too few latent datasets: ${#DATASETS[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${DATASETS[@]}" > "$ROOT_OUT/model/datasets.txt"
          python research/candidate-easychart_ml3_breakthrough/train_latent_ensemble.py \
            --datasets "${DATASETS[@]}" \
            --output "$ROOT_OUT/model/latent_ensemble.json" \
            --summary "$ROOT_OUT/model/latent_training_summary.json" \
            --members 5 \
            --risk-fraction 0.03 \
            --probability-quantile 0.25 \
            2>&1 | tee "$ROOT_OUT/model/train.log"
          test -s "$ROOT_OUT/model/latent_ensemble.json"
          test -s "$ROOT_OUT/model/latent_training_summary.json"

      - name: Exercise separated latent account windows
        run: |
          set -euo pipefail
          MODEL="$ROOT_OUT/model/latent_ensemble.json"
          run_window() {
            local name="$1" start="$2" end="$3"
            local out="$ROOT_OUT/holdouts/$name"
            mkdir -p "$out"
            python research/candidate-easychart_ml3_breakthrough/run_mtf_backtest_latent_ml.py \
              --latent-model "$MODEL" \
              --start "$start" \
              --end "$end" \
              --warmup-days 30 \
              --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
              --cache "$CACHE/$name" \
              --output "$out" \
              --fee-profile usd_m_vip0 \
              --entry-slippage-ticks 2 \
              --stop-slippage-ticks 2 \
              2>&1 | tee "$out/run.log"
          }
          run_window 2024-01 2024-01-15 2024-01-19
          run_window 2025-07 2025-07-14 2025-07-18
          run_window 2026-07 2026-07-06 2026-07-10
          python - "$ROOT_OUT" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          output={}
          for directory in sorted((root/"holdouts").iterdir()):
              record={}
              for name in ("metrics.json","run.json"):
                  path=directory/name
                  if path.exists():
                      record[name]=json.loads(path.read_text(encoding="utf-8"))
              output[directory.name]=record
          (root/"holdout_summary.json").write_text(
              json.dumps(output,ensure_ascii=False,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve latent model and account paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml3-latent-training-${{ github.sha }}
          path: artifacts/candidate-easychart-ml3-latent-training/
          if-no-files-found: warn
          retention-days: 14
