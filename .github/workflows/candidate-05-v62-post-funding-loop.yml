name: candidate-05-v62-post-funding-loop

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v62-post-funding-loop.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v62-post-funding-loop
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  validation-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v62_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v62-post-funding-loop
      CACHE: .cache/candidate-05-v62-post-funding-loop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify environment and frozen v62 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_funding_reset_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v62_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python - <<'PY'
          import strategy
          assert strategy.LiquidityResponseStrategy.__name__ == "PostFundingForcedResetStrategy"
          print(strategy.LiquidityResponseStrategy)
          PY

      - name: Run 30-day development path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/development"
          python research/candidate-05/v62_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-03-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-03-30 \
            --cache "$CACHE" \
            --output "$ROOT/development" \
            2>&1 | tee "$ROOT/development/console.log"

      - name: Decide development promotion
        id: development
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root = Path(os.environ["ROOT"]) / "development"
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          def number(value):
              try: return float(str(value).strip().split()[0].replace(",", ""))
              except Exception: return None
          pnls=[]
          for item in closed:
              if item.get("branch") != "POST_FUNDING_FORCED_RESET": continue
              value=number(item.get("realized_pnl"))
              if value is not None and math.isfinite(value): pnls.append(value)
          integrity=(int(metrics.get("liquidations",0))==0 and int(metrics.get("order_rejections",0))==0 and int(metrics.get("order_denials",0))==0 and float(metrics.get("min_equity",0.0))>0.0)
          promote=(integrity and len(pnls)>=2 and sum(pnls)>0.0 and float(metrics.get("total_return",0.0))>0.056446145529302605)
          decision={
              "promote_oos":promote,
              "integrity_pass":integrity,
              "branch_trades":len(pnls),
              "branch_wins":sum(v>0 for v in pnls),
              "branch_losses":sum(v<0 for v in pnls),
              "branch_net_pnl_usdt":sum(pnls),
              "candidate_metrics":metrics,
              "diagnostics":diagnostics,
              "baseline_v46_total_return":0.056446145529302605,
          }
          (Path(os.environ["ROOT"])/"development_decision.json").write_text(json.dumps(decision,indent=2,sort_keys=True,allow_nan=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as stream: stream.write(f"promote={'true' if promote else 'false'}\n")
          print(json.dumps(decision,indent=2,sort_keys=True,allow_nan=True))
          PY

      - name: Run untouched 60-day path
        if: steps.development.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/oos"
          python research/candidate-05/v62_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-03-30 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-04-01 \
            --evaluation-end 2024-05-30 \
            --cache "$CACHE" \
            --output "$ROOT/oos" \
            2>&1 | tee "$ROOT/oos/console.log"

      - name: Decide untouched promotion
        id: oos
        if: steps.development.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root = Path(os.environ["ROOT"]) / "oos"
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          def number(value):
              try: return float(str(value).strip().split()[0].replace(",", ""))
              except Exception: return None
          pnls=[]
          for item in closed:
              if item.get("branch") != "POST_FUNDING_FORCED_RESET": continue
              value=number(item.get("realized_pnl"))
              if value is not None and math.isfinite(value): pnls.append(value)
          integrity=(int(metrics.get("liquidations",0))==0 and int(metrics.get("order_rejections",0))==0 and int(metrics.get("order_denials",0))==0 and float(metrics.get("min_equity",0.0))>0.0)
          promote=(integrity and len(pnls)>=3 and sum(pnls)>0.0 and float(metrics.get("total_return",-1.0))>-0.029149)
          decision={
              "promote_continuous":promote,
              "integrity_pass":integrity,
              "branch_trades":len(pnls),
              "branch_wins":sum(v>0 for v in pnls),
              "branch_losses":sum(v<0 for v in pnls),
              "branch_net_pnl_usdt":sum(pnls),
              "candidate_metrics":metrics,
              "diagnostics":diagnostics,
              "baseline_v46_total_return":-0.029149,
          }
          (Path(os.environ["ROOT"])/"oos_decision.json").write_text(json.dumps(decision,indent=2,sort_keys=True,allow_nan=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as stream: stream.write(f"promote={'true' if promote else 'false'}\n")
          print(json.dumps(decision,indent=2,sort_keys=True,allow_nan=True))
          PY

      - name: Run one continuous 91-day account
        if: steps.oos.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/continuous"
          python research/candidate-05/v62_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-05-30 \
            --cache "$CACHE" \
            --output "$ROOT/continuous" \
            2>&1 | tee "$ROOT/continuous/console.log"

      - name: Build terminal v62 decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          def load(name):
              path=root/name
              return json.loads(path.read_text()) if path.exists() else None
          development=load("development_decision.json")
          oos=load("oos_decision.json")
          continuous=load("continuous/metrics.json")
          if continuous is not None:
              integrity=(int(continuous.get("liquidations",0))==0 and int(continuous.get("order_rejections",0))==0 and int(continuous.get("order_denials",0))==0 and float(continuous.get("min_equity",0.0))>0.0)
              passed=(integrity and float(continuous.get("total_return",-1.0))>0.0256520 and float(continuous.get("profit_factor",0.0))>1.204 and float(continuous.get("max_drawdown",1.0))<=0.0709)
              classification="V62_POST_FUNDING_RESET_PASSED_DEV_OOS_AND_CONTINUOUS" if passed else "V62_POST_FUNDING_RESET_FAILED_CONTINUOUS_COMPARISON"
          elif oos is not None:
              classification="V62_POST_FUNDING_RESET_FAILED_UNTOUCHED_EVALUATION"
          else:
              classification="V62_POST_FUNDING_RESET_NO_DEVELOPMENT_BREAKTHROUGH"
          result={"schema":"candidate-05-v62-post-funding-loop-v1","classification":classification,"development":development,"oos":oos,"continuous_metrics":continuous}
          (root/"loop_decision.json").write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=True)+"\n")
          destination=Path("research/candidate-05/loop_results/v62_post_funding_reset.json")
          destination.parent.mkdir(parents=True,exist_ok=True)
          destination.write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True,allow_nan=True))
          PY

      - name: Commit terminal v62 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- research/candidate-05/loop_results/v62_post_funding_reset.json; then exit 0; fi
          git config user.name "candidate-05-loop-bot"
          git config user.email "candidate-05-loop-bot@users.noreply.github.com"
          git add research/candidate-05/loop_results/v62_post_funding_reset.json
          git commit -m "candidate-05: record v62 post-funding decision"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:research/candidate-05; then exit 0; fi
            git pull --rebase origin research/candidate-05
            sleep $((attempt * 2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v62-post-funding-${{ github.sha }}
          path: artifacts/candidate-05-v62-post-funding-loop/**
          if-no-files-found: warn
          retention-days: 90
