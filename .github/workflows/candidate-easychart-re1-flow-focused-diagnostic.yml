name: candidate-easychart-re1-flow-focused-diagnostic

on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths:
      - "research/candidate-easychart_re1/.flow_focused_dispatch_marker"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-flow-focused-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: february-2025-short
            start: 2025-02-01
            end: 2025-02-10
          - period: live-examples-2025-short
            start: 2025-08-10
            end: 2025-08-20
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-flow-focused/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-flow-focused/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile focused flow candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_re1/data_re1_flow.py \
            research/candidate-easychart_re1/mtf_data_re1_flow.py \
            research/candidate-easychart_re1/easychart_re1_flow.py \
            research/candidate-easychart_re1/easychart_re1_auction_flow.py \
            research/candidate-easychart_re1/easychart_re1_flow_focused.py \
            research/candidate-easychart_re1/execution_re1_flow.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_flow_focused.py
      - name: Focused construction smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from easychart_re1_flow_focused import EasyChartRE1FocusedFlowBundle
          bundle = EasyChartRE1FocusedFlowBundle("BTCUSDT", 0.1, 1.0)
          assert bundle.micro.focused_flow_diagnostics["reversal_entry"] == "CURRENT_SWEEP_RECLAIM_ABSORPTION_ONLY"
          assert not hasattr(bundle.horizontal, "flow_analyzer")
          assert bundle.major_swing.flow_analyzer.BASELINE_BARS == 60
          PY
      - name: Run four-symbol continuous account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_flow_focused.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-flow-focused-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-flow-focused/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
