name: candidate-03-v25-staged-container

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".github/workflows/candidate-03-v25-staged-container.yml"
      - "research/candidate-03/run_v25_staged_container.py"
      - "research/candidate-03/derive_nt_lvcfr_v25_signals.py"
      - "research/candidate-03/test_nt_lvcfr_v25.py"
      - "research/candidate-03/nt_lvcfr_cost_viability.py"
      - "research/candidate-03/apply_nt_lvcfr_cost_viability_patch.py"
      - "research/candidate-03/test_nt_lvcfr_cost_viability.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-03-v25-staged-container
  cancel-in-progress: false

env:
  RESEARCH_GENERATION: v25-independent-external-absorption

jobs:
  staged-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run writable V25 staged controller from exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']; token=os.environ['GITHUB_TOKEN']; path='research/candidate-03/run_v25_staged_container.py'
          req=urllib.request.Request(f'https://api.github.com/repos/{repository}/contents/{path}?ref={commit}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'candidate-03-v25-staged-container'})
          with urllib.request.urlopen(req,timeout=120) as r: payload=json.loads(r.read().decode())
          target=Path('/tmp/run_v25_staged_container.py'); target.write_bytes(base64.b64decode(payload['content']))
          PY
          python /tmp/run_v25_staged_container.py
