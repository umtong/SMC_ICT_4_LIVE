name: candidate-04-v26c-orderly-inventory-ablation

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v26c-orderly-inventory-ablation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_BUILD_START: "2024-05-25"
      C04_BUILD_END: "2024-06-02"
      C04_EVALUATION_START: "2024-05-27"
      C04_EVALUATION_END: "2024-06-02"
      C04_REMOVE_SCENARIO: "ORDERLY_INVENTORY_DISPLACEMENT"
    steps:
      - uses: actions/checkout@v4

      - name: Restore corrected same-week V26c evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v26c-week1-3fa62b01e7258160547be4aa9dc9fd4670fea0e9
          path: artifacts/candidate-04-v26c-ablation/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31099877094
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove exactly one failed market mechanism
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          test -s artifacts/candidate-04-v26c-ablation/source/signals/signals.json
          python -m compileall -q \
            research/candidate-04/ablate_compiled_scenario.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python research/candidate-04/ablate_compiled_scenario.py \
            --input-signals artifacts/candidate-04-v26c-ablation/source/signals/signals.json \
            --input-summary artifacts/candidate-04-v26c-ablation/source/signals/summary.json \
            --remove "$C04_REMOVE_SCENARIO" \
            --candidate candidate-04-v26c-no-orderly-inventory-ablation \
            --output artifacts/candidate-04-v26c-ablation/signals
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/candidate-04-v26c-ablation")
          original = json.loads((root / "source/signals/signals.json").read_text())
          ablated = json.loads((root / "signals/signals.json").read_text())
          removed = [row for row in original if row["scenario"] == "ORDERLY_INVENTORY_DISPLACEMENT"]
          expected = [row for row in original if row["scenario"] != "ORDERLY_INVENTORY_DISPLACEMENT"]
          if ablated != expected:
              raise SystemExit("ablation changed more than the selected scenario")
          if len(removed) != 2:
              raise SystemExit(f"expected two corrected inventory signals, got {len(removed)}")
          print(json.dumps({
              "removed_scenario": "ORDERLY_INVENTORY_DISPLACEMENT",
              "removed_signals": len(removed),
              "kept_signals": len(ablated),
              "changed_variables": 1,
          }, sort_keys=True))
          PY

      - name: Replay ablated intents through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v26c-ablation"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v26c-ablation/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Compare corrected candidate and one-scenario ablation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v26c-ablation")
          original = json.loads((root / "source/summary.json").read_text())
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          signal_summary = json.loads((root / "signals/summary.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit("entry/position mismatch")
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          summary = {
              "candidate": "candidate-04-v26c-no-orderly-inventory-ablation",
              "stage": "one_core_scenario_ablation_after_logic_failure",
              "removed_scenario": "ORDERLY_INVENTORY_DISPLACEMENT",
              "engine": metrics.get("engine"),
              "signals": signal_summary.get("written_signals"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "gate_pass": metrics.get("gate_pass"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
              "risk_pass": maximum <= 0.0301,
              "corrected_v26c": {
                  "trades": original.get("trades"),
                  "wins": original.get("wins"),
                  "total_return": original.get("total_return"),
                  "geometric_daily_growth": original.get("geometric_daily_growth"),
                  "scenario_metrics": original.get("scenario_metrics"),
              },
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not summary["risk_pass"]:
              raise SystemExit("realized loss exceeded 3% NAV contract")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v26c-orderly-inventory-ablation-${{ github.sha }}
          path: artifacts/candidate-04-v26c-ablation
          if-no-files-found: error
          retention-days: 90
