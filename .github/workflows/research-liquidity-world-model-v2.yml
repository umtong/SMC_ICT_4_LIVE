name: Research unified liquidity world model v2

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_world_model_v2"]
    paths:
      - ".github/workflows/research-liquidity-world-model-v2.yml"
      - "research/candidate-liquidity-world-model-v2/**"

concurrency:
  group: research-liquidity-world-model-v2
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {role: dev, period: dev-2023-feb, start: 2023-02-01, end: 2023-02-08}
          - {role: dev, period: dev-2023-aug, start: 2023-08-01, end: 2023-08-08}
          - {role: dev, period: dev-2024-feb, start: 2024-02-01, end: 2024-02-08}
          - {role: dev, period: dev-2024-may, start: 2024-05-01, end: 2024-05-08}
          - {role: dev, period: dev-2024-aug, start: 2024-08-01, end: 2024-08-08}
          - {role: dev, period: dev-2024-nov, start: 2024-11-01, end: 2024-11-08}
          - {role: dev, period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {role: dev, period: dev-2025-may, start: 2025-05-01, end: 2025-05-08}
          - {role: dev, period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
          - {role: dev, period: dev-2025-nov, start: 2025-11-01, end: 2025-11-08}
          - {role: fresh, period: fresh-2026-mar, start: 2026-03-01, end: 2026-03-08}
          - {role: fresh, period: fresh-2026-apr, start: 2026-04-01, end: 2026-04-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-world-model-v2:research/candidate-liquidity-displacement-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-liquidity-auction-v7:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/liquidity-world-model-v2/${{ matrix.period }}
      OUT: artifacts/liquidity-world-model-v2/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      PERIOD: ${{ matrix.period }}
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_world_model_v2
      - name: Compile unified causal policy
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-liquidity-world-model-v2/unified_harvest.py \
            research/candidate-liquidity-world-model-v2/route_unified.py
      - name: Harvest independent causal mechanism families
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-liquidity-world-model-v2/unified_harvest.py \
            --start "$START" --end "$END" --warmup-days 75 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["OUT"]) / "summary.json"
          data = json.loads(path.read_text())
          data["period"] = os.environ["PERIOD"]
          data["role"] = os.environ["ROLE"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, default=str) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-world-model-v2-${{ matrix.role }}-${{ matrix.period }}
          path: artifacts/liquidity-world-model-v2/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30

  route-and-publish:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-liquidity-world-model-v2
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_world_model_v2
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-world-model-v2-dev-*
          path: artifacts/liquidity-world-model-v2/development
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-world-model-v2-fresh-*
          path: artifacts/liquidity-world-model-v2/fresh
      - name: Route one continuous account
        run: |
          set -euo pipefail
          mkdir -p artifacts/liquidity-world-model-v2/result
          python research/candidate-liquidity-world-model-v2/route_unified.py \
            --development-root artifacts/liquidity-world-model-v2/development \
            --fresh-root artifacts/liquidity-world-model-v2/fresh \
            --output artifacts/liquidity-world-model-v2/result
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-world-model-v2-result
          path: artifacts/liquidity-world-model-v2/result/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish compact causal-system evidence
        run: |
          set -euo pipefail
          destination=research_results/liquidity_world_model_v2/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          cp artifacts/liquidity-world-model-v2/result/summary.json "$destination/summary.json"
          cp artifacts/liquidity-world-model-v2/result/development_orders.csv "$destination/development_orders.csv"
          cp artifacts/liquidity-world-model-v2/result/development_trades.csv "$destination/development_trades.csv"
          cp artifacts/liquidity-world-model-v2/result/development_losses.csv "$destination/development_losses.csv"
          cp artifacts/liquidity-world-model-v2/result/fresh_orders.csv "$destination/fresh_orders.csv"
          cp artifacts/liquidity-world-model-v2/result/fresh_trades.csv "$destination/fresh_trades.csv"
          cp artifacts/liquidity-world-model-v2/result/fresh_losses.csv "$destination/fresh_losses.csv"
          printf '{"source_sha":"%s","published_at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$destination/run.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          git commit -m "Record unified liquidity world-model v2 evidence [skip ci]" || exit 0
          git push origin HEAD:research_liquidity_world_model_v2
