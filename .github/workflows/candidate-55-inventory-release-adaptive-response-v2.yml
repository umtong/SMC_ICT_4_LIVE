name: candidate-55-inventory-release-adaptive-response-v2

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-inventory-release-adaptive-response-v2.yml"
      - "research/candidate-55/strategy_inventory_release_adaptive_response_v2.py"
      - "research/candidate-55/strategy_inventory_release_adaptive_response.py"
      - "research/candidate-55/strategy_inventory_release_second_touch_v4.py"
      - "research/candidate-55/strategy_inventory_release_second_touch.py"
      - "research/candidate-55/strategy_inventory_release_absorption.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-inventory-release-adaptive-response-v2
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: repair-development-2026-04-13_2026-04-19
            start: "2026-04-13"
            end: "2026-04-19"
            calendar_days: 7
            evidence_role: development-repair
          - label: repair-development-2025-11-03_2025-11-09
            start: "2025-11-03"
            end: "2025-11-09"
            calendar_days: 7
            evidence_role: development-repair
          - label: repair-preselected-2024-10-07_2024-10-13
            start: "2024-10-07"
            end: "2024-10-13"
            calendar_days: 7
            evidence_role: preselected-repair
          - label: repair-preselected-2025-08-04_2025-08-10
            start: "2025-08-04"
            end: "2025-08-10"
            calendar_days: 7
            evidence_role: preselected-repair
          - label: repair-preselected-2026-02-02_2026-02-08
            start: "2026-02-02"
            end: "2026-02-08"
            calendar_days: 7
            evidence_role: preselected-repair
          - label: fresh-v2-2024-06-03_2024-06-09
            start: "2024-06-03"
            end: "2024-06-09"
            calendar_days: 7
            evidence_role: fresh-candidate55-v2
          - label: fresh-v2-2025-02-10_2025-02-16
            start: "2025-02-10"
            end: "2025-02-16"
            calendar_days: 7
            evidence_role: fresh-candidate55-v2
          - label: fresh-v2-2026-06-08_2026-06-14
            start: "2026-06-08"
            end: "2026-06-14"
            calendar_days: 7
            evidence_role: fresh-candidate55-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 1

      - name: Materialize reused router and repaired frozen adaptive-response policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_microauction.py research/candidate-51/router.py
          cp research/candidate-55/strategy_inventory_release_adaptive_response_v2.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install, doctor, compile and verify arbitration contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          from types import SimpleNamespace
          from strategy import (
              Candidate35Config,
              Candidate35Strategy,
              _patch_response_sort_record,
          )

          assert Candidate35Config is not None and Candidate35Strategy is not None
          record = {}
          result = _patch_response_sort_record(
              record=record,
              decision_diagnostics={"modeled_net_target_r": 2.0},
              side=1,
              observation=SimpleNamespace(
                  flow_15s=0.25,
                  depth_imbalance_1=0.10,
              ),
              fallback_target_net_r=2.0,
          )
          assert result is record
          assert record == {
              "target_net_r": 2.0,
              "directional_flow_15s": 0.25,
              "directional_depth": 0.10,
          }
          print("adaptive-response v2 arbitration contract pass")
          PY

      - name: Freeze result-blind policy, evidence role and prediction
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          strategy = base["strategy"]
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              strategy.pop(key, None)
          strategy.update(
              {
                  "microauction_mode": "absorption",
                  "microauction_atr_period": 30,
                  "microauction_balance_lookback": 10,
                  "microauction_stop_buffer_atr": 0.15,
                  "microauction_min_reward_r": 0.0,
                  "absorption_flow_min": 0.25,
                  "absorption_flow_15s_min": 0.15,
                  "absorption_flow_3m_min": 0.05,
                  "absorption_notional_burst_min": 1.50,
                  "absorption_trade_burst_min": 1.20,
                  "absorption_efficiency_max": 0.25,
                  "absorption_strength_min": 0.15,
                  "absorption_alignment_max_bps": 0.50,
                  "absorption_sweep_buffer_atr": 0.05,
                  "absorption_depth_defense_min": 0.00,
                  "absorption_same_depth_growth_min": 0.00,
                  "microauction_exit_on_opposite_state": False,
                  "inventory_context_lookback_minutes": 60,
                  "inventory_target_net_r": 2.0,
                  "second_touch_ttl_minutes": 10,
                  "second_touch_episode_lookback_minutes": 60,
                  "second_touch_min_directional_depth": 0.0,
                  "second_touch_min_net_r": 1.25,
                  "feature_max_age_seconds": 65.0,
                  "cooldown_minutes": 0,
                  "max_hold_minutes": 240,
                  "funding_flatten_minute": 60,
                  "funding_blackout_before_minutes": -1,
                  "funding_blackout_after_minutes": -1,
              }
          )
          work = Path(".work/candidate-55-inventory-release-adaptive-response-v2")
          work.mkdir(parents=True, exist_ok=True)
          config_path = work / "frozen-config.json"
          config_path.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
          role = os.environ["EVIDENCE_ROLE"]
          manifest = {
              "candidate": "candidate-55-inventory-release-adaptive-response-v2",
              "label": os.environ["LABEL"],
              "interval": [os.environ["START"], os.environ["END"]],
              "calendar_days": int(os.environ["CALENDAR_DAYS"]),
              "evidence_role": role,
              "fresh_period_selected_before_result": role.startswith("fresh-"),
              "repair_scope": (
                  "response record arbitration contract only; no market-state, "
                  "geometry, target, risk, cost or management change"
              ),
              "state_transition": {
                  "age_minutes": 1,
                  "flow_60s": "crosses zero to reversal side",
                  "ret_60s": "non-adverse in reversal direction",
                  "flow_3m": "old-side crowding remains",
                  "absorption": "declines versus interaction",
                  "notional_and_trade_rate": "both decline versus interaction",
                  "open_interest": "release remains negative",
              },
              "invalidation": "frozen interaction extreme plus 0.15 ATR",
              "objective": "inherited cost-after +2R from delayed entry",
              "prediction": {
                  "fast_stop_false_positives": "removed disproportionately",
                  "gross_profit_engine": "rare V1 winners retained when liquidity adapts",
                  "falsification": (
                      "fresh expectancy non-positive, density negligible, or immediate-stop anatomy persists"
                  ),
              },
              "engine": "NautilusTrader BacktestNode",
              "universe": ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"],
              "one_global_entry_or_position": True,
              "current_nav_planned_loss_fraction": 0.03,
              "strategy_sha256": hashlib.sha256(
                  Path("research/candidate-51/strategy.py").read_bytes()
              ).hexdigest(),
              "router_sha256": hashlib.sha256(
                  Path("research/candidate-51/router.py").read_bytes()
              ).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
          }
          (work / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run one continuous account
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set +e
          output="artifacts/candidate-55/inventory-release-adaptive-response-v2-${LABEL}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/candidate-55-inventory-release-adaptive-response-v2/frozen-config.json \
            --start "$START" --end "$END" \
            --cache ".cache/candidate-55-inventory-release-adaptive-response-v2-${LABEL}" \
            --output "$output" \
            --workspace ".work/candidate-55-inventory-release-adaptive-response-v2-${LABEL}"
          code="$?"
          echo "$code" > .work/candidate-55-inventory-release-adaptive-response-v2/exit-code.txt
          exit 0

      - name: Write compact causal and trade-level summary
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          label = os.environ["LABEL"]
          days = int(os.environ["CALENDAR_DAYS"])
          role = os.environ["EVIDENCE_ROLE"]
          root = Path("artifacts/candidate-55") / f"inventory-release-adaptive-response-v2-{label}"
          root.mkdir(parents=True, exist_ok=True)
          metrics_path = root / "metrics.json"
          diagnostics_path = root / "strategy_diagnostics.json"
          closed_path = root / "closed_scenarios.json"
          exit_path = Path(".work/candidate-55-inventory-release-adaptive-response-v2/exit-code.txt")
          summary = {
              "candidate": "candidate-55-inventory-release-adaptive-response-v2",
              "label": label,
              "calendar_days": days,
              "evidence_role": role,
              "fresh_period_selected_before_result": role.startswith("fresh-"),
              "exit_code": int(exit_path.read_text()) if exit_path.is_file() else None,
              "produced": metrics_path.is_file() and diagnostics_path.is_file(),
          }
          if summary["produced"]:
              metrics = json.loads(metrics_path.read_text())
              diagnostics = json.loads(diagnostics_path.read_text())
              closed = json.loads(closed_path.read_text()) if closed_path.is_file() else []
              net_pnls = [
                  float(item.get("net_pnl", item.get("pnl", 0.0)) or 0.0)
                  for item in closed
              ]
              winners = [value for value in net_pnls if value > 0.0]
              losers = [value for value in net_pnls if value < 0.0]
              summary.update(
                  metrics=metrics,
                  trades_per_calendar_day=float(metrics.get("trades") or 0) / days,
                  closed_scenarios=len(closed),
                  winning_scenarios=len(winners),
                  losing_scenarios=len(losers),
                  gross_closed_profit=sum(winners),
                  gross_closed_loss=sum(losers),
                  unique_episode_keys=len(
                      {
                          str(item.get("inventory_episode_key"))
                          for item in closed
                          if item.get("inventory_episode_key")
                      }
                  ),
                  causal_anatomy={
                      key: diagnostics.get(key)
                      for key in (
                          "base_absorption_states",
                          "second_touch_arms",
                          "adaptive_response_checks",
                          "adaptive_response_stop_invalidations",
                          "adaptive_response_nonfinite_rejections",
                          "adaptive_response_flow60_rejections",
                          "adaptive_response_return_rejections",
                          "adaptive_response_flow3m_rejections",
                          "adaptive_response_absorption_decay_rejections",
                          "adaptive_response_notional_decay_rejections",
                          "adaptive_response_trade_rate_decay_rejections",
                          "adaptive_response_oi_release_rejections",
                          "adaptive_response_geometry_rejections",
                          "adaptive_response_responses",
                          "adaptive_response_arbitration_contract_repairs",
                          "second_touch_entries",
                          "second_touch_competing_responses",
                          "inventory_context_rejection_counts",
                          "selected_symbols",
                      )
                  },
                  execution={
                      key: diagnostics.get(key)
                      for key in (
                          "entry_submissions",
                          "order_rejections",
                          "entry_expirations",
                          "global_position_violations",
                          "max_open_positions_observed",
                          "max_simultaneous_entry_intents",
                      )
                  },
              )
          (root / "ADAPTIVE_RESPONSE_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-inventory-release-adaptive-response-v2-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-55/inventory-release-adaptive-response-v2-${{ matrix.label }}/**
            .work/candidate-55-inventory-release-adaptive-response-v2/manifest.json
            .work/candidate-55-inventory-release-adaptive-response-v2/exit-code.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact run completion
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          code="$(cat .work/candidate-55-inventory-release-adaptive-response-v2/exit-code.txt)"
          test "$code" -eq 0
          root="artifacts/candidate-55/inventory-release-adaptive-response-v2-${LABEL}"
          test -s "$root/metrics.json"
          test -s "$root/strategy_diagnostics.json"
