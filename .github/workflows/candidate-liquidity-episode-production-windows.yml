name: Candidate liquidity episode production Windows

on:
  workflow_dispatch:
  push:
    branches: ["production-candidate-liquidity-episode-policy-v1"]
    paths:
      - ".github/workflows/candidate-liquidity-episode-production-windows.yml"
      - "research/candidate-liquidity-episode-policy-v1/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/candidate-liquidity-episode-production-windows.yml"
      - "research/candidate-liquidity-episode-policy-v1/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: episode-production-windows-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  native-windows-contract:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install pinned project and production dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install --requirement research/candidate-liquidity-episode-policy-v1/production-requirements.txt
      - name: Verify restored source and Windows-safe runtime
        working-directory: research/candidate-liquidity-episode-policy-v1
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m production.cli verify `
            --config configs/shadow.windows.json `
            --output artifacts/contract.json
      - name: Run pure production contracts
        working-directory: research/candidate-liquidity-episode-policy-v1
        run: python -m unittest discover -s production_tests -v
      - name: Exercise a protected bracket through NautilusTrader
        working-directory: research/candidate-liquidity-episode-policy-v1
        run: |
          python -m production.cli nautilus-smoke --output artifacts/nautilus-smoke
          python -m production.cli reconcile `
            --database artifacts/nautilus-smoke/runtime.sqlite3 `
            --output artifacts/nautilus-smoke/reconciliation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-production-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: research/candidate-liquidity-episode-policy-v1/artifacts/**
          if-no-files-found: error
          retention-days: 30

  pinned-linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install production dependencies
        run: |
          uv pip install --python "$VIRTUAL_ENV/bin/python" \
            --requirement research/candidate-liquidity-episode-policy-v1/production-requirements.txt
      - name: Verify source and runtime contracts
        working-directory: research/candidate-liquidity-episode-policy-v1
        run: |
          mkdir -p artifacts-linux
          python -m production.cli verify \
            --config configs/shadow.windows.json \
            --output artifacts-linux/contract.json
          python -m unittest discover -s production_tests -v
          python -m production.cli nautilus-smoke --output artifacts-linux/nautilus-smoke
          python -m production.cli reconcile \
            --database artifacts-linux/nautilus-smoke/runtime.sqlite3 \
            --output artifacts-linux/nautilus-smoke/reconciliation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-production-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: research/candidate-liquidity-episode-policy-v1/artifacts-linux/**
          if-no-files-found: error
          retention-days: 30
