name: Candidate 06 v0.3 Session Liquidity Transfer

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - "research/candidate-06/session_engine.py"
      - "research/candidate-06/logic.py"
      - "research/candidate-06/run_session_matrix.py"
      - "research/candidate-06/test_session_engine.py"
      - ".github/workflows/candidate-06-v3-session.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staged-nautilus-validation:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed environment and session causal order
        run: |
          set -euo pipefail
          smc4 doctor
          python research/candidate-06/test_session_engine.py

      - name: Run session matrix and frozen follow-up weeks
        id: matrix
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf artifacts/candidate-06/session-matrix-v3
          python research/candidate-06/run_session_matrix.py \
            --output artifacts/candidate-06/session-matrix-v3
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record session evidence
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/session-matrix-v3
          if [ -f research/candidate-06/config.session.locked.json ]; then
            git add -f research/candidate-06/config.session.locked.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record candidate-06 v0.3 session evidence [skip ci]"
            git push origin HEAD:research/candidate-06
          fi

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-v0.3-session-evidence
          path: |
            artifacts/candidate-06/session-matrix-v3
            research/candidate-06/config.session.locked.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce staged session result
        if: always()
        shell: bash
        run: |
          code='${{ steps.matrix.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "session matrix step did not report an exit code" >&2
            exit 1
          fi
          exit "$code"
