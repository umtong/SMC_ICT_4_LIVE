name: candidate-05-loop-stop

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/loop_results/loop_complete.json"
  workflow_dispatch:

concurrency:
  group: candidate-05-loop-stop
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-05
          fetch-depth: 0
      - name: Verify authoritative completion marker
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('research/candidate-05/loop_results/loop_complete.json')
          value=json.loads(path.read_text())
          assert value.get('complete') is True
          winner=value.get('winner') or {}
          assert str(winner.get('classification','')).startswith('PROJECT_TARGET_REACHED')
          assert winner.get('target_reached') is True
          print(json.dumps(value,indent=2,sort_keys=True,allow_nan=True))
          PY
      - name: Cancel all other queued and in-progress Candidate 05 runs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          token=os.environ['GH_TOKEN']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'candidate-05-loop-stop',
          }
          url=f'https://api.github.com/repos/{repo}/actions/runs?branch=research%2Fcandidate-05&per_page=100'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:
              runs=json.load(response).get('workflow_runs',[])
          cancelled=[]
          for run in runs:
              if int(run['id'])==current:continue
              if run.get('status') not in {'queued','in_progress','waiting','requested','pending'}:continue
              if not str(run.get('name','')).startswith('candidate-05'):continue
              request=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method='POST',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:
                      response.read()
                  cancelled.append({'id':run['id'],'name':run['name']})
              except urllib.error.HTTPError as exc:
                  if exc.code not in {409,422}:
                      raise
          print(json.dumps({'cancelled':cancelled},indent=2,sort_keys=True))
          PY
      - name: Record loop stop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          complete=json.loads(Path('research/candidate-05/loop_results/loop_complete.json').read_text())
          value={
              'schema':'candidate-05-loop-stopped-v1',
              'stopped_at':datetime.now(timezone.utc).isoformat(),
              'reason':'AUTHORITATIVE_PROJECT_TARGET_REACHED',
              'winner_file':complete.get('winner_file'),
              'winner':complete.get('winner'),
              'winner_metrics':complete.get('winner_metrics'),
          }
          Path('research/candidate-05/loop_results/loop_stopped.json').write_text(json.dumps(value,indent=2,sort_keys=True,allow_nan=True)+'\n')
          PY
          git config user.name candidate-05-loop-bot
          git config user.email candidate-05-loop-bot@users.noreply.github.com
          git add research/candidate-05/loop_results/loop_stopped.json
          git commit -m "candidate-05: stop loop after authoritative target"
          for attempt in 1 2 3 4 5;do
            if git push origin HEAD:research/candidate-05;then exit 0;fi
            git pull --rebase origin research/candidate-05;sleep $((attempt*2))
          done
          exit 1
