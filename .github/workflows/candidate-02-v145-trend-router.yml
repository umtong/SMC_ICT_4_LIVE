name: candidate-02-v145-trend-router-family

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v145_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v145-trend-router-family, cancel-in-progress: false}

jobs:
  v145-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}

      - name: Verify engine and prior-only regime router
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v142_dual_auction_core.py \
            research/candidate-02/v145_trend_router_core.py \
            research/candidate-02/v145_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('research/candidate-02/v107_week1_config.json').read_text())
          two=json.loads(Path('research/candidate-02/v107_week2_config.json').read_text())
          assert one['scenario']==two['scenario'] and one['costs']==two['costs'] and one['risk']==two['risk']
          assert float(one['risk']['risk_fraction'])==0.03
          assert one['risk']['maximum_notional_cap'] is None
          PY

      - name: Download immutable week-one matrix and bars
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e, path: inputs/v145-week1, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31036754667"}

      - name: Download immutable week-two matrix
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e, path: inputs/v145-week2, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31036754667"}

      - name: Download locked week-two bars
        uses: actions/download-artifact@v4
        with: {name: candidate-02-v53-nt-second-week-3c73273b563ee221a0e0b9f4ec3c87077c645edd, path: inputs/v145-week2-source, github-token: "${{ github.token }}", repository: umtong/SMC_ICT_4_LIVE, run-id: "31065619489"}

      - name: Materialize fixed inputs and adjacent prior quantiles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inputs/v145-week2/.cache
          mkdir -p inputs/v145-week2/.cache/candidate-02/v145-week2/binance_1m
          find inputs/v145-week2-source -path '*/binance_1m/*.zip' -type f \
            -exec cp '{}' inputs/v145-week2/.cache/candidate-02/v145-week2/binance_1m/ \;
          test "$(find inputs/v145-week2/.cache/candidate-02/v145-week2/binance_1m -name '*.zip' | wc -l)" -eq 10
          mkdir -p /tmp/v145-config
          python - <<'PY'
          import json
          from pathlib import Path
          for week in ('week1','week2'):
              base=json.loads(Path(f'research/candidate-02/v107_{week}_config.json').read_text())
              for quantile in (0.55,0.65,0.75):
                  obj=json.loads(json.dumps(base))
                  scenario=obj['scenario']
                  scenario.update({
                      'volatility_quantile':0.55,
                      'target_extension':0.0,
                      'minimum_cost_after_rr':0.65,
                      'maximum_cost_after_rr':4.0,
                      'maximum_holding_minutes':60,
                      'decision_window_minutes':15,
                      'activation_delay_minutes':1,
                      'resolution_stop_buffer_atr':0.15,
                      'continuation_extension':1.0,
                      'trend_lookback_5m':48,
                      'trend_efficiency_quantile':quantile,
                  })
                  tag=int(round(quantile*100))
                  obj['candidate']=f'candidate-02-v145-trend-q{tag}'
                  Path(f'/tmp/v145-config/{week}-q{tag}.json').write_text(
                      json.dumps(obj,indent=2,sort_keys=True)+'\n'
                  )
          PY

      - name: Run six NautilusTrader regime-router screens
        shell: bash
        run: |
          set -euo pipefail
          for quantile in 55 65 75; do
            for week in week1 week2; do
              out="artifacts/candidate-02-v145/q${quantile}/${week}"
              mkdir -p "$out"
              set +e
              python research/candidate-02/v145_nt_backtest.py \
                --config "/tmp/v145-config/${week}-q${quantile}.json" \
                --input-root "inputs/v145-${week}" \
                --output "$out" \
                | tee "artifacts-v145-q${quantile}-${week}.log"
              status=${PIPESTATUS[0]}
              set -e
              echo "$status" > "$out/validation_exit_code.txt"
              if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out={
              'candidate':'candidate-02-v145-higher-timeframe-auction-router',
              'engine':'NautilusTrader 1.230.0',
              'custom_backtest_engine':False,
              'risk_fraction':0.03,
              'trend_lookback_5m':48,
              'single_variable':'prior-only four-hour directional-efficiency quantile',
              'variants':{},
          }
          for quantile in (55,65,75):
              out['variants'][str(quantile)]={
                  week:json.loads(Path(f'artifacts/candidate-02-v145/q{quantile}/{week}/metrics.json').read_text())
                  for week in ('week1','week2')
              }
          passes={key:all(metric['target_met'] for metric in weeks.values()) for key,weeks in out['variants'].items()}
          out['variant_both_week_pass']=passes
          out['plateau_pass']=passes['65'] and (passes['55'] or passes['75'])
          out['status']='READY_FOR_PROSPECTIVE_WEEK' if out['plateau_pass'] else 'DEVELOPMENT_REJECT'
          Path('artifacts-v145-family-decision.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'status':out['status'],
              'passes':passes,
              'metrics':{
                  variant:{week:{key:metric.get(key) for key in (
                      'trades','trades_per_day','win_rate','profit_factor_after_cost',
                      'geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown','target_met')}
                           for week,metric in weeks.items()}
                  for variant,weeks in out['variants'].items()
              },
          },indent=2,sort_keys=True))
          PY

      - name: Commit compact router evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compact-v145
          mkdir compact-v145
          cp -f artifacts-v145-*.json compact-v145/ 2>/dev/null || true
          cp -f artifacts-v145-*.log compact-v145/ 2>/dev/null || true
          cp -a artifacts/candidate-02-v145 compact-v145/ 2>/dev/null || true
          git fetch origin research/candidate-02
          if test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA" \
             && test -f artifacts-v145-family-decision.json; then
            destination="research/candidate-02/results/v145_family/$GITHUB_SHA"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a compact-v145/. "$destination/"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$destination"
            git commit -m "research(candidate-02): record v145 router evidence"
            git push origin HEAD:research/candidate-02
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "candidate-02-v145-family-${{ github.sha }}", path: compact-v145, if-no-files-found: warn, retention-days: 30, compression-level: 9}
