name: candidate-08-shared-acceptance-holdout-stage-b-ablation-v1

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-shared-acceptance-holdout-stage-b-ablation-v1"

permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      run: ${{ steps.select.outputs.run }}
      runner_kind: ${{ steps.select.outputs.runner_kind }}
      variant: ${{ steps.select.outputs.variant }}
      probe_name: ${{ steps.select.outputs.probe_name }}
      probe_start: ${{ steps.select.outputs.probe_start }}
      probe_end: ${{ steps.select.outputs.probe_end }}
      matrix: ${{ steps.select.outputs.matrix }}
      upstream_route: ${{ steps.select.outputs.upstream_route }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          file=research/candidate-08/evidence/shared-acceptance-holdout-stage-b-v1/route.txt
          for attempt in $(seq 1 1080); do
            git fetch origin research/candidate-08
            git reset --hard origin/research/candidate-08
            [[ -f "$file" ]] && break
            sleep 15
          done
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          root = Path("research/candidate-08/evidence/shared-acceptance-holdout-stage-b-v1")
          route = (root / "route.txt").read_text().strip() if (root / "route.txt").exists() else "NO_ROUTE"
          suite = json.loads((root / "suite_metrics.json").read_text()) if (root / "suite_metrics.json").exists() else {}
          plan = json.loads(Path("research/candidate-08/shared_acceptance_extended_holdout_v1.json").read_text())
          windows = [*plan["stage_a"], *plan["stage_b"]]
          results = {item["name"]: item for item in suite.get("window_results", [])}
          failing = next(
              (
                  window for window in windows
                  if window["name"] not in results
                  or float(results[window["name"]].get("total_return", 0.0)) <= 0
                  or int(results[window["name"]].get("closed_trades", 0)) < 3
              ),
              windows[0],
          )
          original = suite.get("runner_kind", "NONE")
          ablated = {"BASE": "BASE_ABLATION", "IMPLEMENTATION": "IMPLEMENTATION_ABLATION"}.get(original, "NONE")
          run = route == "STAGE_B_LOGIC_FAILURE_UNABLATED" and ablated != "NONE"
          variant = str(suite.get("variant", "NONE")) + "_NO_CONTRACTION_STAGE_B_ABLATION"
          print(f"run={'true' if run else 'false'}")
          print(f"runner_kind={ablated}")
          print(f"variant={variant}")
          print(f"probe_name={failing['name']}")
          print(f"probe_start={failing['start']}")
          print(f"probe_end={failing['end']}")
          print(f"upstream_route={route}")
          print("matrix=" + json.dumps({"include": windows}, separators=(",", ":")))
          PY

  probe:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      DATA_CACHE: /tmp/candidate-08-stage-b-ablation-probe
      OUTPUT: /tmp/candidate-08-stage-b-ablation-probe-output
      RUNNER_KIND: ${{ needs.prepare.outputs.runner_kind }}
      VARIANT: ${{ needs.prepare.outputs.variant }}
      WINDOW_NAME: ${{ needs.prepare.outputs.probe_name }}
      WINDOW_START: ${{ needs.prepare.outputs.probe_start }}
      WINDOW_END: ${{ needs.prepare.outputs.probe_end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_CACHE }}
          key: candidate-08-stage-b-ablation-probe-${{ needs.prepare.outputs.probe_name }}-${{ github.sha }}
          restore-keys: |
            candidate-08-stage-b-${{ needs.prepare.outputs.probe_name }}-
            candidate-08-stage-a-v2-${{ needs.prepare.outputs.probe_name }}-
            candidate-08-aggtrade-acceptance-
      - name: Run one controlled same-week ablation probe
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          set +e
          {
            set -euo pipefail
            smc4 doctor
            python - <<'PY'
            import json, os
            from pathlib import Path
            config = json.loads(Path("research/candidate-08/config_aggtrade_acceptance_shared.json").read_text())
            config["candidate"] = f"candidate-08-{os.environ['VARIANT']}-probe"
            config["suites"]["first"] = [{
                "name": os.environ["WINDOW_NAME"],
                "start": os.environ["WINDOW_START"],
                "end": os.environ["WINDOW_END"],
            }]
            config["ablation"] = {"removed_variable": "RETEST_ACTIVITY_AND_IMBALANCE_CONTRACTION", "same_failing_week": True}
            Path(os.environ["OUTPUT"], "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
            PY
            python research/candidate-08/run_selected_shared_acceptance_variant.py \
              --runner-kind "$RUNNER_KIND" \
              --config "$OUTPUT/config.json" \
              --output "$OUTPUT/run" \
              --data-cache "$DATA_CACHE"
          } 2>&1 | tee "$OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUTPUT/runner_exit_status.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-stage-b-ablation-probe
          path: ${{ env.OUTPUT }}
          retention-days: 30
          if-no-files-found: error

  qualify:
    needs: [prepare, probe]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.decide.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.run == 'true'
        with:
          name: candidate-08-stage-b-ablation-probe
          path: /tmp/stage-b-ablation-probe
      - id: decide
        shell: bash
        env:
          SHOULD_RUN: ${{ needs.prepare.outputs.run }}
          PROBE_NAME: ${{ needs.prepare.outputs.probe_name }}
        run: |
          set -euo pipefail
          promote=false
          mkdir -p /tmp/stage-b-ablation-decision
          if [[ "$SHOULD_RUN" == true ]]; then
            python - <<'PY'
            import json, os
            from pathlib import Path
            root = Path("/tmp/stage-b-ablation-probe")
            try:
                status = int((root / "runner_exit_status.txt").read_text().strip())
            except Exception:
                status = 999
            path = root / "run/metrics.json"
            metrics = json.loads(path.read_text()) if path.exists() else {}
            clean = (
                status == 0
                and int(metrics.get("execution_failures", 1)) == 0
                and int(metrics.get("open_positions_after_run", 1)) == 0
                and int(metrics.get("open_orders_after_run", 1)) == 0
                and int(metrics.get("unexpected_or_liquidation_closes", 1)) == 0
                and int(metrics.get("incomplete_multiasset_timestamps", 1)) == 0
            )
            closed = int(metrics.get("position_metrics", {}).get("closed_trades", 0))
            positive = float(metrics.get("total_return", 0.0)) > 0
            promote = clean and closed >= 3 and positive
            decision = {
                "probe_window": os.environ["PROBE_NAME"],
                "runner_exit_status": status,
                "implementation_clean": clean,
                "closed_trades": closed,
                "wins": metrics.get("position_metrics", {}).get("wins"),
                "total_return": metrics.get("total_return"),
                "daily_geometric_growth": metrics.get("daily_geometric_growth"),
                "promote_full_ablation": promote,
                "decision": "RUN_FULL_TWELVE_WEEK_ABLATION" if promote else "DISCARD_ACCEPTANCE_FAMILY",
            }
            Path("/tmp/stage-b-ablation-decision/decision.json").write_text(json.dumps(decision, indent=2, sort_keys=True) + "\n")
            Path("/tmp/stage-b-ablation-decision/promote.txt").write_text("true\n" if promote else "false\n")
            print(json.dumps(decision, indent=2, sort_keys=True))
            PY
            promote=$(cat /tmp/stage-b-ablation-decision/promote.txt)
          else
            printf '{"reason":"Stage B was not an unabated logical failure"}\n' > /tmp/stage-b-ablation-decision/decision.json
          fi
          printf 'promote=%s\n' "$promote" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-stage-b-ablation-decision
          path: /tmp/stage-b-ablation-decision
          retention-days: 30

  evaluate-full:
    needs: [prepare, qualify]
    if: needs.qualify.outputs.promote == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      DATA_CACHE: /tmp/candidate-08-stage-b-ablation-full-${{ matrix.name }}
      OUTPUT: /tmp/candidate-08-stage-b-ablation-full/${{ matrix.name }}
      RUNNER_KIND: ${{ needs.prepare.outputs.runner_kind }}
      VARIANT: ${{ needs.prepare.outputs.variant }}
      WINDOW_NAME: ${{ matrix.name }}
      WINDOW_START: ${{ matrix.start }}
      WINDOW_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_CACHE }}
          key: candidate-08-stage-b-ablation-full-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            candidate-08-stage-b-${{ matrix.name }}-
            candidate-08-stage-a-v2-${{ matrix.name }}-
            candidate-08-aggtrade-acceptance-
      - name: Run full ablated holdout week
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          set +e
          {
            set -euo pipefail
            smc4 doctor
            python - <<'PY'
            import json, os
            from pathlib import Path
            config = json.loads(Path("research/candidate-08/config_aggtrade_acceptance_shared.json").read_text())
            config["candidate"] = f"candidate-08-{os.environ['VARIANT']}"
            config["suites"]["first"] = [{
                "name": os.environ["WINDOW_NAME"],
                "start": os.environ["WINDOW_START"],
                "end": os.environ["WINDOW_END"],
            }]
            config["ablation"] = {"removed_variable": "RETEST_ACTIVITY_AND_IMBALANCE_CONTRACTION", "full_twelve_week": True}
            Path(os.environ["OUTPUT"], "config.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
            PY
            python research/candidate-08/run_selected_shared_acceptance_variant.py \
              --runner-kind "$RUNNER_KIND" \
              --config "$OUTPUT/config.json" \
              --output "$OUTPUT/run" \
              --data-cache "$DATA_CACHE"
          } 2>&1 | tee "$OUTPUT/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUTPUT/runner_exit_status.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-stage-b-ablation-full-${{ matrix.name }}
          path: ${{ env.OUTPUT }}
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: [prepare, probe, qualify, evaluate-full]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-08
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.run == 'true'
        with:
          pattern: candidate-08-stage-b-ablation-*
          path: /tmp/stage-b-ablation-all
          merge-multiple: false
      - name: Aggregate probe or full ablation decision
        shell: bash
        env:
          SHOULD_RUN: ${{ needs.prepare.outputs.run }}
          PROMOTE: ${{ needs.qualify.outputs.promote }}
          RUNNER_KIND: ${{ needs.prepare.outputs.runner_kind }}
          VARIANT: ${{ needs.prepare.outputs.variant }}
          UPSTREAM_ROUTE: ${{ needs.prepare.outputs.upstream_route }}
        run: |
          set -euo pipefail
          root=research/candidate-08/evidence/shared-acceptance-holdout-stage-b-ablation-v1
          rm -rf "$root"
          mkdir -p "$root"
          if [[ -d /tmp/stage-b-ablation-all/candidate-08-stage-b-ablation-probe ]]; then
            cp -a /tmp/stage-b-ablation-all/candidate-08-stage-b-ablation-probe "$root/probe"
          fi
          if [[ -d /tmp/stage-b-ablation-all/candidate-08-stage-b-ablation-decision ]]; then
            cp -a /tmp/stage-b-ablation-all/candidate-08-stage-b-ablation-decision/. "$root/"
          fi
          if [[ "$SHOULD_RUN" != true ]]; then
            printf '{"reason":"Stage B was not an unabated logical failure","route":"%s"}\n' "$UPSTREAM_ROUTE" > "$root/ablation_not_run.json"
            printf 'NOT_RUN\n' > "$root/route.txt"
          elif [[ "$PROMOTE" != true ]]; then
            printf 'DISCARD_ACCEPTANCE_FAMILY\n' > "$root/route.txt"
          else
            mkdir -p "$root/windows"
            for artifact in /tmp/stage-b-ablation-all/candidate-08-stage-b-ablation-full-*; do
              name=${artifact##*candidate-08-stage-b-ablation-full-}
              mkdir -p "$root/windows/$name"
              cp -a "$artifact"/. "$root/windows/$name/"
            done
            python research/candidate-08/aggregate_shared_acceptance_holdout.py \
              --root "$root/windows" \
              --plan research/candidate-08/shared_acceptance_extended_holdout_v1.json \
              --stage STAGE_B \
              --variant "$VARIANT" \
              --runner-kind "$RUNNER_KIND" \
              --output "$root/suite_metrics.json"
          fi
      - name: Commit Stage B ablation evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin research/candidate-08
          rm -f research/candidate-08/.run-shared-acceptance-holdout-stage-b-ablation-v1
          git add research/candidate-08/evidence/shared-acceptance-holdout-stage-b-ablation-v1 research/candidate-08/.run-shared-acceptance-holdout-stage-b-ablation-v1
          git commit -m "candidate-08: record staged Stage B contraction ablation" || true
          git push origin HEAD:research/candidate-08
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-stage-b-ablation-aggregate-${{ github.run_id }}
          path: research/candidate-08/evidence/shared-acceptance-holdout-stage-b-ablation-v1
          retention-days: 30
