name: candidate-easychart-fix-v18-slope

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - ".github/workflows/candidate-easychart-fix-v18-slope.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-fix-v18-slope
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-easychart
          fetch-depth: 0
      - name: Replace epsilon intersection with exact rational projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("research/candidate-easychart/market_v18_trendline.py")
          text = source.read_text()
          text = text.replace(
              "from enum import Enum\nimport math\n",
              "from enum import Enum\nfrom fractions import Fraction\nimport math\n",
          )
          start = text.index("def feasible_slope_interval(")
          end = text.index("\n\ndef _line_direction(", start)
          replacement = '''def feasible_slope_interval(
              anchors: Sequence[ReactionInterval],
          ) -> tuple[float, float] | None:
              """Return the exact feasible slope projection of all interval anchors.

              Prices arrive as binary floats. Converting each endpoint through
              ``as_integer_ratio`` preserves that observed value exactly, while integer
              nanosecond deltas make every pair constraint rational. Intersecting those
              rational intervals avoids an absolute epsilon which can otherwise return a
              numerically reversed interval at crypto price/time scales.
              """
              if len(anchors) < 2:
                  return None
              ordered = sorted(anchors, key=lambda item: item.pivot.event_time_ns)
              low: Fraction | None = None
              high: Fraction | None = None
              for i, first in enumerate(ordered):
                  first_low = Fraction(*float(first.low).as_integer_ratio())
                  first_high = Fraction(*float(first.high).as_integer_ratio())
                  for second in ordered[i + 1 :]:
                      elapsed = second.pivot.event_time_ns - first.pivot.event_time_ns
                      if elapsed <= 0:
                          return None
                      second_low = Fraction(*float(second.low).as_integer_ratio())
                      second_high = Fraction(*float(second.high).as_integer_ratio())
                      pair_low = (second_low - first_high) / elapsed
                      pair_high = (second_high - first_low) / elapsed
                      low = pair_low if low is None else max(low, pair_low)
                      high = pair_high if high is None else min(high, pair_high)
                      if high < low:
                          return None
              assert low is not None and high is not None
              output = float(low), float(high)
              if output[1] < output[0]:
                  raise AssertionError(
                      "exact ordered slope interval became reversed as floats"
                  )
              return output
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          source.write_text(text[:start] + replacement + text[end:])

          tests = Path("research/candidate-easychart/tests/test_market_v18_trendline.py")
          text = tests.read_text()
          if "test_exact_intersection_never_returns_epsilon_reversed_interval" not in text:
              needle = "    def test_ambiguous_flat_or_sloped_family_is_not_directional(self) -> None:\n"
              addition = '''    def test_exact_intersection_never_returns_epsilon_reversed_interval(self) -> None:
                  anchors = (
                      interval(0, 1, "HIGH", -5e-18, 2e-18),
                      interval(1, 2, "HIGH", -5e-18, -1e-18),
                      interval(2, 3, "HIGH", 4e-18, 4e-18),
                  )
                  # The former epsilon intersection returned a reversed interval.
                  self.assertIsNone(feasible_slope_interval(anchors))

              '''
              addition = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in addition.splitlines()
              ) + "\n"
              if needle not in text:
                  raise SystemExit("test insertion point not found")
              tests.write_text(text.replace(needle, addition + needle))
          PY
          PYTHONPATH=research/candidate-easychart \
            python -m unittest \
              research/candidate-easychart/tests/test_market_v18_trendline.py \
              research/candidate-easychart/tests/test_market_v19_trendline.py -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/candidate-easychart/market_v18_trendline.py \
            research/candidate-easychart/tests/test_market_v18_trendline.py
          git diff --cached --check
          git commit -m "candidate-easychart: make trendline feasible set numerically exact"
          git push origin HEAD:research/candidate-easychart
