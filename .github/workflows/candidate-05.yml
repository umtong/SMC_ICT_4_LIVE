name: candidate-05-nautilus-stage

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/**"
      - ".github/workflows/candidate-05.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  staged-btc-weeks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed research environment
        run: |
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v
          python research/candidate-05/select_weeks.py

      - name: Run frozen BTC weekly gates sequentially through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-05
          python research/candidate-05/candidate.py pipeline \
            --config research/candidate-05/config.json \
            --weeks research/candidate-05/weeks.json \
            --cache .cache/candidate-05 \
            --output artifacts/candidate-05 \
            --max-weeks 3 \
            | tee artifacts/candidate-05/console.json

      - name: Preserve observational diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/candidate-05/raw-klines
          if compgen -G '.cache/candidate-05/klines/*.zip' > /dev/null; then
            cp .cache/candidate-05/klines/*.zip artifacts/candidate-05/raw-klines/
          fi

      - name: Verify and print available stage evidence
        if: always()
        shell: bash
        run: |
          if test -f artifacts/candidate-05/pipeline_summary.json; then
            python -m json.tool artifacts/candidate-05/pipeline_summary.json
          fi
          for stage in artifacts/candidate-05/week-*; do
            test -d "$stage" || continue
            if test -f "$stage/metrics.json"; then
              python -m json.tool "$stage/metrics.json"
              test -s "$stage/run.json"
              test -s "$stage/data_manifest.json"
              test -s "$stage/orders.csv"
              test -s "$stage/positions.csv"
              test -s "$stage/account.csv"
              test -s "$stage/equity.csv"
              test -s "$stage/scenario_events.jsonl"
              test -s "$stage/strategy_diagnostics.json"
            fi
            if test -f "$stage/errors.log"; then
              cat "$stage/errors.log"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-staged-${{ github.sha }}
          path: |
            artifacts/candidate-05/pipeline_summary.json
            artifacts/candidate-05/console.json
            artifacts/candidate-05/raw-klines/*.zip
            artifacts/candidate-05/week-*/metrics.json
            artifacts/candidate-05/week-*/run.json
            artifacts/candidate-05/week-*/data_manifest.json
            artifacts/candidate-05/week-*/raw_evidence.json
            artifacts/candidate-05/week-*/features.csv.gz
            artifacts/candidate-05/week-*/orders.csv
            artifacts/candidate-05/week-*/positions.csv
            artifacts/candidate-05/week-*/account.csv
            artifacts/candidate-05/week-*/equity.csv
            artifacts/candidate-05/week-*/scenario_events.jsonl
            artifacts/candidate-05/week-*/strategy_diagnostics.json
            artifacts/candidate-05/week-*/closed_scenarios.json
            artifacts/candidate-05/week-*/order_rejections.json
            artifacts/candidate-05/week-*/errors.log
          if-no-files-found: warn
          retention-days: 90
