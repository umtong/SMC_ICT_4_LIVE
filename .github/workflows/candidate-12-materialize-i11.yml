name: candidate-12-materialize-i11

on:
  push:
    branches: ["research/candidate-12"]
    paths:
      - "research/candidate-12/update-i11.part*"
      - ".github/workflows/candidate-12-materialize-i11.yml"

permissions:
  contents: write

concurrency:
  group: candidate-12-materialize-i11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install reviewed I11 source atomically
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/candidate-12
          P0="$ROOT/update-i11.part00"
          P1="$ROOT/update-i11.part01"
          P2A="$ROOT/update-i11.part02a"
          P2B="$ROOT/update-i11.part02b"
          P3="$ROOT/update-i11.part03"

          echo "51d8f578aa527e37753e879ca7e6f5c7f395670fa4a7f51e515eb9657a6c8c41  $P0" | sha256sum -c -
          echo "106c92dca6aec9b9e1c971c2c9b59eae5ccdd6e1add020320c55c0c5020ec048  $P1" | sha256sum -c -
          echo "57cf051970c5dfba78807465bf36f6711a60fa485678224f391711bf387b4074  $P2A" | sha256sum -c -
          echo "be771dadf6e57a91a30043471e6c1e99c98277cf135ec84db148370745e418d6  $P2B" | sha256sum -c -
          echo "b0b391e4f2432624865c6152222175e97ddd59305a1d944f4506fd0e4dd95da1  $P3" | sha256sum -c -

          cat "$P0" "$P1" "$P2A" "$P2B" "$P3" > /tmp/candidate-12-i11.b64
          echo "f94649219aae8a97b57d603d00483a32bdd63db5b9ace65200b041a65dfdca47  /tmp/candidate-12-i11.b64" | sha256sum -c -
          base64 -d /tmp/candidate-12-i11.b64 > /tmp/candidate-12-i11.tar.gz
          echo "6b315b6a4c98dd459e983d752af1e649f1a9f5201a7334fe8620232dab100e4d  /tmp/candidate-12-i11.tar.gz" | sha256sum -c -

          rm -rf /tmp/candidate-12-i11
          mkdir -p /tmp/candidate-12-i11
          tar -xzf /tmp/candidate-12-i11.tar.gz -C /tmp/candidate-12-i11

          SRC=/tmp/candidate-12-i11/research/candidate-12
          echo "2583d83f7d5605354892311c24d32c111dc7c1450719866d9fc9c43d07156575  $SRC/logic.py" | sha256sum -c -
          echo "8e7a111a5e20db965e9fdafa67118e4dffd407677708d3ccdde4f333264c3f0b  $SRC/test_logic.py" | sha256sum -c -
          echo "a75747a9be29dfe55b22cb5f78769ac0f89e595f7f1bf284ff5d76b0c6555187  $SRC/config.json" | sha256sum -c -

          cp "$SRC/logic.py" "$ROOT/logic.py"
          cp "$SRC/test_logic.py" "$ROOT/test_logic.py"
          cp "$SRC/config.json" "$ROOT/config.json"
          python -m compileall -q "$ROOT"
          python -m json.tool "$ROOT/config.json" >/dev/null

          git rm "$P0" "$P1" "$P2A" "$P2B" "$P3" \
            .github/workflows/candidate-12-materialize-i11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$ROOT/logic.py" "$ROOT/test_logic.py" "$ROOT/config.json"
          git commit -m "candidate-12: install I11 local reacceleration source"
          git push origin HEAD:research/candidate-12
