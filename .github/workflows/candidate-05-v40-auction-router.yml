name: candidate-05-v40-auction-router

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/strategy_v40_auction_router.py"
      - ".github/workflows/candidate-05-v40-auction-router.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v40-auction-router
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  frozen-btc-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v40
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed environment and contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover -s research/candidate-05/tests -p 'test_*.py' -v
      - name: Select v40 in the isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-05/strategy.py /tmp/candidate05-strategy.py
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('research/candidate-05/strategy.py')
          source=path.read_text()
          pattern=re.compile(r'^from\s+strategy_v26\s+import\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+as\s+([A-Za-z_][A-Za-z0-9_]*))?\s*$',re.MULTILINE)
          match=pattern.search(source)
          if match is None:
              raise RuntimeError(f'v26 active import not found: {source!r}')
          exported=match.group(2) or match.group(1)
          replacement=f'from strategy_v40_auction_router import MultiCauseAuctionRouterStrategy as {exported}'
          path.write_text(pattern.sub(replacement,source,count=1))
          PY
      - name: Run frozen BTC stages with NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-05/candidate.py pipeline \
            --config research/candidate-05/config.json \
            --weeks research/candidate-05/weeks.json \
            --cache .cache/candidate-05-v40 \
            --output "$ROOT" \
            --max-weeks 3 2>&1 | tee "$ROOT/console.log"
      - name: Verify evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('artifacts/candidate-05-v40')
          rows=[]
          for path in sorted(root.rglob('metrics.json')):
              data=json.loads(path.read_text())
              for key in ('liquidations','order_rejections','order_denials'):
                  assert int(data.get(key,0) or 0)==0,(path,key,data.get(key))
              assert int(data.get('max_open_positions_observed',0) or 0)<=1
              assert int(data.get('max_entry_intents_observed',0) or 0)<=1
              rows.append({'path':str(path),'metrics':data})
          if not rows: raise RuntimeError('no v40 metrics')
          summary={'schema':'candidate-05-v40-frozen-btc-v1','engine':'NautilusTrader BacktestNode','strategy':'strategy_v40_auction_router:MultiCauseAuctionRouterStrategy','stages_completed':len(rows),'evidence':rows}
          (root/'v40_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Restore committed active strategy
        if: always()
        shell: bash
        run: cp /tmp/candidate05-strategy.py research/candidate-05/strategy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v40-auction-router-${{ github.sha }}
          path: artifacts/candidate-05-v40/**
          if-no-files-found: error
          retention-days: 90
