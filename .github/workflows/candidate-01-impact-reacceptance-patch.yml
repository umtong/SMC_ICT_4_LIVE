name: candidate-01-impact-reacceptance-patch

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-impact-reacceptance-patch.yml"
      - "research/candidate-01/apply_impact_reacceptance_exit.py"
      - "tests/test_candidate_01_impact_reacceptance.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply causal reacceptance exit
        run: python3 research/candidate-01/apply_impact_reacceptance_exit.py
      - name: Verify execution and causality invariants
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/impact_regime_probe.py \
                tests/test_candidate_01_impact_reacceptance.py
              python -m unittest discover -s tests -p "test_candidate_01_impact_*.py" -v
            '
      - name: Persist verified reacceptance exit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/impact_regime_probe.py
          git commit -m "feat(candidate-01): exit on outside-value reacceptance"
          git push origin HEAD:research/candidate-01
