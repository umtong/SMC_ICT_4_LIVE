name: Candidate 09 Candidate 12 no-London-high ablation

on:
  push:
    branches: [research/candidate-09]
    paths:
      - .github/workflows/candidate-09-c12-no-london-high.yml
      - research/candidate-09/c12_no_london_high/apply_no_london_high.py

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-c12-no-london-high
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      C12_SOURCE_SHA: 6a28ed92f3320fa2a6841e113e6ecf6e46f8d1fd

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09-c12-continuous
          key: candidate-09-c12-monthly-klines-v2
          restore-keys: candidate-09-c12-monthly-klines-v1

      - name: Materialize exact I13 and the single source-family ablation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "$C12_SOURCE_SHA"
          root=research/candidate-09/c12_no_london_high
          source=$root/source
          rm -rf "$source" "$root/result"
          mkdir -p "$source"
          tmp=$(mktemp -d)
          git archive "$C12_SOURCE_SHA" research/candidate-12 | tar -x -C "$tmp"
          cp -a "$tmp/research/candidate-12/." "$source/"
          cp "$source/data_loader.py" "$source/data_loader_daily.py"
          test "$(git hash-object "$source/logic.py")" = "1636e30cc3705dc7f3ae77c4117169fdfa1fe468"
          cp research/candidate-09/c12_continuous/apply_monthly_loader.py "$root/apply_monthly_loader_runtime.py"
          cp research/candidate-09/c12_continuous/apply_protective_stop_fallback.py "$root/apply_stop_runtime.py"
          cp research/candidate-09/c12_continuous/run_continuous.py "$root/run_continuous.py"
          python "$root/apply_monthly_loader_runtime.py"
          python "$root/apply_stop_runtime.py"
          python "$root/apply_no_london_high.py"
          python - <<'PY'
          from pathlib import Path
          p=Path('research/candidate-09/c12_no_london_high/run_continuous.py')
          text=p.read_text().replace('candidate-09-c12-i13-continuous','candidate-09-c12-no-london-high-continuous')
          text=text.replace('frozen Candidate 12 I13 state-priced reacceleration router','frozen Candidate 12 I13 without LONDON_HIGH source pools')
          p.write_text(text)
          PY
          test "$(grep -c NO_LONDON_HIGH_SOURCE_ABLATION "$source/strategy_adapter.py")" -ge 2

      - name: Verify transport parity
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09/c12_no_london_high
          export PYTHONPATH="$GITHUB_WORKSPACE/$root/source:$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import importlib.util, json, sys
          from datetime import date
          from pathlib import Path
          import pandas as pd
          root=Path('research/candidate-09/c12_no_london_high'); source=root/'source'; sys.path.insert(0,str(source.resolve()))
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); module=importlib.util.module_from_spec(spec); sys.modules[name]=module; spec.loader.exec_module(module); return module
          daily=load('c12_ablation_daily',source/'data_loader_daily.py')
          monthly=load('c12_ablation_monthly',source/'data_loader.py')
          cache=Path('.cache/candidate-09-c12-continuous')
          d,_=daily.load_binance_bars('BTCUSDT',date(2025,12,24),date(2025,12,24),cache)
          m,_=monthly.load_binance_bars('BTCUSDT',date(2025,12,24),date(2025,12,24),cache)
          pd.testing.assert_frame_equal(d,m,check_exact=True)
          (root/'transport_parity.json').write_text(json.dumps({'rows':len(d)},indent=2)+'\n')
          PY

      - name: Run continuous 2022 through 2025 ablation
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09/c12_no_london_high
          export PYTHONPATH="$GITHUB_WORKSPACE/$root/source:$GITHUB_WORKSPACE/src"
          smc4 doctor | tee "$root/doctor.txt"
          python -m compileall -q "$root"
          mkdir -p "$root/result" .cache/candidate-09-c12-continuous
          ln -s "$GITHUB_WORKSPACE/.cache/candidate-09-c12-continuous" "$root/result/data"
          python "$root/run_continuous.py" |& tee "$root/run.txt"
          rm -f "$root/result/data"
          [[ -f "$root/result/scenario_events.raw.jsonl" ]] && gzip -f "$root/result/scenario_events.raw.jsonl"
          [[ -f "$root/result/scenario_events.jsonl" ]] && gzip -f "$root/result/scenario_events.jsonl"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-c12-no-london-high-${{ github.run_id }}
          path: research/candidate-09/c12_no_london_high
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09/c12_no_london_high
          [[ -f "$root/result/FINAL_DECISION.json" ]] || exit 0
          tmp=$(mktemp -d); mkdir -p "$tmp/result"
          for name in FINAL_DECISION.json metrics.json positions.csv orders.csv account.csv submitted_plans.json order_lifecycle.json data_manifest.json run.json; do [[ -f "$root/result/$name" ]] && cp "$root/result/$name" "$tmp/result/$name"; done
          for name in continuous_config.json transport_parity.json doctor.txt run.txt; do [[ -f "$root/$name" ]] && cp "$root/$name" "$tmp/$name"; done
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name candidate-09-research-bot; git config user.email candidate-09-research-bot@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"; git reset --hard "origin/$GITHUB_REF_NAME"
          rm -rf "$root/result"; mkdir -p "$root/result"; cp -a "$tmp/result/." "$root/result/"
          for name in continuous_config.json transport_parity.json doctor.txt run.txt; do [[ -f "$tmp/$name" ]] && cp "$tmp/$name" "$root/$name"; done
          git add "$root/result" "$root/continuous_config.json" "$root/transport_parity.json" "$root/doctor.txt" "$root/run.txt"
          git diff --cached --quiet && exit 0
          status=$(python -c "import json;print(json.load(open('$root/result/FINAL_DECISION.json'))['status'])")
          git commit -m "candidate-09 Candidate 12 no-London-high: ${status}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
