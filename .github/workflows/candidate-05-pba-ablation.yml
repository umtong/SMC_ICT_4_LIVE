name: candidate-05-pba-ablation

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/strategy_v23.py"
      - "research/candidate-05/strategy.py"
      - ".github/workflows/candidate-05-pba-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  frozen-week2-week3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed research environment
        run: |
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest discover \
            -s research/candidate-05/tests \
            -p 'test_*.py' -v

      - name: Run frozen BTC weeks 2 and 3 through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-05-pba-ablation/week-2
          mkdir -p artifacts/candidate-05-pba-ablation/week-3

          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-01-13 \
            --build-end 2024-01-21 \
            --evaluation-start 2024-01-15 \
            --evaluation-end 2024-01-21 \
            --cache .cache/candidate-05-pba-ablation/week-2 \
            --output artifacts/candidate-05-pba-ablation/week-2 \
            | tee artifacts/candidate-05-pba-ablation/week-2/console.json

          python research/candidate-05/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2023-09-06 \
            --build-end 2023-09-14 \
            --evaluation-start 2023-09-08 \
            --evaluation-end 2023-09-14 \
            --cache .cache/candidate-05-pba-ablation/week-3 \
            --output artifacts/candidate-05-pba-ablation/week-3 \
            | tee artifacts/candidate-05-pba-ablation/week-3/console.json

      - name: Verify and print evidence
        if: always()
        shell: bash
        run: |
          for stage in artifacts/candidate-05-pba-ablation/week-2 artifacts/candidate-05-pba-ablation/week-3; do
            if test -f "$stage/metrics.json"; then
              python -m json.tool "$stage/metrics.json"
              test -s "$stage/run.json"
              test -s "$stage/data_manifest.json"
              test -s "$stage/orders.csv"
              test -s "$stage/positions.csv"
              test -s "$stage/account.csv"
              test -s "$stage/equity.csv"
              test -s "$stage/scenario_events.jsonl"
              test -s "$stage/strategy_diagnostics.json"
            fi
            if test -f "$stage/errors.log"; then
              cat "$stage/errors.log"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-pba-ablation-${{ github.sha }}
          path: |
            artifacts/candidate-05-pba-ablation/week-2/**
            artifacts/candidate-05-pba-ablation/week-3/**
          if-no-files-found: warn
          retention-days: 90
