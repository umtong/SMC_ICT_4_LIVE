name: fix-direct-auction-leader

on:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - ".github/workflows/fix-direct-auction-leader.yml"

concurrency:
  group: fix-direct-auction-leader
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML_thinking
          fetch-depth: 1
          persist-credentials: true
      - name: Patch all-NaN dynamic leader warmup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-direct-auction-policy/direct_state_action_harvest.py")
          text = path.read_text(encoding="utf-8")
          old = '''    leader_name = rolling_activity.idxmax(axis=1)\n    for h in (1, 2, 5, 10, 15):\n'''
          new = '''    # Warmup rows can be all-NaN across every symbol.  ``idxmax`` raises on\n    # that state, and choosing an arbitrary symbol would contaminate the leader\n    # features.  Select on a filled view, then explicitly restore NaN wherever\n    # no causal rolling-liquidity observation exists yet.\n    all_missing_leader = rolling_activity.isna().all(axis=1)\n    leader_name = rolling_activity.fillna(-float("inf")).idxmax(axis=1)\n    leader_name = leader_name.mask(all_missing_leader)\n    for h in (1, 2, 5, 10, 15):\n'''
          if old not in text:
              raise RuntimeError("expected leader snippet not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile \
            research/candidate-direct-auction-policy/direct_state_action_harvest.py \
            research/candidate-direct-auction-policy/run_direct_state_action_harvest.py \
            research/candidate-direct-auction-policy/self_check_direct_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-direct-auction-policy/direct_state_action_harvest.py
          git rm -f .github/workflows/fix-direct-auction-leader.yml
          git commit -m "Handle missing dynamic leader during causal warmup"
          git push origin HEAD:research_ML_thinking
