name: candidate-08-pyo3-production-adapter-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-pyo3-production-adapter-v2"

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-pyo3-production-adapter-v2
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize native production adapter and update its semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/candidate-08-pyo3-production-adapter-v1.yml")
          text = path.read_text(encoding="utf-8")

          def extract(name: str) -> str:
              step = f"      - name: {name}\n"
              start = text.index(step)
              run = text.index("        run: |\n", start) + len("        run: |\n")
              end = text.find("\n      - name: ", run)
              if end < 0:
                  end = len(text)
              lines = text[run:end].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          patch = extract("Apply only the verified Cython to PyO3 adapter correction")
          verify = extract("Verify contracts and native production smoke")
          replacements = (
              ('if ".orders" in strategy:', 'if "orders.orders" in strategy:', "bracket check"),
              (
                  'if "ReportProvider" in runner or "BacktestEngineConfig" in runner:',
                  'if "ReportProvider" in runner or "from nautilus_trader.config import BacktestEngineConfig" in runner:',
                  "engine check",
              ),
          )
          for old, new, label in replacements:
              if patch.count(old) != 1:
                  raise SystemExit(f"{label} anchor was not unique")
              patch = patch.replace(old, new)
          old_verify = 'assert ".orders" not in strategy_source'
          if verify.count(old_verify) != 1:
              raise SystemExit("verify bracket anchor was not unique")
          verify = verify.replace(old_verify, 'assert "orders.orders" not in strategy_source')
          Path("/tmp/candidate08_patch.sh").write_text(patch, encoding="utf-8")
          Path("/tmp/candidate08_verify.sh").write_text(verify, encoding="utf-8")
          PY

          bash /tmp/candidate08_patch.sh

          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-08/aggtrade_acceptance_strategy.py")
          source = path.read_text(encoding="utf-8")
          declaration = "class AggTradeAcceptanceStrategy(Strategy):"
          if source.count(declaration) != 1:
              raise SystemExit("native Strategy class declaration mismatch")
          insert_at = source.index("\n", source.index(declaration)) + 1
          bridge = (
              "    def __new__(\n"
              "        cls,\n"
              "        config: AggTradeAcceptanceStrategyConfig,\n"
              "        *_args: Any,\n"
              "        **_kwargs: Any,\n"
              "    ) -> Any:\n"
              "        # The pinned PyO3 base accepts only StrategyConfig at allocation time.\n"
              "        # Candidate-specific immutable schedules remain Python-side __init__ inputs.\n"
              "        return super().__new__(cls, config)\n"
              "\n"
          )
          if "return super().__new__(cls, config)" in source:
              raise SystemExit("native Strategy allocation bridge already exists unexpectedly")
          source = source[:insert_at] + bridge + source[insert_at:]
          old_init = "        super().__init__(config=config)\n"
          if source.count(old_init) != 1:
              raise SystemExit("native Strategy base initialization anchor mismatch")
          source = source.replace(old_init, "        super().__init__(config)\n")
          path.write_text(source, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-08/test_aggtrade_acceptance_pure.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '        self.assertIn("starting_balances=[Money(float(config[\\"starting_nav_usdt\\"]), USDT)]", source)\n':
                  '        self.assertEqual(source.count("engine.add_venue("), 1)\n'
                  '        self.assertEqual(source.count("nautilus_pyo3.BacktestEngine("), 1)\n'
                  '        self.assertIn("nautilus_pyo3.Money.from_str(", source)\n'
                  '        self.assertIn("config[\'starting_nav_usdt\']", source)\n'
                  '        self.assertIn("base_currency=NATIVE_USDT", source)\n',
              '        self.assertIn("engine.add_data(all_mark_price_updates, sort=False)", source)\n':
                  '        self.assertIn("engine.add_data(native_mark_price_updates, sort=False)", source)\n',
              '        self.assertIn("engine.add_data(all_funding_updates, sort=False)", source)\n':
                  '        self.assertIn("engine.add_data(native_funding_updates, sort=False)", source)\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"native static contract anchor mismatch: {old!r}")
              source = source.replace(old, new)
          anchor = '        self.assertEqual(source.count("self.submit_order_list(orders)"), 1)\n'
          if source.count(anchor) != 1:
              raise SystemExit("native strategy contract anchor mismatch")
          source = source.replace(
              anchor,
              anchor
              + '        self.assertIn("return super().__new__(cls, config)", source)\n'
              + '        self.assertIn("super().__init__(config)", source)\n'
              + '        self.assertIn("entry_order, stop_order, target_order = orders", source)\n'
              + '        self.assertNotIn("orders.orders", source)\n',
          )
          path.write_text(source, encoding="utf-8")
          PY

          bash /tmp/candidate08_verify.sh

      - name: Commit only verified production and contract files
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f research/candidate-08/.run-pyo3-production-adapter-v2
          git add -A -- \
            research/candidate-08/aggtrade_acceptance_strategy.py \
            research/candidate-08/run_aggtrade_acceptance_nautilus.py \
            research/candidate-08/test_aggtrade_acceptance_pure.py \
            research/candidate-08/.run-pyo3-production-adapter-v2
          git commit -m "candidate-08: use verified native Nautilus production adapter [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1
