name: Candidate 06 Open-Interest Inventory Regime Relay

on:
  push:
    branches: [research/candidate-06]
    paths:
      - ".github/workflows/candidate-06-oiir.yml"
      - "research/candidate-06/open_interest_inventory_regime_engine.py"
      - "research/candidate-06/open_interest_inventory_nautilus_runner.py"
      - "research/candidate-06/run_open_interest_inventory_validation.py"
      - "research/candidate-06/run_open_interest_inventory_matrix.py"
      - "research/candidate-06/test_open_interest_inventory_regime_engine.py"
      - "research/candidate-06/test_oiir_runner_contract.py"
      - "research/candidate-06/OIIR_RESEARCH_LEDGER.md"
      - "research/candidate-06/futures_metrics_data.py"
      - "research/candidate-06/market_data.py"
      - "research/candidate-06/nautilus_runner.py"
      - "research/candidate-06/nautilus_strategy.py"
      - "research/candidate-06/nautilus_execution.py"
      - "research/candidate-06/nautilus_lifecycle.py"
      - "research/candidate-06/run_validation.py"
      - "research/candidate-06/config.json"
      - "src/smc_ict_4/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-open-interest-inventory-regime
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  oiir-campaign:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Verify OIIR causality and Nautilus contracts
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_futures_metrics_data.py
          python research/candidate-06/test_futures_metrics_timestamp_contract.py
          python research/candidate-06/test_open_interest_inventory_regime_engine.py
          python research/candidate-06/test_oiir_runner_contract.py
          python research/candidate-06/test_signal_submission_timing_contract.py

      - name: Run OIIR first-week matrix and conditional sealed weeks through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/oiir-first-week
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_open_interest_inventory_matrix.py \
            --output artifacts/candidate-06/oiir-first-week \
            > artifacts/candidate-06-oiir.stdout \
            2> artifacts/candidate-06-oiir.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/candidate-06/oiir-first-week
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > artifacts/candidate-06/oiir-first-week/workflow_exit_code.txt
          cp artifacts/candidate-06-oiir.stdout artifacts/candidate-06/oiir-first-week/workflow_stdout.txt 2>/dev/null || true
          cp artifacts/candidate-06-oiir.stderr artifacts/candidate-06/oiir-first-week/workflow_stderr.txt 2>/dev/null || true
          if [ ! -f artifacts/candidate-06/oiir-first-week/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-06/oiir-first-week")
          payload = {
              "all_three_weeks_passed": False,
              "long_evaluation_authorized": False,
              "selected": None,
              "terminal_status": "IMPLEMENTATION_OR_DATA_FAILURE_BEFORE_SUMMARY",
          }
          (root / "summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          if [ "$code" -ne 0 ]; then
            echo "--- OIIR STDERR ---"
            tail -n 240 artifacts/candidate-06-oiir.stderr || true
            echo "--- OIIR SUMMARY ---"
            cat artifacts/candidate-06/oiir-first-week/summary.json || true
          fi

      - name: Commit reproducible OIIR evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/oiir-first-week
          if [ -f research/candidate-06/config.oiir.locked.json ]; then
            git add -f research/candidate-06/config.oiir.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 OIIR evidence [candidate-06 evidence]"
          git pull --rebase origin research/candidate-06
          git push origin HEAD:research/candidate-06

      - name: Enforce staged decision
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
