name: candidate-05-v50c-parallel-analog

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - "research/candidate-05/v50_order_capture_v2.py"
      - "research/candidate-05/strategy_v50c_candidate_recorder.py"
      - "research/candidate-05/strategy_v50c_analog_selector.py"
      - ".github/workflows/candidate-05-v50c-parallel-analog.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v50c-parallel-analog
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          python -m unittest research/candidate-05/tests/test_strategy_v50b_contract.py -v

  record:
    needs: contracts
    strategy:
      fail-fast: true
      matrix:
        include:
          - {label: train, warmup: '2022-12-30', start: '2023-01-01', end: '2023-03-31'}
          - {label: validation, warmup: '2023-03-30', start: '2023-04-01', end: '2023-06-30'}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      LABEL: ${{ matrix.label }}
      WARMUP: ${{ matrix.warmup }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      ROOT: artifacts/v50c/${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Build period and select recorder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,re
          source=json.loads(Path('research/candidate-05/weeks.json').read_text());changed=False
          def visit(value):
              global changed
              if isinstance(value,dict):return {key:visit(item) for key,item in value.items()}
              if isinstance(value,list) and not changed and value and all(isinstance(item,dict) for item in value):
                  keys=set().union(*(item.keys() for item in value))
                  if any(key in keys for key in ('start','evaluation_start','eval_start')) and any(key in keys for key in ('end','evaluation_end','eval_end')):
                      item=dict(value[0])
                      for key in tuple(item):
                          low=key.lower()
                          if 'warmup' in low and ('start' in low or low=='warmup'):item[key]=os.environ['WARMUP']
                          elif low in ('start','evaluation_start','eval_start'):item[key]=os.environ['START']
                          elif low in ('end','evaluation_end','eval_end'):item[key]=os.environ['END']
                          elif low in ('name','label','stage'):item[key]=f"v50c-{os.environ['LABEL']}"
                      changed=True;return [item]
              if isinstance(value,list):return [visit(item) for item in value]
              return value
          result=visit(source)
          if not changed:raise RuntimeError('stage list not found')
          Path('/tmp/v50c-period.json').write_text(json.dumps(result,indent=2))
          p=Path('research/candidate-05/strategy.py');s=p.read_text();pattern=re.compile(r'^from\s+strategy_v26\s+import\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+as\s+([A-Za-z_][A-Za-z0-9_]*))?\s*$',re.MULTILINE);m=pattern.search(s)
          if m is None:raise RuntimeError(f'v26 import not found: {s!r}')
          exported=m.group(2) or m.group(1);p.write_text(pattern.sub(f'from strategy_v50c_candidate_recorder import RobustActualOrderCandidateRecorderStrategy as {exported}',s,count=1))
          PY
      - name: Record all completed candidates in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/candidate.py pipeline --config research/candidate-05/config.json --weeks /tmp/v50c-period.json --cache ".cache/candidate-05-v50c-${LABEL}" --output "$ROOT" --max-weeks 1 2>&1 | tee "$ROOT/console.log"
      - uses: actions/upload-artifact@v4
        with:
          name: v50c-record-${{ matrix.label }}
          path: artifacts/v50c/${{ matrix.label }}/**
          if-no-files-found: error
          retention-days: 30

  model:
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      passed: ${{ steps.train.outputs.passed }}
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/v50c-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v50c-record-train
          path: artifacts/records/train
      - uses: actions/download-artifact@v4
        with:
          name: v50c-record-validation
          path: artifacts/records/validation
      - name: Train fixed analog model
        id: train
        shell: bash
        run: |
          set +e
          mkdir -p "$ROOT"
          python research/candidate-05/train_v50_analog_model.py --train-root artifacts/records/train --validation-root artifacts/records/validation --cache .cache/candidate-05-v50c-labels --output "$ROOT/v50_model.json" 2>&1 | tee "$ROOT/console.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ -f "$ROOT/v50_model.json" ] && python -c "import json;assert json.load(open('$ROOT/v50_model.json'))['validation_pass'] is True";then echo 'passed=true' >> "$GITHUB_OUTPUT";else echo 'passed=false' >> "$GITHUB_OUTPUT";fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v50c-model
          path: artifacts/v50c-model/**
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: model
    if: needs.model.outputs.passed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/v50c-evaluation
      CANDIDATE05_V50_MODEL: ${{ github.workspace }}/artifacts/model/v50_model.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v50c-model
          path: artifacts/model
      - name: Select frozen selector and build continuous periods
        shell: bash
        run: |
          cp artifacts/model/v50_model.json research/candidate-05/v50_model.json
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('research/candidate-05/strategy.py');s=p.read_text();pattern=re.compile(r'^from\s+strategy_v26\s+import\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+as\s+([A-Za-z_][A-Za-z0-9_]*))?\s*$',re.MULTILINE);m=pattern.search(s);exported=m.group(2) or m.group(1);p.write_text(pattern.sub(f'from strategy_v50c_analog_selector import RobustActualOrderAnalogStrategy as {exported}',s,count=1))
          source=json.loads(Path('research/candidate-05/weeks.json').read_text())
          def make(label,warmup,start,end):
              changed=False
              def visit(value):
                  nonlocal changed
                  if isinstance(value,dict):return {key:visit(item) for key,item in value.items()}
                  if isinstance(value,list) and not changed and value and all(isinstance(item,dict) for item in value):
                      keys=set().union(*(item.keys() for item in value))
                      if any(key in keys for key in ('start','evaluation_start','eval_start')) and any(key in keys for key in ('end','evaluation_end','eval_end')):
                          item=dict(value[0])
                          for key in tuple(item):
                              low=key.lower()
                              if 'warmup' in low and ('start' in low or low=='warmup'):item[key]=warmup
                              elif low in ('start','evaluation_start','eval_start'):item[key]=start
                              elif low in ('end','evaluation_end','eval_end'):item[key]=end
                              elif low in ('name','label','stage'):item[key]=label
                          changed=True;return [item]
                  if isinstance(value,list):return [visit(item) for item in value]
                  return value
              result=visit(source)
              if not changed:raise RuntimeError('stage list not found')
              return result
          Path('/tmp/v50c-30d.json').write_text(json.dumps(make('continuous-30d','2024-02-28','2024-03-01','2024-03-30'),indent=2));Path('/tmp/v50c-91d.json').write_text(json.dumps(make('continuous-91d','2024-02-28','2024-03-01','2024-05-30'),indent=2))
          PY
      - name: Run frozen stages
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/frozen"
          python research/candidate-05/candidate.py pipeline --config research/candidate-05/config.json --weeks research/candidate-05/weeks.json --cache .cache/candidate-05-v50c-eval --output "$ROOT/frozen" --max-weeks 3 2>&1 | tee "$ROOT/frozen-console.log"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('artifacts/v50c-evaluation/frozen')
          def v(d,*names,default=0):
              for n in names:
                  if d.get(n) is not None:return d[n]
              return default
          rows=[]
          for p in sorted(root.rglob('metrics.json')):
              d=json.loads(p.read_text());growth=float(v(d,'geometric_daily_growth','geometric_daily_nav_growth',default=0) or 0);trades=int(v(d,'trades','trade_count',default=0) or 0);wins=int(v(d,'wins','winning_trades',default=0) or 0);active=int(v(d,'active_days','trading_days',default=0) or 0);dd=float(v(d,'max_drawdown','maximum_drawdown',default=0) or 0);integrity=int(d.get('liquidations',0) or 0)==0 and int(d.get('order_rejections',0) or 0)==0 and int(d.get('order_denials',0) or 0)==0 and int(d.get('max_open_positions_observed',0) or 0)<=1 and int(d.get('max_entry_intents_observed',0) or 0)<=1;passed=integrity and growth>=.01 and trades>=7 and wins>=4 and active>=4 and dd<=.20;rows.append({'path':str(p),'growth':growth,'total_return':float(v(d,'total_return',default=0) or 0),'trades':trades,'wins':wins,'active_days':active,'max_drawdown':dd,'integrity':integrity,'pass':passed})
          passed=len(rows)>=3 and all(row['pass'] for row in rows[:3]);Path('artifacts/v50c-evaluation/frozen-assessment.json').write_text(json.dumps({'rows':rows,'pass':passed},indent=2,sort_keys=True));print(json.dumps({'rows':rows,'pass':passed},indent=2,sort_keys=True));open(os.environ['GITHUB_OUTPUT'],'a').write(f'passed={str(passed).lower()}\n')
          PY
      - name: Run continuous 30d
        if: steps.frozen.outputs.passed == 'true'
        id: d30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/30d"
          python research/candidate-05/candidate.py pipeline --config research/candidate-05/config.json --weeks /tmp/v50c-30d.json --cache .cache/candidate-05-v50c-eval --output "$ROOT/30d" --max-weeks 1 2>&1 | tee "$ROOT/30d-console.log"
          python - <<'PY'
          from pathlib import Path
          import json,os
          files=sorted(Path('artifacts/v50c-evaluation/30d').rglob('metrics.json'))
          if not files:raise RuntimeError('no 30d metrics')
          d=json.loads(files[0].read_text())
          def v(*names,default=0):
              for n in names:
                  if d.get(n) is not None:return d[n]
              return default
          growth=float(v('geometric_daily_growth','geometric_daily_nav_growth',default=0) or 0);trades=int(v('trades','trade_count',default=0) or 0);wins=int(v('wins','winning_trades',default=0) or 0);active=int(v('active_days','trading_days',default=0) or 0);integrity=int(d.get('liquidations',0) or 0)==0 and int(d.get('order_rejections',0) or 0)==0 and int(d.get('order_denials',0) or 0)==0 and int(d.get('max_open_positions_observed',0) or 0)<=1 and int(d.get('max_entry_intents_observed',0) or 0)<=1;passed=integrity and growth>=.01 and trades>=20 and wins>=12 and active>=15;out={'growth':growth,'total_return':float(v('total_return',default=0) or 0),'trades':trades,'wins':wins,'active_days':active,'max_drawdown':float(v('max_drawdown','maximum_drawdown',default=0) or 0),'integrity':integrity,'pass':passed};Path('artifacts/v50c-evaluation/30d-assessment.json').write_text(json.dumps(out,indent=2,sort_keys=True));print(json.dumps(out,indent=2,sort_keys=True));open(os.environ['GITHUB_OUTPUT'],'a').write(f'passed={str(passed).lower()}\n')
          PY
      - name: Run continuous 91d
        if: steps.d30.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/91d"
          python research/candidate-05/candidate.py pipeline --config research/candidate-05/config.json --weeks /tmp/v50c-91d.json --cache .cache/candidate-05-v50c-eval --output "$ROOT/91d" --max-weeks 1 2>&1 | tee "$ROOT/91d-console.log"
          python - <<'PY'
          from pathlib import Path
          import json
          files=sorted(Path('artifacts/v50c-evaluation/91d').rglob('metrics.json'))
          if not files:raise RuntimeError('no 91d metrics')
          d=json.loads(files[0].read_text())
          def v(*names,default=0):
              for n in names:
                  if d.get(n) is not None:return d[n]
              return default
          growth=float(v('geometric_daily_growth','geometric_daily_nav_growth',default=0) or 0);trades=int(v('trades','trade_count',default=0) or 0);wins=int(v('wins','winning_trades',default=0) or 0);active=int(v('active_days','trading_days',default=0) or 0);integrity=int(d.get('liquidations',0) or 0)==0 and int(d.get('order_rejections',0) or 0)==0 and int(d.get('order_denials',0) or 0)==0 and int(d.get('max_open_positions_observed',0) or 0)<=1 and int(d.get('max_entry_intents_observed',0) or 0)<=1;passed=integrity and growth>=.01 and trades>=60 and wins>=36 and active>=45;out={'growth':growth,'total_return':float(v('total_return',default=0) or 0),'trades':trades,'wins':wins,'active_days':active,'max_drawdown':float(v('max_drawdown','maximum_drawdown',default=0) or 0),'integrity':integrity,'pass':passed};Path('artifacts/v50c-evaluation/91d-assessment.json').write_text(json.dumps(out,indent=2,sort_keys=True));print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v50c-evaluation
          path: artifacts/v50c-evaluation/**
          if-no-files-found: warn
          retention-days: 90

  commit:
    needs: [model,evaluate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v50c-model
          path: artifacts/model
      - uses: actions/download-artifact@v4
        if: needs.model.outputs.passed == 'true'
        with:
          name: v50c-evaluation
          path: artifacts/evaluation
      - name: Commit authoritative result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          def find(root,name):
              paths=list(Path(root).rglob(name))
              return json.loads(paths[0].read_text()) if paths else None
          model=find('artifacts/model','v50_model.json');frozen=find('artifacts/evaluation','frozen-assessment.json');d30=find('artifacts/evaluation','30d-assessment.json');d91=find('artifacts/evaluation','91d-assessment.json')
          if not model or model.get('validation_pass') is not True:decision='DISCARD_PRE_EVALUATION_VALIDATION'
          elif not frozen or frozen.get('pass') is not True:decision='DISCARD_FROZEN_WEEKS'
          elif not d30 or d30.get('pass') is not True:decision='DISCARD_CONTINUOUS_30D'
          elif not d91 or d91.get('pass') is not True:decision='DISCARD_CONTINUOUS_91D'
          else:decision='PROMOTE_TO_SHARED_ACCOUNT_AND_912D'
          result={'schema':'candidate-05-v50c-result-v1','engine':'NautilusTrader BacktestNode','strategy':'strategy_v50c_analog_selector:RobustActualOrderAnalogStrategy','decision':decision,'model_validation':{key:value for key,value in (model or {}).items() if key!='model'},'frozen':frozen,'continuous_30d':d30,'continuous_91d':d91};Path('research/candidate-05/V50C_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True));print(json.dumps(result,indent=2,sort_keys=True))
          if model and model.get('validation_pass') is True:Path('research/candidate-05/v50_model.json').write_text(json.dumps(model,indent=2,sort_keys=True))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-05/V50C_RESULT.json
          if [ -f research/candidate-05/v50_model.json ];then git add research/candidate-05/v50_model.json;fi
          git commit -m "candidate-05: record v50c parallel analog result [skip ci]"
          git pull --rebase origin research/candidate-05
          git push origin HEAD:research/candidate-05
