name: research-candidate-ml-k-control-transfer-fresh1

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_k]
    paths:
      - '.github/workflows/research-candidate-ml-k-control-transfer-fresh1.yml'
      - 'research/candidate-ml-k-control-transfer/**'

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: research-candidate-ml-k-control-transfer-fresh1
  cancel-in-progress: false

env:
  EPISODE: research/candidate-liquidity-episode-policy-v1
  ROUTER: research/candidate-ml-k-control-transfer/control_transfer_router.py
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  preflight:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 1
      - run: |
          set -euo pipefail
          uv pip install --python /opt/smc4/.venv/bin/python \
            -r "$EPISODE/runtime-requirements.txt" pytest
          python -m py_compile "$ROUTER"
          PYTHONPATH="$(dirname "$ROUTER")" python -m pytest -q \
            research/candidate-ml-k-control-transfer/test_control_transfer_router.py
          python "$EPISODE/reproduce.py" verify \
            --output research_results/candidate_ml_k/control_transfer/fresh1_preflight

  harvest:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { period: fresh1-2024-may, start: '2024-05-12', end: '2024-05-15' }
          - { period: fresh1-2024-nov, start: '2024-11-10', end: '2024-11-13' }
          - { period: fresh1-2025-feb, start: '2025-02-02', end: '2025-02-05' }
          - { period: fresh1-2025-nov, start: '2025-11-02', end: '2025-11-05' }
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    env:
      PERIOD: ${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      CACHE: .cache/candidate_ml_k/control_transfer_fresh1/${{ matrix.period }}
      OUT: artifacts/candidate_ml_k/control_transfer_fresh1/${{ matrix.period }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 1
      - run: |
          set -euo pipefail
          uv pip install --python /opt/smc4/.venv/bin/python \
            -r "$EPISODE/runtime-requirements.txt"
          python "$EPISODE/reproduce.py" harvest \
            --start "$START" --end "$END" --warmup-days 45 \
            --period "$PERIOD" \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mlk-control-fresh1-${{ matrix.period }}
          path: artifacts/candidate_ml_k/control_transfer_fresh1/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  route-and-record:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
    env:
      ROOT: artifacts/candidate_ml_k/control_transfer_fresh1/all_periods
      RESULT: artifacts/candidate_ml_k/control_transfer_fresh1/result
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_k
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mlk-control-fresh1-*
          path: artifacts/candidate_ml_k/control_transfer_fresh1/downloaded
      - run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$RESULT"
          find artifacts/candidate_ml_k/control_transfer_fresh1/downloaded -mindepth 1 -maxdepth 1 -type d -print0 |
          while IFS= read -r -d '' directory; do
            name="${directory##*/}"
            period="${name#mlk-control-fresh1-}"
            mkdir -p "$ROOT/$period"
            cp -a "$directory"/. "$ROOT/$period"/
          done
          python "$ROUTER" --root "$ROOT" --output "$RESULT"
          git rev-parse HEAD > "$RESULT/source_sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mlk-control-transfer-fresh1-result-${{ github.sha }}
          path: artifacts/candidate_ml_k/control_transfer_fresh1/result/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit compact fresh result
        run: |
          set -euo pipefail
          DEST=research_results/candidate_ml_k/control_transfer/fresh1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$RESULT/summary.json" "$DEST/"
          cp "$RESULT/source_sha.txt" "$DEST/"
          for file in selected_orders.csv closed_trades.csv; do
            [ -f "$RESULT/$file" ] && cp "$RESULT/$file" "$DEST/$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "Record ML-k control-transfer fresh1 ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git push origin HEAD:research_candidate_ML_k
