name: candidate-04-v47-session-vwap-negotiation

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v47-session-vwap-negotiation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      ROOT: artifacts/candidate-04-v47-session-vwap-negotiation
      EVIDENCE: research/candidate-04/evidence-v47-session-vwap-negotiation.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Verify complete V47 state and Nautilus execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/directional_session_vwap_negotiation_compiler.py \
            research/candidate-04/nt_backtest_v45_conditional_adverse_fill.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_directional_session_vwap_negotiation_compiler.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_directional_session_vwap_reclaim_compiler.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_conditional_adverse_fill_risk_sizing.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v

      - name: Restore the three predeclared rich BTC observations
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v45b-progressive-untouched-btc-31157625404
          path: restored-v45b
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31157625404
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Define V47 weekly runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/run_v47_week.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          name="$1" build_start="$2" build_end="$3" eval_start="$4" eval_end="$5"
          rich="$(find restored-v45b -type f -path "*${name}/rich/data_manifest.json" -printf '%h\n' | head -n1)"
          test -n "$rich"
          out="$ROOT/$name"
          mkdir -p "$out/signals"
          export C04_BUILD_START="$build_start" C04_BUILD_END="$build_end"
          export C04_EVALUATION_START="$eval_start" C04_EVALUATION_END="$eval_end"
          python research/candidate-04/directional_session_vwap_negotiation_compiler.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$rich" \
            --kline-dir ".cache/candidate-04-v47/compiler/$name" \
            --evaluation-start "$eval_start" \
            --evaluation-end "$eval_end" \
            --output "$out/signals" \
            --download-klines \
            > "$out/compiler.log"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$out/signals/signals.json" \
          python research/candidate-04/nt_backtest_v45_conditional_adverse_fill.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$build_start" \
            --build-end "$build_end" \
            --evaluation-start "$eval_start" \
            --evaluation-end "$eval_end" \
            --cache ".cache/candidate-04-v47/nautilus/$name" \
            --output "$out/nautilus" \
            > "$out/nautilus.log"
          python research/candidate-04/summarize_candidate_week.py \
            --root "$out" \
            --candidate candidate-04-v47-session-vwap-negotiation \
            --stage "$name" \
            --min-trades 1 \
            --min-active-days 1 \
            --min-win-rate 0.0 \
            --min-geometric-daily -1.0 \
            --output "$out/summary.json" \
            > "$out/summary.log"
          SH
          chmod +x /tmp/run_v47_week.sh

      - name: First BTC week
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$ROOT"
          /tmp/run_v47_week.sh \
            untouched_1_2025_07 2025-07-19 2025-07-27 2025-07-21 2025-07-27
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          item = json.loads((root / "untouched_1_2025_07/summary.json").read_text())
          potential = bool(
              item.get("risk_pass")
              and int(item.get("trades") or 0) >= 1
              and float(item.get("total_return") or 0.0) > 0.0
          )
          (root / "first_gate.txt").write_text("pass\n" if potential else "fail\n")
          print(json.dumps({"potential": potential, "summary": item}, indent=2))
          PY

      - name: Second BTC week
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! grep -qx pass "$ROOT/first_gate.txt"; then
            echo "first week did not establish positive post-cost potential"
            exit 0
          fi
          /tmp/run_v47_week.sh \
            untouched_2_2024_09 2024-09-21 2024-09-29 2024-09-23 2024-09-29
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          names = ["untouched_1_2025_07", "untouched_2_2024_09"]
          rows = [json.loads((root / name / "summary.json").read_text()) for name in names]
          returns = [float(row.get("total_return") or 0.0) for row in rows]
          trades = sum(int(row.get("trades") or 0) for row in rows)
          wins = sum(int(row.get("wins") or 0) for row in rows)
          compounded = math.prod(1.0 + value for value in returns) - 1.0
          potential = bool(
              all(row.get("risk_pass") for row in rows)
              and compounded > 0.0
              and trades >= 2
              and wins / trades >= 0.5
          )
          (root / "second_gate.txt").write_text("pass\n" if potential else "fail\n")
          print(json.dumps({"potential": potential, "compounded": compounded, "trades": trades, "wins": wins}, indent=2))
          PY

      - name: Third BTC week
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -f "$ROOT/second_gate.txt" ]] || ! grep -qx pass "$ROOT/second_gate.txt"; then
            echo "two-week state did not remain positive"
            exit 0
          fi
          /tmp/run_v47_week.sh \
            untouched_3_2023_01 2023-01-28 2023-02-05 2023-01-30 2023-02-05

      - name: Record V47 diagnosis
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          rows = []
          for name in ("untouched_1_2025_07", "untouched_2_2024_09", "untouched_3_2023_01"):
              summary = root / name / "summary.json"
              compiler = root / name / "signals/summary.json"
              if summary.exists():
                  rows.append({
                      "week": name,
                      **json.loads(summary.read_text()),
                      "compiler_summary": json.loads(compiler.read_text()) if compiler.exists() else None,
                  })
          returns = [float(row.get("total_return") or 0.0) for row in rows]
          compounded = math.prod(1.0 + value for value in returns) - 1.0 if rows else 0.0
          days = 7 * len(rows)
          daily = (1.0 + compounded) ** (1.0 / days) - 1.0 if days and compounded > -1.0 else -1.0
          trades = sum(int(row.get("trades") or 0) for row in rows)
          wins = sum(int(row.get("wins") or 0) for row in rows)
          active = sum(int(row.get("active_days") or 0) for row in rows)
          if len(rows) == 3 and daily >= 0.01 and trades >= 9 and active >= 6 and wins / trades >= 0.55:
              decision = "freeze_v47_and_open_long_plus_four_asset_validation"
          elif len(rows) == 3 and compounded > 0 and trades >= 4 and wins / trades >= 0.5:
              decision = "retain_v47_as_positive_sparse_mechanism_for_four_asset_frequency_screen"
          elif len(rows) < 2:
              decision = "discard_v47_first_week_no_positive_path"
          else:
              decision = "discard_v47_after_sequential_btc_failure"
          evidence = {
              "candidate": "candidate-04-v47-directional-session-vwap-negotiation",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "market_cause": "directional parent value, real counterauction through VWAP, material OI liquidation, full negotiation break and untouched parent-session target",
              "weeks": rows,
              "calendar_days": days,
              "compounded_return": compounded,
              "geometric_daily_growth": daily,
              "trades": trades,
              "wins": wins,
              "win_rate": wins / trades if trades else 0.0,
              "active_days": active,
              "decision": decision,
              "project_target_reached": False,
              "final_validation_completed": False,
              "performance_recalculated_outside_nautilus": False
          }
          target = Path(os.environ["EVIDENCE"])
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          (root / "decision.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v47-session-vwap-negotiation-${{ github.run_id }}
          path: |
            artifacts/candidate-04-v47-session-vwap-negotiation
            research/candidate-04/evidence-v47-session-vwap-negotiation.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist V47 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "candidate-04-research-bot"
          git config user.email "candidate-04-research-bot@users.noreply.github.com"
          git add "$EVIDENCE" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record V47 session VWAP negotiation evidence"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-04 && \
               git push origin HEAD:research/candidate-04; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
