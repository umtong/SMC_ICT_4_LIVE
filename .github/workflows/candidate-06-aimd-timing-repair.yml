name: Candidate 06 AIMD Signal-Close Timing Repair

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - ".github/workflows/candidate-06-aimd-timing-repair.yml"
      - "research/candidate-06/register_signal_submission_timing.py"
      - "research/candidate-06/test_signal_submission_timing_contract.py"
      - "research/candidate-06/AIMD_EXECUTION_TIMING_AUDIT.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-06-aimd-signal-close-repair
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair-and-rerun:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[candidate-06 evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-06
      SMC4_RESEARCH_DATA: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/.research-data/candidate-06

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed NautilusTrader environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          from importlib.metadata import version
          actual = version("nautilus_trader")
          assert actual == "1.230.0", actual
          print(f"NAUTILUS_VERSION={actual}")
          PY

      - name: Apply narrow signal-submission repair
        run: |
          set -euo pipefail
          test -s research/candidate-06/register_signal_submission_timing.py
          test -s research/candidate-06/test_signal_submission_timing_contract.py
          test -s research/candidate-06/AIMD_EXECUTION_TIMING_AUDIT.md
          python research/candidate-06/register_signal_submission_timing.py

      - name: Verify unchanged scenario and repaired timing contracts
        run: |
          set -euo pipefail
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_signal_submission_timing_contract.py
          python research/candidate-06/test_agg_trade_profile_data.py
          python research/candidate-06/test_auction_imbalance_migration_engine.py
          python research/candidate-06/test_aimd_runner_contract.py
          python research/candidate-06/test_excursion_diagnostics.py
          python - <<'PY'
          import inspect
          from nautilus_strategy import make_strategy_class

          from run_auction_migration_matrix import _base
          _, strategy = make_strategy_class()
          source = inspect.getsource(strategy.on_bar)
          assert 'timing == "ON_SIGNAL_CLOSE"' in source
          assert source.index('self._record_transitions(step.transitions, ts_ns)') < source.index('self._attempt_entry(step.signal, snapshot)')
          config = _base({"logic": {}, "execution": {}, "validation": {}, "gate": {}})
          assert config["logic"]["signal_submission_timing"] == "ON_SIGNAL_CLOSE"
          print("AIMD completed-response signal-close submission verified")
          PY

      - name: Rerun identical AIMD first-week matrix through NautilusTrader
        id: lab
        continue-on-error: true
        run: |
          set +e
          rm -rf artifacts/candidate-06/aimd-signal-close-first-week
          mkdir -p "$SMC4_RESEARCH_DATA" artifacts
          python research/candidate-06/run_auction_migration_matrix.py \
            --output artifacts/candidate-06/aimd-signal-close-first-week \
            > artifacts/candidate-06-aimd-timing.stdout \
            2> artifacts/candidate-06-aimd-timing.stderr
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal evidence
        if: always()
        run: |
          set -euo pipefail
          root=artifacts/candidate-06/aimd-signal-close-first-week
          mkdir -p "$root"
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          printf '%s\n' "$code" > "$root/workflow_exit_code.txt"
          if [ ! -f "$root/summary.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-06/aimd-signal-close-first-week")
          payload = {
              "all_three_weeks_passed": False,
              "long_evaluation_authorized": False,
              "selected": None,
              "terminal_status": "IMPLEMENTATION_OR_DATA_FAILURE_BEFORE_SUMMARY",
          }
          (root / "summary.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
          cp artifacts/candidate-06-aimd-timing.stdout "$root/workflow_stdout.txt" 2>/dev/null || true
          cp artifacts/candidate-06-aimd-timing.stderr "$root/workflow_stderr.txt" 2>/dev/null || true

      - name: Commit repaired source and deterministic evidence
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          for path in \
            research/candidate-06/register_signal_submission_timing.py \
            research/candidate-06/test_signal_submission_timing_contract.py \
            research/candidate-06/AIMD_EXECUTION_TIMING_AUDIT.md \
            research/candidate-06/nautilus_strategy.py \
            research/candidate-06/run_auction_migration_matrix.py; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          git add -f artifacts/candidate-06/aimd-signal-close-first-week
          if [ -f research/candidate-06/config.aimd.locked.json ]; then
            git add -f research/candidate-06/config.aimd.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 AIMD timing-repair evidence [candidate-06 evidence]"
          git pull --rebase origin research/candidate-06
          git push origin HEAD:research/candidate-06

      - name: Upload repaired AIMD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-aimd-timing-${{ github.sha }}
          path: artifacts/candidate-06/aimd-signal-close-first-week
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Enforce staged decision
        if: always()
        run: |
          code='${{ steps.lab.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
