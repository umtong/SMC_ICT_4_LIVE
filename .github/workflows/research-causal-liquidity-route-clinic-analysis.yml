name: Research causal liquidity route mechanism clinic

on:
  workflow_dispatch:
  push:
    branches: ["research_causal_liquidity_route_system"]
    paths:
      - ".github/workflows/research-causal-liquidity-route-clinic-analysis.yml"
      - "research/candidate-causal-liquidity-route-system/analyze_trade_clinic.py"

concurrency:
  group: research-causal-liquidity-route-clinic-analysis
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_causal_liquidity_route_system
          fetch-depth: 0
      - name: Analyze actual, skipped, and public-example-nearby plans
        run: |
          set -euo pipefail
          INPUT=research_results/causal_liquidity_route_system/executable_smoke
          OUTPUT=research_results/causal_liquidity_route_system/mechanism_clinic
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          python research/candidate-causal-liquidity-route-system/analyze_trade_clinic.py \
            --input "$INPUT" --output "$OUTPUT" | tee "$OUTPUT/run.log"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m "Record causal route mechanism clinic [skip ci]"
            git pull --rebase origin research_causal_liquidity_route_system
            git push origin HEAD:research_causal_liquidity_route_system
          fi
