name: candidate-04-v33-exact-causal-target

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v33-exact-causal-target.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: low_activity
            artifact_id: 8973026625
            artifact_name: candidate-04-v31-ablation-low_activity-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2023-08-02"
            build_end: "2023-08-10"
            evaluation_start: "2023-08-04"
            evaluation_end: "2023-08-10"
          - name: normal_basis
            artifact_id: 8973026320
            artifact_name: candidate-04-v31-ablation-normal_basis-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2023-12-16"
            build_end: "2023-12-24"
            evaluation_start: "2023-12-18"
            evaluation_end: "2023-12-24"
          - name: stress_a
            artifact_id: 8973022801
            artifact_name: candidate-04-v31-ablation-stress_a-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2024-08-05"
            build_end: "2024-08-13"
            evaluation_start: "2024-08-07"
            evaluation_end: "2024-08-13"
          - name: year_end
            artifact_id: 8973022682
            artifact_name: candidate-04-v31-ablation-year_end-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2024-12-25"
            build_end: "2025-01-02"
            evaluation_start: "2024-12-27"
            evaluation_end: "2025-01-02"
          - name: autumn
            artifact_id: 8973033157
            artifact_name: candidate-04-v31-ablation-autumn-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2025-10-18"
            build_end: "2025-10-26"
            evaluation_start: "2025-10-20"
            evaluation_end: "2025-10-26"
          - name: may_2024
            artifact_id: 8973024256
            artifact_name: candidate-04-v31-ablation-may_2024-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2024-05-25"
            build_end: "2024-06-02"
            evaluation_start: "2024-05-27"
            evaluation_end: "2024-06-02"
          - name: failed_untouched_2025_03
            artifact_id: 8973036804
            artifact_name: candidate-04-v31-ablation-failed_untouched_2025_03-32303a70a1a24aa795c280483e2f9ea6b22361fc
            build_start: "2025-03-22"
            build_end: "2025-03-30"
            evaluation_start: "2025-03-24"
            evaluation_end: "2025-03-30"
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      MATRIX_NAME: ${{ matrix.name }}
      C04_BUILD_START: ${{ matrix.build_start }}
      C04_BUILD_END: ${{ matrix.build_end }}
      C04_EVALUATION_START: ${{ matrix.evaluation_start }}
      C04_EVALUATION_END: ${{ matrix.evaluation_end }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact V31 validated-core evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/candidate-04-v33/${{ matrix.name }}/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31114267295
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact-target implementation and frozen signals
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          root="artifacts/candidate-04-v33/$MATRIX_NAME"
          test -s "$root/source/signals/signals.json"
          test -s "$root/source/summary.json"
          python -m compileall -q \
            research/candidate-04/nt_exact_causal_target_risk_sizing.py \
            research/candidate-04/nt_backtest_v31_exact_causal_target.py \
            research/candidate-04/nt_rich_signal_strategy.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_exact_causal_target_risk_sizing.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Replay frozen V31 core with exact causal targets
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v33/$MATRIX_NAME"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/source/signals/signals.json" \
          python research/candidate-04/nt_backtest_v31_exact_causal_target.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v33/$MATRIX_NAME/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk, target preservation and summarize week
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v33") / os.environ["MATRIX_NAME"]
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          original = json.loads((root / "source/summary.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [e for e in events if e.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry-position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          exact_references = 0
          for position, entry in zip(positions.to_dict("records"), entries):
              details = entry["details"]
              if details.get("target_contract") == "exact_pre_signal_causal_reference":
                  exact_references += 1
                  causal = details.get("causal_target")
                  if causal is not None and abs(float(details["target"]) - float(causal)) > 0.11:
                      raise SystemExit("submitted target differs from causal target")
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(details["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV contract")
          summary = {
              "candidate": "candidate-04-v33-exact-causal-target-core",
              "matrix": os.environ["MATRIX_NAME"],
              "engine": metrics.get("engine"),
              "signals": len(json.loads((root / "source/signals/signals.json").read_text())),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
              "exact_causal_target_entries": exact_references,
              "original_validated_core": {
                  "trades": original.get("trades"),
                  "wins": original.get("wins"),
                  "total_return": original.get("total_return"),
                  "geometric_daily_growth": original.get("geometric_daily_growth"),
              },
              "controlled_change": (
                  "remove arbitrary 2.4R cap and submit the exact pre-signal "
                  "causal target reference"
              ),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v33-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-04-v33/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v33-*
          path: artifacts
          merge-multiple: false

      - name: Aggregate exact-target weeks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          summaries = []
          for path in Path("artifacts").glob("candidate-04-v33-*/summary.json"):
              summaries.append(json.loads(path.read_text()))
          if len(summaries) != 7:
              raise SystemExit(f"expected 7 summaries, found {len(summaries)}")
          summaries.sort(key=lambda item: item["matrix"])
          returns = [float(item["total_return"]) for item in summaries]
          compounded = math.prod(1.0 + value for value in returns) - 1.0
          trades = sum(int(item["trades"]) for item in summaries)
          wins = sum(int(item["wins"]) for item in summaries)
          aggregate = {
              "candidate": "candidate-04-v33-exact-causal-target-core",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "weeks": summaries,
              "calendar_days": 49,
              "all_weeks_positive": all(value > 0.0 for value in returns),
              "compounded_return": compounded,
              "geometric_daily_growth": (1.0 + compounded) ** (1.0 / 49.0) - 1.0,
              "trades": trades,
              "wins": wins,
              "win_rate": wins / trades if trades else 0.0,
              "development_target_reached": (
                  all(value > 0.0 for value in returns)
                  and (1.0 + compounded) ** (1.0 / 49.0) - 1.0 >= 0.01
              ),
              "final_validation_completed": False,
              "changed_variables_from_validated_v31_core": 1,
          }
          Path("aggregate.json").write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(aggregate, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-04-v33-aggregate-${{ github.sha }}
          path: aggregate.json
          if-no-files-found: error
          retention-days: 90
