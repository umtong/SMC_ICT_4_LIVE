name: Candidate 11 evidence reconciler

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/evidence_reconciler_trigger.txt"
      - ".github/workflows/candidate-11-evidence-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: candidate-11-evidence-reconciler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-11

      - name: Wait for latest active research workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          workflows = (
              "candidate-11-internal-matrix-v4.yml",
              "candidate-11-microstructure-v5.yml",
              "candidate-11-microstructure-v2-research-v2.yml",
          )
          deadline = time.time() + 105 * 60
          while True:
              states = {}
              for workflow in workflows:
                  url = (
                      f"https://api.github.com/repos/{repository}/actions/workflows/"
                      f"{workflow}/runs?branch=research/candidate-11&per_page=1"
                  )
                  request = Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "candidate-11-evidence-reconciler",
                      },
                  )
                  with urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  runs = payload.get("workflow_runs") or []
                  if not runs:
                      states[workflow] = {"status": "missing", "conclusion": None}
                  else:
                      run = runs[0]
                      states[workflow] = {
                          "id": run.get("id"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_sha": run.get("head_sha"),
                      }
              print(json.dumps(states, sort_keys=True), flush=True)
              if all(value.get("status") == "completed" for value in states.values()):
                  break
              if time.time() >= deadline:
                  raise SystemExit("active research workflows did not finish before reconciler deadline")
              time.sleep(60)
          PY

      - name: Reconcile committed evidence and route next family
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-11-bot"
          git config user.email "candidate-11-bot@users.noreply.github.com"
          git fetch origin research/candidate-11
          git reset --hard origin/research/candidate-11
          python research/candidate-11/diagnose_research_runs_v2.py
          python research/candidate-11/research_decision.py
          python research/candidate-11/bind_irx_holdout_candidate.py
          python research/candidate-11/freeze_irx_long_protocol.py
          python research/candidate-11/route_research_next.py
          for file in \
            research/candidate-11/results/RESEARCH_DIAGNOSIS.json \
            research/candidate-11/results/RESEARCH_DECISION.json \
            research/candidate-11/results/NEXT_ACTION.json \
            research/candidate-11/irx_holdout_candidate.json \
            research/candidate-11/irx_long_protocol.json \
            research/candidate-11/microstructure_v3_run_trigger.txt; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "candidate-11: reconcile completed research evidence"
            git push origin HEAD:research/candidate-11
          fi
