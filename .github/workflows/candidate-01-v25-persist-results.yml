name: candidate-01-v25-persist-results

on:
  workflow_run:
    workflows: ["candidate-01-v25-funding-window-weeks"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  persist:
    if: github.event.workflow_run.head_branch == 'research/candidate-01'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-01
          fetch-depth: 0
      - name: Download available v25 artifacts
        run: |
          set -euo pipefail
          mkdir -p .persist-v25
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .persist-v25 || true
      - name: Build and commit compact result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          source = Path('.persist-v25')
          destination = Path('research/candidate-01/evidence/v25')
          destination.mkdir(parents=True, exist_ok=True)
          sections = ['# Candidate v25 frozen-week result', '']
          found = 0
          for artifact in sorted(path for path in source.iterdir() if path.is_dir()):
              gates = list(artifact.rglob('week_gate.json'))
              summaries = list(artifact.rglob('funding_window_failed_auction_v25_summary.json'))
              if not gates and not summaries:
                  continue
              found += 1
              target = destination / artifact.name
              target.mkdir(parents=True, exist_ok=True)
              sections.extend([f'## {artifact.name}', ''])
              for path in gates + summaries:
                  shutil.copy2(path, target / path.name)
              if gates:
                  gate = json.loads(gates[0].read_text())
                  sections.extend([
                      f"- classification: `{gate['classification']}`",
                      f"- advance: `{gate['advance']}`",
                      f"- plans: `{gate['selected_plan_count']}`",
                      f"- trades: `{gate['trades']}`",
                      f"- win rate: `{gate['win_rate']}`",
                      f"- total return: `{gate['total_return']}`",
                      f"- geometric daily: `{gate['geometric_daily']}`",
                      f"- profit factor: `{gate['profit_factor']}`",
                      f"- max drawdown: `{gate['max_drawdown']}`",
                      f"- rejections: `{json.dumps(gate['rejection_counts'], sort_keys=True)}`",
                      f"- state counts: `{json.dumps(gate['state_counts'], sort_keys=True)}`",
                      '',
                  ])
          if found == 0:
              metadata = Path('research/candidate-01/evidence/v25/run.json')
              metadata.parent.mkdir(parents=True, exist_ok=True)
              import subprocess
              raw = subprocess.check_output([
                  'gh', 'run', 'view', str(Path('/dev/null')),
              ]) if False else b''
              raise SystemExit('no v25 evidence artifacts found')
          Path('research/candidate-01/CANDIDATE_V25_RESULT.md').write_text(
              '\n'.join(sections) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]]@users.noreply.github.com"
          git add research/candidate-01/CANDIDATE_V25_RESULT.md research/candidate-01/evidence/v25
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research(candidate-01): record v25 frozen-week evidence"
          git push origin HEAD:research/candidate-01
