name: candidate-02-derivative-state-data

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-state/**"
      - ".github/workflows/candidate-02-state.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect locked positioning, basis and funding data
        run: python .candidate-02-state/collect_derivative_state.py
      - name: Upload immutable derivative-state data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-derivative-state-${{ github.sha }}
          path: |
            .cache/candidate-02/derivative-state
            artifacts/candidate-02-state/manifest.json
          retention-days: 30
