name: candidate-easychart-ml3-breakthrough

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/candidate-easychart-ml3-breakthrough.yml"
      - "research/candidate-easychart_ml3_breakthrough/**"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-ml3-breakthrough
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  diagnose-auction-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_ml3_breakthrough:research/candidate-easychart_ml3v3:research/candidate-easychart_ml3v2:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3:research/candidate-easychart-v2
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-ml3-breakthrough/diagnostic
      OUT: artifacts/candidate-easychart-ml3-breakthrough/diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Exercise intrinsic auction contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-easychart_ml3_breakthrough/*.py \
            research/candidate-easychart_ml3_breakthrough/tests/*.py
          python - <<'PY'
          import runpy
          from pathlib import Path

          total = 0
          for path in sorted(Path("research/candidate-easychart_ml3_breakthrough/tests").glob("test_*.py")):
              namespace = runpy.run_path(str(path))
              for name, value in sorted(namespace.items()):
                  if name.startswith("test_") and callable(value):
                      value()
                      total += 1
          print(f"executed {total} intrinsic-auction tests")
          if total < 10:
              raise SystemExit("intrinsic-auction contract coverage unexpectedly disappeared")
          PY

      - name: Harvest four-market intrinsic auction episodes
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_ml3_breakthrough/run_mtf_backtest_breakthrough_shadow.py \
            --start 2025-08-10 \
            --end 2025-08-14 \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/shadow.log"

          python research/candidate-easychart_ml3v2/harvest_ml1.py \
            --start 2025-08-10 \
            --end 2025-08-14 \
            --warmup-days 21 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/harvest.log"

          python - <<'PY'
          from pathlib import Path
          import subprocess
          import pandas as pd

          out = Path("artifacts/candidate-easychart-ml3-breakthrough/diagnostic")
          labels_path = out / "counterfactual_plans.csv"
          if labels_path.exists() and labels_path.stat().st_size:
              labels = pd.read_csv(labels_path, low_memory=False)
              resolved = labels.get("counterfactual_outcome", pd.Series(dtype=str)).isin(
                  ["TARGET_FIRST", "STOP_FIRST", "AMBIGUOUS_SAME_MINUTE"]
              )
              if bool(resolved.any()):
                  subprocess.run(
                      [
                          "python",
                          "research/candidate-easychart_ml3v3/build_ml3v3_dataset.py",
                          "--run-output",
                          str(out),
                      ],
                      check=True,
                  )
              else:
                  (out / "dataset_not_built.txt").write_text(
                      "No resolved first-passage outcome in this diagnostic interval.\n",
                      encoding="utf-8",
                  )
          PY

          python research/candidate-easychart_ml3_breakthrough/summarize_intrinsic_run.py \
            --run-output "$OUT" \
            2>&1 | tee "$OUT/summary.log"
          test -s "$OUT/intrinsic_run_summary.json"
          test -s "$OUT/decision_events.csv"

      - name: Preserve trade-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml3-breakthrough-diagnostic-${{ github.sha }}
          path: artifacts/candidate-easychart-ml3-breakthrough/diagnostic/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish run locator
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/candidate-easychart_ml3_breakthrough/evidence
          printf '%s\n' '${{ github.run_id }}' > research/candidate-easychart_ml3_breakthrough/evidence/LAST_RUN_ID
          printf '%s\n' '${{ github.sha }}' > research/candidate-easychart_ml3_breakthrough/evidence/LAST_RUN_SHA
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-easychart_ml3_breakthrough/evidence
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(research): record intrinsic diagnostic run [skip ci]"
          git push origin HEAD:research_ML3
