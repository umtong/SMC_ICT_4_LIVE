name: candidate-01-ltf-mss-stop-entry

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-ltf-mss-stop-entry.yml"
      - "research/candidate-01/ltf_mss_stop_entry_probe.py"
      - "research/candidate-01/ltf_mss_resting_pool_probe.py"
      - "research/candidate-01/hybrid_resting_pool_probe.py"
      - "research/candidate-01/resting_liquidity_pool_probe.py"
      - "research/candidate-01/portfolio_probe.py"
      - "research/candidate-01/core.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-hybrid-first-week
          key: candidate-01-hybrid-first-week-${{ runner.os }}-v1
      - name: Run final controlled entry repair on only the first BTC week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/core.py \
                research/candidate-01/data.py \
                research/candidate-01/portfolio_probe.py \
                research/candidate-01/resting_liquidity_pool_probe.py \
                research/candidate-01/hybrid_resting_pool_probe.py \
                research/candidate-01/ltf_mss_resting_pool_probe.py \
                research/candidate-01/ltf_mss_stop_entry_probe.py
              python -m unittest discover -s tests -p "test_candidate_01*.py" -v
              rm -rf artifacts/candidate-01-ltf-mss-stop-entry
              python research/candidate-01/ltf_mss_stop_entry_probe.py \
                --cache .cache/candidate-01-hybrid-first-week \
                --output artifacts/candidate-01-ltf-mss-stop-entry
            '
      - name: Print first-week stop-entry evidence
        run: cat artifacts/candidate-01-ltf-mss-stop-entry/ltf_mss_stop_entry_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-ltf-mss-stop-entry-${{ github.sha }}
          path: artifacts/candidate-01-ltf-mss-stop-entry
          if-no-files-found: error
          retention-days: 30
