name: Candidate 11 internal-reclaim matrix

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/run_internal_reclaim_matrix.sh"
      - "research/candidate-11/apply_internal_reclaim_parameters.py"
      - "research/candidate-11/internal_matrix_trigger.txt"
      - ".github/workflows/candidate-11-internal-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-11-internal-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-11

      - name: Run predeclared semantic matrix through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x research/candidate-11/run_internal_reclaim_matrix.sh
          bash research/candidate-11/run_internal_reclaim_matrix.sh

      - name: Commit diagnostic evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-11-bot"
          git config user.email "candidate-11-bot@users.noreply.github.com"
          git add -A research/candidate-11/results/IRX_MATRIX
          for week in W3 W8 W9; do
            if [ -d "research/candidate-11/results/IRX_SELECTED_$week" ]; then
              git add -A "research/candidate-11/results/IRX_SELECTED_$week"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "candidate-11: record internal-reclaim matrix evidence [skip ci]"
            git push origin HEAD:research/candidate-11
          fi

      - name: Publish matrix result
        if: always()
        shell: bash
        run: |
          SUMMARY="research/candidate-11/results/IRX_MATRIX/summary.json"
          if [ -s "$SUMMARY" ]; then
            python - "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## Candidate 11 internal-reclaim matrix")
          print(f"- **selected_variant**: `{summary.get('selected_variant')}`")
          for record in summary.get("records", []):
              print(f"### {record['variant']}")
              for key in (
                  "eligible", "safety_passed", "losses_all_three_weeks",
                  "diagnostic_closed_trades", "diagnostic_internal_plans",
                  "diagnostic_log_growth", "w8_preserved",
              ):
                  print(f"- **{key}**: `{record.get(key)}`")
          PY
          fi
