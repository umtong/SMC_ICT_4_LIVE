name: candidate-hierarchical-liquidity-bpr-cases

on:
  workflow_dispatch:
  push:
    branches: ["research_ML_thinking"]
    paths:
      - ".github/workflows/candidate-hierarchical-liquidity-bpr-cases.yml"
      - "research/candidate-hierarchical-liquidity-bpr-v1/render_cases.py"
      - "!research/candidate-hierarchical-liquidity-bpr-v1/.latest-case-run"

concurrency:
  group: candidate-hierarchical-liquidity-bpr-cases
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > research/candidate-hierarchical-liquidity-bpr-v1/.latest-case-run
          git add research/candidate-hierarchical-liquidity-bpr-v1/.latest-case-run
          git commit -m "Record hierarchical BPR case run $GITHUB_RUN_ID" || true
          git push origin HEAD:research_ML_thinking

  render:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {period: dev-2025-feb, start: 2025-02-01, end: 2025-02-08}
          - {period: dev-2025-aug, start: 2025-08-01, end: 2025-08-08}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-hierarchical-liquidity-bpr-cases/${{ matrix.period }}
      OUT: artifacts/candidate-hierarchical-liquidity-bpr-cases/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct actions and render every trade
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python -m py_compile research/candidate-hierarchical-liquidity-bpr-v1/render_cases.py research/candidate-liquidity-displacement-v1/render_cases_svg.py
          python research/candidate-hierarchical-liquidity-bpr-v1/run_research.py --start "$START" --end "$END" --warmup-days 45 --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$OUT"
          python research/candidate-hierarchical-liquidity-bpr-v1/render_cases.py --start "$START" --end "$END" --warmup-days 45 --cache "$CACHE" --actions "$OUT/hierarchical_actions.csv" --output "$OUT/cases"
      - name: Preserve every causal trade chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchical-liquidity-bpr-cases-${{ matrix.period }}
          path: artifacts/candidate-hierarchical-liquidity-bpr-cases/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
