name: Candidate 11 freeze IRX holdouts

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/freeze_irx_holdouts.py"
      - "research/candidate-11/irx_holdout_selection_trigger.txt"
      - ".github/workflows/candidate-11-freeze-irx-holdouts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-11-freeze-irx-holdouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-11

      - name: Freeze dates without opening market data
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-11/freeze_irx_holdouts.py
          git config user.name "candidate-11-bot"
          git config user.email "candidate-11-bot@users.noreply.github.com"
          git add research/candidate-11/irx_holdout_protocol.json
          if ! git diff --cached --quiet; then
            git commit -m "candidate-11: freeze untouched IRX holdouts before data"
            git push origin HEAD:research/candidate-11
          fi
