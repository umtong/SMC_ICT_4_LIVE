name: candidate-53-cost-aware-auction-meta-label

on:
  push:
    branches: ["research/candidate-53"]
    paths:
      - "research/candidate-53/event_meta_label_study.py"
      - ".github/workflows/candidate-53-meta-label.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-53-meta-label
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-53, fetch-depth: 0}

      - name: Reuse checksum-verified Binance data layer
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git fetch origin research/candidate-16-v13-volatility-squeeze-release:refs/remotes/origin/c16-v13
          rm -rf .deps/c16 && mkdir -p .deps
          git worktree add --detach .deps/c16 refs/remotes/origin/c16-v13
          git config --global --add safe.directory "$(pwd)/.deps/c16"
          python -m py_compile research/candidate-53/event_meta_label_study.py .deps/c16/research/candidate-16/v9_liquidation_event_study.py

      - name: Run fixed 2025 development and 2026 holdout study
        shell: bash
        env: {PYTHONPATH: .deps/c16/research/candidate-16}
        run: |
          set -euo pipefail
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-53/event_meta_label_study.py \
            --cache .cache/candidate-53-meta-label \
            --output "$ROOT" 2>&1 | tee "$ROOT/console.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-53-meta-label-${{ github.sha }}
          path: artifacts/candidate-53-meta-label/**
          if-no-files-found: warn
          retention-days: 30
