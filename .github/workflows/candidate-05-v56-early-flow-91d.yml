name: candidate-05-v56-early-flow-91d

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v56-early-flow-91d.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v56-early-flow-91d
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  continuous-91d:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v56_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v56-early-flow-91d
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and single-method v56 contract
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_flow_maturity_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v56_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python - <<'PY'
          import strategy
          assert strategy.LiquidityResponseStrategy.__name__ == "EarlyFlowFirstRetraceStrategy"
          print(strategy.LiquidityResponseStrategy)
          PY

      - name: Run one uninterrupted BTC account for 91 days in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v56_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-05-30 \
            --cache .cache/candidate-05-v56-early-flow-91d \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Compare against canonical v46
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s "$ROOT/metrics.json"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import math
          import os
          from collections import defaultdict
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())

          def number(value):
              if value is None:
                  return None
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          by_branch = defaultdict(lambda: {"trades": 0, "wins": 0, "losses": 0, "net_pnl_usdt": 0.0})
          for item in closed:
              value = number(item.get("realized_pnl"))
              if value is None or not math.isfinite(value):
                  continue
              branch = str(item.get("branch") or "UNKNOWN")
              row = by_branch[branch]
              row["trades"] += 1
              row["wins"] += int(value > 0.0)
              row["losses"] += int(value < 0.0)
              row["net_pnl_usdt"] += value

          integrity = (
              int(metrics.get("liquidations", 0)) == 0
              and int(metrics.get("order_rejections", 0)) == 0
              and int(metrics.get("order_denials", 0)) == 0
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          baseline = {
              "total_return": 0.0256520,
              "geometric_daily_growth": 0.0002784,
              "trades": 16,
              "wins": 11,
              "profit_factor": 1.204,
              "max_drawdown": 0.0709,
          }
          improved = (
              integrity
              and float(metrics.get("total_return", -1.0)) > baseline["total_return"]
              and float(metrics.get("profit_factor", 0.0)) > baseline["profit_factor"]
              and float(metrics.get("max_drawdown", 1.0)) <= baseline["max_drawdown"]
          )
          result = {
              "schema": "candidate-05-v56-early-flow-91d-v1",
              "classification": (
                  "V56_CORE_QUALITY_IMPROVED"
                  if improved
                  else "V56_NO_CORE_QUALITY_IMPROVEMENT"
              ),
              "integrity_pass": integrity,
              "baseline_v46": baseline,
              "candidate_metrics": metrics,
              "branch_attribution": dict(sorted(by_branch.items())),
              "phase_gate": {
                  "observations": diagnostics.get("first_retrace_phase_observations", 0),
                  "passes": diagnostics.get("first_retrace_early_flow_pass", 0),
                  "rejections": diagnostics.get("first_retrace_mature_flow_rejections", 0),
                  "rejected_branches": diagnostics.get("first_retrace_rejected_branch_counts", {}),
              },
              "strategy_diagnostics": diagnostics,
          }
          (root / "v56_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s "$ROOT/metrics.json"; then
            python -m json.tool "$ROOT/metrics.json"
            python -m json.tool "$ROOT/v56_decision.json"
            for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
              test -s "$ROOT/$file"
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v56-early-flow-91d-${{ github.sha }}
          path: artifacts/candidate-05-v56-early-flow-91d/**
          if-no-files-found: warn
          retention-days: 90
