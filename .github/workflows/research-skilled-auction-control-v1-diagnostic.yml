name: research-skilled-auction-control-v1-diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["research_skilled_auction_control"]
    paths:
      - "research/candidate-skilled-auction-control-v1/**"
      - ".github/workflows/research-skilled-auction-control-v1-diagnostic.yml"
      - ".dispatch-skilled-auction-control-v1"

concurrency:
  group: research-skilled-auction-control-v1-diagnostic
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: february-2025, start: 2025-02-01, end: 2025-02-10}
          - {period: public-cases-2025, start: 2025-08-10, end: 2025-08-20}
          - {period: february-2026, start: 2026-02-01, end: 2026-02-14}
          - {period: july-2026, start: 2026-07-15, end: 2026-07-31}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-skilled-auction-control-v1:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/skilled-auction-control-v1/${{ matrix.period }}
      OUT: artifacts/skilled-auction-control-v1/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_skilled_auction_control
      - name: Compile mechanism policy
        run: |
          python -m py_compile \
            research/candidate-skilled-auction-control-v1/skilled_auction_control_v1.py \
            research/candidate-skilled-auction-control-v1/run_backtest.py
      - name: Run one continuous four-market account
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-skilled-auction-control-v1/run_backtest.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2
      - name: Preserve complete trade and non-trade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilled-auction-control-v1-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/skilled-auction-control-v1/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30

  record:
    if: always()
    needs: diagnostic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_skilled_auction_control
      - name: Record diagnostic run identity
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > .latest-skilled-auction-control-v1-diagnostic
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .latest-skilled-auction-control-v1-diagnostic
          git commit -m "Record skilled auction control v1 diagnostic $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:research_skilled_auction_control
