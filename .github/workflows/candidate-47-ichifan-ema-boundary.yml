name: candidate-47-ichifan-ema-boundary
on:
  push:
    branches: ["research/candidate-47"]
    paths: [".github/workflows/candidate-47-ichifan-ema-boundary.yml"]
  workflow_dispatch:
permissions: {contents: read, packages: read}
jobs:
  development-week:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-ichifan-ema-boundary
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/candidate-47}
      - name: Verify and run
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-47/ichifan_ema_boundary_strategy.py research/candidate-47/ichifan_ema_boundary_launch.py
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-47/ichifan_ema_boundary_launch.py \
            --config research/candidate-47/ichifan_structural_config.json \
            --start 2026-07-01 --end 2026-07-07 \
            --cache .cache/candidate-47-ichifan-ema-boundary \
            --output "$ROOT" --workspace "$ROOT/workspace" 2>&1 | tee "$ROOT/console.log"
      - name: Print and verify result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ["ROOT"])/"metrics.json").read_text()); d=m["strategy_diagnostics"]
          n=int(d.get("ema_boundary_submissions",0))
          out={k:m[k] for k in ("ending_nav","total_return","geometric_daily_growth","max_drawdown","trades","wins","losses","win_rate","profit_factor","expectancy_usdt")}
          out.update({"submissions":n,"failures":d.get("ema_boundary_failures",0),"mean_stop_fraction":d.get("ema_boundary_distance_sum",0.0)/n if n else None,"min_stop_fraction":d.get("ema_boundary_distance_min"),"max_stop_fraction":d.get("ema_boundary_distance_max"),"exchange_max_quantity_bounds":d.get("exchange_max_quantity_bounds",0)})
          print(json.dumps(out,indent=2,sort_keys=True))
          assert n>0
          assert m["single_continuous_account"] and m["single_strategy_process"] and m["global_entry_or_position_limit"]==1
          assert m["gate_checks"]["risk_fraction_exactly_three_percent"] and m["gate_checks"]["no_global_position_violation"] and m["gate_checks"]["nautilus_positions_match"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-ichifan-ema-boundary-${{ github.sha }}
          path: artifacts/candidate-47-ichifan-ema-boundary/**
          if-no-files-found: warn
          retention-days: 30
