name: candidate-02-spot-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-spot/**"
      - ".github/workflows/candidate-02-spot-first.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect first BTC spot screen week only
        run: python .candidate-02-spot/collect_first_week.py
      - name: Upload immutable first-week spot data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-spot-first-${{ github.sha }}
          path: |
            .cache/candidate-02/spot-first-week
            artifacts/candidate-02-spot-first/manifest.json
          retention-days: 30
