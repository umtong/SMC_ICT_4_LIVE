name: candidate-01-v31-failed-acceptance-reversal-weeks

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-v31-failed-acceptance-reversal-weeks.yml"
      - "research/candidate-01/failed_acceptance_reversal_state_v31.py"
      - "research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py"
      - "research/candidate-01/candidate_01_v31_gate.py"
      - "research/candidate-01/candidate_01_v31_protocol.json"
      - "research/candidate-01/nautilus_tick_stop_plan_backtest.py"
      - "research/candidate-01/nautilus_tick_plan_backtest.py"
      - "research/candidate-01/nautilus_tick_stop_limit_adapter_smoke.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  week1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.outputs.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v31-week1
          key: candidate-01-v31-week1-BTCUSDT-2021-09-29-2021-10-12-${{ runner.os }}-v1
      - name: Run first frozen failed-acceptance reversal week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/nautilus_tick_stop_plan_backtest.py \
                research/candidate-01/nautilus_tick_plan_backtest.py \
                research/candidate-01/nautilus_tick_stop_limit_adapter_smoke.py \
                research/candidate-01/impact_resumption_stop_state_v29.py \
                research/candidate-01/failed_acceptance_reversal_state_v31.py \
                research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py \
                research/candidate-01/candidate_01_v31_gate.py
              python research/candidate-01/nautilus_tick_stop_limit_adapter_smoke.py
              rm -rf artifacts/candidate-01-v31-week1
              python research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py \
                --week 2021-10-04 \
                --rule boundary-loss-reversal \
                --cache .cache/candidate-01-v31-week1 \
                --output artifacts/candidate-01-v31-week1 \
                --workers 4
            '
      - name: Verify and classify week 1
        run: |
          python3 research/candidate-01/candidate_01_v31_gate.py \
            --root artifacts/candidate-01-v31-week1 \
            --week 2021-10-04
      - name: Export week 1 gate
        id: outputs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path("artifacts/candidate-01-v31-week1/week_gate.json").read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v31-week1-${{ github.sha }}
          path: artifacts/candidate-01-v31-week1
          if-no-files-found: error
          retention-days: 30

  week1-control:
    needs: week1
    if: needs.week1.outputs.advance != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v31-week1
          key: candidate-01-v31-week1-BTCUSDT-2021-09-29-2021-10-12-${{ runner.os }}-v1
      - name: Run immediate-reversal ablation on identical week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v31-week1-control
              python research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py \
                --week 2021-10-04 \
                --rule immediate-reversal-control \
                --cache .cache/candidate-01-v31-week1 \
                --output artifacts/candidate-01-v31-week1-control \
                --workers 4
            '
      - name: Verify and classify week 1 control
        run: |
          python3 research/candidate-01/candidate_01_v31_gate.py \
            --root artifacts/candidate-01-v31-week1-control \
            --week 2021-10-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v31-week1-control-${{ github.sha }}
          path: artifacts/candidate-01-v31-week1-control
          if-no-files-found: error
          retention-days: 30

  week2:
    needs: week1
    if: needs.week1.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      advance: ${{ steps.outputs.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v31-week2
          key: candidate-01-v31-week2-BTCUSDT-2025-08-06-2025-08-19-${{ runner.os }}-v1
      - name: Run second frozen failed-acceptance week without rule changes
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v31-week2
              python research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py \
                --week 2025-08-11 \
                --rule boundary-loss-reversal \
                --cache .cache/candidate-01-v31-week2 \
                --output artifacts/candidate-01-v31-week2 \
                --workers 4
            '
      - name: Verify and classify week 2
        run: |
          python3 research/candidate-01/candidate_01_v31_gate.py \
            --root artifacts/candidate-01-v31-week2 \
            --week 2025-08-11
      - name: Export week 2 gate
        id: outputs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path("artifacts/candidate-01-v31-week2/week_gate.json").read_text())
          print(f"advance={'true' if gate['advance'] else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v31-week2-${{ github.sha }}
          path: artifacts/candidate-01-v31-week2
          if-no-files-found: error
          retention-days: 30

  week3:
    needs: week2
    if: needs.week2.outputs.advance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-v31-week3
          key: candidate-01-v31-week3-BTCUSDT-2024-08-28-2024-09-10-${{ runner.os }}-v1
      - name: Run third frozen failed-acceptance week without rule changes
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-v31-week3
              python research/candidate-01/failed_acceptance_reversal_v31_nautilus_week.py \
                --week 2024-09-02 \
                --rule boundary-loss-reversal \
                --cache .cache/candidate-01-v31-week3 \
                --output artifacts/candidate-01-v31-week3 \
                --workers 4
            '
      - name: Verify and classify week 3
        run: |
          python3 research/candidate-01/candidate_01_v31_gate.py \
            --root artifacts/candidate-01-v31-week3 \
            --week 2024-09-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-01-v31-week3-${{ github.sha }}
          path: artifacts/candidate-01-v31-week3
          if-no-files-found: error
          retention-days: 30
