name: candidate-60-metaorder-lifecycle-exhaustion-v1

on:
  push:
    branches: ["research/candidate-60"]
    paths:
      - ".github/workflows/candidate-60-metaorder-lifecycle-exhaustion-v1.yml"
      - "research/candidate-60/METAORDER_LIFECYCLE_EXHAUSTION_V1_FREEZE.md"
      - "research/candidate-60/metaorder_lifecycle_exhaustion_v1.py.gz.b64.part*"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-60-metaorder-lifecycle-exhaustion-v1
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: f7787095f98b27f31fa3766bda13a94ae350269d
      VENDOR: .work/candidate-60-metaorder-lifecycle-exhaustion-v1/vendor
      C60_RESEARCH_ROOT: .work/candidate-60-metaorder-lifecycle-exhaustion-v1/vendor/research
      SCRIPT: .work/candidate-60-metaorder-lifecycle-exhaustion-v1/metaorder_lifecycle_exhaustion_v1.py
      OUT: research/candidate-60/evidence/metaorder-lifecycle-exhaustion-v1
      CACHE: .cache/candidate-60-metaorder-lifecycle-exhaustion-v1
      CONSOLE: .work/candidate-60-metaorder-lifecycle-exhaustion-v1-console

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-60
          fetch-depth: 0

      - name: Materialize immutable feature source and frozen study
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$VENDOR" "$(dirname "$SCRIPT")"
          git archive "$SOURCE_COMMIT" \
            research/candidate-05 \
            research/candidate-16 \
            research/candidate-51 \
            | tar -x -C "$VENDOR"
          cat research/candidate-60/metaorder_lifecycle_exhaustion_v1.py.gz.b64.part* \
            | base64 -d | gzip -d > "$SCRIPT"
          test "$(sha256sum "$SCRIPT" | awk '{print $1}')" = \
            "7dc2c1da597c518bc427ec2869d03623f363cbf212cf90eb319aca127885b71a"

      - name: Verify environment and frozen causal contract
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            "$SCRIPT" \
            "$C60_RESEARCH_ROOT/candidate-51/run.py" \
            "$C60_RESEARCH_ROOT/candidate-05/features.py"
          C60_RESEARCH_ROOT="$C60_RESEARCH_ROOT" python - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path
          script = Path(os.environ["SCRIPT"])
          spec = importlib.util.spec_from_file_location("c60_metaorder_lifecycle", script)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert module.MIN_RUN_AGE == 7
          assert module.MIN_CUMULATIVE_IMPACT_BPS == 20.0
          assert module.STOP_BUFFER_ATR == 0.15
          assert module.ROUND_TRIP_COST_BPS == 20.0
          assert module.MIN_COST_AWARE_RR == 1.0
          assert module.MAX_HOLD_MINUTES == 60
          assert module.GLOBAL_EPISODE_MINUTES == 3
          assert module.RISK_FRACTION == 0.03
          freeze = Path("research/candidate-60/METAORDER_LIFECYCLE_EXHAUSTION_V1_FREEZE.md").read_text()
          for text in (
              "2026-04-13",
              "2026-04-19",
              "2026-08-03",
              "2026-08-09",
              "run-start open",
              "0.15 × ATR(30)",
          ):
              assert text in freeze
          print("metaorder lifecycle state, geometry and untouched reservation verified")
          PY

      - name: Run consumed-development causal lifecycle screen
        id: study
        shell: bash
        run: |
          set +e
          mkdir -p "$OUT" "$CONSOLE"
          set -o pipefail
          C60_RESEARCH_ROOT="$C60_RESEARCH_ROOT" \
            python "$SCRIPT" \
              --start 2026-04-13 \
              --end 2026-04-19 \
              --cache "$CACHE" \
              --output "$OUT" \
              2>&1 | tee "$CONSOLE/console.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify evidence without a performance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.study.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "metaorder lifecycle study failed; status=$status"
            exit "${status:-1}"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path("research/candidate-60/evidence/metaorder-lifecycle-exhaustion-v1")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["schema"] == "candidate-60-metaorder-lifecycle-exhaustion-v1"
          assert summary["interval"] == {"start": "2026-04-13", "end": "2026-04-19"}
          assert summary["interpretation_contract"]["reserved_fresh_consumed"] is False
          policy = summary["frozen_policy"]
          assert policy["minimum_run_age"] == 7
          assert policy["minimum_cumulative_impact_bps"] == 20.0
          assert policy["round_trip_cost_bps"] == 20.0
          assert policy["risk_fraction"] == 0.03
          for name in (
              "all_candidates.csv",
              "geometry_eligible.csv",
              "global_episodes_3m.csv",
              "one_slot_events.csv",
          ):
              assert (root / name).is_file()
          candidates = pd.read_csv(root / "all_candidates.csv")
          if not candidates.empty:
              assert candidates["side"].isin({-1, 1}).all()
              assert candidates["impact_decay"].astype(bool).all()
              assert candidates["efficiency_decay"].astype(bool).all()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit compact development evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "candidate-60-research-bot"
          git config user.email "candidate-60-research-bot@users.noreply.github.com"
          if [[ -d "$OUT" ]]; then
            git add -f "$OUT"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m \
                "candidate60: persist metaorder lifecycle development evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-60
                git rebase origin/research/candidate-60
                if git push origin HEAD:research/candidate-60; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-60-metaorder-lifecycle-exhaustion-v1
          path: |
            research/candidate-60/evidence/metaorder-lifecycle-exhaustion-v1
            .work/candidate-60-metaorder-lifecycle-exhaustion-v1-console/console.log
          if-no-files-found: warn
          retention-days: 90
