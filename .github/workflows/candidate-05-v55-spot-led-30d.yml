name: candidate-05-v55-spot-led-30d

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v55-spot-led-30d.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v55-spot-led-30d
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  continuous-30d:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v55_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v55-spot-led-30d
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment, observation contract and v55 isolation
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_led_repricing_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v55_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python - <<'PY'
          import strategy
          assert strategy.LiquidityResponseStrategy.__name__ == "SpotLedPriceDiscoveryStrategy"
          print(strategy.LiquidityResponseStrategy)
          PY

      - name: Run one continuous BTC development path through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v55_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-03-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-03-30 \
            --cache .cache/candidate-05-v55-spot-led-30d \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Attribute the new price-discovery family
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s "$ROOT/metrics.json"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())

          def number(value):
              if value is None:
                  return None
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          records = [
              item for item in closed
              if item.get("branch") == "SPOT_LED_PRICE_DISCOVERY_PULLBACK"
          ]
          pnls = [number(item.get("realized_pnl")) for item in records]
          pnls = [value for value in pnls if value is not None and math.isfinite(value)]
          branch = {
              "trades": len(pnls),
              "wins": sum(value > 0.0 for value in pnls),
              "losses": sum(value < 0.0 for value in pnls),
              "net_pnl_usdt": sum(pnls),
              "pnls_usdt": pnls,
              "signal_bars": diagnostics.get("spot_led_signal_bars", 0),
              "contexts_created": diagnostics.get("spot_led_contexts_created", 0),
              "contexts_accepted": diagnostics.get("spot_led_contexts_accepted", 0),
              "detector_activations": diagnostics.get("spot_led_context_detector_activations", 0),
              "pullbacks_armed": diagnostics.get("spot_led_internal_pullbacks_armed", 0),
              "submissions": diagnostics.get("spot_led_submissions", 0),
              "opposite_conflicts": diagnostics.get("spot_led_opposite_signal_conflicts", 0),
              "invalidations": diagnostics.get("spot_led_contexts_invalidated", 0),
              "expiries": diagnostics.get("spot_led_contexts_expired", 0),
          }
          integrity = (
              int(metrics.get("liquidations", 0)) == 0
              and int(metrics.get("order_rejections", 0)) == 0
              and int(metrics.get("order_denials", 0)) == 0
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          baseline_return = 0.056446145529302605
          classification = "V55_NO_INCREMENTAL_EDGE"
          if not integrity:
              classification = "V55_EXECUTION_INTEGRITY_FAILURE"
          elif branch["trades"] >= 2 and branch["net_pnl_usdt"] > 0.0 and float(metrics.get("total_return", 0.0)) > baseline_return:
              classification = "V55_POSITIVE_INCREMENTAL_PRICE_DISCOVERY_EDGE"
          elif branch["trades"] == 0:
              classification = "V55_ZERO_TRADE_BOTTLENECK_DIAGNOSE"
          result = {
              "schema": "candidate-05-v55-spot-led-30d-v1",
              "classification": classification,
              "integrity_pass": integrity,
              "baseline_reference": {
                  "candidate": "v46",
                  "same_period_total_return": baseline_return,
                  "same_period_trades": 4,
                  "same_period_wins": 4,
              },
              "candidate_metrics": metrics,
              "incremental_branch": branch,
              "strategy_diagnostics": diagnostics,
          }
          (root / "v55_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s "$ROOT/metrics.json"; then
            python -m json.tool "$ROOT/metrics.json"
            python -m json.tool "$ROOT/v55_decision.json"
            for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
              test -s "$ROOT/$file"
            done
            grep -q 'spot_aggTrades' "$ROOT/raw_evidence.json"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v55-spot-led-30d-${{ github.sha }}
          path: artifacts/candidate-05-v55-spot-led-30d/**
          if-no-files-found: warn
          retention-days: 90
