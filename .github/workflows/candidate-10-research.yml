name: candidate-10-research

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/run_research.py
      - research/candidate-10/candidate.py
      - research/candidate-10/c10_*.py
      - research/candidate-10/test_*.py
      - .github/workflows/candidate-10-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-10-research-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-10
          chmod -R a+rwx artifacts

      - name: Test and run first random BTC week in pinned NautilusTrader image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/workspace/src:/workspace/research/candidate-10 \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              smc4 doctor
              python -m unittest discover -s research/candidate-10 -p "test_*.py" -v
              python research/candidate-10/run_research.py \
                --phase gate \
                --output artifacts/candidate-10 \
                --data-root /tmp/candidate-10-data
            '

      - name: Upload reproducible research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-gate-${{ github.sha }}
          path: artifacts/candidate-10
          if-no-files-found: warn
          retention-days: 14
