name: Candidate 06 Final Evidence Compiler

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - "artifacts/candidate-06/terminal-stage/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-06-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - name: Checkout all committed evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile exact terminal report
        id: status
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python research/candidate-06/finalize_status.py \
            --repository . \
            --output research/candidate-06/FINAL_STATUS.md \
            --json-output research/candidate-06/FINAL_STATUS.json
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Copy final report into artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-06/final
          cp research/candidate-06/FINAL_STATUS.md artifacts/candidate-06/final/FINAL_STATUS.md
          cp research/candidate-06/FINAL_STATUS.json artifacts/candidate-06/final/FINAL_STATUS.json
          printf '%s\n' '${{ steps.status.outputs.exit_code }}' > artifacts/candidate-06/final/status_exit_code.txt

      - name: Commit final status
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f research/candidate-06/FINAL_STATUS.md research/candidate-06/FINAL_STATUS.json artifacts/candidate-06/final
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize candidate-06 research evidence [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin research/candidate-06 && git push origin HEAD:research/candidate-06; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "failed to persist final status" >&2
          exit 1

      - name: Upload final status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-final-status
          path: |
            research/candidate-06/FINAL_STATUS.md
            research/candidate-06/FINAL_STATUS.json
            artifacts/candidate-06/final
          if-no-files-found: error
          retention-days: 90

      - name: Enforce terminal decision
        if: always()
        shell: bash
        run: |
          code='${{ steps.status.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "status compiler did not report an exit code" >&2
            exit 1
          fi
          exit "$code"
