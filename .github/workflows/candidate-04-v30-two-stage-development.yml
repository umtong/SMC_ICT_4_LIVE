name: candidate-04-v30-two-stage-development

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v30-two-stage-development.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: low_activity
            source_run: 31105658664
            source_name: candidate-04-v27-cross-low_activity-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2023-08-02"
            build_end: "2023-08-10"
            evaluation_start: "2023-08-04"
            evaluation_end: "2023-08-10"
          - name: normal_basis
            source_run: 31105658664
            source_name: candidate-04-v27-cross-normal_basis-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2023-12-16"
            build_end: "2023-12-24"
            evaluation_start: "2023-12-18"
            evaluation_end: "2023-12-24"
          - name: stress_a
            source_run: 31105658664
            source_name: candidate-04-v27-cross-stress_a-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2024-08-05"
            build_end: "2024-08-13"
            evaluation_start: "2024-08-07"
            evaluation_end: "2024-08-13"
          - name: year_end
            source_run: 31105658664
            source_name: candidate-04-v27-cross-year_end-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2024-12-25"
            build_end: "2025-01-02"
            evaluation_start: "2024-12-27"
            evaluation_end: "2025-01-02"
          - name: autumn
            source_run: 31105658664
            source_name: candidate-04-v27-cross-autumn-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2025-10-18"
            build_end: "2025-10-26"
            evaluation_start: "2025-10-20"
            evaluation_end: "2025-10-26"
          - name: may_2024
            source_run: 31105658664
            source_name: candidate-04-v27-cross-may_2024-5bea08863f38c2dfa9f83b63e5c614d241a06bb2
            rich_subpath: source/rich
            build_start: "2024-05-25"
            build_end: "2024-06-02"
            evaluation_start: "2024-05-27"
            evaluation_end: "2024-06-02"
          - name: failed_untouched_2025_03
            source_run: 31110828251
            source_name: candidate-04-v29-untouched-week-1-04774b3ca7536bf8fad6e9671027d6826ece6ed2
            rich_subpath: rich
            build_start: "2025-03-22"
            build_end: "2025-03-30"
            evaluation_start: "2025-03-24"
            evaluation_end: "2025-03-30"
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      MATRIX_NAME: ${{ matrix.name }}
      C04_BUILD_START: ${{ matrix.build_start }}
      C04_BUILD_END: ${{ matrix.build_end }}
      C04_EVALUATION_START: ${{ matrix.evaluation_start }}
      C04_EVALUATION_END: ${{ matrix.evaluation_end }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact completed-data observations
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_name }}
          path: artifacts/candidate-04-v30/${{ matrix.name }}/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ matrix.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fixed runtime and two-stage contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          root="artifacts/candidate-04-v30/$MATRIX_NAME"
          rich="$root/source/${{ matrix.rich_subpath }}"
          test -s "$rich/data_manifest.json"
          python -m compileall -q \
            research/candidate-04/two_stage_auction_resolution_compiler.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_two_stage_auction_resolution_compiler.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v

      - name: Compile V30 completed-data intents without execution or PnL
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v30/$MATRIX_NAME"
          rich="$root/source/${{ matrix.rich_subpath }}"
          python research/candidate-04/two_stage_auction_resolution_compiler.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$rich" \
            --kline-dir ".cache/candidate-04-v30/$MATRIX_NAME/raw" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --output "$root/signals" \
            --download-klines \
            | tee "$root/signal_compiler_console.json"
          test -s "$root/signals/signals.json"
          test -s "$root/signals/summary.json"

      - name: Execute V30 exclusively through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v30/$MATRIX_NAME"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v30/$MATRIX_NAME/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk and summarize V30 week
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v30") / os.environ["MATRIX_NAME"]
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          signals = json.loads((root / "signals/summary.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry-position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV contract")
          summary = {
              "candidate": "candidate-04-v30-two-stage-auction-resolution",
              "matrix": os.environ["MATRIX_NAME"],
              "evaluation_start": os.environ["C04_EVALUATION_START"],
              "evaluation_end": os.environ["C04_EVALUATION_END"],
              "engine": metrics.get("engine"),
              "signals": signals.get("written_signals"),
              "two_stage_route_counts": signals.get("two_stage_route_counts"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "gate_checks": metrics.get("gate_checks"),
              "gate_pass": metrics.get("gate_pass"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v30-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-04-v30/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v30-*
          path: artifacts

      - name: Aggregate completed V30 weeks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from collections import defaultdict
          from pathlib import Path

          rows = []
          for path in sorted(Path("artifacts").glob("candidate-04-v30-*/summary.json")):
              rows.append(json.loads(path.read_text()))
          if len(rows) != 7:
              raise SystemExit(f"expected 7 completed summaries, found {len(rows)}")
          returns = [float(row["total_return"]) for row in rows]
          compounded = math.prod(1.0 + value for value in returns) - 1.0
          trades = sum(int(row["trades"]) for row in rows)
          wins = sum(int(row["wins"]) for row in rows)
          scenarios = defaultdict(lambda: {"trades": 0, "wins": 0, "net_pnl": 0.0})
          for row in rows:
              for scenario, values in (row.get("scenario_metrics") or {}).items():
                  scenarios[scenario]["trades"] += int(values.get("trades", 0))
                  scenarios[scenario]["wins"] += int(values.get("wins", 0))
                  scenarios[scenario]["net_pnl"] += float(values.get("net_pnl", 0.0))
          result = {
              "candidate": "candidate-04-v30-two-stage-auction-resolution",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "weeks": rows,
              "calendar_days": 49,
              "all_weeks_positive": all(value > 0.0 for value in returns),
              "compounded_return": compounded,
              "geometric_daily_growth": (1.0 + compounded) ** (1.0 / 49.0) - 1.0,
              "trades": trades,
              "wins": wins,
              "win_rate": wins / trades if trades else 0.0,
              "scenario_totals": dict(scenarios),
              "development_target_reached": (
                  all(value > 0.0 for value in returns)
                  and (1.0 + compounded) ** (1.0 / 49.0) - 1.0 >= 0.01
              ),
          }
          Path("aggregate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-04-v30-aggregate-${{ github.sha }}
          path: aggregate.json
          if-no-files-found: error
          retention-days: 90
