name: candidate-04-v24-causal-impact-split

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v24-causal-impact-split.yml"
      - "research/candidate-04/rich_signal_compiler_v24.py"
      - "research/candidate-04/tests/test_rich_signal_compiler_v24.py"
      - "research/candidate-04/nt_rich_signal_strategy.py"
      - "research/candidate-04/nt_backtest_v22_rich_router.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: low_activity
            build_start: "2023-08-02"
            build_end: "2023-08-10"
            evaluation_start: "2023-08-04"
            evaluation_end: "2023-08-10"
          - name: normal_basis
            build_start: "2023-12-16"
            build_end: "2023-12-24"
            evaluation_start: "2023-12-18"
            evaluation_end: "2023-12-24"
          - name: stress_a
            build_start: "2024-08-05"
            build_end: "2024-08-13"
            evaluation_start: "2024-08-07"
            evaluation_end: "2024-08-13"
          - name: year_end
            build_start: "2024-12-25"
            build_end: "2025-01-02"
            evaluation_start: "2024-12-27"
            evaluation_end: "2025-01-02"
          - name: autumn
            build_start: "2025-10-18"
            build_end: "2025-10-26"
            evaluation_start: "2025-10-20"
            evaluation_end: "2025-10-26"
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      C04_BUILD_START: ${{ matrix.build_start }}
      C04_BUILD_END: ${{ matrix.build_end }}
      MATRIX_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore checksummed completed-data observations
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-v22-${{ matrix.name }}-a6a57d63d580e5baea6dc6703ac6e2a281817896
          path: artifacts/candidate-04-v24/${{ matrix.name }}/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31083152629
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fixed runtime and V24 causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/rich_signal_compiler_v22.py \
            research/candidate-04/rich_signal_compiler_v22b.py \
            research/candidate-04/rich_signal_compiler_v23.py \
            research/candidate-04/rich_signal_compiler_v24.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_rich_signal_compiler_v24.py' -v
          python -m unittest research/candidate-04/tests/test_rich_features_v2.py -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_liquidity_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v
          root="artifacts/candidate-04-v24/${{ matrix.name }}"
          test -s "$root/source/rich/data_manifest.json"

      - name: Compile V24 completed-data intents without execution or PnL
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v24/${{ matrix.name }}"
          python research/candidate-04/rich_signal_compiler_v24.py \
            --base-config research/candidate-04/inventory_transfer_config.json \
            --impact-config research/candidate-04/impact_exhaustion_config.json \
            --router-config research/candidate-04/auction_activity_router_config.json \
            --rich-dir "$root/source/rich" \
            --kline-dir ".cache/candidate-04-v24/${{ matrix.name }}/raw" \
            --evaluation-start "${{ matrix.evaluation_start }}" \
            --evaluation-end "${{ matrix.evaluation_end }}" \
            --output "$root/signals" \
            --download-klines \
            | tee "$root/signal_compiler_console.json"
          test -s "$root/signals/signals.json"
          test -s "$root/signals/summary.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/candidate-04-v24") / os.environ["MATRIX_NAME"]
          rows = json.loads((root / "signals/signals.json").read_text())
          previous = -1
          forbidden = {"PARENT_AUCTION_SHOCK_REACCEPTANCE"}
          for row in rows:
              timestamp = int(row["observe_time_ns"])
              if timestamp < previous:
                  raise SystemExit("signals are not time ordered")
              previous = timestamp
              if int(row["side"]) not in (-1, 1):
                  raise SystemExit("invalid signal side")
              if str(row["scenario"]) in forbidden:
                  raise SystemExit("discarded V23 scenario survived V24")
          print(json.dumps({"signals": len(rows)}, sort_keys=True))
          PY

      - name: Execute V24 intents exclusively through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v24/${{ matrix.name }}"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "${{ matrix.build_start }}" \
            --build-end "${{ matrix.build_end }}" \
            --evaluation-start "${{ matrix.evaluation_start }}" \
            --evaluation-end "${{ matrix.evaluation_end }}" \
            --cache ".cache/candidate-04-v24/${{ matrix.name }}/raw" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -s "$root/nautilus/run.json"
          test -s "$root/nautilus/orders.csv"
          test -s "$root/nautilus/positions.csv"
          test -s "$root/nautilus/equity.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify realized-loss contract and summarize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/candidate-04-v24") / os.environ["MATRIX_NAME"]
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          positions = pd.read_csv(root / "nautilus/positions.csv")
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry/position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  equity = float(entry["details"]["equity"])
                  losses.append(abs(pnl) / equity)
          maximum = max(losses, default=0.0)
          signal_summary = json.loads((root / "signals/summary.json").read_text())
          summary = {
              "matrix": os.environ["MATRIX_NAME"],
              "candidate": "candidate-04-v24-causal-impact-split",
              "engine": metrics.get("engine"),
              "signals": signal_summary.get("written_signals"),
              "route_counts": signal_summary.get("route_counts"),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "win_rate": metrics.get("win_rate"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "largest_winner_share": metrics.get("largest_winner_share"),
              "gate_pass": metrics.get("gate_pass"),
              "scenario_metrics": metrics.get("scenario_metrics"),
              "maximum_realized_loss_fraction": maximum,
              "risk_pass": maximum <= 0.0301,
          }
          (root / "risk_verification.json").write_text(
              json.dumps(
                  {
                      "maximum_realized_loss_fraction": maximum,
                      "loss_fractions": losses,
                      "limit": 0.03,
                      "pass": summary["risk_pass"],
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not summary["risk_pass"]:
              raise SystemExit("realized loss exceeded 3% NAV contract")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v24-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-04-v24/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90
