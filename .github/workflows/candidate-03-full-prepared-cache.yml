name: candidate-03-full-first-week-catalog-cache

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-full-prepared-cache.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  PYTHONPATH: /workspace/src:/workspace/research/candidate-03

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore causal preflight inputs
        uses: actions/cache/restore@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr/validation-1/prepared
          key: nt-lvcfr-v4-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_config.json') }}
          fail-on-cache-miss: true
      - name: Materialize full verified NautilusTrader catalog
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R a+rwX artifacts
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c 'PYTHONPATH=/workspace/src:/workspace/research/candidate-03 python - <<"PY"
          from datetime import date
          from pathlib import Path
          from nt_lvcfr_data import CandidateConfig, prepare_week

          root = Path("artifacts/candidate-03/nt-lvcfr/validation-1/prepared")
          config = CandidateConfig.load(Path("research/candidate-03/nt_lvcfr_config.json"))
          manifest = prepare_week(
              week_start=date.fromisoformat("2024-01-08"),
              output_root=root,
              config=config,
          )
          print({
              "signals": manifest["signals"],
              "quotes": manifest["catalog"]["quote_ticks_retained"],
              "funding": manifest["catalog"]["funding_updates"],
          })
          PY'
          test -f artifacts/candidate-03/nt-lvcfr/validation-1/prepared/data_manifest.json
      - name: Save immutable full prepared catalog
        uses: actions/cache/save@v4
        with:
          path: artifacts/candidate-03/nt-lvcfr/validation-1/prepared
          key: nt-lvcfr-full-v1-btc-2024-01-08-${{ hashFiles('research/candidate-03/nt_lvcfr_data.py', 'research/candidate-03/nt_lvcfr_config.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-03-full-cache-manifest-${{ github.sha }}
          path: artifacts/candidate-03/nt-lvcfr/validation-1/prepared/data_manifest.json
          if-no-files-found: error
          retention-days: 3
