name: candidate-08-native-l1-quote-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-native-l1-quote-v2"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-08-native-l1-quote-v2
  cancel-in-progress: true

jobs:
  correct-and-evaluate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-08:src
      MARKER: research/candidate-08/.run-native-l1-quote-v2
      OLD_MARKER: research/candidate-08/.fix-native-l1-quote-tick-v1
      PATCH_SCRIPT: research/candidate-08/apply_native_l1_quote_v2.py
      WORKFLOW_FILE: .github/workflows/candidate-08-native-l1-quote-tick-fix-v1.yml
      OUTPUT_DIR: research/candidate-08/evidence/native-l1-quote-v2-first
      LOG: research/candidate-08/evidence/native-l1-quote-v2-first/workflow.log
      STATUS: research/candidate-08/evidence/native-l1-quote-v2-first/exit_status.txt
      CACHE_DIR: .cache/candidate-08-quote-resiliency
      CONFIG: research/candidate-08/config_quote_resiliency_btc_v1.json
      PATTERN_CONFIG: research/candidate-08/config_range_fvg.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-08-quote-resiliency
          key: candidate-08-native-l1-v2-${{ hashFiles('research/candidate-08/config_quote_resiliency_btc_v1.json') }}
          restore-keys: |
            candidate-08-native-l1-v2-
            candidate-08-quote-resiliency-data-v1-

      - name: Correct execution and run frozen BTC week
        id: research
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR" "$CACHE_DIR"
          set +e
          (
            set -euo pipefail
            smc4 doctor
            python "$PATCH_SCRIPT"
            sed -i 's/BINANCE_USDM_BOOKTICKER_COMPLETED_10S_V2_TRUE_STREAMING/BINANCE_USDM_BOOKTICKER_COMPLETED_10S_V3_NATIVE_L1_SOURCE_TIME/g' \
              research/candidate-08/test_quote_resiliency_data.py
            sed -i 's/self.assertEqual(expected_one_tick_entry_fill(100.1, 1, 0.1), 100.2)/self.assertAlmostEqual(expected_one_tick_entry_fill(100.1, 1, 0.1), 100.2, places=12)/' \
              research/candidate-08/test_quote_resiliency_execution_price_contract.py
            sed -i 's/self.assertEqual(expected_one_tick_entry_fill(99.9, -1, 0.1), 99.8)/self.assertAlmostEqual(expected_one_tick_entry_fill(99.9, -1, 0.1), 99.8, places=12)/' \
              research/candidate-08/test_quote_resiliency_execution_price_contract.py
            python -m compileall -q research/candidate-08
            python research/candidate-08/test_quote_resiliency_features_v3.py -v
            python research/candidate-08/test_quote_resiliency_data.py -v
            python research/candidate-08/test_quote_resiliency_signals.py -v
            python research/candidate-08/test_quote_resiliency_transition_contract.py -v
            python research/candidate-08/test_quote_resiliency_execution_price_contract.py -v
            python research/candidate-08/test_quote_resiliency_native_quotes.py -v
            python research/candidate-08/test_quote_resiliency_native_adapter.py -v
            python research/candidate-08/test_quote_resiliency_config_path.py -v
            python research/candidate-08/test_quote_resiliency_stage_decision.py -v
            python research/candidate-08/run_quote_resiliency_nautilus.py \
              --suite first \
              --config "$CONFIG" \
              --pattern-config "$PATTERN_CONFIG" \
              --output "$OUTPUT_DIR" \
              --data-cache "$CACHE_DIR" \
              --ablation none
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/candidate-08/evidence/native-l1-quote-v2-first/frozen-week-01")
          metrics = json.loads((root / "metrics.json").read_text())
          intents = json.loads((root / "trade_intents.json").read_text())["trade_intents"]
          native = metrics.get("native_quote_execution", {})
          assert native.get("enabled") and int(native.get("quote_ticks", 0)) > 0
          required = {
              "native_quote_submission_time_ns",
              "native_quote_submission_delay_ns",
              "entry_quote_reference",
              "expected_entry_fill",
              "visible_entry_side_qty",
              "quantity_to_visible_l1_ratio",
          }
          for intent in intents:
              assert required.issubset(intent), intent.get("scenario_id")
              assert int(intent["native_quote_submission_delay_ns"]) == 1
              assert float(intent["planned_stop_loss"]) <= float(intent["risk_budget"]) + 1e-6
              adjusted = intent.get("fill_adjusted_expected_stop_loss")
              if adjusted is not None:
                  assert float(adjusted) <= float(intent["risk_budget"]) + 1e-6
          PY
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$STATUS"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Commit corrected source and evidence
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$MARKER" "$OLD_MARKER"
          if [[ "${STATUS_VALUE:-1}" == "0" ]]; then
            rm -f "$PATCH_SCRIPT" "$WORKFLOW_FILE"
          fi
          git add -A -- research/candidate-08 "$WORKFLOW_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-08: evaluate quote resiliency on native L1 fills [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-08
            if git rebase origin/research/candidate-08 && git push origin HEAD:research/candidate-08; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

      - name: Enforce native L1 implementation audit
        if: ${{ always() }}
        shell: bash
        env:
          STATUS_VALUE: ${{ steps.research.outputs.status }}
        run: |
          [[ -n "$STATUS_VALUE" ]]
          [[ "$STATUS_VALUE" == "0" ]]
