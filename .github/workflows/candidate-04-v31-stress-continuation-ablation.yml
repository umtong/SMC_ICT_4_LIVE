name: candidate-04-v31-stress-continuation-ablation

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v31-stress-continuation-ablation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: low_activity
            source_name: candidate-04-v31-low_activity-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2023-08-02"
            build_end: "2023-08-10"
            evaluation_start: "2023-08-04"
            evaluation_end: "2023-08-10"
          - name: normal_basis
            source_name: candidate-04-v31-normal_basis-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2023-12-16"
            build_end: "2023-12-24"
            evaluation_start: "2023-12-18"
            evaluation_end: "2023-12-24"
          - name: stress_a
            source_name: candidate-04-v31-stress_a-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2024-08-05"
            build_end: "2024-08-13"
            evaluation_start: "2024-08-07"
            evaluation_end: "2024-08-13"
          - name: year_end
            source_name: candidate-04-v31-year_end-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2024-12-25"
            build_end: "2025-01-02"
            evaluation_start: "2024-12-27"
            evaluation_end: "2025-01-02"
          - name: autumn
            source_name: candidate-04-v31-autumn-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2025-10-18"
            build_end: "2025-10-26"
            evaluation_start: "2025-10-20"
            evaluation_end: "2025-10-26"
          - name: may_2024
            source_name: candidate-04-v31-may_2024-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2024-05-25"
            build_end: "2024-06-02"
            evaluation_start: "2024-05-27"
            evaluation_end: "2024-06-02"
          - name: failed_untouched_2025_03
            source_name: candidate-04-v31-failed_untouched_2025_03-de2717744c5c7fe1cd8e65ce35fe2cd7f1724bf9
            build_start: "2025-03-22"
            build_end: "2025-03-30"
            evaluation_start: "2025-03-24"
            evaluation_end: "2025-03-30"
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
      MATRIX_NAME: ${{ matrix.name }}
      C04_BUILD_START: ${{ matrix.build_start }}
      C04_BUILD_END: ${{ matrix.build_end }}
      C04_EVALUATION_START: ${{ matrix.evaluation_start }}
      C04_EVALUATION_END: ${{ matrix.evaluation_end }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact V31 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_name }}
          path: artifacts/candidate-04-v31-ablation/${{ matrix.name }}/original
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31113803676
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove only settled stress acceptance continuation
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          root="artifacts/candidate-04-v31-ablation/$MATRIX_NAME"
          python -m compileall -q \
            research/candidate-04/ablate_compiled_scenario.py \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python research/candidate-04/ablate_compiled_scenario.py \
            --input-signals "$root/original/signals/signals.json" \
            --input-summary "$root/original/signals/summary.json" \
            --remove STRESS_SETTLED_ACCEPTANCE_CONTINUATION \
            --candidate candidate-04-v31-no-stress-settled-continuation \
            --output "$root/ablated/signals"
          test -s "$root/ablated/signals/signals.json"
          test -s "$root/ablated/signals/summary.json"

      - name: Replay unchanged retained intents through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-v31-ablation/$MATRIX_NAME"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/ablated/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "$C04_BUILD_START" \
            --build-end "$C04_BUILD_END" \
            --evaluation-start "$C04_EVALUATION_START" \
            --evaluation-end "$C04_EVALUATION_END" \
            --cache ".cache/candidate-04-v31-ablation/$MATRIX_NAME/raw" \
            --output "$root/ablated/nautilus" \
            | tee "$root/ablated/nautilus_console.json"
          test -s "$root/ablated/nautilus/metrics.json"
          test -e "$root/ablated/nautilus/positions.csv"
          test -s "$root/ablated/nautilus/strategy_events.json"

      - name: Verify risk and compare single-scenario ablation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-v31-ablation") / os.environ["MATRIX_NAME"]
          original = json.loads((root / "original/summary.json").read_text())
          metrics = json.loads((root / "ablated/nautilus/metrics.json").read_text())
          signals = json.loads((root / "ablated/signals/summary.json").read_text())
          events = json.loads((root / "ablated/nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "ablated/nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          if len(entries) != len(positions.index):
              raise SystemExit("entry-position mismatch")
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          if maximum > 0.0301:
              raise SystemExit("realized loss exceeded 3% NAV")
          summary = {
              "matrix": os.environ["MATRIX_NAME"],
              "changed_variables": 1,
              "removed_scenario": "STRESS_SETTLED_ACCEPTANCE_CONTINUATION",
              "removed_signal_count": signals["ablation"]["removed_signal_count"],
              "original": {
                  "trades": original.get("trades"),
                  "wins": original.get("wins"),
                  "total_return": original.get("total_return"),
                  "geometric_daily_growth": original.get("geometric_daily_growth"),
              },
              "ablated": {
                  "trades": metrics.get("trades"),
                  "wins": metrics.get("wins"),
                  "win_rate": metrics.get("win_rate"),
                  "total_return": metrics.get("total_return"),
                  "geometric_daily_growth": metrics.get("geometric_daily_growth"),
                  "active_days": metrics.get("active_days"),
                  "max_drawdown": metrics.get("max_drawdown"),
                  "scenario_metrics": metrics.get("scenario_metrics"),
                  "maximum_realized_loss_fraction": maximum,
              },
              "engine": "NautilusTrader BacktestNode",
          }
          (root / "comparison.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v31-ablation-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-04-v31-ablation/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-04-v31-ablation-*
          path: artifacts

      - name: Aggregate final V31 ablation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          rows = [
              json.loads(path.read_text())
              for path in sorted(Path("artifacts").glob("candidate-04-v31-ablation-*/comparison.json"))
          ]
          if len(rows) != 7:
              raise SystemExit(f"expected 7 comparisons, found {len(rows)}")
          values = [float(row["ablated"]["total_return"]) for row in rows]
          compounded = math.prod(1.0 + value for value in values) - 1.0
          trades = sum(int(row["ablated"]["trades"]) for row in rows)
          wins = sum(int(row["ablated"]["wins"]) for row in rows)
          failed_week = next(row for row in rows if row["matrix"] == "failed_untouched_2025_03")
          result = {
              "candidate": "candidate-04-v31-no-stress-settled-continuation",
              "changed_variables": 1,
              "removed_scenario": "STRESS_SETTLED_ACCEPTANCE_CONTINUATION",
              "engine": "NautilusTrader 1.230.0 BacktestNode",
              "weeks": rows,
              "calendar_days": 49,
              "all_weeks_positive": all(value > 0.0 for value in values),
              "compounded_return": compounded,
              "geometric_daily_growth": (1.0 + compounded) ** (1.0 / 49.0) - 1.0,
              "trades": trades,
              "wins": wins,
              "win_rate": wins / trades if trades else 0.0,
              "failed_week": failed_week["ablated"],
              "structural_path_exists": (
                  failed_week["ablated"]["trades"] >= 7
                  and failed_week["ablated"]["geometric_daily_growth"] >= 0.01
              ),
          }
          Path("aggregate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-04-v31-ablation-aggregate-${{ github.sha }}
          path: aggregate.json
          if-no-files-found: error
          retention-days: 90
