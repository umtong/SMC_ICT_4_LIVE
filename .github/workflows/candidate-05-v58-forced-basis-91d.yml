name: candidate-05-v58-forced-basis-91d

# Rerun after correcting a test-only source-inspection assertion. Strategy,
# data, dates, costs, risk and promotion logic remain unchanged.
on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-v58-forced-basis-91d.yml"
  workflow_dispatch:

concurrency:
  group: candidate-05-v58-forced-basis-91d
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  continuous-91d:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05/v58_active:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-05-v58-forced-basis-91d
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and additive v58 contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-05
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_spot_price_discovery_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_basis_dislocation_logic.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v58_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_strategy_v46_no_post_retrace_breakaway_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v
          PYTHONPATH=research/candidate-05 python -m unittest discover -s research/candidate-05/tests -p 'test_positioning_contract.py' -v
          python - <<'PY'
          import strategy
          assert strategy.LiquidityResponseStrategy.__name__ == "ForcedBasisReversionStrategy"
          print(strategy.LiquidityResponseStrategy)
          PY

      - name: Run one uninterrupted BTC account for 91 days in NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-05/v58_active/candidate.py stage \
            --config research/candidate-05/config.json \
            --build-start 2024-02-28 \
            --build-end 2024-05-30 \
            --evaluation-start 2024-03-01 \
            --evaluation-end 2024-05-30 \
            --cache .cache/candidate-05-v58-forced-basis-91d \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Attribute forced basis family and compare v46
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s "$ROOT/metrics.json"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          closed = json.loads((root / "closed_scenarios.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())

          def number(value):
              if value is None:
                  return None
              try:
                  return float(str(value).strip().split()[0].replace(",", ""))
              except Exception:
                  return None

          records = [
              item for item in closed
              if item.get("branch") == "FORCED_SPOT_PERP_BASIS_REVERSION"
          ]
          pnls = [number(item.get("realized_pnl")) for item in records]
          pnls = [value for value in pnls if value is not None and math.isfinite(value)]
          branch = {
              "trades": len(pnls),
              "wins": sum(value > 0.0 for value in pnls),
              "losses": sum(value < 0.0 for value in pnls),
              "net_pnl_usdt": sum(pnls),
              "pnls_usdt": pnls,
              "basis_observations": diagnostics.get("basis_observations", 0),
              "statistical_dislocations": diagnostics.get("basis_statistical_dislocations", 0),
              "forced_confirmations": diagnostics.get("basis_forced_transfer_confirmations", 0),
              "slot_conflicts": diagnostics.get("basis_slot_conflicts", 0),
              "invalid_geometry": diagnostics.get("basis_invalid_geometry", 0),
              "insufficient_target_r": diagnostics.get("basis_insufficient_target_r", 0),
              "submissions": diagnostics.get("basis_submissions", 0),
              "long_signals": diagnostics.get("basis_long_signals", 0),
              "short_signals": diagnostics.get("basis_short_signals", 0),
          }
          integrity = (
              int(metrics.get("liquidations", 0)) == 0
              and int(metrics.get("order_rejections", 0)) == 0
              and int(metrics.get("order_denials", 0)) == 0
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          baseline_return = 0.0256520
          classification = "V58_NO_INCREMENTAL_EDGE"
          if not integrity:
              classification = "V58_EXECUTION_INTEGRITY_FAILURE"
          elif branch["trades"] >= 3 and branch["net_pnl_usdt"] > 0.0 and float(metrics.get("total_return", 0.0)) > baseline_return:
              classification = "V58_POSITIVE_FORCED_BASIS_EDGE"
          elif branch["trades"] == 0:
              classification = "V58_ZERO_TRADE_BOTTLENECK_DIAGNOSE"
          result = {
              "schema": "candidate-05-v58-forced-basis-91d-v1",
              "classification": classification,
              "integrity_pass": integrity,
              "baseline_v46": {
                  "total_return": baseline_return,
                  "trades": 16,
                  "wins": 11,
                  "profit_factor": 1.204,
                  "max_drawdown": 0.0709,
              },
              "candidate_metrics": metrics,
              "incremental_branch": branch,
              "strategy_diagnostics": diagnostics,
          }
          (root / "v58_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=True) + "\n",
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s "$ROOT/metrics.json"; then
            python -m json.tool "$ROOT/metrics.json"
            python -m json.tool "$ROOT/v58_decision.json"
            for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl; do
              test -s "$ROOT/$file"
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-v58-forced-basis-91d-${{ github.sha }}
          path: artifacts/candidate-05-v58-forced-basis-91d/**
          if-no-files-found: warn
          retention-days: 90
