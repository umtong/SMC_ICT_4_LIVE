name: Research ML-first integrated reachable router v6

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_first]
    paths:
      - '.github/workflows/research-candidate-ml-first-integrated-router-v6.yml'
      - 'research/candidate-ml-first-integrated-router-v6/**'
      - 'research/candidate-ml-first-causal-family-router-v5/causal_family_module.py'
      - 'research/candidate-ml-first-reachable-control-v4/reachable_control_policy.py'

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: research-candidate-ml-first-integrated-router-v6
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - id: resolve
        name: Resolve completed reachable-scenario source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            payload=$(gh api 'repos/umtong/SMC_ICT_4_LIVE/actions/workflows/research-candidate-ml-first-reachable-scenario-fusion-v3.yml/runs?branch=research_candidate_ML_first&per_page=10')
            run_id=$(python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs",[]); print(next((r["id"] for r in runs if r.get("status")=="completed" and r.get("conclusion")=="success"), ""))' <<<"$payload")
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            active=$(python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs",[]); print(any(r.get("status") in {"queued","in_progress","waiting","pending"} for r in runs))' <<<"$payload")
            if [ "$active" != "True" ]; then
              echo "No successful or active v3 source run exists" >&2
              exit 1
            fi
            sleep 90
          done
          echo "Timed out waiting for the v3 source run" >&2
          exit 1

  harvest-holdout:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {period: h-2024-nov10, start: 2024-11-10, end: 2024-11-17}
          - {period: h-2025-may10, start: 2025-05-10, end: 2025-05-17}
          - {period: h-2025-sep10, start: 2025-09-10, end: 2025-09-17}
          - {period: h-2025-dec10, start: 2025-12-10, end: 2025-12-17}
          - {period: h-2026-feb10, start: 2026-02-10, end: 2026-02-17}
          - {period: h-2026-may10, start: 2026-05-10, end: 2026-05-17}
          - {period: h-2026-jun10, start: 2026-06-10, end: 2026-06-17}
          - {period: h-2026-jul10, start: 2026-07-10, end: 2026-07-17}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: '1'
      CACHE: .cache/ml-first-integrated-router-v6/${{ matrix.period }}
      WINDOW_ROOT: artifacts/ml-first-integrated-router-v6/windows/${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      PERIOD: ${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - name: Checkout inherited causal engine
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: research_candidate_4_causal_inventory_transfer
          path: candidate4_runtime
          fetch-depth: 1
      - name: Compile route-fraction materializer
        run: |
          python -m py_compile research/candidate-ml-first-reachable-scenario-fusion-v3/patch_route_fraction.py
      - name: Harvest five fixed completion frontiers
        env:
          PYTHONPATH: candidate4_runtime/research/candidate-causal-liquidity-route-system:candidate4_runtime/research/candidate-liquidity-auction-v6:candidate4_runtime/research/candidate-liquidity-auction-v5:candidate4_runtime/research/candidate-coherent-auction-system-v4:candidate4_runtime/research/candidate-coherent-auction-system-v3:candidate4_runtime/research/candidate-coherent-liquidity-policy-v2:candidate4_runtime/research/candidate-coherent-liquidity-policy-v1:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v2:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v1:candidate4_runtime/research/candidate-liquidity-displacement-v1:candidate4_runtime/research/candidate-auction-dislocation-confluence-v1:candidate4_runtime/research/candidate-derivatives-dislocation-v1:candidate4_runtime/research/candidate-auction-episode-policy:candidate4_runtime/research/candidate-auction-event-v2:candidate4_runtime/research/candidate-direct-auction-policy:candidate4_runtime/research/candidate-easychart_re1:candidate4_runtime/research/candidate-easychart-v5:candidate4_runtime/research/candidate-easychart-v3
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$WINDOW_ROOT"
          for spec in f120:0.12 f180:0.18 f250:0.25 f330:0.33 f500:0.50; do
            tag=${spec%%:*}
            fraction=${spec##*:}
            git -C candidate4_runtime checkout -- .
            python research/candidate-ml-first-reachable-scenario-fusion-v3/patch_route_fraction.py \
              --root candidate4_runtime --fraction "$fraction"
            out="$WINDOW_ROOT/$tag"
            rm -rf "$out"
            mkdir -p "$out"
            python candidate4_runtime/research/candidate-causal-liquidity-route-system/causal_route_research.py \
              --start "$START" --end "$END" --role fresh --warmup-days 60 \
              --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
              --cache "$CACHE" --output "$out"
            python - "$out" "$fraction" "$PERIOD" <<'PY'
          import json, sys
          from pathlib import Path
          out, fraction, period = sys.argv[1:]
          Path(out, 'route_fraction.json').write_text(json.dumps({
              'route_target_fraction': float(fraction),
              'period': period,
              'role': 'fresh',
              'labeling': 'exact minute path; same-minute target and stop is loss',
          }, indent=2) + '\n')
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-integrated-v6-window-${{ matrix.period }}
          path: artifacts/ml-first-integrated-router-v6/windows/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  integrate-and-publish:
    needs: [resolve-v3, harvest-holdout]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - name: Checkout inherited causal engine
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: research_candidate_4_causal_inventory_transfer
          path: candidate4_runtime
          fetch-depth: 1
      - name: Download original eight-window development artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ml-first-reachable-scenario-fusion-v3-*
          path: artifacts/ml-first-integrated-router-v6/source-v3
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ needs.resolve-v3.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download eight untouched holdout windows
        uses: actions/download-artifact@v4
        with:
          pattern: ml-first-integrated-v6-window-*
          path: artifacts/ml-first-integrated-router-v6/downloaded-holdout
      - name: Stage untouched windows by fraction and period
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('artifacts/ml-first-integrated-router-v6/downloaded-holdout')
          stage = Path('artifacts/ml-first-integrated-router-v6/staged-holdout')
          shutil.rmtree(stage, ignore_errors=True)
          for tag in ('f120', 'f180', 'f250', 'f330', 'f500'):
              matches = sorted(path for path in root.rglob(tag) if path.is_dir())
              if len(matches) != 8:
                  raise SystemExit(f'{tag}: expected 8 untouched windows, found {len(matches)}')
              for source in matches:
                  period = next((part for part in source.parts if part.startswith('h-')), None)
                  if period is None:
                      artifact = next((part for part in source.parts if part.startswith('ml-first-integrated-v6-window-h-')), None)
                      if artifact:
                          period = artifact.removeprefix('ml-first-integrated-v6-window-')
                  if period is None:
                      raise SystemExit(f'cannot infer holdout period from {source}')
                  target = stage / tag / period
                  if target.exists():
                      raise SystemExit(f'duplicate staged period {target}')
                  shutil.copytree(source, target)
          PY
      - name: Aggregate untouched plans and combine with original development plans
        env:
          PYTHONPATH: candidate4_runtime/research/candidate-causal-liquidity-route-system
        run: |
          set -euo pipefail
          ROOT=artifacts/ml-first-integrated-router-v6
          old_aggregates=$(find "$ROOT/source-v3" -type d -name aggregates -print -quit)
          test -n "$old_aggregates"
          for tag in f120 f180 f250 f330 f500; do
            new_aggregate="$ROOT/holdout-aggregates/$tag"
            mkdir -p "$new_aggregate" "$ROOT/combined-plans/$tag/original-eight" "$ROOT/combined-plans/$tag/untouched-eight"
            python candidate4_runtime/research/candidate-causal-liquidity-route-system/aggregate_short.py \
              --root "$ROOT/staged-holdout/$tag" --output "$new_aggregate"
            cp "$old_aggregates/$tag/all_candidate_plans.csv.gz" \
              "$ROOT/combined-plans/$tag/original-eight/all_candidate_plans.csv.gz"
            cp "$new_aggregate/all_candidate_plans.csv.gz" \
              "$ROOT/combined-plans/$tag/untouched-eight/all_candidate_plans.csv.gz"
          done
      - name: Fit integrated router on prior windows and evaluate untouched windows
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-ml-first-reachable-control-v4/reachable_control_policy.py \
            research/candidate-ml-first-causal-family-router-v5/causal_family_module.py \
            research/candidate-ml-first-integrated-router-v6/integrated_reachable_router_v6b.py
          ROOT=artifacts/ml-first-integrated-router-v6
          OUT="$ROOT/policy"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python research/candidate-ml-first-integrated-router-v6/integrated_reachable_router_v6b.py \
            --root "$ROOT/combined-plans" --output "$OUT"
          git rev-parse HEAD > "$OUT/source_sha.txt"
          printf '%s\n' research_candidate_ML_first > "$OUT/source_branch.txt"
          printf '%s\n' '${{ needs.resolve-v3.outputs.run_id }}' > "$OUT/source_v3_run_id.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-integrated-reachable-router-v6-${{ github.sha }}
          path: |
            artifacts/ml-first-integrated-router-v6/policy/**
            artifacts/ml-first-integrated-router-v6/holdout-aggregates/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit integrated system and untouched evaluation
        run: |
          set -euo pipefail
          SRC=artifacts/ml-first-integrated-router-v6/policy
          DEST=research_results/candidate_ml_first/integrated_reachable_router_v6/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/"
          cp "$SRC/completed_trades.csv" "$DEST/"
          cp "$SRC/variant_metrics.csv" "$DEST/"
          cp "$SRC/hazard_component_catalog.csv" "$DEST/"
          cp "$SRC/family_component_catalog.csv" "$DEST/"
          cp "$SRC/period_metrics.csv" "$DEST/"
          cp "$SRC/model_bundle.joblib" "$DEST/"
          cp "$SRC/source_sha.txt" "$DEST/"
          cp "$SRC/source_branch.txt" "$DEST/"
          cp "$SRC/source_v3_run_id.txt" "$DEST/"
          digest=$(python - "$DEST/summary.json" <<'PY'
          import json, sys
          s=json.load(open(sys.argv[1])); d=s['development']; f=s['fresh']
          print(f"dev_nav={d['ending_nav_multiplier']:.3f} untouched_nav={f['ending_nav_multiplier']:.3f} untouched_n={f['completed_trades']} untouched_meanR={f['mean_net_r']:.3f} untouched_mdd={f['maximum_drawdown']:.3f} untouched_tpd={f['trades_per_day']:.3f}")
          PY
          )
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record integrated reachable router v6 ${GITHUB_RUN_ID}: ${digest}"
          git pull --rebase origin research_candidate_ML_first
          git push origin HEAD:research_candidate_ML_first
