name: candidate-easychart-v12-wm-trap-screen
on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - "research/candidate-easychart/market_v12.py"
      - "research/candidate-easychart/screen_v12.py"
      - "research/candidate-easychart/tests/test_market_v12.py"
      - ".github/workflows/candidate-easychart-v12.yml"
  workflow_dispatch:
concurrency:
  group: candidate-easychart-v12-wm-trap-screen
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      ROOT: artifacts/candidate-easychart-v12-development
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          smc4 doctor
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v | tee "$ROOT/verification.log"
      - name: Run source-shaped Trap families
        shell: bash
        run: |
          set -euo pipefail
          leader="PRIOR_DAY_NY,FUNDING_16_00,FUNDING_08_16,LONDON_NY"
          common=(--start 2024-02-01 --end 2024-02-28 --warmup-days 5 --cache "$CACHE" --signal-minutes 5 --accepted-break-widths 1.0 --cost-profile role --disable-fakeout)
          python research/candidate-easychart/screen_v12.py "${common[@]}" --families "$leader" --output "$ROOT/leader-wm"
          python research/candidate-easychart/screen_v12.py "${common[@]}" --families PRIOR_DAY_NY --output "$ROOT/prior-wm"
          python research/candidate-easychart/screen_v12.py "${common[@]}" --families FUNDING_16_00,FUNDING_08_16 --output "$ROOT/funding-wm"
          python research/candidate-easychart/screen_v12.py "${common[@]}" --families LONDON_NY --output "$ROOT/london-wm"
          python research/candidate-easychart/compare_v7.py --root "$ROOT" --variants leader-wm prior-wm funding-wm london-wm | tee "$ROOT/comparison.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v12-development-${{ github.sha }}
          path: artifacts/candidate-easychart-v12-development/**
          if-no-files-found: warn
          retention-days: 90
