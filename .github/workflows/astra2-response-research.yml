name: Astra2 origin response research
on:
  push:
    branches: [research_candidate_ML_easychart_astra2]
    paths:
      - research/candidate-ml-easychart-astra2/retest_response.py
      - research/candidate-ml-easychart-astra2/response_experiment.py
      - .github/workflows/astra2-response-research.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra2-response-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: market_research
          key: astra2-response-market-v1
          restore-keys: astra2-origins-market-
      - name: Native response accounts
        run: |
          python -m pip install --disable-pip-version-check -q numpy==2.3.5 pandas==2.3.3 nautilus_trader==1.230.0
          mkdir -p research_results/candidate_ml_easychart_astra2/response_native
          set -o pipefail
          python -u research/candidate-ml-easychart-astra2/response_experiment.py 2>&1 | tee research_results/candidate_ml_easychart_astra2/response_native/console.txt
      - name: Retain actual response experiment
        if: always()
        run: |
          git config user.name 'astra2-research'
          git config user.email 'astra2-research@users.noreply.github.com'
          git add -f research_results/candidate_ml_easychart_astra2/response_native
          if ! git diff --cached --quiet; then
            git commit -m "Astra2: response observations for ${{ github.sha }}"
            git pull --rebase origin research_candidate_ML_easychart_astra2
            git push origin HEAD:research_candidate_ML_easychart_astra2
          fi
