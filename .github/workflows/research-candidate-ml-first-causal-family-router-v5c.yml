name: Research ML-first causal family router v5c

on:
  push:
    branches: [research_candidate_ML_first]
    paths:
      - 'research_results/candidate_ml_first/reachable_scenario_fusion_v3/latest/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: research-candidate-ml-first-causal-family-router-v5c
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  causal-family-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: resolve
        name: Resolve the successful v3 run that produced this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            'repos/umtong/SMC_ICT_4_LIVE/actions/workflows/research-candidate-ml-first-reachable-scenario-fusion-v3.yml/runs?branch=research_candidate_ML_first&status=success&per_page=1' \
            --jq '.workflow_runs[0].id')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Install family router runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.2 pandas==2.3.2 scikit-learn==1.9.0 joblib
      - name: Download v3 research artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ml-first-reachable-scenario-fusion-v3-*
          path: artifacts/ml-first-causal-family-router-v5c/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run corrected deterministic causal-family research
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-ml-first-reachable-control-v4/reachable_control_policy.py \
            research/candidate-ml-first-causal-family-router-v5/causal_family_router.py \
            research/candidate-ml-first-causal-family-router-v5/causal_family_router_fixed.py
          aggregates=$(find artifacts/ml-first-causal-family-router-v5c/source -type d -name aggregates -print -quit)
          test -n "$aggregates"
          OUT=artifacts/ml-first-causal-family-router-v5c/policy
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python research/candidate-ml-first-causal-family-router-v5/causal_family_router_fixed.py \
            --root "$aggregates" --output "$OUT"
          git rev-parse HEAD > "$OUT/source_sha.txt"
          printf '%s\n' research_candidate_ML_first > "$OUT/source_branch.txt"
          printf '%s\n' '${{ steps.resolve.outputs.run_id }}' > "$OUT/source_research_run_id.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-causal-family-router-v5c-${{ github.sha }}
          path: artifacts/ml-first-causal-family-router-v5c/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit deterministic family result
        run: |
          set -euo pipefail
          SRC=artifacts/ml-first-causal-family-router-v5c/policy
          DEST=research_results/candidate_ml_first/causal_family_router_v5c/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/"
          cp "$SRC/completed_trades.csv" "$DEST/"
          cp "$SRC/variant_metrics.csv" "$DEST/"
          cp "$SRC/component_catalog.csv" "$DEST/"
          cp "$SRC/period_metrics.csv" "$DEST/"
          cp "$SRC/family_score_model.json" "$DEST/"
          cp "$SRC/source_sha.txt" "$DEST/"
          cp "$SRC/source_branch.txt" "$DEST/"
          cp "$SRC/source_research_run_id.txt" "$DEST/"
          digest=$(python - "$DEST/summary.json" <<'PY'
          import json, sys
          s=json.load(open(sys.argv[1])); d=s['development']; f=s['fresh']
          print(f"dev_nav={d['ending_nav_multiplier']:.3f} fresh_nav={f['ending_nav_multiplier']:.3f} fresh_n={f['completed_trades']} fresh_meanR={f['mean_net_r']:.3f} fresh_mdd={f['maximum_drawdown']:.3f}")
          PY
          )
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record causal family router v5c ${GITHUB_RUN_ID}: ${digest} [skip ci]"
          git pull --rebase origin research_candidate_ML_first
          git push origin HEAD:research_candidate_ML_first
