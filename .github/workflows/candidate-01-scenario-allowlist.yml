name: candidate-01-scenario-allowlist

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-scenario-allowlist.yml"
      - "research/candidate-01/enable_scenario_allowlist.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add optional causal scenario gate
        run: |
          set -euo pipefail
          python3 research/candidate-01/enable_scenario_allowlist.py
          python3 -m compileall -q research/candidate-01/portfolio_probe.py
      - name: Preserve shared accounting extension
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/portfolio_probe.py
          git commit -m "feat(candidate-01): allow frozen causal scenario sets"
          git push origin HEAD:research/candidate-01
