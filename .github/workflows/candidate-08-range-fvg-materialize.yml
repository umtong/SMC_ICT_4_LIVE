name: candidate-08-range-fvg-materialize

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.materialize-range-fvg"

permissions:
  contents: write
  packages: read

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and validate completed-range FVG candidate
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          cat research/candidate-08/.rfvg_bundle.part* | base64 -d > /tmp/rfvg_bundle.tgz
          echo "55efd8192379ed9b7ae674b2437b03b753ea3f042b31c5e7960e3ca96e2709fb  /tmp/rfvg_bundle.tgz" | sha256sum -c -
          tar -xzf /tmp/rfvg_bundle.tgz -C .
          python -m compileall -q \
            research/candidate-08/range_fvg_logic.py \
            research/candidate-08/range_fvg_strategy.py \
            research/candidate-08/run_range_fvg.py \
            research/candidate-08/test_range_fvg.py
          python research/candidate-08/test_range_fvg.py -v
          rm research/candidate-08/.rfvg_bundle.part*
          rm research/candidate-08/.materialize-range-fvg
          rm .github/workflows/candidate-08-range-fvg-materialize.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add \
            research/candidate-08/range_fvg_logic.py \
            research/candidate-08/range_fvg_strategy.py \
            research/candidate-08/run_range_fvg.py \
            research/candidate-08/config_range_fvg.json \
            research/candidate-08/test_range_fvg.py \
            research/candidate-08/.rfvg_bundle.part00 \
            research/candidate-08/.rfvg_bundle.part01 \
            research/candidate-08/.rfvg_bundle.part02 \
            research/candidate-08/.rfvg_bundle.part03 \
            research/candidate-08/.rfvg_bundle.part04 \
            research/candidate-08/.materialize-range-fvg \
            .github/workflows/candidate-08-range-fvg-materialize.yml
          git -C "$GITHUB_WORKSPACE" commit -m "candidate-08: implement completed-range FVG candidate"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:research/candidate-08
