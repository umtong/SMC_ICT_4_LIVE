name: candidate-10-finalize-fast-now

on:
  push:
    branches: [research/candidate-10]
    paths:
      - .github/workflows/candidate-10-finalize-fast-now.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: candidate-10-finalize-fast-now
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-10
          fetch-depth: 0

      - name: Wait for parallel final evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            candidate-10-v49-research.yml
            candidate-10-v50-fast.yml
            candidate-10-v51-fast.yml
          )
          deadline=$(( $(date +%s) + 5700 ))
          while true; do
            active=0
            for workflow in "${workflows[@]}"; do
              record="$(gh run list --workflow "${workflow}" \
                --branch research/candidate-10 --limit 1 \
                --json databaseId,status,createdAt \
                --jq 'sort_by(.createdAt) | last // {}')"
              status="$(jq -r '.status // "missing"' <<<"${record}")"
              run_id="$(jq -r '.databaseId // empty' <<<"${record}")"
              echo "${workflow} run=${run_id:-none} status=${status}"
              case "${status}" in
                queued|in_progress|pending|waiting|requested) active=$((active+1));;
              esac
            done
            [[ ${active} -eq 0 ]] && break
            if [[ $(date +%s) -ge ${deadline} ]]; then
              echo "Evidence wait deadline reached" >&2
              break
            fi
            sleep 45
          done

      - name: Collect latest completed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts
          mkdir -p final-artifacts
          for workflow in \
            candidate-10-v49-research.yml \
            candidate-10-v50-fast.yml \
            candidate-10-v51-fast.yml; do
            record="$(gh run list --workflow "${workflow}" \
              --branch research/candidate-10 --status completed --limit 10 \
              --json databaseId,createdAt,conclusion \
              --jq 'sort_by(.createdAt) | last // {}')"
            run_id="$(jq -r '.databaseId // empty' <<<"${record}")"
            conclusion="$(jq -r '.conclusion // "missing"' <<<"${record}")"
            [[ -z "${run_id}" ]] && continue
            dest="final-artifacts/${workflow%.yml}"
            mkdir -p "${dest}"
            printf '%s\n' "${run_id}" > "${dest}/run_id.txt"
            printf '%s\n' "${conclusion}" > "${dest}/conclusion.txt"
            gh run download "${run_id}" -D "${dest}" || true
          done

      - name: Generate and validate final verdict
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-10/c10_finalize.py \
            --artifacts final-artifacts \
            --output-dir research/candidate-10
          test -s research/candidate-10/FINAL_RESEARCH_RESULT.md
          test -s research/candidate-10/final_research_metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/candidate-10/final_research_metrics.json').read_text())
          assert d['schema']=='candidate-10-final-research-verdict-v4'
          markers=[Path('research/candidate-10/TARGET_ACHIEVED.marker'),Path('research/candidate-10/TARGET_NOT_ACHIEVED.marker')]
          assert sum(p.is_file() for p in markers)==1
          print(json.dumps({
            'verdict':d['verdict'],
            'best_continuous_row':d.get('best_continuous_row'),
            'passing_count':len(d.get('target_passing_rows',[])),
            'continuous_count':len(d.get('continuous_rows',[])),
          },sort_keys=True,default=str))
          PY

      - name: Commit authoritative verdict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f research/candidate-10/.probe-create-20260808.txt
          git add -A research/candidate-10
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "candidate-10: commit final parallel research verdict"
          git push origin HEAD:research/candidate-10
