name: candidate-18-v2-fok-development

on:
  push:
    branches: ["research/candidate-18"]
    paths:
      - "research/candidate-18/**"
      - ".github/workflows/candidate-18-v2-development.yml"
  workflow_dispatch:

concurrency:
  group: candidate-18-v2-fok-development
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: known-2023-12
            build_start: "2023-12-22"
            evaluation_start: "2023-12-25"
            evaluation_end: "2023-12-31"
          - name: viewed-v1-week-1
            build_start: "2024-07-05"
            evaluation_start: "2024-07-08"
            evaluation_end: "2024-07-14"
          - name: viewed-v1-week-2
            build_start: "2023-10-13"
            evaluation_start: "2023-10-16"
            evaluation_end: "2023-10-22"

    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0

    env:
      PYTHONPATH: research/candidate-16:research/candidate-18:research/candidate-17:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-18-v2-development/${{ matrix.name }}
      CACHE: .cache/candidate-18-v2-development/${{ matrix.name }}
      PERIOD_NAME: ${{ matrix.name }}
      BUILD_START: ${{ matrix.build_start }}
      EVALUATION_START: ${{ matrix.evaluation_start }}
      EVALUATION_END: ${{ matrix.evaluation_end }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-18 research/candidate-17 research/candidate-16
          python -m unittest discover -s research/candidate-18/tests -p 'test_*.py' -v
          python -m unittest discover -s research/candidate-17/tests -p 'test_*.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_displayed_liquidity_router_v2.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_strategy_v2_contract.py' -v

      - name: Run viewed development period
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-18/candidate.py stage \
            --config research/candidate-18/config.json \
            --build-start "$BUILD_START" \
            --build-end "$EVALUATION_END" \
            --evaluation-start "$EVALUATION_START" \
            --evaluation-end "$EVALUATION_END" \
            --cache "$CACHE" \
            --output "$ROOT" \
            --validation-mode "v2-fok-development-$PERIOD_NAME" \
            2>&1 | tee "$ROOT/console.log"

      - name: Prove all-or-none entry and risk integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import math
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          events = [
              json.loads(line)
              for line in (root / "scenario_events.jsonl").read_text().splitlines()
              if line.strip()
          ]
          with (root / "orders.csv").open(newline="", encoding="utf-8") as stream:
              orders = list(csv.DictReader(stream))
          with (root / "positions.csv").open(newline="", encoding="utf-8") as stream:
              positions = list(csv.DictReader(stream))

          parents = [
              row for row in orders
              if "CANDIDATE18_FOK_PRICE_CAP" in str(row.get("tags", ""))
          ]
          invalid_parent = [
              row for row in parents
              if row.get("type") != "LIMIT" or row.get("time_in_force") != "FOK"
          ]
          partial_parent = []
          for row in parents:
              quantity = float(row.get("quantity") or 0.0)
              filled = float(row.get("filled_qty") or 0.0)
              if filled > 0.0 and not math.isclose(filled, quantity, rel_tol=0.0, abs_tol=1e-9):
                  partial_parent.append(row)

          submissions = [e for e in events if e.get("event_type") == "ENTRY_SUBMITTED"]
          malformed_risk = []
          max_planned = 0.0
          submission_by_time = {}
          for event in submissions:
              details = event.get("details", {})
              try:
                  equity = float(details["equity"])
                  planned = float(details["planned_account_loss_at_worst_fill"])
                  fraction = planned / equity
              except (KeyError, TypeError, ValueError, ZeroDivisionError):
                  malformed_risk.append(event.get("scenario_id"))
                  continue
              if not math.isfinite(fraction) or fraction < 0.0:
                  malformed_risk.append(event.get("scenario_id"))
                  continue
              max_planned = max(max_planned, fraction)
              submission_by_time[int(event["event_time_ns"])] = event

          def money_value(text):
              match = re.search(r"[-+]?\d+(?:\.\d+)?", str(text).replace(",", ""))
              return float(match.group(0)) if match else float("nan")

          max_realized_loss = 0.0
          unmatched_positions = []
          for position in positions:
              opened_ns = int(datetime.fromisoformat(position["ts_opened"]).timestamp() * 1_000_000_000)
              candidates = [
                  event for ts, event in submission_by_time.items()
                  if 0 <= opened_ns - ts <= 120 * 1_000_000_000
              ]
              if not candidates:
                  unmatched_positions.append(position.get("opening_order_id"))
                  continue
              event = min(candidates, key=lambda item: opened_ns - int(item["event_time_ns"]))
              equity = float(event["details"]["equity"])
              pnl = money_value(position.get("realized_pnl"))
              if math.isfinite(pnl) and pnl < 0.0:
                  max_realized_loss = max(max_realized_loss, -pnl / equity)

          future_reference = [
              event.get("event_id")
              for event in events
              if int(event.get("event_time_ns", 0)) > int(event.get("observed_time_ns", 0))
          ]
          integrity = {
              "fok_parent_contract": not invalid_parent,
              "no_partial_parent_fill": not partial_parent,
              "has_filled_trade": int(metrics.get("trades", 0)) > 0,
              "three_percent_planned_risk": (
                  not malformed_risk and max_planned <= 0.0300000001
              ),
              "realized_loss_contained": max_realized_loss <= 0.031,
              "positions_match_signals": not unmatched_positions,
              "no_future_reference": not future_reference,
              "no_order_rejections": int(diagnostics.get("order_rejections", 0)) == 0,
              "single_entry_intent": int(diagnostics.get("max_simultaneous_entry_intents", 0)) <= 1,
              "single_position": int(diagnostics.get("max_open_positions_observed", 0)) <= 1,
              "no_liquidation": int(metrics.get("liquidations", 0)) == 0,
              "positive_equity": float(metrics.get("min_equity", 0.0)) > 0.0,
          }
          result = {
              "schema": "candidate-18-v2-fok-development-v1",
              "period": os.environ["PERIOD_NAME"],
              "integrity_pass": all(integrity.values()),
              "integrity_checks": integrity,
              "gate_pass": bool(metrics.get("gate_pass", False)),
              "fok_parent_rows": len(parents),
              "entry_submissions": len(submissions),
              "max_planned_risk_fraction": max_planned,
              "max_realized_loss_fraction": max_realized_loss,
              "partial_parents": partial_parent,
              "unmatched_positions": unmatched_positions,
              "metrics": metrics,
          }
          (root / "v2_development_decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=False))
          if not result["integrity_pass"]:
              raise SystemExit("Candidate 18 v2 FOK integrity failure")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-18-v2-development-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-18-v2-development/${{ matrix.name }}/**
          if-no-files-found: warn
          retention-days: 90
