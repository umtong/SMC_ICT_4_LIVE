name: candidate-01-intrinsic-external-v3-parity-weeks

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-intrinsic-external-v3-parity-weeks.yml"
      - "research/candidate-01/intrinsic_external_liquidity_v3_router.py"
      - "research/candidate-01/intrinsic_external_liquidity_v3_daily_week.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py"
      - "research/candidate-01/intrinsic_external_liquidity_v2_week.py"
      - "research/candidate-01/adaptive_aggtrade_clock.py"
      - "research/candidate-01/directional_change_failed_sweep_week.py"
      - "research/candidate-01/impact_regime_probe.py"
      - "research/candidate-01/aggtrade_data.py"
      - "research/candidate-01/aggtrade_clock.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
      - "tests/test_candidate_01_intrinsic_external_v3_router.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: week-1
            week: "2023-06-19"
            cache_path: .cache/candidate-01-intrinsic-external-v2-daily-first
            cache_key: candidate-01-intrinsic-external-v2-daily-BTCUSDT-2023-06-14-26-Linux-v1
          - label: week-2
            week: "2022-08-01"
            cache_path: .cache/candidate-01-intrinsic-external-v2-daily-week-2
            cache_key: candidate-01-intrinsic-external-v2-daily-BTCUSDT-2022-07-27-2022-08-01-Linux-v1
          - label: week-3
            week: "2025-11-10"
            cache_path: .cache/candidate-01-intrinsic-external-v2-daily-week-3
            cache_key: candidate-01-intrinsic-external-v2-daily-BTCUSDT-2025-11-05-2025-11-10-Linux-v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ matrix.cache_key }}
      - name: Run legacy and indexed routers on one frozen BTC week
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              python -m compileall -q \
                research/candidate-01/aggtrade_data.py \
                research/candidate-01/aggtrade_clock.py \
                research/candidate-01/adaptive_aggtrade_clock.py \
                research/candidate-01/impact_regime_probe.py \
                research/candidate-01/directional_change_failed_sweep_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_week.py \
                research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py \
                research/candidate-01/intrinsic_external_liquidity_v3_router.py \
                research/candidate-01/intrinsic_external_liquidity_v3_daily_week.py
              python -m unittest discover -s tests -p "test_candidate_01_intrinsic_external_v3_router.py" -v
              rm -rf \
                artifacts/candidate-01-v2-parity-${{ matrix.label }} \
                artifacts/candidate-01-v3-parity-${{ matrix.label }}
              python research/candidate-01/intrinsic_external_liquidity_v2_daily_week.py \
                --week ${{ matrix.week }} \
                --cache ${{ matrix.cache_path }} \
                --output artifacts/candidate-01-v2-parity-${{ matrix.label }} \
                --workers 4
              python research/candidate-01/intrinsic_external_liquidity_v3_daily_week.py \
                --week ${{ matrix.week }} \
                --cache ${{ matrix.cache_path }} \
                --output artifacts/candidate-01-v3-parity-${{ matrix.label }} \
                --workers 4
              python - <<"PY"
              import json
              from pathlib import Path
              import pandas as pd
              from pandas.testing import assert_frame_equal

              root = Path("artifacts")
              v2 = root / "candidate-01-v2-parity-${{ matrix.label }}"
              v3 = root / "candidate-01-v3-parity-${{ matrix.label }}"
              s2 = json.loads((v2 / "intrinsic_external_liquidity_v2_daily_week_summary.json").read_text())
              s3 = json.loads((v3 / "intrinsic_external_liquidity_v3_daily_week_summary.json").read_text())
              for key in (
                  "evaluation_event_bars",
                  "evaluation_retest_signals",
                  "routed_plans",
                  "decision_counts",
                  "detector_counts",
                  "metrics",
              ):
                  if s2[key] != s3[key]:
                      raise AssertionError(f"summary parity failed for {key}: {s2[key]} != {s3[key]}")
              for name in ("trades.csv", "daily_nav.csv", "rejections.csv", "routing_decisions.csv"):
                  try:
                      left = pd.read_csv(v2 / name)
                      right = pd.read_csv(v3 / name)
                  except pd.errors.EmptyDataError:
                      left_empty = (v2 / name).read_text() == ""
                      right_empty = (v3 / name).read_text() == ""
                      if left_empty != right_empty:
                          raise
                      continue
                  assert_frame_equal(left, right, check_dtype=False, check_exact=True)
              report = {
                  "week": "${{ matrix.week }}",
                  "label": "${{ matrix.label }}",
                  "parity": True,
                  "metrics": s3["metrics"],
              }
              (v3 / "parity_report.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
              print(json.dumps(report, indent=2, sort_keys=True))
              PY
            '
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-01-intrinsic-external-v3-parity-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-01-v2-parity-${{ matrix.label }}
            artifacts/candidate-01-v3-parity-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
