name: candidate-04-v42-persist-causal-repair

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v42-persist-repair.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-04
          fetch-depth: 0

      - name: Apply and verify implementation-contract repairs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python research/candidate-04/apply_v42_research_repair.py "$GITHUB_WORKSPACE"
          smc4 doctor
          python -m compileall -q research/candidate-04
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_v42_research_contracts.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_depth_conditioned_impact_innovation_compiler.py' -v

      - name: Commit repaired source with rebase retry
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "candidate-04-research-bot"
          git config user.email "candidate-04-research-bot@users.noreply.github.com"
          git add \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/volume_clock_impact_residual_compiler.py \
            research/candidate-04/volume_clock_imbalance_gap_compiler.py \
            research/candidate-04/filter_candidate_signals.py \
            research/candidate-04/run_frozen_btc_route.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "apply V42 causal implementation repairs"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin research/candidate-04 && \
               git push origin HEAD:research/candidate-04; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
