name: Candidate 11 untouched IRX holdouts

on:
  push:
    branches:
      - research/candidate-11
    paths:
      - "research/candidate-11/irx_holdout_candidate.json"
      - "research/candidate-11/irx_holdout_protocol.json"
      - "research/candidate-11/run_irx_holdouts.sh"
      - "research/candidate-11/apply_irx_holdout_protocol_v2.py"
      - ".github/workflows/candidate-11-irx-holdouts.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-11-irx-holdouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/candidate-11

      - name: Run only a pre-data bound candidate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x research/candidate-11/run_irx_holdouts.sh
          bash research/candidate-11/run_irx_holdouts.sh

      - name: Commit holdout evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-11-bot"
          git config user.email "candidate-11-bot@users.noreply.github.com"
          git add -A research/candidate-11/results/IRX_HOLDOUT
          for week in W10 W11 W12; do
            if [ -d "research/candidate-11/results/IRX_HOLDOUT_$week" ]; then
              git add -A "research/candidate-11/results/IRX_HOLDOUT_$week"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "candidate-11: record untouched IRX holdout evidence [skip ci]"
            git push origin HEAD:research/candidate-11
          fi

      - name: Publish holdout result
        if: always()
        shell: bash
        run: |
          SUMMARY="research/candidate-11/results/IRX_HOLDOUT/summary.json"
          if [ -s "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi
