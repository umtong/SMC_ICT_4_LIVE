name: candidate-07-btc-xrp-multiclock-portfolio

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/run_btc_xrp_multiclock_portfolio.py"
      - "research/candidate-07/strategy_global_slot.py"
      - "research/candidate-07/tests/test_strategy_global_slot.py"
      - "research/candidate-07/multiclock_ensemble_scenario.py"
      - "research/candidate-07/multiclock_sweep_mss_scenario.py"
      - "research/candidate-07/five_second_sweep_execution.py"
      - "research/candidate-07/five_second_flow_bars.py"
      - "research/candidate-07/nested_liquidity_sweep_scenario.py"
      - "research/candidate-07/run_local_liquidity_sweep_mss_retest.py"
      - "research/candidate-07/data_aggtrades_seeded.py"
      - "research/candidate-07/binance_usdm_instruments.py"
      - ".github/workflows/candidate-07-btc-xrp-multiclock-portfolio.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-btc-xrp-multiclock-portfolio
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  frozen-btc-xrp-week-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify foundation and one-slot portfolio contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/smc4 doctor
          PYTHONPYCACHEPREFIX=/tmp/candidate07-btc-xrp-pyc \
            /opt/smc4/.venv/bin/python -m compileall -q research/candidate-07
          /opt/smc4/.venv/bin/python -m unittest discover \
            -s research/candidate-07/tests -p 'test_*.py' -v

      - name: Restore checksum-verified research cache
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-btc-xrp-multiclock-portfolio-week1-v1
          restore-keys: |
            candidate-07-cross-symbol-multiclock-week1-v1
            candidate-07-cross-symbol-15s-
            candidate-07-multiclock-ensemble-week1-v1
            candidate-07-pre-attack-value-week1-v1
            candidate-07-positioning-three-weeks-v1

      - name: Run frozen BTC XRP Week-1 portfolio in one NautilusTrader engine
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/python \
            research/candidate-07/run_btc_xrp_multiclock_portfolio.py \
            --config research/candidate-07/config.json \
            --stage week-1 \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --event-warmup-days 1 \
            --source-commit "${GITHUB_SHA}" \
            --output artifacts/candidate-07/week-1/btc-xrp-multiclock-portfolio \
            --data-root .research-data/candidate-07

      - name: Print immutable portfolio result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /opt/smc4/.venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('artifacts/candidate-07/week-1/btc-xrp-multiclock-portfolio')
          summary = root / 'summary.json'
          if not summary.exists():
              raise SystemExit('BTC_XRP_PORTFOLIO_SUMMARY_MISSING')
          payload = json.loads(summary.read_text())
          hashes = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.rglob('*'))
              if path.is_file()
          }
          print(json.dumps({
              'source_commit': '${{ github.sha }}',
              'summary': payload,
              'sha256': hashes,
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve complete portfolio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-btc-xrp-multiclock-week1-${{ github.sha }}
          path: artifacts/candidate-07/week-1/btc-xrp-multiclock-portfolio
          retention-days: 14
          if-no-files-found: error
