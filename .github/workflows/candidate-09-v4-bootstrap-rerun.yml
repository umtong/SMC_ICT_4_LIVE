name: Candidate 09 v4 bootstrap-controlled rerun

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v4-bootstrap-rerun.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v4-bootstrap-rerun
  cancel-in-progress: false

jobs:
  reconstruct-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Reconstruct the identical frozen v4 source from verified chunks
        shell: bash
        run: |
          set -euo pipefail
          root=research/candidate-09
          cat \
            "$root/bootstrap/v4-engine.part00" \
            "$root/bootstrap/v4-engine.part01" \
            "$root/bootstrap/v4-engine.part02" \
            "$root/bootstrap/v4-engine.part03" \
            "$root/bootstrap/v4-engine.part04" > /tmp/v4-engine.gz.b64

          [[ $(wc -c < /tmp/v4-engine.gz.b64) == 9968 ]]
          echo "0200422ac8a94b13970b37813078816a6c5708baaf2314e0dbf1c7bd46fd7552  /tmp/v4-engine.gz.b64" | sha256sum -c -
          base64 -d /tmp/v4-engine.gz.b64 | gzip -dc > "$root/state_engine_v4.py"
          echo "5b7c5873efae27b0c395f57b541449247f6b6596725daff28a43fb0588923171  $root/state_engine_v4.py" | sha256sum -c -

          base64 -d "$root/bootstrap/v4-test.gz.b64" | gzip -dc > /tmp/test_state_engine_v4.py
          echo "e276abc9a0c4471e54504f538d51c97d2734344753b4b4aa93e768a101b23a64  /tmp/test_state_engine_v4.py" | sha256sum -c -

          mkdir -p "$root/tests_v4" "$root/tests"
          cp "$root/state_engine_v4.py" "$root/state_engine.py"
          cp "$root/config_v4.json" "$root/config.json"
          cp /tmp/test_state_engine_v4.py "$root/tests_v4/test_state_engine.py"
          sed -i 's/from state_engine_v4 import/from state_engine import/' "$root/tests_v4/test_state_engine.py"
          cp "$root/tests_v4/test_state_engine.py" "$root/tests/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path
          path = Path('research/candidate-09/run.py')
          text = path.read_text(encoding='utf-8')
          if 'no-reexpansion-confirmation' not in text:
              if 'no-retest-confirmation' not in text:
                  raise SystemExit('expected v3 ablation contract not found')
              text = text.replace('no-retest-confirmation', 'no-reexpansion-confirmation', 1)
          text = text.replace(
              'The structurally frozen v2 baseline and three',
              'The structurally frozen v4 baseline and three',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, tests, and the identical three frozen BTC weeks
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v4-bootstrap-rerun"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"

          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate \
              --config "$root/config.json" \
              --cache "$SMC4_DATA_ROOT" \
              --output "$out" > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi

          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('research/candidate-09')
          diag = root / 'diagnostics/v4-bootstrap-rerun'
          out = root / 'evidence/latest'
          codes = {key.lower(): int(os.environ[key]) for key in ('DOCTOR', 'COMPILE', 'TESTS', 'GATE')}
          failure = next((name for name, value in codes.items() if value != 0), None)
          (diag / 'diagnostic.json').write_text(json.dumps({
              'candidate_generation': 'v4-post-acceptance-dual-resolution',
              'classification': 'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes': codes,
              'first_failure': failure,
              'fixed_weeks_preserved': True,
              'strategy_parameters_preserved': True,
              'parameter_search_performed': False,
              'controlled_change': 'repair one corrupted bootstrap character and create missing test directory only',
              'engine_sha256': '5b7c5873efae27b0c395f57b541449247f6b6596725daff28a43fb0588923171',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'trigger_sha': os.environ.get('GITHUB_SHA'),
          }, indent=2, sort_keys=True) + '\n')
          if not (out / 'summary.json').exists():
              (out / 'summary.json').write_text(json.dumps({
                  'candidate': 'candidate-09-v4',
                  'status': 'IMPLEMENTATION_ERROR',
                  'first_failure': failure,
                  'codes': codes,
              }, indent=2, sort_keys=True) + '\n')
          for path in diag.glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              path.write_text('\n'.join(lines[-1400:]) + ('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v4-bootstrap-rerun-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v4-bootstrap-rerun
            research/candidate-09/archive/v3
            research/candidate-09/config.json
            research/candidate-09/state_engine.py
            research/candidate-09/state_engine_v4.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
          if-no-files-found: error
          retention-days: 30

      - name: Commit the controlled v4 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v4: bootstrap-controlled result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
