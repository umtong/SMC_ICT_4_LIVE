name: candidate-07-observed-contract-grid

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - "research/candidate-07/probe_observed_contract_grid.py"
      - "research/candidate-07/tests/test_observed_contract_grid.py"
      - ".github/workflows/candidate-07-observed-contract-grid.yml"
  workflow_dispatch:

concurrency:
  group: candidate-07-observed-contract-grid
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify implementation contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          /opt/smc4/.venv/bin/smc4 doctor
          /opt/smc4/.venv/bin/python -m unittest \
            discover -s research/candidate-07/tests \
            -p 'test_observed_contract_grid.py' -v

      - name: Restore verified raw archives
        uses: actions/cache@v4
        with:
          path: .research-data/candidate-07
          key: candidate-07-observed-grid-sol-xrp-2025w52-v1
          restore-keys: |
            candidate-07-cross-symbol-15s-
            candidate-07-pre-attack-value-week1-v1

      - name: Derive frozen-week observed grids
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src:$PWD/research/candidate-07"
          mkdir -p artifacts/candidate-07/observed-contract-grid
          /opt/smc4/.venv/bin/python \
            research/candidate-07/probe_observed_contract_grid.py \
            --symbols SOLUSDT XRPUSDT \
            --start 2025-12-22 \
            --end 2025-12-29 \
            --data-root .research-data/candidate-07 \
            --output artifacts/candidate-07/observed-contract-grid/grid.json

      - name: Preserve observed-grid evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-07-observed-contract-grid-${{ github.sha }}
          path: artifacts/candidate-07/observed-contract-grid
          retention-days: 14
          if-no-files-found: error
