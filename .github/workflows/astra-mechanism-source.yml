name: Existing inventory mechanism source
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths: [.github/workflows/astra-mechanism-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_easychart_astra1
      - name: Read the most recent strategy changes on the relevant branches
        run: |
          python - <<'PY'
          import subprocess,json,pathlib
          output=[]
          for ref in ['research_candidate_4_causal_inventory_transfer','research_candidate_ML_MN','research_causal_factor_auction_response']:
              subprocess.run(['git','fetch','--depth=25','origin',ref],check=True)
              sha=subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()
              changed=subprocess.check_output(['git','log','-20','--format=','--name-only',sha,'--','research'],text=True).splitlines()
              paths=[]
              for p in changed:
                  if p.endswith('.py') and p not in paths and not any(x in p for x in ['test_','summar','report','diagnos','stability','audit','replay']):paths.append(p)
              values=[]
              for p in paths[:8]:
                  r=subprocess.run(['git','show',sha+':'+p],capture_output=True,text=True)
                  if r.returncode:continue
                  values.append({'path':p,'source':r.stdout[:40000]})
              output.append({'branch':ref,'sha':sha,'recent_strategy_paths':paths[:30],'implementations':values})
          p=pathlib.Path('research_results/astra_mechanism_sources.json');p.write_text(json.dumps(output,indent=2))
          print('\n'.join(str((r['branch'],r['recent_strategy_paths'])) for r in output))
          PY
      - name: Retain the reused-source pointers and excerpts
        run: |
          git config user.name 'Astra research'
          git config user.email 'research@users.noreply.github.com'
          git add -f research_results/astra_mechanism_sources.json
          git commit -m 'Read existing inventory and causal response implementations [skip ci]' || true
          git pull --rebase origin research_candidate_ML_easychart_astra1
          git push origin HEAD:research_candidate_ML_easychart_astra1
