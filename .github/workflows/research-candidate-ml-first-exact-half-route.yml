name: Research ML-first structural target frontiers v3

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_first]
    paths:
      - '.github/workflows/research-candidate-ml-first-exact-half-route.yml'
      - 'research/candidate-ml-first-liquidity-response-v3/**'

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: research-candidate-ml-first-target-frontiers-v3
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  target-harvest:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        variant: [fraction35, fraction40, fraction45, first_live_rr1]
        period: [2024-feb, 2024-aug, 2025-feb, 2025-aug, 2025-nov, 2026-jan, 2026-mar, 2026-apr]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: '1'
      VARIANT: ${{ matrix.variant }}
      PERIOD: ${{ matrix.period }}
      ROLE: dev
      CACHE: .cache/ml-first-target-frontier-v3/${{ matrix.variant }}/${{ matrix.period }}
      OUT: artifacts/ml-first-target-frontier-v3/windows/${{ matrix.variant }}/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - name: Checkout inherited causal engine
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: research_candidate_4_causal_inventory_transfer
          path: candidate4_runtime
          fetch-depth: 1
      - name: Resolve research window
        run: |
          set -euo pipefail
          case "$PERIOD" in
            2024-feb) START=2024-02-01; END=2024-02-08 ;;
            2024-aug) START=2024-08-01; END=2024-08-08 ;;
            2025-feb) START=2025-02-01; END=2025-02-08 ;;
            2025-aug) START=2025-08-01; END=2025-08-08 ;;
            2025-nov) START=2025-11-01; END=2025-11-08 ;;
            2026-jan) START=2026-01-01; END=2026-01-08 ;;
            2026-mar) START=2026-03-01; END=2026-03-08 ;;
            2026-apr) START=2026-04-01; END=2026-04-08 ;;
            *) exit 2 ;;
          esac
          printf 'START=%s\nEND=%s\n' "$START" "$END" >> "$GITHUB_ENV"
      - name: Patch structural target policy
        run: |
          set -euo pipefail
          python research/candidate-ml-first-liquidity-response-v3/patch_target_policy.py \
            --root candidate4_runtime --variant "$VARIANT"
      - name: Run exact causal target window
        env:
          PYTHONPATH: candidate4_runtime/research/candidate-causal-liquidity-route-system:candidate4_runtime/research/candidate-liquidity-auction-v6:candidate4_runtime/research/candidate-liquidity-auction-v5:candidate4_runtime/research/candidate-coherent-auction-system-v4:candidate4_runtime/research/candidate-coherent-auction-system-v3:candidate4_runtime/research/candidate-coherent-liquidity-policy-v2:candidate4_runtime/research/candidate-coherent-liquidity-policy-v1:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v2:candidate4_runtime/research/candidate-hierarchical-liquidity-bpr-v1:candidate4_runtime/research/candidate-liquidity-displacement-v1:candidate4_runtime/research/candidate-auction-dislocation-confluence-v1:candidate4_runtime/research/candidate-derivatives-dislocation-v1:candidate4_runtime/research/candidate-auction-episode-policy:candidate4_runtime/research/candidate-auction-event-v2:candidate4_runtime/research/candidate-direct-auction-policy:candidate4_runtime/research/candidate-easychart_re1:candidate4_runtime/research/candidate-easychart-v5:candidate4_runtime/research/candidate-easychart-v3
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python candidate4_runtime/research/candidate-causal-liquidity-route-system/causal_route_research.py \
            --start "$START" --end "$END" --role "$ROLE" --warmup-days 60 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" --output "$OUT"
          printf '{"variant":"%s","period":"%s","role":"%s","start":"%s","end":"%s"}\n' \
            "$VARIANT" "$PERIOD" "$ROLE" "$START" "$END" > "$OUT/target_policy_patch.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-target-frontier-${{ matrix.variant }}-${{ matrix.period }}
          path: artifacts/ml-first-target-frontier-v3/windows/${{ matrix.variant }}/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  aggregate-and-publish:
    needs: target-harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-first-target-frontier-*
          path: artifacts/ml-first-target-frontier-v3/downloaded
      - name: Aggregate structural target evidence
        run: |
          set -euo pipefail
          OUT=artifacts/ml-first-target-frontier-v3/aggregate
          python research/candidate-ml-first-liquidity-response-v3/aggregate_target_variants.py \
            --root artifacts/ml-first-target-frontier-v3/downloaded --output "$OUT"
          git rev-parse HEAD > "$OUT/source_sha.txt"
          printf '%s\n' research_candidate_ML_first > "$OUT/source_branch.txt"
          printf '%s\n' research_candidate_4_causal_inventory_transfer > "$OUT/inherited_engine_branch.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-target-frontier-v3-result-${{ github.sha }}
          path: artifacts/ml-first-target-frontier-v3/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit compact target-frontier research result
        run: |
          set -euo pipefail
          OUT=artifacts/ml-first-target-frontier-v3/aggregate
          DEST=research_results/candidate_ml_first/target_frontier_v3/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$OUT/summary.json" "$DEST/"
          cp "$OUT/window_metrics.csv" "$DEST/"
          cp "$OUT/source_sha.txt" "$DEST/"
          cp "$OUT/source_branch.txt" "$DEST/"
          cp "$OUT/inherited_engine_branch.txt" "$DEST/"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Record ML-first structural target-frontier research ${GITHUB_RUN_ID} [skip ci]"
            git pull --rebase origin research_candidate_ML_first
            git push origin HEAD:research_candidate_ML_first
          fi
