name: candidate-07-binance-1s-kline-probe

on:
  push:
    branches: ["research/candidate-07"]
    paths:
      - ".github/workflows/candidate-07-binance-1s-kline-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe official Binance Vision USD-M 1s kline archives
        shell: bash
        run: |
          set -u
          BASE="https://data.binance.vision/data/futures/um"
          probe() {
            local url="$1"
            local output
            output=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --range 0-0 --output /dev/null \
              --write-out '%{http_code}|%{size_download}|%{content_type}|%{url_effective}' \
              "$url" 2>&1)
            local status=$?
            printf '%s|curl_exit=%s|%s\n' "$url" "$status" "$output"
          }

          for day in \
            2024-01-01 \
            2024-06-24 \
            2025-01-27 \
            2025-12-22 \
            2026-06-30; do
            path="${BASE}/daily/klines/BTCUSDT/1s/BTCUSDT-1s-${day}.zip"
            probe "$path"
            probe "${path}.CHECKSUM"
          done

          for month in \
            2024-01 \
            2024-06 \
            2025-01 \
            2025-12 \
            2026-06; do
            path="${BASE}/monthly/klines/BTCUSDT/1s/BTCUSDT-1s-${month}.zip"
            probe "$path"
            probe "${path}.CHECKSUM"
          done

      - name: Probe targeted historical USD-M REST 1s klines
        shell: bash
        run: |
          set -u
          BASE="https://fapi.binance.com/fapi/v1/klines"
          probe_api() {
            local label="$1"
            local start_ms="$2"
            local interval="$3"
            local end_ms=$((start_ms + 5000))
            local url="${BASE}?symbol=BTCUSDT&interval=${interval}&startTime=${start_ms}&endTime=${end_ms}&limit=10"
            local body headers status
            body=$(mktemp)
            headers=$(mktemp)
            status=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}' "$url" 2>&1)
            local exit_code=$?
            printf 'REST|%s|interval=%s|curl_exit=%s|http=%s|rows_or_error=' \
              "$label" "$interval" "$exit_code" "$status"
            python - "$body" <<'PY'
          import json
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          try:
              value = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:500])
          else:
              if isinstance(value, list):
                  print({
                      "rows": len(value),
                      "first": value[0] if value else None,
                      "last": value[-1] if value else None,
                  })
              else:
                  print(value)
          PY
            grep -iE '^(x-mbx-used-weight|retry-after|content-type):' "$headers" || true
            rm -f "$body" "$headers"
          }

          while IFS='|' read -r label start_ms; do
            probe_api "$label" "$start_ms" 1s
            probe_api "$label-control" "$start_ms" 1m
          done <<'EOF'
          2024-01-01|1704067200000
          2024-06-24|1719187200000
          2025-01-27|1737936000000
          2025-12-22|1766361600000
          2026-06-30|1782777600000
          EOF

      - name: Probe official aliases and a read-only transparent mirror
        shell: bash
        run: |
          set -u
          START_MS=1719187200000
          END_MS=$((START_MS + 5000))
          probe_route() {
            local label="$1"
            local base="$2"
            local interval="$3"
            local url="${base}?symbol=BTCUSDT&interval=${interval}&startTime=${START_MS}&endTime=${END_MS}&limit=10"
            local body status exit_code
            body=$(mktemp)
            status=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --output "$body" --write-out '%{http_code}' "$url" 2>&1)
            exit_code=$?
            printf 'ROUTE|%s|interval=%s|curl_exit=%s|http=%s|payload=' \
              "$label" "$interval" "$exit_code" "$status"
            python - "$body" <<'PY'
          import json
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          try:
              value = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:300])
          else:
              if isinstance(value, list):
                  print({
                      "rows": len(value),
                      "first_open_time": value[0][0] if value else None,
                      "first_ohlc": value[0][1:5] if value else None,
                  })
              else:
                  print(value)
          PY
            rm -f "$body"
          }

          while IFS='|' read -r label base; do
            probe_route "$label" "$base" 1s
            probe_route "$label-control" "$base" 1m
          done <<'EOF'
          fapi|https://fapi.binance.com/fapi/v1/klines
          fapi1|https://fapi1.binance.com/fapi/v1/klines
          fapi2|https://fapi2.binance.com/fapi/v1/klines
          fapi3|https://fapi3.binance.com/fapi/v1/klines
          fapi4|https://fapi4.binance.com/fapi/v1/klines
          pipai-readonly|https://api.pipai.org/fapi/v1/klines
          spot-data-vision|https://data-api.binance.vision/api/v3/klines
          EOF
