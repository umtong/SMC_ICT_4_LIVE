name: candidate-55-inventory-release-second-touch-v3

on:
  push:
    branches: ["research/candidate-55"]
    paths:
      - ".github/workflows/candidate-55-inventory-release-second-touch-v3.yml"
      - "research/candidate-55/strategy_inventory_release_second_touch_v3.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-55-inventory-release-second-touch-v3
  cancel-in-progress: true

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: development-2026-04-13_2026-04-19
            start: "2026-04-13"
            end: "2026-04-19"
            calendar_days: 7
            evidence_role: development
          - label: development-2025-11-03_2025-11-09
            start: "2025-11-03"
            end: "2025-11-09"
            calendar_days: 7
            evidence_role: development
          - label: fresh-2024-06-03_2024-06-09
            start: "2024-06-03"
            end: "2024-06-09"
            calendar_days: 7
            evidence_role: untouched
          - label: fresh-2025-03-01_2025-03-30
            start: "2025-03-01"
            end: "2025-03-30"
            calendar_days: 30
            evidence_role: untouched
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-55
          fetch-depth: 1

      - name: Materialize frozen router and bug-fixed policy
        shell: bash
        run: |
          set -euo pipefail
          cp research/candidate-51/router_microauction.py research/candidate-51/router.py
          cp research/candidate-55/strategy_inventory_release_second_touch_v3.py research/candidate-51/strategy.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and verify environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-51 research/candidate-55
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import math
          from strategy import Candidate35Config, Candidate35Strategy, _cost_after_net_r
          assert Candidate35Config is not None and Candidate35Strategy is not None
          loss, reward, ratio = _cost_after_net_r(
              entry=100.0,
              stop=99.0,
              target=102.0,
              side=1,
              fee_bps_each_side=7.5,
              slippage_bps_each_side=2.5,
              funding_reserve_bps=1.0,
          )
          assert loss > 0.0 and reward > 0.0 and ratio > 1.25
          assert all(math.isfinite(v) for v in (loss, reward, ratio))
          print("second-touch v3 import and geometry pass")
          PY

      - name: Freeze unchanged policy
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("research/candidate-51/config.json").read_text())
          strategy = base["strategy"]
          for key in (
              "sma_offset_low",
              "sma_offset_high",
              "sma_stop_min_fraction",
              "sma_stop_max_fraction",
              "sma_stop_atr_buffer",
          ):
              strategy.pop(key, None)
          strategy.update(
              {
                  "microauction_mode": "absorption",
                  "microauction_atr_period": 30,
                  "microauction_balance_lookback": 10,
                  "microauction_stop_buffer_atr": 0.15,
                  "microauction_min_reward_r": 0.0,
                  "absorption_flow_min": 0.25,
                  "absorption_flow_15s_min": 0.15,
                  "absorption_flow_3m_min": 0.05,
                  "absorption_notional_burst_min": 1.50,
                  "absorption_trade_burst_min": 1.20,
                  "absorption_efficiency_max": 0.25,
                  "absorption_strength_min": 0.15,
                  "absorption_alignment_max_bps": 0.50,
                  "absorption_sweep_buffer_atr": 0.05,
                  "absorption_depth_defense_min": 0.00,
                  "absorption_same_depth_growth_min": 0.00,
                  "microauction_exit_on_opposite_state": False,
                  "inventory_context_lookback_minutes": 60,
                  "inventory_target_net_r": 2.0,
                  "second_touch_ttl_minutes": 10,
                  "second_touch_episode_lookback_minutes": 60,
                  "second_touch_min_directional_depth": 0.0,
                  "second_touch_min_net_r": 1.25,
                  "feature_max_age_seconds": 65.0,
                  "cooldown_minutes": 0,
                  "max_hold_minutes": 240,
                  "funding_flatten_minute": 60,
                  "funding_blackout_before_minutes": -1,
                  "funding_blackout_after_minutes": -1,
              }
          )
          work = Path(".work/candidate-55-inventory-release-second-touch-v3")
          work.mkdir(parents=True, exist_ok=True)
          config_path = work / "frozen-config.json"
          config_path.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
          manifest = {
              "candidate": "candidate-55-inventory-release-second-touch-v3",
              "label": os.environ["LABEL"],
              "interval": [os.environ["START"], os.environ["END"]],
              "calendar_days": int(os.environ["CALENDAR_DAYS"]),
              "evidence_role": os.environ["EVIDENCE_ROLE"],
              "policy_changed_from_v2": False,
              "implementation_change": "deduplicate diagnostic ts_event only",
              "engine": "NautilusTrader BacktestNode",
              "universe": ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"],
              "one_global_entry_or_position": True,
              "current_nav_planned_loss_fraction": 0.03,
              "costs_bps": {
                  "fee_each_side": base["all_in_cost_bps_each_side"],
                  "slippage_each_side": base["adverse_slippage_bps_each_side"],
                  "funding_reserve": base["funding_reserve_bps"],
              },
              "strategy_sha256": hashlib.sha256(
                  Path("research/candidate-51/strategy.py").read_bytes()
              ).hexdigest(),
              "router_sha256": hashlib.sha256(
                  Path("research/candidate-51/router.py").read_bytes()
              ).hexdigest(),
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
          }
          (work / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run one continuous account
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set +e
          output="artifacts/candidate-55/inventory-release-second-touch-v3-${LABEL}"
          PYTHONPATH=research/candidate-51 uv run python research/candidate-51/launch.py \
            --config .work/candidate-55-inventory-release-second-touch-v3/frozen-config.json \
            --start "$START" --end "$END" \
            --cache ".cache/candidate-55-inventory-release-second-touch-v3-${LABEL}" \
            --output "$output" \
            --workspace ".work/candidate-55-inventory-release-second-touch-v3-${LABEL}"
          code="$?"
          echo "$code" > .work/candidate-55-inventory-release-second-touch-v3/exit-code.txt
          exit 0

      - name: Write compact forensic summary
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          CALENDAR_DAYS: ${{ matrix.calendar_days }}
          EVIDENCE_ROLE: ${{ matrix.evidence_role }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          label = os.environ["LABEL"]
          days = int(os.environ["CALENDAR_DAYS"])
          role = os.environ["EVIDENCE_ROLE"]
          root = Path("artifacts/candidate-55") / f"inventory-release-second-touch-v3-{label}"
          root.mkdir(parents=True, exist_ok=True)
          metrics_path = root / "metrics.json"
          diagnostics_path = root / "strategy_diagnostics.json"
          closed_path = root / "closed_scenarios.json"
          exit_path = Path(".work/candidate-55-inventory-release-second-touch-v3/exit-code.txt")
          summary = {
              "candidate": "candidate-55-inventory-release-second-touch-v3",
              "label": label,
              "calendar_days": days,
              "evidence_role": role,
              "policy_changed_from_v2": False,
              "exit_code": int(exit_path.read_text()) if exit_path.is_file() else None,
              "produced": metrics_path.is_file() and diagnostics_path.is_file(),
          }
          if summary["produced"]:
              metrics = json.loads(metrics_path.read_text())
              diagnostics = json.loads(diagnostics_path.read_text())
              closed = json.loads(closed_path.read_text()) if closed_path.is_file() else []
              summary.update(
                  metrics=metrics,
                  trades_per_calendar_day=float(metrics.get("trades") or 0) / days,
                  closed_scenarios=len(closed),
                  unique_episode_keys=len(
                      {
                          str(item.get("inventory_episode_key"))
                          for item in closed
                          if item.get("inventory_episode_key")
                      }
                  ),
                  state_transition={
                      key: diagnostics.get(key)
                      for key in (
                          "base_absorption_states",
                          "second_touch_arms",
                          "second_touch_arm_expirations",
                          "second_touch_target_before_retest",
                          "second_touch_intrabar_ambiguity",
                          "second_touch_reference_touches",
                          "second_touch_close_rejections",
                          "second_touch_flow_rejections",
                          "second_touch_depth_rejections",
                          "second_touch_reward_space_rejections",
                          "second_touch_responses",
                          "second_touch_entries",
                          "second_touch_competing_responses",
                          "second_touch_arms_cleared_by_global_slot",
                          "inventory_context_rejection_counts",
                          "selected_symbols",
                      )
                  },
                  execution={
                      key: diagnostics.get(key)
                      for key in (
                          "entry_submissions",
                          "fill_invalidations",
                          "fill_beyond_bracket_invalidations",
                          "fill_risk_budget_invalidations",
                          "order_rejections",
                          "entry_expirations",
                          "global_position_violations",
                          "max_open_positions_observed",
                          "max_simultaneous_entry_intents",
                      )
                  },
              )
          (root / "V3_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-55-inventory-release-second-touch-v3-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/candidate-55/inventory-release-second-touch-v3-${{ matrix.label }}/**
            .work/candidate-55-inventory-release-second-touch-v3/manifest.json
            .work/candidate-55-inventory-release-second-touch-v3/exit-code.txt
          if-no-files-found: warn
          retention-days: 90
