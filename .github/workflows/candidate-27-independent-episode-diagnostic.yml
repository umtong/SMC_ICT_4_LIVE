name: candidate-27-independent-episode-diagnostic

on:
  push:
    branches: ["research/candidate-27"]
    paths:
      - "research/candidate-27/**"
      - ".github/workflows/candidate-27-independent-episode-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: candidate-27-independent-episode-diagnostic
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  observed-periods:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        market:
          - symbol: XRPUSDT
            state: CALM
          - symbol: SOLUSDT
            state: MIXED
        period:
          - name: known-2023-12-25
            build_start: "2023-12-22"
            build_end: "2024-01-01"
            evaluation_start: "2023-12-25"
            evaluation_end: "2023-12-31"
          - name: viewed-2024-07-08
            build_start: "2024-07-05"
            build_end: "2024-07-15"
            evaluation_start: "2024-07-08"
            evaluation_end: "2024-07-14"
          - name: viewed-2023-10-16
            build_start: "2023-10-13"
            build_end: "2023-10-23"
            evaluation_start: "2023-10-16"
            evaluation_end: "2023-10-22"
          - name: viewed-2025-09-22
            build_start: "2025-09-19"
            build_end: "2025-09-29"
            evaluation_start: "2025-09-22"
            evaluation_end: "2025-09-28"
    env:
      PYTHONPATH: research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-27/${{ matrix.market.symbol }}-${{ matrix.market.state }}/${{ matrix.period.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and causal diagnostic
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-27

      - name: Build independent funding-interval episodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-27/funding_interval_episode_diagnostic.py \
            --symbol "${{ matrix.market.symbol }}" \
            --required-state "${{ matrix.market.state }}" \
            --build-start "${{ matrix.period.build_start }}" \
            --build-end "${{ matrix.period.build_end }}" \
            --evaluation-start "${{ matrix.period.evaluation_start }}" \
            --evaluation-end "${{ matrix.period.evaluation_end }}" \
            --cache ".cache/candidate-27/${{ matrix.market.symbol }}/${{ matrix.period.name }}" \
            --output "$ROOT" \
            --round-trip-bps 20.0 \
            2>&1 | tee "$ROOT/console.log"

      - name: Verify independent episode output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["ROOT"])
          result = json.loads((root / "diagnostic.json").read_text())
          episodes = pd.read_csv(root / "funding_interval_episodes.csv")
          assert result["configured_round_trip_bps"] == 20.0
          assert result["summary"]["episodes"] == len(episodes)
          if not episodes.empty:
              interval = pd.to_datetime(episodes["interval_start"], utc=True)
              assert interval.is_unique
              entry = pd.to_datetime(episodes["entry_time"], utc=True)
              exit_time = pd.to_datetime(episodes["exit_time"], utc=True)
              assert (entry < exit_time).all()
              assert episodes["liquidity_state"].eq(result["required_state"]).all()
              assert episodes["signed_reset_bps"].lt(0.0).all()
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-27-${{ matrix.market.symbol }}-${{ matrix.market.state }}-${{ matrix.period.name }}-${{ github.sha }}
          path: artifacts/candidate-27/${{ matrix.market.symbol }}-${{ matrix.market.state }}/${{ matrix.period.name }}/**
          if-no-files-found: warn
          retention-days: 90
