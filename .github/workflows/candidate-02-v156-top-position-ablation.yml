name: candidate-02-v156-top-position-ablation

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v156_ablation_trigger.json"]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-02-v156-top-position-ablation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  single-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and collect unchanged inputs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python .candidate-02-v46/collect_confirmation_week.py
          test -s artifacts/candidate-02-v46-confirmation/STATUS_READY_FOR_LOCKED_EVALUATION
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-02:$GITHUB_WORKSPACE/src"
          python -m py_compile research/candidate-02/v156_inventory_failure_core.py research/candidate-02/v156_nt_backtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('research/candidate-02/v156_inventory_failure_config.json').read_text())
          ab = json.loads(Path('research/candidate-02/v156_top_position_ablation_config.json').read_text())
          assert base['scenario']['require_top_position_nonreinforcement'] is True
          assert ab['scenario']['require_top_position_nonreinforcement'] is False
          left = dict(base['scenario']); right = dict(ab['scenario'])
          left.pop('require_top_position_nonreinforcement'); right.pop('require_top_position_nonreinforcement')
          assert left == right
          assert base['costs'] == ab['costs'] and base['risk'] == ab['risk'] and base['validation'] == ab['validation']
          print('V156 single-variable ablation contract: OK')
          PY
      - name: Run single ablation through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/candidate-02:$GITHUB_WORKSPACE/src"
          target="research/candidate-02/results/v156_top_position_ablation/$GITHUB_SHA"
          rm -rf "$target"; mkdir -p "$target"
          set +e
          python research/candidate-02/v156_nt_backtest.py \
            --config research/candidate-02/v156_top_position_ablation_config.json \
            --input-root .cache/candidate-02/v46-confirmation \
            --output "$target" 2>&1 | tee "$target/console.log"
          rc=${PIPESTATUS[0]}; set -e
          printf '%s\n' "$rc" > "$target/runner_exit_code.txt"
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then exit "$rc"; fi
          cp artifacts/candidate-02-v46-confirmation/manifest.json "$target/data_manifest.json"
      - name: Commit compact ablation evidence
        shell: bash
        run: |
          set -euo pipefail
          target="research/candidate-02/results/v156_top_position_ablation/$GITHUB_SHA"
          git fetch origin research/candidate-02
          if [[ "$(git rev-parse origin/research/candidate-02)" != "$GITHUB_SHA" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "research(candidate-02): record V156 single-ablation evidence"
          git push origin HEAD:research/candidate-02
