name: ml2-causal-dataset

on:
  workflow_dispatch:
  push:
    branches: ["research_ML2"]
    paths:
      - ".github/workflows/ml2-causal-dataset.yml"
      - "research/candidate-easychart_ml2/causal_policy/download_causal_dataset.py"
      - "research/candidate-easychart_ml2/causal_policy/.dataset_dispatch"

concurrency:
  group: ml2-causal-dataset
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Compile downloader
        run: python -m py_compile research/candidate-easychart_ml2/causal_policy/download_causal_dataset.py
      - name: Download checksum-verified causal research windows
        run: |
          python research/candidate-easychart_ml2/causal_policy/download_causal_dataset.py \
            --cache .cache/ml2-causal-dataset \
            --output artifacts/ml2-causal-dataset \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT
      - name: Upload research dataset
        uses: actions/upload-artifact@v4
        with:
          name: ml2-causal-dataset-${{ github.sha }}
          path: artifacts/ml2-causal-dataset/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
