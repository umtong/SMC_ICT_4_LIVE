name: Astra affine auction experiment
on:
  push:
    branches: [research_candidate_ML_easychart_astra1]
    paths:
      - .github/workflows/astra-affine-research.yml
      - research/candidate-ml-easychart-astra1/affine_auction.py
      - research/candidate-ml-easychart-astra1/run_affine_auction.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra1-affine-research
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            bundle/market
            astra_control_cache
          key: astra1-affine-${{ github.run_id }}
          restore-keys: |
            astra1-affine-
            astra1-control-v2-
      - name: Install the existing execution foundation
        run: python -m pip install 'nautilus_trader==1.230.0' 'numpy==2.3.5' 'pandas==2.3.3' 'scikit-learn==1.7.2'
      - name: Execute three independent short account diagnostics
        run: python research/candidate-ml-easychart-astra1/run_affine_auction.py
      - name: Commit actual outputs without manufacturing a long-run NAV
        if: always()
        run: |
          if [ ! -d research_results/astra1_affine_auction ]; then exit 0; fi
          git config user.name 'Astra research'
          git config user.email 'research@users.noreply.github.com'
          git add -f research_results/astra1_affine_auction
          if ! git diff --cached --quiet; then
            git commit -m "Record affine auction account experiment $GITHUB_RUN_ID [skip ci]"
            git pull --rebase origin research_candidate_ML_easychart_astra1
            git push origin HEAD:research_candidate_ML_easychart_astra1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-affine-results
          path: research_results/astra1_affine_auction
          retention-days: 14
