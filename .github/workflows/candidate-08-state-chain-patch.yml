name: candidate-08-state-chain-patch

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - ".github/workflows/candidate-08-state-chain-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve RETEST_HELD in diagnostic state chains
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-08/logic.py")
          source = path.read_text(encoding="utf-8")
          old_cancel = '''            previous_state="ARMED",\n            next_state="CANCELLED",\n'''
          new_cancel = '''            previous_state=(\n                "RETEST_HELD"\n                if self.pending.family is ScenarioFamily.ACCEPTANCE\n                and self.pending.retest_index is not None\n                else "ARMED"\n            ),\n            next_state="CANCELLED",\n'''
          old_confirm = '''            previous_state="ARMED",\n            next_state="CONFIRMED",\n'''
          new_confirm = '''            previous_state=(\n                "RETEST_HELD"\n                if pending.family is ScenarioFamily.ACCEPTANCE\n                and pending.retest_index is not None\n                else "ARMED"\n            ),\n            next_state="CONFIRMED",\n'''
          if source.count(old_cancel) != 1:
              raise SystemExit(f"cancel state anchor count={source.count(old_cancel)}")
          if source.count(old_confirm) != 1:
              raise SystemExit(f"confirm state anchor count={source.count(old_confirm)}")
          path.write_text(source.replace(old_cancel, new_cancel).replace(old_confirm, new_confirm), encoding="utf-8")
          PY
          python -m compileall -q research/candidate-08/logic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-08/logic.py
          git commit -m "candidate-08: preserve retest state in event chains"
          git push origin HEAD:research/candidate-08
