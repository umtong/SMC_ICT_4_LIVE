name: candidate-51-install-and-screen

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-install-and-screen.yml"
      - "research/candidate-51/.payload/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout Candidate 51
        uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 0

      - name: Materialize exact causal public ichiV2 adaptation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          from pathlib import Path
          import shutil
          import tarfile

          root = Path("research/candidate-51")
          payload = root / ".payload"
          chunks = sorted(payload.glob("part-*"))
          if len(chunks) != 4:
              raise RuntimeError(f"expected four payload chunks, got {len(chunks)}")
          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in chunks)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "75a1fbc5a762009daf4f92095d2b6a894d06819155a684c0c67a2e334cbffb2d"
          if digest != expected:
              raise RuntimeError(f"payload sha256 mismatch: {digest} != {expected}")

          destination = Path(".candidate51-v2-materialized")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as stream:
              stream.extractall(destination)

          for name in ("router.py", "strategy.py", "config.json", "test_router.py"):
              source = destination / name
              if not source.is_file():
                  raise RuntimeError(f"missing materialized file: {source}")
              (root / name).write_bytes(source.read_bytes())

          shutil.rmtree(payload)
          shutil.rmtree(destination)
          PY

          git config user.name "candidate-51-research-bot"
          git config user.email "candidate-51-research-bot@users.noreply.github.com"
          git add -A
          git commit -m "candidate51: install causal public ichiV2 policy"
          git push origin HEAD:research/candidate-51

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.25"

      - name: Install locked foundation
        run: |
          uv lock --check
          uv sync --locked

      - name: Runtime doctor
        run: uv run smc4 doctor

      - name: Compile and test Candidate 51
        run: |
          uv run python -m compileall -q research/candidate-51
          uv run --with pytest python -m pytest -q research/candidate-51/test_router.py

      - name: Run exact-policy seven-day continuous diagnostic
        run: |
          rm -rf artifacts/candidate-51/v2-development-2026-07-22_2026-07-28
          uv run python research/candidate-51/launch.py \
            --config research/candidate-51/config.json \
            --start 2026-07-22 \
            --end 2026-07-28 \
            --cache .cache/candidate-51-v2 \
            --output artifacts/candidate-51/v2-development-2026-07-22_2026-07-28 \
            --workspace .work/candidate-51-v2

      - name: Print compact account result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-51/v2-development-2026-07-22_2026-07-28")
          for name in ("metrics.json", "strategy_diagnostics.json"):
              path = root / name
              if not path.is_file():
                  print(f"{name} not produced")
                  continue
              data = json.loads(path.read_text())
              if name == "metrics.json":
                  keys = (
                      "ending_nav", "total_return", "geometric_daily_growth",
                      "max_drawdown", "trades", "wins", "win_rate",
                      "profit_factor", "expectancy_usdt", "gate_pass",
                  )
              else:
                  keys = (
                      "quarter_hour_decisions", "entry_submissions",
                      "entry_expirations", "order_rejections", "route_counts",
                      "actionable_family_counts", "unresolved_reason_counts",
                      "selected_symbols", "source_exit_submissions",
                      "source_trailing_exit_submissions", "global_position_violations",
                  )
              print(name)
              print(json.dumps({key: data.get(key) for key in keys}, indent=2, sort_keys=True))
          PY

      - name: Persist compact v2 development evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source_dir="artifacts/candidate-51/v2-development-2026-07-22_2026-07-28"
          evidence_dir="research/candidate-51/evidence/v2-development-2026-07-22_2026-07-28"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          for file in metrics.json strategy_diagnostics.json run.json data_manifest.json closed_scenarios.json; do
            if [[ -f "$source_dir/$file" ]]; then
              cp "$source_dir/$file" "$evidence_dir/$file"
            fi
          done
          git add "$evidence_dir"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate51: persist exact-policy v2 development evidence"
          git push origin HEAD:research/candidate-51

      - name: Preserve full v2 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-51-v2-development-${{ github.sha }}
          path: |
            artifacts/candidate-51/v2-development-2026-07-22_2026-07-28/*.json
            artifacts/candidate-51/v2-development-2026-07-22_2026-07-28/*.csv
          if-no-files-found: warn
