name: Research ML-first action value v6d

on:
  workflow_dispatch:
  push:
    branches: [research_candidate_ML_first]
    paths:
      - '.github/workflows/research-candidate-ml-first-action-value-v6d.yml'

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: research-candidate-ml-first-action-value-v6d
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve-harvest:
    runs-on: ubuntu-24.04
    outputs:
      harvest_run_id: ${{ steps.resolve.outputs.harvest_run_id }}
    steps:
      - name: Wait for robust mechanism harvest
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint='repos/${{ github.repository }}/actions/workflows/research-candidate-ml-first-mechanism-harvest-v5d.yml/runs?branch=research_candidate_ML_first&per_page=1'
          for _ in $(seq 1 360); do
            payload=$(gh api "$endpoint")
            run_id=$(jq -r '.workflow_runs[0].id // empty' <<<"$payload")
            status=$(jq -r '.workflow_runs[0].status // empty' <<<"$payload")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$payload")
            if [[ -n "$run_id" && "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "harvest run $run_id concluded $conclusion" >&2
                exit 1
              fi
              echo "harvest_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          exit 1

  route-causal-actions:
    needs: resolve-harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: '1'
      SOURCE_RUN_ID: ${{ needs.resolve-harvest.outputs.harvest_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_ML_first
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-first-mechanism-harvest-v5d-*
          path: downloaded/ml-first-mechanism-harvest-v5d
          run-id: ${{ needs.resolve-harvest.outputs.harvest_run_id }}
          github-token: ${{ github.token }}
      - name: Normalize 24 action windows
        run: |
          set -euo pipefail
          NORMAL=artifacts/ml-first-action-value-v6d/normalized
          rm -rf "$NORMAL"
          mkdir -p "$NORMAL"
          shopt -s nullglob
          count=0
          for d in downloaded/ml-first-mechanism-harvest-v5d/ml-first-mechanism-harvest-v5d-*; do
            name="${d##*/ml-first-mechanism-harvest-v5d-}"
            frontier="${name%%-*}"
            period="${name#*-}"
            src="$d"
            nested="$d/artifacts/ml-first-mechanism-harvest-v5d/windows/fraction-$frontier/$period"
            [[ -d "$nested" ]] && src="$nested"
            mkdir -p "$NORMAL/fraction-$frontier/$period"
            cp -a "$src"/. "$NORMAL/fraction-$frontier/$period"/
            count=$((count + 1))
          done
          test "$count" -eq 24
      - name: Aggregate alternate actions
        run: |
          set -euo pipefail
          NORMAL=artifacts/ml-first-action-value-v6d/normalized
          AGG=artifacts/ml-first-action-value-v6d/fraction-aggregates
          COMBINED=artifacts/ml-first-action-value-v6d/combined
          rm -rf "$AGG" "$COMBINED"
          mkdir -p "$AGG" "$COMBINED"
          for frontier in 025 035 050; do
            python research/candidate-ml-first-liquidity-response-v2/aggregate_exact_windows.py \
              --root "$NORMAL/fraction-$frontier" \
              --output "$AGG/fraction-$frontier"
          done
          python research/candidate-ml-first-mechanism-router-v5/combine_fraction_plans.py \
            --root "$AGG" --output "$COMBINED"
      - name: Run chronological action-value policy
        run: |
          set -euo pipefail
          RUNTIME=artifacts/ml-first-action-value-v6d/runtime/mechanism_router_v2.py
          ACTION=artifacts/ml-first-action-value-v6d/runtime/causal_action_value_v3.py
          OUT=artifacts/ml-first-action-value-v6d/routed
          mkdir -p "$(dirname "$RUNTIME")" "$OUT"
          python research/candidate-ml-first-mechanism-router-v5/materialize_router_v2.py \
            --source research/candidate-ml-first-mechanism-router-v5/mechanism_router.py \
            --output "$RUNTIME"
          python research/candidate-ml-first-action-value-v6/materialize_action_value_v3.py \
            --source research/candidate-ml-first-action-value-v6/causal_action_value_router.py \
            --output "$ACTION"
          python "$ACTION" \
            --plans artifacts/ml-first-action-value-v6d/combined/all_fraction_candidate_plans.csv.gz \
            --router-runtime "$RUNTIME" --output "$OUT" --risk 0.03
          git rev-parse HEAD > "$OUT/source_sha.txt"
          printf '%s\n' "$SOURCE_RUN_ID" > "$OUT/source_harvest_run_id.txt"
          printf '%s\n' 9df00cdf2db3a99f6c98c538326909188d349741 > "$OUT/inherited_engine_sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-first-action-value-v6d-result-${{ github.sha }}
          path: artifacts/ml-first-action-value-v6d/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Commit action-value result
        run: |
          set -euo pipefail
          SRC=artifacts/ml-first-action-value-v6d
          DEST=research_results/candidate_ml_first/action_value_v6d/latest
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$SRC/routed"/. "$DEST"/
          cp "$SRC/combined/summary.json" "$DEST/combined_plan_summary.json"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if ! git diff --cached --quiet; then
            brief=$(python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('research_results/candidate_ml_first/action_value_v6d/latest/summary.json').read_text())
          f=s.get('selected_fresh', {})
          print(f"variant={s.get('selected_variant_from_development')} trades={f.get('trades')} meanR={f.get('mean_net_r')} nav={f.get('ending_nav')}")
          PY
          )
            git commit -m "Record ML-first action-value v6d ${brief} [skip ci]"
            git pull --rebase origin research_candidate_ML_first
            git push origin HEAD:research_candidate_ML_first
          fi
