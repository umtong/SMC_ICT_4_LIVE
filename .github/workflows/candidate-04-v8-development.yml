name: candidate-04-v8-development

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v8-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: normal-basis-a
            build_start: "2023-12-16"
            build_end: "2023-12-24"
            evaluation_start: "2023-12-18"
            evaluation_end: "2023-12-24"
          - name: negative-basis-a
            build_start: "2024-08-05"
            build_end: "2024-08-13"
            evaluation_start: "2024-08-07"
            evaluation_end: "2024-08-13"
          - name: negative-basis-b
            build_start: "2023-03-06"
            build_end: "2023-03-14"
            evaluation_start: "2023-03-08"
            evaluation_end: "2023-03-14"
          - name: v7-failed-week
            build_start: "2024-03-16"
            build_end: "2024-03-24"
            evaluation_start: "2024-03-18"
            evaluation_end: "2024-03-24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.25"
      - name: Verify runtime and v8 causal tests
        run: |
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_mesoscale_acceptance_candidate.py' -v
      - name: Build checksummed rich features
        run: |
          uv run python research/candidate-04/rich_features_v2.py \
            --start "${{ matrix.build_start }}" \
            --end "${{ matrix.build_end }}" \
            --cache ".cache/candidate-04-v8/${{ matrix.name }}-rich" \
            --output "artifacts/candidate-04-v8/${{ matrix.name }}/rich"
      - name: Replay development week
        run: |
          uv run python research/candidate-04/mesoscale_acceptance_candidate.py \
            --config research/candidate-04/inventory_transfer_config.json \
            --rich-dir "artifacts/candidate-04-v8/${{ matrix.name }}/rich" \
            --kline-dir ".cache/candidate-04-v8/${{ matrix.name }}-klines" \
            --evaluation-start "${{ matrix.evaluation_start }}" \
            --evaluation-end "${{ matrix.evaluation_end }}" \
            --output "artifacts/candidate-04-v8/${{ matrix.name }}/result" \
            --download-klines \
            | tee "artifacts/candidate-04-v8/${{ matrix.name }}/console.json"
      - name: Print stage result
        if: always()
        run: |
          if test -f "artifacts/candidate-04-v8/${{ matrix.name }}/result/metrics.json"; then
            python -m json.tool "artifacts/candidate-04-v8/${{ matrix.name }}/result/metrics.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-v8-${{ matrix.name }}-${{ github.sha }}
          path: |
            artifacts/candidate-04-v8/${{ matrix.name }}/result
            artifacts/candidate-04-v8/${{ matrix.name }}/console.json
            artifacts/candidate-04-v8/${{ matrix.name }}/rich/data_manifest.json
          if-no-files-found: warn
          retention-days: 90
