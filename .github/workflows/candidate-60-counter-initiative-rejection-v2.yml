name: candidate-60-counter-initiative-rejection-v2

on:
  push:
    branches: ["research/candidate-60"]
    paths:
      - ".github/workflows/candidate-60-counter-initiative-rejection-v2.yml"
      - "research/candidate-60/COUNTER_INITIATIVE_REJECTION_V2_FREEZE.md"
      - "research/candidate-60/counter_initiative_rejection_v2.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-60-counter-initiative-rejection-v2
  cancel-in-progress: true

jobs:
  delayed-factor-owned-rejection-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-60
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reassemble and verify frozen base and V2 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-60/COUNTER_INITIATIVE_REJECTION_V2_FREEZE.md

          cat research/candidate-60/counter_initiative_rejection_diagnostic_v1.b64.part* \
            > .work-counter-base.b64
          test "$(wc -c < .work-counter-base.b64)" = "10152"
          test "$(sha256sum .work-counter-base.b64 | awk '{print $1}')" = \
            "a4c3ab9d78c6703b97abac9b0fb525803f12aedd9102989b2aec2cfd2a41a935"
          base64 -d .work-counter-base.b64 > .work-counter-base.py.gz
          test "$(sha256sum .work-counter-base.py.gz | awk '{print $1}')" = \
            "6f3d0e8bc6708a8db6a6df7803fa007b0b58111823005841e9f6656e665b8de1"
          gzip -dc .work-counter-base.py.gz \
            > research/candidate-60/counter_initiative_rejection_diagnostic.py
          test "$(sha256sum research/candidate-60/counter_initiative_rejection_diagnostic.py | awk '{print $1}')" = \
            "93414c7a5d5ffadbfa6e692ec965063ad5b4d682405048a2c72c4241a3c807a3"

          cp research/candidate-60/counter_initiative_rejection_v2.py.gz.b64 \
            .work-counter-v2.b64
          test "$(wc -c < .work-counter-v2.b64)" = "6724"
          test "$(sha256sum .work-counter-v2.b64 | awk '{print $1}')" = \
            "b4872b852861d063165bb2d05dd5813de311362d3ab7d0e331bc09b7702b641f"
          base64 -d .work-counter-v2.b64 > .work-counter-v2.py.gz
          test "$(sha256sum .work-counter-v2.py.gz | awk '{print $1}')" = \
            "49873483822decb2a5ada488178774d45a5a48ba615bb8a4c6459a3cd30f660c"
          gzip -dc .work-counter-v2.py.gz \
            > research/candidate-60/counter_initiative_rejection_v2.py
          test "$(sha256sum research/candidate-60/counter_initiative_rejection_v2.py | awk '{print $1}')" = \
            "86373e41b12c9615800c2c7c7fecc9ca8193b350251b3dcd350b0860c4ab27cf"

          python -m py_compile \
            research/candidate-60/counter_initiative_rejection_diagnostic.py \
            research/candidate-60/counter_initiative_rejection_v2.py

      - name: Install locked environment and prove causal contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run python - <<'PY'
          import importlib.util
          import inspect
          from pathlib import Path
          import sys

          path = Path("research/candidate-60/counter_initiative_rejection_v2.py")
          spec = importlib.util.spec_from_file_location("c60_counter_rejection_v2", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.MAX_WAIT_MINUTES == 10
          assert module.MIN_FACTOR_OWNED_OTHER_ASSETS == 2
          assert module.DEVELOPMENT.start.isoformat() == "2026-06-29"
          assert module.DEVELOPMENT.end.isoformat() == "2026-07-05"
          assert module.POLICY_FRESH.start.isoformat() == "2026-08-03"
          assert module.m.PRIMARY_HORIZON == 15
          assert module.m.ROUND_TRIP_COST_BPS == 20.0

          owned = inspect.getsource(module.first_owned_rejection)
          assert 'for delay in range(1, MAX_WAIT_MINUTES + 1)' in owned
          assert 'int(np.sign(reject_return)) != direction' in owned
          assert 'int(np.sign(reject_flow)) != direction' in owned
          assert 'owned_count < MIN_FACTOR_OWNED_OTHER_ASSETS' in owned
          assert '"delay_minutes": delay' in owned

          proposed = inspect.getsource(module.build_proposed_events)
          assert 'counter_ts = parent_ts + pd.Timedelta(minutes=m.PARENT_MINUTES)' in proposed
          assert 'int(leader_counter["price_direction"]) != common_direction' in proposed
          assert 'int(counter["price_direction"]) != -common_direction' in proposed
          assert 'first_owned_rejection(' in proposed
          assert 'entry_ts = rejection["reject_ts"] + pd.Timedelta(minutes=m.REJECTION_MINUTES)' in proposed
          assert '"direction": common_direction' in proposed

          control = inspect.getsource(module.build_peer_control_events)
          assert 'first_peer_only_rejection(' in control
          assert 'direction = -initial_direction' in control

          main_source = inspect.getsource(module.main)
          assert main_source.index('development, proposed_events, control_events = run_stage(DEVELOPMENT)') < main_source.index('if decision["eligible"]:') < main_source.index('run_stage(POLICY_FRESH)')
          print("delayed unresolved window, contemporaneous factor ownership, first-rejection, next-open, peer-only control, one-slot and untouched-data contracts verified")
          PY

      - name: Run development and conditional policy-fresh diagnostic
        id: diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-60-counter-initiative-rejection-v2-console
          set -o pipefail
          uv run python research/candidate-60/counter_initiative_rejection_v2.py \
            2>&1 | tee \
            .work/candidate-60-counter-initiative-rejection-v2-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .work-counter-base.b64 \
            .work-counter-base.py.gz \
            .work-counter-v2.b64 \
            .work-counter-v2.py.gz \
            research/candidate-60/counter_initiative_rejection_diagnostic.py \
            research/candidate-60/counter_initiative_rejection_v2.py
          git config user.name "candidate-60-research-bot"
          git config user.email "candidate-60-research-bot@users.noreply.github.com"
          out=research/candidate-60/evidence/counter-initiative-rejection-v2
          if [[ -d "$out" ]]; then
            git add -f "$out"
          fi
          if ! git diff --cached --quiet; then
            git commit --no-gpg-sign -m \
              "candidate60: persist delayed factor-owned rejection evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin research/candidate-60
              git rebase origin/research/candidate-60
              if git push origin HEAD:research/candidate-60; then
                break
              fi
              sleep 2
            done
          fi

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-60-counter-initiative-rejection-v2
          path: |
            research/candidate-60/evidence/counter-initiative-rejection-v2
            .work/candidate-60-counter-initiative-rejection-v2-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce diagnostic validity
        if: always()
        shell: bash
        run: |
          status="${{ steps.diagnostic.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "counter-initiative rejection V2 failed; status=$status"
            exit "${status:-1}"
          fi
