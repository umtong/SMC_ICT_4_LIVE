name: candidate-03-apply-adse-patch

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/adse_patch.tar.gz"
      - ".github/workflows/candidate-03-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-03
      - name: Verify and apply frozen ADSE patch
        run: |
          echo "b2eca4a30cae31efcfb0a7aec605ffbbc5db1c4bbc3aada2877a283766f44724  research/candidate-03/adse_patch.tar.gz" | sha256sum -c -
          tar -xzf research/candidate-03/adse_patch.tar.gz
          rm research/candidate-03/adse_patch.tar.gz
          rm .github/workflows/candidate-03-bootstrap.yml
          rm -f .github/workflows/candidate-03-lcpt-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "candidate-03: freeze ADSE-v1 staged BTC validation"
          git push origin HEAD:research/candidate-03
