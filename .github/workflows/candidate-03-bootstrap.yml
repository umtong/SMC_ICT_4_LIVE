name: candidate-03-nt-lvcfr-bootstrap

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - ".nt-lvcfr-bootstrap/**"
      - ".github/workflows/candidate-03-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-frozen-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and install frozen Nautilus-only candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .nt-lvcfr-bootstrap/part* | tr -d '\n' > /tmp/nt-lvcfr-bundle.b64
          base64 -d /tmp/nt-lvcfr-bundle.b64 > /tmp/nt-lvcfr-bundle.tar.gz
          echo "6bd8be8ac724ea0f02634f3795fb3fb9a6ad4e8c6e51dbadef735bc21e37c088  /tmp/nt-lvcfr-bundle.tar.gz" | sha256sum -c -

          rm -rf /tmp/nt-lvcfr-candidate
          mkdir -p /tmp/nt-lvcfr-candidate
          tar -xzf /tmp/nt-lvcfr-bundle.tar.gz -C /tmp/nt-lvcfr-candidate

          rm -rf research/candidate-03
          cp -a /tmp/nt-lvcfr-candidate/research/candidate-03 research/
          cp /tmp/nt-lvcfr-candidate/.github/workflows/candidate-03.yml .github/workflows/candidate-03.yml

          rm -f .github/workflows/candidate-03-data-probe.yml
          rm -f .github/workflows/candidate-03-nt-probe.yml
          rm -f .github/workflows/candidate-03-nt-smoke.yml
          rm -f .github/workflows/candidate-03-source-export.yml
          rm -f scripts/nt_candidate_smoke.py
          rm -f scripts/nt_candidate_smoke_strategy.py
          rm -rf .nt-lvcfr-bootstrap
          rm -f .github/workflows/candidate-03-bootstrap.yml

          python -m compileall -q research/candidate-03 src/smc_ict_4

          git config user.name "candidate-03 research bot"
          git config user.email "candidate-03@users.noreply.github.com"
          git add -A
          git commit -m "candidate-03: replace custom replays with NautilusTrader candidate"
          git push origin HEAD:research/candidate-03
