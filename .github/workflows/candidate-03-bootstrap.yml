name: candidate-03-apply-adse-patch

on:
  push:
    branches: ["research/candidate-03"]
    paths:
      - "research/candidate-03/adse_patch.b64.*"
      - ".github/workflows/candidate-03-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-03
      - name: Reassemble, verify, and create frozen ADSE commit
        run: |
          cat research/candidate-03/adse_patch.b64.* | tr -d '\n\r\t ' | base64 --decode > /tmp/adse_patch.tar.gz
          echo "b2eca4a30cae31efcfb0a7aec605ffbbc5db1c4bbc3aada2877a283766f44724  /tmp/adse_patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/adse_patch.tar.gz
          rm -f research/candidate-03/adse_patch.tar.gz
          rm -f research/candidate-03/adse_patch.b64.*
          rm .github/workflows/candidate-03-bootstrap.yml
          rm -f .github/workflows/candidate-03-lcpt-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          GIT_AUTHOR_DATE="2026-08-05T19:30:00Z" GIT_COMMITTER_DATE="2026-08-05T19:30:00Z" git commit -m "candidate-03: freeze ADSE-v1 staged BTC validation"
          echo "ADSE_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:research/candidate-03
