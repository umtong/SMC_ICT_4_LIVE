name: candidate-02-v40-week-two-state

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".candidate-02-v40/collect_week_two_state.py"
      - ".github/workflows/candidate-02-v40-week-two.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect locked v40 second-week OI and funding data
        run: python .candidate-02-v40/collect_week_two_state.py
      - name: Upload immutable v40 week-two state data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v40-week-two-${{ github.sha }}
          path: |
            .cache/candidate-02/v40-week-two-state
            artifacts/candidate-02-v40-week-two-state/manifest.json
          retention-days: 14
