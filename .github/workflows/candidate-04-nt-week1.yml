name: candidate-04-nt-week1

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-nt-week1.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed NautilusTrader environment
        run: |
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/nt_liquidity_strategy.py \
            research/candidate-04/nt_liquidity_strategy_v3.py \
            research/candidate-04/nt_backtest.py \
            research/candidate-04/nt_backtest_v3.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_liquidity_strategy.py' -v

      - name: Run first random BTC week through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-04-nt/week1
          python research/candidate-04/nt_backtest_v3.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start 2023-10-01 \
            --build-end 2023-10-09 \
            --evaluation-start 2023-10-03 \
            --evaluation-end 2023-10-09 \
            --cache .cache/candidate-04-nt/week1 \
            --output artifacts/candidate-04-nt/week1 \
            | tee artifacts/candidate-04-nt/week1/console.json
          test -s artifacts/candidate-04-nt/week1/metrics.json
          test -s artifacts/candidate-04-nt/week1/run.json
          test -s artifacts/candidate-04-nt/week1/data_manifest.json
          test -s artifacts/candidate-04-nt/week1/orders.csv
          test -s artifacts/candidate-04-nt/week1/positions.csv
          test -s artifacts/candidate-04-nt/week1/account.csv
          test -s artifacts/candidate-04-nt/week1/equity.csv

      - name: Print stage result
        if: always()
        run: |
          if test -f artifacts/candidate-04-nt/week1/metrics.json; then
            python -m json.tool artifacts/candidate-04-nt/week1/metrics.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-nt-week1-${{ github.sha }}
          path: |
            artifacts/candidate-04-nt/week1/metrics.json
            artifacts/candidate-04-nt/week1/run.json
            artifacts/candidate-04-nt/week1/data_manifest.json
            artifacts/candidate-04-nt/week1/orders.csv
            artifacts/candidate-04-nt/week1/positions.csv
            artifacts/candidate-04-nt/week1/account.csv
            artifacts/candidate-04-nt/week1/equity.csv
            artifacts/candidate-04-nt/week1/strategy_events.json
            artifacts/candidate-04-nt/week1/closed_scenarios.json
            artifacts/candidate-04-nt/week1/console.json
          if-no-files-found: warn
          retention-days: 90
