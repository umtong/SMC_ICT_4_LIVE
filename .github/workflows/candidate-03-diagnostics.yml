name: candidate-03-diagnostics

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-diagnostics.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-week-2-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download checksum-verified untouched week-2 events
        run: >-
          python research/candidate-03/download_daily.py
          --dataset aggTrades --symbol BTCUSDT
          --start-date 2025-03-16 --end-date 2025-03-23
          --output .research-data/candidate-03/diagnostics/week-2 --no-extract
      - name: Preserve raw diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-week-2-raw-${{ github.sha }}
          path: .research-data/candidate-03/diagnostics/week-2
          if-no-files-found: error
          retention-days: 3
