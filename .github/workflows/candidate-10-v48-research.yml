name: candidate-10-v48-independent-aac

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/c10_v48_*.py
      - research/candidate-10/test_c10_v48_aac_event_leader.py
      - .github/workflows/candidate-10-v48-research.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v48-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
  CANDIDATE11_COMMIT: f10517d4ccd2a1a8fbd4d31091cbe0e7c3655327

jobs:
  weeks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - week_id: CONTROL_AAC_LOSS
            week_start: "2023-11-26"
            evidence_class: controlled_rank_attribution
          - week_id: CONTROL_AAC_RANK1_WIN
            week_start: "2025-01-25"
            evidence_class: controlled_rank_attribution
          # Temporal holdouts after the 2022-2025 development universe used by
          # preceding Candidate-10 generations. All weeks are complete before
          # this workflow's 2026-08-08 research date.
          - week_id: TEMPORAL_2026_A
            week_start: "2026-01-05"
            evidence_class: untouched_temporal_holdout
          - week_id: TEMPORAL_2026_B
            week_start: "2026-02-09"
            evidence_class: untouched_temporal_holdout
          - week_id: TEMPORAL_2026_C
            week_start: "2026-03-16"
            evidence_class: untouched_temporal_holdout
          - week_id: TEMPORAL_2026_D
            week_start: "2026-04-20"
            evidence_class: untouched_temporal_holdout
          - week_id: TEMPORAL_2026_E
            week_start: "2026-05-25"
            evidence_class: untouched_temporal_holdout
          - week_id: TEMPORAL_2026_F
            week_start: "2026-06-29"
            evidence_class: untouched_temporal_holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout candidate-10
        uses: actions/checkout@v4

      - name: Checkout frozen Candidate 11 source
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_4_LIVE
          ref: ${{ env.CANDIDATE11_COMMIT }}
          path: .candidate11
          fetch-depth: 1

      - name: Run independent AAC rank exact ablation
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="artifacts/candidate-10-v48/${{ matrix.week_id }}"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}"
          chmod -R a+rwx artifacts
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate11-v48:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate11-v48
              cp -a /workspace/.candidate11/research/candidate-11 /tmp/candidate11-v48
              for file in \
                c10_v27_overlay.py c10_v27_patch.py \
                c10_v28_overlay.py c10_v28_patch.py \
                c10_v29_overlay.py c10_v29_patch.py \
                c10_v48_overlay.py c10_v48_patch.py c10_v48_run.py \
                test_c10_v27_overlay.py test_c10_v28_overlay.py \
                test_c10_v29_overlay.py \
                test_c10_v48_aac_event_leader.py; do
                cp "/workspace/research/candidate-10/${file}" /tmp/candidate11-v48/
              done
              smc4 doctor
              python /tmp/candidate11-v48/c10_v48_patch.py \
                /tmp/candidate11-v48/run_leadership_scdam.py
              python -m py_compile \
                /tmp/candidate11-v48/c10_v*.py \
                /tmp/candidate11-v48/run_leadership_scdam.py
              python -m unittest discover \
                -s /tmp/candidate11-v48 \
                -p "test_c10_v*.py" \
                -v

              BASE="/workspace/artifacts/candidate-10-v48/${{ matrix.week_id }}"
              python /tmp/candidate11-v48/c10_v48_run.py \
                --candidate11-dir /tmp/candidate11-v48 \
                --week-start "${{ matrix.week_start }}" \
                --variant aac-all-approved \
                --output "${BASE}/aac-all-approved"

              mkdir -p "${BASE}/aac-event-leader/data"
              cp -al "${BASE}/aac-all-approved/data/." \
                "${BASE}/aac-event-leader/data/"
              python /tmp/candidate11-v48/c10_v48_run.py \
                --candidate11-dir /tmp/candidate11-v48 \
                --week-start "${{ matrix.week_start }}" \
                --variant aac-event-leader \
                --output "${BASE}/aac-event-leader"
            '

      - name: Record evidence class
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/candidate-10-v48/${{ matrix.week_id }}
          printf '%s\n' '${{ matrix.evidence_class }}' > \
            artifacts/candidate-10-v48/${{ matrix.week_id }}/evidence_class.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v48-${{ matrix.week_id }}-${{ github.sha }}
          path: artifacts/candidate-10-v48/${{ matrix.week_id }}
          if-no-files-found: warn
          retention-days: 14
