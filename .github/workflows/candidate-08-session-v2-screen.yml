name: candidate-08-session-v2-screen-evidence

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-session-v2-screen"

permissions:
  contents: write
  packages: read

jobs:
  screen:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      OUT: /tmp/candidate-08-session-v2-screen
      DATA_CACHE: /tmp/smc4-candidate-08-data
      EVIDENCE: research/candidate-08/evidence/session-v2-screen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify environment and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-08
          python research/candidate-08/test_logic.py -v

      - name: Restore verified Binance archives
        uses: actions/cache@v4
        with:
          path: /tmp/smc4-candidate-08-data
          key: candidate-08-binance-vision-v1

      - name: Run fixed NautilusTrader screen and commit evidence
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python research/candidate-08/run.py \
            --suite screen \
            --output "$OUT" \
            --data-cache "$DATA_CACHE" \
            2>&1 | tee "$OUT/runner.log"
          status=${PIPESTATUS[0]}

          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          for file in suite_metrics.json run.json; do
            if [[ -f "$OUT/$file" ]]; then cp "$OUT/$file" "$EVIDENCE/$file"; fi
          done
          for window in screen-01 screen-02 screen-03; do
            mkdir -p "$EVIDENCE/$window"
            for file in metrics.json run.json data_manifest.json position_outcomes.json trade_intents.json skipped_setups.json; do
              if [[ -f "$OUT/$window/$file" ]]; then cp "$OUT/$window/$file" "$EVIDENCE/$window/$file"; fi
            done
          done
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["EVIDENCE"]) / "workflow.json"
          p.write_text(json.dumps({
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "source_commit": os.environ.get("GITHUB_SHA"),
              "runner_exit_status": int(os.environ.get("RUN_STATUS", "0")),
          }, indent=2) + "\n")
          PY
          printf '%s\n' "$status" > "$EVIDENCE/runner_exit_status.txt"
          rm -f research/candidate-08/.run-session-v2-screen

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add "$EVIDENCE" research/candidate-08/.run-session-v2-screen
          git -C "$GITHUB_WORKSPACE" commit -m "candidate-08: record session-v2 fixed screen evidence"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:research/candidate-08
          exit "$status"
        env:
          RUN_STATUS: "0"

      - name: Preserve complete execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-08-session-v2-screen-${{ github.sha }}
          path: /tmp/candidate-08-session-v2-screen
          if-no-files-found: warn
          retention-days: 30
