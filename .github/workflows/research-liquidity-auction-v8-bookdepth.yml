name: Research liquidity auction v8 aggregate-depth control

on:
  workflow_dispatch:
  push:
    branches: ["research_liquidity_auction_v8"]
    paths:
      - ".github/workflows/research-liquidity-auction-v8-bookdepth.yml"
      - "research/candidate-liquidity-auction-v8/bookdepth_feature_harvest.py"

concurrency:
  group: research-liquidity-auction-v8-bookdepth
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
        period:
          - {name: dev-2024-feb, start: 2024-02-01, end: 2024-02-09}
          - {name: dev-2025-feb, start: 2025-02-01, end: 2025-02-09}
          - {name: eval-2026-jun, start: 2026-06-01, end: 2026-06-09}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/v8-bookdepth/${{ matrix.period.name }}/${{ matrix.symbol }}
      OUT: artifacts/v8-bookdepth/${{ matrix.period.name }}/${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v8
      - name: Harvest causal aggregate-depth state
        run: |
          set -euo pipefail
          python research/candidate-liquidity-auction-v8/bookdepth_feature_harvest.py \
            --symbol "${{ matrix.symbol }}" \
            --start "${{ matrix.period.start }}" \
            --end "${{ matrix.period.end }}" \
            --cache "$CACHE" \
            --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v8-bookdepth-${{ matrix.period.name }}-${{ matrix.symbol }}
          path: artifacts/v8-bookdepth/${{ matrix.period.name }}/${{ matrix.symbol }}/**
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: harvest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_liquidity_auction_v8
      - uses: actions/download-artifact@v4
        with:
          pattern: liquidity-auction-v8-bookdepth-*
          path: /tmp/v8-bookdepth
          merge-multiple: false
      - name: Merge the causal feature panel
        run: |
          set -euo pipefail
          mkdir -p artifacts/v8-bookdepth/panel research_results/liquidity_auction_v8/bookdepth
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('/tmp/v8-bookdepth')
          frames, metadata = [], []
          for path in sorted(root.rglob('bookdepth_features.csv.gz')):
              frame = pd.read_csv(path)
              frame['artifact'] = path.parent.name
              frames.append(frame)
              meta = path.with_name('metadata.json')
              if meta.exists():
                  metadata.append(json.loads(meta.read_text()))
          if len(frames) != 12:
              raise SystemExit(f'expected 12 feature artifacts, found {len(frames)}')
          panel = pd.concat(frames, ignore_index=True)
          panel.to_csv('artifacts/v8-bookdepth/panel/panel.csv.gz', index=False, compression='gzip')
          summary = {
              'run_id': int('${{ github.run_id }}'),
              'head_sha': '${{ github.sha }}',
              'rows': int(len(panel)),
              'artifacts': int(len(frames)),
              'symbols': sorted(panel.symbol.dropna().unique().tolist()),
              'metadata': metadata,
          }
          Path('artifacts/v8-bookdepth/panel/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          Path('research_results/liquidity_auction_v8/bookdepth/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-auction-v8-bookdepth-panel
          path: artifacts/v8-bookdepth/panel/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish run pointer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/liquidity_auction_v8/bookdepth/summary.json
          git commit -m "Record v8 aggregate-depth run metadata" || exit 0
          git push origin HEAD:research_liquidity_auction_v8
