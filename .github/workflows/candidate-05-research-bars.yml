name: candidate-05-research-bars

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-research-bars.yml"

permissions:
  contents: read
  packages: read

jobs:
  export-liquidation-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-05
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment and export checksum-verified liquidation reference
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from datetime import date, timedelta
          from hashlib import sha256
          from pathlib import Path
          from urllib.error import HTTPError
          import json
          import urllib.request

          root = Path("artifacts/candidate-05-liquidation-reference")
          root.mkdir(parents=True, exist_ok=True)
          base = "https://data.binance.vision/data/futures/um/daily/liquidationSnapshot"

          def digest(path: Path) -> str:
              h = sha256()
              with path.open("rb") as stream:
                  while block := stream.read(1 << 20):
                      h.update(block)
              return h.hexdigest()

          def checked(url: str, target: Path) -> bool:
              target.parent.mkdir(parents=True, exist_ok=True)
              checksum = target.with_name(target.name + ".CHECKSUM")
              try:
                  urllib.request.urlretrieve(url, target)
                  urllib.request.urlretrieve(url + ".CHECKSUM", checksum)
              except HTTPError as exc:
                  if exc.code == 404:
                      target.unlink(missing_ok=True)
                      checksum.unlink(missing_ok=True)
                      return False
                  raise
              expected = checksum.read_text(encoding="utf-8").split()[0].lower()
              actual = digest(target)
              if actual != expected:
                  raise RuntimeError(f"checksum mismatch: {target}")
              return True

          symbols = ("BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT")
          periods = {
              "week_1": (date(2023, 7, 7), date(2023, 7, 15), symbols),
              "week_2": (date(2024, 1, 13), date(2024, 1, 21), symbols),
              "week_3": (date(2023, 9, 6), date(2023, 9, 14), symbols),
              "btc_30d": (date(2024, 2, 28), date(2024, 3, 30), ("BTCUSDT",)),
          }
          present = []
          missing = []
          for period, (start, end, period_symbols) in periods.items():
              for symbol in period_symbols:
                  day = start
                  while day <= end:
                      stamp = day.isoformat()
                      name = f"{symbol}-liquidationSnapshot-{stamp}.zip"
                      target = root / period / symbol / name
                      url = f"{base}/{symbol}/{name}"
                      item = {"period": period, "symbol": symbol, "day": stamp}
                      (present if checked(url, target) else missing).append(item)
                      day += timedelta(days=1)
          (root / "availability.json").write_text(
              json.dumps({"present": present, "missing": missing}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not present:
              raise RuntimeError("no historical liquidation reference files available")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-05-liquidation-reference-${{ github.sha }}
          path: artifacts/candidate-05-liquidation-reference/**
          if-no-files-found: error
          retention-days: 1
