name: candidate-easychart-v14-simple-contract-tests

on:
  push:
    branches: ["research/candidate-easychart-v14-simple-contract"]
    paths:
      - "research/candidate-easychart-v3/**"
      - "research/candidate-easychart-v5/**"
      - ".github/workflows/candidate-easychart-v14-simple-contract-tests.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v14-simple-contract-tests
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  simple-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v14-simple-contract
    steps:
      - uses: actions/checkout@v4

      - name: Environment and full semantic suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          smc4 doctor
          python -m compileall -q research/candidate-easychart-v3 research/candidate-easychart-v5
          python -m unittest discover -s research/candidate-easychart-v5/tests -p 'test_*.py' -v

      - name: Emit immutable contract record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$ROOT/contract.json"
          import json
          from simple_contract_v14 import contract_record
          print(json.dumps(contract_record(), indent=2, sort_keys=True))
          PY

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-v14-simple-contract-${{ github.sha }}
          path: artifacts/candidate-easychart-v14-simple-contract/**
          if-no-files-found: warn
          retention-days: 90
