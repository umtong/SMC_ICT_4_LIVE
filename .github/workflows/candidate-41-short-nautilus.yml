name: candidate-41-short-nautilus

on:
  push:
    branches: ["research/candidate-41"]
    paths:
      - "research/candidate-41/**"
      - ".github/workflows/candidate-41-short-nautilus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.25"

      - name: Install locked foundation
        run: |
          uv lock --check
          uv sync --locked

      - name: Runtime doctor
        run: uv run smc4 doctor

      - name: Compile Candidate 41
        run: uv run python -m compileall -q research/candidate-41

      - name: Causal router contracts
        run: uv run --with pytest python -m pytest -q research/candidate-41/test_router.py

  seven-day-development-diagnostic:
    needs: unit-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.25"

      - name: Install locked foundation
        run: |
          uv lock --check
          uv sync --locked

      - name: Run one continuous four-asset NautilusTrader account
        run: |
          uv run python research/candidate-41/run.py \
            --config research/candidate-41/config.json \
            --start 2026-07-15 \
            --end 2026-07-21 \
            --cache .cache/candidate-41 \
            --output artifacts/candidate-41/2026-07-15_2026-07-21 \
            --workspace .work/candidate-41

      - name: Print decision and account summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/candidate-41/2026-07-15_2026-07-21")
          metrics_path = root / "metrics.json"
          diagnostics_path = root / "strategy_diagnostics.json"
          if metrics_path.is_file():
              metrics = json.loads(metrics_path.read_text())
              keys = [
                  "ending_nav", "total_return", "geometric_daily_growth",
                  "max_drawdown", "trades", "wins", "win_rate",
                  "profit_factor", "expectancy_usdt", "gate_pass",
              ]
              print(json.dumps({key: metrics.get(key) for key in keys}, indent=2))
          else:
              print("metrics.json not produced")
          if diagnostics_path.is_file():
              diagnostics = json.loads(diagnostics_path.read_text())
              keys = [
                  "quarter_hour_decisions", "entry_submissions",
                  "entry_expirations", "cost_space_rejections",
                  "duplicate_causal_episode_rejections", "route_counts",
                  "unresolved_reason_counts", "selected_symbols",
              ]
              print(json.dumps({key: diagnostics.get(key) for key in keys}, indent=2))
          PY

      - name: Preserve compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-41-short-${{ github.sha }}
          path: |
            artifacts/candidate-41/2026-07-15_2026-07-21/*.json
            artifacts/candidate-41/2026-07-15_2026-07-21/*.csv
          if-no-files-found: warn
