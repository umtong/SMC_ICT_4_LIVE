name: Candidate 09 granular LOB probe

on:
  push:
    branches: [research/candidate-09]
    paths:
      - .github/workflows/candidate-09-lob-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe official bookTicker and aggTrades
        shell: bash
        run: |
          set -euo pipefail
          base='https://data.binance.vision/data/futures/um/daily'
          for kind in bookTicker aggTrades; do
            file="BTCUSDT-${kind}-2024-10-14.zip"
            url="$base/$kind/BTCUSDT/$file"
            echo "URL=$url"
            curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 -fsSL "$url" -o "/tmp/$file"
            stat -c "KIND=$kind BYTES=%s" "/tmp/$file"
            sha256sum "/tmp/$file"
            unzip -l "/tmp/$file"
            python - "$kind" "/tmp/$file" <<'PY'
          import csv, io, sys, zipfile
          kind, path = sys.argv[1:]
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if n.lower().endswith('.csv')]
              print('KIND',kind,'CSV_NAMES',names)
              with z.open(names[0]) as raw:
                  reader=csv.reader(io.TextIOWrapper(raw,encoding='utf-8',newline=''))
                  for i,row in enumerate(reader):
                      print(kind,i,repr(row))
                      if i>=5: break
          PY
          done
