name: candidate-easychart-ml3-state-policy

on:
  push:
    branches: [research_ML3]
    paths:
      - "research/candidate-easychart_ml3_state_policy/**"
      - ".github/workflows/candidate-easychart-ml3-state-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-state-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy<2.1" \
            "pandas>=2.1,<2.3" \
            "scikit-learn==1.5.2" \
            "lightgbm==4.5.0" \
            "numba==0.60.0" \
            requests

      - name: Reconstruct and compile direct policy
        run: |
          cat research/candidate-easychart_ml3_state_policy/_source/part_*.pyfrag > /tmp/state_policy.py
          python -m py_compile /tmp/state_policy.py

      - name: Causal synthetic contract
        run: |
          python /tmp/state_policy.py \
            --synthetic \
            --synthetic-days 18 \
            --train-end 2025-01-10 \
            --calibration-end 2025-01-14 \
            --decision-step-minutes 30 \
            --output research-results/state-policy-synthetic

      - uses: actions/cache@v4
        with:
          path: /tmp/binance-cache
          key: state-policy-binance-2025q1-v1

      - name: Real four-market diagnostic
        env:
          PYTHONPATH: research/candidate-easychart-v2:research/candidate-easychart_re1
          PYTHONWARNINGS: ignore
        run: |
          python /tmp/state_policy.py \
            --start 2025-01-01 \
            --end 2025-03-31 \
            --train-end 2025-02-15 \
            --calibration-end 2025-03-01 \
            --decision-step-minutes 15 \
            --cache /tmp/binance-cache \
            --output research-results/state-policy-real-2025q1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-ml3-state-policy
          path: research-results/
          if-no-files-found: warn
          retention-days: 14
