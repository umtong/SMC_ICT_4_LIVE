name: candidate-16-v3-top-book-resiliency-screen

on:
  push:
    branches: ["research/candidate-16-v3-top-of-book-resiliency"]
    paths:
      - "research/candidate-16/**"
      - ".github/workflows/candidate-16-v3-screen.yml"
  workflow_dispatch:

concurrency:
  group: candidate-16-v3-top-book-resiliency-screen
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  causal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-16:research/candidate-05:research/candidate-03
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-16-v3-screen
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment, provenance, and causal contracts
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q research/candidate-16
          python -m unittest discover -s research/candidate-16/tests -p 'test_topbook_features_v3.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_strategy_v3_contract.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_displayed_liquidity_router_v2.py' -v
          python -m unittest discover -s research/candidate-16/tests -p 'test_effort_result_router.py' -v
          python -m unittest discover -s research/candidate-05/tests -p 'test_book_depth_gap_contract.py' -v

      - name: Verify deterministic untouched week
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import date, timedelta
          from hashlib import sha256

          seed = (
              "candidate16-v3-top-of-book-resiliency|"
              "0d43da0256af7d4d2a1aa81dcdb98fec8f625cda|"
              "independent-week"
          )
          mondays = []
          cursor = date(2022, 1, 3)
          while cursor <= date(2025, 12, 29):
              mondays.append(cursor)
              cursor += timedelta(days=7)
          digest = sha256(seed.encode("utf-8")).hexdigest()
          index = int(digest, 16) % len(mondays)
          expected = (
              "5bcc531832c121c21e26750e8bf72ec0ca2b04dd500b339b9583b112cfb56ebe"
          )
          if digest != expected or index != 49 or mondays[index].isoformat() != "2022-12-12":
              raise SystemExit((digest, index, mondays[index]))
          print({"candidate_weeks": len(mondays), "index": index, "start": str(mondays[index])})
          PY

      - name: Run untouched BTC week through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python research/candidate-16/candidate_v3.py stage \
            --config research/candidate-16/config_v3.json \
            --build-start 2022-12-09 \
            --build-end 2022-12-18 \
            --evaluation-start 2022-12-12 \
            --evaluation-end 2022-12-18 \
            --cache .cache/candidate-16-v3 \
            --output "$ROOT" \
            2>&1 | tee "$ROOT/console.log"

      - name: Classify unchanged screen and top-book funnel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          metrics = json.loads((root / "metrics.json").read_text())
          diagnostics = json.loads((root / "strategy_diagnostics.json").read_text())
          integrity = (
              int(metrics.get("liquidations", 0)) == 0
              and int(diagnostics.get("order_rejections", 0)) == 0
              and int(diagnostics.get("max_simultaneous_entry_intents", 0)) <= 1
              and int(diagnostics.get("max_open_positions_observed", 0)) <= 1
              and float(metrics.get("min_equity", 0.0)) > 0.0
          )
          decision = {
              "schema": "candidate-16-v3-screen-v1",
              "pre_registered_evaluation": ["2022-12-12", "2022-12-18"],
              "integrity_pass": integrity,
              "gate_pass": bool(metrics.get("gate_pass", False)),
              "classification": (
                  "ADVANCE_UNCHANGED_TO_NEXT_UNTOUCHED_PERIOD"
                  if integrity and metrics.get("gate_pass", False)
                  else "DO_NOT_CLAIM_TARGET; ATTRIBUTE_TOPBOOK_STATE_FAILURE"
              ),
              "metrics": metrics,
              "router_counts": {
                  "parents": diagnostics.get("candidate16_parent_auctions", 0),
                  "effort_result_failed": diagnostics.get("candidate16_failed_auctions", 0),
                  "failure_liquidity_rejected": diagnostics.get(
                      "candidate16_v2_failure_liquidity_rejected", 0
                  ),
                  "failure_frozen": diagnostics.get("candidate16_v2_failure_frozen", 0),
                  "later_initiatives": diagnostics.get(
                      "candidate16_v2_failure_initiatives", 0
                  ),
                  "initiative_invalidated": diagnostics.get(
                      "candidate16_v2_failure_initiative_invalidated", 0
                  ),
                  "initiative_expired": diagnostics.get(
                      "candidate16_v2_failure_initiative_expired", 0
                  ),
                  "acceptance_liquidity_confirmed": diagnostics.get(
                      "candidate16_v2_acceptance_liquidity_confirmed", 0
                  ),
                  "acceptance_liquidity_rejected": diagnostics.get(
                      "candidate16_v2_acceptance_liquidity_rejected", 0
                  ),
                  "unresolved": diagnostics.get("candidate16_unresolved", 0),
                  "entries": diagnostics.get("entry_submissions", 0),
                  "bid_defense_observations": diagnostics.get(
                      "candidate16_v3_bid_defense_observations", 0
                  ),
                  "ask_defense_observations": diagnostics.get(
                      "candidate16_v3_ask_defense_observations", 0
                  ),
                  "bid_withdrawal_observations": diagnostics.get(
                      "candidate16_v3_bid_withdrawal_observations", 0
                  ),
                  "ask_withdrawal_observations": diagnostics.get(
                      "candidate16_v3_ask_withdrawal_observations", 0
                  ),
                  "book_disagreement_observations": diagnostics.get(
                      "candidate16_v3_book_disagreement_observations", 0
                  ),
                  "protective_fail_closes": diagnostics.get(
                      "candidate16_v2_protective_stop_fail_closes", 0
                  )
              }
          }
          (root / "screen_decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True, allow_nan=True) + "\n"
          )
          print(json.dumps(decision, indent=2, sort_keys=True, allow_nan=True))
          PY

      - name: Verify authoritative evidence and bookTicker provenance
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/metrics.json"
          python -m json.tool "$ROOT/screen_decision.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          evidence = json.loads((root / "raw_evidence.json").read_text())
          book = [item for item in evidence if item.get("endpoint") == "bookTicker"]
          if len(book) != 10:
              raise SystemExit(f"expected ten verified bookTicker days, found {len(book)}")
          if not all(item.get("sha256") and item.get("checksum") for item in book):
              raise SystemExit("bookTicker provenance is incomplete")
          PY
          for file in run.json data_manifest.json raw_evidence.json orders.csv positions.csv account.csv equity.csv strategy_diagnostics.json closed_scenarios.json scenario_events.jsonl candidate16_v3_contract.json features.csv.gz; do
            test -s "$ROOT/$file"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-16-v3-screen-${{ github.sha }}
          path: artifacts/candidate-16-v3-screen/**
          if-no-files-found: warn
          retention-days: 90
