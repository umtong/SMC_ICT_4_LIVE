name: candidate-47-ichifan-june-repair

on:
  push:
    branches: ["research/candidate-47"]
    paths: [".github/workflows/candidate-47-ichifan-june-repair.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  june-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-47:research/candidate-16:research/candidate-05
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-47-ichifan-june-repair
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-47
      - run: smc4 doctor
      - name: Verify price-only contract and execute unchanged policy
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'CANDIDATE47_PRICE_ONLY_INPUTS' research/candidate-47/ichifan_launch.py research/candidate-47/run.py
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          python research/candidate-47/ichifan_launch.py \
            --config research/candidate-47/ichifan_config.json \
            --start 2026-06-08 --end 2026-06-14 \
            --cache .cache/candidate-47-ichifan-june-repair \
            --output "$ROOT" --workspace "$ROOT/workspace" \
            2>&1 | tee "$ROOT/console.log"
      - name: Print and verify exact result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads((Path(os.environ["ROOT"]) / "metrics.json").read_text())
          d = m["strategy_diagnostics"]
          print(json.dumps({k: m[k] for k in ("ending_nav","total_return","geometric_daily_growth","max_drawdown","trades","wins","losses","win_rate","profit_factor","expectancy_usdt")}, indent=2, sort_keys=True))
          assert m["single_continuous_account"] is True
          assert m["single_strategy_process"] is True
          assert m["global_entry_or_position_limit"] == 1
          assert m["gate_checks"]["risk_fraction_exactly_three_percent"] is True
          assert m["gate_checks"]["no_global_position_violation"] is True
          assert m["gate_checks"]["nautilus_positions_match"] is True
          assert d.get("global_position_violations", 0) == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-47-ichifan-june-repair-${{ github.sha }}
          path: artifacts/candidate-47-ichifan-june-repair/**
          if-no-files-found: warn
          retention-days: 30
