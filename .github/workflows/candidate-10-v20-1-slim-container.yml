# Controlled trigger revision: 2026-08-07T02:12:00Z
# Source SHA256: b481befeb701cedc13536f7924b3207cc46912aeb4ec4d688fee294db514dec7
# Patch SHA256: ad93590e75c6c68f0de2daaae1525bc5aa4503afa91795e829e787c58fb1dc6f
name: candidate-10-v20-2-live-impact

on:
  push:
    branches:
      - research/candidate-10
    paths:
      - research/candidate-10/v20_source.zip
      - research/candidate-10/v20_2_patch.zip
      - research/candidate-10/sitecustomize.py
      - research/candidate-10/EXECUTE_V20_2_GATE.md
      - .github/workflows/candidate-10-v20-1-slim-container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-10-v20-2-live-impact-${{ github.ref }}
  cancel-in-progress: true

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout candidate branch on host runner
        uses: actions/checkout@v4

      - name: Verify immutable source archives on host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import zipfile

          inputs = [
              (
                  Path("research/candidate-10/v20_source.zip"),
                  "b481befeb701cedc13536f7924b3207cc46912aeb4ec4d688fee294db514dec7",
              ),
              (
                  Path("research/candidate-10/v20_2_patch.zip"),
                  "ad93590e75c6c68f0de2daaae1525bc5aa4503afa91795e829e787c58fb1dc6f",
              ),
          ]
          for source, expected in inputs:
              actual = sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{source} SHA256 mismatch: {actual} != {expected}")
              with zipfile.ZipFile(source) as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise SystemExit(f"corrupt member in {source}: {bad}")
              print(f"VERIFIED={source}:{actual}")
          PY

      - name: Prepare mounted artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-10-v20-2
          chmod -R a+rwx artifacts

      - name: Run controlled BTC gate in pinned NautilusTrader image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${RESEARCH_IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e SMC4_PREBUILT_ENV=1 \
            -e PYTHONPATH=/tmp/candidate10-v20-patch:/tmp/candidate10-v20:/workspace/research/candidate-10:/workspace/src \
            "${RESEARCH_IMAGE}" \
            bash -c '
              set -euo pipefail
              rm -rf /tmp/candidate10-v20 /tmp/candidate10-v20-patch /tmp/candidate-10-v20-2-data
              mkdir -p /tmp/candidate10-v20 /tmp/candidate10-v20-patch /workspace/artifacts/candidate-10-v20-2
              python -c "import zipfile; zipfile.ZipFile(\"research/candidate-10/v20_source.zip\").extractall(\"/tmp/candidate10-v20\"); zipfile.ZipFile(\"research/candidate-10/v20_2_patch.zip\").extractall(\"/tmp/candidate10-v20-patch\")"
              smc4 doctor
              python -m py_compile /tmp/candidate10-v20/*.py /tmp/candidate10-v20-patch/*.py
              python -m unittest discover -s /tmp/candidate10-v20 -p "test_*.py" -v
              python -m unittest discover -s /tmp/candidate10-v20-patch -p "test_*.py" -v
              python /tmp/candidate10-v20/run_research.py \
                --phase auto \
                --output /workspace/artifacts/candidate-10-v20-2 \
                --data-root /tmp/candidate-10-v20-2-data
            '

      - name: Upload reproducible v20.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-10-v20-2-${{ github.sha }}
          path: artifacts/candidate-10-v20-2
          if-no-files-found: warn
          retention-days: 14
