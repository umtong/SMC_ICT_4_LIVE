name: candidate-easychart-source-snapshot

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - ".github/workflows/candidate-easychart-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-source-${{ github.sha }}
          path: |
            research/candidate-easychart/**
            scripts/**
            pyproject.toml
            uv.lock
          if-no-files-found: error
          retention-days: 7
