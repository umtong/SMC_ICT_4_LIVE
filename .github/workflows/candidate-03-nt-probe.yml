name: candidate-03-nt-probe

on:
  push:
    branches: ["research/candidate-03"]
    paths: [".github/workflows/candidate-03-nt-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare probe
        shell: bash
        run: |
          mkdir -p artifacts/nt-probe
          chmod 0777 artifacts/nt-probe
          cat > artifacts/nt-probe/probe.py <<'PY'
          import importlib
          import inspect
          import traceback
          import nautilus_trader

          def sig(obj):
              try: return str(inspect.signature(obj))
              except Exception as exc: return f"<{type(exc).__name__}: {exc}>"

          print("version", getattr(nautilus_trader, "__version__", "unknown"))
          requests = {
              "nautilus_trader.backtest.node": ["BacktestDataConfig", "BacktestEngineConfig", "BacktestNode", "BacktestRunConfig", "BacktestVenueConfig"],
              "nautilus_trader.config": ["ImportableStrategyConfig", "StrategyConfig"],
              "nautilus_trader.persistence.catalog": ["ParquetDataCatalog"],
              "nautilus_trader.model.data": ["TradeTick", "QuoteTick", "Bar", "CustomData", "DataType", "FundingRateUpdate"],
              "nautilus_trader.model.instruments": ["CryptoPerpetual"],
              "nautilus_trader.model.events": ["OrderFilled", "OrderRejected", "PositionOpened", "PositionClosed"],
              "nautilus_trader.trading.strategy": ["Strategy"],
              "nautilus_trader.execution": ["DefaultFillModel", "OneTickSlippageFillModel"],
          }
          for module_name, names in requests.items():
              print("\nMODULE", module_name)
              try: module = importlib.import_module(module_name)
              except Exception:
                  traceback.print_exc(); continue
              print("discover", [n for n in dir(module) if any(k in n.lower() for k in ("custom", "register", "funding", "datatype", "data_type"))])
              for name in names:
                  obj = getattr(module, name, None)
                  print("OBJECT", name, repr(obj), sig(obj) if obj is not None else "")
                  doc = inspect.getdoc(obj) if obj is not None else None
                  if doc: print(doc[:5000])

          for module_name in ["nautilus_trader.model", "nautilus_trader.serialization", "nautilus_trader.persistence", "nautilus_trader.core.data", "nautilus_trader.common.factories", "nautilus_trader.portfolio"]:
              print("\nDISCOVER", module_name)
              try:
                  module = importlib.import_module(module_name)
                  print([n for n in dir(module) if any(k in n.lower() for k in ("custom", "register", "funding", "account", "transaction"))])
              except Exception: traceback.print_exc()

          from nautilus_trader.persistence.catalog import ParquetDataCatalog
          print("\nCATALOG")
          for name in dir(ParquetDataCatalog):
              if any(k in name.lower() for k in ("write", "query", "custom", "instrument", "trade", "quote", "bar")):
                  print(name, sig(getattr(ParquetDataCatalog, name)))

          from nautilus_trader.trading.strategy import Strategy
          print("\nSTRATEGY")
          for name in dir(Strategy):
              if any(k in name.lower() for k in ("subscribe", "submit", "close", "cancel", "order", "position")):
                  print(name, sig(getattr(Strategy, name)))

          try:
              from nautilus_trader.common.factories import OrderFactory
              print("\nORDER_FACTORY")
              for name in dir(OrderFactory):
                  if not name.startswith("_"): print(name, sig(getattr(OrderFactory, name)))
          except Exception: traceback.print_exc()

          try:
              from nautilus_trader.portfolio import Portfolio
              print("\nPORTFOLIO")
              for name in dir(Portfolio):
                  if any(k in name.lower() for k in ("account", "balance", "equity", "pnl", "position", "margin", "exposure", "net")):
                      print(name, sig(getattr(Portfolio, name)))
          except Exception: traceback.print_exc()
          PY
      - name: Run probe in pinned image
        shell: bash
        run: |
          set +e
          docker pull "$IMAGE" > artifacts/nt-probe/docker-pull.txt 2>&1
          pull_status=$?
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            bash -c 'smc4 doctor; python artifacts/nt-probe/probe.py' \
            > artifacts/nt-probe/api.txt 2>&1
          probe_status=$?
          printf 'pull_status=%s\nprobe_status=%s\n' "$pull_status" "$probe_status" > artifacts/nt-probe/status.txt
          cat artifacts/nt-probe/api.txt
          exit 0
      - name: Preserve probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-03-nt-probe-${{ github.sha }}
          path: artifacts/nt-probe
          if-no-files-found: error
          retention-days: 1
