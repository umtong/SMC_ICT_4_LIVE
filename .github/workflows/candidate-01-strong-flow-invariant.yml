name: candidate-01-strong-flow-invariant

on:
  push:
    branches: ["research/candidate-01"]
    paths:
      - ".github/workflows/candidate-01-strong-flow-invariant.yml"
      - "research/candidate-01/flow_regime_diagnostics.py"
      - "research/candidate-01/portfolio_probe.py"
      - "research/candidate-01/core.py"
      - "research/candidate-01/data.py"
      - "research/candidate-01/config.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  RESEARCH_IMAGE: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-01-flow-regime
          key: candidate-01-flow-regime-data-${{ runner.os }}-v1
      - name: Reproduce causal flow-regime trades
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=/workspace/src \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RESEARCH_IMAGE" \
            bash -lc '
              export PATH=/opt/smc4/.venv/bin:$PATH
              smc4 doctor
              rm -rf artifacts/candidate-01-strong-flow-invariant
              python research/candidate-01/flow_regime_diagnostics.py \
                --cache .cache/candidate-01-flow-regime \
                --output artifacts/candidate-01-strong-flow-invariant
              python - <<"PY"
              import json
              from pathlib import Path
              import pandas as pd

              root = Path("artifacts/candidate-01-strong-flow-invariant")
              frame = pd.read_csv(root / "combined_trades_with_flow_regime.csv")
              frame["trade_direction_displacement_flow_z"] = pd.to_numeric(
                  frame["trade_direction_displacement_flow_z"], errors="raise"
              )
              frame["realized_r"] = pd.to_numeric(frame["realized_r"], errors="raise")
              development = frame.loc[frame["role"] == "development"].copy()
              selected = development.loc[
                  development["trade_direction_displacement_flow_z"] >= 1.70
              ].copy()
              stops = selected.loc[selected["exit_reason"] == "STOP"].copy()
              violations = stops.loc[(stops["realized_r"] + 1.0).abs() > 1e-9].copy()
              non_stop_extremes = selected.loc[
                  (selected["exit_reason"] != "STOP")
                  & (selected["realized_r"] < -1.0)
              ].copy()
              summary = {
                  "selected_trades": int(len(selected)),
                  "sum_r": float(selected["realized_r"].sum()),
                  "stop_trades": int(len(stops)),
                  "minimum_stop_r": float(stops["realized_r"].min()) if len(stops) else None,
                  "maximum_stop_r": float(stops["realized_r"].max()) if len(stops) else None,
                  "stop_r_invariant_violations": int(len(violations)),
                  "non_stop_losses_below_minus_one_r": int(len(non_stop_extremes)),
                  "non_stop_extreme_rows": non_stop_extremes[
                      [
                          "scenario_id",
                          "entry_dt",
                          "side",
                          "exit_reason",
                          "entry",
                          "stop",
                          "target",
                          "bars_held",
                          "realized_r",
                          "minimum_mark_r",
                          "maximum_mark_r",
                      ]
                  ].to_dict(orient="records"),
              }
              evidence = root / "strong_flow_invariant_summary.json"
              evidence.write_text(
                  json.dumps(summary, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              if len(violations):
                  violations.to_csv(root / "stop_r_violations.csv", index=False)
                  raise SystemExit("structural stop R invariant violated")
              print(json.dumps(summary, indent=2, sort_keys=True))
              PY
            '
      - name: Persist invariant evidence
        run: |
          set -euo pipefail
          mkdir -p research/candidate-01/evidence/strong-flow-invariant
          cp \
            artifacts/candidate-01-strong-flow-invariant/strong_flow_invariant_summary.json \
            research/candidate-01/evidence/strong-flow-invariant/summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/candidate-01/evidence/strong-flow-invariant/summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["source_commit"] = "${{ github.sha }}"
          payload["workflow_run_id"] = "${{ github.run_id }}"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidate-01/evidence/strong-flow-invariant/summary.json
          git commit -m "evidence(candidate-01): strong-flow R invariant"
          git push origin HEAD:research/candidate-01
