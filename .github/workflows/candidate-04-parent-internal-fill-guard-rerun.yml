name: candidate-04-parent-internal-fill-guard-rerun

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-parent-internal-fill-guard-rerun.yml"
      - "research/candidate-04/nt_rich_signal_strategy.py"
      - "research/candidate-04/tests/test_nt_rich_signal_strategy.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the exact frozen low-activity signals
        uses: actions/download-artifact@v4
        with:
          name: candidate-04-parent-internal-low_activity-b09fdab5b87bf1486c6dd16d475a34fa9f4a2dda
          path: artifacts/candidate-04-parent-internal-fill-guard/source
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31092222507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify implementation-only fill guard
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python -m compileall -q \
            research/candidate-04/nt_rich_signal_strategy.py \
            research/candidate-04/nt_backtest_v22_rich_router.py
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_rich_signal_strategy.py' -v
          python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_nt_causal_risk_sizing.py' -v
          test -s artifacts/candidate-04-parent-internal-fill-guard/source/signals/signals.json

      - name: Replay identical signals and dates through NautilusTrader
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/candidate-04-parent-internal-fill-guard"
          C04_SIGNALS_PATH="$GITHUB_WORKSPACE/$root/source/signals/signals.json" \
          python research/candidate-04/nt_backtest_v22_rich_router.py \
            --config research/candidate-04/nt_liquidity_config.json \
            --build-start "2023-08-02" \
            --build-end "2023-08-10" \
            --evaluation-start "2023-08-04" \
            --evaluation-end "2023-08-10" \
            --cache ".cache/candidate-04-parent-internal-fill-guard" \
            --output "$root/nautilus" \
            | tee "$root/nautilus_console.json"
          test -s "$root/nautilus/metrics.json"
          test -e "$root/nautilus/positions.csv"
          test -s "$root/nautilus/strategy_events.json"

      - name: Verify risk and guard activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("artifacts/candidate-04-parent-internal-fill-guard")
          metrics = json.loads((root / "nautilus/metrics.json").read_text())
          events = json.loads((root / "nautilus/strategy_events.json").read_text())
          try:
              positions = pd.read_csv(root / "nautilus/positions.csv")
          except EmptyDataError:
              positions = pd.DataFrame()
          entries = [event for event in events if event.get("event_type") == "ENTRY_SUBMITTED"]
          invalid_fills = [
              event
              for event in events
              if event.get("event_type") == "ENTRY_FILLED_OUTSIDE_CAUSAL_BRACKET"
          ]
          valid_fills = [
              event
              for event in events
              if event.get("event_type") == "ENTRY_FILL_GEOMETRY_VALID"
          ]
          if len(entries) != len(positions.index):
              raise SystemExit(
                  f"entry/position mismatch entries={len(entries)} positions={len(positions.index)}"
              )
          losses = []
          for position, entry in zip(positions.to_dict("records"), entries):
              pnl = float(str(position["realized_pnl"]).split()[0].replace("_", ""))
              if pnl < 0.0:
                  losses.append(abs(pnl) / float(entry["details"]["equity"]))
          maximum = max(losses, default=0.0)
          summary = {
              "candidate": "candidate-04-parent-internal-liquidation-resumption-v1",
              "implementation_change": (
                  "immediate flatten when actual entry fill is not between the "
                  "unchanged causal stop and target"
              ),
              "signals_unchanged": True,
              "dates_unchanged": True,
              "invalid_fill_guards": len(invalid_fills),
              "valid_fill_guards": len(valid_fills),
              "trades": metrics.get("trades"),
              "wins": metrics.get("wins"),
              "total_return": metrics.get("total_return"),
              "geometric_daily_growth": metrics.get("geometric_daily_growth"),
              "active_days": metrics.get("active_days"),
              "max_drawdown": metrics.get("max_drawdown"),
              "maximum_realized_loss_fraction": maximum,
              "risk_pass": maximum <= 0.0301,
              "scenario_metrics": metrics.get("scenario_metrics"),
              "gate_pass": metrics.get("gate_pass"),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not invalid_fills:
              raise SystemExit("expected invalid fill guard was not exercised")
          if not summary["risk_pass"]:
              raise SystemExit("realized loss exceeded 3% NAV contract after guard")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-04-parent-internal-fill-guard-${{ github.sha }}
          path: artifacts/candidate-04-parent-internal-fill-guard
          if-no-files-found: error
          retention-days: 90
