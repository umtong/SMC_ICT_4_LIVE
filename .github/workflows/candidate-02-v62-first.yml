name: candidate-02-v62-nautilustrader-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v62_*.py"
      - "research/candidate-02/v62_*.json"
      - ".candidate-02-v61/collect_first_week.py"
      - ".github/workflows/candidate-02-v62-first.yml"

permissions:
  contents: read
  actions: read

jobs:
  first-week-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - name: Checkout locked candidate
        uses: actions/checkout@v4

      - name: Download immutable historical feature matrix
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v61-first-week
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Remove unrelated raw bars
        run: rm -rf inputs/v61-first-week/.cache

      - name: Verify fixed runtime and prospective v62 lock
        run: |
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v62_nt_core.py \
            research/candidate-02/v62_nt_backtest.py \
            .candidate-02-v61/collect_first_week.py
          python -m json.tool research/candidate-02/v62_variable_pullback_lock.json >/dev/null
          python -m json.tool research/candidate-02/v62_first_week_config.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("research/candidate-02/v62_variable_pullback_lock.json").read_text())
          config = json.loads(Path("research/candidate-02/v62_first_week_config.json").read_text())
          assert lock["custom_backtest_engine"] is False
          assert lock["status"] == "LOCKED_BEFORE_NAUTILUSTRADER_PERFORMANCE_RUN"
          assert config["validation"]["first_week_start"] == "2025-01-13"
          assert float(config["risk"]["risk_fraction"]) == 0.03
          assert config["risk"]["maximum_notional_cap"] is None
          assert config["risk"]["score_risk_multiplier"] is None
          assert config["scenario"]["minimum_pullback_bars_5m"] == 2
          assert config["scenario"]["maximum_pullback_bars_5m"] == 6
          assert config["scenario"]["pullback_selection"] == "DEEPEST_VALID"
          PY

      - name: Collect only the locked first BTC week
        run: python .candidate-02-v61/collect_first_week.py

      - name: Run v62 through NautilusTrader
        shell: bash
        run: |
          mkdir -p artifacts/candidate-02-v62-first-week
          set +e
          python research/candidate-02/v62_nt_backtest.py \
            --config research/candidate-02/v62_first_week_config.json \
            --input-root inputs/v61-first-week \
            --output artifacts/candidate-02-v62-first-week \
            | tee artifacts-v62-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v62-first-week/validation_exit_code.txt
          if [[ "$status" != "0" && "$status" != "2" ]]; then exit "$status"; fi

      - name: Publish first-week decision
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/candidate-02-v62-first-week/metrics.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/candidate-02-v62-first-week/metrics.json").read_text())
          print("# Candidate-02 v62 variable-duration trend pullback")
          print(f"- Decision: **{m['decision']}**")
          print(f"- Signals/trades: **{m['scheduled_signals']}/{m['trades']}**")
          print(f"- Trades/day: **{m['trades_per_day']:.3f}**")
          print(f"- Win rate: **{m['win_rate']:.2%}**")
          print(f"- Cost-after PF: **{m['profit_factor_after_cost']:.3f}**")
          print(f"- Growth/day: **{m['geometric_daily_growth_after_cost']:.3%}**")
          print(f"- MDD: **{m['maximum_mark_to_market_drawdown']:.2%}**")
          PY
          fi

      - name: Preserve NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v62-first-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v62-first-week
            artifacts-v62-console.log
            inputs/v61-first-week/artifacts/candidate-02-v61-first-week-data
          if-no-files-found: warn
          retention-days: 30
