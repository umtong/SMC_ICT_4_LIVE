name: candidate-02-v78-nautilustrader-third-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - ".github/workflows/candidate-02-v78-week3.yml"
      - "research/candidate-02/v78_week3_lock.json"

permissions:
  contents: write
  actions: read

jobs:
  week3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Gate
        id: gate
        shell: bash
        run: |
          if [[ -f research/candidate-02/v78_week3_lock.json ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify lock and runtime
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          smc4 doctor
          python -m py_compile research/candidate-02/v78_impact_resilience_core.py research/candidate-02/v78_nt_backtest.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v78_week3_lock.json').read_text()); cfg=Path('research/candidate-02/v78_selected_config.json').read_bytes()
          assert lock['status']=='LOCKED_BEFORE_THIRD_WEEK_COLLECTION'
          assert lock['custom_backtest_engine'] is False and float(lock['risk_fraction'])==0.03
          assert hashlib.sha256(cfg).hexdigest()==lock['selected_config_sha256']
          PY
      - name: Build direct features for locked week
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v78-w3-tools; cp -a .candidate-02-v75 /tmp/v78-w3-tools
          python - <<'PY'
          from datetime import date
          import json,re
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v78_week3_lock.json').read_text()); new=date.fromisoformat(lock['third_week']['start_utc'][:10]); old=[]
          for p in Path('research/candidate-02').glob('v75_*_config.json'):
              try:
                  t=json.loads(p.read_text()).get('validation',{}).get('first_week_start')
                  if t:old.append(date.fromisoformat(t[:10]))
              except Exception:pass
          if not old:
              for p in Path('/tmp/v78-w3-tools').rglob('*.py'):
                  old.extend(date.fromisoformat(x) for x in re.findall(r'20\d{2}-\d{2}-\d{2}',p.read_text(errors='ignore')) if date.fromisoformat(x).weekday()==0)
          base=min(old,key=lambda d:abs((d-new).days)); delta=new-base; pat=re.compile(r'20\d{2}-\d{2}-\d{2}')
          for p in Path('/tmp/v78-w3-tools').rglob('*'):
              if p.is_file() and p.suffix in {'.py','.json','.md'}:
                  s=p.read_text(encoding='utf-8',errors='ignore'); s=pat.sub(lambda m:(date.fromisoformat(m.group(0))+delta).isoformat(),s); s=s.replace('v75-first-week','v78-week3').replace('candidate-02-v75-first-week','candidate-02-v78-week3'); p.write_text(s,encoding='utf-8')
          PY
          collect=$(find /tmp/v78-w3-tools -maxdepth 1 -type f -name 'collect*.py' | sort | head -n1); build=$(find /tmp/v78-w3-tools -maxdepth 1 -type f -name 'build*.py' | sort | head -n1); python "$collect"; python "$build"
          mkdir -p inputs/v78-week3/candidate-02-v48-first-week
          feature=$(find . /tmp -type f -name '*.npz' -newermt '15 minutes ago' | sort | tail -n1); columns=$(find . /tmp -type f -name 'columns.json' -newermt '15 minutes ago' | sort | tail -n1); test -n "$feature"; test -n "$columns"; cp "$feature" inputs/v78-week3/candidate-02-v48-first-week/v48_features.npz; cp "$columns" inputs/v78-week3/candidate-02-v48-first-week/columns.json
      - name: Collect execution bars
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          from datetime import date,timedelta
          import json,urllib.request
          from pathlib import Path
          lock=json.loads(Path('research/candidate-02/v78_week3_lock.json').read_text()); start=date.fromisoformat(lock['third_week']['start_utc'][:10])-timedelta(days=2); end=date.fromisoformat(lock['third_week']['end_utc'][:10])+timedelta(days=1); root=Path('inputs/v78-week3/.cache/candidate-02/v78-week3/binance_1m'); root.mkdir(parents=True,exist_ok=True); d=start
          while d<=end:
              n=f'BTCUSDT-1m-{d.isoformat()}.zip'; p=root/n
              if not p.exists():
                  with urllib.request.urlopen(f'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1m/{n}',timeout=60) as r:p.write_bytes(r.read())
              d+=timedelta(days=1)
          PY
      - name: Run unchanged rule through NautilusTrader
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('research/candidate-02/v78_selected_config.json').read_text()); lock=json.loads(Path('research/candidate-02/v78_week3_lock.json').read_text()); cfg['candidate']=str(cfg['candidate'])+'-locked-week3'; cfg['validation']['first_week_start']=lock['third_week']['start_utc'][:10]; Path('/tmp/v78-w3.json').write_text(json.dumps(cfg,indent=2,sort_keys=True))
          PY
          mkdir -p artifacts/candidate-02-v78-week3; set +e
          python research/candidate-02/v78_nt_backtest.py --config /tmp/v78-w3.json --input-root inputs/v78-week3 --output artifacts/candidate-02-v78-week3 | tee artifacts-v78-week3.log
          status=${PIPESTATUS[0]}; set -e; echo "$status" > artifacts/candidate-02-v78-week3/validation_exit_code.txt; if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
      - name: Record result and optional long lock
        if: steps.gate.outputs.enabled == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime,timezone
          import hashlib,json
          from pathlib import Path
          root=Path('research/candidate-02'); p=Path('artifacts/candidate-02-v78-week3/metrics.json'); lock=json.loads((root/'v78_week3_lock.json').read_text())
          if not p.exists():decision={'status':'IMPLEMENTATION_ERROR','lock':lock}
          else:
              m=json.loads(p.read_text()); checks={'trades_per_day':float(m.get('trades_per_day',0))>=0.75,'win_rate':float(m.get('win_rate',0))>=0.50,'profit_factor':float(m.get('profit_factor_after_cost',0))>=1.50,'growth':float(m.get('geometric_daily_growth_after_cost',-1))>=0.01,'drawdown':abs(float(m.get('maximum_mark_to_market_drawdown',-1)))<=0.25,'risk':abs(float(m.get('risk_fraction',0))-0.03)<=1e-12,'engine':str(m.get('engine','')).startswith('NautilusTrader'),'no_custom_engine':m.get('custom_backtest_engine') is False}; passed=all(checks.values()); decision={'status':'PASSED_LOCKED_THIRD_WEEK' if passed else 'REJECTED_LOCKED_THIRD_WEEK','recorded_utc':datetime.now(timezone.utc).isoformat(),'checks':checks,'metrics':m,'lock':lock}
              if passed:
                  cfg=(root/'v78_selected_config.json').read_bytes(); long_lock={'status':'LOCKED_BEFORE_LONG_EVALUATION_WINDOW_SELECTION','candidate_family':lock['candidate_family'],'selected_config_sha256':hashlib.sha256(cfg).hexdigest(),'risk_fraction':0.03,'custom_backtest_engine':False,'performance_engine':'NautilusTrader 1.230.0'}; (root/'v78_long_lock.json').write_text(json.dumps(long_lock,indent=2,sort_keys=True))
          (root/'v78_week3_decision.json').write_text(json.dumps(decision,indent=2,sort_keys=True))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add research/candidate-02/v78_week3_decision.json; if [[ -f research/candidate-02/v78_long_lock.json ]]; then git add research/candidate-02/v78_long_lock.json; fi; git commit -m "research(candidate-02): record v78 third week"; git push origin HEAD:research/candidate-02
      - name: Evidence
        if: steps.gate.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v78-third-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v78-week3
            artifacts-v78-week3.log
            inputs/v78-week3
          if-no-files-found: warn
          retention-days: 30
