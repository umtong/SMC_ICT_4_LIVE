name: Candidate 09 v3 multi-horizon cascade gate

on:
  push:
    branches: [research/candidate-09]
    paths: [.github/workflows/candidate-09-v3-gate.yml]

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-09-v3-gate
  cancel-in-progress: false

jobs:
  activate-test-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      SMC4_PREBUILT_ENV: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SMC4_DATA_ROOT: .cache/candidate-09
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .cache/candidate-09
          key: candidate-09-binance-vision-v1

      - name: Archive v2 and activate structurally distinct v3
        shell: bash
        env:
          ENGINE_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          set -euo pipefail
          root=research/candidate-09
          archive="$root/archive/v2"
          mkdir -p "$archive/evidence"
          if [[ ! -f "$archive/README.md" ]]; then
            cp "$root/state_engine.py" "$archive/state_engine.py"
            cp "$root/config.json" "$archive/config.json"
            for name in summary.json REPORT.md outcomes.csv trades.csv fills.csv events.jsonl run.json data_manifest.json; do
              [[ -f "$root/evidence/latest/$name" ]] && cp "$root/evidence/latest/$name" "$archive/evidence/$name"
            done
            cat > "$archive/README.md" <<'EOF'
          # Candidate 09 v2 — complete candidate failed; continuation mechanism preserved

          Reproducible final v2 result commit: `943c0bc202c36f233e7dbfd1783ff02362586e14`.

          V2 replaced one-minute local pivots with completed four-hour auction ranges and achieved clean Nautilus execution/accounting on the same three frozen BTC weeks. It materially improved v1 but did not meet the project gate:

          - pooled daily geometric return: **-0.173236%**
          - pooled NAV multiple: **0.964244x**
          - trades: **5**
          - maximum segment drawdown: **3.000172%**
          - week returns: **+1.8637%, -2.4120%, -3.0002%**

          The complete candidate was rejected because opportunity rate was insufficient and results did not transfer across weeks. The single-variable ablations showed:

          - removing acceptance produced **-1.268523% daily** and a **0.764836x** NAV multiple, so outside acceptance is essential;
          - removing MSS produced 25 trades and **-0.082586% daily**, improving frequency but concentrating 19 trades and +9.35% in week-a while weeks b/c remained negative;
          - removing flow produced the same sparse baseline outcome in this sample, so flow was not the bottleneck.

          Valid component: the baseline continuation branch earned approximately **+2,013.72 USDT net across two trades**, while baseline reversal trades lost approximately **-5,562.18 USDT net**. V3 therefore preserves strict acceptance/retest continuation, removes reversal, and increases logically distinct opportunities through completed 60m/240m/1440m auction extremes rather than loosening acceptance.
          EOF
          fi

          printf '%s' "$ENGINE_GZ_B64" | base64 -d | gzip -dc > "$root/state_engine_v3.py"
          cp "$root/state_engine_v3.py" "$root/state_engine.py"
          cp "$root/config_v3.json" "$root/config.json"
          mkdir -p "$root/tests_v3"
          printf '%s' "$TEST_GZ_B64" | base64 -d | gzip -dc > "$root/tests_v3/test_state_engine.py"
          sed -i 's/from state_engine_v3 import/from state_engine import/' "$root/tests_v3/test_state_engine.py"
          cp "$root/tests_v3/test_state_engine.py" "$root/tests/test_state_engine.py"

          python - <<'PY'
          from pathlib import Path
          path = Path('research/candidate-09/run.py')
          text = path.read_text(encoding='utf-8')
          old = '''ABLATIONS = (\n    "baseline",\n    "no-flow",\n    "no-mss-confirmation",\n    "no-acceptance-confirmation",\n)\n'''
          new = '''ABLATIONS = (\n    "baseline",\n    "no-flow",\n    "no-acceptance-confirmation",\n    "no-retest-confirmation",\n)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('expected v2 ablation tuple not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run doctor, v3 tests, and unchanged frozen-week gate
        shell: bash
        run: |
          set +e
          root=research/candidate-09
          out="$root/evidence/latest"
          diag="$root/diagnostics/v3-gate"
          rm -rf "$out" "$diag"
          mkdir -p "$out" "$diag"
          smc4 doctor > "$diag/doctor.log" 2>&1; doctor=$?
          python -m compileall -q "$root" > "$diag/compile.log" 2>&1; compile=$?
          python -m unittest discover -s "$root/tests" -p 'test_*.py' -v > "$diag/tests.log" 2>&1; tests=$?
          gate=99
          if [[ $doctor == 0 && $compile == 0 && $tests == 0 ]]; then
            python "$root/run.py" gate --config "$root/config.json" --cache "$SMC4_DATA_ROOT" --output "$out" > "$diag/gate.log" 2>&1
            gate=$?
          else
            echo 'gate not run because prerequisite failed' > "$diag/gate.log"
          fi
          DOCTOR=$doctor COMPILE=$compile TESTS=$tests GATE=$gate python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('research/candidate-09'); diag=root/'diagnostics/v3-gate'; out=root/'evidence/latest'
          codes={k.lower():int(os.environ[k]) for k in ('DOCTOR','COMPILE','TESTS','GATE')}
          failure=next((k for k,v in codes.items() if v),None)
          (diag/'diagnostic.json').write_text(json.dumps({
              'candidate_generation':'v3-multi-horizon-accepted-liquidity-cascade',
              'classification':'IMPLEMENTATION_ERROR' if failure else 'EXECUTED',
              'codes':codes,'first_failure':failure,
              'fixed_weeks_preserved':True,'parameter_search_performed':False,
              'structural_change':'continuation-only; completed 60m/240m/1440m auction levels; strict acceptance and defended retest',
              'run_id':os.environ.get('GITHUB_RUN_ID'),'trigger_sha':os.environ.get('GITHUB_SHA')
          },indent=2,sort_keys=True)+'\n')
          if not (out/'summary.json').exists():
              (out/'summary.json').write_text(json.dumps({'candidate':'candidate-09-v3','status':'IMPLEMENTATION_ERROR','first_failure':failure,'codes':codes},indent=2,sort_keys=True)+'\n')
          for p in diag.glob('*.log'):
              lines=p.read_text(errors='replace').splitlines(); p.write_text('\n'.join(lines[-1200:])+('\n' if lines else ''))
          PY
          exit 0

      - name: Preserve exact v3 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-09-v3-gate-${{ github.run_id }}
          path: |
            research/candidate-09/evidence/latest
            research/candidate-09/diagnostics/v3-gate
            research/candidate-09/archive/v2
            research/candidate-09/config.json
            research/candidate-09/state_engine.py
            research/candidate-09/nautilus_strategy.py
            research/candidate-09/run.py
            research/candidate-09/tests
          if-no-files-found: error
          retention-days: 30

      - name: Commit v3 source, archive, and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repo=$(dirname "$(dirname "$(dirname "$(realpath research/candidate-09/run.py)")")")
          git config --global --add safe.directory "$repo"
          git -C "$repo" config user.name candidate-09-research-bot
          git -C "$repo" config user.email candidate-09-research-bot@users.noreply.github.com
          git -C "$repo" add -A research/candidate-09
          if git -C "$repo" diff --cached --quiet; then exit 0; fi
          status=$(python -c "import json;print(json.load(open('research/candidate-09/evidence/latest/summary.json')).get('status','UNKNOWN'))")
          git -C "$repo" commit -m "candidate-09 v3: frozen gate result ${status}"
          git -C "$repo" pull --rebase origin "${GITHUB_REF_NAME}"
          git -C "$repo" push origin "HEAD:${GITHUB_REF_NAME}"
