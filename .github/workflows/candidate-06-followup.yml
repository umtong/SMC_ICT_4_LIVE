name: Candidate 06 Conditional Follow-up

on:
  push:
    branches:
      - research/candidate-06
    paths:
      - "artifacts/candidate-06/campaign/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-06-followup
  cancel-in-progress: true

jobs:
  follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
    steps:
      - name: Checkout candidate and committed campaign evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed environment and follow-up state logic
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile research/candidate-06/*.py
          python research/candidate-06/test_session_equilibrium_engine.py

      - name: Continue from committed campaign decision
        id: followup
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf artifacts/candidate-06/followup
          python research/candidate-06/run_followup.py \
            --output artifacts/candidate-06/followup
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guarantee terminal follow-up evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/candidate-06/followup
          printf '%s\n' '${{ steps.followup.outputs.exit_code }}' > artifacts/candidate-06/followup/workflow_exit_code.txt
          if [ ! -f artifacts/candidate-06/followup/FOLLOWUP.md ]; then
            printf '%s\n' '# Candidate 06 follow-up failed before report generation' > artifacts/candidate-06/followup/FOLLOWUP.md
          fi

      - name: Commit follow-up evidence
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "candidate-06-research-bot"
          git config user.email "candidate-06-research-bot@users.noreply.github.com"
          git add -f artifacts/candidate-06/followup
          if [ -f research/candidate-06/config.equilibrium.locked.json ]; then
            git add -f research/candidate-06/config.equilibrium.locked.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record candidate-06 follow-up evidence [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin research/candidate-06 && git push origin HEAD:research/candidate-06; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload follow-up evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-06-followup
          path: |
            artifacts/candidate-06/followup
            research/candidate-06/config.equilibrium.locked.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete-candidate decision
        if: always()
        shell: bash
        run: |
          code='${{ steps.followup.outputs.exit_code }}'
          if [ -z "$code" ]; then exit 1; fi
          exit "$code"
