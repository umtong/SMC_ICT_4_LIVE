name: candidate-08-acceptance-sequence-revision

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - ".github/workflows/candidate-08-acceptance-revision.yml"

permissions:
  contents: write
  packages: read

jobs:
  revise:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one controlled acceptance-sequence revision
        shell: bash
        run: |
          set -euo pipefail
          smc4 doctor
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("research/candidate-08")

          # Fixed, economically motivated sequence parameters. These are not fitted
          # to a return target: the retest must contract by at least 25%, and a later
          # bar must independently displace beyond the retest.
          config_path = root / "config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          logic_cfg = config["logic"]
          logic_cfg.update(
              {
                  "minimum_pool_visibility_bars": 30,
                  "acceptance_retest_volume_fraction": 0.75,
                  "acceptance_follow_through_bars": 3,
                  "acceptance_follow_through_atr": 0.05,
                  "acceptance_follow_through_body_atr": 0.25,
                  "acceptance_follow_through_close_location": 0.65,
              }
          )
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          logic_path = root / "logic.py"
          source = logic_path.read_text(encoding="utf-8")

          old_pending = '''    reference_range: float\n    interaction_time_ns: int\n\n\n@dataclass(frozen=True, slots=True)\nclass TradeSetup:\n'''
          new_pending = '''    reference_range: float\n    interaction_time_ns: int\n    interaction_volume_ratio: float = 1.0\n    pool_age_bars: int = 0\n    pool_touches: int = 1\n    retest_index: int | None = None\n    retest_high: float | None = None\n    retest_low: float | None = None\n    retest_volume_ratio: float | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass TradeSetup:\n'''
          if source.count(old_pending) != 1:
              raise SystemExit("PendingScenario anchor mismatch")
          source = source.replace(old_pending, new_pending)

          old_config = '''    acceptance_retest_bars: int = 10\n    retest_outer_atr: float = 0.22\n'''
          new_config = '''    acceptance_retest_bars: int = 10\n    minimum_pool_visibility_bars: int = 30\n    acceptance_retest_volume_fraction: float = 0.75\n    acceptance_follow_through_bars: int = 3\n    acceptance_follow_through_atr: float = 0.05\n    acceptance_follow_through_body_atr: float = 0.25\n    acceptance_follow_through_close_location: float = 0.65\n    retest_outer_atr: float = 0.22\n'''
          if source.count(old_config) != 1:
              raise SystemExit("LogicConfig anchor mismatch")
          source = source.replace(old_config, new_config)

          old_active = '''            if not pool.consumed and pool.touches >= self.config.minimum_pool_touches\n        ]\n'''
          new_active = '''            if not pool.consumed\n            and pool.touches >= self.config.minimum_pool_touches\n            and (\n                bar.index - pool.pivot_index >= self.config.minimum_pool_visibility_bars\n                or pool.touches >= 2\n            )\n        ]\n'''
          if source.count(old_active) != 1:
              raise SystemExit("active-pool anchor mismatch")
          source = source.replace(old_active, new_active)

          old_constructor = '''            reference_range=self._reference_range(pool, bar, atr),\n            interaction_time_ns=bar.ts_event_ns,\n        )\n'''
          new_constructor = '''            reference_range=self._reference_range(pool, bar, atr),\n            interaction_time_ns=bar.ts_event_ns,\n            interaction_volume_ratio=volume_ratio,\n            pool_age_bars=bar.index - pool.pivot_index,\n            pool_touches=pool.touches,\n        )\n'''
          if source.count(old_constructor) != 1:
              raise SystemExit("PendingScenario constructor anchor mismatch")
          source = source.replace(old_constructor, new_constructor)

          old_arm_details = '''                "range_atr": range_atr,\n                "expiry_index": expiry,\n'''
          new_arm_details = '''                "range_atr": range_atr,\n                "interaction_volume_ratio": volume_ratio,\n                "pool_age_bars": bar.index - pool.pivot_index,\n                "pool_touches": pool.touches,\n                "expiry_index": expiry,\n'''
          if source.count(old_arm_details) != 1:
              raise SystemExit("armed-event details anchor mismatch")
          source = source.replace(old_arm_details, new_arm_details)

          old_advance = '''        volume_ratio = bar.volume / max(volume_median, 1e-12)\n        if pending.family is ScenarioFamily.REJECTION:\n            if pending.direction is Direction.LONG:\n                invalid = bar.close < pending.extreme - self.config.stop_buffer_atr * atr\n                confirmed = (\n                    bar.close >= pending.confirmation_level + self.config.rejection_confirmation_atr * atr\n                    and bar.close > bar.open\n                    and bar.close_location >= 0.58\n                )\n            else:\n                invalid = bar.close > pending.extreme + self.config.stop_buffer_atr * atr\n                confirmed = (\n                    bar.close <= pending.confirmation_level - self.config.rejection_confirmation_atr * atr\n                    and bar.close < bar.open\n                    and bar.close_location <= 0.42\n                )\n        else:\n            if pending.direction is Direction.LONG:\n                invalid = bar.close < pending.pool_level - self.config.retest_inner_atr * atr\n                touched = bar.low <= pending.pool_level + self.config.retest_outer_atr * atr\n                held = bar.close >= pending.pool_level + self.config.retest_close_atr * atr\n                confirmed = touched and held and bar.close_location >= 0.55\n                pending.extreme = min(pending.extreme, bar.low)\n            else:\n                invalid = bar.close > pending.pool_level + self.config.retest_inner_atr * atr\n                touched = bar.high >= pending.pool_level - self.config.retest_outer_atr * atr\n                held = bar.close <= pending.pool_level - self.config.retest_close_atr * atr\n                confirmed = touched and held and bar.close_location <= 0.45\n                pending.extreme = max(pending.extreme, bar.high)\n\n        if invalid:\n            self.clear_pending("STRUCTURE_INVALIDATED_BEFORE_ENTRY", bar)\n            return None\n        if not confirmed or not trading_available:\n            return None\n'''
          new_advance = '''        volume_ratio = bar.volume / max(volume_median, 1e-12)\n        if pending.family is ScenarioFamily.REJECTION:\n            if pending.direction is Direction.LONG:\n                invalid = bar.close < pending.extreme - self.config.stop_buffer_atr * atr\n                confirmed = (\n                    bar.close >= pending.confirmation_level + self.config.rejection_confirmation_atr * atr\n                    and bar.close > bar.open\n                    and bar.close_location >= 0.58\n                )\n            else:\n                invalid = bar.close > pending.extreme + self.config.stop_buffer_atr * atr\n                confirmed = (\n                    bar.close <= pending.confirmation_level - self.config.rejection_confirmation_atr * atr\n                    and bar.close < bar.open\n                    and bar.close_location <= 0.42\n                )\n        else:\n            if pending.direction is Direction.LONG:\n                invalid = bar.close < pending.pool_level - self.config.retest_inner_atr * atr\n            else:\n                invalid = bar.close > pending.pool_level + self.config.retest_inner_atr * atr\n\n            if invalid:\n                confirmed = False\n            elif pending.retest_index is None:\n                if pending.direction is Direction.LONG:\n                    touched = bar.low <= pending.pool_level + self.config.retest_outer_atr * atr\n                    held = (\n                        bar.close >= pending.pool_level + self.config.retest_close_atr * atr\n                        and bar.close_location >= 0.55\n                    )\n                    if touched:\n                        pending.extreme = min(pending.extreme, bar.low)\n                else:\n                    touched = bar.high >= pending.pool_level - self.config.retest_outer_atr * atr\n                    held = (\n                        bar.close <= pending.pool_level - self.config.retest_close_atr * atr\n                        and bar.close_location <= 0.45\n                    )\n                    if touched:\n                        pending.extreme = max(pending.extreme, bar.high)\n                confirmed = False\n                if touched and held:\n                    contraction_limit = (\n                        pending.interaction_volume_ratio\n                        * self.config.acceptance_retest_volume_fraction\n                    )\n                    if volume_ratio > contraction_limit:\n                        self.clear_pending("ACCEPTANCE_RETEST_NOT_CONTRACTED", bar)\n                        return None\n                    pending.retest_index = bar.index\n                    pending.retest_high = bar.high\n                    pending.retest_low = bar.low\n                    pending.retest_volume_ratio = volume_ratio\n                    pending.expiry_index = (\n                        bar.index + self.config.acceptance_follow_through_bars\n                    )\n                    self._emit(\n                        scenario_id=pending.scenario_id,\n                        event_type="ACCEPTANCE_RETEST_HELD",\n                        event_time_ns=bar.ts_event_ns,\n                        observed_time_ns=bar.ts_event_ns,\n                        previous_state="ARMED",\n                        next_state="RETEST_HELD",\n                        reason_code=f"LOW_ENERGY_RETEST_{pending.direction.value}",\n                        reference_price=bar.close,\n                        details={\n                            "interaction_volume_ratio": pending.interaction_volume_ratio,\n                            "retest_volume_ratio": volume_ratio,\n                            "contraction_fraction": (\n                                volume_ratio / max(pending.interaction_volume_ratio, 1e-12)\n                            ),\n                            "follow_through_expiry_index": pending.expiry_index,\n                        },\n                    )\n                    return None\n            elif pending.direction is Direction.LONG:\n                assert pending.retest_high is not None\n                assert pending.retest_volume_ratio is not None\n                confirmed = (\n                    bar.close\n                    >= pending.retest_high + self.config.acceptance_follow_through_atr * atr\n                    and bar.close > bar.open\n                    and bar.body >= self.config.acceptance_follow_through_body_atr * atr\n                    and bar.close_location\n                    >= self.config.acceptance_follow_through_close_location\n                    and volume_ratio >= pending.retest_volume_ratio\n                )\n            else:\n                assert pending.retest_low is not None\n                assert pending.retest_volume_ratio is not None\n                confirmed = (\n                    bar.close\n                    <= pending.retest_low - self.config.acceptance_follow_through_atr * atr\n                    and bar.close < bar.open\n                    and bar.body >= self.config.acceptance_follow_through_body_atr * atr\n                    and bar.close_location\n                    <= 1.0 - self.config.acceptance_follow_through_close_location\n                    and volume_ratio >= pending.retest_volume_ratio\n                )\n\n        if invalid:\n            self.clear_pending("STRUCTURE_INVALIDATED_BEFORE_ENTRY", bar)\n            return None\n        if not confirmed or not trading_available:\n            return None\n'''
          if source.count(old_advance) != 1:
              raise SystemExit("advance-pending block mismatch")
          source = source.replace(old_advance, new_advance)

          old_setup_details = '''                "reference_range": pending.reference_range,\n            },\n'''
          new_setup_details = '''                "reference_range": pending.reference_range,\n                "interaction_volume_ratio": pending.interaction_volume_ratio,\n                "retest_volume_ratio": pending.retest_volume_ratio,\n                "pool_age_bars": pending.pool_age_bars,\n                "pool_touches": pending.pool_touches,\n                "retest_index": pending.retest_index,\n            },\n'''
          if source.count(old_setup_details) != 1:
              raise SystemExit("setup details anchor mismatch")
          source = source.replace(old_setup_details, new_setup_details)
          logic_path.write_text(source, encoding="utf-8")

          # Keep repeated windows in one process but bypass the singleton logger.
          run_path = root / "run.py"
          run_source = run_path.read_text(encoding="utf-8")
          old_logging = '            logging=LoggingConfig(log_level="ERROR"),\n'
          new_logging = '            logging=LoggingConfig(log_level="ERROR", bypass_logging=True),\n'
          if run_source.count(old_logging) != 1:
              raise SystemExit("LoggingConfig anchor mismatch")
          run_source = run_source.replace(old_logging, new_logging)
          old_liq_manifest = '''                    "liquidation_enabled": config["venue"]["liquidation_enabled"],\n'''
          new_liq_manifest = '''                    "liquidation_switch_supported_by_runtime": False,\n                    "liquidation_requested_in_research_config": config["venue"][\n                        "liquidation_enabled"\n                    ],\n'''
          if run_source.count(old_liq_manifest) != 1:
              raise SystemExit("liquidation manifest anchor mismatch")
          run_path.write_text(run_source.replace(old_liq_manifest, new_liq_manifest), encoding="utf-8")

          test_path = root / "test_logic.py"
          test_source = test_path.read_text(encoding="utf-8")
          old_test = '''    def test_acceptance_requires_retest_hold_before_trade(self) -> None:\n        cfg = logic.LogicConfig(retest_outer_atr=0.22, retest_inner_atr=0.38, retest_close_atr=0.01)\n        engine = logic.LiquidityBifurcationLogic(cfg)\n        engine.pending = logic.PendingScenario(\n            scenario_id="lsb-test-a",\n            family=logic.ScenarioFamily.ACCEPTANCE,\n            direction=logic.Direction.LONG,\n            pool_id="pool-break",\n            pool_level=100.0,\n            armed_index=5,\n            expiry_index=15,\n            atr=1.0,\n            extreme=99.5,\n            confirmation_level=100.0,\n            reference_range=4.0,\n            interaction_time_ns=5_000,\n        )\n        engine.pools.append(\n            logic.LiquidityPool(\n                pool_id="pool-target",\n                kind=logic.PoolKind.HIGH,\n                level=104.0,\n                pivot_index=2,\n                event_time_ns=2_000,\n                observed_time_ns=3_000,\n            )\n        )\n        no_retest = engine._advance_pending(\n            logic.BarPoint(6, 6_000, 101.0, 101.4, 100.5, 101.2, 100.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNone(no_retest)\n        setup = engine._advance_pending(\n            logic.BarPoint(7, 7_000, 100.5, 100.8, 100.1, 100.6, 100.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNotNone(setup)\n        self.assertEqual(setup.family, logic.ScenarioFamily.ACCEPTANCE)\n        self.assertEqual(setup.direction, logic.Direction.LONG)\n'''
          new_test = '''    def test_acceptance_requires_contracted_retest_then_independent_follow_through(self) -> None:\n        cfg = logic.LogicConfig(\n            retest_outer_atr=0.22,\n            retest_inner_atr=0.38,\n            retest_close_atr=0.01,\n            acceptance_retest_volume_fraction=0.75,\n            acceptance_follow_through_bars=3,\n            acceptance_follow_through_atr=0.05,\n            acceptance_follow_through_body_atr=0.25,\n        )\n        engine = logic.LiquidityBifurcationLogic(cfg)\n        engine.pending = logic.PendingScenario(\n            scenario_id="lsb-test-a",\n            family=logic.ScenarioFamily.ACCEPTANCE,\n            direction=logic.Direction.LONG,\n            pool_id="pool-break",\n            pool_level=100.0,\n            armed_index=5,\n            expiry_index=15,\n            atr=1.0,\n            extreme=99.5,\n            confirmation_level=100.0,\n            reference_range=4.0,\n            interaction_time_ns=5_000,\n            interaction_volume_ratio=2.0,\n            pool_age_bars=60,\n        )\n        engine.pools.append(\n            logic.LiquidityPool(\n                pool_id="pool-target",\n                kind=logic.PoolKind.HIGH,\n                level=104.0,\n                pivot_index=2,\n                event_time_ns=2_000,\n                observed_time_ns=3_000,\n            )\n        )\n        no_retest = engine._advance_pending(\n            logic.BarPoint(6, 6_000, 101.0, 101.4, 100.5, 101.2, 100.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNone(no_retest)\n        held_only = engine._advance_pending(\n            logic.BarPoint(7, 7_000, 100.5, 100.8, 100.1, 100.6, 100.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNone(held_only)\n        self.assertEqual(engine.pending.retest_index, 7)\n        setup = engine._advance_pending(\n            logic.BarPoint(8, 8_000, 100.6, 101.5, 100.5, 101.3, 120.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNotNone(setup)\n        self.assertEqual(setup.family, logic.ScenarioFamily.ACCEPTANCE)\n        self.assertEqual(setup.direction, logic.Direction.LONG)\n\n    def test_acceptance_cancels_noncontracted_retest(self) -> None:\n        engine = logic.LiquidityBifurcationLogic(\n            logic.LogicConfig(acceptance_retest_volume_fraction=0.75)\n        )\n        engine.pending = logic.PendingScenario(\n            scenario_id="lsb-test-hot-retest",\n            family=logic.ScenarioFamily.ACCEPTANCE,\n            direction=logic.Direction.LONG,\n            pool_id="pool-break",\n            pool_level=100.0,\n            armed_index=5,\n            expiry_index=15,\n            atr=1.0,\n            extreme=99.5,\n            confirmation_level=100.0,\n            reference_range=4.0,\n            interaction_time_ns=5_000,\n            interaction_volume_ratio=1.0,\n            pool_age_bars=60,\n        )\n        result = engine._advance_pending(\n            logic.BarPoint(6, 6_000, 100.5, 100.8, 100.1, 100.6, 100.0),\n            atr=1.0,\n            volume_median=100.0,\n            trading_available=True,\n        )\n        self.assertIsNone(result)\n        self.assertIsNone(engine.pending)\n        self.assertEqual(engine.events[-1].reason_code, "ACCEPTANCE_RETEST_NOT_CONTRACTED")\n\n    def test_fresh_single_touch_pool_is_not_external_liquidity(self) -> None:\n        cfg = logic.LogicConfig(\n            minimum_pool_visibility_bars=30,\n            acceptance_close_atr=0.1,\n            acceptance_body_atr=0.5,\n            acceptance_close_location=0.65,\n            acceptance_volume_ratio=0.8,\n        )\n        engine = logic.LiquidityBifurcationLogic(cfg)\n        pool = logic.LiquidityPool(\n            pool_id="pool-fresh",\n            kind=logic.PoolKind.HIGH,\n            level=100.0,\n            pivot_index=9,\n            event_time_ns=9_000,\n            observed_time_ns=10_000,\n        )\n        engine.pools.append(pool)\n        bar = logic.BarPoint(10, 10_000, 99.8, 101.0, 99.7, 100.8, 100.0)\n        engine._detect_new_interaction(bar, 99.8, 1.0, 100.0)\n        self.assertIsNone(engine.pending)\n        pool.touches = 2\n        engine._detect_new_interaction(\n            logic.BarPoint(11, 11_000, 99.8, 101.0, 99.7, 100.8, 100.0),\n            99.8,\n            1.0,\n            100.0,\n        )\n        self.assertIsNotNone(engine.pending)\n'''
          if test_source.count(old_test) != 1:
              raise SystemExit("acceptance test anchor mismatch")
          test_path.write_text(test_source.replace(old_test, new_test), encoding="utf-8")
          PY

          python -m compileall -q research/candidate-08
          python research/candidate-08/test_logic.py -v
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add research/candidate-08/config.json research/candidate-08/logic.py research/candidate-08/run.py research/candidate-08/test_logic.py
          git -C "$GITHUB_WORKSPACE" commit -m "candidate-08: require contraction and continuation after acceptance"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:research/candidate-08
