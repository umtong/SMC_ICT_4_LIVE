name: candidate-easychart-v10-cross-sectional-session-router

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - "research/candidate-easychart/market_v10.py"
      - "research/candidate-easychart/screen_v10.py"
      - "research/candidate-easychart/tests/test_market_v10.py"
      - ".github/workflows/candidate-easychart-v10.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v10-cross-sectional-session-router
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  development-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v10-development
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and cross-sectional contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          exec > >(tee "$ROOT/verification.log") 2>&1
          smc4 doctor
          python -m compileall -q research/candidate-easychart
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v

      - name: Route delayed session traps by peer auction state
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/screen.log") 2>&1
          common=(
            --start 2024-02-01
            --end 2024-02-28
            --warmup-days 5
            --cache "$CACHE"
            --signal-minutes 5
            --accepted-break-widths 1.0
            --cost-profile role
            --disable-fakeout
          )
          leader="PRIOR_DAY_NY,FUNDING_16_00,FUNDING_08_16,LONDON_NY"
          prior="PRIOR_DAY_NY"
          funding="FUNDING_16_00,FUNDING_08_16"

          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$leader" --cross-state isolated \
            --output "$ROOT/leader-isolated"
          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$leader" --cross-state broad \
            --output "$ROOT/leader-broad"
          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$leader" --cross-state both \
            --output "$ROOT/leader-both"

          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$prior" --cross-state isolated \
            --output "$ROOT/prior-isolated"
          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$prior" --cross-state broad \
            --output "$ROOT/prior-broad"
          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$funding" --cross-state isolated \
            --output "$ROOT/funding-isolated"
          python research/candidate-easychart/screen_v10.py "${common[@]}" \
            --families "$funding" --cross-state broad \
            --output "$ROOT/funding-broad"

          python research/candidate-easychart/screen_v10.py \
            --start 2024-02-01 --end 2024-02-28 --warmup-days 5 \
            --cache "$CACHE" --signal-minutes 5 --accepted-break-widths 1.0 \
            --cost-profile taker --disable-fakeout \
            --families "$leader" --cross-state both \
            --output "$ROOT/leader-both-taker"

          variants=(
            leader-isolated leader-broad leader-both
            prior-isolated prior-broad
            funding-isolated funding-broad
            leader-both-taker
          )
          python research/candidate-easychart/compare_v7.py \
            --root "$ROOT" --variants "${variants[@]}"

      - name: Verify evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/comparison.json" >/dev/null
          for variant in \
            leader-isolated leader-broad leader-both prior-isolated prior-broad \
            funding-isolated funding-broad leader-both-taker; do
            test -s "$ROOT/$variant/metrics.json"
            test -s "$ROOT/$variant/run.json"
            test -e "$ROOT/$variant/setups.csv"
            test -e "$ROOT/$variant/trades.csv"
            test -e "$ROOT/$variant/equity.csv"
            test -e "$ROOT/$variant/scenario_events.jsonl"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v10-development-${{ github.sha }}
          path: artifacts/candidate-easychart-v10-development/**
          if-no-files-found: warn
          retention-days: 90
