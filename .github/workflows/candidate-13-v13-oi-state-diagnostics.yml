name: Candidate 13 V13 causal OI-state diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/candidate-13
    paths:
      - research/candidate-13/v13_v4_trade_events.json
      - research/candidate-13/oi_inventory_state_diagnostics.py
      - research/candidate-13/oi_inventory_state_diagnostics_v2.py
      - research/candidate-13/oi_inventory_state_diagnostics_v3.py
      - .github/workflows/candidate-13-v13-oi-state-diagnostics.yml

permissions:
  contents: write
  packages: read

concurrency:
  group: candidate-13-v13-oi-state-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify common research environment and implementation
        run: |
          set -euo pipefail
          smc4 doctor
          python -m py_compile \
            research/candidate-13/oi_inventory_state_diagnostics.py \
            research/candidate-13/oi_inventory_state_diagnostics_v2.py \
            research/candidate-13/oi_inventory_state_diagnostics_v3.py
          python -m json.tool research/candidate-13/v13_v4_trade_events.json >/dev/null
      - name: Run checksum-verified causal OI diagnostic
        run: |
          set -euo pipefail
          python research/candidate-13/oi_inventory_state_diagnostics_v3.py \
            --events research/candidate-13/v13_v4_trade_events.json \
            --cache /tmp/candidate13-v13-oi-cache \
            --output-json research/candidate-13/v13-oi-state-diagnostics.json \
            --output-md research/candidate-13/V13_OI_STATE_DIAGNOSTICS.md \
            --evidence-json research/candidate-13/v13-oi-raw-evidence.json \
            2>&1 | tee research/candidate-13/V13_OI_STATE_DIAGNOSTIC_RUN.log
      - name: Verify evidence products and row accounting
        run: |
          set -euo pipefail
          python -m json.tool research/candidate-13/v13-oi-state-diagnostics.json >/dev/null
          python -m json.tool research/candidate-13/v13-oi-raw-evidence.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/candidate-13/v13-oi-state-diagnostics.json').read_text())
          policy = result['preexisting_policy_counterfactual']
          assert policy['retained_trades'] + policy['rejected_trades'] == result['coverage']['trades']
          assert len(set(policy['retained_row_keys'] + policy['rejected_row_keys'])) == result['coverage']['trades']
          PY
          test -s research/candidate-13/V13_OI_STATE_DIAGNOSTICS.md
          test -s research/candidate-13/V13_OI_STATE_DIAGNOSTIC_RUN.log
      - name: Persist commit-scoped diagnostic evidence
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name candidate-13-bot
          git config --global user.email candidate-13-bot@users.noreply.github.com
          git add \
            research/candidate-13/v13-oi-state-diagnostics.json \
            research/candidate-13/v13-oi-raw-evidence.json \
            research/candidate-13/V13_OI_STATE_DIAGNOSTICS.md \
            research/candidate-13/V13_OI_STATE_DIAGNOSTIC_RUN.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "candidate-13 v13: record collision-free OI-state evidence [skip ci]"
          git fetch origin research/candidate-13
          test "$(git rev-parse origin/research/candidate-13)" = "$START_SHA"
          git push origin HEAD:research/candidate-13
