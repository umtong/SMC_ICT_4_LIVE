name: Candidate 1a two-sided source-auction smoke

on:
  workflow_dispatch:
  push:
    branches: ["research_candidate_1a"]
    paths:
      - ".github/workflows/research-candidate-1a-two-sided-smoke.yml"
      - "research/candidate-1a/two_sided_source_auction_harvest.py"

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_1a
      - run: |
          set -euo pipefail
          DEST=research_results/candidate_1a/two_sided_smoke
          mkdir -p "$DEST"
          cat > "$DEST/status.json" <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "head_sha": "${{ github.sha }}",
            "status": "RUNNING",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST/status.json"
          git commit -m "Track candidate 1a two-sided smoke ${{ github.run_id }} [skip ci]"
          git push origin HEAD:research_candidate_1a

  harvest:
    needs: announce
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: btc-2025-aug, start: 2025-08-01, end: 2025-08-02, symbols: "BTCUSDT"}
          - {period: all-2026-apr, start: 2026-04-01, end: 2026-04-02, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT"}
          - {period: all-2026-may, start: 2026-05-01, end: 2026-05-02, symbols: "BTCUSDT ETHUSDT SOLUSDT XRPUSDT"}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-1a:research/candidate-auction-episode-system:research/candidate-liquidity-auction-v6:research/candidate-liquidity-auction-v5:research/candidate-coherent-auction-system-v4:research/candidate-coherent-auction-system-v3:research/candidate-coherent-liquidity-policy-v2:research/candidate-coherent-liquidity-policy-v1:research/candidate-hierarchical-liquidity-bpr-v2:research/candidate-hierarchical-liquidity-bpr-v1:research/candidate-liquidity-displacement-v1:research/candidate-auction-dislocation-confluence-v1:research/candidate-derivatives-dislocation-v1:research/candidate-auction-episode-policy:research/candidate-auction-event-v2:research/candidate-direct-auction-policy:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      PERIOD: ${{ matrix.period }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      SYMBOLS: ${{ matrix.symbols }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_1a
      - run: |
          set -euo pipefail
          python research/candidate-1a/two_sided_source_auction_harvest.py \
            --start "$START" --end "$END" --warmup-days 45 \
            --symbols $SYMBOLS \
            --cache ".cache/candidate-1a-two-sided/$PERIOD" \
            --output "artifacts/candidate-1a-two-sided/$PERIOD"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-1a-two-sided-${{ matrix.period }}
          path: artifacts/candidate-1a-two-sided/${{ matrix.period }}/**
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: harvest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_candidate_1a
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-1a-two-sided-*
          path: artifacts/candidate-1a-two-sided
      - run: |
          set -euo pipefail
          DEST=research_results/candidate_1a/two_sided_smoke
          find "$DEST" -type f ! -name status.json -delete 2>/dev/null || true
          mkdir -p "$DEST"
          find artifacts/candidate-1a-two-sided -name summary.json -print0 | while IFS= read -r -d '' file; do
            period=$(basename "$(dirname "$file")")
            cp "$file" "$DEST/${period}.json"
          done
          cat > "$DEST/status.json" <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "head_sha": "${{ github.sha }}",
            "status": "COMPLETED",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record candidate 1a two-sided smoke [skip ci]"
          git push origin HEAD:research_candidate_1a
