name: candidate-02-v63-nautilustrader-first-week

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v63_*.py"
      - "research/candidate-02/v63_*.json"
      - ".candidate-02-v63/collect_first_week.py"
      - ".github/workflows/candidate-02-v63-first.yml"

permissions:
  contents: read
  actions: read

jobs:
  first-week-family-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - name: Checkout prospectively locked family
        uses: actions/checkout@v4

      - name: Download immutable historical feature matrix
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v48-first-week-ce89ac21360ae334900dcf969efab088a182681e
          path: inputs/v63-first-week
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31036754667"

      - name: Remove unrelated raw bars from source artifact
        run: rm -rf inputs/v63-first-week/.cache

      - name: Verify fixed runtime and prospective family lock
        run: |
          smc4 doctor
          python -m py_compile \
            research/candidate-02/v63_impact_state_core.py \
            research/candidate-02/v63_nt_backtest.py \
            .candidate-02-v63/collect_first_week.py
          python -m json.tool research/candidate-02/v63_impact_state_family_lock.json >/dev/null
          for file in \
            research/candidate-02/v63_absorbed_rotation_config.json \
            research/candidate-02/v63_liquidation_rotation_config.json \
            research/candidate-02/v63_accepted_discovery_config.json; do
            python -m json.tool "$file" >/dev/null
          done
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("research/candidate-02/v63_impact_state_family_lock.json").read_text())
          assert lock["status"] == "LOCKED_BEFORE_FIRST_WEEK_RAW_DATA_COLLECTION"
          assert lock["custom_backtest_engine"] is False
          assert lock["first_week"]["start_utc"] == "2025-02-03T00:00:00Z"
          assert lock["first_week"]["raw_data_status_at_lock"] == "NOT_COLLECTED_FOR_V63"
          assert float(lock["risk_fraction"]) == 0.03
          for path in (
              "research/candidate-02/v63_absorbed_rotation_config.json",
              "research/candidate-02/v63_liquidation_rotation_config.json",
              "research/candidate-02/v63_accepted_discovery_config.json",
          ):
              cfg = json.loads(Path(path).read_text())
              assert cfg["validation"]["first_week_start"] == "2025-02-03"
              assert float(cfg["risk"]["risk_fraction"]) == 0.03
              assert cfg["risk"]["maximum_notional_cap"] is None
              assert cfg["risk"]["score_risk_multiplier"] is None
          PY

      - name: Collect only the locked first BTC week
        run: python .candidate-02-v63/collect_first_week.py

      - name: Run each causal state in a fresh NautilusTrader process
        shell: bash
        run: |
          set -euo pipefail
          declare -A configs=(
            [absorbed]=research/candidate-02/v63_absorbed_rotation_config.json
            [liquidation]=research/candidate-02/v63_liquidation_rotation_config.json
            [accepted]=research/candidate-02/v63_accepted_discovery_config.json
          )
          for label in absorbed liquidation accepted; do
            output="artifacts/candidate-02-v63-${label}-first-week"
            mkdir -p "$output"
            set +e
            python research/candidate-02/v63_nt_backtest.py \
              --config "${configs[$label]}" \
              --input-root inputs/v63-first-week \
              --output "$output" \
              | tee "artifacts-v63-${label}-console.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$output/validation_exit_code.txt"
            if [[ "$status" != "0" && "$status" != "2" ]]; then
              exit "$status"
            fi
          done

      - name: Publish first-week decision matrix
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("# Candidate-02 v63 impact-state first BTC week")
          print("| Mode | Decision | Trades/day | Win rate | PF after cost | Growth/day | MDD |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for label in ("absorbed", "liquidation", "accepted"):
              path = Path(f"artifacts/candidate-02-v63-{label}-first-week/metrics.json")
              if not path.exists():
                  print(f"| {label} | implementation error | - | - | - | - | - |")
                  continue
              m = json.loads(path.read_text())
              print(
                  f"| {label} | {m['decision']} | {m['trades_per_day']:.3f} | "
                  f"{m['win_rate']:.2%} | {m['profit_factor_after_cost']:.3f} | "
                  f"{m['geometric_daily_growth_after_cost']:.3%} | "
                  f"{m['maximum_mark_to_market_drawdown']:.2%} |"
              )
          PY

      - name: Preserve raw data and NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v63-first-week-${{ github.sha }}
          path: |
            artifacts/candidate-02-v63-absorbed-first-week
            artifacts/candidate-02-v63-liquidation-first-week
            artifacts/candidate-02-v63-accepted-first-week
            artifacts-v63-absorbed-console.log
            artifacts-v63-liquidation-console.log
            artifacts-v63-accepted-console.log
            inputs/v63-first-week/artifacts/candidate-02-v63-first-week-data
          if-no-files-found: warn
          retention-days: 30
