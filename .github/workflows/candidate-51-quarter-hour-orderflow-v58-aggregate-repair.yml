name: candidate-51-quarter-hour-orderflow-v58-aggregate-repair

on:
  push:
    branches: ["research/candidate-51"]
    paths:
      - ".github/workflows/candidate-51-quarter-hour-orderflow-v58-aggregate-repair.yml"
      - "research/candidate-51/quarter_hour_v58_aggregate_repair.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: candidate-51-quarter-hour-orderflow-v58-aggregate-repair
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-51
          fetch-depth: 1
          sparse-checkout: |
            research/candidate-51
            pyproject.toml
            uv.lock
            src
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: 31420564534
          pattern: candidate-51-quarter-hour-v58-*
          path: downloaded
      - name: Aggregate completed fixed post-sample hypotheses
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded -name result.json -type f | wc -l | tr -d ' ')"
          test "$count" -eq 12
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv sync --locked
          python -m py_compile research/candidate-51/quarter_hour_v58_aggregate_repair.py
          output=artifacts/candidate-51/quarter-hour-v58
          uv run python research/candidate-51/quarter_hour_v58_aggregate_repair.py aggregate \
            --results-root downloaded --output "$output"
          test -s "$output/ANATOMY.json"
          test -s "$output/ANATOMY.md"
          test -s "$output/SUMMARY.csv"
          test -s "$output/EVENTS.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-51-quarter-hour-v58-anatomy-repaired
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/candidate-51/quarter-hour-v58/ANATOMY.json
            artifacts/candidate-51/quarter-hour-v58/ANATOMY.md
            artifacts/candidate-51/quarter-hour-v58/SUMMARY.csv
            artifacts/candidate-51/quarter-hour-v58/EVENTS.csv
      - name: Commit compact quarter-hour evidence
        shell: bash
        run: |
          set -euo pipefail
          source=artifacts/candidate-51/quarter-hour-v58
          destination=research/candidate-51/evidence/quarter-hour-v58
          mkdir -p "$destination"
          cp "$source/ANATOMY.json" "$destination/ANATOMY.json"
          cp "$source/ANATOMY.md" "$destination/ANATOMY.md"
          cp "$source/SUMMARY.csv" "$destination/SUMMARY.csv"
          cp "$source/EVENTS.csv" "$destination/EVENTS.csv"
          git config user.name candidate-51-research-bot
          git config user.email candidate-51-research-bot@users.noreply.github.com
          git add "$destination"
          git commit -m "candidate51: record quarter-hour order-flow anatomy"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/candidate-51 --depth=1
            if git rebase FETCH_HEAD && git push origin HEAD:research/candidate-51; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
