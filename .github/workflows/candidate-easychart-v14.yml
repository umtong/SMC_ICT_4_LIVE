name: candidate-easychart-v14-semantic-integration

on:
  push:
    branches: ["research/candidate-easychart"]
    paths:
      - "research/candidate-easychart/screen_v14.py"
      - "research/candidate-easychart/market_v12.py"
      - "research/candidate-easychart/screen_v13.py"
      - "research/candidate-easychart/trade_semantic_audit_safe.py"
      - "research/candidate-easychart/compare_v14.py"
      - "research/candidate-easychart/source_footprints.py"
      - "research/candidate-easychart/footprint_episode_audit.py"
      - "research/candidate-easychart/tests/test_source_footprints.py"
      - "research/candidate-easychart/EXPERIMENT_COVERAGE.json"
      - ".github/workflows/candidate-easychart-v14.yml"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-v14-semantic-integration
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  compare-generic-and-source-shaped:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart
      PYTHONUNBUFFERED: "1"
      ROOT: artifacts/candidate-easychart-v14
      CACHE: .cache/candidate-easychart
    steps:
      - uses: actions/checkout@v4
      - name: Verify implementation contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CACHE"
          exec > >(tee "$ROOT/verification.log") 2>&1
          smc4 doctor
          python -m compileall -q research/candidate-easychart
          python -m unittest discover -s research/candidate-easychart/tests -p 'test_*.py' -v
      - name: Run generic and integrated semantics on the same week
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/screen.log") 2>&1
          leader="PRIOR_DAY_NY,FUNDING_16_00,FUNDING_08_16,LONDON_NY"
          common=(--start 2024-02-19 --end 2024-02-25 --warmup-days 5 --cache "$CACHE" --signal-minutes 5 --accepted-break-widths 1.0 --cost-profile role --disable-fakeout --families "$leader" --cross-state isolated)
          python research/candidate-easychart/screen_v10.py "${common[@]}" --output "$ROOT/v10-generic"
          python research/candidate-easychart/screen_v14.py "${common[@]}" --output "$ROOT/v14-integrated"
          python research/candidate-easychart/trade_semantic_audit_safe.py --run-dir "$ROOT/v10-generic" --start 2024-02-19 --end 2024-02-25 --cache "$CACHE" --output "$ROOT/audit-v10" --coverage research/candidate-easychart/EXPERIMENT_COVERAGE.json
          python research/candidate-easychart/trade_semantic_audit_safe.py --run-dir "$ROOT/v14-integrated" --start 2024-02-19 --end 2024-02-25 --cache "$CACHE" --output "$ROOT/audit-v14" --coverage research/candidate-easychart/EXPERIMENT_COVERAGE.json
      - name: Audit OB and FVG evidence inside every W/M event
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$ROOT/footprint-audit.log") 2>&1
          python research/candidate-easychart/footprint_episode_audit.py \
            --run-dir "$ROOT/v14-integrated" \
            --start 2024-02-19 --end 2024-02-25 \
            --cache "$CACHE" --output "$ROOT/footprint-audit"
      - name: Compare opportunity survival and concentration
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-easychart/compare_v14.py \
            --root "$ROOT" --output "$ROOT/comparison.json"
      - name: Verify evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/comparison.json" >/dev/null
          python -m json.tool "$ROOT/footprint-audit/footprint_summary.json" >/dev/null
          for variant in v10-generic v14-integrated; do
            test -s "$ROOT/$variant/metrics.json"
            test -s "$ROOT/$variant/run.json"
            test -e "$ROOT/$variant/setups.csv"
            test -e "$ROOT/$variant/trades.csv"
          done
          test -s "$ROOT/v14-integrated/target_router_audit.csv"
          test -s "$ROOT/v14-integrated/target_router_audit.jsonl"
          test -s "$ROOT/footprint-audit/episode_footprint_audit.csv"
          test -s "$ROOT/footprint-audit/relevant_footprints.csv"
          test -s "$ROOT/footprint-audit/episode_footprint_casebook.jsonl"
          test -s "$ROOT/footprint-audit/relevant_footprints.jsonl"
          for audit in audit-v10 audit-v14; do
            test -s "$ROOT/$audit/audit_summary.json"
            test -s "$ROOT/$audit/setup_semantic_audit.csv"
            test -s "$ROOT/$audit/trade_path_audit.csv"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-easychart-v14-${{ github.sha }}
          path: artifacts/candidate-easychart-v14/**
          if-no-files-found: warn
          retention-days: 90
