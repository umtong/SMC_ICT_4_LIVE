name: candidate-08-shared-acceptance-screen-v2

on:
  push:
    branches: ["research/candidate-08"]
    paths:
      - "research/candidate-08/.run-shared-acceptance-screen-v2"

permissions:
  contents: write
  packages: read

jobs:
  routed-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      OUTPUT_DIR: research/candidate-08/evidence/shared-acceptance-screen-v2
      DATA_CACHE: /tmp/candidate-08-acceptance-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for routing decision
        id: route
        shell: bash
        run: |
          set -euo pipefail
          route_file=research/candidate-08/evidence/shared-acceptance-routing-v1/route.txt
          for attempt in $(seq 1 180); do
            git fetch origin research/candidate-08
            git reset --hard origin/research/candidate-08
            if [[ -f "$route_file" ]]; then
              break
            fi
            sleep 15
          done
          route=$(cat "$route_file" 2>/dev/null || printf 'NO_ROUTE')
          printf 'route=%s\n' "$route" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$route"

      - name: Restore composite verified data cache
        if: steps.route.outputs.route == 'RUN_REMAINING_FIXED_WEEKS'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/candidate-08-acceptance-data
          key: candidate-08-shared-acceptance-screen-v2-${{ github.sha }}
          restore-keys: |
            candidate-08-shared-acceptance-first-v1-
            candidate-08-aggtrade-acceptance-

      - name: Run unchanged second and third fixed weeks
        if: steps.route.outputs.route == 'RUN_REMAINING_FIXED_WEEKS'
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          set +e
          {
            set -euo pipefail
            smc4 doctor
            python research/candidate-08/test_shared_acceptance_v1.py -v
            python - <<'PY'
            import json
            from pathlib import Path
            base = json.loads(Path("research/candidate-08/config_aggtrade_acceptance_shared.json").read_text())
            root = Path("research/candidate-08/evidence/shared-acceptance-screen-v2")
            for window in base["suites"]["screen"][1:]:
                scoped = json.loads(json.dumps(base))
                scoped["suites"]["first"] = [window]
                (root / f"config-{window['name']}.json").write_text(
                    json.dumps(scoped, indent=2, sort_keys=True) + "\n",
                    encoding="utf-8",
                )
            PY
            mkdir -p "$OUTPUT_DIR/screen-01"
            cp -a research/candidate-08/evidence/shared-acceptance-first-v1/. "$OUTPUT_DIR/screen-01/"
            python research/candidate-08/run_shared_acceptance_first_v1.py \
              --config "$OUTPUT_DIR/config-screen-02.json" \
              --output "$OUTPUT_DIR/screen-02" \
              --data-cache "$DATA_CACHE"
            python research/candidate-08/run_shared_acceptance_first_v1.py \
              --config "$OUTPUT_DIR/config-screen-03.json" \
              --output "$OUTPUT_DIR/screen-03" \
              --data-cache "$DATA_CACHE"
            python - <<'PY'
            import json
            from math import exp, log
            from pathlib import Path
            import re
            import pandas as pd

            root = Path("research/candidate-08/evidence/shared-acceptance-screen-v2")
            names = ["screen-01", "screen-02", "screen-03"]
            metrics = [json.loads((root / name / "metrics.json").read_text()) for name in names]
            days = sum(float(item["calendar_days"]) for item in metrics)
            combined = exp(sum(log(float(item["nav_multiple"])) for item in metrics) / days) - 1.0
            closed = [int(item["position_metrics"]["closed_trades"]) for item in metrics]
            wins = sum(int(item["position_metrics"]["wins"]) for item in metrics)
            total_closed = sum(closed)
            positive_trade_share = wins / total_closed if total_closed else 0.0

            def number(value):
                if value is None:
                    return None
                if isinstance(value, (int, float)):
                    return float(value)
                match = re.search(r"[-+]?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?", str(value).replace(",", ""))
                return float(match.group()) if match else None

            positive_pnls = []
            for name in names:
                path = root / name / "positions.csv"
                if not path.exists():
                    continue
                frame = pd.read_csv(path)
                candidates = [column for column in frame.columns if column.lower() in {"realized_pnl", "pnl", "realized_return"}]
                for column in candidates[:1]:
                    for raw in frame[column].tolist():
                        value = number(raw)
                        if value is not None and value > 0:
                            positive_pnls.append(value)
            positive_total = sum(positive_pnls)
            maximum_single_positive_share = max(positive_pnls) / positive_total if positive_total else 0.0
            checks = {
                "minimum_closed_trades_each_week": all(value >= 3 for value in closed),
                "all_windows_cost_after_positive": all(float(item["total_return"]) > 0 for item in metrics),
                "minimum_positive_trade_share": positive_trade_share >= 0.45,
                "maximum_single_positive_pnl_share": maximum_single_positive_share <= 0.50,
                "combined_daily_geometric_growth": combined >= 0.01,
                "no_execution_failures": all(int(item["execution_failures"]) == 0 for item in metrics),
                "no_residual_exposure": all(
                    int(item["open_positions_after_run"]) == 0
                    and int(item["open_orders_after_run"]) == 0
                    for item in metrics
                ),
                "complete_multiasset_timestamps": all(
                    int(item["incomplete_multiasset_timestamps"]) == 0 for item in metrics
                ),
                "no_unexpected_or_liquidation_closes": all(
                    int(item["unexpected_or_liquidation_closes"]) == 0 for item in metrics
                ),
            }
            summary = {
                "candidate": "candidate-08-aggtrade-acceptance-nautilus",
                "suite": "screen",
                "engine": "NautilusTrader",
                "combined_calendar_days": days,
                "combined_daily_geometric_growth": combined,
                "goal_daily_geometric_growth": 0.01,
                "goal_met": combined >= 0.01,
                "closed_trades_by_window": closed,
                "total_closed_trades": total_closed,
                "positive_trade_share": positive_trade_share,
                "positive_pnls_observed": positive_pnls,
                "maximum_single_positive_pnl_share": maximum_single_positive_share,
                "gate_checks": checks,
                "gate_passed": all(checks.values()),
                "window_results": [
                    {
                        "name": item["window"]["name"],
                        "signals": item["signals_in_window"],
                        "closed_trades": item["position_metrics"]["closed_trades"],
                        "wins": item["position_metrics"]["wins"],
                        "win_rate": item["position_metrics"]["win_rate"],
                        "final_nav_usdt": item["final_nav_usdt"],
                        "total_return": item["total_return"],
                        "daily_geometric_growth": item["daily_geometric_growth"],
                        "maximum_realized_equity_drawdown": item["maximum_realized_equity_drawdown"],
                    }
                    for item in metrics
                ],
            }
            (root / "suite_metrics.json").write_text(
                json.dumps(summary, indent=2, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            print(json.dumps(summary, indent=2, sort_keys=True))
            PY
          } 2>&1 | tee "$OUTPUT_DIR/runner.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUTPUT_DIR/runner_exit_status.txt"

      - name: Record non-applicable route
        if: steps.route.outputs.route != 'RUN_REMAINING_FIXED_WEEKS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python - <<'PY'
          import json
          from pathlib import Path
          route = Path("research/candidate-08/evidence/shared-acceptance-routing-v1/route.txt")
          value = route.read_text().strip() if route.exists() else "NO_ROUTE"
          Path("research/candidate-08/evidence/shared-acceptance-screen-v2/screen_not_run.json").write_text(
              json.dumps({
                  "route": value,
                  "reason": "Remaining weeks are forbidden unless the actual first-week Nautilus gate passes.",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          printf '0\n' > "$OUTPUT_DIR/runner_exit_status.txt"

      - name: Commit routed screen evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin research/candidate-08
          rm -f research/candidate-08/.run-shared-acceptance-screen-v2
          git add "$OUTPUT_DIR" research/candidate-08/.run-shared-acceptance-screen-v2
          git commit -m "candidate-08: record routed shared acceptance screen" || true
          git push origin HEAD:research/candidate-08

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: candidate-08-shared-acceptance-screen-v2-${{ github.run_id }}
          path: research/candidate-08/evidence/shared-acceptance-screen-v2
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve verified data cache
        if: steps.route.outputs.route == 'RUN_REMAINING_FIXED_WEEKS'
        uses: actions/cache/save@v4
        with:
          path: /tmp/candidate-08-acceptance-data
          key: candidate-08-shared-acceptance-screen-v2-${{ github.sha }}

      - name: Return runner status
        if: ${{ always() }}
        shell: bash
        run: |
          status=$(cat "$OUTPUT_DIR/runner_exit_status.txt" 2>/dev/null || printf '1')
          exit "$status"
