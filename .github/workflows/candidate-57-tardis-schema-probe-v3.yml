name: candidate-57-tardis-schema-probe-v3

on:
  workflow_dispatch:
  push:
    branches: [research/candidate-57]
    paths: [.github/workflows/candidate-57-tardis-schema-probe-v3.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
      - name: Resolve exchange metadata and sample URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/c57-tardis-schema-v3
          python - <<'PY' | tee artifacts/c57-tardis-schema-v3/console.log
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, urllib.request
          from pathlib import Path

          details_url='https://api.tardis.dev/v1/exchanges/binance-futures'
          with urllib.request.urlopen(urllib.request.Request(details_url,headers={'User-Agent':'candidate-57-research'}),timeout=60) as r:
              details=json.load(r)
          datasets=details.get('datasets') or {}
          symbols=datasets.get('symbols') or []
          wanted={str(x.get('id')):x for x in symbols if str(x.get('id')) in {'BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'}}

          dates=('2024/04/01','2024/07/01','2024/10/01','2025/01/01','2025/04/01','2025/07/01')
          dtypes=('book_ticker','quotes','trades','incremental_book_L2','derivative_ticker')
          tests=[]
          for sym in ('BTCUSDT','SOLUSDT'):
              for date in dates:
                  for dtype in dtypes:
                      tests.append((sym,date,dtype,f'https://datasets.tardis.dev/v1/binance-futures/{dtype}/{date}/{sym}.csv.gz'))

          def probe(item):
              sym,date,dtype,url=item; out={'symbol':sym,'date':date,'data_type':dtype,'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'candidate-57-research','Range':'bytes=0-0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      out.update(status=int(getattr(r,'status',200)),content_length=r.headers.get('Content-Length'),content_range=r.headers.get('Content-Range'),content_type=r.headers.get('Content-Type'),etag=r.headers.get('ETag'))
                      out['read_bytes']=len(r.read(1))
              except Exception as exc:
                  out['error']=f'{type(exc).__name__}: {exc}'
              return out

          rows=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              futures=[ex.submit(probe,x) for x in tests]
              for f in as_completed(futures): rows.append(f.result())
          rows.sort(key=lambda x:(x['symbol'],x['date'],x['data_type']))
          payload={
              'study':'Candidate-57 Tardis schema and sample URL probe v3',
              'exchange_dataset_data_types':datasets.get('dataTypes'),
              'wanted_symbol_metadata':wanted,
              'rows':rows,
          }
          Path('artifacts/c57-tardis-schema-v3/result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-57-tardis-schema-probe-v3-${{ github.sha }}
          path: artifacts/c57-tardis-schema-v3/**
          retention-days: 30
