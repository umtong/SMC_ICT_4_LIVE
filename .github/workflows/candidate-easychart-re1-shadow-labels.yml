name: candidate-easychart-re1-shadow-labels
on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths: ["research/candidate-easychart_re1/.shadow_labels_dispatch_marker"]
  workflow_dispatch:
concurrency: {group: candidate-easychart-re1-shadow-labels, cancel-in-progress: true}
permissions: {contents: read, packages: read}
jobs:
  label:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: dev-february-2025-short, start: 2025-02-01, end: 2025-02-10}
          - {period: dev-february-2026, start: 2026-02-01, end: 2026-02-14}
          - {period: guard-may-2024, start: 2024-05-01, end: 2024-05-14}
          - {period: guard-november-2025, start: 2025-11-01, end: 2025-11-14}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/shadow-labels/${{ matrix.period }}
      OUT: artifacts/shadow-labels/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile labeler and policy
        run: python -m py_compile research/candidate-easychart_re1/execution_re1_shadow_labels.py research/candidate-easychart_re1/easychart_re1_state_policy.py research/candidate-easychart_re1/run_mtf_backtest_re1_shadow_labels.py
      - name: Construction smoke
        run: |
          python - <<'PY'
          from execution_re1_shadow_labels import EasyChartRE1ShadowLabelStrategy
          assert EasyChartRE1ShadowLabelStrategy.__name__.endswith("ShadowLabelStrategy")
          PY
      - name: Run account and counterfactual labels
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_shadow_labels.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --warmup-days 14 --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT --cache "$CACHE" --output "$OUT" --fee-profile usd_m_vip0
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-labels-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/shadow-labels/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
