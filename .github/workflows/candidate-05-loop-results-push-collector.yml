name: candidate-05-loop-results-push-collector

on:
  push:
    branches: ["research/candidate-05"]
    paths:
      - ".github/workflows/candidate-05-loop-results-push-collector.yml"
      - "research/candidate-05/loop_results/refresh.txt"
  workflow_dispatch:

concurrency:
  group: candidate-05-loop-results-push-collector
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: research/candidate-05/loop_results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-05
          fetch-depth: 0

      - name: Query completed runs and collect immutable decision artifacts
        shell: bash
        run: |
          set -euo pipefail
          python research/candidate-05/collect_loop_results.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch research/candidate-05 \
            --scratch /tmp/candidate-05-loop-artifacts \
            --report-dir "$REPORT_DIR"

      - name: Commit current evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$REPORT_DIR"; then
            echo "No report change"
            exit 0
          fi
          git config user.name "candidate-05-loop-bot"
          git config user.email "candidate-05-loop-bot@users.noreply.github.com"
          git add "$REPORT_DIR"
          git commit -m "candidate-05: refresh loop evidence snapshot"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:research/candidate-05; then
              exit 0
            fi
            git pull --rebase origin research/candidate-05
            sleep $((attempt * 2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-05-loop-results-${{ github.sha }}
          path: research/candidate-05/loop_results/**
          if-no-files-found: error
          retention-days: 90
