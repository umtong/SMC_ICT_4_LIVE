name: ml1-fix-local-source-count

on:
  push:
    branches: ["research_ML1"]
    paths:
      - ".github/workflows/ml1-fix-local-source-count.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_ML1
          fetch-depth: 0

      - name: Replace repository-wide rule count with plan-local structures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("research/candidate-easychart_ml1/ml1_features.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    higher_kind = _token(getattr(plan, "higher_zone_kind", ""))\n    lower_kind = _token(getattr(plan, "lower_zone_kind", ""))\n\n    features.update(\n'''
          replacement = '''    higher_kind = _token(getattr(plan, "higher_zone_kind", ""))\n    lower_kind = _token(getattr(plan, "lower_zone_kind", ""))\n    local_structure_ids = {\n        str(value)\n        for value in (\n            getattr(plan, "higher_zone_id", ""),\n            getattr(plan, "lower_zone_id", ""),\n            getattr(plan, "trigger_zone_id", ""),\n            getattr(plan, "target_zone_id", ""),\n        )\n        if value not in (None, "")\n    }\n\n    features.update(\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one local-structure anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement)
          old = '''            "source_rule_count_log": _safe_log1p(_finite(getattr(plan, "source_rule_count", 0.0))),\n'''
          new = '''            # Several plans carry the repository-wide provenance catalogue.\n            # Its length is a code-version fingerprint, not trade confluence.\n            # Count only distinct structures actually used by this frozen plan.\n            "source_rule_count_log": _safe_log1p(len(local_structure_ids)),\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one source count assignment, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("research/candidate-easychart_ml1/tests/test_ml1_features.py")
          test = test_path.read_text(encoding="utf-8")
          anchor = '''        target_zone_kind="SWING_HIGH",\n'''
          replacement = '''        target_zone_kind="SWING_HIGH",\n        higher_zone_id="H",\n        lower_zone_id="L",\n        trigger_zone_id="H",\n        target_zone_id="T",\n'''
          if test.count(anchor) != 1:
              raise SystemExit("plan ID anchor not found exactly once")
          test = test.replace(anchor, replacement)
          tail = '    assert features["mechanism_liquidity_sweep"] == 0.0\n'
          addition = tail + '    assert abs(features["source_rule_count_log"] - 1.3862943611198906) < 1e-12\n'
          if test.count(tail) != 1:
              raise SystemExit("source count assertion anchor not found exactly once")
          test_path.write_text(test.replace(tail, addition), encoding="utf-8")
          PY

          python -m py_compile \
            research/candidate-easychart_ml1/ml1_features.py \
            research/candidate-easychart_ml1/tests/test_ml1_features.py

          PYTHONPATH=research/candidate-easychart_ml1 python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("research/candidate-easychart_ml1/tests/test_ml1_features.py")
          spec = importlib.util.spec_from_file_location("test_ml1_features", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.test_feature_schema_has_no_symbol_identity()
          module.test_prior_only_feature_book_and_exact_schema()
          PY

      - name: Commit the correction
        run: |
          git config user.name "umtong"
          git config user.email "dddgjj03@gmail.com"
          git add \
            research/candidate-easychart_ml1/ml1_features.py \
            research/candidate-easychart_ml1/tests/test_ml1_features.py
          git diff --cached --check
          git commit -m "fix(ml1): count only structures used by each plan"
          git push origin HEAD:research_ML1
