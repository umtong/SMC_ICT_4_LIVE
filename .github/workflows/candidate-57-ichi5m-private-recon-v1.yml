name: candidate-57-ichi5m-private-recon-v1

on:
  push:
    branches: ["research/candidate-57"]
    paths:
      - ".github/workflows/candidate-57-ichi5m-private-recon-v1.yml"
      - "research/candidate-57/ICHI5M_PRIVATE_RECON_V1_FREEZE.md"
      - "research/candidate-57/router_ichi5m_private_recon_v1.py"
      - "research/candidate-57/router_ichi5m_private_runtime.py"
      - "research/candidate-57/strategy_ichi5m_private_recon_v1.py"
      - "research/candidate-57/ichi5m_private_recon_v1_campaign.py"
      - "research/candidate-57/trade_ledger_forensics.py"
      - "research/candidate-51/router_picasso.py"
      - "research/candidate-51/strategy_picasso.py"
      - "research/candidate-51/launch_kline_only.py"
      - "research/candidate-51/kline_only_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-57-ichi5m-private-recon-v1
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/candidate-57
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble reconstruction on reused project execution
        shell: bash
        run: |
          set -euo pipefail
          test -f research/candidate-57/ICHI5M_PRIVATE_RECON_V1_FREEZE.md
          cp research/candidate-51/launch_kline_only.py research/candidate-51/launch.py
          cp research/candidate-57/router_ichi5m_private_recon_v1.py \
            research/candidate-51/router_ichi5m_private_impl.py
          cp research/candidate-57/router_ichi5m_private_runtime.py \
            research/candidate-51/router.py
          cp research/candidate-57/strategy_ichi5m_private_recon_v1.py \
            research/candidate-51/strategy.py
          python -m compileall -q \
            research/candidate-51/launch.py \
            research/candidate-51/kline_only_inputs.py \
            research/candidate-51/router.py \
            research/candidate-51/router_ichi5m_private_impl.py \
            research/candidate-51/router_picasso.py \
            research/candidate-51/strategy.py \
            research/candidate-51/strategy_picasso.py \
            research/candidate-57/ichi5m_private_recon_v1_campaign.py \
            research/candidate-57/trade_ledger_forensics.py

      - name: Install locked environment and prove causal reconstruction contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==0.11.25"
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          PYTHONPATH=research/candidate-51 uv run python - <<'PY'
          import inspect
          from router import RouteConfig, _arrays, _geometry, _signal_at
          from strategy import Candidate35Config, Candidate35Strategy
          from strategy_picasso import Candidate35Strategy as ExecutionShell

          assert issubclass(Candidate35Strategy, ExecutionShell)
          required = {
              "ichi5_entry_mode",
              "ichi5_side_mode",
              "ichi5_trigger_mode",
              "ichi5_risk_mode",
              "ichi5_min_fan_gain",
              "ichi5_fan_shift_value",
              "ichi5_target_fraction",
              "ichi5_source_exit_mode",
          }
          fields = set(Candidate35Config.__struct_fields__)
          assert required.issubset(fields), required - fields
          arrays = inspect.getsource(_arrays)
          for token in (
              '"ema_close_12"',
              '"ema_close_24"',
              '"ema_close_48"',
              '"ema_close_96"',
              '"ema_open_48"',
              '"fan_magnitude"',
              '"senkou_a"',
              '"senkou_b"',
          ):
              assert token in arrays, token
          assert "chikou" not in arrays.lower()
          signal = inspect.getsource(_signal_at)
          for token in (
              '"anchor_cloud"',
              '"ordered_cloud"',
              '"fast_cloud"',
              '"ordered_no_cloud"',
          ):
              assert token in signal, token
          geometry = inspect.getsource(_geometry)
          assert '"source_fraction"' in geometry
          assert '"auction_structure"' in geometry
          management = inspect.getsource(Candidate35Strategy._source_exit_signal)
          assert "anchor_cross" in management and "fan_cross" in management
          assert callable(RouteConfig)
          print("private ichi5m reconstruction and one-slot execution contracts verified")
          PY

      - name: Run conditional reconstruction with full trade forensics
        id: campaign
        shell: bash
        run: |
          set +e
          mkdir -p .work/candidate-57-ichi5m-private-recon-v1-console
          set -o pipefail
          PYTHONPATH=research/candidate-51:research/candidate-57 \
            uv run python research/candidate-57/ichi5m_private_recon_v1_campaign.py \
            2>&1 | tee .work/candidate-57-ichi5m-private-recon-v1-console/console.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit compact reconstruction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore research/candidate-51/launch.py research/candidate-51/router.py research/candidate-51/strategy.py
          rm -f research/candidate-51/router_ichi5m_private_impl.py
          git config user.name "candidate-57-research-bot"
          git config user.email "candidate-57-research-bot@users.noreply.github.com"
          out=research/candidate-57/evidence/ichi5m-private-recon-v1
          if [[ -d "$out" ]]; then
            git add -f "$out"
            if ! git diff --cached --quiet; then
              git commit --no-gpg-sign -m "candidate57: persist private ichi5m reconstruction evidence"
              for attempt in 1 2 3 4 5; do
                git fetch origin research/candidate-57
                git rebase origin/research/candidate-57
                if git push origin HEAD:research/candidate-57; then
                  break
                fi
                sleep 2
              done
            fi
          fi

      - name: Upload complete reconstruction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-57-ichi5m-private-recon-v1
          path: |
            research/candidate-57/evidence/ichi5m-private-recon-v1
            .work/candidate-57-ichi5m-private-recon-v1-console/console.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mechanics and account validity only
        if: always()
        shell: bash
        run: |
          status="${{ steps.campaign.outputs.status }}"
          if [[ -z "$status" || "$status" != "0" ]]; then
            echo "private ichi5m reconstruction failed mechanically; status=$status"
            exit "${status:-1}"
          fi
