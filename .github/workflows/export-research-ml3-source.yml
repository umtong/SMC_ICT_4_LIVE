name: export-research-ml3-source

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/export-research-ml3-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack and publish branch source chunks
        run: |
          set -euo pipefail
          rm -rf research/_source_export
          mkdir -p research/_source_export
          tar \
            --exclude=.git \
            --exclude='.cache' \
            --exclude='artifacts' \
            --exclude='research/_source_export' \
            -czf /tmp/research-ml3-source.tgz \
            research .github pyproject.toml pytest.ini Dockerfile 2>/dev/null || \
          tar \
            --exclude=.git \
            --exclude='.cache' \
            --exclude='artifacts' \
            --exclude='research/_source_export' \
            -czf /tmp/research-ml3-source.tgz \
            research .github
          split -b 600k -d -a 3 /tmp/research-ml3-source.tgz research/_source_export/source.tgz.part-
          sha256sum /tmp/research-ml3-source.tgz > research/_source_export/SHA256SUMS
          ls -l research/_source_export > research/_source_export/MANIFEST.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_source_export
          git commit -m "chore(research): publish temporary ML3 source chunks"
          git push origin HEAD:research_ML3
