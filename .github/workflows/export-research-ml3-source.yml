name: export-research-ml3-source

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/export-research-ml3-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack branch source
        run: |
          set -euo pipefail
          rm -rf research/_source_export
          mkdir -p research/_source_export
          tar \
            --exclude=.git \
            --exclude='.cache' \
            --exclude='artifacts' \
            --exclude='research/_source_export' \
            -czf /tmp/research-ml3-source.tgz \
            research .github pyproject.toml pytest.ini Dockerfile 2>/dev/null || \
          tar \
            --exclude=.git \
            --exclude='.cache' \
            --exclude='artifacts' \
            --exclude='research/_source_export' \
            -czf /tmp/research-ml3-source.tgz \
            research .github
          printf '%s\n' '${{ github.run_id }}' > research/_source_export/RUN_ID
          printf '%s\n' '${{ github.sha }}' > research/_source_export/SOURCE_SHA
          sha256sum /tmp/research-ml3-source.tgz > research/_source_export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: research-ml3-source-${{ github.sha }}
          path: /tmp/research-ml3-source.tgz
          if-no-files-found: error
          retention-days: 2
      - name: Publish export locator
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A research/_source_export
          git commit -m "chore(research): publish temporary ML3 export locator"
          git push origin HEAD:research_ML3
