name: apply-ml3-breakthrough-payload

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/export-research-ml3-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and apply intrinsic-auction payload
        run: |
          set -euo pipefail
          cat research/_apply_ml3_breakthrough/part* | base64 -d > /tmp/ml3-breakthrough-payload.tgz
          echo "4d3440fdc503cbcbda224d724e018a6a9f801b2a2c38d6cbf590652ed90fb928  /tmp/ml3-breakthrough-payload.tgz" | sha256sum -c -
          tar -xzf /tmp/ml3-breakthrough-payload.tgz
          rm -rf research/_apply_ml3_breakthrough research/_source_export
          rm -f .github/workflows/export-research-ml3-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "research(ml3): add intrinsic-time auction breakthrough"
          git push origin HEAD:research_ML3
