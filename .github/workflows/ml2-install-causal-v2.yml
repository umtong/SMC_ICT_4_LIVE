name: ml2-causal-v2-research

on:
  pull_request:
    branches: ["research_ML2"]
    paths:
      - "research/candidate-easychart_ml2/.causal_v2_pr_dispatch"
  workflow_dispatch:

concurrency:
  group: ml2-causal-v2-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: may-2024
            start: 2024-05-01
            end: 2024-05-31
          - name: feb-2025
            start: 2025-02-01
            end: 2025-02-28
          - name: aug-2025
            start: 2025-08-01
            end: 2025-08-31
          - name: nov-2025
            start: 2025-11-01
            end: 2025-11-30
          - name: feb-2026
            start: 2026-02-01
            end: 2026-02-28
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_ml2:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-ml2-causal-v2/${{ matrix.name }}
      OUT: artifacts/candidate-easychart-ml2-causal-v2/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct causal policy source
        shell: bash
        run: |
          set -euo pipefail
          cat .ml2-causal-v2-bootstrap/part00 .ml2-causal-v2-bootstrap/part01 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "41cced7050246e268c05307d1ab430cad84bb670463611d56b40e942072a4c7e  /tmp/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz -C .
          python -m py_compile \
            research/candidate-easychart_ml2/causal_auction_policy_v2.py \
            research/candidate-easychart_ml2/run_mtf_backtest_ml2_causal_auction_v2.py
      - name: Run one continuous four-symbol account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_ml2/run_mtf_backtest_ml2_causal_auction_v2.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days 30 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2 \
            2>&1 | tee "$OUT/backtest.log"
      - name: Preserve complete trade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-ml2-causal-v2-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/candidate-easychart-ml2-causal-v2/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 30
