name: candidate-04-v6-freeze-check

on:
  push:
    branches: ["research/candidate-04"]
    paths:
      - ".github/workflows/candidate-04-v6-freeze-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "uv==0.11.25"
      - name: Verify environment, record repository hashes and run causal tests
        run: |
          uv lock --check
          uv sync --locked
          uv run smc4 doctor
          echo "assembled_source=$(cat research/candidate-04/regime_transition_source/*.pyfrag | sha256sum | cut -d' ' -f1)"
          echo "loader=$(sha256sum research/candidate-04/regime_transition_candidate.py | cut -d' ' -f1)"
          echo "config=$(sha256sum research/candidate-04/regime_transition_config.json | cut -d' ' -f1)"
          echo "test=$(sha256sum research/candidate-04/tests/test_regime_transition_candidate.py | cut -d' ' -f1)"
          uv run python -m compileall -q research/candidate-04
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_regime_transition_candidate.py' -v
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_swing_displacement_candidate.py' -v
          uv run python -m unittest discover \
            -s research/candidate-04/tests \
            -p 'test_rich_features_v2.py' -v
