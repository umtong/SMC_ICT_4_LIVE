name: candidate-02-v67-nautilustrader-control

on:
  push:
    branches: ["research/candidate-02"]
    paths:
      - "research/candidate-02/v67_*.py"
      - "research/candidate-02/v67_*.json"
      - ".candidate-02-v67/**"
      - ".github/workflows/candidate-02-v67-control.yml"

permissions:
  contents: read
  actions: read

jobs:
  development-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      PYTHONPATH: /__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/src:/__w/SMC_ICT_4_LIVE/SMC_ICT_4_LIVE/research/candidate-02
      SMC4_PREBUILT_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable revealed v66 feature evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-02-v66-first-week-2f9098a37b57de57d314650075c6edc36b969667
          path: inputs/v67-source
          github-token: ${{ github.token }}
          repository: umtong/SMC_ICT_4_LIVE
          run-id: "31074428818"
      - name: Materialize exact causal features
        shell: bash
        run: |
          mkdir -p inputs/v67-control/candidate-02-v48-first-week
          find inputs/v67-source -name v48_features.npz -type f -exec cp '{}' inputs/v67-control/candidate-02-v48-first-week/v48_features.npz \;
          find inputs/v67-source -name columns.json -type f -exec cp '{}' inputs/v67-control/candidate-02-v48-first-week/columns.json \;
          test -f inputs/v67-control/candidate-02-v48-first-week/v48_features.npz
          test -f inputs/v67-control/candidate-02-v48-first-week/columns.json
      - name: Verify runtime and single confirmation control
        run: |
          smc4 doctor
          python -m py_compile research/candidate-02/v67_two_close_acceptance_core.py research/candidate-02/v67_nt_backtest.py .candidate-02-v67/collect_revealed_klines.py
          python -m json.tool research/candidate-02/v67_development_config.json >/dev/null
          python -m json.tool research/candidate-02/v67_control_lock.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path("research/candidate-02/v67_control_lock.json").read_text())
          cfg=json.loads(Path("research/candidate-02/v67_development_config.json").read_text())
          assert lock["status"]=="LOCKED_SINGLE_CONFIRMATION_CONTROL_BEFORE_NAUTILUSTRADER_RUN"
          assert lock["custom_backtest_engine"] is False
          assert cfg["scenario"]["acceptance_closes"]==2
          assert cfg["validation"]["first_week_start"]=="2024-10-28"
          assert float(cfg["risk"]["risk_fraction"])==0.03
          assert cfg["risk"]["maximum_notional_cap"] is None
          assert cfg["risk"]["score_risk_multiplier"] is None
          PY
      - name: Recollect revealed one-minute bars
        run: python .candidate-02-v67/collect_revealed_klines.py
      - name: Run v67 through NautilusTrader
        shell: bash
        run: |
          mkdir -p artifacts/candidate-02-v67-control
          set +e
          python research/candidate-02/v67_nt_backtest.py --config research/candidate-02/v67_development_config.json --input-root inputs/v67-control --output artifacts/candidate-02-v67-control | tee artifacts-v67-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/candidate-02-v67-control/validation_exit_code.txt
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
      - name: Preserve NautilusTrader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-02-v67-control-${{ github.sha }}
          path: |
            artifacts/candidate-02-v67-control
            artifacts-v67-console.log
          retention-days: 30
