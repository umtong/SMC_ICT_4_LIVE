name: candidate-02-v153-final-turn-two-state

on:
  push:
    branches: ["research/candidate-02"]
    paths: ["research/candidate-02/v153_trigger.json"]

permissions: {contents: write, packages: read, actions: read}
concurrency: {group: candidate-02-v153-final-turn-state, cancel-in-progress: false}

jobs:
  state:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      options: --user 0:0
    env: {SMC4_PREBUILT_ENV: "1", PYTHONUNBUFFERED: "1"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - name: Build final canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          smc4 doctor
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/candidate-02')
          path=root/'TURN2_STATUS.json'
          state=json.loads(path.read_text()) if path.exists() else {'candidate':'candidate-02-turn-two-canonical-state','engine':'NautilusTrader 1.230.0','custom_backtest_engine':False,'risk_fraction':0.03,'stages':{}}
          additions={
              'v150':('results/v150_holdout','artifacts-v150-decision.json'),
              'v152':('results/v152_long','artifacts-v152-decision.json'),
          }
          for name,(folder,filename) in additions.items():
              paths=sorted((root/folder).glob(f'*/{filename}'))
              if not paths:
                  state['stages'][name]={'status':'NO_COMMITTED_RESULT'}
                  continue
              obj=json.loads(paths[-1].read_text())
              compact={'path':str(paths[-1]),'status':obj.get('status')}
              for key in ('selected_family','selected_variant','stage','holdout_week_start','target_met','long_week_count','evaluation_days','long_target_met','long_summary','long_checks'):
                  if key in obj: compact[key]=obj[key]
              if 'metrics' in obj:
                  compact['metrics']={key:obj['metrics'].get(key) for key in ('trades','trades_per_day','win_rate','profit_factor_after_cost','geometric_daily_growth_after_cost','maximum_mark_to_market_drawdown','target_met')}
              state['stages'][name]=compact
          v152=state['stages'].get('v152',{}); v150=state['stages'].get('v150',{})
          state['project_target_met']=False
          if v152.get('status')=='LONG_BTC_PASS':
              state['status']='LONG_BTC_PASS_READY_FOR_CROSS_SYMBOL_TRANSFER'
              state['next_action']='LOCK_LOGIC_AND_TEST_ETH_SOL_XRP_WITH_GLOBAL_SINGLE_POSITION_ROUTER'
          elif v152.get('status') in {'LONG_BTC_REJECT','LONG_EXECUTION_INCOMPLETE'}:
              state['status']='LONG_BTC_REJECT'
              state['next_action']='DIAGNOSE_LONG_REGIME_FAILURE_WITHOUT_REUSING_HOLDOUTS'
          elif v150.get('status') in {'THIRD_PROSPECTIVE_PASS','SECOND_NEW_GENERATION_PASS'}:
              state['status']='PROSPECTIVE_SURVIVOR_AWAITING_REQUIRED_NEXT_GATE'
              state['next_action']='COMPLETE_REQUIRED_NEXT_UNTOUCHED_OR_LONG_GATE'
          elif any(value.get('status') in {'HOLDOUT_EXECUTION_ERROR','PROSPECTIVE_EXECUTION_ERROR','NO_COMMITTED_RESULT'} for key,value in state['stages'].items() if key in {'v146','v147','v148','v150','v152'}):
              state['status']='EXECUTION_OR_EVIDENCE_GAP'
              state['next_action']='FIX_EXECUTION_BEFORE_NEW_ALPHA_RESEARCH'
          else:
              state['status']='NO_SURVIVING_PROSPECTIVE_CANDIDATE'
              state['next_action']='REDESIGN_ALPHA_WITHOUT_REUSING_REVEALED_HOLDOUTS'
          path.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          lines=['# Candidate-02 Turn 2 Canonical State','',f"- Status: `{state['status']}`",f"- Next action: `{state['next_action']}`",f"- Project target certified: `{str(state['project_target_met']).lower()}`",'', 'All stage metrics and evidence paths are embedded in `TURN2_STATUS.json`.']
          (root/'TURN2_STATUS.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps({'status':state['status'],'next_action':state['next_action'],'v150':v150.get('status'),'v152':v152.get('status')},indent=2,sort_keys=True))
          PY
      - name: Commit final state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/candidate-02
          test "$(git rev-parse origin/research/candidate-02)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-02/TURN2_STATUS.json research/candidate-02/TURN2_STATUS.md
          git commit -m "research(candidate-02): finalize turn two canonical state"
          git push origin HEAD:research/candidate-02
