name: research-structural-auction-control-v3-smoke

on:
  workflow_dispatch:
  push:
    branches: ["research_structural_auction_control"]
    paths:
      - "research/candidate-skilled-auction-control-v1/structural_auction_control_v3.py"
      - "research/candidate-skilled-auction-control-v1/run_backtest_v3.py"
      - ".github/workflows/research-structural-auction-control-v3-smoke.yml"
      - ".dispatch-structural-auction-control-v3-smoke"

concurrency:
  group: research-structural-auction-control-v3-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-skilled-auction-control-v1:research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      CACHE: .cache/structural-auction-control-v3-smoke
      OUT: artifacts/structural-auction-control-v3-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research_structural_auction_control
          fetch-depth: 0
      - name: Compile and construct causal controller
        run: |
          set -euo pipefail
          python -m py_compile \
            research/candidate-skilled-auction-control-v1/structural_auction_control_v2.py \
            research/candidate-skilled-auction-control-v1/structural_auction_control_v2_strict.py \
            research/candidate-skilled-auction-control-v1/structural_auction_control_v3.py \
            research/candidate-skilled-auction-control-v1/run_backtest_v3.py
          python - <<'PY'
          from structural_auction_control_v3 import StructuralAuctionControlV3Bundle
          bundle = StructuralAuctionControlV3Bundle("BTCUSDT", 0.1, 1.0)
          assert len(bundle.sources) == 2
          PY
      - name: Run one actual continuous four-market account day
        run: |
          set -euo pipefail
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-skilled-auction-control-v1/run_backtest_v3.py \
            --start 2026-02-06 \
            --end 2026-02-07 \
            --warmup-days 14 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0 \
            --entry-slippage-ticks 2 \
            --stop-slippage-ticks 2
      - name: Upload raw v3 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-v3-smoke-${{ github.sha }}
          path: artifacts/structural-auction-control-v3-smoke/**
          if-no-files-found: warn
          retention-days: 30
      - name: Commit compact v3 smoke evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/structural-v3-smoke
          mkdir -p /tmp/structural-v3-smoke
          if [ -d "$OUT" ]; then
            python research/candidate-skilled-auction-control-v1/summarize_v2_evidence.py \
              --input "$OUT" --output /tmp/structural-v3-smoke
          else
            printf '{"error":"no output directory","run_id":%s}\n' "$GITHUB_RUN_ID" \
              > /tmp/structural-v3-smoke/manifest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin research_structural_auction_control
            git reset --hard origin/research_structural_auction_control
            target=research/candidate-skilled-auction-control-v1/evidence/v3-smoke
            rm -rf "$target"
            mkdir -p "$target"
            cp -a /tmp/structural-v3-smoke/. "$target/"
            printf '{"run_id":%s,"head_sha":"%s","created_at":"%s"}\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$target/run.json"
            git add "$target"
            git commit -m "Record structural v3 smoke $GITHUB_RUN_ID" || exit 0
            if git push origin HEAD:research_structural_auction_control; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
