name: patch-ml3-breakthrough-transition-audit

on:
  push:
    branches: ["research_ML3"]
    paths:
      - ".github/workflows/patch-ml3-breakthrough.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish patch run locator
        run: |
          set -euo pipefail
          mkdir -p research/_run_locators
          printf '%s\n' '${{ github.run_id }}' > research/_run_locators/ML3_PATCH_RUN_ID
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/_run_locators/ML3_PATCH_RUN_ID
          git commit -m "chore(research): publish ML3 patch run locator [skip ci]"
          git push origin HEAD:research_ML3

  patch:
    needs: locate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove duplicate reserved event field
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("research/candidate-easychart_ml3_breakthrough/intrinsic_auction.py")
          text = path.read_text(encoding="utf-8")
          old = "                timeframe_minutes=timeframe,\n                event_time_ns_source=swing.event_time_ns,\n"
          new = "                source_timeframe_minutes=timeframe,\n                event_time_ns_source=swing.event_time_ns,\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one transition-audit field, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile research/candidate-easychart_ml3_breakthrough/*.py research/candidate-easychart_ml3_breakthrough/tests/*.py
          PYTHONPATH=research/candidate-easychart_ml3_breakthrough:research/candidate-easychart-v3 python - <<'PY'
          import runpy
          from pathlib import Path
          total = 0
          for path in sorted(Path("research/candidate-easychart_ml3_breakthrough/tests").glob("test_*.py")):
              ns = runpy.run_path(str(path))
              for name, value in ns.items():
                  if name.startswith("test_") and callable(value):
                      value()
                      total += 1
          if total < 10:
              raise SystemExit(f"only {total} tests executed")
          print(f"executed {total} intrinsic-auction tests")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/candidate-easychart_ml3_breakthrough/intrinsic_auction.py
          git commit -m "fix(ml3): keep transition audit fields unambiguous"
          git push origin HEAD:research_ML3
