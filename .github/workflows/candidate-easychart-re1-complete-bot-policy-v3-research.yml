name: candidate-easychart-re1-complete-bot-policy-v3-research

on:
  push:
    branches: ["research/candidate-easychart_re1"]
    paths:
      - "research/candidate-easychart_re1/.complete_bot_policy_v3_dispatch_marker"
  workflow_dispatch:

concurrency:
  group: candidate-easychart-re1-complete-bot-policy-v3-research
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {period: may-2024-guard, start: 2024-05-01, end: 2024-05-14, warmup: 14, timeout: 90}
          - {period: february-2025-short, start: 2025-02-01, end: 2025-02-10, warmup: 14, timeout: 90}
          - {period: live-examples-2025-short, start: 2025-08-10, end: 2025-08-20, warmup: 14, timeout: 90}
          - {period: november-2025-guard, start: 2025-11-01, end: 2025-11-14, warmup: 14, timeout: 90}
          - {period: february-2026-guard, start: 2026-02-01, end: 2026-02-14, warmup: 14, timeout: 90}
          - {period: fresh-medium-2024-winter, start: 2024-12-01, end: 2025-01-31, warmup: 30, timeout: 180}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/umtong/smc-ict-4-live-research@sha256:8f4de8a2b2fa28c3f424d114969b1c07765206708f24613b86896ced67532469
      options: --user 0
    env:
      PYTHONPATH: research/candidate-easychart_re1:research/candidate-easychart-v5:research/candidate-easychart-v3
      PYTHONUNBUFFERED: "1"
      CACHE: .cache/candidate-easychart-re1-complete-bot-policy-v3/${{ matrix.period }}
      OUT: artifacts/candidate-easychart-re1-complete-bot-policy-v3/${{ matrix.period }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile the complete persistent-context policy
        run: |
          python -m py_compile \
            research/candidate-easychart_re1/easychart_re1_efficient_pullback.py \
            research/candidate-easychart_re1/easychart_re1_efficient_pullback_v2.py \
            research/candidate-easychart_re1/easychart_re1_efficient_pullback_final.py \
            research/candidate-easychart_re1/easychart_re1_macro_trend_pullback.py \
            research/candidate-easychart_re1/easychart_re1_complete_bot_policy.py \
            research/candidate-easychart_re1/easychart_re1_complete_bot_policy_v2.py \
            research/candidate-easychart_re1/easychart_re1_complete_bot_policy_v3.py \
            research/candidate-easychart_re1/run_mtf_backtest_re1_complete_bot_policy_v3.py
      - name: Construct all four symbol policies
        run: |
          python - <<'PY'
          from easychart_re1_complete_bot_policy_v3 import (
              EasyChartRE1CompleteBotPolicyV3Bundle,
              EasyChartRE1CompletePersistentStrategy,
          )
          for symbol, tick in (("BTCUSDT", 0.1), ("ETHUSDT", 0.01), ("SOLUSDT", 0.001), ("XRPUSDT", 0.0001)):
              bundle = EasyChartRE1CompleteBotPolicyV3Bundle(symbol, tick)
              assert bundle._fast_common_state is None
              assert bundle._persistent_snapshot is None
              assert bundle.efficient_pullback.micro_objectives.pivot_spans == (6,)
              assert bundle.macro_trend_pullback.micro_objectives.pivot_spans == (6,)
          assert callable(EasyChartRE1CompletePersistentStrategy._observe_common_factor)
          PY
      - name: Run one four-symbol continuous account
        run: |
          mkdir -p "$CACHE" "$OUT"
          python research/candidate-easychart_re1/run_mtf_backtest_re1_complete_bot_policy_v3.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --warmup-days "${{ matrix.warmup }}" \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT \
            --cache "$CACHE" \
            --output "$OUT" \
            --fee-profile usd_m_vip0
      - name: Preserve trades and continuous NAV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-easychart-re1-complete-bot-policy-v3-${{ matrix.period }}-${{ github.sha }}
          path: artifacts/candidate-easychart-re1-complete-bot-policy-v3/${{ matrix.period }}/**
          if-no-files-found: warn
          retention-days: 30
